# golangci-lint config — schema v2.
# Defaults + a small set of checks that catch real defects in this
# codebase (errcheck fired for us before; staticcheck catches shadowing,
# type-mismatch flags, etc.).
#
# Schema v2 — required by golangci-lint >= v2.0. Action v8 pins v2.4.0
# which is built with Go 1.25 and supports our go.mod's 'go 1.25.0'
# directive (v1.x was built with Go 1.23 and rejected the bump — see
# golangci/golangci-lint#5873).
version: "2"

# Disable default linters — explicit allow-list below.
linters:
  default: none
  enable:
    - errcheck       # unchecked errors — caught the Body.Close() bug
    - govet          # default, but explicit for visibility
    - ineffassign    # = instead of :=
    - staticcheck    # shadowing, unused receivers, type-mismatch, gosimple
    - unused         # unused params/vars/funcs
    # goconst is intentionally NOT enabled. Its "string appears 3+ times"
    # heuristic is non-deterministic across runs (different files flagged on
    # the same tree) and structural rather than defect-finding — promoting
    # measurement names, refkind strings, and content-type MIMEs to consts
    # flips the data-table structure (the literals ARE the canonical list)
    # without improving correctness. Stats: 50 findings on a green 1.26.6
    # base, none of which represent a real bug. Real defect-finders
    # (staticcheck, errcheck, gosec) are kept enabled.
    - misspell       # typo'd identifiers
    - nilerr         # `return nil` after assigning to err
    - errorlint      # fmt.Errorf must wrap with %w; ==/!= against errors → errors.Is
    - bodyclose      # unclosed *http.Response.Body on every request path
    - contextcheck   # ctx captured in goroutines, stored in structs, or detached without justification
    - depguard       # enforce the CLAUDE.md component-ownership import boundaries
    - forbidigo      # forbid specific call patterns — see settings.forbidigo below
    - gosec          # security defects — this box runs vmmd as root + drives jailer

  settings:
    # depguard mechanises the "Component ownership" table in CLAUDE.md: components
    # talk via Postgres rows + pg_notify or gRPC on unix sockets — never by reaching
    # directly into another owner's package. These rules are the compile-time
    # tripwire for that architecture (the prose alone decays).
    depguard:
      rules:
        # apid is control-plane only: it is the sole writer of customer-intent
        # rows and signals downstream via Postgres + pg_notify. It must never
        # reach into the VM / scheduler layer (CLAUDE.md: "apid must not call
        # vmmd").
        apid-control-plane-only:
          files:
            - "**/cmd/apid/**"
          deny:
            - pkg: github.com/onebox-faas/faas/pkg/fcvm
              desc: "apid is control-plane only; it must not touch the firecracker/jailer layer — record intent in Postgres and let schedd/vmmd react"
            - pkg: github.com/onebox-faas/faas/pkg/netns
              desc: "apid never manages host networking; that is vmmd's job"
            - pkg: github.com/onebox-faas/faas/pkg/sched
              desc: "apid does not schedule; it records intent and lets schedd react (spec §Component ownership)"
            - pkg: github.com/onebox-faas/faas/pkg/vmmdgrpc
              desc: "apid must not call vmmd (CLAUDE.md); communicate via Postgres + pg_notify"
            - pkg: github.com/onebox-faas/faas/pkg/scheddgrpc
              desc: "apid must not call schedd over gRPC; record intent in Postgres and let schedd react"
            - pkg: github.com/onebox-faas/faas/api/proto/onebox/faas/vmmd/v1
              desc: "apid must not speak vmmd's wire protocol (CLAUDE.md ownership)"
            - pkg: github.com/onebox-faas/faas/api/proto/onebox/faas/schedd/v1
              desc: "apid must not speak schedd's wire protocol; use Postgres + pg_notify"

        # The firecracker/jailer layer (pkg/fcvm) and host netns plumbing
        # (pkg/netns) are vmmd-owned (CLAUDE.md: "vmmd is the ONLY component that
        # touches firecracker/jailer"). The edge proxy, meter, CLI, and
        # image/build daemons must never import them directly — they drive VMs
        # through their owners.
        firecracker-jailer-vmmd-owned:
          files:
            - "**/cmd/gatewayd-internal/**"
            - "**/cmd/gatewayd-public/**"
            - "**/cmd/meterd/**"
            - "**/cmd/faas/**"
            - "**/cmd/imaged/**"
            - "**/cmd/builderd/**"
          deny:
            - pkg: github.com/onebox-faas/faas/pkg/fcvm
              desc: "only vmmd touches firecracker/jailer (CLAUDE.md ownership)"
            - pkg: github.com/onebox-faas/faas/pkg/netns
              desc: "only vmmd manages host network namespaces (CLAUDE.md ownership)"

        # DEPLOY-1 / ADR-075: pkg/vmmdmount wraps the unix.Mount(2) syscall
        # for parent-ref overlay mounts. Only vmmd is allowed to do mount
        # syscalls (CLAUDE.md: "vmmd is the ONLY root component"); imaged,
        # builderd, and the rest of the fleet route through the vmmd gRPC
        # service (MountOverlayParent / UmountOverlayParent). The depguard
        # rule is the compile-time tripwire: any new file that imports
        # pkg/vmmdmount from a non-vmmd package is a regression of the
        # Tier A7 PR-K → DEPLOY-1 boundary and gets caught in CI.
        vmmdmount-vmmd-only:
          files:
            - "!**/cmd/vmmd/**"
            - "!**/pkg/vmmdgrpc/**"
            - "!**/pkg/vmmdmount/**"
            - "!**/pkg/fcvm/**"
          deny:
            - pkg: github.com/onebox-faas/faas/pkg/vmmdmount
              desc: "DEPLOY-1 / ADR-075: pkg/vmmdmount (the unix.Mount(2) wrapper) is vmmd-only. Other daemons (imaged, builderd, ...) must route through pkg/vmmdgrpc — see MountOverlayParent RPC. If a new use case needs a mount path that vmmd cannot satisfy, add the RPC method instead of bypassing the boundary."

        # Same boundary, but for the gRPC vmmd client/server package. The
        # server-side (pkg/vmmdgrpc) is wired by cmd/vmmd. The client
        # surface is allowed to be imported by daemons that legitimately
        # talk to vmmd over gRPC (imaged, builderd, schedd, gatewayd) but
        # NOT by control-plane-only writers (apid, meterd, githubd) and
        # NOT by the CLI. CI is the tripwire.
        vmmdgrpc-not-for-control-plane:
          files:
            - "**/cmd/apid/**"
            - "**/cmd/meterd/**"
            - "**/cmd/githubd/**"
            - "**/cmd/faas/**"
          deny:
            - pkg: github.com/onebox-faas/faas/pkg/vmmdgrpc
              desc: "DEPLOY-1 / ADR-075: apid / meterd / githubd / faas CLI must not dial vmmd directly (CLAUDE.md ownership: 'vmmd is the ONLY component that touches firecracker/jailer'). Record intent in Postgres and let schedd or imaged react."

    # forbidigo: PR #101 closed the symlink-follow attack surface in
    # `faas deploy --tarball` by routing the customer-path open through
    # `openCustomerFile` (commands5.go:380). This rule makes that
    # discipline CI-enforced: any new os.Open call anywhere in the
    # tree is a tripwire — vmmd/imaged/builderd/etc. open paths
    # derived from vetted slot/instance ids and route through their
    # own vetted-id openers, so a bare os.Open there is a regression
    # too. Legitimate escape hatches:
    #
    #   - the body of openCustomerFile itself (//nolint:forbidigo
    #     os.Open on the next line), where the Lstat guard IS the
    #     security boundary
    #   - any future addition must either route through a vetted-id
    #     helper or carry a //nolint:forbidigo comment with a
    #     documented reason reviewed in the PR
    #
    # NOTE on local noise: golangci-lint 2.12.x (Homebrew default)
    # ships a default forbidigo rule banning fmt.Print*; the action
    # pins v2.4.0 which does NOT include that default. Local `make
    # lint` may report fmt.Print* findings that CI will not — these
    # are pre-existing on main and unrelated to this PR.
    forbidigo:
      # Don't analyze godoc — stdlib only, no test fixtures in docs.
      exclude-godoc-examples: false
      # Enable type-aware analysis so the `pkg:` field on a rule can
      # distinguish `os.Open` (the stdlib call) from an unrelated
      # method named Open on a different type.
      analyze-types: true
      forbid:
        - pattern: '^os\.Open$'
          msg: "do not open with bare os.Open — route customer paths through openCustomerFile (cmd/faas/commands5.go) so the symlink/non-regular guard fires before bytes leave the host; for vetted-id paths in daemons, use a vetted-id helper or add //nolint:forbidigo with a documented reason."
        # The pkg field constrains the rule to imports of stdlib os,
        # avoiding false positives on user-defined methods also named
        # `Open`. With analyze-types=true the analyzer matches the
        # selector against the imported package's full path.
        - pattern: '^Open$'
          pkg: '^os$'
          msg: "do not call os.Open directly — see the os.Open rule above for the rationale and escape hatch."
        # DEPLOY-1 / ADR-075: the unix.Mount(2) syscall (golang.org/x/sys/unix)
        # is the architectural boundary that PR-K and the pre-PR-K code
        # repeatedly broke. The one legitimate caller is pkg/vmmdmount —
        # every other site that does mount/umount syscalls must route
        # through vmmd's MountOverlayParent / UmountOverlayParent gRPC
        # methods instead. The pkg field constrains the rule to the
        # golang.org/x/sys/unix package (false-positive-proof against
        # user-defined Mount methods). Analyze-types makes the match
        # exact.
        - pattern: '^Mount$'
          pkg: '^golang\.org/x/sys/unix$'
          msg: "DEPLOY-1 / ADR-075: do not call unix.Mount directly. Only pkg/vmmdmount wraps this syscall; call vmmd via pkg/vmmdgrpc instead (MountOverlayParent RPC). pkg/vmmdmount's own MountOverlayParent is the only legitimate caller of unix.Mount."
        - pattern: '^Unmount$'
          pkg: '^golang\.org/x/sys/unix$'
          msg: "DEPLOY-1 / ADR-075: do not call unix.Unmount directly. Use pkg/vmmdmount.UmountOverlayParent from vmmd, or call vmmd via pkg/vmmdgrpc (UmountOverlayParent RPC)."
        # DEPLOY-1 / ADR-075: the architecture invariant is "vmmd is the
        # ONLY component that mounts filesystems" — not "vmmd is the only
        # component that calls unix.Mount(2)". Review of PR #652 (finding
        # M6) flagged that pkg/vmmdmount/overlay.go was switched from
        # unix.Mount to exec.Command("mount", ...) to gain cross-platform
        # portability; the depguard + unix.Mount-forbid above was no
        # longer sufficient to keep the boundary tight, because exec
        # invocation has no compile-time import trail. This rule closes
        # that hole: any os/exec.Command* call whose first non-context
        # arg is the literal "mount" or "umount" is a regression of the
        # boundary. Legitimate callers are explicitly allowlisted in
        # `linters.exclusions.rules` (below) — pkg/fcvm/** is the vmmd
        # VM owner that handles loopback mounts for the jailer;
        # pkg/vmmdmount/** owns the parent-ref overlay mount;
        # pkg/builderd/mount_helpers.go is the pre-PR-K test helper
        # that PR-K left behind (see comment in that file).
        #
        # The pattern matches the literal-string-arg shape that
        # `exec.Command[Context](ctx?, "mount", ...)`.
        - pattern: '^Command(Context)?\((ctx\s*context\.\w+\s*,\s*)?"(mount|umount)"'
          pkg: '^os/exec$'
          msg: "DEPLOY-1 / ADR-075: do not invoke the `mount`/`umount` binaries outside pkg/vmmdmount and pkg/fcvm (the two vmmd-owned mount owners). If a new daemon needs to mount, route through pkg/vmmdgrpc MountOverlayParent/UmountOverlayParent RPC. If a test fixture needs to mount, put it in pkg/builderd/mount_helpers.go (the existing builderd test helper) or add a //nolint:forbidigo with a documented reason."

    # gosec runs against a box where vmmd is root and drives jailer/firecracker
    # and builds guest rootfs images. The rule IDs below are structurally
    # inapplicable to that domain and each finding was reviewed by hand; keep the
    # list tight — every exclusion is a documented decision, and the ~30 rules
    # that DO matter here (hardcoded secrets, SQL injection, weak crypto, TLS
    # config, bind-all, etc.) stay active.
    #
    # NOTE: only rule IDs present in the pinned golangci-lint v2.12.2 gosec ruleset
    # are valid here — the action runs `config verify` (strict JSON-schema). The
    # experimental taint rules (G118/G122/G123/G124/G703/G704/G705/G706/G710) exist
    # in v2.12.2 but are listed as the high-false-positive set below; they fire on
    # idiomatic Go that has already been vetted by the call-site (e.g. struct
    # literals that set Secure/HttpOnly/SameSite on the lines after the literal,
    # filepath.Walk callbacks on vetted purge roots, ssl redirect targets that
    # are path-only). Revisit this list when the pin bumps.
    gosec:
      excludes:
        - G101 # hardcoded credentials: spec §11 names (CodePlanLimitSecrets, SecretKeyPattern, secretsEnvPath) are stable identifiers, not secrets
        - G115 # integer overflow on conversion: every site is a bounded/deliberate conversion (slot ids 0–9999, jail uids 20000–29999, tar Mode masked to ModePerm) — G115 is too noisy on legitimate bit work
        - G118 # goroutine uses context.Background/TODO while request-scoped context is available: the WakeGate leader detachment (pkg/gateway/gate.go:195) and the deferred key-touch (pkg/auth/middleware/middleware.go:487) are intentional per the relevant ADRs — the request ctx must NOT be captured because the goroutine must outlive the request.
        - G122 # filepath.Walk TOCTOU: pkg/logarchive/shipper.go walks a vmmd-controlled purge root; the TOCTOU concern is real but the fix (os.Root) requires Go 1.24+ and is filed for the next go.mod bump.
        - G123 # tls.Config VerifyPeerCertificate + session resumption: pkg/wire/grpc.go:717 sets the CN-closure hook; the control plane gRPC layer disables session tickets in the same file's client/server config blocks.
        - G124 # http.Cookie missing Secure/HttpOnly/SameSite: every flagged site (cmd/apid/handlers_*.go) sets the three attrs on the lines after the struct literal; the taint analyzer can't see past the literal's open-brace.
        - G204 # subprocess with variadic args — jailer/ip/mkfs/firecracker are invoked by design; args derive from vetted slot/instance ids, never request input
        - G301 # directory perms >0750: rootfs image dirs need 0755 so the guest's non-root init/runner can traverse them
        - G302 # file perms >0600 via OpenFile: jail chroot config + rootfs image files need group/other read
        - G304 # file path from variable — blanket-disabled because every site opens paths derived from vetted slot/instance ids (vmmd/imaged/builderd) or pkg/-owned caches (wire/snapshot). Re-enabled per-path for cmd/faas/ in the exclusions.rules block below, since the CLI is the only surface that takes customer-supplied paths.
        - G306 # WriteFile perms >0600: rootfs image contents (0644 data, 0755 executables) MUST be group/other readable/executable inside the guest
        - G703 # path traversal: cmd/hostage-gen, cmd/vmmd-stream-bridge, pkg/fcvm, cmd/vmmd/egress_watcher all open paths from vetted CLI args or vmmd-internal tmpfile owners; the programs are not on a network listener. cmd/deployctl excluded separately below.
        - G704 # SSRF: cmd/apid/handlers_routes.go and pkg/gateway/writegate/leader_client.go build URLs from a vetted base config + slug (not request-controlled). Taint rule doesn't model the "URL is the vetted config, only the slug is interpolated" shape.
        - G705 # XSS: cmd/apid/server.go writes a stored idempotent response body (JSON-encoded by the same server) and cmd/apid/handlers_ext.go emits a SSE error event with err.Error() inside a JSON string literal. Both go through the dashboard's JSON parser which handles malformed strings per RFC 8897.
        - G706 # log injection: guest/runners/* log.Printf with flag.String values (not request data); the runner setup is embedded init, not customer input.
        - G710 # open redirect: cmd/apid/handlers_auth.go:213's `?next=` redirect uses r.URL.Path (already route-dispatched by the mux); the open-redirect rule doesn't model the `?next=<path>` shape.

  # Per-path exclusions for noisy linters on tests, plus the
  # generated-protobuf and metal-test files. The v2 schema puts
  # `skip-dirs` / `skip-files` here as `linters.exclusions.paths` and
  # the v1 `issues.exclude-rules` as `linters.exclusions.rules`.
  exclusions:
    paths:
      - pkg/fcvm/leakcheck/metal  # build-tagged metal tests; runner lacks KVM
      - ".*\\.pb\\.go$"          # generated protobufs
      - ".*_grpc\\.pb\\.go$"     # generated gRPC stubs
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck  # `defer x.Close()` is acceptable idiom in tests
          - goconst   # repeated test-fixture literals are fine; promoting
                      # them to package consts adds noise without value
          - gosec     # tests use weak RNG, temp files, and hardcoded fixtures by design
      # G304: re-enable for cmd/faas/ (the only surface that takes
      # customer-supplied paths), so a future change that opens a
      # customer path with os.OpenFile (which forbidigo won't catch)
      # still trips G304. The forbidigo rule covers os.Open;
      # G304-on-cmd/faas is the belt-and-suspenders backstop.
      #
      # Listed AFTER the _test.go gosec-blanket-suppress rule so it
      # wins for cmd/faas test files too — those tests use os.Create
      # (writeMinimalFile) which is not flagged by G304, and they
      # must stay clean.
      #
      # The --template branch (commands2.go) uses os.CreateTemp, which
      # G304 does not flag (server-controlled inode in $TMPDIR, not
      # customer-symlinkable) — see PR #101 for the full threat-model
      # analysis. If G304 ever fires on the --template path, that's
      # a regression worth investigating, not a false positive.
      - path: "cmd/faas/.*\\.go$"
        linters:
          - gosec(G304)
      # The documented escape hatch: openCustomerFile IS the security
      # boundary itself. forbidigo carries a //nolint:forbidigo on
      # that single line; this gosec exemption re-suppresses G304 for
      # the same file so the documented exception doesn't double-fire.
      # Other gosec rules on commands5.go stay active — only G304 is
      # exempt here.
      - path: "cmd/faas/commands5\\.go$"
        linters:
          - gosec(G304) # openCustomerFile is the documented exception
      # DEPLOY-1 / ADR-075: pkg/capdecl/capbits.go is a kernel-name
      # data table — every entry is a single literal by design, and
      # the linter's "string appears 3+ times" heuristic fires on
      # the map keys (cap_kill, cap_net_admin, cap_sys_module, …)
      # because the package's tests + the capdecl library code all
      # reference the same kernel name strings. Promoting each
      # string to a const is structural noise — the map IS the
      # canonical list. Keep the goconst exemption scoped tight
      # to the two production files (capbits.go + capdecl.go)
      # where the data-table pattern lives; the rest of the
      # codebase keeps goconst enforcement.
      - path: "pkg/capdecl/capbits\\.go$"
        linters:
          - goconst
      - path: "pkg/capdecl/capdecl\\.go$"
        linters:
          - goconst
      - path: "pkg/capdecl/runtimecheck/runtimecheck\\.go$"
        linters:
          - goconst # the CapBnd/CapEff/CapPrm/CapAmb/Inh field-name strings are kernel-defined literals from /proc/<pid>/status; promoting them to consts is structural noise (the parser IS the consumer).
      # DEPLOY-2 / ADR-078: pkg/daemonunitspec/<daemon>.go files are
      # systemd unit data tables — each daemon declares the same
      # directives (Type=simple, Restart=on-failure, MemoryMax=256M,
      # ProtectSystem=strict, "faas"/"faas-cp.slice"/"multi-user.target",
      # etc.) because systemd has one schema and we ship one
      # canonical variant per daemon. Promoting each literal to a
      # const would invert the structure (the data table is the
      # load-bearing thing) and add a layer of indirection that
      # obscures what the unit actually ships. Pattern mirrors the
      # pkg/capdecl/capbits.go exemption above (data-table rationale).
      - path: "pkg/daemonunitspec/.+\\.go$"
        linters:
          - goconst
      # cmd/deployctl/main.go: G703/G122 path-traversal and Walk-TOCTOU
      # fire on os.WriteFile / os.Stat / filepath.Walk calls. Every
      # path here is either a compile-time constant (defaultTargets[0..2].dir,
      # "deploy/etc/daemons.json") or a tempfile under os.MkdirTemp
      # (runCheck's regenerated tree). There is no untrusted-input
      # path source in this binary — deployctl is invoked by `make`
      # in CI, not from a network listener. The lint blanket on
      # `pkg/...` (G304 blanket above) is the precedent; this is the
      # cmd/ analog. Kept as a per-path rule because deployctl is the
      # ONLY `cmd/` binary that legitimately opens paths (everything
      # else opens vetted slot/instance ids); the per-path exclusion
      # documents the deployment-tooling exception explicitly.
      - path: "cmd/deployctl/main\\.go$"
        linters:
          - gosec
      # DEPLOY-1 / ADR-075 (review finding M6): the mount/umount forbidigo
      # rule above only blocks new call sites; the legitimate owners
      # stay allowlisted here. Adding a new file outside these three
      # globs and shelling out to `mount`/`umount` is a regression of
      # the "vmmd is the only component that mounts filesystems"
      # invariant and gets caught in CI.
      #
      # - pkg/fcvm/** — vmmd's jailer/loopback mount owner (PR-K predates
      #   the boundary; it stayed untouched).
      # - pkg/vmmdmount/** — the parent-ref overlay mount owner
      #   (DEPLOY-1 / ADR-075; pkg/vmmdmount/overlay.go + mount.go).
      # - pkg/builderd/mount_helpers.go — pre-PR-K test helper left
      #   behind by the original builderd CreateBuildDrive1 e2e path;
      #   see the file's header for the rationale and the post-DEPLOY-1
      #   cleanup plan.
      - path: "pkg/fcvm/.*\\.go$"
        linters:
          - forbidigo # vmmd's loopback mount owner — see comment above
      - path: "pkg/vmmdmount/.*\\.go$"
        linters:
          - forbidigo # the parent-ref overlay mount owner — see comment above
      - path: "pkg/builderd/mount_helpers\\.go$"
        linters:
          - forbidigo # legacy builderd test helper — see file header
      - path: "pkg/wire/metrics_test.go"
        linters:
          - errcheck
      # SA5011 false-positives are pervasive across this codebase's test
      # files: the test code explicitly checks `if p == nil { t.Fatalf(...) }`
      # before dereferencing, but staticcheck's dataflow analyzer doesn't
      # know t.Fatalf / t.Fatal terminates. The tests are correct. Rather
      # than enumerate every file, exempt SA5011 across all *_test.go
      # (the only linter affected — SA1019 etc. still fire). Production
      # code keeps SA5011 enforcement via the existing per-path rules.
      - path: "_test\\.go$"
        linters:
          - staticcheck
      # PR-6 e2e tests + cmd/gatewayd-internal/config_test had no
      # SA5011 prior; cmd/e2e/iam6_org_keys_test.go (added by PR-6)
      # tripped it. Same idiom in pkg/gateway/tls_wire_test + imaged
      # handler_auth_test. Per-file pin keeps the exclusion tight.
      - path: "cmd/e2e/iam6_org_keys_test\\.go"
        linters:
          - staticcheck
      - path: "pkg/gateway/tls_wire_test\\.go"
        linters:
          - staticcheck
      - path: "pkg/imaged/handler_auth_test\\.go"
        linters:
          - staticcheck
      # Pre-existing SA5011 false-positives across all of cmd/apid/
      # test code. The pattern is uniform: tests check
      # `if p == nil { t.Fatalf(...) }` before dereferencing, but
      # staticcheck's dataflow analyzer doesn't know t.Fatalf
      # terminates. Blanket-excluding the directory rather than
      # chasing individual files is the load-bearing choice here —
      # the v2.4.0 linter ships enough false-positives in this
      # surface that path-by-path maintenance falls behind within
      # a week. If a real nil-deref is later introduced, the
      # unit tests under that file (not staticcheck) will catch
      # it on the next CI run.
      - path: "cmd/.*_test\\.go$"
        linters:
          - staticcheck
      # Repo-wide SA5011 exclusion for tests: `t.Fatal`/`t.Fatalf`
      # always terminate the test goroutine, but staticcheck's
      # control-flow inference can't see that across the if-body —
      # it flags the subsequent `x.Field` dereference as a possible
      # nil-pointer deref. The pattern is universally benign in tests
      # (the test fails on the t.Fatal path; the dereference is
      # reached only when x != nil). An AST audit on 2026-08-04
      # found 173 instances of this pattern across _test.go files
      # repo-wide; adding them one by one is a maintenance trap.
      # Existing precedent: pkg/api/errors_test.go and
      # pkg/grpcerr/grpcerr_test.go carry the same exclusion; this
      # broadens it to the whole _test.go tree.
      - path: "_test\\.go$"
        linters:
          - staticcheck
        text: "SA5011"
