version: 1
suites:
  http-commit-request:
    scenarios:
      - {scenario: commit-request-deadline, engine: real-vm, profile: warm}
scenarios:
  commit-request-deadline:
    project: http-native-request
    source: ./app
    timeout: 5m
    secrets:
      CHECKOUT_DEADLINE_MS: '1500'
    services:
      payment:
        source: ./payment-postgres
        secrets:
          DATABASE_URL: '${env.GREGALE_DEPENDENCY_DATABASE_URL}'
          LEDGER_NAMESPACE: '${run.id}'
          LEDGER_TEST_DISPOSABLE: '${env.GREGALE_DEPENDENCY_DATABASE_DISPOSABLE}'
          GREGALE_NATIVE_COMMIT_LOSS: '1'
          GREGALE_NATIVE_COMMIT_MODE: 'request-deadline'
          NATIVE_AUTH_CERT_PEM: '${env.GREGALE_NATIVE_AUTH_CERT_PEM}'
          NATIVE_AUTH_KEY_PEM: '${env.GREGALE_NATIVE_AUTH_KEY_PEM}'
          NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    cleanup:
      - [node, ../test/native-commit-acceptance.mjs, cleanup, request-deadline]
    requests:
      - name: caller-baseline
        method: GET
        path: /
        expect: {status: 200, json: {'/ready': true}}
    command: [node, ../test/native-commit-acceptance.mjs, all, request-deadline]
