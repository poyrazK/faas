version: 1
assertion_profiles:
  inventory-stays-healthy:
    healthy_routes:
      inventory-read: {p95: 750ms, error_rate: 0, min_samples: 3}
  payment-retry-limit:
    dependency_attempts: {request: payment-read, max_attempts_per_request: 2, min_requests: 3}
  payment-recovers:
    recovery_deadlines:
      payment-read:
        within: 4s
        sustain: 1s
        window: 1s
        thresholds: {p95: 750ms, error_rate: 0, min_samples: 1}
suites:
  http-assertions:
    scenarios:
      - {scenario: reusable-resilience-assertions, engine: real-vm, profile: warm}
scenarios:
  reusable-resilience-assertions:
    project: http-assertions
    source: ./native-bulkhead-app
    timeout: 5m
    secrets:
      GREGALE_ISOLATION_FIXTURE: '1'
      LEDGER_NAMESPACE: '${run.id}'
      NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    services:
      payment:
        source: ./payment-postgres
        secrets:
          DATABASE_URL: '${env.GREGALE_DEPENDENCY_DATABASE_URL}'
          LEDGER_NAMESPACE: '${run.id}'
          LEDGER_TEST_DISPOSABLE: '${env.GREGALE_DEPENDENCY_DATABASE_DISPOSABLE}'
          GREGALE_NATIVE_SSL_REQUEST: '1'
          NATIVE_AUTH_CERT_PEM: '${env.GREGALE_NATIVE_AUTH_CERT_PEM}'
          NATIVE_AUTH_KEY_PEM: '${env.GREGALE_NATIVE_AUTH_KEY_PEM}'
          NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
      inventory:
        source: ./payment-postgres
        secrets:
          DATABASE_URL: '${env.GREGALE_DEPENDENCY_DATABASE_URL}'
          LEDGER_NAMESPACE: '${run.id}'
          LEDGER_TEST_DISPOSABLE: '${env.GREGALE_DEPENDENCY_DATABASE_DISPOSABLE}'
          GREGALE_NATIVE_SSL_REQUEST: '1'
          NATIVE_AUTH_CERT_PEM: '${env.GREGALE_NATIVE_AUTH_CERT_PEM}'
          NATIVE_AUTH_KEY_PEM: '${env.GREGALE_NATIVE_AUTH_KEY_PEM}'
          NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    steps:
      - name: baseline
        requests:
          - {name: payment-ready, method: GET, path: /a/query, expect: {status: 200}}
          - {name: inventory-ready, method: GET, path: /b/query, expect: {status: 200}}
      - name: verify-isolation-and-recovery
        requests:
          - {name: payment-read, method: GET, path: /a/query, expect: {status: 200}}
          - {name: inventory-read, method: GET, path: /b/query, expect: {status: 200}}
        load:
          duration: 12s
          streams:
            - {name: payment, requests: [payment-read], rate: 2, vus: 2}
            - {name: inventory, requests: [inventory-read], rate: 5, vus: 2}
          thresholds: {error_rate: 1}
          chaos_schedule:
            - name: baseline
              duration: 2s
              assertions: [inventory-stays-healthy]
            - name: payment-outage
              duration: 4s
              assertions: [inventory-stays-healthy, payment-retry-limit]
              rules:
                - {from: http-assertions, to: payment, kind: http_status, status_code: 503, percent: 100, min_matches: 1}
            - name: recovery
              duration: 6s
              assertions: [inventory-stays-healthy, payment-recovers]
      - name: restored
        requests:
          - {name: payment-restored, method: GET, path: /a/query, expect: {status: 200}}
          - {name: inventory-still-ready, method: GET, path: /b/query, expect: {status: 200}}
