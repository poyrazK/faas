version: 1
suites:
  http-isolation:
    scenarios:
      - {scenario: dependency-isolation, engine: real-vm, profile: warm}
scenarios:
  dependency-isolation:
    project: http-native-isolation
    source: ./native-bulkhead-app
    timeout: 5m
    secrets:
      GREGALE_ISOLATION_FIXTURE: '1'
      LEDGER_NAMESPACE: '${run.id}'
      NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    services:
      payment:
        source: ./payment-postgres
        secrets:
          DATABASE_URL: '${env.GREGALE_DEPENDENCY_DATABASE_URL}'
          LEDGER_NAMESPACE: '${run.id}'
          LEDGER_TEST_DISPOSABLE: '${env.GREGALE_DEPENDENCY_DATABASE_DISPOSABLE}'
          GREGALE_NATIVE_SSL_REQUEST: '1'
          NATIVE_AUTH_CERT_PEM: '${env.GREGALE_NATIVE_AUTH_CERT_PEM}'
          NATIVE_AUTH_KEY_PEM: '${env.GREGALE_NATIVE_AUTH_KEY_PEM}'
          NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
      inventory:
        source: ./payment-postgres
        secrets:
          DATABASE_URL: '${env.GREGALE_DEPENDENCY_DATABASE_URL}'
          LEDGER_NAMESPACE: '${run.id}'
          LEDGER_TEST_DISPOSABLE: '${env.GREGALE_DEPENDENCY_DATABASE_DISPOSABLE}'
          GREGALE_NATIVE_SSL_REQUEST: '1'
          NATIVE_AUTH_CERT_PEM: '${env.GREGALE_NATIVE_AUTH_CERT_PEM}'
          NATIVE_AUTH_KEY_PEM: '${env.GREGALE_NATIVE_AUTH_KEY_PEM}'
          NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    cleanup:
      - [node, ../test/native-isolation-acceptance.mjs, cleanup]
    requests:
      - name: a-baseline
        method: GET
        path: /a/query
        expect: {status: 200, json: {'/ready': true, '/value': 42, '/attempts': 1}}
      - name: b-baseline
        method: GET
        path: /b/query
        expect: {status: 200, json: {'/ready': true, '/value': 42, '/attempts': 1}}
    command: [node, ../test/native-isolation-acceptance.mjs, all]
