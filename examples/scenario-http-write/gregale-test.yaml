version: 1
suites:
  http-write:
    scenarios:
      - {scenario: committed-response-lost, engine: real-vm, profile: warm}
scenarios:
  committed-response-lost:
    project: http-write-example
    source: ./app
    timeout: 5m
    services:
      payment:
        source: ./payment
    steps:
      - name: baseline
        command: [node, ../test/acceptance.mjs, baseline]
      - name: committed-without-ack
        chaos:
          duration: 30s
          rules:
            - to: payment
              kind: http_response_lost
              percent: 100
              min_matches: 3
        command: [node, ../test/acceptance.mjs, outage]
      - name: restore-payment
        clear_chaos: true
      - name: reconcile-committed-write
        command: [node, ../test/acceptance.mjs, recovery]
        checks:
          - name: same-key-confirmed
            method: POST
            path: /checkout
            headers: {idempotency-key: ambiguous}
            json: {customer: customer-one, sku: item-one, quantity: 1}
            expect: {status: 200, json: {'/id': ambiguous, '/status': confirmed, '/attempts': 1}}
