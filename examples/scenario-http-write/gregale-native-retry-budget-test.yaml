version: 1
suites:
  http-retry-budget:
    scenarios:
      - {scenario: shared-retry-budget, engine: real-vm, profile: warm}
scenarios:
  shared-retry-budget:
    project: http-native-retry-budget
    source: ./native-retry-app
    timeout: 5m
    secrets:
      GREGALE_RETRY_BUDGET_FIXTURE: '1'
      LEDGER_NAMESPACE: '${run.id}'
      NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    services:
      payment:
        source: ./payment-postgres
        secrets:
          DATABASE_URL: '${env.GREGALE_DEPENDENCY_DATABASE_URL}'
          LEDGER_NAMESPACE: '${run.id}'
          LEDGER_TEST_DISPOSABLE: '${env.GREGALE_DEPENDENCY_DATABASE_DISPOSABLE}'
          GREGALE_NATIVE_SSL_REQUEST: '1'
          NATIVE_AUTH_CERT_PEM: '${env.GREGALE_NATIVE_AUTH_CERT_PEM}'
          NATIVE_AUTH_KEY_PEM: '${env.GREGALE_NATIVE_AUTH_KEY_PEM}'
          NATIVE_AUTH_CONTROL_TOKEN: '${env.GREGALE_NATIVE_AUTH_CONTROL_TOKEN}'
    cleanup:
      - [node, ../test/native-retry-budget-acceptance.mjs, cleanup]
    requests:
      - name: query-baseline
        method: GET
        path: /query
        expect: {status: 200, json: {'/ready': true, '/value': 42, '/attempts': 1}}
    command: [node, ../test/native-retry-budget-acceptance.mjs, all]
