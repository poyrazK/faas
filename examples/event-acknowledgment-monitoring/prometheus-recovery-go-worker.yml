# Opt in only when the combined Go host observes actual recovery passes.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - recovery.rules.yml
scrape_configs:
  - job_name: gregale-event-recovery-go-worker
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: ['127.0.0.1:9468']
        labels:
          gregale_event_recovery: 'true'
          gregale_event_recovery_worker: 'true'
