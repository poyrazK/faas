# Same recovery rules/metric prefix, with one distinct Python collector target.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - recovery.rules.yml
scrape_configs:
  - job_name: gregale-event-recovery-python
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: ['127.0.0.1:9467']
        labels:
          gregale_event_recovery: 'true'
