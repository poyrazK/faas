services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:local-only@db:5432/app
    depends_on: [db]
  worker:
    build: .
    command: ["node", "worker.mjs"]
    environment:
      DATABASE_URL: postgres://postgres:local-only@db:5432/app
    depends_on: [db]
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: local-only
