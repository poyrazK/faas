version: 1
suites:
  http-body:
    scenarios:
      - {scenario: malformed-response, engine: real-vm, profile: warm}
      - {scenario: truncated-response, engine: real-vm, profile: warm}
scenarios:
  malformed-response:
    project: http-malformed-example
    source: ./app
    timeout: 5m
    services:
      inventory:
        source: ./inventory
    steps:
      - name: baseline
        requests:
          - name: first-attempt-success
            method: GET
            path: /fetch
            expect: {status: 200, json: {'/attempts': 1, '/dependency_available': true}}
      - name: invalid-response
        chaos:
          duration: 30s
          rules:
            - to: inventory
              kind: http_malformed_json
              percent: 100
              min_matches: 3
        command: [node, ../test/acceptance.mjs, malformed]
        checks:
          - name: bounded-retry-attempts
            method: GET
            path: /fetch
            expect: {status: 503, json: {'/attempts': 3, '/error': invalid_dependency_response}}
      - name: restore-inventory
        clear_chaos: true
      - name: recovery
        command: [node, ../test/acceptance.mjs, recovery]
        checks:
          - name: dependency-recovered
            method: GET
            path: /fetch
            expect: {status: 200, json: {'/attempts': 1, '/dependency_available': true}}
  truncated-response:
    project: http-truncated-example
    source: ./app
    timeout: 5m
    services:
      inventory:
        source: ./inventory
    steps:
      - name: baseline
        requests:
          - name: first-attempt-success
            method: GET
            path: /fetch
            expect: {status: 200, json: {'/attempts': 1, '/dependency_available': true}}
      - name: invalid-response
        chaos:
          duration: 30s
          rules:
            - to: inventory
              kind: http_truncated_body
              percent: 100
              min_matches: 3
        command: [node, ../test/acceptance.mjs, truncated]
        checks:
          - name: bounded-retry-attempts
            method: GET
            path: /fetch
            expect: {status: 503, json: {'/attempts': 3, '/error': invalid_dependency_response}}
      - name: restore-inventory
        clear_chaos: true
      - name: recovery
        command: [node, ../test/acceptance.mjs, recovery]
        checks:
          - name: dependency-recovered
            method: GET
            path: /fetch
            expect: {status: 200, json: {'/attempts': 1, '/dependency_available': true}}
