schema_version: 1
workflows:
  - name: send_batch
    trigger:
      type: manual
    steps:
      - name: send
        for_each:
          items: input.recipients
          action:
            run: send_receipt
            input:
              recipient: "{{input.item}}"
              position: "{{input.index}}"
              invoice_id: "{{input.input.invoice_id}}"
            timeout: 30s
            retry:
              max_attempts: 3
              backoff: exponential
      - name: summary
        run: record_delivery
        depends_on: [send]
        input:
          invoice_id: "{{input.invoice_id}}"
          results: "{{steps.send.output}}"
