<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review CSV import</title>
<style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem;color:#18323c;background:#fafcfb}label{display:block;margin:1rem 0}input{padding:.6rem;width:min(95%,600px)}button{padding:.7rem 1.2rem;margin:.4rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3f0;padding:1rem;max-height:24rem;overflow:auto}#status{font-weight:600}button:disabled{opacity:.5}</style>
<h1>Review CSV import</h1><p>Inspect the validated rows and source digest before the pipeline writes data. Enter your application token to attach to an existing run.</p>
<form><label>Application token <input id="token" type="password" autocomplete="off" required></label><label>Pipeline run ID <input id="run" required></label><button id="attach">Attach</button></form>
<p id="status" role="status">Enter a token and run ID.</p><section id="review" hidden><h2>Pending review</h2><p id="expiry"></p><p>Review binding: <code id="binding"></code></p><pre id="data"></pre><label>Decision note <input id="reason" maxlength="256"></label><button id="approve" disabled>Approve import</button><button id="reject" disabled>Reject import</button></section>
<button id="report" disabled>Download rejection report</button><script type="module" src="/pipeline-review-browser.mjs"></script></html>
