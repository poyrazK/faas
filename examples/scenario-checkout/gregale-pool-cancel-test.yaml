version: 1
suites:
  pool-cancel:
    scenarios:
      - {scenario: pool-cancel, engine: real-vm, profile: warm}
scenarios:
  pool-cancel:
    project: pool-cancel
    source: ./native-probe
    timeout: 5m
    secrets:
      GREGALE_TCP_CAMPAIGN_FIXTURE: '1'
      GREGALE_POOL_FIXTURE: '1'
      GREGALE_POOL_CANCEL_FIXTURE: '1'
      GREGALE_POOL_NAMESPACE: '${run.id}'
      PROBE_DEPENDENCY_HOST: ${service.payment.host}
      PROBE_DEPENDENCY_PORT: ${service.payment.port}
    services:
      payment:
        source: ./native-probe
        tcp_ports: [6379]
        secrets:
          GREGALE_TCP_CAMPAIGN_FIXTURE: '1'
    cleanup:
      - [node, ../test/native-pool-cancel.mjs, cleanup]
    steps:
      - name: baseline
        requests:
          - {name: ready, method: GET, path: /dependency, expect: {status: 200, json: {'/dependency': reachable}}}
      - name: cancel-active
        chaos:
          duration: 1m
          rules:
            - {from: pool-cancel, to: payment, kind: tcp_timeout, port: 6379, direction: downstream, percent: 100, min_matches: 2}
        command: [node, ../test/native-pool-cancel.mjs, active]
      - name: clear-fault
        clear_chaos: true
      - name: restored
        requests:
          - {name: dependency-restored, method: GET, path: /dependency, expect: {status: 200, json: {'/dependency': reachable}}}
