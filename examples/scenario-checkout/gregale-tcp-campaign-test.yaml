version: 1
assertion_profiles:
  connection-limit:
    connection_attempts: {request: dependency-probe, max_attempts_per_request: 2, min_requests: 3}
  health-stays-responsive:
    healthy_routes:
      health: {p95: 750ms, error_rate: 0, min_samples: 3}
  dependency-recovers:
    recovery_deadlines:
      dependency-probe:
        within: 1s
        sustain: 1s
        window: 1s
        thresholds: {p95: 750ms, error_rate: 0, min_samples: 2}
suites:
  tcp-campaign:
    scenarios:
      - {scenario: tcp-campaign, engine: real-vm, profile: warm}
scenarios:
  tcp-campaign:
    project: tcp-campaign
    source: ./native-probe
    timeout: 5m
    secrets:
      GREGALE_TCP_CAMPAIGN_FIXTURE: '1'
      PROBE_DEPENDENCY_HOST: ${service.payment.host}
      PROBE_DEPENDENCY_PORT: ${service.payment.port}
      PROBE_DELAY_MS: '25'
    services:
      payment:
        source: ./native-probe
        tcp_ports: [6379]
        secrets:
          GREGALE_TCP_CAMPAIGN_FIXTURE: '1'
    steps:
      - name: baseline
        requests:
          - {name: ready, method: GET, path: /dependency, expect: {status: 200, json: {'/dependency': reachable}}}
      - name: fault-campaign
        requests:
          - {name: dependency-probe, method: GET, path: /dependency, expect: {status: 200, json: {'/dependency': reachable}}}
          - {name: health, method: GET, path: /, expect: {status: 200, json: {'/ready': true}}}
        load:
          connection_leaks: {path: /connections, within: 1s, sustain: 1s, max_extra: 2}
          duration: 8s
          streams:
            - {name: dependency, requests: [dependency-probe], rate: 5, vus: 4}
            - {name: health, requests: [health], rate: 5, vus: 4}
          thresholds: {error_rate: 1}
          fault_campaign:
            order: declared
            seed: 42
            count: 4
            max_duration: 30s
            choices:
              - duration: 2s
                rule: {from: tcp-campaign, to: payment, kind: tcp_latency, port: 6379, direction: downstream, latency: 300ms, percent: 100, min_matches: 1}
              - duration: 2s
                rule: {from: tcp-campaign, to: payment, kind: tcp_bandwidth, port: 6379, direction: downstream, rate_kib_per_second: 1, percent: 100, min_matches: 1}
              - duration: 2s
                rule: {from: tcp-campaign, to: payment, kind: tcp_timeout, port: 6379, direction: downstream, percent: 100, min_matches: 1}
              - duration: 2s
                rule: {from: tcp-campaign, to: payment, kind: tcp_reset, port: 6379, direction: both, reset_after: 0ms, percent: 100, min_matches: 1}
          chaos_schedule:
            - {name: baseline, duration: 2s, assertions: [health-stays-responsive]}
            - name: fault
              duration: 2s
              assertions: [connection-limit, health-stays-responsive]
              rules:
                - {from: tcp-campaign, to: payment, kind: tcp_timeout, port: 6379, direction: downstream, percent: 100, min_matches: 1}
            - {name: recovery, duration: 4s, assertions: [health-stays-responsive, dependency-recovers]}
      - name: restored
        requests:
          - {name: dependency-restored, method: GET, path: /dependency, expect: {status: 200, json: {'/dependency': reachable}}}
