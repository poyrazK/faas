schema_version: 1
workflows:
  - name: invoice_followup
    trigger:
      type: manual
    steps:
      - name: remind
        run: send_reminder
        when:
          ref: input.overdue
          op: eq
          value: true
      - name: receipt
        run: send_receipt
        when:
          not:
            ref: input.overdue
            op: eq
            value: true
      - name: merge
        depends_on: [remind, receipt]
        join:
          output_from: [receipt, remind]
      - name: update_crm
        run: update_crm
        depends_on: [merge]
        input:
          invoice_id: "{{input.invoice_id}}"
          branch: "{{steps.merge.output.source}}"
          result: "{{steps.merge.output.value}}"
        retry:
          max_attempts: 3
          backoff: exponential
