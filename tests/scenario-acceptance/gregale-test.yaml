version: 1
suites:
  simulation:
    scenarios:
      - scenario: delivery-smoke
        engine: simulated
      - scenario: customer-export
        engine: simulated
scenarios:
  delivery-smoke:
    project: scenario-acceptance
    source: ./app
    secrets:
      SINK_URL: ${service.sink.url}/deliver
      TEST_RUN_ID: ${run.id}
    services:
      sink:
        fixture: delivery-sink
        fail_first: 1
    trigger: [node, test/trigger.mjs]
    wait_for:
      deliveries:
        - service: sink
          min_attempts: 2
          last_status: 200
    command: [node, test/assert.mjs]
    simulation: [node, --test, test/app.test.mjs]
    timeout: 10m
  customer-export:
    project: scenario-export
    source: ./export-api
    secrets:
      WORKER_URL: ${service.worker.url}
      WORKER_TEST_TOKEN: ${run.secret}
    consumer_auth_mode: required
    consumers:
      - name: customer-a
      - name: customer-b
    services:
      worker:
        source: ./export-worker
        async_routes:
          - path: /process
            methods: [POST]
            retry_policy:
              max_attempts: 3
              base_seconds: 1
              max_seconds: 2
        secrets:
          TEST_RUN_ID: ${run.id}
          NOTIFICATION_URL: ${service.notifications.url}/deliver
          FAIL_FIRST_PROCESS: "1"
          WORKER_TEST_TOKEN: ${run.secret}
      notifications:
        fixture: delivery-sink
        fail_first: 1
    buckets:
      - name: exports
        service: worker
        prefix: EXPORT_STORAGE
        permission: read_write
    trigger: [node, test/trigger.mjs]
    wait_for:
      invocations:
        - service: worker
          trigger_key: worker_invocation_id
          min_attempts: 2
      deliveries:
        - service: notifications
          min_attempts: 2
          last_status: 200
      objects:
        - bucket: exports
          prefix: reports/${GREGALE_TEST_RUN_ID}/
          min_count: 1
          min_total_bytes: 1
    command: [node, test/assert.mjs]
    simulation: [node, --test, test/app.test.mjs]
    timeout: 15m
