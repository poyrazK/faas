version: 1
scenarios:
  running-import:
    project: import-api
    source: .
    timeout: 10m
    services:
      worker:
        source: ./worker
        async_routes:
          - path: /import
            methods: [POST]
            retry_policy: {max_attempts: 2, base_seconds: 1, max_seconds: 1}
    command_execution: {version: 1, runtime: contained}
    setup: [[node, commands.mjs, setup]]
    trigger: [node, commands.mjs, trigger]
    command: [node, commands.mjs, observe]
    checks:
      - name: health
        method: GET
        path: /
        expect: {status: 200, json: {'/ready': true}}
    wait_for:
      invocations: [{service: worker, trigger_key: worker_invocation_id, min_attempts: 2}]
    behavior:
      version: 1
      fixtures: [input.json]
      observers: [commands.mjs]
      observations: [{key: api.ready, kind: http}]
    postgres_fixture:
      version: 1
      fixture: fixture.sql
      max_lock_wait_ms: 250
      tables: [{schema: public, name: imports, columns: [external_id, state]}]
    objects_fixture: {version: 1, bucket: imports, fixtures: []}
    managed_work:
      version: 1
      primary: import-api
      participants:
        - {workload: import-api, postgres: read_write, objects: read_write}
        - {workload: worker, async: true, postgres: read_write, objects: read_write}
    suspend_resume:
      version: 1
      checkpoint: managed_job
      workloads: [worker]
      worker_checkpoint: after-commit
      pause_for: 1s
      resume_within: 5s
    actions:
      webhooks: capture
      network: contained
      simulation:
        version: 1
        fixtures:
          - workload: worker
            name: after-commit
            integration: checkpoint
            adapter: http
            method: POST
            path: /after-commit
            responses: [{status: 200}]
          - workload: worker
            name: notification
            integration: email
            adapter: resend
            method: POST
            path: /emails
            capture_fields: [to, subject]
            responses: [{status: 200, body: '{"id":"simulated-notification"}'}]
