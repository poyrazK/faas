name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production             # opt-in; remove if not using GitHub Environments
    permissions:
      contents: read
      id-token: write                   # Gregale exchanges the job JWT for a 5-minute bearer
    steps:
      - uses: poyrazK/faas/.github/actions/deploy@v1
        with:
          api-base: https://api.gregale.dev
          app: my-app
          # repo / ref default to ${{ github.repository }} / ${{ github.sha }}
          wait: "true"
