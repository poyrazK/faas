name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gregale-${{ github.repository }}-my-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production             # opt-in; remove if not using GitHub Environments
    permissions:
      contents: read
      checks: write                    # publish the deployment link in GitHub Checks
      id-token: write                   # Gregale exchanges the job JWT for a 5-minute bearer
    steps:
      - uses: poyrazK/faas/.github/actions/deploy@v0
        with:
          api-base: https://api.gregale.dev
          app: my-app
          # repo / ref default to ${{ github.repository }} / ${{ github.sha }}
          # Report the terminal deployment result to this workflow.
          wait: "true"
          # Optional: balanced health-gated production rollout (Pro/Scale only).
          # rollout: "safe"
