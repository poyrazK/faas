name: "Gregale deploy"
description: "Deploy a Gregale app from a GitHub Actions workflow using a pinned gregale CLI"
author: "Gregale"

# Composite Action, monorepo shape (ADR-093). The vendored binary
# lives at bin/gregale and is replaced by the release.yml workflow
# on every v*.*.* tag. The action runs against the existing
# POST /v1/apps/{slug}/deployments/source-ref endpoint — no new
# server surface.
#
# Pinned-major @v0 is the public-beta shape; the bundled CLI
# version is exposed as the `cli-version` output so customers can
# lint for drift. Optional `--pinned-sha` input on the snippet
# generator emits a `# pin: <sha>` comment line for customers who
# want hard reproducibility.

inputs:
  api-key:
    description: "Optional Gregale bearer token. Omit to use GitHub OIDC (requires permissions: id-token: write)."
    required: false
    default: ""
  # OIDC is the recommended path: the Action exchanges GitHub's job JWT for
  # a five-minute Gregale deploy bearer, so customers do not store a long-lived
  # secret in repository settings.
  oidc-audience:
    description: "Audience requested from GitHub and sent to Gregale's OIDC exchange"
    required: false
    default: "gregale"
  api-base:
    description: "Gregale API base URL (override per environment; defaults to the public API)"
    required: false
    default: "https://api.gregale.dev"
  app:
    description: "App slug to deploy"
    required: true
  repo:
    description: "OWNER/NAME of the source GitHub repo (defaults to the current workflow repository)"
    required: false
    default: ""
  ref:
    description: "git ref — branch, tag, or 40-char SHA (defaults to the current workflow SHA)"
    required: false
    default: ""
  format:
    description: "Source format passed to the source-ref endpoint"
    required: false
    default: "tarball"
  wait:
    description: "If true, block until the deployment is ready (or fails); false queues it and returns immediately"
    required: false
    default: "false"
  wait-timeout:
    description: "Maximum seconds to wait for the deployment to settle (only used when wait=true)"
    required: false
    default: "600"
  # Issue #977 / ADR-116: deployment annotations surface. The CLI
  # forwards --reason / --tag / --deployed-by / --pr-number to
  # gregale deploy. Defaults mirror the GitHub Actions context
  # (github.actor for the actor, the PR number for pull_request
  # events) so most workflows can omit them and still get a
  # useful stamp on the deployment row.
  reason:
    description: "Free-text deploy reason (≤280 chars). Recorded on the deployment row + dashboard + audit."
    required: false
    default: ""
  tag:
    description: "Annotation tag — one of: incident_recovery, hotfix, scheduled_maintenance, compliance_hold, partner_request."
    required: false
    default: ""
  deployed-by:
    description: "Operator label. Defaults to the current GitHub actor when unset."
    required: false
    default: ""
  pr-number:
    description: "PR number (defaults to the current pull request number for pull_request events)."
    required: false
    default: ""

outputs:
  deployment-id:
    description: "The new deployment id (32-char hex)"
    value: ${{ steps.deploy.outputs.deployment-id }}
  app-slug:
    description: "Echo of the input app slug"
    value: ${{ steps.deploy.outputs.app-slug }}
  status:
    description: "Observed deployment status: live | queued | failed | cancelled | superseded | timeout"
    value: ${{ steps.deploy.outputs.status }}
  url:
    description: "URL of the new deployment record on the control-plane API (https://{api-base}/v1/apps/{slug}/deployments/{id})"
    value: ${{ steps.deploy.outputs.url }}
  check-run-id:
    description: "GitHub Check Run id created for the deployment (empty when checks: write is unavailable)"
    value: ${{ steps.deploy.outputs.check-run-id }}
  cli-version:
    description: "Bundled gregale CLI version (verifies the vendored binary)"
    value: ${{ steps.deploy.outputs.cli-version }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      # ACTION_PATH is hoisted into env rather than interpolated
      # directly into the run: string. CodeQL's js/injection rule
      # flags any ${{ ... }} in run: even when the expression is
      # GitHub-controlled (like github.action_path), because the
      # expansion happens before shell evaluation. Routing through
      # env: keeps the run string literal and resolves ACTION_PATH
      # as a shell variable at run time. The src/run.sh script
      # already honours ACTION_PATH via its own fallback at the
      # top of the file (cmd/.../src/run.sh:25).
      env:
        ACTION_PATH: ${{ github.action_path }}
        FAAS_TOKEN: ${{ inputs.api-key }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: bash "$ACTION_PATH/src/run.sh" validate
    - name: Deploy
      id: deploy
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FAAS_API: ${{ inputs.api-base }}
        FAAS_TOKEN: ${{ inputs.api-key }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_REPO: ${{ inputs.repo || github.repository }}
        INPUT_REF: ${{ inputs.ref || github.sha }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        # Check Run publication is best-effort. Callers that want the
        # GitHub-native status record must grant `checks: write`; the deploy
        # itself remains compatible with the existing contents-only scope.
        GITHUB_TOKEN: ${{ github.token }}
        # Issue #977 / ADR-116: forward the annotation surface to
        # src/run.sh which appends the corresponding gregale
        # deploy flags. Default values resolve in this composite step,
        # where the GitHub context is valid for Action metadata.
        INPUT_REASON: ${{ inputs.reason }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_DEPLOYED_BY: ${{ inputs.deployed-by || github.actor }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
      run: bash "$ACTION_PATH/src/run.sh" deploy
    - name: Annotate on failure
      if: failure()
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/src/annotate.sh"
