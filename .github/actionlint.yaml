# actionlint configuration used by ci.yml.
self-hosted-runner:
  labels:
    - kvm
    - faas-fleet
    - faas-fleet-us
    - gregale-bridge-acceptance
    - gregale-data-api-staging
    - gregale-profiling-acceptance
    - gregale-scenario-acceptance
    - gregale-gitops-acceptance
    - gregale-financial-pair

paths:
  .github/workflows/ops-restart-hosted-mcp.yml:
    ignore:
      # GitHub Actions supports concurrency.queue. actionlint v1.7.12 does not yet parse it.
      # https://github.com/rhysd/actionlint/issues/657
      - '^unexpected key "queue" for "concurrency" section\.'
