# cd-platform.yml — canonical production rollout across control and compute.
#
# The stage workflows remain independently dispatchable for repair work. A
# production release uses this workflow so a successful control-plane stage
# cannot be mistaken for a successful fleet rollout.

name: cd-platform

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed pre-1.0 release tag"
        required: true
        type: string
      compute_targets:
        description: "JSON array of compute targets; required for a multi-node fleet"
        required: false
        default: "[]"
        type: string
      claim_file:
        description: "Path to the active node's ComputeNodeClaim (preferred)"
        required: false
        default: ""
        type: string
      fleet_bundle_url:
        description: "HTTPS URL for the active node's signed FleetEnrollmentBundle"
        required: false
        default: ""
        type: string
      fleet_bundle_signature_url:
        description: "HTTPS URL for the FleetEnrollmentBundle signature"
        required: false
        default: ""
        type: string
      fleet_bundle_sha256:
        description: "sha256 digest of the FleetEnrollmentBundle"
        required: false
        default: ""
        type: string
      node:
        description: "Active manifest compute node name"
        required: false
        default: ""
        type: string
      ssh_host:
        description: "Legacy provider SSH address for the active compute node"
        required: false
        default: ""
        type: string
      ssh_user:
        description: "SSH user"
        required: false
        default: root
        type: string
      ssh_port:
        description: "SSH port"
        required: false
        default: "22"
        type: string
      ssh_host_key_sha256:
        description: "Expected OpenSSH host-key fingerprint"
        required: false
        default: ""
        type: string
      storage_device:
        description: "Optional stable storage device path"
        required: false
        default: ""
        type: string
      format_storage:
        description: "Format the explicitly supplied blank storage device as XFS"
        required: false
        default: false
        type: boolean
      skip_fleet_preflight:
        description: "Reuse a recent successful full-fleet preflight"
        required: false
        default: false
        type: boolean

concurrency:
  # Keep this key release-independent. Two tags must never mutate the single
  # production control plane or fleet at the same time.
  group: production-platform-rollout
  cancel-in-progress: false

permissions:
  # Called workflows can only reduce the caller's token permissions. The
  # compute stage reads the dispatch run while resolving a reused preflight,
  # so the orchestrator must make actions:read available up front.
  actions: read
  contents: read

jobs:
  plan:
    name: Validate compute rollout targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    env:
      COMPUTE_TARGETS: ${{ inputs.compute_targets }}
      CLAIM_FILE: ${{ inputs.claim_file }}
      FLEET_BUNDLE_URL: ${{ inputs.fleet_bundle_url }}
      FLEET_BUNDLE_SIGNATURE_URL: ${{ inputs.fleet_bundle_signature_url }}
      FLEET_BUNDLE_SHA256: ${{ inputs.fleet_bundle_sha256 }}
      NODE: ${{ inputs.node }}
      SSH_HOST: ${{ inputs.ssh_host }}
      SSH_USER: ${{ inputs.ssh_user }}
      SSH_PORT: ${{ inputs.ssh_port }}
      SSH_HOST_KEY_SHA256: ${{ inputs.ssh_host_key_sha256 }}
      STORAGE_DEVICE: ${{ inputs.storage_device }}
      FORMAT_STORAGE: ${{ inputs.format_storage }}
      SKIP_FLEET_PREFLIGHT: ${{ inputs.skip_fleet_preflight }}
    steps:
      - id: matrix
        name: Build validated compute matrix
        run: |
          set -euo pipefail
          targets_file="$RUNNER_TEMP/compute-targets.json"
          if [[ -n "$COMPUTE_TARGETS" && "$COMPUTE_TARGETS" != "[]" ]]; then
            printf '%s' "$COMPUTE_TARGETS" > "$targets_file"
          else
            if [[ -z "$CLAIM_FILE" && -z "$FLEET_BUNDLE_URL" && ( -z "$NODE" || -z "$SSH_HOST" || -z "$SSH_HOST_KEY_SHA256" ) ]]; then
              echo "::error::provide compute_targets for the fleet, or a complete single-node claim/bundle/legacy target" >&2
              exit 1
            fi
            jq -cn \
              --arg claim_file "$CLAIM_FILE" \
              --arg fleet_bundle_url "$FLEET_BUNDLE_URL" \
              --arg fleet_bundle_signature_url "$FLEET_BUNDLE_SIGNATURE_URL" \
              --arg fleet_bundle_sha256 "$FLEET_BUNDLE_SHA256" \
              --arg node "$NODE" --arg ssh_host "$SSH_HOST" \
              --arg ssh_user "$SSH_USER" --arg ssh_port "$SSH_PORT" \
              --arg ssh_host_key_sha256 "$SSH_HOST_KEY_SHA256" \
              --arg storage_device "$STORAGE_DEVICE" \
              --argjson format_storage "$FORMAT_STORAGE" \
              --argjson skip_fleet_preflight "$SKIP_FLEET_PREFLIGHT" \
              '[{$claim_file,$fleet_bundle_url,$fleet_bundle_signature_url,$fleet_bundle_sha256,$node,$ssh_host,$ssh_user,$ssh_port,$ssh_host_key_sha256,$storage_device,$format_storage,$skip_fleet_preflight}]' \
              > "$targets_file"
          fi
          targets="$(jq -ce '
            if type != "array" or length == 0 then error("compute_targets must be a non-empty JSON array") else . end
            | map(
                if type != "object" then error("each compute target must be an object") else . end
                | {
                    claim_file: (.claim_file // ""),
                    fleet_bundle_url: (.fleet_bundle_url // ""),
                    fleet_bundle_signature_url: (.fleet_bundle_signature_url // ""),
                    fleet_bundle_sha256: (.fleet_bundle_sha256 // ""),
                    node: (.node // ""),
                    ssh_host: (.ssh_host // ""),
                    ssh_user: (.ssh_user // "root"),
                    ssh_port: ((.ssh_port // "22") | tostring),
                    ssh_host_key_sha256: (.ssh_host_key_sha256 // ""),
                    storage_device: (.storage_device // ""),
                    format_storage: (.format_storage // false),
                    skip_fleet_preflight: (.skip_fleet_preflight // false)
                  }
                | if (.claim_file == "" and .fleet_bundle_url == "" and (.node == "" or .ssh_host == "" or .ssh_host_key_sha256 == ""))
                  then error("each target needs claim_file, fleet_bundle_url, or complete node/ssh_host/ssh_host_key_sha256 fields")
                  else . end
              )' "$targets_file")"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  control:
    name: Control-plane stage
    uses: ./.github/workflows/cd-controlplane.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  compute:
    name: Compute stage (${{ matrix.target.node || matrix.target.claim_file }})
    needs: [control, plan]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/cd-compute.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      claim_file: ${{ matrix.target.claim_file }}
      fleet_bundle_url: ${{ matrix.target.fleet_bundle_url }}
      fleet_bundle_signature_url: ${{ matrix.target.fleet_bundle_signature_url }}
      fleet_bundle_sha256: ${{ matrix.target.fleet_bundle_sha256 }}
      node: ${{ matrix.target.node }}
      ssh_host: ${{ matrix.target.ssh_host }}
      ssh_user: ${{ matrix.target.ssh_user }}
      ssh_port: ${{ matrix.target.ssh_port }}
      ssh_host_key_sha256: ${{ matrix.target.ssh_host_key_sha256 }}
      storage_device: ${{ matrix.target.storage_device }}
      format_storage: ${{ matrix.target.format_storage }}
      skip_fleet_preflight: ${{ matrix.target.skip_fleet_preflight }}
    secrets: inherit

  verify:
    name: Report fleet release convergence
    if: always()
    needs: [control, compute, plan]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
      CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
      CONTROL_RESULT: ${{ needs.control.result }}
      COMPUTE_RESULT: ${{ needs.compute.result }}
      PLAN_RESULT: ${{ needs.plan.result }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Resolve desired release and set up control-plane SSH
        run: |
          set -euo pipefail
          [[ -n "$CP_HOST" && -n "$CP_SSH_KEY" ]] || {
            echo "::error::CP_HOST and CP_SSH_KEY are required to report fleet convergence" >&2
            exit 1
          }
          desired_release="$(git rev-parse HEAD)"
          [[ "$desired_release" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::selected tag did not resolve to a full git SHA" >&2
            exit 1
          }
          echo "DESIRED_RELEASE=$desired_release" >> "$GITHUB_ENV"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$CP_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          ssh-keyscan -H "$CP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 0600 ~/.ssh/known_hosts

      - name: Observe desired and active-node releases
        run: |
          set -uo pipefail
          status_file="$RUNNER_TEMP/fleet-release-status.json"
          error_file="$RUNNER_TEMP/fleet-release-status.stderr"
          # A failed compute stage is already terminal. Observe once so the
          # summary captures desired/observed state without hiding the failure
          # behind another wait. A successful stage gets two heartbeat periods
          # to publish its final release and liveness state.
          gate_timeout=2m
          if [[ "$PLAN_RESULT" != "success" || "$CONTROL_RESULT" != "success" || "$COMPUTE_RESULT" != "success" ]]; then
            gate_timeout=0
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@${CP_HOST}" \
            "/usr/local/bin/gregalectl compute-nodes release-status --desired-release '${DESIRED_RELEASE}' --timeout '${gate_timeout}' --poll-interval 10s --break-glass-db -json" \
            >"$status_file" 2>"$error_file"
          gate_exit=$?

          {
            echo "### Platform rollout ${RELEASE_TAG}"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Control plane | ${CONTROL_RESULT} |"
            echo "| Compute target plan | ${PLAN_RESULT} |"
            echo "| Compute fleet matrix | ${COMPUTE_RESULT} |"
            echo "| Active-node release gate | exit ${gate_exit} |"
            echo
            echo '```json'
            if [[ -s "$status_file" ]]; then
              cat "$status_file"
            else
              printf '{"desired_release":"%s","ready":false,"failure_reason":"release_status_unavailable"}\n' "$DESIRED_RELEASE"
            fi
            echo '```'
            if [[ -s "$error_file" ]]; then
              echo
              echo '<details><summary>Release gate stderr</summary>'
              echo
              echo '```text'
              cat "$error_file"
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PLAN_RESULT" != "success" || "$CONTROL_RESULT" != "success" || "$COMPUTE_RESULT" != "success" || "$gate_exit" -ne 0 ]]; then
            echo "::error::platform rollout failed: plan=${PLAN_RESULT} control=${CONTROL_RESULT} compute=${COMPUTE_RESULT} active-node-gate=${gate_exit}" >&2
            exit 1
          fi
          active_node_count="$(jq -er '.active_node_count | select(. > 0)' "$status_file")"
          echo "ACTIVE_NODE_COUNT=$active_node_count" >> "$GITHUB_ENV"

      - name: Verify control-plane origin liveness and readiness
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@${CP_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for endpoint in healthz readyz; do
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --connect-timeout 3 --max-time 10 \
              "http://127.0.0.1:9092/${endpoint}" >/dev/null
          done
          REMOTE

      - name: Verify public customer API path
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/public-platform-status.json"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --connect-timeout 3 --max-time 10 \
            --header 'Cache-Control: no-cache' \
            "https://api.gregale.dev/v1/status?rollout_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > "$status_file"
          jq -e '
            .data_status == "fresh" and
            (.updated_at | type == "string" and length > 0)
          ' "$status_file" >/dev/null

      - name: Verify full-fleet metrics and metering convergence
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@${CP_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          targets_file="$(mktemp)"
          metrics_file="$(mktemp)"
          trap 'rm -f "$targets_file" "$metrics_file"' EXIT

          for _ in $(seq 1 24); do
            targets_ok=0
            metering_ok=0
            if curl -fsS http://127.0.0.1:9095/api/v1/targets >"$targets_file" &&
              python3 - "$targets_file" <<'PY'
          import json
          import sys

          targets = json.load(open(sys.argv[1]))["data"]["activeTargets"]
          raise SystemExit(0 if targets and all(t.get("health") == "up" for t in targets) else 1)
          PY
            then
              targets_ok=1
            fi

            if curl -fsS http://127.0.0.1:9106/metrics >"$metrics_file" &&
              python3 - "$metrics_file" <<'PY'
          import re
          import sys

          values = {}
          for line in open(sys.argv[1]):
              match = re.fullmatch(r"(meterd_fleet_stats_(?:expected|connected)_nodes) ([0-9.eE+-]+)\n?", line)
              if match:
                  values[match.group(1)] = float(match.group(2))
          expected = values.get("meterd_fleet_stats_expected_nodes", 0)
          connected = values.get("meterd_fleet_stats_connected_nodes", -1)
          raise SystemExit(0 if expected > 0 and connected == expected else 1)
          PY
            then
              metering_ok=1
            fi

            if (( targets_ok == 1 && metering_ok == 1 )); then
              exit 0
            fi
            sleep 5
          done

          echo "Prometheus target health:" >&2
          cat "$targets_file" >&2 || true
          echo "Meterd fleet connectivity:" >&2
          grep '^meterd_fleet_stats_\(expected\|connected\)_nodes ' "$metrics_file" >&2 || true
          exit 1
          REMOTE

      - name: Exercise app and function deployments through production ingress
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@${CP_HOST}" \
            "env RELEASE_SHA='${DESIRED_RELEASE}' RUN_ID='${GITHUB_RUN_ID_VALUE}' ACTIVE_NODE_COUNT='${ACTIVE_NODE_COUNT}' bash -s" \
            < deploy/scripts/production-release-acceptance.sh
