name: scenario real VM acceptance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Lifecycle profile to exercise
        type: choice
        options: [all, warm, cold, restored]
        default: all

permissions:
  contents: read

concurrency:
  group: scenario-real-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  customer-export:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: scenario-acceptance
    env:
      FAAS_API: ${{ vars.GREGALE_ACCEPTANCE_API_URL }}
      FAAS_TOKEN: ${{ secrets.GREGALE_ACCEPTANCE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check acceptance configuration
        run: |
          test -n "$FAAS_API" || { echo '::error::Set scenario-acceptance variable GREGALE_ACCEPTANCE_API_URL'; exit 1; }
          test -n "$FAAS_TOKEN" || { echo '::error::Set scenario-acceptance secret GREGALE_ACCEPTANCE_TOKEN'; exit 1; }
          curl --fail --silent --show-error --max-time 15 "$FAAS_API/healthz" >/dev/null
      - name: Build scenario CLI
        run: go build -o bin/gregale ./cmd/gregale
      - name: Run real VM customer export
        run: |
          ./bin/gregale test \
            --manifest tests/scenario-acceptance/gregale-test.yaml \
            --scenario customer-export \
            --engine real-vm \
            --profile '${{ inputs.profile }}' \
            --report customer-export-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-export-real-vm-${{ inputs.profile }}
          path: customer-export-report.json
          if-no-files-found: warn
          retention-days: 14
