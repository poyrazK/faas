name: ci-light

# Light tier: runs on every pull request push and every merge to main, with a
# budget of about 10 minutes per job.
#
# CI is split into two tiers so the full suite runs a few times a day instead
# of on every push (it was ~25 jobs x 150-480 runs/day, saturating the hosted
# runner pool and pushing PR feedback past 90 minutes):
#
#   ci-light.yml (this file)  golangci-lint (govet included) of changed
#                             packages and `go vet` of the importers that use
#                             a changed exported name; -race tests of changed
#                             packages and the §6.2 invariants; for
#                             cmd/gregale, pkg/state and pkg/apid/apidserver
#                             only the tests related to the change, without
#                             -race (scripts/ci/select_package_tests.py);
#                             boot-contract, generated-code drift, policy
#                             gates, version-skew (N±1) checks and migration
#                             ID/expand-contract/apply/replay checks.
#                             Three test shards, no gate job.
#   ci.yml (mega)             the complete suite: every unit shard with -race,
#                             vet and build of the whole tree, e2e, migration
#                             history, container/UDP contracts, flags, load,
#                             SDK acceptance, ops/infra gates. Runs nightly
#                             and on workflow_dispatch. It gates no release
#                             (ADR 20261018104452): this tier is the only
#                             pre-release CI.
#
# Package selection lives in scripts/ci/affected_packages.py. This workflow
# lints changed packages and compiles selected importers within a budget;
# the mega tier owns full-tree coverage, including global-input changes.
#
# Required checks on main are the job names below; a job skipped because
# nothing relevant changed reports as passing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-light-${{ github.ref }}
  # Supersede stale pull-request pushes. Main runs queue instead, so every
  # merge gets its own light verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # check_migration_version_hygiene.sh reads open pull requests.
  pull-requests: read

env:
  # Keep in lock-step with ci.yml and go.mod's toolchain directive.
  GO_VERSION: "1.26.9"
  VACUUM_VERSION: "0.29.10"
  VACUUM_SHA256_LINUX_AMD64: "84a596d5f88dd42f6f020376e5d2c2a29e6e51cc4b5614828f03dda122457a03"
  SQLC_VERSION: "1.31.1"
  SQLC_SHA256_LINUX_AMD64: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
  PROTOC_VERSION: "33.6"
  PROTOC_SHA256_LINUX_AMD64: "9c49962391ff8b5754342509efc3885db91dfe11a358e1e98c9a71518f0ad199"

jobs:
  service-binding-contract:
    name: service-binding SDK contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: install Python contract dependencies
        run: python -m pip install ruamel.yaml pytest -e sdk/python
      - name: OpenAPI schema and shared fixture coverage
        run: |
          python scripts/sync_binding_runner.py --check
          python scripts/ci/check-service-binding-sdk-contract.py
          python scripts/ci/test_service_binding_sdk_contract.py
      - name: Go SDK contracts
        working-directory: sdk/go
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Node SDK contracts
        working-directory: sdk/node
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:build
          node --test dist-test/test/service-binding-contract.test.js dist-test/test/service-binding-plan.test.js
      - name: Python SDK contracts
        working-directory: sdk/python
        run: python -m pytest tests/test_service_binding_contract.py tests/test_service_binding_plan.py -q

  storage-node-starter:
    uses: ./.github/workflows/storage-node-starter.yml
    permissions:
      contents: read

  lint:
    name: "light: lint, vet, build"
    runs-on: ubuntu-latest
    # golangci-lint (govet included) runs on changed packages.
    # Importer compilation is bounded below;
    # the mega tier vets the whole tree. Main also warms the three large
    # packages' analysis cache.
    # Cold caches and broad API/state changes need room for every selected
    # package; per-package limits remain.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # PR-4a scans every commit subject; the diff base must be present.
          # A blobless clone keeps full history without downloading old blobs.
          fetch-depth: 0
          filter: blob:none
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # The light tier owns the go-lint family (golangci-lint analysis cache
      # included): main pushes save it, pull requests only restore it.
      - name: restore Go build + lint cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-lint-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-go${{ env.GO_VERSION }}-
            go-lint-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: select changed packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull_request checkout is the merge commit: its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly the PR's change.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"
          python3 scripts/ci/affected_packages.py summary < "$RUNNER_TEMP/changed-paths.txt"
          echo "LINT_SELECTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          {
            echo "base=$base"
            echo "changed=$(python3 scripts/ci/affected_packages.py changed < "$RUNNER_TEMP/changed-paths.txt")"
            echo "go_files=$(grep -E '\.go$' "$RUNNER_TEMP/changed-paths.txt" | while read -r f; do [[ -f "$f" ]] && printf '%s ' "$f"; done)"
          } >> "$GITHUB_OUTPUT"

      # S4 PR-4a: a fix claim must carry a changed Go regression test.
      - name: fix-shaped changes require regression tests
        run: make fix-has-test-check
      - name: gofmt (changed files)
        if: steps.select.outputs.go_files != ''
        env:
          GO_FILES: ${{ steps.select.outputs.go_files }}
        run: |
          # shellcheck disable=SC2086 # space-separated path list
          unformatted="$(gofmt -l $GO_FILES)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      # No separate `go vet`: golangci-lint below runs govet on every changed
      # package (test files included). Type-checking their importers meant
      # compiling 200+ packages whenever pkg/api changed (25 minutes); the
      # mega tier (ci.yml) builds and vets the whole tree nightly.
      # Same linter, rules and per-package invocation as the mega tier's
      # sharded `Go lint` jobs (scripts/ci/lint_go_shard.py), restricted to the
      # packages this change touches. The complete tree is linted nightly;
      # a lint-config change is validated here by
      # `config verify` and fully exercised by the next mega run.
      - name: install linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
          skip-cache: true
      - name: validate lint configuration
        run: |
          golangci-lint config verify
          python3 scripts/ci/check_gosec_baseline.py
      - name: lint (changed packages)
        if: steps.select.outputs.changed != ''
        env:
          PKGS: ${{ steps.select.outputs.changed }}
          # The mega tier's lint bounds: the whole 4-core, 16 GB runner.
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver_test=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1"'
          GOMEMLIMIT: 10GiB
          GOGC: 100
          GOMAXPROCS: 4
        run: |
          failed=()
          for pkg in $PKGS; do
            echo "Checking $pkg"
            golangci-lint run --timeout=20m "$pkg" || failed+=("$pkg")
          done
          if (( ${#failed[@]} )); then
            echo "::error::lint failed for: ${failed[*]}"
            exit 1
          fi
      # golangci-lint compiles only the changed packages. An unchanged
      # importer breaks when an exported name it uses changes under it (a
      # signature, a field, a constant), so vet exactly those importers
      # (scripts/ci/select_importers.py); a body edit selects none. The mega
      # tier vets every package nightly.
      #
      # A change to a widely used API can select ~100 importers and recompile
      # most of the module (11 minutes at 4 cores for #4809). The check runs
      # most specific importers first, in batches, and stops 13 minutes after
      # package selection so the job stays under 15; any importers left over
      # are named in a warning and left to the mega tier.
      - name: compile importers that use changed exported names
        if: steps.select.outputs.changed != ''
        env:
          BASE: ${{ steps.select.outputs.base }}
          BUDGET_SECONDS: "780"
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver_test=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1"'
          GOMEMLIMIT: 10GiB
          GOGC: 100
          GOMAXPROCS: 4
        run: |
          set -euo pipefail
          read -r -a pkgs <<<"$(python3 scripts/ci/select_importers.py --base "$BASE" < "$RUNNER_TEMP/changed-paths.txt")"
          (( ${#pkgs[@]} )) || exit 0
          deadline=$((SECONDS + LINT_SELECTED_AT + BUDGET_SECONDS - $(date +%s)))
          i=0
          while (( i < ${#pkgs[@]} )) && (( SECONDS < deadline )); do
            # apidserver's external tests import its internal test variant,
            # so vetting it holds about 5 GB: it goes alone.
            if [[ "${pkgs[i]}" == ./pkg/apid/apidserver ]]; then
              batch=("${pkgs[i]}"); i=$((i + 1))
            else
              batch=()
              while (( i < ${#pkgs[@]} && ${#batch[@]} < 8 )) && [[ "${pkgs[i]}" != ./pkg/apid/apidserver ]]; do
                batch+=("${pkgs[i]}"); i=$((i + 1))
              done
            fi
            # A batch cut off by the budget is unchecked, not failed.
            status=0
            timeout "$((deadline - SECONDS))" go vet "${batch[@]}" || status=$?
            if (( status == 124 )); then
              i=$((i - ${#batch[@]}))
              break
            elif (( status != 0 )); then
              exit "$status"
            fi
          done
          if (( i < ${#pkgs[@]} )); then
            echo "::warning::importer compile check reached the job's 15-minute budget; not checked here (the mega tier vets them): ${pkgs[*]:i}"
          fi
      # Main pushes lint cmd/gregale, pkg/state and pkg/apid/apidserver even
      # when unchanged, so the saved cache holds their dependencies' export
      # data and analysis facts: a pull request touching one of them then
      # re-analyses only what it changed (about a minute, not ten).
      - name: warm the large packages' lint cache (main)
        if: github.ref == 'refs/heads/main'
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver_test=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1"'
          GOMEMLIMIT: 10GiB
          GOGC: 100
          GOMAXPROCS: 4
        run: |
          for shard in 1 2 3; do
            pkg="$(python3 scripts/ci/affected_packages.py pinned --shard "$shard" --shards 3 < /dev/null)"
            echo "Warming $pkg"
            golangci-lint run --timeout=20m "$pkg" >/dev/null \
              || echo "::warning::golangci-lint reports findings in $pkg on main; the mega tier's lint shards fail on them"
          done
      - name: save Go build + lint cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  checks:
    name: "light: codegen, policy, migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Main pushes save this family; pull requests only restore it.
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-light-checks-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-light-checks-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-
            go-light-checks-${{ runner.os }}-
            go-checks-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: resolve diff base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull_request checkout is the merge commit: its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly the PR's change.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          echo "LIGHT_DIFF_BASE=$base" >> "$GITHUB_ENV"

      # ---- policy gates (static, seconds each) ----
      - name: light-tier package selector tests
        run: |
          python3 scripts/ci/affected_packages_test.py
          python3 scripts/ci/select_package_tests_test.py
          python3 scripts/ci/select_importers_test.py
          python3 scripts/ci/cancel_conflicted_pr_runs_test.py
      - name: release-safety tool tests (migration lint, SLO gate)
        run: |
          python3 scripts/ci/check_migration_expand_contract_test.py
          python3 scripts/ci/slo_gate_test.py
      - name: per-unit release selection and planning tests
        run: |
          python3 scripts/ci/host_roles_test.py
          python3 scripts/ci/affected_units_test.py
          python3 scripts/ci/plan_unit_deploy_test.py
          python3 scripts/ci/plan_host_config_test.py
          python3 scripts/ci/plan_edge_rollout_test.py
          bash scripts/unit-release-verify_test.sh
          bash scripts/ci/unit_deploy_test.sh
          bash scripts/ci/verify_unit_release_test.sh
      - name: MemStore stub guard
        run: make memstore-stubs-check
      - name: daemon environment contract
        run: make env-contract-check
      - name: restore-drill script contract
        run: make lint-drill
      - name: forbid mutating SQL in normal runbooks
        run: make runbook-sql-check
      - name: post-mortem artifact check
        run: make test-postmortems
      - name: restore-drill evidence freshness (M8 claim)
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'm8-done') }}
        run: make m8-evidence-check

      # ---- generated-code drift ----
      - name: generate-check
        run: make generate-check
      - name: sdk-check
        run: make sdk-check
      - name: install sqlc
        run: |
          set -euo pipefail
          SQLC_TARBALL="sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          TAR="$RUNNER_TEMP/${SQLC_TARBALL}"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output "$TAR" "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/${SQLC_TARBALL}"
          echo "${SQLC_SHA256_LINUX_AMD64}  $TAR" | sha256sum --check --strict
          mkdir -p "$HOME/.local/sqlc/bin"
          tar --extract --gzip --file "$TAR" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/sqlc" "$HOME/.local/sqlc/bin/sqlc"
          echo "$HOME/.local/sqlc/bin" >> "$GITHUB_PATH"
      - name: sqlc-check
        run: make sqlc-check
      - name: install protoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl --fail --silent --show-error --location --output "$ZIP" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256_LINUX_AMD64}  $ZIP" | sha256sum --check --strict
          (cd "$RUNNER_TEMP" && unzip -q "$ZIP")
          sudo install -m 0755 "$RUNNER_TEMP/bin/protoc" /usr/local/bin/protoc
          sudo cp -r "$RUNNER_TEMP/include/google" /usr/local/include/
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: proto-check
        run: make proto-check
      # Units deploy independently, so release N runs beside N-1. Compares
      # the gRPC protos and the host/guest JSON files (pkg/api AppManifest,
      # BuildManifest, BuildDone) with the previous release tag; needs the
      # protoc installed above and the tags fetch-depth 0 brings.
      - name: version skew (protos and guest protocol vs the previous release)
        run: go run ./scripts/ci/versionskew -base "$LIGHT_DIFF_BASE"
      - name: install vacuum
        run: |
          set -euo pipefail
          VACUUM_TARBALL="vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz"
          TAR="$RUNNER_TEMP/${VACUUM_TARBALL}"
          curl --fail --silent --show-error --location --output "$TAR" \
            "https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/${VACUUM_TARBALL}"
          echo "${VACUUM_SHA256_LINUX_AMD64}  $TAR" | sha256sum --check --strict
          mkdir -p "$HOME/.local/vacuum/bin"
          tar --extract --gzip --file "$TAR" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/vacuum" "$HOME/.local/vacuum/bin/vacuum"
          echo "$HOME/.local/vacuum/bin" >> "$GITHUB_PATH"
      - name: spec-check
        run: make spec-check

      # ---- migrations: ID hygiene always, database checks when they change ----
      # The hygiene gate compares against main and every open pull request, so
      # it must run on every change to prevent version collisions at merge.
      - name: migration version hygiene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make migration-version-hygiene-check
      # New migrations must be online-safe for the previous release still
      # running: expand/contract, lock_timeout, no blocking index builds.
      - name: migration expand/contract lint
        run: python3 scripts/ci/check_migration_expand_contract.py --base "$LIGHT_DIFF_BASE"
      - name: migrations check (static)
        run: make migrations-check
      - name: select migration changes
        id: migrations
        run: |
          set -euo pipefail
          base="$LIGHT_DIFF_BASE"
          if git diff --name-only "$base" HEAD | grep -qE '^(migrations/|schema\.sql$|go\.(mod|sum)$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          versions="$(git diff --name-only --diff-filter=A "$base" HEAD -- 'migrations/*.sql' \
            | sed -nE 's|.*/([0-9]+)_.*\.sql$|\1|p' | sort -u | paste -sd, -)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "added migration versions: ${versions:-<none>}"
      - name: migrations apply-and-walk
        if: steps.migrations.outputs.changed == 'true'
        run: go test -race -count=1 -v -run TestMigrationsApplyAndWalk ./migrations/...
      - name: migrations replay-safety (new migrations only)
        if: steps.migrations.outputs.changed == 'true'
        env:
          FAAS_REPLAY_CHECK_VERSIONS: ${{ steps.migrations.outputs.versions }}
        run: bash scripts/ci/migrations-replay-safety.sh
      - name: save Go build + test cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-light-checks-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  tests:
    name: "light: tests (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    # Changed packages run in full with -race. Each shard also runs related
    # tests of one large package (cmd/gregale, pkg/state or pkg/apid/apidserver;
    # see SELECTIVE_SHARD in affected_packages.py), without -race. The mega
    # tier (ci.yml) runs every suite in full with -race nightly and before
    # every release. Main pushes also warm the large-package build for PRs.
    # Cold native fixtures and large-package builds can exceed 20 minutes.
    # Use main's budget on PRs too; the Go test deadlines below stay bounded.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Native clone fixtures pin pg_database/pg_roles across SQL phases.
      # Private databases still share those catalogues with other packages;
      # their concurrent create/drop cleanup must not mutate state fixtures.
      postgres_state:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      # Handler fixtures clone one fully migrated template database.
      FAAS_PGTEST_TEMPLATE_DATABASE: "1"
      SPLIT_DATABASE_URL: postgres://faas:faas@localhost:5433/faas?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Main pushes save one family per shard; pull requests only restore.
      # The race-built pg shard 1 family is the cold-start fallback.
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-light-test-${{ matrix.shard }}-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-light-test-${{ matrix.shard }}-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-
            go-light-test-${{ matrix.shard }}-${{ runner.os }}-
            go-pg-1-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: select changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull_request checkout is the merge commit: its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly the PR's change.
          base="$(git rev-parse HEAD^1)"
          if [[ "$EVENT_NAME" != "pull_request" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if git fetch -q --depth=1 origin "$BEFORE" && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"
          echo "LIGHT_DIFF_BASE=$base" >> "$GITHUB_ENV"
      # pkg/managedpostgres durable credential qualification delivers
      # credentials over native TLS (mega pg shard 2b does the same). Enabling
      # it only turns ssl on; non-TLS clients are unaffected.
      - name: enable PostgreSQL TLS for credential qualification
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          SPLIT_POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres_state.id }}
        run: |
          bash scripts/ci/enable_postgres_tls.sh "$POSTGRES_SERVICE_CONTAINER"
          bash scripts/ci/enable_postgres_tls.sh "$SPLIT_POSTGRES_SERVICE_CONTAINER"
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: '22'
      - name: queue worker safe completion canary
        if: matrix.shard == 1
        run: |
          if grep -qE '^(cmd/gregale/templates/(queue-worker/|starter_handlers_test.go)|\.github/workflows/ci(-light)?\.yml)' "$RUNNER_TEMP/changed-paths.txt"; then
            go test -race -p 1 ./cmd/gregale/templates -run '^TestQueueWorkerStarter' -count=1
          fi
      - name: native M9 gate contracts (no KVM)
        if: matrix.shard == 1
        run: |
          if grep -qE '^(tests/native/m9/|scripts/ci/(native-m9-|run-native-m9-)|Makefile|\.github/workflows/ci(-light)?\.yml)' "$RUNNER_TEMP/changed-paths.txt"; then
            make test-native-m9-contracts
            go test -tags=metal -run '^$' ./tests/native/m9
          fi
      - name: generated PostgreSQL starter TLS recovery
        if: matrix.shard == 1
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          GREGALE_POSTGRES_STARTER_TEST: '1'
        run: |
          if ! grep -qE '^(cmd/gregale/templates/(rest-api-postgres/|postgres_recovery_test.go|starter_handlers_test.go)|\.github/workflows/ci(-light)?\.yml)' "$RUNNER_TEMP/changed-paths.txt"; then
            exit 0
          fi
          docker cp "$POSTGRES_SERVICE_CONTAINER:/var/lib/postgresql/data/qualification-server.crt" "$RUNNER_TEMP/starter-postgres-ca.pem"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/starter-postgres-ca.pem" go test -race -p 2 ./cmd/gregale/templates -run '^TestPostgresStarterSQLRecovery$' -count=1 -v -timeout=180s
      - name: binding guest manifests and native harness contracts (no KVM)
        if: matrix.shard == 3
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1"'
          GOGC: 10
          GOMEMLIMIT: 2GiB
          GOMAXPROCS: 2
        run: |
          if ! grep -qE '^(cmd/gregale/templates/(queue-worker/|starter_handlers_test.go)|pkg/apid/apidserver/managed_postgres|pkg/managedpostgres/(guestqualification/|.*qualification|provisioning_gate)|cmd/managed-postgres-qualify/|cmd/e2e/(managed_postgres_native|object_storage_native|queue_binding_native)|pkg/e2etest/(postgresfixture/|postgresstarter/|postgres_guest_manifest|storagefixture/|storagestarter/|storage_guest_manifest|queuestarter/|queue_(catalog|guest_manifest)|buildtags)|scripts/(test-(managed-postgres|object-storage|queue-bindings)-native|ci/((managed-postgres|object-storage|queue-bindings)-native|native_guest_evidence))|\.github/workflows/ci(-light)?\.yml)' "$RUNNER_TEMP/changed-paths.txt"; then
            exit 0
          fi
          python3 scripts/ci/managed-postgres-native-verdict_test.py
          python3 scripts/ci/object-storage-native-verdict_test.py
          python3 scripts/ci/queue-bindings-native-verdict_test.py
          python3 scripts/ci/queue-bindings-native-runner_test.py
          sh -n scripts/test-queue-bindings-native.sh
          go test -race -p 1 ./pkg/managedpostgres/guestqualification ./pkg/e2etest/postgresstarter ./pkg/e2etest/queuestarter
          go test -race -p 1 ./pkg/e2etest -run '^Test(PostgresGuest|StorageGuest|QueueGuest)'
      - uses: actions/setup-python@v7
        if: matrix.shard == 1
        with:
          python-version: '3.12'
      - name: generated Python PostgreSQL starter TLS recovery
        if: matrix.shard == 1
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if ! grep -qE '^(cmd/gregale/templates/(rest-api-postgres-python/|python_postgres_test.go|embed.go)|pkg/e2etest/postgresstarter/|sdk/python/(faas_sdk/|scripts/sync_binding_starters.py|tests/(async_storage_fixture.py|test_async.*storage))|examples/object-storage-rotation-python/|scripts/ci/test_python_postgres_starter.sh|\.github/workflows/ci(-light)?\.yml)' "$RUNNER_TEMP/changed-paths.txt"; then
            exit 0
          fi
          docker cp "$POSTGRES_SERVICE_CONTAINER:/var/lib/postgresql/data/qualification-server.crt" "$RUNNER_TEMP/python-starter-postgres-ca.pem"
          bash scripts/ci/test_python_postgres_starter.sh "$RUNNER_TEMP/python-starter-postgres-ca.pem"
      - name: generated Python storage starter HTTPS and recovery
        if: matrix.shard == 1
        run: |
          if ! grep -qE '^(cmd/gregale/templates/(object-storage-python/|python_storage_test.go|embed.go)|sdk/python/(faas_sdk/|scripts/sync_binding_starters.py)|scripts/ci/test_python_storage_starter.sh|\.github/workflows/ci(-light)?\.yml)' "$RUNNER_TEMP/changed-paths.txt"; then
            exit 0
          fi
          bash scripts/ci/test_python_storage_starter.sh
      # The managed-Postgres fixture API check and the GitOps native e2e
      # compile build apidserver and cmd/e2e under extra build tags, which
      # nothing caches: 18 minutes on their own. The mega tier runs both (pg
      # shard 2b) nightly.
      # Two kinds of package per shard:
      #   - changed packages (and the §6.2 invariants in tests/property when
      #     anything in their import tree changed) run in full with -race;
      #   - the shard's pinned large package (cmd/gregale, pkg/state or
      #     pkg/apid/apidserver), when changed, runs only the tests
      #     scripts/ci/select_package_tests.py relates to the change, capped,
      #     without -race. The mega tier runs those suites in full with -race.
      # The race build of cmd/apid can exhaust hosted-runner memory, so race
      # test binaries compile first under the mega pg shard 1 bounds.
      - name: tests (changed packages, invariants and related large-suite tests)
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1"'
          SHARD: ${{ matrix.shard }}
          # Cap related tests independently of the cold build allowance.
          SELECTIVE_CAP: "150"
        run: |
          set -euo pipefail
          PKGS="$(python3 scripts/ci/affected_packages.py test --shard "$SHARD" --shards 3 < "$RUNNER_TEMP/changed-paths.txt")"
          LARGE="$(python3 scripts/ci/affected_packages.py selective --shard "$SHARD" --shards 3 < "$RUNNER_TEMP/changed-paths.txt")"
          if [[ -z "$PKGS" && -z "$LARGE" ]]; then
            echo "no affected Go packages assigned to shard $SHARD"
            exit 0
          fi
          status=0
          if [[ -n "$PKGS" ]]; then
            echo "::group::compile race test binaries (bounded memory)"
            # shellcheck disable=SC2086 # space-separated package list
            GOMEMLIMIT=2GiB GOGC=10 GOMAXPROCS=2 go test -race -count=1 -run '^$' $PKGS
            echo "::endgroup::"
            echo "testing with -race: $PKGS"
            # shellcheck disable=SC2086 # space-separated package list
            GOMEMLIMIT=2GiB GOGC=10 GOMAXPROCS=2 go test -race -count=1 -p 4 -timeout=10m $PKGS || status=1
          fi
          for pkg in $LARGE; do
            run="$(python3 scripts/ci/select_package_tests.py --package "${pkg#./}" --cap "$SELECTIVE_CAP" --base "$LIGHT_DIFF_BASE" < "$RUNNER_TEMP/changed-paths.txt")"
            if [[ -z "$run" ]]; then
              echo "$pkg: no tests relate to this change; the mega tier runs its full suite"
              continue
            fi
            (
              # pkg/state verifies the whole PostgreSQL catalogue; it keeps the
              # shard's second service to itself.
              [[ "$pkg" == ./pkg/state ]] && export DATABASE_URL="$SPLIT_DATABASE_URL"
              echo "testing related tests of $pkg (no -race)"
              go test -count=1 -timeout=8m -run "$run" "$pkg"
            ) || status=1
          done
          exit "$status"
      # Main pushes warm each shard's large-package test build (no -race, as
      # pull requests run it) so a pull request touching that package only
      # recompiles what it changed.
      - name: warm the shard's large-package test build (main)
        if: github.ref == 'refs/heads/main'
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1"'
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          pkg="$(python3 scripts/ci/affected_packages.py pinned --shard "$SHARD" --shards 3 < /dev/null)"
          go test -count=1 -run '^$' "$pkg"
      - name: save Go build + test cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-light-test-${{ matrix.shard }}-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # Daemons must boot from production-rendered config with production
  # capabilities (issue #1529 S3). Same job and context name as the mega tier,
  # so the existing required check keeps gating every pull request.
  boot-contract:
    name: boot-contract (production config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      FAAS_SKIP_PG_TESTS: ""
    steps:
      - uses: actions/checkout@v7
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-light-boot-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-light-boot-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-
            go-light-boot-${{ runner.os }}-
            go-e2e-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: boot-contract tests
        # GitHub-hosted runners retain CAP_SYS_ADMIN in CapBnd even though the
        # unprivileged runner user has no effective capabilities. Production
        # faas-imaged.service removes it from CapabilityBoundingSet and refuses
        # to boot when it is reachable. Reproduce that security boundary before
        # dropping back to the runner uid for the test process.
        run: |
          BOOT_CONTRACT_PATH="$PATH"
          sudo -E setpriv \
            --bounding-set=-sys_admin \
            --reuid "$(id -u)" \
            --regid "$(id -g)" \
            --init-groups \
            --no-new-privs \
            -- env "PATH=$BOOT_CONTRACT_PATH" \
            go test -race -count=1 -timeout=12m -run '^TestBootContract_' ./cmd/e2e/...
      - name: save Go build + test cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-light-boot-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
