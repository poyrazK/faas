name: service-binding SDK contract

# The shared service-binding contract across the Go, Node and Python SDKs,
# the OpenAPI schema and fixtures, and the native binding test inventory
# (no KVM). Moved out of ci-light.yml, where it ran on every pull request
# push and every merge to main without being a required check
# (docs/adr/20261029121500-light-pull-request-ci.md). Pull requests run it
# only when its own inputs change; ci.yml runs it nightly and on dispatch.

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "sdk/**"
      - "pkg/bindingrun/**"
      - "pkg/api/limits.go"
      - "pkg/api/binding_verification_*.go"
      # nativetestinventory reads every metal-tagged test file here.
      - "cmd/e2e/*_test.go"
      # The suite contracts scripts/ci/binding-native-suites.json names.
      - "pkg/e2etest/*/contract.json"
      - "pkg/managedpostgres/guestqualification/contract.json"
      - "scripts/sync_binding_runner.py"
      - "scripts/ci/check-service-binding-sdk-contract.py"
      - "scripts/ci/test_service_binding_sdk_contract.py"
      - "scripts/ci/nativetestinventory/**"
      - "scripts/ci/binding-native-*"
      - "scripts/ci/native-e2e-phases*"
      - "scripts/ci/run-binding-native.sh"
      - "scripts/ci/package-binding-native-source.sh"
      - ".github/workflows/service-binding-contract.yml"
  # Nightly and on dispatch: ci.yml calls this workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  # A literal name: when ci.yml calls this workflow, github.workflow is the
  # caller's name, which the other called suites would share.
  group: service-binding-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in lock-step with ci-light.yml and go.mod's toolchain directive.
  GO_VERSION: "1.26.10"

jobs:
  service-binding-contract:
    name: service-binding SDK contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.10.0'
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: install Python contract dependencies
        run: python -m pip install ruamel.yaml pytest -e sdk/python
      - name: OpenAPI schema and shared fixture coverage
        run: |
          python scripts/sync_binding_runner.py --check
          python scripts/ci/check-service-binding-sdk-contract.py
          python scripts/ci/test_service_binding_sdk_contract.py
      - name: Native binding discovery and evidence contracts (no KVM)
        run: |
          go test -race ./scripts/ci/nativetestinventory
          go run ./scripts/ci/nativetestinventory --check
          bash scripts/ci/native-e2e-phases_test.sh
          python scripts/ci/binding-native-lane_test.py
          python scripts/ci/binding-native-host_test.py
          bash -n scripts/ci/run-binding-native.sh scripts/ci/package-binding-native-source.sh
      - name: Go SDK contracts
        working-directory: sdk/go
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Node SDK contracts
        working-directory: sdk/node
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:build
          node --test dist-test/test/service-binding-contract.test.js dist-test/test/service-binding-plan.test.js
      - name: Python SDK contracts
        working-directory: sdk/python
        run: python -m pytest tests/test_service_binding_contract.py tests/test_service_binding_plan.py -q
