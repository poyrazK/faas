name: Data pipeline acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pkg/datapipeline/**'
      - 'pkg/apid/datapipelines/**'
      - 'pkg/apid/apidserver/data_pipelines.go'
      - 'pkg/managedpostgres/**'
      - 'pkg/api/data_pipelines.go'
      - 'pkg/api/limits.go'
      - 'cmd/gregale/**'
      - 'migrations/**'
      - 'scripts/test-data-pipeline.sh'
      - '.github/workflows/data-pipelines.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: 2
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix cmd/gregale/templates/data-api
      - run: make test-data-pipeline
