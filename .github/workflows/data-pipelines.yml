name: Data pipeline acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only this suite's own code. Shared hot paths (cmd/gregale/**,
    # migrations/**, Makefile, pkg/api/limits.go, sqlc.yaml, the control-plane
    # Ansible role) triggered 25 of 30 sampled runs on pull requests that did
    # not touch pipelines; ci.yml runs this suite nightly and on dispatch.
    paths:
      - 'pkg/datapipeline/**'
      - 'pkg/connectioncapacity/**'
      - 'pkg/apid/datapipelines/**'
      - 'pkg/apid/apidsource/**'
      - 'pkg/apid/apidserver/data_pipeline*'
      - 'pkg/apid/apidserver/data_pipelines.go'
      - 'pkg/managedpostgres/**'
      - 'pkg/api/data_pipelines.go'
      - 'pkg/api/data_pipeline_*.go'
      - 'pkg/api/data_connection_checks.go'
      - 'pkg/api/client_data_pipeline*.go'
      - 'pkg/dashboard/data_pipelines*'
      - 'pkg/dashboard/templates/data_pipelines.html'
      - 'pkg/dashboard/templates/data_pipeline_serving.html'
      - 'pkg/dashboard/data_pipeline_*'
      - 'pkg/dashboard/templates/data_pipeline_*.html'
      - 'pkg/apid/apidserver/dashboard_data_pipelines*'
      - 'cmd/gregale/commands_pipeline*'
      - 'cmd/gregale/commands_run_pipelines*'
      - 'cmd/gregale/commands_data_api_connection_budget*'
      - 'cmd/gregale/templates/data-api/**'
      - 'deploy/systemd/faas-apid-data-pipeline-worker.service'
      - 'deploy/systemd/faas-apid-data-pipeline-alert-worker.service'
      - 'pkg/commit/connection.go'
      - 'scripts/test-data-pipeline.sh'
      - 'tests/data-pipelines/**'
      - '.github/workflows/data-pipelines.yml'
  # Nightly and on dispatch: ci.yml calls this workflow.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A literal name: when ci.yml calls this workflow, github.workflow is the
  # caller's name, which the other called suites would share.
  group: data-pipelines-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: 2
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --prefix cmd/gregale/templates/data-api
      - run: python3 -m unittest discover -s tests/data-pipelines -p '*_test.py'
      - run: make test-data-pipeline
