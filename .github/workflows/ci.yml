name: ci

# One-PR CI bundle (Tier 1+2 from the CI improvement plan):
#   - go-version pinned via go.mod
#   - go mod + build cache (setup-go@v5)
#   - concurrency cancel-in-progress (PR head ref)
#   - golangci-lint (catches errcheck, staticcheck, ineffassign beyond go vet)
#   - govulncheck (Go vulnerability DB scan)
#   - Codecov coverage (project gate >= 70%; informational patch)
#   - workflow_dispatch on the metal job (manual trigger from Actions tab)
#   - status badge in README, PR template for milestone gating
#
# Dependabot (.github/dependabot.yml) and CodeQL (.github/workflows/codeql.yml)
# live as separate files alongside this one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a PR ref updates (push to the same branch)
# or main receives a new commit. Saves CI minutes and removes the
# "did my fix actually run?" confusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov + CodeQL need write to attach comments / SARIF uploads.
  # Each restricted here so the default-`read` token isn't open.
  pull-requests: write
  security-events: write

env:
  # Pinned to a patch (not a minor) so the govulncheck image-scan gate
  # and the go.mod `go 1.25.7` directive resolve to the same Go runtime.
  # go1.25.12 carries 7 stdlib vulnerabilities (GO-2026-5026/5972/6088/
  # 6089/6090/6091/6218) fixed in go1.25.13 — the image-scan gate fails
  # closed when the runner resolves "1.25" to a vulnerable patch. Bump
  # in lock-step with the go.mod `go` directive.
  GO_VERSION: "1.25.13"
  # vacuum is the OpenAPI ruleset linter used by `make spec-check`.
  # Both the version and the SHA-256 pin are mirrored from the upstream
  # checksum file at https://github.com/daveshanley/vacuum/releases — never
  # bump one without the other. The Makefile also has a `make spec-install`
  # guard for local devs; CI uses the binary download because the
  # `go install` path cross-compiles vacuum from source on every run
  # (~3 min on a cold runner cache).
  VACUUM_VERSION: "0.29.10"
  VACUUM_SHA256_LINUX_AMD64: "84a596d5f88dd42f6f020376e5d2c2a29e6e51cc4b5614828f03dda122457a03"
  # sqlc is the Postgres→Go query layer used by `make sqlc-check` (issue
  # #125). Both the version and SHA-256 pin are mirrored from the v1.31.1
  # GitHub release — never bump one without the other. The Makefile also
  # has a `make sqlc` guard for local devs; CI uses the binary download
  # because the `go install` path cross-compiles sqlc (with its cgo
  # pganalyze/pg_query_go tree) from source on every cold runner (~30 s)
  # and v1.31.1's go.mod requires Go >= 1.26, which the ubuntu-latest
  # runner (Go 1.25.13) cannot satisfy under GOTOOLCHAIN=local.
  # Same supply-chain pin pattern as vacuum above and every binary in the
  # EX44 ansible roles.
  SQLC_VERSION: "1.31.1"
  SQLC_SHA256_LINUX_AMD64: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
  # protoc is the wire-codegen tool used by `make proto-check`. We pin it
  # to the same source-of-truth release that arduino/setup-protoc@v3
  # resolves '33.x' to (v33.6, the latest 33.x line) and download the
  # zip directly from the protocolbuffers/protobuf GitHub release. The
  # SHA-256 mirrors the supply-chain pin pattern used by vacuum + sqlc
  # above and every binary in the EX44 ansible roles (cd-2 daemonunit
  # generator convention). Bumping requires editing both lines in lock-
  # step.
  #
  # Why not arduino/setup-protoc@v3: that action hits GitHub's release-
  # resolution REST API for binary lookup and is subject to the per-IP
  # unauthenticated rate limit (60/hr) — concurrent jobs across the
  # shared GH runner fleet trip it at peak load and the step flakes
  # with `API rate limit exceeded for <runner-IP>`. This direct download
  # uses `curl --fail` against the static release-asset URL (which is
  # subject only to the per-asset 5000/hr authenticated limit when
  # GITHUB_TOKEN is forwarded) and the same --check --strict sha256
  # posture the vacuum / sqlc pins use. Memory:
  # ci-arduino-protoc-rate-limit-flake.md.
  PROTOC_VERSION: "33.6"
  PROTOC_SHA256_LINUX_AMD64: "9c49962391ff8b5754342509efc3885db91dfe11a358e1e98c9a71518f0ad199"
  # promtool is downloaded from the Prometheus release tarball to lint the
  # spec §12 alert rules. Both the version and the SHA-256 pin mirror the
  # same `curl+sha256sum+tar` posture as vacuum + sqlc + protoc above and
  # the EX44 ansible roles' `prom_release_sha256` (asserted at bootstrap
  # via `make bootstrap`). The unpinned download was the source of a
  # `curl: (35) Recv failure: Connection reset by peer` flake on two
  # consecutive main-CI runs in 2026-08-14 — curl exits 35 on a torn
  # TCP connection and `tar` never runs, leaving us with a half-written
  # tarball on `/tmp` and no idea whether the bytes we got are the bytes
  # we asked for. The SHA-256 pin catches both the silent-truncation case
  # (curl returned 0 but the stream was cut short) and any future tamper
  # with a one-line `sha256sum --check --strict` mismatch. Bumping
  # requires editing both lines in lock-step.
  PROM_VERSION: "2.54.1"
  PROM_TARBALL_SHA256_LINUX_AMD64: "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f"

jobs:
  # Three parallel jobs (PR #167) so the long poles — unit tests (~4:20)
  # and spec-check (~3:54) — run in parallel instead of in series. Wall
  # time drops from 10:44 to ~max(test, unit-tests, spec-check) ≈ ~4:40.
  #
  # `test` (lint + build + small checks), `unit-tests` (race-enabled Go
  # test suite + pg integration), and `spec-check` (vacuum lint + AST
  # parity) all start independently on PR open. No `needs:` between them.
  # The job ID `test` is preserved so the commented-out `needs: test` in
  # cd-digitalocean.yml still resolves if anyone re-enables it.
  test:
    name: lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: true + cache-dependency-path is the canonical Go Actions
          # warm-cache idiom — shaves ~60s off every job on a non-first run.
          cache: true
          cache-dependency-path: go.sum

      # golangci-lint replaces bare gofmt + go vet with a curated set of
      # checks. v2.4.0+ is built with Go 1.25 and supports a go.mod
      # targeting Go 1.25 (golangci-lint v1.x is built with Go 1.23 and
      # refuses go.mod 'go 1.25.0' — see golangci/golangci-lint#5873).
      # action v8 requires golangci-lint >= v2.1.0; v9 is current.
      - name: lint (golangci-lint v8)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          args: --timeout=3m
          # Cache is built into the action; default cache key works.

      # Re-runs the same checks golangci-lint covers as a fallback, in case
      # the lint step is skipped (e.g. workflow_dispatch with no Go file
      # changes). Keeps the existing local Makefile contract honest.
      - name: gofmt
        run: test -z "$(gofmt -l $(find . -name '*.go'))" || (gofmt -l $(find . -name '*.go'); exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: make build

      # Release manifests are generated from the production topology
      # template. Keep the projection deterministic and schema-valid on every
      # PR so a release tag cannot discover template drift for the first time.
      - name: release manifest materialization
        run: bash scripts/materialize-release-manifest_test.sh

      # CI quick-wins cluster — wire missing local gates into `test` job.
      # Each target self-documents as "CI gate" in its Makefile comment
      # (Makefile:147 / :184 / :537 / :707) but `make build` (the only
      # target `test` runs today) doesn't pull them in. The `make test`
      # local aggregator wires grafana-mirror-check as a prereq, and
      # `make pre-pr` aggregates the regenerate-and-diff gates — neither
      # runs in CI. Adding them here catches drift at PR time instead
      # of at the operator's first deploy on the live host.

      # images-lock-check (Makefile:707, issue #197 B3.5/B3.6): every
      # images/*.Dockerfile FROM must be digest-pinned via
      # images/Dockerfile.lock. A failed `images-lock-update` leaves
      # sha256:REPLACE_ME_AT_MERGE_TIME placeholders that this gate
      # catches before the PR reaches main. Operator runs
      # `make images-lock-update` to resolve real digests.
      - name: images lock check (FROM digest-pinned)
        run: make images-lock-check

      # grafana-jq-check (Makefile:184, PR #837): validates every
      # dashboard JSON parses cleanly (jq -e .). `[ -f "$$f" ]` guard
      # in the target handles the asymmetry between deploy/grafana/
      # (6 files) and deploy/ansible/roles/grafana/files/ (5 files;
      # warm-snapshot has no mirror copy).
      - name: grafana dashboard JSON parse (jq -e)
        run: make grafana-jq-check

      # grafana-mirror-check (Makefile:191, PR #837): byte-identity
      # check between deploy/grafana/ and the ansible-role mirror.
      # Catches dashboard drift between the dashboard source tree and
      # what the ansible role actually deploys.
      - name: grafana mirror byte-identity
        run: make grafana-mirror-check

      # egress-check (Makefile:537): the local aggregator pre-pr runs
      # this; CI never did. On ubuntu-latest, nft is not pre-installed
      # (lives in apt: nftables) — apt-get it before invoking the target
      # so the `nft -c -f` kernel-syntax check actually runs (the
      # Makefile self-skips that sub-step when nft is absent, and also
      # self-skips the `Operation not permitted` sandbox failure on
      # GitHub-hosted runners — bridge-name guard + Go cross-check
      # still run in both cases). On macOS dev the kernel sub-step
      # self-skips; bridge-name guard + Go cross-check still run.
      - name: install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: egress check (Go renderer ↔ Jinja2 + nft syntax + bridge-name guard)
        run: make egress-check

      - name: systemd hardening gate
        run: make systemd-hardening-check

      # sealed-env-scope-check (issue #585 / ADR-127): the apid unit
      # is the only legitimate consumer of /etc/faas/sealed.env. Every
      # other daemon must use LoadCredential= or a per-daemon
      # /etc/faas/secrets/<daemon>/*.env (0400 root:root). The gate
      # walks deploy/systemd/ + deploy/controlplane/systemd/ + every
      # ansible role's files/*.service and refuses any
      # EnvironmentFile={-,}/etc/faas/sealed.env line that isn't in
      # faas-apid.service. Fail-loud; tripwire prevents future
      # re-introduction of the apid-leak pattern.
      - name: sealed.env scope gate
        run: make sealed-env-scope-check

      # +incompatible direct-dep gate (release blocker B1). Today this
      # flags github.com/stripe/stripe-go v70.15.0+incompatible (go.mod:25)
      # — v70 pre-dates the modern lookup_key primitive on PlanParams
      # (v74+), and `+incompatible` means Go will never auto-bump past
      # it. The gate stays failing until a follow-up PR upgrades stripe-go
      # to a current major; the tripwire prevents any *other* direct dep
      # from ever slipping in unannounced. See
      # scripts/ci/check_no_incompatible_deps.sh for the rationale.
      - name: forbid +incompatible direct deps
        run: make lint-incompatible-mods

      # promtool check rules — gate for spec §12 alert rules. Downloads
      # the same Prometheus release the ansible role pins
      # (deploy/ansible/roles/prometheus/defaults/main.yml:prom_version)
      # so the CI version is the production version. A broken rule
      # (typo in metric label, bad histogram_quantile, dangling
      # matcher) breaks the alert at boot, so we lint at PR time
      # instead of letting the operator find out via a 5 a.m. page
      # that never fires. Two files are linted: the consolidated
      # faas.rules.yml and the per-alert sibling
      # pkg/promqlrules/data_placement.yaml (ADR-098 §9.A, issue
      # #951).
      #
      # Note: production SHA-256 pin (prom_release_sha256) is enforced
      # by the role's assert at bootstrap (`make bootstrap`), NOT here.
      # CI's job is to lint rule syntax, not to verify production
      # pinning — those are separate concerns.
      - name: promtool check rules
        run: |
          set -euo pipefail
          PROM_TARBALL="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "/tmp/${PROM_TARBALL}" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${PROM_TARBALL}"
          echo "${PROM_TARBALL_SHA256_LINUX_AMD64}  /tmp/${PROM_TARBALL}" | sha256sum --check --strict
          tar -xzf "/tmp/${PROM_TARBALL}" -C /tmp "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo mv "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool check rules \
            deploy/ansible/roles/prometheus/files/faas.rules.yml \
            pkg/promqlrules/data_placement.yaml

      # ansible syntax gate. deploy/ansible/ is the source of truth for the
      # box's systemd units, sysctls and secret file modes, but nothing in
      # CI ever parsed it — so it rotted. When this gate was added, SIX role
      # files did not parse as YAML at all (unquoted `name:` values holding
      # a `: `, a `when:` opening with a double-quoted path, `failed_when:`
      # OR-chains whose continuation lines sat at the `-` indent), and the
      # tree failed before ansible even reached module resolution.
      #
      # That is why the deploy roles drifted from the live box: three copies
      # of faas-imaged.service existed and two were missing /srv/fc/base
      # while all three were missing /srv/fc/sigs, which crash-looped imaged
      # and took cd-digitalocean red (PR #374, #375). Nothing could have
      # caught it, because the playbook was unrunnable.
      #
      # --syntax-check both parses every file and RESOLVES every module, so
      # it also catches semantics YAML alone can't: a task-level `creates:`
      # that ansible rejects as a conflicting action statement (and which
      # silently disabled the kernel-extract idempotency guard), and a role
      # adopting a collection that requirements.yml doesn't pin.
      #
      # ansible-core is version-pinned for the same reason promtool is: the
      # gate should fail on OUR drift, not on an upstream release. Deprecation
      # warnings are printed but not fatal — ansible-core's deprecation
      # schedule is outside this repo's control.
      - name: ansible syntax-check
        run: |
          set -euo pipefail
          pip install --quiet 'ansible-core==2.21.2'
          cd deploy/ansible
          ansible-galaxy collection install -r requirements.yml
          # Gate-A: parse the complete-inventory safety preflight.
          ansible-playbook --syntax-check preflight.yml
          # Gate-B: syntax-check the only production bootstrap playbook
          # before an operator can run either role-specific target.
          ansible-playbook --syntax-check bootstrap.yml

      # Daemon smoke: every cmd/<daemon>/main.go is a one-box binary that wires
      # through pkg/wire.Daemon. `--help` must exit 0 with non-empty usage text
      # (a silent success here usually means init() truncated on a bad flag
      # spec). Catches nil-deref and broken flag wiring that `make build` alone
      # won't, in ~1 s. Mirrors the PR template checklist line `make build`.
      - name: daemon smoke (--help)
        run: |
          set -e
          # Tier A7 (ADR-070) split the legacy cmd/gatewayd/ daemon into
          # gatewayd-public + gatewayd-internal. PR-A of the tier-a7 finishing
          # cluster moves every file from cmd/gatewayd/ into cmd/gatewayd-internal/
          # and removes the legacy binary entirely; the cd-controlplane BINARIES
          # list and FAAS_SERVICES no longer reference 'gatewayd' either.
          for d in apid builderd gregale gatewayd-public gatewayd-internal imaged meterd schedd vmmd; do
            out=$(./bin/$d --help 2>&1)
            if [ -z "$out" ]; then
              echo "::error::$d --help returned no output"
              exit 1
            fi
            printf '%-9s %4d bytes\n' "$d" "${#out}"
          done

      # M1+ (ADR-013): *.pb.go is checked in; this step verifies it's in sync
      # with the .proto sources. The Makefile's proto-normalize target
      # strips the 'protoc v X.Y.Z' header comment so toolchain patch
      # bumps don't break CI; the wire bytes protoc produces are
      # unaffected. The pin stays on the 33.x line that the previous
      # arduino/setup-protoc@v3 '33.x' selection resolved to (v33.6).
      #
      # Replaces arduino/setup-protoc@v3 (memory
      # ci-arduino-protoc-rate-limit-flake.md): that action hit GitHub's
      # release-resolution REST API and flaked on per-IP rate limits at
      # peak load. The direct curl+sha256 download matches the vacuum +
      # sqlc + grype install precedent (ci.yml:469-500 / 948-973 /
      # 686-696) and is gated by `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION`
      # not being needed. `GITHUB_TOKEN` raises the asset-fetch quota
      # from 60/hr unauth to 5000/hr authenticated.
      - name: install protoc
        # Forward GITHUB_TOKEN explicitly into the step env. The runner
        # auto-injects it as a workflow-level var, but `set -u` requires
        # the variable to be referenced from inside an `env:` block —
        # otherwise `${GITHUB_TOKEN}` is unbound and the script fails
        # before the curl call lands. arduino/setup-protoc@v3 hid this
        # because it read the token via the GitHub Action runtime API.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::protoc install assumes x86_64; runner is $(uname -m)"
            exit 1
          fi
          PROTOC_TARBALL="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_TARBALL}"
          ZIP="$RUNNER_TEMP/${PROTOC_TARBALL}"
          echo "→ downloading $PROTOC_URL"
          # Authenticated release-asset fetch: 5000/hr per-token
          # (vs 60/hr per-IP unauthenticated) so the download can't
          # be tripped by the same fleet-wide rate limit the arduino
          # action used to hit. SHA-256 below is the supply-chain
          # anchor — a malicious or substituted tarball would change
          # the digest and fail the `--check --strict` step.
          curl --fail --silent --show-error --location \
            --output "$ZIP" --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$PROTOC_URL"
          echo "→ verifying SHA-256"
          echo "${PROTOC_SHA256_LINUX_AMD64}  $ZIP" | sha256sum --check --strict
          echo "→ extracting"
          # The zip lays out bin/protoc + include/google/protobuf/*.proto
          # (e.g. timestamp.proto, any.proto — every well-known type the
          # repo's .proto files import). We install BOTH into
          # /usr/local: the binary lands on PATH automatically, and the
          # include dir lands at protoc's default search path
          # (/usr/local/include/google/protobuf/...). No Makefile change
          # needed — the local-dev recipe (brew install protobuf)
          # produces the same /usr/local/include layout.
          (cd "$RUNNER_TEMP" && unzip -q "$ZIP")
          sudo install -m 0755 "$RUNNER_TEMP/bin/protoc" /usr/local/bin/protoc
          sudo cp -r "$RUNNER_TEMP/include/google" /usr/local/include/
          echo "→ installed: $(protoc --version)"
          echo "→ includes:"
          ls /usr/local/include/google/protobuf/ | head -5
      - name: install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: proto-check
        run: make proto-check

# Race-enabled unit test suite + pgx-backed Store integration tests.
  # Owns the 4:20 long pole — runs in parallel with `test` and `spec-check`
  # so the wall time is bounded by the slowest of the three (≈ 4:40).
  # Postgres service + DATABASE_URL mirror the previous combined job.
  #
  # Timeout was 10 min (2026-07-29 cut it twice on the rebased PR #414
  # head; race detector + recent additions to pkg/sched/scaleup +
  # pkg/sched/instancestats pushed the wall past the 10 min budget).
  # Bumped to 20 min (PR #414 follow-up) so the long pole has two
  # budgets of headroom — wall is still ~5 min in steady state, this
  # is contingency for slow windows on a shared GH runner pool.
  # Shard 1 (Postgres-heavy A): cmd/apid, migrations, pkg/meter, pkg/db, pkg/alerts
  unit-tests-pg-1:
    name: unit tests (pg shard 1 — apid/meter/migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    steps:
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:15; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: unit tests (pg shard 1)
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -v '/migrations' | grep -E '(cmd/apid|pkg/meter|pkg/db|pkg/alerts)')
          go test -race -count=1 -p 4 -timeout=10m -coverprofile=coverage/cover-shard1.out -covermode=atomic $PKGS

      - name: sdk-check
        run: make sdk-check

      - name: upload to Codecov (pg shard 1)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/cover-shard1.out
          flags: unittests
          use_oidc: true
          fail_ci_if_error: true

  # Shard 2 (Postgres-heavy B) is split into two jobs because pkg/state and
  # cmd/gregale are independent race-enabled hot spots. Both jobs keep their
  # own Postgres service so a slow package group cannot hold the other group
  # behind it.
  unit-tests-pg-2:
    name: unit tests (pg shard 2${{ matrix.id }} — ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: a
            label: state/reconcile/reposcan
            package_pattern: '/(pkg/state|pkg/statefuldenylist|pkg/reconcile|pkg/reposcan)(/|$)'
            coverage_file: cover-shard2a.out
            state_coverage: true
          - id: b
            label: gregale/gregalectl/daemons
            package_pattern: '/(cmd/gregale|cmd/gregalectl|cmd/meterd|cmd/schedd|cmd/schema-dump)(/|$)'
            coverage_file: cover-shard2b.out
            state_coverage: false
    # Keep the previous headroom while the new package-group timings settle.
    # The normal wall time is reduced because the two groups run concurrently.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    steps:
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:15; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: unit tests (pg shard 2${{ matrix.id }})
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -v '/migrations' | grep -E '${{ matrix.package_pattern }}')
          test -n "$PKGS"
          printf '%s\n' "$PKGS"
          go test -race -count=1 -p 4 -timeout=14m -coverprofile="coverage/${{ matrix.coverage_file }}" -covermode=atomic $PKGS

      - name: pkg/state coverage gate
        if: ${{ matrix.state_coverage }}
        run: make check-state-coverage COVERFILE=coverage/${{ matrix.coverage_file }}

      - name: coverage floor (ship-blocking packages)
        # Validates the ship-blocking package floors via the shared
        # coverage-floor gate (see Makefile). Packages not exercised by
        # this matrix entry's PKGS list print "(no statements — skip)"
        # and don't fail the gate.
        run: make coverage-floor COVERDIR=coverage

      - name: upload to Codecov (pg shard 2${{ matrix.id }})
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/${{ matrix.coverage_file }}
          flags: unittests
          use_oidc: true
          fail_ci_if_error: true

  # Shard 3 (pure Go heavy): pkg/sched, pkg/fcvm, pkg/gateway, pkg/imaged, etc. No Postgres needed.
  unit-tests-pure-1:
    name: unit tests (pure Go shard 1 — sched/fcvm/gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: unit tests (pure Go shard 1)
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -E '(pkg/sched|pkg/fcvm|pkg/gateway|pkg/imaged|pkg/wire|cmd/gatewayd-internal|pkg/api)')
          go test -race -count=1 -p 4 -timeout=10m -coverprofile=coverage/cover-shard3.out -covermode=atomic $PKGS

      - name: coverage floor (ship-blocking packages)
        # Validates pkg/fcvm, pkg/sched, pkg/gateway ≥ floors defined in
        # Makefile (coverage-floor target). Packages not exercised by
        # this shard's PKGS list print "(no statements — skip)" and
        # don't fail the gate.
        run: make coverage-floor COVERDIR=coverage

      - name: upload to Codecov (pure Go shard 1)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/cover-shard3.out
          flags: unittests
          use_oidc: true
          fail_ci_if_error: true

  # Shard 4 (pure Go light): all remaining packages. No Postgres needed.
  unit-tests-pure-2:
    name: unit tests (pure Go shard 2 — light packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: unit tests (pure Go shard 2)
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -vE '(cmd/apid|migrations|pkg/meter|pkg/db|pkg/alerts|pkg/state|cmd/gregale|cmd/meterd|cmd/schedd|cmd/schema-dump|pkg/reconcile|pkg/reposcan|pkg/sched|pkg/fcvm|pkg/gateway|pkg/imaged|pkg/wire|cmd/gatewayd-internal|pkg/api)')
          go test -race -count=1 -p 4 -timeout=10m -coverprofile=coverage/cover-shard4.out -covermode=atomic $PKGS

      - name: coverage floor (ship-blocking packages)
        # Validates pkg/vmmdgrpc, pkg/vmmdmount ≥ floors defined in
        # Makefile (coverage-floor target). Packages not exercised by
        # this shard's PKGS list print "(no statements — skip)" and
        # don't fail the gate.
        run: make coverage-floor COVERDIR=coverage

      # Property-based tests pin the §6.2 invariants in CLAUDE.md.
      # No KVM/DB needed — pure logic. Lands in this shard because
      # the package list is `tests/property/...` (everything else
      # bucket).
      - name: property-based tests (§6.2 invariants)
        run: make test-property

      - name: upload to Codecov (pure Go shard 2)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/cover-shard4.out
          flags: unittests
          use_oidc: true
          fail_ci_if_error: true

  # OpenAPI spec gate (PR #129). The spec is the source of truth for
  # documentation; the code is the source of truth for behavior; this
  # gate is the bridge. Same regenerate-and-diff pattern as proto-check /
  # sqlc-check / egress-check: vacuum lint + AST parity + git clean.
  # Fails the PR if a route / DTO / Code* constant drifts without a
  # matching spec change.
  #
  # Split out of the `test` job in PR #167 so its ~4 min of vacuum lint +
  # AST work runs alongside the Go build/lint/test pipeline instead of
  # after it.
  #
  # vacuum is downloaded as a pre-built binary from GitHub Releases
  # (verified against VACUUM_SHA256_LINUX_AMD64) instead of `go install`'d
  # — the source build takes ~3 min cross-compiling vacuum against the
  # runner's Go toolchain. The binary is ~20 MB and downloads in <5 s.
  # The same precedent is used by every other binary in the EX44
  # ansible roles (deploy/ansible/roles/{alertmanager,node_exporter,
  # prometheus,firecracker,grafana}/), so the supply-chain pin pattern
  # matches the production host.
  spec-check:
    name: spec-check (OpenAPI lint + AST parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-go is needed because `make spec-check` invokes
      # `$(GO) test -count=1 -run TestSpecCompliance ./cmd/apid/...` for
      # the AST parity assertion (~0.4 s locally, negligible in CI).
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # No Go cache: spec-check runs a single tiny test, not worth
          # the cache hit; this also keeps the job self-contained without
          # sharing Go module downloads with `test` / `unit-tests`.
      - name: install vacuum
        run: |
          # Belt + suspenders: refuse to run on a non-x86_64 runner instead
          # of silently picking the wrong tarball. This matches the
          # `runs-on: ubuntu-latest` job contract.
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::vacuum install assumes x86_64; runner is $(uname -m)"
            exit 1
          fi

          # All interpolation happens in the shell — the env block above
          # only carries the version + SHA-256 pin, both of which MUST be
          # raw strings (no shell interpolation) so a future bump is a
          # single edit. `${VACUUM_VERSION}` in an env: value is NOT
          # expanded by GitHub Actions — we build the URL here.
          VACUUM_TARBALL="vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz"
          VACUUM_URL="https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/${VACUUM_TARBALL}"
          mkdir -p "$HOME/.local/vacuum/bin"
          TAR="$RUNNER_TEMP/${VACUUM_TARBALL}"
          echo "→ downloading $VACUUM_URL"
          curl --fail --silent --show-error --location --output "$TAR" "$VACUUM_URL"
          echo "→ verifying SHA-256"
          echo "${VACUUM_SHA256_LINUX_AMD64}  $TAR" | sha256sum --check --strict
          echo "→ extracting"
          # The tarball is flat (LICENSE, README.md, vacuum) — no version
          # directory — so we extract into a temp scratch and copy the
          # binary to the stable install path.
          tar --extract --gzip --file "$TAR" --directory "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/vacuum" "$HOME/.local/vacuum/bin/vacuum"
          chmod +x "$HOME/.local/vacuum/bin/vacuum"
          echo "→ installed: $("$HOME/.local/vacuum/bin/vacuum" version)"
          echo "$HOME/.local/vacuum/bin" >> "$GITHUB_PATH"
      - name: spec-check
        # The install vacuum step above appends $HOME/.local/vacuum/bin
        # to $GITHUB_PATH, so `make spec-install` finds the binary via
        # `command -v vacuum` (PATH lookup) and short-circuits before
        # the `go install` fallback. No GOBIN override needed: the
        # Makefile's `$(GOBIN)` default (`go env GOPATH/bin`) is the
        # correct install location for the local-dev `go install` path.
        run: make spec-check

  # Go SDK build + test gate (issue #266, PR 2). The SDK is a nested
  # Go module at sdk/go/ (module github.com/poyrazK/faas-go). The
  # daemon's `make test` walks the daemon's package tree only; the
  # SDK module needs its own gate so a regression in sdk/go/internal/api/*
  # fails the PR. Decoupled from `test` for the same reasons as
  # spec-check: short, parallel, no shared cache needed.
  #
  # Steps mirror the daemon's local recipe:
  #   cd sdk/go && go build ./... && go test ./... && go vet ./...
  # No postgres, no KVM, no test database — the SDK is hermetic.
  sdk-go:
    name: sdk-go build + test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # No Go cache: the SDK module has zero external deps (no
          # go.sum), so cache hit rate is zero anyway. Self-contained
          # job, no shared downloads with `test` / `unit-tests`.
      - name: go build
        working-directory: sdk/go
        run: go build ./...
      - name: go vet
        working-directory: sdk/go
        run: go vet ./...
      - name: go test
        working-directory: sdk/go
        run: go test -count=1 ./...

  # fakeapid fixture (issue #266, PR 4). The cross-language smoke
  # fixture for the public SDKs — a stdlib-only Go binary that
  # mimics apid's surface so Node (PR 5) and Python (PR 6) SDKs
  # can smoke-test against a real HTTP process. The fixture must
  # build + test cleanly with no external deps; this gate fails
  # the PR if a regression breaks the wire shape.
  #
  # Mirrors sdk-go: same GO_VERSION, no services, no path filters
  # (the existing convention is "no filter" so we don't accidentally
  # skip the gate when a non-sdk change touches the workflow).
  # PR 5/6 will invoke this job's pre-built ./bin/fakeapid from
  # their own `-tags smoke_bin` runs to assert artifact
  # compatibility (see sdk/fakeapid/main_bin_test.go).
  # Node SDK gate: gen-check + fakeapid fixture build + smoke + unit tests
  sdk-node:
    name: sdk-node (gen-check + smoke + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json
      - name: build fakeapid fixture
        working-directory: sdk/fakeapid
        run: go build -o bin/fakeapid .
      - name: npm ci
        working-directory: sdk/node
        run: npm ci --no-audit --no-fund
      - name: gen:check (regenerate + assert clean diff)
        working-directory: sdk/node
        run: |
          npm run gen:check || {
            echo "::error::sdk/node/src/generated is out of sync with api/openapi.yaml."
            echo "::error::Run 'make sdk-gen-node-check' locally and commit the result."
            exit 1
          }
      # Determinism gate (Makefile:771 sdk-gen-node-twice): regen twice
      # and assert zero diff. A flaky codegen can pass a single-shot
      # gen:check (output stable across one regen) but produce
      # different files on the second run — breaking customer pins.
      # npm ci + the gen:check above already paid the cache warmup
      # cost, so the second regen is ~3 s. Wall cost fits the 5-min
      # job budget.
      - name: regen determinism (twice)
        # Each `npm run gen:check` already ends with `git diff --exit-code
        # -- src/generated` (sdk/node/package.json:30); chaining it twice
        # is the determinism invariant (clean regen → clean regen → still
        # clean). Two regens, two diffs — no third trailing diff needed.
        working-directory: sdk/node
        run: npm run gen:check && npm run gen:check
      - name: smoke test
        working-directory: sdk/node
        run: npm run test:smoke
      - name: unit tests
        working-directory: sdk/node
        run: npm run test:unit

  # Python SDK gate: gen-check + fakeapid fixture build + smoke + unit tests
  sdk-python:
    name: sdk-python (gen-check + smoke + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml
      - name: build fakeapid fixture
        working-directory: sdk/fakeapid
        run: go build -o bin/fakeapid .
      - name: install SDK + test deps
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruamel.yaml openapi-python-client pytest pytest-asyncio httpx
          python -m pip install -e .
      - name: gen + assert clean diff
        working-directory: sdk/python
        run: |
          python scripts/gen.py
          git diff --exit-code -- sdk/python/faas_sdk/ || {
            echo "::error::sdk/python/faas_sdk is out of sync with api/openapi.yaml."
            echo "::error::Run 'make sdk-gen-python-check' locally and commit the result."
            exit 1
          }
      # Determinism gate (Makefile:795 sdk-gen-python-twice): regen
      # twice and assert zero diff. Inline form (not `make
      # sdk-gen-python-twice`) because the Makefile target hard-codes
      # `sdk/python/.venv/bin/python` (Makefile:797) and CI's
      # sdk-python job installs deps system-wide (line 758-761), not
      # into a venv — the Makefile target would fail with "no such
      # file or directory". The pre-existing single step in this job
      # was named "smoke + unit + regen determinism" but only ran
      # pytest; this split makes the contract honest.
      - name: regen determinism (twice)
        working-directory: sdk/python
        run: |
          python scripts/gen.py && python scripts/gen.py && git diff --exit-code -- sdk/python/faas_sdk/
      - name: smoke + unit
        working-directory: sdk/python
        run: python -m pytest tests/ --ignore=tests/debug_chain.py -v


  # issue #299 — supply-chain scan: govulncheck (HIGH+ severity floor)
  # + Grype image scan + SARIF upload to Code Scanning. Runs in
  # parallel with `test` / `unit-tests` / `spec-check` (no `needs:`,
  # same precedent as spec-check). The runtime path (imaged →
  # Grype sidecar + vmmd boot gate) is the canonical enforcement;
  # this job is the static-input mirror that fails the PR when
  # either (a) govulncheck finds a HIGH+ finding in the Go module
  # graph, or (b) Grype surfaces a finding in images/*.Dockerfile
  # that the runtime scan would also refuse at boot.
  image-scan:
    name: image-scan (Grype + govulncheck high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GRYPE_VERSION: "0.116.0"
      # SHA-256 of grype_${GRYPE_VERSION}_linux_amd64.tar.gz from
      # https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/.
      # Pin at install time — see memory note ci-vacuum-binary-download
      # for the same pattern used by vacuum/sqlc pins below.
      # Compute locally via `curl -fsSL -o grype.tar.gz <url> && shasum -a 256 grype.tar.gz`.
      # Bumped from 0.78.0 → 0.116.0: Anchore ships the vulnerability
      # database baked into each release, and Grype refuses to scan when
      # the bundled DB is older than 5 days (GRYPE_DB_VALIDATE_AGE=true
      # by default). 0.78.0's bundled DB is now ~20 weeks stale; 0.116.0
      # is the current stable line. The matching ansible pin lives at
      # deploy/ansible/roles/supply_chain_scanners/defaults/main.yml —
      # keep the two in lock-step.
      GRYPE_SHA256_LINUX_AMD64: "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (severity high+)
        # govulncheck exit code 3 = findings at or above the
        # requested level. Failure propagates as a non-zero step.
        # The level filter is the issue #299 acceptance bullet
        # ("fail on Severity HIGH+"); the default mode is 'source'
        # which mirrors what the `test` job at line 95-101 runs (no
        # behavior regression on daemons that don't expose
        # high-severity findings today).
        run: |
          set -euo pipefail
          govulncheck -mode=source -show=verbose ./...
      - name: install grype
        # Anchored version + SHA-256, mirroring vacuum/sqlc pinning
        # precedent at ci.yml:289-320 / ci.yml:780-805. Grype
        # release tarball is flat (grype binary); the install path
        # is the same $HOME/.local/<tool>/bin convention.
        run: |
          set -euo pipefail
          GRYPE_TARBALL="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            -o "$RUNNER_TEMP/${GRYPE_TARBALL}" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${GRYPE_TARBALL}"
          echo "${GRYPE_SHA256_LINUX_AMD64}  $RUNNER_TEMP/${GRYPE_TARBALL}" | sha256sum --check --strict
          mkdir -p "$HOME/.local/grype/bin"
          tar -xzf "$RUNNER_TEMP/${GRYPE_TARBALL}" -C "$RUNNER_TEMP" grype
          cp "$RUNNER_TEMP/grype" "$HOME/.local/grype/bin/grype"
          chmod +x "$HOME/.local/grype/bin/grype"
          echo "$HOME/.local/grype/bin" >> "$GITHUB_PATH"
      - name: grype db update (fetch fresh vulnerability DB)
        # Grype refuses to scan when its bundled DB is older than 5
        # days (GRYPE_DB_VALIDATE_AGE=true by default). Updating
        # before the scan decouples the CI job from the freshness
        # of the DB Anchore ships in each binary release — the
        # version pin still anchors the binary, but the CVE feed is
        # always current. Same precedent as the runtime Grype
        # invocation in cmd/imaged (Grype is invoked at every base
        # stage with an implicitly-fresh DB via `grype db update` in
        # the imaged unit, if wired).
        run: |
          set -euo pipefail
          grype db update
      - name: grype dir scan (images/*.Dockerfile tree)
        # dir: scan mode walks the local filesystem; SARIF is the
        # canonical Code Scanning ingestion format. Default severity
        # floor is "medium"; we explicitly set "high" so the failure
        # path is symmetric with govulncheck. SARIF includes ALL
        # severities by default (a documented Grype behavior change
        # in 0.71+).
        run: |
          set -euo pipefail
          grype dir:images/ -o sarif --file grype-results.sarif --only-fixed=false
      - name: upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif
          category: grype-image-scan

  load:
    # M4 acceptance gate (spec §14 row 2): "1,000 rps to hot app adds < 2 ms p50".
    # Decoupled from the `test` job because (a) it is a load test, not a
    # coverage gate — coverage instrumentation skews latency and is
    # intentionally excluded; (b) it runs long (2 × 5 s + warmup) and
    # would lengthen the developer feedback loop if folded into `test`.
    #
    # Runner choice: `ubuntu-latest` (2 vCPU / 7 GB GitHub-hosted). The
    # test's gate is the DELTA between hot-load p50 and idle p50, not
    # absolute latency — per-process noise (Go runtime, GC, scheduler
    # jitter, CPU frequency scaling) cancels out. A 14-core local M-series
    # machine measures delta < 0 at 1k rps; the 2 vCPU on CI has plenty of
    # headroom for the same 5 s × 1k rps window. An earlier draft used
    # `ubuntu-4-cpus` (GitHub-hosted larger runner), but those need
    # org-level enablement (Settings → Actions → Runners → Larger runners)
    # and otherwise queue forever — our org doesn't have them provisioned,
    # so the job sat QUEUED for ~19 h without starting.
    name: load (1k rps hot-path)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: make test-load
        run: make test-load

  metal:
    # Manual trigger from the Actions tab. Marked workflow_dispatch so the
    # job can be invoked on-demand once a self-hosted runner is registered
    # (the spec gates the EX44 acceptance tests on KVM + root). The
    # `runs-on: [self-hosted, kvm]` label combo fails fast on stock runners.
    name: metal (KVM + root, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kvm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: metal tests
        run: sudo make test-metal
      - name: leak check
        run: sudo make leakcheck

  migrations:
    # PR #93 follow-up: deploy run 29841378918 failed at the migrate step
    # with "goose: error: found 1 missing migrations before current version
    # 21: version 14". The static check (make migrations-check) catches the
    # same failure mode from filenames alone in microseconds; the apply-and-
    # walk test exercises pkg/db.MigrateUp end-to-end against a fresh
    # schema, so SQL that parses but fails to apply is also caught here.
    # Decoupled from `test` so a regression surfaces immediately with the
    # exact missing-slot name rather than being buried in the unit-test
    # sweep.
    #
    # 2026-07-31 follow-up: this job failed on the main push with a Docker
    # Hub pull timeout (`registry-1.docker.io/v2/: context deadline
    # exceeded`) on the Azure centralus runner. Switch the image to
    # mirror.gcr.io (Google's transparent mirror of Docker Hub, no auth,
    # no per-IP rate limit) — same pattern as FAAS_BUILDER_BASE_REF on
    # the prod box (deploy/controlplane/sealed.env.example:22 —
    # RETIRED 2026-08-15 by issue #911 / PR-1; v2 path is PR-X
    # `gregale secrets init`). A pre-step `docker pull` with retry
    # covers the case where the service container's own pull path
    # flakes before the retry.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    name: migrations (contiguity + apply)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 2026-07-31: pre-pull postgres with 3-attempt retry. This job
      # is the one that actually hit the Docker Hub pull timeout on
      # the main push; the retry is the second layer after the
      # mirror.gcr.io image swap.
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:15; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      # fetch-depth: 0 — the slot-collision and replay-safety steps both diff
      # against origin/<base>, which a shallow clone cannot resolve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: migrations check (static)
        run: make migrations-check

      # PR-P4 — assert deploy/scripts/verify-secrets.sh is shaped
      # correctly (executable, bash-parseable, presence of the
      # Paddle + Stripe blocks added by Streams A + B). The
      # script itself runs against /etc/faas/sealed.env on a real
      # control-plane node; CI only checks it parses + has the
      # expected Paddle+Stripe block headers, via a hermetic
      # SECRETS_FILE override (an empty fixture that the script
      # must not reject as malformed). see cmd/gregale/_test for
      # the equivalent CLI flag parse-tripwire pattern.
      - name: verify-secrets.sh static check
        run: |
          set -euo pipefail
          test -x deploy/scripts/verify-secrets.sh
          bash -n deploy/scripts/verify-secrets.sh
          grep -q "FAAS_PADDLE_API_KEY" deploy/scripts/verify-secrets.sh
          grep -q "FAAS_BILLING_PROVIDER=paddle" deploy/scripts/verify-secrets.sh

      # Cross-PR slot collision. TestMigrationsUniquePrefixes (in the static
      # step above) only sees one branch at a time: a PR builds against
      # refs/pull/N/merge, which cannot contain a sibling PR's files. So two
      # open PRs can each add 00054_*.sql, both go green, and the collision
      # only exists after the second merges — at which point main panics with
      # "goose: duplicate version 54", every other open PR goes red, and the
      # deploy fails. That happened on slots 51, 52 and 54 (issue #366).
      # Post-merge detection is too late; this moves it to the only point
      # where renumbering is cheap.
      # Reservation carve-out self-test (ADR-041). Verifies slots_from_paths'
      # regex in isolation — <1 s, no gh / Postgres. Drift between this
      # regex and the ADR is caught at PR time before the cross-PR gate
      # silently starts misclassifying filenames.
      - name: migration slot gate self-test
        run: BATS_TEST=1 ./scripts/ci/check_migration_slots.sh
      - name: migration slot collision (vs other open PRs)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/ci/check_migration_slots.sh
      # No `-tags no_pg` here on purpose: apply_walk_test.go carries
      # `//go:build !no_pg`, so the static-only `make migrations-check`
      # step skips it and this step picks it up. The `-run` filter
      # narrows to the single apply test; the five static tests live
      # in embed_test.go and are not built under `!no_pg` exclusion
      # here because their package has no build tag.
      - name: migrations apply-and-walk
        run: go test -race -count=1 -v -run TestMigrationsApplyAndWalk ./migrations/...

      # Replay safety for migrations this diff ADDS. apply-and-walk above
      # migrates a FRESH database, which is the one state the DO box is never
      # in: twice its schema has been AHEAD of its goose ledger and the deploy
      # died mid-apply on a migration CI had passed —
      #   00030_invocations:            relation "invocations" already exists
      #   00053_deployments_source_url: column "source_url" already exists
      # Only NEW migrations are replayed: 00001_init is legitimately not
      # re-runnable, and replaying from zero against a populated database is
      # not a scenario worth surviving. See migrations/replay_safety_test.go.
      - name: compute added migration versions
        id: newmig
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch -q origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            # push to main: compare against the commit before this one, so a
            # direct merge still exercises whatever it introduced.
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          versions="$(git diff --name-only --diff-filter=A "${base}" HEAD -- 'migrations/*.sql' \
            | { grep -v -E 'migrations/[0-9]{5}_(.*_)?(reservation|reserve_slot)(_[^/]*)?\.sql$' || true; } \
            | sed -nE 's|.*/([0-9]{5})_.*\.sql$|\1|p' | sort -u | paste -sd, -)"
          # The { grep -v || true; } wrapper above swallows grep -v's exit 1 on
          # empty input. Without it, set -o pipefail propagates the 1 when a PR
          # has zero added migration files (e.g. a gate-only PR), and the step
          # fails before the sed step ever runs. The { ...; } runs grep in a
          # subshell so the || true attaches to grep's exit, not the whole
          # pipeline. scripts/ci/check_migration_slots.sh handles the same
          # empty-mine case earlier via `if [[ -z "${mine}" ]]; then exit 0; fi`,
          # so this fix only needs to live in the inline ci.yml pipeline.
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "added migration versions: ${versions:-<none>}"
      - name: migrations replay-safety (new migrations only)
        env:
          FAAS_REPLAY_CHECK_VERSIONS: ${{ steps.newmig.outputs.versions }}
        run: go test -race -count=1 -v -run TestNewMigrationsAreReplaySafe ./migrations/...

  sqlc-check:
    # Drift gate between queries.sql + schema.sql and the committed
    # pkg/state/sqlc/* baseline (issue #125). ADR-017 keeps PgStore
    # hand-written until M5.1; this checks generated drift only, not
    # semantic parity between pgstore.go and queries.sql.
    name: sqlc-check (generated drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: install sqlc
        # Belt + suspenders: refuse to run on a non-x86_64 runner instead
        # of silently picking the wrong tarball. Matches the spec-check
        # job's vacuum install step.
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::sqlc install assumes x86_64; runner is $(uname -m)"
            exit 1
          fi
          SQLC_TARBALL="sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          SQLC_URL="https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/${SQLC_TARBALL}"
          mkdir -p "$HOME/.local/sqlc/bin"
          TAR="$RUNNER_TEMP/${SQLC_TARBALL}"
          echo "→ downloading $SQLC_URL"
          curl --fail --silent --show-error --location --output "$TAR" "$SQLC_URL"
          echo "→ verifying SHA-256"
          echo "${SQLC_SHA256_LINUX_AMD64}  $TAR" | sha256sum --check --strict
          echo "→ extracting"
          # The tarball is flat (just `sqlc`) — no version directory —
          # so we extract into a temp scratch and copy the binary to the
          # stable install path.
          tar --extract --gzip --file "$TAR" --directory "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/sqlc" "$HOME/.local/sqlc/bin/sqlc"
          chmod +x "$HOME/.local/sqlc/bin/sqlc"
          echo "→ installed: $("$HOME/.local/sqlc/bin/sqlc" version)"
          echo "$HOME/.local/sqlc/bin" >> "$GITHUB_PATH"
      - name: sqlc-check
        # The install sqlc step above appends $HOME/.local/sqlc/bin to
        # $GITHUB_PATH, so `make sqlc` finds the binary via PATH lookup
        # and short-circuits before the `go install` fallback.
        run: make sqlc-check

  daemonunit-check:
    # DEPLOY-2 / ADR-078 / issue #649: regen-and-diff gate on
    # pkg/daemonunitspec. Asserts that the systemd unit files in the
    # three deploy trees (cp-cp, cp-sys, cp-ans) + daemons.json are
    # byte-equal to what `make generate` would emit from the current
    # spec files. PR-1: cp-cp is the v1 deploy/controlplane/systemd
    # tree (tombstone now; deletion in PR-1 Phase 2 after PR-X); the
    # CD pipeline rewired in PR-1 reads units from per-role ansible
    # files/ instead. cp-cp stays in the gate until Phase 2 lands so
    # a daemonunitspec change cannot silently drift. Pattern matches
    # proto-check / sqlc-check / egress-check (regenerate-to-tmpdir
    # + git diff --exit-code). PR authors who edit a UnitXxx() must
    # run `make generate` locally and
    # commit the regenerated trees.
    name: daemonunit-check (generated drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: generate-check
        run: make generate-check

  # Workflow YAML semantic lint. Recent 8-commit churn on
  # .github/codeql/codeql-config.yml (worktree-issue-995-edge-protection
  # series) is exactly the kind of regression actionlint catches in <5 s:
  # - shellcheck SC2086/SC2046/SC2012 inside `run:` blocks
  # - unknown self-hosted runner labels
  # - missing `jobs:` / `on:` sections when a non-workflow YAML is
  #   accidentally scanned
  # - typos in `uses:` versions / branch refs
  #
  # Mirrors daemonunit-check / sqlc-check / packer-validate shape:
  # stateless, fast (~5 s), runs on every PR.
  #
  # `-shellcheck ''` disables actionlint's bundled shellcheck
  # integration. actionlint's job is workflow YAML semantic lint
  # (the recent 8-commit churn on .github/codeql/codeql-config.yml is
  # exactly what it catches); shellcheck findings on bash snippets in
  # `run:` blocks are a separate concern and the 6 pre-existing
  # SC2046/SC2012/SC2086 findings in ci.yml would fail the gate on
  # every PR — fixing each is out of scope for this cluster. Re-enable
  # after the shellcheck findings land in a follow-up cleanup PR.
  #
  # Bumping actionlint: edit the SHA + version together (mirror codecov-
  # action pinning at ci.yml:383). Latest stable at PR time is v1.7.12;
  # SHA `914e7df21a07ef503a81201c76d2b11c789d3fca` matches tag v1.7.12.
  workflow-lint:
    name: workflow-lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          version: v1.7.12
          args: -shellcheck ''

  packer-validate:
    # ADR-111: Packer-builder syntax gate. PR #928 lands
    # deploy/packer/{common,ubuntu-2404,role-overlay}.pkr.hcl + the
    # per-cloud builders in PR #929 (hcloud + amazon-ebs). PR #927's ADR
    # decides that production host provisioning flows through a Packer-
    # built image; this CI job is the tripwire that fails PRs with a
    # syntactically broken .pkr.hcl before any builder creds would have
    # to be touched.
    #
    # `packer validate -syntax-only` works without cloud creds because
    # the source blocks don't actually resolve until a real builder runs.
    # Mirrors daemonunit-check / sqlc-check / egress-check: stateless,
    # fast, runs on every PR.
    name: packer-validate (ADR-111)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: install-packer (pinned)
        run: scripts/install-packer.sh
      - name: packer validate -syntax-only
        run: make image-validate

  e2e-shard1:
    name: e2e (shard 1 — 18 tests)
    runs-on: ubuntu-latest
    # The test command has a 15m package timeout; leave runner cleanup
    # headroom so slow shared runners fail with the test result instead of
    # being cancelled by the job budget first.
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      FAAS_SKIP_PG_TESTS: ""
    steps:
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:15; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: install jinja2 (ADR-055 cross-check)
        run: python3 -m pip install --quiet jinja2
      - name: e2e tests (shard 1 — 18 tests)
        run: go test -race -count=1 -timeout=15m -run '^Test(C|D|Docs|Domain|E2E_[A-E])' ./cmd/e2e/...

