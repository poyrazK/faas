name: ci

# One-PR CI bundle (Tier 1+2 from the CI improvement plan):
#   - go-version pinned via go.mod
#   - go mod + build cache (setup-go@v5)
#   - concurrency cancel-in-progress (PR head ref)
#   - golangci-lint (catches errcheck, staticcheck, ineffassign beyond go vet)
#   - govulncheck (Go vulnerability DB scan)
#   - Codecov coverage (project gate >= 70%; informational patch)
#   - workflow_dispatch for the non-hardware CI bundle
#   - status badge in README, PR template for milestone gating
#
# Dependabot (.github/dependabot.yml) and CodeQL (.github/workflows/codeql.yml)
# live as separate files alongside this one.

on:
  push:
    branches: [main]
  # Draft PRs run only `lint + build`; every other job is gated on
  # `github.event.pull_request.draft != true` so iteration on a draft does not
  # hold ~25 hosted runners per push. `ready_for_review` starts the full suite
  # (and cancels the draft run through the concurrency group below), and
  # workflow_dispatch still runs everything on demand for a draft branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Required checks must also run on the queue's temporary merge ref,
  # otherwise the queue waits forever for a status that never arrives.
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a PR ref updates (push to the same branch)
# or main receives a new commit. Saves CI minutes and removes the
# "did my fix actually run?" confusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run: the queue reads a cancelled check as a
  # failure and evicts the pull request.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  # Codecov + CodeQL need write to attach comments / SARIF uploads.
  # Each restricted here so the default-`read` token isn't open.
  pull-requests: write
  security-events: write

env:
  # Pin the exact patched toolchain used by go.mod and all built binaries.
  # Go 1.25.13 has current standard-library advisories; 1.26.9 includes
  # their fixes. Bump this in lockstep with the go.mod `go` directive.
  GO_VERSION: "1.26.9"
  # vacuum is the OpenAPI ruleset linter used by `make spec-check`.
  # Both the version and the SHA-256 pin are mirrored from the upstream
  # checksum file at https://github.com/daveshanley/vacuum/releases — never
  # bump one without the other. The Makefile also has a `make spec-install`
  # guard for local devs; CI uses the binary download because the
  # `go install` path cross-compiles vacuum from source on every run
  # (~3 min on a cold runner cache).
  VACUUM_VERSION: "0.29.10"
  VACUUM_SHA256_LINUX_AMD64: "84a596d5f88dd42f6f020376e5d2c2a29e6e51cc4b5614828f03dda122457a03"
  # sqlc is the Postgres→Go query layer used by `make sqlc-check` (issue
  # #125). Both the version and SHA-256 pin are mirrored from the v1.31.1
  # GitHub release — never bump one without the other. The Makefile also
  # has a `make sqlc` guard for local devs; CI uses the binary download
  # because the `go install` path cross-compiles sqlc (with its cgo
  # pganalyze/pg_query_go tree) from source on every cold runner (~30 s)
  # and v1.31.1's cgo dependency tree is expensive to rebuild on every
  # hosted runner.
  # Same supply-chain pin pattern as vacuum above and every binary in the
  # EX44 ansible roles.
  SQLC_VERSION: "1.31.1"
  SQLC_SHA256_LINUX_AMD64: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
  # protoc is the wire-codegen tool used by `make proto-check`. We pin it
  # to the same source-of-truth release that arduino/setup-protoc@v3
  # resolves '33.x' to (v33.6, the latest 33.x line) and download the
  # zip directly from the protocolbuffers/protobuf GitHub release. The
  # SHA-256 mirrors the supply-chain pin pattern used by vacuum + sqlc
  # above and every binary in the EX44 ansible roles (cd-2 daemonunit
  # generator convention). Bumping requires editing both lines in lock-
  # step.
  #
  # Why not arduino/setup-protoc@v3: that action hits GitHub's release-
  # resolution REST API for binary lookup and is subject to the per-IP
  # unauthenticated rate limit (60/hr) — concurrent jobs across the
  # shared GH runner fleet trip it at peak load and the step flakes
  # with `API rate limit exceeded for <runner-IP>`. This direct download
  # uses `curl --fail` against the static release-asset URL (which is
  # subject only to the per-asset 5000/hr authenticated limit when
  # GITHUB_TOKEN is forwarded) and the same --check --strict sha256
  # posture the vacuum / sqlc pins use. Memory:
  # ci-arduino-protoc-rate-limit-flake.md.
  PROTOC_VERSION: "33.6"
  PROTOC_SHA256_LINUX_AMD64: "9c49962391ff8b5754342509efc3885db91dfe11a358e1e98c9a71518f0ad199"
  # promtool is downloaded from the Prometheus release tarball to lint the
  # spec §12 alert rules. Both the version and the SHA-256 pin mirror the
  # same `curl+sha256sum+tar` posture as vacuum + sqlc + protoc above and
  # the EX44 ansible roles' `prom_release_sha256` (asserted at bootstrap
  # via `make bootstrap`). The unpinned download was the source of a
  # `curl: (35) Recv failure: Connection reset by peer` flake on two
  # consecutive main-CI runs in 2026-08-14 — curl exits 35 on a torn
  # TCP connection and `tar` never runs, leaving us with a half-written
  # tarball on `/tmp` and no idea whether the bytes we got are the bytes
  # we asked for. The SHA-256 pin catches both the silent-truncation case
  # (curl returned 0 but the stream was cut short) and any future tamper
  # with a one-line `sha256sum --check --strict` mismatch. Bumping
  # requires editing both lines in lock-step.
  PROM_VERSION: "2.54.1"
  PROM_TARBALL_SHA256_LINUX_AMD64: "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f"

jobs:
  # Three parallel jobs (PR #167) so the long poles — unit tests (~4:20)
  # and spec-check (~3:54) — run in parallel instead of in series. Wall
  # time drops from 10:44 to ~max(test, unit-tests, spec-check) ≈ ~4:40.
  #
  # `test` (lint + build + small checks), `unit-tests` (race-enabled Go
  # test suite + pg integration), and `spec-check` (vacuum lint + AST
  # parity) all start independently on PR open. No `needs:` between them.
  # The job ID `test` is preserved so the commented-out `needs: test` in
  # cd-digitalocean.yml still resolves if anyone re-enables it.
  test:
    name: lint + build
    runs-on: ubuntu-latest
    # Full cold-cache lint exceeded twenty minutes with bounded memory.
    # Leave time for analysis, cold builds and the remaining policy gates.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # PR-4a compares the PR head against the event's base SHA and
          # scans every commit subject for fix-shaped changes.
          fetch-depth: 0

      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-
      # Restore the module cache before setup-go downloads the requested
      # toolchain. The cache includes ~/go/pkg/mod; reversing this order makes
      # a cache hit untar over the toolchain's existing files.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below

      # S4 PR-4a: a fix claim must carry a changed Go regression test. The
      # script reads title/body/labels from GITHUB_EVENT_PATH and is a no-op
      # for pushes and local invocations. Intentional exceptions require the
      # no-regression-test label plus a non-empty Why no test: explanation.
      - name: fix-shaped changes require regression tests
        run: make fix-has-test-check
      - name: fix-has-test checker tests
        run: make fix-has-test-check-test
      - name: coverage checker tests
        run: make coverage-checker-test
      - name: CVE monitor parser and issue-payload tests
        run: scripts/ci/cve-monitor_test.sh

      # golangci-lint replaces bare gofmt + go vet with a curated set of
      # checks. Keep its version aligned with the go.mod tool pin. v2.14.0 is
      # built with Go 1.27.0 and can lint this Go 1.26.9 module.
      # S4 PR-4a advisory: a useful regression pin should fail on the
      # merge-base. This report is intentionally non-blocking while the
      # repository accumulates baseline coverage; the table identifies tests
      # that are absent or already passing on the base.
      - name: advisory regression pin report
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
          GOMEMLIMIT: 2GiB
          GOGC: 10
          GOMAXPROCS: 2
        run: make regression-pin-check
      - name: regression-pin checker tests
        run: make regression-pin-check-test
      - name: lint (golangci-lint v2.14.0)
        uses: golangci/golangci-lint-action@v9
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
          # Bound analysis memory after repeated hosted-runner shutdowns.
          GOMEMLIMIT: 3GiB
          GOGC: 75
          GOMAXPROCS: 2
        with:
          version: v2.14.0
          # The expanded repository exceeded the twenty-minute cold-cache
          # deadline under these memory bounds. Retain every rule and give
          # the complete analysis a bounded thirty-minute deadline.
          args: --timeout=30m
          # The action's own cache is keyed per 7-day interval and never re-saved
          # on a hit (it restored 10 MB on run 34166672535); use the job cache above.
          skip-cache: true

      # Re-runs the same checks golangci-lint covers as a fallback, in case
      # the lint step is skipped (e.g. workflow_dispatch with no Go file
      # changes). Keeps the existing local Makefile contract honest.
      - name: gofmt
        run: test -z "$(gofmt -l $(find . -name '*.go'))" || (gofmt -l $(find . -name '*.go'); exit 1)
      - name: vet
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
          GOMEMLIMIT: 2GiB
          GOGC: 10
          GOMAXPROCS: 2
        run: go vet ./...
      - name: build
        run: make build

      # S2 PR-2b: a pure nil-return MemStore method can make a handler test
      # pass without exercising the production store. Keep the small static
      # tripwire in the fast lint/build job so every PR sees it.
      - name: MemStore stub guard
        run: make memstore-stubs-check

      # S3 PR-3b: every FAAS_* read has one contract row, and required
      # rows have a delivery path in the owning Ansible role.
      - name: daemon environment contract
        run: make env-contract-check

      # M8's operator acceptance is a real EX44 run, not a unit-test fixture.
      # Keep the shape check on every PR, and require a fresh committed PASS
      # record whenever a PR claims completion with the `m8-done` label.
      - name: restore-drill script contract
        run: make lint-drill
      - name: forbid mutating SQL in normal runbooks
        run: make runbook-sql-check
      - name: post-mortem artifact check
        run: make test-postmortems
      - name: restore-drill evidence freshness (M8 claim)
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'm8-done') }}
        run: make m8-evidence-check

      # Release manifests are generated from the production topology
      # template. Keep the projection deterministic and schema-valid on every
      # PR so a release tag cannot discover template drift for the first time.
      - name: release manifest materialization
        run: bash scripts/materialize-release-manifest_test.sh

      - name: signed component hotfix controller contracts
        run: bash scripts/ops/request_evidence_hotfix_test.sh

      # cd-compute and cd-controlplane reuse one cached Ansible toolchain per
      # pin on the fleet runner; a stale or half-built cache must never run.
      - name: CD Ansible toolchain cache
        run: bash scripts/ci/ensure-ansible-toolchain_test.sh

      # The public CLI distribution channels (ADR-172). install.sh runs as
      # `curl | sh` on machines we do not control, so its checksum
      # enforcement and platform detection are gated on every PR, not just
      # exercised at release time when a mistake is already public.
      - name: CLI release archive reproducibility
        run: bash scripts/archive-cli-binary_test.sh

      - name: CLI installer
        run: bash scripts/install_test.sh

      - name: npm package staging
        run: bash scripts/build-npm-packages_test.sh

      - name: npm publication readiness and tag isolation
        run: bash scripts/publish-npm-packages_test.sh

      # Cloudflare Free can replace origin 502/504 bodies. Keep the optional
      # public-timeout Worker contract executable in CI so its marker-based
      # rewrite never drifts from the gateway response headers.
      - name: public timeout edge adapter
        run: node --test deploy/cloudflare/public-timeout-worker/worker.test.mjs

      # get.gregale.dev serves content that users pipe into sh, so its
      # fail-closed paths (digest mismatch, unpinned ref, upstream error) are
      # gated rather than trusted.
      - name: installer edge worker
        run: node --test deploy/cloudflare/get-gregale-dev/worker.test.mjs

      # Keep the credential-free CLI scenario path executable on every PR.
      # The simulation starts the app and sink over local HTTP, including a
      # planned failed delivery and retry. Run both scenarios through the suite
      # command so selection, sequential execution, and reporting stay covered.
      - name: scenario simulation fixture
        run: |
          ./bin/gregale test --manifest tests/scenario-acceptance/gregale-test.yaml --validate
          ./bin/gregale test --manifest tests/scenario-acceptance/gregale-test.yaml --suite simulation --report scenario-results.json --junit scenario-results.xml

      # Run the copyable functional and load suites with this commit's CLI.
      # Saved runs exercise HTML reporting and the offline regression gate.
      - name: scenario reports example
        env:
          GREGALE_TEST_CONSUMER_CUSTOMER_A_KEY: example-customer-a
          GREGALE_TEST_CONSUMER_CUSTOMER_B_KEY: example-customer-b
        run: |
          ./bin/gregale test --manifest examples/scenario-tests/gregale-test.yaml --suite smoke \
            --report "$RUNNER_TEMP/scenario-before.json" --junit "$RUNNER_TEMP/scenario-before.xml" \
            --html "$RUNNER_TEMP/scenario-before.html"
          ./bin/gregale test --manifest examples/scenario-tests/gregale-test.yaml --suite smoke \
            --report "$RUNNER_TEMP/scenario-after.json" --html "$RUNNER_TEMP/scenario-after.html"
          ./bin/gregale test compare "$RUNNER_TEMP/scenario-before.json" "$RUNNER_TEMP/scenario-after.json" \
            --budget examples/scenario-tests/ci/run-budget.yaml \
            --html "$RUNNER_TEMP/scenario-comparison.html"
          ./bin/gregale test --manifest examples/scenario-tests/gregale-test.yaml --suite performance --load --repeat 3 \
            --report "$RUNNER_TEMP/scenario-load-before.json" --html "$RUNNER_TEMP/scenario-load-before.html"
          ./bin/gregale test --manifest examples/scenario-tests/gregale-test.yaml --suite performance --load --repeat 3 \
            --report "$RUNNER_TEMP/scenario-load-after.json" --html "$RUNNER_TEMP/scenario-load-after.html"
          ./bin/gregale test compare "$RUNNER_TEMP/scenario-load-before.json" "$RUNNER_TEMP/scenario-load-after.json" \
            --budget examples/scenario-tests/ci/test-budget.yaml \
            --html "$RUNNER_TEMP/scenario-load-comparison.html"

      # Provider-created machines hand their one-time connection details to
      # the provider-neutral adoption pipeline through ComputeNodeClaim files.
      # Keep checked-in examples schema-valid so the workflow can consume a
      # claim without discovering a typo after a host has already been made.
      - name: node claim validation
        run: make node-claim-check

      # CI quick-wins cluster — wire missing local gates into `test` job.
      # Each target self-documents as "CI gate" in its Makefile comment
      # (Makefile:147 / :184 / :537 / :707) but `make build` (the only
      # target `test` runs today) doesn't pull them in. The `make test`
      # local aggregator wires grafana-mirror-check as a prereq, and
      # `make pre-pr` aggregates the regenerate-and-diff gates — neither
      # runs in CI. Adding them here catches drift at PR time instead
      # of at the operator's first deploy on the live host.

      # images-lock-check (Makefile:707, issue #197 B3.5/B3.6): every
      # images/*.Dockerfile FROM must be digest-pinned via
      # images/Dockerfile.lock. A failed `images-lock-update` leaves
      # sha256:REPLACE_ME_AT_MERGE_TIME placeholders that this gate
      # catches before the PR reaches main. Operator runs
      # `make images-lock-update` to resolve real digests.
      - name: images lock check (FROM digest-pinned)
        run: make images-lock-check

      # grafana-jq-check (Makefile:184, PR #837): validates every
      # dashboard JSON parses cleanly (jq -e .). `[ -f "$$f" ]` guard
      # in the target handles the asymmetry between deploy/grafana/
      # (6 files) and deploy/ansible/roles/grafana/files/ (5 files;
      # warm-snapshot has no mirror copy).
      - name: grafana dashboard JSON parse (jq -e)
        run: make grafana-jq-check

      # grafana-mirror-check (Makefile:191, PR #837): byte-identity
      # check between deploy/grafana/ and the ansible-role mirror.
      # Catches dashboard drift between the dashboard source tree and
      # what the ansible role actually deploys.
      - name: grafana mirror byte-identity
        run: make grafana-mirror-check

      # egress-check (Makefile:537): the local aggregator pre-pr runs
      # this; CI never did. On ubuntu-latest, nft is not pre-installed
      # (lives in apt: nftables) — apt-get it before invoking the target
      # so the `nft -c -f` kernel-syntax check actually runs (the
      # Makefile self-skips that sub-step when nft is absent, and also
      # self-skips the `Operation not permitted` sandbox failure on
      # GitHub-hosted runners — bridge-name guard + Go cross-check
      # still run in both cases). On macOS dev the kernel sub-step
      # self-skips; bridge-name guard + Go cross-check still run.
      - name: install nftables
        run: |
          set -euo pipefail
          # Hosted images can carry stale third-party apt indexes. They are
          # not needed by this job and can abort apt before nftables installs.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*chrome*.list' -o -iname '*chrome*.sources' \
               -o -iname '*microsoft*.list' -o -iname '*microsoft*.sources' \) -delete
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y -qq nftables logrotate rsyslog
      - name: egress check (Go renderer ↔ Jinja2 + nft syntax + bridge-name guard)
        run: make egress-check

      # ADR-361: the per-instance tenant egress policy on a real kernel. The
      # rendered ruleset is loaded into throwaway namespaces and real packets
      # prove web ports pass, other TCP/UDP drop, DNS is pinned to the bridge
      # resolver and the per-VM rate limit fires. Needs root for netns, not
      # KVM, so it runs on the hosted runner.
      - name: netns egress policy (real nft, root)
        run: |
          set -euo pipefail
          go test -c -tags metal -o "$RUNNER_TEMP/netns.test" ./pkg/netns
          sudo "$RUNNER_TEMP/netns.test" -test.count=1 -test.v \
            -test.run '^TestMetal(TenantEgress|AllowlistRuleInstalled|AllowlistV6RuleInstalled|AllowlistSkippedWhenEmpty|HostPolicyStaticEgressIPRules)'

      - name: systemd hardening gate
        run: make systemd-hardening-check

      - name: production-like rsyslog rotation gate
        run: sudo scripts/ci/check-rsyslog-rotation.sh

      - name: canary artifact retention gate
        run: make canary-artifact-retention-test

      - name: GCP public-beta policy gate
        run: make gcp-public-beta-policy-test

      - name: OTLP unit wiring gate
        run: make otlp-unit-check

      # sealed-env-scope-check (issue #585 / ADR-127): the apid unit
      # is the only legitimate consumer of /etc/faas/sealed.env. Every
      # other daemon must use LoadCredential= or a per-daemon
      # /etc/faas/secrets/<daemon>/*.env (0400 root:root). The gate
      # walks deploy/systemd/ + deploy/controlplane/systemd/ + every
      # ansible role's files/*.service and refuses any
      # EnvironmentFile={-,}/etc/faas/sealed.env line that isn't in
      # faas-apid.service. Fail-loud; tripwire prevents future
      # re-introduction of the apid-leak pattern.
      - name: sealed.env scope gate
        run: make sealed-env-scope-check

      # +incompatible direct-dep gate (release blocker B1). Today this
      # flags github.com/stripe/stripe-go v70.15.0+incompatible (go.mod:25)
      # — v70 pre-dates the modern lookup_key primitive on PlanParams
      # (v74+), and `+incompatible` means Go will never auto-bump past
      # it. The gate stays failing until a follow-up PR upgrades stripe-go
      # to a current major; the tripwire prevents any *other* direct dep
      # from ever slipping in unannounced. See
      # scripts/ci/check_no_incompatible_deps.sh for the rationale.
      - name: forbid +incompatible direct deps
        run: make lint-incompatible-mods

      # Daemon smoke: every cmd/<daemon>/main.go is a one-box binary that wires
      # through pkg/wire.Daemon. `--help` must exit 0 with non-empty usage text
      # (a silent success here usually means init() truncated on a bad flag
      # spec). Catches nil-deref and broken flag wiring that `make build` alone
      # won't, in ~1 s. Mirrors the PR template checklist line `make build`.
      - name: daemon smoke (--help)
        run: |
          set -e
          # Tier A7 (ADR-070) split the legacy cmd/gatewayd/ daemon into
          # gatewayd-public + gatewayd-internal. PR-A of the tier-a7 finishing
          # cluster moves every file from cmd/gatewayd/ into cmd/gatewayd-internal/
          # and removes the legacy binary entirely; the cd-controlplane BINARIES
          # list and FAAS_SERVICES no longer reference 'gatewayd' either.
          for d in apid builderd gregale gatewayd-public gatewayd-internal imaged meterd schedd vmmd; do
            out=$(./bin/$d --help 2>&1)
            if [ -z "$out" ]; then
              echo "::error::$d --help returned no output"
              exit 1
            fi
            printf '%-9s %4d bytes\n' "$d" "${#out}"
          done

      # M1+ (ADR-013): *.pb.go is checked in; this step verifies it's in sync
      # with the .proto sources. The Makefile's proto-normalize target
      # strips the 'protoc v X.Y.Z' header comment so toolchain patch
      # bumps don't break CI; the wire bytes protoc produces are
      # unaffected. The pin stays on the 33.x line that the previous
      # arduino/setup-protoc@v3 '33.x' selection resolved to (v33.6).
      #
      # Replaces arduino/setup-protoc@v3 (memory
      # ci-arduino-protoc-rate-limit-flake.md): that action hit GitHub's
      # release-resolution REST API and flaked on per-IP rate limits at
      # peak load. The direct curl+sha256 download matches the vacuum +
      # sqlc + grype install precedent (ci.yml:469-500 / 948-973 /
      # 686-696) and is gated by `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION`
      # not being needed. `GITHUB_TOKEN` raises the asset-fetch quota
      # from 60/hr unauth to 5000/hr authenticated.
      - name: install protoc
        # Forward GITHUB_TOKEN explicitly into the step env. The runner
        # auto-injects it as a workflow-level var, but `set -u` requires
        # the variable to be referenced from inside an `env:` block —
        # otherwise `${GITHUB_TOKEN}` is unbound and the script fails
        # before the curl call lands. arduino/setup-protoc@v3 hid this
        # because it read the token via the GitHub Action runtime API.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::protoc install assumes x86_64; runner is $(uname -m)"
            exit 1
          fi
          PROTOC_TARBALL="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_TARBALL}"
          ZIP="$RUNNER_TEMP/${PROTOC_TARBALL}"
          echo "→ downloading $PROTOC_URL"
          # Authenticated release-asset fetch: 5000/hr per-token
          # (vs 60/hr per-IP unauthenticated) so the download can't
          # be tripped by the same fleet-wide rate limit the arduino
          # action used to hit. SHA-256 below is the supply-chain
          # anchor — a malicious or substituted tarball would change
          # the digest and fail the `--check --strict` step.
          curl --fail --silent --show-error --location \
            --output "$ZIP" --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$PROTOC_URL"
          echo "→ verifying SHA-256"
          echo "${PROTOC_SHA256_LINUX_AMD64}  $ZIP" | sha256sum --check --strict
          echo "→ extracting"
          # The zip lays out bin/protoc + include/google/protobuf/*.proto
          # (e.g. timestamp.proto, any.proto — every well-known type the
          # repo's .proto files import). We install BOTH into
          # /usr/local: the binary lands on PATH automatically, and the
          # include dir lands at protoc's default search path
          # (/usr/local/include/google/protobuf/...). No Makefile change
          # needed — the local-dev recipe (brew install protobuf)
          # produces the same /usr/local/include layout.
          (cd "$RUNNER_TEMP" && unzip -q "$ZIP")
          sudo install -m 0755 "$RUNNER_TEMP/bin/protoc" /usr/local/bin/protoc
          sudo cp -r "$RUNNER_TEMP/include/google" /usr/local/include/
          echo "→ installed: $(protoc --version)"
          echo "→ includes:"
          ls /usr/local/include/google/protobuf/ | head -5
      - name: install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: proto-check
        run: make proto-check

# Race-enabled unit test suite + pgx-backed Store integration tests.
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
  # Owns the 4:20 long pole — runs in parallel with `test` and `spec-check`
  # so the wall time is bounded by the slowest of the three (≈ 4:40).
  # Postgres service + DATABASE_URL mirror the previous combined job.
  #
  # Timeout was 10 min (2026-07-29 cut it twice on the rebased PR #414
  # head; race detector + recent additions to pkg/sched/scaleup +
  # pkg/sched/instancestats pushed the wall past the 10 min budget).
  # Bumped to 20 min (PR #414 follow-up) so the long pole has two
  # budgets of headroom — wall is still ~5 min in steady state, this
  # is contingency for slow windows on a shared GH runner pool.
  # Shard 1 (Postgres-heavy A): cmd/apid, migrations, pkg/meter, pkg/db, pkg/alerts,
  # pkg/e2etest (its fixture SQL must run against a real migrated schema)
  unit-tests-pg-1:
    name: unit tests (pg shard 1 — apid/meter/migrations)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Include cold APID race compilation and the full PostgreSQL API suite.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        # ADR-531 checkpoint contracts require PostgreSQL 16 or newer.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          # Concurrent template migrations and schema teardown share the
          # cluster lock table; match the other parallel PostgreSQL shard.
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      # Handler fixtures clone a fully migrated private database. Migration
      # tests still use fresh schemas/databases and exercise the complete chain.
      FAAS_PGTEST_TEMPLATE_DATABASE: "1"
      # Portable HTTP boundary only: the VM bridge is an HTTP fixture.
      GREGALE_OPERATIONS_ACCEPTANCE: "1"
    steps:
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:16; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below

      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pg-1-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
      - name: build SDK for portable Operations HTTP acceptance
        working-directory: sdk/node
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: install customer Operations example dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix examples/customer-operation-orders
      - name: unit tests (pg shard 1)
        # APID test DWARF generation exceeds hosted-runner memory on cold builds.
        # Omit test debug metadata and serialize its backend; keep optimization.
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
          GOMEMLIMIT: 2GiB
          GOGC: 10
          GOMAXPROCS: 2
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -v '/migrations' | grep -E '(cmd/apid|pkg/meter|pkg/db|pkg/alerts|pkg/e2etest)')
          go test -race -count=1 -p 4 -timeout=30m -coverprofile=coverage/cover-shard1.out -covermode=atomic $PKGS

      - name: sdk-check
        run: make sdk-check

      - name: upload to Codecov (pg shard 1)
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/cover-shard1.out
          flags: unittests
          use_oidc: true
          # Coverage reporting is best-effort; an OIDC/Codecov outage must
          # not turn a passing unit-test shard red.
          fail_ci_if_error: false
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # The complete state test inventory runs on two independent PostgreSQL
  # runners. Fuzz seeds and runnable examples belong to exactly one shard;
  # Go's registered list guards against silently omitting a new test family.
  unit-tests-state:
    name: unit tests (state shard ${{ matrix.shard }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      FAAS_PGTEST_TEMPLATE_DATABASE: "1"
      GREGALE_GITOPS_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Both shards compile the identical ./pkg/state race test binary, so
          # they share one cache entry (written by shard 1 only, below).
          key: go-state-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-state-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-state-${{ runner.os }}-
      - name: verify complete state inventory
        run: |
          mkdir -p coverage
          go test -race -coverpkg=./pkg/state -covermode=atomic -list . ./pkg/state > coverage/state-inventory.txt
          go run ./scripts/ci/e2eshard -package=./pkg/state -all-tests -shards=2 -check -list-file=coverage/state-inventory.txt
      - name: state tests (shard ${{ matrix.shard }})
        run: |
          STATE_RUN=$(go run ./scripts/ci/e2eshard -package=./pkg/state -all-tests -shards=2 -shard=${{ matrix.shard }})
          go test -race -count=1 -v -p 4 -timeout=20m -run="$STATE_RUN" -coverpkg=./pkg/state -covermode=atomic -coverprofile=coverage/cover-shard-state-${{ matrix.shard }}.out ./pkg/state
      - name: upload state coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-state-${{ matrix.shard }}
          path: coverage/cover-shard-state-${{ matrix.shard }}.out
          if-no-files-found: error
      - name: upload to Codecov (state shard ${{ matrix.shard }})
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/cover-shard-state-${{ matrix.shard }}.out
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false
      - name: save Go build + test cache
        # One writer per shared key: a second shard's save would only fail to
        # reserve it, and duplicate entries are what overflowed the 10 GB
        # repository cache budget and evicted the other families.
        if: always() && github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-state-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # PostgreSQL parity/reconciliation and CLI/daemon packages have independent
  # services. The state package itself runs in unit-tests-state above.
  unit-tests-pg-2:
    name: unit tests (pg shard 2${{ matrix.id }} — ${{ matrix.label }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: a
            label: parity/operations/reconcile/reposcan
            # Bridge, GitOps, and customer-operation acceptance require PostgreSQL.
            package_pattern: '/(pkg/statefuldenylist|pkg/devbridgeintegration|pkg/operations/acceptance|pkg/reconcile|pkg/reposcan|pkg/environmentsync/pgintegration)(/|$)'
            coverage_file: cover-shard2a.out
            gitops_acceptance: true
            state_coverage: true
            test_timeout: 30m
            job_timeout_minutes: 45
          - id: b
            label: gregale/gregalectl/daemons
            # Packages with pgtest-backed tests must run in a Postgres shard:
            # in the pure shards pgtest skips them, and cmd/githubd shipped a
            # query that failed on every call while its test was never run.
            package_pattern: '/(cmd/gregale|cmd/gregalectl|cmd/meterd|cmd/schedd|cmd/schema-dump|cmd/githubd|cmd/migrate|cmd/managed-postgres-qualify|pkg/lease|pkg/managedpostgres|pkg/mirror|pkg/outbound|pkg/releaseinstall)(/|$)'
            coverage_file: cover-shard2b.out
            gitops_acceptance: false
            state_coverage: false
            test_timeout: 20m
            job_timeout_minutes: 30
    # Keep main's bounded PostgreSQL budgets: 30 minutes for parity and
    # reconciliation, 20 minutes for CLI/daemons. The full state suite runs
    # in its two deterministic shards above.
    # Allow headroom for race compilation, coverage, PostgreSQL contract gates,
    # and artifact upload after the main suite completes.
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        # Keep state and provider SQL contracts on the supported version.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          # Parallel packages create/drop the full migrated schema. Give their
          # relation locks headroom without reducing race-test concurrency.
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      FAAS_PGTEST_TEMPLATE_DATABASE: "1"
    steps:
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:16; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below

      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pg-2-${{ matrix.id }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-pg-2-${{ matrix.id }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pg-2-${{ matrix.id }}-${{ runner.os }}-
      - name: Enable TLS for durable SQL credential acceptance
        if: matrix.id == 'b'
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/enable_postgres_tls.sh "$POSTGRES_SERVICE_CONTAINER"
      - name: unit tests (pg shard 2${{ matrix.id }})
        env:
          GREGALE_GITOPS_ACCEPTANCE: ${{ matrix.gitops_acceptance && '1' || '' }}
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -v '/migrations' | grep -E '${{ matrix.package_pattern }}' | grep -v '/pkg/state$')
          test -n "$PKGS"
          printf '%s\n' "$PKGS"
          COVERARGS=()
          TESTLOGARGS=()
          if [ '${{ matrix.state_coverage }}' = 'true' ]; then
            # Keep named adapter outcomes alongside the complete coverage run.
            TESTLOGARGS=(-v)
            python3 -m unittest discover -s scripts/ci -p 'test_normalize_go_cover_profile.py'
            # External GitOps and Operations tests exercise the state adapters.
            # Union those calls with both complete state test shards below.
            # Generated sqlc remains outside the exact-package 70% gate.
            STATEPKG=$(go list ./pkg/state)
            COVERPKGS=$(printf '%s\n' "$PKGS" "$STATEPKG" | grep -v '/pkg/state/sqlc$' | sort -u | paste -sd, -)
            COVERARGS=(-coverpkg="$COVERPKGS")
          fi
          go test -race -count=1 -p 4 -timeout='${{ matrix.test_timeout }}' "${TESTLOGARGS[@]}" "${COVERARGS[@]}" -coverprofile="coverage/${{ matrix.coverage_file }}" -covermode=atomic $PKGS
          if [ '${{ matrix.state_coverage }}' = 'true' ]; then
            # Credit the union of blocks covered by multiple test binaries.
            python3 scripts/ci/normalize_go_cover_profile.py "coverage/${{ matrix.coverage_file }}"
          fi

      - name: upload external state-adapter coverage
        if: matrix.state_coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-state-parity
          path: coverage/${{ matrix.coverage_file }}
          if-no-files-found: error

      - name: require PostgreSQL operation-policy retirement
        if: matrix.id == 'a'
        run: |
          set -o pipefail
          python3 scripts/ci/operation-policy-postgres-check.py 2>&1 | tee operation-policy-postgres-contract.log

      - name: upload PostgreSQL operation-policy retirement log
        if: always() && matrix.id == 'a'
        uses: actions/upload-artifact@v4
        with:
          name: operation-policy-postgres-contract
          path: operation-policy-postgres-contract.log
          if-no-files-found: ignore

      - name: require PostgreSQL UDP contracts
        if: matrix.id == 'a'
        env:
          GOFLAGS: -race
        run: |
          set -o pipefail
          make udp-postgres-check 2>&1 | tee udp-postgres-contract.log

      - name: upload PostgreSQL UDP contract log
        if: always() && matrix.id == 'a'
        uses: actions/upload-artifact@v4
        with:
          name: udp-postgres-contract
          path: udp-postgres-contract.log
          if-no-files-found: ignore

      - name: coverage floor (ship-blocking packages)
        # Shard a contributes external state coverage to the aggregate gate.
        if: matrix.id == 'b'
        # Validates the ship-blocking package floors via the shared
        # coverage-floor gate (see Makefile). Packages not exercised by
        # this matrix entry's PKGS list print "(no statements — skip)"
        # and don't fail the gate.
        run: make coverage-floor COVERDIR=coverage

      - name: upload to Codecov (pg shard 2${{ matrix.id }})
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/${{ matrix.coverage_file }}
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pg-2-${{ matrix.id }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # Require all three compatible profiles. A half-suite or parity-only profile
  # cannot replace the full exact-package 70% gate.
  state-coverage:
    name: pkg/state coverage gate (all shards)
    needs: [unit-tests-state, unit-tests-pg-2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-state-*
          path: coverage
          merge-multiple: true
      - name: exact pkg/state coverage gate
        run: |
          python3 .claude/ci/coverage_floor.py --state-only coverage/cover-shard-state-1.out coverage/cover-shard-state-2.out coverage/cover-shard2a.out
      - name: coverage floor (ship-blocking packages)
        run: make coverage-floor COVERDIR=coverage

  # Branch protection matches this historical name exactly. Keep it stable
  # while its original state/PostgreSQL inventory runs in parallel above.
  unit-tests-pg-2a-gate:
    name: unit tests (pg shard 2a — state/reconcile/reposcan)
    if: always() && github.event.pull_request.draft != true
    needs: [unit-tests-state, unit-tests-pg-2, state-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require every state and PostgreSQL shard
        env:
          STATE_RESULT: ${{ needs.unit-tests-state.result }}
          POSTGRES_RESULT: ${{ needs.unit-tests-pg-2.result }}
          COVERAGE_RESULT: ${{ needs.state-coverage.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STATE_RESULT" != success || "$POSTGRES_RESULT" != success || "$COVERAGE_RESULT" != success ]]; then
            echo "::error::Required state/PostgreSQL tests or coverage did not pass: state=$STATE_RESULT postgres=$POSTGRES_RESULT coverage=$COVERAGE_RESULT"
            exit 1
          fi

  # Shard 3 (pure Go heavy): pkg/sched, pkg/fcvm, pkg/gateway, pkg/imaged, etc. No Postgres needed.
  unit-tests-pure-1:
    name: unit tests (pure Go shard 1 — sched/fcvm/gateway)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Race compilation plus the scheduler suite can consume ten minutes.
    # Leave room for the coverage gate and upload after the tests pass.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # stale between dependency bumps; here every push to main saves
          # a fresh one and pull requests restore the newest.
          cache: false  # managed by the restore/save steps below


      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pure-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-pure-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pure-1-${{ runner.os }}-
      - name: unit tests (pure Go shard 1)
        env:
          # Pull requests let Go's test cache skip packages whose transitive
          # inputs are unchanged since the last main push. This shard is
          # hermetic (no Postgres, Docker, or network), so a cached pass is
          # the same observation a re-run would make. Pushes to main re-run
          # everything and shuffle test order to surface order dependence.
          # (Expression shape matters: an empty string is falsy in GitHub
          # expressions, so `cond && '' || X` always yields X.)
          GO_TEST_FRESHNESS: ${{ github.event_name != 'pull_request' && '-count=1 -shuffle=on' || '' }}  # queue counts as non-PR: fresh + shuffled
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -E '(pkg/sched|pkg/fcvm|pkg/gateway|pkg/imaged|pkg/wire|cmd/gatewayd-internal|pkg/api)')
          go test -race $GO_TEST_FRESHNESS -p 4 -timeout=10m -coverprofile=coverage/cover-shard3.out -covermode=atomic $PKGS


      - name: coverage floor (ship-blocking packages)
        # Validates pkg/fcvm, pkg/sched, pkg/gateway ≥ floors defined in
        # Makefile (coverage-floor target). Packages not exercised by
        # this shard's PKGS list print "(no statements — skip)" and
        # don't fail the gate.
        run: make coverage-floor COVERDIR=coverage

      - name: upload to Codecov (pure Go shard 1)
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/cover-shard3.out
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pure-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # Shard 4 (pure Go light): all remaining packages. No Postgres needed.
  unit-tests-pure-2:
    name: unit tests (pure Go shard 2 — light packages)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # This job runs the package shard and property suite sequentially. Each
    # Go command has its own 10-minute test timeout, so the job budget must
    # leave time for both commands plus setup, coverage, and cleanup.
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below


      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pure-2-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-pure-2-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pure-2-${{ runner.os }}-
      - name: unit tests (pure Go shard 2)
        env:
          # See pure shard 1: PRs use Go's test cache; main re-runs + shuffles.
          GO_TEST_FRESHNESS: ${{ github.event_name != 'pull_request' && '-count=1 -shuffle=on' || '' }}  # queue counts as non-PR: fresh + shuffled
        run: |
          mkdir -p coverage
          PKGS=$(go list ./... | grep -v '/cmd/e2e' | grep -vE '(cmd/apid|migrations|pkg/meter|pkg/db|pkg/alerts|pkg/state|pkg/devbridgeintegration|pkg/operations/acceptance|cmd/gregale|cmd/meterd|cmd/schedd|cmd/schema-dump|cmd/githubd|cmd/migrate|cmd/managed-postgres-qualify|pkg/lease|pkg/managedpostgres|pkg/mirror|pkg/outbound|pkg/releaseinstall|pkg/reconcile|pkg/reposcan|pkg/environmentsync/pgintegration|pkg/sched|pkg/fcvm|pkg/gateway|pkg/imaged|pkg/wire|cmd/gatewayd-internal|pkg/api|pkg/e2etest)')
          go test -race $GO_TEST_FRESHNESS -p 4 -timeout=10m -coverprofile=coverage/cover-shard4.out -covermode=atomic $PKGS


      - name: coverage floor (ship-blocking packages)
        # Validates pkg/vmmdgrpc, pkg/vmmdmount ≥ floors defined in
        # Makefile (coverage-floor target). Packages not exercised by
        # this shard's PKGS list print "(no statements — skip)" and
        # don't fail the gate.
        run: make coverage-floor COVERDIR=coverage

      # Property-based tests pin the §6.2 invariants in CLAUDE.md.
      # No KVM/DB needed — pure logic. Lands in this shard because
      # the package list is `tests/property/...` (everything else
      # bucket).
      - name: property-based tests (§6.2 invariants)
        run: make test-property

      - name: upload to Codecov (pure Go shard 2)
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage/cover-shard4.out
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pure-2-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  container-contract:
    name: portable container contracts (strict)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Bounded-memory cold builds reached 14 min before the contracts finished.
    timeout-minutes: 35
    permissions:
      contents: read
    # The UDP contract race-builds cmd/apid; cold, that exhausted hosted-runner
    # memory and the runner was shut down (exit 143) right after pkg/vmmdgrpc
    # in 12 of 22 runs, main included. Mirror unit-tests-pg-1's bounds.
    env:
      GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
      GOMEMLIMIT: 2GiB
      GOGC: 10
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Restore-only on pull requests, like every other family. The previous
      # combined actions/cache step saved a ~1 GB entry for every PR ref and
      # every source-hash change, evicting main's shared families.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore container contract builds
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-container-contract-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-container-contract-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-container-contract-${{ runner.os }}-
      - name: require portable container contracts
        run: |
          set -o pipefail
          make test-container-contract 2>&1 | tee container-contract.log
      # The combined serial race run was repeatedly interrupted by a hosted
      # runner shutdown at ~10 minutes. Keep each invocation bounded while
      # still proving every test discovered by udp-contract-check.py.
      - name: require portable UDP contracts
        run: |
          set -o pipefail
          python3 scripts/ci/udp-contract-check.py --packages pkg/ingressroute pkg/udpd pkg/udpwire cmd/vmmd-udp-bridge 2>&1 | tee udp-contract-ingress.log
      - name: require portable UDP bridge contracts
        run: |
          set -o pipefail
          python3 scripts/ci/udp-contract-check.py --packages pkg/gateway pkg/vmmdgrpc 2>&1 | tee udp-contract-bridge.log
      - name: require portable UDP control-plane contracts
        run: |
          set -o pipefail
          python3 scripts/ci/udp-contract-check.py --packages cmd/apid pkg/api pkg/state 2>&1 | tee udp-contract-control-plane.log
      - name: require portable UDP customer and protocol contracts
        run: |
          set -o pipefail
          python3 scripts/ci/udp-contract-check.py --packages cmd/gregale cmd/gatewayd-public pkg/e2etest api/proto/onebox/faas/vmmd/v1 2>&1 | tee udp-contract-customer-protocol.log
      - name: retain container qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            container-contract.log
            udp-contract-*.log
          if-no-files-found: warn
      - name: save container contract builds
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-container-contract-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  checks:
    # Nine gates that each finished in well under two minutes used to run
    # as nine separate jobs. Each one paid ~40 s of runner spin-up +
    # checkout + setup-go, and — the part that actually hurt — each one
    # occupied one of the account's 20 concurrent-job slots, so a 25-job
    # run could not even start in full and PRs spent a median 17 min
    # queued before a job began (measured on run 34137697561). Folding
    # them into one sequential job trades ~4 min of serial runtime for
    # eight freed slots per run. Every step below is the former job's
    # step, unchanged; the former job names are kept as section markers
    # so `git log -S` still finds them.
    name: checks (drift + contract gates)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Bounded APID compilation can take ~16 minutes on a cold hosted runner;
    # retain time for the remaining SQLC, vulnerability and Ansible gates.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOVULNCHECK_VERSION: "1.7.0"
      # Several contract gates compile the APID test package.
      GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
      GOMEMLIMIT: 2GiB
      GOGC: 10
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          # PR-4b compares changed core-path tests against the event base SHA.
          fetch-depth: 0
      # S4 PR-4b: tests in scheduler, gateway, meter, billing, and Firecracker
      # paths must name the spec section or ADR that defines their behavior.
      - name: spec-cited core-path tests
        run: make spec-cited-tests-check
      - name: spec-cited-tests checker tests
        run: make spec-cited-tests-check-test
      # ADR numbers are hand-picked, so two concurrent PRs routinely claim the
      # same one and whichever merges second keeps it. main already carries 71
      # duplicated numbers. This holds that set at a frozen baseline and fails
      # any NEW collision.
      - name: ADR number uniqueness
        run: make adr-number-uniqueness-check
      - name: ADR number gate checker tests
        run: make adr-number-uniqueness-check-test
      - name: migration-version gate checker tests
        run: make migration-version-hygiene-check-test
      # The two encoding/quoting gates run in `make lint`, but the tests that
      # prove those gates can still FAIL were not wired anywhere — a gate whose
      # fixtures never run is a gate nobody knows is broken.
      - name: text-encoding gate checker tests
        run: make text-encoding-check-test
      - name: shell-quoting gate checker tests
        run: make shell-quoting-check-test
      - name: Gregale Action push-head guard
        run: make deploy-action-head-check
      - name: Gregale environment preflight Action contract
        run: make environment-preflight-action-check
      - name: synthetic-canary alert payload tests
        run: make canary-alert-test
      # ---- former job `workflow-lint`: workflow YAML lint + native builder toolchain contract ----
      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-checks-${{ runner.os }}-
      # Restore the module cache before setup-go downloads the requested
      # toolchain. The cache includes ~/go/pkg/mod; reversing this order makes
      # a cache hit untar over the toolchain's existing files and can hang the
      # runner with "Cannot open: File exists".
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below
      - name: complete E2E shard inventory
        run: go run ./scripts/ci/e2eshard -check -shards=4
      - name: generate Gregale workflow lint fixtures
        run: bash scripts/ci/generate-github-workflow-lint-fixtures.sh
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          version: v1.7.12
          args: -shellcheck ''
      - name: remove Gregale workflow lint fixtures
        if: always()
        run: rm -f .github/workflows/gregale-generated-check-"$GITHUB_RUN_ID"-*.yml
      - name: release asset-name uniqueness
        run: bash scripts/ci/check-release-assets_test.sh
      - name: release asset upload retry and immutability
        run: bash scripts/ci/upload-release-assets_test.sh
      - name: GitHub deploy Action pin resolver contract
        run: bash scripts/ci/resolve-github-action-pin_test.sh
      - name: native builder Go toolchain bundle contract
        run: bash scripts/ci/package-go-toolchain_test.sh
      - name: native metal invocation contract
        run: bash scripts/ci/run-native-metal-smoke_test.sh
      - name: native e2e invocation contract
        run: bash scripts/ci/run-native-e2e_test.sh
      - name: native e2e phase partition contract
        run: bash scripts/ci/native-e2e-phases_test.sh
      - name: GCP OS Login preflight contract
        run: bash scripts/ci/gcp-oslogin-preflight_test.sh
      # ---- former job `capabilities-check`: product capability registry ----
      - name: product capability registry and generated matrix
        run: make capabilities-check
      - name: standards registry and generated matrix
        run: make standards-check standards-conformance standards-contract-check focus-contract-check
      - name: customer docs and pricing
        run: make pricing-check docs-links-check
      # ---- former job `api-hosting-contract-check`: framework fixture matrix ----
      - name: framework fixture matrix
        run: make api-hosting-contract-check
      # The scorecard is the release evidence contract. It checks that every
      # public capability has measurable targets and live evidence locators;
      # runtime measurements are produced by the referenced acceptance jobs.
      - name: API-hosting scorecard evidence
        run: make api-hosting-scorecard-check
      # ---- former job `daemonunit-check`: daemonunit generated drift ----
      - name: generate-check
        run: make generate-check
      # ---- former job `sqlc-check`: sqlc generated drift ----
      - name: install sqlc
        # Belt + suspenders: refuse to run on a non-x86_64 runner instead
        # of silently picking the wrong tarball. Matches the spec-check
        # job's vacuum install step.
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::sqlc install assumes x86_64; runner is $(uname -m)"
            exit 1
          fi
          SQLC_TARBALL="sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          SQLC_URL="https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/${SQLC_TARBALL}"
          mkdir -p "$HOME/.local/sqlc/bin"
          TAR="$RUNNER_TEMP/${SQLC_TARBALL}"
          echo "→ downloading $SQLC_URL"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --output "$TAR" "$SQLC_URL"
          echo "→ verifying SHA-256"
          echo "${SQLC_SHA256_LINUX_AMD64}  $TAR" | sha256sum --check --strict
          echo "→ extracting"
          # The tarball is flat (just `sqlc`) — no version directory —
          # so we extract into a temp scratch and copy the binary to the
          # stable install path.
          tar --extract --gzip --file "$TAR" --directory "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/sqlc" "$HOME/.local/sqlc/bin/sqlc"
          chmod +x "$HOME/.local/sqlc/bin/sqlc"
          echo "→ installed: $("$HOME/.local/sqlc/bin/sqlc" version)"
          echo "$HOME/.local/sqlc/bin" >> "$GITHUB_PATH"
      - name: sqlc-check
        # The install sqlc step above appends $HOME/.local/sqlc/bin to
        # $GITHUB_PATH, so `make sqlc` finds the binary via PATH lookup
        # and short-circuits before the `go install` fallback.
        run: make sqlc-check
      # ---- former job `spec-check`: OpenAPI lint + AST parity ----
      - name: install vacuum
        run: |
          # Belt + suspenders: refuse to run on a non-x86_64 runner instead
          # of silently picking the wrong tarball. This matches the
          # `runs-on: ubuntu-latest` job contract.
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::vacuum install assumes x86_64; runner is $(uname -m)"
            exit 1
          fi

          # All interpolation happens in the shell — the env block above
          # only carries the version + SHA-256 pin, both of which MUST be
          # raw strings (no shell interpolation) so a future bump is a
          # single edit. `${VACUUM_VERSION}` in an env: value is NOT
          # expanded by GitHub Actions — we build the URL here.
          VACUUM_TARBALL="vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz"
          VACUUM_URL="https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/${VACUUM_TARBALL}"
          mkdir -p "$HOME/.local/vacuum/bin"
          TAR="$RUNNER_TEMP/${VACUUM_TARBALL}"
          echo "→ downloading $VACUUM_URL"
          curl --fail --silent --show-error --location --output "$TAR" "$VACUUM_URL"
          echo "→ verifying SHA-256"
          echo "${VACUUM_SHA256_LINUX_AMD64}  $TAR" | sha256sum --check --strict
          echo "→ extracting"
          # The tarball is flat (LICENSE, README.md, vacuum) — no version
          # directory — so we extract into a temp scratch and copy the
          # binary to the stable install path.
          tar --extract --gzip --file "$TAR" --directory "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/vacuum" "$HOME/.local/vacuum/bin/vacuum"
          chmod +x "$HOME/.local/vacuum/bin/vacuum"
          echo "→ installed: $("$HOME/.local/vacuum/bin/vacuum" version)"
          echo "$HOME/.local/vacuum/bin" >> "$GITHUB_PATH"
      - name: spec-check
        # The install vacuum step above appends $HOME/.local/vacuum/bin
        # to $GITHUB_PATH, so `make spec-install` finds the binary via
        # `command -v vacuum` (PATH lookup) and short-circuits before
        # the `go install` fallback. No GOBIN override needed: the
        # Makefile's `$(GOBIN)` default (`go env GOPATH/bin`) is the
        # correct install location for the local-dev `go install` path.
        run: make spec-check
      # ---- former job `sdk-go`: Go SDK build + vet + test ----
      - name: go build
        working-directory: sdk/go
        run: go build ./...
      - name: go vet
        working-directory: sdk/go
        run: go vet ./...
      - name: go test
        working-directory: sdk/go
        run: go test -count=1 ./...
      # The provider is a nested module so it is not included in the root
      # module's ./... traversal. Keep its contract beside the SDK gates.
      - name: terraform provider build and test
        working-directory: terraform-provider-gregale
        run: go test -count=1 ./...
      # ---- former job `packer-validate`: Packer syntax gate (ADR-111) ----
      - name: install-packer (pinned)
        run: scripts/install-packer.sh
      - name: packer validate -syntax-only
        run: make image-validate
      # ---- former job `image-scan`: govulncheck (severity high+) ----
      - name: download Go modules with retry
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 120s go mod download; then
              echo "Go modules downloaded on attempt ${attempt}"
              exit 0
            fi
            if [[ "${attempt}" == 3 ]]; then
              echo "Go module download failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
      - name: govulncheck (severity high+)
        # govulncheck exit code 3 = findings at or above the
        # requested level. Failure propagates as a non-zero step.
        # The level filter is the issue #299 acceptance bullet
        # ("fail on Severity HIGH+"); the default mode is 'source'
        # which mirrors what the `test` job at line 95-101 runs (no
        # behavior regression on daemons that don't expose
        # high-severity findings today).
        run: |
          set -euo pipefail
          govulncheck -mode=source -show=verbose ./...
      - name: terraform provider vulnerability scan
        working-directory: terraform-provider-gregale
        # A nested module is absent from the root ./... traversal. Scan the
        # provider's selected dependencies, including its plugin RPC server.
        run: govulncheck -mode=source -show=verbose ./...
      # ---- moved from `lint + build`: Prometheus rule + ansible gates ----
      # These need pip (ansible-core, ansible-lint), a pinned promtool and
      # ~90 s of wall time, none of which the Go lint/build critical path
      # should carry. `make ansible-scale-check` builds ./bin/gregalectl
      # itself when `make build` has not run in this job.
      # promtool check rules — gate for spec §12 alert rules. Downloads
      # the same Prometheus release the ansible role pins
      # (deploy/ansible/roles/prometheus/defaults/main.yml:prom_version)
      # so the CI version is the production version. A broken rule
      # (typo in metric label, bad histogram_quantile, dangling
      # matcher) breaks the alert at boot, so we lint at PR time
      # instead of letting the operator find out via a 5 a.m. page
      # that never fires. Two files are linted: the consolidated
      # faas.rules.yml and the per-alert sibling
      # pkg/promqlrules/data_placement.yaml (ADR-098 §9.A, issue
      # #951).
      #
      # Note: production SHA-256 pin (prom_release_sha256) is enforced
      # by the role's assert at bootstrap (`make bootstrap`), NOT here.
      # CI's job is to lint rule syntax, not to verify production
      # pinning — those are separate concerns.
      - name: promtool check rules
        run: |
          set -euo pipefail
          PROM_TARBALL="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o "/tmp/${PROM_TARBALL}" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${PROM_TARBALL}"
          echo "${PROM_TARBALL_SHA256_LINUX_AMD64}  /tmp/${PROM_TARBALL}" | sha256sum --check --strict
          tar -xzf "/tmp/${PROM_TARBALL}" -C /tmp "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo mv "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool check rules \
            deploy/ansible/roles/prometheus/files/faas.rules.yml \
            pkg/promqlrules/data_placement.yaml
          promtool test rules deploy/ansible/roles/prometheus/files/faas_safe_release.test.yml
          promtool test rules deploy/ansible/roles/prometheus/files/faas_managed_postgres_health.test.yml
          promtool test rules pkg/promqlrules/testdata/service_dependency_errors.test.yml
          make udp-alert-check tcp-tls-alert-check commit-alert-check host-alert-check

      - name: Prometheus alert metadata check
        run: make prometheus-alert-metadata-check

      # ansible syntax gate. deploy/ansible/ is the source of truth for the
      # box's systemd units, sysctls and secret file modes, but nothing in
      # CI ever parsed it — so it rotted. When this gate was added, SIX role
      # files did not parse as YAML at all (unquoted `name:` values holding
      # a `: `, a `when:` opening with a double-quoted path, `failed_when:`
      # OR-chains whose continuation lines sat at the `-` indent), and the
      # tree failed before ansible even reached module resolution.
      #
      # That is why the deploy roles drifted from the live box: three copies
      # of faas-imaged.service existed and two were missing /srv/fc/base
      # while all three were missing /srv/fc/sigs, which crash-looped imaged
      # and took cd-digitalocean red (PR #374, #375). Nothing could have
      # caught it, because the playbook was unrunnable.
      #
      # --syntax-check both parses every file and RESOLVES every module, so
      # it also catches semantics YAML alone can't: a task-level `creates:`
      # that ansible rejects as a conflicting action statement (and which
      # silently disabled the kernel-extract idempotency guard), and a role
      # adopting a collection that requirements.yml doesn't pin.
      #
      # ansible-core is version-pinned for the same reason promtool is: the
      # gate should fail on OUR drift, not on an upstream release. Deprecation
      # warnings are printed but not fatal — ansible-core's deprecation
      # schedule is outside this repo's control.
      - name: ansible syntax-check
        run: |
          set -euo pipefail
          pip install --quiet 'ansible-core==2.21.2'
          python3 scripts/ci/test_udp_deployment.py
          cd deploy/ansible
          COLLECTIONS_PATH="${RUNNER_TEMP}/ansible-collections"
          export ANSIBLE_COLLECTIONS_PATH="${COLLECTIONS_PATH}"
          echo "ANSIBLE_COLLECTIONS_PATH=${COLLECTIONS_PATH}" >> "${GITHUB_ENV}"
          # ansible-core can retain a malformed Galaxy response cache on a
          # hosted runner. Do not let that cache turn this repository contract
          # into an unrelated infrastructure failure.
          galaxy_ok=0
          for attempt in 1 2 3; do
            if ansible-galaxy collection install \
              --no-cache --timeout 30 \
              --collections-path "${COLLECTIONS_PATH}" \
              -r requirements.yml; then
              galaxy_ok=1
              break
            fi
            if [ "${attempt}" != "3" ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "${galaxy_ok}" != "1" ]; then
            echo "::warning::Ansible Galaxy unavailable; using pinned GitHub collection sources"
            rm -rf -- "${COLLECTIONS_PATH}/ansible_collections"
            mkdir -p "${COLLECTIONS_PATH}/ansible_collections/ansible"
            mkdir -p "${COLLECTIONS_PATH}/ansible_collections/community"
            git clone --depth 1 --branch 2.2.2 --single-branch \
              https://github.com/ansible-collections/ansible.posix.git \
              "${COLLECTIONS_PATH}/ansible_collections/ansible/posix"
            git clone --depth 1 --branch 5.0.0 --single-branch \
              https://github.com/ansible-collections/community.postgresql.git \
              "${COLLECTIONS_PATH}/ansible_collections/community/postgresql"
          fi
          ansible-playbook -i localhost, -c local tests/tcp_tls_config.yml
          # Gate-A: parse the complete-inventory safety preflight.
          ansible-playbook --syntax-check preflight.yml
          # Gate-B: syntax-check the only production bootstrap playbook
          # before an operator can run either role-specific target.
          ansible-playbook --syntax-check bootstrap.yml
          # ADR-580: the CD entrypoint that wraps the control-plane play.
          ansible-playbook --syntax-check control_plane_converge.yml
          # Gate-C: keep the connection-free scale validator parseable.
          ansible-playbook --syntax-check scale_check.yml
          # Gate-D: keep the trusted deployment-runner bootstrap parseable.
          ansible-playbook --syntax-check fleet_runner.yml
          # ADR-143: the post-activation verify playbook is production
          # tooling (`make verify-fleet`) and must stay parseable.
          ansible-playbook --syntax-check verify.yml
          # Internal mTLS renewal is a scheduled production entrypoint.
          ansible-playbook --syntax-check pki_renew.yml
          # ADR-372: the tenant egress gateway converge entrypoint.
          ansible-playbook --syntax-check tenant_egress_gateway.yml
          # Gate-F: the opt-in acceptance playbooks. Neither was parsed by any
          # job, so a syntax error in them would only surface when an operator
          # ran one by hand against a real host.
          ansible-playbook --syntax-check metal-h2c-acceptance.yml
          ansible-playbook --syntax-check native-acceptance-host.yml
          # Gate-E: render and validate the 1/10/100/1000 compute-node
          # topologies, then run Ansible check-mode against the largest one.
          cd ../..
          GREGALE_ANSIBLE_SCALE_CHECK=1 go test -count=1 -timeout=5m ./cmd/gregalectl -run '^TestRenderManifestAnsibleFiles_ScaleMatrix$'
          # ADR-143: scale_check.yml carried real asserts for months but was
          # only ever --syntax-check'ed (which evaluates nothing). Run it.
          make ansible-scale-check ANSIBLE_PLAYBOOK=ansible-playbook

      # ADR-143: ansible-lint at the production profile. Config + the three
      # deliberately skipped cosmetic rules live in deploy/ansible/.ansible-lint.
      # Pinned like ansible-core so the gate fails on OUR drift only.
      - name: ansible-lint
        run: |
          set -euo pipefail
          pip install --quiet 'ansible-lint==26.8.0'
          make ansible-lint
          # Join and control-plane adoption plays are separate production
          # entrypoints and must be parsed independently; bootstrap syntax
          # checking does not cover their task bodies.
          ansible-playbook --syntax-check deploy/ansible/node_join.yml
          ansible-playbook --syntax-check deploy/ansible/node_join_control_plane.yml

      # Render the control-plane Prometheus artifacts with the production
      # inventory. Syntax-check does not evaluate Jinja, so it would not catch
      # a template stored in the wrong role directory or a missing HTTP-SD
      # target for the split-box compute fleet.
      - name: observability template convergence
        run: |
          set -euo pipefail
          cd deploy/ansible
          test ! -e roles/prometheus/files/prometheus.service
          test ! -e roles/node_exporter/files/node_exporter.service
          ansible control_plane -i inventory/hosts.ini -c local \
            -e @roles/prometheus/defaults/main.yml \
            -e ansible_hostname=ci-control-plane \
            -m ansible.builtin.template \
            -a "src=$(pwd)/roles/prometheus/templates/prometheus.yml.j2 dest=$RUNNER_TEMP/prometheus.yml"
          ansible control_plane -i inventory/hosts.ini -c local \
            -e @roles/prometheus/defaults/main.yml \
            -e ansible_hostname=ci-control-plane \
            -e prom_promtail_enabled=true \
            -m ansible.builtin.template \
            -a "src=$(pwd)/roles/prometheus/templates/prometheus.yml.j2 dest=$RUNNER_TEMP/prometheus-with-promtail.yml"
          ansible control_plane -i inventory/hosts.ini -c local \
            -e @roles/prometheus/defaults/main.yml \
            -e ansible_hostname=ci-control-plane \
            -m ansible.builtin.template \
            -a "src=$(pwd)/roles/prometheus/templates/prometheus.service.j2 dest=$RUNNER_TEMP/prometheus.service"
          grep -q 'job_name: "gatewayd-internal"' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'http://127.0.0.1:9101/v1/internal/metrics/targets' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'job_name: "vmmd"' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'http://127.0.0.1:9101/v1/internal/metrics/vmmd-targets' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'job_name: "imaged"' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'http://127.0.0.1:9101/v1/internal/metrics/imaged-targets' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'job_name: "builderd"' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'http://127.0.0.1:9101/v1/internal/metrics/builderd-targets' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'job_name: "node-compute"' "$RUNNER_TEMP/prometheus.yml"
          grep -q 'http://127.0.0.1:9101/v1/internal/metrics/node-targets' "$RUNNER_TEMP/prometheus.yml"
          if grep -q 'job_name: "promtail' "$RUNNER_TEMP/prometheus.yml"; then
            echo 'default Prometheus config scrapes Promtail without an enabled Loki transport' >&2
            exit 1
          fi
          grep -q 'job_name: "promtail"' "$RUNNER_TEMP/prometheus-with-promtail.yml"
          grep -q 'job_name: "promtail-compute"' "$RUNNER_TEMP/prometheus-with-promtail.yml"
          grep -q 'http://127.0.0.1:9101/v1/internal/metrics/promtail-targets' "$RUNNER_TEMP/prometheus-with-promtail.yml"
          grep -q 'target_limit: 1000' "$RUNNER_TEMP/prometheus.yml"
          grep -q -- '--web.listen-address=127.0.0.1:9095' "$RUNNER_TEMP/prometheus.service"
          if grep -q '{{' "$RUNNER_TEMP/prometheus.service"; then
            echo 'rendered Prometheus systemd unit contains an unresolved template placeholder' >&2
            exit 1
          fi
          ansible compute_nodes -i inventory/hosts.ini -c local \
            -e @roles/node_exporter/defaults/main.yml \
            -m ansible.builtin.template \
            -a "src=$(pwd)/roles/node_exporter/templates/node_exporter.service.j2 dest=$RUNNER_TEMP/node_exporter.service"
          grep -q -- '--web.listen-address=127.0.0.1:9100' "$RUNNER_TEMP/node_exporter.service"
          if grep -q '{{' "$RUNNER_TEMP/node_exporter.service"; then
            echo 'rendered node_exporter systemd unit contains an unresolved template placeholder' >&2
            exit 1
          fi
          grep -q -- '--cluster.listen-address=' roles/alertmanager/files/alertmanager.service

          rules_dir="$RUNNER_TEMP/prometheus-rules"
          mkdir -p "$rules_dir"
          cp roles/prometheus/files/{faas.rules.yml,bridge.rules.yml,pg_backup.rules.yml} "$rules_dir/"
          cp ../../pkg/promqlrules/data_placement.yaml "$rules_dir/"
          sed "s#/etc/prometheus#$rules_dir#g" \
            "$RUNNER_TEMP/prometheus.yml" > "$RUNNER_TEMP/prometheus-checked.yml"
          promtool check config "$RUNNER_TEMP/prometheus-checked.yml"

      # Nothing else renders alertmanager.yml.j2 before it reaches a host.
      # Render every delivery shape (dev, Discord + heartbeat, Slack, email +
      # Pushover, Pushover only), validate with the pinned amtool, and prove
      # page / warn / FaasWatchdog reach the receivers the role promises.
      - name: Alertmanager config check
        run: make alertmanager-config-check
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # fakeapid fixture (issue #266, PR 4). The cross-language smoke
  # fixture for the public SDKs — a stdlib-only Go binary that
  # mimics apid's surface so Node (PR 5) and Python (PR 6) SDKs
  # can smoke-test against a real HTTP process. The fixture must
  # build + test cleanly with no external deps; this gate fails
  # the PR if a regression breaks the wire shape.
  #
  # Mirrors sdk-go: same GO_VERSION, no services, no path filters
  # (the existing convention is "no filter" so we don't accidentally
  # skip the gate when a non-sdk change touches the workflow).
  # PR 5/6 will invoke this job's pre-built ./bin/fakeapid from
  # their own `-tags smoke_bin` runs to assert artifact
  # compatibility (see sdk/fakeapid/main_bin_test.go).
  # Node SDK gate: gen-check + fakeapid fixture build + smoke + unit tests
  sdk-node:
    name: sdk-node (gen-check + smoke + unit)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json
      - name: build fakeapid fixture
        working-directory: sdk/fakeapid
        run: go build -o bin/fakeapid .
      - name: npm ci
        working-directory: sdk/node
        run: npm ci --no-audit --no-fund
      - name: gen:check (regenerate + assert clean diff)
        working-directory: sdk/node
        run: |
          npm run gen:check || {
            echo "::error::sdk/node/src/generated is out of sync with api/openapi.yaml."
            echo "::error::Run 'make sdk-gen-node-check' locally and commit the result."
            exit 1
          }
      # Determinism gate (Makefile:771 sdk-gen-node-twice): regen twice
      # and assert zero diff. A flaky codegen can pass a single-shot
      # gen:check (output stable across one regen) but produce
      # different files on the second run — breaking customer pins.
      # npm ci + the gen:check above already paid the cache warmup
      # cost, so the second regen is ~3 s. Wall cost fits the 5-min
      # job budget.
      - name: regen determinism (twice)
        # Each `npm run gen:check` already ends with `git diff --exit-code
        # -- src/generated` (sdk/node/package.json:30); chaining it twice
        # is the determinism invariant (clean regen → clean regen → still
        # clean). Two regens, two diffs — no third trailing diff needed.
        working-directory: sdk/node
        run: npm run gen:check && npm run gen:check
      - name: smoke test
        working-directory: sdk/node
        run: npm run test:smoke
      - name: unit tests
        working-directory: sdk/node
        run: npm run test:unit
      - name: Gregale Issues staging smoke contract
        run: node --test tests/issues-smoke/run.test.mjs

  workflow-operation-starter-browser:
    name: customer Operations starters (Chromium + packed SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json
      - name: install SDK development dependencies
        working-directory: sdk/node
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: install pinned Chromium for browser acceptance
        working-directory: sdk/node
        run: npx playwright-core install --with-deps chromium
      - name: HTTP, Job, and Workflow starter flows in real browsers
        working-directory: sdk/node
        run: npm run test:operations-starter-browser

  customer-operation-starters:
    name: customer Operations starters (generated types + packed SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json
      - name: install SDK development dependencies
        working-directory: sdk/node
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build and pack the SDK
        working-directory: sdk/node
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/operations-sdk"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/operations-sdk"
      - name: build Gregale CLI
        run: go build -o "$RUNNER_TEMP/gregale" ./cmd/gregale
      - name: generate and type-check every starter against the packed SDK
        env:
          GREGALE_BIN: ${{ runner.temp }}/gregale
          SDK_PACK_DIR: ${{ runner.temp }}/operations-sdk
        run: scripts/ci/check-customer-operation-starters.sh

  # ADR-484: real customer PostgreSQL transactions and HTTP process recovery.
  # Required database tests must run; unit-only SDK jobs skip these fixtures.
  operation-sdk-acceptance:
    name: operations (transaction + HTTP recovery + cross-SDK)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/commit-tests/requirements.txt
      - name: install SDK acceptance dependencies
        run: |
          npm ci --prefix sdk/node --ignore-scripts --no-audit --no-fund
          python -m pip install -e sdk/python -r sdk/commit-tests/requirements.txt
      - name: producer, handler and Customer Operations recovery acceptance
        # APID test DWARF generation exceeds hosted-runner memory on cold builds.
        # Omit test debug metadata and serialize its backend; keep optimization.
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
          GOMEMLIMIT: 2GiB
          GOGC: 10
          GOMAXPROCS: 2
        run: make test-commit-sdk test-customer-operation-sdk
      - name: Customer Job and Workflow Operations guest fixture contracts (portable)
        # testdata is intentionally excluded by go test ./.... Run its
        # reporting, workload identity, cancellation and lost-ack contracts explicitly.
        run: go test -race -count=1 -timeout=2m ./pkg/e2etest/testdata/jobfixture

  # ADR-377: exercise the actual runtime SDK, control plane, gateway and
  # telemetry persistence together; the small fakeapid fixture cannot prove
  # verified customer targeting or refresh after inactivity.
  flags-acceptance:
    name: flags (customer release + request evidence)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json
      - name: customer-aware feature flag acceptance
        # APID test DWARF generation exceeds hosted-runner memory on cold builds.
        # Omit test debug metadata and serialize its backend; keep optimization.
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/apid=-dwarf=false -c=1"'
          GOMEMLIMIT: 2GiB
          GOGC: 10
          GOMAXPROCS: 2
        run: make test-flags

  # Python SDK gate: gen-check + fakeapid fixture build + smoke + unit tests
  sdk-python:
    name: sdk-python (gen-check + smoke + unit)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml
      - name: build fakeapid fixture
        working-directory: sdk/fakeapid
        run: go build -o bin/fakeapid .
      - name: install SDK + test deps
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruamel.yaml 'openapi-python-client==0.29.0' pytest pytest-asyncio httpx
          python -m pip install -e .
      - name: gen + assert clean diff
        working-directory: sdk/python
        run: |
          python scripts/gen.py
          git diff --exit-code -- faas_sdk/ || {
            echo "::error::sdk/python/faas_sdk is out of sync with api/openapi.yaml."
            echo "::error::Run 'make sdk-gen-python-check' locally and commit the result."
            exit 1
          }
      # Determinism gate (Makefile:795 sdk-gen-python-twice): regen
      # twice and assert zero diff. Inline form (not `make
      # sdk-gen-python-twice`) because the Makefile target hard-codes
      # `sdk/python/.venv/bin/python` (Makefile:797) and CI's
      # sdk-python job installs deps system-wide (line 758-761), not
      # into a venv — the Makefile target would fail with "no such
      # file or directory". The pre-existing single step in this job
      # was named "smoke + unit + regen determinism" but only ran
      # pytest; this split makes the contract honest.
      - name: regen determinism (twice)
        working-directory: sdk/python
        run: |
          python scripts/gen.py && python scripts/gen.py && git diff --exit-code -- faas_sdk/
      - name: smoke + unit
        working-directory: sdk/python
        run: python -m pytest tests/ --ignore=tests/debug_chain.py -v


  load:
    # M4 acceptance gate (spec §14 row 2): "1,000 rps to hot app adds < 2 ms p50".
    # Decoupled from the `test` job because (a) it is a load test, not a
    # coverage gate — coverage instrumentation skews latency and is
    # intentionally excluded; (b) it runs long (2 × 5 s + warmup) and
    # would lengthen the developer feedback loop if folded into `test`.
    #
    # Runner choice: `ubuntu-latest` (2 vCPU / 7 GB GitHub-hosted). The
    # test's gate is the DELTA between hot-load p50 and idle p50, not
    # absolute latency — per-process noise (Go runtime, GC, scheduler
    # jitter, CPU frequency scaling) cancels out. A 14-core local M-series
    # machine measures delta < 0 at 1k rps; the 2 vCPU on CI has plenty of
    # headroom for the same 5 s × 1k rps window. An earlier draft used
    # `ubuntu-4-cpus` (GitHub-hosted larger runner), but those need
    # org-level enablement (Settings → Actions → Runners → Larger runners)
    # and otherwise queue forever — our org doesn't have them provisioned,
    # so the job sat QUEUED for ~19 h without starting.
    name: load (1k rps hot-path)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below
      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-load-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-load-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-load-${{ runner.os }}-
      - name: download Go modules with retry
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 45s go mod download; then
              echo "Go modules downloaded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Go module download failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Go module download attempt ${attempt} failed; retrying in ${delay}s" >&2
            sleep "${delay}"
          done
      - name: make test-load
        run: make test-load
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-load-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  migration-checks:
    # ADR-142 freezes the legacy 1..590 sequence and moves all new migrations
    # to collision-resistant UTC timestamp IDs. The static check validates
    # both namespaces; apply-and-walk verifies exact ledger set membership so
    # a higher timestamp cannot hide a lower migration merged afterward.
    #
    # 2026-07-31 follow-up: this job failed on the main push with a Docker
    # Hub pull timeout (`registry-1.docker.io/v2/: context deadline
    # exceeded`) on the Azure centralus runner. Switch the image to
    # mirror.gcr.io (Google's transparent mirror of Docker Hub, no auth,
    # no per-IP rate limit) — same pattern as FAAS_BUILDER_BASE_REF on
    # the prod box (the retired v1 deploy/controlplane/sealed.env.example —
    # RETIRED 2026-08-15 by issue #911 / PR-1; v2 path is PR-X
    # `gregale secrets init`). A pre-step `docker pull` with retry
    # covers the case where the service container's own pull path
    # flakes before the retry.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          # A full-schema teardown locks thousands of relations. Without
          # headroom failed cleanup leaks schemas into later migration tests.
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
    name: migration IDs, apply and replay
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      full-suite-needed: ${{ steps.migration-impact.outputs.needed }}
    steps:
      # 2026-07-31: pre-pull postgres with 3-attempt retry. This job
      # is the one that actually hit the Docker Hub pull timeout on
      # the main push; the retry is the second layer after the
      # mirror.gcr.io image swap.
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:16; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      # fetch-depth: 0 — replay-safety diffs against origin/<base>.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below
      # PR-P4 — assert deploy/scripts/verify-secrets.sh is shaped
      # correctly (executable, bash-parseable, presence of the
      # Paddle + Stripe blocks added by Streams A + B). The
      # script itself runs against /etc/faas/sealed.env on a real
      # control-plane node; CI only checks it parses + has the
      # expected Polar+legacy-provider block headers, via a hermetic
      # SECRETS_FILE override (an empty fixture that the script
      # must not reject as malformed). see cmd/gregale/_test for
      # the equivalent CLI flag parse-tripwire pattern.
      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-migrations-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-migrations-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-migrations-${{ runner.os }}-
      - name: verify-secrets.sh static check
        run: |
          set -euo pipefail
          test -x deploy/scripts/verify-secrets.sh
          bash -n deploy/scripts/verify-secrets.sh
          grep -q "FAAS_POLAR_ACCESS_TOKEN" deploy/scripts/verify-secrets.sh
          grep -q "FAAS_BILLING_PROVIDER=polar" deploy/scripts/verify-secrets.sh
          grep -q "FAAS_POLAR_METER_ID" deploy/scripts/verify-secrets.sh

      # Collision prevention, not collision reporting. The slot gate compares
      # against main as it is right now, so two pull requests can each pass
      # and still break main when the second merges — five times this week.
      # GitHub's merge queue would fix the class but needs an org-owned repo;
      # this one is user-owned.
      - name: migration version hygiene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make migration-version-hygiene-check

      - name: migrations check (static)
        run: make migrations-check
      # No `-tags no_pg` here on purpose: apply_walk_test.go carries
      # `//go:build !no_pg`, so the static-only `make migrations-check`
      # step skips it and this step picks it up. The `-run` filter
      # narrows to the single apply test; the five static tests live
      # in embed_test.go and are not built under `!no_pg` exclusion
      # here because their package has no build tag.
      - name: migrations apply-and-walk
        run: go test -race -count=1 -v -run TestMigrationsApplyAndWalk ./migrations/...

      # Replay safety for migrations this diff ADDS. apply-and-walk above
      # migrates a FRESH database, which is the one state the DO box is never
      # in: twice its schema has been AHEAD of its goose ledger and the deploy
      # died mid-apply on a migration CI had passed —
      #   00030_invocations:            relation "invocations" already exists
      #   00053_deployments_source_url: column "source_url" already exists
      # Only NEW migrations are replayed: 00001_init is legitimately not
      # re-runnable, and replaying from zero against a populated database is
      # not a scenario worth surviving. See migrations/replay_safety_test.go.
      - name: compute added migration versions
        id: newmig
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group" ]]; then
            # merge_group sets base_ref to the target branch too, and the
            # queue's merge ref already contains main, so merge-base is the
            # right anchor for both.
            git fetch -q origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            # push to main: compare against the commit before this one, so a
            # direct merge still exercises whatever it introduced.
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          versions="$(git diff --name-only --diff-filter=A "${base}" HEAD -- 'migrations/*.sql' \
            | sed -nE 's|.*/([0-9]+)_.*\.sql$|\1|p' | sort -u | paste -sd, -)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "added migration versions: ${versions:-<none>}"
      - name: migrations replay-safety (new migrations only)
        env:
          FAAS_REPLAY_CHECK_VERSIONS: ${{ steps.newmig.outputs.versions }}
        run: go test -race -count=1 -v -run TestNewMigrationsAreReplaySafe ./migrations/...

      - name: migration full-suite impact checker tests
        run: scripts/ci/migration-full-suite-needed_test.sh

      - name: classify full migration suite impact
        id: migration-impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Main and explicit manual runs retain unconditional full-history
          # coverage. Pull requests and merge-queue refs use the exact diff so
          # deployment/docs/UI-only changes do not replay the complete
          # history in hundreds of isolated database tests.
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            needed=true
            echo "full migration suite required for ${EVENT_NAME}"
          elif [[ -z "$BASE_REF" ]]; then
            needed=true
            echo "::warning::base ref unavailable; running the full migration suite"
          else
            git fetch -q origin "$BASE_REF"
            base="$(git merge-base HEAD "origin/${BASE_REF}")"
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'changed paths considered for full migration suite:\n%s\n' "$changed"
            if printf '%s\n' "$changed" | scripts/ci/migration-full-suite-needed.sh; then
              needed=true
            else
              needed=false
            fi
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-migrations-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # Every default-build migration test, fuzz seed and runnable example runs
  # exactly once. Each shard owns a separate PostgreSQL service and still
  # replays the full history into each test's isolated schema. The growing
  # single-package inventory exceeded its cumulative one-hour deadline.
  migrations-full:
    name: migration history (shard ${{ matrix.shard }})
    needs: migration-checks
    if: needs.migration-checks.outputs.full-suite-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # pgx honors DSN runtime parameters, unlike PGOPTIONS. Commit fsync is
      # unnecessary for this disposable fixture; production settings stay intact.
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable&synchronous_commit=off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # All four shards compile the identical non-race ./migrations test
          # binary, so they share one cache entry (written by shard 1 only).
          key: go-migrations-history-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-migrations-history-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-migrations-history-${{ runner.os }}-
            go-migrations-${{ runner.os }}-
      - name: verify complete migration inventory
        run: |
          mkdir -p migration-results
          go test -list . ./migrations > migration-results/inventory.txt
          go run ./scripts/ci/e2eshard -package=./migrations -all-tests -shards=4 -check -list-file=migration-results/inventory.txt
      - name: migration history tests (shard ${{ matrix.shard }})
        # Keep every test's original production and test sources. No -race
        # here, matching the previous full suite; concurrent apply/replay
        # still run with the race detector in migration-checks above.
        run: |
          MIGRATION_RUN=$(go run ./scripts/ci/e2eshard -package=./migrations -all-tests -shards=4 -shard=${{ matrix.shard }})
          go test -count=1 -timeout=60m -run="$MIGRATION_RUN" ./migrations
      - name: save Go build + test cache
        # One writer per shared key; see unit-tests-state.
        if: always() && github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-migrations-history-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

  # Keep the exact branch-protection context. A failed/cancelled prerequisite
  # or shard must fail this gate; only the impact policy can skip the suite.
  migrations:
    name: migrations (IDs + apply)
    if: always() && github.event.pull_request.draft != true
    needs: [migration-checks, migrations-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require migration checks and every required history shard
        env:
          CHECKS_RESULT: ${{ needs.migration-checks.result }}
          FULL_SUITE_NEEDED: ${{ needs.migration-checks.outputs.full-suite-needed }}
          FULL_SUITE_RESULT: ${{ needs.migrations-full.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHECKS_RESULT" != success ]]; then
            echo "::error::Migration ID/apply/replay checks did not pass: $CHECKS_RESULT"
            exit 1
          fi
          case "$FULL_SUITE_NEEDED:$FULL_SUITE_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "::error::Required migration history suite did not pass: needed=$FULL_SUITE_NEEDED result=$FULL_SUITE_RESULT"
              exit 1
              ;;
          esac

  boot-contract:
    # Issue #1529 S3: execute production-shaped daemon boot contracts in a
    # dedicated job. Keep this separate from the name-sharded e2e jobs so a
    # new TestBootContract_* cannot compile successfully without ever running.
    name: boot-contract (production config)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@localhost:5432/faas?sslmode=disable
      FAAS_SKIP_PG_TESTS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: boot-contract tests
        # GitHub-hosted runners retain CAP_SYS_ADMIN in CapBnd even though the
        # unprivileged runner user has no effective capabilities. Production
        # faas-imaged.service removes it from CapabilityBoundingSet and refuses
        # to boot when it is reachable. Reproduce that security boundary before
        # dropping back to the runner uid for the test process.
        run: |
          BOOT_CONTRACT_PATH="$PATH"
          sudo -E setpriv \
            --bounding-set=-sys_admin \
            --reuid "$(id -u)" \
            --regid "$(id -g)" \
            --init-groups \
            --no-new-privs \
            -- env "PATH=$BOOT_CONTRACT_PATH" \
            go test -race -count=1 -timeout=15m -run '^TestBootContract_' ./cmd/e2e/...

