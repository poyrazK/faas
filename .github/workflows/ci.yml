  image-build-canary:
    # ADR-111 image-build canary. PR #929 lands the per-cloud builders
    # + build scripts; this job exercises the hcloud canary build on
    # every PR. The canary uses `git_sha=canary-<unix-ts>` so the
    # snapshot tag is unique-per-run and doesn't collide with
    # production tags.
    #
    # PR visibility: continue-on-error: true so PR authors SEE the
    # canary status (a red x means the builders broke), but the
    # job doesn't block the PR. On merge to main, the rule is
    # required green (enforced via branch protection, NOT this file).
    #
    # Required secrets (hcloud steps only): HCLOUD_TOKEN. PRs from forks
    # don't get repo-scoped secrets, so the canary build only runs on
    # PRs whose head repo IS poyrazK/faas (i.e. internal contributors).
    # External PRs gate on `image-validate` (no creds) instead.
    name: image-build-canary (hcloud)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: install-packer (pinned)
        run: scripts/install-packer.sh
      - name: install hcloud CLI
        run: |
          set -euo pipefail
          # Asset name + SHA-256 from
          # https://github.com/hetznercloud/cli/releases/tag/v1.45.0 —
          # the actual asset is hcloud-linux-amd64.tar.gz (no version
          # segment embedded in the filename). SHA mirrors the supply-
          # chain pin pattern used by vacuum / sqlc / protoc / promtool
          # higher in this file (per codeql-go-clear-text-logging-
          # obfuscator-barrier lesson; no curl | tar -xz without verify).
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -o /tmp/hcloud.tar.gz \
            https://github.com/hetznercloud/cli/releases/download/v1.45.0/hcloud-linux-amd64.tar.gz
          echo "7918b2058eaf2df180caef34e4db1c7bcf5a6004ef6fd136402ebb7acb25d0eb  /tmp/hcloud.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/hcloud.tar.gz -C /tmp hcloud
          sudo mv /tmp/hcloud /usr/local/bin/
          hcloud version
      # Syntactic gate, runs on every PR regardless of secret wiring.
      # Uses VALIDATE_FLAGS (-syntax-only) which works against any
      # HCL without cloud creds. Replaces `image-build-hcloud-canary`
      # as the no-creds gate; the build step below runs only when
      # HCLOUD_TOKEN is wired (merge to main, internal PRs).
      - name: validate every builder
        run: make -C deploy/packer image-validate
      - name: build canary snapshot
        if: ${{ env.HCLOUD_TOKEN != '' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: make -C deploy/packer image-build-hcloud-canary
      - name: "smoke: list canary snapshot"
        if: ${{ env.HCLOUD_TOKEN != '' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          # image-build-hcloud-canary synthesises the tag with
          # `git_sha=canary-$(date +%s)` (deploy/packer/Makefile).
          # Match the canary-* prefix on the snapshot name; if the
          # canary didn't upload, the grep returns empty and we fail.
          hcloud image list -o columns=name,labels \
            | grep -F 'gregale-compute-' -F 'canary-' \
            | (read -r line && [ -n "${line}" ] && echo "canary snapshot present: ${line}") \
            || (echo "canary snapshot not found" >&2; exit 1)
