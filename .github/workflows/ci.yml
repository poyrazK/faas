      FAAS_SKIP_PG_TESTS: ""
      # Clone each test database from a once-migrated template instead of
      # letting apid replay every migration per test (pkg/db/pgtest).
      FAAS_PGTEST_TEMPLATE_DATABASE: "1"
    steps:
      - name: pre-pull postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull mirror.gcr.io/library/postgres:16; then
              echo "pulled on attempt ${attempt}"
              break
            fi
            echo "pull attempt ${attempt} failed; sleeping 10s"
            sleep 10
            if [ "${attempt}" = "3" ]; then
              echo "::error::postgres image pull failed after 3 attempts"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # managed by the restore/save steps below
      # Per-job-family Go cache. setup-go keys one cache on go.sum for the
      # whole workflow and saves only on a miss, so the first (smallest) job
      # to finish after a go.sum bump wins and every later job restores its
      # near-empty snapshot — measured at 7 KB on run 34166672535. Each
      # family restores the newest snapshot for today, then for this go.sum,
      # then anything; pushes to main save at most one snapshot per day.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + test cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-e2e-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-e2e-${{ runner.os }}-
      - name: install postgresql-client
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*chrome*.list' -o -iname '*chrome*.sources' \
               -o -iname '*microsoft*.list' -o -iname '*microsoft*.sources' \) -delete
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y postgresql-client
      - name: install jinja2 (ADR-055 cross-check)
        run: python3 -m pip install --quiet jinja2
      - name: compile Jobs metal acceptance tests
        # The metal tag is not part of the regular e2e shards. Keep this
        # KVM-only acceptance harness type-checked on ordinary PR CI without
        # trying to boot a VM.
        run: go test -tags metal -run '^$' cmd/e2e/jobs_harness_stub.go cmd/e2e/jobs_metal_test.go
      - name: e2e tests (shard 1)
        run: |
          E2E_RUN=$(go run ./scripts/ci/e2eshard -shard=1 -shards=4)
          go test -race -count=1 -timeout=15m -run "$E2E_RUN" ./cmd/e2e/...
      - name: save Go build + test cache
        # Saved even when a test step failed: the compile cache is
        # content-addressed, so partial warmth is still warmth.
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}

