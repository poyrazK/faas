name: mutation

# Mutation testing for the two places where a wrong operator costs money or
# breaks a §6.2 invariant without any test noticing:
#
#   billing — pkg/billing against its own tests
#   ledger  — the schedd admission ledger (pkg/sched/admission*.go) against
#             the admission/ledger tests plus tests/property
#
# cmd/mutate flips one operator at a time (< to <=, + to -, && to ||, drops a
# !, ...) and reruns those tests. A mutant that still passes ("lived") is a
# line the tests execute but do not pin down. Coverage cannot show that; the
# Hunt 18 SeedLedger bug (#5607) sat on fully covered lines.
#
# Weekly and on dispatch, never on pull requests: each mutant recompiles its
# package, so a full pass is hours of runner time spread over the shards
# below. Survivors land in each shard's job summary and JSON artifact; the
# gate job merges the shards and fails when a target's efficacy drops below
# its floor. Floors are the latest full run (2026-11-15, run 43714485891:
# billing 78.0%, ledger 79.8%) rounded down; raise them as survivors are
# triaged into tests. Equivalent mutants (a change that cannot alter
# behaviour) are expected and stay as survivors.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which target to run"
        type: choice
        options: [all, billing, ledger]
        default: all
  schedule:
    # Sundays 04:23 UTC, clear of the nightly ci.yml (02:17) and CodeQL (03:41).
    - cron: "23 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep aligned with ci.yml's GO_VERSION and the go.mod toolchain directive.
  GO_VERSION: "1.26.11"

jobs:
  plan:
    name: plan shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          # target:shards — sized so each shard finishes well inside the
          # job timeout on a standard hosted runner.
          rows=()
          for spec in billing:4 ledger:6; do
            t="${spec%%:*}"; n="${spec##*:}"
            if [ "$TARGET" = all ] || [ "$TARGET" = "$t" ]; then
              for i in $(seq 1 "$n"); do
                rows+=("{\"target\":\"$t\",\"shard\":$i,\"shards\":$n}")
              done
            fi
          done
          echo "matrix={\"include\":[$(IFS=,; echo "${rows[*]}")]}" >> "$GITHUB_OUTPUT"

  mutate:
    name: ${{ matrix.target }} (shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # restored below; this workflow never saves a cache
      - name: restore Go build + test cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mutation-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-light-test-1-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}-
            go-light-test-1-${{ runner.os }}-
      - name: download Go modules with retry
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 60s go mod download; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Go module download failed after 3 attempts" >&2
          exit 1
      - name: make test-mutation-${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p mutation-results
          report="mutation-results/${{ matrix.target }}-${{ matrix.shard }}"
          make test-mutation-${{ matrix.target }} \
            MUTATE_SHARD=${{ matrix.shard }}/${{ matrix.shards }} \
            MUTATE_WORKERS="$(nproc)" \
            MUTATE_FLAGS="-json $report.json" 2>&1 | tee "$report.log"
      - name: job summary
        if: always()
        run: |
          log="mutation-results/${{ matrix.target }}-${{ matrix.shard }}.log"
          [ -f "$log" ] || exit 0
          {
            echo "### mutation: ${{ matrix.target }} shard ${{ matrix.shard }}/${{ matrix.shards }}"
            echo '```'
            grep -E '^(Killed|Test efficacy):' "$log" || echo "no result (see log)"
            echo '```'
            if grep -q '^Survivors' "$log"; then
              echo '<details><summary>Survivors</summary>'
              echo
              echo '```'
              sed -n '/^Survivors/,/^Killed:/p' "$log" | sed '$d'
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mutation-${{ matrix.target }}-${{ matrix.shard }}
          path: mutation-results/
          retention-days: 30
          if-no-files-found: ignore

  gate:
    # One shard is a slice of the mutants, so its score swings; the floor
    # applies to each target's merged reports. A failed or missing shard
    # fails the gate rather than scoring a partial run.
    name: efficacy gate
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: every shard finished
        env:
          RESULT: ${{ needs.mutate.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::mutate shards ended with '$RESULT'; not scoring a partial run"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports
      - name: merge shards and apply floors
        run: |
          set -euo pipefail
          go build -o mutate ./cmd/mutate
          status=0
          # target:floor (percent efficacy over the merged shards)
          for spec in billing:78 ledger:79; do
            t="${spec%%:*}"; floor="${spec##*:}"
            if ! compgen -G "reports/mutation-$t-*/*.json" >/dev/null; then
              continue # target not selected on this dispatch
            fi
            {
              echo "### mutation: $t (all shards, floor $floor%)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if ./mutate -merge "reports/mutation-$t-*/*.json" -min-efficacy "$floor" > "merged-$t.log" 2>&1; then
              :
            else
              status=1
            fi
            grep -E '^(Killed|Test efficacy):|below -min-efficacy' "merged-$t.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -3 "merged-$t.log"
          done
          exit "$status"
