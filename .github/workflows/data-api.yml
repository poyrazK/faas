name: Data API acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only this suite's own code. Shared hot paths (pkg/api, pkg/state,
    # pkg/apid, migrations, go.mod, cmd/gregale) changed on nearly every
    # pull request; ci.yml runs this suite nightly and on dispatch.
    paths:
      - "pkg/apid/apidserver/managed_postgres_credentials*"
      - "pkg/managedpostgres/**"
      - "pkg/state/app_secret_delivery_policy*"
      - "pkg/gregalemanifest/**"
      - "sdk/data/**"
      - "tests/data-api/**"
      - "examples/data-api-orders/**"
      - "examples/data-api-teams/**"
      - "examples/data-api-concurrency/**"
      - "examples/data-api-idempotency/**"
      - "examples/data-api-outbox/**"
      - "examples/data-api-bulk/**"
      - "examples/data-api-import-preview/**"
      - "scripts/test-data-api.sh"
      - "scripts/test-data-api-load.sh"
      - "scripts/*data-api*bundle*"
      - "scripts/test-data-api-packaging.sh"
      - "scripts/data-api-release*"
      - "scripts/archive-cli-binary.sh"
      - "scripts/ci/run-data-api-staging-canary.sh"
      - ".github/workflows/data-api-staging.yml"
      - ".github/workflows/data-api.yml"
  # Nightly and on dispatch: ci.yml calls this workflow.
  workflow_call:
  workflow_dispatch:
# Only the newest push to a pull request is interesting; without a group every
# superseded push kept its runners until completion.
concurrency:
  # A literal name: when ci.yml calls this workflow, github.workflow is the
  # caller's name, which the other called suites would share.
  group: data-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
env:
  GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1"'

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOGC: 30
      GOMEMLIMIT: 2GiB
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' }}
      # Pull requests restore main's setup-go cache read-only. Saving a ~1 GB
      # copy per pull-request ref overflowed the 10 GB repository cache and
      # evicted ci-light's main families, so light jobs compiled cold.
      - name: restore Go cache from main (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: setup-go-${{ runner.os }}-x64-ubuntu24-go-pr-restore-only
          restore-keys: |
            setup-go-${{ runner.os }}-x64-ubuntu24-go-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Verify release-candidate artifacts, installation, rollouts and RLS
        run: bash scripts/test-data-api-packaging.sh --out-dir "$RUNNER_TEMP/data-api-bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gregale-data-api-${{ github.sha }}
          path: ${{ runner.temp }}/data-api-bundle/
          if-no-files-found: error
  acceptance:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Browser acceptance precedes the full credential and CLI integration run;
    # cold Go builds need enough time to finish both stages on hosted runners.
    timeout-minutes: 45
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: faas
          POSTGRES_DB: faas
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=512"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://faas:faas@127.0.0.1:5432/faas?sslmode=disable
      DATA_API_TEST_DATABASE_URL: postgres://faas:faas@127.0.0.1:5432/faas?sslmode=disable
      DATA_API_POSTGREST_BIN: /tmp/gregale-postgrest
      DATA_API_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Restore-only: read main's non-race `checks` Go cache instead of letting
      # setup-go save a ~0.8 GB entry per pull-request ref, which evicted main's
      # CI cache families from the 10 GB repository budget.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + module cache from main
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-checks-${{ runner.os }}-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false  # restored from main above
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Download the checksum-pinned PostgREST runtime
        run: |
          archive="$RUNNER_TEMP/postgrest-v14.3-linux-static-x86-64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output "$archive" \
            https://github.com/PostgREST/postgrest/releases/download/v14.3/postgrest-v14.3-linux-static-x86-64.tar.xz
          echo "3d619a36f0532c736857a5d6ead168b2864e2a383ab167d67acdd3d38e97508e  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/postgrest" "$DATA_API_POSTGREST_BIN"
      - name: Locate Chromium for real browser acceptance
        run: echo "DATA_API_CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify generated API, JWT RLS and client contract
        env:
          DATA_API_LOAD_REPORT: ${{ runner.temp }}/data-api-load-report.json
        run: make data-api-acceptance
      - name: Retain redacted local load and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gregale-data-api-load-${{ github.sha }}
          path: ${{ runner.temp }}/data-api-load-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify portable hosted canary and contract rollout harness
        run: make data-api-staging-check
      - name: Enable TLS for durable SQL credential acceptance
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/enable_postgres_tls.sh "$POSTGRES_SERVICE_CONTAINER"
      - name: Verify credential qualification, lifecycle and CLI integration
        env:
          FAAS_PGTEST_TEMPLATE_DATABASE: "1"
          GOGC: 30
          GOMEMLIMIT: 2GiB
          GOMAXPROCS: 2
        run: go test -p 1 ./pkg/managedpostgres/... ./cmd/gregale ./pkg/gregalemanifest -count=1
