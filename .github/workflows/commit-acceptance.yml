name: Commit acceptance

# The gate is a ~27-minute cold build and test of pkg/state,
# pkg/apid/apidserver, pkg/sched and cmd/e2e and is not a required check.
# Pull requests run it only when Gregale Commit's own code changes. Shared hot
# paths (the rest of pkg/state and pkg/apid, migrations, go.mod) change on
# nearly every pull request, so ci.yml runs the gate in full nightly instead of
# on every pull request and every merge to main. To run it on any other branch:
#   gh workflow run commit-acceptance.yml --ref <branch>
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pkg/commit/**"
      - "pkg/commitmanaged/**"
      - "pkg/state/commit*"
      - "pkg/state/*_commit*"
      - "pkg/apid/apidserver/*commit*"
      - "pkg/sched/*commit*"
      - "pkg/sched/exclusive_drain*"
      - "cmd/e2e/commit_*"
      - "sdk/commit-tests/**"
      - "sdk/go/**/commit*"
      - "sdk/node/src/commit*"
      - "sdk/python/**/*commit*"
      - "scripts/test-commit.sh"
      - "scripts/test-commit-sdk.sh"
      - "scripts/ci/commit_acceptance_report*.py"
      - ".github/workflows/commit-acceptance.yml"
  # Nightly: ci.yml calls this workflow.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A literal name: when ci.yml calls this workflow, github.workflow is the
  # caller's name.
  group: commit-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-and-process:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: faas
          POSTGRES_PASSWORD: commit_fixture
          POSTGRES_DB: faas
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U faas -d faas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      NODE_OPTIONS: --test-reporter=tap
      FAAS_PGTEST_TEMPLATE_DATABASE: '1'
      FAAS_COMMIT_TLS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
      FAAS_COMMIT_TLS_PG_TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record source identity
        run: python3 scripts/ci/commit_acceptance_report.py prepare "$RUNNER_TEMP/commit-evidence/report.json"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check acceptance reporting
        run: python3 -m unittest scripts/ci/commit_acceptance_report_test.py
      - name: Install PostgreSQL fixture binaries
        run: |
          if [ ! -x "$FAAS_COMMIT_TLS_PG_BIN_DIR/initdb" ] || [ ! -x "$FAAS_COMMIT_TLS_PG_BIN_DIR/pg_ctl" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          test -x "$FAAS_COMMIT_TLS_PG_BIN_DIR/initdb"
          test -x "$FAAS_COMMIT_TLS_PG_BIN_DIR/pg_ctl"
      - name: Install SDK test dependencies
        run: |
          npm ci --prefix sdk/node
          python3 -m pip install -e sdk/python -r sdk/commit-tests/requirements.txt
      - name: Run strict Commit gate
        env:
          DATABASE_URL: postgres://faas:commit_fixture@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/faas?sslmode=disable
        run: python3 scripts/ci/commit_acceptance_report.py run "$RUNNER_TEMP/commit-evidence/report.json"
      - name: Upload sanitized acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: commit-acceptance-report
          path: ${{ runner.temp }}/commit-evidence/report.json
          if-no-files-found: warn
          retention-days: 14
