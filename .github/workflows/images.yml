# .github/workflows/images.yml — Gregale OCI base image pipeline (issue #938, ADR-114).
#
# Builds and publishes ghcr.io/onebox-faas/builder-base for linux/amd64
# + linux/arm64 on every push to main. PR builds run against a local
# registry service container and a post-build crane-based verification
# step asserts /usr/local/bin/faas-guest-init exists in the just-pushed
# image's amd64 manifest (the kernel-cmdline PID1 binary every
# builder microVM hands control to — see images/builder-base.Dockerfile).
#
# guest-init is built INSIDE the Dockerfile via a multi-stage cross-
# compile (see images/builder-base.Dockerfile stage 1). Each arch's
# manifest receives the arch-matching binary because buildx resolves
# TARGETARCH per image in the multi-arch build — no host-side pre-
# build, no overwrite bug (review finding #2 on PR #940).
#
# Why a separate workflow (not an extension of ci.yml):
#  - ci.yml is the Go bundle (test, unit-tests-pg-*, metal, migrations,
#    spec-check) with concurrency: cancel-in-progress on PR pushes —
#    adding docker buildx jobs there would cancel each other and bloat
#    the bundle.
#  - This workflow needs packages:write to push to ghcr.io; scoping it
#    to its own file keeps the elevated permission minimal.
#
# Trigger paths: changes to the Dockerfile, the digest lock, the
# guest-init source, or this workflow file. workflow_dispatch is the
# manual reroll path (e.g. after a BuildKit / Railpack bump).
#
# Why a service container for the local registry (PR #940 CI follow-
# up, runs #1–#5): five prior attempts all failed.
#   #1 `docker run -d --network=host`           (ex44/local mental model)
#   #2 `docker run -d -p 5000:5000`             (first workflow revision)
#   #3 services:registry + ports[5000] (numeric index) — actionlint
#      error: property access on string-keyed map.
#   #4 services:registry + ports['5000'] + step-level env —
#      YAML validated, but the curl/wait loop hung past its 30-iter
#      ceiling for the full job timeout. (Expressions may have
#      returned the service label name or a bridgeless value that
#      `curl` couldn't resolve inside the runner.)
#   #5 `localhost:5000` directly + custom buildkit driver — the
#      curl/wait loop succeeded (curl's resolver fell through
#      `::1` → `127.0.0.1` → bridge gateway IP), but the buildx
#      push (running inside a separate `moby/buildkit:v0.31.2`
#      container) hit `dial tcp [::1]:5000: connect: connection
#      refused`. Two namespaces disagreed on where `localhost`
#      lives.
# Per
# https://docs.github.com/en/actions/using-containerized-services/
# about-service-containers: the service **label name** resolves to
# the container's IP on the docker network shared by the runner,
# the buildkitd container, and the service container. That's the
# only address consistently reachable from every namespace that
# touches the registry. Service containers stay alive for the
# entire 25-min job — sidestepping the death-mid-build bug that
# killed run #1 and run #2.

name: images

on:
  push:
    branches: [main]
    paths:
      - 'images/builder-base.Dockerfile'
      - 'images/Dockerfile.lock'
      - '.github/workflows/images.yml'
      - 'guest/init/**'
  pull_request:
    paths:
      - 'images/builder-base.Dockerfile'
      - 'images/Dockerfile.lock'
      - '.github/workflows/images.yml'
      - 'guest/init/**'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # ghcr.io/onebox-faas push (GITHUB_TOKEN)

jobs:
  builder-base:
    name: builder-base (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Issue #938 / PR-B / ADR-114: PR builds push to a local
    # registry service container so the verify step can `crane
    # export` the just-built image. Service containers stay
    # alive for the entire 25-min job — the docker-bridge-vs-
    # host-net ambiguity and container-OOM issues from earlier
    # attempts (PR #940 CI follow-ups) are sidestepped by
    # GitHub's job-lifecycle guarantees.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      IMAGE_NAME: ghcr.io/onebox-faas/builder-base
      BUILDKIT_VERSION: "0.31.2"
      RAILPACK_VERSION: "0.31.1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3
        # Default driver is docker-container; buildkitd joins the
        # same github_network_* as the `services.registry` container
        # so it can resolve the service label `registry:5000` (see
        # below). An earlier custom `driver-opts: image=…` was
        # dropped because explicit-`image=` containers don't share
        # the runner's service bridge by default, and we observed
        # buildkitd's `localhost:5000` push fail with
        # `dial tcp [::1]:5000: connect: connection refused` on the
        # multi-arch push phase even though the curl readiness
        # probe (running from the runner's namespace) succeeded.

      - name: Login to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Service-container hostname: per
      # https://docs.github.com/en/actions/using-containerized-services
      # /about-service-containers, the service label `registry`
      # resolves to the container's IP on the docker network shared
      # by the runner and the service container. The label
      # hostname is the **only** address that's reachable from
      # both the runner's namespace AND from buildkitd's namespace
      # (which is what `docker/setup-buildx-action@v3` defaults
      # to with the docker-container driver — see step 5 above).
      # Earlier attempts at `localhost:5000` succeeded for the
      # curl readiness probe but the buildkitd `localhost:5000`
      # push hit `dial tcp [::1]:5000: connect: connection
      # refused`. Use the label form throughout.
      - name: Wait for registry (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          for _ in $(seq 1 30); do
            if curl -sf --connect-timeout 2 --max-time 3 \
                 http://registry:5000/v2/ >/dev/null; then
              echo "registry ready on registry:5000"
              exit 0
            fi
            sleep 1
          done
          echo "::error::local registry did not become ready"
          exit 1

      - name: Build + push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_VERSION \
            --build-arg RAILPACK_VERSION \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA::12}" \
            --push \
            -f images/builder-base.Dockerfile .

      - name: Build + push (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          # Build against the service-container label `registry:5000`
          # — buildkitd (default docker-container driver) shares the
          # github_network_* bridge with the services.registry
          # container, so the label resolves inside buildkitd's
          # namespace. Multi-arch with cross-compiled guest-init so
          # each manifest carries the arch-matching /usr/local/bin/
          # faas-guest-init binary (review finding #2 on PR #940).
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_VERSION \
            --build-arg RAILPACK_VERSION \
            --tag "registry:5000/pr-${GITHUB_SHA::12}" \
            --push \
            -f images/builder-base.Dockerfile .

      # Verify the linux/amd64 manifest in the just-built (or
      # just-pushed) image contains /usr/local/bin/faas-guest-init.
      # The Lima local-build path checks the same thing at
      # deploy/lima/faas-metal.yaml:482-490; this is the CI
      # equivalent. imaged rejects manifest lists at
      # cmd/imaged/main.go:392-401 so operators will pin the
      # amd64-specific digest via `crane digest --platform
      # linux/amd64`.
      - name: Verify faas-guest-init is in the image
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@latest
          if [ "${GITHUB_REF_NAME:-}" = "main" ] && \
             [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            REF="${IMAGE_NAME}:latest"
          else
            REF="registry:5000/pr-${GITHUB_SHA::12}"
          fi
          DIGEST=$(crane manifest "${REF}" 2>/dev/null | \
            jq -r '.manifests[] | select(.platform.architecture=="amd64").digest')
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "::error::no amd64 manifest in ${REF}"
            exit 1
          fi
          crane export "${REF}@${DIGEST}" /tmp/rootfs.tar
          mkdir -p /tmp/rootfs && tar -xf /tmp/rootfs.tar -C /tmp/rootfs
          if [ ! -x /tmp/rootfs/usr/local/bin/faas-guest-init ]; then
            echo "::error::faas-guest-init missing from ${REF}@${DIGEST}"
            echo "The build pipeline produced a rootfs without the PID1"
            echo "binary. Check images/builder-base.Dockerfile COPY path"
            echo "and the guest-init build stage."
            exit 1
          fi
          echo "OK: ${REF}@${DIGEST} contains /usr/local/bin/faas-guest-init"
