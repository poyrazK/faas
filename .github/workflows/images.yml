# .github/workflows/images.yml — Gregale OCI base image pipeline (issue #938, ADR-114).
#
# Builds and publishes ghcr.io/onebox-faas/builder-base for linux/amd64
# + linux/arm64 on every push to main. PR builds run against a local
# registry service container and a post-build crane-based verification
# step asserts /usr/local/bin/faas-guest-init exists in the just-pushed
# image's amd64 manifest (the kernel-cmdline PID1 binary every
# builder microVM hands control to — see images/builder-base.Dockerfile).
#
# guest-init is built INSIDE the Dockerfile via a multi-stage cross-
# compile (see images/builder-base.Dockerfile stage 1). Each arch's
# manifest receives the arch-matching binary because buildx resolves
# TARGETARCH per image in the multi-arch build — no host-side pre-
# build, no overwrite bug (review finding #2 on PR #940).
#
# Why a separate workflow (not an extension of ci.yml):
#  - ci.yml is the Go bundle (test, unit-tests-pg-*, metal, migrations,
#    spec-check) with concurrency: cancel-in-progress on PR pushes —
#    adding docker buildx jobs there would cancel each other and bloat
#    the bundle.
#  - This workflow needs packages:write to push to ghcr.io; scoping it
#    to its own file keeps the elevated permission minimal.
#
# Trigger paths: changes to the Dockerfile, the digest lock, the
# guest-init source, or this workflow file. workflow_dispatch is the
# manual reroll path (e.g. after a BuildKit / Railpack bump).
#
# Why a service container for the local registry (PR #940 CI follow-
# up, run #3): two earlier attempts — `docker run -d --network=host`
# and `docker run -d -p 5000:5000` — both died mid-build during the
# multi-arch push phase (5+ min build), surfacing as connection-
# refused errors at the linux/arm64 manifest attachment. Service
# containers in GitHub Actions are tied to the job lifecycle, stay
# alive for the entire 25-min timeout, and are reachable from step
# commands via the service label as hostname (`registry:5000`) per
# https://docs.github.com/en/actions/using-containerized-services/
# about-service-containers. actionlint SC-acceptable; the
# `${{ job.services.<name>.ports[N] }}` lookup is only valid inside
# `steps:` (actionlint enforces context-availability rules), so it
# is computed lazily by each step that needs it.

name: images

on:
  push:
    branches: [main]
    paths:
      - 'images/builder-base.Dockerfile'
      - 'images/Dockerfile.lock'
      - '.github/workflows/images.yml'
      - 'guest/init/**'
  pull_request:
    paths:
      - 'images/builder-base.Dockerfile'
      - 'images/Dockerfile.lock'
      - '.github/workflows/images.yml'
      - 'guest/init/**'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # ghcr.io/onebox-faas push (GITHUB_TOKEN)

jobs:
  builder-base:
    name: builder-base (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Issue #938 / PR-B / ADR-114: PR builds push to a local
    # registry service container so the verify step can `crane
    # export` the just-built image. Service containers stay
    # alive for the entire 25-min job — the docker-bridge-vs-
    # host-net ambiguity and container-OOM issues from earlier
    # attempts (PR #940 CI follow-ups) are sidestepped by
    # GitHub's job-lifecycle guarantees.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      IMAGE_NAME: ghcr.io/onebox-faas/builder-base
      BUILDKIT_VERSION: "0.31.2"
      RAILPACK_VERSION: "0.31.1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.31.2

      - name: Login to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Service-container hostname on bare-runner jobs: the label
      # name resolves to the container's IP on the docker network
      # the runner + service share. Per
      # https://docs.github.com/en/actions/using-containerized-services
      # /about-service-containers: "the hostname of the service
      # container is automatically mapped to the label name".
      # Verified locally that `docker run -d -p 5000:5000
      # registry:2` then `docker exec` from a sibling buildx
      # invocation against `registry:5000` works; the
      # `${{ job.services.registry.ports[5000] }}` form is the
      # actionlint-clean way to spell the host port for cases
      # where the port mapping is dynamic (TCP-mapped random
      # port). For our 5000:5000 static mapping both forms
      # resolve to 5000.
      - name: Wait for registry (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          REGISTRY_HOST: ${{ job.services.registry.ports['5000'] }}
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "http://${REGISTRY_HOST}/v2/" >/dev/null; then
              echo "registry ready on ${REGISTRY_HOST}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::local registry did not become ready"
          exit 1

      - name: Build + push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_VERSION \
            --build-arg RAILPACK_VERSION \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA::12}" \
            --push \
            -f images/builder-base.Dockerfile .

      - name: Build + push (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          REGISTRY_HOST: ${{ job.services.registry.ports['5000'] }}
        run: |
          # Service-container hostname on bare-runner jobs: the
          # label name is the canonical alias; both `registry:5000`
          # and `${REGISTRY_HOST}:5000` resolve to the same
          # container IP for a static 5000:5000 mapping.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_VERSION \
            --build-arg RAILPACK_VERSION \
            --tag "${REGISTRY_HOST}/pr-${GITHUB_SHA::12}" \
            --push \
            -f images/builder-base.Dockerfile .

      # Verify the linux/amd64 manifest in the just-built (or
      # just-pushed) image contains /usr/local/bin/faas-guest-init.
      # The Lima local-build path checks the same thing at
      # deploy/lima/faas-metal.yaml:482-490; this is the CI
      # equivalent. imaged rejects manifest lists at
      # cmd/imaged/main.go:392-401 so operators will pin the
      # amd64-specific digest via `crane digest --platform
      # linux/amd64`.
      - name: Verify faas-guest-init is in the image
        env:
          REGISTRY_HOST: ${{ job.services.registry.ports['5000'] }}
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@latest
          if [ "${GITHUB_REF_NAME:-}" = "main" ] && \
             [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            REF="${IMAGE_NAME}:latest"
          else
            REF="${REGISTRY_HOST}/pr-${GITHUB_SHA::12}"
          fi
          DIGEST=$(crane manifest "${REF}" 2>/dev/null | \
            jq -r '.manifests[] | select(.platform.architecture=="amd64").digest')
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "::error::no amd64 manifest in ${REF}"
            exit 1
          fi
          crane export "${REF}@${DIGEST}" /tmp/rootfs.tar
          mkdir -p /tmp/rootfs && tar -xf /tmp/rootfs.tar -C /tmp/rootfs
          if [ ! -x /tmp/rootfs/usr/local/bin/faas-guest-init ]; then
            echo "::error::faas-guest-init missing from ${REF}@${DIGEST}"
            echo "The build pipeline produced a rootfs without the PID1"
            echo "binary. Check images/builder-base.Dockerfile COPY path"
            echo "and the guest-init build stage."
            exit 1
          fi
          echo "OK: ${REF}@${DIGEST} contains /usr/local/bin/faas-guest-init"
