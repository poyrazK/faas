                source scripts/ci/native-e2e-phases.sh
                lane_tests=()
                while IFS= read -r selected_test; do
                  lane_tests+=("$selected_test")
                done < <(native_e2e_lane_tests project-migration-sql-only "$GITHUB_WORKSPACE")
                native_e2e_lane_verdict "$log" "Project migration SQL KVM lane" "${lane_tests[@]}" || rc=1
              customer-http-operations-only)
                # This lane requires every native Customer HTTP Operations
                # scenario to PASS before a customer preview cohort opens.
                # shellcheck source=scripts/ci/native-e2e-phases.sh
                source scripts/ci/native-e2e-phases.sh
                lane_tests=()
                while IFS= read -r selected_test; do
                  lane_tests+=("$selected_test")
                done < <(native_e2e_lane_tests customer-http-operations-only "$GITHUB_WORKSPACE")
                native_e2e_lane_verdict "$log" "Customer HTTP Operations KVM lane" "${lane_tests[@]}" || rc=1
                ;;
              *)
                if [[ "${PHASE_GROUP}" != single ]]; then
                  source scripts/ci/native-e2e-phases.sh
                  group_tests=""
                  while IFS= read -r selected_phase; do
                    group_tests+="$(native_e2e_phase_tests "$selected_phase" "$GITHUB_WORKSPACE")"$'\n'
                  done < <(native_e2e_group_phases "$PHASE_GROUP")
                  group_required=()
                  for required in "${NATIVE_E2E_REQUIRED_TESTS[@]}"; do
                    if grep -Fxq "$required" <<<"$group_tests"; then group_required+=("$required"); fi
                  done
                  NATIVE_E2E_REQUIRED_TESTS=("${group_required[@]}")
                fi
                native_e2e_verdict "$log" || rc=1
                ;;
            esac
          else
            echo "::error::no combined log was collected; cannot apply the required-test contract"
            rc=1
          fi

          exit "$rc"

      - name: Record evidence identity
        if: always()
        run: |
          printf 'sha=%s\ngroup=%s\n' '${{ github.sha }}' '${{ matrix.group }}' > "$RUNNER_TEMP/native-group.txt"

      - name: Upload e2e log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-e2e-${{ github.sha }}-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/native-e2e.log
            ${{ runner.temp }}/native-group.txt
            ${{ runner.temp }}/project-http-qualification.json
            ${{ runner.temp }}/project-concurrent-qualification.json
            ${{ runner.temp }}/project-retention-qualification.json
            ${{ runner.temp }}/project-secret-qualification.json
            ${{ runner.temp }}/promotion-qualification.json
            ${{ runner.temp }}/service-graph-qualification.json
            ${{ runner.temp }}/coordinated-qualification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the acceptance node
        # Stop it whoever started it.
        #
        # This used to stop the node only when THIS run started it, on the
        # reasoning that a node found already running belonged to whoever
        # started it. That reasoning leaks: the first run to be cancelled
        # mid-flight leaves the node up, and every run after it then observes
        # RUNNING, sets started=false, and declines to stop it too. The node
        # bills until a human notices. That is what happened between runs
        # 35010949241 and 35016399564 — three consecutive runs each skipped
        # the stop step and the node stayed up for hours.
        #
        # faas-acceptance-1 is a dedicated CI box with no tenants and no other
        # owner, so "somebody else's node" is not a real case here; the gate is
        # the only thing that ever runs on it. Stop it unconditionally instead,
        # and give the one legitimate exception — debugging on the host — an
        # explicit opt-in rather than an accident.
        #
        # always() so cancellation and failure still stop it; that is the exact
        # path that leaked.
        if: always() && inputs.keep_node_running != true
        run: |
          set -euo pipefail
          gcloud compute instances stop "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE"

  combined-verdict:
    name: complete native qualification verdict
    needs: e2e-native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          pattern: native-e2e-${{ github.sha }}-*
          path: ${{ runner.temp }}/native-evidence
      - name: Verify all jobs and the full chain
        env:
          QUALIFY_SERVICE_GRAPH: ${{ inputs.qualify_service_graph || inputs.qualify_coordinated }}
          QUALIFY_COORDINATED: ${{ inputs.qualify_coordinated }}
          JOB_RESULT: ${{ needs.e2e-native.result }}
          LANE: ${{ inputs.lane }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source scripts/ci/native-e2e-combined-verdict.sh
          selected_lane="${LANE:-full}"
          if [[ "$EVENT_NAME" == schedule ]]; then selected_lane=full; fi
          native_e2e_combined_verdict "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-evidence" "$GITHUB_SHA" "$JOB_RESULT" "$selected_lane" "${QUALIFY_SERVICE_GRAPH:-false}" "${QUALIFY_COORDINATED:-false}"

      - uses: actions/upload-artifact@v6
        if: always() && inputs.lane == 'project-environment-promotion-only'
        with:
          name: promotion-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/native-evidence/promotion-qualification.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always() && inputs.lane == 'project-environment-promotion-only' && (inputs.qualify_service_graph || inputs.qualify_coordinated)
        with:
          name: service-graph-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/native-evidence/service-graph-qualification.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always() && inputs.lane == 'project-environment-promotion-only' && inputs.qualify_coordinated
        with:
          name: coordinated-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/native-evidence/coordinated-qualification.json
          if-no-files-found: error

  binding-native:
    name: binding guest qualification (native amd64)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.lane == 'bindings'
    runs-on: ubuntu-latest
    # Separate job: 270m covers the four 45m/60m/40m/90m suite alarms plus
    # compilation/cleanup; 300m leaves staging, collection and node-stop time.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build clean binding source and pinned Go bundles
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/package-binding-native-source.sh "$SOURCE_SHA" "$RUNNER_TEMP/binding-source.tar.gz"
          bash scripts/ci/package-go-toolchain.sh "$(go env GOROOT)" "$RUNNER_TEMP/binding-go.tar.gz"
      - id: auth
        name: Authenticate to GCP with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start the dedicated acceptance node
        id: compute-node
        run: |
          set -euo pipefail
          status="$(gcloud compute instances describe "$GCP_INSTANCE" --project "$GCP_PROJECT" --zone "$GCP_ZONE" --format='value(status)')"
          case "$status" in
            RUNNING) ;;
            TERMINATED) gcloud compute instances start "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" ;;
            *) echo '::error::Acceptance node is unavailable'; exit 1 ;;
          esac
          scripts/ci/gcp-oslogin-preflight.sh --project "$GCP_PROJECT" --zone "$GCP_ZONE" --instance "$GCP_INSTANCE"
          for attempt in {1..24}; do
            if gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" --command true >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo '::error::Acceptance node did not become SSH-ready'
          exit 1
      - name: Stage clean binding source
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-bindings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "umask 077; mkdir '$remote_root' && sudo /usr/local/sbin/faas-canary-artifacts register --path '$remote_root' --run-id '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --kind native-e2e"
          gcloud compute scp "$RUNNER_TEMP/binding-source.tar.gz" "$RUNNER_TEMP/binding-go.tar.gz" \
            "$GCP_INSTANCE:$remote_root/" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE"
          gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "tar -xzf '$remote_root/binding-source.tar.gz' -C '$remote_root' && mkdir -p '$remote_root/tools/go' && tar -xzf '$remote_root/binding-go.tar.gz' -C '$remote_root/tools/go' && sudo chown -R root:root '$remote_root/source' '$remote_root/tools'"
      - name: Run strict binding guest journeys serially
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-bindings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-bindings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Uses only host-owned disposable SQL/CA/runtime configuration.
          # A virtual or unconfigured host fails closed, without qualifying.
          gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=270m --property=TimeoutStopSec=120 --property='StandardOutput=append:$remote_root/binding-native.log' --property='StandardError=append:$remote_root/binding-native.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' /bin/bash scripts/ci/run-binding-native.sh"
      - name: Refresh binding authentication for cleanup
        if: always() && steps.auth.outcome == 'success'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Collect bounded binding evidence
        if: always() && steps.compute-node.outcome == 'success'
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-bindings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Only this wrapper's fixed diagnostics enter the job log.
          gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo grep '^binding native:' '$remote_root/binding-native.log'" || true
          # Raw test/daemon logs stay private on the registered host bundle.
          # Only bounded reports are transferred and retained in Actions.
          gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo tar -C '$remote_root/binding-evidence/public' -czf - . > '$remote_root/binding-public.tar.gz'"
          gcloud compute scp "$GCP_INSTANCE:$remote_root/binding-public.tar.gz" "$RUNNER_TEMP/binding-public.tar.gz" \
            --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE"
          mkdir "$RUNNER_TEMP/binding-evidence"
          tar -xzf "$RUNNER_TEMP/binding-public.tar.gz" -C "$RUNNER_TEMP/binding-evidence"
          # An empty/partial public directory cannot make a successful gate.
          test -s "$RUNNER_TEMP/binding-evidence/summary.json"
      - name: Retain binding reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: binding-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binding-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Finalize successful binding artifacts
        # Failed bundles retain their existing bounded abandoned-run lease for
        # private diagnosis; the normal retention sweep owns their removal.
        if: always() && steps.compute-node.outcome == 'success' && job.status == 'success'
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-bindings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo /usr/local/sbin/faas-canary-artifacts finish --path '$remote_root' --state success"
      - name: Stop the binding acceptance node
        if: always() && steps.auth.outcome == 'success' && inputs.keep_node_running != true
        run: |
          set -euo pipefail
          gcloud compute instances stop "$GCP_INSTANCE" --quiet --project "$GCP_PROJECT" --zone "$GCP_ZONE"

  financial-system:
    name: cost control (full daemons and billing reconciliation)
    # Sequential host use; its separate budget keeps full/qualify below the
    # six-hour ceiling of the platform job. A bounded dispatch skips that job.
    needs: e2e-native
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.lane == 'full' ||
       inputs.lane == 'qualify' || inputs.lane == 'financial-system')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json

      - name: Build Node Flags SDK for the native guest fixture
        working-directory: sdk/node
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

      - name: Build exact-source transfer bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          bundle="$RUNNER_TEMP/native-e2e-bundle"
          mkdir -p "$bundle/source" "$bundle/source/sdk/node/dist" "$bundle/tools/go"
          git archive "$SOURCE_SHA" | tar -x -C "$bundle/source"
          cp sdk/node/dist/flags.js "$bundle/source/sdk/node/dist/flags.js"
          printf '%s\n' "$SOURCE_SHA" > "$bundle/source/.faas-e2e-source-sha"

          go_root="$(go env GOROOT)"
          bash scripts/ci/package-go-toolchain.sh "$go_root" "$bundle/go.tar.gz"
          tar -C "$bundle" -czf "$RUNNER_TEMP/native-e2e-bundle.tar.gz" source go.tar.gz

      - id: auth
        name: Authenticate to GCP with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Start the acceptance node when CI owns its lifecycle
        id: compute-node
        run: |
          set -euo pipefail
          status="$(
            gcloud compute instances describe "$GCP_INSTANCE" \
              --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
              --format='value(status)'
          )"
          case "$status" in
            RUNNING)
              echo "Acceptance node was already running; a previous run left it up."
              ;;
            TERMINATED)
              gcloud compute instances start "$GCP_INSTANCE" --quiet \
                --project "$GCP_PROJECT" --zone "$GCP_ZONE"
              ;;
            *)
              echo "::error::acceptance node is in unexpected state: ${status:-missing}" >&2
              exit 1
              ;;
          esac

          scripts/ci/gcp-oslogin-preflight.sh \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" --instance "$GCP_INSTANCE"

          # RUNNING precedes sshd readiness. Bound the wait so a broken boot
          # fails this job instead of consuming credits until its timeout.
          for attempt in {1..24}; do
            if gcloud compute ssh "$GCP_INSTANCE" --quiet \
              --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
              --command true >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for acceptance node SSH readiness (${attempt}/24)."
            sleep 5
          done
          echo "::error::acceptance node did not become SSH-ready within 120 seconds" >&2
          exit 1

      - name: Stage source and toolchain on the acceptance node
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "mkdir -p '$remote_root' && sudo /usr/local/sbin/faas-canary-artifacts register --path '$remote_root' --run-id '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial' --kind native-e2e"
          gcloud compute scp "$RUNNER_TEMP/native-e2e-bundle.tar.gz" \
            "$GCP_INSTANCE:$remote_root/bundle.tar.gz" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "tar -xzf '$remote_root/bundle.tar.gz' -C '$remote_root' && mkdir -p '$remote_root/tools/go' && tar -xzf '$remote_root/go.tar.gz' -C '$remote_root/tools/go' && test -x '$remote_root/tools/go/bin/go'"

      - name: Financial system — native funding recovery and provider receipts
        id: phase_financial_system
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: financial-system
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial-$PHASE"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=75m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' /bin/bash scripts/ci/run-native-e2e.sh"

      - name: Refresh GCP authentication for cleanup
        if: always() && steps.auth.outcome == 'success'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Collect log and remove remote transfer bundle
        if: always() && steps.auth.outcome == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial"
          cleanup_state="${{ job.status }}"
          log="$RUNNER_TEMP/native-e2e.log"
          gcloud compute scp "$GCP_INSTANCE:$remote_root/native-e2e.log" "$log" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" || true
          if [[ -f "$log" ]]; then
            cat "$log"
          fi
          archive="$RUNNER_TEMP/financial-system-evidence.tar.gz"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo tar -czf '$remote_root/financial-system-evidence.tar.gz' -C '$remote_root' --ignore-failed-read financial-system-verdict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial.json financial-system-provider.log cmd-e2e-financial-system.log financial-system-records; sudo chmod 0644 '$remote_root/financial-system-evidence.tar.gz'"
          gcloud compute scp "$GCP_INSTANCE:$remote_root/financial-system-evidence.tar.gz" "$archive" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE"
          mkdir -p "$RUNNER_TEMP/financial-system-evidence"
          tar -xzf "$archive" -C "$RUNNER_TEMP/financial-system-evidence"
          python3 scripts/ci/financial-system-ci-check.py --root "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/financial-system-evidence" --source-sha "$SOURCE_SHA" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo /usr/local/sbin/faas-canary-artifacts finish --path '$remote_root' --state '$cleanup_state'"
          # The stage root is shared by every phase (guest-init, and the
          # daemons compiled once for all of them), so no single phase may
          # remove it — see the phase branch in run-native-e2e.sh's cleanup.
          # The run owns it, here, on every exit path.
          stage_root="/srv/fc/acceptance/e2e-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-financial"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo rm -rf '$stage_root'" || true

      - name: Upload financial evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-financial-system-${{ github.sha }}
          path: |
            ${{ runner.temp }}/financial-system-evidence/
            ${{ runner.temp }}/native-e2e.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop the acceptance node
        if: always() && inputs.keep_node_running != true
        run: |
          gcloud compute instances stop "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE"
