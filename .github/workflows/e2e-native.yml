name: e2e-native

# End-to-end platform gate on real hardware: the whole ./cmd/e2e suite with the
# metal build tag, on faas-acceptance-1, against /dev/kvm and Firecracker.
#
# faas-acceptance-1 is a DEDICATED acceptance node. This gate stops every
# production daemon on its host for the duration of a run, and leakcheck asserts
# zero netns/TAP/jail afterwards. Both are safe only on a host that serves no
# tenants. It previously ran on faas-compute-node-2, which is a live compute
# node: runs collided with real workloads (a dispatch was refused outright by
# the "Firecracker workloads are active" pre-flight), leakcheck reported the
# production pre-warm netns pool as leaks, and the harness inherited that host's
# production configuration in ways that produced failures looking like product
# defects (see #2572, #2579, #2602). Point this at a serving node again and all
# of that returns.
#
# builder-native.yml proves the builder image and the pkg/fcvm package work on
# metal. This workflow proves the product does: source upload -> apid ->
# builderd -> builder microVM -> OCI image -> imaged -> snapshot -> park ->
# gateway wake -> invoke, plus the §11 jail fences.
#
# PREREQUISITE (cloud side, one time): the workload-identity provider condition
# currently admits only `.github/workflows/builder-native.yml@refs/heads/main`,
# so this workflow's OIDC token is rejected until the condition also admits
# `.github/workflows/e2e-native.yml@refs/heads/main`. The exact gcloud command
# is in docs/ops/e2e-native-ci.md. Until then the auth step fails; the node is
# never touched, so a rejected run is inert rather than disruptive.

on:
  # Manual only for now. The nightly full run is deliberately off while the
  # beta path is being made green: a scheduled hour on the node that nobody is
  # watching finds nothing faster, and every finding so far came from a
  # dispatched run someone was waiting on. Restore with:
  #   schedule:
  #     - cron: "43 4 * * *"   # after builder-native's 03:17 nightly
  # A scheduled run has no `lane` input, so the != 'smoke' gates below run the
  # full matrix for it.
  workflow_dispatch:
    inputs:
      qualify_coordinated:
        description: Add coordinated HTTP/worker/migration qualification and its service-graph prerequisite
        type: boolean
        default: false
      qualify_service_graph:
        description: Add frontend/API promotion qualification (promotion lane only)
        type: boolean
        default: false
      lane:
        description: >-
          smoke: beta path + 100 wake cycles (~45 min); full: complete metal matrix in two bounded jobs;
          qualify: full plus runtime candidates; containers: OCI qualification;
          jobs-only: blocking Jobs lifecycle; exclusive-operations-only:
          blocking stale-owner KVM test; managed-operation-only: native workflow
          crash/replay and signed effect delivery; customer-job-operations-only:
          native customer Job results, restart, recovery, cancellation and cleanup;
          customer-workflow-operations-only: native customer workflow files,
          crash/resume, cancellation, deadlines, owner revocation and cleanup;
          project-environment-promotion-only: HTTP/worker promotion, operator recovery, concurrency, admission, database migration safety and publication crash recovery (six jobs);
          project-worker-release-only: mixed HTTP/worker isolation, controller
          restarts, cutover, probe rollback, startup failure and bounded drain;
          project-migration-contract-only: guarded cleanup success, failure and owner loss;
          project-migration-sql-only: real PostgreSQL compatibility, DDL isolation and recovery;
          project-progressive-release-only: 5/25/100 promotion, daemon recovery,
          worker crash with pinned retry, and paired graph/config rollback;
          customer-http-operations-only: native ordinary HTTP Operations files,
          progress, crash/recovery, cancellation, owner revocation and cleanup;
          financial-system: full-daemon funding recovery and provider reconciliation;
          bindings: strict PostgreSQL, storage and queue guest qualification.
        type: choice
        options: [smoke, full, qualify, jobs-only, containers, exclusive-operations-only, managed-operation-only, customer-job-operations-only, customer-workflow-operations-only, project-worker-release-only, project-progressive-release-only, project-progressive-http-only, project-concurrent-release-only, project-rollback-retention-only, project-release-secrets-only, project-migration-contract-only, project-migration-sql-only, project-environment-promotion-only, customer-http-operations-only, financial-system, bindings]
        default: smoke
      keep_node_running:
        description: >-
          Leave faas-acceptance-1 running after the gate finishes, to debug on
          the host. Costs money until someone stops it by hand — the default
          stops the node on every exit path, including cancellation.
        type: boolean
        default: false

concurrency:
  # Per-host group. builder-native.yml still runs on faas-compute-node-2, so
  # the two gates no longer contend and must not serialize behind each other.
  # The host flock (/var/lock/faas-builder-acceptance.lock) remains the real
  # mutual exclusion if both are ever pointed at the same node again.
  group: e2e-native-faas-acceptance-1
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.26.10"
  GCP_PROJECT: project-5ae37259-04cf-4070-bef
  GCP_ZONE: europe-west3-c
  GCP_INSTANCE: faas-acceptance-1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/811654175645/locations/global/workloadIdentityPools/github-actions/providers/gregale-builder-native
  GCP_SERVICE_ACCOUNT: gregale-builder-ci@project-5ae37259-04cf-4070-bef.iam.gserviceaccount.com

jobs:
  e2e-native:
    name: platform e2e (KVM + Firecracker, amd64)
    # Manual dispatch is restricted to main because the provider condition
    # admits refs/heads/main only; a dispatch from a branch would fail at auth
    # with a less obvious error than this check.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.lane != 'financial-system' && inputs.lane != 'bindings')
    runs-on: ubuntu-latest
    # Full/qualify runs are serialized into bounded source and runtime jobs.
    # Targeted lanes run once. Each job restores services and stops its node.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ${{ fromJSON((github.event_name == 'schedule' || inputs.lane == 'full' || inputs.lane == 'qualify') && '["source","runtime"]' || inputs.lane == 'project-environment-promotion-only' && inputs.qualify_coordinated && '["promotion-core","promotion-controls","promotion-load","promotion-admission","promotion-migrations","promotion-publication","promotion-service-graph","promotion-coordinated"]' || inputs.lane == 'project-environment-promotion-only' && inputs.qualify_service_graph && '["promotion-core","promotion-controls","promotion-load","promotion-admission","promotion-migrations","promotion-publication","promotion-service-graph"]' || inputs.lane == 'project-environment-promotion-only' && '["promotion-core","promotion-controls","promotion-load","promotion-admission","promotion-migrations","promotion-publication"]' || '["single"]') }}
    timeout-minutes: ${{ (matrix.group == 'promotion-admission' || matrix.group == 'promotion-migrations' || matrix.group == 'promotion-coordinated') && 360 || 240 }}
    steps:
      - name: Validate optional qualification selection
        if: (inputs.qualify_service_graph || inputs.qualify_coordinated) && !(inputs.lane == 'project-environment-promotion-only')
        run: |
          echo 'optional promotion qualification requires the project-environment-promotion-only lane' >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.10.0'
          cache: 'npm'
          cache-dependency-path: sdk/node/package-lock.json

      - name: Build Node Flags SDK for the native guest fixture
        working-directory: sdk/node
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

      - name: Build exact-source transfer bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          bundle="$RUNNER_TEMP/native-e2e-bundle"
          mkdir -p "$bundle/source" "$bundle/source/sdk/node/dist" "$bundle/tools/go"
          git archive "$SOURCE_SHA" | tar -x -C "$bundle/source"
          cp sdk/node/dist/flags.js "$bundle/source/sdk/node/dist/flags.js"
          printf '%s\n' "$SOURCE_SHA" > "$bundle/source/.faas-e2e-source-sha"

          go_root="$(go env GOROOT)"
          bash scripts/ci/package-go-toolchain.sh "$go_root" "$bundle/go.tar.gz"
          tar -C "$bundle" -czf "$RUNNER_TEMP/native-e2e-bundle.tar.gz" source go.tar.gz

      - id: auth
        name: Authenticate to GCP with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Start the acceptance node when CI owns its lifecycle
        id: compute-node
        run: |
          set -euo pipefail
          status="$(
            gcloud compute instances describe "$GCP_INSTANCE" \
              --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
              --format='value(status)'
          )"
          case "$status" in
            RUNNING)
              echo "Acceptance node was already running; a previous run left it up."
              ;;
            TERMINATED)
              gcloud compute instances start "$GCP_INSTANCE" --quiet \
                --project "$GCP_PROJECT" --zone "$GCP_ZONE"
              ;;
            *)
              echo "::error::acceptance node is in unexpected state: ${status:-missing}" >&2
              exit 1
              ;;
          esac

          scripts/ci/gcp-oslogin-preflight.sh \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" --instance "$GCP_INSTANCE"

          # RUNNING precedes sshd readiness. Bound the wait so a broken boot
          # fails this job instead of consuming credits until its timeout.
          for attempt in {1..24}; do
            if gcloud compute ssh "$GCP_INSTANCE" --quiet \
              --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
              --command true >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for acceptance node SSH readiness (${attempt}/24)."
            sleep 5
          done
          echo "::error::acceptance node did not become SSH-ready within 120 seconds" >&2
          exit 1

      - name: Stage source and toolchain on the acceptance node
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "mkdir -p '$remote_root' && sudo /usr/local/sbin/faas-canary-artifacts register --path '$remote_root' --run-id '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --kind native-e2e"
          gcloud compute scp "$RUNNER_TEMP/native-e2e-bundle.tar.gz" \
            "$GCP_INSTANCE:$remote_root/bundle.tar.gz" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE"
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "tar -xzf '$remote_root/bundle.tar.gz' -C '$remote_root' && mkdir -p '$remote_root/tools/go' && tar -xzf '$remote_root/go.tar.gz' -C '$remote_root/tools/go' && test -x '$remote_root/tools/go/bin/go'"

      - name: Smoke — the beta path (one source deploy, one image deploy, §11 fences)
        id: phase_smoke
        if: always() && steps.compute-node.conclusion == 'success' && inputs.lane == 'smoke'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: smoke
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PHASE"
          # Each phase is its own transient systemd unit: losing the GitHub SSH
          # connection must not kill cleanup halfway through with the host still
          # quiesced. The DSN is NOT passed here — the node owns it in
          # /etc/faas/e2e-acceptance.env, so it never reaches the process list.
          # Outlast the 60m test alarm with 15m for compilation and cleanup.
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=75m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' /bin/bash scripts/ci/run-native-e2e.sh" 2>&1 | tee "$RUNNER_TEMP/phase-$PHASE.log"

      - name: Containers — OCI portability, lifecycle, ingress, and isolation
        id: phase_containers
        if: always() && steps.compute-node.conclusion == 'success' && inputs.lane == 'containers'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: containers
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PHASE"
          # Each phase is its own transient systemd unit: losing the GitHub SSH
          # connection must not kill cleanup halfway through with the host still
          # quiesced. The DSN is NOT passed here — the node owns it in
          # /etc/faas/e2e-acceptance.env, so it never reaches the process list.
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=90m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' /bin/bash scripts/ci/run-native-e2e.sh" 2>&1 | tee "$RUNNER_TEMP/phase-$PHASE.log"

      - name: Phase 1 — fixtures (app shape checks, no microVM)
        id: phase_fixtures
        if: always() && steps.compute-node.conclusion == 'success' && inputs.lane != 'smoke' && inputs.lane != 'jobs-only' && inputs.lane != 'containers' && inputs.lane != 'exclusive-operations-only' && inputs.lane != 'managed-operation-only' && inputs.lane != 'customer-job-operations-only' && inputs.lane != 'customer-workflow-operations-only' && inputs.lane != 'project-worker-release-only' && inputs.lane != 'project-progressive-release-only' && inputs.lane != 'project-progressive-http-only' && inputs.lane != 'project-concurrent-release-only' && inputs.lane != 'project-rollback-retention-only' && inputs.lane != 'project-release-secrets-only' && inputs.lane != 'project-migration-contract-only' && inputs.lane != 'project-migration-sql-only' && inputs.lane != 'project-environment-promotion-only' && inputs.lane != 'customer-http-operations-only' && matrix.group == 'source'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: fixtures
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PHASE"
          # Each phase is its own transient systemd unit: losing the GitHub SSH
          # connection must not kill cleanup halfway through with the host still
          # quiesced. The DSN is NOT passed here — the node owns it in
          # /etc/faas/e2e-acceptance.env, so it never reaches the process list.
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=20m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' /bin/bash scripts/ci/run-native-e2e.sh" 2>&1 | tee "$RUNNER_TEMP/phase-$PHASE.log"

      - name: Phase 2 — build (source → builderd → builder microVM)
        id: phase_build
        if: always() && steps.compute-node.conclusion == 'success' && inputs.lane != 'smoke' && inputs.lane != 'jobs-only' && inputs.lane != 'containers' && inputs.lane != 'exclusive-operations-only' && inputs.lane != 'managed-operation-only' && inputs.lane != 'customer-job-operations-only' && inputs.lane != 'customer-workflow-operations-only' && inputs.lane != 'project-worker-release-only' && inputs.lane != 'project-progressive-release-only' && inputs.lane != 'project-progressive-http-only' && inputs.lane != 'project-concurrent-release-only' && inputs.lane != 'project-rollback-retention-only' && inputs.lane != 'project-release-secrets-only' && inputs.lane != 'project-migration-contract-only' && inputs.lane != 'project-migration-sql-only' && inputs.lane != 'project-environment-promotion-only' && inputs.lane != 'customer-http-operations-only' && matrix.group == 'source'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: build
          CATALOG_MODE: ${{ inputs.lane == 'qualify' && 'qualify' || 'full' }}
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PHASE"
          # Each phase is its own transient systemd unit: losing the GitHub SSH
          # connection must not kill cleanup halfway through with the host still
          # quiesced. The DSN is NOT passed here — the node owns it in
          # /etc/faas/e2e-acceptance.env, so it never reaches the process list.
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=70m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' --setenv=FAAS_E2E_API_HOSTING_CATALOG='$CATALOG_MODE' /bin/bash scripts/ci/run-native-e2e.sh" 2>&1 | tee "$RUNNER_TEMP/phase-$PHASE.log"

      - name: Phase 3 — deploy (image, tarball, healthcheck, secrets)
        id: phase_deploy
        if: always() && steps.compute-node.conclusion == 'success' && inputs.lane != 'smoke' && inputs.lane != 'jobs-only' && inputs.lane != 'containers' && inputs.lane != 'exclusive-operations-only' && inputs.lane != 'managed-operation-only' && inputs.lane != 'customer-job-operations-only' && inputs.lane != 'customer-workflow-operations-only' && inputs.lane != 'project-worker-release-only' && inputs.lane != 'project-progressive-release-only' && inputs.lane != 'project-progressive-http-only' && inputs.lane != 'project-concurrent-release-only' && inputs.lane != 'project-rollback-retention-only' && inputs.lane != 'project-release-secrets-only' && inputs.lane != 'project-migration-contract-only' && inputs.lane != 'project-migration-sql-only' && inputs.lane != 'project-environment-promotion-only' && inputs.lane != 'customer-http-operations-only' && matrix.group == 'source'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: deploy
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PHASE"
          # Each phase is its own transient systemd unit: losing the GitHub SSH
          # connection must not kill cleanup halfway through with the host still
          # quiesced. The DSN is NOT passed here — the node owns it in
          # /etc/faas/e2e-acceptance.env, so it never reaches the process list.
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=100m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' /bin/bash scripts/ci/run-native-e2e.sh" 2>&1 | tee "$RUNNER_TEMP/phase-$PHASE.log"

      - name: Phase 4 — wake (restore, native Flags refresh, scheduling)
        id: phase_wake
        if: always() && steps.compute-node.conclusion == 'success' && inputs.lane != 'smoke' && inputs.lane != 'jobs-only' && inputs.lane != 'containers' && inputs.lane != 'exclusive-operations-only' && inputs.lane != 'managed-operation-only' && inputs.lane != 'customer-job-operations-only' && inputs.lane != 'customer-workflow-operations-only' && inputs.lane != 'project-worker-release-only' && inputs.lane != 'project-progressive-release-only' && inputs.lane != 'project-progressive-http-only' && inputs.lane != 'project-concurrent-release-only' && inputs.lane != 'project-rollback-retention-only' && inputs.lane != 'project-release-secrets-only' && inputs.lane != 'project-migration-contract-only' && inputs.lane != 'project-migration-sql-only' && inputs.lane != 'project-environment-promotion-only' && inputs.lane != 'customer-http-operations-only' && matrix.group == 'runtime'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          PHASE: wake
        run: |
          set -euo pipefail
          remote_root="/var/tmp/faas-native-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          unit="faas-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$PHASE"
          # Each phase is its own transient systemd unit: losing the GitHub SSH
          # connection must not kill cleanup halfway through with the host still
          # quiesced. The DSN is NOT passed here — the node owns it in
          # /etc/faas/e2e-acceptance.env, so it never reaches the process list.
          gcloud compute ssh "$GCP_INSTANCE" --quiet \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --command "sudo systemd-run --quiet --wait --collect --unit='$unit' --property=RuntimeMaxSec=35m --property='StandardOutput=append:$remote_root/native-e2e.log' --property='StandardError=append:$remote_root/native-e2e.log' --working-directory='$remote_root/source' --setenv=FAAS_E2E_SOURCE_SHA='$SOURCE_SHA' --setenv=FAAS_E2E_GO='$remote_root/tools/go/bin/go' --setenv=FAAS_E2E_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' --setenv=FAAS_E2E_TRANSFER_ROOT='$remote_root' --setenv=FAAS_E2E_PHASE='$PHASE' /bin/bash scripts/ci/run-native-e2e.sh" 2>&1 | tee "$RUNNER_TEMP/phase-$PHASE.log"

