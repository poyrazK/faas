# cd-controlplane.yml — deploy FaaS control plane to host on push to main.
#
# Prerequisites (GitHub repo Settings → Secrets):
#   CP_SSH_KEY (or DO_SSH_KEY) — ed25519 private key (generated by bootstrap.sh)
#   CP_HOST    (or DO_HOST)    — Control Plane host public IPv4
#
# What it does:
#   1. Cross-compiles all daemons for linux/amd64
#   2. SCPs binaries + migrations to the Control Plane host
#   3. Runs pending DB migrations
#   4. Restarts all FaaS services
#
# The existing ci.yml must pass first (needs: [test] from ci.yml).

name: cd-controlplane

on:
  workflow_dispatch:  # manual trigger for deliberate deployment

concurrency:
  group: cd-cp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Control Plane Host
    runs-on: ubuntu-latest
    env:
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
      CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
      # Job-level env so the `Verify deployment` step's SSH heredoc
      # inherits the critical/best-effort split (the embedded heredoc
      # already declares these locally inside the `REMOTE` block).
      FAAS_CRITICAL_SERVICES: "vmmd apid schedd gatewayd-internal gatewayd-public meterd githubd"
      FAAS_BEST_EFFORT_SERVICES: "imaged"
    # Only deploy if the CI workflow's test job succeeded.
    # If ci.yml doesn't exist yet or the test job name differs, remove this.
    # needs: test
    if: github.repository == 'poyrazK/faas'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile for linux/amd64
        run: |
          export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
          make build
          go build -o bin/migrate ./cmd/migrate

      - name: Generate CycloneDX SBOM
        # issue #299: emit a CycloneDX 1.5 SBOM covering the Go
        # binaries the deploy will ship. The artifact is uploaded
        # as `SBOM.json` and (on tag) attached to the GitHub
        # release page so customers have a verifiable supply-chain
        # artifact. Source-version is the merge commit SHA so the
        # SBOM ties back to the exact git revision on disk.
        #
        # SYFT 1.49.0 from the github release tarball — the previous
        # `go install github.com/anchore/syft/cmd/syft@v1.0.0` step
        # stopped compiling on Go 1.25 because v1.0.0's go.mod carries
        # `replace` directives that newer Go rejects ("must not contain
        # directives that would cause it to be interpreted differently
        # than if it were the main module"). Same curl+sha256+tar
        # pattern as the vacuum binary download — see memory
        # `ci-vacuum-binary-download.md`.
        #
        # Source type is implicit from the `dir:` scheme; syft 1.x dropped
        # the explicit `--source-type directory` flag. Carrying it forward
        # fails the job with "unknown flag: --source-type" — pinned here
        # so a future syft bump doesn't reintroduce the trap.
        env:
          SYFT_VERSION: "1.49.0"
          SYFT_SHA256: "7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          install -m 0755 /tmp/syft /usr/local/bin/syft
          syft dir:. -o cyclonedx-json=bin/sbom.json --source-version "${{ github.sha }}"

      - name: Upload SBOM.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBOM.json
          path: bin/sbom.json

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to the commit v2 currently resolves to (release 2.6.2,
        # 2026-04-12). Dependabot bumps this SHA weekly — see
        # .github/dependabot.yml github-actions ecosystem. SHA-pinning
        # is required to clear CodeQL actions/unpinned-tag (CWE-829)
        # and matches the supply-chain posture in §11.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: bin/sbom.json

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.CP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.CP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Build immutable release bundle
        run: |
          set -euo pipefail
          RELEASE_ID="${GITHUB_SHA}"
          BUNDLE_ROOT="${RUNNER_TEMP}/faas-release/${RELEASE_ID}"
          mkdir -p "${BUNDLE_ROOT}/bin" "${BUNDLE_ROOT}/systemd" "${BUNDLE_ROOT}/tmpfiles.d"
          for bin in apid schedd gatewayd-public gatewayd-internal imaged meterd githubd vmmd vmmd-raw-bridge vmmd-stream-bridge gregale migrate; do
            install -m 0755 "bin/${bin}" "${BUNDLE_ROOT}/bin/${bin}"
          done
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "${BUNDLE_ROOT}/bin/deployctl" ./cmd/deployctl
          for unit in \
            faas-apid.service \
            faas-cp.slice \
            faas-gatewayd-internal.service \
            faas-gatewayd-public.service \
            faas-githubd.service \
            faas-imaged.service \
            faas-meterd.service \
            faas-schedd.service \
            faas-vmmd.service; do
            install -m 0644 "deploy/controlplane/systemd/${unit}" "${BUNDLE_ROOT}/systemd/${unit}"
          done
          test ! -e "${BUNDLE_ROOT}/systemd/faas-gatewayd.service"
          install -m 0644 deploy/controlplane/tmpfiles.d/faas.conf "${BUNDLE_ROOT}/tmpfiles.d/faas.conf"
          go run ./cmd/deployctl bundle-create "${BUNDLE_ROOT}" "${RELEASE_ID}" "${GITHUB_SHA}" "linux/amd64"
          echo "BUNDLE_ROOT=${BUNDLE_ROOT}" >> "${GITHUB_ENV}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"

      # The controller (deployctl) ships and verifies the release, but
      # imaged's base-stage scanner (grype) + SBOM tool (syft) are host
      # tooling, not release binaries: cmd/imaged's WithGrypeRun /
      # WithSyftRun wiring (cmd/imaged/main.go) shells out to `grype` /
      # `syft` on PATH. When they're missing, the base-stage sidecar
      # fails-closed with CRITICAL=9999 (pkg/imaged/base_stage.go::
      # writeScanSidecar) and vmmd refuses every boot. The Ansible
      # supply_chain_scanners role installs them for ansible-managed
      # boxes; this step covers the controller-managed (cd-controlplane)
      # host so both provisioning paths stay in lock-step. Pins mirror
      # deploy/ansible/roles/supply_chain_scanners/defaults/main.yml —
      # keep the two in lock-step.
      - name: Provision Grype/Syft on host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} 'set -euo pipefail
            install_grype() {
              local v=0.116.0 sha=40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5
              local t=/usr/local/bin/grype
              [[ -x "$t" && "$(sha256sum "$t" | cut -d" " -f1)" == "$sha" ]] && return 0
              curl -fsSL -o /tmp/grype.tar.gz "https://github.com/anchore/grype/releases/download/v${v}/grype_${v}_linux_amd64.tar.gz"
              echo "$sha  /tmp/grype.tar.gz" | sha256sum -c -
              tar -xzf /tmp/grype.tar.gz -C /tmp grype
              install -m 0755 /tmp/grype "$t"
              rm -f /tmp/grype.tar.gz /tmp/grype
            }
            install_syft() {
              local v=1.0.0 sha=27dfeaca134cd8aeff6135ba349ff922109bd89b955755459601667d69fed88e
              local t=/usr/local/bin/syft
              [[ -x "$t" && "$(sha256sum "$t" | cut -d" " -f1)" == "$sha" ]] && return 0
              curl -fsSL -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v${v}/syft_${v}_linux_amd64.tar.gz"
              echo "$sha  /tmp/syft.tar.gz" | sha256sum -c -
              tar -xzf /tmp/syft.tar.gz -C /tmp syft
              install -m 0755 /tmp/syft "$t"
              rm -f /tmp/syft.tar.gz /tmp/syft
            }
            install_grype
            install_syft
            grype version
            syft version
          '

      - name: Upload and activate immutable release
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} "mkdir -p /opt/faas/releases/${RELEASE_ID}"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r \
            "${BUNDLE_ROOT}/." "root@${{ env.CP_HOST }}:/opt/faas/releases/${RELEASE_ID}/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} \
            "/opt/faas/releases/${RELEASE_ID}/bin/deployctl bundle-check /opt/faas/releases/${RELEASE_ID} && /opt/faas/releases/${RELEASE_ID}/bin/deployctl deploy ${RELEASE_ID}"

      # Legacy mutable upload/restart steps removed; deployment is handled by the immutable release controller above.
