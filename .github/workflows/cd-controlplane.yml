# cd-controlplane.yml — deploy a selected signed release to the control plane.
# Production platform releases are orchestrated by cd-platform.yml; this is a
# reusable stage and an independently dispatchable repair path.
#
# Prerequisites (GitHub repo Settings → Secrets):
#   CP_SSH_KEY (or DO_SSH_KEY) — ed25519 private key (PR-1: previously generated
#                                by deploy/controlplane/bootstrap.sh; PR-X
#                                `gregale secrets init` supersedes that path)
#   CP_HOST    (or DO_HOST)    — Control Plane host public IPv4
#   CP_ANSIBLE_VARS_B64        — base64 of the control-plane Ansible variables
#                                (the prod-vars.yml an operator used to pass to
#                                `make bootstrap-control-plane`); ADR-580
#   COMPUTE_SSH_KEY, COMPUTE_KNOWN_HOSTS — shared with cd-compute; the verified
#                                fleet path control-plane convergence uses
#
# The workflow never builds daemon binaries. Select a tag produced by
# release.yml; the runner downloads and verifies that release's canonical
# tarball before assembling the host deployment bundle.
#
# What it does:
#   1. Downloads and verifies the signed canonical release for the selected tag
#   2. Assembles the checked-in systemd/controller files around those binaries
#   3. Reuses a verified immutable bundle or uploads it when absent
#   4. Runs pending DB migrations
#   5. Restarts all FaaS services
#
# No CI gate here: the tag passed its pull request's light tier, and the
# full suite (ci.yml) gates no release
# (docs/adr/20261018104452-release-decoupled-from-full-ci.md).
#
# Per-unit releases (docs/adr/1650-per-unit-control-plane-releases.md):
# with units_run_id instead of release_tag, the deploy-units job deploys a
# signed unit release built by release-units.yml over the full release the
# host runs, applies its lane-eligible migrations, and restarts only the
# control-plane daemons it changed.

name: cd-controlplane

on:
  workflow_call:
    outputs:
      activated:
        description: "The selected release completed deployctl activation in this run"
        value: ${{ jobs.deploy.outputs.activated }}
    inputs:
      deploy_environment:
        description: >-
          GitHub environment holding the target fleet's secrets. Each
          environment has its own trusted runner label: production uses
          faas-fleet, production-us (gregale-prod, us-east1) uses
          faas-fleet-us, so one fleet's runner never deploys the other.
        required: false
        default: production
        type: string
      release_tag:
        description: "Existing pre-1.0 release tag published by release.yml (empty with units_run_id)"
        required: false
        default: ""
        type: string
      units_run_id:
        description: "release-units.yml run whose signed unit release to deploy instead of a full release"
        required: false
        default: ""
        type: string
      units:
        description: "Optional guard: comma-separated control-plane units the unit release must restart"
        required: false
        default: ""
        type: string
      units_lane:
        description: "Lane of the unit release to deploy on the control plane: control-plane, or edge (its own gatewayd-public)"
        required: false
        default: control-plane
        type: string
      slo_gate:
        description: "SLO gate for this host: canary (full) or follower (short); durations in scripts/ci/release_units.json"
        required: false
        default: canary
        type: string
      hosted_runner:
        description: >-
          Run this workflow's coordination job on a GitHub-hosted runner
          instead of the dedicated fleet runner. Escape hatch for when the
          fleet runner host is unavailable; hosted jobs queue behind CI.
        type: boolean
        default: false
  workflow_dispatch:  # manual trigger for deliberate deployment
    inputs:
      deploy_environment:
        description: >-
          GitHub environment holding the target fleet's secrets. Each
          environment has its own trusted runner label: production uses
          faas-fleet, production-us (gregale-prod, us-east1) uses
          faas-fleet-us, so one fleet's runner never deploys the other.
        required: false
        default: production
        type: choice
        options:
          - production
          - production-us
      release_tag:
        description: "Existing pre-1.0 release tag published by release.yml (for example v0.1.18-rc.1); empty with units_run_id"
        required: false
        default: ""
        type: string
      units_run_id:
        description: "release-units.yml run whose signed unit release to deploy instead of a full release"
        required: false
        default: ""
        type: string
      units:
        description: "Optional guard: comma-separated control-plane units the unit release must restart"
        required: false
        default: ""
        type: string
      units_lane:
        description: "Lane of the unit release to deploy on the control plane: control-plane, or edge (its own gatewayd-public)"
        required: false
        default: control-plane
        type: string
      slo_gate:
        description: "SLO gate for this host: canary (full) or follower (short); durations in scripts/ci/release_units.json"
        required: false
        default: canary
        type: string
      hosted_runner:
        description: >-
          Run this workflow's coordination job on a GitHub-hosted runner
          instead of the dedicated fleet runner. Escape hatch for when the
          fleet runner host is unavailable; hosted jobs queue behind CI.
        type: boolean
        default: false

concurrency:
  group: cd-cp-${{ inputs.deploy_environment }}-${{ inputs.release_tag || 'units' }}
  # A production deployment must finish or fail visibly; cancelling it
  # midway can leave binaries, migrations, and systemd state out of sync.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Control Plane Host
    outputs:
      activated: ${{ steps.activate.outputs.activated }}
    environment: ${{ inputs.deploy_environment }}
    # The dedicated fleet runner does not queue behind repository CI the way
    # GitHub-hosted runners do (a busy CI day added 8-14 min per hosted job).
    runs-on: ${{ inputs.hosted_runner && 'ubuntu-latest' || fromJSON(inputs.deploy_environment == 'production-us' && '["self-hosted","linux","faas-fleet-us"]' || '["self-hosted","linux","faas-fleet"]') }}
    env:
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
      CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
      # APID publishes source archives and removes expired app artifacts, so
      # it needs the same package lifecycle capability that imaged receives on
      # compute hosts. Keep the shared storage.env credential read-only.
      APID_STORAGE_LIFECYCLE_ENV: ${{ secrets.COMPUTE_IMAGED_STORAGE_ENV }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      # The critical / best-effort service split is owned by
      # pkg/daemonunitspec (Entry.Critical) and shipped as
      # deploy/etc/daemons.json; the env lists that used to live here were
      # read by nothing (ADR-143 dead-config sweep).
    if: github.repository == 'poyrazK/faas' && inputs.units_run_id == ''
    # Raised from 15 for ADR-580: a changed control-plane contract runs the
    # control-plane roles before activation. An unchanged one costs under a
    # minute. Raised from 40: on production-us the role converge alone takes
    # about 30 minutes (rc.252: 00:52-01:23 UTC, also on a re-dispatch) and
    # activation about 9 more, so rc.249, rc.251 and rc.252 were all
    # cancelled during activation.
    timeout-minutes: 75

    steps:
      - name: Require a release tag
        run: |
          [[ -n "$RELEASE_TAG" ]] || {
            echo "::error::set release_tag (a full release) or units_run_id (a unit release)" >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Unit/controller sources must come from the same commit as the
          # release assets. No daemon source is built in this workflow.
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The fleet runner is long-lived and keeps its local Go build cache
          # between jobs; the Actions cache only helps the hosted escape hatch
          # and otherwise costs a ~30 s save at the end of every rollout.
          cache: ${{ inputs.hosted_runner }}

      - name: Install pinned config renderer
        # A per-job venv: the self-hosted fleet runner (Ubuntu 24.04) has no
        # system pip and marks its interpreter externally managed (PEP 668).
        # Cached across jobs (see scripts/ci/ensure-ansible-toolchain.sh); it
        # also carries the collections the converge step needs.
        run: |
          set -euo pipefail
          toolchain="$(scripts/ci/ensure-ansible-toolchain.sh 'ansible-core==2.21.2' deploy/ansible/requirements.yml)"
          venv_bin="$(sed -n 's/^ANSIBLE_VENV_BIN=//p' <<<"$toolchain")"
          collections="$(sed -n 's/^ANSIBLE_COLLECTIONS_PATH=//p' <<<"$toolchain")"
          [[ -x "$venv_bin/ansible-playbook" && -d "$collections" ]]
          echo "$venv_bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=$collections" >> "$GITHUB_ENV"

      - name: Install pinned cosign verifier
        env:
          COSIGN_VERSION: "2.4.1"
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"
        run: |
          set -euo pipefail
          # Two runner instances on one fleet host share a user and $HOME.
          # A shared ~/.sigstore cache made parallel jobs race on its lock
          # ("creating cached local store: resource temporarily
          # unavailable"); keep the TUF cache per job.
          echo "TUF_ROOT=$RUNNER_TEMP/sigstore-tuf" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-tools"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/release-tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/release-tools/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/release-tools/cosign"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Download and verify canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The bundle manifest records each file's mode. The fleet runner's
          # service runs with UMask=0077, while the control plane extracts
          # release.tar.gz as root with the archive's modes; use the hosted
          # runner's umask so both sides agree (bin/apid 0755, not 0700).
          umask 0022
          CANONICAL_ROOT="$RUNNER_TEMP/gregale-canonical"
          mkdir -p "$CANONICAL_ROOT"
          # GitHub's by-tag response can lag asset uploads while the by-ID
          # response is current. Resolve the tag to an ID, then use the ID
          # response for the authoritative asset list.
          # Plain REST keeps this step independent of the gh CLI, which the
          # dedicated fleet runner does not install.
          github_api() {
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/$1"
          }
          release_id="$(github_api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" | jq -er '.id')"
          release_json="$(github_api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          for asset in release.tar.gz release.cosign.bundle release.sbom.json \
            release-manifest.json production-manifest.yaml runtime-bases.env SHA256SUMS; do
            asset_url="$(jq -er --arg name "$asset" \
              '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release_json")"
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              -o "$CANONICAL_ROOT/$asset" "$asset_url"
          done
          (
            cd "$CANONICAL_ROOT"
            sha256sum -c SHA256SUMS
          )
          cosign verify-blob \
            --bundle "$CANONICAL_ROOT/release.cosign.bundle" \
            --certificate-identity "https://github.com/poyrazK/faas/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CANONICAL_ROOT/release.tar.gz"
          mkdir -p "$CANONICAL_ROOT/unpacked"
          tar -xzf "$CANONICAL_ROOT/release.tar.gz" -C "$CANONICAL_ROOT/unpacked"
          cmp "$CANONICAL_ROOT/unpacked/release-manifest.json" "$CANONICAL_ROOT/release-manifest.json"
          RELEASE_ID="$(jq -er '.git_sha' "$CANONICAL_ROOT/release-manifest.json")"
          RELEASE_MANIFEST_HASH="$(jq -er '.manifest_hash' "$CANONICAL_ROOT/release-manifest.json")"
          ACTUAL_MANIFEST_HASH="sha256:$(sha256sum "$CANONICAL_ROOT/production-manifest.yaml" | awk '{print $1}')"
          [[ "$RELEASE_MANIFEST_HASH" == "$ACTUAL_MANIFEST_HASH" ]] || {
            echo "production manifest hash=$ACTUAL_MANIFEST_HASH does not match release manifest=$RELEASE_MANIFEST_HASH" >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n1 "$RELEASE_TAG")"
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release manifest has invalid git_sha=$RELEASE_ID" >&2
            exit 1
          }
          [[ "$RELEASE_ID" == "$TAG_COMMIT" ]] || {
            echo "release manifest git_sha=$RELEASE_ID does not match tag commit=$TAG_COMMIT" >&2
            exit 1
          }
          echo "CANONICAL_ROOT=$CANONICAL_ROOT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ env.CP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust CP_HOST only when it presents a host key the operator
          # verified in COMPUTE_KNOWN_HOSTS, the fleet file cd-compute already
          # requires. A bare ssh-keyscan trusted whatever answered, every run.
          [[ -n "${COMPUTE_KNOWN_HOSTS:-}" ]] || {
            echo "::error::COMPUTE_KNOWN_HOSTS is required to verify the control-plane host key" >&2
            exit 1
          }
          scanned="$(ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$CP_HOST" 2>/dev/null || true)"
          pinned=0
          while read -r _ key_type key; do
            [[ -n "${key:-}" ]] || continue
            if awk -v t="$key_type" -v k="$key" '!/^#/ { for (i = 1; i < NF; i++) if ($i == t && $(i + 1) == k) found = 1 } END { exit !found }' <<<"$COMPUTE_KNOWN_HOSTS"; then
              printf '%s %s %s\n' "$CP_HOST" "$key_type" "$key" >> ~/.ssh/known_hosts
              pinned=1
            fi
          done <<<"$scanned"
          [[ $pinned == 1 ]] || {
            echo "::error::$CP_HOST presented no host key listed in COMPUTE_KNOWN_HOSTS" >&2
            exit 1
          }
          chmod 600 ~/.ssh/known_hosts

      - name: Converge APID lifecycle storage credential
        run: |
          set -euo pipefail
          [[ -n "${APID_STORAGE_LIFECYCLE_ENV:-}" ]] || {
            echo "::error::production secret COMPUTE_IMAGED_STORAGE_ENV is required for APID source publication" >&2
            exit 1
          }
          stage="$RUNNER_TEMP/apid-storage-${GITHUB_RUN_ID}"
          printf '%s\n' "$APID_STORAGE_LIFECYCLE_ENV" > "$stage"
          chmod 0600 "$stage"
          python3 - "$stage" <<'PY'
          import sys

          values = {}
          with open(sys.argv[1], encoding="utf-8") as stream:
              for raw in stream:
                  line = raw.rstrip("\r\n")
                  if not line:
                      continue
                  key, sep, value = line.partition("=")
                  assert sep and key in {"FAAS_OCI_USERNAME", "FAAS_OCI_PASSWORD"}
                  assert key not in values and value
                  values[key] = value
          assert set(values) == {"FAAS_OCI_USERNAME", "FAAS_OCI_PASSWORD"}
          PY
          remote_stage="/tmp/gregale-apid-storage-${GITHUB_RUN_ID}.env"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$stage" "root@${CP_HOST}:${remote_stage}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" "bash -s -- '${remote_stage}'" <<'REMOTE'
            set -euo pipefail
            remote_stage="$1"
            trap 'rm -f -- "$remote_stage"' EXIT
            test -s /etc/faas/storage.env
            grep -Eq '^FAAS_STORAGE_BACKEND=(oci|gcs)$' /etc/faas/storage.env
            getent group faas >/dev/null
            # Unchanged bytes keep their modification time, so deployctl can
            # still hand apid off instead of restarting it (see the
            # credentials step's install_if_changed).
            if [[ -e /etc/faas/apid-storage.env ]] && cmp -s "$remote_stage" /etc/faas/apid-storage.env; then
              chown root:faas /etc/faas/apid-storage.env
              chmod 0440 /etc/faas/apid-storage.env
            else
              install -o root -g faas -m 0440 "$remote_stage" /etc/faas/apid-storage.env
            fi
            install -d -o root -g root -m 0755 /etc/systemd/system/faas-apid.service.d
            dropin=/etc/systemd/system/faas-apid.service.d/99-storage-lifecycle.conf
            dropin_stage="$(mktemp)"
            cat > "$dropin_stage" <<'CREDENTIALS'
          [Service]
          EnvironmentFile=/etc/faas/apid-storage.env
          CREDENTIALS
            if [[ -e "$dropin" ]] && cmp -s "$dropin_stage" "$dropin"; then
              chmod 0644 "$dropin"
            else
              install -o root -g root -m 0644 "$dropin_stage" "$dropin"
            fi
            rm -f -- "$dropin_stage"
            rm -f -- \
              /etc/faas/oci-e2e.env \
              /etc/systemd/system/faas-apid.service.d/99-codex-oci-source.conf \
              /etc/systemd/system/faas-apid.service.d/99-oci-e2e.conf \
              /etc/systemd/system/faas-schedd.service.d/99-oci-e2e.conf
            systemctl daemon-reload
          REMOTE

      - name: Quarantine invalid legacy node exporter unit
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} 'set -euo pipefail
            unit=/etc/systemd/system/node_exporter.service
            if [[ ! -f "$unit" ]] || ! grep -Fq "{{" "$unit"; then
              exit 0
            fi
            systemctl is-active --quiet prometheus-node-exporter.service
            curl --fail --silent --max-time 2 http://127.0.0.1:9100/metrics >/dev/null
            systemctl disable --now node_exporter.service
            mv "$unit" "${unit}.invalid-placeholder"
            systemctl daemon-reload
            systemctl reset-failed node_exporter.service || true
            curl --fail --silent --max-time 2 http://127.0.0.1:9100/metrics >/dev/null
          '

      - name: Build immutable release bundle
        run: |
          set -euo pipefail
          # Same umask as the canonical download step: see there.
          umask 0022
          BUNDLE_ROOT="${RUNNER_TEMP}/faas-release/${RELEASE_ID}"
          mkdir -p "${BUNDLE_ROOT}/bin" "${BUNDLE_ROOT}/systemd" "${BUNDLE_ROOT}/optional-systemd" "${BUNDLE_ROOT}/tmpfiles.d" "${BUNDLE_ROOT}/prometheus" "${BUNDLE_ROOT}/statuspage"
          PROM_BOX_LABEL="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@${CP_HOST}" hostname)"
          ansible localhost -i localhost, -c local \
            -e @deploy/ansible/roles/prometheus/defaults/main.yml \
            -e "ansible_hostname=${PROM_BOX_LABEL}" \
            -e faas_box_role=control-plane \
            -m ansible.builtin.template \
            -a "src=$(pwd)/deploy/ansible/roles/prometheus/templates/prometheus.yml.j2 dest=${BUNDLE_ROOT}/prometheus/prometheus.yml mode=0644"
          install -m 0644 deploy/ansible/roles/prometheus/files/faas.rules.yml "${BUNDLE_ROOT}/prometheus/faas.rules.yml"
          install -m 0644 deploy/ansible/roles/prometheus/files/bridge.rules.yml "${BUNDLE_ROOT}/prometheus/bridge.rules.yml"
          install -m 0644 deploy/ansible/roles/prometheus/files/pg_backup.rules.yml "${BUNDLE_ROOT}/prometheus/pg_backup.rules.yml"
          install -m 0644 deploy/ansible/roles/prometheus/files/data_repair.rules.yml "${BUNDLE_ROOT}/prometheus/data_repair.rules.yml"
          install -m 0644 pkg/promqlrules/data_placement.yaml "${BUNDLE_ROOT}/prometheus/data_placement.yaml"
          # The daemon and guest-runner bytes come only from the verified
          # release.tar.gz. The two controller-local tools are compiled on
          # the CI runner from the checked-out release tag; the production
          # host never invokes a Go compiler.
          cp -a "${CANONICAL_ROOT}/unpacked/." "${BUNDLE_ROOT}/bin/"
          install -m 0644 "${CANONICAL_ROOT}/unpacked/release-manifest.json" \
            "${BUNDLE_ROOT}/release-manifest.json"
          rm -f "${BUNDLE_ROOT}/bin/release-manifest.json"
          for asset in release.tar.gz release.cosign.bundle release.sbom.json production-manifest.yaml runtime-bases.env SHA256SUMS; do
            install -m 0644 "${CANONICAL_ROOT}/${asset}" "${BUNDLE_ROOT}/${asset}"
          done
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/onebox-faas/faas/pkg/wire.Version=${RELEASE_TAG}" \
            -o "${BUNDLE_ROOT}/bin/deployctl" ./cmd/deployctl
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/onebox-faas/faas/pkg/wire.Version=${RELEASE_TAG}" \
            -o "${BUNDLE_ROOT}/bin/migrate" ./cmd/migrate
          # PR-1: the systemd units + slice + tmpfiles.d are read from the v2
          # ansible role files/ tree (the canonical source for both the
          # ansible-managed boxes and this controller-managed CD path). The
          # v1 deploy/controlplane/{systemd,tmpfiles.d}/ was retired in
          # issue #911 / PR-1 (ADR-110); deploy/controlplane/bootstrap.sh is
          # a tombstone now. The v2 tree is the single source of truth for
          # every unit — the daemonunitspec.Registry (pkg/daemonunitspec) is
          # the audit target.
          # This workflow targets the control-plane role. Compute-only
          # units (vmmd, gatewayd-internal, builderd, imaged) are deployed
          # by the node-join/Ansible path on compute hosts; shipping them in
          # this bundle makes deployctl try to enable masked units on the CP
          # host and reintroduces the split-role failure mode.
          for unit in \
            faas-apid.service \
            faas-apid.socket \
            faas-cp.slice \
            faas-gatewayd-public.socket \
            faas-gatewayd-public.service \
            faas-githubd.service \
            faas-meterd.service \
            faas-outboundd.service \
            faas-schedd.socket \
            faas-schedd.service; do
            # Look up the unit in the v2 role files/ trees. The role
            # ownership is the source of truth for the CP subset; deployctl
            # independently derives its activation/restart set from the
            # files actually present in this bundle.
            src=""
            for role_dir in \
              deploy/ansible/roles/control_plane_service/files \
              deploy/ansible/roles/compute_only_service/files \
              deploy/ansible/roles/vmmd_service/files \
              deploy/ansible/roles/githubd_service/files \
              deploy/ansible/roles/gatewayd_internal_service/files \
              deploy/ansible/roles/gatewayd_public_service/files; do
              if [[ -f "${role_dir}/${unit}" ]]; then
                src="${role_dir}/${unit}"
                break
              fi
            done
            if [[ -z "${src}" ]]; then
              echo "::error::PR-1: ${unit} not found in any ansible role files/ tree" >&2
              exit 1
            fi
            install -m 0644 "${src}" "${BUNDLE_ROOT}/systemd/${unit}"
          done
          # Optional services are not members of the core activation set, but
          # a configured service still needs its unit updated with the release
          # and recoverable if an older deployctl incorrectly masked it.
          install -m 0644 \
            deploy/ansible/roles/s3_gateway_service/files/faas-s3-gatewayd.service \
            "${BUNDLE_ROOT}/optional-systemd/faas-s3-gatewayd.service"
          install -m 0644 \
            deploy/ansible/roles/livequeryd_service/files/faas-livequeryd.service \
            "${BUNDLE_ROOT}/optional-systemd/faas-livequeryd.service"
          # Files required before deployctl can activate outboundd. Keep the
          # role/billing overrides inside the signed bundle so the standalone
          # control-plane path applies the same public-beta posture as Ansible.
          install -d -m 0755 "${BUNDLE_ROOT}/host-config"
          install -m 0644 \
            deploy/ansible/roles/control_plane_service/files/outboundd.toml.example \
            "${BUNDLE_ROOT}/host-config/outboundd.toml"
          install -d -m 0755 \
            "${BUNDLE_ROOT}/systemd/faas-outboundd.service.d" \
            "${BUNDLE_ROOT}/systemd/faas-apid.service.d" \
            "${BUNDLE_ROOT}/systemd/faas-meterd.service.d"
          cat > "${BUNDLE_ROOT}/systemd/faas-outboundd.service.d/99-faas-role.conf" <<'EOF'
          [Service]
          Environment=FAAS_OUTBOUNDD_ROLE=control-plane
          EOF
          for service in faas-apid faas-meterd; do
            cat > "${BUNDLE_ROOT}/systemd/${service}.service.d/zz-faas-billing-mode.conf" <<'EOF'
          [Service]
          Environment=FAAS_BILLING_MODE=disabled
          EOF
          done
          cat > "${BUNDLE_ROOT}/systemd/faas-apid.service.d/zz-faas-public-status.conf" <<'EOF'
          [Service]
          Environment=FAAS_PUBLIC_STATUS_LAUNCH_AT=2026-09-14T00:00:00Z
          EOF
          # Tier A7 split: faas-gatewayd.service (the v1 monolithic unit)
          # was removed in PR-A (ADR-070). The CD refuses to ship a
          # leftover copy.
          test ! -e "${BUNDLE_ROOT}/systemd/faas-gatewayd.service"
          install -m 0644 deploy/ansible/roles/control_plane_service/files/faas.conf \
            "${BUNDLE_ROOT}/tmpfiles.d/faas.conf"
          install -m 0755 deploy/scripts/faas-pg-backup-contract-preflight.sh \
            "${BUNDLE_ROOT}/host-config/faas-pg-backup-contract-preflight.sh"
          install -m 0755 deploy/scripts/faas-rclone-backup-identity.py \
            "${BUNDLE_ROOT}/host-config/faas-rclone-backup-identity.py"
          install -m 0755 \
            deploy/ansible/roles/postgres/files/faas-postgres-connection-metrics \
            "${BUNDLE_ROOT}/host-config/faas-postgres-connection-metrics"
          install -m 0644 \
            deploy/ansible/roles/postgres/files/faas-postgres-connection-metrics.service \
            "${BUNDLE_ROOT}/host-config/faas-postgres-connection-metrics.service"
          install -m 0644 \
            deploy/ansible/roles/postgres/files/faas-postgres-connection-metrics.timer \
            "${BUNDLE_ROOT}/host-config/faas-postgres-connection-metrics.timer"
          install -m 0644 docs/DPA.md "${BUNDLE_ROOT}/host-config/dpa.md"
          install -m 0644 deploy/statuspage/index.html \
            "${BUNDLE_ROOT}/statuspage/index.html"
          "${BUNDLE_ROOT}/bin/deployctl" bundle-create "${BUNDLE_ROOT}" "${RELEASE_ID}" "${RELEASE_ID}" "linux/amd64"
          # release.tar.gz already contains every canonical daemon and runner.
          # Avoid sending those bytes twice over the long-haul SSH path: ship
          # the signed tarball, the two controller-only binaries, and the
          # remaining bundle files. The upload step reconstructs the exact
          # bundle before its existing manifest verification gate.
          TRANSPORT_PARENT="$RUNNER_TEMP/faas-release-transport"
          TRANSPORT_ROOT="${TRANSPORT_PARENT}/${RELEASE_ID}"
          TRANSPORT_ARCHIVE="$RUNNER_TEMP/faas-release-${RELEASE_ID}.transport.tar.gz"
          rm -rf -- "$TRANSPORT_ROOT"
          mkdir -p "$TRANSPORT_PARENT"
          cp -al "$BUNDLE_ROOT" "$TRANSPORT_ROOT"
          rm -rf -- "${TRANSPORT_ROOT:?}/bin"
          install -d -m 0755 "$TRANSPORT_ROOT/controller-bin"
          install -m 0755 "$BUNDLE_ROOT/bin/deployctl" "$TRANSPORT_ROOT/controller-bin/deployctl"
          install -m 0755 "$BUNDLE_ROOT/bin/migrate" "$TRANSPORT_ROOT/controller-bin/migrate"
          tar --create --gzip --file "$TRANSPORT_ARCHIVE" \
            --directory "$TRANSPORT_PARENT" "$RELEASE_ID"
          echo "BUNDLE_ROOT=${BUNDLE_ROOT}" >> "${GITHUB_ENV}"
          echo "TRANSPORT_ARCHIVE=${TRANSPORT_ARCHIVE}" >> "${GITHUB_ENV}"

      # The controller (deployctl) ships and verifies the release, but
      # imaged's base-stage scanner (grype) + SBOM tool (syft) are host
      # tooling, not release binaries: cmd/imaged's WithGrypeRun /
      # WithSyftRun wiring (cmd/imaged/main.go) shells out to `grype` /
      # `syft` on PATH. When they're missing, the base-stage sidecar
      # fails-closed with CRITICAL=9999 (pkg/imaged/base_stage.go::
      # writeScanSidecar) and vmmd refuses every boot. The Ansible
      # supply_chain_scanners role installs them for ansible-managed
      # boxes; this step covers the controller-managed (cd-controlplane)
      # host so both provisioning paths stay in lock-step. Pins mirror
      # deploy/ansible/roles/supply_chain_scanners/defaults/main.yml —
      # keep the two in lock-step.
      - name: Provision Grype/Syft on host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} 'set -euo pipefail
            install_grype() {
              local v=0.116.0 sha=40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5
              local t=/usr/local/bin/grype
              [[ -x "$t" && "$(sha256sum "$t" | cut -d" " -f1)" == "$sha" ]] && return 0
              curl -fsSL -o /tmp/grype.tar.gz "https://github.com/anchore/grype/releases/download/v${v}/grype_${v}_linux_amd64.tar.gz"
              echo "$sha  /tmp/grype.tar.gz" | sha256sum -c -
              tar -xzf /tmp/grype.tar.gz -C /tmp grype
              install -m 0755 /tmp/grype "$t"
              rm -f /tmp/grype.tar.gz /tmp/grype
            }
            install_syft() {
              local v=1.0.0 sha=27dfeaca134cd8aeff6135ba349ff922109bd89b955755459601667d69fed88e
              local t=/usr/local/bin/syft
              [[ -x "$t" && "$(sha256sum "$t" | cut -d" " -f1)" == "$sha" ]] && return 0
              curl -fsSL -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v${v}/syft_${v}_linux_amd64.tar.gz"
              echo "$sha  /tmp/syft.tar.gz" | sha256sum -c -
              tar -xzf /tmp/syft.tar.gz -C /tmp syft
              install -m 0755 /tmp/syft "$t"
              rm -f /tmp/syft.tar.gz /tmp/syft
            }
            install_grype
            install_syft
            grype version
            syft version
          '

      - name: Reject production dev bootstrap variables
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" 'bash -se' <<'REMOTE'
          sealed=/etc/faas/sealed.env
          test -f "$sealed"
          if grep -qE '^FAAS_(DEV|DEV_TOKEN)=' "$sealed"; then
            echo "production sealed.env contains a forbidden dev-only auth/bootstrap variable" >&2
            exit 1
          fi
          archive=/etc/faas/secrets/storage-box/archive-creds.json
          test -s "$archive" || {
            echo "production log archive credentials are missing" >&2
            exit 1
          }
          python3 - "$archive" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          assert all(isinstance(data.get(key), str) and data[key].strip() for key in ("endpoint", "bucket"))
          hmac = all(isinstance(data.get(key), str) and data[key].strip() for key in ("key_id", "secret"))
          metadata = data.get("auth_mode") == "gcp_metadata" and not data.get("key_id") and not data.get("secret")
          assert hmac or metadata
          PY
          REMOTE

      - name: Stage the shared fleet seal identity
        env:
          FLEET_AGE_KEY: ${{ secrets.FLEET_AGE_KEY }}
          FLEET_AGE_RECIPIENT: ${{ secrets.FLEET_AGE_RECIPIENT }}
          COMPUTE_VERIFY_KEY: ${{ secrets.COMPUTE_VERIFY_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${FLEET_AGE_KEY:-}" && -n "${FLEET_AGE_RECIPIENT:-}" && -n "${COMPUTE_VERIFY_KEY:-}" ]] || {
            echo "::error::production secrets FLEET_AGE_KEY, FLEET_AGE_RECIPIENT and COMPUTE_VERIFY_KEY are required" >&2
            exit 1
          }
          stage="$RUNNER_TEMP/fleet-age"
          install -d -m 0700 "$stage"
          # Age identities are byte-exact single-line values. A trailing
          # newline makes the strict fleet-seal parser reject the key.
          printf '%s' "$FLEET_AGE_KEY" > "$stage/fleet.age"
          printf '%s' "$FLEET_AGE_RECIPIENT" > "$stage/fleet.age.pub"
          # Exactly one trailing newline, however the secret was pasted.
          printf '%s\n' "$(printf '%s' "$COMPUTE_VERIFY_KEY")" > "$stage/sign-pub.pem"
          chmod 0400 "$stage/fleet.age"
          chmod 0444 "$stage/fleet.age.pub" "$stage/sign-pub.pem"
          remote_stage="/tmp/gregale-fleet-age-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" "install -d -m 0700 '$remote_stage'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$stage/fleet.age" "$stage/fleet.age.pub" "$stage/sign-pub.pem" \
            "root@${{ env.CP_HOST }}:${remote_stage}/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" "bash -s -- '$remote_stage'" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          trap 'rm -rf -- "$stage"' EXIT
          grep -qE '^AGE-SECRET-KEY-1[0-9A-Z]+$' "$stage/fleet.age"
          grep -qE '^age1[0-9a-z]+$' "$stage/fleet.age.pub"
          grep -qx -- '-----BEGIN PUBLIC KEY-----' "$stage/sign-pub.pem"
          # Rewrite host files only when their content changes. deployctl
          # hands a daemon off (zero-downtime reload) only when no unit input
          # (unit file, drop-ins, environment files, credential sources) has a
          # modification time newer than the running process; rewriting
          # identical bytes on every deploy made apid restart instead
          # (rc.281: one API probe timed out and the rollout gate failed).
          install_if_changed() { # MODE SRC DEST
            if [[ -e "$3" ]] && cmp -s "$2" "$3"; then
              chown root:root "$3"; chmod "$1" "$3"; return 0
            fi
            install -o root -g root -m "$1" "$2" "$3"
          }
          write_if_changed() { # MODE DEST < content
            local tmp; tmp="$(mktemp)"
            cat > "$tmp"
            install_if_changed "$1" "$tmp" "$2"
            rm -f "$tmp"
          }
          install -d -o root -g root -m 0700 /etc/faas/secrets
          for file in fleet.age fleet.age.pub; do
            if [[ -e "/etc/faas/secrets/$file" ]] && ! cmp -s "$stage/$file" "/etc/faas/secrets/$file"; then
              echo "existing $file differs; use the coordinated fleet-seal rotation procedure" >&2
              exit 1
            fi
          done
          install_if_changed 0400 "$stage/fleet.age" /etc/faas/secrets/fleet.age
          install_if_changed 0444 "$stage/fleet.age.pub" /etc/faas/secrets/fleet.age.pub

          # apid and schedd verify image signatures with the fleet's public
          # signing key (LoadCredential=cd_sign_pub below). Compute joins
          # install it from COMPUTE_VERIFY_KEY; the control plane never
          # received it, so a fresh control plane could not start apid.
          if [[ -e /etc/faas/secrets/sign-pub.pem ]] && ! cmp -s "$stage/sign-pub.pem" /etc/faas/secrets/sign-pub.pem; then
            echo "existing sign-pub.pem differs from COMPUTE_VERIFY_KEY; use the signing-key rotation procedure" >&2
            exit 1
          fi
          install_if_changed 0444 "$stage/sign-pub.pem" /etc/faas/secrets/sign-pub.pem

          # Keep both the incoming release and an older rollback release able
          # to read the public recipients while /etc/faas/secrets stays 0700.
          # This drop-in is host state, so deployctl preserves it across the
          # release unit install and any rollback.
          install -d -o root -g root -m 0755 /etc/systemd/system/faas-apid.service.d
          write_if_changed 0644 /etc/faas/apid-age-recipients.env <<'RECIPIENTS'
          FAAS_FLEET_AGE_RECIPIENT_PATH=/run/credentials/faas-apid.service/cd_fleet_age_recipient
          FAAS_HOST_AGE_RECIPIENT_PATH=/run/credentials/faas-apid.service/cd_host_age_recipient
          RECIPIENTS
          write_if_changed 0644 /etc/systemd/system/faas-apid.service.d/98-age-recipient-credentials.conf <<'CREDENTIALS'
          [Service]
          LoadCredential=cd_fleet_age_recipient:/etc/faas/secrets/fleet.age.pub
          LoadCredential=cd_host_age_recipient:/etc/faas/secrets/host.age.pub
          LoadCredential=cd_sign_pub:/etc/faas/secrets/sign-pub.pem
          Environment=FAAS_SIGN_PUB=%d/cd_sign_pub
          EnvironmentFile=/etc/faas/apid-age-recipients.env
          CREDENTIALS

          install -d -o root -g root -m 0755 /etc/systemd/system/faas-schedd.service.d
          write_if_changed 0644 /etc/systemd/system/faas-schedd.service.d/98-signing-public-key-credential.conf <<'CREDENTIALS'
          [Service]
          LoadCredential=cd_sign_pub:/etc/faas/secrets/sign-pub.pem
          Environment=FAAS_SIGN_PUB=%d/cd_sign_pub
          CREDENTIALS

          install -d -o root -g root -m 0755 /etc/systemd/system/faas-githubd.service.d
          write_if_changed 0644 /etc/systemd/system/faas-githubd.service.d/98-fleet-recipient-credential.conf <<'CREDENTIALS'
          [Service]
          LoadCredential=cd_fleet_age_recipient:/etc/faas/secrets/fleet.age.pub
          LoadCredential=cd_github_app_key:/etc/faas/secrets/githubd/app.pem
          Environment=FAAS_HOST_AGE_PUB=%d/cd_fleet_age_recipient
          Environment=FAAS_GITHUB_APP_KEY_PATH=%d/cd_github_app_key
          CREDENTIALS
          REMOTE

      # ADR-580: converge the control-plane bootstrap roles before release
      # activation, but only when their inputs changed (plays, roles, shared
      # task libraries, ansible.cfg, collection pins, rendered inventory, or
      # CP_ANSIBLE_VARS_B64). Before this, role fixes (packages, drop-ins,
      # Alertmanager, Caddy, nftables, PostgreSQL settings) reached the
      # control plane only through a manual workstation bootstrap. FaaS daemon
      # restarts are deferred to the activation below; infrastructure services
      # restart through their own handlers when their configuration changed.
      - name: Converge control-plane roles
        if: ${{ !inputs.hosted_runner }}
        env:
          CP_ANSIBLE_VARS_B64: ${{ secrets.CP_ANSIBLE_VARS_B64 }}
          SEAL_DOMAIN_OUTBOUND_AGE_KEY: ${{ secrets.SEAL_DOMAIN_OUTBOUND_AGE_KEY }}
          SEAL_DOMAIN_OUTBOUND_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_OUTBOUND_AGE_RECIPIENT }}
          SEAL_DOMAIN_SOURCE_AGE_KEY: ${{ secrets.SEAL_DOMAIN_SOURCE_AGE_KEY }}
          SEAL_DOMAIN_SOURCE_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_SOURCE_AGE_RECIPIENT }}
          SEAL_DOMAIN_RUNTIME_AGE_KEY: ${{ secrets.SEAL_DOMAIN_RUNTIME_AGE_KEY }}
          SEAL_DOMAIN_RUNTIME_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_RUNTIME_AGE_RECIPIENT }}
          SEAL_DOMAIN_BUILD_AGE_KEY: ${{ secrets.SEAL_DOMAIN_BUILD_AGE_KEY }}
          SEAL_DOMAIN_BUILD_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_BUILD_AGE_RECIPIENT }}
          COMPUTE_SSH_KEY: ${{ secrets.COMPUTE_SSH_KEY }}
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
        run: |
          set -euo pipefail
          if [[ ! -f deploy/ansible/control_plane_converge.yml ]]; then
            echo "::notice::${RELEASE_TAG} predates control-plane convergence (ADR-580); skipping"
            exit 0
          fi
          for name in CP_ANSIBLE_VARS_B64 COMPUTE_SSH_KEY COMPUTE_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not set in the ${DEPLOY_ENVIRONMENT} environment; control-plane convergence needs it (docs/adr/580-control-plane-convergence-in-cd.md)" >&2
              exit 1
            fi
          done
          work="$RUNNER_TEMP/cp-converge"
          rm -rf -- "$work"
          install -d -m 0700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$CP_ANSIBLE_VARS_B64" | base64 --decode > "$work/vars.yml"
          # ADR 20261022111812: the seal_domains role stages the domain keys
          # held as SEAL_DOMAIN_* secrets; the write modes stay in the vars.
          scripts/ci/seal_domain_vars.sh control-plane "$work/seal-domains" "$work/vars.yml"
          printf '%s\n' "$COMPUTE_SSH_KEY" > "$work/ssh-key"
          printf '%s\n' "$COMPUTE_KNOWN_HOSTS" > "$work/known_hosts"
          chmod 0600 "$work/vars.yml" "$work/ssh-key" "$work/known_hosts"

          # The roles need the collections deploy/ansible/requirements.yml
          # pins; the toolchain step above installed (or reused) them.
          [[ -d "${ANSIBLE_COLLECTIONS_PATH:-}/ansible_collections/community/postgresql" ]] || {
            echo "::error::pinned Ansible collections are missing from ANSIBLE_COLLECTIONS_PATH" >&2
            exit 1
          }

          # The signed release's own gregalectl, matching the checked-out roles.
          "$CANONICAL_ROOT/unpacked/gregalectl" deploy converge-control-plane \
            --manifest-file "$CANONICAL_ROOT/production-manifest.yaml" \
            --ssh-known-hosts-file "$work/known_hosts" \
            --ssh-key "$work/ssh-key" \
            --ansible-vars-file "$work/vars.yml" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Report skipped control-plane convergence
        if: ${{ inputs.hosted_runner }}
        run: |
          echo "::warning::GitHub-hosted runners cannot resolve the fleet's private names; control-plane roles were not converged this run (ADR-580)"

      - name: Upload and activate immutable release
        id: activate
        run: |
          set -euo pipefail
          release_dir="/opt/faas/releases/${RELEASE_ID}"
          if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} \
            "test -x '${release_dir}/bin/deployctl' && '${release_dir}/bin/deployctl' bundle-check-installed '${release_dir}'"; then
            echo "reusing verified immutable release ${RELEASE_ID}"
          else
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              root@${{ env.CP_HOST }} "bash -s -- '${release_dir}'" <<'REMOTE'
          set -euo pipefail
          release_dir="$1"
          current_release="$(readlink -f /opt/faas/current 2>/dev/null || true)"
          if [[ "$current_release" == "$release_dir" ]]; then
            echo "active immutable release failed bundle verification: ${release_dir}" >&2
            exit 1
          fi
          rm -rf -- "$release_dir"
          mkdir -p -- "$release_dir"
          REMOTE
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$TRANSPORT_ARCHIVE" \
              "root@${{ env.CP_HOST }}:${release_dir}/.transport.tar.gz"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              root@${{ env.CP_HOST }} "bash -s -- '${release_dir}'" <<'REMOTE'
          set -euo pipefail
          release_dir="$1"
          transport="$release_dir/.transport.tar.gz"
          tar --extract --gzip --file "$transport" --directory "$release_dir" \
            --strip-components=1 --no-same-owner
          rm -f -- "$transport"
          install -d -o root -g root -m 0755 "$release_dir/bin"
          tar --extract --gzip --file "$release_dir/release.tar.gz" \
            --directory "$release_dir/bin" --no-same-owner
          rm -f -- "$release_dir/bin/release-manifest.json"
          install -o root -g root -m 0755 \
            "$release_dir/controller-bin/deployctl" "$release_dir/bin/deployctl"
          install -o root -g root -m 0755 \
            "$release_dir/controller-bin/migrate" "$release_dir/bin/migrate"
          rm -rf -- "${release_dir:?}/controller-bin"
          REMOTE
          fi
          # outboundd was added after the original controller-managed host
          # bootstrap. Converge its least-privilege runtime prerequisites
          # before deployctl enables the release's authoritative unit set.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} "bash -s -- '${release_dir}'" <<'REMOTE'
          set -euo pipefail
          release_dir="$1"
          getent group faas >/dev/null
          if ! id faas-outboundd >/dev/null 2>&1; then
            useradd --system --gid faas --shell /usr/sbin/nologin \
              --no-create-home faas-outboundd
          fi
          if [[ ! -f /etc/faas/outboundd.toml ]]; then
            install -o root -g faas -m 0640 \
              "$release_dir/host-config/outboundd.toml" \
              /etc/faas/outboundd.toml
          fi

          # APID opens the OCI-backed SBOM store during startup. The cache
          # root is host state and may not exist on control-only nodes, while
          # /var/lib/faas itself is intentionally not group-writable.
          install -d -o faas-apid -g faas -m 2770 /var/lib/faas/cache
          # faas-apid runs with RestrictSUIDSGID=yes and UMask=0022. Older
          # releases therefore left owner-specific 2750 shards that schedd
          # could read but not update. Repair every persistent shard before
          # activation; cached blob file modes remain unchanged.
          find /var/lib/faas/cache -type d \
            -exec chgrp faas {} + -exec chmod 2770 {} +

          install -d -o root -g root -m 0700 /etc/faas/secrets/outboundd
          outbound_env="$(mktemp /etc/faas/secrets/outboundd/.outboundd.env.XXXXXX)"
          trap 'rm -f "$outbound_env"' EXIT
          grep -E '^DATABASE_URL=.+' /etc/faas/sealed.env > "$outbound_env"
          [[ "$(wc -l < "$outbound_env")" -eq 1 ]]
          chown root:root "$outbound_env"
          chmod 0400 "$outbound_env"
          mv -f "$outbound_env" /etc/faas/secrets/outboundd/outboundd.env
          trap - EXIT

          ident_file="$(sudo -u postgres psql -X -A -t -c 'show ident_file')"
          if ! grep -qE '^faas_map[[:space:]]+faas-outboundd[[:space:]]+faas$' "$ident_file"; then
            printf 'faas_map  faas-outboundd  faas\n' >> "$ident_file"
            systemctl reload postgresql@16-main.service
          fi

          # Keep off-host PostgreSQL recovery working when the VM moves from
          # the broad default Compute Engine identity to gregale-control.
          # The wrapper uses that role identity only to mint a short-lived
          # token for the append-only backup writer.
          install -d -o root -g root -m 0755 /usr/local/lib/faas
          install -o root -g root -m 0755 \
            "$release_dir/host-config/faas-rclone-backup-identity.py" \
            /usr/local/lib/faas/faas-rclone-backup-identity.py
          for unit in faas-pg-basebackup-push.service faas-pg-wal-prune.service; do
            install -d -o root -g root -m 0755 "/etc/systemd/system/${unit}.d"
            cat > "/etc/systemd/system/${unit}.d/90-gcp-backup-identity.conf" <<'IDENTITY'
          [Service]
          Environment=FAAS_RCLONE_BIN=/usr/local/lib/faas/faas-rclone-backup-identity.py
          IDENTITY
            chmod 0644 "/etc/systemd/system/${unit}.d/90-gcp-backup-identity.conf"
          done
          # The standalone controller path does not run the postgres Ansible
          # role on every release. Converge its textfile collector here so the
          # PostgreSQL connection saturation alerts have live input.
          install -d -o postgres -g node_exporter -m 0755 \
            /var/lib/node_exporter/textfile_collector
          install -o root -g root -m 0755 \
            "$release_dir/host-config/faas-postgres-connection-metrics" \
            /usr/local/bin/faas-postgres-connection-metrics
          install -o root -g root -m 0644 \
            "$release_dir/host-config/faas-postgres-connection-metrics.service" \
            /etc/systemd/system/faas-postgres-connection-metrics.service
          install -o root -g root -m 0644 \
            "$release_dir/host-config/faas-postgres-connection-metrics.timer" \
            /etc/systemd/system/faas-postgres-connection-metrics.timer
          systemctl daemon-reload
          systemctl enable --now faas-postgres-connection-metrics.timer
          systemctl start faas-postgres-connection-metrics.service
          metrics_file=/var/lib/node_exporter/textfile_collector/faas_postgres_connections.prom
          test -s "$metrics_file"
          grep -q '^faas_postgres_client_connections [0-9][0-9]*$' "$metrics_file"
          grep -q '^faas_postgres_ordinary_connection_capacity [1-9][0-9]*$' "$metrics_file"

          # PostgreSQL does not inherit the systemd service environment, so
          # archive_command names the wrapper directly. ALTER SYSTEM gives an
          # atomic, cluster-version-independent update and pg_reload_conf
          # applies it without restarting the database.
          read -r -d '' archive_command <<'ARCHIVE_COMMAND' || true
          if test ! -f /var/lib/pgsql/archive/%f; then cp %p /var/lib/pgsql/archive/%f || exit 1; fi; if test -r /var/lib/pgsql/backup-rclone.conf && grep -Fqx '[offhostbox]' /var/lib/pgsql/backup-rclone.conf; then /usr/local/lib/faas/faas-rclone-backup-identity.py copyto /var/lib/pgsql/archive/%f "offhostbox:faas-pg-wal/%f" --config=/var/lib/pgsql/backup-rclone.conf --stats=0 --quiet && touch /var/lib/pgsql/archive/.offhost-last-success || echo "off-host WAL push failed for %f" >&2; fi; exit 0
          ARCHIVE_COMMAND
          runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 \
            --set=archive_command="$archive_command" <<'SQL'
          ALTER SYSTEM SET archive_command TO :'archive_command';
          SELECT pg_reload_conf();
          SQL
          archive_ready=0
          for _ in $(seq 1 10); do
            effective_archive_command="$(runuser -u postgres -- psql -X -A -t -c 'SHOW archive_command' | tr -d '\r\n')"
            if [[ "$effective_archive_command" == *'/usr/local/lib/faas/faas-rclone-backup-identity.py'* &&
                  "$effective_archive_command" == *'offhostbox:faas-pg-wal/%f'* ]]; then
              archive_ready=1
              break
            fi
            sleep 1
          done
          (( archive_ready == 1 )) || {
            echo "PostgreSQL did not activate the keyless backup identity command" >&2
            exit 1
          }
          REMOTE
          # Observe API readiness and a real canary app independently during
          # activation. The telemetry-heavy status route is diagnostic only.
          # Host hardening disables TCP forwarding. Run the observer on the
          # control plane so probes still traverse public DNS and Cloudflare.
          # The healthy baseline always runs: no release stops writers or
          # opens a maintenance window (ADR-202610171900, amendment 1).
          activation_script="$RUNNER_TEMP/controlplane-activate.sh"
          cat > "$activation_script" <<ACTIVATE
          set -euo pipefail
          ${release_dir}/bin/deployctl bundle-check-installed ${release_dir}
          if test ! -s /opt/faas/releases/sbom-baseline.json; then
            current_release=\$(readlink -f /opt/faas/current 2>/dev/null || true)
            # A per-unit release's directory is not named after a commit;
            # its release manifest names the full release it was built over.
            current_sha=\$(jq -r '.git_sha // empty' "\$current_release/release-manifest.json" 2>/dev/null || true)
            if test -n "\$current_sha" && test -s "/opt/faas/releases/\$current_sha/release.sbom.json"; then
              baseline_sha=\$current_sha
            else
              baseline_sha=${RELEASE_ID}
            fi
            ${release_dir}/bin/gregalectl release kgv rotate --git-sha "\$baseline_sha"
          fi
          ${release_dir}/bin/gregalectl release kgv verify --git-sha ${RELEASE_ID}
          ${release_dir}/bin/gregalectl fleet-seal migrate --fleet-key /etc/faas/secrets/fleet.age --legacy-host-dir /etc/faas/secrets --db-env /etc/faas/sealed.env --json
          verify_json=\$(${release_dir}/bin/gregalectl fleet-seal verify --fleet-key /etc/faas/secrets/fleet.age --host-key /etc/faas/secrets/host.age --db-env /etc/faas/sealed.env --metrics-file /var/lib/node_exporter/textfile_collector/faas_fleet_seal.prom --json)
          test "\$(printf '%s' "\$verify_json" | jq -r .fleet_recipient)" = "\$(tr -d '\r\n' </etc/faas/secrets/fleet.age.pub)"
          printf '%s\n' "\$verify_json"
          ${release_dir}/bin/deployctl deploy ${RELEASE_ID}
          touch "\$ROLLOUT_ACTIVATION_MARKER"
          install -d -o faas-apid -g faas -m 0770 /etc/faas/statuspage
          install -o root -g faas -m 0644 ${release_dir}/statuspage/index.html /etc/faas/statuspage/.index.html-${RELEASE_ID}
          mv -Tf /etc/faas/statuspage/.index.html-${RELEASE_ID} /etc/faas/statuspage/index.html
          install -o root -g faas -m 0644 ${release_dir}/host-config/dpa.md /etc/faas/.dpa.md-${RELEASE_ID}
          mv -Tf /etc/faas/.dpa.md-${RELEASE_ID} /etc/faas/dpa.md
          ln -sfn /opt/faas/current/bin/gregalectl /usr/local/bin/.gregalectl-${RELEASE_ID}
          mv -Tf /usr/local/bin/.gregalectl-${RELEASE_ID} /usr/local/bin/gregalectl
          ACTIVATE
          ROLLOUT_BASELINE_SAMPLE_COUNT=3 \
            scripts/ci/observe_remote_rollout.sh \
            "root@${{ env.CP_HOST }}" ~/.ssh/deploy_key "$activation_script"

      - name: Upload control-plane rollout probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-rollout-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gregale-rollout-availability-${{ github.run_id }}-${{ github.run_attempt }}-*.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify PostgreSQL backup namespace contract
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" \
            "/opt/faas/current/host-config/faas-pg-backup-contract-preflight.sh"

      - name: Verify canonical storage credential source
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          assert_process_credential() {
            unit="$1"
            env_file="$2"
            file_user="$(sed -n 's/^FAAS_OCI_USERNAME=//p' "$env_file" | tail -1)"
            file_password="$(sed -n 's/^FAAS_OCI_PASSWORD=//p' "$env_file" | tail -1)"
            [[ -n "$file_user" && -n "$file_password" ]]
            pid="$(systemctl show "$unit" -p MainPID --value)"
            [[ "$pid" =~ ^[1-9][0-9]*$ ]]
            process_user="$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^FAAS_OCI_USERNAME=//p' | tail -1)"
            process_password="$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^FAAS_OCI_PASSWORD=//p' | tail -1)"
            [[ "$process_user" == "$file_user" && "$process_password" == "$file_password" ]] || {
              echo "$unit is not using $env_file credentials" >&2
              exit 1
            }
          }
          # Registry credentials exist only when OCI is the backend or the
          # migration fallback. A GCS-only fleet authenticates with the VM
          # identity (ADC) and has no FAAS_OCI_* values to compare.
          if grep -Eq '^FAAS_STORAGE_(FALLBACK_)?BACKEND=oci$' /etc/faas/storage.env; then
            assert_process_credential faas-apid /etc/faas/apid-storage.env
            assert_process_credential faas-schedd /etc/faas/storage.env
          else
            echo "storage.env selects GCS without an OCI fallback; no registry credentials to verify"
          fi
          sudo -u faas-apid /opt/faas/current/bin/gregalectl artifact lifecycle-check \
            --env-file /etc/faas/storage.env \
            --lifecycle-env-file /etc/faas/apid-storage.env \
            --json
          REMOTE

      - name: Converge Prometheus config and rules
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${{ env.CP_HOST }}" "bash -s -- '${RELEASE_ID}'" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          source_dir="/opt/faas/releases/${release_id}/prometheus"
          config_dir=/etc/prometheus
          # Every rule file prometheus.yml.j2 lists; promtool check config
          # fails on any it cannot find.
          files=(prometheus.yml faas.rules.yml bridge.rules.yml pg_backup.rules.yml data_repair.rules.yml data_placement.yaml)

          test -d "$source_dir"
          promtool check rules \
            "$source_dir/faas.rules.yml" \
            "$source_dir/bridge.rules.yml" \
            "$source_dir/pg_backup.rules.yml" \
            "$source_dir/data_repair.rules.yml" \
            "$source_dir/data_placement.yaml"

          validation_dir="$(mktemp -d)"
          trap 'rm -r "$validation_dir"' EXIT
          for file in "${files[@]}"; do
            cp "$source_dir/$file" "$validation_dir/$file"
          done
          sed "s#/etc/prometheus/#${validation_dir}/#g" \
            "$source_dir/prometheus.yml" > "$validation_dir/prometheus.checked.yml"
          promtool check config "$validation_dir/prometheus.checked.yml"

          backup_dir="$config_dir/.release-backups/${release_id}"
          install -d -m 0750 "$backup_dir"
          for file in "${files[@]}"; do
            if [[ -e "$config_dir/$file" ]]; then
              cp -a "$config_dir/$file" "$backup_dir/$file"
            else
              touch "$backup_dir/$file.absent"
            fi
          done

          restore_prometheus() {
            for file in "${files[@]}"; do
              if [[ -e "$backup_dir/$file.absent" ]]; then
                rm -f "$config_dir/$file"
              else
                cp -a "$backup_dir/$file" "$config_dir/$file"
              fi
            done
            systemctl reload prometheus || true
          }

          install_failed=0
          for file in "${files[@]}"; do
            install -o prometheus -g prometheus -m 0644 \
              "$source_dir/$file" "$config_dir/$file" || install_failed=1
          done
          if (( install_failed != 0 )); then
            restore_prometheus
            exit 1
          fi
          if ! promtool check config "$config_dir/prometheus.yml"; then
            restore_prometheus
            exit 1
          fi
          if ! systemctl reload prometheus; then
            restore_prometheus
            exit 1
          fi

          # A platform rollout deliberately updates the control plane before
          # compute. During that mixed-version window, compute-only scrape
          # jobs can be down because their endpoint or firewall change has not
          # landed yet. Gate every control-plane target here; cd-platform runs
          # the complete target and metering gate after cd-compute succeeds.
          targets_healthy=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9095/api/v1/targets |
              python3 -c 'import json,sys; compute={"gatewayd-internal","vmmd","imaged","builderd","node-compute","realtimed","schedd-compute","promtail-compute"}; targets=json.load(sys.stdin)["data"]["activeTargets"]; control=[t for t in targets if t.get("labels",{}).get("job") not in compute]; raise SystemExit(0 if control and all(t.get("health") == "up" for t in control) else 1)'; then
              targets_healthy=1
              break
            fi
            sleep 3
          done
          if (( targets_healthy == 0 )); then
            curl -fsS http://127.0.0.1:9095/api/v1/targets || true
            restore_prometheus
            exit 1
          fi

          status_body="$(mktemp)"
          status_valid=0
          for _ in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/status/slo.json -o "$status_body" &&
              # An idle window has no wake sample and correctly reports null.
              # API/build metrics are always required; a reported wake value
              # must be numeric and finite.
              python3 -c 'import json,math,sys; d=json.load(open(sys.argv[1])); required=[d["api_availability_pct"],d["build_success_pct"]]; wake=d["wake_p95_ms"]; valid=lambda v:isinstance(v,(int,float)) and math.isfinite(v); raise SystemExit(0 if all(valid(v) for v in required) and (wake is None or valid(wake)) else 1)' "$status_body"; then
              status_valid=1
              break
            fi
            sleep 3
          done
          if (( status_valid == 0 )); then
            cat "$status_body" || true
            exit 1
          fi
          REMOTE

      - name: Restart configured optional S3 gateway
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} "bash -s -- '${RELEASE_ID}'" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          registry=/etc/faas/object-storage.json
          apid_dropin=/etc/systemd/system/faas-apid.service.d/99-faas-object-storage.conf
          source_unit="/opt/faas/releases/${release_id}/optional-systemd/faas-s3-gatewayd.service"
          installed_unit=/etc/systemd/system/faas-s3-gatewayd.service

          # The Ansible role creates both markers only for an explicitly
          # enabled provider. A merely disabled unit is not enough evidence to
          # turn storage on during an unrelated platform release.
          if [[ ! -s "$registry" || ! -s "$apid_dropin" ]]; then
            echo "faas-s3-gatewayd is not configured; optional object storage remains unchanged"
            exit 0
          fi
          test -f "$source_unit"

          # deployctl releases before this fix treated the optional daemon as
          # opposite-role residue, replacing its unit with /dev/null. Recover
          # that exact state but refuse to overwrite any unexpected symlink or
          # non-regular operator-owned path.
          if [[ -L "$installed_unit" ]]; then
            [[ "$(readlink "$installed_unit")" == /dev/null ]] || {
              echo "unexpected faas-s3-gatewayd unit symlink" >&2
              exit 1
            }
            rm -f -- "$installed_unit"
          elif [[ -e "$installed_unit" && ! -f "$installed_unit" ]]; then
            echo "faas-s3-gatewayd unit path is not a regular file" >&2
            exit 1
          fi
          staged_unit="${installed_unit}.new-${release_id}"
          trap 'rm -f -- "$staged_unit"' EXIT
          install -o root -g root -m 0644 "$source_unit" "$staged_unit"
          mv -Tf "$staged_unit" "$installed_unit"
          trap - EXIT

          systemctl daemon-reload
          systemctl unmask faas-s3-gatewayd.service
          systemctl enable faas-s3-gatewayd.service
          systemctl restart faas-s3-gatewayd.service
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9096/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          journalctl -u faas-s3-gatewayd.service -n 100 --no-pager >&2
          exit 1
          REMOTE

      - name: Restart configured optional live-query hub
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} "bash -s -- '${RELEASE_ID}'" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          hub_dropin=/etc/systemd/system/faas-livequeryd.service.d/50-faas-livequeryd.conf
          source_unit="/opt/faas/releases/${release_id}/optional-systemd/faas-livequeryd.service"
          installed_unit=/etc/systemd/system/faas-livequeryd.service

          # The livequeryd_service role writes the hub drop-in only for an
          # enabled database (ADR-20261016151947). Without it a release leaves
          # live queries off.
          if [[ ! -s "$hub_dropin" ]]; then
            echo "faas-livequeryd is not configured; live queries remain unchanged"
            exit 0
          fi
          test -f "$source_unit"
          if [[ -L "$installed_unit" || ( -e "$installed_unit" && ! -f "$installed_unit" ) ]]; then
            echo "faas-livequeryd unit path is not a regular file" >&2
            exit 1
          fi
          staged_unit="${installed_unit}.new-${release_id}"
          trap 'rm -f -- "$staged_unit"' EXIT
          install -o root -g root -m 0644 "$source_unit" "$staged_unit"
          mv -Tf "$staged_unit" "$installed_unit"
          trap - EXIT

          systemctl daemon-reload
          systemctl enable faas-livequeryd.service
          systemctl restart faas-livequeryd.service
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9471/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          journalctl -u faas-livequeryd.service -n 100 --no-pager >&2
          exit 1
          REMOTE

      - name: Accept activated release SBOM baseline
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            root@${{ env.CP_HOST }} \
            "/opt/faas/current/bin/gregalectl release kgv rotate --git-sha '${RELEASE_ID}'"

      # Legacy mutable upload/restart steps removed; deployment is handled by the immutable release controller above.

  # Host configuration (docs/adr/20261018133100-host-configuration-lane.md).
  # When the unit release's range changed a control-plane host role, this
  # converges the roles whose content hash differs from the host's record
  # before deploy-units restarts anything: the ADR-580 path
  # (gregalectl deploy converge-control-plane, from the signed release, at
  # the release commit) with --roles, FaaS daemon handlers deferred. Then
  # `deployctl restart-changed` restarts, one at a time to readiness, only
  # the daemons whose start inputs the roles changed, under the public-path
  # observer, and the SLO gate holds the control plane. A failure anywhere
  # converges the same roles back to the record's commit (or the host's full
  # release) and restarts what that changes. The record and the contract
  # are written only after the gate passes.
  converge-host-config:
    name: Converge changed control-plane host roles
    environment: ${{ inputs.deploy_environment }}
    runs-on: ${{ inputs.hosted_runner && 'ubuntu-latest' || fromJSON(inputs.deploy_environment == 'production-us' && '["self-hosted","linux","faas-fleet-us"]' || '["self-hosted","linux","faas-fleet"]') }}
    if: github.repository == 'poyrazK/faas' && inputs.units_run_id != '' && inputs.units_lane == 'control-plane'
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cd-cp-units-${{ inputs.deploy_environment }}
      cancel-in-progress: false
    # The first run on a host has no role record and converges every role,
    # which took about 30 minutes on production-us through ADR-580.
    timeout-minutes: 75
    env:
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
      CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
      SLO_GATE: ${{ inputs.slo_gate }}
    steps:
      - name: Install pinned cosign verifier
        env:
          COSIGN_VERSION: "2.4.1"
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"
        run: |
          set -euo pipefail
          echo "TUF_ROOT=$RUNNER_TEMP/sigstore-tuf" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-tools"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/release-tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/release-tools/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/release-tools/cosign"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Download unit release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gregale-unit-release
          run-id: ${{ inputs.units_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gregale-units

      # The verifier comes from the workflow's own ref; the release commit's
      # checkout below is only trusted once its signature verified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: workflow-src
          sparse-checkout: scripts/ci/verify_unit_release.sh
          sparse-checkout-cone-mode: false

      - name: Verify unit release
        id: verify
        run: |
          set -euo pipefail
          git_sha="$(workflow-src/scripts/ci/verify_unit_release.sh "$RUNNER_TEMP/gregale-units")"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "UNITS_DIR=$RUNNER_TEMP/gregale-units/unpacked" >> "$GITHUB_ENV"
          echo "UNITS_SHA=$git_sha" >> "$GITHUB_ENV"
          if jq -e '.host_config.version' "$RUNNER_TEMP/gregale-units/unpacked/units-manifest.json" >/dev/null; then
            echo "carries=true" >> "$GITHUB_OUTPUT"
          else
            echo "carries=false" >> "$GITHUB_OUTPUT"
            echo "The unit release changed no control-plane host role." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.verify.outputs.carries == 'true'
        with:
          # The roles converge from the unit release's commit; the planner's
          # ancestry and N±1 checks need main's history and the release tags,
          # not every branch (scripts/ci/fetch_release_history.sh).
          ref: ${{ steps.verify.outputs.git_sha }}
          filter: blob:none

      - name: Fetch main's history, release tags and the base release's roles
        if: steps.verify.outputs.carries == 'true'
        # plan_host_config.py hashes deploy/ at the base release.
        run: scripts/ci/fetch_release_history.sh --prefetch-deploy

      - name: Install pinned Ansible toolchain
        if: steps.verify.outputs.carries == 'true'
        run: |
          set -euo pipefail
          toolchain="$(scripts/ci/ensure-ansible-toolchain.sh 'ansible-core==2.21.2' deploy/ansible/requirements.yml)"
          venv_bin="$(sed -n 's/^ANSIBLE_VENV_BIN=//p' <<<"$toolchain")"
          collections="$(sed -n 's/^ANSIBLE_COLLECTIONS_PATH=//p' <<<"$toolchain")"
          [[ -x "$venv_bin/ansible-playbook" && -d "$collections" ]]
          echo "$venv_bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=$collections" >> "$GITHUB_ENV"

      - name: Set up SSH
        if: steps.verify.outputs.carries == 'true'
        env:
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ env.CP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          [[ -n "${COMPUTE_KNOWN_HOSTS:-}" ]] || {
            echo "::error::COMPUTE_KNOWN_HOSTS is required to verify the control-plane host key" >&2
            exit 1
          }
          scanned="$(ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$CP_HOST" 2>/dev/null || true)"
          pinned=0
          while read -r _ key_type key; do
            [[ -n "${key:-}" ]] || continue
            if awk -v t="$key_type" -v k="$key" '!/^#/ { for (i = 1; i < NF; i++) if ($i == t && $(i + 1) == k) found = 1 } END { exit !found }' <<<"$COMPUTE_KNOWN_HOSTS"; then
              printf '%s %s %s\n' "$CP_HOST" "$key_type" "$key" >> ~/.ssh/known_hosts
              pinned=1
            fi
          done <<<"$scanned"
          [[ $pinned == 1 ]] || {
            echo "::error::$CP_HOST presented no host key listed in COMPUTE_KNOWN_HOSTS" >&2
            exit 1
          }
          chmod 600 ~/.ssh/known_hosts
          {
            echo "UNIT_SSH_TARGET=root@${CP_HOST}"
            echo "UNIT_SSH_KEY=$HOME/.ssh/deploy_key"
            echo "UNIT_SSH_KNOWN_HOSTS=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Plan the host configuration
        id: plan
        if: steps.verify.outputs.carries == 'true'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/host-config"
          install -d -m 0700 "$work"
          echo "HOST_CONFIG_WORK=$work" >> "$GITHUB_ENV"
          scripts/ci/unit_deploy.sh host-state > "$work/host-state.json"
          jq 'del(.record.roles)' "$work/host-state.json"
          # N±1, as for the units: the release CI checked these roles with.
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$UNITS_SHA")"
          previous="$(git rev-parse "${previous_tag}^{commit}")"
          python3 scripts/ci/plan_host_config.py \
            --units-manifest "$UNITS_DIR/units-manifest.json" \
            --host-state "$work/host-state.json" \
            --previous-release "$previous" \
            --out "$work"
          plan="$work/plan.json"
          {
            echo "action=$(jq -r .action "$plan")"
            echo "roles=$(jq -r '.roles | join(",")' "$plan")"
            echo "previous=$(jq -r .previous "$plan")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Host configuration \`${UNITS_SHA:0:12}\` on the control plane"
            echo
            echo "Plan: **$(jq -r .action "$plan")** ($(jq -r .reason "$plan")): $(jq -r '.roles | join(", ") | if . == "" then "none" else . end' "$plan")."
            echo "Rollback target: \`$(jq -r '.previous[0:12]' "$plan")\`."
            guarded="$(jq -r '.guarded | join(", ")' "$plan")"
            [[ -z "$guarded" ]] || echo "Converged under the stateful-restart guard (a change that needs a PostgreSQL or pgbouncer restart fails the run): ${guarded}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Converge the changed roles
        id: converge
        if: steps.plan.outputs.action == 'converge'
        env:
          CP_ANSIBLE_VARS_B64: ${{ secrets.CP_ANSIBLE_VARS_B64 }}
          SEAL_DOMAIN_OUTBOUND_AGE_KEY: ${{ secrets.SEAL_DOMAIN_OUTBOUND_AGE_KEY }}
          SEAL_DOMAIN_OUTBOUND_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_OUTBOUND_AGE_RECIPIENT }}
          SEAL_DOMAIN_SOURCE_AGE_KEY: ${{ secrets.SEAL_DOMAIN_SOURCE_AGE_KEY }}
          SEAL_DOMAIN_SOURCE_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_SOURCE_AGE_RECIPIENT }}
          SEAL_DOMAIN_RUNTIME_AGE_KEY: ${{ secrets.SEAL_DOMAIN_RUNTIME_AGE_KEY }}
          SEAL_DOMAIN_RUNTIME_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_RUNTIME_AGE_RECIPIENT }}
          SEAL_DOMAIN_BUILD_AGE_KEY: ${{ secrets.SEAL_DOMAIN_BUILD_AGE_KEY }}
          SEAL_DOMAIN_BUILD_AGE_RECIPIENT: ${{ secrets.SEAL_DOMAIN_BUILD_AGE_RECIPIENT }}
          COMPUTE_SSH_KEY: ${{ secrets.COMPUTE_SSH_KEY }}
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          HOSTED_RUNNER: ${{ inputs.hosted_runner }}
          ROLES: ${{ steps.plan.outputs.roles }}
        run: |
          set -euo pipefail
          # ADR-580: a GitHub-hosted runner cannot resolve the fleet's
          # private names. Skipping would let the units deploy over roles
          # this release changed, so stop instead.
          if [[ "$HOSTED_RUNNER" == true ]]; then
            echo "::error::host configuration converges only from the fleet runner; rerun without hosted_runner" >&2
            exit 1
          fi
          for name in CP_ANSIBLE_VARS_B64 COMPUTE_SSH_KEY COMPUTE_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not set in the ${DEPLOY_ENVIRONMENT} environment; host configuration needs it (docs/adr/580-control-plane-convergence-in-cd.md)" >&2
              exit 1
            fi
          done
          work="$HOST_CONFIG_WORK"
          printf '%s' "$CP_ANSIBLE_VARS_B64" | base64 --decode > "$work/vars.yml"
          # ADR 20261022111812: the seal_domains role stages the domain keys
          # held as SEAL_DOMAIN_* secrets; the write modes stay in the vars.
          scripts/ci/seal_domain_vars.sh control-plane "$work/seal-domains" "$work/vars.yml"
          printf '%s\n' "$COMPUTE_SSH_KEY" > "$work/ssh-key"
          printf '%s\n' "$COMPUTE_KNOWN_HOSTS" > "$work/known_hosts"
          chmod 0600 "$work/vars.yml" "$work/ssh-key" "$work/known_hosts"
          [[ -d "${ANSIBLE_COLLECTIONS_PATH:-}/ansible_collections/community/postgresql" ]] || {
            echo "::error::pinned Ansible collections are missing from ANSIBLE_COLLECTIONS_PATH" >&2
            exit 1
          }
          # The fleet topology is the full release's: its signed production
          # manifest, read from the host and checked against the release
          # manifest's hash.
          scripts/ci/unit_deploy.sh host-manifest "$work/host-state.json" "$work/production-manifest.yaml"
          remote="$(scripts/ci/unit_deploy.sh host-stage "$UNITS_DIR/tools/deployctl")"
          # The SLO gate ignores alerts that were already firing before this.
          {
            echo "REMOTE_STAGE=$remote"
            echo "DEPLOYED_AT=$(scripts/ci/unit_deploy.sh now)"
            echo "HOST_CONFIG_STARTED=true"
          } >> "$GITHUB_ENV"
          # The signed release's gregalectl, built at the release commit.
          "$UNITS_DIR/tools/gregalectl" deploy converge-control-plane \
            --manifest-file "$work/production-manifest.yaml" \
            --ssh-known-hosts-file "$work/known_hosts" \
            --ssh-key "$work/ssh-key" \
            --ansible-vars-file "$work/vars.yml" \
            --repo-root "$GITHUB_WORKSPACE" \
            --roles "$ROLES" \
            --json > "$work/converge.json"
          jq . "$work/converge.json"

      - name: Restart the daemons the roles changed
        if: steps.plan.outputs.action == 'converge'
        run: |
          set -euo pipefail
          script="$HOST_CONFIG_WORK/restart.sh"
          scripts/ci/unit_deploy.sh host-restart-script "$REMOTE_STAGE" "$script"
          ROLLOUT_BASELINE_SAMPLE_COUNT=3 \
            scripts/ci/observe_remote_rollout.sh \
            "root@${{ env.CP_HOST }}" ~/.ssh/deploy_key "$script"
          scripts/ci/unit_deploy.sh host-restarted "$REMOTE_STAGE" > "$HOST_CONFIG_WORK/restarted.json"
          echo "Restarted: $(jq -r '[.restarted[]? | "\(.service) (\(.reason))"] | join(", ") | if . == "" then "none" else . end' "$HOST_CONFIG_WORK/restarted.json")." >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the control plane on the SLO gate
        if: steps.plan.outputs.action == 'converge'
        run: |
          set -euo pipefail
          python3 scripts/ci/plan_host_config.py --gate-from "$HOST_CONFIG_WORK/restarted.json" --out "$HOST_CONFIG_WORK"
          scripts/ci/unit_deploy.sh gate "$HOST_CONFIG_WORK/gate.json" "$DEPLOYED_AT" "$SLO_GATE"

      - name: Record the converged roles
        if: steps.plan.outputs.action == 'converge'
        run: |
          set -euo pipefail
          work="$HOST_CONFIG_WORK"
          jq --arg env "$(jq -r .environment_sha256 "$work/converge.json")" '.environment = $env' \
            "$work/record.json" > "$work/record-final.json"
          scripts/ci/unit_deploy.sh host-record "$work/record-final.json" "$(jq -r .contract_sha256 "$work/converge.json")"
          echo "Recorded host configuration \`${UNITS_SHA:0:12}\`." >> "$GITHUB_STEP_SUMMARY"

      # The record still names the content the host had before this run, so
      # converging the same roles at that commit puts them back.
      - name: Converge the roles back after a failure
        if: failure() && env.HOST_CONFIG_STARTED == 'true'
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          ROLES: ${{ steps.plan.outputs.roles }}
        run: |
          set -euo pipefail
          work="$HOST_CONFIG_WORK"
          [[ "$PREVIOUS" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$work/previous" "$PREVIOUS"
          # A role this release added has no earlier content to go back to.
          back="$(python3 scripts/ci/host_roles.py hashes --commit "$PREVIOUS" \
            | jq -r --arg roles "$ROLES" '[.order[] | select(. as $r | $roles | split(",") | index($r))] | join(",")')"
          if [[ -n "$back" ]]; then
            "$UNITS_DIR/tools/gregalectl" deploy converge-control-plane \
              --manifest-file "$work/production-manifest.yaml" \
              --ssh-known-hosts-file "$work/known_hosts" \
              --ssh-key "$work/ssh-key" \
              --ansible-vars-file "$work/vars.yml" \
              --repo-root "$work/previous" \
              --roles "$back" \
              --json
          fi
          script="$work/restart-back.sh"
          scripts/ci/unit_deploy.sh host-restart-script "$REMOTE_STAGE" "$script"
          scripts/ci/unit_deploy.sh run "$script"
          echo "::error::converged ${back:-no role} back to ${PREVIOUS:0:12} after a failed host-configuration step" >&2
          exit 1

      - name: Upload host-config rollout probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-host-config-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gregale-rollout-availability-${{ github.run_id }}-${{ github.run_attempt }}-*.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove host-config secrets and stage
        if: always()
        run: |
          rm -rf -- "${HOST_CONFIG_WORK:-/nonexistent}/vars.yml" "${HOST_CONFIG_WORK:-/nonexistent}/ssh-key" \
            "${HOST_CONFIG_WORK:-/nonexistent}/known_hosts"
          if [[ -n "${REMOTE_STAGE:-}" ]]; then scripts/ci/unit_deploy.sh cleanup "$REMOTE_STAGE"; fi

  # Per-unit releases (docs/adr/1650-per-unit-control-plane-releases.md).
  # The unit release carries every daemon of an eligible lane changed since
  # its base full release, which must be the previous full release (N±1) and
  # what the host runs (or earlier unit releases over it). The plan restarts
  # only daemons of units_lane whose unit version moved, then holds them on
  # the SLO gate (canary, the full gate, unless the edge lane passes
  # slo_gate=follower because a compute node went first) and rolls them back
  # to the previous binaries on a breach.
  # The data step (docs/adr/20261018084150-unit-lane-expand-migrations.md):
  # when the range added migrations, every one declared expand and passed
  # the lane verdict, and the control-plane lane's overlay carries the
  # release commit's bin/migrate, which `deployctl deploy` runs before it
  # activates or restarts anything. A failed migration fails the activation
  # step, so nothing restarts and no SLO gate runs. Migrations are never
  # rolled back: an expand migration is one the previous binaries run with.
  # Everything else, including contract migrations, units, roles and compute
  # daemons, stays as the base release left it. cd-edge-units.yml calls this
  # job with units_lane=edge for the control plane's own gateway.
  deploy-units:
    name: Deploy unit release to Control Plane Host
    environment: ${{ inputs.deploy_environment }}
    runs-on: ${{ inputs.hosted_runner && 'ubuntu-latest' || fromJSON(inputs.deploy_environment == 'production-us' && '["self-hosted","linux","faas-fleet-us"]' || '["self-hosted","linux","faas-fleet"]') }}
    # Host configuration first (ADR 20261018133100); the edge lane skips it.
    needs: [converge-host-config]
    if: >-
      !cancelled() && github.repository == 'poyrazK/faas' && inputs.units_run_id != ''
      && (needs.converge-host-config.result == 'success' || needs.converge-host-config.result == 'skipped')
    permissions:
      contents: read
      # Download the unit release artifact from its release-units.yml run.
      actions: read
    concurrency:
      group: cd-cp-units-${{ inputs.deploy_environment }}
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
      CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
      EXPECT_UNITS: ${{ inputs.units }}
      UNITS_LANE: ${{ inputs.units_lane }}
      SLO_GATE: ${{ inputs.slo_gate }}
    steps:
      - name: Require a unit release, not a tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ -z "$RELEASE_TAG" ]] || {
            echo "::error::set either release_tag or units_run_id, not both" >&2
            exit 1
          }
          [[ "$UNITS_LANE" == control-plane || "$UNITS_LANE" == edge ]] || {
            echo "::error::units_lane must be control-plane or edge" >&2
            exit 1
          }
          [[ "$SLO_GATE" == canary || "$SLO_GATE" == follower ]] || {
            echo "::error::slo_gate must be canary or follower" >&2
            exit 1
          }

      - name: Install pinned cosign verifier
        env:
          COSIGN_VERSION: "2.4.1"
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"
        run: |
          set -euo pipefail
          echo "TUF_ROOT=$RUNNER_TEMP/sigstore-tuf" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-tools"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/release-tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/release-tools/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/release-tools/cosign"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Download unit release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gregale-unit-release
          run-id: ${{ inputs.units_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gregale-units

      # The verifier comes from the workflow's own ref; the release commit's
      # checkout below is only trusted once its signature verified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: workflow-src
          sparse-checkout: scripts/ci/verify_unit_release.sh
          sparse-checkout-cone-mode: false

      - name: Verify unit release
        id: verify
        run: |
          set -euo pipefail
          git_sha="$(workflow-src/scripts/ci/verify_unit_release.sh "$RUNNER_TEMP/gregale-units")"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "UNITS_DIR=$RUNNER_TEMP/gregale-units/unpacked" >> "$GITHUB_ENV"
          echo "UNITS_SHA=$git_sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The planner and deployctl come from the unit release's commit;
          # the planner's ancestry and N±1 checks need main's history and the
          # release tags, not every branch (scripts/ci/fetch_release_history.sh).
          ref: ${{ steps.verify.outputs.git_sha }}
          filter: blob:none

      - name: Fetch main's history and release tags
        run: scripts/ci/fetch_release_history.sh

      - name: Set up SSH
        env:
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ env.CP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          [[ -n "${COMPUTE_KNOWN_HOSTS:-}" ]] || {
            echo "::error::COMPUTE_KNOWN_HOSTS is required to verify the control-plane host key" >&2
            exit 1
          }
          scanned="$(ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$CP_HOST" 2>/dev/null || true)"
          pinned=0
          while read -r _ key_type key; do
            [[ -n "${key:-}" ]] || continue
            if awk -v t="$key_type" -v k="$key" '!/^#/ { for (i = 1; i < NF; i++) if ($i == t && $(i + 1) == k) found = 1 } END { exit !found }' <<<"$COMPUTE_KNOWN_HOSTS"; then
              printf '%s %s %s\n' "$CP_HOST" "$key_type" "$key" >> ~/.ssh/known_hosts
              pinned=1
            fi
          done <<<"$scanned"
          [[ $pinned == 1 ]] || {
            echo "::error::$CP_HOST presented no host key listed in COMPUTE_KNOWN_HOSTS" >&2
            exit 1
          }
          chmod 600 ~/.ssh/known_hosts
          {
            echo "UNIT_SSH_TARGET=root@${CP_HOST}"
            echo "UNIT_SSH_KEY=$HOME/.ssh/deploy_key"
            echo "UNIT_SSH_KNOWN_HOSTS=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Plan the unit deploy
        id: plan
        run: |
          set -euo pipefail
          scripts/ci/unit_deploy.sh state > "$RUNNER_TEMP/host-state.json"
          jq . "$RUNNER_TEMP/host-state.json"
          # N±1: the unit release must be built over the newest full release
          # before its commit, the release CI checked these units against.
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$UNITS_SHA")"
          previous="$(git rev-parse "${previous_tag}^{commit}")"
          out="$RUNNER_TEMP/unit-plan"
          python3 scripts/ci/plan_unit_deploy.py \
            --units-manifest "$UNITS_DIR/units-manifest.json" \
            --host-state "$RUNNER_TEMP/host-state.json" \
            --lane "$UNITS_LANE" --host-role control-plane \
            --previous-release "$previous" \
            --expect-units "$EXPECT_UNITS" \
            --out "$out"
          plan="$out/plan.json"
          action="$(jq -r .action "$plan")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "UNIT_PLAN=$plan" >> "$GITHUB_ENV"
          {
            echo "## Unit release \`${UNITS_SHA:0:12}\` ($UNITS_LANE lane) on the control plane"
            echo
            echo "Plan: **${action}** over \`$(jq -r .current "$RUNNER_TEMP/host-state.json")\` (previous release \`${previous_tag}\`)."
            echo "Restart: $(jq -r '.only | join(", ") | if . == "" then "none" else . end' "$plan")."
            kept="$(jq -r '.kept // [] | join(", ")' "$plan")"
            [[ -z "$kept" ]] || echo "Already running this release's code, not restarted: ${kept}."
            migrations="$(jq -r '.migrations // [] | length' "$plan")"
            [[ "$migrations" == 0 ]] || echo "Migrations applied first: ${migrations} ($(jq -r '.data.version' "$UNITS_DIR/units-manifest.json")), lane-eligible expand only."
            pending="$(jq -r '[.pending[][]] | join(", ")' "$UNITS_DIR/units-manifest.json")"
            [[ -z "$pending" ]] || echo "Waiting for the next full release: ${pending}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the unit release on the control plane
        if: steps.plan.outputs.action == 'deploy' || steps.plan.outputs.action == 'converge'
        run: |
          set -euo pipefail
          # deployctl rides in the signed unit release (tools/deployctl).
          remote="$(scripts/ci/unit_deploy.sh stage "$UNIT_PLAN" "$UNITS_DIR" "$UNITS_DIR/tools/deployctl")"
          echo "REMOTE_STAGE=$remote" >> "$GITHUB_ENV"

      # The post-deploy watch (docs/adr/20261020214632-automatic-unit-deploy-
      # safety-rails.md): record this release as unwatched over the host's
      # known-good one and make this run the watch's owner before anything is
      # activated. Exit 3: the host already holds the most unwatched releases
      # allowed (release-units' preflight waits for that).
      - name: Take over the post-deploy watch
        id: watch_open
        if: steps.plan.outputs.action == 'deploy' || steps.plan.outputs.action == 'converge'
        run: scripts/ci/unit_deploy.sh watch-open "$UNIT_PLAN" control-plane

      - name: Activate the unit release
        id: activate
        if: steps.plan.outputs.action == 'deploy' || steps.plan.outputs.action == 'converge'
        run: |
          set -euo pipefail
          activation_script="$RUNNER_TEMP/unit-activate.sh"
          scripts/ci/unit_deploy.sh script "$UNIT_PLAN" "$REMOTE_STAGE" "$activation_script"
          cat "$activation_script"
          # The SLO gate ignores alerts that were already firing before this.
          echo "DEPLOYED_AT=$(scripts/ci/unit_deploy.sh now)" >> "$GITHUB_ENV"
          ROLLOUT_BASELINE_SAMPLE_COUNT=3 \
            scripts/ci/observe_remote_rollout.sh \
            "root@${{ env.CP_HOST }}" ~/.ssh/deploy_key "$activation_script"

      - name: Hold the units on the SLO gate
        if: steps.plan.outputs.action == 'deploy' || steps.plan.outputs.action == 'converge'
        run: |
          set -euo pipefail
          # 0 promotes. 1 (an SLO breached) and 3 (no evidence) roll the
          # units back to the release that was active before them.
          status=0
          scripts/ci/unit_deploy.sh gate "$UNIT_PLAN" "$DEPLOYED_AT" "$SLO_GATE" || status=$?
          if (( status != 0 )); then
            scripts/ci/unit_deploy.sh rollback "$UNIT_PLAN" "$REMOTE_STAGE"
            echo "::error::rolled $(jq -r '.units | join(", ")' "$UNIT_PLAN") back after the SLO gate (exit $status)" >&2
            exit 1
          fi

      # A failed activation or gate put the host back on the release it ran
      # before: the watch record forgets what this deploy added.
      - name: Return the host to the watch record
        if: failure() && steps.watch_open.outcome == 'success'
        run: scripts/ci/unit_deploy.sh watch-revert control-plane

      - name: Upload unit rollout probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-unit-rollout-probes-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.units_lane }}
          path: ${{ runner.temp }}/gregale-rollout-availability-${{ github.run_id }}-${{ github.run_attempt }}-*.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the staged unit release
        if: always() && env.REMOTE_STAGE != ''
        run: scripts/ci/unit_deploy.sh cleanup "$REMOTE_STAGE"
