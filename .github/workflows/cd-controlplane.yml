# cd-controlplane.yml — deploy FaaS control plane to host on push to main.
#
# Prerequisites (GitHub repo Settings → Secrets):
#   CP_SSH_KEY (or DO_SSH_KEY) — ed25519 private key (generated by bootstrap.sh)
#   CP_HOST    (or DO_HOST)    — Control Plane host public IPv4
#
# What it does:
#   1. Cross-compiles all daemons for linux/amd64
#   2. SCPs binaries + migrations to the Control Plane host
#   3. Runs pending DB migrations
#   4. Restarts all FaaS services
#
# The existing ci.yml must pass first (needs: [test] from ci.yml).

name: cd-controlplane

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger for debugging

concurrency:
  group: cd-cp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Control Plane Host
    runs-on: ubuntu-latest
    env:
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
      CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
    # Only deploy if the CI workflow's test job succeeded.
    # If ci.yml doesn't exist yet or the test job name differs, remove this.
    # needs: test
    if: github.repository == 'poyrazK/faas'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile for linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 make build
          GOOS=linux GOARCH=amd64 go build -o bin/migrate ./cmd/migrate

      - name: Generate CycloneDX SBOM
        # issue #299: emit a CycloneDX 1.5 SBOM covering the Go
        # binaries the deploy will ship. The artifact is uploaded
        # as `SBOM.json` and (on tag) attached to the GitHub
        # release page so customers have a verifiable supply-chain
        # artifact. Source-version is the merge commit SHA so the
        # SBOM ties back to the exact git revision on disk.
        #
        # SYFT 1.49.0 from the github release tarball — the previous
        # `go install github.com/anchore/syft/cmd/syft@v1.0.0` step
        # stopped compiling on Go 1.25 because v1.0.0's go.mod carries
        # `replace` directives that newer Go rejects ("must not contain
        # directives that would cause it to be interpreted differently
        # than if it were the main module"). Same curl+sha256+tar
        # pattern as the vacuum binary download — see memory
        # `ci-vacuum-binary-download.md`.
        #
        # Source type is implicit from the `dir:` scheme; syft 1.x dropped
        # the explicit `--source-type directory` flag. Carrying it forward
        # fails the job with "unknown flag: --source-type" — pinned here
        # so a future syft bump doesn't reintroduce the trap.
        env:
          SYFT_VERSION: "1.49.0"
          SYFT_SHA256: "7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          install -m 0755 /tmp/syft /usr/local/bin/syft
          syft dir:. -o cyclonedx-json=bin/sbom.json --source-version "${{ github.sha }}"

      - name: Upload SBOM.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBOM.json
          path: bin/sbom.json

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/sbom.json

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.CP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.CP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload binaries to temporary directory
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@${{ env.CP_HOST }} "mkdir -p /opt/faas/bin/deploy-tmp"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            bin/apid bin/schedd bin/gatewayd bin/imaged bin/meterd \
            bin/githubd bin/vmmd bin/gregale bin/migrate \
            root@${{ env.CP_HOST }}:/opt/faas/bin/deploy-tmp/

      # Install faas-vmmd.service systemd unit. Pre-PR #495 the unit
      # shipped only via the vmmd_service ansible role, which is in
      # site.yml but never re-run on boxes bootstrapped before that role
      # landed. Without /etc/systemd/system/faas-vmmd.service on the
      # box, (a) imaged's `After=faas-vmmd.service` directive waits for a
      # unit that doesn't exist (PR #492) and (b) the FAAS_SERVICES
      # restart loop's `systemctl restart faas-vmmd.service` 404s (run
      # 30666277403, 2026-07-31). The unit file is bundled from
      # deploy/etc/faas-vmmd.service, kept byte-identical to
      # Install controlplane systemd units (service + slice definitions)
      # and faas-vmmd.service unit so updated unit files (e.g. LoadCredential,
      # environment limits, dependencies) land on the host prior to service restart.
      - name: Install systemd service units
        run: |
          set -euo pipefail
          # SCP all unit files in deploy/controlplane/systemd/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/controlplane/systemd/* "root@${{ env.CP_HOST }}:/etc/systemd/system/"
          # SCP faas-vmmd.service unit
          UNIT_SRC="deploy/etc/faas-vmmd.service"
          UNIT_DST="/etc/systemd/system/faas-vmmd.service"
          TMP_DST="/etc/systemd/system/faas-vmmd.service.deploy-tmp"
          UNIT_SHA=$(sha256sum "${UNIT_SRC}" | awk '{print $1}')
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${UNIT_SRC}" "root@${{ env.CP_HOST }}:${TMP_DST}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@${{ env.CP_HOST }} "set -euo pipefail
              install -m 0644 -o root -g root '${TMP_DST}' '${UNIT_DST}'
              rm -f '${TMP_DST}'
              chmod 0644 /etc/systemd/system/faas-*.service /etc/systemd/system/faas-*.slice 2>/dev/null || true
              systemctl daemon-reload
              systemctl enable faas-vmmd.service
              echo '→ systemd units synced and daemon-reloaded'"

      - name: Install binaries, run migrations & restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@${{ env.CP_HOST }} 'bash -s' << 'REMOTE'
          set -euo pipefail

          FAAS_SERVICES="vmmd apid schedd gatewayd imaged meterd githubd"
          BINARIES="apid schedd gatewayd imaged meterd githubd vmmd gregale migrate"
          # Deliberately NOT under /opt/faas/bin: this dir survives a failed
          # deploy (so the previous build stays inspectable) and nothing that
          # globs the binary directory should ever see it.
          ROLLBACK_DIR=/opt/faas/rollback

          # --- Snapshot the currently-installed binaries -------------------
          # Without this a bad merge leaves the box crash-looping until a
          # human notices: the imaged/rootfs regression racked up 18,991
          # restarts across ~12 h before anyone looked. The deploy now owns
          # its own undo.
          rm -rf "${ROLLBACK_DIR}"
          mkdir -p "${ROLLBACK_DIR}"
          for bin in ${BINARIES}; do
            if [[ -f "/opt/faas/bin/${bin}" ]]; then
              cp -a "/opt/faas/bin/${bin}" "${ROLLBACK_DIR}/${bin}"
            fi
          done

          # restart_counts prints "<svc>=<NRestarts>" for every service, so a
          # crash-loop is detectable as a CHANGING value rather than a state.
          restart_counts() {
            local svc
            for svc in ${FAAS_SERVICES}; do
              printf '%s=%s ' "${svc}" \
                "$(systemctl show "faas-${svc}" -p NRestarts --value 2>/dev/null || echo '?')"
            done
          }

          # wait_healthy polls until every service is active AND the gateway
          # answers /healthz, then holds to confirm it STAYS that way.
          #
          # The hold is load-bearing. `systemctl is-active` is a point sample,
          # and a Type=simple daemon that crash-loops is genuinely "active"
          # for the few hundred ms it takes to reach its fatal error. Sampled
          # on the real box while imaged was looping:
          #
          #   activating activating activating active activating activating
          #
          # — "active" ~1 poll in 6. The first version of this gate hit that
          # window and printed "✓ all services active, gateway healthy" one
          # second before the verify step failed on the same box. Requiring
          # NRestarts to be UNCHANGED across the hold is what distinguishes a
          # started daemon from a looping one.
          wait_healthy() {
            local deadline=$((SECONDS + 60)) svc bad before after
            while (( SECONDS < deadline )); do
              bad=""
              for svc in ${FAAS_SERVICES}; do
                systemctl is-active --quiet "faas-${svc}" || bad="${bad} ${svc}"
              done
              if [[ -z "${bad}" ]] && curl -sf --max-time 5 \
                   http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                before="$(restart_counts)"
                sleep 12
                after="$(restart_counts)"
                bad=""
                for svc in ${FAAS_SERVICES}; do
                  systemctl is-active --quiet "faas-${svc}" || bad="${bad} ${svc}"
                done
                if [[ -z "${bad}" && "${before}" == "${after}" ]]; then
                  echo "✓ all services active and stable over 12s (${after})"
                  return 0
                fi
                echo "…not stable yet (restarts ${before}-> ${after}); still polling"
                continue
              fi
              sleep 3
            done
            echo "::error::health gate timed out after 60s; unhealthy:${bad:- (gateway /healthz)}"
            for svc in ${FAAS_SERVICES}; do
              systemctl is-active --quiet "faas-${svc}" || {
                echo "--- faas-${svc} ---"
                journalctl -u "faas-${svc}" -n 30 --no-pager || true
              }
            done
            return 1
          }

          # roll_back restores the previous binaries and restarts. Migrations
          # are deliberately NOT reverted: goose is append-only (repo rule)
          # and every migration must stay readable by the previous binary for
          # one release, so binaries-only is the safe direction.
          roll_back() {
            echo "::warning::rolling back to the previous binaries"
            local bin
            for bin in ${BINARIES}; do
              # Plain `if`, not `[[ ... ]] && install`: under `set -e` a
              # false test makes the && list return 1 and aborts the
              # rollback halfway through on a first-ever deploy, when
              # ROLLBACK_DIR has no previous copy of some binary.
              if [[ -f "${ROLLBACK_DIR}/${bin}" ]]; then
                install -m 0755 "${ROLLBACK_DIR}/${bin}" "/opt/faas/bin/${bin}"
              fi
            done
            for svc in ${FAAS_SERVICES}; do
              systemctl restart "faas-${svc}.service" || true
            done
            if wait_healthy; then
              echo "::warning::rollback succeeded — box is serving the PREVIOUS build"
            else
              echo "::error::rollback FAILED — box needs manual attention"
            fi
          }

          # Safely overwrite running binaries using 'install' (unlinks old files)
          for bin in ${BINARIES}; do
            install -m 0755 /opt/faas/bin/deploy-tmp/$bin /opt/faas/bin/$bin
          done
          rm -rf /opt/faas/bin/deploy-tmp

          # Migration preflight, then apply. `migrate -status` reports the
          # box's version and the pending list WITHOUT applying anything, so
          # the CI log always records the before-state. When a migration then
          # fails, "was the box where we expected it to be?" is answerable
          # from the log — previously that took an SSH session, because the
          # only output was a raw SQLSTATE from mid-apply.
          FAAS_DSN='postgres:///faas?host=/run/postgresql&user=faas'
          su - faas -s /bin/bash -c \
            "DATABASE_URL='${FAAS_DSN}' /opt/faas/bin/migrate -status"
          su - faas -s /bin/bash -c \
            "DATABASE_URL='${FAAS_DSN}' /opt/faas/bin/migrate"

          # Provision the cosign sign keypair if it's missing.
          # PR #371 ships `faas sign-keys init` (operator CLI) and
          # PR #322 made imaged + schedd fail-loud at startup if
          # /etc/faas/secrets/sign.key or sign-pub.pem is absent.
          # The cd-digitalocean workflow runs on every merge to
          # main but never had to provision the keypair (PR #367
          # + #370 cleared the migration panics, then #371 surfaced
          # this as a new failure mode). This block auto-provisions
          # when the files are missing and drift-repairs the perms
          # when they're wrong — the same shape as bootstrap.sh
          # step 11c. We deliberately do NOT call bootstrap.sh
          # itself: it's operator-side and would clobber the
          # operator's deploy SSH key on every merge. The init
          # branch is "if missing" only; rotating on every deploy
          # would invalidate every customer's build-verification
          # chain.
          SIGN_KEY_PATH=/etc/faas/secrets/sign.key
          SIGN_PUB_PATH=/etc/faas/secrets/sign-pub.pem
          if [[ ! -f "${SIGN_KEY_PATH}" || ! -f "${SIGN_PUB_PATH}" ]]; then
            echo "→ Provisioning cosign sign keypair..."
            /opt/faas/bin/gregale sign-keys init \
              --sign-key "${SIGN_KEY_PATH}" --verify-key "${SIGN_PUB_PATH}"
            chown root:faas "${SIGN_KEY_PATH}"; chmod 0440 "${SIGN_KEY_PATH}"
            chown root:root "${SIGN_PUB_PATH}"; chmod 0444 "${SIGN_PUB_PATH}"
            echo "✓ sign.key written (0440 root:faas)"
            echo "✓ sign-pub.pem written (0444 root:root)"
          else
            # Drift-repair branch: keypair exists; check perms.
            SK_MODE=$(stat -c '%a' "${SIGN_KEY_PATH}")
            SK_OWNER=$(stat -c '%U:%G' "${SIGN_KEY_PATH}")
            SP_MODE=$(stat -c '%a' "${SIGN_PUB_PATH}")
            SP_OWNER=$(stat -c '%U:%G' "${SIGN_PUB_PATH}")
            if [[ "${SK_MODE}" != "440" || "${SK_OWNER}" != "root:faas" \
               || "${SP_MODE}" != "444" || "${SP_OWNER}" != "root:root" ]]; then
              chown root:faas "${SIGN_KEY_PATH}"; chmod 0440 "${SIGN_KEY_PATH}"
              chown root:root "${SIGN_PUB_PATH}"; chmod 0444 "${SIGN_PUB_PATH}"
              echo "→ sign-keypair perms repaired (was ${SK_MODE} ${SK_OWNER} / ${SP_MODE} ${SP_OWNER})"
            fi
          fi

          # --- One-shot config fill: per-runtime base refs --------------
          # Every runtime base in pkg/imaged/base.go::DefaultRuntimeBaseRefs
          # has a default ref that points at the org's private
          # ghcr.io/onebox-faas namespace (e.g. runner-node22:latest,
          # runner-python312:latest, base-debian-parent:latest). The
          # build-time puller is anonymous (pkg/oci/registry.go:519
          # passes nil BasicAuth), the token endpoint returns 403, and
          # imaged loops. The override path is per-runtime env var
          # (FAAS_DEPLOY_BASE_REF_NODE22, _PYTHON312, _DEBIAN_PARENT,
          # etc.), but sealed.env on a box that boot-strapped before
          # #465 has no entries — every restart 403s on the first row
          # the loop visits.
          #
          # Operator fix is to set the FAAS_DEPLOY_BASE_REF_* in
          # sealed.env to a digest-pinned mirror.gcr.io ref. The
          # mirror serves each image as a multi-arch manifest list
          # (which our digest-pinned gate in cmd/imaged/main.go
          # refuses — "manifest lists not supported" per
          # sealed.env.example:15), so we resolve the amd64 entry's
          # digest out-of-band and pin to that. Script is idempotent:
          # the grep short-circuits when the var is already present.
          #
          # cd-controlplane.yml normally only ships binaries —
          # operator manages /etc/faas/sealed.env via bootstrap.sh.
          # This carve-out is for the box-side gap introduced when
          # PR #465 (ADR-053) merged to main between operator
          # bootstrap runs (the EX44 was bootstrapped 2026-07-24,
          # #465 merged 2026-07-31 — the 7-day gap left the var
          # unset, and post-fix run 30656504195 confirmed imaged
          # now fails on the SECOND row once the first one passes,
          # because every runtime base has the same default-ref
          # shape).
          #
          # Each entry: VAR_NAME|LIBRARY_IMAGE. We resolve the amd64
          # digest once per entry and append the var. Per-line
          # ordering matters — debian-parent MUST land first because
          # the 6 child runtimes declare ParentRef=BaseRefDebianParent
          # and imaged's EnsureBases loop stages parent before
          # children (pkg/imaged/base_stage.go:652-658, ADR-053).
          # When debian-parent's env override is already set, that
          # row is a no-op and we proceed to the children; when the
          # box's apt sources are stale enough that one of the child
          # tags has been republished, the digest resolver picks up
          # the new bytes — same posture as the existing builder-base
          # override.
          #
          # Inline python3 -c as a single line per the PR #484
          # bulletproof-shape fix (multi-line heredocs escape bash
          # word-splitting + YAML block-scalar folding and trip
          # python's IndentationError).
          for entry in \
            "FAAS_DEPLOY_BASE_REF_DEBIAN_PARENT|library/debian|12-slim" \
            "FAAS_DEPLOY_BASE_REF_NODE22|library/node|22-bookworm-slim" \
            "FAAS_DEPLOY_BASE_REF_PYTHON312|library/python|3.12-slim-bookworm" \
            "FAAS_DEPLOY_BASE_REF_GO124|library/golang|1.24-bookworm" \
            "FAAS_DEPLOY_BASE_REF_GO124_ALPINE|library/golang|1.24-alpine" \
            "FAAS_DEPLOY_BASE_REF_NODE24|library/node|24-bookworm-slim" \
            "FAAS_DEPLOY_BASE_REF_PYTHON313|library/python|3.13-slim-bookworm"; do
            VAR="${entry%%|*}"
            REST="${entry#*|}"
            LIB="${REST%|*}"
            TAG="${REST#*|}"
            if grep -qE "^${VAR}=" /etc/faas/sealed.env 2>/dev/null; then
              continue
            fi
            echo "→ ${VAR} missing from /etc/faas/sealed.env; resolving amd64 digest from mirror.gcr.io/${LIB}:${TAG}"
            DIG=$(curl -fsSL \
              "https://mirror.gcr.io/v2/${LIB}/manifests/${TAG}" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); amd=[m["digest"] for m in d.get("manifests",[]) if m.get("platform",{}).get("architecture")=="amd64"]; print(amd[0] if amd else "")')
            if [ -z "${DIG}" ]; then
              echo "::error::could not resolve amd64 digest for mirror.gcr.io/${LIB}:${TAG}; set ${VAR} manually in /etc/faas/sealed.env per deploy/controlplane/sealed.env.example"
              exit 1
            fi
            printf '\n%s=mirror.gcr.io/%s@%s\n' "${VAR}" "${LIB}" "${DIG}" \
              >> /etc/faas/sealed.env
            echo "→ wrote ${VAR}=mirror.gcr.io/${LIB}@${DIG}"
          done
          # Restart imaged once per write so the new env lands. The
          # services restart loop below handles the daemon ordering;
          # imaged needs a poke to re-read sealed.env.
          if grep -qE '^FAAS_DEPLOY_BASE_REF_(DEBIAN_PARENT|NODE22|PYTHON312|GO124(_ALPINE)?|NODE24|PYTHON313)=' \
               /etc/faas/sealed.env 2>/dev/null; then
            systemctl restart faas-imaged.service || true
            sleep 5
          fi

          # --- Config drift guard: OCI base ref registry ------------------
          # imaged pulls every runtime base on every startup — pointed at a
          # registry it can't reach anonymously, a restart loop turns a
          # transient failure into a permanent one. Three failure modes seen
          # on the box:
          #
          #   1. docker.io — anonymous 100/6h pull rate limit (DO deploy
          #      2026-07-24, burned 20,000 restarts).
          #   2. ghcr.io/onebox-faas/* — the org's PRIVATE namespace; the
          #      build-time puller is anonymous (pkg/oci/registry.go:519
          #      passes nil BasicAuth) so the token endpoint returns 403
          #      (cd-controlplane runs 30650464753 + 30652515669 +
          #      30659586727 — every FAAS_DEPLOY_BASE_REF_* const
          #      default at ghcr.io/onebox-faas/<runtime>:latest
          #      trips the same way; PR #486 unblocked
          #      FAAS_DEPLOY_BASE_REF_DEBIAN_PARENT, the next row
          #      (node22) then 403'd).
          #   3. tag-only refs — imaged's per-env-var digest-pinned gate in
          #      cmd/imaged/main.go refuses them with a fail-loud error.
          #
          # deploy/controlplane/sealed.env.example pins mirror.gcr.io for
          # every override; refuse to ship onto anonymous-pull drift so the
          # next deploy doesn't get to find it the same way.
          BAD_RE='^(FAAS_BUILDER_BASE_REF|FAAS_DEPLOY_BASE_REF(_DEBIAN_PARENT|_NODE22|_PYTHON312|_GO124(_ALPINE)?|_NODE24|_PYTHON313)?)=(https?://)?(registry-1\.)?docker\.io/'
          if grep -qE "${BAD_RE}" /etc/faas/sealed.env 2>/dev/null; then
            echo "::error::an OCI base ref in /etc/faas/sealed.env points at docker.io — anonymous pulls are rate-limited and will crash-loop imaged. Use mirror.gcr.io (see deploy/controlplane/sealed.env.example)."
            exit 1
          fi
          # Catch ANY per-runtime base ref still pointed at the private
          # ghcr.io/onebox-faas namespace. The single regex covers
          # _DEBIAN_PARENT, _NODE22, _PYTHON312, _GO124, _GO124_ALPINE,
          # _NODE24, _PYTHON313 — every entry in pkg/imaged/base.go
          # ::DefaultRuntimeBaseRefs. Without this, the writer above
          # can re-seed the var to mirror.gcr.io but a stale value
          # already in the file wins on the next loop visit.
          if grep -qE '^FAAS_DEPLOY_BASE_REF(_DEBIAN_PARENT|_NODE22|_PYTHON312|_GO124(_ALPINE)?|_NODE24|_PYTHON313)?=ghcr\.io/onebox-faas/' \
               /etc/faas/sealed.env 2>/dev/null; then
            echo "::error::a FAAS_DEPLOY_BASE_REF_* in /etc/faas/sealed.env points at the private ghcr.io/onebox-faas namespace — the build-time puller is anonymous (pkg/oci/registry.go:519), the token endpoint returns 403, and imaged loops. Override to a digest-pinned mirror.gcr.io ref (see deploy/controlplane/sealed.env.example + ADR-053). Every PR #465 default const is unreachable from this box; the env var MUST be overridden."
            exit 1
          fi

          # Restart all FaaS services.
          for svc in ${FAAS_SERVICES}; do
            systemctl restart "faas-${svc}.service" || true
          done

          # Health gate. Probes gatewayd (loopback :8080), not apid directly
          # — spec §11 binds apid to loopback-only and gatewayd
          # reverse-proxies /healthz onto apid, so this exercises the full
          # proxy chain end-to-end (issue #85 PR 1 + PR 2).
          #
          # This used to be `curl ... || echo "⚠ Gateway not responding"`,
          # which swallowed the failure: the step exited 0 with a warning
          # nobody read, and the job only went red one step later with no
          # daemon logs attached. Now an unhealthy box rolls back and fails.
          if ! wait_healthy; then
            roll_back
            exit 1
          fi
          rm -rf "${ROLLBACK_DIR}"
          REMOTE

      - name: Verify deployment
        run: |
          echo "1. Verifying systemd service states via SSH..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ env.CP_HOST }} '
            failed=0
            for svc in apid schedd gatewayd imaged meterd githubd; do
              if systemctl is-active --quiet faas-$svc; then
                echo "✓ faas-$svc is active and running"
              else
                echo "::error::faas-$svc is not running!"
                # `systemctl status` on a unit in Restart=on-failure backoff
                # prints "activating (auto-restart)" and NO application error
                # — that is why the imaged/rootfs crash-loop needed a manual
                # SSH session to diagnose. Pull the daemon logs so the CI log
                # alone is enough, and show the restart counter so a
                # crash-loop is distinguishable from a slow start.
                echo "--- journalctl -u faas-$svc (last 40) ---"
                journalctl -u faas-$svc -n 40 --no-pager || true
                echo "--- restart counter ---"
                systemctl show faas-$svc -p NRestarts --value || true
                failed=1
              fi
            done
            exit $failed
          '

          echo "2. Verifying Control API healthz endpoint..."
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            "http://${{ env.CP_HOST }}:8080/healthz" || echo 000)
          echo "Control API /healthz status code: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::Control API health check failed with status $STATUS"
            exit 1
          fi
          echo "✓ Control API is healthy"
