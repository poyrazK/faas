# .github/workflows/release.yml — Gregale release pipeline (issue #270 / ADR-093).
#
# Triggered by a tag push matching v*.*.*. Cross-builds the gregale CLI
# for linux-amd64 (and optional darwin-arm64 for maintainer local dev),
# vendors the linux-amd64 binary into .github/actions/deploy/bin/gregale,
# updates src/version.txt, generates SHA256SUMS, commits everything back
# to a release branch, force-updates the MAJOR moving tag so customers
# pinned at @vN always resolve to the latest vendored binary, and
# attaches a GitHub Release via softprops/action-gh-release (SHA-pinned
# to match .github/workflows/cd-controlplane.yml:99-110).
#
# The CLI compatibility asset remains in the first job. The daemon bundle
# job below is the production release surface: it builds the immutable
# multi-daemon tarball, signs it with GitHub OIDC, emits an SPDX SBOM, and
# publishes all of the install-time verification material together. Those
# independent builds run concurrently; the final publication job waits for
# both so a failed CLI build cannot leave a canonical bundle attached alone.
#
# Tag strategy: every release commits to a `release/v<tag>` branch AND
# force-updates the MAJOR moving tag (vN from vN.M.P) so that
# `uses: poyrazK/faas/.github/actions/deploy@v1` (the canonical shape
# pinned in the README + ADR + the rendered snippet) resolves to the
# latest vendored binary. Without the moving-tag step, customers
# pinned at @v1 would resolve to the pre-workflow commit that has no
# bin/gregale, and `run.sh` would exit 1 with "vendored binary not
# found" on day one.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  actions: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` and the tag-resolution
          # plumbing work end-to-end. The binary itself is the
          # gzipped output, not the repo history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Tags have their own cache scope, so setup-go's automatic cache missed
      # on every release candidate and saved a new archive that the next tag
      # could not restore. Main CI already builds these targets and publishes
      # this dated cache after each push; release tags can restore the
      # default-branch cache without spending another two minutes compiling.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore main-branch Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-

      # Four shipped targets (ADR-172). Windows is absent on purpose:
      # cmd/gregale transitively imports pkg/fcvm, which needs
      # syscall.Stat_t / Mkfifo / SYS_IOCTL and does not compile for
      # GOOS=windows. Both public channels fail closed there.
      #
      # Each target also gets a gregale_<semver>_<os>_<arch>.tar.gz
      # archive. Those archives — not the bare binaries — are what
      # scripts/install.sh downloads and what the npm platform packages
      # are built from.
      - name: Cross-build gregale for every shipped target
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gregale-build/archives
          SEMVER="${VERSION#v}"
          MTIME="@$(git log -1 --format=%ct)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            stage="/tmp/gregale-build/stage/${GOOS}_${GOARCH}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X github.com/onebox-faas/faas/pkg/wire.Version=${VERSION}" \
              -o "$stage/gregale" ./cmd/gregale
            # Archiving lives in a script so its reproducibility is gated by
            # scripts/archive-cli-binary_test.sh on every PR. Inline, the
            # claim was only a comment — and it was wrong: `tar -czf` writes
            # the current wall-clock time into the gzip header, so two runs
            # produced different bytes and different SHA256SUMS.
            bash scripts/archive-cli-binary.sh \
              --binary "$stage/gregale" \
              --output "/tmp/gregale-build/archives/gregale_${SEMVER}_${GOOS}_${GOARCH}.tar.gz" \
              --mtime "$MTIME"
          done
          # Historical asset layout, preserved verbatim: the bare
          # linux-amd64 binary is what the deploy action vendors below,
          # and gregale-darwin-arm64 is an already-published download
          # link. Neither name may change.
          cp /tmp/gregale-build/stage/linux_amd64/gregale /tmp/gregale-build/gregale
          cp /tmp/gregale-build/stage/darwin_arm64/gregale /tmp/gregale-build/gregale-darwin-arm64
          ls -la /tmp/gregale-build /tmp/gregale-build/archives

      # CLI-SHA256SUMS is generated in /tmp/gregale-build because that's
      # the working directory where both binaries live. The vendoring
      # step below retains a SHA256SUMS copy on the release branch for
      # action compatibility, while the GitHub release uses the distinct
      # CLI-SHA256SUMS public asset name so the daemon checksum publication
      # cannot replace it.
      # The archives are flattened into the same directory first so their
      # checksum entries carry bare filenames. scripts/install.sh matches on
      # "<digest>  <archive>" exactly, and an "archives/" prefix would fail.
      - name: Generate CLI-SHA256SUMS
        working-directory: /tmp/gregale-build
        run: |
          set -euo pipefail
          cp archives/*.tar.gz .
          sha256sum gregale gregale-darwin-arm64 gregale_*.tar.gz > CLI-SHA256SUMS
          cat CLI-SHA256SUMS

      # Handed to publish-npm, which stages the five npm packages from
      # these exact archives rather than rebuilding the CLI. One build per
      # release, consumed by every channel.
      - name: Upload CLI archives for the npm channel
        uses: actions/upload-artifact@v4
        with:
          name: gregale-cli-archives-${{ github.sha }}
          path: /tmp/gregale-build/archives/
          if-no-files-found: error
          retention-days: 1

      - name: Vendor binary + SHA256SUMS into action repo
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp /tmp/gregale-build/gregale .github/actions/deploy/bin/gregale
          chmod +x .github/actions/deploy/bin/gregale
          cp /tmp/gregale-build/CLI-SHA256SUMS SHA256SUMS
          echo "$VERSION" > .github/actions/deploy/src/version.txt
          # Sanity-check: the vendored binary should report the right
          # version when invoked. Smoke asserts the LDFLAGS stamping
          # worked end-to-end.
          ./.github/actions/deploy/bin/gregale version

      - name: Commit vendored binary + version + SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "gregale-release-bot"
          git config user.email "release-bot@gregale.dev"
          BRANCH="release/${TAG}"
          # Idempotent branch create: if a previous run left the
          # branch around (network blip, partial push), reset it to
          # origin/main instead of failing. The vendored-binary
          # commit is the only thing the release branch adds, so
          # this is safe to retry.
          if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
            git branch -D "${BRANCH}"
          fi
          git checkout -b "$BRANCH"
          git add .github/actions/deploy/bin/gregale .github/actions/deploy/src/version.txt SHA256SUMS
          git commit -m "release: bundle gregale ${TAG}"
          git push -u origin "$BRANCH"

      - name: Force-update MAJOR moving tag (vN -> vN.M.P)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Extract the MAJOR version (the "vN" from "vN.M.P") so
          # customers pinned at @v1 always resolve to the latest
          # vendored binary. Local-only: never push the moving tag
          # to the release branch (it stays on the SHA we just
          # committed). The `git push --force` updates the moving
          # tag in refs/tags/vN to point at this commit, so
          # `uses: .../deploy@v1` resolves to the vendored binary.
          MAJOR="$(echo "$TAG" | cut -d. -f1)"
          # This checkout is now the release branch HEAD containing the
          # vendored binary. Point the moving major tag at that commit, not
          # at the original source tag that triggered this workflow.
          git tag -f "$MAJOR" HEAD
          git push origin "refs/tags/${MAJOR}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            .github/actions/deploy/bin/gregale
            /tmp/gregale-build/gregale-darwin-arm64
            /tmp/gregale-build/gregale_*.tar.gz
            scripts/install.sh
            /tmp/gregale-build/CLI-SHA256SUMS
          # Release candidates (for example v0.1.18-rc.1) must not be
          # presented as stable releases. Keep the tag convention and the
          # GitHub release classification in lockstep.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Gregale ${{ github.ref_name }}

            Bundled CLI: **gregale ${{ github.ref_name }}**
            Compatible server API: see `poyrazK/faas` release notes for ${{ github.ref_name }}.

            ### Install the CLI

            ```sh
            curl -fsSL https://get.gregale.dev | sh
            ```

            ```sh
            npm install -g gregale
            ```

            Pin this exact release:

            ```sh
            curl -fsSL https://get.gregale.dev | sh -s -- --version ${{ github.ref_name }}
            ```

            macOS and Linux, amd64 and arm64. Windows is not supported yet
            (ADR-172).

            ### Checksums

            ```
            $(cat /tmp/gregale-build/CLI-SHA256SUMS)
            ```

            ### Verify

            ```sh
            sha256sum -c CLI-SHA256SUMS
            ```

            ### Pin

            In your workflow:

            ```yaml
            - uses: poyrazK/faas/.github/actions/deploy@v1
              with:
                app: my-app
            ```

            For hard reproducibility, pin a specific tag:

            ```yaml
            - uses: poyrazK/faas/.github/actions/deploy@${{ github.ref_name }}
            ```

  # ADR-172: the npm channel. Consumes the archives built above rather than
  # rebuilding the CLI, so npm and the curl installer can never ship
  # different bytes for the same tag.
  #
  # The curl installer has no counterpart job on purpose — it resolves the
  # release from the GitHub API at run time, so attaching the assets above
  # is the entire publish step for that channel.
  publish-npm:
    name: Publish the npm channel
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download CLI archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gregale-cli-archives-${{ github.sha }}
          path: ${{ runner.temp }}/archives

      # Staging runs unconditionally, even with no NPM_TOKEN: a packaging
      # regression should fail the release that introduced it rather than
      # lie dormant until credentials exist.
      - name: Stage npm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/build-npm-packages.sh \
            --version "$TAG" \
            --artifacts-dir "$RUNNER_TEMP/archives" \
            --out-dir "$RUNNER_TEMP/npm"

      # `npm pack --dry-run` resolves the package's own `files` globs, which
      # the hermetic unit test cannot do. A glob that silently excludes
      # bin/gregale would otherwise publish an empty package.
      - name: Verify each package actually contains its payload
        run: bash scripts/verify-npm-package-payloads.sh "$RUNNER_TEMP/npm/publish-order.txt"

      - name: Resolve publish preconditions
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A prerelease tag must never move `latest`, or `npm i -g gregale`
          # starts handing out release candidates to everyone.
          case "$TAG" in
            *-*) echo "dist_tag=rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          # The `secrets` context is not usable in a job-level `if`, so the
          # token check becomes a step output. Missing credentials skip the
          # channel instead of failing the release (ADR-172).
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=npm channel skipped::NPM_TOKEN is not set, so ${TAG} was staged and validated but not published to npm."
          fi

      - name: Publish to npm
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.guard.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # publish-order.txt lists the four platform packages before the
          # root launcher that pins them, so no consumer can resolve a root
          # package whose binaries are not on the registry yet.
          while IFS= read -r dir; do
            name="$(node -p "require('$dir/package.json').name")"
            version="$(node -p "require('$dir/package.json').version")"
            # Re-running a release workflow must not hard-fail on
            # "cannot publish over the previously published version".
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry; skipping"
              continue
            fi
            # </dev/null: npm reads stdin, and without this it swallows the
            # rest of publish-order.txt — silently publishing one package
            # and skipping the others.
            npm publish "$dir" \
              --access public \
              --tag "$DIST_TAG" \
              --provenance </dev/null
            echo "published $name@$version (dist-tag $DIST_TAG)"
          done < "$RUNNER_TEMP/npm/publish-order.txt"

  daemon-bundle:
    name: Build and sign canonical daemon bundle
    runs-on: ubuntu-22.04
    # The builder-base publisher is a separate workflow and can use most of
    # its 25-minute budget before the immutable tag is available. Leave room
    # for that hand-off plus bundle creation and signing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore main-branch Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-

      - name: Install pinned release tooling
        env:
          COSIGN_VERSION: "2.4.1"
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"
          SYFT_VERSION: "1.49.0"
          SYFT_SHA256: "7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe"
          CRANE_VERSION: "0.21.1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tools"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/release-tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/release-tools/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/release-tools/cosign"
          # Syft is released as a pinned binary because v1.49.0 requires
          # Go >= 1.26.3 while the repository's Go toolchain remains pinned
          # to the 1.25 line for the application and CI vulnerability gate.
          curl -fsSL -o "$RUNNER_TEMP/release-tools/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/release-tools/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/release-tools/syft.tar.gz" \
            -C "$RUNNER_TEMP/release-tools" syft
          chmod 0755 "$RUNNER_TEMP/release-tools/syft"
          rm -f "$RUNNER_TEMP/release-tools/syft.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/release-tools/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/release-tools/crane.tar.gz" \
            -C "$RUNNER_TEMP/release-tools" crane
          chmod 0755 "$RUNNER_TEMP/release-tools/crane"
          rm -f "$RUNNER_TEMP/release-tools/crane.tar.gz"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Resolve the immutable builder-base child digest
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/poyrazk/builder-base
          IMAGE_WAIT_ATTEMPTS: "60"
          IMAGE_WAIT_SECONDS: "30"
        run: |
          set -euo pipefail
          # images.yml publishes an immutable sha-<commit> tag whenever the
          # builder image or guest-init changes. Releases may be cut after
          # unrelated commits, so walk first-parent history to the newest
          # commit that changed the builder image inputs. This keeps the
          # release reproducible without rebuilding a 25-minute image job for
          # every unrelated daemon change.
          BUILDER_SOURCE_SHA="$(git log --first-parent --format='%H' -n 1 "$GIT_SHA" -- \
            images/builder-base.Dockerfile \
            images/buildkit-frontend-startup.patch \
            images/buildkit-session-health.patch \
            images/builder-resolv.conf \
            images/Dockerfile.lock \
            guest/init \
            pkg/api \
            pkg/reqbudget \
            pkg/sourcecontext \
            pkg/statefuldenylist \
            go.mod \
            go.sum \
            pkg/fcvm/builder_acceptance_metal_test.go \
            scripts/ci/install-grype.sh \
            scripts/ci/update-grype-db.sh \
            scripts/ci/scan-oci-image.sh \
            .github/workflows/images.yml)"
          [[ "$BUILDER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::could not find a builder-base source commit in release history" >&2
            exit 1
          }
          REF="${IMAGE_NAME}:sha-${BUILDER_SOURCE_SHA}"
          CONFIG_DIR="$RUNNER_TEMP/crane-config"
          mkdir -p "$CONFIG_DIR"
          DOCKER_CONFIG="$CONFIG_DIR" crane auth login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"

          # The image publisher is a separate main-branch workflow. A tag
          # pushed immediately after a merge can therefore start this job
          # before images.yml has finished publishing its immutable tag. Wait
          # for that exact source commit's successful publisher run instead of
          # racing the registry and failing with MANIFEST_UNKNOWN. The run
          # check also prevents us from consuming an image that was pushed
          # before the publisher's guest-init verification failed.
          MANIFEST_JSON=""
          IMAGE_RUN_URL=""
          IMAGE_RUN_SUCCEEDED=false
          for attempt in $(seq 1 "$IMAGE_WAIT_ATTEMPTS"); do
            IMAGE_RUNS="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/images.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$BUILDER_SOURCE_SHA" \
              -f per_page=100 \
              --jq '[.workflow_runs[] | {databaseId: .id, headSha: .head_sha, status, conclusion, url: .html_url}]')"
            IMAGE_RUN_URL="$(jq -r --arg sha "$BUILDER_SOURCE_SHA" '
              [.[] | select(.headSha == $sha and .conclusion == "success")]
              | sort_by(.databaseId) | last | .url // empty' <<< "$IMAGE_RUNS")"
            if [[ -n "$IMAGE_RUN_URL" ]]; then
              echo "builder-base publisher succeeded: $IMAGE_RUN_URL"
              IMAGE_RUN_SUCCEEDED=true
              break
            fi

            LATEST_IMAGE_RUN="$(jq -c --arg sha "$BUILDER_SOURCE_SHA" '
              [.[] | select(.headSha == $sha)]
              | sort_by(.databaseId) | last // empty' <<< "$IMAGE_RUNS")"
            if [[ -n "$LATEST_IMAGE_RUN" ]]; then
              IMAGE_RUN_STATUS="$(jq -r '.status' <<< "$LATEST_IMAGE_RUN")"
              IMAGE_RUN_CONCLUSION="$(jq -r '.conclusion // empty' <<< "$LATEST_IMAGE_RUN")"
              IMAGE_RUN_URL="$(jq -r '.url' <<< "$LATEST_IMAGE_RUN")"
              if [[ "$IMAGE_RUN_STATUS" == "completed" ]]; then
                echo "::error::builder-base publisher for $BUILDER_SOURCE_SHA finished with $IMAGE_RUN_CONCLUSION: $IMAGE_RUN_URL" >&2
                exit 1
              fi
              echo "waiting for builder-base publisher ($IMAGE_RUN_STATUS): $IMAGE_RUN_URL"
            else
              echo "waiting for images.yml publisher for builder-base source $BUILDER_SOURCE_SHA"
            fi
            if [[ "$attempt" -lt "$IMAGE_WAIT_ATTEMPTS" ]]; then
              sleep "$IMAGE_WAIT_SECONDS"
            fi
          done
          [[ "$IMAGE_RUN_SUCCEEDED" == true ]] || {
            echo "::error::timed out waiting for images.yml to publish builder-base source $BUILDER_SOURCE_SHA" >&2
            exit 1
          }

          # GHCR can take a few seconds to serve a manifest after the Actions
          # run is complete, so retain a short registry retry as well.
          for attempt in $(seq 1 12); do
            if MANIFEST_JSON="$(DOCKER_CONFIG="$CONFIG_DIR" crane manifest "$REF" 2>/tmp/crane-manifest-error)"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              cat /tmp/crane-manifest-error >&2
              exit 1
            fi
            echo "waiting for GHCR manifest $REF (attempt $attempt/12)"
            sleep 5
          done
          BUILDER_BASE_DIGEST="$(jq -er \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] |
             if length == 1 then .[0] else error("expected exactly one linux/amd64 builder manifest") end' \
            <<< "$MANIFEST_JSON")"
          [[ "$BUILDER_BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::builder-base child digest is invalid for $REF" >&2
            exit 1
          }
          BUILDER_BASE_DIGEST="${BUILDER_BASE_DIGEST#sha256:}"
          echo "BUILDER_SOURCE_SHA=$BUILDER_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BUILDER_BASE_DIGEST=$BUILDER_BASE_DIGEST" >> "$GITHUB_ENV"
          echo "resolved builder-base source=$BUILDER_SOURCE_SHA amd64_digest=$BUILDER_BASE_DIGEST"

      - name: Resolve the immutable runtime-base contract
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_WAIT_ATTEMPTS: "60"
          IMAGE_WAIT_SECONDS: "30"
          CONFIG_DIR: ${{ runner.temp }}/crane-config
          OUT_DIR: ${{ runner.temp }}/gregale-release
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # Runtime base images contain only their Dockerfile layers and the
          # shared rootfs skeleton. Runtime control-plane code is shipped in
          # this signed daemon bundle, so a change under pkg/imaged,
          # pkg/builderd, or guest/runners must not force a release to wait for
          # eight byte-identical images to be republished. Select the newest
          # commit that could have changed or revalidated the image bytes.
          RUNTIME_SOURCE_SHA="$(git log --first-parent --format='%H' -n 1 "$GIT_SHA" -- \
            images/base-debian-parent.Dockerfile \
            images/base-minimal.Dockerfile \
            images/runner-node22.Dockerfile \
            images/runner-node24.Dockerfile \
            images/runner-python312.Dockerfile \
            images/runner-python313.Dockerfile \
            images/runner-go124.Dockerfile \
            images/runner-go124-alpine.Dockerfile \
            images/rootfs-skel \
            images/Dockerfile.lock \
            scripts/ci/install-grype.sh \
            scripts/ci/update-grype-db.sh \
            scripts/ci/scan-oci-image.sh \
            scripts/ci/validate-runtime-image.sh \
            scripts/ci/smoke-runtime-image.sh \
            .github/workflows/images.yml)"
          [[ "$RUNTIME_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::could not find a runtime-base source commit in release history" >&2
            exit 1
          }
          IMAGE_RUN_URL=""
          IMAGE_RUN_SUCCEEDED=false
          for attempt in $(seq 1 "$IMAGE_WAIT_ATTEMPTS"); do
            IMAGE_RUNS="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/images.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$RUNTIME_SOURCE_SHA" \
              -f per_page=100 \
              --jq '[.workflow_runs[] | {databaseId: .id, headSha: .head_sha, status, conclusion, url: .html_url}]')"
            IMAGE_RUN_URL="$(jq -r --arg sha "$RUNTIME_SOURCE_SHA" '
              [.[] | select(.headSha == $sha and .conclusion == "success")]
              | sort_by(.databaseId) | last | .url // empty' <<< "$IMAGE_RUNS")"
            if [[ -n "$IMAGE_RUN_URL" ]]; then
              IMAGE_RUN_SUCCEEDED=true
              echo "runtime-base publisher succeeded: $IMAGE_RUN_URL"
              break
            fi
            LATEST_IMAGE_RUN="$(jq -c --arg sha "$RUNTIME_SOURCE_SHA" '
              [.[] | select(.headSha == $sha)]
              | sort_by(.databaseId) | last // empty' <<< "$IMAGE_RUNS")"
            if [[ -n "$LATEST_IMAGE_RUN" ]]; then
              IMAGE_RUN_STATUS="$(jq -r '.status' <<< "$LATEST_IMAGE_RUN")"
              IMAGE_RUN_CONCLUSION="$(jq -r '.conclusion // empty' <<< "$LATEST_IMAGE_RUN")"
              IMAGE_RUN_URL="$(jq -r '.url' <<< "$LATEST_IMAGE_RUN")"
              if [[ "$IMAGE_RUN_STATUS" == completed ]]; then
                echo "::error::runtime-base publisher for $RUNTIME_SOURCE_SHA finished with $IMAGE_RUN_CONCLUSION: $IMAGE_RUN_URL" >&2
                exit 1
              fi
              echo "waiting for runtime-base publisher ($IMAGE_RUN_STATUS): $IMAGE_RUN_URL"
            else
              echo "waiting for images.yml publisher for runtime source $RUNTIME_SOURCE_SHA"
            fi
            if [[ "$attempt" -lt "$IMAGE_WAIT_ATTEMPTS" ]]; then
              sleep "$IMAGE_WAIT_SECONDS"
            fi
          done
          [[ "$IMAGE_RUN_SUCCEEDED" == true ]] || {
            echo "::error::timed out waiting for images.yml to publish runtime source $RUNTIME_SOURCE_SHA" >&2
            exit 1
          }

          declare -a RUNTIME_IMAGES=(
            "MINIMAL base-minimal"
            "DEBIAN_PARENT base-debian-parent"
            "NODE22 runner-node22"
            "PYTHON312 runner-python312"
            "GO124 runner-go124"
            "GO124_ALPINE runner-go124-alpine"
            "NODE24 runner-node24"
            "PYTHON313 runner-python313"
          )
          : > "$OUT_DIR/runtime-bases.env"
          for item in "${RUNTIME_IMAGES[@]}"; do
            read -r key image <<< "$item"
            ref="ghcr.io/poyrazk/${image}:sha-${RUNTIME_SOURCE_SHA}"
            digest="$(DOCKER_CONFIG="$CONFIG_DIR" crane digest --platform linux/amd64 "$ref" 2>/dev/null || true)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::runtime image $ref has no immutable digest" >&2
              exit 1
            }
            printf 'FAAS_DEPLOY_BASE_REF_%s=ghcr.io/poyrazk/%s@%s\n' "$key" "$image" "$digest" >> "$OUT_DIR/runtime-bases.env"
          done
          chmod 0644 "$OUT_DIR/runtime-bases.env"
          echo "RUNTIME_SOURCE_SHA=$RUNTIME_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "materialized release runtime-base contract from source $RUNTIME_SOURCE_SHA"

      - name: Reuse a prior signed Firecracker kernel
        id: reuse_kernel
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.sha }}
          KERNEL_FILE: ${{ runner.temp }}/gregale-release/vmlinux
        run: |
          set -euo pipefail
          if scripts/reuse-release-kernel.sh \
            --git-sha "$GIT_SHA" \
            --output "$KERNEL_FILE"; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" == 3 ]] || exit "$status"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release-pinned Firecracker kernel
        if: steps.reuse_kernel.outputs.reused != 'true'
        env:
          KERNEL_FILE: ${{ runner.temp }}/gregale-release/vmlinux
        run: |
          set -euo pipefail
          # The kernel is part of the signed release, so production compute
          # hosts never rebuild it with provider-specific compiler, hostname,
          # or timestamp metadata during node adoption.
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio flex file kmod libelf-dev libssl-dev xz-utils
          scripts/build-firecracker-kernel.sh --output "$KERNEL_FILE"

      - name: Record release kernel digest
        env:
          KERNEL_FILE: ${{ runner.temp }}/gregale-release/vmlinux
        run: |
          set -euo pipefail
          KERNEL_DIGEST="$(sha256sum "$KERNEL_FILE" | awk '{print $1}')"
          echo "KERNEL_DIGEST=$KERNEL_DIGEST" >> "$GITHUB_ENV"
          echo "release kernel digest=$KERNEL_DIGEST"

      - name: Build canonical daemon tarball and SPDX SBOM
        env:
          GIT_SHA: ${{ github.sha }}
          # The production manifest is not a repository variable or the
          # illustrative manifest
          # in deploy/manifest/examples. The production manifest is
          # materialized from the checked-in topology template below so the
          # tag commit and the signed bundle always share one identity.
          OUT_DIR: ${{ runner.temp }}/gregale-release
          SYFT_BIN: syft
          KERNEL_FILE: ${{ runner.temp }}/gregale-release/vmlinux
        run: |
          set -euo pipefail
          MANIFEST_FILE="$OUT_DIR/production-manifest.yaml"
          scripts/materialize-release-manifest.sh \
            --template deploy/manifest/production/gcp-live.template.yaml \
            --git-sha "$GIT_SHA" \
            --builder-base-digest "$BUILDER_BASE_DIGEST" \
            --kernel-digest "$KERNEL_DIGEST" \
            --runtime-bases-env "$OUT_DIR/runtime-bases.env" \
            --output "$MANIFEST_FILE"
          MANIFEST_FILE="$MANIFEST_FILE" \
            GIT_SHA="$GIT_SHA" \
            OUT_DIR="$OUT_DIR" \
            KERNEL_FILE="$KERNEL_FILE" \
            SYFT_BIN="$SYFT_BIN" \
            scripts/build-canonical-tarball.sh

      - name: Sign canonical tarball with GitHub OIDC
        env:
          OUT_DIR: ${{ runner.temp }}/gregale-release
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$OUT_DIR/release.cosign.bundle" \
            "$OUT_DIR/release.tar.gz"
          cosign verify-blob \
            --bundle "$OUT_DIR/release.cosign.bundle" \
            --certificate-identity-regexp '^https://github\.com/poyrazK/faas/\.github/workflows/release\.yml@refs/tags/.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$OUT_DIR/release.tar.gz"
          (cd "$OUT_DIR" && sha256sum release.tar.gz release.cosign.bundle release.sbom.json production-manifest.yaml runtime-bases.env > SHA256SUMS)

      - name: Upload canonical release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gregale-daemon-release-${{ github.sha }}
          path: ${{ runner.temp }}/gregale-release/
          if-no-files-found: error
          retention-days: 1

  publish-daemon-bundle:
    name: Attach canonical daemon bundle
    needs: [build, daemon-bundle]
    runs-on: ubuntu-22.04
    steps:
      - name: Download canonical release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gregale-daemon-release-${{ github.sha }}
          path: ${{ runner.temp }}/gregale-release

      - name: Attach canonical release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ runner.temp }}/gregale-release/release.tar.gz
            ${{ runner.temp }}/gregale-release/release.cosign.bundle
            ${{ runner.temp }}/gregale-release/release.sbom.json
            ${{ runner.temp }}/gregale-release/release-manifest.json
            ${{ runner.temp }}/gregale-release/production-manifest.yaml
            ${{ runner.temp }}/gregale-release/runtime-bases.env
            ${{ runner.temp }}/gregale-release/SHA256SUMS
