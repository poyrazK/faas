name: codeql

# GitHub-native SAST. Free for public repos; runs on pushes to main, a weekly
# cron, and on demand (workflow_dispatch, any branch).
# The Query pack is 'security-and-quality' — covers both vulns and code
# smells. We omit JavaScript/Python because there's no JS/Python in this
# repo (yet).
#
# Reference: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning

on:
  push:
    branches: [main]
  # Not on pull requests: the Go analysis held a hosted runner for 35-50
  # minutes on every push to every pull request (about 45 runner-minutes, the
  # largest single job a push started) while no merge rule reads its result.
  # Findings surface on the next push to main; dispatch it on a branch to
  # scan before merging.
  workflow_dispatch:
  schedule:
    # Weekly Sunday 02:00 UTC. Off the workload peak. SARIF artefacts
    # appear under Security > Code scanning.
    - cron: "0 2 * * SUN"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            timeout_minutes: 30
            queries: security-and-quality
            upload: always
          - language: go
            # Full Go extraction and analysis exceeded 60 minutes on hosted runners.
            # Allow it to finish without reducing the analyzed source set.
            timeout_minutes: 120
            queries: security-and-quality
            # The Go suppression query has kind `alert-suppression`, so it
            # must be added as a query-pack query rather than a local query
            # in the alert-only suite.
            packs: codeql/go-queries:AlertSuppression.ql
            # GitHub's code-scanning check does not honor SARIF InSource
            # suppressions itself; filter those marked results before upload.
            upload: never

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Initializes the CodeQL CLI, runs autobuild, and uploads SARIF.
      # Pin the major version (v3) — CodeQL ships breaking changes between
      # major bumps; v3 has been stable for the duration of this milestone.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          # 'security-and-quality' adds lint-style checks (unpinned
          # dependencies, etc.) on top of pure security queries.
          queries: ${{ matrix.queries }}
          packs: ${{ matrix.packs }}
          # Issue #995 / ADR-121 — paths-ignore lives in the
          # separate config file referenced below; see the file's
          # header comment for rationale.
          config-file: ./.github/codeql/codeql-config.yml

      # 'autobuild' detects the build system. For Go: `go build ./...`.
      # For 'actions' (workflow yaml): no build step needed.
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          # category names the alert category in the SARIF upload.
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: ${{ matrix.upload }}

      - name: Filter source-suppressed Go results
        if: matrix.language == 'go'
        run: node .github/codeql/filter-in-source-suppressions.mjs codeql-results/go.sarif

      - name: Upload filtered Go results
        if: matrix.language == 'go'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: codeql-results/go.sarif
          category: "/language:${{ matrix.language }}"
          wait-for-processing: true
