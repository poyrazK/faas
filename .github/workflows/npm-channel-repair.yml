name: npm-channel-repair

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Already uploaded GitHub release to verify and repair (no repeat npm uploads)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    concurrency:
      group: gregale-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use the supported npm 11 client for tag repair
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Download and verify the existing release archives
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p "$RUNNER_TEMP/archives"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'gregale_*.tar.gz' --pattern CLI-SHA256SUMS \
            --dir "$RUNNER_TEMP/archives"
          (cd "$RUNNER_TEMP/archives" && sha256sum --strict --ignore-missing -c CLI-SHA256SUMS)
          bash scripts/build-npm-packages.sh --version "$RELEASE_TAG" \
            --artifacts-dir "$RUNNER_TEMP/archives" --out-dir "$RUNNER_TEMP/npm"
          bash scripts/verify-npm-package-payloads.sh "$RUNNER_TEMP/npm/publish-order.txt"
      - name: Repair tags and wait for all accepted versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm --version
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const root = `${process.env.RUNNER_TEMP}/npm`;
          const version = JSON.parse(readFileSync(`${root}/gregale/package.json`)).version;
          const names = ['@gregale/cli-darwin-amd64', '@gregale/cli-darwin-arm64',
            '@gregale/cli-linux-amd64', '@gregale/cli-linux-arm64', 'gregale'];
          for (const name of names) {
            const url = `https://registry.npmjs.org/-/package/${encodeURIComponent(name)}/dist-tags`;
            const tags = await fetch(url, { signal: AbortSignal.timeout(10000) }).then(r => r.json());
            if (typeof tags.rc !== 'string') throw new Error(`Refusing diagnostic write: ${name} has no rc`);
            // Idempotent PUT of the already-public rc value; no version upload.
            const response = await fetch(`${url}/rc`, {
              method: 'PUT', headers: { 'content-type': 'application/json',
                authorization: `Bearer ${process.env.NODE_AUTH_TOKEN}` },
              body: JSON.stringify(tags.rc), signal: AbortSignal.timeout(10000),
            });
            const body = (await response.text()).replaceAll(process.env.NODE_AUTH_TOKEN, '[REDACTED]');
            console.log(`${name}: unchanged rc PUT HTTP ${response.status}: ${body.slice(0, 500)}`);
            if (!response.ok) throw new Error(`Tag-write diagnostic failed for ${name}`);
            if (tags.latest !== version) throw new Error(`Refusing diagnostic deletion: ${name} latest differs from ${version}`);
            const deletion = await fetch(`${url}/latest`, {
              method: 'DELETE', headers: { authorization: `Bearer ${process.env.NODE_AUTH_TOKEN}` },
              signal: AbortSignal.timeout(10000),
            });
            const deletionBody = (await deletion.text()).replaceAll(process.env.NODE_AUTH_TOKEN, '[REDACTED]');
            console.log(`${name}: direct latest DELETE HTTP ${deletion.status}: ${deletionBody.slice(0, 500)}`);
          }
          NODE
          node scripts/publish-npm-packages.mjs --packages-dir "$RUNNER_TEMP/npm" --repair-only
      - name: Verify anonymous installation and binary checksum
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: node scripts/verify-npm-installation.mjs --packages-dir "$RUNNER_TEMP/npm" --prefix "$RUNNER_TEMP/npm-smoke"
