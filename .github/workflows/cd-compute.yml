# .github/workflows/cd-compute.yml — adopt or roll a compute-only host.
#
# This workflow is deliberately provider-neutral. The provider creates the
# machine and supplies its SSH address; the existing gregalectl join pipeline
# owns all host convergence, release verification, storage, PKI, and database
# activation.
#
# The runner must be a trusted self-hosted runner with private fleet DNS/SSH
# reachability. A control-plane host is a valid runner when it is registered
# with the `faas-fleet` label. GitHub-hosted runners cannot reach the private
# database and mesh used by the join pipeline.

name: cd-compute

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed pre-1.0 release tag (for example v0.1.18-rc.5)"
        required: true
        type: string
      claim_file:
        description: "Path to a ComputeNodeClaim in the selected release source (preferred; replaces node/SSH/storage fields)"
        required: false
        default: ""
        type: string
      fleet_bundle_url:
        description: "HTTPS URL for a privately hosted, signed FleetEnrollmentBundle (preferred for new nodes)"
        required: false
        default: ""
        type: string
      fleet_bundle_signature_url:
        description: "HTTPS URL for the detached cosign signature bundle matching fleet_bundle_url"
        required: false
        default: ""
        type: string
      fleet_bundle_sha256:
        description: "sha256:<64 lowercase hex> digest of the exact FleetEnrollmentBundle bytes"
        required: false
        default: ""
        type: string
      node:
        description: "Manifest fleet.hosts[].name to adopt or roll (omit when a single claim is supplied by claim_file or fleet_bundle_url)"
        required: false
        default: ""
        type: string
      ssh_host:
        description: "Legacy: provider SSH address for this run; never becomes the runtime endpoint"
        required: false
        default: ""
        type: string
      ssh_user:
        description: "SSH user on the already-created host"
        required: false
        default: root
        type: string
      ssh_port:
        description: "SSH port on the already-created host"
        required: false
        default: "22"
        type: string
      ssh_host_key_sha256:
        description: "Expected OpenSSH SHA256 host-key fingerprint for the provider SSH address (required for legacy dispatches)"
        required: false
        default: ""
        type: string
      storage_device:
        description: "Optional absolute stable device path when not in the signed manifest"
        required: false
        default: ""
        type: string
      format_storage:
        description: "Format the explicitly supplied blank storage device as XFS"
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-compute-${{ inputs.node || inputs.claim_file || inputs.fleet_bundle_url }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Validate compute deployment prerequisites
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      node: ${{ steps.resolve_bundle.outputs.node || steps.resolve_claim.outputs.node || steps.resolve_legacy.outputs.node }}
      ssh_host: ${{ steps.resolve_bundle.outputs.ssh_host || steps.resolve_claim.outputs.ssh_host || steps.resolve_legacy.outputs.ssh_host }}
      ssh_user: ${{ steps.resolve_bundle.outputs.ssh_user || steps.resolve_claim.outputs.ssh_user || steps.resolve_legacy.outputs.ssh_user }}
      ssh_port: ${{ steps.resolve_bundle.outputs.ssh_port || steps.resolve_claim.outputs.ssh_port || steps.resolve_legacy.outputs.ssh_port }}
      ssh_host_key_sha256: ${{ steps.resolve_bundle.outputs.host_key_sha256 || steps.resolve_claim.outputs.host_key_sha256 || steps.resolve_legacy.outputs.host_key_sha256 }}
      storage_device: ${{ steps.resolve_bundle.outputs.storage_device || steps.resolve_claim.outputs.storage_device || steps.resolve_legacy.outputs.storage_device }}
      format_storage: ${{ steps.resolve_bundle.outputs.format_storage || steps.resolve_claim.outputs.format_storage || steps.resolve_legacy.outputs.format_storage }}
    env:
      COMPUTE_SSH_KEY: ${{ secrets.COMPUTE_SSH_KEY }}
      COMPUTE_DATABASE_URL: ${{ secrets.COMPUTE_DATABASE_URL }}
      COMPUTE_STORAGE_ENV: ${{ secrets.COMPUTE_STORAGE_ENV }}
      COMPUTE_PKI_TARBALL_B64: ${{ secrets.COMPUTE_PKI_TARBALL_B64 }}
      COMPUTE_SIGN_KEY: ${{ secrets.COMPUTE_SIGN_KEY }}
      COMPUTE_VERIFY_KEY: ${{ secrets.COMPUTE_VERIFY_KEY }}
      FLEET_BUNDLE_AUTH_TOKEN: ${{ secrets.FLEET_BUNDLE_AUTH_TOKEN }}
    steps:
      - name: Validate requested node inputs
        env:
          CLAIM_FILE: ${{ inputs.claim_file }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          NODE: ${{ inputs.node }}
          SSH_HOST: ${{ inputs.ssh_host }}
          SSH_HOST_KEY_SHA256: ${{ inputs.ssh_host_key_sha256 }}
          FLEET_BUNDLE_URL: ${{ inputs.fleet_bundle_url }}
          FLEET_BUNDLE_SIGNATURE_URL: ${{ inputs.fleet_bundle_signature_url }}
          FLEET_BUNDLE_SHA256: ${{ inputs.fleet_bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::release_tag must be a release tag, got $RELEASE_TAG" >&2
            exit 1
          }
          if [[ -n "$FLEET_BUNDLE_URL" ]]; then
            [[ "$FLEET_BUNDLE_URL" =~ ^https:// ]] || {
              echo "::error::fleet_bundle_url must use https://" >&2
              exit 1
            }
            [[ "$FLEET_BUNDLE_SIGNATURE_URL" =~ ^https:// ]] || {
              echo "::error::fleet_bundle_signature_url must use https://" >&2
              exit 1
            }
            [[ "$FLEET_BUNDLE_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::fleet_bundle_sha256 must match sha256:<64 lowercase hex>" >&2
              exit 1
            }
            [[ -z "$CLAIM_FILE" ]] || {
              echo "::error::claim_file and fleet_bundle_url are mutually exclusive" >&2
              exit 1
            }
            if [[ -n "$NODE" ]]; then
              [[ "$NODE" =~ ^[A-Za-z0-9._-]+$ ]] || {
                echo "::error::node contains unsupported characters" >&2
                exit 1
              }
            fi
            [[ -z "$SSH_HOST" ]] || {
              echo "::error::ssh_host must be omitted when fleet_bundle_url is supplied" >&2
              exit 1
            }
          elif [[ -n "$CLAIM_FILE" ]]; then
            [[ "$CLAIM_FILE" =~ ^[A-Za-z0-9._/-]+\.ya?ml$ && "$CLAIM_FILE" != /* && "$CLAIM_FILE" != *..* ]] || {
              echo "::error::claim_file must be a relative YAML path without parent traversal" >&2
              exit 1
            }
          else
            [[ "$NODE" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo "::error::node contains unsupported characters when claim_file is omitted" >&2
              exit 1
            }
            [[ -n "$SSH_HOST" ]] || {
              echo "::error::ssh_host is required when claim_file is omitted" >&2
              exit 1
            }
            [[ "$SSH_HOST_KEY_SHA256" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
              echo "::error::ssh_host_key_sha256 is required for legacy dispatches and must be an OpenSSH SHA256:<base64> fingerprint" >&2
              exit 1
            }
          fi

      - name: Check out and validate the declarative node claim
        if: inputs.claim_file != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          path: claim-source
          fetch-depth: 1

      - name: Check out release source for signed bundle validation
        if: inputs.fleet_bundle_url != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          path: bundle-source
          fetch-depth: 1

      - name: Set up Go for claim validation
        if: inputs.claim_file != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: claim-source/go.mod
          cache: true

      - name: Set up Go for signed bundle validation
        if: inputs.fleet_bundle_url != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: bundle-source/go.mod
          cache: true

      - name: Install pinned cosign for signed bundle validation
        if: inputs.fleet_bundle_url != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-bundle-tools"
          GOBIN="$RUNNER_TEMP/fleet-bundle-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1

      - name: Resolve declarative node claim
        if: inputs.claim_file != ''
        id: resolve_claim
        working-directory: claim-source
        env:
          CLAIM_FILE: ${{ inputs.claim_file }}
        run: |
          set -euo pipefail
          claim_json="$(go run ./cmd/gregalectl deploy claim validate --file "$CLAIM_FILE" --json)"
          jq -e '.valid == true' <<<"$claim_json" >/dev/null || {
            echo "::error::ComputeNodeClaim validation failed" >&2
            jq -r '.errors[]? | "::error::\(.path): \(.message)"' <<<"$claim_json" >&2
            exit 1
          }
          {
            for field in node ssh_host ssh_user ssh_port host_key_sha256 storage_device format_storage; do
              value="$(jq -r --arg field "$field" '.[$field] // empty' <<<"$claim_json")"
              printf '%s=%s\n' "$field" "$value"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Download and validate signed fleet enrollment bundle
        if: inputs.fleet_bundle_url != ''
        id: resolve_bundle
        working-directory: bundle-source
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_BUNDLE_URL: ${{ inputs.fleet_bundle_url }}
          FLEET_BUNDLE_SIGNATURE_URL: ${{ inputs.fleet_bundle_signature_url }}
          FLEET_BUNDLE_SHA256: ${{ inputs.fleet_bundle_sha256 }}
          NODE: ${{ inputs.node }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/fleet-enrollment"
          mkdir -p "$bundle_dir"
          download_private() {
            local url="$1"
            local destination="$2"
            local args=(--fail --silent --show-error --location --proto '=https' --tlsv1.2)
            if [[ -n "${FLEET_BUNDLE_AUTH_TOKEN:-}" ]]; then
              args+=(--header "Authorization: Bearer ${FLEET_BUNDLE_AUTH_TOKEN}")
            fi
            curl "${args[@]}" -o "$destination" "$url"
          }
          download_private "$FLEET_BUNDLE_URL" "$bundle_dir/fleet-enrollment.yaml"
          download_private "$FLEET_BUNDLE_SIGNATURE_URL" "$bundle_dir/fleet-enrollment.cosign.bundle"
          actual="sha256:$(sha256sum "$bundle_dir/fleet-enrollment.yaml" | awk '{print $1}')"
          [[ "$actual" == "$FLEET_BUNDLE_SHA256" ]] || {
            echo "::error::FleetEnrollmentBundle digest does not match the dispatch input" >&2
            exit 1
          }

          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          manifest_url="$(curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" "$release_api" |
            jq -er '.assets[] | select(.name == "production-manifest.yaml") | .browser_download_url')"
          curl --fail --silent --show-error --location \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            -o "$bundle_dir/production-manifest.yaml" "$manifest_url"

          bundle_json="$(go run ./cmd/gregalectl deploy fleet-bundle validate \
            --file "$bundle_dir/fleet-enrollment.yaml" \
            --signature "$bundle_dir/fleet-enrollment.cosign.bundle" \
            --manifest-file "$bundle_dir/production-manifest.yaml" \
            --cosign-binary "$RUNNER_TEMP/fleet-bundle-tools/cosign" --json)"
          jq -e '.valid == true' <<<"$bundle_json" >/dev/null || {
            echo "::error::FleetEnrollmentBundle validation failed" >&2
            jq -r '.errors[]? | "::error::\(.path): \(.message)"' <<<"$bundle_json" >&2
            exit 1
          }
          claim_count="$(jq '.claims | length' <<<"$bundle_json")"
          if [[ -z "${NODE:-}" && "$claim_count" != "1" ]]; then
            echo "::error::node input is required when the signed bundle contains multiple claims" >&2
            exit 1
          fi
          if [[ -n "${NODE:-}" && -z "$(jq -r --arg node "$NODE" '.claims[] | select(.node == $node) | .node' <<<"$bundle_json")" ]]; then
            echo "::error::node is not authorized by the signed bundle" >&2
            exit 1
          fi
          if [[ -z "${NODE:-}" ]]; then
            NODE="$(jq -r '.claims[0].node' <<<"$bundle_json")"
          fi
          selected_claim="$(jq -c --arg node "$NODE" '.claims[] | select(.node == $node)' <<<"$bundle_json")"
          {
            for field in node ssh_host ssh_user ssh_port host_key_sha256 storage_device format_storage; do
              value="$(jq -r --arg field "$field" '.[$field] // empty' <<<"$selected_claim")"
              printf '%s=%s\n' "$field" "$value"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Resolve legacy deployment inputs
        if: inputs.claim_file == '' && inputs.fleet_bundle_url == ''
        id: resolve_legacy
        env:
          NODE: ${{ inputs.node }}
          SSH_HOST: ${{ inputs.ssh_host }}
          SSH_HOST_KEY_SHA256: ${{ inputs.ssh_host_key_sha256 }}
          SSH_USER: ${{ inputs.ssh_user }}
          SSH_PORT: ${{ inputs.ssh_port }}
          STORAGE_DEVICE: ${{ inputs.storage_device }}
          FORMAT_STORAGE: ${{ inputs.format_storage }}
        run: |
          set -euo pipefail
          {
            printf 'node=%s\n' "$NODE"
            printf 'ssh_host=%s\n' "$SSH_HOST"
            printf 'host_key_sha256=%s\n' "$SSH_HOST_KEY_SHA256"
            printf 'ssh_user=%s\n' "$SSH_USER"
            printf 'ssh_port=%s\n' "$SSH_PORT"
            printf 'storage_device=%s\n' "$STORAGE_DEVICE"
            printf 'format_storage=%s\n' "$FORMAT_STORAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required production secrets without printing values
        env:
          FLEET_BUNDLE_URL: ${{ inputs.fleet_bundle_url }}
        run: |
          set -euo pipefail
          missing=0
          for name in COMPUTE_SSH_KEY COMPUTE_DATABASE_URL COMPUTE_STORAGE_ENV \
            COMPUTE_PKI_TARBALL_B64 COMPUTE_SIGN_KEY COMPUTE_VERIFY_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::production secret $name is not configured" >&2
              missing=1
            fi
          done
          if [[ -n "$FLEET_BUNDLE_URL" && -z "${FLEET_BUNDLE_AUTH_TOKEN:-}" ]]; then
            echo "::error::production secret FLEET_BUNDLE_AUTH_TOKEN is required for signed bundle dispatches" >&2
            missing=1
          fi
          (( missing == 0 )) || exit 1

      - name: Require a verified SSH host-key fingerprint
        env:
          SSH_HOST_KEY_SHA256: ${{ steps.resolve_bundle.outputs.host_key_sha256 || steps.resolve_claim.outputs.host_key_sha256 || steps.resolve_legacy.outputs.host_key_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST_KEY_SHA256" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo "::error::the resolved compute claim must contain an OpenSSH SHA256:<base64> host-key fingerprint" >&2
            echo "::error::provide ssh_host_key_sha256 for legacy dispatches or regenerate the signed claim" >&2
            exit 1
          }

      - name: Require an online trusted fleet runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The repository GITHUB_TOKEN may not have permission to enumerate
          # self-hosted runners even when the deployment job can be scheduled
          # onto one. The labeled `runs-on` constraint below is the actual
          # trust boundary; keep this API probe advisory when GitHub returns
          # 401/403/404 so a valid deployment is not rejected by visibility
          # permissions. A successful response with zero matching runners is
          # still a hard preflight failure.
          response_file="$RUNNER_TEMP/faas-runners.json"
          http_status="$(curl --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
          case "$http_status" in
            200)
              count="$(jq '[.runners[] | select(.status == "online") | select((.labels | map(.name) | index("faas-fleet")) != null)] | length' "$response_file")"
              if (( count < 1 )); then
                echo "::error::no online self-hosted runner has the faas-fleet label" >&2
                echo "::error::bootstrap one with deploy/ansible/fleet_runner.yml before retrying" >&2
                exit 1
              fi
              echo "online_faas_fleet_runners=${count}"
              ;;
            401|403|404)
              echo "::warning::GitHub API returned HTTP ${http_status} while listing runners; the labeled runs-on scheduler remains the final gate"
              ;;
            *)
              echo "::error::unexpected GitHub runner-list response HTTP ${http_status}" >&2
              exit 1
              ;;
          esac

  deploy:
    name: Join or roll compute node ${{ needs.preflight.outputs.node }}
    needs: preflight
    if: needs.preflight.result == 'success'
    environment: production
    runs-on: [self-hosted, linux, faas-fleet]
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      NODE: ${{ needs.preflight.outputs.node }}
      SSH_HOST: ${{ needs.preflight.outputs.ssh_host }}
      SSH_USER: ${{ needs.preflight.outputs.ssh_user }}
      SSH_PORT: ${{ needs.preflight.outputs.ssh_port }}
      SSH_HOST_KEY_SHA256: ${{ needs.preflight.outputs.ssh_host_key_sha256 }}
      STORAGE_DEVICE: ${{ needs.preflight.outputs.storage_device }}
      FORMAT_STORAGE: ${{ needs.preflight.outputs.format_storage }}
      FLEET_BUNDLE_URL: ${{ inputs.fleet_bundle_url }}
      FLEET_BUNDLE_SIGNATURE_URL: ${{ inputs.fleet_bundle_signature_url }}
      FLEET_BUNDLE_SHA256: ${{ inputs.fleet_bundle_sha256 }}
      FLEET_BUNDLE_AUTH_TOKEN: ${{ secrets.FLEET_BUNDLE_AUTH_TOKEN }}
      # These are environment secrets, not repository files. The runner
      # must be trusted and should be ephemeral or dedicated to deployments.
      COMPUTE_SSH_KEY: ${{ secrets.COMPUTE_SSH_KEY }}
      COMPUTE_DATABASE_URL: ${{ secrets.COMPUTE_DATABASE_URL }}
      # The operator CLI registers the release and activates the node from
      # the runner, so it also needs the same DSN in its process environment.
      # The join play writes it to the adopted host separately.
      FAAS_PG_DSN: ${{ secrets.COMPUTE_DATABASE_URL }}
      COMPUTE_STORAGE_ENV: ${{ secrets.COMPUTE_STORAGE_ENV }}
      COMPUTE_PKI_TARBALL_B64: ${{ secrets.COMPUTE_PKI_TARBALL_B64 }}
      COMPUTE_SIGN_KEY: ${{ secrets.COMPUTE_SIGN_KEY }}
      COMPUTE_VERIFY_KEY: ${{ secrets.COMPUTE_VERIFY_KEY }}
      COMPUTE_ANSIBLE_VARS_B64: ${{ secrets.COMPUTE_ANSIBLE_VARS_B64 }}
      COMPUTE_BOX_AGE_KEY: ${{ secrets.COMPUTE_BOX_AGE_KEY }}
      COMPUTE_RCLONE_ENVELOPE_B64: ${{ secrets.COMPUTE_RCLONE_ENVELOPE_B64 }}
      COMPUTE_ARCHIVE_ENVELOPE_B64: ${{ secrets.COMPUTE_ARCHIVE_ENVELOPE_B64 }}

    steps:
      - name: Check out the release source and Ansible roles
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Check fleet runner prerequisites
        run: |
          set -euo pipefail
          for tool in curl jq sha256sum tar base64 ansible-playbook; do
            command -v "$tool" >/dev/null || {
              echo "::error::the faas-fleet runner must provide $tool" >&2
              exit 1
            }
          done

      - name: Require fleet runner disk headroom
        run: |
          set -euo pipefail
          # The bootstrap CLI verifies a signed release in a private temp
          # directory and the join artifact keeps a second copy. Fail early
          # with an actionable diagnostic instead of allowing a mid-join
          # "no space left on device" failure.
          minimum_free_kb=$((5 * 1024 * 1024))
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          [[ "$free_kb" =~ ^[0-9]+$ ]] || {
            echo "::error::could not determine free space on fleet runner" >&2
            exit 1
          }
          if (( free_kb < minimum_free_kb )); then
            echo "::error::fleet runner has only ${free_kb} KiB free; at least ${minimum_free_kb} KiB is required" >&2
            echo "::error::prune old /opt/faas/releases entries or repair runner retention before retrying" >&2
            exit 1
          fi
          df -h "$RUNNER_TEMP"

      - name: Install pinned cosign verifier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tools"
          # The fleet runner is long-lived and Ansible provisions the same
          # pinned verifier at /usr/local/bin/cosign. Reuse it when its bytes
          # match the release pin; compiling Cosign from source on every
          # 2-vCPU runner made an otherwise small rollout take 10+ minutes.
          # Keep a verified download fallback so a freshly provisioned or
          # repaired runner remains self-healing without trusting PATH state.
          COSIGN_SHA256=8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
          COSIGN_DEST="$RUNNER_TEMP/release-tools/cosign"
          if [[ -x /usr/local/bin/cosign ]] &&
            echo "$COSIGN_SHA256  /usr/local/bin/cosign" | sha256sum -c - >/dev/null 2>&1; then
            install -m 0755 /usr/local/bin/cosign "$COSIGN_DEST"
          else
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              -o "$COSIGN_DEST" \
              https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
            echo "$COSIGN_SHA256  $COSIGN_DEST" | sha256sum -c -
            chmod 0755 "$COSIGN_DEST"
          fi

      - name: Download and verify the canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::release_tag must be a release tag, got $RELEASE_TAG" >&2
            exit 1
          }
          RELEASE_ROOT="$RUNNER_TEMP/gregale-compute-release"
          mkdir -p "$RELEASE_ROOT"
          download_asset() {
            local asset="$1"
            local asset_url
            asset_url="$(curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" |
              jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url')"
            curl --fail --silent --show-error --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              -o "$RELEASE_ROOT/$asset" "$asset_url"
          }
          for asset in release.tar.gz release.cosign.bundle release.sbom.json \
            release-manifest.json production-manifest.yaml runtime-bases.env SHA256SUMS; do
            download_asset "$asset"
          done
          (
            cd "$RELEASE_ROOT"
            sha256sum -c SHA256SUMS
          )
          "$RUNNER_TEMP/release-tools/cosign" verify-blob \
            --bundle "$RELEASE_ROOT/release.cosign.bundle" \
            --certificate-identity-regexp '^https://github\.com/poyrazK/faas/\.github/workflows/release\.yml@refs/tags/.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RELEASE_ROOT/release.tar.gz"
          mkdir -p "$RELEASE_ROOT/unpacked"
          tar --extract --gzip --file "$RELEASE_ROOT/release.tar.gz" \
            --directory "$RELEASE_ROOT/unpacked" release-manifest.json
          cmp "$RELEASE_ROOT/unpacked/release-manifest.json" "$RELEASE_ROOT/release-manifest.json"
          RELEASE_ID="$(jq -er '.git_sha' "$RELEASE_ROOT/release-manifest.json")"
          RELEASE_MANIFEST_HASH="$(jq -er '.manifest_hash' "$RELEASE_ROOT/release-manifest.json")"
          ACTUAL_MANIFEST_HASH="sha256:$(sha256sum "$RELEASE_ROOT/production-manifest.yaml" | awk '{print $1}')"
          [[ "$RELEASE_MANIFEST_HASH" == "$ACTUAL_MANIFEST_HASH" ]] || {
            echo "::error::signed release manifest hash does not match production-manifest.yaml" >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n1 "$RELEASE_TAG")"
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}$ && "$RELEASE_ID" == "$TAG_COMMIT" ]] || {
            echo "::error::signed release git_sha does not match the selected tag" >&2
            exit 1
          }
          echo "RELEASE_ROOT=$RELEASE_ROOT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Assemble the standard join artifact directory
        run: |
          set -euo pipefail
          for required in COMPUTE_SSH_KEY COMPUTE_DATABASE_URL COMPUTE_STORAGE_ENV \
            COMPUTE_PKI_TARBALL_B64 COMPUTE_SIGN_KEY COMPUTE_VERIFY_KEY; do
            [[ -n "${!required:-}" ]] || {
              echo "::error::production secret $required is not configured" >&2
              exit 1
            }
          done
          ARTIFACT_DIR="$RUNNER_TEMP/gregale-compute-join"
          mkdir -p "$ARTIFACT_DIR"
          for asset in release.tar.gz release.cosign.bundle release.sbom.json production-manifest.yaml; do
            install -m 0644 "$RELEASE_ROOT/$asset" "$ARTIFACT_DIR/$asset"
          done
          # This file is a release contract, not a secret, but keep the
          # controller-side copy private because it is immediately staged as
          # root:root 0600 on the adopted host.
          install -m 0600 "$RELEASE_ROOT/runtime-bases.env" "$ARTIFACT_DIR/runtime-bases.env"
          tar --extract --gzip --file "$RELEASE_ROOT/release.tar.gz" \
            --to-stdout gregalectl > "$ARTIFACT_DIR/gregalectl-linux-amd64"
          chmod 0755 "$ARTIFACT_DIR/gregalectl-linux-amd64"
          tar --extract --gzip --file "$RELEASE_ROOT/release.tar.gz" \
            --to-stdout vmlinux > "$ARTIFACT_DIR/vmlinux"
          test -s "$ARTIFACT_DIR/vmlinux"
          chmod 0644 "$ARTIFACT_DIR/vmlinux"
          install -m 0755 "$RUNNER_TEMP/release-tools/cosign" "$ARTIFACT_DIR/cosign-linux-amd64"

          umask 077
          printf '%s\n' "$COMPUTE_SSH_KEY" > "$ARTIFACT_DIR/compute-ssh-key"
          printf '%s\n' "DATABASE_URL=$COMPUTE_DATABASE_URL" > "$ARTIFACT_DIR/compute-db.env"
          # vmmd intentionally reads its explicit split-box override while
          # the operator CLI and the other compute daemons use DATABASE_URL.
          # Keep both names in the same root-only file so a new node cannot
          # pass the CLI preflight and then fail closed during vmmd startup.
          printf '%s\n' "FAAS_VMMD_DBURL=$COMPUTE_DATABASE_URL" >> "$ARTIFACT_DIR/compute-db.env"
          printf '%s\n' "$COMPUTE_STORAGE_ENV" > "$ARTIFACT_DIR/storage.env"
          printf '%s\n' "$COMPUTE_SIGN_KEY" > "$ARTIFACT_DIR/sign.key"
          printf '%s\n' "$COMPUTE_VERIFY_KEY" > "$ARTIFACT_DIR/sign-pub.pem"

          printf '%s' "$COMPUTE_PKI_TARBALL_B64" | base64 --decode > "$RUNNER_TEMP/compute-pki.tar.gz"
          if tar -tzf "$RUNNER_TEMP/compute-pki.tar.gz" | grep -Eq '(^/|(^|/)\.\./)'; then
            echo "::error::COMPUTE_PKI_TARBALL_B64 contains an unsafe archive path" >&2
            exit 1
          fi
          PKI_EXTRACT_DIR="$RUNNER_TEMP/compute-pki-extracted"
          mkdir -p "$PKI_EXTRACT_DIR"
          tar --extract --gzip --file "$RUNNER_TEMP/compute-pki.tar.gz" \
            --directory "$PKI_EXTRACT_DIR" --no-same-owner --no-same-permissions
          if find "$PKI_EXTRACT_DIR" -type l -print -quit | grep -q .; then
            echo "::error::COMPUTE_PKI_TARBALL_B64 must not contain symlinks" >&2
            exit 1
          fi
          # Accept both archive shapes emitted by the operator tooling:
          #   pki/ca/ca.crt       (documented bundle-root form)
          #   ca/ca.crt           (archive made from the TLS directory)
          # Normalize either shape to the prepare-node contract.
          if [[ -f "$PKI_EXTRACT_DIR/pki/ca/ca.crt" ]]; then
            PKI_SOURCE="$PKI_EXTRACT_DIR/pki"
          elif [[ -f "$PKI_EXTRACT_DIR/ca/ca.crt" ]]; then
            PKI_SOURCE="$PKI_EXTRACT_DIR"
          else
            echo "::error::COMPUTE_PKI_TARBALL_B64 must contain pki/ca/ca.crt or ca/ca.crt" >&2
            exit 1
          fi
          mkdir -p "$ARTIFACT_DIR/pki"
          cp -a "$PKI_SOURCE/." "$ARTIFACT_DIR/pki/"
          test -f "$ARTIFACT_DIR/pki/ca/ca.crt"

          if [[ -n "${COMPUTE_ANSIBLE_VARS_B64:-}" ]]; then
            printf '%s' "$COMPUTE_ANSIBLE_VARS_B64" | base64 --decode > "$ARTIFACT_DIR/ansible-vars.yml"
            chmod 0600 "$ARTIFACT_DIR/ansible-vars.yml"
          fi
          if [[ -n "${COMPUTE_BOX_AGE_KEY:-}" ]]; then
            printf '%s\n' "$COMPUTE_BOX_AGE_KEY" > "$ARTIFACT_DIR/box-age-key"
          fi
          if [[ -n "${COMPUTE_RCLONE_ENVELOPE_B64:-}" ]]; then
            printf '%s' "$COMPUTE_RCLONE_ENVELOPE_B64" | base64 --decode > "$ARTIFACT_DIR/rclone.conf.age"
          fi
          if [[ -n "${COMPUTE_ARCHIVE_ENVELOPE_B64:-}" ]]; then
            printf '%s' "$COMPUTE_ARCHIVE_ENVELOPE_B64" | base64 --decode > "$ARTIFACT_DIR/archive-creds.json.age"
          fi
          if [[ -n "$FLEET_BUNDLE_URL" ]]; then
            [[ -n "$FLEET_BUNDLE_AUTH_TOKEN" ]] || {
              echo "::error::FLEET_BUNDLE_AUTH_TOKEN is required for signed bundle dispatches" >&2
              exit 1
            }
            [[ "$FLEET_BUNDLE_URL" =~ ^https://.+ ]] || {
              echo "::error::fleet_bundle_url must use https://" >&2
              exit 1
            }
            [[ "$FLEET_BUNDLE_SIGNATURE_URL" =~ ^https://.+ ]] || {
              echo "::error::fleet_bundle_signature_url must use https://" >&2
              exit 1
            }
            [[ "$FLEET_BUNDLE_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::fleet_bundle_sha256 must match sha256:<64 lowercase hex>" >&2
              exit 1
            }
            bundle_args=(--fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer ${FLEET_BUNDLE_AUTH_TOKEN}")
            curl "${bundle_args[@]}" -o "$ARTIFACT_DIR/fleet-enrollment.yaml" "$FLEET_BUNDLE_URL"
            curl "${bundle_args[@]}" -o "$ARTIFACT_DIR/fleet-enrollment.cosign.bundle" "$FLEET_BUNDLE_SIGNATURE_URL"
            actual="sha256:$(sha256sum "$ARTIFACT_DIR/fleet-enrollment.yaml" | awk '{print $1}')"
            [[ "$actual" == "$FLEET_BUNDLE_SHA256" ]] || {
              echo "::error::FleetEnrollmentBundle digest does not match the dispatch input" >&2
              exit 1
            }
            chmod 0600 "$ARTIFACT_DIR/fleet-enrollment.yaml" "$ARTIFACT_DIR/fleet-enrollment.cosign.bundle"
          fi
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Publish the release-pinned kernel to shared storage
        env:
          # Publishing uses the exact storage.env contract that is staged on
          # the node. `--no-cache` keeps the trusted runner from treating its
          # local filesystem as a second artifact source.
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$ARTIFACT_DIR/gregalectl-linux-amd64" artifact publish \
            --env-file "$ARTIFACT_DIR/storage.env" \
            --manifest-file "$ARTIFACT_DIR/production-manifest.yaml" \
            --file "$ARTIFACT_DIR/vmlinux" \
            --no-cache \
            --json

      - name: Verify runner prerequisites and adopt the compute host
        env:
          # Keep Go/CLI temporary files inside the runner-owned scratch area
          # so the final cleanup step can reclaim them after an interrupted
          # join.
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The supplied deployment key/user are the fleet operator identity,
          # not only the newly adopted host's identity. Apply them as Ansible
          # defaults so preflight and the control-plane convergence can reach
          # every existing peer; the generated target host vars still retain
          # the provider-specific SSH override and strict host-key policy.
          export ANSIBLE_PRIVATE_KEY_FILE="$ARTIFACT_DIR/compute-ssh-key"
          export ANSIBLE_REMOTE_USER="$SSH_USER"
          export ANSIBLE_REMOTE_PORT="$SSH_PORT"
          JOIN_ARGS=(
            deploy join-node
            --manifest-file "$ARTIFACT_DIR/production-manifest.yaml"
            --node "$NODE"
            --ssh-key "$ARTIFACT_DIR/compute-ssh-key"
            --release-tarball "$ARTIFACT_DIR/release.tar.gz"
            --artifact-dir "$ARTIFACT_DIR"
            --repo-root "$GITHUB_WORKSPACE"
            --timeout 25m
            --lease-ttl 35m
            # A failed preflight or convergence leaves a durable failed job.
            # This workflow is the retry-safe owner of the exact desired
            # node/release state, so resume that state instead of requiring
            # manual database cleanup after a transient prerequisite failure.
            --resume
            --yes
            --json
          )
          # The CLI verifies the live provider address with ssh-keyscan and
          # gives Ansible a temporary known_hosts file pinned to this exact
          # fingerprint. Never fall back to the runner's ambient known_hosts
          # or disable strict host-key checking for a production join.
          [[ -n "$SSH_HOST_KEY_SHA256" ]] || {
            echo "::error::resolved SSH host-key fingerprint is empty" >&2
            exit 1
          }
          JOIN_ARGS+=(--ssh-host-key-sha256 "$SSH_HOST_KEY_SHA256")
          if [[ -n "$FLEET_BUNDLE_URL" ]]; then
            JOIN_ARGS+=(
              --fleet-bundle-file "$ARTIFACT_DIR/fleet-enrollment.yaml"
              --fleet-bundle-signature "$ARTIFACT_DIR/fleet-enrollment.cosign.bundle"
              --fleet-replay-state /var/lib/faas-runner/fleet-enrollment-used
            )
          else
            JOIN_ARGS+=(
              --ssh-host "$SSH_HOST"
              --ssh-user "$SSH_USER"
              --ssh-port "$SSH_PORT"
            )
            if [[ -n "$STORAGE_DEVICE" ]]; then
              JOIN_ARGS+=(--storage-device "$STORAGE_DEVICE")
            fi
            if [[ "$FORMAT_STORAGE" == "true" ]]; then
              JOIN_ARGS+=(--format-storage)
            fi
          fi
          if [[ -f "$ARTIFACT_DIR/ansible-vars.yml" ]]; then
            JOIN_ARGS+=(--ansible-vars-file "$ARTIFACT_DIR/ansible-vars.yml")
          fi
          "$ARTIFACT_DIR/gregalectl-linux-amd64" "${JOIN_ARGS[@]}"

      - name: Show post-join identity without exposing secrets
        if: always()
        run: |
          set -euo pipefail
          echo "release=${RELEASE_ID:-unknown} node=$NODE ssh_host=$SSH_HOST"
          echo "The join command is the readiness/activation gate; inspect its JSON result above."

      - name: Clean compute rollout scratch
        if: always()
        run: |
          set +e
          rm -rf -- \
            "$RUNNER_TEMP/gregale-compute-release" \
            "$RUNNER_TEMP/gregale-compute-join" \
            "$RUNNER_TEMP/compute-pki.tar.gz" \
            "$RUNNER_TEMP/compute-pki-extracted" \
            "$RUNNER_TEMP/release-tools"
          find "$RUNNER_TEMP" -maxdepth 1 -mindepth 1 -type d \
            \( -name 'gregalectl-release-bootstrap-*' -o -name 'release-cosign-*' -o -name 'release-tarball-*' \) \
            -mmin +10 -exec rm -rf -- {} +
