name: ops-request-evidence-component-hotfix
run-name: RC231 request evidence hotfix ${{ inputs.operation }} (${{ inputs.release_tag }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed tag of the qualified RC231 backport
        required: true
        type: string
      operation:
        description: Read-only inspection or component activation
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - apply

concurrency:
  group: production-us-platform-rollout
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gateway-hotfix:
    name: Verify RC231 compute gateways and optionally apply the signed hotfix
    if: github.repository == 'poyrazK/faas' && github.ref == 'refs/heads/main'
    environment: production-us
    runs-on: [self-hosted, linux, faas-fleet-us]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Verify rollback and artifact contracts
        run: python3 -m unittest discover -s scripts/ops -p 'request_evidence_hotfix_test.py' -v

      - name: Install pinned signature verifier
        env:
          COSIGN_VERSION: 2.4.1
          COSIGN_SHA256: 8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
        shell: bash
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/request-evidence-cosign"
          curl --fail --location --retry 3 --output "$verifier" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_SHA256" "$verifier" | sha256sum --check --strict
          chmod 755 "$verifier"

      - name: Inspect or apply the exact-source gateway hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          COMPUTE_SSH_KEY: ${{ secrets.COMPUTE_SSH_KEY }}
          HOTFIX_TAG: ${{ inputs.release_tag }}
          HOTFIX_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/request_evidence_hotfix.py \
            --cosign "$RUNNER_TEMP/request-evidence-cosign" \
            --operation "$HOTFIX_OPERATION"

      - name: Preserve activation, inspection, and rollback receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-evidence-component-hotfix-${{ github.run_id }}
          path: |
            request-evidence-hotfix-receipt.json
            request-evidence-image-evidence
          if-no-files-found: error
          retention-days: 14
