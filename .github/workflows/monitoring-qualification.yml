name: monitoring-qualification

# Manual only. Exercise emits real notifications; prepare is read-only.
# See docs/ops/monitoring-qualification.md for receipt scope and watchdog testing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare reads intent; exercise sends real test notifications; record imports operator-attested receipts"
        type: choice
        default: prepare
        options: [prepare, exercise, record]
      deploy_environment:
        description: "Target GitHub deployment environment"
        type: choice
        default: production-us
        options: [production, production-us]
      source_run_id:
        description: "record only: workflow run ID of the completed exercise"
        type: string
        default: ""
      source_run_attempt:
        description: "record only: attempt that produced the exercise artifact"
        type: string
        default: "1"
      receipts_json:
        description: "record only: completed receipt-template.json; hashes/timestamps only, no URLs or credentials"
        type: string
        default: "{}"

permissions:
  contents: read
  actions: read

concurrency:
  group: monitoring-qualification-${{ inputs.deploy_environment }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ${{ fromJSON(inputs.deploy_environment == 'production-us' && '["self-hosted","linux","faas-fleet-us"]' || '["ubuntu-latest"]') }}
    environment: ${{ inputs.deploy_environment }}
    timeout-minutes: 10
    env:
      QUALIFICATION_FLEET: ${{ inputs.deploy_environment }}
      QUALIFICATION_REPORT: qualification-output/report.json
      QUALIFICATION_MODE: ${{ inputs.mode }}
      QUALIFICATION_SOURCE_RUN: ${{ inputs.source_run_id }}
      QUALIFICATION_SOURCE_ATTEMPT: ${{ inputs.source_run_attempt }}
      CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize unknown qualification evidence
        run: python3 scripts/ops/monitoring_qualification.py --mode initialize

      - name: Validate source selection
        if: inputs.mode == 'record'
        run: |
          [[ "$QUALIFICATION_SOURCE_RUN" =~ ^[1-9][0-9]{0,19}$ && "$QUALIFICATION_SOURCE_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || {
            echo '::error::record requires an exercise run ID and attempt'
            exit 1
          }

      - name: Download selected exercise evidence
        if: inputs.mode == 'record'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: monitoring-qualification-${{ inputs.deploy_environment }}-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/qualification-source-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up pinned control-plane SSH and run qualification
        timeout-minutes: 5
        env:
          CP_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
          MONITORING_OPERATOR_TOKEN: ${{ secrets.MONITORING_OPERATOR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_RECEIPTS: ${{ inputs.receipts_json }}
          QUALIFICATION_SOURCE_FILE: ${{ runner.temp }}/qualification-source-${{ github.run_id }}-${{ github.run_attempt }}/report.json
        run: |
          set -euo pipefail
          umask 077
          ssh_temp="$(mktemp -d "$RUNNER_TEMP/monitoring-qualification-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_temp"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          env -u MONITORING_OPERATOR_TOKEN -u GITHUB_TOKEN -u QUALIFICATION_RECEIPTS \
            RUNNER_TEMP="$ssh_temp" bash scripts/ops/canary_ssh.sh setup
          unset CP_SSH_KEY COMPUTE_KNOWN_HOSTS
          export QUALIFICATION_SSH_KEY="$ssh_temp/canary-ssh/deploy_key"
          export QUALIFICATION_SSH_KNOWN_HOSTS="$ssh_temp/canary-ssh/known_hosts"
          python3 scripts/ops/monitoring_qualification.py \
            --mode "$QUALIFICATION_MODE" --source "$QUALIFICATION_SOURCE_FILE"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitoring-qualification-${{ inputs.deploy_environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-output/*.json
          if-no-files-found: warn
          retention-days: 30
