name: MCP contract

on:
  pull_request:
    paths:
      - 'pkg/mcphosting/**'
      - 'pkg/secretscan/**'
      - 'cmd/apid/secretscan*.go'
      - 'cmd/apid/handlers_templates*.go'
      - 'pkg/apihostingscorecard/**'
      - 'pkg/productcap/**'
      - 'cmd/gregale/**'
      - '.github/workflows/mcp-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/gregale/templates/mcp-node/package-lock.json
      - name: Portable MCP and secret-scanner contracts
        run: go test -race -p=1 ./pkg/mcphosting ./pkg/secretscan ./pkg/apihostingscorecard ./cmd/gregale ./cmd/apid -run 'TestMCP|TestStateless|TestClient|TestCall|TestLegacyStateless|TestMirrored|TestConfigRequires|TestOAuthDiscovery|TestNpmIntegrity|TestScanExtractedMCP|TestListTemplates|TestScorecard' -count=1
      - name: Build CLI and materialize starter outside the embed tree
        run: |
          go build -o "$RUNNER_TEMP/gregale" ./cmd/gregale
          "$RUNNER_TEMP/gregale" mcp init --path "$RUNNER_TEMP/mcp-starter"
          cd "$RUNNER_TEMP/mcp-starter"
          npm ci --ignore-scripts
          npm test
      - name: Exercise the official SDK through the CLI
        shell: bash
        run: |
          cd "$RUNNER_TEMP/mcp-starter"
          PORT=18808 node server.js > "$RUNNER_TEMP/mcp-server.log" 2>&1 &
          mcp_server_pid=$!
          trap 'kill "$mcp_server_pid" || true' EXIT
          for mcp_attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:18808/healthz > /dev/null; then break; fi
            sleep 0.25
          done
          "$RUNNER_TEMP/gregale" mcp doctor --url http://127.0.0.1:18808/mcp --legacy --stream-tool stream_demo --json
          "$RUNNER_TEMP/gregale" mcp call --url http://127.0.0.1:18808/mcp --tool add --arguments '{"a":7,"b":5}' --json
          "$RUNNER_TEMP/gregale" mcp call --url http://127.0.0.1:18808/mcp --legacy --tool greet --arguments '{"name":"Gregale"}' --json
          "$RUNNER_TEMP/gregale" mcp lock --url http://127.0.0.1:18808/mcp --out "$RUNNER_TEMP/mcp-baseline.json" --json
          "$RUNNER_TEMP/gregale" mcp lock --url http://127.0.0.1:18808/mcp --out "$RUNNER_TEMP/mcp-candidate.json" --json
          "$RUNNER_TEMP/gregale" mcp diff --before "$RUNNER_TEMP/mcp-baseline.json" --after "$RUNNER_TEMP/mcp-candidate.json" --check --json
          "$RUNNER_TEMP/gregale" mcp lock --url http://127.0.0.1:18808/mcp --legacy --out "$RUNNER_TEMP/mcp-legacy.json" --json
