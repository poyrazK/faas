name: MCP contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only this suite's own code. Shared hot paths (pkg/api, pkg/state,
    # pkg/apid, migrations, go.mod, cmd/gregale) changed on nearly every
    # pull request; ci.yml runs this suite nightly and in the release gate.
    paths:
      - 'pkg/mcphosting/**'
      - 'pkg/mcpmanagement/**'
      - 'pkg/apphealth/**'
      - 'pkg/apid/apidserver/handlers_app_health*'
      - 'pkg/apid/apidserver/binding_release_traffic*'
      - 'pkg/gateway/mcp_policy*'
      - 'scripts/ops/management-mcp-client-acceptance.py'
      - 'scripts/ops/management-mcp-metrics-acceptance.py'
      - 'scripts/ops/management-mcp-drain-acceptance.py'
      - 'scripts/ops/management-mcp-admin-acceptance.py'
      - 'scripts/ops/management-mcp-native-acceptance*'
      - 'scripts/ops/fixtures/management-mcp/**'
      - 'scripts/ci/management-mcp-client/**'
      - 'pkg/apid/apidserver/handlers_mcp_policy*'
      - 'pkg/apid/apidserver/browser_auth_mcp*'
      - 'pkg/apid/apidserver/browser_promotion*'
      - 'pkg/dashboard/templates/mcp_approval.html'
      - 'pkg/apid/apidserver/handlers_cli_auth*'
      - 'pkg/apid/apidserver/handlers_release_review*'
      - 'pkg/apid/apidserver/handlers_source_ref*'
      - 'pkg/apid/apidserver/handlers_source_review*'
      - 'pkg/apid/apidserver/source_review_manifest*'
      - 'pkg/apid/apidserver/deployment_create_error*'
      - 'pkg/apid/apidsource/**'
      - 'pkg/state/release_review*'
      - 'pkg/state/reviewed*'
      - 'pkg/state/scoped_telemetry*'
      - 'pkg/state/scoped_route_monitor*'
      - 'pkg/state/pgstore_route_monitor.go'
      - 'pkg/routemonitor/**'
      - 'pkg/state/sqlc/scoped_telemetry*'
      - 'pkg/api/scoped_telemetry.go'
      - 'pkg/apid/apidserver/scoped_telemetry*'
      - 'pkg/apid/apidserver/scoped_route_monitor*'
      - 'pkg/apid/apidserver/handlers_routes.go'
      - 'pkg/apid/apidserver/handlers_app_operational_summary.go'
      - 'pkg/state/service_rollout_bindings*'
      - 'pkg/apid/apidserver/handlers_workload_rollout*'
      - 'pkg/apid/apidserver/handlers_rollouts.go'
      - 'pkg/apid/apidserver/service_rollout_recovery.go'
      - 'pkg/apid/apidserver/binding_release_recovery.go'
      - 'pkg/api/rollout_recovery.go'
      - 'pkg/state/sqlc/release_review*'
      - 'pkg/api/mcp_policy*'
      - 'pkg/apid/apidserver/handlers_mcp_policy*'
      - 'scripts/ci/mcp-qualification-check.py'
      - 'scripts/ci/test_mcp_qualification*.py'
      - 'scripts/ops/mcp-qualification.py'
      - 'scripts/ops/mcp-sdk-client/**'
      - 'pkg/secretscan/**'
      - 'pkg/apid/apidserver/secretscan*.go'
      - 'pkg/apid/apidserver/handlers_templates*.go'
      - 'pkg/apihostingscorecard/**'
      - 'pkg/productcap/**'
      - '.github/workflows/mcp-contract.yml'
      - '.github/workflows/mcp-catalog-check.yml'
      - 'scripts/ci/mcp-catalog-contract.mjs'
      - 'scripts/ci/mcp-catalog-check.sh'
      - 'testdata/mcp-catalog/**'
  # Nightly and release gate: ci.yml calls this workflow.
  workflow_call:
  workflow_dispatch:
    inputs:
      qualification-manifest:
        description: Repository-relative evidence manifest; omit for portable checks only
        type: string
        required: false
      reviewed-commit:
        description: Full source commit qualified by the native/provider evidence
        type: string
        required: false

# Only the newest push to a pull request is interesting; without a group every
# superseded push kept its runners until completion.
concurrency:
  # A literal name: when ci.yml calls this workflow, github.workflow is the
  # caller's name, which the other called suites would share.
  group: mcp-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/cmd/gregale=-dwarf=false -c=1" "-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1"'

jobs:
  management-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' }}
      # Pull requests restore main's setup-go cache read-only. Saving a ~1 GB
      # copy per pull-request ref overflowed the 10 GB repository cache and
      # evicted ci-light's main families, so light jobs compiled cold.
      - name: restore Go cache from main (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: setup-go-${{ runner.os }}-x64-ubuntu24-go-pr-restore-only
          restore-keys: |
            setup-go-${{ runner.os }}-x64-ubuntu24-go-
      - name: Native management harness portable checks
        run: |
          python3 scripts/ops/management-mcp-native-acceptance_test.py
          for scenario in scripts/ops/fixtures/management-mcp/*.json; do
            python3 scripts/ops/management-mcp-native-acceptance.py "$scenario" --validate-only
          done
      - name: Management MCP contracts
        run: go test -race -p=1 ./pkg/mcpmanagement ./pkg/apphealth ./pkg/apid/apidsource ./pkg/routemonitor -count=1
      - name: Build Gregale management server
        id: management-build
        run: go build -p=1 -o "$RUNNER_TEMP/gregale-management" ./cmd/gregale
      - name: Private management metrics and listener cleanup
        if: ${{ !cancelled() && steps.management-build.outcome == 'success' }}
        shell: bash
        run: >-
          python3 scripts/ops/management-mcp-metrics-acceptance.py
          --gregale-binary "$RUNNER_TEMP/gregale-management"
          | tee "$RUNNER_TEMP/management-mcp-metrics.json"
      - name: Management SIGTERM drain and encrypted state reopening
        if: ${{ !cancelled() && steps.management-build.outcome == 'success' }}
        shell: bash
        run: >-
          python3 scripts/ops/management-mcp-drain-acceptance.py
          --gregale-binary "$RUNNER_TEMP/gregale-management"
          | tee "$RUNNER_TEMP/management-mcp-drain.json"
      - name: Private operator connections and socket controls
        if: ${{ !cancelled() && steps.management-build.outcome == 'success' }}
        shell: bash
        run: >-
          python3 scripts/ops/management-mcp-admin-acceptance.py
          --gregale-binary "$RUNNER_TEMP/gregale-management"
          | tee "$RUNNER_TEMP/management-mcp-admin.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ci/management-mcp-client/package-lock.json
      - name: Install pinned Codex client
        run: npm ci --prefix scripts/ci/management-mcp-client --ignore-scripts --no-audit --no-fund
      - name: Real Codex discovery and read acceptance
        run: >-
          python3 scripts/ops/management-mcp-client-acceptance.py --fixture
          --gregale-binary "$RUNNER_TEMP/gregale-management"
          --codex-binary scripts/ci/management-mcp-client/node_modules/.bin/codex
          | tee "$RUNNER_TEMP/management-mcp-client.json"
      - name: Real Codex remote OAuth, restart, refresh and revocation
        run: |
          GREGALE_MCP_CODEX_BINARY="$GITHUB_WORKSPACE/scripts/ci/management-mcp-client/node_modules/.bin/codex" \
          GREGALE_MCP_CLIENT_REPORT="$RUNNER_TEMP/management-mcp-remote.json" \
            go test -race -p=1 ./pkg/mcpmanagement -run TestCodexRemoteOAuthAcceptance -count=1 -v
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.management-build.outcome == 'success' }}
        with:
          name: management-mcp-client-acceptance
          path: |
            ${{ runner.temp }}/management-mcp-client.json
            ${{ runner.temp }}/management-mcp-remote.json
            ${{ runner.temp }}/management-mcp-metrics.json
            ${{ runner.temp }}/management-mcp-drain.json
            ${{ runner.temp }}/management-mcp-admin.json
          if-no-files-found: error

  go-contracts:
    runs-on: ubuntu-latest
    # Cold race compilation of the state and CLI test units can consume the
    # former twenty-minute job budget before the final contracts execute.
    timeout-minutes: 45
    services:
      postgres:
        # Match the shared CI cache to avoid Docker Hub pull limits.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: mcp
          POSTGRES_DB: mcp
          POSTGRES_PASSWORD: mcp-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Restore-only: use the same trusted main race-build cache as the API
      # contracts job; avoid a separate setup-go cache per pull-request ref.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + module cache from main
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pg-1-${{ runner.os }}-
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false  # restored from main above
      - name: Portable MCP and secret-scanner contracts
        env:
          GOMEMLIMIT: 2GiB
          GOGC: 10
          GOMAXPROCS: 2
        run: go test -race -p=1 ./pkg/mcphosting ./pkg/gateway ./pkg/api ./pkg/state ./pkg/secretscan ./pkg/apihostingscorecard ./cmd/gregale -run 'TestScopedRouteMonitor|TestScopedTelemetry|TestScopedWorkerObservation|TestWorkerRolloutObservationHTTP|TestReviewedWorkloadRollout|TestMemReviewedRollout|TestPgReviewedRollout|TestMemReviewedServiceRecovery|TestPgReviewedServiceRecovery|TestMemReviewedPinnedServiceReadiness|TestPgReviewedPinnedServiceReadiness|TestReviewedNativeSource|TestReviewedSourceRef|TestSourceRef_|TestReleaseReviewHTTP|TestMemReleaseReview|TestPgReleaseReview|TestMemReviewedNamedStaging|TestPgReviewedNamedStaging|TestMCP|TestStateless|TestClient|TestCall|TestLegacyStateless|TestMirrored|TestConfig|TestOAuth|TestMem_UpdateDeploymentTraffic_Expected|TestNpmIntegrity|TestScanExtractedMCP|TestListTemplates|TestScorecard' -count=1

  # Core contracts and starter qualification use independent runners and
  # databases; run their cold race builds in parallel.
  starter:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Cold race builds of the API package precede all three runtime qualifiers.
    timeout-minutes: 45
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: mcp
          POSTGRES_DB: mcp
          POSTGRES_PASSWORD: mcp-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Restore-only: read main's non-race `checks` Go cache instead of letting
      # setup-go save a ~0.8 GB entry per pull-request ref, which evicted main's
      # CI cache families from the 10 GB repository budget.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + module cache from main
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-checks-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-checks-${{ runner.os }}-
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false  # restored from main above
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cmd/gregale/templates/mcp-node/package-lock.json
            scripts/ops/mcp-sdk-client/package-lock.json
      - name: Portable MCP and secret-scanner contracts
        env:
          GOMEMLIMIT: 2GiB
          GOGC: 30
          GOMAXPROCS: 2
        run: go test -race -p=1 ./pkg/mcphosting ./pkg/gateway ./pkg/api ./pkg/state ./pkg/secretscan ./pkg/apihostingscorecard ./cmd/gregale ./pkg/apid/apidserver -run 'TestMCP|TestStateless|TestClient|TestCall|TestLegacyStateless|TestMirrored|TestConfig|TestOAuth|TestMem_UpdateDeploymentTraffic_Expected|TestNpmIntegrity|TestScanExtractedMCP|TestListTemplates|TestScorecard' -count=1
      - name: Validate the release evidence gate
        run: python3 -m unittest discover -s scripts/ci -p 'test_mcp_qualification*.py'
      - name: Gate supplied native and provider qualification evidence
        if: github.event_name == 'workflow_dispatch' && inputs.qualification-manifest != ''
        env:
          MCP_QUALIFICATION_MANIFEST: ${{ inputs.qualification-manifest }}
          MCP_REVIEWED_COMMIT: ${{ inputs.reviewed-commit }}
        run: python3 scripts/ci/mcp-qualification-check.py "$MCP_QUALIFICATION_MANIFEST" --commit "$MCP_REVIEWED_COMMIT"
      - name: Build CLI and materialize starter outside the embed tree
        env:
          MCP_TASKS_TEST_DATABASE_URL: postgres://mcp:mcp-ci-only@127.0.0.1:5432/mcp
          MCP_TASKS_REQUIRE_POSTGRES: "1"
        run: |
          go build -o "$RUNNER_TEMP/gregale" ./cmd/gregale
          "$RUNNER_TEMP/gregale" mcp init --path "$RUNNER_TEMP/mcp-starter"
          "$RUNNER_TEMP/gregale" mcp init --runtime go --path "$RUNNER_TEMP/mcp-go"
          "$RUNNER_TEMP/gregale" mcp init --runtime python --path "$RUNNER_TEMP/mcp-python"
          python3 -m venv "$RUNNER_TEMP/mcp-python-venv"
          "$RUNNER_TEMP/mcp-python-venv/bin/python" -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/mcp-python/requirements.txt"
          cd "$RUNNER_TEMP/mcp-go"
          go test ./...
          cd "$RUNNER_TEMP/mcp-python"
          "$RUNNER_TEMP/mcp-python-venv/bin/python" -m unittest discover -s . -p 'test_*.py'
          cd "$RUNNER_TEMP/mcp-starter"
          npm ci --ignore-scripts
          MCP_TASKS_TEST_DATABASE_URL='postgres://mcp:mcp-ci-only@127.0.0.1:5432/mcp' MCP_TASKS_REQUIRE_POSTGRES=1 npm test
      - name: Qualify task restart and replica recovery
        env:
          MCP_TASKS_TEST_DATABASE_URL: postgres://mcp:mcp-ci-only@127.0.0.1:5432/mcp
        run: |
          node "$RUNNER_TEMP/mcp-starter/test/tasks-restart-qualification.mjs" \
            --target "MCP contract workflow / $GITHUB_SHA" \
            --confirm-disposable-database
      - name: Gate reader and writer catalogs without executing tools
        shell: bash
        run: |
          cp scripts/ci/mcp-catalog-contract.mjs "$RUNNER_TEMP/mcp-starter/mcp-catalog-contract.mjs"
          node "$RUNNER_TEMP/mcp-starter/mcp-catalog-contract.mjs" "$RUNNER_TEMP/gregale" "$GITHUB_WORKSPACE/testdata/mcp-catalog" "$GITHUB_WORKSPACE/scripts/ci/mcp-catalog-check.sh"
      - name: Exercise the Gregale MCP CLI
        shell: bash
        run: |
          cd "$RUNNER_TEMP/mcp-starter"
          PORT=18808 node server.js > "$RUNNER_TEMP/mcp-server.log" 2>&1 &
          mcp_server_pid=$!
          trap 'kill "$mcp_server_pid" || true' EXIT
          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:18808/healthz > /dev/null; then break; fi
            sleep 0.25
          done
          "$RUNNER_TEMP/gregale" mcp doctor --url http://127.0.0.1:18808/mcp --legacy --stream-tool stream_demo --json
          "$RUNNER_TEMP/gregale" mcp call --url http://127.0.0.1:18808/mcp --tool add --arguments '{"a":7,"b":5}' --json
          "$RUNNER_TEMP/gregale" mcp call --url http://127.0.0.1:18808/mcp --legacy --tool greet --arguments '{"name":"Gregale"}' --json
          "$RUNNER_TEMP/gregale" mcp lock --url http://127.0.0.1:18808/mcp --out "$RUNNER_TEMP/mcp-baseline.json" --json
          "$RUNNER_TEMP/gregale" mcp lock --url http://127.0.0.1:18808/mcp --out "$RUNNER_TEMP/mcp-candidate.json" --json
          "$RUNNER_TEMP/gregale" mcp diff --before "$RUNNER_TEMP/mcp-baseline.json" --after "$RUNNER_TEMP/mcp-candidate.json" --check --json
          "$RUNNER_TEMP/gregale" mcp lock --url http://127.0.0.1:18808/mcp --legacy --out "$RUNNER_TEMP/mcp-legacy.json" --json
      - name: Install the pinned official MCP client
        run: npm ci --prefix scripts/ops/mcp-sdk-client --ignore-scripts
      - name: Qualify all starter runtimes with the official MCP SDK
        shell: bash
        run: |
          cd "$RUNNER_TEMP/mcp-go"
          go build -o "$RUNNER_TEMP/mcp-go-server" .
          PORT=18809 "$RUNNER_TEMP/mcp-go-server" > "$RUNNER_TEMP/mcp-go-server.log" 2>&1 &
          mcp_go_pid=$!
          cd "$RUNNER_TEMP/mcp-python"
          PORT=18810 "$RUNNER_TEMP/mcp-python-venv/bin/python" server.py > "$RUNNER_TEMP/mcp-python-server.log" 2>&1 &
          mcp_python_pid=$!
          cd "$RUNNER_TEMP/mcp-starter"
          PORT=18808 node server.js > "$RUNNER_TEMP/mcp-node-sdk-server.log" 2>&1 &
          mcp_node_pid=$!
          cleanup() {
            kill "$mcp_node_pid" "$mcp_go_pid" "$mcp_python_pid" 2>/dev/null || true
            wait "$mcp_node_pid" "$mcp_go_pid" "$mcp_python_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for health in \
            http://127.0.0.1:18808/healthz \
            http://127.0.0.1:18809/healthz \
            http://127.0.0.1:18810/healthz; do
            ready=0
            for _ in {1..80}; do
              if curl -fsS "$health" > /dev/null; then ready=1; break; fi
              sleep 0.25
            done
            if [[ "$ready" != 1 ]]; then
              echo "MCP starter failed to become ready: $health" >&2
              exit 1
            fi
          done
          node "$GITHUB_WORKSPACE/scripts/ops/mcp-sdk-client/interop.mjs" \
            --node-url http://127.0.0.1:18808/mcp \
            --go-url http://127.0.0.1:18809/mcp \
            --python-url http://127.0.0.1:18810/mcp \
            --target "MCP contract workflow / $GITHUB_SHA"

  apid-contract:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: mcp
          POSTGRES_DB: mcp
          POSTGRES_PASSWORD: mcp-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Restore-only: read main's `unit tests (pg shard 1)` Go cache, which
      # race-builds cmd/apid with the same GOFLAGS as below, instead of letting
      # setup-go save a ~0.8 GB entry per pull-request ref that evicted main's
      # CI cache families from the 10 GB repository budget.
      - id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: restore Go build + module cache from main
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-pg-1-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pg-1-${{ runner.os }}-
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false  # restored from main above
      - name: Portable API server MCP contracts
        # A cold cmd/apid race build exhausts hosted-runner memory and the
        # runner is shut down (exit 143). Mirror ci.yml unit-tests-pg-1: omit
        # test DWARF, serialize the apid backend and bound the Go heap.
        env:
          GOFLAGS: '"-gcflags=github.com/onebox-faas/faas/pkg/apid/apidserver=-dwarf=false -c=1"'
          GOMEMLIMIT: 2GiB
          GOGC: 30
          GOMAXPROCS: 2
        run: go test -race -v -p=1 ./pkg/apid/apidserver -run 'TestScopedRouteMonitor|TestScopedTelemetry|TestScopedWorkerObservation|TestWorkerRolloutObservationHTTP|TestReviewedWorkloadRollout|TestMemReviewedRollout|TestPgReviewedRollout|TestMemReviewedServiceRecovery|TestPgReviewedServiceRecovery|TestMemReviewedPinnedServiceReadiness|TestPgReviewedPinnedServiceReadiness|TestReviewedNativeSource|TestReviewedSourceRef|TestSourceRef_|TestReleaseReviewHTTP|TestMemReleaseReview|TestPgReleaseReview|TestMemReviewedNamedStaging|TestPgReviewedNamedStaging|TestMCP|TestStateless|TestClient|TestCall|TestLegacyStateless|TestMirrored|TestConfig|TestOAuth|TestMem_UpdateDeploymentTraffic_Expected|TestNpmIntegrity|TestScanExtractedMCP|TestListTemplates|TestScorecard' -count=1
