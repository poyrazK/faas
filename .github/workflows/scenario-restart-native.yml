name: Scenario resilience native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scenario-restart-native-acceptance
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, linux, x64, gregale-scenario-acceptance]
    environment: scenario-acceptance
    timeout-minutes: 800
    env:
      FAAS_API: ${{ vars.GREGALE_ACCEPTANCE_API_URL }}
      GREGALE_DEPENDENCY_DATABASE_URL: ${{ secrets.GREGALE_DEPENDENCY_DATABASE_URL }}
      GREGALE_DEPENDENCY_DATABASE_DISPOSABLE: "1"
      FAAS_TOKEN: ${{ secrets.GREGALE_ACCEPTANCE_TOKEN }}
      FAAS_SCENARIO_ACCEPTANCE_ACCOUNT: ${{ vars.GREGALE_SCENARIO_ACCEPTANCE_ACCOUNT }}
      FAAS_SCENARIO_ACCEPTANCE_PROJECT: native-checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Verify harness contracts
        run: make test-scenario-restart-acceptance
      - name: Exercise native restart, concurrent checkout, pending recovery, caller/dependency restart matrices, TLS authentication stalls, lost COMMIT acknowledgements, COMMIT deadlines, bandwidth restrictions, read interruption, SSLRequest stalls, shared application retry budgets, circuit breakers, bulkheads, combined policies, repeated outage/recovery cycles, dependency isolation and cleanup
        run: make native-scenario-restart-acceptance
      - name: Upload reports and verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-restart-native-${{ github.sha }}
          path: scenario-restart-native-evidence/
          if-no-files-found: warn
          retention-days: 14
