name: Data API staging canary
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-api-staging-canary
  cancel-in-progress: false
jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gregale-data-api-staging]
    environment: data-api-staging
    timeout-minutes: 120
    env:
      FAAS_TOKEN: ${{ secrets.GREGALE_DATA_API_STAGING_TOKEN }}
      STAGING_CONFIG_JSON: ${{ vars.GREGALE_DATA_API_STAGING_CONFIG_JSON }}
      FAAS_DATA_API_EVIDENCE: ${{ github.workspace }}/data-api-staging-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Write staging designation
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/data-api-staging-config.json"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.argv[1], process.env.STAGING_CONFIG_JSON, {mode: 0o600})' "$config_path"
          echo "FAAS_DATA_API_STAGING_CONFIG=$config_path" >> "$GITHUB_ENV"
      - name: Deploy fixtures and verify the customer workflow, load and recovery
        run: make data-api-staging-canary
      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-api-staging-${{ github.sha }}
          path: data-api-staging-evidence.json
          if-no-files-found: warn
          retention-days: 14
