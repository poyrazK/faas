name: internal-pki-renewal

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: >-
          Fleet to renew: the GitHub environment holding its secrets. The
          daily schedule renews every fleet.
        required: false
        default: production-us
        type: choice
        options:
          - production
          - production-us

permissions:
  contents: read

jobs:
  renew:
    name: Renew expiring internal mTLS leaves (${{ matrix.deploy_environment }})
    if: github.repository == 'poyrazK/faas'
    strategy:
      fail-fast: false
      matrix:
        # A dispatch renews the selected fleet; the schedule renews every fleet.
        deploy_environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.deploy_environment) || '["production-us"]') }}
    # Renewal is serialized per fleet. A fleet whose runner is offline must
    # not hold another fleet's renewal in the queue.
    concurrency:
      group: internal-pki-renewal-${{ matrix.deploy_environment }}
      cancel-in-progress: false
    environment: ${{ matrix.deploy_environment }}
    runs-on: ${{ fromJSON(matrix.deploy_environment == 'production-us' && '["self-hosted","linux","faas-fleet-us"]' || '["self-hosted","linux","faas-fleet"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Render the live fleet inventory
        shell: bash
        env:
          CP_HOST: ${{ secrets.CP_HOST || secrets.DO_HOST }}
          CONTROL_PLANE_SSH_KEY: ${{ secrets.CP_SSH_KEY || secrets.DO_SSH_KEY }}
          COMPUTE_SSH_KEY: ${{ secrets.COMPUTE_SSH_KEY }}
          COMPUTE_KNOWN_HOSTS: ${{ secrets.COMPUTE_KNOWN_HOSTS }}
          # The production fleet runs automation as its dedicated faas-runner
          # principal. production-us compute hosts admit the deploy key as
          # root, as its cd-compute rollouts do. Both escalate with become.
          COMPUTE_SSH_USER: ${{ matrix.deploy_environment == 'production-us' && 'root' || 'faas-runner' }}
        run: |
          set -euo pipefail
          [[ "$COMPUTE_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "::error::invalid compute SSH user" >&2
            exit 1
          }
          [[ -n "$CP_HOST" ]] || {
            echo "::error::CP_HOST is required to reach the internal CA" >&2
            exit 1
          }
          inventory_root="$RUNNER_TEMP/pki-live-inventory"
          install -m 0600 /dev/null "$RUNNER_TEMP/pki-deploy-key"
          printf '%s\n' "$COMPUTE_SSH_KEY" > "$RUNNER_TEMP/pki-deploy-key"
          test -s "$RUNNER_TEMP/pki-deploy-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/pki-control-key"
          printf '%s\n' "$CONTROL_PLANE_SSH_KEY" > "$RUNNER_TEMP/pki-control-key"
          test -s "$RUNNER_TEMP/pki-control-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/pki-known-hosts"
          printf '%s\n' "$COMPUTE_KNOWN_HOSTS" > "$RUNNER_TEMP/pki-known-hosts"
          test -s "$RUNNER_TEMP/pki-known-hosts"
          # The runner does not live on the issuer. Reach the control plane
          # over SSH with the control-plane key, pinned the same way the CD
          # workflows pin it, and render the inventory there: the installed
          # release's manifest and gregalectl stay the source of truth.
          ssh-keyscan -t ed25519,ecdsa,rsa -H "$CP_HOST" >> "$RUNNER_TEMP/pki-known-hosts" 2>/dev/null
          cp_ssh=(ssh -i "$RUNNER_TEMP/pki-control-key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/pki-known-hosts" "root@${CP_HOST}")
          mkdir -p "$inventory_root"
          "${cp_ssh[@]}" 'bash -s' > "$RUNNER_TEMP/pki-inventory.tar.gz" <<'REMOTE_RENDER'
          set -euo pipefail
          manifest=/opt/faas/current/production-manifest.yaml
          test -r "$manifest"
          test -r /etc/faas/tls/ca/ca.key
          out="$(mktemp -d /var/tmp/gregale-pki-inventory.XXXXXXXX)"
          [[ "$out" == /var/tmp/gregale-pki-inventory.* ]] || exit 1
          trap 'rm -rf -- "$out"' EXIT
          /usr/local/bin/gregalectl manifest ansible \
            --manifest-file "$manifest" --output-dir "$out" >&2
          tar -C "$out" -czf - .
          REMOTE_RENDER
          if tar -tzf "$RUNNER_TEMP/pki-inventory.tar.gz" | grep -Eq '(^/|(^|/)\.\./)'; then
            echo "::error::rendered inventory contains an unsafe archive path" >&2
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/pki-inventory.tar.gz" -C "$inventory_root"
          mkdir -p "$inventory_root/inventory/group_vars"
          cat >> "$inventory_root/inventory/group_vars/all.yml" <<'EOF'
          # The compute deployment key is bound to the fleet's automation
          # principal on every compute node.
          ansible_user: __PKI_COMPUTE_USER__
          ansible_ssh_private_key_file: __PKI_DEPLOY_KEY__
          ansible_ssh_common_args: >-
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=__PKI_KNOWN_HOSTS__
          EOF
          sed -i \
            -e "s|__PKI_COMPUTE_USER__|$COMPUTE_SSH_USER|" \
            -e "s|__PKI_DEPLOY_KEY__|$RUNNER_TEMP/pki-deploy-key|" \
            -e "s|__PKI_KNOWN_HOSTS__|$RUNNER_TEMP/pki-known-hosts|" \
            "$inventory_root/inventory/group_vars/all.yml"
          control_host="$(awk '
            /^\[control_plane\]$/ { in_group=1; next }
            /^\[/ { in_group=0 }
            in_group && NF { print $1; exit }
          ' "$inventory_root/inventory/hosts.ini")"
          test -n "$control_host"
          control_vars="$inventory_root/inventory/host_vars/${control_host}.yml"
          test -f "$control_vars"
          sed -i "s|^ansible_host:.*|ansible_host: \"${CP_HOST}\"|" "$control_vars"
          cat >> "$control_vars" <<'EOF'
          # The issuer is reached through the pinned control-plane address with
          # the control-plane key, while compute hosts retain the compute-only
          # deployment key.
          ansible_user: root
          ansible_ssh_private_key_file: __PKI_CONTROL_KEY__
          EOF
          sed -i \
            -e "s|__PKI_CONTROL_KEY__|$RUNNER_TEMP/pki-control-key|" \
            "$control_vars"
          echo "PKI_INVENTORY=$inventory_root/inventory/hosts.ini" >> "$GITHUB_ENV"

      - name: Run serialized fleet renewal
        run: ansible-playbook -i "$PKI_INVENTORY" deploy/ansible/pki_renew.yml

      - name: Remove transient SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/pki-live-inventory" "$RUNNER_TEMP/pki-inventory.tar.gz" "$RUNNER_TEMP/pki-deploy-key" "$RUNNER_TEMP/pki-control-key" "$RUNNER_TEMP/pki-known-hosts"
