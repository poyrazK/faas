syntax = "proto3";

package onebox.faas.apid.v1;

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/apid/v1;apidpb";

// RealtimeHistory is private to trusted daemons. Endpoint authentication and
// channel authorization are enforced by realtimed before a client can cause
// this read; the RPC must never be forwarded to a public HTTP route.
service RealtimeHistory {
  rpc ReadChannelHistory(ReadChannelHistoryRequest) returns (ReadChannelHistoryResponse);
}

message ReadChannelHistoryRequest {
  string endpoint_id = 1;
  string channel = 2;
  int64 after_sequence = 3;
  int32 limit = 4;
}

message ReadChannelHistoryResponse {
  repeated RetainedChannelMessage messages = 1;
  int64 oldest_sequence = 2;
  int64 latest_sequence = 3;
  // True means the caller must resynchronize; no partial page is returned.
  bool history_unavailable = 4;
}

message RetainedChannelMessage {
  int64 sequence = 1;
  bytes data = 2;
  bool binary = 3;
  int64 created_at_unix_nano = 4;
}
