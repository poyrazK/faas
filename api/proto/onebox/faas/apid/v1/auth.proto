// auth — production debugger OTLP token-lookup RPC
// (ADR-127 PR-D). gatewayd-public dials apid on /run/faas/auth.sock
// to resolve a Bearer token to the matching account + plan, so the
// OTel spans writer can enforce the same per-plan telemetry caps the
// apid-side IncrementRequestTelemetry receiver already enforces
// (pkg/api/limits.go::DebugTelemetryEnabled / DebugTelemetrySpansPerTrace).
//
// Wire discipline mirrors the sibling apid/v1/request_telemetry.proto
// service: checked-in *.pb.go generated with paths=source_relative,
// auth is the unix-socket DAC model (mode 0660 group `faas`, ADR-015)
// on /run/faas/auth.sock. The transport is plain gRPC — single-box
// mode, no TLS, since the socket file-mode + group membership is the
// only auth in v1.0.
//
// The RPC is unary (not streaming) because token lookup is rare on the
// hot path: gatewayd-public caches the (token → account, plan) tuple
// in-process for the duration of one OTLP POST, mirroring PR-B's
// IncrementRequestTelemetry per-account caps cache.

syntax = "proto3";

package onebox.faas.apid.v1;

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/apid/v1;apidpb";

// Auth is the gRPC service apid exposes on /run/faas/auth.sock for
// the gatewayd-public OTel spans writer (ADR-127 PR-D). Single RPC
// resolves a Bearer token to the matching account + plan so the
// gateway can enforce per-plan telemetry caps without holding a
// direct Postgres connection (CLAUDE.md ownership: apid is the
// sole writer to api_keys; gatewayd-public never opens a direct
// connection for this path).
service Auth {
  // AuthenticateKey resolves the bearer token to the matching
  // account + plan. The server hashes the incoming token with SHA-256
  // and looks it up in api_keys (the OTel spans writer never sees
  // the raw token again — the hash travels across the unix socket
  // boundary and the writer discards the original). Errors map to
  // gRPC codes:
  //   - InvalidArgument when token is empty
  //   - Unauthenticated when no api_keys row matches the hash
  //   - PermissionDenied when the key cannot write traces: none of
  //     admin, deploy:write or metrics:write, or a key bound to a
  //     company whose holder may no longer deploy there
  //   - NotFound when the tracing capability is not released to the
  //     key's account (ADR-20261023115741); the endpoint answers as a
  //     route that does not exist
  //   - Internal on Postgres errors
  rpc AuthenticateKey(AuthenticateKeyRequest) returns (AuthenticateKeyResponse);

  // AuthenticateCredential resolves a bearer credential for a gateway
  // (ADR 20261029202403). Credential hashes are keyed by a secret only
  // apid holds, so gatewayd-internal and gatewayd-public cannot look
  // them up themselves; they send the presented token's SHA-256 and get
  // back the account and key the shared auth middleware needs. An
  // unknown, expired or revoked credential is an outcome, not an error;
  // errors are Internal (store failures) and InvalidArgument.
  rpc AuthenticateCredential(AuthenticateCredentialRequest) returns (AuthenticateCredentialResponse);

  // MatchCredential reports whether a stored credential hash is the one a
  // presented token may hold (ADR 20261029202403). A gateway that loads a
  // row by another key (a consumer key's prefix, a fork's ID) sends the
  // stored value and the token's SHA-256; apid answers yes or no, never a
  // digest. Only columns gateways check are accepted (InvalidArgument
  // otherwise).
  rpc MatchCredential(MatchCredentialRequest) returns (MatchCredentialResponse);
}

message MatchCredentialRequest {
  // column — the credential column, e.g. "consumer_keys.hashed_secret".
  string column = 1;
  // stored — the value read from that column.
  bytes stored = 2;
  // sha256 — the SHA-256 of the presented token.
  bytes sha256 = 3;
}

message MatchCredentialResponse {
  bool match = 1;
}

// CredentialKind names which credential family a lookup is for.
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  // An account API key (api_keys).
  CREDENTIAL_KIND_API_KEY = 1;
  // A short-lived OIDC-exchanged bearer (oidc_exchanged_tokens).
  CREDENTIAL_KIND_OIDC_BEARER = 2;
}

// CredentialOutcome is what a lookup found.
enum CredentialOutcome {
  CREDENTIAL_OUTCOME_UNSPECIFIED = 0;
  CREDENTIAL_OUTCOME_OK = 1;
  CREDENTIAL_OUTCOME_NOT_FOUND = 2;
  CREDENTIAL_OUTCOME_EXPIRED = 3;
  CREDENTIAL_OUTCOME_REVOKED = 4;
}

message AuthenticateCredentialRequest {
  CredentialKind kind = 1;
  // sha256 — the SHA-256 of the presented token (32 bytes). The raw
  // token never leaves the gateway.
  bytes sha256 = 2;
}

message AuthenticateCredentialResponse {
  CredentialOutcome outcome = 1;
  // account_json and key_json are the JSON of state.Account and
  // state.APIKey; set only when outcome is OK. JSON, not a mirrored
  // message, so a field apid adds reaches the gateway's middleware
  // without a protocol change.
  bytes account_json = 2;
  bytes key_json = 3;
}

// AuthenticateKeyRequest is one bearer-token lookup. The token field
// carries the raw token as sent in the Authorization header (i.e.
// the value AFTER `Bearer ` is stripped). Field numbers are aligned
// with the IncrementRequestTelemetryRequest for grep-ability; new
// fields append at the end (the .pb.go regen produces a new struct
// that callers migrate to).
message AuthenticateKeyRequest {
  // token — raw bearer token from the OTLP POST's Authorization
  // header. Server-side sha256-hashes it; the original is
  // discarded immediately after the lookup.
  string token = 1;
}

// AuthenticateKeyResponse is the resolved (account_id, plan) tuple.
// plan is the api.Plan string ("free"/"hobby"/"pro"/"scale") so the
// gateway can compute telemetry caps locally without a follow-up
// limits RPC.
message AuthenticateKeyResponse {
  // account_id — UUID of the matching account (apps.account_id).
  // Empty when outcome != "ok" (the gateway treats empty as
  // "unknown customer" and drops the batch).
  string account_id = 1;

  // plan — api.Plan string ("free"/"hobby"/"pro"/"scale").
  // Empty when outcome != "ok". For a key bound to a company
  // organization that owns its resources, the organization's plan.
  string plan = 2;

  // app_id — set when the credential is bound to one app: its spans
  // merge only into that app's request rows.
  string app_id = 3;

  // org_id — set when the key is bound to a company organization: its
  // spans merge into rows of that organization's apps, whoever created
  // them, instead of rows of the holder's own apps.
  string org_id = 4;
}