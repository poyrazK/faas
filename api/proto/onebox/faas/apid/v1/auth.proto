// auth — production debugger OTLP token-lookup RPC
// (ADR-127 PR-D). gatewayd-public dials apid on /run/faas/auth.sock
// to resolve a Bearer token to the matching account + plan, so the
// OTel spans writer can enforce the same per-plan telemetry caps the
// apid-side IncrementRequestTelemetry receiver already enforces
// (pkg/api/limits.go::DebugTelemetryEnabled / DebugTelemetrySpansPerTrace).
//
// Wire discipline mirrors the sibling apid/v1/request_telemetry.proto
// service: checked-in *.pb.go generated with paths=source_relative,
// auth is the unix-socket DAC model (mode 0660 group `faas`, ADR-015)
// on /run/faas/auth.sock. The transport is plain gRPC — single-box
// mode, no TLS, since the socket file-mode + group membership is the
// only auth in v1.0.
//
// The RPC is unary (not streaming) because token lookup is rare on the
// hot path: gatewayd-public caches the (token → account, plan) tuple
// in-process for the duration of one OTLP POST, mirroring PR-B's
// IncrementRequestTelemetry per-account caps cache.

syntax = "proto3";

package onebox.faas.apid.v1;

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/apid/v1;apidpb";

// Auth is the gRPC service apid exposes on /run/faas/auth.sock for
// the gatewayd-public OTel spans writer (ADR-127 PR-D). Single RPC
// resolves a Bearer token to the matching account + plan so the
// gateway can enforce per-plan telemetry caps without holding a
// direct Postgres connection (CLAUDE.md ownership: apid is the
// sole writer to api_keys; gatewayd-public never opens a direct
// connection for this path).
service Auth {
  // AuthenticateKey resolves the bearer token to the matching
  // account + plan. The server hashes the incoming token with SHA-256
  // and looks it up in api_keys (the OTel spans writer never sees
  // the raw token again — the hash travels across the unix socket
  // boundary and the writer discards the original). Errors map to
  // gRPC codes:
  //   - InvalidArgument when token is empty
  //   - Unauthenticated when no api_keys row matches the hash
  //   - PermissionDenied when the key cannot write traces: none of
  //     admin, deploy:write or metrics:write, or a key bound to a
  //     company whose holder may no longer deploy there
  //   - NotFound when the tracing capability is not released to the
  //     key's account (ADR-20261023115741); the endpoint answers as a
  //     route that does not exist
  //   - Internal on Postgres errors
  rpc AuthenticateKey(AuthenticateKeyRequest) returns (AuthenticateKeyResponse);

  // AuthenticateCredential resolves a bearer credential for a gateway
  // (ADR 20261029202403). Credential hashes are keyed by a secret only
  // apid holds, so gatewayd-internal and gatewayd-public cannot look
  // them up themselves; they send the presented token's SHA-256 and get
  // back the account and key the shared auth middleware needs. An
  // unknown, expired or revoked credential is an outcome, not an error;
  // errors are Internal (store failures) and InvalidArgument.
  rpc AuthenticateCredential(AuthenticateCredentialRequest) returns (AuthenticateCredentialResponse);

  // MatchCredential reports whether a stored credential hash is the one a
  // presented token may hold (ADR 20261029202403). A gateway that loads a
  // row by another key (a consumer key's prefix, a fork's ID) sends the
  // stored value and the token's SHA-256; apid answers yes or no, never a
  // digest. Only columns gateways check are accepted (InvalidArgument
  // otherwise).
  rpc MatchCredential(MatchCredentialRequest) returns (MatchCredentialResponse);

  // VerifySession opens a dashboard session cookie for a gateway that must
  // not hold the session key: a process that can open a cookie can also
  // seal one (ADR-20261102191500). apid answers with the envelope it sealed,
  // or valid=false for a cookie that is malformed, forged or expired. The
  // caller still checks the session row itself. Errors are InvalidArgument
  // (empty cookie) and Unavailable (apid has no session manager).
  rpc VerifySession(VerifySessionRequest) returns (VerifySessionResponse);

  // SandboxTokenKeys returns the public keys that verify sandbox session
  // tokens (ADR-20261027090013 §3). apid signs them with an Ed25519 key
  // derived from its session key; a gateway verifies with these and cannot
  // mint one (ADR-20261102191500). Unavailable: apid has no session key.
  rpc SandboxTokenKeys(SandboxTokenKeysRequest) returns (SandboxTokenKeysResponse);

  // DecideAgentRequest runs the agent approval gate for a gateway
  // (ADR-20261111150000): apid is the only writer of approval requests, so
  // a gateway serving a route that needs a person's approval (the
  // developer debugger tunnel) asks apid. apid loads the key, classifies
  // the pattern itself, and uses an approval or records a new request.
  // Errors are InvalidArgument, NotFound (no such key on the account) and
  // Unavailable (no gate, or the store failed).
  rpc DecideAgentRequest(DecideAgentRequestRequest) returns (DecideAgentRequestResponse);

  // RecordAgentActivity writes one agent activity row for a gateway
  // (ADR-20261111150000); apid is the only writer of the activity log.
  // Errors are InvalidArgument, NotFound and Unavailable.
  rpc RecordAgentActivity(RecordAgentActivityRequest) returns (RecordAgentActivityResponse);

  // EnrollOAuthConsumer returns the API consumer a verified OAuth caller of
  // an app's MCP server is, creating it on the app's free plan the first
  // time (ADR-20261124094745): apid is the only writer of consumers, so a
  // gateway that verified the caller's token asks apid. Errors are
  // InvalidArgument, NotFound (no such app or free plan), FailedPrecondition
  // (the app does not enroll OAuth callers), ResourceExhausted (the app took
  // its sign-ups for the day) and Unavailable.
  rpc EnrollOAuthConsumer(EnrollOAuthConsumerRequest) returns (EnrollOAuthConsumerResponse);

  // ConsumerUpgradeLink returns the hosted upgrade page link for a consumer
  // that reached its plan's limit (ADR-20261124094745), or an empty url when
  // the app does not let customers change plans. The link expires; it opens
  // only the consumer's plan change. Errors are InvalidArgument, NotFound
  // (no such app on the account) and Unavailable.
  rpc ConsumerUpgradeLink(ConsumerUpgradeLinkRequest) returns (ConsumerUpgradeLinkResponse);

  // LinkOAuthConsumer points a verified OAuth caller of an app's MCP server
  // at the consumer whose key the caller proved (ADR-20261124094745), and
  // revokes the consumer the caller's first sign-in enrolled. The gateway
  // verifies the token; apid verifies the key. Errors are InvalidArgument,
  // PermissionDenied (the key is not a live key of this app's consumer),
  // FailedPrecondition (the app does not enroll OAuth callers),
  // AlreadyExists (the identity is linked to another key's consumer; the
  // owner unlinks it first) and Unavailable.
  rpc LinkOAuthConsumer(LinkOAuthConsumerRequest) returns (LinkOAuthConsumerResponse);

  // ConsumerAccountTool answers one of the account tools the gateway adds
  // to an MCP server for its OAuth consumers (ADR-20261125194510):
  // account_usage or account_plans. The result is the tool's JSON. Errors
  // are InvalidArgument (an unknown tool or bad IDs), NotFound (no such app
  // or consumer on the account), FailedPrecondition (the app's account
  // tools are off) and Unavailable.
  rpc ConsumerAccountTool(ConsumerAccountToolRequest) returns (ConsumerAccountToolResponse);
}

message ConsumerAccountToolRequest {
  string account_id = 1;
  string app_id = 2;
  string consumer_id = 3;
  // tool is account_usage or account_plans.
  string tool = 4;
}

message ConsumerAccountToolResponse {
  // result_json is the tool's answer: pkg/api MCPAccountUsage or
  // MCPAccountPlans.
  bytes result_json = 1;
}

message LinkOAuthConsumerRequest {
  string account_id = 1;
  string app_id = 2;
  // issuer and subject are the verified token's iss and sub claims.
  string issuer = 3;
  string subject = 4;
  string email = 5;
  // key is the consumer key the caller sent; apid compares its hash.
  string key = 6;
}

message LinkOAuthConsumerResponse {
  string consumer_id = 1;
  // revoked_consumer_id is the enrolled consumer the link closed, if any.
  string revoked_consumer_id = 2;
}

message ConsumerUpgradeLinkRequest {
  string account_id = 1;
  string app_id = 2;
  string consumer_id = 3;
}

message ConsumerUpgradeLinkResponse {
  // url is empty when the app offers no upgrade.
  string url = 1;
  int64 expires_at_unix_ms = 2;
}

message EnrollOAuthConsumerRequest {
  string account_id = 1;
  string app_id = 2;
  // issuer and subject are the verified token's iss and sub claims.
  string issuer = 3;
  string subject = 4;
  // email is the token's email claim, when it has one; it names the
  // consumer and is never used to match one.
  string email = 5;
}

message EnrollOAuthConsumerResponse {
  string consumer_id = 1;
  // active is false for a revoked or closed consumer: the gateway refuses it.
  bool active = 2;
  // created reports a new consumer.
  bool created = 3;
  // account_tools reports the app's opt-in to account tools
  // (ADR-20261125194510).
  bool account_tools = 4;
}

message DecideAgentRequestRequest {
  string account_id = 1;
  string key_id = 2;
  // pattern — the request's route pattern, e.g. "GET /v1/apps/{slug}/debug".
  string pattern = 3;
  // method, path (escaped, with its query) and body_sha256 bind the
  // approval to the request, as the HTTP gate binds it.
  string method = 4;
  string path = 5;
  bytes body_sha256 = 6;
  // reason — the sanitized Gregale-Agent-Reason header.
  string reason = 7;
}

message DecideAgentRequestResponse {
  bool allow = 1;
  // approval_id — the approval the request went through on, if any.
  string approval_id = 2;
  // problem — the RFC 7807 answer as JSON when allow is false.
  bytes problem = 3;
}

message RecordAgentActivityRequest {
  string account_id = 1;
  string key_id = 2;
  string method = 3;
  string path = 4;
  int32 status = 5;
  string approval_id = 6;
  string reason = 7;
  // created_at_unix_ms — when the gateway answered.
  int64 created_at_unix_ms = 8;
}

message RecordAgentActivityResponse {}

message SandboxTokenKeysRequest {}

message SandboxTokenKeysResponse {
  repeated SandboxTokenKey keys = 1;
}

// SandboxTokenKey is one Ed25519 public key and the ID tokens name it by.
message SandboxTokenKey {
  string id = 1;
  bytes public_key = 2;
}

message MatchCredentialRequest {
  // column — the credential column, e.g. "consumer_keys.hashed_secret".
  string column = 1;
  // stored — the value read from that column.
  bytes stored = 2;
  // sha256 — the SHA-256 of the presented token.
  bytes sha256 = 3;
}

message MatchCredentialResponse {
  bool match = 1;
}

message VerifySessionRequest {
  // cookie is the session cookie's value as the browser sent it.
  string cookie = 1;
}

message VerifySessionResponse {
  bool valid = 1;
  // envelope is the session envelope's JSON (pkg/session.Envelope), set
  // when valid. JSON keeps new envelope fields off this message.
  bytes envelope = 2;
}

// CredentialKind names which credential family a lookup is for.
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  // An account API key (api_keys).
  CREDENTIAL_KIND_API_KEY = 1;
  // A short-lived OIDC-exchanged bearer (oidc_exchanged_tokens).
  CREDENTIAL_KIND_OIDC_BEARER = 2;
}

// CredentialOutcome is what a lookup found.
enum CredentialOutcome {
  CREDENTIAL_OUTCOME_UNSPECIFIED = 0;
  CREDENTIAL_OUTCOME_OK = 1;
  CREDENTIAL_OUTCOME_NOT_FOUND = 2;
  CREDENTIAL_OUTCOME_EXPIRED = 3;
  CREDENTIAL_OUTCOME_REVOKED = 4;
}

message AuthenticateCredentialRequest {
  CredentialKind kind = 1;
  // sha256 — the SHA-256 of the presented token (32 bytes). The raw
  // token never leaves the gateway.
  bytes sha256 = 2;
}

message AuthenticateCredentialResponse {
  CredentialOutcome outcome = 1;
  // account_json and key_json are the JSON of state.Account and
  // state.APIKey; set only when outcome is OK. JSON, not a mirrored
  // message, so a field apid adds reaches the gateway's middleware
  // without a protocol change.
  bytes account_json = 2;
  bytes key_json = 3;
}

// AuthenticateKeyRequest is one bearer-token lookup. The token field
// carries the raw token as sent in the Authorization header (i.e.
// the value AFTER `Bearer ` is stripped). Field numbers are aligned
// with the IncrementRequestTelemetryRequest for grep-ability; new
// fields append at the end (the .pb.go regen produces a new struct
// that callers migrate to).
message AuthenticateKeyRequest {
  // token — raw bearer token from the OTLP POST's Authorization
  // header. Server-side sha256-hashes it; the original is
  // discarded immediately after the lookup.
  string token = 1;
}

// AuthenticateKeyResponse is the resolved (account_id, plan) tuple.
// plan is the api.Plan string ("free"/"hobby"/"pro"/"scale") so the
// gateway can compute telemetry caps locally without a follow-up
// limits RPC.
message AuthenticateKeyResponse {
  // account_id — UUID of the matching account (apps.account_id).
  // Empty when outcome != "ok" (the gateway treats empty as
  // "unknown customer" and drops the batch).
  string account_id = 1;

  // plan — api.Plan string ("free"/"hobby"/"pro"/"scale").
  // Empty when outcome != "ok". For a key bound to a company
  // organization that owns its resources, the organization's plan.
  string plan = 2;

  // app_id — set when the credential is bound to one app: its spans
  // merge only into that app's request rows.
  string app_id = 3;

  // org_id — set when the key is bound to a company organization: its
  // spans merge into rows of that organization's apps, whoever created
  // them, instead of rows of the holder's own apps.
  string org_id = 4;
}