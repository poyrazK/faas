// log_events — runtime log projection into the customer log ledger
// (ADR-20261018083536 slice B, ADR-213). vmmd classifies each guest line as
// it enters the instance ring and forwards the warn and error lines, within a
// per-app budget, to apid; apid redacts them and inserts source=runtime rows.
// apid stays the only database writer.
//
// Transport: the service shares the SpansWriter listeners vmmd already dials
// for guest traces (/run/faas/otel_spans_writer.sock single-box, the private
// mTLS listener split-box), so it adds no socket or certificate.

syntax = "proto3";

package onebox.faas.apid.v1;

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/apid/v1;apidpb";

// LogEvents receives bounded runtime log projections from vmmd.
service LogEvents {
  // RecordRuntimeLogEvents inserts one batch. A disabled receiver returns
  // UNAVAILABLE; vmmd then pauses forwarding instead of retrying each batch.
  // Replays converge on the same rows through source_event_id.
  rpc RecordRuntimeLogEvents(RecordRuntimeLogEventsRequest) returns (RecordRuntimeLogEventsResponse);
}

// RuntimeLogEvent is one guest log line vmmd classified as warn or error, or
// one system line reporting how many lines a budget dropped.
message RuntimeLogEvent {
  // app_id, deployment_id, instance_id — host-owned identity from the
  // scheduler's correlation envelope. apid derives the account from app_id.
  string app_id = 1;
  string deployment_id = 2;
  string instance_id = 3;

  // source_event_id — stable replay key: "<instance>:<ring seq>" for guest
  // lines, "budget:<app>:<minute>" for drop summaries.
  string source_event_id = 4;

  // occurred_at_unix_ms — when the line entered the ring.
  int64 occurred_at_unix_ms = 5;

  // level — warn or error.
  string level = 6;

  // stream — stdout, stderr, or system for vmmd's drop summaries.
  string stream = 7;

  // message — the line, truncated by vmmd to RuntimeLogEventMessageMaxBytes.
  // Not yet redacted; apid redacts before insert.
  string message = 8;
}

message RecordRuntimeLogEventsRequest {
  // events — at most RuntimeLogEventsBatchMax.
  repeated RuntimeLogEvent events = 1;
}

// RecordRuntimeLogEventsResponse counts the batch's outcomes. Rejected events
// failed validation or named an unknown app; rate_limited events exceeded the
// account's per-minute cap. Neither is worth retrying.
message RecordRuntimeLogEventsResponse {
  int32 inserted = 1;
  int32 rejected = 2;
  int32 rate_limited = 3;
}
