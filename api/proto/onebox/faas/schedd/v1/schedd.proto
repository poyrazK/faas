// schedd — the scheduler and instance-lifecycle owner (spec §4.3, ADR-018).
// schedd is the ONLY writer to the `instances` table and the sole owner of the
// state machine (spec §6). This gRPC surface is how gatewayd-internal asks schedd to
// wake an app and reports request activity back; schedd itself dials vmmd
// (api/proto/onebox/faas/vmmd/v1) to drive the actual microVM lifecycle.
//
// Wire discipline mirrors vmmd (ADR-013): checked-in *.pb.go generated with
// paths=source_relative, errors enveloped through pkg/grpcerr, auth is the
// unix-socket DAC model (mode 0660 group `faas`, ADR-015) on
// /run/faas/schedd.sock.

syntax = "proto3";

package onebox.faas.schedd.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/schedd/v1;scheddpb";

// Schedd is the gRPC service schedd exposes on its unix socket. Two RPCs for
// v1.0 — gatewayd-internal is the only caller. Multi-host (Gate-A) replaces the socket
// with mTLS; this ADR-018 surface is per-host.
service Schedd {
  // Wake ensures an instance for the app is running and returns the address
  // the gateway should proxy to. Blocks for the duration of admission +
  // (restore | cold boot) + readiness. Idempotent: a request for an app that
  // already has a running instance returns that instance's address without a
  // new boot. Admission denial (RAM ceiling / plan concurrency / vCPU slots)
  // returns a ResourceExhausted status carrying the RFC 7807 problem so the
  // gateway can serve a 503 (spec §4.3).
  rpc Wake(WakeRequest) returns (WakeResponse);

  // AdmitInstance attempts to admit ONE additional instance for the app
  // (issue #168). Unlike Wake, this RPC skips the Phase-1 fast-path
  // shortcut so a gateway can demand a new instance even when others
  // are already RUNNING. The gateway uses it to fan-out across
  // max_concurrency without hitting the WakeGate's single-flight
  // coalescing.
  //
  // Three outcomes:
  //
  //   - admitted: a new RUNNING instance was created. instance_id,
  //     node_id, method, wake_id are populated.
  //   - at_capacity: the app is already at effective max_concurrency.
  //     at_capacity=true; instance_id/node_id/wake_id are unset. The
  //     gateway treats this as a benign no-op when it already has ≥1
  //     cached target.
  //   - failure: RAM headroom / chooser / store errors. ResourceExhausted
  //     or Internal status carrying the RFC 7807 problem in `problem`.
  //
  // Stability: the wire is additive — adding at_capacity and a
  // separate request/response message is the only contract change.
  // Existing Wake callers are unaffected.
  rpc AdmitInstance(AdmitInstanceRequest) returns (AdmitInstanceResponse);

  // ReportActivity records per-instance last_request_at touches the gateway
  // batches (spec §4.1 flushes every 15 s). schedd persists them because
  // schedd is the ONLY writer to the `instances` table (CLAUDE.md ownership);
  // the gateway keeps the batch in memory between flushes (ADR-018).
  rpc ReportActivity(ReportActivityRequest) returns (ReportActivityResponse);

  // ParkInstance forces an instance to its parked state. Added in M7 so
  // meterd's Free-tier hard-stop can park every live instance on a
  // suspended account (spec §4.7). Reason is for audit logs ("quota_
  // exceeded_free" etc). Returns Ok on success; ResourceExhausted / NotFound
  // for the obvious error paths.
  rpc ParkInstance(ParkInstanceRequest) returns (ParkInstanceResponse);

  // ListInstanceStats returns the per-instance CPU-µs snapshot the
  // schedd's instancestats.Poller maintains (issue #279 / PR-B).
  // meterdsamp the per-minute CPU delta from this snapshot and
  // writes it to usage_minutes.cpu_usec. Returned rows are the
  // same shape the wire rollup observes (pkg/wire.InstanceStatRow
  // is the typed mirror; the proto is wire-stable so adding a
  // field is additive).
  //
  // CPUUsageUsec is the cumulative host cgroup CPU-µs consumed
  // since the cgroup was created. On a cgroup recreation (jailer
  // restart, manual rmdir) the counter resets to a smaller
  // number — callers must treat the reset as a fresh baseline.
  // CPUValid mirrors instancestats.Validity: 0 = Valid, 1 =
  // Unknown (the vmmd cpustats.Cache has no baseline yet, or a
  // post-regression row). Callers MUST skip rows where CPUValid
  // != 0; otherwise the baseline becomes "stuck" on the pre-
  // regression counter and the per-minute delta is meaningless.
  //
  // Additive: the RPC is the only piece of new wire metadata
  // needed for PR-B. The vmmd Stats RPC already carries the per-
  // instance CPU numbers; this RPC is the schedd-side cache of
  // those numbers, refreshed by the poller every 200 ms.
  rpc ListInstanceStats(ListInstanceStatsRequest) returns (ListInstanceStatsResponse);

  // StreamAppLogs (issue #254 / Move 4) fans out an app's per-instance
  // ring buffers back to the caller as a server-streaming response.
  // schedd is the policy owner and the only component allowed to talk
  // to vmmd directly (CLAUDE.md ownership); apid dials this RPC and
  // multiplexes the per-instance frames into a single SSE response.
  //
  // Two phases mirror vmmd's Logs RPC:
  //
  //   1. Initial page — every line with Seq > since_seq, emitted in
  //      per-instance order (then instance order), so a reconnect
  //      carries the same frame sequence the client last saw.
  //   2. Live tail — schedd subscribes to each live instance's
  //      vmmd Logs stream and emits new lines as they arrive. On
  //      instance death (park/snapshot) the per-instance stream ends
  //      and the next frame is a global "end" event.
  //
  // Wire error mapping:
  //
  //   - codes.NotFound when the app has zero live instances — apid
  //     maps this to its 404 "the app is parked; wake it first"
  //   - codes.Unavailable when the vmmd is unreachable for SOME
  //     instances — apid emits a `degraded` event and keeps the
  //     surviving streams open
  //   - codes.OK + nil on clean shutdown
  //
  // Additive per ADR-016: the field tags on existing messages are
  // untouched; new RPC + new messages append at the end.
  rpc StreamAppLogs(StreamAppLogsRequest) returns (stream StreamAppLogsResponse);

  // StreamWarmHints (ADR-025 axis 4) is the sticky-warm affinity push.
  // schedd is the only writer to pkg/sched.WarmAffinity; every successful
  // admit stamps (app_id → node_id) and we forward the stamp as an event
  // so gatewayd-internal's picker (PGBackend.WarmHintFunc) can bias traffic to the
  // warm node on multi-box fleets.
  //
  // Semantics:
  //   - Server-streaming; gatewayd-internal opens one stream at startup and keeps
  //     it open for the lifetime of the connection.
  //   - "Tail from now": no replay cursor, no snapshot on connect. ADR-005
  //     guarantees an empty hint falls through to least-loaded, so a
  //     gatewayd-internal that reconnects with no hint still routes correctly.
  //   - Events are emitted only on state change (RecordWake actually
  //     changed app_id → node_id); a periodic RecordWake to the same node
  //     is a no-op event-source-wise. The producer filters at emit time.
  //
  // Wire error mapping:
  //   - codes.OK + nil on clean shutdown (caller cancels)
  //   - codes.Canceled when the gateway cancels
  //   - codes.Unavailable for any unexpected drain failure
  //
  // Additive per ADR-016: new RPC + new messages append at the end;
  // existing field tags are untouched.
  rpc StreamWarmHints(StreamWarmHintsRequest) returns (stream StreamWarmHintsResponse);

  // ReportCapacity (ADR-025 axis 5) is the vmmd→schedd live-capacity
  // push. vmmd is the gRPC client and opens one stream per daemon at
  // startup, sending a CapacityReport at ~1 s cadence (constant
  // cmd/vmmd.CapacityInterval). schedd updates a per-node in-memory
  // table that the placement chooser reads before falling back to the
  // store's stale-sum aggregate.
  //
  // Trust model: the chooser reads capacity as one input to
  // ChoosePlacement, never as the only input. The per-node
  // AdmissionCeilingMB check inside ChoosePlacement
  // (pkg/sched/placement.go:104-107) and the per-node ledger floor
  // (pkg/sched/engine.go::applyLiveCapacityMB, PR-2) are the
  // load-bearing enforcement; capacity reports inform, never gate.
  // A stale-low or hostile vmmd cannot shrink the live accounting
  // below the ledger's per-node ResidentRAM and force schedd to
  // over-admit (§6.2-2 invariant).
  //
  // Semantics:
  //   - Client-streaming; vmmd is the producer.
  //   - "Tail from now": the consumer accepts reports as they arrive;
  //     a slow vmmd never back-pressures because reports are best-effort.
  //   - An empty capacity table (no reports within
  //     CapacityFreshness = 5 s) falls back to
  //     store.ComputeNodeUsedMB — the legacy single-box behaviour.
  //     Single-box installs without a publisher configured see
  //     identical behaviour to pre-axis-5.
  //
  // Wire error mapping:
  //   - codes.OK + nil on clean shutdown (vmmd cancels after CloseAndRecv
  //     completes)
  //   - codes.Canceled when vmmd cancels mid-stream
  //   - codes.Unavailable for any unexpected drain failure
  //   - codes.InvalidArgument if a report's node_id is empty (a
  //     programming bug in vmmd; the handler must NOT silently drop).
  //
  // Additive per ADR-016: new RPC + new messages append at the end;
  // existing field tags are untouched.
  rpc ReportCapacity(stream CapacityReport) returns (ReportCapacityAck);

  // ReportLivenessFailed (issue #554 / ADR-078) is the vmmd-side
  // push of a per-instance liveness-probe N-consecutive-failure
  // (or timeout / conn-refused) detection. vmmd's poll goroutine
  // dials this RPC whenever the consecutive-failure counter
  // reaches the per-plan N (default 3); schedd's
  // Engine.DestroyForLivenessFailure consumes the report,
  // eagerly marks the deployment's snapshot stale (ADR-005),
  // resets the idle timer, and parks the parent app after 3
  // restarts in 300 s. Idempotent on the wire: re-reporting the
  // same instance id is a no-op on the schedd side because the
  // state-machine guards against destroying a non-RUNNING
  // instance.
  //
  // Reason is the closed set {timeout, conn_refused, conn_err,
  // non_200, n_consecutive} — the same closed set the
  // vmmd_guest_liveness_probe_seconds histogram emits. The
  // schedd Engine stamps the reason into the audit row's
  // data JSON.
  //
  // Additive per ADR-016: new RPC + new messages append at the
  // end; existing field tags are untouched.
  rpc ReportLivenessFailed(LivenessFailedReport) returns (LivenessFailedAck);

  // EnsureWake (ADR-098) is the single-flight-friendly wake entry
  // point. Unlike Wake, it serialises the wake hot path through the
  // engine's per-app wake coordinator (pkg/sched/wake_coord.go) so a
  // concurrent gateway request + cron tick + floor trigger + scaleup
  // trigger + targets trigger all coalesce into one boot. The first
  // caller becomes the leader; followers block on the leader's
  // outcome and inherit the same (RunningInstance, error) they would
  // have seen had they called Engine.Wake / Engine.AdmitInstance
  // directly.
  //
  // Three outcomes:
  //
  //   - already-running: a Row with state RUNNING already exists for
  //     the app. The leader and all followers see the same
  //     EnsureWakeResponse. instance_id / node_id / wake_id are
  //     populated. No vmm RPC fires.
  //   - leader-boot: the leader schedules a new wake via the existing
  //     engine path. Followers wait on the leader's outcome. The
  //     leader's response carries the freshly-minted instance_id /
  //     node_id / wake_id once vmmd returns RUNNING.
  //   - failure: ledger / chooser / store error. ResourceExhausted or
  //     Internal status carrying the RFC 7807 problem in `problem`.
  //     Followers see the same error. A leader that fails to commit
  //     Phase 4 returns FailedPrecondition so the gateway can
  //     distinguish "deliberately reduced" from "VM came up but lost
  //     the race" - the former is retryable, the latter is not.
  //
  // Stability: the wire is additive per ADR-016. Wake / AdmitInstance
  // are unchanged; pre-PR-95 callers observe identical behaviour.
  // Empty WakeMethod in the response means the engine returned the
  // existing-instance fast path (no new boot happened).
  rpc EnsureWake(EnsureWakeRequest) returns (EnsureWakeResponse);
}

message LivenessFailedReport {
  // instance_id is the live Instance id vmmd observed the
  // liveness probe failures on. The schedd engine resolves the
  // parent app + deployment id before destroying.
  string instance_id = 1;
  // reason is the closed-set classifier from the vmmd poll
  // goroutine: timeout / conn_refused / conn_err / non_200 /
  // n_consecutive. Lands in the audit row's data JSON.
  string reason = 2;
}

message LivenessFailedAck {
  // ok is true when the schedd engine accepted the report (a
  // non-RUNNING instance is also "ok" — the state-machine
  // guard makes the destroy a no-op rather than an error so
  // a re-report doesn't trip the gRPC error path).
  bool ok = 1;
}

message WakeRequest {
  // app_id is the apps.id UUID (the gateway resolves host→app before calling).
  string app_id = 1;
  // deployment_id (issue #556 / PR-C) is the optional per-deployment
  // wake hint. When non-empty, schedd wakes an instance on this
  // specific live deployment (the gateway-side weighted picker
  // (PGBackend.Pick) chooses the bucket and forwards the id here
  // so a cold bucket gets a wake instead of falling through to the
  // newest live deployment). Empty = Phase-1 fast path uses the
  // newest live deployment (pre-PR-C behaviour).
  //
  // Additive per ADR-016 — pre-PR-C callers omit the field and
  // observe the existing newest-live behaviour. schedd validates
  // the id against the live deployment set before admitting; an
  // unknown or non-live id is rejected with NotFound so a stale
  // gateway cache can't wake a ghost bucket.
  string deployment_id = 2;
}

// WakeMethod reports whether the wake was a snapshot restore or a cold boot.
// Wire-stable: do NOT reorder; new slots go at the end. Mirrors vmmd's enum so
// the two services agree on the value set.
enum WakeMethod {
  WAKE_COLD_BOOT = 0;
  WAKE_RESTORE   = 1;
}

message WakeResponse {
  // instance_id is the instances.id row schedd created (or reused).
  string instance_id = 1;
  // node_id is the compute_node.id (uuid) the instance lives on
  // (issue #98 / ADR-028 + ADR-047). The gateway looks up the
  // node's per-node gRPC client via its routing cache and forwards
  // the request via the vmmd ForwardHTTPStream RPC. Empty only on
  // the error path.
  //
  // Renamed from the legacy `addr` field (PR #116-era was host_ip:8080,
  // an inner-netns placeholder unreachable from gatewayd-internal on a remote
  // host). Dual semantics were deliberately not preserved — leaving
  // both fields risks a caller picking the wrong one and regressing
  // the hot path silently. The new shape is the only contract.
  string node_id     = 2;
  // method reports what actually happened (a restore that fell back to cold
  // boot per ADR-005 reads WAKE_COLD_BOOT).
  WakeMethod method  = 3;
  // problem carries the RFC 7807 fields on failure. The status code itself is
  // google.rpc.Status via google.golang.org/grpc/status; see pkg/grpcerr. This
  // field mirrors vmmd's WakeResponse and stays unset on success.
  google.protobuf.Struct problem = 4;
  // wake_id is the per-wake-attempt correlation handle (gaps analysis
  // 2026-07-23). UUIDv7 minted by schedd at Wake() Phase 2; the
  // gateway propagates it to the client as x-faas-wake-id and the
  // dashboard / CLI surface it. Distinct from instance_id
  // (instances.id row PK) — instance_id is per-row and stable across
  // PARKED → WAKE cycles; wake_id is per-Wake-attempt and fresh on
  // every call (one row can carry many wake_ids). Empty on the
  // Phase-1 fast-path return where the existing RUNNING instance was
  // minted by an earlier wake — gateway can resolve it via
  // PGBackend.InstanceIDForNodeID if needed.
  string wake_id     = 5;
  // port (issue #460 / ADR-053, PR-C) is the per-deployment override
  // port copied from deployments.override_port (0 = legacy 8080).
  // schedd resolves the live deployment row on the Phase-1 fast
  // path so the value is consistent with AdmitInstanceResponse.port;
  // gateway caches it on Target and stamps it onto ForwardHTTPRequest.
  // Additive per ADR-016.
  int32  port        = 6;
  // deployment_id (issue #556 / PR-C) is the live deployment the
  // wake landed on. Mirrors AdmitInstanceResponse.deployment_id (PR-B);
  // populated on both the Phase-1 fast path (read from the instance
  // row) and the cold-bucket fan-out path (the deployment_id passed
  // in WakeRequest). Empty on error paths.
  //
  // Additive per ADR-016 — pre-PR-C callers ignore the field and
  // observe the same wire response as before.
  string deployment_id = 7;
}

// AdmitInstanceRequest mirrors WakeRequest for the schedule scale-out
// RPC (issue #168). Single field today; kept as a separate message so
// future per-app target hints (placement preference, eager-warm) can
// land on the request without breaking Wake's contract.
message AdmitInstanceRequest {
  string app_id = 1;
  // deployment_id (issue #556 / PR-C) is the optional
  // per-deployment wake hint for the wake-fan-out path. Empty
  // falls through to schedd's default (newest live deployment)
  // — the legacy single-deployment behaviour. Non-empty
  // asks schedd to admit onto that specific live deployment so
  // the picker has a routable Target on retry. Additive per
  // ADR-016.
  string deployment_id = 2;
}

// AdmitInstanceResponse is the typed result of Engine.AdmitInstance.
// On the admitted path it mirrors WakeResponse minus the `problem`
// field (no failure path here — admission refusal is signalled via
// at_capacity=true in the happy case, or a gRPC status carrying the
// RFC 7807 problem on real errors). On the at-capacity path
// instance_id / node_id / wake_id are unset.
message AdmitInstanceResponse {
  string instance_id = 1;
  string node_id     = 2;
  WakeMethod method  = 3;
  string wake_id     = 4;
  // at_capacity is true when the app was already at effective
  // max_concurrency and no new instance was started. The gateway
  // treats this as a benign no-op when it already has ≥1 cached
  // target. Always false on the admitted path.
  bool at_capacity   = 5;
  // problem carries the RFC 7807 fields on real failure (RAM
  // headroom, store error, etc). The status code itself is
  // google.rpc.Status via google.golang.org/grpc/status; see
  // pkg/grpcerr. This field mirrors WakeResponse and stays unset on
  // the admitted / at_capacity paths.
  google.protobuf.Struct problem = 6;
  // port (issue #460 / ADR-053, PR-C) is the per-deployment override
  // port copied from deployments.override_port (0 = legacy 8080).
  // The production gateway path consumes this — set on the admitted
  // path; 0 on the at-capacity path (no instance was admitted).
  // Additive per ADR-016.
  int32  port        = 7;
  // deployment_id (issue #556 / PR-B) is the live deployment the
  // new instance was admitted for. The gateway caches it on
  // Target so the per-deployment weighted picker (PGBackend.Pick)
  // routes subsequent requests to the right deployment bucket.
  // Empty on the at-capacity path (no instance was admitted).
  // Additive per ADR-016.
  string deployment_id = 8;
  // request_count (ADR-098) is the cumulative per-instance request
  // count schedd has observed via the batched ReportActivity /
  // ensure-wake path. The engine stamps it on the admitted path so
  // the gateway's per-instance cache can show "warming up" vs
  // "warmed" without a second round-trip onto the ledger. Read on
  // the warm-snapshot 5th promotion gate (engine.go:3876) which
  // gates promotion to the warm tier until the instance has served
  // a meaningful number of requests.
  //
  // 0 = not yet bumped (post-restore or freshly cold-booted) or the
  // conjoined ReportActivity batch has not yet flushed. Pre-PR
  // callers ignore the field; wire is additive per ADR-016.
  int32  request_count = 9;
}

// Touch is one instance's most-recent request time.
message Touch {
  string instance_id = 1;
  // unix_ms is the request time in Unix milliseconds.
  int64  unix_ms     = 2;
  // request_delta (ADR-098 C9) is the per-instance request count
  // delta the gateway has observed since the last touch. The
  // gateway's per-instance cache (Target.RequestCount) is the
  // authoritative hot path; the engine batched-writer flushes
  // per-instance deltas into the instances.request_count column
  // in the same transaction as last_request_at. 0 = no delta
  // (the gateway observed a request but the per-instance counter
  // already moved — the explicit zero avoids a no-op UPDATE).
  // The increment is additive ("request_count = request_count +
  // delta") so a re-delivered batch is idempotent on
  // Phase-4-loser re-applies, mirroring the writer in
  // pkg/state/pgstore.go::IncInstanceRequestCount.
  // Additive per ADR-016; pre-C9 callers see 0 and the engine
  // falls back to the legacy last_request_at-only path.
  int64  request_delta = 3;
}

message ReportActivityRequest {
  repeated Touch touches = 1;
}

message ReportActivityResponse {
  // applied is the number of touches schedd persisted (rows that matched a
  // known instance). Lets the gateway detect a mass mismatch in tests/metrics.
  int32 applied = 1;
}

// ParkInstanceRequest asks schedd to park one instance. The reason
// string flows through to the audit log + park-reason metric.
message ParkInstanceRequest {
  string instance_id = 1;
  string reason      = 2;
}

message ParkInstanceResponse {
  // ok reports whether the park succeeded. False means the instance
  // was already parked (idempotent) or didn't exist.
  bool ok = 1;
}

// InstanceStatsRow is the schedd-side per-instance stat row that
// meterd reads to compute the per-minute CPU delta. The schema
// mirrors pkg/sched/instancestats.InstanceStat; the wire field
// numbers follow the spec §12 wire convention (additive — new
// slots go at the end).
//
// CPUUsageUsec is cumulative host cgroup CPU-µs since the cgroup
// was created. It is monotonically increasing across the lifetime
// of one cgroup; on a cgroup recreation it resets to a smaller
// number — the caller absorbs the reset (treats the new reading
// as a fresh baseline).
message InstanceStatsRow {
  string instance_id = 1;
  string app_id      = 2;
  string node_id     = 3;
  uint64 cpu_usec    = 4;
  // cpu_valid mirrors instancestats.Validity (0 = Valid, 1 =
  // Unknown). Callers MUST skip rows where cpu_valid != 0.
  uint32 cpu_valid   = 5;
  // ADR-046 (step 7): per-tick byte delta on root-side
  // vethHost.rx_bytes for this instance, summed across the
  // schedd poller's 250 ms window. Unit is interface bytes
  // (includes Ethernet framing); same kernel counter the
  // per-plan tc tbf qdisc reads. tx_valid mirrors
  // instancestats.Validity (0 = Valid, 1 = Unknown — first
  // sample / regression / netstats cache miss); callers MUST
  // skip rows where tx_valid != 0. Addative field per
  // ADR-016 wire discipline; only meterd's SampleAndRoll reads
  // it (pkg/meter/sampler.go).
  uint64 net_tx_bytes = 6;
  uint32 tx_valid     = 7;
  // Issue #463 / ADR-070 §Decision 6 / PR-C: per-sidecar RAM
  // slice sourced from the deployment's `sidecars jsonb` column
  // at Admit time. Empty/nil when the deployment has no sidecars —
  // the meterd sampler collapses to the no-sidecar admission
  // shutter via api.BillableRAMMBWithSidecars. Wire discipline
  // ADR-016 additive — new field at the end. Card ceiling:
  // len(sidecar_ram_mbs) ≤ api.SidecarCapMax = 2.
  repeated int32 sidecar_ram_mbs = 8;
}

message ListInstanceStatsRequest {
  // empty today; reserved for future filtering (per-app, per-node).
}

message ListInstanceStatsResponse {
  repeated InstanceStatsRow rows = 1;
}

// StreamAppLogsRequest kicks off a per-app log stream. The schedd
// resolves the live instances via the Instances store table (state.ListInstancesForApp)
// and opens one vmmd Logs RPC per instance; the response carries every
// frame from those streams in arrival order.
//
// since_seq is the per-instance replay cursor: schedd forwards
// since_seq to each vmmd without translation. Each instance's ring
// is independent, so Seq scopes are per-instance, not global.
//
// deployment_id (issue #517 / PR-B acceptance #3) is the optional
// per-deployment filter. Empty = fan out to every live instance for
// the app; non-empty = scope the per-instance goroutine to
// instances whose state.Instance.DeploymentID matches. Instances
// with empty DeploymentID match any non-empty deployment_id filter
// (legacy rows without deployment attribution). Wire is additive
// per ADR-016; pre-PR-B callers send empty and observe the full
// fan-out.
//
// since_written_at (issue #517 / PR-B acceptance #3) is the
// per-instance written_at lower bound on the replay page, mirrored
// at the schedd hop so the bound survives the gatewayd-internal → schedd →
// vmmd transit. Empty = no bound. Wire is additive per ADR-016.
//
// Additive per ADR-016.
message StreamAppLogsRequest {
  // app_id is apps.id (the gateway resolves host→app).
  string app_id   = 1;
  // since_seq is the per-instance replay cursor. 0 = tail from now.
  // Negative values are treated as 0 by the schedd.
  int64  since_seq = 2;
  // deployment_id is the issue #517 / PR-B acceptance #3
  // per-deployment filter; empty = full fan-out.
  string deployment_id = 3;
  // since_written_at is the issue #517 / PR-B acceptance #3
  // host-side lower bound on the per-instance written_at; empty =
  // no bound.
  google.protobuf.Timestamp since_written_at = 4;
  // level is the issue #309 / tier-2 DX filter floor — the
  // customer-facing `faas logs --level=warn` flag. Empty = no
  // level filter (default). Recognised values: "info", "warn",
  // "error". The schedd applies a heuristic matcher (substring on
  // common formats like [ERROR], level=error, "level":"error")
  // per-instance on each line frame; non-matching lines are
  // dropped before the per-instance fan-out coalesces into the
  // single stream the gateway renders. Wire is additive per
  // ADR-016 — pre-issue-#309 schedds see no level field and pass
  // every line through.
  string level      = 5;
  // grep is the issue #309 / tier-2 DX substring filter — the
  // customer-facing `faas logs --grep=timeout` flag. Empty = no
  // grep filter (default). The gateway pre-compiles the value as
  // a Go regexp and the schedd applies it on each line frame
  // (MatchString semantics; substring at the customer-facing
  // surface, regex internally). The gateway rejects newlines
  // (Move 4 substring-matcher never matches across line
  // boundaries). Wire is additive per ADR-016.
  string grep       = 6;
}

// StreamAppLogsResponse is one frame of the per-app log stream.
// The instance_id is populated so a consumer can interleave
// multi-instance frames deterministically (Move 4 acceptance #5).
//
// is_gap (issue #517 / PR-B acceptance #4) is true on a synthetic
// "cursor fell below the ring's high-water mark" frame. When true,
// instance_id is the instance whose ring reported the gap; the
// line-frame fields (seq/stream/line/written_at) are unset;
// gap_to_written_at carries the host-side ingest time of the oldest
// line that instance currently retains; gap_reason names the bound
// that triggered the gap ("seq_below_retained" or "since_below_retained").
// Wire is additive per ADR-016 — pre-PR-B clients receive is_gap=false
// and observe a normal line frame.
//
// Wire is additive: new fields go at the end. The seq/stream/line
// triple mirrors vmmd's LogsResponse; written_at is the host-side
// ingest time, never the guest clock (ADR-022 entropy hazard).
message StreamAppLogsResponse {
  // instance_id is the instances.id row the frame came from.
  // Empty on the synthetic "end" terminal frame.
  string instance_id = 1;
  // seq is the per-instance monotonically increasing sequence
  // (vmmd's ring assigns these; schedd does not re-number).
  int64  seq         = 2;
  // stream is "stdout" or "stderr".
  string stream      = 3;
  // line is the byte-stripped log line (no trailing \n).
  string line        = 4;
  // written_at is the host-side time the line was committed to
  // the per-instance ring (RFC 3339 nano).
  google.protobuf.Timestamp written_at = 5;
  // is_gap is the issue #517 / PR-B acceptance #4 discriminator;
  // true only on synthetic gap frames.
  bool is_gap = 6;
  // gap_to_written_at is the host-side ingest time of the oldest
  // line the instance's ring currently retains; meaningful only on
  // is_gap=true frames.
  google.protobuf.Timestamp gap_to_written_at = 7;
  // gap_reason is the bound that triggered the gap; meaningful only
  // on is_gap=true frames. Mirrors vmmd's LogsResponse.gap_reason.
  string gap_reason = 8;
}

// StreamWarmHintsRequest kicks off the sticky-warm affinity stream.
// Empty today; reserved for future filters (per-node subscription,
// app-id whitelist). Kept as a separate message so additive evolution
// does not change the RPC signature (ADR-016).
//
// Additive per ADR-016.
message StreamWarmHintsRequest {
}

// StreamWarmHintsResponse is one event on the sticky-warm affinity
// stream. Emitted only when WarmAffinity's app_id → node_id mapping
// actually changes (idempotent RecordWake to the same node is a no-op
// at the wire). Tail-from-now: late subscribers do NOT receive a
// snapshot of current hints — they see future changes only. An empty
// hint on the gateway side degrades to least-loaded (ADR-005).
//
// Wire is additive: new fields go at the end. The instance_id is
// intentionally absent — hints are app-scoped, not instance-scoped.
//
// Additive per ADR-016.
message StreamWarmHintsResponse {
  // app_id is the apps.id whose affinity hint just changed.
  string app_id = 1;
  // node_id is the compute_node.id the engine just admitted to.
  string node_id = 2;
  // written_at is the host-side time schedd stamped the entry (the
  // WarmAffinity.lastSeen). Lets gatewayd-internal detect clock skew in
  // diagnostics; the gateway's hint cache treats this as advisory.
  google.protobuf.Timestamp written_at = 3;
}

// CapacityReport (ADR-025 axis 5) is one sample of vmmd's live
// capacity state, pushed at ~1 s cadence on the ReportCapacity
// stream. The fields are the live numbers the placement chooser
// consults before falling back to the store's stale aggregate.
//
// node_id is the compute_nodes.id UUID the publisher stamped at
// startup from registerComputeNode's return value (not the
// operator-friendly name). Empty node_id is rejected at the
// schedd handler with codes.InvalidArgument; vmmd's publisher
// must always carry a real id.
//
// sampled_at_unix_ms is informational — the chooser uses a
// "since this daemon received the report" freshness budget
// (CapacityFreshness = 5 s), not absolute time, so a clock skew
// of tens of ms between hosts is invisible.
//
// live_count is Σ instances currently running on this node
// (pkg/fcvm.Manager.LiveCount). vmmd is the source of truth here —
// schedd's PG-derived sum is up to one snapshot-restore behind.
//
// leased_count is Σ leases currently checked out
// (pkg/fcvm.Manager.LeasedCount). Mirrors live_count for the
// wake-path; informs a future capacity-aware reaper (issue #379
// follow-up).
//
// used_mb is Σ(memory.current / 1 MiB) across every live instance
// on this node, sourced from pkg/fcvm/leakcheck.ResidentBytes()
// (matches what vmmdgrpc.Stats reports). The chooser consults
// this with a ledger-floor rule (max(used_mb, ledger.ResidentRAM)).
//
// ram_headroom_mb is cfg.ComputeNode.MemMB - used_mb, clamped at
// 0. The chooser does NOT consume this directly — it recomputes
// headroom as ceiling - max(used_mb, ledger). The field is kept
// for the dashboard and a future capacity-aware reaper.
//
// vcpu_busy is v1's conservative placeholder: live_count * 2
// (matches the plan vCPU default). Per-cgroup-weight summation is
// the v1.1 upgrade. The chooser ignores vcpu_busy today (vCPU
// budget is box-wide via api.VCPUSlots); the field exists so the
// wire is forward-compatible with a future per-node vCPU slice.
//
// node_signature (ADR-053, slice 3) is the 64-byte raw (r||s)
// ECDSA P-256 signature over the canonical payload. The canonical
// payload is sha256("faas.capacity.v1" || node_id || sampled_at_unix_ms
// || live_count || leased_count || used_mb || ram_headroom_mb ||
// vcpu_busy) with all ints encoded as big-endian fixed-width.
// Empty node_signature on a slice-3 schedd is rejected with
// codes.Unauthenticated; pre-slice-3 schedd ignores it (additive
// per ADR-016). vmmd loads its signing key from
// /etc/faas/secrets/vmmd/node.key (mode 0400).
//
// node_key_id is the SHA-256 hex of the leaf's
// SubjectPublicKeyInfo. The schedd-side nodeKeyRegistry maps
// key_id → *ecdsa.PublicKey; a signature is only accepted when
// the key_id resolves. This prevents a signature captured under
// one key from being replayed after a rotation. Pre-slice-3
// schedd ignores node_key_id.
//
// Wire is additive: new fields go at the end.
//
// Additive per ADR-016.
message CapacityReport {
  string node_id             = 1;
  int64  sampled_at_unix_ms  = 2;
  int32  live_count          = 3;
  int32  leased_count        = 4;
  int32  used_mb             = 5;
  int32  ram_headroom_mb     = 6;
  int32  vcpu_busy           = 7;
  // node_signature is the ECDSA P-256 (r||s) signature over the
  // canonical payload. 64 bytes when populated. Empty on
  // pre-slice-3 vmmd; rejected on slice-3 schedd.
  bytes  node_signature      = 8;
  // node_key_id is SHA-256 hex of the leaf's SPKI. Binds the
  // signature to a registered key so a rotated/replayed
  // signature cannot piggyback on a stale registry entry.
  string node_key_id         = 9;
}

// ReportCapacityAck is the typed "I consumed all your messages"
// signal vmmd sees after CloseAndRecv completes. Empty for v1;
// future slices may carry capacity-aware reaper hints (issue
// #379) — adding a field is ADR-016-additive.
//
// Additive per ADR-016.
message ReportCapacityAck {
}

// EnsureWakeRequest (ADR-098) is the request shape for the
// single-flight-safe wake RPC. Mirrors WakeRequest's `app_id` field
// for consistency. Kept as a separate message so future per-app
// coalescing hints (e.g. a "leading or follow" marker for testing
// observability) can land on the request without breaking Wake's
// contract.
//
// Additive per ADR-016.
message EnsureWakeRequest {
  string app_id = 1;
}

// EnsureWakeResponse (ADR-098) is the typed result of
// Engine.EnsureWake. On the already-running path it mirrors
// WakeResponse field-for-field. On the leader-boot path it carries
// the freshly-minted instance_id / node_id / wake_id once the
// leader's vmmd RPC returns RUNNING. On failure the gRPC status
// carries the RFC 7807 problem and `problem` is populated; the
// non-error fields are unset.
//
// Empty WakeMethod means the engine returned the existing-instance
// fast path (no new boot happened). The dashboard / CLI surfaces
// WakeMethod=WakeMethod_WAKE_COLD_BOOT / WAKE_RESTORE for the
// leader-boot path; the fast-path is implicit when WakeMethod is
// unset, which keeps dashboards from regressing on the additive
// field-empty = not-boot contract.
//
// Wire is additive per ADR-016.
message EnsureWakeResponse {
  string instance_id = 1;
  string node_id     = 2;
  WakeMethod method  = 3;
  // problem carries the RFC 7807 fields on failure. The status code
  // itself is google.rpc.Status via
  // google.golang.org/grpc/status; see pkg/grpcerr. Mirrors
  // WakeResponse and stays unset on success.
  google.protobuf.Struct problem = 4;
  // wake_id is the per-wake-attempt correlation handle (gaps
  // analysis 2026-07-23). Empty on the already-running path.
  string wake_id     = 5;
  // port (issue #460 / ADR-053, PR-C) is the per-deployment override
  // port copied from deployments.override_port (0 = legacy 8080).
  // Mirrors AdmitInstanceResponse.port; populated on the leader-boot
  // path and the already-running non-error path. 0 on failure.
  int32  port        = 6;
  // deployment_id is the live deployment the wake landed on (or the
  // existing instance was admitted for). Mirrors
  // AdmitInstanceResponse.deployment_id. Empty on failure.
  string deployment_id = 7;
}

