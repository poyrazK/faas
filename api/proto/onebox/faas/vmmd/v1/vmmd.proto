// vmmd — the only root component, owns firecracker+jailer (spec §4.4, ADR-013,
// ADR-014, ADR-016). All five RPCs map 1:1 to spec §4.4 line 138. Wire shape
// stays narrow: the caller resolves `(app)` into AppSpec; vmmd never queries
// apid or postgres on its own.

syntax = "proto3";

package onebox.faas.vmmd.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/vmmd/v1;vmmdpb";

// Vmmd is the gRPC service vmmd exposes on its unix socket. The Unix-socket
// auth model (mode 0660 group `faas`, ADR-015) is the only authentication
// story for v1.0 — Gate-A multi-host replaces it with mTLS.
service Vmmd {
  // CreateFromSnapshot wakes an instance by restoring a previously-parked
  // snapshot. Falls back to cold boot if the snapshot is stale, missing, or
  // fails to load (ADR-005: cold boot always works).
  rpc CreateFromSnapshot(CreateFromSnapshotRequest) returns (WakeResponse);

  // CreateColdBoot primes an instance with no snapshot — the deploy-pipeline
  // first-boot path (M2). Equivalent to Wake with Snapshot == nil.
  rpc CreateColdBoot(CreateColdBootRequest) returns (WakeResponse);

  // PauseAndSnapshot pauses the VM and writes a full snapshot to the
  // requested host-side paths, then destroys the live VM. After return the
  // instance is gone (§6.1: PARKED is zero-RAM).
  rpc PauseAndSnapshot(PauseAndSnapshotRequest) returns (SnapshotResponse);

  // WarmSnapshot (issue #470 / PR #470-FU-A) is the warm-tier
  // capture path. The caller is the schedd engine's
  // captureWarmSnapshotLocked, fired from Engine.Park while the
  // instance is still RUNNING on this vmmd (the runner is alive
  // and can keep serving requests across the pause window). The
  // handler:
  //  1. PATCH /vm {"state":"Paused"} (Firecracker pause).
  //  2. PUT /snapshot/create with the warm-tier storage keys
  //     (mem_file_path, snapshot_path) supplied by the caller.
  //  3. Publish both blobs through the configured StorageBackend
  //     (mem at storage_key, vmstate at vmstate_storage_key).
  //  4. PATCH /vm {"state":"Resumed"} — the VM resumes in place
  //     and the live Instance entries (Manager.m.live, cidToID)
  //     stay intact. The post-resume guest-init entropy re-seed
  //     is intentionally NOT triggered here: the warm snapshot
  //     captured an already-randomised state, and the next
  //     wake restores from a fresh snapshot that owns its own
  //     seeds; firing the hook here would inject duplicate
  //     entropy into a running guest and burn CPU on a no-op.
  //  5. Return the snapshot byte counts (matches
  //     PauseAndSnapshotResponse shape).
  //
  // The RPC is idempotent on a no-op pause? no — a re-fire of
  // WarmSnapshot on a VM that already produced a warm row would
  // create a second row at the same storage key (overwrite path
  // is storage-backend-defined). The engine gates each Park on
  // `framework_ready_at` and inserts the warm row inside the
  // appMu window so duplicate parks are not scheduled; the wire
  // does not need to enforce this.
  //
  // Error mapping: pause / snapshot / resume failures bubble up
  // as Internal with the firecracker side's status / message. The
  // engine's failure path is "Destroy the VM and skip the init
  // capture" — see pkg/sched/engine.go::captureWarmSnapshotLocked.
  rpc WarmSnapshot(WarmSnapshotRequest) returns (SnapshotResponse);

  // FrameworkReady is the vmmd-side receipt of the guest-init
  // "framework ready" vsock DGRAM (port 1027, msg=4) signal
  // (issue #470, PR #470-FU-B). vmmd's host-side DGRAM listener
  // (cmd/vmmd/manager.go) calls this with the instance id and the
  // optional warmup_ms payload; the handler stamps the per-instance
  // `framework_ready_at` column added by migration 00112 so the
  // engine's captureWarmSnapshot (PR #470-FU-A) can decide when
  // the warm-tier PauseAndSnapshot is allowed to run. The RPC is
  // idempotent — re-stamps on every subsequent signal (the engine
  // resets the column to NULL at the start of each warm-capture
  // cycle so a stale stamp doesn't leak across cycles). No
  // back-pressure: the DGRAM transport is fire-and-forget by
  // analogy with the stateless-advisory port 1025 path; a missed
  // DGRAM means the engine's warm-capture wait times out and
  // falls through to init-tier (correctness-preserving).
  rpc FrameworkReady(FrameworkReadyRequest) returns (FrameworkReadyResponse);

  // Destroy tears down a running instance. Idempotent on unknown instances.
  rpc Destroy(DestroyRequest) returns (DestroyResponse);

  // StopInstance is the M-2 / ADR-138 graceful stop sequence: send
  // `signal` to the guest's PID 1, wait up to `grace_period_s`
  // seconds for it to exit cleanly, then SIGKILL on deadline.
  // Wired to `JailerVMM.SignalAndKill` (pkg/fcvm/vmm.go).
  //
  // Distinct from Destroy (which is a hard SIGKILL today) — the two
  // RPCs coexist. schedd.Engine.StopInstance (commit 6) dispatches
  // per Instance.ExecutionMode: worker/job use StopInstance;
  // request/service use the existing snapshotAndPark/Destroy path.
  // The signal value is a standard POSIX signal number (e.g. SIGTERM=15,
  // SIGUSR1=10, SIGHUP=1); 0 means "use the manifest's StopSignal,
  // defaulting to SIGTERM". grace_period_s is the upper bound on
  // clean-shutdown wait; 0 means "no grace, immediate SIGKILL" which
  // is the legacy Destroy shape — a future commit may deprecate it.
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse);

  // Stats returns current liveness + allocator views. Used by schedd's
  // admission ledger (M4) and by Prometheus for the `vmmd_ops_total` /
  // `vmmd_op_duration_seconds` dashboards (ADR-016).
  rpc Stats(StatsRequest) returns (StatsResponse);

// Ping is a wire-only liveness probe (issue #97 / ADR-025 axis 3,
  // PR #114). Returns the vmmd process's Firecracker version + the
  // server-side timestamp at the moment the handler ran; schedd's
  // heartbeat loop calls this on every active compute_node every
  // HeartbeatInterval (default 30s). A successful round-trip proves
  // both that the gRPC socket is reachable and that vmmd's
  // goroutine scheduler is responsive enough to schedule this
  // handler — the two facts schedd needs to keep last_heartbeat_at
  // fresh. Idempotent + side-effect free; no backing Manager call.
  rpc Ping(PingRequest) returns (PingResponse);

  // ForwardHTTPStream (issue #471 PR-B + PR-C) is the bidi bridge
  // the gatewayd-internal hot path uses for every request. The legacy
  // unary ForwardHTTP was removed in PR-D (ADR-047) — the
  // streaming RPC takes its place on every code path. The init-
  // level `stream` field lifts the per-request body cap to 100
  // MiB and the response deadline to 900 s on the streaming
  // envelopes (the per-plan Hobby+ caps are on the gateway side
  // via capWriter). (Issue #98 / ADR-028: the gatewayd-internal hot path
  // speaks HTTP to vmmd over the Tailscale/Wireguard overlay (no
  // second transport), and vmmd nsenter's the per-instance netns
  // and dials netns.GuestIP:netns.AppPort. Errors map to
  // Unavailable so the gateway retries the wake on the next hop.)
  //

  // Heartbeat lets schedd ping vmmd over the overlay. The reverse
  // direction (vmmd-pushes) was rejected because schedd is the
  // admission authority and shouldn't trust inbound traffic from a
  // box it may have already drained. Empty request, empty response:
  // success is "did it return Unavailable" and the timestamp comes
  // from the caller. See pkg/overlay.DialContext and schedd's
  // heartbeat goroutine (issue #98).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // UpdateEgressAllowlist (ADR-031 + ADR-033, tier-2 PR-B) lets
  // schedd push a fresh per-app egress allowlist into every live
  // netns the vmmd owns without tearing the netns down. The
  // caller passes app_id + the new allowlist (already v4/v6
  // partitioned upstream; the wire is a single repeated string
  // matching the AppSpec.egress_allowlist field 7). vmmd walks
  // its live-instance map and applies the new nft rule in-place
  // via `nft -a list chain` + handle delete + insert at the same
  // offset, reverting to the prior argv snapshot on any error.
  // This is the closure of "live-instance drift" (ADR-033 §Context
  // "the next bigger item"). Idempotent: an empty allowlist
  // flips the chain policy back to accept, a re-pushed identical
  // allowlist is a no-op. Non-blocking on success; the caller
  // uses pg_notify as the delivery mechanism (cmd/schedd egress
  // drift subscriber, pkg/sched/egress_drift.go).
  rpc UpdateEgressAllowlist(UpdateEgressAllowlistRequest) returns (UpdateEgressAllowlistAck);

  // UpdateStaticEgressIP (ADR-119) lets schedd push a fresh
  // per-app static egress IP into every live netns the vmmd
  // owns without tearing the netns down. The caller passes
  // app_id + the new IPv4 (already validated upstream; the
  // DB family=4 CHECK prevents IPv6 from reaching here).
  // Empty ip = clear the pin (mirrors the DELETE wire shape).
  // vmmd walks its live-instance map and applies the new
  // MASQUERADE-sibling rule in-place via the per-netns
  // nftables re-render path (same posture as
  // UpdateEgressAllowlist's handle-delete + insert). The
  // delivery mechanism is pg_notify → schedd's egress_drift
  // subscriber (pkg/sched/egress_drift.go). Idempotent: a
  // re-pushed identical IP is a no-op. Plan-gated upstream by
  // pkg/api/limits.go::Plan.StaticEgressIPAllowed.
  rpc UpdateStaticEgressIP(UpdateStaticEgressIPRequest) returns (UpdateStaticEgressIPAck);

  // SeccompStatus (M8 §11 — jailer seccomp assertion) reports the
  // Linux kernel seccomp state of the jailer child process backing
  // this instance. Spec §11: "Firecracker's default seccomp filter
  // is in place" — jailer is the only parent of the firecracker
  // process, and jailer applies the seccomp filter via
  // --seccomp-filter=<path>. The handler reads /proc/<pid>/status
  // outside the vmmd process and reports the Seccomp: line (0 =
  // disabled, 1 = strict, 2 = filter) plus the filter instruction
  // count when in filter mode. Empty Instance returns InvalidArgument.
  // The presence of a freshly-installed filter (filter_len > 0) is
  // the e2e tripwire: a jailer upgrade that drops the filter is
  // caught here before the snapshot can be considered trustworthy.
  // Not in the hot path — Invoke is from the cmd/e2e seccomp gate
  // and from Prometheus scrapes keyed on the new
  // firecracker_seccomp_status metric.
  rpc SeccompStatus(SeccompStatusRequest) returns (SeccompStatusResponse);

  // Logs (issue #254 / Move 4) streams the per-instance stdout/stderr
  // ring buffer to the caller. Server-streaming: each LogsResponse is
  // one completed line (newline-fragmented by the producer). Frames
  // arrive in seq-ascending order; the buffer retains the last 10 MiB
  // per instance and drops the oldest line on overflow.
  // Backpressure flows through gRPC's natural flow control. NotFound
  // when the instance is not alive on this vmmd (nil ring).
  rpc Logs(LogsRequest) returns (stream LogsResponse);

  // ForwardHTTPStream is the rpc declaration; the docstring above
  // the service block (above Ping) describes the protocol and the
  // PR-D state. The repetition kept the comments shipped without
  // surgery on the surrounding service-doc layout.
  rpc ForwardHTTPStream(stream ForwardHTTPStreamRequest) returns (stream ForwardHTTPStreamResponse);

  // ForwardRawStream (issue #676 / ADR-080) is the raw-bytes bridge
  // for Upgrade (WebSocket / h2c / MQTT-over-WS / long-poll) traffic.
  // The legacy ForwardHTTPStream strips Upgrade + Connection as
  // hop-by-hop headers and the shell-script bridge hard-codes
  // Transfer-Encoding: chunked + a Host rewrite — both destroy the
  // raw bytes an Upgrade handshake needs. ForwardRawStream carries
  // the customer's verbatim HTTP request bytes (status line + headers
  // + body) into the guest's netns TCP socket and reads back the
  // raw response — no HTTP parsing, no chunked framing, no header
  // rewriting. The gateway detects Upgrade requests and routes them
  // here; plain HTTP / SSE / chunked stays on ForwardHTTPStream.
  // Wire shape:
  //   client → server: 1× ForwardRawRequestInit (instance, port, max
  //     request bytes), then N× body_chunk bytes that the bridge
  //     writes verbatim to the guest TCP socket. Half-close = EOF.
  //   server → client: 1× ForwardRawResponseInit (status + headers
  //     + error message), then N× body_chunk bytes that the bridge
  //     read off the guest TCP socket. Server half-closes when the
  //     guest closes the connection.
  // The bridge that owns the guest TCP socket is the new
  // vmmd-raw-bridge Go binary (cmd/vmmd-raw-bridge/), spawned by
  // vmmd under the stream context. Errors map to Unavailable (guest
  // dial refused), NotFound (unknown instance), InvalidArgument
  // (missing init), Internal (nsenter / bridge crash). The legacy
  // ForwardHTTPStream is unaffected.
  rpc ForwardRawStream(stream ForwardRawRequest) returns (stream ForwardRawResponse);

  // MountParentExt4ReadOnly (ADR-053) is the staging-only path that
  // lets imaged compose the per-runtime base ext4 from a shared
  // debian:12-slim parent. imaged is not root (User=faas-imaged +
  // NoNewPrivileges=yes per spec §11), so it cannot mount the parent
  // ext4 itself; vmmd is the only root component and runs the
  // `mount -o loop,ro,nodev,nosuid,noexec` on imaged's behalf. The
  // returned mountpoint is an absolute host path under
  // /srv/fc/parent/faas-parent-mnt-<id>/ — shared between vmmd and
  // imaged because BOTH daemons carry systemd `PrivateTmp=yes`
  // (deploy/systemd/faas-{vmmd,imaged}.service) and vmmd's /tmp is
  // its own tmpfs, invisible to imaged's mount namespace. The caller
  // (imaged) §4.6-honours the contract by `mkfs.ext4 -d <mountpoint>`
  // directly through the read-only loopback mount — no `cp -a`, no
  // separate staging tree — and immediately calls UmountParentExt4.
  // The mount is read-only so a child re-stage cannot corrupt the
  // parent; vmmd tracks the mount in an in-memory registry and
  // sweeps orphans every ParentMountMaxAge (default 30 min) + at
  // SIGTERM. Storage_key is the canonical StorageBackend key
  // (issue #96 / ADR-025 axis 2), e.g.
  // "base/runner-base-debian-parent-amd64.ext4". Storage_key MUST be
  // in the parent-base allow-list (sched.IsParentBaseKey — host arch
  // + sibling for heterogenous clusters); anything else is rejected
  // with InvalidArgument. Empty storage_key → InvalidArgument.
  // Unknown storage_key (Get returns ErrNotFound) → NotFound. vmmd
  // writes the bytes through its own configured StorageBackend —
  // there is no precedent for imaged→vmmd dialing; CLAUDE.md is
  // amended (ADR-053) to call this out as a deliberate exception to
  // "components talk via Postgres rows + pg_notify, or gRPC on unix
  // sockets in /run/faas/".
  rpc MountParentExt4ReadOnly(MountParentExt4ReadOnlyRequest) returns (MountParentExt4ReadOnlyResponse);

  // MaterializeParentExt4 (ADR-053) copies the read-only parent ext4 tree
  // into a shared staging directory and releases the temporary loopback
  // mount before returning.  The copy is deliberately performed by vmmd:
  // mount visibility is scoped to vmmd's service namespace, while imaged
  // must consume ordinary files from its own namespace.  target_dir MUST
  // live under /dev/shm/faas-base-staging/ and storage_key MUST be the
  // canonical parent-base key.  Empty/foreign paths are InvalidArgument and
  // a missing storage key is NotFound.
  rpc MaterializeParentExt4(MaterializeParentExt4Request) returns (MaterializeParentExt4Response);

  // UmountParentExt4 (ADR-053) releases a mount vmmd previously
  // returned from MountParentExt4ReadOnly. Idempotent on an
  // unknown mountpoint — imaged's call-on-error-defer pattern
  // (mkfs.ext4 errored → umount anyway) is safe. The mountpoint
  // path is validated to live under /srv/fc/parent/faas-parent-mnt-*
  // (vmmdmount.MountRoot) to refuse unmounting an unrelated
  // filesystem (defence in depth against a caller that hands back
  // a path vmmd never issued).
  rpc UmountParentExt4(UmountParentExt4Request) returns (UmountParentExt4Response);

  // MountOverlayParent (DEPLOY-1, ADR-075) is the staging-only path
  // that lets imaged compose the per-runtime base ext4 from a
  // shared parent via overlayfs. The lowerdir is the parent ext4
  // mountpoint vmmd issued at MountParentExt4ReadOnly (read-only,
  // already mounted by vmmd); upperdir + workdir + merged are
  // absolute host paths staged under /dev/shm/faas-base-staging/
  // (tmpfs, kernel tmpfile-permitted). vmmd is the only root
  // component (spec §11) and runs the direct mount(2) syscall on
  // imaged's behalf. imaged (User=faas-imaged + NoNewPrivileges=yes)
  // cannot mount — see capdecl policy in pkg/capdecl and the
  // depguard rule in .golangci.yml that forbids unix.Mount outside
  // pkg/vmmd/. Returns the merged path on success; the caller
  // (imaged) applies its delta OCI layers to the upperdir via
  // rootfs.ApplyLayerGz, then BuildBaseFromStaging(merged) for
  // mkfs + storage. The merged path is registered in
  // vmmdmount.Registry so SIGTERM/30-min orphan sweep can release
  // it. Validation chain:
  //  1. Any empty path → InvalidArgument.
  //  2. lowerdir MUST live under /srv/fc/parent/faas-parent-mnt-*
  //     (vmmdmount.MountRoot) — refuse overlay-mounting an
  //     unrelated read-only path (defence in depth).
  //  3. upperdir/workdir MUST live under
  //     /dev/shm/faas-base-staging/ — refuse overlay-mounting on
  //     ext4 (the regression that broke every cd-controlplane
  //     deploy 2026-08-04 → 2026-08-05; kernel rejects ext4 upper
  //     with "overlayfs: upper fs does not support tmpfile").
  //  4. mount(2) EROFS/EBUSY/ENOSPC/ENOMEM → Internal with the
  //     syscall error wrapped — imaged's logs surface the cause.
  rpc MountOverlayParent(MountOverlayParentRequest) returns (MountOverlayParentResponse);

  // UmountOverlayParent (DEPLOY-1, ADR-075) releases an overlay
  // mount vmmd previously returned from MountOverlayParent.
  // Idempotent on an unknown mountpoint — imaged's
  // defer-after-error pattern (mkfs errored → umount anyway) is
  // safe. The merged path is validated to live under
  // /dev/shm/faas-base-staging/faas-base-*/merged (the staging
  // root the parent-ref path uses) to refuse unmounting an
  // unrelated filesystem.
  rpc UmountOverlayParent(UmountOverlayParentRequest) returns (UmountOverlayParentResponse);

  // PrepareLiveMigration (Tier A5 / ADR-065) is Phase 1 of the
  // four-phase cross-node live-instance handoff. Called by the
  // new owner vmmd's schedd against the DYING vmmd: pauses the
  // running VM, writes a fresh snapshot to the canonical storage
  // backend (so the new owner can pull it over the wire), and
  // returns the snapshot storage keys + a lease_token the new
  // owner carries through Phase 3. The dying vmmd keeps the VM
  // paused but resident; if Phase 3 doesn't commit within
  // MigrateLiveLeaseSeconds (pkg/api/limits.go), the dying vmmd
  // resumes the VM (Phase 4 cancel).
  rpc PrepareLiveMigration(PrepareLiveMigrationRequest) returns (PrepareLiveMigrationResponse);

  // AdoptMigratedInstance (Tier A5 / ADR-065) is Phase 2 of the
  // four-phase handoff. Called by the new owner vmmd's schedd
  // against the NEW owner vmmd: restores the snapshot the dying
  // vmmd wrote at Phase 1, brings the VM up, and returns the new
  // instance's HostIP + GuestUID so schedd can carry them
  // through to the conditional UPDATE at Phase 3.
  rpc AdoptMigratedInstance(AdoptMigratedInstanceRequest) returns (AdoptMigratedInstanceResponse);

  // AcknowledgeMigration (Tier A5 / ADR-065) is Phase 3.5 of
  // the four-phase handoff. Called by the new owner vmmd's
  // schedd against the DYING vmmd AFTER the conditional UPDATE
  // commits at Phase 3: tells the dying vmmd it can safely
  // destroy the paused VM and free its netns/jail. The dying
  // vmmd does not block on this — the conditional UPDATE has
  // already moved the row — but a missing AcknowledgeMigration
  // leaves a paused VM resident on the dying node (an
  // observation metric, not a correctness issue).
  rpc AcknowledgeMigration(AcknowledgeMigrationRequest) returns (AcknowledgeMigrationResponse);

  // CancelLiveMigration (Tier A5 / ADR-065) is Phase 4 of the
  // four-phase handoff. Called by the new owner vmmd's schedd
  // against the DYING vmmd when Phase 3 fails (peer rollback,
  // lease expiry, peer re-owner). The dying vmmd resumes the
  // paused VM and returns it to RUNNING; the snapshot stays
  // where it was (the dying vmmd's drive1 + mem are intact).
  rpc CancelLiveMigration(CancelLiveMigrationRequest) returns (CancelLiveMigrationResponse);
}

// AppSpec flattens what the caller knows about an app. vmmd stores none of
// it; the proto exists so each request is self-describing and vmmd stays
// stateless about app config (ADR-014).
message AppSpec {
  // Issue #96 / ADR-025 axis 2 (PR #116): drive0 base + drive1 layer
  // are referenced by StorageBackend keys, not host paths. The wire
  // carries canonical keys (e.g. "base/runtime-node22.ext4",
  // "apps/<slug>/<depID>.ext4"); vmmd resolves them locally via
  // Storage.Get before staging into the jail chroot. The local
  // StorageBackend's Get maps keys to /srv/fc/.../...ext4 the same
  // way the legacy *_path fields did, so single-box behaviour is
  // preserved. The OCI backend resolves keys over HTTP, which is what
  // unblocks multi-node cold-boot on a vmmd that doesn't share
  // /srv/fc with schedd (issue #98).
  string base_key   = 1;
  string layer_key  = 2;
  // 2 for free/hobby/pro; 4 for Scale.
  int32  vcpu_count  = 3;
  // plan RAM in MiB (the slice fences at +8 per spec §1).
  int32  mem_size_mib = 4;
  // per-plan egress bandwidth cap in Mbit/s (spec §7). 0 = no cap
  // (legacy callers / disabled path); vmmd applies a tbf qdisc on the
  // host-side veth to enforce Free/Hobby/Pro/Scale (10/25/100/250).
  int32  egress_mbit  = 5;
  // Per-key sealed env rows the caller wants loaded into the guest's
  // env (spec §11/G2). Each entry was sealed independently by apid
  // against the host X25519 recipient; vmmd unseals each, merges into
  // a single envelope, and writes /etc/faas/secrets.env on drive1.
  // Empty list = no file written.
  repeated SealedSecret sealed_env = 6;
  // ADR-031 + ADR-032 (tier-2 of the network roadmap): per-app
  // outbound IP allowlist. Each entry is a CIDR string ("1.2.3.0/24"
  // for v4, "2001:db8::/32" for v6). Empty list = no allowlist rule
  // emitted (default behaviour preserved); non-empty → vmmd
  // translates into netns.Config.EgressAllowlist, which emits an
  //   `iifname "tap0" ip daddr { … } accept`
  // rule on the per-netns `ip faas forward` chain AND, for any v6
  // entries, an
  //   `iifname "tap0" ip6 daddr { … } accept`
  // rule on the `ip6 faas forward` chain (per-family table split,
  // ADR-023; the renderer partitions by prefix.Addr().Is4()). Both
  // partitions land after the lateral-movement deny. Non-/0 contract
  // held by the DB trigger `apps_egress_allowlist_cidr` (migration
  // 00033). Plan-gated upstream (Free/Hobby always empty); see
  // pkg/api/limits.go::EgressAllowlistAllowed.
  repeated string egress_allowlist = 7;
  // app_id (tier-2 PR-B) is the apps.id UUID the instance is being
  // woken for. vmmd stores it on the live Instance so the
  // UpdateEgressAllowlist RPC can walk its live map by app
  // instead of by instance — schedd pushes a single per-app
  // patch, vmmd fans it out to every live instance of the app.
  // Required by CreateColdBoot (the deploy pipeline always knows
  // the app); required by CreateFromSnapshot for parity (the
  // scheduler resolves app → Instance.app_id upstream, so an
  // empty field here is a contract violation surfaced as
  // InvalidArgument).
  string app_id = 8;
  // api_env (issue #395 / ADR-045) carries the per-key plaintext
  // rows from `app_envs`. Unlike SealedEnv above, the values are
  // NOT sealed — env vars are non-sensitive runtime config by
  // contract. vmmd merges all entries into a single map and writes
  // /etc/faas/env.json on drive1; guest-init reads it and merges
  // into the process env via BuildEnvWithSecrets with precedence
  // "secrets > api_env > manifest_env > os.environ". Empty list
  // = no env.json file written (manifest env still flows in via
  // /etc/faas/app.json, the legacy path).
  repeated APIEnvEntry api_env = 9;
  // port (issue #460 / ADR-053, PR-C) is the per-deployment override
  // port the customer's app binds inside the guest. Defaults to
  // netns.AppPort (8080) when zero — wire legacy. The host's
  // waitReady + DNAT stay fixed on 8080 (ADR-009 +
  // guest/init/portnorm_linux.go); vmmd's ForwardHTTP bridge uses
  // this port to dial the guest. Additive per ADR-016.
  uint32 port         = 10;
  // healthcheck_path (issue #460 / ADR-053, ADR-057 / PR-D) is the
  // per-deployment override readiness probe path. When empty,
  // vmmd's waitReady keeps the legacy TCP-accept on :8080 (zero
  // regression risk for pre-PR-D callers). When non-empty, vmmd
  // issues an HTTP GET <healthcheck_path> against <HostIP>:8080
  // and accepts 2xx as ready; non-2xx retries every 200ms until
  // readyTimeout (default 30s). The host's probe target stays
  // :8080 — ADR-009 + portnorm re-expose the customer bind on
  // :8080 inside the guest, so the path is the customer's choice
  // and the port is the host's choice. Additive per ADR-016.
  string healthcheck_path = 11;
  // runtime (issue #470 / PR #470-FU-B) is the runner id inside
  // the guest (e.g. "node22", "python312", "go124"). schedd
  // sources it from the apps row at Wake time and the vmmd
  // stamps it on the live Instance so the framework_ready
  // DGRAM receipt path can label the
  // vmmd_guest_framework_warmup_seconds histogram by runner.
  // Empty falls back to "unknown" (the histogram's observer
  // collapses the empty string to keep cardinality bounded).
  // Bounded cardinality (≤5 runner ids today) — the runner
  // set is the guest-init build-time constant. Required by
  // CreateColdBoot and CreateFromSnapshot for parity with
  // app_id; an empty value is a contract violation surfaced as
  // InvalidArgument.
  string runtime = 12;
  // sidecars (issue #463 / ADR-069 / PR-B) lists the per-workload
  // sidecar specs that vmmd must provision alongside the main
  // workload. Each entry maps 1:1 to a row in
  // `deployment_sidecar_layers` (migration 00119); the wire carries
  // the same fields imaged persisted at build time so vmmd can
  // stage the per-workload drive + cgroup without re-reading the
  // DB. Empty list = no sidecars (the year-one common case).
  // Additive per ADR-016; pre-PR-B callers leave the field empty
  // and vmmd keeps the legacy single-workload path.
  //
  // The wire is intentionally narrow: name + image digest + type +
  // ram_mb + drive_slot (the per-sidecar slot name, e.g.
  // "layer-sidecar-1") + storage_key. cmd/env/port are read by
  // guest-init from the workload.json written to the sidecar's
  // drive1 (ADR-069 §Sidecar staging) — they are NOT on the wire
  // because vmmd never reads them; guest-init does.
  //
  // Tag 13 (not 12) — issue #470 / PR #470-FU-B reserved tag 12
  // for `runtime`. Renumbered post-rebase to preserve both
  // fields' additive contract under ADR-016.
  repeated SidecarSpec sidecars = 13;
  // static_egress_ip (ADR-119) is the customer-supplied IPv4
  // (BYOIP, Scale-only) the host MASQUERADE-sibling rule
  // rewrites tenant source traffic to. Empty = no static pin
  // (default behaviour preserved); non-empty → vmmd sets
  // netns.Config.AccountStaticIP so the per-netns renderer
  // emits a sibling SNAT-to-customer rule in the postrouting
  // chain AFTER the default MASQUERADE. v4-only in v1; the
  // DB family=4 CHECK (apps_static_egress_ip_family_check,
  // migration 00325) prevents IPv6 from reaching here.
  // vmmd validates the dotted-quad + non-reserved shape
  // before forwarding into netns.Config. Plan-gated upstream
  // (Free/Hobby/Pro always empty) by
  // pkg/api/limits.go::Plan.StaticEgressIPAllowed.
  // Additive per ADR-016.
  string static_egress_ip = 14;
  // Per-app readiness budget. 0 preserves the vmmd default for legacy
  // callers; schedd sends the plan-resolved value for production wakes.
  int32 startup_deadline_s = 15;
}

// SidecarSpec (issue #463 / ADR-069 / PR-B) is one sidecar's
// per-workload wire shape. vmmd uses storage_key + ram_mb to
// stage the sidecar's drive1 + cgroup scope; the rest is for
// guest-init's per-workload supervisor (cmd/env/port via
// workload.json).
//
// drive_slot is the FC Drive.DriveID (the path-component suffix
// vmmd mounts inside the jail chroot, e.g. "layer-sidecar-1").
// It is supplied by imaged at build time so the wire shape
// stays decoupled from the order of Workloads on the proto.
message SidecarSpec {
  // name matches the api.Sidecar.Name shape
  // (alpha-num + dash + underscore, max 32 chars).
  string name       = 1;
  // image is the digest-pinned OCI ref.
  string image      = 2;
  // type is "init" or "sidecar".
  string type       = 3;
  // ram_mb is the per-sidecar cgroup memory.max (32..512).
  int32  ram_mb     = 4;
  // port is the listen port inside the guest netns (1..65535).
  // 0 means "absent / inherit the main workload's port".
  uint32 port       = 5;
  // essential — when true, an init sidecar that exits non-zero
  // fails the deploy with failure_class=user_error (PR-B's
  // guest-init path emits the wake.sidecar_init_exit event).
  bool   essential  = 6;
  // storage_key is the canonical StorageBackend key
  // (apps/<slug>/<depID>-<name>.ext4). vmmd resolves it locally
  // via Storage.Get before staging into the jail chroot.
  string storage_key = 7;
  // drive_slot is the FC Drive.DriveID vmmd mounts inside the
  // jail chroot (e.g. "layer-sidecar-1"). Mirrors
  // pkg/fcvm.DriveSidecarPrefix + index.
  string drive_slot = 8;
  // sealed_env carries the per-sidecar ciphertext values from the
  // deployment record. vmmd opens them only into the per-instance
  // writable main layer before boot; plaintext never enters the wire
  // or the shared immutable sidecar image.
  repeated SealedSecret sealed_env = 9;
}

// SealedSecret is one (key, ciphertext) pair from an app or sidecar env
// store. The key is the env-var name; the ciphertext is sealed by apid via
// filippo.io/age under the host X25519 recipient. vmmd opens the entries only
// at wake time and writes the resulting plaintext to the appropriate
// instance-scoped file.
message SealedSecret {
  string key        = 1;
  bytes  ciphertext = 2;
}

// APIEnvEntry is one (key, value) plaintext pair from app_envs
// (issue #395 / ADR-045). The value is sent over the wire as a
// UTF-8 string — every layer of the pipeline (apid JSON decode,
// Postgres TEXT column, env.json encoding/json marshal) is
// UTF-8-bound, so a `bytes` field would only have hidden silent
// Unicode replacement during the on-disk JSON marshal. vmmd
// merges all entries into a single map and writes /etc/faas/env.json
// on drive1; guest-init reads it and merges into the process env
// with precedence below sealed secrets.
message APIEnvEntry {
  string key   = 1;
  string value = 2;
}

// SnapshotRef points at the snapshot a caller wants to restore from. The
// bytes live under the canonical StorageBackend key (issue #96, ADR-025
// axis 2); vmmd allocates its own staging tmp via Storage.Get before
// firing the firecracker restore. fc_version + storage_key together pin
// the artifact and the Firecracker binary that produced it (ADR-005).
message SnapshotRef {
  string deployment_id = 1;
  reserved 2; // formerly mem_path — torn out after #96 slice 3.
  string vmstate_path  = 3;
  // The Firecracker version the snapshot was made with (ADR-005: pinned).
  // If empty, the daemon uses the running fcVersion (current behaviour).
  string fc_version    = 4;
  // storage_key is the canonical StorageBackend key under which the mem
  // blob lives. The daemon resolves the bytes through the configured
  // StorageBackend and stages them into an os.TempDir() location for
  // the FC restore source.
  string storage_key   = 5;
  // vmstate_storage_key (issue #121, ADR-025 axis 2 slice 4) is the
  // canonical StorageBackend key under which the vmstate blob lives.
  // Semantically optional: empty ⇒ the daemon uses the legacy host
  // vmstate_path; non-empty ⇒ StorageBackend is authoritative and
  // vmstate_path is logged-only metadata. Default-local single-box
  // always sends the empty value so the host-path behaviour is
  // preserved bit-for-bit. Resolution mirrors storage_key via the
  // configured backend (local at FAAS_STORAGE_ROOT/snap/<dep>/vmstate,
  // OCI at repo snap-<dep>, tag vmstate).
  string vmstate_storage_key = 6;
}

// WakeResponse is the common return shape of CreateFromSnapshot and
// CreateColdBoot. The caller receives the lease + netns identity but does
// NOT receive the inner guest networking — that's identical across instances
// (ADR-009) and stays implicit.
message WakeResponse {
  // The instance name as it appears in the `instances` table; echoes the
  // request's `instance` field for request logging.
  string instance              = 1;
  int32  lease_uid             = 2;   // 20000-29999
  // NetIP string representation; serialise/parse via netip.Addr.String().
  string host_ip               = 3;
  string netns                 = 4;   // fc-<instance>
  string veth_host             = 5;
  string veth_peer             = 6;
  WakeMethod method            = 7;
  // The PlanWake decision — what the *caller* expected. Method reports what
  // actually happened (e.g. a restore that fell back reads WAKE_COLD_BOOT).
  WakeMethod requested_method  = 8;
  // RFC 7807 fields, populated only on failure. The status code itself is
  // google.rpc.Status via google.golang.org/grpc/status; see pkg/grpcerr.
  google.protobuf.Struct problem = 9;
  // Characterization (ADR-051 Phase 4 / PR-D) is the guest-init
  // characterization report the host received during the wake.
  // Populated on cold boots; absent on restore (the warm path
  // inherits the class from the apps row captured in the original
  // cold boot). The JSON shape mirrors
  // pkg/api.CharacterizationReport; we use Struct (not a typed
  // message) here so proto changes don't have to cascade through
  // the codegen pipeline for a single optional payload — only
  // schedd consumes this and it decodes via pkg/api on the way in.
  google.protobuf.Struct characterization = 10;
  // Phase-decomposed wake duration (ADR-098 C11). Schedd's
  // wake_phase_duration_seconds histogram (wire/metrics.go) is
  // fed by these three typed scalars so a regression in any one
  // phase surfaces on the §12 dashboard without collapsing into
  // the aggregate wake latency. All three are millisecond
  // durations; 0 means "not yet measured" (the gate from the
  // previous version is non-additive — ADding fields is fine
  // per ADR-016, but a 0 value is the unset sentinel so old
  // callers don't fabricate a 0ms observation).
  //
  // restore_ms is the duration of /snapshot/load (CreateFromSnapshot)
  // or the corresponding restore path. 0 on cold boot.
  int64  restore_ms     = 11;
  // netns_tap_ms is the duration of netns creation + TAP setup +
  // veth pair wiring. Stays roughly constant per shape (issue
  // #574) so a sudden spike is a host-level signal not a workload
  // signal.
  int64  netns_tap_ms   = 12;
  // guest_ready_ms is the duration from wake RPC return to the
  // guest-init framework-ready DGRAM (issue #470 / PR #543). The
  // gating signal for "wake until ready" — without this, the
  // aggregate wake latency hides whether the slowness is on the
  // host (restore / netns) or in the guest (init handshake).
  int64  guest_ready_ms = 13;
}

// WakeMethod is whether a wake was a snapshot restore or a cold boot.
// Wire-stable: do NOT reorder. New enum slots go at the end.
enum WakeMethod {
  WAKE_COLD_BOOT = 0;
  WAKE_RESTORE   = 1;
}

message CreateFromSnapshotRequest {
  string instance = 1;
  AppSpec app      = 2;
  SnapshotRef snapshot = 3;
  // Plan (issue #301, ADR-043) is the apps row's owning plan tier.
  // Drives the per-plan cgroup hierarchy
  // (faas-tenant.slice/<plan-slice>/<instance>) and the cpu.weight /
  // cpu.max enforcement. Empty = legacy 2-level path (pre-#301
  // callers); new callers must always populate this.
  string plan = 4;
  // AccountID (issue #301, ADR-043) is the apps row's owning
  // account id. Threads onto the wire so vmmd can label the
  // vmmd_cpu_throttle_seconds_total{account_id, app_id} counter
  // and the throttle top-N admission primitive (topAppSet, cap
  // 100). Empty = "anonymous" admission (matches the requestTotal
  // overflow policy).
  string account_id = 5;
  // WakeID (issue #517 / ADR-061) is the per-wake UUID minted by
  // schedd's Engine.Wake and persisted on the instances row.
  // vmmd stamps it onto every slog record it emits during the
  // restore path so a single cold wake is queryable as a
  // timeline. The runtime source of truth is the gRPC metadata
  // key x-faas-wake-id (CorrelationFromIncoming in pkg/wire);
  // the proto field is documented here for codegen visibility
  // and as a synchronous-validation seam for future callers
  // that don't read MD. Empty on a non-wake RPC (e.g. ping).
  string wake_id = 6;
}

message CreateColdBootRequest {
  string instance = 1;
  AppSpec app      = 2;
  // Build carries the builder-VM specifics. Nil for app VMs (the common case).
  // vmmd branches on presence: with Build set, the chroot is registered for
  // drive1 export during Destroy and the build manifest is left untouched on
  // drive1 (builderd's CreateBuildDrive1 wrote it). Spec §4.5, ADR-003.
  BuildSpec build = 3;
  // Plan (issue #301, ADR-043) — same semantics as
  // CreateFromSnapshotRequest.plan. Empty = legacy 2-level path;
  // new callers must always populate this.
  string plan = 4;
  // AccountID (issue #301, ADR-043) — same semantics as
  // CreateFromSnapshotRequest.account_id.
  string account_id = 5;
  // WakeID (issue #517 / ADR-061) — same semantics as
  // CreateFromSnapshotRequest.wake_id.
  string wake_id = 6;
}

// BuildSpec identifies an instance as a builder VM. vmmd's Destroy waits for
// the firecracker child to exit, captures its exit code, and copies
// /etc/faas/build-done.json + /build/out/* out of the chroot into ExportDir
// before removing the chroot. Builderd writes BuildManifest (BuildManifestPath)
// onto drive1 at CreateColdBoot time so guest-init can read it once the VM is up.
message BuildSpec {
  // Host directory vmmd populates during Destroy with:
  //   <export_dir>/build-done.json
  //   <export_dir>/build/out/image.tar  (and any siblings)
  // Required for builder VMs; ignored otherwise. vmmd refuses export > MaxExportedLayerBytes.
  string export_dir = 1;
  // Guest build wall-clock budget in seconds. Builderd sends the same value
  // it writes into /etc/faas/build.json so vmmd can retain enough teardown
  // headroom for a configured timeout rather than falling back to the
  // compile-time platform default.
  int32 timeout_sec = 2;
}

message PauseAndSnapshotRequest {
  string instance    = 1;
  reserved 2; // formerly mem_path — torn out after #96 slice 3.
  string vmstate_path = 3;
  // storage_key (issue #96, ADR-025 axis 2) is the canonical StorageBackend
  // key the mem blob is published under after the snapshot. The daemon
  // stores via the configured StorageBackend; vmmstate_path is the
  // resolved-on-host location vmmd hands the firecracker socket to
  // while pausing, then publishes under its own StorageBackend key.
  string storage_key = 4;
  // vmstate_storage_key (issue #121, ADR-025 axis 2 slice 4) is the
  // canonical StorageBackend key the vmstate blob is published under
  // after the snapshot. Semantically optional: empty ⇒ the daemon
  // writes the snapshot to the legacy host vmstate_path (single-box
  // / default-local behaviour, unchanged); non-empty ⇒ the daemon
  // streams the vmstate bytes through the configured StorageBackend
  // and vmstate_path is logged-only metadata. Resolution mirrors
  // storage_key (local at FAAS_STORAGE_ROOT/snap/<dep>/vmstate, OCI
  // at repo snap-<dep>, tag vmstate).
  string vmstate_storage_key = 5;
}

message SnapshotResponse {
  int64 mem_bytes     = 1;
  int64 vmstate_bytes = 2;
}

// WarmSnapshotRequest (issue #470 / PR #470-FU-A) is the input
// to Vmmd.WarmSnapshot. Carries the instance id + the warm-tier
// storage keys the engine's captureWarmSnapshotLocked
// constructed via pkg/sched.vmstateStorageKeyFor (warm variant).
// vmstate_storage_key is required for parity with the existing
// PauseAndSnapshot wire — the warm path always publishes through
// the configured StorageBackend (no legacy host-path fallback;
// warm-tier captures are multi-node-friendly by design).
message WarmSnapshotRequest {
  // Compute-node-relative instance id (instances.id). vmmd
  // resolves the live Firecracker VM from its in-memory map.
  // Empty → InvalidArgument.
  string instance = 1;
  // Canonical StorageBackend key the mem blob is published
  // under. Required (warm captures are storage-mediated).
  string storage_key = 2;
  // Canonical StorageBackend key the vmstate blob is published
  // under. Required, mirroring PauseAndSnapshot's vmstate path
  // contract (PRD-025 axis 2 slice 4).
  string vmstate_storage_key = 3;
}

// FrameworkReady is the vmmd-side receipt of the guest-init "framework
// ready" vsock DGRAM (port 1027, msg=4) signal (issue #470, PR
// #470-FU-B). The vmmd host-side DGRAM listener calls this with the
// instance id and the optional warmup_ms payload the guest chose to
// send. The handler stamps the per-instance `framework_ready_at`
// column added by migration 00112 so the schedd engine's
// captureWarmSnapshot (PR #470-FU-A) can decide when the warm-tier
// PauseAndSnapshot is allowed to run.
message FrameworkReadyRequest {
  // Instance id (UUIDv4) of the running instance the vmmd is
  // managing. Required — vmmd uses this to look up the Instance
  // (and validate the receipt matches a known row before stamping).
  string instance = 1;
  // WarmupMs is the optional 4-byte big-endian uint32 the guest
  // may include in the DGRAM body after the 1-byte type=0x01
  // marker. It is the runtime-reported warmup duration from
  // boot to first non-5xx response. Zero is "guest sent no
  // payload"; non-zero is the basis for the
  // `vmmd_guest_framework_warmup_seconds` histogram observation.
  int64 warmup_ms = 2;
}

// FrameworkReadyResponse is the wire-level acknowledgement. Empty
// today — the wire shape is forward-compatible with future fields
// (e.g. a "stamped_at" wall-clock echo) without a schema bump, but
// no caller reads them yet. The engine in PR #470-FU-A doesn't
// care about the response value; it polls the SQL column directly.
message FrameworkReadyResponse {
}

message DestroyRequest {
  string instance = 1;
}

message DestroyResponse {
  // Echoed for callers that batch destroys and want a confirmation record.
  // Successful destroys produce an empty `problem` field.
  string instance = 1;
  // Populated for builder VMs from the firecracker child's exit status (the
  // build's own exit code; 137 = OOM, 124 = timeout, etc — see
  // pkg/builderd/builderd.go failure-class table). 0 for app VMs.
  int32  exit_code = 2;
}

// StopInstanceRequest is the M-2 / ADR-138 graceful-stop input.
// schedd's Engine.StopInstance (pkg/sched/engine.go, commit 6) emits
// this RPC after reading `Instance.ExecutionMode` and the per-app
// `StopSignal` / `StopGracePeriodS` from the manifest.
message StopInstanceRequest {
  string instance = 1;
  // Signal number (POSIX). 0 = use manifest StopSignal (default SIGTERM).
  // Maps to a syscall.Signal on the vmmd side; vmmd forwards via vsock
  // to guest-init PID 1, which translates to the manifest's StopSignal
  // or, if no manifest StopSignal is set, SIGTERM.
  int32  signal = 2;
  // Upper bound on the clean-shutdown wait, in seconds. 0 = immediate
  // SIGKILL (legacy Destroy shape). schedd supplies the per-app
  // manifest StopGracePeriodS capped at the per-plan tier table
  // (commit 10).
  int32  grace_period_s = 3;
}

// StopInstanceResponse echoes the instance id + exit_code semantics
// of DestroyResponse. `kill_signal_sent` is true if vmmd had to fall
// through to SIGKILL after the grace period elapsed; false means the
// process exited cleanly within grace. Schedd records this on the
// audit row (lifecycle_failure_reason='clean_exit' or
// 'killed_after_grace' if added in a future commit).
message StopInstanceResponse {
  string instance = 1;
  int32  exit_code = 2;
  // True iff vmmd escalated to SIGKILL after grace_period_s elapsed.
  bool   kill_signal_sent = 3;
}

message StatsRequest {}

message StatsResponse {
  int32  live_count = 1;
  int32  leased_count = 2;
  // Optional so unset != 0 (Int64Value = 0 vs absent differs in prom metrics).
  google.protobuf.Int64Value total_resident_bytes = 3;
  repeated InstanceStats instances = 4;
}

message InstanceStats {
  string instance = 1;
  int32  lease_uid = 2;
  string host_ip   = 3;
  google.protobuf.Int64Value resident_bytes = 4;
  // Issue #170 (PR-A, observability slice): host cgroup CPU percent
  // (cpu.stat usage_usec delta over wall clock, * 100). Wrapper so
  // "absent" means "first sample, non-Linux, or transient cgroup
  // miss" — distinct from a real 0% reading. The schedd poller
  // treats absent as Unknown and excludes it from the
  // {app,node}-rolled-up Prometheus series until two valid samples
  // are observed. Field is additive per ADR-016 (frozen wire shape)
  // — see docs/adr/036-instance-metrics-cardinality-rollups.md.
  google.protobuf.DoubleValue cpu_pct = 5;
  // PR-B (CPU-hour visibility, no billing): cumulative CPU-seconds
  // consumed by this instance's cgroup since the cache was last
  // reset, i.e. Σ(usage_usec delta) / 1e6 across the cpustats
  // cache's lifetime. The value resets when the cache detects a
  // cgroup recreation (usage_usec regression) — this is the
  // documented per-instance regression contract from the schedd
  // poller (pkg/sched/instancestats/poller.go). Absent on the wire
  // when the cache has no baseline for this instance. Rollup
  // semantics: schedd sums this across siblings of one (app,node)
  // into a monotonic CounterVec (cpu_seconds is cumulative work,
  // not a per-tick gauge). The field is additive and informational;
  // no billing path consumes it yet (issue #279 follow-up).
  google.protobuf.DoubleValue cpu_seconds = 8;
  // PR-D (issue #301, ADR-043): cumulative CPU-throttled seconds
  // consumed by this instance's cgroup since the cpustats cache
  // was last reset, i.e. Σ(throttled_usec delta) / 1e6 across
  // the cache's lifetime. Reads from the same cpu.stat file as
  // cpu_seconds (same regression contract — absents on baseline
  // or regression; resets when the cache detects a cgroup
  // recreation). Wire unit is seconds (matches the
  // vmmd_cpu_throttle_seconds_total Prometheus counter); the
  // cgroupstats.Sample carries the raw microsecond counter, the
  // cpustats cache converts. schedd's poller does NOT roll up
  // this field into the {account_id, app_id} counter — that
  // rollup lives in pkg/wire/topn_app.go's topAppSet admission
  // (capacity 100 hottest apps) so the wire shape stays
  // per-instance and the cardinality on the Prometheus side
  // stays bounded.
  google.protobuf.DoubleValue cpu_throttled_seconds = 9;
  // Inflight HTTP forward count from vmmd's ActivityTracker. Zero
  // is a real value ("no requests in flight right now") and is
  // distinct from the empty wire state only by reader-side
  // Validity, not the proto. Populated by PR-B.
  int64 inflight_requests = 6;
  // Latest ForwardHTTPStream start time. Zero (1970-01-01) means
  // "no request observed yet on this instance" — the poller falls
  // back to state.Instance.LastRequestAt in that case.
  google.protobuf.Timestamp last_request_at = 7;
  // ADR-046 (PR-1 → PR-2): per-tick cumulative byte delta on
  // root-side vethHost.rx_bytes for this instance. Wrapper so
  // "absent" means "first sample after cache reset (baseline not
  // yet established) OR cgroup regression (veth recreation
  // detected by pkg/fcvm/netstats.Cache)" — distinct from a real
  // 0 delta. The schedd-side poller (pkg/sched/instancestats/
  // poller.go) sums this across the 250 ms window into the
  // per-(instance, minute) accumulator and serves it via
  // pkg/scheddgrpc.ListInstanceStats as a uint64 additive byte
  // counter; meterd's SampleAndRoll then appends to
  // usage_minutes.net_tx_bytes (additive on (instance_id,
  // minute)). Source: cmd/vmmd/network_poller.go +
  // pkg/fcvm/netstats.Cache. The /sys/class/net/<vethHost>/
  // statistics/rx_bytes counter is the same kernel counter the
  // per-plan tc tbf qdisc reads, so the cap and the meter are
  // consistent. Informational — not billed (ADR-046 §6).
  google.protobuf.Int64Value net_tx_bytes = 10;
  // Open TCP connection count observed from the compute host's conntrack
  // table. Zero is a real idle value; the enclosing Stats response is
  // additive so older schedd peers can ignore this field.
  int64 open_conns = 11;
  // Cumulative ForwardHTTP requests observed by vmmd for this instance.
  // Wrapper semantics match the other optional counters: absent means the
  // activity tracker has not seen the instance yet, while zero is a real
  // value after the first observation. Schedd uses the deltas between Stats
  // samples as a topology-independent RPS signal for reactive scale-up.
  google.protobuf.Int64Value request_count_total = 12;
}

// PingRequest is intentionally empty. Ping is a liveness probe; the
// request body carries nothing beyond what the gRPC method itself
// implies. Reserved for future use (operator-supplied challenge
// nonce, etc.) without bumping the wire version.
message PingRequest {}

// PingResponse carries the Firecracker version + server-side
// timestamp. fc_version lets schedd's admin surface show "this node
// runs FC 1.10.x" without a separate Stats call; server_time is
// informational (the heartbeat loop stamps last_heartbeat_at
// against its own clock, not this field).
message PingResponse {
  string fc_version = 1;
  google.protobuf.Timestamp server_time = 2;
}

// ForwardHTTPRequest and ForwardHTTPResponse were removed in PR-D
// (ADR-047). The legacy unary RPC was the original issue #98 /
// ADR-028 bridge and stayed as a deprecated path for one cycle so
// the rolling deploy across the vmmd fleet stayed green. PR-D
// removes it. The streaming RPC ForwardHTTPStream below is the
// only bridge today.

// Header is one (name, value) HTTP header line. Both fields are
// bytes-rather-than-string so non-ASCII values survive the round
// trip without proto-text round-trip surprises.
message Header {
  string name  = 1;
  string value = 2;
}

// ForwardMaxBodyBytes is the per-request body cap documented at
// vmmdgrpc.ForwardMaxBodyBytes (25 MiB for the legacy unary path
// that was removed in PR-D; the streaming RPC uses
// ForwardStreamMaxBodyBytes = 100 MiB).
// proto3 has no top-level constants, so this is documented inline.

// HeartbeatRequest and HeartbeatResponse are intentionally empty:
// the heartbeat is a presence-only ping. Schedd measures the round
// trip itself; vmmd reports nothing. We keep the envelopes
// (vs. reusing google.protobuf.Empty) so future fields — e.g. a
// "what's your RAM headroom right now" piggyback — can be added
// without a wire version bump on a hot path.
message HeartbeatRequest {}

message HeartbeatResponse {}

// UpdateEgressAllowlistRequest is the input to UpdateEgressAllowlist.
// app_id is the instances.app_id (the app whose live instances
// need the new ruleset). egress_allowlist is the new per-app
// outbound IP allowlist in the same shape as AppSpec.egress_allowlist
// (a comma-free repeated string of CIDRs; v4 + v6 mixed allowed;
// the renderer partitions by prefix.Addr().Is4()). Empty list
// = clear the allowlist (the chain-policy flips back to accept).
//
// The wire does not include an `egress_allowlist_version` field —
// the in-place patch is the only contract; cold boot on snapshot
// restore re-reads the column on every Wake, so any drift between
// the snapshot age and the column is repaired by the next Wake
// without a version handshake on the hot path.
message UpdateEgressAllowlistRequest {
  string app_id = 1;
  repeated string egress_allowlist = 2;
}

// UpdateEgressAllowlistAck is the empty success response. On
// failure vmmd returns a gRPC status (Unavailable when no live
// instances match app_id; Internal when the in-place nft patch
// failed AND the revert to the prior argv snapshot also failed —
// the live netns is then in an undefined state and the caller
// is expected to Park + ColdBoot the affected instances, which
// the schedd watchdog does on its next tick).
message UpdateEgressAllowlistAck {}

// UpdateStaticEgressIPRequest (ADR-119) is the input to
// UpdateStaticEgressIP. app_id is the apps.id UUID whose live
// instances need the new pin. static_egress_ip is the new
// customer-supplied IPv4 (dotted-quad); empty = clear the
// pin (DELETE wire shape). v4-only in v1 — the DB CHECK
// family=4 (apps_static_egress_ip_family_check, migration
// 00325) prevents IPv6 from reaching here.
//
// The wire does not include a `static_egress_ip_version`
// field — the in-place patch is the only contract; cold boot
// on snapshot restore re-reads the column on every Wake, so
// any drift between the snapshot age and the column is
// repaired by the next Wake without a version handshake on
// the hot path. Mirrors the UpdateEgressAllowlistRequest
// contract above.
message UpdateStaticEgressIPRequest {
  string app_id = 1;
  string static_egress_ip = 2;
}

// UpdateStaticEgressIPAck is the empty success response. On
// failure vmmd returns a gRPC status (Unavailable when no live
// instances match app_id; Internal when the in-place MASQUERADE
// sibling patch failed AND the revert to the prior argv
// snapshot also failed — the live netns is then in an
// undefined state and the caller is expected to Park +
// ColdBoot the affected instances, which the schedd watchdog
// does on its next tick). Mirrors UpdateEgressAllowlistAck.
message UpdateStaticEgressIPAck {}

// SeccompStatusRequest is the input to SeccompStatus. Instance is
// the compute_node-relative instance id (instances.id). vmmd
// resolves the running jailer child PID from its live map; an
// unknown instance returns NotFound (not InvalidArgument — the
// handler distinguishes "missing from the wire" from "missing on
// the host" so the e2e can diagnose the wrong row vs the wrong
// box).
message SeccompStatusRequest {
  string instance = 1;
}

// SeccompStatusResponse mirrors /proc/<pid>/status. Mode is the
// human-readable equivalent of the kernel's Seccomp integer
// ("disabled" for 0, "strict" for 1, "filter" for 2). FilterLen is
// the Seccomp_filters count from the same procfs line — the
// kernel-reported number of distinct BPF filter programs
// attached to the process. For a freshly-installed jailer default
// filter this is 1; 0 means "filter mode but no program" and is
// the failure mode the e2e asserts against. Pid is the host PID
// of the jailer child (the only firecracker parent), surfaced so
// operators can `cat /proc/<pid>/status` themselves from the
// dashboard. Error is non-empty only when the handler could not
// read /proc — the wire is well-defined and the gRPC status is
// also set, but the e2e prefers the message to a non-OK code
// because the absence of a filter is the assertion target, not
// the gRPC envelope.
message SeccompStatusResponse {
  string instance = 1;
  int32  pid      = 2;
  // disabled | strict | filter
  string mode     = 3;
  int32  filter_len = 4;
  // Empty on success. Non-empty on read failure (e.g. process
  // already reaped) — distinguishes "no seccomp filter installed"
  // (Mode="filter", FilterLen=0) from "can't tell" (Error set).
  string error    = 5;
}

// LogsRequest (issue #254 / Move 4) is the input to Logs. instance is
// the compute_node-relative instance id (instances.id, scoped to a node).
// since_seq replays from a sequence number; 0 = tail from now (skip the
// initial page and only stream new lines). The producer's ring is keyed
// per instance so each instance carries its own monotonic Seq.
//
// wake_id (issue #517 / ADR-061) is the wake correlation key the caller
// attaches so vmmd can stamp the wake id onto any log lines that
// cross its logs handler (currently zero — the producer only emits
// per-instance Seq/Stream/Line; the wake_id is consumed by the
// envelope, not the line payload). Empty on a tail-only consumer.
//
// since_written_at (issue #517 / PR-B acceptance #3) is the
// client-inclusive lower bound on the host-side WrittenAt for the
// replay page. Wire is additive per ADR-016; clients that don't set
// it get no time-bound replay (matching the pre-PR-B behaviour).
// Empty = no bound. Strictly inclusive: a line whose WrittenAt is
// equal to since_written_at passes.
message LogsRequest {
  string instance = 1;
  int64  since_seq = 2;
  string wake_id = 3;
  google.protobuf.Timestamp since_written_at = 4;
}

// LogsResponse is one streamed log line. seq is the per-instance
// monotonic identifier the ring assigns at intake; consumers dedupe
// on (instance, seq) across reconnects. stream is "stdout" or "stderr"
// (the producer tags each Line at Write time). line is the payload
// BEFORE the newline terminator (the splitter consumes the '\n').
// written_at is the host-side ingest time, not the guest clock —
// we don't trust the guest clock (ADR-022 entropy hazard).
//
// is_gap (issue #517 / PR-B acceptance #4) is true on the synthetic
// "cursor fell below the ring's high-water mark" frame only. When
// true, seq/stream/line/written_at are unset; gap_to_written_at
// carries the host-side ingest time of the OLDEST line the ring
// currently retains so the client can render a meaningful
// "you missed lines whose newest retained time is X" message.
// gap_reason names the bound that triggered the gap: "seq_below_retained"
// when since_seq sits below the ring's lowest retained Seq,
// "since_below_retained" when the since_written_at timestamp predates
// the oldest surviving line. When false, the line fields follow the
// pre-PR-B contract. Wire is additive per ADR-016 — old clients
// ignore is_gap and receive normal line frames.
message LogsResponse {
  int64 seq = 1;
  string stream = 2;
  string line = 3;
  google.protobuf.Timestamp written_at = 4;
  bool is_gap = 5;
  google.protobuf.Timestamp gap_to_written_at = 6;
  string gap_reason = 7;
}

// MountParentExt4ReadOnlyRequest (ADR-053) is the input to
// MountParentExt4ReadOnly. storage_key is the canonical StorageBackend
// key of the parent base ext4 (issue #96 / ADR-025 axis 2). vmmd
// resolves the bytes via the same configured StorageBackend the rest
// of vmmd uses (snapshot publishes, vmstate publishes); staging into
// /srv/fc/parent/ + loopback mount happens after the bytes are in
// hand. Empty → InvalidArgument. Non-parent key (allow-list reject)
// → InvalidArgument. Unknown → NotFound.
message MountParentExt4ReadOnlyRequest {
  string storage_key = 1;
}

// MountParentExt4ReadOnlyResponse returns the absolute host path of
// the read-only loopback mountpoint under
// /srv/fc/parent/faas-parent-mnt-<id>/. The caller (imaged) §4.6-
// honours the contract: pass the path straight to `mkfs.ext4 -d
// <mountpoint>` (no `cp -a`, no separate staging tree) — the parent
// userland is shared via the read-only loopback mount, the delta
// layers land on an overlayfs upper dir, and mkfs packs the merged
// view into the child ext4 without ever copying the parent.
// Then call UmountParentExt4 to release the parent mount.
message MountParentExt4ReadOnlyResponse {
  string mountpoint = 1;
}

// MaterializeParentExt4Request asks vmmd to copy the parent ext4 contents
// into target_dir.  target_dir is an existing empty directory in the shared
// base staging tmpfs; the caller applies child OCI layers there afterwards.
message MaterializeParentExt4Request {
  string storage_key = 1;
  string target_dir = 2;
}

// MaterializeParentExt4Response is the empty success envelope.
message MaterializeParentExt4Response {}

// UmountParentExt4Request is the input to UmountParentExt4.
// mountpoint is the path MountParentExt4ReadOnly previously
// returned. Empty → InvalidArgument. Unknown → InvalidArgument
// (NOT NotFound) so imaged's defer-after-error pattern is
// idempotent on a never-issued or already-released path; the
// distinction from MountParentExt4ReadOnly's NotFound is
// load-bearing — Umount must be safe to call blindly.
message UmountParentExt4Request {
  string mountpoint = 1;
}

// UmountParentExt4Response is the empty success envelope. On
// failure vmmd returns a gRPC status (InvalidArgument for an
// empty/unknown path, Internal for the umount syscall failure
// itself — e.g. EBUSY when a child re-stage is still walking
// the parent).
message UmountParentExt4Response {}

// MountOverlayParentRequest (DEPLOY-1, ADR-075) is the input to
// MountOverlayParent. All four paths are absolute host paths.
//
// lowerdir: the read-only parent ext4 mountpoint vmmd issued
// from MountParentExt4ReadOnly. Must live under vmmdmount.MountRoot
// (/srv/fc/parent/faas-parent-mnt-*/) — defence in depth against
// overlay-mounting an unrelated read-only path.
//
// upperdir: empty fresh directory where the delta OCI layers land.
// Must live under /dev/shm/faas-base-staging/ — kernel rejects
// ext4 upper with "overlayfs: upper fs does not support tmpfile".
// vmmd mkdir's the three subdirs (upper/work/merged) under the
// staging root if absent.
//
// workdir: overlayfs scratch dir, sibling of upperdir. Must be
// on the same tmpfs as upperdir.
//
// merged: the overlayfs merged view dir, sibling of upperdir and
// workdir. After the mount, the caller (imaged) applies delta
// layers to upperdir via rootfs.ApplyLayerGz, then calls
// rootfs.BuildBaseFromStaging(merged, ...) for mkfs + storage.
// Pass the same absolute path back to UmountOverlayParent to
// release.
message MountOverlayParentRequest {
  string lowerdir = 1;
  string upperdir = 2;
  string workdir = 3;
  string merged = 4;
}

// MountOverlayParentResponse (DEPLOY-1, ADR-075) is the empty
// success envelope. The merged path is the same one the caller
// passed in MountOverlayParentRequest; on success it's an
// overlayfs mountpoint visible in /proc/mounts. vmmd registers
// the mount in vmmdmount.Registry so SIGTERM/30-min orphan sweep
// can release it. On failure vmmd returns a gRPC status:
// InvalidArgument for empty/foreign paths, Internal for the
// mount(2) syscall failure (with the kernel error wrapped).
message MountOverlayParentResponse {}

// UmountOverlayParentRequest (DEPLOY-1, ADR-075) is the input to
// UmountOverlayParent. merged is the path MountOverlayParent
// previously returned. Empty → InvalidArgument. Unknown →
// InvalidArgument (NOT NotFound) so imaged's defer-after-error
// pattern is safe. The merged path is validated to live under
// /dev/shm/faas-base-staging/faas-base-*/merged — refuse
// unmounting an unrelated filesystem.
message UmountOverlayParentRequest {
  string merged = 1;
}

// UmountOverlayParentResponse (DEPLOY-1, ADR-075) is the empty
// success envelope. On failure vmmd returns a gRPC status:
// InvalidArgument for an empty/unknown path, Internal for the
// umount(2) syscall failure itself — e.g. EBUSY when the
// caller still has the merged view open.
message UmountOverlayParentResponse {}

// ForwardHTTPStreamRequest (issue #471 PR-B + PR-C) is one frame
// on the client→server stream. The first frame MUST carry the
// `init` field with the full request envelope (instance, method,
// URI, headers, port). Subsequent frames carry raw request body
// bytes in `body_chunk`. Half-close on the client side signals
// end-of-body.
//
// Header order is preserved exactly as the caller wrote it; vmmd
// does not deduplicate. The `stream` field on the init envelope
// is the truth signal — the server lifts
// ForwardMaxBodyBytes → ForwardStreamMaxBodyBytes (25 MiB → 100 MiB)
// and forwardResponseTimeout → ForwardStreamResponseTimeout (60 s
// → 900 s) when set. Setting both fields explicitly avoids a
// second round-trip on the streaming path.
message ForwardHTTPStreamRequest {
  oneof frame {
    ForwardHTTPRequestInit init = 1;
    bytes body_chunk = 2;
  }
}

// ForwardHTTPRequestInit is the first frame of ForwardHTTPStreamRequest.
// It reuses the Header envelope from the unary ForwardHTTPRequest so
// gatewayd-internal can build a single init frame and pass it to both RPCs
// without a copy. The init frame is the only place `stream` is
// honoured; subsequent frames are pure body bytes.
message ForwardHTTPRequestInit {
  // The compute_node-relative instance id (instances.id, scoped to a
  // node). vmmd resolves the netns from this. Empty → InvalidArgument.
  string instance = 1;
  // HTTP method: GET, POST, HEAD, PUT, DELETE, OPTIONS, PATCH.
  string method = 2;
  // Request-target — path?query, e.g. "/api/v1/items?id=42".
  string request_uri = 3;
  // Headers, in order. Each entry is one header line. Multi-valued
  // headers are repeated (HTTP/1.1 allows). The gateway MUST drop
  // hop-by-hop headers (Connection, Transfer-Encoding, etc.) before
  // sending — see pkg/gateway/forwardproxy.go's stripHopByHop.
  repeated Header headers = 4;
  // port (issue #460 / ADR-053, PR-C) is the guest-side TCP port
  // vmmd's bridge should dial. Defaults to netns.AppPort (8080) when
  // zero — legacy gateway clients keep working. Additive per ADR-016.
  uint32 port = 5;
  // stream is the truth signal: when true, vmmd lifts its body and
  // timeout caps to the streaming envelopes
  // (ForwardStreamMaxBodyBytes / ForwardStreamResponseTimeout).
  // Lives on the init frame so a single message carries both
  // "what to bridge" and "how to bound it" — no second RPC.
  bool stream = 6;
  // app_protocol (ADR-126, issue / G19) is the per-app wire-protocol
  // selector from PR #1023 (ADR-124). Closed set `{http1, http2, grpc}`
  // validated upstream by apid + the column-level CHECK constraint
  // `apps_app_protocol_chk` (migration 00382). vmmd translates this to
  // the per-stream bridge framing: `http1` → H1+chunked (legacy v2 path),
  // `http2|grpc` → H2C terminator on the bridge (prior-knowledge). Wire-
  // additive per ADR-016; legacy callers (no field set → "") default to
  // H1+chunked so behavior is preserved.
  string app_protocol = 7;
}

// ForwardHTTPStreamResponse is one frame on the server→client
// stream. The first frame carries the response init envelope
// (status, headers, termination_kind). Subsequent frames carry
// raw response body bytes. The server half-closes the stream
// when the upstream bridge script exits; the client EOF on the
// stream is the clean-shutdown signal.
message ForwardHTTPStreamResponse {
  oneof frame {
    ForwardHTTPResponseInit init = 1;
    bytes body_chunk = 2;
  }
}

// ForwardHTTPResponseInit is the first frame of
// ForwardHTTPStreamResponse. status is the upstream HTTP status
// code; headers are the upstream response headers. Content-Length
// is NOT echoed — the body is chunked and the client counts bytes
// as they arrive. Error is the gRPC-status-equivalent message
// (empty on success); non-empty means the server is signalling
// a failure before the body even started.
message ForwardHTTPResponseInit {
  int32 status = 1;
  repeated Header headers = 2;
  // Non-empty on failure: e.g. "could not dial guest: timeout".
  // The client surfaces this as a 502 with the upstream message
  // in the X-Faas-Forward-Error header (operator-only; not
  // customer-visible).
  string error = 3;
  // trailers (ADR-126, issue / G19) carries HTTP/2 trailer HEADERS
  // (RFC 9113 §8.1) for `app_protocol=grpc` requests where the guest
  // sends gRPC trailers (`grpc-status: 0`, `grpc-message: ""`, custom
  // metadata) as a HEADERS frame with END_STREAM. Distinct from
  // `headers` so the gateway forwarder can preserve HTTP/2 trailer
  // semantics end-to-end without confusing them with initial response
  // headers. Wire-additive per ADR-016; legacy callers (no trailers
  // field → []) get an empty slice and the H1+chunked path keeps
  // working unchanged.
  repeated Header trailers = 7;
}

// PrepareLiveMigrationRequest (Tier A5 / ADR-065) is the input
// for Vmmd.PrepareLiveMigration. The new owner vmmd's schedd
// fills this with the instance identity + the canonical
// storage key under which the dying vmmd will write the
// snapshot.
message PrepareLiveMigrationRequest {
  // The instance id whose VM the dying vmmd will pause +
  // snapshot. vmmd identifies the local Firecracker VM by its
  // instance id (mapped 1:1 at CreateFromSnapshot / CreateColdBoot
  // time, kept in memory).
  string instance_id = 1;
  // The canonical storage backend key under which the dying vmmd
  // will publish the snapshot. The new owner's schedd generated
  // this key via pkg/sched.vmstateStorageKeyFor at the call site
  // (mirroring the cold-boot snapshot key shape) so the new owner
  // can pull the snapshot via the same Storage.Get call a wake
  // would use.
  string snapshot_storage_key = 2;
}

// PrepareLiveMigrationResponse carries the snapshot metadata +
// the per-migration lease_token the new owner carries through
// Phase 3. The lease_token is a UUIDv4 minted by the dying vmmd
// at PrepareLiveMigration time (the dying vmmd is the lease
// authority — it owns the pause/resume decision). The new owner's
// schedd presents the same token at Phase 3 (MigrateInstanceOwner
// predicate) and Phase 4 (CancelInstanceMigration predicate) so
// a peer claim can never silently succeed with a stale lease.
message PrepareLiveMigrationResponse {
  // The mem blob key (canonical storage backend key the dying
  // vmmd wrote under). Distinct from snapshot_storage_key only if
  // the dying vmmd resolved a sub-namespace (currently 1:1).
  string mem_storage_key = 1;
  // The vmstate blob key (canonical storage backend key the
  // dying vmmd wrote under).
  string vmstate_storage_key = 2;
  // The lease_token UUIDv4 the new owner carries through to
  // Phase 3 + Phase 4. Distinct from the snapshot_storage_key so
  // the new owner can mint its own UUIDv4 deterministically; the
  // dying vmmd mints it so the lease's window is tied to the
  // dying vmmd's lease clock, not the new owner's.
  string lease_token = 3;
  // Firecracker version used to create the snapshot. The destination
  // passes this through the normal restore compatibility gate and falls
  // back to a cold boot when the versions differ.
  string fc_version = 4;
}

// AdoptMigratedInstanceRequest (Tier A5 / ADR-065) is the input
// for Vmmd.AdoptMigratedInstance. The new owner vmmd's schedd
// fills this with the snapshot metadata + the lease_token from
// Phase 1; the new owner vmmd restores the VM and returns the
// new instance's network identifiers.
message AdoptMigratedInstanceRequest {
  // The instance id (preserved across the migration — schedd
  // does NOT mint a fresh id; the row stays the same, only the
  // node_id changes at Phase 3).
  string instance_id = 1;
  // The app spec the new owner needs to bring the VM up
  // (mirrors CreateFromSnapshotRequest's app_spec field — the
  // snapshot is app-agnostic so the wire shape is identical).
  AppSpec app_spec = 2;
  // The mem + vmstate storage keys the dying vmmd returned from
  // PrepareLiveMigration. The new owner resolves them via the
  // shared StorageBackend (OCIRegistryStorageBackend for cross-
  // node reads; LocalStorageBackend for single-box).
  string mem_storage_key = 3;
  string vmstate_storage_key = 4;
  // The lease_token from PrepareLiveMigrationResponse. The new
  // owner vmmd carries this through to the gateway listener so
  // the instance row's lease_token column can be updated at
  // Phase 3 + Phase 4 (the wire shape is the same — the column
  // is the predicate on the conditional UPDATE).
  string lease_token = 5;
  // Request-level restore context mirrored from CreateFromSnapshotRequest.
  // These fields are additive so older callers can continue using the
  // original AppSpec-only envelope.
  string plan = 6;
  string account_id = 7;
  string deployment_id = 8;
  string fc_version = 9;
}

// AdoptMigratedInstanceResponse carries the network identifiers
// the new owner vmmd assigned to the restored VM. Schedd
// captures these so a future Stat / instance-id audit can
// re-derive the runtime state.
message AdoptMigratedInstanceResponse {
  // The new owner's host IP for this instance (the /30 vethHost
  // address inside the new owner's tenant netns). schedd
  // currently doesn't write this anywhere on the migration path
  // — the instances table's host_ip column is set at wake time
  // and stays — but it's included on the wire so the vmmd's
  // audit log can correlate.
  string host_ip = 1;
  // The new owner's netns path the vmmd created. Same caveat
  // as host_ip.
  string netns = 2;
  // The new owner's per-VM guest UID (20000-29999). Same
  // caveat as host_ip.
  int32 guest_uid = 3;
}

// AcknowledgeMigrationRequest (Tier A5 / ADR-065) is the input
// for Vmmd.AcknowledgeMigration. The new owner vmmd's schedd
// tells the dying vmmd "Phase 3 committed, you may destroy the
// paused VM and free the netns/jail". Idempotent: a duplicate
// ack returns success without re-running the destroy.
message AcknowledgeMigrationRequest {
  string instance_id = 1;
  string lease_token = 2;
}

message AcknowledgeMigrationResponse {
  // Empty struct reserved for future fields (e.g. freed-bytes
  // accounting). Schema is locked at v1; adding fields requires
  // the proto's `// versions:` block + ADR per the schema
  // discipline (memory: proto-check no version comments).
}

// CancelLiveMigrationRequest (Tier A5 / ADR-065) is the input
// for Vmmd.CancelLiveMigration. The new owner vmmd's schedd
// tells the dying vmmd "abort — Phase 3 didn't commit; please
// resume the paused VM". The dying vmmd resumes the VM and
// returns it to RUNNING; the snapshot stays where it was.
message CancelLiveMigrationRequest {
  string instance_id = 1;
  string lease_token = 2;
}

message CancelLiveMigrationResponse {
  // Empty struct reserved for future fields. Same shape as
  // AcknowledgeMigrationResponse.
}

// ForwardRawRequestInit (issue #676 / ADR-080) is the first frame
// of ForwardRawRequest. It carries the addressable destination
// (instance + port) and the per-connection inbound byte cap. No
// method, request_uri, or headers — the bridge is bytes, so HTTP
// framing stays on the wire inside the first bytes the caller
// sends. The init frame is the only place `max_request_bytes` is
// honoured; subsequent frames are pure body bytes piped into the
// guest TCP socket verbatim.
message ForwardRawRequestInit {
  // The compute_node-relative instance id (instances.id, scoped
  // to a node). vmmd resolves the netns from this. Empty →
  // InvalidArgument.
  string instance = 1;
  // Port (ADR-053, PR-C) is the guest-side TCP port the
  // vmmd-raw-bridge should dial. Defaults to netns.AppPort (8080)
  // when zero — legacy gateway clients keep working. Additive per
  // ADR-016.
  uint32 port = 2;
  // max_request_bytes caps the cumulative client→guest bytes
  // vmmd will accept before closing the bridge. Past the cap the
  // bridge stops reading from the gRPC stream and the guest sees
  // a clean half-close. Defaults to 100 MiB (matches
  // ForwardStreamMaxBodyBytes) when zero.
  int64 max_request_bytes = 3;
}

// ForwardRawRequest (issue #676 / ADR-080) is one frame on the
// client→server stream. The first frame MUST carry the `init`
// field with the destination envelope; subsequent frames carry
// raw request body bytes in `body_chunk`. Half-close on the
// client side signals end-of-body. Header order is preserved
// exactly as the caller wrote it; vmmd does not deduplicate.
message ForwardRawRequest {
  oneof frame {
    ForwardRawRequestInit init = 1;
    bytes body_chunk = 2;
  }
}

// ForwardRawResponseInit (issue #676 / ADR-080) is the first
// frame of ForwardRawResponse. Status is the upstream HTTP status
// code (typically 101 for WebSocket); headers are the upstream
// response headers in the order the guest wrote them. Error is
// the gRPC-status-equivalent message (empty on success); non-empty
// means the server is signalling a failure before the body even
// started (e.g. guest dial refused, nsenter failed).
message ForwardRawResponseInit {
  int32 status = 1;
  repeated Header headers = 2;
  // Non-empty on failure: e.g. "could not dial guest: timeout".
  string error = 3;
}

// ForwardRawResponse (issue #676 / ADR-080) is one frame on the
// server→client stream. The first frame carries the response init
// envelope (status + headers + termination_kind). Subsequent
// frames carry raw response body bytes that the bridge read off
// the guest TCP socket. The server half-closes the stream when
// the guest closes the connection.
message ForwardRawResponse {
  oneof frame {
    ForwardRawResponseInit init = 1;
    bytes body_chunk = 2;
  }
}
