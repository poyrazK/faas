// githubd — the GitHub App integration daemon (spec §14 M7.5, ADR-012).
//
// githubd owns: push-webhook receiver, Checks-API status writer, OAuth
// callback handler, per-repo install-token cache. It is the SOLE
// outbound caller to api.github.com (Checks API + install token
// exchange); its inbound public surface is gatewayd-public at /webhooks/github
// (HMAC-verified at the edge per ADR-012).
//
// Wire discipline mirrors vmmd (ADR-013) and schedd (ADR-018):
// checked-in *.pb.go generated with paths=source_relative, errors
// enveloped through pkg/grpcerr, auth is the unix-socket DAC model
// (mode 0660 group `faas`, ADR-015) on /run/faas/githubd.sock.
//
// Re-evaluation triggers: see ADR-012.

syntax = "proto3";

package onebox.faas.githubd.v1;

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/githubd/v1;githubdpb";

// Githubd is the gRPC service githubd exposes on its unix socket. apid
// is the only caller in v1.0 (the dashboard and CLI dial apid, not
// githubd). Multi-host (Gate-A) replaces the socket with mTLS; this
// ADR-012 surface is per-host.
service Githubd {
  // GetInstallState reports whether the GitHub App is installed for an
  // account and returns the installation_id + default_branch once
  // installed. NOT_INSTALLED is the launch state for every account
  // until the user finishes the OAuth dance.
  rpc GetInstallState(GetInstallStateRequest) returns (GetInstallStateResponse);

  // ExchangeOAuthCode turns the GitHub OAuth code returned to the
  // callback URL into an installation record. githubd POSTs to
  // api.github.com/app/installations with the GitHub App JWT, then
  // persists the installation_id onto the account (server-side, no
  // token returned to the dashboard).
  rpc ExchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse);

  // ListInstallableRepos returns the catalog of repos the installation
  // has access to (the dashboard repo picker consumes this). Calls
  // api.github.com/installation/repositories with the install token.
  rpc ListInstallableRepos(ListInstallableReposRequest) returns (ListInstallableReposResponse);

  // BindAppRepo associates an app with a repo (and production branch).
  // Persists into app_github_bindings. Idempotent on (app_id, repo).
  rpc BindAppRepo(BindAppRepoRequest) returns (BindAppRepoResponse);

  // UnbindAppRepo removes an app↔repo binding. Webhook events for the
  // repo stop triggering deployments for the unbound app.
  rpc UnbindAppRepo(UnbindAppRepoRequest) returns (UnbindAppRepoResponse);

  // GetAppBinding returns the current binding for an app, or empty
  // fields when the app is not bound to any repo.
  rpc GetAppBinding(GetAppBindingRequest) returns (GetAppBindingResponse);

  // CreateDeploymentFromPush turns a verified GitHub push webhook into
  // a deployment row in apid's `deployments` table. githubd calls this
  // after gatewayd-public forwards the request and the HMAC check passes.
  // Returns the empty deployment_id when no app is bound to the repo
  // (a common case for forks / first-time installs).
  //
  // DEPRECATED (issue #432 phase 5 closure): the inbound-webhook path
  // is HTTP-only (gatewayd-public → /webhooks/github → githubd). The gRPC
  // surface was originally designed for repo-level dispatch but cannot
  // carry per-app build inputs (source_path on disk, source URL for
  // provenance). Issue #432 phase 5 closes the loop with EnqueueBuild
  // below, which carries the per-app build inputs and is the actual
  // tea path. This method stays checked in for the bufconn round-trip
  // test (slice 7) and to keep the gRPC contract additive.
  rpc CreateDeploymentFromPush(CreateDeploymentFromPushRequest) returns (CreateDeploymentFromPushResponse);

  // EnqueueBuild is the githubd → apid bridge for per-app build
  // enqueue (issue #432 phase 5). After the dispatcher fans out the
  // touched apps (slice 1) and stages each app's RootDir subtree into
  // githubd's build-sources dir as a per-app .tar.gz, githubd calls
  // this RPC once per (app, commit_sha). apid creates the deployment
  // row (Kind=DeploymentKindGitHub), the build row, and emits the
  // build_queued pg_notify that builderd LISTENs on. The repo-level
  // CreateDeploymentFromPush above stays as a documented dead-letter
  // path; this RPC is the load-bearing one.
  //
  // Auth: the unix-socket 0660/group-`faas` DAC is the only auth in
  // v1.0 (ADR-015). The transport is insecure credentials over a
  // trusted local path; see pkg/githubdgrpc.Dial.
  rpc EnqueueBuild(EnqueueBuildRequest) returns (EnqueueBuildResponse);

  // WriteCheck pushes a commit-status update back to GitHub via the
  // Checks API (POST /repos/{owner}/{repo}/check-runs). Idempotent on
  // (repo, sha, phase) via the check_runs dedupe row so redelivered
  // webhooks don't create duplicate checks.
  rpc WriteCheck(WriteCheckRequest) returns (WriteCheckResponse);

  // VerifyInstallation confirms an installation_id returned by a
  // GitHub App install callback actually exists for this App. The
  // /oauth/callback handler in apid calls this before persisting
  // the (app → install_id) binding, so a forged callback can never
  // claim an install_id the customer doesn't own (review finding
  // #2 closure). githubd mints the App JWT + GETs
  // /app/installations/{id}; the response includes the install's
  // default_branch (used to seed BindAppRepo on the success path).
  //
  // PR-B adds expected_login: when non-empty, githubd returns
  // verified=false if the install's account.login does not match.
  // This closes the §11 install-takeover hole where any logged-in
  // FaaS account could adopt any installation_id the GitHub App
  // knew about (review finding #2 only closed the
  // install-belongs-to-the-app half; the install-belongs-to-the-user
  // half lands here).
  rpc VerifyInstallation(VerifyInstallationRequest) returns (VerifyInstallationResponse);

  // MintInstallationToken returns a fresh installation token for
  // the given (account, installation_id). The token is the canonical
  // shape githubd's TokenCache hands out (pkg/githubd/tokencache.go)
  // — sealed in transit over the apid↔githubd unix socket, scoped
  // to the single RPC. apid's source-ref deploy handler calls this
  // to authenticate the codeload fetch when no installation is
  // available locally (DEPLOY-PROV-4 / ADR-092, issue #739).
  //
  // Errors:
  //   - NOT_FOUND when the durable install row is missing for the
  //     account (the dashboard `gregale connect` flow has not run).
  //   - UNAVAILABLE when githubd's TokenCache is mid-refresh and the
  //     api.github.com round-trip failed.
  rpc MintInstallationToken(MintInstallationTokenRequest) returns (MintInstallationTokenResponse);

  // StreamSourceRef streams the raw tar.gz archive for a
  // (repo, ref) pair over the durable install's installation
  // token (DEPLOY-PROV-4 / ADR-092, issue #739). apid's
  // handleSourceRefDeploy calls this RPC, pipes the returned
  // bytes into validateAndSpool, and os.Renames the staged
  // file to FAAS_SPOOL_ROOT/<id>.tar.gz.
  //
  // The streaming wire shape is preferred over a unary
  // (io.ReadCloser-shaped) return so a Free-plan tarball that
  // exceeds SourceTarballMaxMB can be rejected mid-flight
  // (server-initiated cancellation) rather than buffered
  // entirely in memory. githubd applies
  // io.LimitReader(max_archive_bytes + 1, …) on the server
  // side; a cap overflow surfaces as a chunk carrying
  // `truncated=true` and the apid handler rolls the spool
  // file back.
  //
  // Errors:
  //   - NOT_FOUND when the durable install row is missing.
  //   - INVALID_ARGUMENT when the (repo, ref) fails
  //     validation.
  //   - UNAUTHENTICATED when the installation token is
  //     rejected by codeload.github.com after one
  //     cache-invalidate + retry (api maps to
  //     503 source_ref_unavailable per ADR-092 §3.7).
  //   - UNAVAILABLE when githubd is down or codeload
  //     returns 5xx.
  rpc StreamSourceRef(StreamSourceRefRequest) returns (stream StreamSourceRefChunk);
}

message VerifyInstallationRequest {
  int64 installation_id = 1;
  // expected_login is the GitHub login the caller asserts owns the
  // install. Empty = no §11 ownership check (the pre-PR-B wire shape,
  // preserved for back-compat with in-flight callers).
  string expected_login = 2;
}
message VerifyInstallationResponse {
  bool   verified       = 1; // false ⇒ caller should 401/403 the dashboard
  string default_branch = 2; // empty when verified=false
  string account_login  = 3; // GitHub login of the install's owner (debugging)
}

// InstallState is the per-account GitHub App install lifecycle. Maps to
// the dashboard "Connect GitHub" flow state machine (UX spec §5.1).
enum InstallState {
  STATE_UNSPECIFIED = 0;
  NOT_INSTALLED     = 1;  // no app installation on this account
  INSTALLING        = 2;  // OAuth callback in flight, awaiting exchange
  INSTALLED         = 3;  // app installed, no repo bound yet
  BOUND             = 4;  // app installed and at least one app→repo binding
}

message GetInstallStateRequest {
  // account_id is the accounts.id UUID (apid resolves session→account
  // before calling; githubd never sees the bearer/session).
  string account_id = 1;
}
message GetInstallStateResponse {
  InstallState state           = 1;
  string       installation_id = 2; // empty unless state >= INSTALLED
  string       default_branch  = 3; // empty unless state >= BOUND
}

message ExchangeOAuthCodeRequest {
  string account_id = 1;
  // code is the GitHub OAuth `code` query param from the callback URL.
  string code        = 2;
  // state is the CSRF token githubd minted at the install URL; githubd
  // verifies it against the cookie/db row before exchanging.
  string state       = 3;
}
message ExchangeOAuthCodeResponse {
  string installation_id = 1;
  string default_branch  = 2; // empty when unavailable; bind picker pre-fills from this
}

message Repo {
  string full_name      = 1; // "owner/name"
  string default_branch = 2; // "main" | "master" | custom
  bool   private        = 3;
}
message ListInstallableReposRequest  {
  string account_id = 1;
  int64 installation_id = 2;
}
message ListInstallableReposResponse { repeated Repo repos = 1; }

message BindAppRepoRequest {
  string app_id            = 1;
  string repo_full_name    = 2; // "owner/name"
  // production_branch defaults to "main" if empty (UX spec §5.2).
  string production_branch = 3;
  string account_id        = 4;
  int64 installation_id    = 5;
}
message BindAppRepoResponse {
  string binding_id = 1;
}

message UnbindAppRepoRequest {
  string app_id     = 1;
  string account_id = 2;
}
message UnbindAppRepoResponse {}

message GetAppBindingRequest {
  string app_id     = 1;
  string account_id = 2;
}
message GetAppBindingResponse {
  string repo_full_name    = 1;
  string production_branch = 2;
  string binding_id        = 3;
}

message CreateDeploymentFromPushRequest {
  string repo_full_name = 1;
  // ref is "refs/heads/main" (githubd strips the refs/heads/ prefix
  // before storing on the deployment row).
  string ref           = 2;
  string commit_sha    = 3;
  string pusher        = 4;
}
message CreateDeploymentFromPushResponse {
  // deployment_id is empty when no app is bound to this repo (a
  // redelivered webhook for an unbound repo returns the same empty
  // shape — idempotent).
  string deployment_id = 1;
  string app_id        = 2;
}

// CheckPhase is the githubd-side state machine for build progress. Maps
// to GitHub's `status` + `conclusion` via pkg/githubd/checks.go.
enum CheckPhase {
  PHASE_UNSPECIFIED = 0;
  QUEUED            = 1; // → GitHub status: queued
  BUILDING          = 2; // → GitHub status: in_progress
  LIVE              = 3; // → GitHub status: completed, conclusion: success
  FAILED            = 4; // → GitHub status: completed, conclusion: failure
}

message WriteCheckRequest {
  string    repo_full_name = 1;
  string    commit_sha     = 2;
  CheckPhase phase         = 3;
  // logs_url is the dashboard deep-link for the build log (UX spec §5.2).
  string    logs_url       = 4;
  // summary is one-line human-readable ("Build failed: OOM at 1.4 GB").
  string    summary        = 5;
}
message WriteCheckResponse {}

// EnqueueBuildRequest is the githubd → apid per-app build enqueue
// payload (issue #432 phase 5). githubd stages each touched app's
// RootDir subtree into a githubd-side workdir as a .tar.gz and
// passes the absolute path on disk (source_path). On the apid side
// the handler looks up the app, creates the deployment + build rows
// in one tx (matching the apid-side deploy_inputs.go pattern), and
// emits the build_queued pg_notify.
//
// Field ordering follows the gRPC "additive" rule (new fields at
// the end, never renumber) so older callers can ignore new fields.
message EnqueueBuildRequest {
  // account_id is the accounts.id UUID the app belongs to. Used
  // for the apid-side build-budget check (Hobby 5/app etc., spec
  // §6.2) and the audit-log actor.
  string account_id     = 1;
  // app_id is the apps.id UUID the build is for. githubd resolves
  // it from the (repo, app's RootDir) fan-out via the binding rows.
  string app_id         = 2;
  // commit_sha is the post-push commit SHA the build targets. The
  // deployment row's commit_sha is stamped from this; the source
  // tarball under source_path is the snapshot at this SHA.
  string commit_sha     = 3;
  // source_path is the absolute path on disk to the per-app
  // .tar.gz that githubd staged under
  // <FAAS_GITHUBD_WORK_DIR>/build-sources/<account_id>/<app_id>/<commit_sha>/source.tar.gz.
  // builderd requires a local file path (pkg/builderd/builderd.go:321);
  // the tarball is gzip-encoded so builderd's gzip.NewReader(line of
  // pkg/builderd/detect.go:48) works unchanged.
  string source_path    = 4;
  // source_url is the upstream archive URL (the "codeload" tarball
  // githubd pulled). Provenance-only; builderd never fetches it
  // (pkg/builderd/builderd.go:644 recordProvenance stamps it on the
  // build row but the build pipeline reads source_path).
  string source_url     = 5;
  // source_bytes is the size of the per-app tarball on disk. Stored
  // on the deployment row alongside source_path (mirrors the
  // apid-side deploy_inputs.go CreateDeployment flow).
  int64  source_bytes   = 6;
  // repo_full_name is "owner/name" — used for the audit-log
  // payload and the §11 paper trail; it does not gate any
  // authorization beyond the account_id check.
  string repo_full_name = 7;
  // ref is "refs/heads/main" (githubd strips the refs/heads/ prefix
  // before storing on the deployment row, matching the existing
  // CreateDeploymentFromPush wire shape).
  string ref            = 8;
  // branch is the human-readable branch name ("main", "master",
  // "feature/foo"). githubd passes it through for the
  // builds row's `branch` column (spec §6.4 audit dimension).
  string branch         = 9;
  // pusher is the GitHub login that triggered the push. Stored on
  // the deployment row's `pusher` column for the §11 audit trail.
  string pusher         = 10;
  // event_kind is the githubd-side event source for this build.
  // apid maps it onto the deployments.kind stamp:
  //   - EVENT_KIND_UNSPECIFIED → DeploymentKindGitHub (legacy wire)
  //   - EVENT_KIND_PUSH        → DeploymentKindGitHub
  //   - EVENT_KIND_PULL_REQUEST→ DeploymentKindPreview (issue #272 / ADR-094)
  // Empty / unspecified preserves the pre-PR-A wire shape so an
  // older githubd (or the existing slice-7 tests) keeps stamping
  // DeploymentKindGitHub without a behaviour change.
  EnqueueBuildEventKind event_kind = 11;
  // Issue #977 / ADR-116: pull_request_number carries the GitHub
  // PR number for pull_request events. apid stamps it onto
  // deployments.pr_number (NULL for push events). 0 = absent.
  // Reserved range is positive int32; pre-feature rows / push
  // events always pass 0.
  int32  pull_request_number = 12;
  // Issue #977 / ADR-116: sender_login is the GitHub login that
  // triggered the webhook (vs. pusher, which is the commit author
  // on push events). For pull_request events sender_login is the
  // PR opener; apid prefers it over pusher as deployed_by. Empty
  // when the githubd dispatcher doesn't have it.
  string sender_login     = 13;
}

// EnqueueBuildEventKind is the githubd-side event taxonomy for
// the EnqueueBuild RPC. Carried on the wire so a single bridge
// can stamp different deployments.kind values without
// multiplying RPCs (issue #272 / ADR-094).
enum EnqueueBuildEventKind {
  EVENT_KIND_UNSPECIFIED = 0; // legacy: pre-issue-#272 push → DeploymentKindGitHub
  EVENT_KIND_PUSH        = 1; // refs/heads/* push → DeploymentKindGitHub
  EVENT_KIND_PULL_REQUEST= 2; // pull_request webhook → DeploymentKindPreview
}
message EnqueueBuildResponse {
  // build_id is the durable builds.id UUID apid created. Empty
  // when the app_id's plan is over budget (apid returns 402 here
  // and the gRPC error is mapped by pkg/grpcerr).
  string build_id      = 1;
  // deployment_id is the durable deployments.id UUID apid created.
  // Same emptiness contract as build_id.
  string deployment_id = 2;
  // app_id is the app the build was (or was not) enqueued for.
  // Echoed so the caller can log without re-resolving the binding.
  string app_id        = 3;
}

// MintInstallationTokenRequest carries the install lookup keys
// (DEPLOY-PROV-4 / ADR-092, issue #739).
message MintInstallationTokenRequest {
  // account_id is the accounts.id UUID that owns the install.
  string account_id       = 1;
  // installation_id is the GitHub App installation_id the call
  // authenticates as. githubd verifies the install row's
  // InstallationID matches; mismatch → NOT_FOUND.
  int64  installation_id  = 2;
}
message MintInstallationTokenResponse {
  // token is the plain installation token. Valid for 1 h per
  // GitHub; callers MUST NOT log it. githubd already covers the
  // cache + refresh lifecycle via pkg/githubd.TokenCache — the
  // RPC forces a fresh mint so a CI runner that just received
  // a 401 from codeload can retry without waiting for the
  // proactive refresh window.
  string token            = 1;
  // expires_at is the GitHub-reported expiry timestamp (RFC 3339).
  // apid stamps this on its internal install-token cache so the
  // next call can short-circuit a cache miss.
  string expires_at       = 2;
}

// StreamSourceRefRequest is the headless source-ref stream input
// (DEPLOY-PROV-4 / ADR-092, issue #739).
message StreamSourceRefRequest {
  // account_id is the accounts.id UUID that owns the install.
  // githubd uses it to look up the durable install row.
  string account_id       = 1;
  // installation_id is the GitHub App installation_id. Matched
  // against the install row's InstallationID; mismatch → NOT_FOUND.
  int64  installation_id  = 2;
  // repo_full_name is "owner/name". Validated against the same
  // shape pkg/gitfetch/http.go::isValidRepoPath enforces.
  string repo_full_name   = 3;
  // ref is the requested commit SHA, branch, or tag. githubd resolves
  // branches/tags to a canonical SHA via the authenticated GitHub API
  // BEFORE fetching codeload, so the terminal chunk can carry immutable
  // provenance back to apid.
  string ref              = 4;
  // max_archive_bytes is the per-plan cap (Free 100 MB / Hobby 100 /
  // Pro 250 / Scale 250 × 1024²). Applied as
  // io.LimitReader(max_archive_bytes + 1, …) so the chunk
  // carrying truncated=true surfaces when the cap is hit.
  int64  max_archive_bytes = 5;
}

// StreamSourceRefChunk is one frame of the source-ref archive
// stream. The wire is a stream-of-bytes; chunk boundaries are
// an implementation detail of the gRPC transport, NOT of the
// archive format (the receiver MUST treat the concatenation of
// `data` fields as the tarball).
message StreamSourceRefChunk {
  // data is the next frame of the gzipped tarball. Concatenated
  // frames form the complete archive.
  bytes  data             = 1;
  // truncated is true when the streaming cap (max_archive_bytes)
  // was hit. The apid handler rolls the spool file back and
  // surfaces 413 + code=source_too_large per ADR-092 §3.8.
  // Always false for non-final chunks.
  bool   truncated        = 2;
  // bytes_streamed is the cumulative count of bytes the streamer
  // has sent so far (post-cap). Echoed on the final chunk so
  // the apid handler can record source_bytes on the deployment
  // row without summing the data fields.
  int64  bytes_streamed   = 3;
  // resolved_commit_sha is the canonical 40-character commit SHA
  // selected for the requested ref. It is repeated on the terminal
  // metadata frame so apid can stamp immutable provenance.
  string resolved_commit_sha = 4;
}
