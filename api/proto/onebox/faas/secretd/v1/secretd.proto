// ADR-20261110210000 §3: secretd runs on the control plane and is the only
// opener of the runtime seal domain. A compute node asks it, over mutual TLS,
// for the secrets of an app it runs; secretd answers only the app's owner node
// or a peer the owner granted, and records every open.
syntax = "proto3";

package onebox.faas.secretd.v1;

option go_package = "github.com/onebox-faas/faas/api/proto/onebox/faas/secretd/v1;secretdpb";

service Secretd {
  // OpenAppSecrets opens sealed runtime entries for app_id. Every envelope
  // must be bound to the app's resource account.
  rpc OpenAppSecrets(OpenAppSecretsRequest) returns (OpenAppSecretsResponse);
  // GrantPeer lets node_name open app_id's secrets until the returned expiry.
  // Only the app's owner node may grant.
  rpc GrantPeer(GrantPeerRequest) returns (GrantPeerResponse);
  // OpenCaptureKey opens the per-capture key of a sealed crash capture
  // (ADR-733) by reference: secretd reads crash_captures.sealed_key itself
  // and answers only when the capture belongs to app_id (ADR-20261110210000
  // slice 3d).
  rpc OpenCaptureKey(OpenCaptureKeyRequest) returns (OpenCaptureKeyResponse);
  // OpenSidecarEnv opens one sidecar's direct env by reference: secretd reads
  // the deployment's persisted sidecars itself, for a deployment of app_id
  // (ADR-20261110210000 slice 3d).
  rpc OpenSidecarEnv(OpenSidecarEnvRequest) returns (OpenSidecarEnvResponse);
  // OpenLogDrainHeader opens a customer log drain's authentication header by
  // reference: secretd reads app_log_drains.auth_header_sealed itself, for a
  // drain of app_id, and opens it with the edge seal domain
  // (ADR-20261110210000 slice 3f). Drains ship only from the app's owner
  // node, so the owner-or-grant rule applies.
  rpc OpenLogDrainHeader(OpenLogDrainHeaderRequest) returns (OpenLogDrainHeaderResponse);
  // OpenTriggerConfig opens a broker trigger's sealed credentials by
  // reference: secretd reads triggers.config for a trigger of app_id and
  // returns it with its credential leaves opened by the delivery seal domain
  // (ADR-20261110210000 slice 3g). Broker triggers are polled only by the
  // app's owner node, so the owner-or-grant rule applies.
  rpc OpenTriggerConfig(OpenTriggerConfigRequest) returns (OpenTriggerConfigResponse);
  // OpenEdgeHeaderSecret opens one sealed edge-rule request header value by
  // reference for the node that runs an instance of target_app_id
  // (ADR-20261110210000 slice 3i): the caller owns target_app_id or holds a
  // grant for it, secret_app_id has the same resource account (a route rule
  // may send one app's host to another app of the account), and one of
  // secret_app_id's headers rules still references the value. secretd reads
  // edge_rule_header_secrets itself and opens it with the edge seal domain.
  rpc OpenEdgeHeaderSecret(OpenEdgeHeaderSecretRequest) returns (OpenEdgeHeaderSecretResponse);
  // RegistryFetch makes one read request to an app's private registry on
  // the caller's behalf and streams the answer back (ADR-20261110210000
  // slice 3j). secretd opens the app's registry password with the build seal
  // domain, answers the registry's auth challenge itself and follows its
  // redirects, so the password and the tokens it buys never leave the
  // control plane. Only GET and HEAD of https://<registry>/v2/... for a
  // registry the app holds a credential for; owner or grant authorizes.
  // The first frame is the head, then body chunks.
  rpc RegistryFetch(RegistryFetchRequest) returns (stream RegistryFetchResponse);
}

message RegistryHeader {
  string name = 1;
  string value = 2;
}

message RegistryFetchRequest {
  string app_id = 1;
  // method is GET or HEAD.
  string method = 2;
  // url is https://<registry host>/v2/....
  string url = 3;
  // headers are request headers; secretd forwards only Accept, Range,
  // If-None-Match and If-Modified-Since.
  repeated RegistryHeader headers = 4;
  // job_id, in place of app_id, pulls with a job's registry credential for
  // the node holding the job's materialization lease (slice 3j-2b).
  string job_id = 5;
}

message RegistryFetchHead {
  int32 status = 1;
  repeated RegistryHeader headers = 2;
}

message RegistryFetchResponse {
  oneof frame {
    RegistryFetchHead head = 1;
    bytes body_chunk = 2;
  }
}

message OpenEdgeHeaderSecretRequest {
  string target_app_id = 1;
  string secret_app_id = 2;
  string secret_id = 3;
}

message OpenEdgeHeaderSecretResponse {
  string value = 1;
}

message OpenTriggerConfigRequest {
  string app_id = 1;
  string trigger_id = 2;
}

message OpenTriggerConfigResponse {
  // config_json is the trigger's config with its credentials opened.
  bytes config_json = 1;
}

message OpenLogDrainHeaderRequest {
  string app_id = 1;
  string drain_id = 2;
}

message OpenLogDrainHeaderResponse {
  string header = 1;
}

message OpenSidecarEnvRequest {
  string app_id = 1;
  string deployment_id = 2;
  string sidecar_name = 3;
}

message OpenSidecarEnvResponse {
  map<string, string> values = 1;
}

message OpenCaptureKeyRequest {
  string app_id = 1;
  string capture_id = 2;
}

message OpenCaptureKeyResponse {
  // identity is the capture's age X25519 identity (AGE-SECRET-KEY-1...).
  string identity = 1;
}

message SealedEntry {
  // key is the environment name the value is delivered under.
  string key = 1;
  bytes ciphertext = 2;
  // source_key names the single key inside the envelope; empty means key.
  string source_key = 3;
  // scope, when set, makes the entry a reference (slice 3d-4): secretd
  // ignores ciphertext and opens the app's own app_secrets row
  // (app_id, scope, source_key).
  string scope = 4;
}

message OpenAppSecretsRequest {
  string app_id = 1;
  repeated SealedEntry entries = 2;
}

message OpenAppSecretsResponse {
  map<string, string> values = 1;
}

message GrantPeerRequest {
  string app_id = 1;
  string node_name = 2;
  int64 ttl_seconds = 3;
}

message GrantPeerResponse {
  // expires_at is RFC 3339.
  string expires_at = 1;
}
