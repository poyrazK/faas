openapi: 3.1.0

info:
  title: one-box FaaS REST API
  version: 1.0.0
  summary: Customer-facing REST API for the one-box FaaS platform.
  description: |
    Public REST surface exposed by `apid` on `127.0.0.1:8081` (proxied by
    `gatewayd` at the public listener). Every route is authenticated with a
    Bearer API key (`fp_live_…`) and rate-limited per-IP (10 failed-auth / min).
    Successful POSTs accept an `Idempotency-Key` header (24h TTL) and replay
    with `Idempotent-Replayed: true`.

    Errors use RFC 7807 `application/problem+json` with a stable `code`
    field — see `Problem` schema. The single documented exception is the
    429 response from the authlimiter middleware: plain text only
    (`pkg/middleware/authlimit.go`).

    Operator routes (`/v1/compute-nodes`), dashboard routes (`/dashboard/*`),
    webhook receivers (`/v1/webhooks/stripe`), SSE streams (`/v1/events`,
    `/v1/deployments/{id}/logs`), and the CLI device-code flow
    (`/v1/cli-auth/*`) are not part of this public spec.
  contact:
    name: one-box FaaS
    url: https://docs.gregale.dev
  license:
    name: Proprietary
    identifier: LicenseRef-onebox-internal

servers:
  - url: https://{host}
    description: Public endpoint (proxied through gatewayd).
    variables:
      host:
        default: api.gregale.dev
        description: Public hostname (one-box FaaS).

tags:
  - name: account
    description: Account & billing (self-service, GDPR, plan).
  - name: apps
    description: App lifecycle (create, update, delete, wake, park).
  - name: deployments
    description: Deployments & build status.
  - name: instances
    description: Read-only instance view.
  - name: domains
    description: Custom domain bindings.
  - name: crons
    description: Scheduled synthetic POSTs.
  - name: alert_rules
    description: |
      Customer-configurable alert rules (issue #396 / ADR-045 PR 3).
      A rule pins a metric (latency_p99_ms, error_rate_pct, …) to a
      threshold + comparison + window; when the threshold is breached
      the meterd dispatcher POSTs a signed payload to webhook_url.
      Account-wide rules (app_id == "") are visible in every per-app
      listing but the create/update/delete endpoints pin to a specific
      app.
  - name: invocations
    description: Sync / async function invocations (event-driven surface, Move 2).
  - name: queues
    description: Per-app FIFO queues (send / receive / ack).
  - name: delayed_tasks
    description: Scheduled future invocations (cron-style, one-shot).
  - name: observability
    description: |
      Per-app observability surfaces (issue #517 / PR-C / ADR-064) —
      structured event timelines a customer or operator can query
      for a single wake. Cross-tagged with `apps` so a tag filter
      of `apps` surfaces lifecycle endpoints alongside the wake
      timeline.
  - name: keys
    description: API key management.
  - name: audit
    description: Customer-facing security event timeline (IAM-4, ADR-035). Append-only; read-only.
  - name: secrets
    description: Per-app sealed secrets (sealed at rest).
  - name: registry
    description: |
      Per-app private-registry Basic Auth credentials (issue #461 / ADR-062).
      Password is sealed at rest with secretbox under the host X25519
      recipient (namespace `registry_creds`); imaged transiently unseals
      in the pull path. The plaintext never lands in PG.
  - name: env
    description: |
      Per-app plaintext env vars (issue #395, ADR-045). Non-sensitive
      runtime config — credentials stay on /secrets. Values are
      stored as-is and applied on next wake.
  - name: security
    description: |
      Operator-only per-app security knobs (issue #472 / ADR-058):
      PATCH /v1/apps/{slug}/security (admin + MFA) flips the
      require_signed flag; trusted_signers CRUD manages the
      per-app cosign trusted-publisher list.
  - name: usage
    description: Usage roll-up and metering.
  - name: billing
    description: |
      Billing surface (issue #253 / #259). Today: the operator-
      configured Stripe billing portal link (one URL per account, no
      mutations on this side — mutations live inside the portal).
      Future endpoints (invoice list, etc.) share this tag.
  - name: admin
    description: |
      Operator-only routes (issue #279). Two-layer auth: the
      Bearer must carry the admin scope AND the caller's email
      must be in FAAS_ADMIN_EMAILS. CLI surface:
      `faas admin credit <account_uuid> <cents> --reason <text>`.
  - name: auth
    description: |
      Dashboard authentication (issue #165 PR #2, ADR-032).
      Email + password (Argon2id), Google OAuth, GitHub OAuth,
      password reset, session lifecycle. Cookies carry the session
      artifact; the device-code flow is the SDK programmatic-auth path.
  - name: mfa
    description: |
      TOTP MFA on dashboard sessions (IAM-2, issue #186). Five
      POST endpoints: enroll (one-shot secret + recovery codes),
      confirm (first TOTP code), verify (step-up for an
      mfa_pending session), recover (burn a recovery code), and
      disable (opt-out via password or recovery code).
  - name: github
    description: |
      GitHub App integration (ADR-012, PR-B). The dashboard bind
      picker surfaces the (installation_id, repo, branch) edge;
      /v1/auth/github + /oauth/callback handle the OAuth handshake
      and §11 ownership proof.
  - name: meta
    description: Self-description endpoints (this spec). Anonymous.
  - name: projects
    description: |
      Multi-workload repo decomposition (ADR-050). /v1/projects/scan is
      the dry-run that returns the PlanResponse (can_apply, plan_token);
      /v1/projects is the transactional apply that creates the project,
      its apps, and its crons in one Tx.

security:
  - bearerAuth: []

paths:

  # ─── Account ──────────────────────────────────────────────────────────────

  /v1/account:
    get:
      tags: [account]
      operationId: getAccount
      summary: Whoami.
      description: Returns the calling account, its plan, and quota limits.
      responses:
        '200':
          description: "The calling account: id, plan, limits snapshot, current-month usage, and total app count."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","email":"ops@example.com","plan":"hobby","status":"active","limits":{"plan":"hobby","ram_mb":256,"max_concurrency":2,"deployed_apps":3,"included_gb_hours":50,"app_layer_max_mb":512},"usage_gb_hours":1.234,"app_count":3,"github_install_id":null}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Stage account deletion (30-day grace).
      description: |
        Stages deletion. The account becomes `deleted_pending` for 30 days
        during which the customer can call `POST /v1/account/restore`. After
        the grace period, all rows are GC'd.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Staged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
                example: {"status":"deleted_pending","scheduled_at":"2026-07-23T11:25:00Z","restore_until":"2026-08-22T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ConflictDelete' }

  /v1/account/plan:
    patch:
      tags: [account]
      operationId: changePlan
      summary: Change billing plan.
      description: |
        Switch the account between `free`, `hobby`, `pro`, and `scale`. The
        Stripe subscription is updated server-side; the response carries the
        new plan only.
      requestBody:
        required: true
        description: "Plan change payload."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
              example: {"plan":"pro"}
      responses:
        '200':
          description: The updated account profile after the plan change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","email":"ops@example.com","plan":"hobby","status":"active","limits":{"plan":"hobby","ram_mb":256,"max_concurrency":2,"deployed_apps":3,"included_gb_hours":50,"app_layer_max_mb":512},"usage_gb_hours":1.234,"app_count":3,"github_install_id":null}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/account/export:
    get:
      tags: [account]
      operationId: exportAccount
      summary: Export full account data (GDPR).
      description: |
        Returns a JSON bundle containing every resource the account owns
        (apps, deployments, builds, instances, usage, domains, crons, API
        keys, app secrets) plus the GDPR audit trail. Available to
        `deleted_pending` accounts so the customer can take a final export
        during the 30-day grace window.
      parameters:
        - name: include_secrets
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: If true (default), include the sealed-secret envelopes.
      responses:
        '200':
          description: "A bundled JSON document: the account itself plus every owned app, deployment, build, instance, usage record, domain, cron, API key, sealed-secret envelope, and the audit trail."
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="faas-account-<id>-<yyyymmdd>.json"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExportResponse'
                example: {"exported_at":"2026-07-23T11:25:00Z","account":{...},"apps":[],"deployments":[],"builds":[],"instances":[],"usage":[],"domains":[],"crons":[],"api_keys":[],"app_secrets":[],"audit_trail":[]}
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/account/restore:
    post:
      tags: [account]
      operationId: restoreAccount
      summary: Restore a `deleted_pending` account.
      description: Cancels a staged deletion. Returns 409 `account_not_restorable` if the 30-day grace has elapsed.
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","email":"ops@example.com","plan":"hobby","status":"active","limits":{"plan":"hobby","ram_mb":256,"max_concurrency":2,"deployed_apps":3,"included_gb_hours":50,"app_layer_max_mb":512},"usage_gb_hours":1.234,"app_count":3,"github_install_id":null}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ConflictDelete' }

  # ─── MFA (IAM-2, issue #186) ──────────────────────────────────────────────
  #
  # Five POST endpoints; all on the admin-only scope set. The
  # /enroll route returns the TOTP secret + QR + recovery codes
  # exactly once; the customer must complete /confirm before the
  # server stamps mfa_enrolled_at. /verify is the step-up route
  # for already-enrolled customers whose session cookie is
  # mfa_pending. /recover burns a recovery code (the customer's
  # backup when the TOTP device is lost). /disable re-prompts for
  # password OR a recovery code before clearing MFA state.

  /v1/account/mfa/enroll:
    post:
      tags: [mfa]
      operationId: mfaEnroll
      summary: Start MFA enrollment.
      description: |
        Returns the TOTP secret, QR PNG, otpauth URL, and 10
        recovery codes exactly once. The plaintext secret is
        shown only here; the server stores a sealed copy. Call
        `/v1/account/mfa/confirm` with the customer's first
        6-digit code to commit the enrollment.
      responses:
        '200':
          description: Enrollment ready. Render the QR + recovery codes to the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Already enrolled. Call /v1/account/mfa/disable first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: MFA unavailable — host age key not loaded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/account/mfa/confirm:
    post:
      tags: [mfa]
      operationId: mfaConfirm
      summary: Finish MFA enrollment with the first TOTP code.
      description: |
        Verifies the 6-digit code against the sealed secret
        and stamps mfa_enrolled_at. Re-issues the session
        cookie without the mfa_pending flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAConfirmRequest'
      responses:
        '200':
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFAConfirmResponse' }
        '401':
          description: Invalid TOTP code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No in-flight enrollment. Call /enroll first.

  /v1/account/mfa/verify:
    post:
      tags: [mfa]
      operationId: mfaVerify
      summary: Step up an mfa_pending session.
      description: |
        For already-enrolled customers whose session cookie is
        mfa_pending. Same TOTP check as /confirm, but does NOT
        stamp mfa_enrolled_at. Re-issues the cookie without
        mfa_pending so subsequent requests pass requireMFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: Stepped up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFAVerifyResponse' }
        '401':
          description: Invalid code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/account/mfa/recover:
    post:
      tags: [mfa]
      operationId: mfaRecover
      summary: Burn a recovery code to regain access.
      description: |
        Use when the customer's TOTP device is lost. Removes
        one matching SHA-256 hash from the stored set; if the
        customer burns the last code, /recover still works but
        /disable via recovery_code no longer does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFARecoverRequest'
      responses:
        '200':
          description: Recovered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFARecoverResponse' }
        '401':
          description: No matching recovery code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/account/mfa/disable:
    post:
      tags: [mfa]
      operationId: mfaDisable
      summary: Opt out of MFA.
      description: |
        Clears the TOTP secret, recovery codes, and
        mfa_enrolled_at. Body must include exactly one of
        `password` (re-verified against account_passwords)
        or `recovery_code` (consumed). Leaves mfa_required
        untouched so the plan-upgrade / 2nd-deploy
        chokepoints can re-arm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFADisableRequest'
      responses:
        '200':
          description: Disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFADisableResponse' }
        '400':
          description: Both or neither of password/recovery_code set.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Invalid credentials or recovery code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── Dashboard auth (issue #165 PR #2, ADR-032) ──────────────────────────

  /login:
    post:
      tags: [auth]
      operationId: passwordLogin
      summary: Email + password sign-in.
      description: |
        Verifies the email + password against the `account_passwords`
        row (Argon2id, PHC string). Sets the `faas_sid` session
        cookie on success. The response body carries only
        `{account_id, plan}` — no API key. The SDK's device-code
        flow is the programmatic-auth path; the dashboard cookie is
        the only auth artifact on the browser side.

        Anti-enumeration: unbound email, wrong password, and
        passwordless (OAuth-only) accounts all return 401
        `invalid_credentials` with the same body. Every code path
        runs one Argon2id verify under identical parameters so the
        timing oracle stays closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: |
            Signed in. The `Set-Cookie: faas_sid=…` header carries
            the session cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `faas_sid=<sealed-session>; HttpOnly; Secure;
                SameSite=Lax`. 7-day fixed lifetime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLoginResponse'
                example: {"account_id":"0123456789abcdef0123456789abcdef","plan":"hobby"}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /signup:
    post:
      tags: [auth]
      operationId: passwordSignup
      summary: Create account with email + password.
      description: |
        Creates an account and signs the caller in. On a colliding
        email + matching password, the call is idempotent and signs
        in. On a colliding email + different password, the response
        is 401 `invalid_credentials` (never 409 — the surface
        forbids account enumeration).

        Password floor: 12 characters (NIST-style; no complexity
        rules).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordSignupRequest'
      responses:
        '200':
          description: Account created (or reused) and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `faas_sid=<sealed-session>; HttpOnly; SameSite=Lax`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLoginResponse'
        '400':
          description: Password too weak (≥12 chars required).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /login/forgot:
    post:
      tags: [auth]
      operationId: passwordForgot
      summary: Request a password-reset email.
      description: |
        Always returns 200 with the same body regardless of
        whether the email is bound to an account. The reset URL
        is mailed via the platform's outbound mailer; the response
        never leaks account presence.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Request accepted. The reset email is sent if the address is registered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset:
    get:
      tags: [auth]
      operationId: passwordResetForm
      summary: Render the password-reset form.
      description: |
        Validates the token shape; renders the
        `password_reset_form.html` template on a valid token.
        Invalid / expired / consumed tokens return 410 Gone.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
          description: |
            Base64url-encoded 32-byte token from the reset email.
      responses:
        '200':
          description: Token is valid; renders the form.
          content:
            text/html:
              schema: { type: string }
        '410': { $ref: '#/components/responses/ResetTokenInvalid' }
    post:
      tags: [auth]
      operationId: passwordResetConfirm
      summary: Submit a new password against a reset token.
      description: |
        Atomically consumes the token (one-shot, replay returns
        410), Argon2id-encodes the new password, sets it on the
        account, and signs the caller in.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '302':
          description: |
            Password set. Redirects to `/dashboard/`. `Set-Cookie:
            faas_sid=…` is set.
          headers:
            Location:
              schema: { type: string, example: "/dashboard/" }
        '400':
          description: New password is too weak (≥12 chars required).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410': { $ref: '#/components/responses/ResetTokenInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/google:
    get:
      tags: [auth]
      operationId: googleAuthRedirect
      summary: GitHub-style Google OAuth 2.0 consent redirect.
      description: |
        Sets a 16-byte CSRF state cookie scoped to
        `/v1/auth/google/callback` and 302s to the Google consent
        screen. The callback consumes the state cookie, exchanges
        the code at `oauth2.googleapis.com/token`, fetches the
        userinfo, and verifies `email_verified=true` before
        minting a session (issue #165 PR #2, ADR-032).

        Returns 503 `oauth_provider_unavailable` when the operator
        did not configure Google sign-in on this host (both
        `GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET` unset at
        boot, issue #419 / ADR-046). The same shape is returned
        for the half-set case, which fails to boot.
      responses:
        '302':
          description: Redirect to Google consent.
          headers:
            Location:
              schema: { type: string, format: uri }
        '503':
          description: |
            Google sign-in not configured on this host. Operator
            must set both `GOOGLE_CLIENT_ID` and
            `GOOGLE_CLIENT_SECRET` and restart apid (ADR-046).
            Surfaces as `oauth_provider_unavailable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: |
            Google OAuth misconfigured at runtime. Defensive
            catch — boot validation (ADR-046) should make this
            unreachable in production.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/google/callback:
    get:
      tags: [auth]
      operationId: googleAuthCallback
      summary: Google OAuth 2.0 callback.
      description: |
        Verifies state, exchanges the code, fetches the profile,
        enforces `email_verified=true`, and signs the user in.
        Sub-first lookup against `oauth_links` enforces the §11
        anti-takeover invariant.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: |
            Authorization code returned by Google on the consent
            redirect. Single-use; exchanged at
            `oauth2.googleapis.com/token`.
        - name: state
          in: query
          required: true
          schema: { type: string }
          description: |
            CSRF state token. Must match the `faas_google_state`
            cookie set on the consent redirect. Mismatch returns
            401 `csrf_mismatch`.
      responses:
        '302':
          description: |
            Redirect to `WEBSITE_URL` or `/`. `Set-Cookie:
            faas_sid=…` is set.
        '401':
          description: Google email not verified at the upstream.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            OAuth provider not configured on this host (stale
            cookie or direct callback hit before operator wired
            `GOOGLE_CLIENT_ID`/`GOOGLE_CLIENT_SECRET`).
            Surfaces as `oauth_provider_unavailable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/github:
    get:
      tags: [auth]
      operationId: githubAuthRedirect
      summary: GitHub OAuth 2.0 consent redirect.
      description: |
        Sets a 16-byte CSRF state cookie scoped to
        `/v1/auth/github/callback` and 302s to the GitHub consent
        with `scope=read:user user:email`. The callback requires
        a primary && verified email before minting a session
        (issue #165 PR #2, ADR-032).

        Returns 503 `oauth_provider_unavailable` when the operator
        did not configure GitHub sign-in on this host (both
        `GITHUB_CLIENT_ID` and `GITHUB_CLIENT_SECRET` unset at
        boot, issue #419 / ADR-046).
      responses:
        '302':
          description: Redirect to GitHub consent.
          headers:
            Location:
              schema: { type: string, format: uri }
        '503':
          description: |
            GitHub sign-in not configured on this host. Operator
            must set both `GITHUB_CLIENT_ID` and
            `GITHUB_CLIENT_SECRET` and restart apid (ADR-046).
            Surfaces as `oauth_provider_unavailable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: |
            GitHub OAuth misconfigured at runtime. Defensive
            catch — boot validation (ADR-046) should make this
            unreachable in production.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/github/callback:
    get:
      tags: [auth]
      operationId: githubAuthCallback
      summary: GitHub OAuth 2.0 callback.
      description: |
        Verifies state, exchanges the code, fetches `/user` and
        `/user/emails`, filters the primary && verified email,
        and signs the user in. Sub-first lookup against
        `oauth_links` enforces the §11 anti-takeover invariant.

        On success, `auth.login` is appended to the events table
        (ADR-035) with `method=github`, `email=<verified email>`,
        and `login=<GitHub username>` so the audit dashboard and
        the corroborating slog line reference one identifier.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: |
            Authorization code returned by GitHub on the consent
            redirect. Single-use; exchanged at
            `github.com/login/oauth/access_token`.
        - name: state
          in: query
          required: true
          schema: { type: string }
          description: |
            CSRF state token. Must match the `faas_github_state`
            cookie set on the consent redirect. Mismatch returns
            400 `csrf_mismatch`.
      responses:
        '302':
          description: |
            Redirect to `WEBSITE_URL` or `/` after a successful
            GitHub OAuth handshake. `Set-Cookie: faas_sid=…` is set.
        '400':
          description: |
            Malformed callback. The `code` field maps to
            `invalid_state` (no CSRF cookie), `csrf_mismatch`
            (query `state` does not match the cookie), or
            `missing_code` (no `code` query param). The
            `oauth_exchange_failed` code signals the upstream
            GitHub token exchange returned a non-JSON body
            (rarely seen post-2024; the handler sends
            `Accept: application/json`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: GitHub account has no primary && verified email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: |
            OAuth misconfigured server-side (`GITHUB_CLIENT_ID`
            or `GITHUB_CLIENT_SECRET` unset). Surfaces as
            `github_oauth_misconfigured`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: |
            `github.com/login/oauth/access_token`,
            `api.github.com/user`, or `api.github.com/user/emails`
            unreachable. Surfaces as `github_unreachable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            OAuth provider not configured on this host (stale
            cookie or direct callback hit before operator wired
            `GITHUB_CLIENT_ID`/`GITHUB_CLIENT_SECRET`).
            Surfaces as `oauth_provider_unavailable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/capabilities:
    get:
      tags: [auth]
      operationId: getAuthCapabilities
      summary: Sign-in OAuth capability signal for the dashboard.
      description: |
        Returns the boot-resolved OAuth provider state for this apid
        host (issue #419 / ADR-046). The dashboard reads this on
        `/login` to decide whether to render the "Sign in with
        Google" / "Sign in with GitHub" buttons.

        Mounted behind the dashboard's session-cookie auth — a
        scanner without a session gets 302 to `/login` first, so
        this is not a brute-force amplification surface even though
        it surfaces provider enablement. The set of provider names
        is closed (`google`, `github`); future providers land as
        new keys, not by adding a list.

        `enabled=true` means the provider's `/v1/auth/<provider>`
        consent route will issue a 302 to the upstream consent
        screen on a fresh request. `enabled=false` means it will
        return 503 `oauth_provider_unavailable`.
      responses:
        '200':
          description: Per-provider enabled signal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthCapabilities' }
        '302':
          description: No valid session cookie; redirected to /login.

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: postAccountLogout
      summary: Log the current dashboard session out.
      description: |
        Revokes the calling session row in the `sessions` table
        (one row per dashboard login; ADR-039 / IAM-3) and
        clears the `faas_sid` cookie. Always 204 on success,
        even if the row was already revoked (idempotent — the
        cookie is cleared either way). Other sessions on the
        same account are NOT touched; use
        `POST /v1/auth/sessions/revoke_all` for that.

        CSRF: action `logout` (verify via the
        `faas_csrf` cookie + body `csrf_token` field or
        `X-CSRF-Token` header).

        Emits `auth.session.revoke` with
        `reason: "logout"`.
      parameters:
        - $ref: '#/components/parameters/CookieSession'
      responses:
        '204':
          description: |
            Logout successful. `Set-Cookie: faas_sid=…` clears
            the session cookie.
        '400':
          description: CSRF check failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: |
            Cookie missing, expired, tampered, or its `sid` is
            not backed by an active sessions row. The cookie
            is cleared on the wire. Surfaces as
            `session_expired` (pre-IAM-3 cookie / missing /
            revoked) or `session_invalid` (account-mismatch
            defensive path; AEAD-bound envelopes should not
            produce this).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sessions:
    get:
      tags: [auth]
      operationId: getAccountSessions
      summary: List active sessions for the calling account.
      description: |
        Returns one `SessionInfo` row per active login (one row
        per dashboard login; ADR-039 / IAM-3). Newest first. The
        row whose `id` matches the calling cookie's `sid` is
        flagged `current_session: true`. Revoked rows are NOT
        returned; the `audit-events` endpoint is the timeline
        for those.
      parameters:
        - $ref: '#/components/parameters/CookieSession'
      responses:
        '200':
          description: Active sessions for the calling account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401':
          description: |
            See `/v1/auth/logout` — same 401 surface.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: deleteAccountSession
      summary: Revoke a single session by id.
      description: |
        Revokes the `sessions` row whose `id` is `{id}` and
        whose `account_id` matches the calling envelope. Cross-
        account DELETE returns 404 (not 403) — the handler
        never confirms a row exists in another account. Revoking
        the current session is allowed: the calling cookie is
        cleared on the wire (same as `/v1/auth/logout`).

        CSRF: action `session_revoke`.

        Emits `auth.session.revoke` with
        `reason: "explicit"`.
      parameters:
        - $ref: '#/components/parameters/CookieSession'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Session id (UUID v4) from `SessionInfo.id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: { type: string }
      responses:
        '204':
          description: "Session revoked. `Set-Cookie: faas_sid=…` clears the cookie if the path id matched the current session."
        '400':
          description: |
            CSRF check failed (`csrf_mismatch`) or the path id
            is not a valid UUID (`validation_failed`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: See `/v1/auth/logout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            No active session matches the id on this account
            (does not exist, already revoked, or belongs to
            another account). The 404 is the same shape
            regardless — we never leak existence across
            accounts.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sessions/revoke_all:
    post:
      tags: [auth]
      operationId: postAccountSessionsRevokeAll
      summary: Revoke every session except the calling one.
      description: |
        Revokes all `sessions` rows for the calling account
        whose `id` is NOT the calling cookie's `sid`. The
        caller's session stays active. Returns the count of
        rows revoked so the dashboard can render "Signed out
        N other devices".

        CSRF: action `sessions_revoke_all`.

        Emits `auth.sessions.revoke_all` with
        `{revoked_count, retained_sid}`.
      parameters:
        - $ref: '#/components/parameters/CookieSession'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: { type: string }
      responses:
        '200':
          description: Bulk revocation succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsRevokeAllResponse' }
        '400':
          description: CSRF check failed on the bulk-revoke request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Cookie missing, expired, tampered, or its `sid` is not backed by an active sessions row. Same 401 surface as `/v1/auth/logout`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /dashboard/account/set-password:
    post:
      tags: [auth]
      operationId: setPassword
      summary: Set a password on the authenticated account.
      description: |
        Authenticated. Lets OAuth-only customers opt into password
        login. The same Argon2id path as `/auth/reset`, anchored
        to the session's account rather than a reset token.
      parameters:
        - $ref: '#/components/parameters/CookieSession'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '302':
          description: Password set. Redirects to `/dashboard/account/`.
          headers:
            Location:
              schema: { type: string, example: "/dashboard/account/" }
        '400':
          description: Chosen password is too weak (≥12 chars required).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─── Apps ─────────────────────────────────────────────────────────────────

  /v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      summary: List apps on the account.
      responses:
        '200':
          description: Apps on the account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppResponse' }
              example:
                - {"id":"0123456789abcdef0123456789abcdef","slug":"hello-world","type":"app","ram_mb":256,"max_concurrency":2,"min_instances":0,"status":"active","url":"https://hello-world.example.com","manifest":{"entrypoint":["node","server.js"]},"created_at":"2026-07-01T08:00:00Z","updated_at":"2026-07-23T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [apps]
      operationId: createApp
      summary: Create an app.
      requestBody:
        required: true
        description: "App creation payload (slug, type, runtime, RAM, …). See CreateAppRequest schema."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
              example: {"slug":"hello-world","type":"app","runtime":"","ram_mb":256,"max_concurrency":2,"idle_timeout_s":60,"manifest":null}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","slug":"hello-world","type":"app","runtime":"","ram_mb":256,"max_concurrency":2,"idle_timeout_s":60,"min_instances":0,"state":"running","last_deployment_id":"0123456789abcdef0123456789abcdef","created_at":"2026-07-01T08:00:00Z","updated_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [apps]
      operationId: getApp
      summary: Fetch one app.
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","slug":"hello-world","type":"app","runtime":"","ram_mb":256,"max_concurrency":2,"idle_timeout_s":60,"min_instances":0,"state":"running","last_deployment_id":"0123456789abcdef0123456789abcdef","created_at":"2026-07-01T08:00:00Z","updated_at":"2026-07-23T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [apps]
      operationId: updateApp
      summary: Partial-update an app.
      requestBody:
        required: true
        description: "Patch payload — every field is optional; omitted fields are unchanged. See UpdateAppRequest."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
              example: {"ram_mb":512,"max_concurrency":3,"idle_timeout_s":120,"min_instances":1,"egress_allowlist":["1.2.3.0/24","8.8.8.0/24"]}
      responses:
        '200':
          description: The updated app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","slug":"hello-world","type":"app","runtime":"","ram_mb":256,"max_concurrency":2,"idle_timeout_s":60,"min_instances":0,"state":"running","last_deployment_id":"0123456789abcdef0123456789abcdef","created_at":"2026-07-01T08:00:00Z","updated_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidMinInstances' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [apps]
      operationId: deleteApp
      summary: Delete an app.
      responses:
        '204': { description: No body. The resource was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/metrics:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [apps]
      operationId: getAppMetrics
      summary: Per-app request metrics (issue #273 / ADR-041).
      description: |
        Time-windowed rollup of one app's gateway activity. The `range`
        parameter is a closed vocabulary bounded by Prometheus
        retention (`prom_retention_days: 15`):

          `5m` (default) | `15m` | `1h` | `6h` | `24h` | `7d` | `15d`

        Wake latency (`wake_p95_ms`) is the FLEET p95
        (`gateway_wake_latency_seconds` is unlabeled). On Prometheus
        failure the endpoint returns 200 with zeroed fields and
        `source: "degraded: <reason>"`, matching the public status
        page contract.
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [5m, 15m, 1h, 6h, 24h, 7d, 15d]
            default: 5m
          description: Time window. Default `5m`.
      responses:
        '200':
          description: The metrics snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMetricsResponse'
              example:
                app_id: "0123456789abcdef0123456789abcdef"
                range: "5m"
                source: "prometheus"
                as_of: "2026-07-28T13:00:00Z"
                request_count: 142
                latency_p50_ms: 12.4
                latency_p95_ms: 87.3
                latency_p99_ms: 412.5
                error_rate_pct: 0.7
                cold_start_pct: 8.5
                wake_p95_ms: 380.2
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/deployments:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [deployments]
      operationId: createDeployment
      summary: Create a deployment.
      description: |
        Two content-types are accepted:
        - `application/json` (`CreateDeploymentRequest` with an `image` field): prebuilt OCI reference.
        - `multipart/form-data`: source tarball upload (or Dockerfile escape hatch).
        Source size is plan-capped (Free/Hobby 100 MB, Pro/Scale 250 MB).
      requestBody:
        required: true
        description: "Either a prebuilt OCI image reference (`application/json`) or a source tarball upload (`multipart/form-data`). See the operation description for plan size caps."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
              example: {"image":"ghcr.io/onebox-faas/hello:abc1234"}
          multipart/form-data:
            schema:
              type: object
              properties:
                source:
                  type: string
                  format: binary
                  description: "Multipart file field — the source tarball or Dockerfile context."
                dockerfile:
                  type: boolean
                kind:
                  type: string
                  enum: [app, function]
                runtime:
                  type: string
                  enum: [node22, python312, go124, go124-alpine, node24, python313]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The deployment whose build has been accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","app_id":"0123456789abcdef0123456789abcdef","deployment_id":"0123456789abcdef0123456789abcdef","status":"running","commit_sha":"abc1234","created_at":"2026-07-23T11:25:00Z","finished_at":"2026-07-23T11:26:00Z","source_bytes":12345678}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SourceEgressDenied' }
        '413': { $ref: '#/components/responses/SourceTooLarge' }
        '422': { $ref: '#/components/responses/DeployFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/rollback:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [deployments]
      operationId: rollbackApp
      summary: Roll back to the previous deployment.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The deployment that was created by rolling back to the previous version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","app_id":"0123456789abcdef0123456789abcdef","deployment_id":"0123456789abcdef0123456789abcdef","status":"running","commit_sha":"abc1234","created_at":"2026-07-23T11:25:00Z","finished_at":"2026-07-23T11:26:00Z","source_bytes":12345678}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/NoRollbackTarget' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/park:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [apps]
      operationId: parkApp
      summary: Manually park all running instances.
      responses:
        '204': { description: Parked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/wake:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [apps]
      operationId: wakeApp
      summary: Manually wake an instance.
      responses:
        '204': { description: Wake requested. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ConcurrencyLimit' }
        '503': { $ref: '#/components/responses/CapacityUnavailable' }

  /v1/apps/{slug}/rename:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [apps]
      operationId: renameApp
      summary: Rename an app.
      requestBody:
        required: true
        description: "Rename payload — the new slug. See RenameAppRequest."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAppRequest'
              example: {"new_slug":"hello-world-v2"}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The renamed app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","slug":"hello-world","type":"app","runtime":"","ram_mb":256,"max_concurrency":2,"idle_timeout_s":60,"min_instances":0,"state":"running","last_deployment_id":"0123456789abcdef0123456789abcdef","created_at":"2026-07-01T08:00:00Z","updated_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ConflictRename' }

  /v1/install/repos/list:
    post:
      tags: [github]
      operationId: listInstallableRepos
      summary: List repos the user's GitHub App installation can see.
      description: |
        Cookie-session-authenticated (NOT API-key). Hydrates the
        dashboard bind picker's repo dropdown. Returns the repos
        visible to the user's GitHub App installation — githubd
        resolves the per-install token from the session's account.

        §11 anti-takeover: the handler re-runs
        githubd.VerifyInstallation with the session's github_login
        as `expected_login` before listing. Mismatch → 403 forged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallBindRequest' }
      responses:
        '200':
          description: Repos the install can see.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RepoResponse' }
        '400':
          description: 'code: invalid_request — missing/malformed body or installation_id.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            `forged` if the install's account.login differs from
            the session's github_login; `github_login_required` if
            the user hasn't completed /v1/auth/github. Returned for
            POST /v1/install/repos/list — the bind picker refuses
            to list repos of an install the user can't prove they own.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: 'code: github_unreachable — githubd could not reach api.github.com; retry in a minute.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: 'code: githubd_not_ready — githubd is not wired on this host (M7.5 slices 7-8).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/apps/{slug}/install/bind:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [github]
      operationId: bindAppInstall
      summary: Persist the (account, app, installation, repo, branch) bind row.
      description: |
        Cookie-session-authenticated (NOT API-key). Persists the
        GitHub install binding via githubd.BindAppRepo (which
        writes through to pkg/state.PgStore.UpsertGithubInstallBinding
        per PR-B).

        §11 anti-takeover: the handler re-runs
        githubd.VerifyInstallation with the session's github_login
        as `expected_login` before persisting. Mismatch → 403 forged.
        Empty github_login → 403 github_login_required.

        On success emits `auth.install.bound` for the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallBindRequest' }
      responses:
        '200':
          description: Bind persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallBindResponse' }
        '400':
          description: 'code: invalid_request — missing/malformed body, installation_id, or repo_full_name.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            `forged` if the install's account.login differs from
            the session's github_login; `github_login_required` if
            the user hasn't completed /v1/auth/github. Returned for
            POST /v1/apps/{slug}/install/bind — the bind refuses to
            persist a row for an install the user can't prove they own.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: 'code: github_unreachable — githubd could not reach api.github.com when persisting the bind; retry in a minute.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/apps/{slug}/instances:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [instances]
      operationId: listInstances
      summary: Read-only instance list for an app.
      responses:
        '200':
          description: Instances belonging to the app.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstanceResponse' }
              example:
                - {"id":"0123456789abcdef0123456789abcdef","app_id":"0123456789abcdef0123456789abcdef","deployment_id":"0123456789abcdef0123456789abcdef","state":"running","ram_mb":256,"started_at":"2026-07-23T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/logs:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [apps]
      operationId: streamAppLogs
      summary: Stream app logs (SSE).
      description: |
        Server-Sent Events stream of instance logs. NOTE: this endpoint is
        currently mounted behind `s.authLimited` and is documented here for
        reference; the dashboard and CLI also consume it directly.
      parameters:
        - name: follow
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
          description: If 1, hold the connection open and stream new entries.
        - name: grep
          in: query
          schema: { type: string }
          description: Substring filter applied to each log line.
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 lower-bound on the line timestamp.
        - name: level
          in: query
          schema: { type: string, enum: [info, warn, error] }
          description: >
            Exact match on the structured `level` field (info, warn, or error).
            Empty = no level filter. The CLI and the apid handler both validate
            against the same enum (api.IsValidLogLevel in pkg/api/logs.go);
            an unknown value short-circuits with an SSE error frame carrying
            code invalid_level.
      responses:
        '200':
          description: A text/event-stream of structured log lines, terminated by an empty SSE frame when the connection closes.
          content:
            text/event-stream: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/secrets:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List sealed secrets on an app.
      responses:
        '200':
          description: Sealed-secret envelopes on the app (plaintext never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecretListResponse'
                example: {"items":[],"next_before":null}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/secrets/{key}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/SecretKey'
    put:
      tags: [secrets]
      operationId: setSecret
      summary: Set a sealed secret.
      description: |
        Seals the plaintext value against the host X25519 recipient and
        persists the ciphertext. The plaintext never lands in PG.
      requestBody:
        required: true
        description: "Secret payload — key name + plaintext. Sealed at rest; plaintext never returned."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAppSecretRequest'
              example: {"key":"DATABASE_URL","value":"postgres://..."}
      responses:
        '200':
          description: The stored sealed-secret envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecretResponse'
                example: {"key":"DATABASE_URL","sealed_ciphertext":"<base64 x25519+xsalsa20-poly1305 ciphertext>","version":1,"created_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanLimitSecrets' }
        '413': { $ref: '#/components/responses/SecretValueTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a sealed secret.
      responses:
        '204': { description: No body. The sealed-secret envelope was removed. }
        '400': { $ref: '#/components/responses/SecretNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Per-app private-registry credentials (issue #461 / ADR-062) ────────
  # Sealed Basic Auth per (app, registry_host). Free plan returns 403
  # (RegistryCredentialMax == 0). Password is never returned; DELETE
  # uses ?registry=<host> query param because registry hosts may carry
  # a :port and path segments don't escape cleanly.

  /v1/apps/{slug}/registry-credentials:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [registry]
      operationId: listRegistryCredentials
      summary: List sealed private-registry credentials on an app.
      description: |
        Returns every (registry, username, timestamps) triple on the app.
        Plaintext passwords are never returned — imaged transiently
        unseals the ciphertext in the pull path. Quota metadata
        (`quota_max`, `count`) is included so the CLI can render a
        progress bar without a second call.
      responses:
        '200':
          description: List of credential envelopes on the app (plaintext never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRegistryCredentialListResponse'
                example: {"credentials":[{"registry":"registry.gregale.dev","username":"alice","created_at":"2026-08-01T11:25:00Z","updated_at":"2026-08-01T11:25:00Z"}],"quota_max":2,"count":1}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [registry]
      operationId: setRegistryCredential
      summary: Set or replace a sealed private-registry credential.
      description: |
        Seals the plaintext password against the host X25519 recipient
        (namespace `"registry_creds"`) and upserts the `(app_id, registry)`
        row. The plaintext never lands in PG. Re-PUTs of an existing
        `(app, host)` replace the ciphertext and bump `updated_at`
        WITHOUT consuming a new quota slot.
      requestBody:
        required: true
        description: "Registry host + username + plaintext password. Sealed at rest."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAppRegistryCredentialRequest'
              example: {"registry":"registry.gregale.dev","username":"alice","password":"s3cret-basic-auth-pw"}
      responses:
        '200':
          description: The stored credential envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRegistryCredentialResponse'
                example: {"registry":"registry.gregale.dev","username":"alice","created_at":"2026-08-01T11:25:00Z","updated_at":"2026-08-01T11:25:00Z"}
        '400': { $ref: '#/components/responses/InvalidRegistryHost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanRegistryCredentialsNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PlanRegistryCredentialQuota' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [registry]
      operationId: deleteRegistryCredential
      summary: Delete a sealed private-registry credential.
      description: |
        Removes the `(app_id, registry)` row. The registry host is the
        URL resource and is supplied via the `?registry=` query param
        (URL-encoded). Hosts may carry a `:port` — path segments don't
        escape cleanly.
      parameters:
        - name: registry
          in: query
          required: true
          description: "Registry host to delete (URL-encoded; matches the host stored on the row)."
          schema: { type: string, maxLength: 253 }
      responses:
        '204': { description: No body. The credential row was removed. }
        '400': { $ref: '#/components/responses/RegistryCredentialNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Customer env vars (issue #395 / ADR-045) ────────────────────────────
  # Plaintext per-app env store mirroring the secrets surface minus
  # the seal step. Audit kind env.set/env.deleted is distinct from
  # secret.set so dashboards can render a separate quota / change
  # signal. env:write is NOT MFA-gated because env vars are explicitly
  # non-sensitive runtime config — credentials stay on /secrets.

  # Issue #472 / ADR-054: per-app cosign signature-enforcement surface.
  # Three admin-scoped routes (require MFA + ScopesAdminOnly) plus
  # one PATCH endpoint for the require_signed toggle itself. The
  # customer PATCH /v1/apps/{slug} endpoint silently drops
  # require_signed so the gate can't be flipped by the customer.

  /v1/apps/{slug}/security:
    parameters:
      - $ref: '#/components/parameters/Slug'
    patch:
      tags: [security]
      operationId: patchAppSecurity
      summary: Toggle the require_signed flag for an app (admin + MFA).
      description: |
        Operator-only surface for the per-app cosign signature-enforcement
        flag (issue #472 / ADR-054). Mounted with `authLimited → requireMFA →
        requireScope(ScopesAdminOnly...)`. The customer PATCH /v1/apps/{slug}
        endpoint silently drops the field — flipping it through that surface
        is a no-op — so the only path that persists `require_signed=true` is
        this one.

        `nil` = no field set (no-op 200). Non-nil = atomic overwrite.

        Audit event: `app.security_updated` carries old/new values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSecurityRequest'
      responses:
        '200':
          description: The updated flag state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSecurityResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AppNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/apps/{slug}/trusted_signers:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [security]
      operationId: listAppTrustedSigners
      summary: List the per-app trusted-publisher list (admin).
      description: |
        Lists every (signer_name, public_key_pem) row for this app
        (issue #472 / ADR-054). Admin-scoped; the wire form is the
        base64-encoded DER SPKI bytes, NOT a PEM-armoured block.
        Empty list is the EXPECTED state for any app with
        require_signed=false. Mounted with `authLimited → requireMFA →
        requireScope(ScopesAdminOnly...)`.
      responses:
        '200':
          description: The trusted-publisher list (may be empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppTrustedSignerListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AppNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/apps/{slug}/trusted_signers/{name}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - in: path
        name: name
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        description: "Lower-case signer label. Matches the on-disk filename (without .pem) under /etc/faas/secrets/trusted-publishers/."
    put:
      tags: [security]
      operationId: putAppTrustedSigner
      summary: Onboard (or replace) a trusted publisher (admin + MFA).
      description: |
        Writes the (app_id, signer_name) row with the supplied base64-DER
        blob (issue #472 / ADR-054). apid decodes the blob and persists it
        verbatim; imaged mirrors the row to `/etc/faas/secrets/trusted-publishers/{name}.pem`
        and refreshes its in-memory trust cache on `pg_notify('trusted_signer_changed')`.
        PUT semantics: idempotent re-PUT replaces the previous blob.

        Audit event: `app.trusted_signer_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTrustedSignerRequest' }
      responses:
        '200':
          description: The onboarded trusted signer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedSigner' }
        '400':
          description: "trusted_signer_invalid (bytes out of [64,1024] range, non-ECDSA, non-P-256, etc)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Forbidden — admin scope required, OR plan_limit_trusted_signers when the per-app count would exceed the plan cap."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/AppNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [security]
      operationId: deleteAppTrustedSigner
      summary: Offboard a trusted publisher (admin + MFA).
      description: |
        Deletes the (app_id, signer_name) row. 404 returns the canonical
        `trusted_signer_not_found` Problem so `gregale trusted-publishers remove`
        can treat absent rows as idempotent success.

        Audit event: `app.trusted_signer_removed`.
      responses:
        '204':
          description: Row removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: "trusted_signer_not_found — the (slug, name) row does not exist."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/apps/{slug}/env:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [env]
      operationId: listEnv
      summary: List env vars on an app.
      description: |
        Returns every env var key + timestamps on the app. The plaintext
        value NEVER appears in the response — guest-init reads the value
        at process start from `/etc/faas/env.json` inside the guest.
      responses:
        '200':
          description: Env var envelopes on the app (plaintext never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEnvListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/env/{key}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/SecretKey'
    put:
      tags: [env]
      operationId: setEnv
      summary: Set an env var.
      description: |
        Persists the plaintext value verbatim in the app_envs table (no
        seal step). Env vars are non-sensitive runtime config by contract
        — credentials stay on `/v1/apps/{slug}/secrets/{key}`. Applies on
        next wake (cold-boot OR snapshot-restore); the running instance
        is unaffected.
      requestBody:
        required: true
        description: "Env var payload — key name + plaintext."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAppEnvRequest'
              example: {"value":"debug"}
      responses:
        '200':
          description: The stored env var envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEnvResponse'
                example: {"key":"LOG_LEVEL","created_at":"2026-07-28T11:25:00Z","updated_at":"2026-07-28T11:25:00Z"}
        '400': { $ref: '#/components/responses/EnvVarInvalidKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanLimitEnvVars' }
        '413': { $ref: '#/components/responses/EnvValueTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [env]
      operationId: deleteEnv
      summary: Delete an env var.
      responses:
        '204': { description: No body. The env var was removed. }
        '400': { $ref: '#/components/responses/EnvVarNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Deployments ──────────────────────────────────────────────────────────

  /v1/deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: List deployments across all apps on the account.
      description: |
        Paged backwards (newest first). `next_before` is an opaque cursor
        (RFC3339Nano of the `created_at`); pass it on the next request to
        page backwards. Empty `next_before` means end of list.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Page size (1–200, default 50).
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339Nano cursor from a previous response's `next_before`.
      responses:
        '200':
          description: A paginated list of deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponse'
                example: {"items":[],"next_before":null}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/deployments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id32'
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: Fetch one deployment.
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","app_id":"0123456789abcdef0123456789abcdef","deployment_id":"0123456789abcdef0123456789abcdef","status":"running","commit_sha":"abc1234","created_at":"2026-07-23T11:25:00Z","finished_at":"2026-07-23T11:26:00Z","source_bytes":12345678}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/deployments/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/Id32'
    get:
      tags: [deployments]
      operationId: streamDeploymentLogs
      summary: Stream build logs (SSE).
      description: |
        Server-Sent Events stream of build logs. `follow=1` holds the
        connection open until the build completes.
      parameters:
        - name: before_seq
          in: query
          schema: { type: integer }
          description: Stream cursor — return only log entries with seq strictly less than this value.
        - name: limit
          in: query
          schema: { type: integer }
          description: Maximum number of log entries to return in the initial burst before streaming.
        - name: follow
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
          description: If 1, hold the connection open and stream new build log entries as they arrive.
      responses:
        '200':
          description: A text/event-stream of build log entries, terminated by an empty SSE frame when the build finishes.
          content:
            text/event-stream: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Builds (ADR-038, Tier 3 / issue #197 B3.10-read half) ───────────────
  # The provenance route is the only /v1/builds surface today.
  # deployments.id remains the parent resource; Build:read scope
  # (api.ScopesReadSurface) gates the read.

  /v1/builds/{id}/provenance:
    parameters:
      - $ref: '#/components/parameters/Id32'
    get:
      tags: [deployments]
      operationId: getBuildProvenance
      summary: Get build provenance.
      description: |
        Returns the ADR-038 `build_provenance` row for a single build.
        Each successful build produces exactly one provenance row
        (builderd's populator runs at the `markSucceeded` sites); the
        row is the customer-visible "what ran?" record: buildkit /
        railpack version, base / runner digests, source URL + commit
        SHA, plan, builder node ID, and the build's started_at /
        finished_at timestamps.

        A 404 with `code=build_provenance_not_found` is returned when
        the build exists but no provenance row landed (the populator
        logs a WARN inside builderd on a failed INSERT — the build
        itself still succeeded). A 404 with `code=not_found` is
        returned when no build row matches the id, or when the
        build's owning app belongs to a different account.
      responses:
        '200':
          description: The build provenance row, with every field populated. Empty strings indicate a column the populator hasn't filled yet (the schema half of Phase 2 is in this PR; cosign / SBOM populate the rest in Phase 3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildProvenanceResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Either the build row is missing, OR the build exists but the populator INSERT failed (code=build_provenance_not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # Companion route to /v1/builds/{id}/provenance; streams the
  # CycloneDX SBOM JSON the imaged syft populator persists during the
  # build (issue #299 / ADR-038 Phase 3). Returns 503 with
  # code=build_sbom_unavailable when the populator hasn't run for this
  # build (pre-Phase-3 build, or imagd's syft step was best-effort
  # WARNed). Same IDOR-safe Build→Deployment→App→AccountID check as the
  # provenance route.

  /v1/builds/{id}/sbom:
    parameters:
      - $ref: '#/components/parameters/Id32'
    get:
      tags: [deployments]
      operationId: getBuildSbom
      summary: Get build SBOM (CycloneDX JSON).
      description: |
        Streams the CycloneDX 1.5 SBOM JSON generated by `imaged`'s
        post-build syft pass (issue #299). The body is the raw SBOM
        document; the response content-type is
        `application/vnd.cyclonedx+json` so external tooling
        (cyclonedx-cli validate, jq with `@cyclonedx-json`, Grype's
        `--from-file=cyclonedx-json`) can dispatch on header alone.

        Three failure modes, each with its own code so the SDK and
        `faas build sbom <id>` can branch:

          - `404 not_found` — the build id does not exist, OR the build
            belongs to another account (the handler returns the same
            surface on both so account-existence isn't probeable).
          - `503 build_sbom_unavailable` — the build row exists for this
            account but imaged's syft populator did not persist a
            CycloneDX document (pre-PR build, or best-effort WARN).
            The CLI prints "no SBOM for this build" and exits 1; the
            operator's job is to re-deploy imaged with Phase 3 active.
          - `503 capacity_unavailable` — the SBOM exists but the file
            was unreadable from disk (storage backend returned a
            transient error). The customer retries once.
      responses:
        '200':
          description: The CycloneDX SBOM JSON document, served verbatim from the storage backend.
          content:
            application/vnd.cyclonedx+json:
              schema:
                type: object
                additionalProperties: true
                description: |
                  Raw CycloneDX 1.5 JSON. The schema is not pinned
                  because CycloneDX extends over time (CSAF/NTIA
                  fields may appear); consumers should treat the
                  document as opaque JSON and pass it to a CycloneDX-
                  aware validator.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Either the build row is missing, OR the build exists but belongs to a different account (code=not_found on every negative path so account-existence isn't probeable).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The SBOM populator has not produced an artefact for this build (code=build_sbom_unavailable), or the storage backend failed (code=capacity_unavailable).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Custom domains ───────────────────────────────────────────────────────

  /v1/domains:
    get:
      tags: [domains]
      operationId: listDomains
      summary: List custom domain bindings.
      responses:
        '200':
          description: Custom-domain bindings on the account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomDomainResponse' }
              example:
                - {"id":"0123456789abcdef0123456789abcdef","domain":"app.example.com","app_id":"0123456789abcdef0123456789abcdef","verified":true,"tls_state":"active","created_at":"2026-07-23T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [domains]
      operationId: createDomain
      summary: Bind a custom domain.
      requestBody:
        required: true
        description: "Domain-bind payload — domain string + target app slug. See CreateCustomDomainRequest."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomDomainRequest'
              example: {"domain":"app.example.com","app_id":"0123456789abcdef0123456789abcdef"}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new custom-domain binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomainResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","domain":"app.example.com","app_id":"0123456789abcdef0123456789abcdef","verified":true,"tls_state":"active","created_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/domains/{domain}:
    parameters:
      - name: domain
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9.\-]+$' }
        description: The custom domain string (e.g. `app.example.com`).
    delete:
      tags: [domains]
      operationId: deleteDomain
      summary: Remove a custom domain binding.
      responses:
        '204': { description: No body. The binding was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Crons ────────────────────────────────────────────────────────────────

  /v1/crons:
    get:
      tags: [crons]
      operationId: listCrons
      summary: List cron triggers.
      responses:
        '200':
          description: Cron triggers on the account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CronResponse' }
              example:
                - {"id":"0123456789abcdef0123456789abcdef","app_id":"0123456789abcdef0123456789abcdef","schedule":"*/5 * * * *","path":"/cron","enabled":true,"created_at":"2026-07-23T11:25:00Z","last_fired_at":"2026-07-23T11:20:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [crons]
      operationId: createCron
      summary: Create a cron trigger.
      requestBody:
        required: true
        description: "Cron payload — schedule expression + target URL. See CreateCronRequest."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCronRequest'
              example: {"schedule":"*/5 * * * *","target_url":"https://hello-world.example.com/cron"}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new cron trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","schedule":"*/5 * * * *","target_url":"https://hello-world.example.com/cron","enabled":true,"last_run_at":"2026-07-23T11:20:00Z","next_run_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/CronInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CronInvalid' }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/crons/{id}:
    parameters:
      - $ref: '#/components/parameters/Id32'
    patch:
      tags: [crons]
      operationId: updateCron
      summary: Partial-update a cron.
      requestBody:
        required: true
        description: "Cron patch — every field is optional. See UpdateCronRequest."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCronRequest'
              example: {"enabled":false,"schedule":"0 * * * *"}
      responses:
        '200':
          description: The updated cron trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","schedule":"*/5 * * * *","target_url":"https://hello-world.example.com/cron","enabled":true,"last_run_at":"2026-07-23T11:20:00Z","next_run_at":"2026-07-23T11:25:00Z"}
        '400': { $ref: '#/components/responses/CronInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [crons]
      operationId: deleteCron
      summary: Delete a cron.
      responses:
        '204': { description: No body. The cron trigger was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Projects (ADR-050 / Phase 3) ───────────────────────────────────
  # Two endpoints:
  #   POST /v1/projects/scan  — dry-run; runs reposcan.Scan over the
  #                             uploaded tarball and returns a plan
  #                             with can_apply + plan_token. Never
  #                             writes.
  #   POST /v1/projects       — applies the plan in one transaction;
  #                             emits NotifyAppChanged per inserted
  #                             app; surfaces the limit problem on
  #                             over-quota with zero rows inserted.
  # Both accept the same multipart body shape; the only difference is
  # the optional `plan_token` query parameter on /v1/projects, which
  # lets the CLI pass back the dry-run token to skip the second
  # extract on the interactive flow.

  /v1/projects/scan:
    post:
      tags: [projects]
      operationId: scanProject
      summary: Scan an uploaded tarball and return a deploy plan.
      description: |
        Dry-run. Accepts a multipart upload (`source=<tar.gz>`,
        `project_slug`, `production_branch`, `install_id`, `only`)
        and returns a PlanResponse with the discovered workloads,
        managed services, derived scan_source, and a plan_token
        that the apply endpoint can echo back to skip the
        second extract.

        On over-quota the response carries `can_apply=false`
        (and `crons_not_allowed=true` for Free plan) so the CLI
        can branch without a second request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectScanRequest'
      responses:
        '200':
          description: The deploy plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              example:
                project_slug: my-app
                scan_source: compose
                tier: compose
                workloads:
                  - {name: api, root_dir: '', command: [], ports: [8080]}
                  - {name: worker, root_dir: '', command: [], ports: []}
                managed:
                  - {name: db, kind: postgres, env_hint: DATABASE_URL}
                crons:
                  - {workload_name: nightly, schedule: "0 3 * * *", path: "/", enabled: true}
                observed_apps: 3
                observed_crons: 1
                limit_apps: 5
                limit_crons: 5
                can_apply: true
                plan_token: eyJoYXMiOiI...
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CronInvalid' }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '413': { $ref: '#/components/responses/SourceTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/projects:
    post:
      tags: [projects]
      operationId: applyProject
      summary: Apply a deploy plan in one transaction.
      description: |
        Accepts the same multipart body as /scan plus an optional
        `plan_token` query parameter echoing the dry-run token. On
        success the response carries the inserted project_id and
        per-app IDs so the CLI's `--yes` flow can render
        `applied: <slug> → <app_id>`. On quota the response is
        the matching RFC 7807 problem (402 Free crons, 403 apps
        or cron cap) with zero rows inserted.

        The apply handler resolves workload-name → app_id from
        the just-inserted apps and inserts crons in a follow-up
        pass; the quota check ran inside ApplyProjectPlan's Tx.
      parameters:
        - name: plan_token
          in: query
          required: false
          description: Echo of the dry-run plan_token (base64-JSON). Omit to skip the cache.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectApplyRequest'
      responses:
        '200':
          description: The applied project + apps + crons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
              example:
                project_id: 0123456789abcdef0123456789abcdef
                apps:
                  - {slug: api, id: 0123456789abcdef0123456789abcdef}
                  - {slug: worker, id: 0123456789abcdef0123456789abcdef}
                scan_source: compose
                can_apply: true
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CronInvalid' }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '409': { $ref: '#/components/responses/ValidationFailed' }
        '413': { $ref: '#/components/responses/SourceTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Alert rules (issue #396 / ADR-045 PR 3) ─────────────────────────
  # Per-app CRUD surface. Account-wide rules (app_id == "") appear in
  # the per-app list endpoint but the create/update/delete endpoints
  # pin to a specific app. The /rotate-secret action mints a fresh
  # server-side plaintext; the response carries the masked constant +
  # rotated_at only.

  /v1/apps/{slug}/alerts:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [alert_rules]
      operationId: listAlertRules
      summary: List alert rules visible at this app.
      description: |
        Returns both app-scoped rules (app_id == <slug>) and
        account-wide rules (app_id == ""). Account-wide rules
        apply to every app on the account.
      responses:
        '200':
          description: Alert rules on the account, filtered to those visible at this app.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRuleResponse' }
              example:
                - {"id":"0123456789abcdef0123456789abcdef","app_id":"0123456789abcdef0123456789abcdef","name":"p99 > 500ms","enabled":true,"metric":"latency_p99_ms","comparison":"gt","threshold":500,"window_spec":"5m","webhook_url":"https://example.com/hook","webhook_secret_sealed_masked":"***","cooldown_minutes":15,"state":"ok","created_at":"2026-07-28T10:00:00Z","updated_at":"2026-07-28T10:00:00Z"}
                - {"id":"fedcba9876543210fedcba9876543210","app_id":"","name":"error_rate > 1%","enabled":true,"metric":"error_rate_pct","comparison":"gt","threshold":1,"window_spec":"15m","webhook_url":"https://example.com/acct","webhook_secret_sealed_masked":"***","cooldown_minutes":30,"state":"ok","created_at":"2026-07-28T09:00:00Z","updated_at":"2026-07-28T09:00:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/AlertRuleInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [alert_rules]
      operationId: createAlertRule
      summary: Create an alert rule.
      description: |
        Plaintext webhook_secret arrives in the body, is sealed
        via the host age recipient, and never appears in a
        response. webhook_url is SSRF-guarded at write time
        (loopback + metadata ranges denied).
      requestBody:
        required: true
        description: 'Alert rule payload. See CreateAlertRuleRequest.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAlertRuleRequest' }
            example:
              name: "p99 > 500ms"
              metric: "latency_p99_ms"
              comparison: "gt"
              threshold: 500
              window_spec: "5m"
              webhook_url: "https://example.com/hook"
              webhook_secret: "shh"
              cooldown_minutes: 15
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new alert rule (carries the masked secret).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleResponse' }
        '400': { $ref: '#/components/responses/AlertRuleInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/AlertRuleInvalid' }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlertRuleInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Id32'
    get:
      tags: [alert_rules]
      operationId: getAlertRule
      summary: Fetch one alert rule by id.
      responses:
        '200':
          description: The alert rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [alert_rules]
      operationId: updateAlertRule
      summary: Partial-update an alert rule.
      description: |
        Every field is optional. metric cannot cross families
        (e.g. error_rate_pct → failed_invocations) — returns
        400 alert_rule_invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlertRuleRequest' }
            example: {"name":"p99 > 750ms","cooldown_minutes":30}
      responses:
        '200':
          description: The updated alert rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleResponse' }
        '400': { $ref: '#/components/responses/AlertRuleInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/AlertRuleInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [alert_rules]
      operationId: deleteAlertRule
      summary: Delete an alert rule.
      responses:
        '204': { description: No body. The rule was removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/AlertRuleInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/alerts/{id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Id32'
    post:
      tags: [alert_rules]
      operationId: rotateAlertRuleSecret
      summary: Mint a new webhook HMAC secret.
      description: |
        Server-mints a 32-byte secret, base64-encodes it, and
        overwrites the row's sealed ciphertext in place. The
        plaintext is NEVER returned in the response — the body
        carries the masked constant + rotated_at only.
      responses:
        '200':
          description: Rotation succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateAlertRuleSecretResponse' }
              example:
                rotated_at: "2026-07-28T12:00:00Z"
                webhook_secret_sealed_masked: "***"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/AlertRuleInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Event-driven surface (Move 2) ─────────────────────────────────────────
  # Customer-facing surface for the Move 1 invocations backend. The five
  # shapes — async_invoke, queue_send, queue_receive, queue_ack, delayed_task
  # — share a single backing table (invocations) and a single emit
  # (pg_notify on invocation_done). The long-poll routes (invoke,
  # queues/receive) cap at 30s server-side; free plan invokes at 5s.

  /v1/apps/{slug}/invoke:
    post:
      tags: [invocations]
      operationId: invokeApp
      summary: Sync-invoke an app; long-poll for the result.
      description: |
        Enqueues an invocation row and waits for the drain to drive it
        to a terminal state. Server-side cap is 30s on paid plans, 5s
        on Free. Returns 504 (long_poll_timeout) when the cap elapses;
        the customer can immediately re-call /v1/invocations/{id}
        to pick up the eventual result.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: The completed invocation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvokeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanFeatureGated' }
        '413': { $ref: '#/components/responses/PlanSourceBytes' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/LongPollTimeout' }

  /v1/apps/{slug}/invoke/async:
    post:
      tags: [invocations]
      operationId: invokeAppAsync
      summary: Async-invoke an app; returns id + status URL.
      description: |
        Enqueues an invocation row and returns immediately with the
        id. The customer polls /v1/invocations/{id} (or uses the
        dashboard SSE) for the eventual row state.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvokeRequest' }
      responses:
        '202':
          description: The enqueued invocation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncInvokeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanFeatureGated' }
        '413': { $ref: '#/components/responses/PlanSourceBytes' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/queues/send:
    post:
      tags: [queues]
      operationId: queueSend
      summary: Enqueue a row on the per-app FIFO queue.
      description: |
        Cap-checked against the plan's MaxQueueDepth (Hobby 5, Pro 25,
        Scale 100). The drain re-checks at dispatch tick.
      x-faas-queue-leases: false
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueSendRequest' }
      responses:
        '201':
          description: The enqueued row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSendResponse' }
        '403': { $ref: '#/components/responses/PlanQueueDepth' }
        '413': { $ref: '#/components/responses/PlanSourceBytes' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/queues/receive:
    post:
      tags: [queues]
      operationId: queueReceive
      summary: Long-poll for the next dispatched row.
      description: |
        Returns 200 with the dequeued row, or 204 (no body) if the
        server-side 30s budget elapses with no event. The customer
        retries on 204.
      x-faas-queue-leases: true
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: A dispatched row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueReceiveResponse' }
        '204': { description: No row dispatched within the budget. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlanFeatureGated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/queues/{id}/ack:
    post:
      tags: [queues]
      operationId: queueAck
      summary: Ack a queue row (idempotent).
      x-faas-queue-leases: false
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Id32'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: No body. The ack (or a re-ack) was accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # Issue #394 — queue introspection (read-only).
  /v1/apps/{slug}/queues/state:
    get:
      tags: [queues]
      operationId: queueState
      summary: Read queue depth, in-flight count, and oldest pending age.
      description: |
        Read-only depth / in-flight / oldest-pending stats. NO lease is
        acquired and no row is mutated — the response can be polled at
        any cadence without affecting drain behaviour. Free plans can
        call this for diagnostics even though they cannot send.
      x-faas-queue-leases: false
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Queue stats for the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueStateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/queues/peek:
    get:
      tags: [queues]
      operationId: queuePeek
      summary: List pending queue rows without acquiring a lease.
      description: |
        Read-only peek at pending rows, oldest first. Repeated calls
        return the same rows in the same order — the underlying SQL has
        no FOR UPDATE / FOR SHARE / advisory lock, so attempts is
        never incremented and no row state changes. Cursor pagination
        matches the existing `?before=<id>` convention. NOT equivalent
        to `queues/receive` — peek never leases.
      x-faas-queue-leases: false
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/QueueCursorLimit'
        - $ref: '#/components/parameters/QueueCursorBefore'
      responses:
        '200':
          description: A page of pending rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePeekResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/queues/dead_letter:
    get:
      tags: [queues]
      operationId: queueDeadLetter
      summary: List queue rows that exhausted the plan's retry budget.
      description: |
        Read-only list of rows in `state='dead_letter'`, newest first.
        The drain transitions a row here once it has failed
        `MaxQueueAttempts` times for the app's plan (Hobby 3, Pro 10,
        Scale 25). NO lease is acquired and no row is mutated. Replaying
        a dead-letter row is out of scope for this endpoint — the
        customer re-sends via `queues/send`.
      x-faas-queue-leases: false
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/QueueCursorLimit'
        - $ref: '#/components/parameters/QueueCursorBefore'
      responses:
        '200':
          description: A page of dead-letter rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueDeadLetterResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/{slug}/delayed-tasks:
    post:
      tags: [delayed_tasks]
      operationId: delayedTaskCreate
      summary: Schedule a delayed task to fire at a future time.
      description: |
        Cap-checked against the plan's MaxDelayedTasksPerApp (Hobby 5,
        Pro 50, Scale 1_000_000). The drain re-checks at dispatch.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelayedTaskRequest' }
      responses:
        '201':
          description: The newly-scheduled task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelayedTaskResponse' }
        '400': { $ref: '#/components/responses/InvalidScheduledAt' }
        '403': { $ref: '#/components/responses/PlanDelayedTasksCap' }
        '413': { $ref: '#/components/responses/PlanSourceBytes' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/invocations:
    get:
      tags: [invocations]
      operationId: listInvocations
      summary: List recent invocations on the account.
      description: |
        Paginated by `?before=<id>` (the LAST id of the returned slice).
        Defaults to 20 per page; capped at 200.
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: "Cursor — return rows whose id is strictly less than this. Omit for the most recent page."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: "Page size; 1-200, default 20."
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListInvocationsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/instances:
    get:
      tags: [instances]
      operationId: listInstancesForAccount
      summary: List every live instance across the caller's account.
      description: |
        Replaces the per-app fan-out from `/v1/apps/{slug}/instances`
        with one account-scoped read (issue #393). Each instance carries
        its `app_id`; cross-account isolation is enforced by the SQL
        `apps.account_id = $1` join (test: see
        `TestListInstancesForAccount_CrossAccountIsolation`).

        Cursor: `?before=<id>` (the instances.id UUIDv7). Defaults to 25
        per page; capped at 100; invalid `limit` returns 400
        `code_validation` with `limit=100` and the observed value
        (RFC 7807 strict mode, matching `/v1/invoices`).

        Rate-limit tiering: one call now replaces N per-app calls,
        so per-page-load token spend drops from N to 1. The
        per-account bucket (ADR-040) still applies at the gatewayd
        edge; this route charges 1 token via the apid authLimited
        middleware, same as every other `/v1/*` route.
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "Cursor (instances.id UUIDv7). Omit for the most recent page."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: "Page size; server clamps to 1..100, returns 400 with `limit=100` and the observed value on bad input."
      responses:
        '200':
          description: One page of instances, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListInstancesResponse' }
              example:
                instances:
                  - id: "0123456789abcdef0123456789abcdef"
                    app_id: "0123456789abcdef0123456789abcdef"
                    deployment_id: "0123456789abcdef0123456789abcdef"
                    state: "running"
                    ram_mb: 256
                    started_at: "2026-07-23T11:25:00Z"
                next_before: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecretsForAccount
      summary: List every sealed secret across the caller's account.
      description: |
        Replaces the per-app fan-out from `/v1/apps/{slug}/secrets`
        with one account-scoped read (issue #393). Each row carries
        the owning app's `app_id` and `app_slug` so the dashboard
        can render "foo-app / DATABASE_URL" without a parallel
        `/v1/apps` round-trip.

        **Plaintext never appears here** — only the age-sealed
        envelope (base64). The plaintext value lives transiently in
        the PUT handler and never crosses the apid wire.

        Cursor: `?before=<slug>|<key>` — the (app_slug, key) pair,
        pipe-separated. The SQL splits it back via `split_part`.
        Sort order is (app_slug ASC, key ASC). Default limit 25,
        max 100 (strict 400 on bad input, matching `/v1/invoices`).
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: "Cursor in the form `<slug>|<key>`. Omit for the first page."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: "Page size; server clamps to 1..100, returns 400 on bad input."
      responses:
        '200':
          description: One page of sealed-secret envelopes, ordered by (app_slug ASC, key ASC).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSecretsForAccountResponse' }
              example:
                secrets:
                  - app_id: "0123456789abcdef0123456789abcdef"
                    app_slug: "foo-app"
                    key: "DATABASE_URL"
                    ciphertext: "YWdlLWVuY3J5cHRpb24..."
                    created_at: "2026-07-23T11:25:00Z"
                    updated_at: "2026-07-23T11:25:00Z"
                next_before: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/apps/metrics:
    get:
      tags: [apps]
      operationId: getAppsMetrics
      summary: Account-wide per-app metrics rollup.
      description: |
        One call replaces N per-app `/v1/apps/{slug}/metrics` calls
        (issue #393). Returns the same `AppMetricsResponse` shape
        per app, keyed by `app_slug`, so the dashboard can render
        all apps on a single page without a per-app fan-out.

        Range is the closed vocabulary from the per-app endpoint:
        `5m` (default) | `15m` | `1h` | `6h` | `24h` | `7d` | `15d`.
        Prometheus failure short-circuits the entire response
        (never partial-populated) and emits `source:
        "degraded: <reason>"` with zeroed `apps`, matching the
        per-app contract exactly.

        PromQL cost: 6 round-trips regardless of N apps (vs. 7N
        for the naive per-app loop) — see `pkg/promql.Client.QueryMap`
        and `Client.QueryBuckets`.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [5m, 15m, 1h, 6h, 24h, 7d, 15d]
            default: 5m
          description: "Time window applied to every per-app rollup row. Default `5m`."
      responses:
        '200':
          description: The rollup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppsMetricsResponse' }
              example:
                range: "5m"
                source: "prometheus"
                as_of: "2026-07-28T13:00:00Z"
                apps:
                  foo-app:
                    app_id: "0123456789abcdef0123456789abcdef"
                    range: "5m"
                    source: "prometheus"
                    as_of: "2026-07-28T13:00:00Z"
                    request_count: 142
                    latency_p50_ms: 12.4
                    latency_p95_ms: 87.3
                    latency_p99_ms: 412.5
                    error_rate_pct: 0.7
                    cold_start_pct: 8.5
                    wake_p95_ms: 380.2
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/invocations/{id}:
    get:
      tags: [invocations]
      operationId: getInvocation
      summary: Read a single invocation by id (account-scoped).
      parameters:
        - $ref: '#/components/parameters/Id32'
      responses:
        '200':
          description: The row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/delayed-tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id32'
    get:
      tags: [delayed_tasks]
      operationId: delayedTaskGet
      summary: Read a single delayed task by id.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelayedTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [delayed_tasks]
      operationId: delayedTaskCancel
      summary: Cancel a pending delayed task.
      description: |
        Idempotent: a re-cancel (or a cancel of an already-fired row)
        is a 204. The drain ignores cancelled rows at dispatch.
      responses:
        '204': { description: No body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── API keys ─────────────────────────────────────────────────────────────

  /v1/keys:
    get:
      tags: [keys]
      operationId: listKeys
      summary: List API keys (no plaintext).
      responses:
        '200':
          description: API key metadata on the account. Plaintext is never returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIKeyResponse' }
              example:
                - {"id":"0123456789abcdef0123456789abcdef","prefix":"fp_live_ab","label":"ci-deploy","scopes":["apps:read","deploy:write"],"created_at":"2026-07-23T11:25:00Z","last_used_at":"2026-07-23T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [keys]
      operationId: createKey
      summary: Mint a new API key.
      description: |
        Returns the plaintext key **once**. The plaintext is never stored
        and cannot be retrieved; subsequent GETs return only the prefix.
      requestBody:
        required: true
        description: "Create a new API key for the authenticated account. Plaintext is returned exactly once in the 201 response and cannot be recovered later — store it immediately. See IAM-1, ADR-034 rev2 for the scope vocabulary."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
              example: {"label":"ci-deploy"}
      responses:
        '201':
          description: The new API key. **The plaintext is returned exactly once** — every subsequent GET returns only the prefix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResponse'
                example: {"id":"0123456789abcdef0123456789abcdef","prefix":"fp_live_ab","label":"ci-deploy","scopes":["apps:read","deploy:write"],"created_at":"2026-07-23T11:25:00Z","last_used_at":"2026-07-23T11:25:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/Id32'
    delete:
      tags: [keys]
      operationId: deleteKey
      summary: Revoke an API key.
      responses:
        '204': { description: No body. The key was revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/Id32'
    post:
      tags: [keys]
      operationId: rotateKey
      summary: Rotate an API key.
      description: |
        Mints a new key (status='active') and demotes the old key in
        a single transaction (issue #189 / IAM-5). The new key
        inherits the predecessor's label + scopes so the customer's
        CI config does not need to chase a label change.

        The old key's `expires_at` is OVERWRITTEN to the grace
        deadline (now + grace_window_days, where grace_window_days
        resolves from the per-account override or the 7-day plan
        default). Status flips to 'grace' for the window, then to
        'revoked' at the deadline. Setting
        `accounts.key_grace_window_days = 0` makes rotation atomic
        (old key revoked immediately).

        Returns the new plaintext exactly once — the old plaintext
        is not re-issued (we only store the SHA-256 hash). The
        customer's CI script captures the new plaintext at the
        moment of rotation and uses the new key thereafter; the old
        key remains valid only for the grace window.

        Quota: rotation is quota-neutral (-1 +1 = 0 net). A
        customer AT the per-account cap can still rotate.
      responses:
        '200':
          description: New key minted, old key now in 'grace' (or 'revoked' if grace_window_days=0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateKeyResponse'
              example:
                key:
                  id: "0123456789abcdef0123456789abcdef"
                  prefix: "fp_live_ab"
                  label: "ci-deploy"
                  scopes: ["apps:read","deploy:write"]
                  created_at: "2026-08-02T11:25:00Z"
                  status: "active"
                  rotated_from_id: "fedcba9876543210fedcba9876543210"
                key_plaintext: "fp_live_NEW_PLAINTEXT_HERE"
                old_key_id: "fedcba9876543210fedcba9876543210"
                old_key_expires_at: "2026-08-09T11:25:00Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "No such key, or the key is already revoked."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/account/keys/grace_window_days:
    get:
      tags: [keys]
      operationId: getGraceWindow
      summary: Read the per-account rotation grace-window override.
      description: |
        Returns the customer's current override (the value stored in
        `accounts.key_grace_window_days`) and the plan default
        alongside. `days=null` means "no override" — the rotation
        handler uses the plan default (api.DefaultAPIKeyGraceWindowDays = 7).
      responses:
        '200':
          description: Current override + plan default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraceWindowResponse'
              example: { days: 7, plan_default: 7 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [keys]
      operationId: setGraceWindow
      summary: Set the per-account rotation grace-window override.
      description: |
        Writes the override and invalidates the in-process cache so
        the next rotation observes the new value. `days=0` is atomic
        rotation (no grace); `days=null` (or omission) clears the
        override and falls back to the plan default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGraceWindowRequest'
            example: { days: 14 }
      responses:
        '200':
          description: Override applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraceWindowResponse'
              example: { days: 14, plan_default: 7 }
        '400':
          description: "Invalid body (e.g. negative days)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Audit events (IAM-4 / ADR-035) ───────────────────────────────────────

  /v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: List the caller's auth audit events.
      description: |
        Newest-first. Returns the customer's own security event timeline:
        logins, logouts, key mints/deletes, secret sets/deletes, plan
        changes, and account deletion scheduling/restore.

        The events table is append-only (spec §5 / §6.1). The response
        is bounded by `limit` (default 50, max 100). For a full-history
        pull, use `GET /v1/account/export`, which unions these events
        with the customer's GDPR-action rows.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: "Only return rows with `at >= since` (RFC 3339). Omit to read from the newest row."
        - name: kind_prefix
          in: query
          schema: { type: string }
          description: "Only return rows whose `kind` starts with this prefix (e.g. `key.` returns `key.created` and `key.deleted`)."
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: "Max rows to return. Silently capped at 100."
        - name: include_anonymous
          in: query
          schema: { type: boolean, default: false }
          description: |
            Wave 0 PR-C / ADR-047: also surface rows with `subject =
            NULL`. The defensive case where the customer's app row
            was deleted between wake and the stateless-advisory
            audit emit. Default `false` (the customer never sees
            subject=NULL rows); operators can flip to `true` via
            `?include_anonymous=true` for post-mortems.
        - name: app_id
          in: query
          schema: { type: string, format: uuid }
          description: |
            Wave 0 PR-C / ADR-047: filter the overscan window to
            events whose `data.app_id` matches the given uuid. The
            dashboard's `app_detail.html` "Stateless advisories"
            link uses this combo with `kind_prefix=stateless.advisory`
            to drill into a single app's advisories. Resolved
            post-SQL on the bounded overscan window; the events
            table is not indexed on `data`.
      responses:
        '200':
          description: Newest-first audit events for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditEventsResponse'
              example:
                limit: 50
                events:
                  - id: "42"
                    at: "2026-07-25T13:25:00Z"
                    actor: apid
                    kind: auth.login
                    subject: "0190f8e1-2a3b-7c4d-9e5f-6a7b8c9d0e1f"
                    data: { method: password }
                  - id: "41"
                    at: "2026-07-25T11:00:00Z"
                    actor: apid
                    kind: key.created
                    subject: "0190f8e1-2a3b-7c4d-9e5f-6a7b8c9d0e1f"
                    data: { key_id: "0123456789abcdef0123456789abcdef", scopes: [admin] }
        '400':
          description: Bad request — malformed `since` or `limit`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/audit-events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
        description: "Event row id (bigint as string)."
    get:
      tags: [audit]
      operationId: getAuditEvent
      summary: Fetch one auth audit event by id.
      description: |
        Returns the single event with that id if and only if it
        belongs to the caller's account. Cross-account access is
        indistinguishable from "not found" — a customer cannot
        enumerate other accounts' row counts by ID-probing.
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResponse'
              example:
                id: "42"
                at: "2026-07-25T13:25:00Z"
                actor: apid
                kind: auth.login
                subject: "0190f8e1-2a3b-7c4d-9e5f-6a7b8c9d0e1f"
                data: { method: password }
        '400':
          description: Bad request — id is not a positive integer.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Wake timeline (issue #517 / PR-C / ADR-064) ──────────────────────────

  /v1/apps/{slug}/wakes/{wake_id}/timeline:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
        description: "App slug (lowercase, kebab-case; per-account unique)."
      - name: wake_id
        in: path
        required: true
        schema: { type: string }
        description: |
          The per-wake correlation handle minted by the schedd
          engine (UUID v4 in production). The endpoint returns
          every `wake.*` events row whose `data.wake_id`
          matches — the partial index `events_wake_id_idx`
          (migrations/00113) serves the read in O(frames)
          regardless of the events table size.
    get:
      tags: [apps, observability]
      operationId: listWakeTimeline
      summary: List the canonical wake-timeline frames for one wake.
      description: |
        Oldest-first (forward narrative). Returns every typed
        `wake.*` events row for the given wake_id: queue_accepted
        → admitted → boot_started → boot_completed →
        readiness_200 → proxy_first_byte. Build and deploy
        failures (`wake.build_failed`, `wake.deploy_failed`,
        `wake.boot_failed`) are joined in alongside the success
        path so a single GET shows the whole lifecycle.

        The endpoint is a sub-resource of `/v1/apps/{slug}`;
        auth and rate-limit share the §12 per-app budget with
        logs/metrics/wake. Cross-account access 404s the
        same way unknown slugs do (forge-proof: every row's
        `data.app_id` is verified to match the resolved app).
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: "Only return rows with `at >= since` (RFC 3339)."
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
          description: "Max frames to return. Silently capped at 1000."
      responses:
        '200':
          description: Wake-timeline frames.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeTimelineResponse'
              example:
                wake_id: "abcdef01-2345-6789-abcd-ef0123456789"
                app_id: "0123456789abcdef0123456789abcdef"
                limit: 200
                next_cursor: ""
                events:
                  - at: "2026-07-25T13:25:00.123Z"
                    kind: wake.queue_accepted
                    actor: schedd
                    data: { wake_id: "abcdef01-2345-6789-abcd-ef0123456789", app_id: "0123456789abcdef0123456789abcdef", request_id: "r-1", queue_wait_ms: 12 }
                  - at: "2026-07-25T13:25:00.135Z"
                    kind: wake.admitted
                    actor: schedd
                    data: { wake_id: "abcdef01-2345-6789-abcd-ef0123456789", app_id: "0123456789abcdef0123456789abcdef", request_id: "r-1", account_id: "fdecba98-7654-3210-fedc-ba9876543210", plan: "pro" }
                  - at: "2026-07-25T13:25:00.420Z"
                    kind: wake.boot_started
                    actor: schedd
                    data: { wake_id: "abcdef01-2345-6789-abcd-ef0123456789", app_id: "0123456789abcdef0123456789abcdef", instance_id: "inst-1", node_id: "node-1", method: "restore" }
                  - at: "2026-07-25T13:25:01.180Z"
                    kind: wake.readiness_200
                    actor: vmmd
                    data: { wake_id: "abcdef01-2345-6789-abcd-ef0123456789", app_id: "0123456789abcdef0123456789abcdef", instance_id: "inst-1", node_id: "node-1", healthcheck_path: "/healthz", probe_count: 1, elapsed_ms: 760 }
                  - at: "2026-07-25T13:25:01.220Z"
                    kind: wake.proxy_first_byte
                    actor: gatewayd
                    data: { wake_id: "abcdef01-2345-6789-abcd-ef0123456789", app_id: "0123456789abcdef0123456789abcdef", request_id: "r-1", instance_id: "inst-1", node_id: "node-1", latency_ms: 40 }
        '400':
          description: Malformed query parameter on the wake-timeline read — `since` not RFC 3339 or `limit` out of range.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such app (slug) or wake_id is unknown.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Usage ────────────────────────────────────────────────────────────────

  /v1/usage:
    get:
      tags: [usage]
      operationId: getUsage
      summary: Per-app monthly usage.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-07' }
          description: Billing month in `YYYY-MM` form (UTC). Defaults to the current month.
      responses:
        '200':
          description: Per-app usage rows for the month.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageResponse' }
              example:
                - {"month":"2026-07","app_id":"0123456789abcdef0123456789abcdef","mb_seconds":1234,"requests":42,"included_gb_hours":50,"used_gb_hours":1.234,"next_before":null}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/usage/summary:
    get:
      tags: [usage]
      operationId: usageSummary
      summary: Monthly roll-up with overage math.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: Billing month in `YYYY-MM` form (UTC). Defaults to the current month for the roll-up.
      responses:
        '200':
          description: The monthly roll-up with overage math.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummaryResponse'
                example: {"month":"2026-07","plan":"hobby","included_gb_hours":50,"used_gb_hours":1.234,"overage_gb_hours":0,"overage_cents":0}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # Daily rollup row (ADR-048 §5). Distinct from /v1/usage/summary
  # which is monthly; the dashboard's per-day hot path reads this.
  # All fields are informational; not billed.
  /v1/usage/daily:
    get:
      tags: [usage]
      operationId: usageDaily
      summary: Per-app daily rollup (informational).
      parameters:
        - name: day
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-07-29' }
          description: Calendar day in `YYYY-MM-DD` form (UTC). Required.
      responses:
        '200':
          description: Per-app daily rollup rows for the requested day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyUsageListResponse'
              example: {"items":[{"app_id":"0123456789abcdef0123456789abcdef","day":"2026-07-29","mb_seconds":1234,"requests":42,"cpu_usec":5678,"tx_bytes":12345,"net_tx_bytes":23456,"net_rx_bytes":34567,"cold_boots":1,"builder_seconds":12}]}
        '400':
          description: Missing or malformed `day` query parameter.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # Storage rollup (ADR-049 §B.3). Per-(app, day) snapshot+layer
  # byte totals from the meterd storage rollup cron. Informational
  # only — the future "Pro plan 1 GB included" PR consumes this
  # surface. Distinct from /v1/usage which reports billable compute.
  /v1/usage/storage:
    get:
      tags: [usage]
      operationId: usageStorage
      summary: Per-app daily storage rollup (informational).
      parameters:
        - name: day
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-07-29' }
          description: Calendar day in `YYYY-MM-DD` form (UTC). Required for the storage rollup.
      responses:
        '200':
          description: Per-app storage rollup rows for the requested day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUsageListResponse'
              example: {"items":[{"app_id":"0123456789abcdef0123456789abcdef","day":"2026-07-29","snapshot_bytes":130000000,"layer_bytes":256000000}]}
        '400':
          description: Missing or malformed `day` query parameter on the storage rollup surface.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Billing history (issue #259) ──────────────────────────────────────
  # Account-scoped read of the billing-provider invoices persisted from
  # the Stripe / Paddle webhooks. Empty history returns 200 with items=[].
  /v1/invoices:
    get:
      tags: [usage]
      operationId: listInvoices
      summary: List the authenticated account's billing invoices.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: Optional `YYYY-MM` filter (UTC half-open range on period_end).
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: Cursor (RFC3339Nano) for the next older page. Omit for the first page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: Page size; server clamps to 1..100.
      responses:
        '200':
          description: One page of invoices, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
              example:
                items:
                  - id: "9f1d8e7c-6b5a-4d3c-2b1a-0fedcba98765"
                    provider: stripe
                    provider_invoice_id: in_1NxAbC2eZvKYlo2C0D4E5F6G
                    number: FaaS-2026-007
                    status: paid
                    period_start: "2026-07-01T00:00:00Z"
                    period_end:   "2026-07-31T23:59:59Z"
                    subtotal_cents: 900
                    tax_cents: 0
                    total_cents: 900
                    amount_paid_cents: 900
                    currency: eur
                    pdf_available: true
                    created_at: "2026-08-01T01:23:45Z"
                next_before: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Billing portal link (issue #253) ──────────────────────────────────
  # The dashboard's "Open Stripe billing portal" button and the CLI's
  # `faas billing portal` both hit this endpoint. The URL itself does
  # not mutate anything; the customer-facing mutations (card update,
  # cancel, plan change) live inside the Stripe-hosted portal that
  # the URL points to. Returns the operator-configured template
  # (FAAS_BILLING_PORTAL_URL with `{account_id}` substituted). An
  # empty url field is the "absent" sentinel — the operator has not
  # configured a portal on the box.
  /v1/billing/portal:
    get:
      tags: [billing]
      operationId: getBillingPortal
      summary: Get the operator-configured Stripe billing portal URL.
      description: |
        Returns the URL the customer should be sent to in order to
        manage their subscription (update card, view invoices,
        download receipts, cancel). The URL is server-rendered from
        the operator's `FAAS_BILLING_PORTAL_URL` template; the server
        does NOT call Stripe's `BillingPortal.Session` SDK on this
        path (issue #253 acceptance #3 partial — a follow-up PR will
        add the SDK call once the spec defines the contract).
      responses:
        '200':
          description: Portal URL (may be empty when the box has no portal configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPortalResponse'
              example:
                url: "https://billing.example.com/portal?account=9f1d8e7c-6b5a-4d3c-2b1a-0fedcba98765"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Operator credits (issue #279) ─────────────────────────────────────
  # Admin-only endpoint that issues a positive-cents credit to a
  # customer account. Two-layer auth: api.ScopesAdminOnly scope on
  # the API key AND the caller's email in the FAAS_ADMIN_EMAILS
  # allowlist. Idempotent on the Idempotency-Key header (24 h
  # dedupe). The credit is integer cents (CLAUDE.md "never float
  # on money") and the reason text is 3..500 chars (auditable).
  /v1/admin/accounts/{id}/credits:
    post:
      tags: [admin]
      operationId: issueAccountCredit
      summary: Issue a positive-cents credit to an account (admin-only).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Target account UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cents, reason]
              properties:
                cents:  { type: integer, minimum: 1, description: 'Credit amount in EUR cents (integer).' }
                reason: { type: string,  minLength: 3, maxLength: 500, description: 'Operator-supplied audit reason.' }
      responses:
        '201':
          description: Credit issued. Returns the new credit row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCreditResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code: admin_required — call requires a Bearer with the admin scope AND an email in FAAS_ADMIN_EMAILS.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Operator credit consumption (issue #279 PR-C) ─────────────────────
  # Admin-only + MFA-gated. Triggers the FIFO credit consumption
  # reducer against an invoice's overage in integer cents (CLAUDE.md).
  # Idempotent at two layers: the existing Idempotency-Key middleware
  # (24 h dedupe) and the partial unique index on credit_ledger
  # (provider_invoice_id, credit_id) — migration
  # 00056_credit_consumption.sql. A second call for the same invoice
  # returns 200 with already_consumed_for_invoice=true and the same
  # consumed_cents. Emits one credit.consumed audit row per drained
  # credit.
  /v1/invoices/{id}/consume-credits:
    post:
      tags: [admin]
      operationId: consumeInvoiceCredits
      summary: Drain active credits FIFO against an invoice's overage (admin-only, MFA-gated).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Invoice row UUID from GET /v1/invoices.
      responses:
        '200':
          description: Reducer ran (or replayed). consumed_cents is the floored integer cents drained against this invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumeInvoiceResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code: admin_required — call requires an admin-scoped Bearer with the caller email in FAAS_ADMIN_EMAILS AND a verified MFA factor.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─── Spec hosting (anonymous, public by design) ───────────────────────────
  # `apid` embeds api/openapi.yaml at build time and serves the same bytes
  # customers see in the repo. The /json variant re-emits the spec in JSON
  # for SDK generators that don't read YAML. Cache-Control: 300 s — short
  # enough that a PR rename shows up within five minutes, long enough to
  # absorb SDK codegen bursts.
  /v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPISpec
      summary: This spec, as YAML.
      description: |
        Machine-readable API description. Same bytes as
        `api/openapi.yaml` at the repo HEAD; embedded at build time
        via `//go:embed` in `pkg/apid/openapi_handler.go`. No auth.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document for this API.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
          content:
            application/yaml:
              schema: { type: string }

  /v1/openapi.json:
    get:
      tags: [meta]
      operationId: getOpenAPISpecJSON
      summary: This spec, as JSON.
      description: |
        Same spec, YAML parsed and re-emitted as JSON. Preferred by
        SDK generators (`openapi-generator`, `oapi-codegen`).
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document for this API, as JSON.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
          content:
            application/json:
              schema: { type: object }

  /v1/traces/{trace_id}:
    get:
      tags: [observability]
      operationId: getTrace
      summary: Retrieve a stored OpenTelemetry trace.
      description: |
        Issue #555. Returns the full span tree for a single trace_id
        (32-hex, the same as the request's `wake_id`). The trace is
        sourced from the gatewayd-public in-memory ring (24h
        retention, 100k default cap). When no OTLP endpoint is set
        the ring is the only source — when OTLP is set, the ring
        still operates as the customer-facing query layer.

        Authentication: the `X-Faas-Trace-Auth` header must carry
        the operator's observer token (env: `FAAS_TRACE_OBSERVER_TOKEN`).
        The endpoint is gated even when the dashboard session cookie is
        present — tracing is an operator surface, not a customer one.
        An empty token disables the endpoint (returns 404).
      security: []
      parameters:
        - name: trace_id
          in: path
          required: true
          description: 32-hex W3C trace_id (or wake_id UUIDv7 hex form).
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: The trace tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trace' }
        '401':
          description: |
            Missing or wrong observer token. The endpoint is operator-
            gated; the customer-facing dashboard session does not
            grant access.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            Trace not in the ring (never seen, or evicted by the 24h
            retention sweep / LRU cap).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer API key. Format: `fp_live_` + 48 hex chars. The plaintext is
        returned exactly once on `POST /v1/keys`; subsequent reads only
        surface the prefix.

  parameters:
    CookieSession:
      name: faas_sid
      in: cookie
      required: false
      schema: { type: string }
      description: |
        Dashboard session cookie. Sealed; opaque to the client
        (`HttpOnly; Secure; SameSite=Lax`). 7-day fixed lifetime.
        The browser sets it automatically on `/login` / `/signup`;
        the SDK uses the device-code flow instead and never sets
        this cookie.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: |
        Idempotency key for the POST. Stored for 24h. On replay the server
        returns the original response with `Idempotent-Replayed: true`.
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{1,38})[a-z0-9]$', minLength: 3, maxLength: 40 }
      description: App slug. Lowercase letters, digits, hyphens; must start and end with alnum.
    Id32:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
      description: 32-hex-char opaque ID (NOT canonical UUID).
    SecretKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 128 }
      description: Secret key. Must start with a letter; A-Z, 0-9, underscore.

    # Issue #394 — queue introspection pagination. Shared by the two
    # read-list endpoints (peek / dead_letter) so the `description`
    # is not flagged by vacuum's `description-duplication` rule when
    # both endpoints grow the same shape.
    QueueCursorLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 200, minimum: 1 }
      description: "Maximum number of rows to return; capped at 200."
    QueueCursorBefore:
      name: before
      in: query
      required: false
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
      description: "Cursor — the last id from the previous page (omit for the first page)."

  schemas:

    # ─── Dashboard auth (issue #165 PR #2, ADR-032) ──────────────────────

    PasswordLoginRequest:
      description: "Email + password for sign-in. Email is canonicalised server-side (lowercase + trim)."
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }

    PasswordLoginResponse:
      description: |
        Successful sign-in. The session cookie is set via
        `Set-Cookie: faas_sid=…`; the body carries only
        `{account_id, plan}`. No API key is ever returned on
        login (issue #165, PR #2).
      type: object
      required: [account_id, plan]
      properties:
        account_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        plan: { type: string, enum: [free, hobby, pro, scale] }

    # Issue #419 / ADR-046: sign-in OAuth capability signal
    # (GET /v1/auth/capabilities). Per-provider enabled flag; the
    # dashboard reads this on /login to decide whether to render
    # the "Sign in with <provider>" button. The set of provider
    # keys is closed (google, github); future providers land as
    # new keys.
    AuthCapabilities:
      description: |
        Boot-resolved OAuth provider state for this apid host.
        `enabled=true` means the consent route (`/v1/auth/<name>`)
        will issue a 302 to the upstream consent screen;
        `enabled=false` means the consent route returns 503
        `oauth_provider_unavailable` because both the provider's
        `*_CLIENT_ID` and `*_CLIENT_SECRET` were unset at boot.
      type: object
      required: [providers]
      properties:
        providers:
          $ref: '#/components/schemas/AuthProviders'

    AuthProviders:
      description: |
        Per-provider capability map. Closed set (google, github) —
        handlers MUST add a new field here when adding a new
        provider, not relax this to a free-form map.
      type: object
      required: [google, github]
      properties:
        google:
          $ref: '#/components/schemas/OAuthProviderCapability'
        github:
          $ref: '#/components/schemas/OAuthProviderCapability'

    OAuthProviderCapability:
      description: |
        One provider's capability flag. Source is
        `auth.SignInProvider.Enabled()` — the boot-resolved state.
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    PasswordSignupRequest:
      description: "Email + password for signup. Same shape as PasswordLoginRequest so the create-or-claim race detection reuses the verifier."
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }

    PasswordResetRequest:
      description: "Email for a password-reset request. Optional — the form-page path submits no body; the SDK sends the email."
      type: object
      properties:
        email: { type: string, format: email }

    PasswordResetConfirm:
      description: |
        Token + new password for the password-reset submission.
        Token is the base64url-encoded 32-byte value from the
        email link (NOT the SHA-256 hash the server stores).
      type: object
      required: [token, new_password]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        new_password: { type: string, minLength: 12, maxLength: 256 }

    SetPasswordRequest:
      description: "New password for the authenticated account. Lets OAuth-only customers opt into password login."
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 256 }

    # ─── GitHub install bind picker (PR-B) ──────────────────────────────

    InstallBindRequest:
      description: |
        Body for both `POST /v1/install/repos/list` and
        `POST /v1/apps/{slug}/install/bind`. Carries the
        (installation_id, repo_full_name, production_branch) tuple
        the dashboard's bind picker commits. `production_branch` is
        optional — when omitted, githubd uses the install's
        `default_branch` from `/installations/{id}`.
      type: object
      required: [installation_id, repo_full_name]
      properties:
        installation_id: { type: integer, format: int64, minimum: 1 }
        repo_full_name: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        production_branch: { type: string, maxLength: 256 }

    InstallBindResponse:
      description: "Successful bind. `binding_id` is the deterministic `bind-<appID>-<repo>` form used in audit log entries."
      type: object
      required: [binding_id, repo_full_name, production_branch]
      properties:
        binding_id: { type: string }
        repo_full_name: { type: string }
        production_branch: { type: string }

    RepoResponse:
      description: |
        Repo visible to the user's GitHub App installation, as
        returned by githubd's `/user/installations/{id}/repositories`.
        Carries only the fields the dashboard bind picker renders —
        no nested owner object (the install URL already disambiguates).
      type: object
      required: [id, full_name, default_branch, private]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        default_branch: { type: string }
        private: { type: boolean }

    # ─── Account ──────────────────────────────────────────────────────────

    AccountResponse:
      description: "Account profile: id, email, plan, status, limits snapshot, current-month usage, and total app count."
      type: object
      required: [id, email, plan, status, limits, usage_gb_hours, app_count]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        email: { type: string, format: email }
        plan: { type: string, enum: [free, hobby, pro, scale] , example: "hobby"}
        status: { type: string, enum: [active, past_due, suspended, deleted_pending] , example: "active"}
        limits: { $ref: '#/components/schemas/AccountLimits' }
        usage_gb_hours: { type: number }
        app_count: { type: integer }
        github_install_id: { type: [string, "null"] }

    AccountLimits:
      description: "Plan-driven quota and resource caps: max RAM per app, concurrent wakes, total deployed apps, included GB-hours, and max app-layer bytes per build."
      type: object
      required: [plan, ram_mb, max_concurrency, deployed_apps, included_gb_hours, app_layer_max_mb]
      properties:
        plan: { type: string, enum: [free, hobby, pro, scale] , example: "hobby"}
        ram_mb: { type: integer , example: 256}
        max_concurrency: { type: integer }
        deployed_apps: { type: integer }
        included_gb_hours: { type: integer, format: int64 }
        app_layer_max_mb: { type: integer }

    ChangePlanRequest:
      description: "Target plan for the change."
      type: object
      required: [plan]
      properties:
        plan: { type: string, enum: [free, hobby, pro, scale] , example: "hobby"}

    AccountExportResponse:
      description: "GDPR export bundle: the account itself, every owned app, deployment, build, instance, usage record, domain, cron, API key, and sealed-secret envelope, plus the audit trail."
      type: object
      required: [exported_at, account, apps, deployments, builds, instances, usage, domains, crons, api_keys, app_secrets]
      properties:
        exported_at: { type: string, format: date-time , example: "2026-07-23T11:25:00Z"}
        account: { $ref: '#/components/schemas/AccountResponse' }
        apps: { type: array, items: { $ref: '#/components/schemas/AppResponse' } }
        deployments: { type: array, items: { $ref: '#/components/schemas/DeploymentResponse' } }
        builds: { type: array, items: { $ref: '#/components/schemas/BuildExportResponse' } }
        instances: { type: array, items: { $ref: '#/components/schemas/InstanceResponse' } }
        usage: { type: array, items: { $ref: '#/components/schemas/UsageExportResponse' } }
        domains: { type: array, items: { $ref: '#/components/schemas/CustomDomainResponse' } }
        crons: { type: array, items: { $ref: '#/components/schemas/CronResponse' } }
        api_keys: { type: array, items: { $ref: '#/components/schemas/APIKeyExportResponse' } }
        app_secrets: { type: array, items: { $ref: '#/components/schemas/AppSecretExportResponse' } }
        audit_trail:
          type: array
          items: { $ref: '#/components/schemas/GdprAuditExportResponse' }

    AccountDeletionResponse:
      description: "Result of staging account deletion: status flips to `deleted_pending` and `restore_until` marks the end of the 30-day grace window."
      type: object
      required: [status, scheduled_at, restore_until]
      properties:
        status: { type: string, enum: [deleted_pending] , example: "deleted_pending"}
        scheduled_at: { type: string, format: date-time }
        restore_until: { type: string, format: date-time }

    BuildExportResponse:
      description: "One build record: source artifact bytes, kind (app/function), status, and lifecycle timestamps."
      type: object
      required: [id, deployment_id, app_id, kind, status, source_bytes]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        deployment_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        kind: { type: string }
        status: { type: string , example: "active"}
        source_bytes: { type: integer, format: int64 }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    UsageExportResponse:
      description: "One usage record: app id, GB-hours consumed, started/finished timestamps for the export window. cpu_usec is the per-(app, month) cumulative host cgroup CPU-µs (issue #279 / PR-B). Informational only — billing is on mb_seconds."
      type: object
      required: [app_id, month, mb_seconds, requests]
      properties:
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        mb_seconds: { type: integer, format: int64 }
        requests: { type: integer, format: int64 }
        cpu_usec:
          type: integer
          format: int64
          description: "Cumulative host cgroup CPU-µs consumed by the app in the export window (informational; not billed). issue #279 / PR-B."
          x-since: "2026-07"
          x-issue: "279"
        tx_bytes:
          type: integer
          format: int64
          description: "Per-(app, month) HTTP response bytes (informational; not billed). ADR-046. The gateway-side producer lands in PR-2; until then this field stays 0."
          x-since: "2026-08"
          x-issue: "415"
        net_tx_bytes:
          type: integer
          format: int64
          description: "Per-(app, month) byte delta on root-side vethHost.rx_bytes (informational; not billed). ADR-046. Sourced from vmmd netstats.Cache via schedd ListInstanceStats. Includes Ethernet framing — same kernel counter the per-plan tc tbf qdisc reads."
          x-since: "2026-08"
          x-issue: "415"
        net_rx_bytes:
          type: integer
          format: int64
          description: "Per-(app, month) byte delta on root-side vethHost.tx_bytes (root→guest = ingress; informational; not billed). ADR-048. Mirror of `net_tx_bytes` for the inbound direction."
          x-since: "2026-08"
          x-issue: "436"
        cold_boots:
          type: integer
          format: int64
          description: "Per-(app, month) count of WAKE_RESTORE→WAKE_COLD_BOOT transitions observed (informational; not billed). ADR-048."
          x-since: "2026-08"
          x-issue: "436"

    DailyUsageResponse:
      description: "Per-app rollup for one calendar day (informational; not billed). Mirrors the `usage_daily` table populated by the meterd rollup loop (ADR-048 §5, migration 00067)."
      type: object
      required: [app_id, day, mb_seconds, requests, cpu_usec, tx_bytes, net_tx_bytes, net_rx_bytes, cold_boots, builder_seconds]
      properties:
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: "2026-07-29" }
        mb_seconds:
          type: integer
          format: int64
          description: "Cumulative mb_seconds for the day (informational; not billed)."
        requests:
          type: integer
          format: int64
          description: "Cumulative request count for the day (informational; not billed)."
        cpu_usec:
          type: integer
          format: int64
          description: "Cumulative host cgroup CPU-µs for the day (informational; not billed). ADR-046 / #279."
        tx_bytes:
          type: integer
          format: int64
          description: "HTTP response bytes for the day (informational; not billed). ADR-046."
        net_tx_bytes:
          type: integer
          format: int64
          description: "Cumulative net_tx_bytes for the day (informational; not billed). ADR-046."
        net_rx_bytes:
          type: integer
          format: int64
          description: "Cumulative ingress bytes for the day (informational; not billed). ADR-048."
        cold_boots:
          type: integer
          format: int64
          description: "Per-day WAKE_RESTORE→WAKE_COLD_BOOT transition count (informational; not billed). ADR-048."
        builder_seconds:
          type: integer
          format: int64
          description: "Builder VM seconds burned by this app on this day (informational; not billed). ADR-048."
      x-since: "2026-08"
      x-issue: "436"

    DailyUsageListResponse:
      description: "Page shape for GET /v1/usage/daily — wraps an array of per-app daily rollup rows."
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DailyUsageResponse' }
      x-since: "2026-08"
      x-issue: "436"

    StorageUsageResponse:
      description: "Per-app storage rollup for one calendar day (informational; not billed today). Mirrors the `snapshot_storage_daily` table populated by the meterd storage rollup loop (ADR-049 §B.3, migration 00070)."
      type: object
      required: [app_id, day, snapshot_bytes, layer_bytes]
      properties:
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: "2026-07-29" }
        snapshot_bytes:
          type: integer
          format: int64
          description: "Cumulative snapshot bytes (mem_bytes + disk_bytes) for the day (informational; not billed today). ADR-049 §B.3."
        layer_bytes:
          type: integer
          format: int64
          description: "Cumulative overlay-staging layer bytes for the day (informational; not billed today). ADR-049 §B.3."
      x-since: "2026-08"
      x-issue: "436"

    StorageUsageListResponse:
      description: "Page shape for GET /v1/usage/storage — wraps an array of per-app storage rollup rows."
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StorageUsageResponse' }
      x-since: "2026-08"
      x-issue: "436"

    APIKeyExportResponse:
      description: "One API key in export form: id, prefix (first 8 chars), label, scopes, created/last-used timestamps, and request count. Scopes is the permission set attached to the key at the moment of export (audit trail; IAM-1, ADR-034 rev2)."
      type: object
      required: [id, prefix, scopes, created_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        prefix: { type: string }
        label: { type: [string, "null"] , example: "ci-deploy"}
        scopes:
          type: array
          items: { type: string, enum: [admin, deploy:write, secrets:read, secrets:write, usage:read, apps:read, env:read, env:write] }
          description: "Permission set attached to the key. Closed vocabulary (IAM-1, ADR-034 rev2): `admin` is the legacy full-access scope; `apps:read` covers GETs across the apps/deployments/audit/secrets-list surface; `deploy:write` covers POST/PUT/PATCH/DELETE on apps+queues; `secrets:write` covers PUT/DELETE on /apps/{slug}/secrets/{key}; `usage:read` covers GET /v1/usage*."
          example: [admin]
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
      example: {id: "0123456789abcdef0123456789abcdef", prefix: "fp_live_ab12cd34", label: "ci-deploy", scopes: [apps:read, deploy:write], created_at: "2026-07-25T13:25:00Z", last_used_at: "2026-07-25T13:25:00Z"}

    GdprAuditExportResponse:
      description: "One row of the customer's audit trail in the GDPR export bundle. Two row kinds live here: source=`gdpr` carries a self-service action (`export`, `delete`, `restore`); source=`event` carries a security event from the events table (IAM-4, ADR-035) with a `kind` and JSON `data` payload. The two are interleaved by timestamp descending."
      type: object
      required: [source, requested_at]
      properties:
        source: { type: string, enum: [gdpr, event] }
        action: { type: string, enum: [export, delete, restore] }
        requested_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        kind: { type: string, description: "Security event kind. Populated only when `source` = `event`. Examples: `auth.login`, `key.created`, `secret.set`, `env.set`, `account.deletion_scheduled`." }
        data: { type: object, additionalProperties: true, description: "Kind-specific JSON payload from the events row. Populated only when `source` = `event`. Plaintext values (e.g. secret VALUE) are NEVER carried in `data`." }

    AppSecretExportResponse:
      description: "One sealed secret in export form: key name, sealed ciphertext (sealed at rest per §11), version, and timestamps. Plaintext is never exported."
      type: object
      required: [app_id, key, ciphertext, created_at, updated_at]
      properties:
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        key: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 128 , example: "DATABASE_URL"}
        ciphertext: { type: string, description: 'base64-encoded age-sealed envelope' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─── Apps ─────────────────────────────────────────────────────────────

    AppResponse:
      description: "An app: slug, type, runtime (for functions), RAM/cpu/idle-timeout config, current state, last-deploy pointer, per-app outbound CIDR allowlist (ADR-031 + ADR-032), and reactive scale-up trigger targets (issue #169 / #172)."
      type: object
      required: [id, slug, type, ram_mb, max_concurrency, min_instances, status, url, manifest, autoscale_target_rps, autoscale_target_cpu_pct]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{1,38})[a-z0-9]$', example: "hello-world" }
        type: { type: string, enum: [app, function] , example: "app"}
        runtime: { type: string, enum: [node22, python312, go124, go124-alpine, node24, python313], description: "Runtime for `type: function` apps. Omit for `type: app` (the default)." }
        ram_mb: { type: integer , example: 256}
        max_concurrency: { type: integer }
        idle_timeout_s: { type: [integer, "null"] }
        min_instances: { type: integer }
        status: { type: string , example: "active"}
        url: { type: string, format: uri }
        manifest: { $ref: '#/components/schemas/AppManifest' }
        # ADR-031 + ADR-032 (tier-2 network follow-ups, PR-C):
        # the per-app outbound CIDR allowlist. Each entry is a
        # canonical CIDR string — v4 ("1.2.3.0/24") or v6
        # ("2001:db8::/32"). v4-mapped v6 form ("::ffff:1.2.3.0/120")
        # is silently rewritten to its v4 form at PATCH time by
        # validateUpdateApp, so the read-back never carries a
        # "::ffff:" prefix. Always present (serialised as `[]`
        # when empty, never `null`); NOT in `required:` so the
        # empty case stays the contract for Free/Hobby.
        egress_allowlist:
          description: "Per-app outbound CIDR allowlist (ADR-031 + ADR-032). Each entry is a CIDR string — v4 (`1.2.3.0/24`) or v6 (`2001:db8::/32`). v4-mapped v6 form (`::ffff:1.2.3.0/120`) is silently canonicalised to its v4 form at write time. Empty array means no allowlist rule; the per-netns chain's default-accept policy applies."
          type: array
          items:
            type: string
            pattern: '^[0-9a-fA-F:./]+$'
            example: 1.2.3.0/24
        # Issue #169 / #172: per-instance reactive scale-up
        # trigger targets. 0 = "disabled" (the trigger skips
        # this app). autoscale is enabled iff at least one of
        # these two is non-zero (no separate boolean). Plan
        # gated: autoscale_target_rps is Hobby/Pro/Scale;
        # autoscale_target_cpu_pct is Pro/Scale only.
        autoscale_target_rps:
          description: "Per-instance RPS target for the reactive scale-up trigger. 0 = disabled. Hobby/Pro/Scale only. When measured per-instance RPS exceeds this value, schedd admits another instance (up to max_concurrency). See ADR-037."
          type: integer
          minimum: 0
          example: 50
        autoscale_target_cpu_pct:
          description: "Per-instance CPU% target (1..100) for the reactive scale-up trigger. 0 = disabled. Pro/Scale only. When measured per-instance CPU% exceeds this value, schedd admits another instance (up to max_concurrency). See ADR-037."
          type: integer
          minimum: 0
          maximum: 100
          example: 70
        # Issue #471 / ADR-047 (PR-A): per-app streaming flag.
        # When true on a paid plan that unlocks streaming
        # (Hobby/Pro/Scale), gatewayd can flush the response
        # body incrementally instead of buffering end-to-end.
        # Free apps stay at false regardless of the customer's
        # preference (apid's plan-gate rejects PATCH true on
        # Free with 403 plan_streaming_not_allowed). The actual
        # Flusher path lands in PR-B; PR-A only persists the
        # flag. Default at create-time is the plan's
        # default (true for Hobby+, false for Free).
        streaming_enabled:
          description: "Per-app streaming flag (issue #471). Free customers always see this as false; Hobby/Pro/Scale can PATCH it. PR-B activates the streamed response path; PR-A only persists the flag."
          type: boolean
          example: false
        # Issue #462 / ADR-058 (PR-A): per-app scaling policy.
        # Nullable: legacy rows project as `null` (the empty
        # policy falls back to the legacy min_instances /
        # max_concurrency columns). Plan-gated upstream:
        # min_instances > 0 / max_instances > 0 are Hobby+ (was
        # Pro/Scale pre-#462); target.metric is Hobby+; cooldowns
        # are clamped to api.MinScaleOutCooldownS..MaxScaleOutCooldownS
        # (1..3600) and api.MinScaleInCooldownS..MaxScaleInCooldownS
        # (5..86400). Worker-class apps reject
        # target.metric=concurrent_requests with 422
        # scaling_target_incompatible_with_workload_class
        # (PR-D carve-out).
        scaling_policy:
          description: "Per-app scaling policy (issue #462 / ADR-058). null = legacy row, project the empty-policy shape from min_instances / max_concurrency. Non-null = customer-authored policy persisted to the jsonb column `apps.scaling_policy`."
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ScalingPolicy'
        # Issue #462 / ADR-058: per-app cooldown bookkeeping.
        # schedd stamps last_scale_out_at on the wake-gate
        # admit branch (same Tx as the instances row insert);
        # last_scale_in_at on the reaper park branch. Surfaces
        # on GET so dashboards can render "warm-up in progress"
        # + "recently scaled" copy. Nullable: a never-scaled
        # app reads back as null.
        last_scale_out_at:
          description: "RFC 3339 timestamp of the most recent scale-out event schedd admitted for this app, or null if the app has never scaled out."
          type: [string, "null"]
          format: date-time
          example: "2026-07-31T12:00:00Z"
        last_scale_in_at:
          description: "RFC 3339 timestamp of the most recent scale-in event schedd reaped for this app, or null if the app has never scaled in."
          type: [string, "null"]
          format: date-time
          example: "2026-07-31T12:00:00Z"
        # Issue #472 / ADR-054: per-app signature-enforcement flag.
        # When true, OCI image deploys to this app must carry a
        # valid cosign signature from a publisher in the
        # per-app trusted_signers list (mirrors AWS Lambda's
        # Code Signing for Lambda). The flag is operator-only —
        # PATCH /v1/apps/{slug}/security requires the admin
        # scope and MFA; the customer-scoped PATCH /v1/apps/{slug}
        # silently drops the field. Default false (no production
        # behaviour change until an operator opts in).
        require_signed:
          description: "Per-app cosign signature-enforcement flag (issue #472 / ADR-054). When true, OCI image deploys must carry a valid signature from a publisher in the per-app trusted_signers list. Default false."
          type: boolean
          example: false
        # Issue #470 / ADR-055: per-app two-tier snapshot flag +
        # thresholds. True on Pro/Scale by default; Free/Hobby
        # always false (the only legal state on those tiers —
        # apid rejects PATCH-true with 403
        # plan_warm_snapshot_not_allowed). Customer PATCH may
        # toggle the flag or override the per-app thresholds;
        # out-of-range threshold values are rejected with 422
        # invalid_warm_snapshot_min_*.
        warm_snapshot_enabled:
          description: "Per-app two-tier snapshot flag (issue #470 / ADR-055). True on Pro/Scale by default; Free/Hobby always false."
          type: boolean
          example: true
        warm_snapshot_min_requests:
          description: "Effective per-app request-count threshold for warm-tier capture on this app (issue #470 / ADR-055). Range [1, 100]."
          type: integer
          minimum: 1
          maximum: 100
          example: 5

        warm_snapshot_min_ms:
          description: "Per-app time-since-first-ready threshold for warm-tier capture, milliseconds (issue #470 / ADR-055). Range [100, 60000]."
          type: integer
          minimum: 100
          maximum: 60000
          example: 2000

    CreateAppRequest:
      description: "App creation payload: slug, type (app|function), runtime (only for function), RAM MB, max concurrency, idle timeout, and optional manifest."
      type: object
      required: [slug]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{1,38})[a-z0-9]$', minLength: 3, maxLength: 40, example: "hello-world" }
        type: { type: string, enum: [app, function] , example: "app"}
        runtime: { type: string, enum: [node22, python312, go124, go124-alpine, node24, python313] }
        ram_mb: { type: integer , example: 256}
        max_concurrency: { type: integer }
        idle_timeout_s: { type: integer }
        # Issue #471 / ADR-047 (PR-A): optional at create-time.
        # Omitted → apid applies the plan default (Hobby/Pro/Scale
        # default to true; Free defaults to false). Spec
        # consumers should treat the field as optional at create
        # and required at read (AppResponse).
        streaming_enabled:
          description: "Per-app streaming flag. Omitted at create-time → apid applies the plan default (issue #471)."
          type: boolean
          example: false
        # Issue #470 / ADR-055: optional at create-time. Omitted
        # → apid applies the plan default (Pro/Scale = true;
        # Free/Hobby = false — the only legal state on those
        # tiers). PATCH-true on Free/Hobby is rejected with 403
        # plan_warm_snapshot_not_allowed.
        warm_snapshot_enabled:
          description: "Per-app two-tier snapshot flag (issue #470 / ADR-055). Omitted at create-time → apid applies the plan default. Free/Hobby PATCH-true is rejected."
          type: boolean
          example: true
        warm_snapshot_min_requests:
          description: "Optional create-time override for the warm-tier request-count threshold (issue #470 / ADR-055). Range [1, 100]. Omitted → apid applies the plan default."
          type: integer
          minimum: 1
          maximum: 100
          example: 5

        warm_snapshot_min_ms:
          description: "Optional create-time override for the warm-tier time-since-first-ready threshold, milliseconds (issue #470 / ADR-055). Range [100, 60000]. Omitted → apid applies the plan default."
          type: integer
          minimum: 100
          maximum: 60000
          example: 2000

    UpdateAppRequest:
      description: "Partial update — every field is optional; omitted fields are unchanged."
      type: object
      properties:
        ram_mb: { type: [integer, "null"] , example: 256}
        idle_timeout_s: { type: [integer, "null"] }
        max_concurrency: { type: [integer, "null"] }
        min_instances: { type: [integer, "null"], minimum: 0 }
        # ADR-031 (tier-2 of the network roadmap): per-app
        # outbound CIDR allowlist. Replace-mode semantics:
        # omitted → no change; non-null array → atomic
        # overwrite (empty array clears). Pro/Scale only;
        # Free/Hobby PATCH → 403 plan_egress_allowlist_not_
        # allowed. Plan caps: Pro 16 entries, Scale 64.
        # PR-C widens the pattern from IPv4-only to v4+v6
        # (ADR-032 already shipped the handler-side acceptance
        # but the spec wasn't updated; pre-PR-C the validator
        # was permissive relative to the spec, allowing
        # `::ffff:1.2.3.0/120` because the spec said "forbid
        # `:`" while the handler said "accept v6").
        egress_allowlist:
          description: "v4 or v6 CIDR allowlist; empty array clears to chain-default-accept."
          type: array
          items:
            type: string
            pattern: '^[0-9a-fA-F:./]+$'
            example: 1.2.3.0/24
        # Issue #169 / #172: per-app reactive scale-up trigger
        # targets. PATCH semantics mirror the wire DTO: omitted
        # → no change; 0 → explicit disable. Plan gates run
        # first (403 plan_autoscale_not_allowed) so a Free
        # PATCHing a 50-rps value surfaces the gate, not the
        # bounds. See ADR-037.
        autoscale_target_rps:
          description: "Per-instance RPS target for the reactive scale-up trigger. 0 = disable. Hobby/Pro/Scale only. Values < 0 are 422 invalid_autoscale_target_rps."
          type: [integer, "null"]
          minimum: 0
          example: 50
        autoscale_target_cpu_pct:
          description: "Per-instance CPU% target (1..100, 0 = disable) for the reactive scale-up trigger. Pro/Scale only. Values outside [1, 100] (other than 0) are 422 invalid_autoscale_target_cpu_pct."
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          example: 70
        # Issue #471 / ADR-047 (PR-A): partial-update nullable
        # boolean. Omitted → no change; non-null → atomic
        # overwrite. Plan gate runs first (403
        # plan_streaming_not_allowed) so a Free PATCHing
        # true surfaces the gate. Hobby/Pro/Scale flow through.
        streaming_enabled:
          description: "Per-app streaming flag (issue #471). Omitted → no change. Free PATCHing true is 403 plan_streaming_not_allowed."
          type: [boolean, "null"]
          example: false
        # Issue #462 / ADR-058 (PR-A): per-app scaling policy.
        # Omitted → no change. Non-null → atomic full-overwrite
        # of the jsonb column `apps.scaling_policy` (the
        # legacy min_instances column is kept in sync by the
        # store). Validation runs at PATCH time:
        #   min_instances > 0  → Hobby+ (was Pro/Scale pre-#462).
        #                           Free → 403 plan_min_instances_not_allowed.
        #   max_instances > 0  → Hobby+ (new gate at PR-A).
        #                           Free → 403 plan_max_instances_not_allowed.
        #   min/max instances  → 422 invalid_min_instances /
        #                           invalid_max_instances on bounds.
        #   cooldowns          → 422 invalid_cooldown on
        #                           out-of-range values.
        #   target.metric      → Hobby+ (PR-A wires the DTO;
        #                           PR-C wires the engine).
        #   worker-class apps
        #     concurrent_requests → 422
        #       scaling_target_incompatible_with_workload_class
        #       (PR-D carve-out).
        scaling_policy:
          description: "Per-app scaling policy. Omitted → no change. Non-null → atomic full-overwrite of the jsonb column."
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ScalingPolicy'
        # Issue #472 / ADR-054: require_signed is OPERATOR-ONLY.
        # The customer PATCH surface (here) silently DROPS the
        # field — flipping it through the customer endpoint is a
        # no-op. Use PATCH /v1/apps/{slug}/security (admin scope
        # + MFA) instead. Documented here so SDK consumers
        # discover the customer-side restriction without
        # encountering a silent 200.
        require_signed:
          description: "DEPRECATED on this surface. The customer PATCH /v1/apps/{slug} endpoint silently drops require_signed; the operator endpoint PATCH /v1/apps/{slug}/security is the only path that flips the flag (issue #472 / ADR-054). The field is parsed for backwards compatibility but never persisted from this endpoint."
          type: [boolean, "null"]
          example: false
        # Issue #470 / ADR-055: per-app warm-snapshot flag +
        # thresholds. PATCH-true on Free/Hobby is rejected with
        # 403 plan_warm_snapshot_not_allowed; out-of-range
        # threshold values return 422 invalid_warm_snapshot_min_*.
        warm_snapshot_enabled:
          description: "Per-app two-tier snapshot flag (issue #470 / ADR-055). Omitted → no change. PATCH-true on Free/Hobby is rejected with 403 plan_warm_snapshot_not_allowed."
          type: [boolean, "null"]
          example: true
        warm_snapshot_min_requests:
          description: "Per-app request-count threshold for warm-tier capture (issue #470 / ADR-055). Range [1, 100]. Omitted → no change."
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          example: 5
        warm_snapshot_min_ms:
          description: "Per-app time-since-first-ready threshold for warm-tier capture, milliseconds (issue #470 / ADR-055). Range [100, 60000]. Omitted → no change."
          type: [integer, "null"]
          minimum: 100
          maximum: 60000
          example: 2000

    RenameAppRequest:
      description: "Rename payload: new slug. Old slug returns 404 immediately on the next request."
      type: object
      required: [new_slug]
      properties:
        new_slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{1,38})[a-z0-9]$', minLength: 3, maxLength: 40, example: "hello-world-v2" }

    ScalingPolicy:
      description: "Per-app autoscaling configuration (issue #462 / ADR-058). Mirrors the on-disk jsonb column `apps.scaling_policy`. Empty values map to the engine default (the apid gate is load-bearing for the floor / ceiling, not the encoder). PR-A persists the DTO; PR-C wires the engine; PR-D carves out the worker-class branch."
      type: object
      additionalProperties: false
      properties:
        min_instances:
          description: "Per-app cold-wake floor. 0 = scale to zero (default). Hobby+ unlocked at PR-A (was Pro/Scale pre-#462). Free → 403 plan_min_instances_not_allowed."
          type: integer
          minimum: 0
          example: 1
        max_instances:
          description: "Per-app ceiling on live instances. Must be in [min_instances, plan.MaxConcurrency]. Hobby+ unlocked at PR-A. Free → 403 plan_max_instances_not_allowed. 0 = use plan max_concurrency."
          type: integer
          minimum: 0
          example: 5
        target:
          description: "Per-instance signal the engine watches for the scale-up trigger. Closed metric set: rps | concurrent_requests | p99_latency_ms. Empty/null = engine falls back to the legacy autoscale_target_rps / autoscale_target_cpu_pct columns. Worker-class apps reject concurrent_requests with 422 scaling_target_incompatible_with_workload_class (PR-D carve-out)."
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ScalingTarget'
        scale_out_cooldown_s:
          description: "Minimum seconds between two scale-out events. Floor 1 (no 0 traps); ceiling 3600 (1 h). Out-of-range → 422 invalid_cooldown."
          type: integer
          minimum: 1
          maximum: 3600
          example: 5
        scale_in_cooldown_s:
          description: "Minimum seconds between two scale-in events. Floor 5 (matches the reaper's 5 s idle window); ceiling 86400 (1 day). Out-of-range → 422 invalid_cooldown."
          type: integer
          minimum: 5
          maximum: 86400
          example: 60

    ScalingTarget:
      description: "(metric, value) pair the engine watches for the scale-up trigger. The metric surface is closed; the unset state (null) is the legacy 'engine falls back to autoscale_target_rps' path."
      type: object
      additionalProperties: false
      properties:
        metric:
          type: string
          enum: [rps, concurrent_requests, p99_latency_ms]
          example: "rps"
        value:
          description: "Target value (units depend on Metric). Must be >= 0."
          type: number
          minimum: 0
          example: 1.0

    AppManifest:
      description: "App manifest: environment variables, build commands, working directory, healthcheck, user, and Dockerfile-as-source flag (§ux 6.3). The optional `env_secrets` field carries sealed-secret refs (\"secret:NAME\" strings) resolved by the host at wake time against the app_secrets table (issue #460 / ADR-053 §Decision 1). Values are NEVER sealed ciphertext — only refs."
      type: object
      required: [entrypoint]
      properties:
        entrypoint:
          type: array
          items: { type: string }
          minItems: 1
        env:
          type: object
          additionalProperties: { type: string }
        env_secrets:
          type: object
          additionalProperties: { type: string }
          description: "Env override via sealed-secret refs. Each value is \"secret:NAME\"; the host resolver looks up NAME against the app_secrets table at wake."
        working_dir: { type: [string, "null"] }
        port: { type: [integer, "null"], minimum: 0, maximum: 65535 }
        healthz: { type: [string, "null"] }
        user: { type: [string, "null"] }

    # ─── Deployments ──────────────────────────────────────────────────────

    DeploymentResponse:
      description: "One deployment: id, app, source ref, build status, commit SHA, and lifecycle timestamps. The optional `has_overrides` and `override_*` fields are the persisted echo of the create-time overrides object (issue #460 / ADR-053); they round-trip via `GET /v1/apps/{slug}/deployments/{id}` so a customer can audit what their last deploy pinned. Env values are NEVER echoed — only the keys (`override_env_keys`); env_secrets refs ARE echoed because the ref shape is non-secret by design."
      type: object
      required: [id, app_id, image_digest, kind, status, created_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        build_id: { type: [string, "null"], pattern: '^[a-f0-9]{32}$' }
        image_digest: { type: string }
        kind: { type: string }
        status: { type: string , example: "active"}
        error: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        has_overrides: { type: boolean, description: "True when this deployment carries a non-null override_* column set." }
        override_entrypoint:
          type: array
          items: { type: string }
          description: "Entrypoint override echoed verbatim from the create request. nil when no override was supplied."
        override_cmd:
          type: array
          items: { type: string }
          description: "Cmd override echoed verbatim from the create request."
        override_env_keys:
          type: array
          items: { type: string }
          description: "Sorted set of env-var keys set by the env override. VALUES ARE NEVER ECHOED (ADR-053 §Decision 4)."
        override_env_secret_keys:
          type: array
          items: { type: string }
          description: "Sorted set of env-var keys set by the env_secrets override. The parallel refs are echoed in `override_env_secret_refs` because the ref shape is non-secret by design."
        override_env_secret_refs:
          type: object
          additionalProperties: { type: string }
          description: "Verbatim `secret:NAME` ref map; the customer needs to see which secret they bound to which env var to debug a misconfigured deploy."
        override_port: { type: integer, minimum: 0, maximum: 65535, description: "Listen-port override; 0 = absent (fall back to image default)." }
        override_healthcheck:
          oneOf:
            - $ref: '#/components/schemas/DeploymentHealthcheck'
            - type: 'null'
          description: "Readiness-probe override. Persisted verbatim; the actual HTTP probe is a follow-up — today waitReady stays a bare TCP accept."

    DeploymentListResponse:
      description: "Paginated deployment list with a `next_before` cursor for backward pagination."
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeploymentResponse' }
        next_before: { type: [string, "null"], format: date-time }

# ─── Billing history (issue #259) ──────────────────────────────────────

    Invoice:
      description: |
        One persisted billing-provider invoice (issue #259). Money is
        integer cents in the provider's currency; EUR is the platform
        currency today, the field is preserved per-row so multi-currency
        support can land without a backfill. The PDF availability flag
        is the only PDF surface we expose — the hosted PDF URL is
        provider-scoped and the customer fetches it from the
        Stripe/Paddle portal, not via this API. The hosted URL itself
        is not on the wire; the column exists in invoices.hosted_url
        for PR-B audit only.
      type: object
      required: [id, provider, provider_invoice_id, status, period_start, period_end,
                 subtotal_cents, tax_cents, total_cents, amount_paid_cents,
                 currency, pdf_available, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [stripe, paddle] }
        provider_invoice_id: { type: string, example: "in_1NxAbC2eZvKYlo2C0D4E5F6G" }
        number: { type: string, example: "FaaS-2026-007" }
        status: { type: string, enum: [draft, open, paid, uncollectible, void] }
        period_start: { type: string, format: date-time }
        period_end:   { type: string, format: date-time }
        subtotal_cents:    { type: integer, format: int64 }
        tax_cents:         { type: integer, format: int64 }
        total_cents:       { type: integer, format: int64 }
        amount_paid_cents: { type: integer, format: int64 }
        currency: { type: string, enum: [eur], example: "eur" }
        pdf_available: { type: boolean }
        created_at: { type: string, format: date-time }

    InvoiceListResponse:
      description: |
        Paginated invoice list. Items is one page (period_end DESC, id
        DESC order). next_before is the cursor the caller passes on the
        next request to fetch the older page. Empty Items with 200 OK
        is the empty-history shape — never 404.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        next_before: { type: [string, "null"], format: date-time }

    BillingPortalResponse:
      description: |
        Operator-configured Stripe billing portal URL (issue #253).
        The url field is omitted when the box has FAAS_BILLING_PORTAL_URL
        unset — that is the "absent" sentinel; the CLI branches on it
        to print a friendly hint instead of opening the browser to "".
      type: object
      properties:
        url:
          type: [string, "null"]
          format: uri
          description: 'Substituted portal URL; absent when the box has no portal configured.'

    BuildProvenanceResponse:
      description: |
        ADR-038 / Tier 3 / issue #197 B3.10-read half: the
        post-mortem "what ran?" record for a single successful build.
        Field names mirror the `build_provenance` table columns. Empty
        strings indicate a column the populator hasn't filled yet —
        `buildkit_version`, `railpack_version`, `base_digest`,
        `runner_digest`, and `sbom_storage_key` are populated by
        Phase 3 (cosign signer + syft SBOM), but the columns exist
        today so Phase 3 is a zero-cost schema change.
      type: object
      required:
        - id
        - build_id
        - source_sha256
        - plan
        - builder_node_id
        - started_at
        - finished_at
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        build_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        buildkit_version: { type: string }
        railpack_version: { type: string }
        base_digest: { type: string }
        source_sha256: { type: string, description: "sha256 of the customer's source tarball (the cache lookup key)." }
        source_url: { type: string }
        commit_sha: { type: string }
        plan: { type: string, description: "free / hobby / pro / scale — copied from the account at claim time." }
        runner_digest: { type: string }
        builder_node_id: { type: string, description: "compute_node name (default `default-local` on the one-box)." }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        sbom_storage_key: { type: [string, "null"], description: "Phase 3 populator fills this from `syft` output. Empty string when not yet populated." }

    AccountCreditResponse:
      description: |
        One row in the account_credits table (issue #279). cents_remaining
        is the integer-cents balance still available; consumption
        decrements it (the consumption reducer lands in a follow-up
        PR). expires_at is RFC 3339 when set; absent (or null) means
        the credit is valid until fully consumed. reason is the
        operator-supplied audit text (3..500 chars).
      type: object
      required: [id, account_id, cents_remaining, reason, created_at]
      properties:
        id:             { type: string, format: uuid }
        account_id:     { type: string, format: uuid }
        cents_remaining: { type: integer, minimum: 0 }
        reason:         { type: string, minLength: 3, maxLength: 500 }
        created_at:     { type: string, format: date-time }
        expires_at:     { type: [string, "null"], format: date-time }

    ConsumeInvoiceResponse:
      description: |
        Returned by POST /v1/invoices/{id}/consume-credits (issue
        #279 PR-C). consumed_cents is the floored integer cents of
        overage drained against this invoice. remaining_credits_cents
        is the sum of cents_remaining across the account's active
        credits after the call. already_consumed_for_invoice is true
        on idempotent replays (the reducer returns the same
        consumed_cents without double-decrementing). per_credit lists
        FIFO-ordered credit drains with their post-decrement balance.
        Money is integer cents (CLAUDE.md).
      type: object
      required: [invoice_id, consumed_cents, remaining_credits_cents, already_consumed_for_invoice, per_credit]
      properties:
        invoice_id:                   { type: string, format: uuid }
        consumed_cents:               { type: integer, minimum: 0 }
        remaining_credits_cents:      { type: integer, minimum: 0 }
        already_consumed_for_invoice: { type: boolean }
        per_credit:
          type: array
          items: { $ref: '#/components/schemas/ConsumedCreditRow' }

    ConsumedCreditRow:
      description: |
        One FIFO drain row inside ConsumeInvoiceResponse.per_credit.
        delta_cents is the negative-cents decrement applied to the
        credit; new_balance is cents_remaining after the call.
      type: object
      required: [credit_id, delta_cents, new_balance]
      properties:
        credit_id:   { type: string, format: uuid }
        delta_cents: { type: integer, maximum: 0, description: 'Negative integer cents applied to the credit.' }
        new_balance: { type: integer, minimum: 0 }

    CreateDeploymentRequest:
      description: "Two content-types accepted (see operation description): prebuilt OCI image reference, or multipart source upload. The optional `overrides` object (issue #460 / ADR-053) lets a customer redeploy the same digest-pinned image with a different entrypoint / cmd / env / env_secrets / port / healthcheck without rebuilding the image. The override field list is FROZEN — six fields, no more — and any extra field on the override object 400s the request (the handler's decoder rejects unknown keys; see ADR-053 §Decision 1). The optional `sidecars` array (issue #463 / ADR-068) attaches up to 2 stateless sidecars (1 init + 1 sidecar) per app — a one-shot DB migrator as `init`, a metrics scraper as `sidecar`. nil/omitted = no sidecars."
      type: object
      properties:
        image:
          type: string
          description: 'registry.gregale.dev/...@sha256:... — digest-pinned OCI reference.'
        overrides:
          oneOf:
            - $ref: '#/components/schemas/CreateDeploymentOverrides'
            - type: 'null'
          description: "Deploy-time overrides (entrypoint, cmd, env, env_secrets, port, healthcheck). nil/omitted = deploy the image as-is."
        # Issue #472 / ADR-054: per-deploy require_signed opt-in.
        # Only honoured when the apps row's require_signed is
        # already false (i.e. the customer is volunteering to
        # gate THIS deploy). When apps.require_signed=true the
        # operator policy wins — a *false request field is
        # rejected with 403 deploy_signature_invalid (no
        # per-deploy opt-out). nil = "leave the per-app flag
        # alone" (apid default).
        require_signed:
          description: "Per-deploy signature-enforcement opt-in (issue #472 / ADR-054). nil = inherit apps.require_signed; *true is a no-op when the app flag is already on; *false is rejected with 403 deploy_signature_invalid when the app flag is on (operator policy wins)."
          type: [boolean, "null"]
          example: true
        # Issue #463 / ADR-068: up to 2 stateless sidecars
        # (1 init + 1 sidecar). The runtime effect (imaged,
        # fcvm, guest-init) ships in PR-B; PR-A persists the
        # shape and the handler envelope-seals env values.
        sidecars:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Sidecar'
          description: "Up to 2 stateless sidecars (1 init + 1 sidecar). nil/omitted = no sidecars. See ADR-068 for the hard 2-cap and stateless-only contract."

    CreateDeploymentOverrides:
      description: |
        Fargate-shaped deploy-time override object on `POST /v1/apps/{slug}/deployments`
        (issue #460 / ADR-053). Field list is FROZEN — six fields, no more. Any extra
        field on this object 400s the request. ADR-053 §Decision 1 documents the freeze;
        the handler enforces it via `DisallowUnknownFields` on the JSON decoder.

        - `entrypoint` replaces the OCI image's ENTRYPOINT/CMD argv at exec time.
        - `cmd` is appended to `entrypoint` (mirrors the OCI runtime contract).
        - `env` is plaintext; env-var keys must match `^[A-Z][A-Z0-9_]*$`; per-value
          byte cap = plan `EnvValueMaxBytes`.
        - `env_secrets` carries `secret:NAME` REFS — the runtime resolver (PR-B)
          strips the prefix and looks up `NAME` against the existing `app_secrets`
          table. The ref name must match `^[A-Z][A-Z0-9_]*$`.
        - `env` + `env_secrets` share the plan `EnvVarsMax` quota — no bypass by
          mixing the two surfaces.
        - `port` is per-deployment (1..65535; 0 = absent / fall back to image default).
        - `healthcheck` is the readiness-probe shape; the actual HTTP probe ships
          in a follow-up ADR.
      type: object
      properties:
        entrypoint:
          type: array
          items: { type: string, minLength: 1 }
          minItems: 1
          description: "Replaces the OCI image's ENTRYPOINT/CMD argv. Each element must be non-empty."
        cmd:
          type: array
          items: { type: string, minLength: 1 }
          minItems: 1
          description: "Appended to entrypoint at exec time (OCI runtime contract). Each element must be non-empty."
        env:
          type: object
          additionalProperties: { type: string }
          description: "Plaintext env map applied at boot. Keys: `^[A-Z][A-Z0-9_]*$`. Per-value byte cap = plan EnvValueMaxBytes."
        env_secrets:
          type: object
          additionalProperties:
            type: string
            pattern: '^secret:[A-Z][A-Z0-9_]*$'
          description: "Sealed-secret-ref env map. Each VALUE is `secret:NAME`; the runtime resolver looks up `NAME` against `app_secrets` at wake. Counts against the shared `EnvVarsMax` cap with `env`."
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: "Listen port; 0 = absent / fall back to image default (today 8080)."
        healthcheck:
          oneOf:
            - $ref: '#/components/schemas/DeploymentHealthcheck'
            - type: 'null'
          description: "Readiness-probe shape. Persisted today; the HTTP probe variant ships in a follow-up ADR."

    DeploymentHealthcheck:
      description: |
        Readiness-probe shape on the deploy-time override object (issue #460 /
        ADR-053). Today the probe stays a bare TCP accept — `path`, `interval_s`,
        `timeout_s`, `retries` are persisted but not yet exercised by `vmm.waitReady`.

        Validation rules (enforced in `pkg/api/dto.go::CreateDeploymentOverrides.Validate`):
        - `path` must start with `/`.
        - `interval_s`, `timeout_s`, `retries` must be `>= 0`.
        - Missing fields default to 0 (interpreted as "use image default" by the
          future probe implementation).
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: '^/', description: "Path the probe requests from the guest; must start with `/` (e.g. `/healthz`)." }
        interval_s: { type: integer, minimum: 0, description: "Probe interval in seconds; 0 = use image default." }
        timeout_s:  { type: integer, minimum: 0, description: "Probe timeout in seconds; 0 = use image default." }
        retries:    { type: integer, minimum: 0, description: "Consecutive failures before the instance is considered unhealthy; 0 = use image default." }

    Sidecar:
      description: |
        One entry in the deploy request's `sidecars` array
        (issue #463 / ADR-068). Up to 2 sidecars per app (1 init
        + 1 sidecar; the array is type-uniqueness + 2-capped at
        the schema layer via migration 00095's CHECK constraint).
        Stateless only — stateful base images (Postgres, Redis,
        MySQL, MongoDB, etc.) are rejected at the API gate
        with 403 `sidecar_stateful_denied` and again at imaged
        (PR-B). Image references must be digest-pinned
        (`repo@sha256:...`); tag references are rejected with
        400 `sidecar_invalid_image`. Env values are
        envelope-sealed at rest via secretbox (namespace
        `"sidecar_env"`); the wire shape is plaintext, the
        column is sealed ciphertext.

        - `name` matches RFC 1123 label (lowercase alphanumeric
          + dash, 1..63 chars, starts with [a-z0-9]). Unique
          within a single request.
        - `image` is the digest-pinned OCI reference. Tag
          references rejected. State images rejected.
        - `type` ∈ {`init`, `sidecar`}. At most one of each per
          deployment.
        - `cmd` is the argv (image's ENTRYPOINT unchanged; CMD
          overridden). Every element non-empty.
        - `env` is plaintext on the wire, sealed at rest. Keys
          per `^[A-Z][A-Z0-9_]*$`; per-value byte cap = plan
          `EnvValueMaxBytes`. Plaintext values NEVER appear in
          any log, audit, or error.
        - `port` ∈ {0, 1..65535}. 0 = absent.
        - `ram_mb` ∈ {0, 32..512}. 0 = inherit plan RAM.
        - `essential` defaults to true. If true and the sidecar
          exits non-zero: type=init → fail the deploy
          (`failure_class=user_error`); type=sidecar → restart-
          loop. If false: warn + restart-cap (PR-B's runtime).
      type: object
      required: [name, image, type]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          minLength: 1
          maxLength: 63
          description: "RFC 1123 label (lowercase alphanumeric + dash, 1..63 chars, starts with [a-z0-9])."
        image:
          type: string
          pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*(:[0-9]+)?/[A-Za-z0-9_./-]+@sha256:[0-9a-f]{64}$'
          description: "Digest-pinned OCI reference (repo@sha256:...). Tag references rejected with 400 `sidecar_invalid_image`."
        type:
          type: string
          enum: [init, sidecar]
          description: "`init` runs once before the main workload (DB migrator shape). `sidecar` runs alongside (metrics scraper shape)."
        cmd:
          type: array
          items: { type: string, minLength: 1 }
          description: "Argv. Image's ENTRYPOINT unchanged; CMD overridden. Every element non-empty."
        env:
          type: object
          additionalProperties: { type: string }
          description: "Plaintext env map (sealed at rest). Keys `^[A-Z][A-Z0-9_]*$`; per-value byte cap = plan EnvValueMaxBytes."
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: "Listen port. 0 = absent / fall back to image default."
        ram_mb:
          type: integer
          minimum: 0
          maximum: 512
          description: "Cgroup memory ceiling for this sidecar. 0 = inherit plan RAM; 32..512 enforced at the API."
        essential:
          type: boolean
          description: "Defaults to true. type=init non-zero exit → fail deploy; type=sidecar non-zero exit → restart-loop. PR-B's runtime."

    # ─── Instances ────────────────────────────────────────────────────────

    InstanceResponse:
      description: "Read-only instance view: id, deployment, state (waking/running/...), lease uid, and host-side internal endpoint (loopback only)."
      type: object
      required: [id, app_id, deployment_id, state, ram_mb]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        deployment_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        state: { type: string }
        host_ip: { type: [string, "null"] }
        ram_mb: { type: integer, example: 256 }
        # wake_id is a UUIDv7 (time-ordered) minted by schedd at WAKING.
        # Stable across the lifetime of one wake attempt; a PARK → WAKE
        # cycle mints a new one. Surfaced as the x-faas-wake-id header.
        wake_id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        started_at: { type: [string, "null"], format: date-time }
        last_request_at: { type: [string, "null"], format: date-time }
        parked_at: { type: [string, "null"], format: date-time }

    # ─── Domains ──────────────────────────────────────────────────────────

    CustomDomainResponse:
      description: "A custom domain binding: domain string, target app, verification status, and TLS provisioning state."
      type: object
      required: [domain, app_id, verified]
      properties:
        domain: { type: string , example: "app.example.com"}
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        challenge_token: { type: [string, "null"] }
        verified: { type: boolean }
        verified_at: { type: [string, "null"], format: date-time }
        txt_record: { type: [string, "null"] }

    CreateCustomDomainRequest:
      description: "Bind a custom domain to an app."
      type: object
      required: [domain, app_id]
      properties:
        domain: { type: string , example: "app.example.com"}
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }

    # ─── Crons ────────────────────────────────────────────────────────────

    CronResponse:
      description: "A cron trigger: schedule (cron expression), target URL, last/next run timestamps, and enabled flag."
      type: object
      required: [id, app_id, schedule, path, enabled, created_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        schedule: { type: string , example: "*/5 * * * *"}
        path: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_fired_at: { type: [string, "null"], format: date-time }

    CreateCronRequest:
      description: "Cron creation payload: schedule expression and target URL."
      type: object
      required: [app_id, schedule]
      properties:
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        schedule: { type: string , example: "*/5 * * * *"}
        path: { type: string }
        enabled: { type: [boolean, "null"] }

    UpdateCronRequest:
      description: "Partial cron update."
      type: object
      properties:
        schedule: { type: [string, "null"] , example: "*/5 * * * *"}
        path: { type: [string, "null"] }
        enabled: { type: [boolean, "null"] }

    # ─── Project decomposition (ADR-050 / Phase 3) ──────────────────────
    # Wire shape mirrors cmd/apid/scan_service.go::scanPlanResponse +
    # the reposcan.Workload / Managed structs. The `workloads` and
    # `managed` arrays are sorted deterministically (by name asc,
    # case-insensitive) so two scans of identical bytes produce
    # byte-identical JSON — the §4 acceptance gate asserts this in CI.

    ProjectScanRequest:
      description: "Multipart body for POST /v1/projects/scan (dry-run)."
      type: object
      required: [source]
      properties:
        source:
          type: string
          format: binary
          description: "tar.gz of the repo root."
        project_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: "kebab slug; default = repo dir basename"
        production_branch:
          type: string
          example: main
        install_id:
          type: integer
          format: int64
          description: "GitHub install id (with --repo); 0 for unbound repos"
        only:
          type: string
          description: "CSV of workload names to include (others skipped)"

    ProjectApplyRequest:
      description: |
        Multipart body for POST /v1/projects (apply). Same shape as
        ProjectScanRequest; the apply handler resolves AppIDs and
        inserts crons in a follow-up pass.
      type: object
      required: [source]
      properties:
        source:
          type: string
          format: binary
        project_slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        production_branch: { type: string }
        install_id: { type: integer, format: int64 }
        only: { type: string }

    PlanWorkload:
      description: "One discovered unit of work. Mirrors reposcan.Workload."
      type: object
      required: [name, root_dir, command, ports]
      properties:
        name: { type: string, example: api }
        root_dir: { type: string, example: "" }
        dockerfile: { type: string, example: Dockerfile }
        command:
          type: array
          items: { type: string }
        class:
          type: string
          enum: [http, graphql, grpc, job, worker, server, unknown]
        schedule:
          type: string
          description: "cron expression when declared (CronJob, render, serverless)"
        ports:
          type: array
          items: { type: integer }
        env_keys:
          type: array
          items: { type: string }
          description: "KEYS only — never values; spec §11 forbids logging secrets"
        source:
          type: string
          description: "detector provenance, e.g. compose.yaml: api"
        tier:
          type: string
          enum: [single, convention, workspace, compose, unknown]

    PlanManaged:
      description: |
        A service the repo declared (compose image:, render.yaml, etc.)
        but the platform will NOT provision. Surfaced so the customer
        sees them in the plan and reads a learnable env hint instead of
        a runtime 422 (two-drive FROM-base contract, ADR-046).
      type: object
      required: [name, kind, env_hint, source, image]
      properties:
        name: { type: string }
        kind: { type: string, example: postgres }
        env_hint: { type: string, example: DATABASE_URL }
        source: { type: string }
        image: { type: string }

    PlanCron:
      description: "A cron expression lifted from a workload (k8s CronJob, render.yaml, serverless.yml)."
      type: object
      required: [workload_name, schedule, path, enabled]
      properties:
        workload_name: { type: string, example: nightly }
        schedule: { type: string, example: "0 3 * * *" }
        path: { type: string, example: / }
        enabled: { type: boolean }

    QuotaBlock:
      description: |
        Limit + observed extension on a plan-quota problem. Mirrors
        api.Problem.WithLimit; emitted alongside any 402/403 quota
        response so the CLI can render "X/Y apps" without a second
        request.
      type: object
      properties:
        limit: { type: integer, format: int64 }
        observed: { type: integer, format: int64 }
        docs_url: { type: string }

    PlanResponse:
      description: "Dry-run scan response."
      type: object
      required:
        - project_slug
        - scan_source
        - tier
        - workloads
        - managed
        - crons
        - observed_apps
        - observed_crons
        - limit_apps
        - limit_crons
        - can_apply
        - plan_token
      properties:
        project_slug: { type: string }
        repo_full_name: { type: string }
        scan_source:
          type: string
          enum: [compose, procfile, k8s, render, fly, serverless, workspace, convention, single, unknown]
        tier: { type: string }
        workloads:
          type: array
          items: { $ref: '#/components/schemas/PlanWorkload' }
        managed:
          type: array
          items: { $ref: '#/components/schemas/PlanManaged' }
        crons:
          type: array
          items: { $ref: '#/components/schemas/PlanCron' }
        warnings:
          type: array
          items: { type: string }
        observed_apps: { type: integer }
        observed_crons: { type: integer }
        limit_apps: { type: integer }
        limit_crons: { type: integer }
        can_apply: { type: boolean }
        crons_not_allowed: { type: boolean }
        plan_token: { type: string, description: "base64-JSON plan token; pass back as ?plan_token= on /v1/projects to skip the second extract." }

    ApplyResponse:
      description: "Apply response. Carries the inserted project_id and per-app IDs."
      type: object
      required: [project_slug, scan_source, can_apply, plan_token]
      properties:
        project_slug: { type: string }
        repo_full_name: { type: string }
        scan_source: { type: string }
        tier: { type: string }
        workloads:
          type: array
          items: { $ref: '#/components/schemas/PlanWorkload' }
        managed:
          type: array
          items: { $ref: '#/components/schemas/PlanManaged' }
        crons:
          type: array
          items: { $ref: '#/components/schemas/PlanCron' }
        warnings:
          type: array
          items: { type: string }
        observed_apps: { type: integer }
        observed_crons: { type: integer }
        limit_apps: { type: integer }
        limit_crons: { type: integer }
        can_apply: { type: boolean }
        crons_not_allowed: { type: boolean }
        plan_token: { type: string }
        project_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        apps:
          type: array
          items:
            type: object
            required: [slug, id]
            properties:
              slug: { type: string }
              id: { type: string, pattern: '^[a-f0-9]{32}$' }
        builds:
          description: |
            Per-workload build enqueue results. Populated when the apply
            path actually enqueued one (deployment, build) per added or
            changed workload (PR-A, repo decomposition Phase 5 close-
            the-loop). On staging or enqueue failure the per-app Error
            field is populated and the IDs are empty.
          type: array
          items: { $ref: '#/components/schemas/AppliedBuild' }

    AppliedBuild:
      description: |
        Per-workload build result from the apply-time build-enqueue loop.
        On success: slug + app_id + deployment_id + build_id. On failure:
        slug + app_id + error, no IDs.
      type: object
      required: [slug, app_id]
      properties:
        slug: { type: string }
        app_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        deployment_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        build_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        error: { type: string, description: "Staging or enqueue error message; partial-failure rows carry this in lieu of IDs." }

    # ─── Alert rules (issue #396 / ADR-045 PR 3) ──────────────────────────
    # Wire shape mirrors pkg/api/alerts.go. Plaintext webhook_secret is
    # only present on the create/update request bodies; every response
    # carries the masked constant in webhook_secret_sealed_masked. The
    # sealed ciphertext never leaves the server.

    AlertRuleResponse:
      description: |
        A customer-configurable alert rule. Carries the masked webhook
        secret; the sealed ciphertext is server-side only.
      type: object
      required:
        - id
        - app_id
        - name
        - enabled
        - metric
        - comparison
        - threshold
        - window_spec
        - webhook_url
        - webhook_secret_sealed_masked
        - cooldown_minutes
        - state
        - created_at
        - updated_at
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        app_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
          description: 'Pinned app id. Empty string = account-wide rule.'
          example: "0123456789abcdef0123456789abcdef"
        name: { type: string, example: "p99 > 500ms" }
        enabled: { type: boolean, example: true }
        metric:
          type: string
          enum:
            - error_rate_pct
            - latency_p50_ms
            - latency_p95_ms
            - latency_p99_ms
            - cold_start_pct
            - request_count
            - failed_invocations
        comparison:
          type: string
          enum: [gt, gte, lt, lte]
        threshold: { type: number, format: double, example: 500 }
        window_spec:
          type: string
          enum: ['5m', '15m', '1h', '6h', '24h', '7d', '15d']
        failure_source:
          type: string
          description: 'Source dimension for failed_invocations; omit when metric is not failed_invocations (xor_chk).'
          enum: [any, cron, queue, delayed_task, async_invoke]
        webhook_url: { type: string, format: uri, example: "https://example.com/hook" }
        webhook_secret_sealed_masked:
          type: string
          description: 'Literal "***" — the plaintext is never returned.'
          example: "***"
        cooldown_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          example: 15
        state:
          type: string
          enum: [ok, firing]
          description: 'Cool-down state machine.'
        last_fired_at: { type: string, format: date-time }
        last_evaluated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAlertRuleRequest:
      description: 'Create an alert rule on an app.'
      type: object
      required: [name, metric, comparison, threshold, window_spec, webhook_url, webhook_secret]
      properties:
        name: { type: string, example: "p99 > 500ms" }
        enabled: { type: boolean, example: true }
        metric:
          type: string
          enum: [error_rate_pct, latency_p50_ms, latency_p95_ms, latency_p99_ms, cold_start_pct, request_count, failed_invocations]
        comparison: { type: string, enum: [gt, gte, lt, lte] }
        threshold: { type: number, format: double, example: 500 }
        window_spec: { type: string, enum: ['5m', '15m', '1h', '6h', '24h', '7d', '15d'] }
        failure_source:
          type: string
          description: 'Required when metric == failed_invocations; omit otherwise (xor_chk).'
          enum: [any, cron, queue, delayed_task, async_invoke]
        webhook_url: { type: string, format: uri, example: "https://example.com/hook" }
        webhook_secret:
          type: string
          description: 'Plaintext HMAC secret (max 256 bytes). Sealed at rest; never echoed.'
          maxLength: 256
          example: "shh"
        cooldown_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          example: 15

    UpdateAlertRuleRequest:
      description: 'Partial update — every field is optional. Omitted means leave alone.'
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
        metric:
          type: string
          description: 'Cannot cross metric families (e.g. error_rate_pct → failed_invocations) — returns 400.'
          enum: [error_rate_pct, latency_p50_ms, latency_p95_ms, latency_p99_ms, cold_start_pct, request_count, failed_invocations]
        comparison: { type: string, enum: [gt, gte, lt, lte] }
        threshold: { type: number, format: double }
        window_spec: { type: string, enum: ['5m', '15m', '1h', '6h', '24h', '7d', '15d'] }
        webhook_url: { type: string, format: uri }
        webhook_secret:
          type: string
          description: 'New plaintext HMAC secret. Omit to keep the existing secret.'
          maxLength: 256
        cooldown_minutes: { type: integer, minimum: 5, maximum: 1440 }

    RotateAlertRuleSecretResponse:
      description: 'rotate-secret response — returns the rotated_at timestamp + the masked constant.'
      type: object
      required: [rotated_at, webhook_secret_sealed_masked]
      properties:
        rotated_at: { type: string, format: date-time, example: "2026-07-28T12:00:00Z" }
        webhook_secret_sealed_masked: { type: string, example: "***" }

    # ─── API keys ─────────────────────────────────────────────────────────

    APIKeyResponse:
      description: "API key metadata: id, prefix (first 8 chars), label, scopes, created/last-used timestamps, request count. **Plaintext is returned only on POST**."
      type: object
      required: [id, prefix, scopes, created_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        prefix: { type: string, description: 'First 16 chars of the key (e.g. `fp_live_abc12345…`).' }
        label: { type: [string, "null"] , example: "ci-deploy"}
        scopes:
          type: array
          items: { type: string, enum: [admin, deploy:write, secrets:read, secrets:write, usage:read, apps:read, env:read, env:write] }
          description: "Permission set attached to the key. Closed vocabulary (IAM-1, ADR-034 rev2): admin is the legacy full-access scope; apps:read covers GETs across the apps/deployments/audit/secrets-list surface; deploy:write covers POST/PUT/PATCH/DELETE on apps+queues; secrets:write covers PUT/DELETE on /apps/{slug}/secrets/{key}; usage:read covers GET /v1/usage*."
          example: [admin]
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time, example: "2026-07-25T13:25:00Z" }
        # IAM-5 (issue #189) — expiry + status surface. expires_at
        # is RFC 3339 or absent (admin keys default to no expiry).
        # status is "active" | "grace" | "revoked". revoked_at
        # mirrors expires_at semantics. rotated_from_id is the
        # predecessor key's id when this row was minted by rotate.
        expires_at: { type: [string, "null"], format: date-time, description: "When the key expires (RFC 3339). Absent on never-expiring admin keys." }
        status: { type: string, enum: [active, grace, revoked], description: "Status state machine. `active` = ready; `grace` = in the post-rotation window; `revoked` = terminal." }
        revoked_at: { type: [string, "null"], format: date-time, description: "When the key was revoked (RFC 3339). Absent on active/grace keys." }
        rotated_from_id: { type: [string, "null"], description: "Predecessor key id when this row was minted by rotateKey. Absent on a fresh mint." }
        plaintext:
          type: [string, "null"]
          description: PRESENT ONLY on POST /v1/keys and POST /v1/keys/{id}/rotate responses. Never returned again.
      example: {id: "0123456789abcdef0123456789abcdef", prefix: "fp_live_ab12cd34", label: "ci-deploy", scopes: [apps:read, deploy:write], created_at: "2026-08-02T11:25:00Z", expires_at: "2027-08-02T11:25:00Z", status: "active", last_used_at: "2026-07-25T13:25:00Z"}

    CreateKeyRequest:
      description: "API key creation payload — label and optional scopes. Plaintext is returned exactly once in the 201 response. Scopes defaults to `[\"admin\"]` when omitted so existing callers preserve the legacy full-access behavior. See IAM-1, ADR-034 rev2."
      type: object
      properties:
        label: { type: string, maxLength: 100 , example: "ci-deploy"}
        scopes:
          type: array
          items: { type: string, enum: [admin, deploy:write, secrets:read, secrets:write, usage:read, apps:read, env:read, env:write] }
          description: "Requested permission set. Server validates each entry against the closed vocabulary and rejects unknown scopes at mint time. `admin` is the legacy full-access scope; the other five cover narrower surfaces (see APIKeyResponse.scopes). See IAM-1, ADR-034 rev2."
          example: [apps:read, deploy:write]

    RotateKeyResponse:
      description: "Response body of POST /v1/keys/{id}/rotate. The new `key_plaintext` is returned exactly once; the old plaintext is NEVER returned (only the hash is stored). `old_key_expires_at` is the grace deadline applied to the predecessor — the customer's CI rotates over by then."
      type: object
      required: [key, key_plaintext, old_key_id, old_key_expires_at]
      properties:
        key: { $ref: '#/components/schemas/APIKeyResponse' }
        key_plaintext: { type: string, description: "New plaintext (PRESENT ONLY on this response). Capture immediately; the API never returns it again." }
        old_key_id: { type: string, description: "Predecessor key id (matches Key.rotated_from_id)." }
        old_key_expires_at: { type: string, format: date-time, description: "Grace deadline applied to the old key (RFC 3339, UTC). When grace_window_days=0 the deadline is 'now' (atomic rotation)." }

    SetGraceWindowRequest:
      description: "Body of PATCH /v1/account/keys/grace_window_days. `days` is the per-account override for the rotation grace window. `days=0` is atomic rotation; `days=null` (or omitted) clears the override and falls back to the plan default (api.DefaultAPIKeyGraceWindowDays = 7)."
      type: object
      properties:
        days: { type: [integer, "null"], minimum: 0, description: "Per-account override in days. 0 = atomic, null = use plan default." }

    GraceWindowResponse:
      description: "Body of GET /v1/account/keys/grace_window_days. `days` is the customer's override (null = no override); `plan_default` is the platform default the rotation handler uses when the row is null."
      type: object
      required: [days, plan_default]
      properties:
        days: { type: [integer, "null"], minimum: 0 }
        plan_default: { type: integer, minimum: 0, description: "Platform default grace window in days (api.DefaultAPIKeyGraceWindowDays = 7)." }

    # ─── Audit events (IAM-4 / ADR-035) ──────────────────────────────────

    AuditEventResponse:
      description: "One row of the customer's security event timeline. The `kind` taxonomy and per-kind `data` schema are documented in `docs/adr/035-auth-audit-events.md`."
      type: object
      required: [id, at, actor, kind, data]
      properties:
        id:
          type: string
          description: "Audit event row id (bigint as string)."
          example: "42"
        at:
          type: string
          format: date-time
          description: "When the event was recorded (RFC 3339, UTC)."
          example: "2026-07-25T13:25:00Z"
        actor:
          type: string
          description: "Which daemon wrote the row. `apid` for IAM-4 surface; `schedd` for state-transition events (instance wakes / parks / watchdog timeouts)."
          example: apid
        kind:
          type: string
          description: "Namespaced event kind. Common values: `auth.login`, `auth.logout`, `auth.session.created`, `auth.session.revoke`, `auth.sessions.revoke_all`, `auth.session.stolen`, `key.created`, `key.deleted`, `secret.set`, `secret.deleted`, `env.set`, `env.deleted`, `account.plan_changed`, `account.deletion_scheduled`, `account.deletion_restored`."
          example: auth.login
        subject:
          type: string
          description: "Account id (uuid string form) the event was recorded against. Omitted when the event has no subject (e.g. system-level)."
          example: "0190f8e1-2a3b-7c4d-9e5f-6a7b8c9d0e1f"
        # Mega-PR B / stateless-advisory severity hoist. Top-level
        # projection of the audit row's data.severity key so an SDK
        # consumer can triage without re-parsing the data JSONB.
        # Closed vocabulary; "" (omitted on the wire) for non-
        # stateless kinds and pre-PR-427 stateless.advisory rows.
        severity:
          type: string
          description: "Highest-severity classification for stateless.advisory rows (`high` for /data, /db, /var/lib/postgresql, /var/lib/mysql; `warn` for other closed paths; `info` for an empty batch). Omitted for non-stateless kinds and for pre-PR-427 stateless.advisory rows where the data.severity key is absent. Mega-PR B / stateless-DX work."
          enum: [high, warn, info]
          example: high
        data:
          type: object
          description: "Kind-specific payload. Always a JSON object; the inner shape depends on `kind`. Plaintext values (e.g. secret VALUE) are NEVER carried in `data`."
          additionalProperties: true
          example: { method: password }

    ListAuditEventsResponse:
      description: "Envelope for `GET /v1/audit-events`. `limit` echoes the effective limit applied by the handler so the SDK can render `showing N of M` without re-issuing the request."
      type: object
      required: [events, limit]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEventResponse' }
        limit:
          type: integer
          description: "Effective limit applied (always 1..100)."
          example: 50

    WakeTimelineEvent:
      description: |
        One frame of the wake timeline (issue #517 / PR-C /
        ADR-064). The shape mirrors the typed event payloads
        the producers write — see `pkg/events/wake.go`. The
        canonical `wake.*` vocabulary is documented in
        `docs/adr/064-wake-timeline-canonical-vocabulary.md`
        (12 success-path kinds + 3 failure-path kinds: build,
        deploy, boot).
      type: object
      required: [at, kind, actor, data]
      properties:
        at:
          type: string
          format: date-time
          description: "RFC 3339 UTC. Oldest-first (forward narrative)."
        kind:
          type: string
          description: "Canonical `wake.*` kind. See ADR-064."
          example: wake.boot_started
        actor:
          type: string
          description: "Daemon that wrote the row (`schedd` / `vmmd` / `gatewayd` / `builderd` / `apid`)."
          example: schedd
        data:
          type: object
          additionalProperties: true
          description: "Producer-supplied payload (json object)."

    WakeTimelineResponse:
      description: "Envelope for `GET /v1/apps/{slug}/wakes/{wake_id}/timeline`."
      type: object
      required: [wake_id, app_id, events, limit]
      properties:
        wake_id:
          type: string
          description: "Echo of the path-segment wake_id."
        app_id:
          type: string
          format: uuid
          description: "Resolved app id (the slug's owning app)."
        events:
          type: array
          items: { $ref: '#/components/schemas/WakeTimelineEvent' }
        next_cursor:
          type: string
          description: "Opaque RFC 3339 cursor for the next page. Empty when this is the last page."
        limit:
          type: integer
          description: "Effective limit applied (always 1..1000)."
          example: 200

    # ─── Secrets ──────────────────────────────────────────────────────────

    PutAppSecretRequest:
      description: "Set a secret: key name and plaintext (sealed at rest immediately, plaintext discarded after seal)."
      type: object
      required: [value]
      properties:
        value: { type: string, description: 'Plaintext. Sealed server-side; never persisted in plaintext.' , example: "sk_test_secret_value"}

    AppSecretResponse:
      description: "A sealed secret envelope: key name, sealed ciphertext (server can't read it), version, and timestamps."
      type: object
      required: [key, created_at, updated_at]
      properties:
        key: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 128 , example: "DATABASE_URL"}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AppSecretListResponse:
      description: "Paginated list of sealed-secret envelopes (no plaintext)."
      type: object
      required: [secrets, quota_max, count]
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/AppSecretResponse' }
        quota_max: { type: integer }
        count: { type: integer }

    # ─── Private-registry credentials (issue #461 / ADR-062) ──────────────

    PutAppRegistryCredentialRequest:
      description: |
        Set a private-registry Basic Auth credential: normalized registry
        host + username + plaintext password. The password is sealed
        server-side under namespace `"registry_creds"` against the host
        X25519 recipient and never persisted in plaintext.
      type: object
      required: [registry, username, password]
      properties:
        registry:
          type: string
          description: "Registry host. Must include explicit `https://` prefix (schemeless + http:// are rejected per ADR-062 §https-only clarification; customer's Basic Auth never leaves the box over cleartext). Trailing slash optional; embedded path / query / fragment rejected."
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?$'
          maxLength: 253
          example: "https://registry.gregale.dev"
        username:
          type: string
          description: "Basic Auth username (metadata, NOT sealed)."
          maxLength: 256
          example: "alice"
        password:
          type: string
          description: "Plaintext Basic Auth password. Sealed server-side; never persisted or returned."
          maxLength: 4096
          format: password
          example: "s3cret-basic-auth-pw"

    AppRegistryCredentialResponse:
      description: |
        A sealed private-registry credential envelope: registry + username
        + timestamps. Plaintext password NEVER appears in this shape.
      type: object
      required: [registry, username, created_at, updated_at]
      properties:
        registry:
          type: string
          example: "registry.gregale.dev"
        username:
          type: string
          example: "alice"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          description: "Timestamp of the last successful authenticated pull. Omitted when the credential has not been used yet."

    AppRegistryCredentialListResponse:
      description: |
        Wrapped list response: rows + quota metadata. The Free plan
        returns 403 on PUT and an empty list on GET.
      type: object
      required: [credentials, quota_max, count]
      properties:
        credentials:
          type: array
          items: { $ref: '#/components/schemas/AppRegistryCredentialResponse' }
        quota_max: { type: integer, description: "Per-app cap from the customer's plan (Free 0, Hobby 2, Pro 5, Scale 20)." }
        count: { type: integer }

    # ─── Env vars (issue #395 / ADR-045) ──────────────────────────────────

    PutAppEnvRequest:
      description: "Set an env var: plaintext value (persisted verbatim in app_envs, non-sensitive by contract)."
      type: object
      required: [value]
      properties:
        value: { type: string, description: 'Plaintext env-var value. Stored as-is; do NOT use this surface for credentials.', example: "debug" }

    AppEnvResponse:
      description: "An env var envelope: key name + timestamps. The plaintext value never appears here."
      type: object
      required: [key, created_at, updated_at]
      properties:
        key: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 128, example: "LOG_LEVEL" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AppEnvListResponse:
      description: "List of env var envelopes (no plaintext values)."
      type: object
      required: [env, quota_max, count]
      properties:
        env:
          type: array
          items: { $ref: '#/components/schemas/AppEnvResponse' }
        quota_max: { type: integer }
        count: { type: integer }

    # ─── Usage ────────────────────────────────────────────────────────────
    # Fields tagged with `x-since: "YYYY-MM"` (issue #NNN) were added after
    # the public launch. OpenAPI consumers (the Go SDK, the Node SDK) read
    # the extension and surface "this field was added in YYYY-MM" so
    # integrators don't have to grep the changelog. New fields MUST set
    # `x-since` to the month of the PR that added them.

    UsageResponse:
      description: "Per-app usage for one month: GB-hours consumed, request count, and an informational CPU-µs field (issue #279 / PR-B). The CPU dimension is observable but not yet billed."
      type: object
      required: [app_id, mb_seconds, requests, included_gb_hours]
      properties:
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        mb_seconds: { type: integer, format: int64 }
        requests: { type: integer, format: int64 }
        included_gb_hours: { type: integer, format: int64 }
        cpu_usec:
          type: integer
          format: int64
          description: "Cumulative host cgroup CPU-µs (informational; not billed). issue #279 / PR-B."
          x-since: "2026-07"
          x-issue: "279"
        tx_bytes:
          type: integer
          format: int64
          description: "Per-app monthly HTTP response bytes the gateway forwarded (informational; not billed). ADR-046. The gateway-side producer lands in PR-2; until then this field stays 0. The future egress-billing PR picks the unit; this field reports interface bytes (includes Ethernet framing)."
          x-since: "2026-08"
          x-issue: "415"
        net_tx_bytes:
          type: integer
          format: int64
          description: "Per-app monthly byte delta on root-side vethHost.rx_bytes (informational; not billed). ADR-046. Sourced from vmmd netstats.Cache via schedd ListInstanceStats. Includes Ethernet framing — same kernel counter the per-plan tc tbf qdisc reads, so the cap and the meter are consistent."
          x-since: "2026-08"
          x-issue: "415"
        net_rx_bytes:
          type: integer
          format: int64
          description: "Per-app monthly byte delta on root-side vethHost.tx_bytes (root→guest = ingress; informational; not billed). ADR-048. Mirror of `net_tx_bytes` for the inbound direction. Same sysfs source — `/sys/class/net/<vethHost>/statistics/tx_bytes`."
          x-since: "2026-08"
          x-issue: "436"
        cold_boots:
          type: integer
          format: int64
          description: "Per-app monthly count of WAKE_RESTORE→WAKE_COLD_BOOT transitions observed (informational; not billed). ADR-048. Source: schedd instancestats.Poller → meterd Sampler."
          x-since: "2026-08"
          x-issue: "436"

    AppMetricsResponse:
      description: |
        Per-app metrics snapshot (issue #273 / ADR-041). Latencies are
        milliseconds for the 2xx class only; failures surface as
        `error_rate_pct`. `wake_p95_ms` is the FLEET p95 — the
        underlying `gateway_wake_latency_seconds` histogram is
        unlabeled. On Prometheus failure the endpoint returns 200 with
        zeroed fields and `source: "degraded: <reason>"`.
      type: object
      required:
        - app_id
        - range
        - source
        - as_of
        - request_count
        - latency_p50_ms
        - latency_p95_ms
        - latency_p99_ms
        - error_rate_pct
        - cold_start_pct
        - wake_p95_ms
      properties:
        app_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
          example: "0123456789abcdef0123456789abcdef"
          x-since: "2026-07"
          x-issue: "273"
        range:
          type: string
          enum: [5m, 15m, 1h, 6h, 24h, 7d, 15d]
          description: "Echoed window."
          x-since: "2026-07"
          x-issue: "273"
        source:
          type: string
          description: '"prometheus" on success, "degraded: <reason>" otherwise.'
          x-since: "2026-07"
          x-issue: "273"
        as_of:
          type: string
          format: date-time
          description: "RFC3339Nano UTC."
          x-since: "2026-07"
          x-issue: "273"
        request_count:
          type: integer
          format: int64
          description: "Share of requests in the window. Drives the dashboard empty state."
          x-since: "2026-07"
          x-issue: "273"
        latency_p50_ms:
          type: number
          description: "p50 of `gateway_request_duration_seconds_bucket{class=\"2xx\"}` over the window, in ms."
          x-since: "2026-07"
          x-issue: "273"
        latency_p95_ms:
          type: number
          description: "p95 over 2xx traffic in the window, in ms."
          x-since: "2026-07"
          x-issue: "273"
        latency_p99_ms:
          type: number
          description: "p99 over 2xx traffic in the window, in ms."
          x-since: "2026-07"
          x-issue: "273"
        error_rate_pct:
          type: number
          minimum: 0
          maximum: 100
          description: "Share of [45]xx requests in the window."
          x-since: "2026-07"
          x-issue: "273"
        cold_start_pct:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Share of requests that triggered a cold boot (the WakeGate
            leader). Followers waiting on the gate see zero cold
            contribution; their wait is on the §12 dashboard via
            `gateway_wake_queue_wait_seconds`.
          x-since: "2026-07"
          x-issue: "273"
        wake_p95_ms:
          type: number
          description: "FLEET p95 wake latency (the unlabeled histogram). Labelled as such in the UI."
          x-since: "2026-07"
          x-issue: "273"
        egress_bytes:
          type: integer
          format: int64
          description: "Per-app egress byte delta over the window (informational; not billed). ADR-046. Source: schedd_egress_net_tx_bytes_total{app} (Prom rollup of usage_minutes.net_tx_bytes — PR-2 wires the rollup; until then this field stays 0)."
          x-since: "2026-08"
          x-issue: "415"

    ListInstancesResponse:
      description: |
        Page shape for `GET /v1/instances` (issue #393). `instances`
        is the page in started_at DESC, id DESC order. `next_before`
        is the cursor the caller passes on the next request to fetch
        the older page; empty when the page is the end.
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items: { $ref: '#/components/schemas/InstanceResponse' }
        next_before:
          type: [string, "null"]
          format: uuid
          description: "Cursor (instances.id UUIDv7) for the next older page. Empty / null at the end."

    AccountAppSecretResponse:
      description: |
        One row in `GET /v1/secrets` — a sealed envelope on a specific
        app (issue #393). Plaintext NEVER appears here: only the
        age-sealed envelope (base64). `app_id` and `app_slug` let the
        dashboard render "foo-app / DATABASE_URL" without a parallel
        `/v1/apps` round-trip.
      type: object
      required: [app_id, app_slug, key, ciphertext, created_at, updated_at]
      properties:
        app_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
          example: "0123456789abcdef0123456789abcdef"
          x-since: "2026-07"
          x-issue: "393"
        app_slug:
          type: string
          x-since: "2026-07"
          x-issue: "393"
        key:
          type: string
          x-since: "2026-07"
          x-issue: "393"
        ciphertext:
          type: string
          description: "base64 age-sealed envelope. Plaintext NEVER appears on this wire."
          x-since: "2026-07"
          x-issue: "393"
        created_at:
          type: string
          format: date-time
          x-since: "2026-07"
          x-issue: "393"
        updated_at:
          type: string
          format: date-time
          x-since: "2026-07"
          x-issue: "393"

    ListSecretsForAccountResponse:
      description: |
        Page shape for `GET /v1/secrets` (issue #393). `secrets` is
        the page in (app_slug ASC, key ASC) order. `next_before` is
        the cursor the caller passes on the next request — encoded as
        `<slug>|<key>`. Empty / null at the end.
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/AccountAppSecretResponse' }
        next_before:
          type: [string, "null"]
          description: "Cursor in the form `<slug>|<key>`. Empty / null at the end."

    AppsMetricsResponse:
      description: |
        Account-wide per-app metrics rollup for `GET /v1/apps/metrics?range=`
        (issue #393). One call replaces N per-app
        `/v1/apps/{slug}/metrics` calls.

        `apps` is keyed by `app_slug` so the dashboard can render the
        rows without a parallel `/v1/apps` lookup. The per-app values
        are `AppMetricsResponse` — the same shape as the per-app
        endpoint emits, so the dashboard renders the rollup with one
        code path.

        `wake_p95_ms` per app is the FLEET p95 (the underlying
        `gateway_wake_latency_seconds` histogram is unlabeled — there
        is no per-app wake histogram).

        On Prometheus failure the endpoint returns 200 with `apps:
        null` and `source: "degraded: <reason>"`, matching the
        per-app contract exactly so the dashboard has one empty-state
        branch across both endpoints.
      type: object
      required: [range, source, as_of, apps]
      properties:
        range:
          type: string
          enum: [5m, 15m, 1h, 6h, 24h, 7d, 15d]
          description: "Time window that was queried for every per-app rollup row."
          x-since: "2026-07"
          x-issue: "393"
        source:
          type: string
          description: '"prometheus" on success; "degraded: <reason>" otherwise.'
          x-since: "2026-07"
          x-issue: "393"
        as_of:
          type: string
          format: date-time
          description: "RFC3339Nano UTC stamp at which the rollup was assembled."
          x-since: "2026-07"
          x-issue: "393"
        apps:
          type: [object, "null"]
          description: "Per-app `AppMetricsResponse`, keyed by app_slug. Null when degraded."
          additionalProperties: { $ref: '#/components/schemas/AppMetricsResponse' }
          x-since: "2026-07"
          x-issue: "393"

    UsageSummaryResponse:
      description: "Account-level monthly roll-up: included GB-hours, used, overage math, remaining balance, and informational used_cpu_hours (issue #279 / PR-B). The CPU dimension is observable but not yet billed; the GB-hours fields drive the overage math."
      type: object
      required: [month, used_gb_hours, included_gb_hours, overage_gb_hours, overage_cents]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-07' }
        used_gb_hours: { type: number , example: 1.234}
        included_gb_hours: { type: integer, format: int64 }
        overage_gb_hours: { type: number }
        overage_cents: { type: integer, format: int64, description: 'Integer cents. Overages are €0.01/GB-h.' }
        used_cpu_hours:
          type: number
          description: 'Per-month CPU-hours (informational; not billed). issue #279 / PR-B.'
          x-since: "2026-07"
          x-issue: "279"
        used_egress_gb:
          type: number
          description: 'Per-month egress GB (informational; not billed). Σ tx_bytes + net_tx_bytes across all apps, converted to GB. ADR-046.'
          x-since: "2026-08"
          x-issue: "415"
        used_ingress_gb:
          type: number
          description: 'Per-month ingress GB (informational; not billed). Σ net_rx_bytes across all apps, converted to GB. ADR-048. Mirror of `used_egress_gb` for the inbound direction.'
          x-since: "2026-08"
          x-issue: "436"
        cold_boots:
          type: integer
          format: int64
          description: 'Per-month sum of WAKE_RESTORE→WAKE_COLD_BOOT transitions across every app on the account (informational; not billed). ADR-048.'
          x-since: "2026-08"
          x-issue: "436"

    # ─── Event-driven surface (Move 2) ───────────────────────────────────

    AsyncInvokeResponse:
      description: "202-side of async-invoke. The id is the invocations row id; status_url is the well-known read endpoint."
      type: object
      required: [id, status_url]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        status_url: { type: string, example: "/v1/invocations/0123456789abcdef0123456789abcdef" }

    InvokeResponse:
      description: "Sync-invoke result. Status is the drain-driven terminal state (`completed` | `failed` | `cancelled`). Result is the original row's payload cast to JSON (omitted while still pending)."
      type: object
      required: [id, status]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        status: { type: string, enum: [pending, dispatching, completed, failed, cancelled] }
        result: { type: object, additionalProperties: true }

    QueueSendResponse:
      description: "201 — body of a freshly-enqueued queue row."
      type: object
      required: [id]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }

    QueueReceiveResponse:
      description: "200 — a dequeued row (the long-poll hit). 204 (no body) on timeout."
      type: object
      required: [id, payload]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        payload: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }

    QueueStateResponse:
      description: "200 — queue depth / in-flight / oldest-pending stats. Read-only."
      type: object
      required: [app_slug, plan, plan_cap, depth, in_flight, generated_at]
      properties:
        app_slug: { type: string }
        plan: { type: string, enum: [free, hobby, pro, scale] }
        plan_cap: { type: integer, description: "MaxQueueDepth for the plan." }
        depth: { type: integer, description: "Pending + dispatching row count." }
        in_flight: { type: integer, description: "Rows with a live dispatch lease (state=dispatching, lease_expires_at > now or NULL)." }
        oldest_pending_at: { type: [string, "null"], format: date-time, description: "Oldest pending row's created_at; null when the queue is empty." }
        oldest_pending_age_seconds: { type: [integer, "null"], description: "Convenience field — seconds since oldest_pending_at; null when the queue is empty." }
        generated_at: { type: string, format: date-time }

    QueuePeekMessage:
      description: "One pending row. No lease was acquired and `attempts` was not incremented."
      type: object
      required: [id, created_at, attempts, payload]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        created_at: { type: string, format: date-time }
        attempts: { type: integer }
        payload: { type: string, description: "Stored payload rendered as a JSON string (verbatim from the jsonb column)." }
        last_error: { type: string, description: "Most recent failure reason, when attempts > 0." }

    QueuePeekResponse:
      description: "200 — a page of pending rows ordered by created_at ASC, id ASC. Pass `next_before` as `?before=<id>` for the next page."
      type: object
      required: [app_slug, messages]
      properties:
        app_slug: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/QueuePeekMessage' }
        next_before: { type: string, pattern: '^[a-f0-9]{32}$', description: "Omitted when the page is the final one." }

    QueueDeadLetterMessage:
      description: "One row that exhausted the plan's retry budget (state='dead_letter')."
      type: object
      required: [id, created_at, failed_at, attempts, last_error, payload]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        created_at: { type: string, format: date-time }
        failed_at: { type: string, format: date-time, description: "When the drain transitioned the row to dead_letter." }
        attempts: { type: integer }
        last_error: { type: string }
        payload: { type: string }

    QueueDeadLetterResponse:
      description: "200 — a page of dead-letter rows ordered by created_at DESC, id DESC."
      type: object
      required: [app_slug, messages]
      properties:
        app_slug: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/QueueDeadLetterMessage' }
        next_before: { type: string, pattern: '^[a-f0-9]{32}$', description: "Cursor for the previous page; absent on the final page." }

    DelayedTaskResponse:
      description: "Delayed task create/get shape. ScheduledAt is the customer-facing UTC dispatch time. State is populated on get, omitted on create (always `pending` there)."
      type: object
      required: [id, scheduled_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        scheduled_at: { type: string, format: date-time }
        state: { type: string, enum: [pending, dispatching, completed, failed, cancelled] }

    Invocation:
      description: "A single invocations row. Account-scoped; cross-account reads return 404."
      type: object
      required: [id, app_id, account_id, source, state, created_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        app_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        account_id: { type: string, pattern: '^[a-f0-9]{32}$', example: "0123456789abcdef0123456789abcdef" }
        source: { type: string, enum: [async_invoke, queue, delayed_task, cron] }
        state: { type: string, enum: [pending, dispatching, completed, failed, cancelled] }
        method: { type: string }
        path: { type: string }
        payload: { type: object, additionalProperties: true }
        headers: { type: object, additionalProperties: true }
        scheduled_at: { type: [string, "null"], format: date-time }
        due_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        instance_id: { type: [string, "null"], pattern: '^[a-f0-9]{32}$' }
        result: { type: [object, "null"], additionalProperties: true }
        last_error: { type: [string, "null"] }
        ack_url: { type: [string, "null"], description: "Optional ack URL for queueReceive consumers; populated on queue-sourced rows." }
        attempts: { type: integer, description: "Number of dispatch attempts so far; 0 on the first try." }
        lease_expires_at: { type: [string, "null"], format: date-time, description: "When the in-flight dispatch lease expires; null when no lease is held." }
        received_at: { type: [string, "null"], format: date-time, description: "When the drain first claimed the row; null until claimed." }

    ListInvocationsResponse:
      description: "Page of invocations; ordered by created_at DESC, id DESC. Pass the LAST id of the returned slice as the next `?before=` to load older."
      type: object
      required: [invocations]
      properties:
        invocations:
          type: array
          items: { $ref: '#/components/schemas/Invocation' }

    InvokeRequest:
      description: "Body for POST /v1/apps/{slug}/invoke[/async]. Method defaults to POST; path defaults to `/`."
      type: object
      properties:
        payload: { type: object, additionalProperties: true }
        headers: { type: object, additionalProperties: true }
        method: { type: string, default: POST }
        path: { type: string, default: "/" }

    QueueSendRequest:
      description: "Body for POST /v1/apps/{slug}/queues/send. Cap-checked against MaxQueueDepth."
      type: object
      properties:
        payload: { type: object, additionalProperties: true }

    DelayedTaskRequest:
      description: "Body for POST /v1/apps/{slug}/delayed-tasks. scheduled_at must be in the future (UTC)."
      type: object
      required: [scheduled_at]
      properties:
        payload: { type: object, additionalProperties: true }
        scheduled_at: { type: string, format: date-time }

    # ─── IAM-3 (ADR-039) dashboard session surface ────────────────────────

    SessionInfo:
      description: |
        One row per dashboard login (ADR-039 / IAM-3). The
        cookie envelope carries the row's `id` as `sid`;
        every authenticated request re-validates the row.
        Revoked rows are filtered out of the
        `GET /v1/auth/sessions` response.
      type: object
      required: [id, account_id, issued_at, current_session]
      properties:
        id:
          type: string
          format: uuid
          description: "Session id. Also stamped as `sid` in the cookie envelope."
        account_id:
          type: string
          format: uuid
        issued_ip:
          type: string
          description: "Client IP captured at login (host portion only; IPv4 or IPv6). Empty when the request's RemoteAddr was unparseable."
          example: "192.0.2.10"
        issued_ua:
          type: string
          description: "User-Agent header captured at login. May be empty when the client suppressed the header."
        issued_at:
          type: string
          format: date-time
          description: "When the session was minted (RFC 3339, UTC)."
        last_seen_at:
          type: string
          format: date-time
          description: "Last time the cookie cross-validated this row. Updated with a 5-minute debounce; continues post-revoke (operational signal only, not authorization)."
        current_session:
          type: boolean
          description: "True when this row's id matches the calling cookie's sid. Exactly one row per list response has this flag set."

    SessionListResponse:
      description: "Body for `GET /v1/auth/sessions`."
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          description: "Active sessions, newest first. Revoked rows are not returned."
          items: { $ref: '#/components/schemas/SessionInfo' }

    SessionsRevokeAllResponse:
      description: "Body for `POST /v1/auth/sessions/revoke_all`."
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0
          description: "Number of sibling sessions revoked. The caller's session is NOT included in this count."

    # ─── Errors ───────────────────────────────────────────────────────────

    Problem:
      type: object
      required: [title, status, code]
      description: |
        RFC 7807 problem+json envelope. The `code` field is the stable
        machine-readable identifier; clients branch on it. `limit` and
        `observed` are populated on quota errors. `docs_url` points the
        user at the next action. `billing_portal_url` is populated on
        `code: payment_required` so the dashboard can deep-link the
        customer to the Stripe-hosted billing portal (issue #142).
        `paddle_checkout_url` + `tx_id` are populated instead when the
        box is running on the Paddle billing provider
        (`FAAS_BILLING_PROVIDER=paddle`, ADR-025) — the customer lands
        on a Paddle-hosted checkout page for the target plan and the
        dashboard renders the transaction handle as a confirmation id.
        Exactly one of `billing_portal_url` or `paddle_checkout_url` is
        populated on a given 402 — never both.
      example:
        type: "https://docs.gregale.dev/errors/validation_failed"
        title: Validation failed
        status: 422
        code: validation_failed
        detail: "ram_mb must be one of [128, 256, 512, 1024, 2048]"
        limit: null
        observed: null
        docs_url: "https://docs.gregale.dev/errors/validation_failed"
      properties:
        type: { type: string, format: uri , example: "https://docs.gregale.dev/errors/validation_failed"}
        title: { type: string , example: "Validation failed"}
        status: { type: integer , example: 422}
        code: { type: string, description: 'Stable machine-readable error code. See StatusForCode in pkg/api/errors.go.' }
        detail: { type: string }
        limit: { type: [integer, "null"] }
        observed: { type: [integer, "null"] }
        docs_url: { type: string, format: uri }
        billing_portal_url: { type: string, format: uri }
        paddle_checkout_url:
          type: string
          format: uri
          description: |
            Paddle-hosted checkout URL on a `payment_required` 402 when
            the box is running on the Paddle billing provider. Mutually
            exclusive with `billing_portal_url`.
        tx_id:
          type: string
          description: |
            Paddle transaction handle (`txn_…`) on a `payment_required`
            402. Empty on the Stripe path. The dashboard renders this as
            a confirmation id after the customer completes checkout.

    RateLimitPlain:
      type: string
      description: |
        Plain-text body returned ONLY by the authlimiter middleware
        (`pkg/middleware/authlimit.go`, around line 200). All other 429s
        return a `Problem` with `code: plan_limit_concurrency` or
        `code: quota_exhausted`.
    # ------------------------------------------------------------------ MFA
    # IAM-2 (issue #186): TOTP MFA on dashboard sessions. The five
    # /v1/account/mfa/* routes and their wire shapes live here so
    # SDK codegen + the dashboard renderer agree on the field set.
    #
    # The server returns the plaintext TOTP secret + recovery codes
    # EXACTLY ONCE on /enroll; the server-side blob is sealed at rest
    # under the host age key (same seal as app_secrets). Recovery
    # codes are 10-char base32 strings stored as SHA-256 hashes — the
    # plaintext never reappears on the wire after /enroll.

    MFAEnrollRequest:
      description: |
        Empty body — the customer brings only their session cookie.
        Kept as a real struct (not `additionalProperties: false`) so
        `{}` decodes cleanly without a "no JSON object" parse error.
      type: object
      additionalProperties: false

    MFAEnrollResponse:
      description: |
        One-shot enrollment payload. Returned exactly once on
        /enroll. The server persists `mfa_secret_encrypted` (sealed)
        and `mfa_recovery_codes_hash` (SHA-256d); subsequent calls
        to /enroll overwrite the secret + codes but do NOT
        re-surface the plaintexts to the dashboard.
      type: object
      required: [otpauth_url, secret, qr_code_png_base64, recovery_codes]
      properties:
        otpauth_url:
          type: string
          description: |
            Standard `otpauth://totp/...` URL with the issuer = FaaS.
            The customer's authenticator app ingests this on its own;
            the dashboard also embeds the QR for camera-based setup.
          example: 'otpauth://totp/FaaS:alice@example.com?secret=JBSWY3DPEHPK3PXP&issuer=FaaS'
        secret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
          description: |
            Base32-encoded TOTP secret, 32 chars (no padding). Same
            value embedded in the otpauth URL; surfaced here so the
            dashboard can render the secret directly for
            copy-paste into an authenticator app that doesn't read
            URLs.
        qr_code_png_base64:
          type: string
          format: byte
          description: |
            Base64-encoded PNG bytes of the QR code (256×256). The
            server base64-encodes the raw PNG for JSON transport;
            the dashboard decodes the string back to bytes before
            rendering it in an `<img>` tag. The authenticator scans
            the decoded PNG.
        recovery_codes:
          type: array
          items: { type: string, pattern: '^[A-Z0-9]{10}$' }
          minItems: 10
          maxItems: 10
          description: |
            Ten single-use 10-character base32 strings. The
            dashboard renders them in the "save these somewhere"
            step. Each code is hashed (SHA-256) before storage;
            the plaintext never reappears.

    MFAConfirmRequest:
      description: Body for /confirm — a single 6-digit TOTP code.
      type: object
      required: [totp]
      properties:
        totp:
          type: string
          pattern: '^[0-9]{6}$'
          description: 6-digit rotating code from the authenticator app.
        csrf_token:
          type: string
          description: |
            Dashboard CSRF token. The dashboard sets a
            `faas_csrf` cookie on every authenticated response; the
            same value rides in this JSON-body field so
            `pkg/middleware.VerifyAuthenticated` can compare them.
            The token is opaque to the wire (sealed session
            reference); size matches the cookie value.

    MFAConfirmResponse:
      description: |
        Empty success body. The meaningful side effect is the
        `Set-Cookie: faas_sid=…` header — re-issued without the
        `mfa_pending` flag — and the stamp of `mfa_enrolled_at`.
      type: object
      additionalProperties: false

    MFAVerifyRequest:
      description: |
        Body for /verify — same 6-digit code as /confirm. The
        account is already enrolled; the verify path does NOT re-
        stamp enrolled_at, only re-issues the cookie without
        mfa_pending.
      type: object
      required: [totp]
      properties:
        totp: { type: string, pattern: '^[0-9]{6}$' }
        csrf_token:
          type: string
          description: |
            Dashboard CSRF token (absorbed from the body for
            parity with /confirm; /verify is not token-gated
            because the TOTP code itself IS the second factor).

    MFAVerifyResponse:
      description: Empty success body. Same semantics as /confirm response.
      type: object
      additionalProperties: false

    MFARecoverRequest:
      description: |
        Body for /recover — one of the 10 recovery codes the
        customer received on /enroll. The hash is removed from
        the stored set; subsequent /recover calls with the same
        code return 401.
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{10}$' }
        csrf_token:
          type: string
          description: Dashboard CSRF token for the recover mutation.

    MFARecoverResponse:
      description: |
        Empty success body. Side effects: the matching hash is
        removed from `mfa_recovery_codes_hash`; the session cookie
        is re-issued without `mfa_pending`.
      type: object
      additionalProperties: false

    MFADisableRequest:
      description: |
        Body for /disable. Exactly one of `password` or
        `recovery_code` is required — both empty and both set are
        rejected with 400 CodeValidation. Password is verified
        against the existing `account_passwords.hash`; the
        recovery code is consumed (one-time).
      type: object
      properties:
        password: { type: string, minLength: 12, maxLength: 256 }
        recovery_code: { type: string, pattern: '^[A-Z0-9]{10}$' }
        csrf_token:
          type: string
          description: Dashboard CSRF token for the disable mutation.
      # `oneOf` would express the constraint declaratively, but the
      # handler enforces the XOR on the server side and returns the
      # actionable 400; we leave the schema lax so a misbehaving
      # client can still get the descriptive error.

    MFADisableResponse:
      description: |
        Empty success body. Side effects: mfa_secret_encrypted,
        mfa_recovery_codes_hash, and mfa_enrolled_at are all NULL.
        mfa_required is left as-is so the chokepoints can re-arm.
      type: object
      additionalProperties: false

    # Issue #472 / ADR-054: per-app cosign trusted-publisher surface.
    # Mirrors AWS Lambda's TrustedSigners / SigningProfileVersionArns.

    TrustedSigner:
      description: |
        One entry in the per-app cosign trusted-publisher list. `name` is the
        apid-side label (matches `app_trusted_signers.signer_name`); `public_key_pem`
        is the base64-encoded DER SubjectPublicKeyInfo bytes — NOT a PEM-armoured
        block. The wire form strips the PEM armour at upload time so the
        on-disk mirror (imaged reads `/etc/faas/secrets/trusted-publishers/`) is
        a single blob per publisher. ECDSA P-256 only (ADR-038); apid rejects
        other curves at PUT time with `trusted_signer_invalid`.
      type: object
      required: [name, public_key_pem, added_at]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          example: "ci-bot"
          description: "Lower-case label. Matches `app_trusted_signers.signer_name`. The label is the on-disk filename (without .pem) under /etc/faas/secrets/trusted-publishers/."
        public_key_pem:
          type: string
          description: "Base64-encoded DER SubjectPublicKeyInfo. Bytes length must be in [64, 1024] (DB CHECK)."
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE..."
        added_at:
          type: string
          format: date-time
          description: "RFC3339 timestamp of when the operator onboarded this publisher."
        added_by:
          type: string
          description: "Account ID of the admin who onboarded this publisher (omit when not yet in audit log)."
          example: "0123456789abcdef0123456789abcdef"

    AddTrustedSignerRequest:
      description: |
        PUT body for `/v1/apps/{slug}/trusted_signers/{name}`. `public_key_pem` is
        the base64-encoded DER blob (apid side strips PEM armour). The DER must
        parse as an ECDSA P-256 SPKI; any other curve or non-ECDSA key returns
        400 `trusted_signer_invalid`. Bytes length must land in [64, 1024].
      type: object
      required: [public_key_pem]
      properties:
        public_key_pem:
          type: string
          minLength: 88
          maxLength: 1400
          description: "Base64-encoded DER SubjectPublicKeyInfo. Length bounds match the DB CHECK."
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE..."

    AppTrustedSignerListResponse:
      description: "GET /v1/apps/{slug}/trusted_signers response body. Empty list is the EXPECTED state for any app with require_signed=false."
      type: object
      required: [signers]
      properties:
        signers:
          type: array
          items: { $ref: '#/components/schemas/TrustedSigner' }

    AppSecurityRequest:
      description: |
        PATCH body for `/v1/apps/{slug}/security`. `require_signed` is a
        pointer so the wire form can distinguish "don't touch" (nil) from
        "explicit true/false" — the same Set-bit convention the broader
        UpdateAppRequest uses (issue #471 streaming flag precedent).
      type: object
      properties:
        require_signed:
          type: [boolean, "null"]
          description: "Operator-only toggle. nil = no change. *true = opt in to signature enforcement (requires the trust list to be non-empty). *false = opt out."
          example: true

    AppSecurityResponse:
      description: "PATCH /v1/apps/{slug}/security response body — the updated flag state."
      type: object
      required: [require_signed]
      properties:
        require_signed:
          type: boolean
          description: "The current state of the require_signed flag after the patch."
          example: true

  responses:

    Unauthorized:
      description: 'code: unauthorized'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InvalidCredentials:
      description: 'code: invalid_credentials — wrong email or password. Drafted for the dashboard auth surface (issue #165 PR #2, ADR-032).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ResetTokenInvalid:
      description: 'code: reset_token_invalid | reset_token_expired — the password-reset token is unknown, already consumed, or expired.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PaymentRequired:
      description: 'code: billing_past_due — account is suspended; pay invoice to resume.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotFound:
      description: 'code: not_found'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Conflict:
      description: 'code: conflict'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ConflictDelete:
      description: 'code: account_deletion_confirm_required | account_deletion_pending | account_not_restorable'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ConflictRename:
      description: 'code: app_rename_failed — slug taken by another live app, or DB unique violation.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Forbidden:
      description: 'code: forbidden — caller is authenticated but lacks the required scope, OR plan_limit_trusted_signers / plan_limit_secret / etc. when the resource count would exceed the plan cap.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    AppNotFound:
      description: 'code: app_not_found — slug does not exist for the authenticated account.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ServerError:
      description: 'code: capacity — server-side error; retry with backoff.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NoRollbackTarget:
      description: 'code: no_rollback_target — there is no superseded deployment to roll back to.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ValidationFailed:
      description: 'code: validation_failed | source_invalid | build_undetected | handler_missing | image_required | cron_invalid | secret_invalid_key'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanLimit:
      description: 'code: plan_limit_apps | plan_limit_ram | plan_limit_concurrency | plan_min_instances_not_allowed | plan_limit_secrets | plan_cron_quota | app_layer_too_large | image_egress_denied'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanLimitSecrets:
      description: 'code: plan_limit_secrets'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ConcurrencyLimit:
      description: 'code: plan_limit_concurrency'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    SourceTooLarge:
      description: 'code: source_too_large'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    SourceEgressDenied:
      description: 'code: image_egress_denied — registry is in RFC1918 / IMDS / link-local, or blocked egress range.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    SecretValueTooLarge:
      description: 'code: secret_value_too_large'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    SecretNotFound:
      description: 'code: secret_not_found'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    # Private-registry credentials (issue #461 / ADR-062): mirror
    # the secrets response shape so SDK callers reuse the same
    # error-decoding branch. Plan quota is 403, value size / per-app
    # quota is 413, host validation is 400.
    PlanRegistryCredentialsNotAllowed:
      description: 'code: plan_registry_credentials_not_allowed — Free plan cannot store private-registry credentials.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanRegistryCredentialQuota:
      description: 'code: plan_registry_credential_quota — per-app host cap reached (Hobby 2 / Pro 5 / Scale 20).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InvalidRegistryHost:
      description: 'code: invalid_registry_host — host missing scheme/path, uppercase, port out of range, or field-length cap exceeded.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    RegistryCredentialNotFound:
      description: 'code: registry_credential_not_found — DELETE on a host that has no sealed credential.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ServiceUnavailable:
      description: |
        Generic 503 envelope. Used by the apid capacity gate (e.g.
        host age recipient not loaded → registry credential PUT
        returns 503 instead of accepting plaintext).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    # Env vars (issue #395 / ADR-045): mirror the secret response
    # shape so SDK callers reuse the same error-decoding branch.
    PlanLimitEnvVars:
      description: 'code: plan_limit_env_vars'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    EnvValueTooLarge:
      description: 'code: env_value_too_large'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    EnvVarInvalidKey:
      description: 'code: env_var_invalid_key'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    EnvVarNotFound:
      description: 'code: env_var_not_found'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    CronInvalid:
      description: 'code: cron_invalid | plan_crons_not_allowed | plan_cron_quota'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    AlertRuleInvalid:
      description: 'code: alert_rule_invalid | plan_alert_rules_not_allowed | plan_alert_rule_quota | image_egress_denied'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    DeployFailed:
      description: 'code: deploy_failed | image_not_found | image_manifest_invalid | build_oom | build_timeout | stateless_only_violation'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InvalidMinInstances:
      description: 'code: invalid_min_instances — must be in [0, plan max_concurrency].'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    CapacityUnavailable:
      description: 'code: capacity_unavailable — no host headroom (alerting; should be near-impossible).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanFeatureGated:
      description: 'code: feature_not_allowed — request targets a feature the plan does not entitle (async_invoke / queues / delayed_tasks on Free).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanQueueDepth:
      description: 'code: plan_queue_depth — per-app queue at the plan''s MaxQueueDepth.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanDelayedTasksCap:
      description: 'code: plan_delayed_tasks_cap — per-app delayed-task count at MaxDelayedTasksPerApp.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PlanSourceBytes:
      description: 'code: source_too_large — payload exceeds the plan''s MaxSourceBytesPerInvocation.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    LongPollTimeout:
      description: 'code: long_poll_timeout — server-side long-poll budget elapsed without a terminal row.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InvalidScheduledAt:
      description: 'code: invalid_scheduled_at — delayed-task scheduled_at is in the past.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TooManyRequests:
      description: |
        429. Two response shapes:
        - `application/problem+json` for code-driven 429s (`plan_limit_concurrency`, `quota_exhausted`).
        - `text/plain` for the authlimiter middleware (`pkg/middleware/authlimit.go`).
      headers:
        Retry-After:
          schema: { type: integer, example: 60 }
          description: Seconds until the client may retry. Emitted by the authlimiter (plain-text path).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        text/plain:
          schema: { $ref: '#/components/schemas/RateLimitPlain' }


    Trace:
      description: |
        Issue #555. A single OpenTelemetry trace — the span tree for one
        request (one wake). The shape mirrors the SDK's ReadOnlySpan
        flattened to JSON: trace_id + span_id are W3C hex, attributes
        are a string map (the operator's debug session is a grep, not
        a query). The same trace_id may host a
        `gateway.handler` → `gateway.route` → `sched.wake` →
        `vmmd.create_*` → `guest.resume` → `guest.readiness` chain
        (issue #555 acceptance #1).
      type: object
      required: [trace_id, spans]
      properties:
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        started: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        spans:
          type: array
          items: { $ref: '#/components/schemas/TraceSpan' }

    TraceSpan:
      description: |
        One span in a trace. Mirrors the OTel SDK's ReadOnlySpan
        attributes (kind, name, status, parent linkage, timing) so
        the customer's debug session can reconstruct the call tree.
      type: object
      required: [trace_id, span_id, name]
      properties:
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        span_id: { type: string, pattern: '^[0-9a-f]{16}$' }
        parent_span_id: { type: string, pattern: '^[0-9a-f]{16}$' }
        name: { type: string, example: sched.wake }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { type: string, enum: [ok, error] }
        status_message: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
