asyncapi: 3.0.0
id: urn:gregale:events
info:
  title: Gregale event contracts
  version: 1.4.0
  description: |
    Gregale delivers selected app lifecycle and billing events to an app's
    configured webhook subscriptions, accepts tenant-scoped events for the
    internal content-based router, accepts external events for durable workflow
    runs, and exposes per-app FIFO queue operations. Outbound webhook messages
    use CloudEvents 1.0 structured JSON over HTTP POST and are signed with the
    webhook secret; ingress, workflow, and queue operations use the public API's
    authenticated JSON endpoints.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/cloudevents+json
servers:
  api:
    host: '{api_host}'
    protocol: https
    description: Gregale public API.
    variables:
      api_host:
        description: Hostname of the Gregale API.
        default: api.gregale.dev
  appWebhook:
    host: '{webhook_host}'
    protocol: https
    description: Customer endpoint configured on an app webhook subscription.
    variables:
      webhook_host:
        description: Hostname of the customer's webhook endpoint.
        default: example.invalid
channels:
  appParked:
    address: app.parked
    description: Emitted after an app is parked and its instances have drained.
    servers:
      - $ref: '#/servers/appWebhook'
    messages:
      appParked:
        $ref: '#/components/messages/AppParked'
  appWoken:
    address: app.woken
    description: Emitted after a parked app is activated and a first instance is ready.
    servers:
      - $ref: '#/servers/appWebhook'
    messages:
      appWoken:
        $ref: '#/components/messages/AppWoken'
  usageStatementFinalized:
    address: usage_statement.finalized
    description: Emitted when an API consumer usage statement becomes payable.
    servers:
      - $ref: '#/servers/appWebhook'
    messages:
      usageStatementFinalized:
        $ref: '#/components/messages/UsageStatementFinalized'
  internalEventPublish:
    address: /v1/events:publish
    description: Publish one tenant-scoped event for asynchronous content-based fanout.
    servers:
      - $ref: '#/servers/api'
    messages:
      internalEventPublish:
        $ref: '#/components/messages/InternalEventPublish'
  workflowExternalEvent:
    address: /v1/workflows/runs/{id}/events
    description: Accept an external event for a non-terminal durable workflow run.
    parameters:
      id:
        description: UUID of the workflow run that receives the event.
        examples:
          - 00000000-0000-0000-0000-000000000000
    servers:
      - $ref: '#/servers/api'
    messages:
      workflowExternalEvent:
        $ref: '#/components/messages/WorkflowExternalEvent'
  queueSend:
    address: /v1/apps/{slug}/queues/send
    description: Enqueue a JSON payload on an app's per-app FIFO queue.
    parameters:
      slug:
        description: App slug whose queue receives the payload.
        examples:
          - demo-app
    servers:
      - $ref: '#/servers/api'
    messages:
      queueSend:
        $ref: '#/components/messages/QueueSend'
  applicationInbox:
    address: /v1/apps/{slug}/inbox
    description: Reliably enqueue a CloudEvents-wrapped message for a Gregale application.
    parameters:
      slug:
        description: Target application slug.
        examples:
          - billing
    servers:
      - $ref: '#/servers/api'
    messages:
      applicationInbox:
        $ref: '#/components/messages/ApplicationInbox'
  applicationOutbox:
    address: /v1/apps/{slug}/outbox
    description: Reliably enqueue a custom event for a registered webhook destination.
    parameters:
      slug:
        description: Source application slug that owns the destination.
        examples:
          - checkout-api
    servers:
      - $ref: '#/servers/api'
    messages:
      applicationOutbox:
        $ref: '#/components/messages/ApplicationOutbox'
  queueReceive:
    address: /v1/apps/{slug}/queues/receive
    description: Long-poll for the next completed queue invocation; acknowledgement is informational.
    parameters:
      slug:
        description: App slug whose queue is being polled.
        examples:
          - demo-app
    servers:
      - $ref: '#/servers/api'
    messages:
      queueReceive:
        $ref: '#/components/messages/QueueReceive'
  queueAck:
    address: /v1/apps/{slug}/queues/{id}/ack
    description: Acknowledge a completed queue invocation (idempotent).
    parameters:
      slug:
        description: App slug that owns the queue invocation.
        examples:
          - demo-app
      id:
        description: 32-character hexadecimal queue invocation identifier.
        examples:
          - 0123456789abcdef0123456789abcdef
    servers:
      - $ref: '#/servers/api'
    messages:
      queueAck:
        $ref: '#/components/messages/QueueAck'
operations:
  deliverAppParked:
    action: send
    channel:
      $ref: '#/channels/appParked'
    summary: Deliver an app.parked event to a subscribed webhook.
    messages:
      - $ref: '#/channels/appParked/messages/appParked'
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  deliverAppWoken:
    action: send
    channel:
      $ref: '#/channels/appWoken'
    summary: Deliver an app.woken event to a subscribed webhook.
    messages:
      - $ref: '#/channels/appWoken/messages/appWoken'
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  deliverUsageStatementFinalized:
    action: send
    channel:
      $ref: '#/channels/usageStatementFinalized'
    summary: Deliver a usage_statement.finalized event to a subscribed webhook.
    messages:
      - $ref: '#/channels/usageStatementFinalized/messages/usageStatementFinalized'
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  receiveInternalEventPublish:
    action: receive
    channel:
      $ref: '#/channels/internalEventPublish'
    summary: Accept a tenant-scoped event for internal routing.
    description: |
      Gregale stamps the CloudEvents specversion, occurrence time when omitted,
      and account ownership before persisting the event for asynchronous
      matching and delivery. The endpoint returns after durable acceptance.
    messages:
      - $ref: '#/channels/internalEventPublish/messages/internalEventPublish'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  receiveWorkflowExternalEvent:
    action: receive
    channel:
      $ref: '#/channels/workflowExternalEvent'
    summary: Accept an external event for a durable workflow run.
    description: |
      Events are recorded for pending, running, or awaiting_event workflow
      runs. Terminal runs reject the event with workflow_not_running. The
      endpoint is idempotent when the caller supplies an Idempotency-Key.
    messages:
      - $ref: '#/channels/workflowExternalEvent/messages/workflowExternalEvent'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  receiveQueueSend:
    action: receive
    channel:
      $ref: '#/channels/queueSend'
    summary: Enqueue a payload on an app's FIFO queue.
    description: The request returns the newly-created queue invocation identifier.
    messages:
      - $ref: '#/channels/queueSend/messages/queueSend'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  receiveApplicationInbox:
    action: receive
    channel:
      $ref: '#/channels/applicationInbox'
    summary: Accept work for another Gregale application.
    description: Uses the durable invocation queue with at-least-once delivery, retry, DLQ, and replay.
    messages:
      - $ref: '#/channels/applicationInbox/messages/applicationInbox'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  receiveApplicationOutbox:
    action: receive
    channel:
      $ref: '#/channels/applicationOutbox'
    summary: Accept a custom event for signed webhook delivery.
    description: Uses the registered destination's signing, timeout, retry, delivery-history, DLQ, and replay configuration.
    messages:
      - $ref: '#/channels/applicationOutbox/messages/applicationOutbox'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  sendQueueReceive:
    action: send
    channel:
      $ref: '#/channels/queueReceive'
    summary: Return the next completed queue invocation.
    description: |
      This operation long-polls for up to 30 seconds. A completed message is
      returned with its id, payload, and optional result; a timeout returns
      HTTP 204 with no message and the caller should retry. The invocation is
      already completed when it is returned; callers may acknowledge receipt
      with the idempotent queue ack operation.
    messages:
      - $ref: '#/channels/queueReceive/messages/queueReceive'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
  receiveQueueAck:
    action: receive
    channel:
      $ref: '#/channels/queueAck'
    summary: Accept an idempotent queue invocation acknowledgement.
    description: The request has no body and returns HTTP 204 on success or re-acknowledgement.
    messages:
      - $ref: '#/channels/queueAck/messages/queueAck'
    security:
      - bearerAuth: []
    bindings:
      http:
        method: POST
        bindingVersion: '0.3.0'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer API key accepted by the public API.
  messages:
    AppParked:
      name: app.parked
      title: App parked
      summary: An app has transitioned to the parked state.
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/AppParkedEvent'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/WebhookHeaders'
          bindingVersion: '0.3.0'
    AppWoken:
      name: app.woken
      title: App woken
      summary: A parked app has been activated with a ready instance.
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/AppWokenEvent'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/WebhookHeaders'
          bindingVersion: '0.3.0'
    UsageStatementFinalized:
      name: usage_statement.finalized
      title: Usage statement finalized
      summary: An API consumer usage statement is finalized and payable.
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/UsageStatementFinalizedEvent'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/WebhookHeaders'
          bindingVersion: '0.3.0'
    InternalEventPublish:
      name: event.published
      title: Internal event publish
      summary: A tenant-scoped event accepted for asynchronous router fanout.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InternalEventPublishPayload'
      bindings:
        http:
          bindingVersion: '0.3.0'
    WorkflowExternalEvent:
      name: workflow.external_event
      title: Workflow external event
      summary: An external event supplied to resume a durable workflow step.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowExternalEventPayload'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/WorkflowEventHeaders'
          bindingVersion: '0.3.0'
    QueueSend:
      name: queue.send
      title: Queue send
      summary: A JSON payload enqueued on an app's FIFO queue.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/QueueSendPayload'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/QueueRequestHeaders'
          bindingVersion: '0.3.0'
    ApplicationInbox:
      name: application.inbox
      title: Application inbox send
      summary: A CloudEvents-compatible message queued for an application.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApplicationInboxPayload'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/QueueRequestHeaders'
          bindingVersion: '0.3.0'
    ApplicationOutbox:
      name: application.outbox
      title: Application outbox delivery
      summary: A custom event queued for a registered webhook.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApplicationOutboxPayload'
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/QueueRequestHeaders'
          bindingVersion: '0.3.0'
    QueueReceive:
      name: queue.receive
      title: Queue receive
      summary: A completed queue invocation returned by a long-poll.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/QueueReceivePayload'
      bindings:
        http:
          bindingVersion: '0.3.0'
    QueueAck:
      name: queue.ack
      title: Queue acknowledgement
      summary: An idempotent acknowledgement for a completed queue invocation.
      contentType: application/json
      description: No request body is required.
      bindings:
        http:
          headers:
            $ref: '#/components/schemas/QueueRequestHeaders'
          bindingVersion: '0.3.0'
  schemas:
    InternalEventPublishPayload:
      type: object
      description: |
        Caller-authored body for the internal event router. Gregale normalizes
        this request into a CloudEvents-shaped envelope and stamps the
        authenticated account as the tenancy extension.
      additionalProperties: false
      required:
        - id
        - source
        - type
        - data
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: Caller-chosen idempotent event identifier.
        source:
          type: string
          minLength: 1
          maxLength: 256
          description: Logical producer or service that emitted the event.
        type:
          type: string
          minLength: 1
          maxLength: 256
          description: Event type used by subscription matching.
        time:
          type: string
          format: date-time
          description: Event occurrence time; Gregale stamps it when omitted.
        data_content_type:
          type: string
          enum: [application/json]
          default: application/json
        data:
          description: JSON event payload.
        account_id:
          type: string
          format: uuid
          description: Optional tenancy assertion; must match the bearer account.
    WorkflowEventHeaders:
      type: object
      description: Optional request headers for workflow event delivery.
      properties:
        Idempotency-Key:
          type: string
          minLength: 1
          description: Reuses the same recorded event for retries of one request.
      additionalProperties: true
    WorkflowExternalEventPayload:
      type: object
      description: External event recorded against a workflow run.
      required:
        - event_name
      properties:
        event_name:
          type: string
          minLength: 1
          description: Application-defined event name matched by the waiting step.
        payload:
          description: Caller-defined JSON value delivered to the workflow step.
    QueueRequestHeaders:
      type: object
      description: Optional request headers for queue send and acknowledgement calls.
      properties:
        Idempotency-Key:
          type: string
          minLength: 1
          description: Deduplication key used when retrying an idempotent request.
      additionalProperties: true
    QueueSendPayload:
      type: object
      description: Body accepted by the queue send endpoint.
      properties:
        payload:
          type: object
          additionalProperties: true
          description: JSON object delivered to the queue invocation.
    ApplicationInboxPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 256, description: Generated when omitted. }
        source: { type: string, minLength: 1, maxLength: 256, default: gregale.send }
        type: { type: string, minLength: 1, maxLength: 256 }
        time: { type: string, format: date-time }
        data_content_type: { type: string, enum: [application/json], default: application/json }
        data: { description: Any valid JSON value. }
        queue_name: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        retry_policy:
          type: object
          additionalProperties: false
          properties:
            max_attempts: { type: integer }
            base_seconds: { type: number }
            max_seconds: { type: number }
            jitter_seconds: { type: number }
    ApplicationOutboxPayload:
      type: object
      additionalProperties: false
      required: [destination, type, data]
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 2048
          description: Registered webhook id or exact registered URL.
        type: { type: string, minLength: 1, maxLength: 256 }
        data: { description: Any valid JSON value. }
    QueueReceivePayload:
      type: object
      description: Body returned when the queue receive long-poll finds a completed invocation.
      required:
        - id
        - payload
      properties:
        id:
          type: string
          pattern: '^[a-f0-9]{32}$'
          description: Queue invocation identifier used by the acknowledgement endpoint.
        payload:
          type: object
          additionalProperties: true
          description: Original JSON object enqueued by the caller.
        result:
          type: object
          additionalProperties: true
          description: Optional result recorded by the app invocation.
    WebhookHeaders:
      type: object
      description: Application headers emitted on every app-webhook delivery.
      required:
        - X-Faas-Webhook-Signature
        - X-Faas-Delivery-Id
        - X-Faas-Webhook-Timestamp
        - X-Faas-Webhook-Attempt
      properties:
        X-Faas-Webhook-Signature:
          type: string
          description: HMAC-SHA256 over `<unix>.<delivery_id>.<body>`.
          pattern: '^sha256=[0-9a-f]{64}$'
        X-Faas-Delivery-Id:
          type: string
          description: Durable delivery ledger identifier.
        X-Faas-Webhook-Timestamp:
          type: string
          description: Unix seconds used in the signature input.
          pattern: '^[0-9]+$'
        X-Faas-Webhook-Attempt:
          type: string
          description: One-based attempt number for this HTTP request.
          pattern: '^[0-9]+$'
      additionalProperties: false
    CloudEventBase:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - data
        - account_id
      properties:
        specversion:
          type: string
          description: CloudEvents specification version.
          enum: ['1.0']
        id:
          type: string
          description: Durable app-webhook delivery identifier.
        source:
          type: string
          description: App source URI, formatted as urn:gregale:app:<app_id>.
          pattern: '^urn:gregale:app:.+$'
        type:
          type: string
          description: Gregale event name.
        subject:
          type: string
          description: App subject, formatted as apps/<app_id>.
          pattern: '^apps/.+$'
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: ['application/json']
        account_id:
          type: string
          description: Account owning the app subscription.
        data:
          type: object
      additionalProperties: false
    AppParkedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          properties:
            type:
              enum: ['app.parked']
            data:
              $ref: '#/components/schemas/AppParkedData'
    AppWokenEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          properties:
            type:
              enum: ['app.woken']
            data:
              $ref: '#/components/schemas/AppWokenData'
    UsageStatementFinalizedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          properties:
            type:
              enum: ['usage_statement.finalized']
            data:
              $ref: '#/components/schemas/UsageStatementFinalizedData'
    AppParkedData:
      type: object
      required:
        - app_id
        - slug
        - status
        - occurred_at
      properties:
        app_id:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: ['evicted_cold']
        occurred_at:
          type: string
          format: date-time
      additionalProperties: false
    AppWokenData:
      type: object
      required:
        - app_id
        - slug
        - status
        - instance_id
        - wake_id
        - occurred_at
      properties:
        app_id:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: ['active']
        instance_id:
          type: string
        wake_id:
          type: string
        occurred_at:
          type: string
          format: date-time
      additionalProperties: false
    UsageStatementFinalizedData:
      type: object
      required:
        - app_id
        - consumer_id
        - statement_id
        - period_start
        - period_end
        - billable_units
        - unpriced_units
        - amount_millicents
        - priced
        - buckets
        - as_of
        - finalized_at
      properties:
        app_id:
          type: string
        consumer_id:
          type: string
        statement_id:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        currency:
          type: string
        billable_units:
          type: integer
          format: int64
        unpriced_units:
          type: integer
          format: int64
        amount_millicents:
          type: integer
          format: int64
        priced:
          type: boolean
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatementBucket'
        as_of:
          type: string
        finalized_at:
          type: string
          format: date-time
      additionalProperties: false
    UsageStatementBucket:
      type: object
      required:
        - window_start
        - billable_units
        - amount_millicents
      properties:
        window_start:
          type: string
          format: date-time
        billable_units:
          type: integer
          format: int64
        rate_card_id:
          type: string
        currency:
          type: string
        price_millicents_per_unit:
          type: integer
          format: int64
        amount_millicents:
          type: integer
          format: int64
      additionalProperties: false
