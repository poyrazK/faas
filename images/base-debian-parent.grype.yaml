# Publication-gate exceptions for base-debian-parent ONLY (scripts/ci/
# scan-oci-image.sh reads this via GRYPE_CONFIG on that one matrix lane).
#
# The parent is staging-only (ADR-053): it must stay a bare
# `FROM debian:12-slim` so imaged can compose children by OCI diff ID, so it
# cannot `apt-get upgrade` itself. vmmd never boots it alone; its admission
# scan reads the runtime child's base, and every Debian child
# (runner-node24, runner-python312) runs `apt-get upgrade` in a layer above
# the parent, which installs the fixed perl-base from bookworm-security.
#
# As of 2026-10-06 the newest debian:12-slim amd64 manifest (a4672c0c…, the
# pinned one) still ships perl-base 5.36.0-7+deb12u3; the fix is deb12u4.
# Each ignore is pinned to that exact package version, so it lapses as soon as
# the parent pin moves to an image carrying the fix. Children are scanned
# without this file, so a child that kept deb12u3 still fails its gate.
ignore:
  - vulnerability: CVE-2026-12087
    package: {name: perl-base, version: 5.36.0-7+deb12u3, type: deb}
  - vulnerability: CVE-2026-13221
    package: {name: perl-base, version: 5.36.0-7+deb12u3, type: deb}
  - vulnerability: CVE-2026-42496
    package: {name: perl-base, version: 5.36.0-7+deb12u3, type: deb}
  - vulnerability: CVE-2026-57433
    package: {name: perl-base, version: 5.36.0-7+deb12u3, type: deb}
  - vulnerability: CVE-2026-8376
    package: {name: perl-base, version: 5.36.0-7+deb12u3, type: deb}
