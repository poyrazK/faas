# Publication-gate exceptions for base-debian-parent. scan-oci-image.sh and
# scan-published-images.sh read images/<image>.grype.yaml for the image they
# scan, so this file applies to the parent only.
#
# The parent is staging-only (ADR-053): it must stay a bare `FROM` of the
# Debian slim image so imaged can compose children by OCI diff ID, so it
# cannot `apt-get upgrade` itself. vmmd never boots it alone; its admission
# scan reads the runtime child's base, and every Debian child (runner-node24,
# runner-python312) runs `apt-get upgrade` in a layer above the parent.
#
# Pin each exception to the exact package version it covers, so it lapses
# when the parent moves to an image carrying the fix. Children are scanned
# without this file. The Debian 12 perl-base exceptions lapsed when the
# parent moved to Debian 13 (ADR 20261023220532); none are needed now.
ignore: []
