# sqlc config — Postgres-backed Store (spec §5, ADR-006, CLAUDE.md
# "SQL via sqlc only"). Generated *.sql.go files are committed; CI regenerates
# to a tmpdir and diffs (analog of the existing proto-check gate).
#
# Install:   go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
# Generate:  sqlc generate
# Verify:    make sqlc-check
version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/state/realtimettl/queries.sql"
    schema: "pkg/state/realtimettl/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/state/realtimettl/sqlc"
        sql_package: "pgx/v5"
        emit_methods_with_db_argument: true
        emit_empty_slices: true
  # Bounded realtime dead-letter recovery; projection mirrors its migration-owned table.
  - engine: "postgresql"
    queries: "pkg/state/realtimebulk/queries.sql"
    schema: "pkg/state/realtimebulk/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/state/realtimebulk/sqlc"
        sql_package: "pgx/v5"
        emit_methods_with_db_argument: true
        emit_empty_slices: true

  # Disposable SQL workload acceptance through delivered app credentials.
  - engine: "postgresql"
    queries: "pkg/managedpostgres/credentialdelivery/probe_queries.sql"
    schema: "pkg/managedpostgres/credentialdelivery/probe_schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/managedpostgres/credentialdelivery/sqlc"
        sql_package: "pgx/v5"
        emit_methods_with_db_argument: true
        emit_interface: true

  - engine: "postgresql"
    queries: ["pkg/state/migration_source_queries.sql", "pkg/state/migration_admission_queries.sql", "pkg/state/node_admission_queries.sql", "pkg/state/node_lifecycle_completion_queries.sql", "pkg/state/operator_node_queries.sql", "pkg/state/operator_park_queries.sql", "pkg/state/operator_recovery_submission_queries.sql", "pkg/state/snapshot_recovery_queries.sql", "pkg/state/audit_outbox_delivery_queries.sql", "pkg/state/operator_restart_queries.sql", "pkg/state/hosting_oidc_queries.sql", "pkg/state/hosting_retention_queries.sql", "pkg/state/hosting_automation_queries.sql", "pkg/state/hosting_history_queries.sql", "pkg/state/hosting_preview_queries.sql", "pkg/state/hosting_domain_queries.sql", "pkg/state/hosting_queries.sql", "pkg/state/operator_observability_queries.sql", "pkg/state/scoped_telemetry_queries.sql", "pkg/state/release_review_queries.sql", "pkg/state/edge_rule_replay_retention_queries.sql", "pkg/state/mcp_access_policy_queries.sql", "pkg/state/entity_outbox_delivery_queries.sql", "pkg/state/event_retention_queries.sql", "pkg/state/event_execution_recovery_queries.sql", "pkg/state/event_consumer_execution_queries.sql", "pkg/state/event_schema_rollout_queries.sql", "pkg/state/event_schema_versions_queries.sql", "pkg/state/event_circuit_queries.sql", "pkg/state/event_routing_retry_queries.sql", "pkg/state/event_consumer_health_queries.sql", "pkg/state/event_subscription_control_queries.sql", "pkg/state/event_recovery_queries.sql", "pkg/state/queries.sql", "pkg/state/managed_postgres_drain_queries.sql", "pkg/state/managed_postgres_drain_plan_queries.sql", "pkg/state/telemetry_coverage_queries.sql", "pkg/state/financial_queries.sql", "pkg/state/financial_budget_queries.sql", "pkg/state/event_recipient_queries.sql", "pkg/state/event_receipt_queries.sql", "pkg/state/event_replay_preview_queries.sql", "pkg/state/event_replay_jobs_queries.sql", "pkg/state/keyed_replay_queries.sql", "pkg/state/invocation_attempt_queries.sql", "pkg/state/queue_lease_queries.sql",