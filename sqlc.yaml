# sqlc config — Postgres-backed Store (spec §5, ADR-006, CLAUDE.md
# "SQL via sqlc only"). Generated *.sql.go files are committed; CI regenerates
# to a tmpdir and diffs (analog of the existing proto-check gate).
#
# Install:   go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
# Generate:  sqlc generate
# Verify:    make sqlc-check
version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/state/queries.sql"
    # Generated by `make schema-dump` after migrations. sqlc v1.27.0 cannot
    # merge table changes across migration files, so this snapshot
    # represents the live schema.
    schema: "schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/state/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        # v1.27.0 spells this `emit_methods_with_db_argument`; required so
        # generated query methods accept a pgx DBTX arg instead of stashing
        # one on Queries.
        emit_methods_with_db_argument: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_empty_slices: true
        rename:
          id: "ID"

  # Independent stored-data reads and fixed server-quoted COPY commands.
  - engine: "postgresql"
    queries: "pkg/managedpostgres/copycontents/queries.sql"
    schema: "pkg/managedpostgres/copycontents/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/managedpostgres/copycontents/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true
        emit_empty_slices: true

  # Nontransactional database creation and its private target ownership journal.
  - engine: "postgresql"
    queries:
      - "pkg/managedpostgres/copydatabases/queries.sql"
      - "pkg/managedpostgres/copydatabases/maintenance.sql"
      - "pkg/managedpostgres/copydatabases/verification.sql"
      - "pkg/managedpostgres/copydatabases/verification_retries.sql"
    schema: "pkg/managedpostgres/copydatabases/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/managedpostgres/copydatabases/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true
        emit_empty_slices: true

  # Complete copy planning reads customer-cluster metadata independently of the
  # control plane. These offline catalogue declarations are never installed.
  - engine: "postgresql"
    queries: "pkg/managedpostgres/copyinventory/queries.sql"
    schema: "pkg/managedpostgres/copyinventory/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/managedpostgres/copyinventory/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true
        emit_empty_slices: true

  # Customer cluster maintenance SQL is separate from control-plane state.
  - engine: "postgresql"
    queries:
      - "pkg/managedpostgres/connectionfence/queries.sql"
      - "pkg/managedpostgres/connectionfence/bootstrap.sql"
    schema: "pkg/managedpostgres/connectionfence/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/managedpostgres/connectionfence/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true
        emit_empty_slices: true

  # Independent target role creation/memberships and their atomic private receipts.
  - engine: "postgresql"
    queries:
      - "pkg/managedpostgres/copyroles/queries.sql"
      - "pkg/managedpostgres/copyroles/memberships.sql"
    schema: "pkg/managedpostgres/copyroles/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/managedpostgres/copyroles/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true
        emit_empty_slices: true
