---
# Provider-neutral, connection-free validation for a generated production
# inventory. This is deliberately separate from preflight.yml: preflight
# gathers facts and must reach every real host, while this gate validates the
# generated topology and host_vars shape in CI or before any SSH is attempted.

- name: Validate generated Gregale fleet topology
  hosts: localhost
  connection: local
  gather_facts: false
  check_mode: true
  any_errors_fatal: true
  vars:
    control_plane_hosts: "{{ groups['control_plane'] | default([]) }}"
    compute_hosts: "{{ groups['compute_nodes'] | default([]) }}"
    fleet_hosts: "{{ (control_plane_hosts + compute_hosts) | unique }}"
  vars_files:
    - roles/postgres_capacity/defaults/main.yml
  tasks:
    - name: Require the production split-box groups
      ansible.builtin.assert:
        that:
          - control_plane_hosts | length == 1
          - compute_hosts | length >= 1
          - compute_hosts | length <= 1000
          - "'box' not in groups"
        fail_msg: >-
          Generated inventory must contain exactly one control_plane host, one
          to 1000 compute_nodes hosts, and no retired box group; got
          control_plane={{ control_plane_hosts | length }},
          compute_nodes={{ compute_hosts | length }}.

    - name: Calculate the PostgreSQL fleet-capacity plan
      ansible.builtin.include_tasks: roles/postgres_capacity/tasks/plan.yml

    - name: Require PostgreSQL capacity to cover steady and rolling fleets
      ansible.builtin.assert:
        that:
          - >-
            (postgres_capacity_steady_pool_budget | int) * 4
            <= (((postgres_capacity_computed_max_connections | int)
            - (faas_postgres_superuser_reserved_connections | int)) * 3)
          - >-
            (postgres_capacity_rollout_pool_budget | int)
            + (faas_postgres_min_operator_headroom | int)
            <= ((postgres_capacity_computed_max_connections | int)
            - (faas_postgres_superuser_reserved_connections | int))
        fail_msg: >-
          Inventory-derived PostgreSQL capacity does not cover the steady
          75% ceiling and one rolling compute generation.

    - name: Require one production group per fleet host
      ansible.builtin.assert:
        that:
          - >-
            (hostvars[item].group_names | intersect(['control_plane', 'compute_nodes']) | length) == 1
          - hostvars[item].faas_box_role is defined
          - hostvars[item].ansible_host is defined
          - hostvars[item].faas_node_name is defined
          - hostvars[item].faas_private_hosts is defined
          - hostvars[item].faas_private_hosts | length == fleet_hosts | length
        fail_msg: >-
          Generated host_vars for {{ item }} does not describe exactly one
          production role and a complete private peer map.
      loop: "{{ fleet_hosts }}"

    - name: Require control-plane host_vars to match its inventory group
      ansible.builtin.assert:
        that:
          - hostvars[item].faas_box_role == 'control-plane'
          - hostvars[item].faas_compute_gateway_discovery == 'database'
          - hostvars[item].faas_apid_app_errors_listen is match('^tcp://0\\.0\\.0\\.0:9093$')
        fail_msg: >-
          {{ item }} is in control_plane but its generated role or discovery
          mode or AppErrors listener is not production split-box compatible.
      loop: "{{ control_plane_hosts }}"

    - name: Require compute host_vars to be node-specific
      ansible.builtin.assert:
        that:
          - hostvars[item].faas_box_role == 'compute-only'
          - hostvars[item].faas_vmmd_target_url is match('^tcp://[^:]+:[0-9]+$')
          - hostvars[item].faas_gateway_target_url is match('^tcp://[^:]+:8080$')
          - hostvars[item].faas_vmmd_schedd_target is match('^tcp://[^:]+:[0-9]+$')
          - hostvars[item].faas_gatewayd_app_errors_target is match('^tcp://apid\\.faas:9093$')
        fail_msg: >-
          {{ item }} is in compute_nodes but its generated routing or
          AppErrors targets are missing or not production transport URLs.
      loop: "{{ compute_hosts }}"
