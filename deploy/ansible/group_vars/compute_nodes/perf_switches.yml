# Request- and deploy-path switches, per cell. node_join.yml renders each
# into a zz-faas-*.conf drop-in on every run. All are off in the daemons'
# code; production-us turned them on after the 2026-11-15 trial (both compute
# nodes, 09:42-14:09Z, measured against the three days before):
#
# schedd_async_wake_finalize (ADR-20261105090246): a booted wake answers after
# its RUNNING publication and records its workload class and secret delivery
# afterwards. post_rpc_finalize_ms left the wake path (was p90 50-60 ms, p99
# up to 768 ms; now 0) and post_rpc_publish_ms p50 fell 32-56 -> 13-20 ms. The
# records are still written (71 secret.delivery_succeeded, 32
# app.characterized in the window).
#
# imaged_app_layer_reuse (ADR-20261112170911): a source deployment whose app
# layer inputs match an earlier layer of the same account republishes it
# instead of converting and scanning again. 37 of 106 preparations hit; a hit
# took 10-13 s p50 against 37-54 s for a converted layer plus scan.
#
# builderd_shared_platform_blobs (ADR-20261031103801): dependency caches share
# one copy of each platform image layer. On fsn-2 since 2026-11-01, on fsn-3
# since the trial; no build errors attributed to it.
#
# builderd_buildkit_seed (ADR-20261030122204): builderd keeps a per-node
# BuildKit seed of the platform images and gives each Railpack build a reflink
# copy, so the builder image step (p50 34 s) becomes a cache hit. Off until a
# one-node canary; a hand drop-in that sets FAAS_BUILD_BUILDKIT_SEED=1 sorts
# after this file and runs the canary.
#
# builderd_defer_cache_export (ADR-20261029171525): a build with a dependency
# cache hands its image to imaged before exporting the cache, from a second
# builder VM on the same drive. The ADR estimates ~115 s off a cold deploy's
# handoff; a 2026-11-17 Kroki deploy spent 130.8 s exporting its cache against
# 12.4 s for the image. Off until a one-node canary compares build start to
# imaged handoff; a hand drop-in that sets FAAS_BUILD_DEFER_CACHE_EXPORT=1
# sorts after this file and runs the canary.
#
# false renders 0, so turning one off takes effect at the next daemon start.
schedd_async_wake_finalize: true
imaged_app_layer_reuse: true
builderd_shared_platform_blobs: true
builderd_buildkit_seed: false
builderd_defer_cache_export: false
