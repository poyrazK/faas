# vmmd restart adoption (docs/adr/20261017-vmmd-restart-adoption.md).
#
# Step 1: every present and future compute node writes version-7 adoption
# blocks. Every release since rc.294 reads them, so a rollback target still
# adopts or quarantines as before. Each vmmd start classifies the records in a
# dry run ("vmmd: adoption dry run" in the journal).
vmmd_adoption_record: true

# Step 2: the canary nodes adopt their running guests across a vmmd restart.
# Names are the canonical database node names (gregalectl compute-nodes list).
# A node's first rollout with it on still drains, because its serving vmmd does
# not hand off yet (node_join reads that from the running process); the rollout
# after that skips the drain when `vmmd adoption-check` proves every guest.
# Widen the list only after the canary has restarted cleanly.
#
# fsn-3 joined on 2026-10-31, before fsn-2's first clean no-drain restart
# (rc.306 adopted 1 of 2; rc.309 drained for a base generation change). Its
# first rollout with the switch drains anyway, so the release that proves the
# rc.309 fixes on fsn-2 also turns the switch on for fsn-3. If that release's
# fsn-2 restart does not adopt every guest, take fsn-3 out again before the next.
vmmd_adoption_canary_nodes:
  - fsn-2.faas
  - fsn-3.faas
vmmd_adopt_running_vms: "{{ (faas_join_database_node | default(faas_node_name | default(''))) in vmmd_adoption_canary_nodes }}"
