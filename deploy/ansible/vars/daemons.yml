---
# Daemon topology + readiness probes, shared by role_convergence and
# fleet_verify. GENERATED-BY-HAND but LOCKSTEP-TESTED: pkg/daemonunitspec
# is the source of truth and TestDaemonsYAML_LockstepWithRegistry
# (pkg/daemonunitspec/ansible_lockstep_test.go) fails CI when this file
# and Registry / Lifecycle disagree (ADR-143).
faas_control_plane_units:
  - faas-apid.service
  - faas-schedd.service
  - faas-meterd.service
  - faas-gatewayd-public.service
  - faas-githubd.service

faas_compute_only_units:
  - faas-vmmd.service
  - faas-gatewayd-internal.service
  - faas-builderd.service
  - faas-imaged.service

faas_legacy_units:
  - faas-gatewayd.service
  - faas-spool-sync.service

# probe: systemd (is-active fallback) | unix (socket path fallback) | tcp
# (host:port fallback). readyz_url is the dependency-aware HTTP gate and is
# preferred by fleet_verify. Mirrors daemonunitspec.Lifecycle.
faas_daemon_probes:
  faas-vmmd.service: { probe: unix, target: /run/faas/vmmd.sock, readyz_url: "http://127.0.0.1:9104/readyz" }
  faas-apid.service: { probe: systemd, target: "", readyz_url: "http://127.0.0.1:9101/readyz" }
  faas-schedd.service: { probe: unix, target: /run/faas/schedd.sock, readyz_url: "http://127.0.0.1:9103/readyz" }
  faas-gatewayd-internal.service: { probe: tcp, target: "127.0.0.1:9090", readyz_url: "http://127.0.0.1:9090/readyz" }
  faas-gatewayd-public.service: { probe: tcp, target: "127.0.0.1:8080", readyz_url: "http://127.0.0.1:9092/readyz" }
  faas-meterd.service: { probe: systemd, target: "", readyz_url: "http://127.0.0.1:9106/readyz" }
  faas-githubd.service: { probe: systemd, target: "", readyz_url: "http://127.0.0.1:8083/readyz" }
  faas-imaged.service: { probe: tcp, target: "127.0.0.1:9102", readyz_url: "http://127.0.0.1:9102/readyz" }
  faas-builderd.service: { probe: unix, target: /run/faas/builderd.sock, readyz_url: "http://127.0.0.1:9105/readyz" }
