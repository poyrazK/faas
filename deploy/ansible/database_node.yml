---
# ADR-1027: converge native managed-database nodes. Run with an inventory
# whose database_nodes group lists them (and control_plane the issuer):
#
#   make ANSIBLE_INVENTORY=... bootstrap-database-nodes
#
# The control plane goes first: pgproxyd authenticates clients against role
# verifiers it reads as faas_pgproxyd, a role that may only SELECT
# database_role_verifiers. Admit the database nodes' overlay addresses with
# faas_postgres_pgproxyd_cidrs (postgres role) before enabling pgproxyd.

- name: Authorize pgproxyd on the control-plane database
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    # The faas_pgproxyd password, generated once on the control plane and
    # kept root-only. A faas_pgproxyd_postgres_password (Ansible Vault)
    # wins when set. The database nodes' pgproxyd_db_url reads
    # faas_pgproxyd_database_password from this host's facts, so the role
    # and the DSN cannot drift.
    faas_pgproxyd_password_file: /var/lib/faas/pgproxyd/postgres-password
  tasks:
    - name: database nodes — create the password's directory
      ansible.builtin.file:
        path: "{{ faas_pgproxyd_password_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: faas_pgproxyd_postgres_password | default('') | length == 0

    - name: database nodes — generate the faas_pgproxyd password once
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail;
          umask 077;
          openssl rand -hex 32 > "{{ faas_pgproxyd_password_file }}.tmp";
          mv "{{ faas_pgproxyd_password_file }}.tmp" "{{ faas_pgproxyd_password_file }}"
        executable: /bin/bash
        creates: "{{ faas_pgproxyd_password_file }}"
      when: faas_pgproxyd_postgres_password | default('') | length == 0

    - name: database nodes — read the generated password
      ansible.builtin.slurp:
        src: "{{ faas_pgproxyd_password_file }}"
      register: faas_pgproxyd_password_raw
      no_log: true
      when: faas_pgproxyd_postgres_password | default('') | length == 0

    - name: database nodes — settle the faas_pgproxyd password
      ansible.builtin.set_fact:
        faas_pgproxyd_database_password: >-
          {{ faas_pgproxyd_postgres_password
             if faas_pgproxyd_postgres_password | default('') | length > 0
             else (faas_pgproxyd_password_raw.content | b64decode | trim) }}
      no_log: true

    - name: database nodes — require a usable password
      ansible.builtin.assert:
        that:
          - faas_pgproxyd_database_password | length >= 32
        fail_msg: >-
          The faas_pgproxyd password is shorter than 32 characters; remove
          {{ faas_pgproxyd_password_file }} to generate a new one, or set a
          longer faas_pgproxyd_postgres_password.
        quiet: true
      no_log: true

    - name: database nodes — create the read-only faas_pgproxyd role
      community.postgresql.postgresql_user:
        name: faas_pgproxyd
        password: "{{ faas_pgproxyd_database_password }}"
        role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT
        state: present
      become_user: postgres
      no_log: true

    - name: database nodes — let faas_pgproxyd connect to faas
      community.postgresql.postgresql_privs:
        database: faas
        roles: faas_pgproxyd
        type: database
        privs: CONNECT
      become_user: postgres

    - name: database nodes — let faas_pgproxyd read role verifiers only
      community.postgresql.postgresql_privs:
        database: faas
        roles: faas_pgproxyd
        type: table
        schema: public
        objs: database_role_verifiers
        privs: SELECT
      become_user: postgres

    - name: database nodes — let faas_pgproxyd resolve the public schema
      community.postgresql.postgresql_privs:
        database: faas
        roles: faas_pgproxyd
        type: schema
        objs: public
        privs: USAGE
      become_user: postgres

# Order: the spec §11 host baseline compute nodes get (cgroups v2, the
# user-namespace and BPF sysctls, sshd and audit hardening), then release
# + mTLS + firewall, then the overlay and its private endpoint aliases
# (pgproxyd dials schedd.faas), then Firecracker with the release's signed
# guest kernel, then the archive keeper, then vmmd in database mode (which
# archives through it when dbbackupd_enabled), then pgproxyd, then
# node_exporter for the host alerts and the internal-PKI expiry exporter.
- name: Converge database nodes
  hosts: database_nodes
  become: true
  gather_facts: true
  vars:
    faas_box_role: database
  pre_tasks:
    - name: database nodes — require the control plane's faas_pgproxyd password
      ansible.builtin.assert:
        that:
          - hostvars[groups['control_plane'] | first].faas_pgproxyd_database_password is defined
        fail_msg: >-
          Run database_node.yml with the control plane in the play, not
          --limit to the database nodes: its first play settles the
          faas_pgproxyd password pgproxyd_db_url uses.
        quiet: true
      when: pgproxyd_enabled | default(false) | bool
  roles:
    - role: cgroups_v2
    - role: grub
    - role: host_hardening
    - role: database_node
    # The node's first mTLS bundle from the control-plane issuer, unless
    # one is installed or database_node_pki_source names one.
    - role: database_node_pki
    - role: overlay
    - role: firecracker
    - role: dbbackupd_service
    - role: database_vmmd
    - role: pgproxyd_service
    - role: node_exporter
    # Exports the internal mTLS leaves' expiry for the FaasInternalMTLS*
    # alerts; pki_renew.yml renews them daily.
    - role: internal_pki_renewal
