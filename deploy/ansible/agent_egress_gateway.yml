---
# ADR-20261117185346: converge the agent egress gateway, then register every
# compute node with it. Run after `make manifest-ansible` with a manifest
# that declares egress.agent_gateway:
#
#   make ANSIBLE_INVENTORY=deploy/ansible/.generated/inventory/hosts.ini \
#     bootstrap-agent-egress-gateway
#
# The gateway goes first so the peer directory and sync helper exist when
# the compute nodes register. Agent VMs use the tunnel only once vmmd's
# FAAS_AGENT_EGRESS_GATEWAY switch is on.

- name: Converge the agent egress gateway
  hosts: agent_egress_gateway
  become: true
  gather_facts: true
  # wg-obs (ADR-20261117185346 amendment 2026-11-19): with it on, agentproxyd
  # serves its metrics on the gateway's tunnel address.
  vars_files:
    - vars/gateway_obs.yml
  roles:
    - role: agent_egress_gateway

- name: Register compute nodes with the agent egress gateway
  hosts: compute_nodes
  become: true
  gather_facts: true
  roles:
    - role: agent_egress_client
