---
# Provider-neutral adoption pipeline for an already-created compute host.
#
# The cloud/provider boundary ends at the Ansible connection variables. The
# playbook owns the rest of the lifecycle: stage trust material, converge the
# production host role, install the verified release, render the manifest,
# initialize host-local identity, start only the compute services, and wait
# for local readiness. The controller performs the final control-plane
# verification and activation after this play returns.
#
# The caller supplies local paths through the faas_join_* variables. They are
# controller-side inputs; secret contents never travel through --extra-vars.

- name: Prepare the adopted compute node
  hosts: compute_nodes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Refuse to join a host other than the requested manifest node
      ansible.builtin.assert:
        that:
          - inventory_hostname == faas_join_inventory_name
          - faas_box_role == 'compute-only'
        fail_msg: >-
          node_join is limited to the manifest compute-only host. Requested
          {{ faas_join_inventory_name }}, got {{ inventory_hostname }} with
          role {{ faas_box_role | default('unset') }}.

    # Managed-host joins skip the full bootstrap roles, so converge the
    # control-plane image's inherited PostgreSQL residue here as well. The
    # compute daemons use the remote DSN from compute-db.env and must not pay
    # the local cluster's boot and memory cost.
    - name: Stop inherited local PostgreSQL services before compute adoption
      ansible.builtin.shell: |
        set -euo pipefail
        units="$(systemctl list-unit-files --type=service --no-legend 'postgresql*' 2>/dev/null | awk '{print $1}' || true)"
        for unit in $units; do
          systemctl disable --now "$unit" >/dev/null 2>&1 || true
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Mask inherited PostgreSQL units on adopted compute node
      ansible.builtin.command:
        argv:
          - systemctl
          - mask
          - postgresql.service
          - postgresql@.service
      changed_when: false
      failed_when: false

    - name: Inspect inherited PostgreSQL data directory
      ansible.builtin.stat:
        path: /var/lib/postgresql
      register: faas_join_local_postgresql_dir

    - name: Inspect PostgreSQL data archive destination
      ansible.builtin.stat:
        path: /var/lib/postgresql.disabled
      register: faas_join_local_postgresql_archive_dir

    - name: Archive inherited PostgreSQL data directory
      ansible.builtin.command:
        argv:
          - mv
          - /var/lib/postgresql
          - /var/lib/postgresql.disabled
      args:
        creates: /var/lib/postgresql.disabled
      when:
        - faas_join_local_postgresql_dir.stat.exists
        - faas_join_local_postgresql_dir.stat.isdir
        - not faas_join_local_postgresql_archive_dir.stat.exists
      register: faas_join_local_postgresql_archive

    - name: Reload systemd after PostgreSQL cleanup
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Probe the managed-host bootstrap contract
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          test "$(cat /var/lib/faas/bootstrap/bootstrap-contract.sha256)" = "{{ faas_join_bootstrap_contract_sha256 }}"
          test -c /dev/kvm
          test -d /srv/fc
          mountpoint -q /srv/fc
          mountpoint -q /var/lib/faas/cache
          test "$(stat -c %d /var/lib/faas/cache)" = "$(stat -c %d /srv/fc)"
          test "$(findmnt -n -o FSTYPE --mountpoint /var/lib/faas/cache)" = xfs
          xfs_info /srv/fc | grep -Eq '(^|[[:space:]])reflink=1($|[[:space:]])'
          test -L /opt/faas/current
          test -d "$(readlink -f /opt/faas/current)"
          test -x /usr/local/bin/gregalectl
          test -s /etc/faas/manifest.yaml
          test -s /etc/faas/storage.env
          test -s /etc/faas/imaged-storage.env
          test -s /etc/faas/runtime-bases.env
          for service in faas-vmmd faas-schedd faas-gatewayd-internal faas-builderd faas-imaged; do
            systemctl is-enabled --quiet "$service.service"
            systemctl is-active --quiet "$service.service"
          done
        executable: /bin/bash
      register: faas_join_managed_host_probe
      changed_when: false
      failed_when: false

    - name: Select full bootstrap or managed-host rollout
      ansible.builtin.set_fact:
        faas_join_bootstrap_contract_current: "{{ faas_join_managed_host_probe.rc == 0 }}"

    - name: Report the managed-host rollout decision
      ansible.builtin.debug:
        msg: >-
          {{ 'Managed-host bootstrap contract is current; skipping OS and role convergence.'
             if faas_join_bootstrap_contract_current
             else 'Managed-host bootstrap contract is absent or stale; running full convergence.' }}

    # The parallel preparation lane is intentionally narrower than node
    # adoption. A host whose OS/role contract changed must use the existing
    # serialized full convergence path rather than mutating serving daemons in
    # parallel with its peers.
    - name: Require an existing managed host for non-disruptive rollout preparation
      ansible.builtin.assert:
        that:
          - faas_join_bootstrap_contract_current | bool
        fail_msg: >-
          Parallel rollout preparation requires a current managed-host
          bootstrap contract; run the full serialized join path for this node.
      when: (faas_join_rollout_phase | default('full')) == 'prepare'

    - name: Create bootstrap directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/faas, mode: "0750" }
        - { path: /etc/faas/secrets, mode: "0700" }
        - { path: /etc/faas/secrets/vmmd, mode: "0700" }
        - { path: /etc/faas/secrets/storage-box, mode: "0700" }
        - { path: /etc/faas/tls, mode: "0755" }
        - { path: /usr/local/bin, mode: "0755" }
        - { path: /var/lib/faas/bootstrap, mode: "0700" }

    # The production bootstrap renders units with fleet.age as a required
    # systemd credential. Stage it before importing bootstrap.yml so a fresh
    # host cannot transiently start with a host-local unseal domain.
    - name: Stage the dedicated fleet unseal identity before bootstrap
      ansible.builtin.copy:
        src: "{{ faas_join_fleet_age_key_source }}"
        dest: /etc/faas/secrets/fleet.age
        owner: root
        group: root
        mode: "0400"
      no_log: true

    - name: Stage the fleet unseal recipient before bootstrap
      ansible.builtin.copy:
        src: "{{ faas_join_fleet_age_recipient_source }}"
        dest: /etc/faas/secrets/fleet.age.pub
        owner: root
        group: root
        mode: "0444"

    # Keep the Ansible boundary fail-closed as well as the gregalectl
    # boundary. This playbook can be invoked directly by an operator, so a
    # caller must not be able to bypass the multi-box OCI contract and make
    # snapshots host-local by accident. The lookup runs on the controller;
    # no secret-bearing value is printed or copied into Ansible output.
    - name: Validate shared remote storage contract before staging it
      ansible.builtin.assert:
        that:
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_BACKEND=(oci|gcs)\s*$')) is not none
          - >-
            ((lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_BACKEND=gcs\s*$')) is none) or
            ((lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_GCS_BUCKET=[a-z0-9][a-z0-9._-]+\s*$')) is not none)
          - >-
            (((lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_BACKEND=oci\s*$')) is none) and
            ((lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_FALLBACK_BACKEND=oci\s*$')) is none)) or
            ((lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_OCI_REGISTRY=https://\S+$')) is not none)
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=none\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_REQUIRE_SHARED_ARTIFACTS=1\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_CACHE_SERVE_STALE=0\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=.*snap/')) is none
        fail_msg: >-
          storage.env must select OCI or GCS remote storage and configure its
          endpoint, set FAAS_STORAGE_LOCAL_PREFIXES=none,
          FAAS_REQUIRE_SHARED_ARTIFACTS=1, and set
          FAAS_STORAGE_CACHE_SERVE_STALE=0. It must not route snap/ through
          FAAS_STORAGE_LOCAL_PREFIXES for a multi-box compute node.
      no_log: true

    - name: Validate the imaged-only lifecycle credential contract
      ansible.builtin.assert:
        that:
          - >-
            (lookup('ansible.builtin.file', faas_join_imaged_storage_env_source) |
            regex_search('(?m)^FAAS_OCI_USERNAME=.+$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_imaged_storage_env_source) |
            regex_search('(?m)^FAAS_OCI_PASSWORD=.+$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_imaged_storage_env_source) |
            regex_search('(?m)^FAAS_(?!OCI_(USERNAME|PASSWORD)=)')) is none
        fail_msg: >-
          imaged-storage.env must contain only non-empty FAAS_OCI_USERNAME and
          FAAS_OCI_PASSWORD assignments. Registry topology remains owned by
          the shared read-only storage.env contract.
      no_log: true

    - name: Create the shared daemon group before staging group-readable keys
      ansible.builtin.group:
        name: faas
        state: present
        system: true

    - name: Allow shared daemons to traverse the shared config directory
      ansible.builtin.file:
        path: /etc/faas
        state: directory
        owner: root
        group: faas
        mode: "0750"

    - name: Allow shared daemons to traverse the shared secret directory
      ansible.builtin.file:
        path: /etc/faas/secrets
        state: directory
        owner: root
        group: faas
        mode: "0750"

    - name: Stage the compute database environment
      ansible.builtin.copy:
        src: "{{ faas_join_compute_db_env_source }}"
        dest: /etc/faas/compute-db.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Stage the shared OCI storage environment
      ansible.builtin.copy:
        src: "{{ faas_join_storage_env_source }}"
        dest: /etc/faas/storage.env
        owner: root
        group: faas
        mode: "0440"
      no_log: true

    - name: Stage the imaged-only OCI lifecycle credential
      ansible.builtin.copy:
        src: "{{ faas_join_imaged_storage_env_source }}"
        dest: /etc/faas/imaged-storage.env
        owner: root
        group: faas
        mode: "0440"
      no_log: true

    - name: Stage the release-bound runtime base contract
      ansible.builtin.copy:
        src: "{{ faas_join_runtime_bases_env_source }}"
        dest: /etc/faas/runtime-bases.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # These files were used by the pre-release/live-e2e rollout path. The
    # signed runtime-bases.env, storage.env, and imaged-storage.env are now
    # the only sources of truth; leaving the legacy files in place would clear or override the
    # release EnvironmentFiles, make builderd and imaged resolve different
    # bases, and retain obsolete registry credentials on the host.
    - name: Remove legacy imaged runtime EnvironmentFile override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-imaged.service.d/99-release-runtime.conf
        state: absent

    - name: Remove legacy per-runtime Environment override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-imaged.service.d/zz-faas-function-runners.conf
        state: absent

    - name: Remove legacy builderd OCI environment override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-builderd.service.d/99-codex-oci-source.conf
        state: absent

    - name: Remove legacy live-E2E environment file
      ansible.builtin.file:
        path: /etc/faas/oci-e2e.env
        state: absent

    # The builder artifact is content-addressed by architecture. A previous
    # release could leave /srv/fc/base/builder-base.ext4 behind while the
    # canonical runner-builder key (and its digest sidecar) was absent. Do
    # not let builderd consume that unscanned legacy file: remove both
    # spellings before the release-bound imaged pre-stage repopulates the
    # canonical artifact, and let the readiness gate keep the node drained if
    # pre-staging fails.
    - name: Remove legacy builder base artifacts before canonical pre-stage
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /srv/fc/base/builder-base.ext4
        - /srv/fc/base/builder-base.ext4.digest

    # Capture the database-side attestation before replacing the on-disk leaf.
    # A managed node can receive a refreshed PKI bundle during convergence;
    # vmmd correctly refuses to start while compute_nodes still names the old
    # fingerprint. The captured value is the CAS guard used immediately after
    # staging so pre-stage never depends on a vmmd that is deadlocked behind
    # stale attestation state.
    - name: Inspect the existing compute-node operator binary
      ansible.builtin.stat:
        path: /usr/local/bin/gregalectl
      register: faas_join_existing_operator

    - name: Inspect existing compute-node certificate attestation before trust refresh
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - compute-nodes
          - show
          - --node
          - "{{ faas_join_database_node }}"
          - --break-glass-db
      register: faas_join_existing_compute_node
      changed_when: false
      failed_when: faas_join_existing_compute_node.rc not in [0, 3]
      when: faas_join_existing_operator.stat.exists

    - name: Remember the pre-refresh certificate fingerprint
      ansible.builtin.set_fact:
        faas_join_expected_cert_fingerprint: >-
          {{
            (
              faas_join_existing_compute_node.stdout
              | regex_findall('(?m)^cert_fingerprint=(sha256:[0-9a-f]{64})$')
              | first
              | default('', true)
            )
            if (faas_join_existing_compute_node.rc | default(3)) == 0
            else ''
          }}

    # Preparation must preserve the live trust identity. The shared operator
    # bundle can contain issuance material, and producing a leaf from it is
    # intentionally nondeterministic; comparing that newly issued leaf with
    # the active node would make every later phased rollout fail. Validate the
    # installed leaf against the database attestation and only require the
    # candidate bundle to retain the same CA. The serialized full path remains
    # the only path allowed to install and attest replacement leaves.
    - name: Inspect the active compute certificate during parallel rollout preparation
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - pki
          - fingerprint
          - --cert
          - /etc/faas/tls/vmmd/server.crt
      register: faas_join_active_cert_fingerprint
      changed_when: false
      when: (faas_join_rollout_phase | default('full')) == 'prepare'

    - name: Inspect the active compute CA during parallel rollout preparation
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - pki
          - fingerprint
          - --cert
          - /etc/faas/tls/ca/ca.crt
      register: faas_join_active_ca_fingerprint
      changed_when: false
      when: (faas_join_rollout_phase | default('full')) == 'prepare'

    - name: Require stable active trust during parallel rollout preparation
      ansible.builtin.assert:
        that:
          - (faas_join_expected_cert_fingerprint | default('') | trim) != ''
          - (faas_join_active_cert_fingerprint.stdout | trim) == faas_join_expected_cert_fingerprint
          - (faas_join_active_ca_fingerprint.stdout | trim) == faas_join_candidate_ca_fingerprint
        fail_msg: >-
          Parallel rollout preparation requires the active certificate to
          match its database attestation and the candidate CA; run the full
          serialized join path for trust rotation or repair.
      when: (faas_join_rollout_phase | default('full')) == 'prepare'

    - name: Stage the compute trust bundle (the source never includes the CA private key)
      ansible.builtin.copy:
        src: "{{ faas_join_pki_source }}/"
        dest: /etc/faas/tls/
        owner: root
        group: root
        mode: preserve
      no_log: true
      when: (faas_join_rollout_phase | default('full')) != 'prepare'

    # The operator-side PKI archive deliberately stores private keys as
    # root-only. The full bootstrap roles grant access only to the leaves
    # consumed by unprivileged compute daemons. Reapply that narrow contract
    # after every trust-bundle refresh because the managed-host fast path
    # skips those roles.
    - name: Restore unprivileged compute daemon access to staged TLS leaves
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: root
        group: faas
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/faas/tls/gatewayd/schedd-client.key, mode: "0440" }
        - { path: /etc/faas/tls/gatewayd/schedd-client.crt, mode: "0440" }
        - { path: /etc/faas/tls/gatewayd/vmmd-client.key, mode: "0440" }
        - { path: /etc/faas/tls/gatewayd/vmmd-client.crt, mode: "0440" }
        - { path: /etc/faas/tls/gatewayd/apid-client.key, mode: "0440" }
        - { path: /etc/faas/tls/gatewayd/apid-client.crt, mode: "0444" }
        - { path: /etc/faas/tls/schedd/server.key, mode: "0440" }
        - { path: /etc/faas/tls/schedd/server.crt, mode: "0440" }
        - { path: /etc/faas/tls/schedd/vmmd-client.key, mode: "0440" }
        - { path: /etc/faas/tls/schedd/vmmd-client.crt, mode: "0440" }
        - { path: /etc/faas/tls/builderd/vmmd-client.key, mode: "0440" }
        - { path: /etc/faas/tls/imaged/vmmd-client.key, mode: "0440" }
        - { path: /etc/faas/tls/egress/egress.key, mode: "0440" }
        - { path: /etc/faas/tls/egress/egress.crt, mode: "0444" }
      when: (faas_join_rollout_phase | default('full')) != 'prepare'

    - name: CAS-stamp the staged vmmd certificate before runtime pre-stage
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - secrets
          - stamp
          - --host
          - "{{ faas_join_database_node }}"
          - --expected-fingerprint
          - "{{ faas_join_expected_cert_fingerprint }}"
      when:
        - (faas_join_rollout_phase | default('full')) != 'prepare'
        - (faas_join_expected_cert_fingerprint | default('') | trim) != ''
      changed_when: true

    - name: Stage the image-signing private key
      ansible.builtin.copy:
        src: "{{ faas_join_sign_key_source }}"
        dest: /etc/faas/secrets/sign.key
        owner: root
        group: faas
        mode: "0440"
      no_log: true

    - name: Stage the image-signing public key
      ansible.builtin.copy:
        src: "{{ faas_join_verify_key_source }}"
        dest: /etc/faas/secrets/sign-pub.pem
        owner: root
        group: root
        mode: "0444"
      no_log: true

    - name: Inspect the existing per-node capacity signing key
      ansible.builtin.stat:
        path: /etc/faas/secrets/vmmd/node.key
      register: faas_join_existing_node_key

    - name: Inspect the existing per-node capacity public key
      ansible.builtin.stat:
        path: /etc/faas/secrets/vmmd/node.pub
      register: faas_join_existing_node_pub

    - name: Refuse a partial per-node capacity keypair
      ansible.builtin.assert:
        that:
          - (faas_join_existing_node_key.stat.exists | bool) == (faas_join_existing_node_pub.stat.exists | bool)
        fail_msg: >-
          node.key and node.pub must either both exist or both be absent; repair the
          pair with gregalectl node-key before resuming this node join

    - name: Stage the per-node capacity signing key on first enrollment
      ansible.builtin.copy:
        src: "{{ faas_join_node_key_source }}"
        dest: /etc/faas/secrets/vmmd/node.key
        owner: root
        group: root
        mode: "0400"
        force: false
      no_log: true

    - name: Stage the per-node capacity public key on first enrollment
      ansible.builtin.copy:
        src: "{{ faas_join_node_pub_source }}"
        dest: /etc/faas/secrets/vmmd/node.pub
        owner: root
        group: root
        mode: "0444"
        force: false
      no_log: true

    - name: Stage the manifest consumed by the on-host renderer
      ansible.builtin.copy:
        src: "{{ faas_join_manifest_source }}"
        dest: /etc/faas/manifest.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Stage the bootstrap operator binary
      ansible.builtin.copy:
        src: "{{ faas_join_bootstrap_binary_source }}"
        dest: /usr/local/bin/gregalectl
        owner: root
        group: root
        mode: "0755"

    # The controller already transferred this exact binary in the preceding
    # task. Mirror it on-host instead of uploading the same payload over SSH a
    # second time; the bootstrap path remains isolated from the later signed
    # release promotion.
    - name: Mirror the bootstrap operator binary for release checks
      ansible.builtin.copy:
        src: /usr/local/bin/gregalectl
        dest: /var/lib/faas/bootstrap/gregalectl
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Stage the release cosign verifier
      ansible.builtin.copy:
        src: "{{ faas_join_cosign_binary_source }}"
        dest: /usr/local/bin/cosign
        owner: root
        group: root
        mode: "0755"

    - name: Stage the signed release bundle
      ansible.builtin.copy:
        src: "{{ faas_join_release_tarball_source }}"
        dest: /var/lib/faas/bootstrap/release.tar.gz
        owner: root
        group: root
        mode: "0644"

    - name: Stage the release-pinned Firecracker guest kernel
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail;
          umask 077;
          tmp=$(mktemp /var/lib/faas/bootstrap/vmlinux.XXXXXX);
          trap 'rm -f "$tmp"' EXIT;
          tar --extract --gzip --file /var/lib/faas/bootstrap/release.tar.gz
          --to-stdout vmlinux > "$tmp";
          test -s "$tmp";
          install -o root -g root -m 0644 "$tmp"
          /var/lib/faas/bootstrap/vmlinux;
          rm -f "$tmp";
          trap - EXIT
        executable: /bin/bash
      changed_when: true

    - name: Stage the release signature bundle
      ansible.builtin.copy:
        src: "{{ faas_join_release_signature_source }}"
        dest: /var/lib/faas/bootstrap/release.cosign.bundle
        owner: root
        group: root
        mode: "0644"

    - name: Delete kernel temporaries left by interrupted or older rollouts
      ansible.builtin.command:
        argv:
          - find
          - /var/lib/faas/bootstrap
          - -maxdepth
          - "1"
          - -type
          - f
          - -name
          - vmlinux.*
          - -print
          - -delete
      register: faas_join_kernel_temp_cleanup
      changed_when: (faas_join_kernel_temp_cleanup.stdout | trim) != ''

    - name: Stage the release SBoM
      ansible.builtin.copy:
        src: "{{ faas_join_release_sbom_source }}"
        dest: /var/lib/faas/bootstrap/release.sbom.json
        owner: root
        group: root
        mode: "0644"

    # The signed release tarball carries vmlinux, but production split-box
    # storage is remote-only. vmmd therefore resolves the kernel through the
    # shared OCI backend at wake time. Verify and prewarm that exact key before
    # bootstrap handlers or service restarts can make this node schedulable.
    # --refresh also pins the verified digest in the node cache: a successful
    # download alone is not a prewarm guarantee because later snapshot writes
    # can otherwise evict the kernel before the first customer wake.
    - name: Verify the release-pinned kernel is present in shared storage
      ansible.builtin.command:
        argv:
          - /var/lib/faas/bootstrap/gregalectl
          - artifact
          - verify
          - --env-file
          - /etc/faas/storage.env
          - --manifest-file
          - /etc/faas/manifest.yaml
          - --no-cache
      register: faas_release_kernel_verify
      changed_when: false

    - name: Prewarm the verified release-pinned kernel in the node cache
      ansible.builtin.command:
        argv:
          - /var/lib/faas/bootstrap/gregalectl
          - artifact
          - verify
          - --env-file
          - /etc/faas/storage.env
          - --manifest-file
          - /etc/faas/manifest.yaml
          # The node may already cache the previous release under the same
          # logical key. Refresh forces this integrity check to read the
          # shared store and replace that entry before vmmd can be promoted.
          - --refresh
      register: faas_release_kernel_prewarm
      changed_when: false

- name: Converge the adopted node with the production bootstrap
  import_playbook: bootstrap.yml

- name: Record successful compute bootstrap convergence
  hosts: compute_nodes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Persist the exact bootstrap source contract
      ansible.builtin.copy:
        dest: /var/lib/faas/bootstrap/bootstrap-contract.sha256
        owner: root
        group: root
        mode: "0600"
        content: "{{ faas_join_bootstrap_contract_sha256 }}\n"

- name: Verify the signed release before promoting its operator CLI
  hosts: compute_nodes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Verify the release tarball signature
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cosign
          - verify-blob
          - --certificate-identity-regexp
          - '^https://github\.com/poyrazK/faas/\.github/workflows/release\.yml@refs/tags/.+$'
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --bundle
          - /var/lib/faas/bootstrap/release.cosign.bundle
          - /var/lib/faas/bootstrap/release.tar.gz
      changed_when: false

    - name: Promote the catalog-aware gregalectl from the verified release
      ansible.builtin.shell:
        cmd: >-
          set -eu -o pipefail;
          umask 077;
          tmp=$(mktemp /var/lib/faas/bootstrap/gregalectl.XXXXXX);
          trap 'rm -f "$tmp"' EXIT;
          tar --extract --gzip --file /var/lib/faas/bootstrap/release.tar.gz
          --to-stdout gregalectl > "$tmp";
          test -s "$tmp";
          chmod 0755 "$tmp";
          mv -f "$tmp" /usr/local/bin/gregalectl;
          trap - EXIT
        executable: /bin/bash
      changed_when: true

- name: Install, render, start, and activate the adopted node
  hosts: compute_nodes
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Refuse activation when the OCI cache is outside fast storage
      ansible.builtin.shell: |
        set -euo pipefail
        mountpoint -q /var/lib/faas/cache
        test "$(stat -c %d /var/lib/faas/cache)" = "$(stat -c %d /srv/fc)"
        test "$(findmnt -n -o FSTYPE --mountpoint /var/lib/faas/cache)" = xfs
        xfs_info /srv/fc | grep -Eq '(^|[[:space:]])reflink=1($|[[:space:]])'
      args:
        executable: /bin/bash
      changed_when: false

    # Managed-host rollouts may skip the full bootstrap roles when their OS
    # contract is current. Cache shards are mutable host state, so repair the
    # shared group contract on every release before imaged pre-stages bases.
    - name: Repair shared OCI cache directory permissions before pre-stage
      ansible.builtin.shell: |
        set -euo pipefail
        chgrp faas /var/lib/faas/cache
        chmod 2770 /var/lib/faas/cache
        find /var/lib/faas/cache -mindepth 1 -type d \
          -exec chgrp faas {} + -exec chmod 2770 {} +
      args:
        executable: /bin/bash
      changed_when: false

    - name: Detect the legacy imaged environment file
      ansible.builtin.stat:
        path: /etc/faas/oci-e2e.env
      register: faas_oci_e2e_env

    - name: Remove the legacy builder-base override before applying the release pin
      ansible.builtin.lineinfile:
        path: /etc/faas/oci-e2e.env
        regexp: '^FAAS_BUILDER_BASE_REF='
        state: absent
      when: faas_oci_e2e_env.stat.exists

    - name: Install the manifest and builder-base identity for imaged
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-imaged.service.d/zz-faas-manifest-base.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment=FAAS_MANIFEST_PATH=/etc/faas/manifest.yaml
          Environment=FAAS_BUILDER_BASE_REF={{ faas_builder_base_ref | default(faas_join_builder_base_ref) }}

    - name: Pin imaged guest-init to the active release
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-imaged.service.d/zz-faas-guest-init.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          # Runtime bases embed guest/init as PID 1. Do not allow a legacy
          # /usr/local/bin/faas-guest-init override to survive node adoption.
          Environment=FAAS_GUEST_INIT=/opt/faas/current/bin/init

    - name: Derive this host's capacity from one source of truth
      # pkg/api.DeriveNodeSizingForRole is the only place the reserve
      # arithmetic lives. Ansible used to carry its own
      # `MemTotal * 85 / 100`, while the tenant cgroup fence was a
      # hand-written drop-in no role owned. On the 15,985 MB production
      # nodes that left schedd admitting to 13,587 MB against a kernel
      # fence of 8,192 MB, and the gap surfaced as CONSTRAINT_MEMCG OOM
      # kills of tenant firecracker processes. Both numbers now come from
      # this one call.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - compute-nodes
          - sizing
          - --role
          - "{{ faas_box_role | default('compute-only', true) }}"
          - --json
      changed_when: false
      register: faas_node_sizing_raw

    - name: Require machine-readable capacity output before parsing it
      # A non-JSON stdout here used to surface as ansible's opaque
      # "the field 'args' has an invalid value ... Expecting value: line 1
      # column 1", which says nothing about the actual cause. Assert the
      # shape first so the failure names the command and shows what it
      # printed.
      ansible.builtin.assert:
        that:
          - faas_node_sizing_raw.stdout | default('') | trim is match('^\{')
        fail_msg: >-
          gregalectl compute-nodes sizing --json did not emit JSON
          (stdout={{ faas_node_sizing_raw.stdout | default('') | trim }});
          the installed operator binary may predate the sizing subcommand.

    - name: Parse the derived capacity
      ansible.builtin.set_fact:
        faas_node_sizing: "{{ faas_node_sizing_raw.stdout | from_json }}"

    - name: Refuse to size a node the probe could not measure
      # detected=false means /proc/meminfo was unreadable, so the report
      # carries the single-box constants. Registering those on a small host
      # is exactly the ~3x overcommit this contract exists to prevent.
      ansible.builtin.assert:
        that:
          - faas_node_sizing.detected | bool
          - (faas_node_sizing.admission_ceiling_mb | int) > 0
          - (faas_node_sizing.tenant_slice_max_mb | int) > 0
        fail_msg: >-
          gregalectl compute-nodes sizing could not measure this host
          (detected={{ faas_node_sizing.detected }}); refusing to register
          single-box capacity constants on it.

    - name: Ensure the tenant slice drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/faas-tenant.slice.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fence the tenant slice at the derived tenant slice maximum
      # The kernel fence and the admission ceiling are two views of the same
      # calculation. This drop-in was previously hand-written and unmanaged.
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-tenant.slice.d/90-host-capacity.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Slice]
          MemoryMax={{ faas_node_sizing.tenant_slice_max_mb }}M

    - name: Reload systemd so the re-fenced tenant slice takes effect
      # Unconditional rather than a handler: handlers flush at the end of
      # the play, and the tenant fence must already be live before this play
      # starts vmmd and lets tenants land on the node. daemon-reload is
      # idempotent, so changed_when: false keeps the run honest.
      ansible.builtin.systemd:
        daemon_reload: true
      changed_when: false

    - name: Install the hardware-derived vmmd capacity contract
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-vmmd.service.d/zz-faas-capacity.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment=FAAS_COMPUTE_VCPUS={{ ansible_processor_vcpus }}
          Environment=FAAS_COMPUTE_MEM_MB={{ ansible_memtotal_mb }}
          Environment=FAAS_COMPUTE_MAX_CONCURRENCY={{ faas_join_max_concurrency | default((ansible_processor_vcpus | int) * 5, true) }}
          Environment=FAAS_COMPUTE_ADMISSION_CEILING_MB={{ faas_join_admission_ceiling_mb | default(faas_node_sizing.admission_ceiling_mb, true) }}
          Environment=FAAS_VCPU_BUDGET={{ faas_join_vcpu_budget | default((ansible_processor_vcpus | int) * 8, true) }}

    # A fresh host has no /opt/faas/current yet, but release-bound base
    # preparation needs vmmd. Register the row as unavailable before the
    # temporary candidate vmmd starts so self-registration cannot make the
    # unfinished host schedulable. UpsertComputeNodeFromVmmd preserves this
    # operator-owned lifecycle on conflict.
    - name: Pre-register the newly adopted node as unavailable before runtime pre-stage
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - compute-nodes
          - add
          - --name
          - "{{ faas_join_database_node }}"
          - --target-url
          - "{{ faas_vmmd_target_url }}"
          - --schedd-target-url
          - "{{ faas_vmmd_schedd_target }}"
          - --gateway-target-url
          - "{{ faas_gateway_target_url | default('tcp://' ~ ansible_host ~ ':8080', true) }}"
          - --vpcpus
          - "{{ ansible_processor_vcpus }}"
          - --mem-mb
          - "{{ ansible_memtotal_mb }}"
          - --max-concurrency
          - "{{ faas_join_max_concurrency | default((ansible_processor_vcpus | int) * 5, true) }}"
          - --admission-ceiling-mb
          - "{{ faas_join_admission_ceiling_mb | default(faas_node_sizing.admission_ceiling_mb, true) }}"
          - --defer-activation
          # A newly adopted host deliberately has no interactive operator MFA
          # session. The trusted join already stages its root-only database
          # credential, so acknowledge this bootstrap-only direct write
          # explicitly instead of silently falling back from the API path.
          - --reason
          - node_join_preregister
          - --break-glass-db
          - --yes
      register: faas_compute_node_preregister
      changed_when: true
      when:
        - (faas_join_rollout_phase | default('full')) != 'activate'
        - (faas_join_existing_compute_node.rc | default(3)) == 3

    # Changed runtime bases used to be built by faas-imaged after this play
    # drained the node. Extract the signed candidate and run its normal base
    # staging path while the serving release and vmmd are still available. A
    # new host receives a short-lived candidate vmmd override below; an
    # existing host keeps serving with its currently active release.
    - name: Create the release-bound runtime-base pre-stage directory
      ansible.builtin.file:
        path: "/opt/faas/prestage/{{ faas_join_release_git_sha }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract the signed candidate for runtime-base pre-staging
      ansible.builtin.unarchive:
        src: /var/lib/faas/bootstrap/release.tar.gz
        dest: "/opt/faas/prestage/{{ faas_join_release_git_sha }}"
        remote_src: true
        owner: root
        group: root

    - name: Inspect the active vmmd binary before runtime pre-stage
      ansible.builtin.stat:
        path: /opt/faas/current/bin/vmmd
        follow: true
      register: faas_join_active_vmmd

    # A fresh host has the daemon units installed by bootstrap.yml, but the
    # production TOML files are intentionally owned by the manifest renderer.
    # Render before starting the candidate vmmd so its TCP listener loads the
    # staged mTLS leaves instead of falling back to the defaults-only config.
    # Existing nodes keep their serving configuration untouched until the
    # normal post-drain release installation and render below.
    - name: Render fresh-host runtime configuration before pre-stage
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - manifest
          - render
          - --manifest-file
          - /etc/faas/manifest.yaml
          - --host
          - "{{ faas_join_inventory_name }}"
          - --pki-trust-only
      changed_when: true
      when: not faas_join_active_vmmd.stat.exists

    - name: Bootstrap fresh-host vmmd from the verified release candidate
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-vmmd.service.d/zz-bootstrap-release.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/opt/faas/prestage/{{ faas_join_release_git_sha }}/vmmd --config /etc/faas/vmmd.toml
      when: not faas_join_active_vmmd.stat.exists

    - name: Install the runtime-base pre-stage one-shot
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-imaged-prestage.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gregale release-bound runtime base pre-stage
          After=network.target faas-vmmd.service
          Requires=faas-vmmd.service

          [Service]
          Type=oneshot
          User=faas-imaged
          Group=faas
          ExecStart=/opt/faas/prestage/{{ faas_join_release_git_sha }}/imaged --config /etc/faas/imaged.toml
          # Keep the candidate one-shot on the same capability boundary as
          # the canonical imaged unit. imaged fail-closes at boot when its
          # bounding set still contains the vmmd-only CAP_SYS_ADMIN bit.
          CapabilityBoundingSet=cap_chown cap_dac_override cap_fowner cap_fsetid cap_kill cap_setgid cap_setuid cap_setpcap cap_net_bind_service cap_sys_chroot
          AmbientCapabilities=CAP_CHOWN CAP_DAC_OVERRIDE
          EnvironmentFile=-/etc/faas/compute-db.env
          EnvironmentFile=-/etc/faas/storage.env
          EnvironmentFile=-/etc/faas/imaged-storage.env
          EnvironmentFile=-/etc/faas/runtime-bases.env
          EnvironmentFile=-/etc/faas/otel.env
          Environment=FAAS_IMAGED_PRESTAGE_ONLY=1
          Environment=FAAS_IMAGED_ROLE=compute-only
          Environment=FAAS_NODE_NAME={{ faas_join_database_node }}
          Environment=FAAS_MANIFEST_PATH=/etc/faas/manifest.yaml
          Environment=FAAS_BUILDER_BASE_REF={{ faas_builder_base_ref | default(faas_join_builder_base_ref) }}
          Environment=FAAS_VMM_SOCK={{ faas_vmmd_target_url }}
          Environment=FAAS_VMM_TLS_CERT_PATH=/etc/faas/tls/imaged/vmmd-client.crt
          Environment=FAAS_VMM_TLS_KEY_PATH=/etc/faas/tls/imaged/vmmd-client.key
          Environment=FAAS_VMM_TLS_CA_PATH=/etc/faas/tls/ca/ca.crt
          Environment=GRYPE_DB_CACHE_DIR=/var/lib/faas/grype
          Environment=TMPDIR=/srv/fc/base
          Environment=FAAS_BASE_STAGING_ROOT=/dev/shm/faas-base-staging
          Environment=FAAS_BASE_EXTRACT_ROOT=/srv/fc/base-staging
          Environment=FAAS_BASE_TMP_ROOT=/srv/fc/base
          Environment=FAAS_HOST_AGE_IDENTITY_PATH=%d/faas_fleet_age_identity
          Environment=FAAS_GUEST_INIT=/opt/faas/prestage/{{ faas_join_release_git_sha }}/init
          Environment=FAAS_FUNCTION_RUNNER_NODE22=/opt/faas/prestage/{{ faas_join_release_git_sha }}/runners/node22/faas-runner
          Environment=FAAS_FUNCTION_RUNNER_NODE24=/opt/faas/prestage/{{ faas_join_release_git_sha }}/runners/node24/faas-runner
          Environment=FAAS_FUNCTION_RUNNER_PYTHON312=/opt/faas/prestage/{{ faas_join_release_git_sha }}/runners/python312/faas-runner
          Environment=FAAS_FUNCTION_RUNNER_PYTHON313=/opt/faas/prestage/{{ faas_join_release_git_sha }}/runners/python313/faas-runner
          Environment=FAAS_FUNCTION_RUNNER_GO124=/opt/faas/prestage/{{ faas_join_release_git_sha }}/runners/go124/faas-runner
          Environment=FAAS_FUNCTION_RUNNER_GO124_ALPINE=/opt/faas/prestage/{{ faas_join_release_git_sha }}/runners/go124-alpine/faas-runner
          LoadCredential=faas_fleet_age_identity:/etc/faas/secrets/fleet.age
          LoadCredential=faas_host_age_identity:/etc/faas/secrets/host.age
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          ReadOnlyPaths=/etc/faas /opt/faas/prestage/{{ faas_join_release_git_sha }}
          ReadWritePaths=/srv/fc/snap /srv/fc/base /srv/fc/base-staging /srv/fc/scans /srv/fc/sigs /var/log/faas /var/spool/faas /var/lib/faas/cache /var/lib/faas/grype /var/cache/faas/builds/.leases /dev/shm/faas-base-staging

    - name: Reload systemd for runtime-base pre-staging
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Pre-stage release-bound runtime bases before draining the node
      block:
        - name: Start the release-bound runtime-base pre-stage
          ansible.builtin.systemd:
            name: faas-imaged-prestage.service
            state: started
      always:
        # Existing nodes keep their serving vmmd. A fresh node used the
        # candidate solely to prepare immutable bases and stays unavailable
        # until the signed release and all readiness checks finish.
        - name: Stop the fresh-host bootstrap vmmd after runtime pre-stage
          ansible.builtin.systemd:
            name: faas-vmmd.service
            state: stopped
          when: not faas_join_active_vmmd.stat.exists

        - name: Remove the fresh-host vmmd release override
          ansible.builtin.file:
            path: /etc/systemd/system/faas-vmmd.service.d/zz-bootstrap-release.conf
            state: absent

        - name: Reload systemd after fresh-host vmmd bootstrap cleanup
          ansible.builtin.systemd:
            daemon_reload: true

    - name: Record completed non-disruptive rollout preparation
      ansible.builtin.copy:
        dest: /var/lib/faas/bootstrap/prepared-release.sha
        owner: root
        group: root
        mode: "0600"
        content: "{{ faas_join_release_git_sha }}\n"
      when: (faas_join_rollout_phase | default('full')) == 'prepare'

    - name: End the node play after non-disruptive rollout preparation
      ansible.builtin.meta: end_play
      when: (faas_join_rollout_phase | default('full')) == 'prepare'

    # --activate-prepared starts at this exact task. The release-bound marker
    # is written only after signature verification and runtime-base pre-stage
    # complete, so the serialized lane cannot drain a partially prepared node.
    - name: Verify the prepared rollout marker
      ansible.builtin.command:
        argv:
          - grep
          - -Fqx
          - "{{ faas_join_release_git_sha }}"
          - /var/lib/faas/bootstrap/prepared-release.sha
      changed_when: false
      when: (faas_join_rollout_phase | default('full')) == 'activate'

    # Existing nodes enter draining first: placement stops admitting new work,
    # while the forwarding bridge remains available to live instances until
    # the recovery controller migrates them. Maintenance plus zero live rows is
    # the deterministic cache/traffic barrier before listener shutdown. If
    # that barrier times out, no service or release has been touched yet, so
    # restore a node that entered the rollout active instead of silently
    # leaving healthy capacity excluded from new placement.
    - name: Delegate cgroup controllers to the per-plan tenant slices before draining
      # ADR-205: a per-VM cgroup only gets memory.max when its parent lists
      # `memory` in cgroup.subtree_control, and nothing enables it. systemd
      # will not: Delegate= is not honoured for .slice units, and systemd only
      # propagates a controller when a child *unit* needs it — the per-VM
      # scopes come from jailer. vmmd does it at runtime, but that does not
      # help here: draining a node requires migrating its instances, which
      # requires the OUTGOING node's vmmd to widen memory.max, and that vmmd
      # is still the pre-ADR-205 build until this very play replaces it.
      #
      # Without this the rollout deadlocks: the drain needs the new binary and
      # the new binary needs the drain. Repair the host first, then drain.
      #
      # Run it here, after the last daemon-reload in this play, because
      # systemd resets subtree_control on reload. One controller per write:
      # the kernel applies a multi-token body atomically, so an unsupported
      # token would reject the whole write.
      ansible.builtin.shell: |
        set -euo pipefail
        base=/sys/fs/cgroup/faas.slice/faas-tenant.slice
        for plan in free hobby pro scale; do
          dir="$base/faas-tenant-$plan.slice"
          [ -d "$dir" ] || continue
          available=$(cat "$dir/cgroup.controllers" 2>/dev/null || true)
          enabled=$(cat "$dir/cgroup.subtree_control" 2>/dev/null || true)
          for c in memory cpu pids; do
            case " $available " in *" $c "*) ;; *) continue ;; esac
            case " $enabled " in *" $c "*) continue ;; esac
            echo "+$c" > "$dir/cgroup.subtree_control"
          done
        done
      changed_when: false

    - name: Gracefully drain the existing node before release installation
      when: >-
        (faas_join_rollout_phase | default('full')) == 'activate' or
        (faas_join_existing_compute_node.rc | default(3)) == 0
      block:
        - name: Begin graceful drain of the existing node before release installation
          ansible.builtin.command:
            argv:
              - /usr/local/bin/gregalectl
              - compute-nodes
              - drain
              - --node
              - "{{ faas_join_database_node }}"
              - --reason
              - node_join_preregister
              - --break-glass-db
              - --yes
          register: faas_compute_node_drain
          changed_when: true

        - name: Wait for the existing node to reach an empty maintenance hold
          ansible.builtin.command:
            argv:
              - /usr/local/bin/gregalectl
              - compute-nodes
              - drain-status
              - --node
              - "{{ faas_join_database_node }}"
              - --break-glass-db
          register: faas_compute_node_drain_status
          changed_when: false
          retries: 48
          delay: 2
          until: faas_compute_node_drain_status.rc == 0
      rescue:
        - name: Restore an originally active node after graceful drain failure
          ansible.builtin.command:
            argv:
              - /usr/local/bin/gregalectl
              - compute-nodes
              - activate
              - --node
              - "{{ faas_join_database_node }}"
              - --reason
              - node_join_drain_rollback
              - --break-glass-db
              - --yes
          when: >-
            'lifecycle=active' in
            (faas_join_existing_compute_node.stdout_lines | default([]))
          changed_when: true

        - name: Abort after restoring the pre-rollout lifecycle
          ansible.builtin.fail:
            msg: >-
              graceful drain did not reach an empty maintenance hold; the
              existing node's pre-rollout active lifecycle was restored when
              applicable, and no service or release was replaced

    - name: Stop stale compute-only services before replacing the active release
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - faas-gatewayd-internal.service
        - faas-realtimed.service
        - faas-imaged.service
        - faas-builderd.service
        - faas-schedd.service
        - faas-vmmd.service

    - name: Install the verified release while keeping the row drained
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - release
          - install
          - --git-sha
          - "{{ faas_join_release_git_sha }}"
          - --tarball-path
          - /var/lib/faas/bootstrap/release.tar.gz
          - --node
          - "{{ faas_join_database_node }}"
          - --role
          - compute-only
          - --defer-activation
      register: faas_release_install
      changed_when: faas_release_install.rc == 0
      failed_when: >-
        faas_release_install.rc != 0 and
        'SBoM gate requires a prior baseline' not in
        ((faas_release_install.stdout | default('')) ~
         (faas_release_install.stderr | default('')))

    - name: Explicitly bootstrap the persistent SBoM baseline
      ansible.builtin.shell: |
        set -euo pipefail
        current_release="$(readlink -f /opt/faas/current 2>/dev/null || true)"
        if [[ -n "$current_release" && "$current_release" != "/opt/faas/releases/{{ faas_join_release_git_sha }}" && -s "$current_release/release.sbom.json" ]]; then
          /usr/local/bin/gregalectl release kgv rotate \
            --git-sha "$(basename "$current_release")"
        else
          # A brand-new host has no prior accepted state. Trust the signed,
          # verified candidate once so the deferred install can proceed; the
          # controller keeps the node drained and accepts it again only after
          # the full readiness gate succeeds.
          /usr/local/bin/gregalectl release kgv rotate \
            --git-sha "{{ faas_join_release_git_sha }}"
        fi
      args:
        executable: /bin/bash
      when: >-
        faas_release_install.rc != 0 and
        'SBoM gate requires a prior baseline' in
        ((faas_release_install.stdout | default('')) ~
         (faas_release_install.stderr | default('')))
      changed_when: true

    # The first install already verified the Cosign bundle and extracted the
    # release before the missing-baseline gate stopped activation. Reuse that
    # staged release here so the retry runs the catalog and SBoM gates without
    # repeating tarball verification and extraction.
    - name: Retry staged release installation after SBoM baseline initialization
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - release
          - install
          - --git-sha
          - "{{ faas_join_release_git_sha }}"
          - --node
          - "{{ faas_join_database_node }}"
          - --role
          - compute-only
          - --defer-activation
      when: >-
        faas_release_install.rc != 0 and
        'SBoM gate requires a prior baseline' in
        ((faas_release_install.stdout | default('')) ~
         (faas_release_install.stderr | default('')))
      changed_when: true

    - name: Verify the requested release is the active on-host release
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - /opt/faas/current
      register: faas_active_release
      changed_when: false
      failed_when: >-
        faas_active_release.rc != 0 or
        (faas_active_release.stdout | trim) !=
        ('/opt/faas/releases/' ~ faas_join_release_git_sha)

    - name: Remove superseded runtime-base pre-stage trees
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail;
          find /opt/faas/prestage -mindepth 1 -maxdepth 1 -type d
          ! -name '{{ faas_join_release_git_sha }}' -print -exec rm -rf -- {} +
        executable: /bin/bash
      register: faas_join_prestage_cleanup
      changed_when: (faas_join_prestage_cleanup.stdout | trim) != ''

    - name: Render the manifest for this exact host
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - manifest
          - render
          - --manifest-file
          - /etc/faas/manifest.yaml
          - --host
          - "{{ faas_join_inventory_name }}"
          - --pki-trust-only
      changed_when: true

    # The release-only fast path intentionally skips role templates. Keep the
    # tenant-bridge service proxy converged anyway: guest DNS resolves through
    # this listener, and an omitted key leaves every microVM without egress
    # name resolution even though gatewayd itself is healthy.
    - name: Converge the guest service proxy listener on managed compute nodes
      ansible.builtin.lineinfile:
        path: /etc/faas/gatewayd-internal.toml
        regexp: '^service_proxy_listen\s*='
        insertafter: '^apps_domain\s*='
        line: >-
          service_proxy_listen = "{{ faas_gatewayd_service_proxy_listen |
          default('10.100.0.1:10080', true) }}"
        owner: root
        group: faas
        mode: "0640"

    - name: Remove the legacy vmmd schedd target override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-vmmd.service.d/99-schedd-target.conf
        state: absent

    - name: Remove emergency gateway release override before service activation
      ansible.builtin.file:
        path: /etc/systemd/system/faas-gatewayd-internal.service.d/zz-emergency-release.conf
        state: absent

    - name: Stage the reusable box-age identity when supplied
      ansible.builtin.copy:
        src: "{{ faas_join_box_age_key_source }}"
        dest: /etc/faas/secrets/storage-box/box-age-key
        owner: root
        group: root
        mode: "0440"
      no_log: true
      when: (faas_join_box_age_key_source | default('') | trim) != ''

    - name: Stage the encrypted rclone envelope when supplied
      ansible.builtin.copy:
        src: "{{ faas_join_rclone_envelope_source }}"
        dest: /var/lib/faas/bootstrap/rclone.conf.age
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: (faas_join_rclone_envelope_source | default('') | trim) != ''

    - name: Stage the encrypted archive credentials envelope when supplied
      ansible.builtin.copy:
        src: "{{ faas_join_archive_envelope_source }}"
        dest: /var/lib/faas/bootstrap/archive-creds.json.age
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: (faas_join_archive_envelope_source | default('') | trim) != ''

    - name: Initialize host-local runtime identity and backup stubs
      ansible.builtin.command:
        argv:
          - /var/lib/faas/bootstrap/gregalectl
          - secrets
          - init
          - --preserve-existing
          - --host
          - "{{ faas_join_database_node }}"
      register: faas_secrets_init
      changed_when: true

    - name: Ensure the fleet-seal node-exporter metric directory exists
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: node_exporter
        group: node_exporter
        mode: "0755"

    - name: Prove fleet customer-secret and shared-kid access before service activation
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - fleet-seal
          - verify
          - --fleet-key
          - /etc/faas/secrets/fleet.age
          - --host-key
          - /etc/faas/secrets/host.age
          - --db-env
          - /etc/faas/compute-db.env
          - --metrics-file
          - /var/lib/node_exporter/textfile_collector/faas_fleet_seal.prom
          - --json
      register: faas_fleet_seal_verify
      changed_when: false
      no_log: true

    - name: Unseal the reusable rclone configuration
      changed_when: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - backup
          - unseal-rclone
          - --in
          - /var/lib/faas/bootstrap/rclone.conf.age
          - --force
      no_log: true
      when: (faas_join_rclone_envelope_source | default('') | trim) != ''

    - name: Unseal the reusable archive credentials
      changed_when: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - backup
          - unseal-archive-creds
          - --in
          - /var/lib/faas/bootstrap/archive-creds.json.age
          - --force
      no_log: true
      when: (faas_join_archive_envelope_source | default('') | trim) != ''

    - name: Remove encrypted backup envelopes after unseal
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/faas/bootstrap/rclone.conf.age
        - /var/lib/faas/bootstrap/archive-creds.json.age
      when:
        - (faas_join_rclone_envelope_source | default('') | trim) != '' or
          (faas_join_archive_envelope_source | default('') | trim) != ''

    - name: Run the node-scoped doctor before starting services
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - doctor
          - --node
          - "{{ faas_join_database_node }}"
          - --fail-on
          - >-
            {{ 'warn' if
               ((faas_join_rclone_envelope_source | default('') | trim) != '' or
                (faas_join_archive_envelope_source | default('') | trim) != '')
               else 'error' }}
          - --json
      register: faas_join_doctor
      changed_when: false
      failed_when: faas_join_doctor.rc != 0
      # This is the acceptance gate for the adopted host. It deliberately
      # runs after identity/release rendering and before any service can
      # become schedulable, so a missing filesystem, mandatory secret,
      # certificate, or release membership cannot hide behind systemd=active.
      # Backup envelopes are optional join inputs: when the operator has not
      # supplied them yet, the doctor still reports the placeholder warnings,
      # but they do not block compute-node activation. Supplying either
      # envelope opts into the strict warning gate (the CLI validation also
      # requires the pair and their box-age key).

    - name: Reload systemd after release/config publication
      ansible.builtin.systemd:
        daemon_reload: true

    # `gregalectl release install` flips /opt/faas/current, but systemd keeps
    # an already-running process on the old executable until it is restarted.
    # A join is an explicit adopt/roll operation, so restart every compute
    # daemon after the signed release and manifest have been published. This
    # also lets imaged reconcile and stage a changed builder-base digest.
    - name: Enable and restart the compute-only daemon set
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - faas-vmmd.service
        - faas-schedd.service
        - faas-realtimed.service
        - faas-gatewayd-internal.service
        - faas-builderd.service
        - faas-imaged.service

    - name: Wait for vmmd's local socket on single-box targets
      ansible.builtin.wait_for:
        path: /run/faas/vmmd.sock
        timeout: 60
      when: faas_vmmd_target_url is not match('^tcp://')

    - name: Wait for vmmd's TCP listener on split-box targets
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 50051
        timeout: 60
      when: faas_vmmd_target_url is match('^tcp://')

    - name: Wait for the managed realtime socket
      ansible.builtin.wait_for:
        path: /run/faas/realtimed.sock
        timeout: 60

    - name: Wait for the internal gateway listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 60

    - name: Wait for the guest service proxy listener
      ansible.builtin.wait_for:
        host: >-
          {{ (faas_gatewayd_service_proxy_listen |
          default('10.100.0.1:10080', true)).split(':')[0] }}
        port: 10080
        timeout: 60

    - name: Wait for the guest DNS TCP listener
      ansible.builtin.wait_for:
        host: >-
          {{ (faas_gatewayd_service_proxy_listen |
          default('10.100.0.1:10080', true)).split(':')[0] }}
        port: 53
        timeout: 60

    - name: Require every compute-only service to be active  # noqa: command-instead-of-module (read-only query / no module equivalent)
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      loop:
        - faas-vmmd.service
        - faas-schedd.service
        - faas-realtimed.service
        - faas-gatewayd-internal.service
        - faas-builderd.service
        - faas-imaged.service

    - name: Require the GCP off-host telemetry collector on Google Compute Engine  # noqa: command-instead-of-module (read-only readiness gate)
      ansible.builtin.command: systemctl is-active google-cloud-ops-agent.service
      changed_when: false
      when: >-
        (ansible_system_vendor | default('')) == 'Google' or
        (ansible_product_name | default('')) == 'Google Compute Engine'

    - name: Prove the effective rsyslog rotation policy remains usable  # noqa: command-instead-of-module (logrotate owns policy validation)
      ansible.builtin.command:
        argv:
          - logrotate
          - --debug
          - /etc/logrotate.d/rsyslog
      register: faas_join_rsyslog_debug
      changed_when: false
      failed_when: >-
        faas_join_rsyslog_debug.rc != 0 or
        'insecure permissions' in
        ((faas_join_rsyslog_debug.stdout | default('')) ~
         (faas_join_rsyslog_debug.stderr | default('')))

    - name: Reject a failed rsyslog rotation unit  # noqa: command-instead-of-shell (compound systemd assertion)
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl cat faas-rsyslog-rotate.service >/dev/null
        ! systemctl is-failed --quiet faas-rsyslog-rotate.service
      args:
        executable: /bin/bash
      changed_when: false

    # `systemctl is-active` only proves that a process is alive. A restart
    # failure or an out-of-band service override could leave an older daemon
    # running after /opt/faas/current moved. Check the process executable
    # against both the requested release directory and the current symlink so
    # activation cannot promote a host that is serving an older release.
    - name: Require active compute daemons to execute the installed release  # noqa command-instead-of-shell — process identity requires shell variables
      ansible.builtin.shell: |
        set -euo pipefail
        pid="$(systemctl show -p MainPID --value "faas-{{ item }}.service")"
        test "$pid" -gt 1
        expected="/opt/faas/releases/{{ faas_join_release_git_sha }}/bin/{{ item }}"
        current="$(readlink -f "/opt/faas/current/bin/{{ item }}")"
        running="$(readlink -f "/proc/${pid}/exe")"
        if [[ "$current" != "$expected" || "$running" != "$current" ]]; then
          echo "expected=$expected current=$current running=$running" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
      loop:
        - vmmd
        - schedd
        - gatewayd-internal
        - builderd
        - imaged

    - name: Require dependency-aware readiness after release installation
      ansible.builtin.include_role:
        name: fleet_verify
      vars:
        faas_verify_strict: true
        # The node-scoped doctor already ran against the installed release
        # before service activation. This pass proves live dependencies.
        faas_verify_run_doctor: false

    - name: Report local node readiness to the controller
      ansible.builtin.debug:
        msg: >-
          {{ faas_join_database_node }} is locally ready after signed release,
          trust-only manifest render, service activation, and readiness gates;
          the controller must verify the control-plane row before activation.
