---
# Provider-neutral adoption pipeline for an already-created compute host.
#
# The cloud/provider boundary ends at the Ansible connection variables. The
# playbook owns the rest of the lifecycle: stage trust material, converge the
# production host role, install the verified release, render the manifest,
# initialize host-local identity, start only the compute services, and wait
# for local readiness. The controller performs the final control-plane
# verification and activation after this play returns.
#
# The caller supplies local paths through the faas_join_* variables. They are
# controller-side inputs; secret contents never travel through --extra-vars.

- name: Prepare the adopted compute node
  hosts: compute_nodes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Refuse to join a host other than the requested manifest node
      ansible.builtin.assert:
        that:
          - inventory_hostname == faas_join_inventory_name
          - faas_box_role == 'compute-only'
        fail_msg: >-
          node_join is limited to the manifest compute-only host. Requested
          {{ faas_join_inventory_name }}, got {{ inventory_hostname }} with
          role {{ faas_box_role | default('unset') }}.

    - name: Create bootstrap directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/faas, mode: "0750" }
        - { path: /etc/faas/secrets, mode: "0700" }
        - { path: /etc/faas/secrets/vmmd, mode: "0700" }
        - { path: /etc/faas/secrets/storage-box, mode: "0700" }
        - { path: /etc/faas/tls, mode: "0755" }
        - { path: /usr/local/bin, mode: "0755" }
        - { path: /var/lib/faas/bootstrap, mode: "0700" }

    # Keep the Ansible boundary fail-closed as well as the gregalectl
    # boundary. This playbook can be invoked directly by an operator, so a
    # caller must not be able to bypass the multi-box OCI contract and make
    # snapshots host-local by accident. The lookup runs on the controller;
    # no secret-bearing value is printed or copied into Ansible output.
    - name: Validate shared OCI storage contract before staging it
      ansible.builtin.assert:
        that:
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_BACKEND=oci\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_OCI_REGISTRY=\S+$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=none\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_REQUIRE_SHARED_ARTIFACTS=1\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_CACHE_SERVE_STALE=0\s*$')) is not none
          - >-
            (lookup('ansible.builtin.file', faas_join_storage_env_source) |
            regex_search('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=.*snap/')) is none
        fail_msg: >-
          storage.env must set FAAS_STORAGE_BACKEND=oci and
          FAAS_OCI_REGISTRY, set FAAS_STORAGE_LOCAL_PREFIXES=none,
          FAAS_REQUIRE_SHARED_ARTIFACTS=1, and set
          FAAS_STORAGE_CACHE_SERVE_STALE=0. It must not route snap/ through
          FAAS_STORAGE_LOCAL_PREFIXES for a multi-box compute node.
      no_log: true

    - name: Create the shared daemon group before staging group-readable keys
      ansible.builtin.group:
        name: faas
        state: present
        system: true

    - name: Allow shared daemons to traverse the shared secret directory
      ansible.builtin.file:
        path: /etc/faas/secrets
        state: directory
        owner: root
        group: faas
        mode: "0750"

    - name: Stage the compute database environment
      ansible.builtin.copy:
        src: "{{ faas_join_compute_db_env_source }}"
        dest: /etc/faas/compute-db.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Stage the shared OCI storage environment
      ansible.builtin.copy:
        src: "{{ faas_join_storage_env_source }}"
        dest: /etc/faas/storage.env
        owner: root
        group: faas
        mode: "0440"
      no_log: true

    - name: Stage the release-bound runtime base contract
      ansible.builtin.copy:
        src: "{{ faas_join_runtime_bases_env_source }}"
        dest: /etc/faas/runtime-bases.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # These files were used by the pre-release/live-e2e rollout path. The
    # signed runtime-bases.env and storage.env are now the only sources of
    # truth; leaving the legacy files in place would clear or override the
    # release EnvironmentFiles, make builderd and imaged resolve different
    # bases, and retain obsolete registry credentials on the host.
    - name: Remove legacy imaged runtime EnvironmentFile override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-imaged.service.d/99-release-runtime.conf
        state: absent

    - name: Remove legacy per-runtime Environment override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-imaged.service.d/zz-faas-function-runners.conf
        state: absent

    - name: Remove legacy builderd OCI environment override
      ansible.builtin.file:
        path: /etc/systemd/system/faas-builderd.service.d/99-codex-oci-source.conf
        state: absent

    - name: Remove legacy live-E2E environment file
      ansible.builtin.file:
        path: /etc/faas/oci-e2e.env
        state: absent

    - name: Stage the compute trust bundle (the source never includes the CA private key)
      ansible.builtin.copy:
        src: "{{ faas_join_pki_source }}/"
        dest: /etc/faas/tls/
        owner: root
        group: root
        mode: preserve
      no_log: true

    - name: Stage the image-signing private key
      ansible.builtin.copy:
        src: "{{ faas_join_sign_key_source }}"
        dest: /etc/faas/secrets/sign.key
        owner: root
        group: faas
        mode: "0440"
      no_log: true

    - name: Stage the image-signing public key
      ansible.builtin.copy:
        src: "{{ faas_join_verify_key_source }}"
        dest: /etc/faas/secrets/sign-pub.pem
        owner: root
        group: root
        mode: "0444"
      no_log: true

    - name: Stage the per-node capacity signing key
      ansible.builtin.copy:
        src: "{{ faas_join_node_key_source }}"
        dest: /etc/faas/secrets/vmmd/node.key
        owner: root
        group: root
        mode: "0400"
      no_log: true

    - name: Stage the per-node capacity public key
      ansible.builtin.copy:
        src: "{{ faas_join_node_pub_source }}"
        dest: /etc/faas/secrets/vmmd/node.pub
        owner: root
        group: root
        mode: "0444"
      no_log: true

    - name: Stage the manifest consumed by the on-host renderer
      ansible.builtin.copy:
        src: "{{ faas_join_manifest_source }}"
        dest: /etc/faas/manifest.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Stage the bootstrap operator binary
      ansible.builtin.copy:
        src: "{{ faas_join_bootstrap_binary_source }}"
        dest: /usr/local/bin/gregalectl
        owner: root
        group: root
        mode: "0755"

    - name: Stage the join bootstrap operator binary
      ansible.builtin.copy:
        src: "{{ faas_join_bootstrap_binary_source }}"
        dest: /var/lib/faas/bootstrap/gregalectl
        owner: root
        group: root
        mode: "0755"

    - name: Stage the release cosign verifier
      ansible.builtin.copy:
        src: "{{ faas_join_cosign_binary_source }}"
        dest: /usr/local/bin/cosign
        owner: root
        group: root
        mode: "0755"

    - name: Stage the signed release bundle
      ansible.builtin.copy:
        src: "{{ faas_join_release_tarball_source }}"
        dest: /var/lib/faas/bootstrap/release.tar.gz
        owner: root
        group: root
        mode: "0644"

    - name: Stage the release-pinned Firecracker guest kernel
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail;
          umask 077;
          tmp=$(mktemp /var/lib/faas/bootstrap/vmlinux.XXXXXX);
          trap 'rm -f "$tmp"' EXIT;
          tar --extract --gzip --file /var/lib/faas/bootstrap/release.tar.gz
          --to-stdout vmlinux > "$tmp";
          test -s "$tmp";
          install -o root -g root -m 0644 "$tmp"
          /var/lib/faas/bootstrap/vmlinux;
          trap - EXIT
        executable: /bin/bash
      changed_when: true

    - name: Stage the release signature bundle
      ansible.builtin.copy:
        src: "{{ faas_join_release_signature_source }}"
        dest: /var/lib/faas/bootstrap/release.cosign.bundle
        owner: root
        group: root
        mode: "0644"

    - name: Stage the release SBoM
      ansible.builtin.copy:
        src: "{{ faas_join_release_sbom_source }}"
        dest: /var/lib/faas/bootstrap/release.sbom.json
        owner: root
        group: root
        mode: "0644"

    # The signed release tarball carries vmlinux, but production split-box
    # storage is remote-only. vmmd therefore resolves the kernel through the
    # shared OCI backend at wake time. Verify and prewarm that exact key before
    # bootstrap handlers or service restarts can make this node schedulable.
    - name: Verify the release-pinned kernel is present in shared storage
      ansible.builtin.command:
        argv:
          - /var/lib/faas/bootstrap/gregalectl
          - artifact
          - verify
          - --env-file
          - /etc/faas/storage.env
          - --manifest-file
          - /etc/faas/manifest.yaml
          - --no-cache
      register: faas_release_kernel_verify
      changed_when: false

    - name: Prewarm the verified release-pinned kernel in the node cache
      ansible.builtin.command:
        argv:
          - /var/lib/faas/bootstrap/gregalectl
          - artifact
          - verify
          - --env-file
          - /etc/faas/storage.env
          - --manifest-file
          - /etc/faas/manifest.yaml
          # The node may already cache the previous release under the same
          # logical key. Refresh forces this integrity check to read the
          # shared store and replace that entry before vmmd can be promoted.
          - --refresh
      register: faas_release_kernel_prewarm
      changed_when: false

- name: Converge the adopted node with the production bootstrap
  import_playbook: bootstrap.yml

- name: Verify the signed release before promoting its operator CLI
  hosts: compute_nodes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Verify the release tarball signature
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cosign
          - verify-blob
          - --certificate-identity-regexp
          - '^https://github\.com/poyrazK/faas/\.github/workflows/release\.yml@refs/tags/.+$'
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --bundle
          - /var/lib/faas/bootstrap/release.cosign.bundle
          - /var/lib/faas/bootstrap/release.tar.gz
      changed_when: false

    - name: Promote the catalog-aware gregalectl from the verified release
      ansible.builtin.shell:
        cmd: >-
          set -eu -o pipefail;
          umask 077;
          tmp=$(mktemp /var/lib/faas/bootstrap/gregalectl.XXXXXX);
          trap 'rm -f "$tmp"' EXIT;
          tar --extract --gzip --file /var/lib/faas/bootstrap/release.tar.gz
          --to-stdout gregalectl > "$tmp";
          test -s "$tmp";
          chmod 0755 "$tmp";
          mv -f "$tmp" /usr/local/bin/gregalectl;
          trap - EXIT
        executable: /bin/bash
      changed_when: true

- name: Install, render, start, and activate the adopted node
  hosts: compute_nodes
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Detect the legacy imaged environment file
      ansible.builtin.stat:
        path: /etc/faas/oci-e2e.env
      register: faas_oci_e2e_env

    - name: Remove the legacy builder-base override before applying the release pin
      ansible.builtin.lineinfile:
        path: /etc/faas/oci-e2e.env
        regexp: '^FAAS_BUILDER_BASE_REF='
        state: absent
      when: faas_oci_e2e_env.stat.exists

    - name: Install the manifest and builder-base identity for imaged
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-imaged.service.d/zz-faas-manifest-base.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment=FAAS_MANIFEST_PATH=/etc/faas/manifest.yaml
          Environment=FAAS_BUILDER_BASE_REF={{ faas_builder_base_ref | default(faas_join_builder_base_ref) }}

    - name: Pin imaged guest-init to the active release
      ansible.builtin.copy:
        dest: /etc/systemd/system/faas-imaged.service.d/zz-faas-guest-init.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          # Runtime bases embed guest/init as PID 1. Do not allow a legacy
          # /usr/local/bin/faas-guest-init override to survive node adoption.
          Environment=FAAS_GUEST_INIT=/opt/faas/current/bin/init

    - name: Pre-register the adopted node as drained before release installation
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - compute-nodes
          - add
          - --name
          - "{{ faas_join_database_node }}"
          - --target-url
          - "{{ faas_vmmd_target_url }}"
          - --gateway-target-url
          - "{{ faas_gateway_target_url | default('tcp://' ~ ansible_host ~ ':8080', true) }}"
          - --vpcpus
          - "{{ ansible_processor_vcpus }}"
          - --mem-mb
          - "{{ ansible_memtotal_mb }}"
          - --max-concurrency
          - "{{ faas_join_max_concurrency | default((ansible_processor_vcpus | int) * 50, true) }}"
          - --admission-ceiling-mb
          - "{{ faas_join_admission_ceiling_mb | default(((ansible_memtotal_mb | int) * 85 / 100) | int, true) }}"
          - --defer-activation
      register: faas_compute_node_preregister
      changed_when: true

    - name: Stop stale compute-only services before replacing the active release
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - faas-vmmd.service
        - faas-gatewayd-internal.service
        - faas-builderd.service
        - faas-imaged.service

    - name: Install the verified release while keeping the row drained
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - release
          - install
          - --git-sha
          - "{{ faas_join_release_git_sha }}"
          - --tarball-path
          - /var/lib/faas/bootstrap/release.tar.gz
          - --node
          - "{{ faas_join_database_node }}"
          - --role
          - compute-only
          - --defer-activation
      register: faas_release_install
      changed_when: faas_release_install.rc == 0
      failed_when: >-
        faas_release_install.rc != 0 and
        'SBoM gate requires a prior baseline' not in
        ((faas_release_install.stdout | default('')) ~
         (faas_release_install.stderr | default('')))

    - name: Initialize the per-release SBoM baseline on a new node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - release
          - kgv
          - rotate
          - --git-sha
          - "{{ faas_join_release_git_sha }}"
          - --from-zero
      when: >-
        faas_release_install.rc != 0 and
        'SBoM gate requires a prior baseline' in
        ((faas_release_install.stdout | default('')) ~
         (faas_release_install.stderr | default('')))
      changed_when: true

    - name: Retry release installation after SBoM baseline initialization
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - release
          - install
          - --git-sha
          - "{{ faas_join_release_git_sha }}"
          - --tarball-path
          - /var/lib/faas/bootstrap/release.tar.gz
          - --node
          - "{{ faas_join_database_node }}"
          - --role
          - compute-only
          - --defer-activation
      when: >-
        faas_release_install.rc != 0 and
        'SBoM gate requires a prior baseline' in
        ((faas_release_install.stdout | default('')) ~
         (faas_release_install.stderr | default('')))
      changed_when: true

    - name: Verify the requested release is the active on-host release
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - /opt/faas/current
      register: faas_active_release
      changed_when: false
      failed_when: >-
        faas_active_release.rc != 0 or
        (faas_active_release.stdout | trim) !=
        ('/opt/faas/releases/' ~ faas_join_release_git_sha)

    - name: Render the manifest for this exact host
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - manifest
          - render
          - --manifest-file
          - /etc/faas/manifest.yaml
          - --host
          - "{{ faas_join_inventory_name }}"
          - --pki-trust-only
      changed_when: true

    - name: Stage the reusable box-age identity when supplied
      ansible.builtin.copy:
        src: "{{ faas_join_box_age_key_source }}"
        dest: /etc/faas/secrets/storage-box/box-age-key
        owner: root
        group: root
        mode: "0440"
      no_log: true
      when: (faas_join_box_age_key_source | default('') | trim) != ''

    - name: Stage the encrypted rclone envelope when supplied
      ansible.builtin.copy:
        src: "{{ faas_join_rclone_envelope_source }}"
        dest: /var/lib/faas/bootstrap/rclone.conf.age
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: (faas_join_rclone_envelope_source | default('') | trim) != ''

    - name: Stage the encrypted archive credentials envelope when supplied
      ansible.builtin.copy:
        src: "{{ faas_join_archive_envelope_source }}"
        dest: /var/lib/faas/bootstrap/archive-creds.json.age
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: (faas_join_archive_envelope_source | default('') | trim) != ''

    - name: Initialize host-local runtime identity and backup stubs
      ansible.builtin.command:
        argv:
          - /var/lib/faas/bootstrap/gregalectl
          - secrets
          - init
          - --preserve-existing
          - --host
          - "{{ faas_join_database_node }}"
      register: faas_secrets_init
      changed_when: true

    - name: Unseal the reusable rclone configuration
      changed_when: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - backup
          - unseal-rclone
          - --in
          - /var/lib/faas/bootstrap/rclone.conf.age
          - --force
      no_log: true
      when: (faas_join_rclone_envelope_source | default('') | trim) != ''

    - name: Unseal the reusable archive credentials
      changed_when: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - backup
          - unseal-archive-creds
          - --in
          - /var/lib/faas/bootstrap/archive-creds.json.age
          - --force
      no_log: true
      when: (faas_join_archive_envelope_source | default('') | trim) != ''

    - name: Remove encrypted backup envelopes after unseal
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/faas/bootstrap/rclone.conf.age
        - /var/lib/faas/bootstrap/archive-creds.json.age
      when:
        - (faas_join_rclone_envelope_source | default('') | trim) != '' or
          (faas_join_archive_envelope_source | default('') | trim) != ''

    - name: Run the node-scoped doctor before starting services
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gregalectl
          - doctor
          - --node
          - "{{ faas_join_database_node }}"
          - --fail-on
          - >-
            {{ 'warn' if
               ((faas_join_rclone_envelope_source | default('') | trim) != '' or
                (faas_join_archive_envelope_source | default('') | trim) != '')
               else 'error' }}
          - --json
      register: faas_join_doctor
      changed_when: false
      failed_when: faas_join_doctor.rc != 0
      # This is the acceptance gate for the adopted host. It deliberately
      # runs after identity/release rendering and before any service can
      # become schedulable, so a missing filesystem, mandatory secret,
      # certificate, or release membership cannot hide behind systemd=active.
      # Backup envelopes are optional join inputs: when the operator has not
      # supplied them yet, the doctor still reports the placeholder warnings,
      # but they do not block compute-node activation. Supplying either
      # envelope opts into the strict warning gate (the CLI validation also
      # requires the pair and their box-age key).

    - name: Reload systemd after release/config publication
      ansible.builtin.systemd:
        daemon_reload: true

    # `gregalectl release install` flips /opt/faas/current, but systemd keeps
    # an already-running process on the old executable until it is restarted.
    # A join is an explicit adopt/roll operation, so restart every compute
    # daemon after the signed release and manifest have been published. This
    # also lets imaged reconcile and stage a changed builder-base digest.
    - name: Enable and restart the compute-only daemon set
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - faas-vmmd.service
        - faas-gatewayd-internal.service
        - faas-builderd.service
        - faas-imaged.service

    - name: Wait for vmmd's local socket on single-box targets
      ansible.builtin.wait_for:
        path: /run/faas/vmmd.sock
        timeout: 60
      when: faas_vmmd_target_url is not match('^tcp://')

    - name: Wait for vmmd's TCP listener on split-box targets
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 50051
        timeout: 60
      when: faas_vmmd_target_url is match('^tcp://')

    - name: Wait for the internal gateway listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 60

    - name: Require every compute-only service to be active  # noqa: command-instead-of-module (read-only query / no module equivalent)
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      loop:
        - faas-vmmd.service
        - faas-gatewayd-internal.service
        - faas-builderd.service
        - faas-imaged.service

    # `systemctl is-active` only proves that a process is alive. A restart
    # failure or an out-of-band service override could leave an older daemon
    # running after /opt/faas/current moved. Check the process executable
    # against both the requested release directory and the current symlink so
    # activation cannot promote a host that is serving an older release.
    - name: Require active compute daemons to execute the installed release  # noqa command-instead-of-shell — process identity requires shell variables
      ansible.builtin.shell: |
        set -euo pipefail
        pid="$(systemctl show -p MainPID --value "faas-{{ item }}.service")"
        test "$pid" -gt 1
        expected="/opt/faas/releases/{{ faas_join_release_git_sha }}/bin/{{ item }}"
        current="$(readlink -f "/opt/faas/current/bin/{{ item }}")"
        running="$(readlink -f "/proc/${pid}/exe")"
        if [[ "$current" != "$expected" || "$running" != "$current" ]]; then
          echo "expected=$expected current=$current running=$running" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
      loop:
        - vmmd
        - gatewayd-internal
        - builderd
        - imaged

    - name: Report local node readiness to the controller
      ansible.builtin.debug:
        msg: >-
          {{ faas_join_database_node }} is locally ready after signed release,
          trust-only manifest render, service activation, and readiness gates;
          the controller must verify the control-plane row before activation.
