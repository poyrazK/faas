# Gate-B cross-box mTLS hardening (issue #297) — per-box enablement
# playbook. Two plays, one per host group, dispatching to a role
# subset:
#
#   1. [control_plane] — fsn-1: shared preconditions + control-plane-only
#      roles (postgres, postgres_backup, control_plane_service,
#      gatewayd_public_service, githubd_service, otlp_exporter,
#      log_archive).
#   2. [compute_nodes] — fsn-2: shared preconditions + compute-only
#      roles (vmmd_service, gatewayd_internal_service + realtimed,
#      compute_only_service, otlp_exporter, log_archive).
# Per-box role isolation is enforced at two layers:
#   - This playbook only applies the role subset each box needs.
#   - Each daemon's role gate (pkg/role, PR-1) refuses to start under
#     the wrong FAAS_<DAEMON>_ROLE — the back-stop for any operator
#     who hand-runs a control-plane binary on the compute-only box.
#
# Each play below keeps the same `serial: 1` + `max_fail_percentage: 0`
# shape — a half-bootstrapped box is worse than a known-bad one.
#
# Per-box daemons:
#   fsn-1 (control-plane): apid, schedd, meterd, gatewayd-public, githubd
#   fsn-2 (compute-only):  vmmd, schedd, realtimed, gatewayd-internal, builderd, imaged
#
# The vars_file is loaded only on the control-plane host; the
# off_host_backup_* vars are read from /etc/faas/sealed.env at
# ansible-run time and are not box-shape-conditional themselves.

# Resolve the provider's private transport address once for every host before
# either role-specific play starts. The overlay role then uses these facts to
# render the same private endpoint map on every box. Providers with a public
# default route can set `faas_private_address` in generated inventory; the
# manifest and daemon configuration remain hostname-only.
- name: Discover provider-neutral private transport addresses
  hosts: control_plane:compute_nodes
  gather_facts: false
  become: false
  pre_tasks:
    - name: End managed-host bootstrap discovery on the release-only fast path
      ansible.builtin.meta: end_host
      when: faas_join_bootstrap_contract_current | default(false) | bool

    - name: Gather facts for hosts requiring bootstrap convergence
      ansible.builtin.setup:
  tasks:
    - name: Require a usable private transport address
      ansible.builtin.assert:
        that:
          - (faas_private_address | default(ansible_facts.default_ipv4.address, true) | default('')) | length > 0
        fail_msg: >-
          No private transport address was discovered for {{ inventory_hostname }}.
          Set faas_private_address in the provider inventory or ensure the
          host has a default IPv4 address.
      tags: [private-endpoints]

    - name: Publish private transport address to later plays
      ansible.builtin.set_fact:
        faas_private_dns_address: "{{ faas_private_address | default(ansible_facts.default_ipv4.address, true) }}"
      tags: [private-endpoints]

- name: Bootstrap a Gate-B control-plane node (fsn-1)
  hosts: control_plane
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0

  vars_files:
    - group_vars/control_plane/off_host_backup.yml

  pre_tasks:
    - name: End managed control-plane bootstrap on the release-only fast path
      ansible.builtin.meta: end_host
      when: faas_join_bootstrap_contract_current | default(false) | bool

    - name: Gather facts for control-plane bootstrap convergence
      ansible.builtin.setup:

  roles:
    # Shared preconditions (every box):
    - role: cgroups_v2
      when: faas_cp_converge_roles | default(none) is none or 'cgroups_v2' in faas_cp_converge_roles
    - role: grub
      when: faas_cp_converge_roles | default(none) is none or 'grub' in faas_cp_converge_roles
    # ADR-143: spec §11 OS posture (sshd, fail2ban, security updates,
    # auditd, kernel sysctls). Runs right after grub so a lockout guard
    # failure stops the play before anything else is touched.
    - role: host_hardening
      when: faas_cp_converge_roles | default(none) is none or 'host_hardening' in faas_cp_converge_roles
    - role: storage
      tags: [storage]
      when: faas_cp_converge_roles | default(none) is none or 'storage' in faas_cp_converge_roles
    - role: lvm
      when: faas_cp_converge_roles | default(none) is none or 'lvm' in faas_cp_converge_roles
    - role: xfs
      when: faas_cp_converge_roles | default(none) is none or 'xfs' in faas_cp_converge_roles
    - role: firecracker
      when: faas_cp_converge_roles | default(none) is none or 'firecracker' in faas_cp_converge_roles
    - role: supply_chain_scanners
      when: faas_cp_converge_roles | default(none) is none or 'supply_chain_scanners' in faas_cp_converge_roles
    - role: systemd_slices
      when: faas_cp_converge_roles | default(none) is none or 'systemd_slices' in faas_cp_converge_roles
    # ADR-906 decision 6: memory-only compressed swap for frozen VMs; a no-op
    # unless faas_zswap_enabled is set for the host.
    - role: zswap
      when: faas_cp_converge_roles | default(none) is none or 'zswap' in faas_cp_converge_roles
    # Optional OTLP traces + metrics configuration. The role only validates
    # the operator-owned root-only env file and installs the example;
    # export stays disabled when /etc/faas/otel.env is absent.
    - role: otlp_exporter
      when: faas_cp_converge_roles | default(none) is none or 'otlp_exporter' in faas_cp_converge_roles
    - role: nftables
      when: faas_cp_converge_roles | default(none) is none or 'nftables' in faas_cp_converge_roles
    - role: overlay
      when: faas_cp_converge_roles | default(none) is none or 'overlay' in faas_cp_converge_roles
    - role: node_exporter
      when: faas_cp_converge_roles | default(none) is none or 'node_exporter' in faas_cp_converge_roles
    - role: gcp_ops_agent
      when: faas_cp_converge_roles | default(none) is none or 'gcp_ops_agent' in faas_cp_converge_roles
    - role: internal_pki_renewal
      when: faas_cp_converge_roles | default(none) is none or 'internal_pki_renewal' in faas_cp_converge_roles
    - role: canary_artifact_retention
      when: faas_cp_converge_roles | default(none) is none or 'canary_artifact_retention' in faas_cp_converge_roles
    - role: alertmanager
      when: faas_cp_converge_roles | default(none) is none or 'alertmanager' in faas_cp_converge_roles
    - role: prometheus
      when: faas_cp_converge_roles | default(none) is none or 'prometheus' in faas_cp_converge_roles
    - role: grafana
      when: faas_cp_converge_roles | default(none) is none or 'grafana' in faas_cp_converge_roles
    # Control-plane-only:
    - role: postgres
      when: faas_cp_converge_roles | default(none) is none or 'postgres' in faas_cp_converge_roles
    - role: postgres_capacity
      when: faas_cp_converge_roles | default(none) is none or 'postgres_capacity' in faas_cp_converge_roles
    - role: pgbouncer
      when:
        - faas_pgbouncer_enabled | default(false) | bool
        - faas_cp_converge_roles | default(none) is none or 'pgbouncer' in faas_cp_converge_roles
    - role: postgres_backup
      when:
        - not (faas_image_seed | default(false) | bool)
        - faas_cp_converge_roles | default(none) is none or 'postgres_backup' in faas_cp_converge_roles
    # ADR-1344 §8: off-host, encrypted backup of the control plane's
    # host-local state; off until an operator age recipient is configured.
    - role: cp_state_backup
      when:
        - not (faas_image_seed | default(false) | bool)
        - faas_cp_converge_roles | default(none) is none or 'cp_state_backup' in faas_cp_converge_roles
    - role: control_plane_service
      when: faas_cp_converge_roles | default(none) is none or 'control_plane_service' in faas_cp_converge_roles
    - role: internal_mail_service
      when:
        - faas_internal_mail_managed | default(false) | bool
        - faas_cp_converge_roles | default(none) is none or 'internal_mail_service' in faas_cp_converge_roles
    - role: gatewayd_public_service
      when: faas_cp_converge_roles | default(none) is none or 'gatewayd_public_service' in faas_cp_converge_roles
    - role: public_edge
      when: faas_cp_converge_roles | default(none) is none or 'public_edge' in faas_cp_converge_roles
    - role: s3_gateway_service
      when:
        - faas_object_storage_gateway_managed | default(false) | bool
        - faas_cp_converge_roles | default(none) is none or 's3_gateway_service' in faas_cp_converge_roles
    - role: livequeryd_service
      when:
        - faas_livequeryd_managed | default(false) | bool
        - faas_cp_converge_roles | default(none) is none or 'livequeryd_service' in faas_cp_converge_roles
    - role: githubd_service
      when: faas_cp_converge_roles | default(none) is none or 'githubd_service' in faas_cp_converge_roles
    - role: log_archive
      when: faas_cp_converge_roles | default(none) is none or 'log_archive' in faas_cp_converge_roles
    - role: optional_credentials
      when: faas_cp_converge_roles | default(none) is none or 'optional_credentials' in faas_cp_converge_roles
    # Topology cleanup is safe during image seeding and must also remove
    # legacy one-box services left on an existing control-plane host.
    - role: role_convergence
      when: faas_cp_converge_roles | default(none) is none or 'role_convergence' in faas_cp_converge_roles
    # ADR-143: prove convergence. Lenient here (first bootstrap has no
    # enabled units yet); `make verify-fleet` runs the strict form.
    - role: fleet_verify
      when: faas_cp_converge_roles | default(none) is none or 'fleet_verify' in faas_cp_converge_roles

- name: Bootstrap a Gate-B compute-only node (fsn-2)
  hosts: compute_nodes
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: End managed compute bootstrap on the release-only fast path
      ansible.builtin.meta: end_host
      when: faas_join_bootstrap_contract_current | default(false) | bool

    - name: Gather facts for compute bootstrap convergence
      ansible.builtin.setup:

  roles:
    # Cheap fail-closed admission checks must run before storage discovery or
    # the Firecracker kernel build. node_join stages the env + manifest before
    # importing this play; image-seed builds opt out explicitly.
    - role: compute_admission
    # Shared host preconditions. Control-plane monitoring and notification
    # services stay on the control-plane role; a compute box must not require
    # production paging credentials or run a second Alertmanager instance.
    - role: cgroups_v2
    - role: grub
    # ADR-143: spec §11 OS posture, same as the control-plane play.
    - role: host_hardening
    - role: storage
      tags: [storage]
    - role: lvm
    - role: xfs
    - role: firecracker
    - role: supply_chain_scanners
    - role: systemd_slices
    # ADR-906 decision 6: memory-only compressed swap for frozen VMs; a no-op
    # unless faas_zswap_enabled is set for the host.
    - role: zswap
    # Keep the optional OTLP configuration tripwire consistent on compute nodes.
    - role: otlp_exporter
    - role: nftables
    - role: overlay
    # ADR-372: after the overlay so its routes exist before the tenant
    # policy rules exempt them from the gateway tunnel.
    - role: tenant_egress_client
    - role: node_exporter
    - role: gcp_ops_agent
    - role: internal_pki_renewal
    - role: canary_artifact_retention
    # Compute-only:
    - role: vmmd_service
    # M9: every compute node owns a node-local schedd for heartbeat and
    # recovery decisions. The shared database is remote on this host.
    # ADR-143: stage the GeoIP database BEFORE gatewayd-internal so its
    # first start finds the file at the FAAS_GEOIP_DB_PATH default.
    - role: geoip
    - role: gatewayd_internal_service
    # ADR-1343: the app edge (Cloudflare Tunnel connector + gatewayd-public in
    # compute edge mode); removes itself unless the manifest turns it on.
    - role: gatewayd_public_edge_service
    - role: builderd_service
    - role: compute_only_service
    - role: profiled_service
    - role: log_archive
    - role: optional_credentials
    - role: role_convergence
    - role: fleet_verify
      # node_join imports this bootstrap before it installs the requested
      # release. Existing enabled daemons may still execute an older binary
      # against already-staged new config and trust material, so their
      # readiness is intentionally proved by node_join after installation.
      when: not (faas_join_defer_service_handlers | default(false) | bool)
