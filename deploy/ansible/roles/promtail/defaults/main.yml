# promtail — journal shipper for FaaS hosts (issue #274).

promtail_version: "3.5.3"
# SHA-256 of promtail-linux-amd64.zip from the upstream v{{ promtail_version }} release.
promtail_release_sha256: "16cfde821980d4c3b5fa45647cca81f428c0921bc125ba7e27596dda8d1b64c5"

promtail_listen_address: auto
promtail_listen_port: 9080
promtail_positions_file: /var/lib/promtail/positions.yaml
promtail_config_path: /etc/promtail/config.yml
promtail_environment: production
promtail_host_label: "{{ faas_node_name | default(inventory_hostname) }}"

# The endpoint must be the private HTTPS Loki push URL in production. It is
# derived from faas_obs_loki_address, the control plane's private address
# (ADR-20261023124955 §2), and stays empty without it so an incomplete
# inventory fails closed.
promtail_loki_url: "{{ ('https://' ~ faas_obs_loki_address ~ ':3100/loki/api/v1/push') if (faas_obs_loki_address | default('')) else '' }}"
promtail_loki_tenant_id: gregale
# Fleet-PKI feature leaf (ADR-20261023124955 §2), issued by the
# platform_logs_pki role; Loki's server leaf is named loki.faas.
promtail_loki_server_name: "{{ faas_obs_loki_server_name | default('loki.faas', true) }}"
promtail_loki_ca_file: /etc/faas/tls/ca/ca.crt
promtail_loki_client_cert_file: /etc/faas/tls/promtail/loki-client.crt
promtail_loki_client_key_file: /etc/faas/tls/promtail/loki-client.key

# Journal matches are explicit so unrelated host services are not sent to the
# operations backend. The gatewayd-internal unit carries the structured
# customer-log records emitted by the app-log stream. A unit that is not
# installed on a host simply matches nothing. Every faas-*.service under
# deploy/ must be listed here or carry an exclusion with a reason in
# pkg/daemonunitspec/promtail_units_test.go.
promtail_journal_units:
  # Control-plane and compute daemons.
  - faas-apid.service
  - faas-apid-clone-worker.service
  - faas-apid-data-pipeline-worker.service
  - faas-apid-data-pipeline-alert-worker.service
  - faas-schedd.service
  - faas-meterd.service
  - faas-gatewayd-public.service
  - faas-gatewayd-public-edge.service
  - faas-gatewayd-internal.service
  - faas-githubd.service
  - faas-vmmd.service
  - faas-imaged.service
  - faas-builderd.service
  - faas-bridged.service
  - faas-outboundd.service
  - faas-agentd.service
  - faas-realtimed.service
  - faas-profiled.service
  - faas-livequeryd.service
  - faas-maild.service
  - faas-s3-gatewayd.service
  - faas-cloudflared.service
  # Host helpers and timers.
  - faas-serving-probe.service
  - faas-cgroup-metrics.service
  - faas-canary-artifact-sweep.service
  - faas-cp-state-backup.service
  - faas-audit-anchor.service
  - faas-audit-verify.service
  - faas-pg-basebackup.service
  - faas-pg-basebackup-push.service
  - faas-pg-wal-prune.service
  - faas-postgres-connection-metrics.service
  - faas-postgres-activity-metrics.service
  - faas-internal-mail-metrics.service
  - faas-internal-pki-metrics.service
  - faas-tenant-egress-firewall.service
  - faas-overlay-tailscale.service
  - faas-overlay-wireguard.service
  - faas-rsyslog-rotate.service
  - faas-zswap.service
  # Platform dependencies.
  - postgresql@16-main.service
  - prometheus.service
  - alertmanager.service
  - grafana-server.service
  - loki.service
  - node_exporter.service
promtail_journal_max_age: 12h
promtail_batch_wait: 1s
promtail_batch_size: 1048576
promtail_min_backoff: 500ms
promtail_max_backoff: 5m
promtail_max_retries: 10

# Dev mode only permits a local HTTP target and skips mTLS-file assertions.
promtail_dev_mode: false
