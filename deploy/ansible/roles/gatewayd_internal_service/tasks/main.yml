# gatewayd_internal_service — install systemd unit + socket
# permissions for gatewayd-internal (Tier A7 split, ADR-070).
#
# The internal daemon listens ONLY on a unix socket inside the box.
# Public network exposure is impossible by design — no
# AmbientCapabilities, no RestrictAddressFamilies other than
# AF_UNIX. The unix socket lives at /run/faas/gatewayd-internal.sock,
# which is owned by faas-vmmd.service (the SOLE RuntimeDirectory=faas
# across the faas service set — see faas-vmmd.service for the long
# explanation of why declaring it here would lose the bind-mount).

- name: gatewayd_internal_service — install systemd unit
  notify: restart faas-gatewayd-internal
  ansible.builtin.copy:
    src: faas-gatewayd-internal.service
    dest: /etc/systemd/system/faas-gatewayd-internal.service
    owner: root
    group: root
    mode: "0644"
  register: gatewayd_internal_unit

- name: gatewayd_internal_service — ensure 'faas' group exists
  ansible.builtin.group:
    name: faas
    state: present
    system: true

- name: gatewayd_internal_service — ensure 'faas' system user exists
  ansible.builtin.user:
    name: faas
    group: faas
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    password: "*"

# ADR-093 — drop the per-cluster operator kill-switch. Mirrors the
# alertmanager role's `alertmanager.yml.j2` template drop (tasks/
# main.yml:126-134). A toml key change restarts the daemon so the
# new value lands in cmd/gatewayd-internal/config.go:178-216's
# startup-time LoadConfig. The env-override path
# (FAAS_GATEWAY_ROUTE_METRICS) is the live-reload escape hatch and
# does not require this file to change.
- name: gatewayd_internal_service — ensure /etc/faas exists
  ansible.builtin.file:
    path: /etc/faas
    state: directory
    owner: root
    group: faas
    mode: "0750"

- name: gatewayd_internal_service — render gatewayd.toml
  ansible.builtin.template:
    src: gatewayd.toml.j2
    dest: "{{ gatewayd_config_path }}"
    owner: root
    group: faas
    mode: "0640"
  notify: restart faas-gatewayd-internal

# The split-box schedd client leaf is consumed by the unprivileged faas
# service user. PKI/bootstrap may initially materialise it as root:root
# 0400; converge the ownership here so a rendered TCP schedd target does
# not turn into a restart loop while the one-box Unix path continues to
# work when these paths are overridden empty.
- name: gatewayd_internal_service — grant faas access to schedd client key
  ansible.builtin.file:
    path: "{{ gatewayd_schedd_tls_key_path }}"
    owner: root
    group: faas
    mode: "0440"
    state: file
  when: gatewayd_schedd_tls_key_path | default('') | length > 0

- name: gatewayd_internal_service — grant faas access to schedd client certificate
  ansible.builtin.file:
    path: "{{ gatewayd_schedd_tls_cert_path }}"
    owner: root
    group: faas
    mode: "0440"
    state: file
  when: gatewayd_schedd_tls_cert_path | default('') | length > 0

- name: gatewayd_internal_service — grant faas access to VMMD client key
  ansible.builtin.file:
    path: "{{ gatewayd_vmmd_tls_key_path }}"
    owner: root
    group: faas
    mode: "0440"
    state: file
  when: gatewayd_vmmd_tls_key_path | default('') | length > 0

- name: gatewayd_internal_service — grant faas access to VMMD client certificate
  ansible.builtin.file:
    path: "{{ gatewayd_vmmd_tls_cert_path }}"
    owner: root
    group: faas
    mode: "0440"
    state: file
  when: gatewayd_vmmd_tls_cert_path | default('') | length > 0

- name: gatewayd_internal_service — grant faas access to AppErrors client key
  ansible.builtin.file:
    path: "{{ gatewayd_app_errors_tls_key_path }}"
    owner: root
    group: faas
    mode: "0440"
    state: file
  when: gatewayd_app_errors_target | default('') | length > 0

- name: gatewayd_internal_service — grant faas access to AppErrors client certificate
  ansible.builtin.file:
    path: "{{ gatewayd_app_errors_tls_cert_path }}"
    owner: root
    group: faas
    mode: "0444"
    state: file
  when: gatewayd_app_errors_target | default('') | length > 0

- name: gatewayd_internal_service — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: gatewayd_internal_unit.changed

- name: gatewayd_internal_service — create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-internal.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the gatewayd-internal unit. Drop-in mirrors
# deploy/ansible/roles/control_plane_service/templates/
# 99-faas-node-name.conf.j2 — body is identical across roles.
- name: gatewayd_internal_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to gatewayd-internal via FAAS_GATEWAYD_ROLE so
# cmd/gatewayd-internal/config.go::LoadConfig picks up
# faas_box_role (compute-only on fsn-2). Note: gatewayd-internal
# reads FAAS_GATEWAYD_ROLE, NOT FAAS_GATEWAYD_INTERNAL_ROLE.
# See roles/gatewayd_internal_service/templates/99-faas-role.conf.j2
# for the full rationale.
- name: gatewayd_internal_service — install FAAS_GATEWAYD_ROLE drop-in (Mega-PR-C)
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal

- name: gatewayd_internal_service — install split-box public listener drop-in
  ansible.builtin.template:
    src: 99-faas-public-listen.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/99-faas-public-listen.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal

- name: gatewayd_internal_service — install config and schedd target drop-in
  ansible.builtin.template:
    src: 99-faas-runtime-targets.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/99-faas-runtime-targets.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal

# Issue #585 / ADR-127 — per-daemon secret file perm-asserts. The
# shared block covers ALL new per-daemon secret files (gatewayd-
# internal owns gatewayd-internal.env; the rest are checked here as
# defense in depth). Each assert is a no-op when the file is
# absent (operator-provisioned via `gregalectl secrets init`).
- name: gatewayd_internal_service — sealed.env split perm-asserts (issue # 585 / ADR-127)
  ansible.builtin.include_tasks: ../../_shared/tasks/sealed_env_split_perm_asserts.yml
