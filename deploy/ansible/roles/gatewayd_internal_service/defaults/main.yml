---
# gatewayd-internal — defaults.
#
# ADR-093: cluster-wide default for the operator kill-switch on the
# per-route observability surface. Default true so the rollout
# reaches Hobby/Pro/Scale customers who didn't flip the per-app
# apps.route_metrics_enabled flag at create time. Operators
# downgrade cluster-wide with
# `-e gatewayd_route_metrics_enabled=false` at the playbook call
# site; the toml drop in tasks/main.yml honours the override.
gatewayd_route_metrics_enabled: true
# ADR-143: streaming responses are a paid Hobby+ feature; production is on.
gatewayd_streaming_enabled: true

# Shared public wildcard suffix. Operators with a different Cloudflare/public
# zone override this variable; the split compute gateway must receive the same
# value as apid and gatewayd-public.
gatewayd_apps_domain: gregale.dev

# Path of the rendered config file on the box. The alertmanager role
# uses the same shape (am_config_path) for the alertmanager.yml drop.
gatewayd_config_path: /etc/faas/gatewayd-internal.toml

# TCP schedd targets require the same client certificate used by the
# control-plane gatewayd process. Unix-only single-box deployments may
# override these to empty values.
gatewayd_schedd_tls_cert_path: /etc/faas/tls/gatewayd/schedd-client.crt
gatewayd_schedd_tls_key_path: /etc/faas/tls/gatewayd/schedd-client.key
gatewayd_schedd_tls_ca_path: /etc/faas/tls/ca/ca.crt

# VMMD client identity used by the split-box gateway to proxy requests to
# app runners. Keep this separate from the schedd identity so deployments
# can rotate either transport independently.
gatewayd_vmmd_tls_cert_path: /etc/faas/tls/gatewayd/vmmd-client.crt
gatewayd_vmmd_tls_key_path: /etc/faas/tls/gatewayd/vmmd-client.key
gatewayd_vmmd_tls_ca_path: /etc/faas/tls/ca/ca.crt

# The egress byte stream is a local Unix socket on a single box and a
# dedicated mTLS TCP listener when gatewayd-internal runs on a compute-only
# host. The manifest renderer emits the inventory-facing
# `faas_gatewayd_egress_listen` name; retain the role-local name as an
# override for hand-authored inventories and older callers. Keeping the
# default empty preserves the single-box DAC path.
gatewayd_egress_listen: "{{ faas_gatewayd_egress_listen | default('') }}"
gatewayd_egress_tls_cert_path: /etc/faas/tls/egress/egress.crt
gatewayd_egress_tls_key_path: /etc/faas/tls/egress/egress.key
gatewayd_egress_tls_ca_path: /etc/faas/tls/ca/ca.crt

# The gatewayd → apid AppErrors recorder is local Unix-socket traffic on a
# single box and a private mTLS TCP target on compute-only hosts. Empty keeps
# the legacy Unix path; the manifest generator supplies the split target.
gatewayd_app_errors_target: "{{ faas_gatewayd_app_errors_target | default('') }}"
gatewayd_app_errors_tls_cert_path: /etc/faas/tls/gatewayd/apid-client.crt
gatewayd_app_errors_tls_key_path: /etc/faas/tls/gatewayd/apid-client.key
gatewayd_app_errors_tls_ca_path: /etc/faas/tls/ca/ca.crt
