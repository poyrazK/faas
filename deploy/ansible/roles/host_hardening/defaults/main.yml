---
# host_hardening (spec §11, ADR-143) — the OS-level items the spec calls
# ship-blocking but no role implemented: sshd posture, fail2ban, security
# auto-updates, auditd, and the kernel sysctls not owned by the grub role.
#
# Every sub-feature has its own switch so an operator can bisect a
# regression, but the production default is ON for all of them.
faas_hardening_sshd: true
faas_hardening_fail2ban: true
faas_hardening_unattended_upgrades: true
faas_hardening_auditd: true
faas_hardening_sysctl_enabled: true
faas_hardening_caddy: true
faas_hardening_caddy_dropin: /etc/systemd/system/caddy.service.d/90-gregale-hardening.conf
faas_hardening_journald: true
faas_hardening_rsyslog: true
# The group that may read /var/log/audit; Alloy reads it as a member of adm
# and ships it off the host (ADR-20261107203000).
faas_hardening_auditd_log_group: adm

# Bound the local replay buffer. Logs are shipped off-host when the optional
# Promtail overlay is enabled, but the journal remains the source of truth while
# that path is unavailable. Keep enough history for incident triage without
# allowing expected workload churn to consume an unbounded share of the host.
faas_hardening_journal_system_max_use: 512M
faas_hardening_journal_system_keep_free: 2G
faas_hardening_journal_system_max_file_size: 64M
faas_hardening_journal_runtime_max_use: 128M
faas_hardening_journal_runtime_keep_free: 256M
faas_hardening_journal_runtime_max_file_size: 16M
faas_hardening_journal_max_retention: 7day

# Ubuntu's daily rsyslog rotation can leave multi-gigabyte files behind during
# a log storm. Check the bounded policy hourly and retain at most seven
# compressed generations. The inherited GCE /dev/console action is disabled by
# the role because rsyslog runs as syslog:syslog while the device is root:tty.
faas_hardening_rsyslog_max_file_size: 100M
faas_hardening_rsyslog_rotate: 7

# sshd. Applied as a drop-in so the distro file stays untouched and a
# provider-rendered Port= line (spec §7: non-standard port, operator-owned)
# is never overwritten. PasswordAuthentication is only turned off after the
# role has proven the connecting user has an authorized_keys file — losing
# SSH to the only control-plane node is the one failure this role must
# never cause.
faas_hardening_sshd_dropin: /etc/ssh/sshd_config.d/99-faas-hardening.conf
faas_hardening_sshd_password_auth: false
# Public beta uses a named OS Login administrator. The role refuses to apply
# this value when Ansible itself is connected as root, so an access migration
# fails before it can lock out the operator.
faas_hardening_sshd_permit_root_login: "no"
faas_hardening_sshd_max_auth_tries: 4
faas_hardening_sshd_client_alive_interval: 300
faas_hardening_sshd_client_alive_count_max: 2

# fail2ban — sshd jail only; the platform's own abuse controls live in
# gatewayd (ADR-040/041), not here.
faas_hardening_fail2ban_bantime: 1h
faas_hardening_fail2ban_findtime: 10m
faas_hardening_fail2ban_maxretry: 5
# Host-key verification opens an SSH connection without authenticating. Fleet
# rollout preflights therefore look like failed logins to fail2ban. Keep the
# loopback defaults here; the template also adds the manifest-derived overlay
# and control-plane CIDRs so trusted deployment traffic cannot ban itself.
faas_hardening_fail2ban_ignoreip:
  - 127.0.0.0/8
  - ::1

# unattended-upgrades — security pocket only, never auto-reboot: a reboot
# destroys every parked snapshot's tmpfs jail (spec Gotchas) and must be an
# operator-driven drain (ADR-066 live migration).
faas_hardening_unattended_reboot: false

# auditd — watch the trust roots and the privileged tools. Kept small on
# purpose: audit volume is a page-quality signal, not a firehose.
faas_hardening_auditd_rules:
  - "-w /etc/faas/ -p wa -k faas_config"
  - "-w /etc/faas/secrets/ -p rwa -k faas_secrets"
  - "-w /etc/systemd/system/ -p wa -k faas_units"
  - "-w /etc/nftables.conf -p wa -k faas_nft"
  - "-w /usr/local/bin/firecracker -p x -k faas_vmm"
  - "-w /usr/local/bin/jailer -p x -k faas_vmm"
  - "-w /etc/sudoers -p wa -k sudo"
  - "-w /etc/sudoers.d/ -p wa -k sudo"
  - "-a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=4294967295 -k root_exec"

# sysctl — kernel information-leak and hardlink/symlink protections. The
# cgroup/userns/bpf knobs stay in the grub role (spec §11, ADR-008); network
# knobs stay out of here entirely because the netns/NAT design (ADR-009)
# depends on forwarding and rp_filter semantics the nftables role owns.
faas_hardening_sysctl:
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  fs.protected_fifos: 2
  fs.protected_regular: 2
  fs.suid_dumpable: 0
  # ADR-20261107220000: root cannot replace the running kernel, and nothing
  # on the host uses io_uring (Firecracker's block engine is Sync, Go and
  # PostgreSQL 16 do not use it), so its attack surface is closed.
  # kexec_load_disabled cannot be turned back on until reboot.
  kernel.kexec_load_disabled: 1
  kernel.io_uring_disabled: 2
  dev.tty.ldisc_autoload: 0

# Kernel lockdown (ADR-20261107220000). faas-kernel-lockdown.service raises
# /sys/kernel/security/lockdown to this level early in boot. The kernel only
# lets it go up until the next reboot, so root cannot undo it at run time.
# integrity: no unsigned modules, no /dev/mem or /dev/kmem, no kexec of an
# unsigned kernel, no MSR or I/O port writes, no ACPI table overrides.
# confidentiality would also stop reading kernel memory (kprobes, perf
# kernel sampling, BPF reads), which tracing and runtime detection need.
# "" leaves lockdown alone.
faas_hardening_kernel_lockdown: integrity

# Kernel module lock (ADR-20261107220000), off by default. When on, the same
# unit loads faas_hardening_modules_preload and then sets
# kernel.modules_disabled=1: no module can load until reboot, so a feature
# that needs a module not listed fails with EPERM. Turn it on per host group
# only after collecting `lsmod` from hosts that ran every feature
# (docs/runbooks/kernel-lockdown.md).
faas_hardening_modules_lock: false
# What platform features load after boot: the modules loaded on
# internal-test-1 after 37 days of metal runs and the full pkg/fcvm metal
# suite under lockdown (2026-11-07), plus the overlay network's tunnels and
# nftables reject/fib. A module this kernel lacks is skipped. KVM,
# tap/bridge/veth and vsock for
# Firecracker, nftables and its expressions for netns policy and NAT,
# traffic control for bandwidth shaping, overlay and xfs, zram, and the
# overlay network's tunnels. Hardware drivers load at boot before the lock.
faas_hardening_modules_preload:
  - kvm
  - kvm_intel
  - kvm_amd
  - vhost_vsock
  - vsock
  - vsock_loopback
  - tun
  - bridge
  - veth
  - dummy
  - ifb
  - 8021q
  - vxlan
  - wireguard
  - nf_tables
  - nft_chain_nat
  - nft_compat
  - nft_connlimit
  - nft_ct
  - nft_limit
  - nft_masq
  - nft_nat
  - nft_quota
  - nft_reject
  - nft_reject_inet
  - nft_fib_inet
  - nf_nat
  - nf_conncount
  - ip_set
  - x_tables
  - ip_tables
  - xt_MASQUERADE
  - xt_addrtype
  - xt_conntrack
  - xt_set
  - sch_fq_codel
  - sch_ingress
  - sch_netem
  - sch_tbf
  - sch_htb
  - cls_matchall
  - cls_u32
  - act_mirred
  - overlay
  - xfs
  - zram
  - lz4
  - zstd
  - tls
  - inet_diag
  - tcp_diag
  - udp_diag
  - unix_diag
  - binfmt_misc
