# /etc/tmpfiles.d/faas.conf
#
# Pre-create /run/faas with the correct ownership before any
# faas-*.service unit starts. Closes the restart-cycle race where
# systemd's RuntimeDirectory=faas on faas-vmmd.service creates the
# dir as root:root 0755, the ExecStartPre chown flips it to
# root:faas 0775, but schedd + apid dial /run/faas/vmmd.sock
# during the chown window and get bind: permission denied
# (cd-controlplane run 31121004495, post PR #633 deploy 2026-08-04).
#
# Shipped by cd-controlplane.yml "Install systemd service units"
# step (a new `install -m 0644 ... /etc/tmpfiles.d/faas.conf`
# line) and by ansible's control_plane_service role for the
# non-cd control-plane variant. The runtime is then run explicitly
# via `systemd-tmpfiles --create /etc/tmpfiles.d/faas.conf` so
# the dir is created during the deploy without waiting for a
# reboot.
#
# /run/faas/stream is where the vmmd-stream-bridge binary
# (cmd/vmmd-stream-bridge, issue #686) binds its per-instance
# unix socket (/var/run/faas/stream/<instance>.sock). vmmd spawns
# the bridge via `ip netns exec <netns> …` so the bridge itself
# only switches netns; the bind happens on the host. Without this
# directory the bridge's `net.Listen("unix", …)` fails with
# `no such file or directory` and the first streamed request
# after install/reboot returns Unavailable. Mode 0770 keeps the
# socket files unreadable to anyone other than root (the bridge
# binary additionally chmods each socket 0600). Same ownership
# rules as /run/faas: created root:faas 0770 so vmmd (group
# member) can write into it; RuntimeDirectory never touches it.
d /run/faas 0775 root faas -
d /run/faas/stream 0770 root faas -

# NOTE: systemd-tmpfiles only applies the mode/user/group on
# CREATION. On a redeploy, vmmd's RuntimeDirectory=faas already
# created /run/faas as root:root 0755, so tmpfiles finds it
# existing and skips the chown. cd-controlplane.yml and ansible's
# control_plane_service role now follow this rule with an explicit
# `chown root:faas && chmod 0775` (PR-M). The cd-controlplane.yml
# chown runs in THREE places: (1) the "Install systemd service
# units" step (PR-M, covers the install-to-restart window),
# (2) BEFORE each daemon restart inside the main + roll_back loops
# (PR-M.2, the one that sticks during the loop), and (3) AFTER
# the loops as defense-in-depth (PR-M.1, covers any daemon that
# auto-restarts later for unrelated reasons). PR-M.1 alone was
# insufficient — schedd and gatewayd-internal restart INSIDE the
# loop and exit/degrade on bind failure before the PR-M.1 chown
# fires (run 31055261896, PR #657 deploy 2026-08-05). Do NOT
# change the trailing `-` to `--`: that's the AGE field (default
# = no cleanup), not a "force retouch" flag. Do NOT use `d+`
# (recreate) here: that wipes live .sock files inside /run/faas
# (vmmd.sock, apid.sock, …).
