# control_plane_service — install systemd units + example TOMLs for the
# control-plane daemons that live on fsn-1 (spec §4.1, §4.3, §4.7):
# apid, schedd, meterd. imaged moved to the new compute_only_service role
# (Gate-B cross-box mTLS hardening, issue #297 / ADR-025 §Tier 2) so the
# imaged runtime dirs + the cosign sign-keypair tripwires travel with it.
#
# All three remaining daemons are non-root and share the same /etc/faas
# directory + sealed.env EnvironmentFile pattern (gap G2 — secrets sealed
# at rest, decrypted only at boot by systemd).
#
# Like vmmd_service, this role does NOT enable or start the daemons: the
# operator does that once the binaries are deployed and the sealed.env file
# has been populated with the DATABASE_URL.
#
# Idempotency: each copy uses `mode:` to keep state predictable; `daemon_reload`
# fires only when the unit file actually changed.
#
# Cross-cutting tripwires that live here (not in compute_only_service):
#   - session.key (apid reads it via LoadCredential)
#   - host.hmac.key (apid reads it via LoadCredential)
#   - host.age + host.age.previous (apid + githubd on fsn-1)
#   - archive-creds.json + apid log-archive drop-in (issue #562)
#   - trusted-publishers/ (apid writes per-publisher PEMs)
#   - /etc/faas/tls/ca/ + per-daemon leaves (Tier 1)
# imaged's tripwires (sign.key, sign-pub.pem, imaged's ReadWritePaths=,
# /srv/fc/snap, /srv/fc/sigs) are now in compute_only_service.

- name: control_plane_service — ensure per-daemon users exist (non-root, no shell)
  ansible.builtin.user:
    name: "{{ item }}"
    group: faas
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  loop:
    - faas-apid
    - faas-schedd
    - faas-meterd

- name: control_plane_service — drop example TOMLs (operator copies to *.toml)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: faas
    mode: "0640"
  loop:
    - { src: "apid.toml.example", dest: "/etc/faas/apid.toml.example" }
    - { src: "schedd.toml.example", dest: "/etc/faas/schedd.toml.example" }
    - { src: "meterd.toml.example", dest: "/etc/faas/meterd.toml.example" }

- name: control_plane_service — install shared storage env example
  ansible.builtin.copy:
    src: ../../_shared/files/storage.env.example
    dest: /etc/faas/storage.env.example
    owner: root
    group: faas
    mode: "0640"

# Manifest-generated split-box host_vars opt into a managed meterd routing
# file. Legacy/operator-owned boxes keep the old example-only contract so an
# Ansible run cannot overwrite a hand-maintained billing configuration.
- name: control_plane_service — render managed meterd routing config
  ansible.builtin.template:
    src: meterd.toml.j2
    dest: "{{ faas_meterd_config_path }}"
    owner: root
    group: faas
    mode: "0640"
  when: faas_meterd_config_managed | default(false) | bool
  notify: restart faas-meterd

- name: control_plane_service — install systemd units
  notify:
    - restart faas-apid
    - restart faas-schedd
    - restart faas-meterd
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: "faas-apid.service", dest: "/etc/systemd/system/faas-apid.service" }
    - { src: "faas-schedd.service", dest: "/etc/systemd/system/faas-schedd.service" }
    - { src: "faas-meterd.service", dest: "/etc/systemd/system/faas-meterd.service" }
  register: cp_units

# Tier A7 PR-D — pre-create /run/faas with the canonical
# root:faas 0775 ownership before any faas-*.service unit starts.
# Closes the restart-cycle race where faas-vmmd.service's
# RuntimeDirectory=faas recreates the dir as root:root 0755 and
# the ExecStartPre chown flips it to root:faas 0775, but schedd
# + apid dial /run/faas/vmmd.sock during the chown window and
# get bind: permission denied (cd-controlplane run 31121004495,
# post PR #633 deploy 2026-08-04).
- name: control_plane_service — install /run/faas tmpfiles.d rule (PR-D)
  ansible.builtin.copy:
    src: "faas.conf"
    dest: /etc/tmpfiles.d/faas.conf
    owner: root
    group: root
    mode: "0644"
- name: control_plane_service — apply /run/faas tmpfiles.d rule (PR-D)
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/faas.conf
  changed_when: false
# PR-M: explicit chown after tmpfiles. systemd-tmpfiles only applies
# mode/user/group at CREATION; vmmd's RuntimeDirectory=faas creates
# /run/faas as root:root 0755 first, so tmpfiles finds it existing
# and skips the chown. Without this, githubd (User=faas Group=faas)
# can't bind() /run/faas/githubd.sock on every re-run. Idempotent.
# The canonical rationale lives at this file's mirror
# (deploy/controlplane/tmpfiles.d/faas.conf, a tombstone now —
# RETIRED 2026-08-15 by issue #911 / PR-1; see
# deploy/controlplane/RETIRED.md). PR-1 rewrote the CD pipeline to
# read this file from deploy/ansible/roles/control_plane_service/
# files/faas.conf instead.
- name: control_plane_service — chown /run/faas to root:faas 0775 (PR-M)
  ansible.builtin.file:
    path: /run/faas
    state: directory
    owner: root
    group: faas
    mode: "0775"

- name: control_plane_service — systemctl daemon-reload (only when unit files changed)
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    cp_units.changed
    or (faas_app_errors_dropin.changed | default(false))
    or (faas_app_errors_dropin_removed.changed | default(false))
    or (faas_log_archive_dropin.changed | default(false))
    or (faas_log_archive_dropin_removed.changed | default(false))

- name: control_plane_service — create systemd drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - faas-schedd
    - faas-apid
    - faas-meterd

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into every control-plane unit so the multi-box identity
# travels from host_vars to the daemons without a TOML edit on every
# box add. The drop-in is identical across schedd / apid / meterd
# (templates/99-faas-node-name.conf.j2) and is rendered from
# faas_node_name (deploy/ansible/host_vars/faas-fsn-N.yml). The role
# does not restart the daemons itself (it ships them but does not
# enable/start per the role's idempotency contract); the operator's
# `systemctl enable --now` picks the drop-in up automatically.
- name: control_plane_service — install FAAS_NODE_NAME drop-in per unit (Mega-PR-A)
  notify:
    - restart faas-apid
    - restart faas-meterd
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: "/etc/systemd/system/{{ item }}.service.d/99-faas-node-name.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - faas-apid
    - faas-meterd

- name: control_plane_service — install central schedd identity drop-in
  notify: restart faas-schedd
  ansible.builtin.template:
    src: 99-faas-schedd-node-name.conf.j2
    dest: /etc/systemd/system/faas-schedd.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# faas_apid_app_errors_listen (apid, the LISTENER) and
# faas_gatewayd_app_errors_target (gatewayd-internal, the CLIENT) are a pair.
# Setting only the client is silent and permanent: gatewayd-internal dials a
# port nobody bound, retries, and drops every batch with a WARN. Both the
# request_telemetry pipeline (ADR-127 debugger) and app_errors
# (`gregale inspect --errors`) lose 100% of their data with no alert.
#
# Observed on the europe-west3 fleet 2026-09-03: the compute drop-in carried
# FAAS_APID_APP_ERRORS_TARGET=tcp://apid.faas:9093 while the control plane had
# no 99-faas-app-errors.conf at all, so apid listened only on 9101/8081 and
# gatewayd-internal logged
#   "dial tcp 10.156.0.3:9093: connect: connection refused"
# continuously — 87 failures in a two-hour window.
#
# scale_check.yml already asserts BOTH halves (the control-plane and compute
# host_vars blocks), but every caller runs it with --syntax-check only
# (Makefile, .github/workflows/ci.yml), which never evaluates an assert. This
# gate runs during the actual bootstrap instead.
- name: control_plane_service — AppErrors listener must be set when any compute node ships to it
  ansible.builtin.assert:
    that:
      - faas_apid_app_errors_listen | default('') | length > 0
    fail_msg: >-
      A compute node is configured to ship AppErrors/RequestTelemetry to apid
      ({{ faas_app_errors_clients | join(', ') }} set
      faas_gatewayd_app_errors_target) but this control-plane host has no
      faas_apid_app_errors_listen, so apid will not bind the listener and every
      batch will be dropped. Set faas_apid_app_errors_listen (production value:
      tcp://0.0.0.0:9093) on this host, or clear
      faas_gatewayd_app_errors_target on the compute hosts to keep the
      single-box Unix-socket path.
  vars:
    faas_app_errors_clients: >-
      {{ hostvars | dict2items
         | selectattr('value.faas_gatewayd_app_errors_target', 'defined')
         | selectattr('value.faas_gatewayd_app_errors_target', 'ne', '')
         | map(attribute='key') | list }}
  when: faas_app_errors_clients | length > 0

# Split-box AppErrors is a private compute→control-plane mTLS listener. The
# generated target is absent on single-box inventories, where apid keeps its
# legacy Unix socket. Remove the drop-in on a role transition so a host does
# not retain a stale TCP endpoint after returning to single-box mode.
- name: control_plane_service — install apid AppErrors target drop-in
  notify: restart faas-apid
  ansible.builtin.template:
    src: 99-faas-app-errors.conf.j2
    dest: /etc/systemd/system/faas-apid.service.d/99-faas-app-errors.conf
    owner: root
    group: root
    mode: "0644"
  register: faas_app_errors_dropin
  when: faas_apid_app_errors_listen | default('') | length > 0

- name: control_plane_service — remove apid AppErrors target drop-in
  notify: restart faas-apid
  ansible.builtin.file:
    path: /etc/systemd/system/faas-apid.service.d/99-faas-app-errors.conf
    state: absent
  register: faas_app_errors_dropin_removed
  when: faas_apid_app_errors_listen | default('') | length == 0

- name: control_plane_service — install split-box schedd routing drop-in
  notify: restart faas-schedd
  ansible.builtin.template:
    src: 99-faas-schedd-routing.conf.j2
    dest: /etc/systemd/system/faas-schedd.service.d/99-faas-routing.conf
    owner: root
    group: root
    mode: "0644"

# Issue #585 / ADR-127 — per-daemon secret file perm-asserts. The
# shared block checks ALL new per-daemon secret files (schedd +
# meterd belong to this role; the others are checked here too as
# defense-in-depth so a loose perm on a sibling role's file also
# fails this role's run). Each assert is a no-op when the file is
# absent (operator-provisioned via `gregalectl secrets init`).
- name: control_plane_service — sealed.env split perm-asserts (issue # 585 / ADR-127)
  ansible.builtin.include_tasks: ../../_shared/tasks/sealed_env_split_perm_asserts.yml

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to the three control-plane daemons (apid, schedd,
# meterd) via FAAS_<DAEMON>_ROLE. One drop-in per daemon — the
# template sets three Environment= lines so the single render
# covers all three daemons' env-var contracts. See
# roles/control_plane_service/templates/99-faas-role.conf.j2
# for the full rationale.
- name: control_plane_service — install FAAS_<DAEMON>_ROLE drop-in per unit (Mega-PR-C)
  notify:
    - restart faas-apid
    - restart faas-schedd
    - restart faas-meterd
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: "/etc/systemd/system/{{ item }}.service.d/99-faas-role.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - faas-apid
    - faas-schedd
    - faas-meterd

- name: control_plane_service — create runtime dirs (logs, spool, statuspage)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.user }}"
    group: faas
    mode: "0770"
  loop:
    - { path: "/var/log/faas", user: "faas-apid" }
    - { path: "/var/spool/faas", user: "faas-apid" }
    - { path: "/etc/faas/statuspage", user: "faas-apid" }
  # imaged-owned dirs (/srv/fc/snap, /srv/fc/sigs) moved to
  # compute_only_service — those travel with the imaged unit and its
  # ReadWritePaths= assert so the tripwire pair stays in one role.

# The control plane owns the local PostgreSQL cluster. Keep its daemons on
# the peer-authenticated Unix socket; a loopback TCP DSN is refused by the
# hardened PostgreSQL role and otherwise turns every account transaction into
# a runtime 500 while /healthz still reports liveness.
- name: control_plane_service — validate control-plane database DSN topology
  ansible.builtin.shell: |
    grep -Eq "^DATABASE_URL=['\"]?postgres(ql)?:///faas\?host=/run/postgresql" /etc/faas/sealed.env
  args:
    executable: /bin/sh
  register: faas_control_db_url_check
  changed_when: false
  failed_when: false
  no_log: true

- name: control_plane_service — refuse a missing or TCP control-plane DSN
  ansible.builtin.assert:
    that:
      - faas_control_db_url_check.rc == 0
    fail_msg: >-
      /etc/faas/sealed.env must define DATABASE_URL with the local
      PostgreSQL Unix-socket DSN (postgres:///faas?host=/run/postgresql...);
      127.0.0.1:5432 is not a valid control-plane database endpoint.

# Status page HTML (spec §12, M8 acceptance). apid reads this file at
# /status; without it the handler returns the embedded "source
# unavailable" fallback and the alert-driven degraded pill never
# renders. ReadOnlyPaths=/etc/faas in faas-apid.service covers the
# read; no separate ReadWritePaths entry needed here.
- name: control_plane_service — install status page HTML
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../statuspage/index.html"
    dest: /etc/faas/statuspage/index.html
    owner: root
    group: faas
    mode: "0644"

- name: control_plane_service — note for operators (NOT auto-enabled)
  ansible.builtin.debug:
    msg: >-
      cp daemons installed but NOT enabled. Operator runs:
        systemctl enable --now faas-apid faas-schedd faas-meterd
      once /etc/faas/sealed.env has DATABASE_URL (and STRIPE_API_KEY plus
      FAAS_SCHEDD_ADDR=/run/faas/schedd.sock for meterd — meterd refuses to
      start without FAAS_SCHEDD_ADDR per issue #52's strict-exit rule) and
      the binaries are installed at
      /opt/faas/current/bin/{apid,schedd,meterd}.
      imaged is no longer installed by this role — see
      compute_only_service (Gate-B, issue #297 / ADR-025 §Tier 2).

# Security review A4: scope FAAS_SESSION_KEY to apid via systemd
# LoadCredential. The role does NOT create the secret file — the
# operator provisions it once via `openssl rand -hex 32 >
# /etc/faas/secrets/session.key` (mode 0400, root:root). The role
# asserts perms before daemon_reload so a drift fails the playbook
# rather than silently exporting the key to every daemon that reads
# sealed.env. Mirrors the fail-loud shape of pkg/secretbox/hostkey.go:138.
- name: control_plane_service — assert session key file mode is 0400 (A4)
  ansible.builtin.stat:
    path: /etc/faas/secrets/session.key
  register: faas_session_key_stat
  failed_when:
    - >-
      not faas_session_key_stat.stat.exists
      or faas_session_key_stat.stat.mode != "0400"
      or faas_session_key_stat.stat.pw_name != "root"
      or faas_session_key_stat.stat.gr_name != "root"

# ADR-117 PR-C: scope the per-host value-hash HMAC key to apid through
# systemd LoadCredential. The source file remains root:root 0400 on disk;
# systemd copies it into apid's private credential directory, where the
# service user can read it through FAAS_HOST_HMAC_KEY_PATH. The key is
# intentionally not generated by Ansible: it is stable per host and must
# survive release installs and rotations. Operators provision it once with
# `openssl rand -out /etc/faas/secrets/host.hmac.key 32` before bootstrap.
- name: control_plane_service — assert host HMAC key mode is 0400 root:root (ADR-117)
  ansible.builtin.stat:
    path: /etc/faas/secrets/host.hmac.key
  register: faas_host_hmac_key_stat
  failed_when:
    - >-
      not faas_host_hmac_key_stat.stat.exists
      or faas_host_hmac_key_stat.stat.mode != "0400"
      or faas_host_hmac_key_stat.stat.pw_name != "root"
      or faas_host_hmac_key_stat.stat.gr_name != "root"

# IAM-2 / issue #186 (TOTP MFA on dashboard sessions): apid needs
# to read /etc/faas/secrets/host.age so the MFA handlers
# (/verify + /confirm + /recover + /disable) can unseal the per-
# account TOTP secret. The file is generated by vmmd on first boot
# with mode 0400 root:root (spec §11). apid does NOT read it on
# disk — systemd's LoadCredential=faas_host_age_identity
# (deploy/systemd/faas-apid.service) copies the file into the apid
# unit's credential dir owned by faas-apid:faas, so apid's MFA
# handlers unseal TOTP via the credential copy, not the original
# 0400 file. The on-disk mode and the apid-read path are
# independent — that decoupling is what lets us hold the 0400
# contract (spec §11) even though apid needs to consume the
# identity.
#
# The assert below mirrors the session-key check above: it fails
# loud before systemd daemon-reload so a perms drift on a fresh
# box never reaches production. The 0400 vmmd write is at
# pkg/secretbox/hostkey.go:138 (GenerateAndSaveHostKey); the
# runtime tripwire that would otherwise refuse a loose mode is
# pkg/secretbox/hostkey.go:105 (LoadHostKey exact-equality check).
- name: control_plane_service — assert host.age file mode is 0400 root:root (IAM-2)
  ansible.builtin.stat:
    path: /etc/faas/secrets/host.age
  register: faas_host_age_stat
  failed_when:
    - >-
      not faas_host_age_stat.stat.exists
      or faas_host_age_stat.stat.mode != "0400"
      or faas_host_age_stat.stat.pw_name != "root"
      or faas_host_age_stat.stat.gr_name != "root"

# Issue #316 / ADR-057 — soft assert on host.age.previous. The
# rotation-overlap twin of host.age appears during the 30-day
# window after `gregalectl host-age rotate --commit`. Its presence
# is INTENTIONAL (the runbook tolerates the overlap so MFA
# envelopes sealed under the previous key still unseal); ansible
# must NOT refuse to deploy on a box mid-rotation. We stat it
# and emit a debug message so the operator log records "rotation
# overlap in progress" without blocking. Mode tripwire still
# hard-fails if .previous exists with loose perms — that's the
# same 0400 root:root tripwire as the current file, no exemption.
- name: control_plane_service — soft assert host.age.previous (issue # 316 / ADR-057)
  ansible.builtin.stat:
    path: /etc/faas/secrets/host.age.previous
  register: faas_host_age_previous_stat
- name: control_plane_service — debug host.age.previous presence
  ansible.builtin.debug:
    msg: >-
      host.age.previous present — rotation overlap in progress
      mtime={{ faas_host_age_previous_stat.stat.mtime | default('absent') }}
      mode={{ faas_host_age_previous_stat.stat.mode | default('absent') }}
  when: faas_host_age_previous_stat.stat.exists
- name: control_plane_service — assert host.age.previous mode is 0400 root:root if present
  ansible.builtin.assert:
    that:
      - faas_host_age_previous_stat.stat.mode == "0400"
      - faas_host_age_previous_stat.stat.pw_name == "root"
      - faas_host_age_previous_stat.stat.gr_name == "root"
    fail_msg: >-
      host.age.previous present with loose perms ({{ faas_host_age_previous_stat.stat.mode }}
      {{ faas_host_age_previous_stat.stat.pw_name }}:{{ faas_host_age_previous_stat.stat.gr_name }}).
      Same 0400 root:root contract as host.age (spec §11). The rotation overlap is
      intentional but the perms are not — refusing.
  when: faas_host_age_previous_stat.stat.exists

# Issue #562 — log archive S3 credential envelope (issue #562
# PR-A). The unsealed archive-creds.json envelope is read by
# apid at boot (cmd/apid/main.go::readArchiveCreds). Mirrors
# the host.age / session.key / sign-keypair / rclone.conf
# pattern: fail-loud perm tripwire so a drift never silently
# exports the S3 access key to every daemon.
#
# Mode 0400 root:root matches the unseal-archive-creds CLI
# leaf's chmod (cmd/gregale/commands_backup_unseal_archive.go).
# apid reads the envelope via LoadCredential= so it never
# touches the on-disk 0400 file; the tripwire is for the box
# that runs `gregalectl backup unseal-archive-creds` and would
# otherwise write a loose-perm file.
- name: control_plane_service — assert archive-creds.json mode is 0400 root:root if present (issue # 562)
  ansible.builtin.stat:
    path: /etc/faas/secrets/storage-box/archive-creds.json
  register: faas_archive_creds_stat
- name: control_plane_service — assert archive-creds.json perms (issue # 562)
  ansible.builtin.assert:
    that:
      - faas_archive_creds_stat.stat.mode == "0400"
      - faas_archive_creds_stat.stat.pw_name == "root"
      - faas_archive_creds_stat.stat.gr_name == "root"
    fail_msg: >-
      archive-creds.json present with loose perms ({{ faas_archive_creds_stat.stat.mode }}
      {{ faas_archive_creds_stat.stat.pw_name }}:{{ faas_archive_creds_stat.stat.gr_name }}).
      The unseal-archive-creds CLI leaf stamps 0400 root:root; refusing to ship a
      credential envelope with broader access.
  when: faas_archive_creds_stat.stat.exists

# Issue #562 — install the apid systemd drop-in that grants
# the shipper write access to /var/log/faas/archive. The S3
# archive credential is part of the apid base unit and is loaded
# optionally, so this drop-in contains no secret source.
# Drop-in files live alongside the unit and are auto-loaded
# by systemd when the unit is reloaded (mirrors the
# postgres storage-box drop-in at deploy/ansible/roles/
# postgres/files/postgresql@.service.d/99-faas-off-host-backup.conf).
- name: control_plane_service — install apid log-archive drop-in (issue # 562)
  notify: restart faas-apid
  ansible.builtin.copy:
    src: "faas-apid.service.d/99-faas-log-archive.conf"
    dest: "/etc/systemd/system/faas-apid.service.d/99-faas-log-archive.conf"
    owner: root
    group: root
    mode: "0644"
  register: faas_log_archive_dropin
  when: faas_archive_creds_stat.stat.exists

- name: control_plane_service — remove apid archive drop-in when creds are absent
  notify: restart faas-apid
  ansible.builtin.file:
    path: /etc/systemd/system/faas-apid.service.d/99-faas-log-archive.conf
    state: absent
  register: faas_log_archive_dropin_removed
  when: not faas_archive_creds_stat.stat.exists

# Issue #472 / ADR-058 — per-app cosign trusted-publisher directory.
# imaged reads /etc/faas/secrets/trusted-publishers/ at startup and
# on every pg_notify('trusted_signer_changed'). The dir is created
# by this task (mode 0755 root:root) so imaged's first read never
# ENOENTs; per-file perms are 0444 root:root (enforced by the Go
# loader at read time — see pkg/cosign/keys.go). Operator onboards
# publishers via `gregale trusted-publishers add <slug> <name> <pub>`,
# which PUTs base64(DER) to apid; apid writes the mirror .pem here.
# Missing dir on a deploy attempt is fail-closed at the apid
# pre-flight gate (handlers.go::createDeployment), so a never-
# populated install is non-fatal at startup.
- name: control_plane_service — ensure trusted-publishers dir exists with mode 0755 root:root (issue # 472)
  ansible.builtin.file:
    path: /etc/faas/secrets/trusted-publishers
    state: directory
    owner: root
    group: root
    mode: "0755"

# PR-C+D cert directory migration: pre-PR-C deployments kept the
# egress server leaf at /etc/faas/tls/gatewayd/egress.{crt,key}.
# This runs first so the stat-asserts below see the PR-C layout
# (`/etc/faas/tls/egress/egress.crt`). Idempotent — the `creates:`
# sentinel in migrate_egress_certs.yml no-ops re-runs.
- name: control_plane_service — migrate egress cert dir (PR-C+D)
  ansible.builtin.include_tasks: migrate_egress_certs.yml

# Tier 1 control-plane mTLS (ADR-052). The local-dev PKI
# bootstrap lays out /etc/faas/tls/{ca,<daemon>/} with 0400
# private keys and 0444 public certs; this stat-assert proves
# the bootstrap ran on a control-plane node (compute nodes run
# `gregalectl pki init` via their own vmmd_service role and are
# checked there). Failing the play here surfaces a misconfigured
# bootstrap before the daemons attempt to load the certs and
# start with a confusing TLS handshake failure.
- name: control_plane_service — assert /etc/faas/tls/ca/ca.crt exists (Tier 1)
  ansible.builtin.stat:
    path: /etc/faas/tls/ca/ca.crt
  register: faas_pki_ca_cert_stat
  failed_when: not faas_pki_ca_cert_stat.stat.exists

- name: control_plane_service — assert /etc/faas/tls/ca/ca.key mode is 0400 root:root (Tier 1)
  ansible.builtin.stat:
    path: /etc/faas/tls/ca/ca.key
  register: faas_pki_ca_key_stat
  failed_when:
    - >-
      not faas_pki_ca_key_stat.stat.exists
      or faas_pki_ca_key_stat.stat.mode != "0400"
      or faas_pki_ca_key_stat.stat.pw_name != "root"
      or faas_pki_ca_key_stat.stat.gr_name != "root"

- name: control_plane_service — assert per-daemon leaves exist (Tier 1)
  ansible.builtin.stat:
    path: "/etc/faas/tls/{{ item.0 }}/{{ item.1 }}"
  loop: "{{ faas_pki_leaves | zip(faas_pki_leaf_files) | map('list') }}"
  vars:
    # Each control-plane daemon has its own net.Listener / leaf
    # filename under /etc/faas/tls/<daemon>/. The egress server
    # leaf lives under /etc/faas/tls/egress/ — PR-C renamed the
    # directory from gatewayd/ to egress/ to mirror the daemon-
    # independent naming the Tier A9 PR-cluster establishes
    # (the proto package is onebox.faas.egress.v1 and the
    # runtime socket is /run/faas/egress.sock; the cert dir is
    # the third mirror). The other three listen on gRPC servers
    # named "server".
    faas_pki_leaves:
      - schedd
      - apid
      - meterd
      - egress
    faas_pki_leaf_files:
      - server.crt
      - advisory.crt
      - server.crt
      - egress.crt
  register: faas_pki_leaf_stat
  failed_when: not faas_pki_leaf_stat.stat.exists

# The PKI initializer intentionally creates private keys root-only. The
# control-plane daemons run as dedicated faas-* users, so the two schedd
# keys it consumes must be readable through the shared faas group while
# remaining inaccessible to other users. Keep this normalization next to the
# leaf tripwire so a fresh bare-metal install cannot boot into a TLS restart
# loop after the certs themselves have been generated.
- name: control_plane_service — assert schedd private keys exist
  ansible.builtin.stat:
    path: "/etc/faas/tls/schedd/{{ item }}"
  loop:
    - server.key
    - vmmd-client.key
  register: faas_schedd_key_stat
  failed_when: not faas_schedd_key_stat.stat.exists

- name: control_plane_service — grant schedd group access to private keys
  ansible.builtin.file:
    path: "/etc/faas/tls/schedd/{{ item }}"
    owner: root
    group: faas
    mode: "0440"
  loop:
    - server.key
    - vmmd-client.key

# In split-box mode meterd is a TCP client of schedd and gatewayd-internal.
# Normalize only those optional client leaves when the generated routing
# config is enabled; single-box installs retain their existing key layout.
- name: control_plane_service — grant meterd group access to remote client keys
  ansible.builtin.file:
    path: "/etc/faas/tls/meterd/{{ item }}"
    owner: root
    group: faas
    mode: "0440"
    state: file
  loop:
    - schedd-client.key
    - egress-client.key
  when:
    - faas_meterd_config_managed | default(false) | bool

# Spec §11 — ProtectSystem=strict ReadWritePaths= assert moved to
# compute_only_service (Gate-B). imaged now lives on fsn-2; the
# tripwire travels with the daemon it protects so the role's mkdir
# list + the unit's ReadWritePaths= stay in one place.
# (Original block referenced faas-imaged.service; see the matching
# task in compute_only_service/tasks/main.yml.)

# Public-release billing — soft assert on Polar provider secrets (operator warning).
# When Polar is selected (or the selector is omitted), the apid and meterd
# daemons fail closed without the access token. Surface the missing token
# before systemd attempts the restart; the daemon remains the authoritative
# fail-closed gate and this task intentionally stays a warning.
- name: control_plane_service — soft assert Polar access token present
  ansible.builtin.shell: |
    set -euo pipefail
    if grep -qE '^FAAS_BILLING_PROVIDER=polar$' /etc/faas/sealed.env 2>/dev/null \
      || ! grep -qE '^FAAS_BILLING_PROVIDER=' /etc/faas/sealed.env 2>/dev/null; then
      if ! grep -qE '^FAAS_POLAR_ACCESS_TOKEN=.' /etc/faas/sealed.env; then
        echo "WARNING: Polar is the active billing provider but FAAS_POLAR_ACCESS_TOKEN is missing or empty; apid and meterd will refuse to boot. Fill in /etc/faas/sealed.env before restarting the daemons."
        exit 0
      fi
      echo "Polar billing provider selected — FAAS_POLAR_ACCESS_TOKEN present (catalog tripwire deferred to verify-secrets.sh + daemon-level fail-closed)."
    fi
  args:
    executable: /bin/bash
  changed_when: false
  register: faas_polar_soft_assert
- name: control_plane_service — debug Polar soft assert
  ansible.builtin.debug:
    msg: "{{ faas_polar_soft_assert.stdout }}"
  when: faas_polar_soft_assert.stdout != ""

# Issue #246 / ADR-115 / spec G4 closure — mail transport must
# be selected (or dev-mode explicit) before the daemon boots in
# production. The pkg/mail factory refuses to boot on a non-dev
# box with FAAS_MAIL_TRANSPORT unset or unrecognised (issue #246
# extends the ADR-115 D5 fail-closed contract from "credential
# missing" to "transport unselected"). The ansible role mirrors
# that contract so an operator sees the gap at playbook time,
# not at the systemd journal after a daemon-reload.
#
# Belt-and-braces: a literal `FAAS_MAIL_TRANSPORT=log` is also
# asserted here, because the operator almost certainly meant
# `resend` (or `postmark`) and silently booting with a journal-
# only sender in production will miss every dunning + quota
# notice. The dev-mode escape hatch is FAAS_DEV=1.
- name: control_plane_service — assert FAAS_MAIL_TRANSPORT selected (issue # 246 / ADR-115)
  ansible.builtin.shell: |
    set -euo pipefail
    sealed=/etc/faas/sealed.env
    if [ ! -f "$sealed" ]; then
      echo "FAIL: $sealed missing — fill it before running this role on a production box."
      exit 1
    fi
    transport="$(grep -E '^FAAS_MAIL_TRANSPORT=' "$sealed" 2>/dev/null | head -1 | cut -d= -f2- || true)"
    dev="$(grep -E '^FAAS_DEV=' "$sealed" 2>/dev/null | head -1 | cut -d= -f2- || true)"
    # PR #1191 fixup: trim + lowercase the FAAS_DEV value before the
    # literal match so the playbook accepts the same truthy set the
    # Go side does — pkg/mail.IsDevMode accepts 1/true/yes/on
    # case-insensitively (devTruthyLiterals). An operator setting
    # FAAS_DEV=true used to see this playbook FAIL even though the
    # daemon would have booted. Empty / "0" / unset stay production.
    dev_norm="$(printf '%s' "${dev:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
    case "$transport" in
      resend|postmark|noop)
        # live transport — credentials are the operator's responsibility.
        # The pkg/mail factory fails closed on a missing credential
        # so we don't double-assert here.
        echo "mail transport = $transport (prod)"
        ;;
      log|"")
        case "$dev_norm" in
          1|true|yes|on)
            echo "mail transport = ${transport:-unset} + FAAS_DEV=$dev (dev)"
            ;;
          *)
            echo "FAIL: FAAS_MAIL_TRANSPORT=${transport:-unset} on a non-dev box — apid + meterd will refuse to boot. Set FAAS_MAIL_TRANSPORT=resend (or postmark / noop) or FAAS_DEV=1 (or true/yes/on)."
            exit 1
            ;;
        esac
        ;;
      *)
        echo "FAIL: FAAS_MAIL_TRANSPORT=$transport is not a known transport (resend|postmark|log|noop). apid will refuse to boot."
        exit 1
        ;;
    esac
  args:
    executable: /bin/bash
  changed_when: false
  register: faas_mail_transport_assert
- name: control_plane_service — debug mail transport assert
  ansible.builtin.debug:
    msg: "{{ faas_mail_transport_assert.stdout }}"
  when: faas_mail_transport_assert.stdout != ""
