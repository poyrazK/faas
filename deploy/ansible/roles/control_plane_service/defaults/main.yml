---
# ADR-1189: provision the Safe Deploy service-token pair when missing, so
# canary progression, alert rollbacks and stuck-canary recovery run. Set false
# before removing the tokens to switch Safe Deploy off.
faas_safe_releases_enabled: true
faas_dev_bridge_enabled: false
# ADR-740 developer live source patches. Must match vmmd_service's value:
# apid publishes patches and vmmd serves them to developer environments.
faas_dev_patch_delivery_enabled: false
# ADR-1161 `gregale run --image` (POST /v1/image-runs). Enable only once the
# image-run migration and the imaged that writes image-config columns are
# deployed.
faas_image_runs_enabled: false
faas_dev_bridge_gateway_url: http://127.0.0.1:8080
faas_dev_bridge_database_url: postgres:///faas?host=/run/postgresql&user=faas
# Managed meterd configuration is enabled by the manifest-generated
# control-plane host_vars. Existing operator-owned /etc/faas/meterd.toml
# files remain untouched unless this flag is explicitly true.
faas_meterd_config_managed: false
faas_meterd_config_path: /etc/faas/meterd.toml
faas_meterd_schedd_socket: /run/faas/schedd.sock
faas_meterd_egress_socket: ""
faas_meterd_schedd_tls_cert_path: ""
faas_meterd_schedd_tls_key_path: ""
faas_meterd_schedd_tls_ca_path: ""
faas_meterd_egress_tls_cert_path: /etc/faas/tls/meterd/egress-client.crt
faas_meterd_egress_tls_key_path: /etc/faas/tls/meterd/egress-client.key
faas_meterd_egress_tls_ca_path: /etc/faas/tls/ca/ca.crt

# Initial public beta runs without charging. Set to live at the launch-date
# transition to activate provider delivery and reconciliation paging.
faas_billing_mode: disabled

# Public uptime starts at the beta launch boundary. Buckets before this UTC
# instant are labelled pre_release and excluded from coverage and uptime.
faas_public_status_launch_at: "2026-09-14T00:00:00Z"

# ADR-520: custom domains served by the platform's own edge. Rendered from the
# manifest's public_edge.custom_domains. The target must resolve straight to
# the public edge (not through a proxying CDN); the addresses are offered for
# zone-apex A/AAAA records.
faas_custom_domain_tls: false
faas_custom_domain_target: ""
faas_custom_domain_addresses: []

# ADR-847 amendment 1: synthetic route probes are on. They are the evidence an
# ADR-1446 safe release of a quiet app advances on, about a minute per stage;
# without them every stage waits out CanaryLowTrafficMaxHold. apid sends them
# to this control plane's own gatewayd-public listener (FAAS_PUBLIC_LISTEN_ADDR
# in faas-gatewayd-public.service, the public edge's upstream), the path the
# metal tests exercise, not through the CDN. false turns probes off.
route_probes_enabled: true
faas_route_probe_url: http://127.0.0.1:8080

# ADR-1141 cluster workload-identity trust (tasks/workload_trust.yml). The
# same controller-side directory as vmmd_service's
# faas_workload_identity_source_dir installs the JWKS apid verifies workload
# tokens against; leave it empty to keep an operator-placed JWKS. An empty
# issuer trusts vmmd's default (https://identity.gregale.dev).
faas_workload_identity_source_dir: ""
faas_workload_jwks_path: /etc/faas/workload-identity.jwks.json
faas_workload_identity_issuer: ""

# ADR-989 app outbound relay listener (tasks/outbound_relay.yml). Empty keeps
# the relay off. A split box sets "tcp://0.0.0.0:8096", where compute vmmd
# dials it (faas_vmmd_outbound_relay_target): this role then issues
# outboundd's relay server leaf. A single box sets
# "unix:///run/faas/outboundd-relay.sock". Either needs the workload-identity
# JWKS above. Turn the compute side on with vmmd_service's
# faas_vmmd_outbound_relay_tls_managed.
faas_outboundd_relay_listen: ""
# ADR-1736: schedd's listen address, rendered into both schedd's
# FAAS_SCHEDD_LISTEN_ADDR and faas-schedd.socket. The split-box manifest sets
# it from daemons.schedd.bind. Empty keeps schedd.toml in charge and leaves the
# durable socket off.
faas_schedd_listen_addr: ""

# ADR-20261023104734: log each control-plane daemon in as its own faas_runtime
# member instead of the schema owner `faas`. Off until the postgres role has
# converged the runtime roles on this cluster; the opt-in proves every role's
# peer login before any unit moves. Each entry's os_user must match the unit's
# User= and its faas_map line in the postgres role.
faas_postgres_runtime_roles_enabled: false
faas_postgres_runtime_role_units:
  - { unit: faas-apid, os_user: faas-apid, role: faas_apid, restart: restart faas-apid }
  - { unit: faas-apid-clone-worker, os_user: faas-apid, role: faas_apid, restart: restart faas-apid-clone-worker }
  - { unit: faas-apid-data-pipeline-worker, os_user: faas-apid, role: faas_apid, restart: restart faas-apid }
  - { unit: faas-apid-data-pipeline-alert-worker, os_user: faas-apid, role: faas_apid, restart: restart faas-apid }
  - { unit: faas-schedd, os_user: faas-schedd, role: faas_schedd, restart: restart faas-schedd }
  - { unit: faas-meterd, os_user: faas-meterd, role: faas_meterd, restart: restart faas-meterd }
  - { unit: faas-outboundd, os_user: faas-outboundd, role: faas_outboundd, restart: restart faas-outboundd }
  - { unit: faas-bridged, os_user: faas-bridged, role: faas_bridged, restart: restart faas-bridged }
  - { unit: faas-mcp-bridge, os_user: faas-mcp-bridge, role: faas_mcp_bridge, restart: restart faas-mcp-bridge }

# ADR-20261026195952: the hosted management MCP server at
# https://api.<platform domain>/mcp. On by default: the role generates its
# state key (/etc/faas/secrets/mcp-bridge/state.key) on first converge.
# Setting this false, with gatewayd_public_service's faas_mcp_bridge_enabled,
# stops it and removes its route.
faas_mcp_bridge_enabled: true
