---
# geoip (ADR-143) — stage the GeoIP country database gatewayd-internal reads
# for `kind=geo` edge rules (ADR-091 D21). Before this role existed the
# daemon defaulted to a path nothing provisioned, and applyEdgeRuleGeo
# silently skipped every geo rule (fail-open) — a customer who blocked a
# country got no error and no block.
#
# Source: DB-IP IP-to-Country Lite, CC BY 4.0 (attribution shipped next to
# the file). The monthly release is pinned by name AND SHA-256; bumping the
# month is a deliberate PR that re-pins both checksums (same pattern as the
# firecracker / prometheus roles). FAAS_GEOIP_AUTO_REFRESH stays 0 in code
# so the daemon never fetches on its own: refresh = re-run bootstrap.
faas_geoip_enabled: true
faas_geoip_release: "2026-09"
faas_geoip_url: "https://download.db-ip.com/free/dbip-country-lite-{{ faas_geoip_release }}.mmdb.gz"
# sha256 of the .mmdb.gz as downloaded
faas_geoip_gz_sha256: "cb0578ce59f569f2c933bb40feb820804a334855a60739011b0a89cab1d6e4ed"
# sha256 of the decompressed .mmdb (what the daemon opens)
faas_geoip_sha256: "d284ae2e7427fe33d83465e1506b2b21aae47eb8a9b099f8f4dac6a98c99f041"
# Must equal the cmd/gatewayd-internal default for FAAS_GEOIP_DB_PATH.
faas_geoip_dir: /var/lib/faas/geoip
faas_geoip_db_path: "{{ faas_geoip_dir }}/dbip-country-lite.mmdb"

# ADR-910: DB-IP ASN Lite (same licence, release cadence and pinning) backs
# the edge-rule `asn` match field. Must equal the cmd/gatewayd-internal
# default for FAAS_GEOIP_ASN_DB_PATH.
faas_geoip_asn_enabled: true
faas_geoip_asn_release: "2026-09"
faas_geoip_asn_url: "https://download.db-ip.com/free/dbip-asn-lite-{{ faas_geoip_asn_release }}.mmdb.gz"
faas_geoip_asn_gz_sha256: "25f5c2e9b98d1a479567e654927c6b34867aaadc96a01ee25d5790c478685ab5"
faas_geoip_asn_sha256: "ab07c764a10c4f8c2f3539377fa86e5c928243084aafd359d1be4cb8543d7406"
faas_geoip_asn_db_path: "{{ faas_geoip_dir }}/dbip-asn-lite.mmdb"
