---
# Profiling remains operator-only until native lifecycle acceptance passes.
# Stage the unit; enable it explicitly after the backend is configured.
- name: profiled_service — install CPU profile daemon unit
  ansible.builtin.copy:
    src: faas-profiled.service
    dest: /etc/systemd/system/faas-profiled.service
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-profiled

- name: profiled_service — create role drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-profiled.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: profiled_service — install host role drop-in
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-profiled.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-profiled
