# systemd 253 introduced per-unit LogFilterPatterns. Gregale's supported
# Ubuntu 24.04 hosts ship a newer systemd; fail closed on an older image so a
# rollout cannot silently reintroduce the dispatcher log storm.
faas_networkd_dispatcher_ephemeral_filter: true
faas_networkd_dispatcher_log_filter_min_systemd: 253

# ADR-958 split-box guest trace exports reuse vmmd's node-identity
# apid-client leaf (pkg/pki RoleUsesNodeIdentity).
vmmd_apid_client_tls_cert_path: /etc/faas/tls/vmmd/apid-client.crt
vmmd_apid_client_tls_key_path: /etc/faas/tls/vmmd/apid-client.key
vmmd_apid_client_tls_ca_path: /etc/faas/tls/ca/ca.crt

# ADR-989 app outbound relay. The manifest sets the split-box target to
# tcp://outboundd.faas:8096; single-box hosts may set
# unix:///run/faas/outboundd-relay.sock to match outboundd's relay_listen.
faas_vmmd_outbound_relay_target: ""
vmmd_outbound_client_tls_cert_path: /etc/faas/tls/vmmd/outboundd-client.crt
vmmd_outbound_client_tls_key_path: /etc/faas/tls/vmmd/outboundd-client.key
vmmd_outbound_client_tls_ca_path: /etc/faas/tls/ca/ca.crt

# ADR-149 prepared networks: vmmd keeps this many unused wake namespaces
# (netns + TAP + nft) ready so a restore claims one instead of building it.
# The code default is 0 (off). PR #4396 measured the restore p95 target only
# with 4 prepared networks; production-us without them paid setup_network
# 64-77 ms on every wake (hunt #9). 0 disables; the API bound is 0-16.
vmmd_prepared_networks: 4

# ADR-20261024225612 Firecracker CPU template every guest boots with. Set one
# value for every compute node of a cell: "T2CL" lets Intel Cascade Lake and
# Ice Lake nodes share snapshots, "T2S" Skylake + Cascade Lake, "C3"/"T2"
# Skylake through Ice Lake, "T2A" AMD Milan. vmmd refuses to start on a CPU
# the template does not list. Changing it makes every app cold-boot once.
# Empty (the default) keeps the host's CPUID and installs no drop-in.
vmmd_cpu_template: ""

# vmmd restart adoption (docs/adr/20261017-vmmd-restart-adoption.md): with
# all three on, a rollout restarts vmmd without draining the node when the
# new vmmd adopts every live guest (node_join.yml asks `vmmd adoption-check`).
# Rendered as FAAS_VMMD_* environment: a switch that is on overrides vmmd.toml,
# one that is off leaves vmmd.toml (default off) in charge. node_join.yml
# renders the same switches on every rollout (zz-faas-adoption.conf), so a
# host var change needs no bootstrap convergence. Off by default; turn them on
# in this order only:
# - vmmd_adoption_record writes the version-7 adoption blocks. Turn it on only
#   once every compute node and any rollback target reads version 7.
# - vmmd_adopt_running_vms adopts running guests at startup; needs the record.
#   The first rollout after turning it on still drains (the serving vmmd wrote
#   no blocks); later ones can skip the drain.
# - vmmd_adopt_admitted_runtimes also adopts runtime-admitted guests (ADR-595
#   re-bind); needs vmmd_adopt_running_vms.
# Set them per host (host_vars) to canary one node.
vmmd_adoption_record: false
vmmd_adopt_running_vms: false
vmmd_adopt_admitted_runtimes: false

# ADR-740 developer live source patches. Must match control_plane_service's
# value: apid publishes patches and vmmd serves them to developer environments.
faas_dev_patch_delivery_enabled: false

# ADR-1141 cluster workload-identity signing key (tasks/workload_identity.yml).
# Point faas_workload_identity_source_dir at the controller-side directory
# `gregalectl workload-identity init|rotate --out DIR` wrote to install the key;
# leave it empty to keep an operator-placed key. Must match
# control_plane_service's source dir and issuer, which install the JWKS apid
# trusts. An empty issuer keeps vmmd's default (https://identity.gregale.dev).
faas_workload_identity_source_dir: ""
faas_workload_identity_key_path: /etc/faas/secrets/workload-identity.key
faas_workload_identity_kid_path: /etc/faas/secrets/workload-identity.kid
faas_workload_identity_issuer: ""
