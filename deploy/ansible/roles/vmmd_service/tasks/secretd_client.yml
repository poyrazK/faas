---
# ADR-20261110210000 §3 slice 3c: vmmd opens app secrets through the control
# plane's secretd. Its client leaf is a fleet-PKI feature leaf (pkg/pki
# secret-opener) whose CN is this node's compute_nodes.name: secretd opens an
# app's secrets only for its owner node or a peer the owner granted. Only the
# CA's host issues it: the control plane writes it into a per-node staging
# directory and this node copies it in. A run keeps a leaf valid for 30 days
# or more, so this is also its renewal. vmmd is root and reads the leaf at
# start, so a new leaf restarts it.
- name: vmmd_service — require an issuer and bound secrets for secretd (ADR-20261110210000)
  ansible.builtin.assert:
    that:
      - (faas_box_role | default('single-box')) == 'compute-only'
      - faas_secretd_target is match('^tcp://[^/]+:[0-9]+$')
      - faas_vmmd_secretd_tls_issuer_host | length > 0
      - faas_node_name | default('') is match('^[A-Za-z0-9._-]+$')
      - not (faas_vmmd_secretd_open | default(false) | bool) or (faas_seal_domain_runtime_binding_required | default(false) | bool)
    fail_msg: >-
      faas_secretd_target is for a compute node and must be secretd's
      tcp://<control plane private address>:<port>. The leaf is issued on the
      control plane: the inventory needs a control_plane host and this node's
      faas_node_name. secretd refuses unbound envelopes, so
      faas_vmmd_secretd_open needs faas_seal_domain_runtime_binding_required.

- name: vmmd_service — issue vmmd's secretd client leaf on the control plane (ADR-20261110210000)
  ansible.builtin.command:
    argv: [/usr/local/bin/gregalectl, pki, issue-feature, --feature, secret-opener, --box-role, compute-only,
           --cn, "{{ faas_node_name }}", --ca-dir, /etc/faas/tls,
           --root-dir, "/var/lib/faas/pki-features/{{ faas_node_name }}"]
  delegate_to: "{{ faas_vmmd_secretd_tls_issuer_host }}"
  register: faas_vmmd_secretd_tls_issued
  changed_when: (faas_vmmd_secretd_tls_issued.stdout | from_json).issued | length > 0

- name: vmmd_service — read the staged secretd client leaf (ADR-20261110210000)
  ansible.builtin.slurp:
    src: "/var/lib/faas/pki-features/{{ faas_node_name }}/secretd-client/{{ item }}"
  delegate_to: "{{ faas_vmmd_secretd_tls_issuer_host }}"
  register: faas_vmmd_secretd_tls_staged
  loop: [vmmd.crt, vmmd.key]
  no_log: true

- name: vmmd_service — create vmmd's secretd client leaf directory (ADR-20261110210000)
  ansible.builtin.file:
    path: /etc/faas/tls/secretd-client
    state: directory
    owner: root
    group: root
    mode: "0755"

# vmmd runs as root, so the key stays root-only like vmmd's other leaves.
- name: vmmd_service — install vmmd's secretd client leaf (ADR-20261110210000)
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "/etc/faas/tls/secretd-client/{{ item.item }}"
    owner: root
    group: root
    mode: "{{ '0400' if item.item.endswith('.key') else '0444' }}"
  loop: "{{ faas_vmmd_secretd_tls_staged.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  notify:
    - restart faas-vmmd
    - restart faas-schedd for secretd
