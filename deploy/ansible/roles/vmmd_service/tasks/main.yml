# vmmd_service — install systemd unit + example config for vmmd (spec §4.4).
#
# This role does NOT enable or start the daemon: vmmd is the only root
# component and runs only on the EX44 hardware. The ansible role ships
# the unit + example toml in place; the operator runs `systemctl enable
# --now faas-vmmd` once the box has been provisioned with a /srv/fc/base
# kernel and the firecracker binary. The `faas-vmmd` system user is
# created by this role (see below) — it is required for the vmmd
# socket at /run/faas/vmmd.sock to chown correctly.

- name: vmmd_service — install /etc/faas (create dir, mode 0750)
  ansible.builtin.file:
    path: /etc/faas
    state: directory
    owner: root
    group: faas
    mode: "0750"

- name: vmmd_service — drop example TOML (operator copies to vmmd.toml)
  ansible.builtin.copy:
    src: vmmd.toml.example
    dest: /etc/faas/vmmd.toml.example
    owner: root
    group: faas
    mode: "0640"

- name: vmmd_service — install shared storage env example
  ansible.builtin.copy:
    src: ../../_shared/files/storage.env.example
    dest: /etc/faas/storage.env.example
    owner: root
    group: faas
    mode: "0640"

- name: vmmd_service — install systemd unit
  notify: restart faas-vmmd
  ansible.builtin.copy:
    src: faas-vmmd.service
    dest: /etc/systemd/system/faas-vmmd.service
    owner: root
    group: root
    mode: "0644"
  register: vmmd_unit

- name: vmmd_service — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: vmmd_unit.changed

- name: vmmd_service — create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-vmmd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the vmmd unit so [compute_node].name resolves to the
# canonical host identity at self-registration. The drop-in mirrors
# deploy/ansible/roles/control_plane_service/templates/
# 99-faas-node-name.conf.j2 — body is identical across roles.
- name: vmmd_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  notify: restart faas-vmmd
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-vmmd.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to vmmd via FAAS_VMMD_ROLE so cmd/vmmd/config.go picks
# up faas_box_role (control-plane / compute-only / single-box)
# host_vars value. See roles/vmmd_service/templates/99-faas-role.conf.j2
# for the full rationale (single-box fallback, drop-in wins,
# idempotent).
- name: vmmd_service — install FAAS_VMMD_ROLE drop-in (Mega-PR-C)
  notify: restart faas-vmmd
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-vmmd.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"

- name: vmmd_service — install manifest-derived schedd target
  ansible.builtin.template:
    src: 99-faas-schedd-target.conf.j2
    dest: /etc/systemd/system/faas-vmmd.service.d/99-faas-schedd-target.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-vmmd

# Public multi-box release gate: vmmd must receive both routing values from
# inventory. Without this assertion an operator can bootstrap a compute box
# that self-registers its unix socket and later repair compute_nodes by hand.
- name: vmmd_service — require canonical compute-node routing
  ansible.builtin.assert:
    that:
      - faas_vmmd_listen_addr is defined
      - (faas_vmmd_listen_addr | default('') | length) > 0
      - faas_vmmd_target_url is defined
      - (faas_vmmd_target_url | default('') | length) > 0
    fail_msg: >-
      compute-only vmmd requires faas_vmmd_listen_addr and
      faas_vmmd_target_url in host_vars; do not patch compute_nodes.target_url
      manually after boot.
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: vmmd_service — install canonical routing drop-in
  notify: restart faas-vmmd
  ansible.builtin.template:
    src: 99-faas-routing.conf.j2
    dest: /etc/systemd/system/faas-vmmd.service.d/99-faas-routing.conf
    owner: root
    group: root
    mode: "0644"
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: vmmd_service — ensure 'faas' group exists (socket auth group, ADR-015)
  ansible.builtin.group:
    name: faas
    state: present
    system: true

# Owner of the vmmd unix socket. The runtime toml default
# `owner_user = "faas-vmmd"` (cmd/vmmd/config.go::Config.OwnerUser,
# see deploy/ansible/roles/vmmd_service/files/vmmd.toml.example
# for the canonical reference copy) requires this uid to exist on
# the host — pkg/wire/ListenOrRecreate looks it up via user.Lookup
# to chown the socket (pkg/wire/grpc.go:340-343). Without it,
# the 61fedaa and earlier binaries refuse to bind
# (`user.Lookup("faas-vmmd"): no such user`) and the for-loop
# in pkg/wire/ListenOrRecreate fails before vmmd reaches
# `vmmd ready`. The 8f90e2a5 fallback (silently set daemonUser=""
# on lookup error) hides the gap on the latest build but is
# not present in the rollback binary — so a post-rollback box
# goes into a crash loop on this single missing user.
#
# Bootstrapping this user is the only host-side fix that closes
# the gap for both the current and the rollback binaries.
# Mode: nologin, no home dir, no password — vmmd is a daemon,
# never a login target. Group membership is `faas` so the
# sibling CHOWN in ListenOrRecreate groups the socket correctly.
# Idempotent: ansible.user with state=present is a no-op when
# the uid already exists.
- name: vmmd_service — ensure 'faas-vmmd' system user exists (vmmd socket owner)
  ansible.builtin.user:
    name: faas-vmmd
    group: faas
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    password: "*"

# G7 idle-reaper telemetry: vmmd is the privileged compute-side reader of
# conntrack. Install the distro package through Ansible's provider-neutral
# package abstraction so the same bare-metal play works on GCP, Hetzner, and
# OVH Ubuntu images without a provider-specific bootstrap step.
- name: vmmd_service — install conntrack userspace reader
  ansible.builtin.package:
    name: conntrack
    state: present

# ADR-053: parent-base loopback mount scratch dir. vmmd owns the
# loopback mounts (cmd/vmmd/main.go wires pkg/vmmdmount.Registry)
# and imaged reads through them, so the directory must be writable
# by vmmd and traversable by imaged. /srv/fc is already in
# imaged's ReadWritePaths= (deploy/systemd/faas-imaged.service); the
# 0750 root:faas mode lets the faas-imaged uid traverse the parent
# to reach the mountpoint subdirs. Both daemons carry
# PrivateTmp=yes so /srv/fc is the only cross-namespace shared path
# that survives systemd's per-daemon tmpfs isolation.
- name: vmmd_service — ensure /srv/fc/parent exists (ADR-053 mount scratch)
  ansible.builtin.file:
    path: /srv/fc/parent
    state: directory
    owner: root
    group: faas
    mode: "0750"

# Tier 1 control-plane mTLS (ADR-052). vmmd on a multi-box
# compute node is one of the daemons that runs gregalectl pki
# init; the operator-side bootstrap lays out
# /etc/faas/tls/vmmd/{server,schedd-client,apid-client}.crt.
# Failing this stat-assert surfaces a missing bootstrap before
# vmmd attempts to start and refuses to bind with a confusing
# TLS handshake error.
- name: vmmd_service — assert vmmd PKI leaves exist (Tier 1)
  ansible.builtin.stat:
    path: "/etc/faas/tls/vmmd/{{ item }}.crt"
  loop:
    - server
    - schedd-client
    - apid-client
  register: faas_pki_vmmd_leaf_stat
  failed_when: not faas_pki_vmmd_leaf_stat.stat.exists

# Tier 1 Phase 2 / ADR-053 — the slice-3 per-node CapacityReport
# signing key. Generated by `gregalectl node-key init` (operator-side
# bootstrap; the matching CLI lives in cmd/gregalectl/commands_node_key.go)
# and consumed by vmmd's loadNodeSigningKey on startup. The loader
# is strict on 0o400 root:root (it refuses to start with anything
# looser — errNodeKeyInsecure in cmd/vmmd/main.go), so this ansible
# stat-assert is the load-bearing tripwire that catches a
# misconfigured bootstrap BEFORE vmmd boots and crashes with a
# confusing mode error. Failure mode here = playbook halts with
# "node.key wrong mode", which is the runbook-friendly signal.
#
# Symmetric to the host.age tripwire in the control_plane_service
# role: both are root-owned daemon secrets with mode 0400, both
# loaded by the consumer daemon with a strict perm check, both
# gated by an ansible stat-assert.
- name: vmmd_service — assert node.key mode is 0400 root:root (ADR-053)
  ansible.builtin.stat:
    path: /etc/faas/secrets/vmmd/node.key
  register: faas_node_key_stat
- name: vmmd_service — fail loud if node.key missing or loose (ADR-053)
  ansible.builtin.fail:
    msg: >-
      /etc/faas/secrets/vmmd/node.key mode {{ faas_node_key_stat.stat.mode | default('absent') }}
      {{ faas_node_key_stat.stat.pw_name | default('?') }}:{{ faas_node_key_stat.stat.gr_name | default('?') }} —
      want 0400 root:root. Re-run `gregalectl node-key init` from the
      multi-host rollout runbook (docs/runbooks/multi-host-rollout.md
      §3 "Bootstrap: node signing key").
  when: >-
    not faas_node_key_stat.stat.exists
    or faas_node_key_stat.stat.mode != "0400"
    or faas_node_key_stat.stat.pw_name != "root"
    or faas_node_key_stat.stat.gr_name != "root"

# Issue #585 / ADR-127 — per-daemon secret file perm-asserts. The
# shared block covers ALL new per-daemon secret files (vmmd owns
# host.age.pub; the rest are checked here as defense in depth).
# Each assert is a no-op when the file is absent (operator-
# provisioned via `gregalectl secrets init`).
- name: vmmd_service — sealed.env split perm-asserts (issue # 585 / ADR-127)
  ansible.builtin.include_tasks: ../../_shared/tasks/sealed_env_split_perm_asserts.yml
