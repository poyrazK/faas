---
# fleet_verify (ADR-143) — prove the host converged, don't assume it.
#
# Roles ship units but do not enable/start them (the operator runs
# `gregalectl secrets init` + `systemctl enable --now` once). So on the
# FIRST bootstrap every unit is disabled and there is nothing to verify;
# on every later run the units are enabled and a daemon that did not come
# back after a config change is exactly the failure this role catches.
#
# faas_verify_strict=true (the standalone verify.yml playbook) turns a
# disabled-but-allowed unit into a failure too — use it after activation.
faas_verify_strict: false
faas_verify_probe_timeout_s: 15
# Dependency-aware /readyz checks run after the unit is active. The response
# body is retained in the failure message so a failed verify names the broken
# dependency instead of only reporting an unreachable port.
faas_verify_readyz_timeout_s: 2
faas_verify_readyz_retries: 30
# imaged reconciles every runtime base assigned to the node before it becomes
# ready. A new base generation includes extraction and vulnerability scanning,
# which can legitimately take several minutes on HDD-backed nodes. Keep the
# short failure window for every other daemon while allowing that bounded
# startup work to finish.
faas_verify_readyz_retries_by_unit:
  faas-imaged.service: 600
faas_verify_readyz_delay_s: 2
faas_verify_run_doctor: true
faas_verify_gregalectl: /usr/local/bin/gregalectl
