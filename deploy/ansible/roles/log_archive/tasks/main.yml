# log_archive — operator wiring for the issue #562 log archive pipeline.
#
# This role is the *post-PR-A* half of issue #562: the in-process
# shippers (apid and vmmd, pkg/logarchive) and the bucket-proxy read-back
# (gatewayd-internal, cmd/gatewayd-internal/app_logs_archive.go) are
# already wired at the Go level. What ships here is the operator
# surface that lets those two daemons share a single unsealed
# credential envelope without each one re-running host.age unseal
# at boot.
#
# Concretely this role:
#   1. Fail-closed asserts on the operator-provisioned
#      /etc/faas/secrets/storage-box/archive-creds.json envelope
#      (mode/owner/group must match the canonical pattern).
#   2. Creates the local spool roots /var/log/faas/archive and
#      /var/log/faas/vmmd-archive (faas:faas, 0750) so both
#      shippers have somewhere to retain files before upload. Spec §11.
#   3. Removes the legacy gatewayd-internal archive drop-in. The shared
#      optional_credentials role owns conditional projection for every daemon.
#
# What this role does NOT do (and why):
#   * No cron purge unit — the apid shipper's PurgeInterval
#     ticker (pkg/logarchive/shipper.go:125) already sweeps
#     the local spool on the same 5-minute cadence the
#     spec calls for. Adding a second systemd timer would
#     race the in-process purger on the same files; the
#     the apid shipper is the canonical owner. The bucket-
#     side retention is enforced by the customer's plan
#     (Plan.LogArchiveRetentionDays, plan-gated at the
#     gatewayd-internal handler — Hobby 7d / Pro 30d /
#     Scale 90d) and by the S3 lifecycle policy the
#     operator attaches when the bucket is provisioned
#     (NOT a faas concern; documented in the runbook).
#   * No `gregalectl backup unseal-archive-creds` invocation
#     here — that CLI ships in PR-A and the operator
#     runs it once during bootstrap.sh step 11d (RETIRED
#     2026-08-15 by issue #911 / PR-1; v2 path is PR-X
#     `gregalectl secrets init`); mirrors the unseal-rclone
#     flow at deploy/ansible/roles/postgres/files/
#     postgresql@.service.d/99-faas-off-host-backup.conf).
#     This role assumes the
#     envelope is already on disk; the assert catches
#     any future perms drift.
#   * No S3 lifecycle policy attachment — that's an
#     operator action on the bucket itself; see the
#     runbook FaasLogArchiveShipperDegraded.md "Bucket
#     lifecycle policy" section for the recommended shape.
#
# Idempotency: `copy` overwrites cleanly; `file` for the spool
# root is a no-op on a converged box; the asserts are read-only.
# Re-running produces zero `changed`.

# GCE production uses the attached service account, so this envelope contains
# routing metadata only. Converging it here keeps apid, vmmd, and the archive
# read path on one source of truth and repairs an old two-byte placeholder.
- name: log_archive — create archive credential directory for metadata auth
  ansible.builtin.file:
    path: /etc/faas/secrets/storage-box
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: faas_log_archive_bucket | trim | length > 0

- name: log_archive — converge keyless archive metadata envelope
  ansible.builtin.copy:
    dest: /etc/faas/secrets/storage-box/archive-creds.json
    owner: root
    group: root
    mode: "0400"
    content: >-
      {{ {
        'endpoint': faas_log_archive_endpoint,
        'region': faas_log_archive_region,
        'bucket': faas_log_archive_bucket,
        'auth_mode': faas_log_archive_auth_mode
      } | to_nice_json }}
  when: faas_log_archive_bucket | trim | length > 0
  notify:
    - daemon-reload log_archive
    - activate log archive configuration

# Fail-closed assert: the archive creds envelope MUST be 0400
# root:root. PID 1 reads this source and systemd stages a
# service-scoped copy under `$CREDENTIALS_DIRECTORY` for each
# daemon. The daemon users never read the source file directly.
- name: log_archive — stat archive creds envelope
  ansible.builtin.stat:
    path: /etc/faas/secrets/storage-box/archive-creds.json
  register: log_archive_creds_stat
  failed_when: false  # chroot/CI may not have /etc/faas/secrets

- name: log_archive — require archive credentials on public fleets
  ansible.builtin.assert:
    that:
      - log_archive_creds_stat.stat.exists
      - (log_archive_creds_stat.stat.size | default(0) | int) > 2
    fail_msg: >-
      This fleet advertises customer log retention, but
      /etc/faas/secrets/storage-box/archive-creds.json is missing or still a
      placeholder. Provision the off-host bucket credentials before rollout.
  when: faas_log_archive_required | bool

# Skipped in chroot/CI (no /etc/faas/secrets/ yet). On a real
# production box the v1 bootstrap.sh step that unseals host.age-sealed
# secrets into the staging dir is required before this role
# passes (RETIRED 2026-08-15 by issue #911 / PR-1; v2 path is
# PR-X `gregalectl secrets init`) — same shape as the postgres_backup
# perms assert.
- name: log_archive — assert creds envelope matches perms profile
  ansible.builtin.assert:
    that:
      - log_archive_creds_stat.stat.exists
      - log_archive_creds_stat.stat.mode == "0400"
      - log_archive_creds_stat.stat.pw_name == "root"
      - log_archive_creds_stat.stat.gr_name == "root"
    fail_msg: >-
      /etc/faas/secrets/storage-box/archive-creds.json must be
      0400 root:root (issue #562). Re-run `gregalectl backup
      unseal-archive-creds` (PR-A CLI leaf) to repopulate from
      the host.age-sealed form. systemd reads the source as root
      and stages it privately for apid, vmmd, and gatewayd-internal.
  when: log_archive_creds_stat.stat.exists

- name: log_archive — validate archive credential fields without exposing secrets
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import json,sys;
        d=json.load(open(sys.argv[1], encoding='utf-8'));
        required=('endpoint','bucket');
        assert all(isinstance(d.get(k),str) and d[k].strip() for k in required);
        hmac=all(isinstance(d.get(k),str) and d[k].strip() for k in ('key_id','secret'));
        metadata=d.get('auth_mode') == 'gcp_metadata' and not d.get('key_id') and not d.get('secret');
        assert hmac or metadata
      - /etc/faas/secrets/storage-box/archive-creds.json
  changed_when: false
  no_log: true
  when: log_archive_creds_stat.stat.exists

# Spec §11: /var/log/faas/archive is the spool root the apid
# shipper writes .partial files into (pkg/logarchive/spool.go).
# Owned by faas:faas (the daemon user) so the in-process
# shipper can mmap + rename + unlink without root. Mode 0750
# so the faas group can traverse but other users cannot list —
# the contents reveal customer instance IDs which are
# account-scoped (spec §11, §13).
- name: log_archive — create spool root /var/log/faas/archive
  ansible.builtin.file:
    path: /var/log/faas/archive
    state: directory
    owner: faas
    group: faas
    mode: "0750"
  failed_when: false  # chroot/CI may not have the faas user yet

# vmmd is the durable producer for Firecracker ring evictions. It uses a
# separate root so a single-box apid shipper cannot race the compute-side
# shipper over the same daily files.
- name: log_archive — create vmmd producer spool root
  ansible.builtin.file:
    path: /var/log/faas/vmmd-archive
    state: directory
    owner: faas
    group: faas
    mode: "0750"
  failed_when: false

# Spec §11 sanity check — refuse to claim success if the spool
# root is world-readable. Same shape as the postgres_backup
# basebackup-root mode assert. Catches a wrong umask in a
# future edit of this file.
- name: log_archive — verify spool root mode (spec §11)
  ansible.builtin.stat:
    path: /var/log/faas/archive
  register: log_archive_spool_stat
  failed_when: false
- name: log_archive — assert spool root mode ≤ 0750
  ansible.builtin.assert:
    that:
      - log_archive_spool_stat.stat.exists
      - log_archive_spool_stat.stat.mode in ["0750", "0700"]
      - log_archive_spool_stat.stat.pw_name == "faas"
      - log_archive_spool_stat.stat.gr_name == "faas"
    fail_msg: "/var/log/faas/archive must be 0750 or tighter, faas:faas (spec §11)"
  when: log_archive_spool_stat.stat.exists

- name: log_archive — verify vmmd producer spool root mode
  ansible.builtin.stat:
    path: /var/log/faas/vmmd-archive
  register: log_archive_vmmd_spool_stat
  failed_when: false
- name: log_archive — assert vmmd spool root mode ≤ 0750
  ansible.builtin.assert:
    that:
      - log_archive_vmmd_spool_stat.stat.exists
      - log_archive_vmmd_spool_stat.stat.mode in ["0750", "0700"]
      - log_archive_vmmd_spool_stat.stat.pw_name == "faas"
      - log_archive_vmmd_spool_stat.stat.gr_name == "faas"
    fail_msg: "/var/log/faas/vmmd-archive must be 0750 or tighter, faas:faas"
  when: log_archive_vmmd_spool_stat.stat.exists

# Remove the old role-owned drop-in from previously provisioned hosts. The
# optional_credentials role installs a supported directive only when the
# source exists.
- name: log_archive — remove legacy gateway archive drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-internal.service.d/99-faas-log-archive.conf
    state: absent
  notify: daemon-reload log_archive

# Reload systemd for credential projection. A changed metadata envelope also
# queues the activation handler above, which try-restarts active consumers at
# the end of the play after optional_credentials has rendered its drop-ins.
- name: log_archive — daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  failed_when: false  # chroot/CI lacks systemd
