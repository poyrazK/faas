# log_archive — daemon-reload handler (issue #562).
#
# The metadata-auth envelope has no long-lived secret and is converged by the
# role. When it changes, try-restart each active archive consumer after the
# daemon reload so the same rollout actually activates the configuration.
# Missing/inactive services are ignored because this role runs on both host
# roles and each role owns a different subset of daemons.
#
# Same shape as deploy/ansible/roles/postgres_backup/handlers/
# main.yml:13-22. The `failed_when: false` is a defensive
# fallback for chroot/CI environments without systemd; the
# main.yml daemon-reload task already runs the real reload
# and surfaces a failure on a real production box.

- name: detect systemd availability
  listen: daemon-reload log_archive
  ansible.builtin.stat:
    path: /run/systemd/system
  register: systemd_available
  failed_when: false

- name: daemon-reload log_archive
  listen: daemon-reload log_archive
  ansible.builtin.systemd:
    daemon_reload: true
  when: systemd_available.stat.exists | bool
  failed_when: false

- name: activate log archive configuration
  listen: activate log archive configuration
  ansible.builtin.command:
    argv:
      - systemctl
      - try-restart
      - "{{ item }}.service"
  loop:
    - faas-apid
    - faas-vmmd
    - faas-gatewayd-internal
  changed_when: true
  failed_when: false
  when: systemd_available.stat.exists | bool
