---
- name: s3_gateway_compute_service — daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: restart faas-s3-gatewayd-compute

# A node join defers service handlers: the node starts drained and the
# gateway starts later with gatewayd-internal.
- name: s3_gateway_compute_service — restart faas-s3-gatewayd-compute
  ansible.builtin.systemd_service:
    name: faas-s3-gatewayd-compute.service
    state: restarted
  listen: restart faas-s3-gatewayd-compute
  when: not (faas_join_defer_service_handlers | default(false) | bool)

# The app edge reads the public-read drop-in, the registry and the credential
# only at start. It restarts when they change while it serves public reads,
# or when the drop-in goes away; otherwise a registry change leaves it alone.
- name: s3_gateway_compute_service — daemon-reload for the app edge
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: restart faas-gatewayd-public-edge for public reads

- name: s3_gateway_compute_service — try-restart faas-gatewayd-public-edge
  ansible.builtin.command: systemctl try-restart faas-gatewayd-public-edge.service  # noqa: command-instead-of-module (systemd module has no try-restart)
  changed_when: true
  listen: restart faas-gatewayd-public-edge for public reads
  when:
    - not (faas_join_defer_service_handlers | default(false) | bool)
    - (faas_object_public_reads_on_compute_nodes | bool) or (faas_object_public_reads_dropin_removed is changed)

# try-restart touches only an active connector: one whose token is not staged
# yet stays inactive.
- name: s3_gateway_compute_service — daemon-reload for the connector
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: restart faas-cloudflared-s3

- name: s3_gateway_compute_service — try-restart faas-cloudflared-s3
  ansible.builtin.command: systemctl try-restart faas-cloudflared-s3.service  # noqa: command-instead-of-module (systemd module has no try-restart)
  changed_when: true
  listen: restart faas-cloudflared-s3
  when: not (faas_join_defer_service_handlers | default(false) | bool)
