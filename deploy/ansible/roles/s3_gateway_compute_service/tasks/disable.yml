---
- name: s3_gateway_compute_service — stop and disable the gateway
  ansible.builtin.systemd_service:
    name: faas-s3-gatewayd-compute.service
    state: stopped
    enabled: false
  failed_when: false

- name: s3_gateway_compute_service — remove the gateway's unit, drop-ins, registry and credential
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/faas-s3-gatewayd-compute.service
    - /etc/systemd/system/faas-s3-gatewayd-compute.service.d
    - /etc/systemd/system/faas-gatewayd-internal.service.d/50-faas-s3-gateway-wants.conf
    - /etc/faas/object-storage.json
    - /etc/faas/object-storage.control-plane.json
    - /etc/faas/secrets/object-storage/gateway-provider.env
  register: faas_object_gateway_removed

- name: s3_gateway_compute_service — reload systemd after removing the gateway  # noqa: no-handler (removal must be visible before later roles query units)
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: faas_object_gateway_removed.changed
