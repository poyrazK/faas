---
# etcd: Patroni's distributed configuration store, one member per control
# node. Private to Patroni; application leases stay in Postgres (ADR-1152 §4).
- name: postgres_ha — install etcd
  ansible.builtin.apt:
    name: etcd-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: postgres_ha — require etcd TLS material from the internal CA
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ faas_etcd_ca_file }}"
    - "{{ faas_etcd_tls_dir }}/server.crt"
    - "{{ faas_etcd_tls_dir }}/server.key"
    - "{{ faas_etcd_tls_dir }}/client.crt"
    - "{{ faas_etcd_tls_dir }}/client.key"
  register: faas_etcd_tls_files
  failed_when: not faas_etcd_tls_files.stat.exists

- name: postgres_ha — etcd data directory
  ansible.builtin.file:
    path: "{{ faas_etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: postgres_ha — etcd member configuration
  ansible.builtin.template:
    src: etcd.env.j2
    dest: /etc/default/etcd
    owner: root
    group: etcd
    mode: "0640"
  notify: restart etcd

# ADR-1152 owner decision: etcd shares the control node with Postgres but must
# not wait behind it for disk. Its own disk is the operator's part (mount it
# at faas_etcd_data_dir); the unit gets the higher I/O and CPU priority.
- name: postgres_ha — etcd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/etcd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: postgres_ha — etcd priority over PostgreSQL
  ansible.builtin.copy:
    dest: /etc/systemd/system/etcd.service.d/zz-gregale-priority.conf
    content: |
      # Managed by Ansible (postgres_ha). ADR-1152.
      [Service]
      IOSchedulingClass=best-effort
      IOSchedulingPriority=0
      Nice=-5
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload postgres_ha
    - restart etcd

- name: postgres_ha — etcd running
  ansible.builtin.systemd_service:
    name: etcd
    enabled: true
    state: started
