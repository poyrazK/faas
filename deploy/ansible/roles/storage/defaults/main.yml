---
# Provider-neutral storage contract for the Firecracker working tree.
#
# auto is intentionally conservative: an already-valid /srv/fc mount is
# reused; otherwise exactly one blank non-root disk is formatted, or exactly
# two equally-sized blank non-root disks are mirrored. A disk is eligible
# only when wipefs reports no signatures, so an existing disk is never
# silently destroyed.
faas_storage_mode: auto
faas_storage_mount: /srv/fc
faas_storage_cache_mount: /var/lib/faas/cache
# The Grype database path imaged and supply_chain_scanners use
# (grype_db_cache_dir), bound to <faas_storage_mount>/grype on compute nodes.
faas_storage_grype_mount: /var/lib/faas/grype
faas_storage_redundancy: auto
faas_storage_device: ""
# Auto-discovered blank disks are part of the provider-neutral workflow. An
# explicitly named blank device still requires operator consent.
faas_storage_format: false
# Do not accidentally consume a small scratch/ephemeral disk. Override this
# policy for a deliberately smaller test fleet.
faas_storage_min_bytes: 53687091200
faas_storage_mount_options: noatime,prjquota
faas_storage_filesystem: xfs
faas_storage_label: faas-fc

# ADR-20261109120000 slice 2: with disk encryption on, these paths are
# bind-mounted from <faas_storage_mount>/<faas_storage_private_subdir>/<name>
# (tasks/encrypted_paths.yml). Postgres paths apply to control-plane hosts.
faas_storage_private_subdir: host-private
faas_storage_encrypted_secret_paths:
  - {path: /etc/faas/secrets, name: secrets}
  # Daemon state: HMAC keys, certificates, the pgproxyd password, log drains,
  # the zswap swapfile (frozen guests' memory). Written continuously, so it
  # moves only while no faas service runs (quiesce). The OCI cache and Grype
  # mounts beneath it stay where they are.
  - {path: /var/lib/faas, name: faas, quiesce: true}
faas_storage_encrypted_postgres_paths:
  - {path: /var/lib/postgresql, name: postgresql, postgres: true}
  - {path: /var/lib/pgsql, name: pgsql, postgres: true}
