---
- name: optional_credentials — inspect source
  ansible.builtin.stat:
    path: "{{ faas_optional_credential.source }}"
  register: faas_optional_credential_source

- name: optional_credentials — inspect service unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ faas_optional_credential.service }}.service"
  register: faas_optional_credential_unit

- name: optional_credentials — create service drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ faas_optional_credential.service }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_optional_credential_unit.stat.exists
    - faas_optional_credential_source.stat.exists

- name: optional_credentials — project existing source
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ faas_optional_credential.service }}.service.d/40-faas-credential-{{ faas_optional_credential.name }}.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      LoadCredential={{ faas_optional_credential.name }}:{{ faas_optional_credential.source }}
  when:
    - faas_optional_credential_unit.stat.exists
    - faas_optional_credential_source.stat.exists
  notify: reload systemd for optional credentials

- name: optional_credentials — remove projection for absent source
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ faas_optional_credential.service }}.service.d/40-faas-credential-{{ faas_optional_credential.name }}.conf"
    state: absent
  when:
    - faas_optional_credential_unit.stat.exists
    - not faas_optional_credential_source.stat.exists
  notify: reload systemd for optional credentials
