---
# The runtime domain (ADR 20261022111812). vmmd, on compute hosts, opens
# runtime secrets at wake; apid, on control-plane hosts, seals them. vmmd is
# root and reads the identity file directly at start; it is not restarted
# here. A release restart picks the identity up, and
# faas_seal_domain_loaded{domain="runtime"} says which vmmd has it. apid seals
# to the fleet recipient until faas_seal_domain_runtime_writes is domain.
- name: seal_domains — check the runtime domain settings
  ansible.builtin.assert:
    that:
      - faas_seal_domain_runtime_writes in ['', 'fleet', 'domain']
      - faas_seal_domain_runtime_writes != 'domain' or (faas_seal_domain_runtime_readers_verified | bool)
      - faas_seal_domain_runtime_binding in ['off', 'account']
      - faas_seal_domain_runtime_binding != 'account' or (faas_seal_domain_runtime_binding_readers_verified | bool)
      - faas_box_role | default('single-box') not in ['compute-only', 'single-box'] or faas_seal_domain_runtime_identity_src | length > 0
      - faas_box_role | default('single-box') not in ['control-plane', 'single-box'] or faas_seal_domain_runtime_recipient_src | length > 0
    fail_msg: >-
      Compute and single-box hosts need faas_seal_domain_runtime_identity_src,
      control-plane and single-box hosts need
      faas_seal_domain_runtime_recipient_src, both from
      `gregalectl seal-domain init --domain runtime`. writes=domain also needs
      faas_seal_domain_runtime_readers_verified once every vmmd reports
      faas_seal_domain_loaded{domain="runtime"} 1 and the previous release
      left the rollback window. binding=account needs
      faas_seal_domain_runtime_binding_readers_verified once every vmmd runs
      a release that checks account bindings (ADR-20261023173624).

# 0400 root:root; only vmmd (root) reads it.
- name: seal_domains — install the runtime domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_runtime_identity_src }}"
    dest: /etc/faas/secrets/domains/runtime.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: faas_box_role | default('single-box') in ['compute-only', 'single-box']

- name: seal_domains — prove this node opens the runtime domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - runtime
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_runtime.prom"
      - --json
  register: faas_seal_domain_runtime_verify
  changed_when: (faas_seal_domain_runtime_verify.stdout | from_json).probe_written | default(false)
  when: faas_box_role | default('single-box') in ['compute-only', 'single-box']

- name: seal_domains — install the runtime domain recipient
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_runtime_recipient_src }}"
    dest: /etc/faas/secrets/domains/runtime.age.pub
    owner: root
    group: root
    mode: "0444"
  notify: restart faas-apid for seal domains
  when: faas_box_role | default('single-box') in ['control-plane', 'single-box']

- name: seal_domains — create the apid drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-apid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: faas_box_role | default('single-box') in ['control-plane', 'single-box']

- name: seal_domains — give apid the runtime domain recipient
  ansible.builtin.template:
    src: 60-faas-seal-domain-runtime-writer.conf.j2
    dest: /etc/systemd/system/faas-apid.service.d/60-faas-seal-domain-runtime.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-apid for seal domains
  when: faas_box_role | default('single-box') in ['control-plane', 'single-box']
