---
# The edge domain (ADR 20261022111812). gatewayd-internal on compute hosts
# is the only reader of app basic-auth credentials and log drain
# authentication headers; apid on the control plane seals them. A compute
# host gets the identity, a restarted gatewayd-internal and a proved probe;
# a control-plane host gets the recipient. Until
# faas_seal_domain_edge_writes is domain, apid also seals to the fleet key,
# so the order of the two converges does not matter.
- name: seal_domains — check the edge domain settings
  ansible.builtin.assert:
    that:
      - faas_seal_domain_edge_writes in ['', 'fleet', 'dual', 'domain']
      - faas_seal_domain_edge_writes != 'domain' or (faas_seal_domain_edge_readers_verified | bool)
      - not (faas_seal_domain_edge_contracted | bool) or faas_seal_domain_edge_writes == 'domain'
      - not (faas_seal_domain_edge_retired_on_compute | bool) or faas_box_role | default('single-box') == 'compute-only'
      - not (faas_seal_domain_edge_retired_on_compute | bool) or (faas_seal_domain_edge_contracted | bool)
      - not (faas_seal_domain_edge_retired_on_compute | bool) or (faas_gateway_secretd_log_drains | default(false) | bool)
      - not (faas_seal_domain_edge_retired_on_compute | bool) or faas_gateway_basic_auth | default('sealed') == 'verifier-only'
      - not (faas_seal_domain_edge_retired_on_compute | bool) or faas_gateway_edge_header_secrets | default('local') == 'inject'
    fail_msg: >-
      faas_seal_domain_edge_writes is '', fleet, dual or domain. domain needs
      faas_seal_domain_edge_readers_verified once every gatewayd-internal reports
      faas_seal_domain_loaded{domain="edge"} 1 and the previous release
      left the rollback window. faas_seal_domain_edge_contracted needs
      writes=domain. faas_seal_domain_edge_retired_on_compute
      (ADR-20261110210000) is for compute-only hosts and needs
      faas_seal_domain_edge_contracted, faas_gateway_secretd_log_drains,
      faas_gateway_basic_auth=verifier-only and
      faas_gateway_edge_header_secrets=inject, so that no edge value opens on
      the node.

# 0400 root:root. systemd hands the identity to gatewayd-internal alone as a
# credential; no other unit names it.
- name: seal_domains — install the edge domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_identity_src }}"
    dest: /etc/faas/secrets/domains/edge.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0
    - not (faas_seal_domain_edge_retired_on_compute | bool)

# ADR-20261110210000 (retire compute identities): a retired compute node
# holds no edge identity. Its gatewayd-internal checks basic auth against
# verifiers, opens log drain headers through secretd, leaves sealed edge-rule
# headers to the instance's vmmd, and refuses to start while the identity is
# still loaded. The probe result the node published earlier is stale, so it
# goes too.
- name: seal_domains — take the edge domain identity off a retired compute node
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  notify: restart faas-gatewayd-internal for seal domains
  loop:
    - /etc/faas/secrets/domains/edge.age
    - /etc/faas/secrets/domains/edge.age.previous
    - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_edge.prom"
  when:
    - faas_box_role | default('single-box') == 'compute-only'
    - faas_seal_domain_edge_retired_on_compute | bool

# ADR-20261110210000 slice 3f: a control-plane host holds the edge identity
# only for secretd, which opens log drain headers for the app's owner node,
# and only while CD stages it (SEAL_DOMAIN_EDGE_ON_CONTROL_PLANE=true).
# 0400 root:root; systemd hands it to secretd alone as a credential.
# Unstaged, it is removed.
- name: seal_domains — install the edge domain identity for secretd
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-secretd for seal domains
  loop:
    - {src: "{{ faas_seal_domain_edge_identity_src }}", dest: /etc/faas/secrets/domains/edge.age}
    - {src: "{{ faas_seal_domain_edge_previous_identity_src }}", dest: /etc/faas/secrets/domains/edge.age.previous}
  when:
    - faas_box_role | default('single-box') == 'control-plane'
    - item.src | length > 0

- name: seal_domains — remove the edge domain identity from the control plane
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  notify: restart faas-secretd for seal domains
  loop:
    - {src: "{{ faas_seal_domain_edge_identity_src }}", dest: /etc/faas/secrets/domains/edge.age}
    - {src: "{{ faas_seal_domain_edge_previous_identity_src }}", dest: /etc/faas/secrets/domains/edge.age.previous}
  when:
    - faas_box_role | default('single-box') == 'control-plane'
    - item.src | length == 0 or faas_seal_domain_edge_identity_src | length == 0

# Key rotation (ADR 20261022111812): while the previous identity is
# set it stays beside the new one, so values sealed to it still open until
# the domain's re-seal to the new key completes. Unset, it is removed.
- name: seal_domains — install the previous edge domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_previous_identity_src }}"
    dest: /etc/faas/secrets/domains/edge.age.previous
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_previous_identity_src | length > 0
    - not (faas_seal_domain_edge_retired_on_compute | bool)

- name: seal_domains — remove the previous edge domain identity
  ansible.builtin.file:
    path: /etc/faas/secrets/domains/edge.age.previous
    state: absent
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_previous_identity_src | length == 0

- name: seal_domains — create the gatewayd-internal drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-internal.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0 or (faas_seal_domain_edge_retired_on_compute | bool)

# The contract step (ADR 20261022111812, step 4): gatewayd-internal keeps no
# identity that opens a value the domain does not. The check writes nothing
# and fails while a credential still opens with the fleet or host identity.
- name: seal_domains — check every edge value opens with the domain alone before gatewayd-internal drops the fleet identity
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - migrate
      - --domain
      - edge
      - --check
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  changed_when: false
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0
    - faas_seal_domain_edge_contracted | bool
    - not (faas_seal_domain_edge_retired_on_compute | bool)

- name: seal_domains — drop gatewayd-internal's fleet and host identities once edge contracts
  ansible.builtin.template:
    src: 30-faas-seal-domain-edge-contract.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/30-faas-seal-domain-edge-contract.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0 or (faas_seal_domain_edge_retired_on_compute | bool)
    - faas_seal_domain_edge_contracted | bool

- name: seal_domains — keep gatewayd-internal's base credentials while edge is not contracted
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-internal.service.d/30-faas-seal-domain-edge-contract.conf
    state: absent
  notify: restart faas-gatewayd-internal for seal domains
  when: not (faas_seal_domain_edge_contracted | bool)

- name: seal_domains — give gatewayd-internal the edge domain identity
  ansible.builtin.template:
    src: 60-faas-seal-domain-edge-reader.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/60-faas-seal-domain-edge.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0 or (faas_seal_domain_edge_retired_on_compute | bool)

- name: seal_domains — restart gatewayd-internal before proving the domain
  ansible.builtin.meta: flush_handlers

# systemd places a running unit's credentials in its credentials directory:
# a contracted gatewayd-internal has the domain identity there and no fleet
# or host one.
- name: seal_domains — prove a contracted gatewayd-internal runs without the fleet and host identities
  ansible.builtin.find:
    paths: /run/credentials/faas-gatewayd-internal.service
  register: faas_seal_domain_edge_credentials
  failed_when: >-
    'faas_seal_domain_edge' not in (faas_seal_domain_edge_credentials.files | map(attribute='path') | map('basename') | list) or
    'fleet.age' in (faas_seal_domain_edge_credentials.files | map(attribute='path') | map('basename') | list) or
    'host.age' in (faas_seal_domain_edge_credentials.files | map(attribute='path') | map('basename') | list)
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0
    - faas_seal_domain_edge_contracted | bool
    - not (faas_seal_domain_edge_retired_on_compute | bool)
    - not (faas_join_defer_service_handlers | default(false) | bool)

# A retired gatewayd-internal holds no edge, fleet or host identity at all.
- name: seal_domains — prove a retired gatewayd-internal runs without any edge identity
  ansible.builtin.find:
    paths: /run/credentials/faas-gatewayd-internal.service
  register: faas_seal_domain_edge_retired_credentials
  failed_when: >-
    (faas_seal_domain_edge_retired_credentials.files | map(attribute='path') | map('basename') |
     select('in', ['faas_seal_domain_edge', 'faas_seal_domain_edge_previous', 'fleet.age', 'host.age']) | list | length) > 0
  when:
    - faas_box_role | default('single-box') == 'compute-only'
    - faas_seal_domain_edge_retired_on_compute | bool
    - not (faas_join_defer_service_handlers | default(false) | bool)

- name: seal_domains — prove this node opens the edge domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - edge
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_edge.prom"
      - --json
  register: faas_seal_domain_edge_verify
  changed_when: (faas_seal_domain_edge_verify.stdout | from_json).probe_written | default(false)
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0
    - not (faas_seal_domain_edge_retired_on_compute | bool)

- name: seal_domains — install the edge domain recipient
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_recipient_src }}"
    dest: /etc/faas/secrets/domains/edge.age.pub
    owner: root
    group: root
    mode: "0444"
  notify: restart faas-apid for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0

- name: seal_domains — create the apid drop-in directory for the edge domain
  ansible.builtin.file:
    path: /etc/systemd/system/faas-apid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0

# The recipient apid seals to must be the one readers published the probe
# with; a recipient from another pair would seal to a key no reader holds.
# Before any reader published the probe there is nothing to compare, which
# is only acceptable while apid still seals to the fleet key too.
- name: seal_domains — check the edge recipient against the published probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - edge
      - --recipient-only
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  register: faas_seal_domain_edge_recipient_check
  changed_when: false
  failed_when: >-
    faas_seal_domain_edge_recipient_check.rc != 0 or
    (faas_seal_domain_edge_writes == 'domain' and
     not (faas_seal_domain_edge_recipient_check.stdout | from_json).probe_published)
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0

- name: seal_domains — have apid seal edge credentials to the domain
  ansible.builtin.template:
    src: 60-faas-seal-domain-edge-writer.conf.j2
    dest: /etc/systemd/system/faas-apid.service.d/60-faas-seal-domain-edge.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-apid for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0
