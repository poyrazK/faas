---
# The edge domain (ADR 20261022111812). gatewayd-internal on compute hosts
# is the only reader of app basic-auth credentials and log drain
# authentication headers; apid on the control plane seals them. A compute
# host gets the identity, a restarted gatewayd-internal and a proved probe;
# a control-plane host gets the recipient. Until
# faas_seal_domain_edge_writes is domain, apid also seals to the fleet key,
# so the order of the two converges does not matter.
- name: seal_domains — check the edge domain settings
  ansible.builtin.assert:
    that:
      - faas_seal_domain_edge_writes in ['', 'fleet', 'dual', 'domain']
      - faas_seal_domain_edge_writes != 'domain' or (faas_seal_domain_edge_readers_verified | bool)
    fail_msg: >-
      faas_seal_domain_edge_writes is '', fleet, dual or domain. domain needs
      faas_seal_domain_edge_readers_verified once every gatewayd-internal reports
      faas_seal_domain_loaded{domain="edge"} 1 and the previous release
      left the rollback window.

# 0400 root:root. systemd hands the identity to gatewayd-internal alone as a
# credential; no other unit names it.
- name: seal_domains — install the edge domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_identity_src }}"
    dest: /etc/faas/secrets/domains/edge.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0

# Key rotation (ADR 20261022111812): while the previous identity is
# set it stays beside the new one, so values sealed to it still open until
# the domain's re-seal to the new key completes. Unset, it is removed.
- name: seal_domains — install the previous edge domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_previous_identity_src }}"
    dest: /etc/faas/secrets/domains/edge.age.previous
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_previous_identity_src | length > 0

- name: seal_domains — remove the previous edge domain identity
  ansible.builtin.file:
    path: /etc/faas/secrets/domains/edge.age.previous
    state: absent
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_previous_identity_src | length == 0

- name: seal_domains — create the gatewayd-internal drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-internal.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0

- name: seal_domains — give gatewayd-internal the edge domain identity
  ansible.builtin.template:
    src: 60-faas-seal-domain-edge-reader.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-internal.service.d/60-faas-seal-domain-edge.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-internal for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0

- name: seal_domains — restart gatewayd-internal before proving the domain
  ansible.builtin.meta: flush_handlers

- name: seal_domains — prove this node opens the edge domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - edge
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_edge.prom"
      - --json
  register: faas_seal_domain_edge_verify
  changed_when: (faas_seal_domain_edge_verify.stdout | from_json).probe_written | default(false)
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_identity_src | length > 0

- name: seal_domains — install the edge domain recipient
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_recipient_src }}"
    dest: /etc/faas/secrets/domains/edge.age.pub
    owner: root
    group: root
    mode: "0444"
  notify: restart faas-apid for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0

- name: seal_domains — create the apid drop-in directory for the edge domain
  ansible.builtin.file:
    path: /etc/systemd/system/faas-apid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0

# The recipient apid seals to must be the one readers published the probe
# with; a recipient from another pair would seal to a key no reader holds.
# Before any reader published the probe there is nothing to compare, which
# is only acceptable while apid still seals to the fleet key too.
- name: seal_domains — check the edge recipient against the published probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - edge
      - --recipient-only
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  register: faas_seal_domain_edge_recipient_check
  changed_when: false
  failed_when: >-
    faas_seal_domain_edge_recipient_check.rc != 0 or
    (faas_seal_domain_edge_writes == 'domain' and
     not (faas_seal_domain_edge_recipient_check.stdout | from_json).probe_published)
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0

- name: seal_domains — have apid seal edge credentials to the domain
  ansible.builtin.template:
    src: 60-faas-seal-domain-edge-writer.conf.j2
    dest: /etc/systemd/system/faas-apid.service.d/60-faas-seal-domain-edge.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-apid for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_recipient_src | length > 0
