---
# The edge-tls domain (ADR-20261103163954 §3). gatewayd-public on compute
# hosts is the only reader: it opens the apps domains' certificate key, which
# edgednsd on the control plane seals to the recipient. A compute host gets
# the identity, a restarted gatewayd-public and a proved probe; a
# control-plane host gets the recipient. The table is new, so there is no
# fleet copy, no write mode and nothing to migrate. gatewayd-public uses the
# identity only with faas_edge_public_tls_cert_source database.

# 0400 root:root. systemd hands it to gatewayd-public as a credential.
- name: seal_domains — install the edge-tls domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_tls_identity_src }}"
    dest: /etc/faas/secrets/domains/edge-tls.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-gatewayd-public-edge for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_tls_identity_src | length > 0

# Rotation: the previous identity stays beside the new one, so the
# certificate stored before the rotation still opens until edgednsd has
# ordered one sealed to the new recipient; unset, it is removed.
- name: seal_domains — install the previous edge-tls domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_tls_previous_identity_src }}"
    dest: /etc/faas/secrets/domains/edge-tls.age.previous
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-gatewayd-public-edge for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_tls_previous_identity_src | length > 0

- name: seal_domains — remove the previous edge-tls domain identity
  ansible.builtin.file:
    path: /etc/faas/secrets/domains/edge-tls.age.previous
    state: absent
  notify: restart faas-gatewayd-public-edge for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_tls_previous_identity_src | length == 0

- name: seal_domains — create the compute edge drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-public-edge.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_tls_identity_src | length > 0

- name: seal_domains — give the compute edge the edge-tls domain identity
  ansible.builtin.template:
    src: 60-faas-seal-domain-edge-tls-reader.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-public-edge.service.d/60-faas-seal-domain-edge-tls.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-public-edge for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_tls_identity_src | length > 0

- name: seal_domains — restart gatewayd-public before proving the edge-tls domain
  ansible.builtin.meta: flush_handlers

- name: seal_domains — prove this node opens the edge-tls domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - edge-tls
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_edge_tls.prom"
      - --json
  register: faas_seal_domain_edge_tls_verify
  changed_when: (faas_seal_domain_edge_tls_verify.stdout | from_json).probe_written | default(false)
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_edge_tls_identity_src | length > 0

- name: seal_domains — install the edge-tls domain recipient
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_edge_tls_recipient_src }}"
    dest: /etc/faas/secrets/domains/edge-tls.age.pub
    owner: root
    group: root
    mode: "0444"
  notify: restart faas-edgednsd for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_tls_recipient_src | length > 0

# The recipient edgednsd seals to must be the one the compute nodes
# published the probe with; a recipient from another pair would seal the
# certificate key to an identity no edge holds.
- name: seal_domains — check the edge-tls recipient against the published probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - edge-tls
      - --recipient-only
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  register: faas_seal_domain_edge_tls_recipient_check
  changed_when: false
  failed_when: faas_seal_domain_edge_tls_recipient_check.rc != 0
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_edge_tls_recipient_src | length > 0
