---
# The alerting domain (ADR 20261022111812). The order is the safety argument:
# meterd (the reader) gets the domain identity and proves it opens the
# domain probe before apid (the writer) seals anything to the domain.
- name: seal_domains — require the alerting domain sources on a control-plane host
  ansible.builtin.assert:
    that:
      - faas_box_role | default('single-box') in ['control-plane', 'single-box']
      - faas_seal_domain_alerting_identity_src | length > 0
      - faas_seal_domain_alerting_recipient_src | length > 0
      - faas_seal_domain_alerting_writes in ['', 'fleet', 'dual', 'domain']
      - faas_seal_domain_alerting_writes != 'domain' or (faas_seal_domain_alerting_readers_verified | bool)
    fail_msg: >-
      The alerting seal domain runs where meterd runs (a control-plane or
      single-box host). Set faas_seal_domain_alerting_identity_src and
      faas_seal_domain_alerting_recipient_src to the files from
      `gregalectl seal-domain init --domain alerting`. writes=domain also
      needs faas_seal_domain_alerting_readers_verified once every meterd
      verified the domain and the previous release left the rollback window.

# 0400 root:root. systemd hands the identity to meterd alone as a
# credential; no other unit names it.
- name: seal_domains — install the alerting domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_alerting_identity_src }}"
    dest: /etc/faas/secrets/domains/alerting.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-meterd for seal domains

- name: seal_domains — install the alerting domain recipient
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_alerting_recipient_src }}"
    dest: /etc/faas/secrets/domains/alerting.age.pub
    owner: root
    group: root
    mode: "0444"
  notify: restart faas-apid for seal domains

- name: seal_domains — create unit drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [faas-meterd, faas-apid]

- name: seal_domains — give meterd the alerting domain identity
  ansible.builtin.template:
    src: 60-faas-seal-domain-alerting-reader.conf.j2
    dest: /etc/systemd/system/faas-meterd.service.d/60-faas-seal-domain-alerting.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-meterd for seal domains

- name: seal_domains — restart meterd before proving the domain
  ansible.builtin.meta: flush_handlers

- name: seal_domains — prove this node opens the alerting domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - alerting
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_alerting.prom"
      - --json
  register: faas_seal_domain_alerting_verify
  changed_when: (faas_seal_domain_alerting_verify.stdout | from_json).probe_written | default(false)

# The recipient apid seals to must be the one readers published the probe
# with; a recipient from another pair would seal to a key no reader holds.
# Before any reader published the probe there is nothing to compare, which
# is only acceptable while apid still seals to the fleet key too.
- name: seal_domains — check the alerting recipient against the published probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - alerting
      - --recipient-only
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  register: faas_seal_domain_alerting_recipient_check
  changed_when: false
  failed_when: >-
    faas_seal_domain_alerting_recipient_check.rc != 0 or
    (faas_seal_domain_alerting_writes == 'domain' and
     not (faas_seal_domain_alerting_recipient_check.stdout | from_json).probe_published)

- name: seal_domains — have apid seal alerting values to the domain
  ansible.builtin.template:
    src: 60-faas-seal-domain-alerting-writer.conf.j2
    dest: /etc/systemd/system/faas-apid.service.d/60-faas-seal-domain-alerting.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-apid for seal domains
