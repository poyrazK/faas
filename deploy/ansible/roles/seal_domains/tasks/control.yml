---
# The control domain (ADR 20261022111812). schedd, on control-plane and
# compute hosts alike, is the only reader of the cluster signing key, which
# it uses to mint internal service tokens. gregalectl fleet-seal creates the
# key; apid never writes it, so there is no writer drop-in and no write mode:
# the key moves into the domain only through `gregalectl seal-domain migrate
# --domain control`, once every schedd holds the identity.
- name: seal_domains — require the control domain identity
  ansible.builtin.assert:
    that:
      - faas_seal_domain_control_identity_src | length > 0 or (faas_seal_domain_control_retired_on_compute | bool)
      - not (faas_seal_domain_control_retired_on_compute | bool) or faas_box_role | default('single-box') == 'compute-only'
      - not (faas_seal_domain_control_retired_on_compute | bool) or (faas_seal_domain_control_contracted | bool)
      - not (faas_seal_domain_control_retired_on_compute | bool) or (faas_schedd_secretd_internal_svc | default(false) | bool)
      - not (faas_seal_domain_control_retired_on_compute | bool) or faas_secretd_target | default('') | length > 0
    fail_msg: >-
      Set faas_seal_domain_control_identity_src to the control.age from
      `gregalectl seal-domain init --domain control`. Every host that runs
      schedd stages it, except a compute-only host with
      faas_seal_domain_control_retired_on_compute (ADR-20261110210000 slice
      3k-2), which needs schedd's contract step
      (faas_seal_domain_control_contracted), faas_schedd_secretd_internal_svc
      and faas_secretd_target.

# 0400 root:root. systemd hands the identity to schedd alone as a
# credential; fleet-seal verify reads it as root at node join.
- name: seal_domains — install the control domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_control_identity_src }}"
    dest: /etc/faas/secrets/domains/control.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-schedd for seal domains
  when: not (faas_seal_domain_control_retired_on_compute | bool)

# ADR-20261110210000 slice 3k-2: a retired compute node holds no control
# identity. Its schedd asks secretd for internal-service and workflow
# outbound tokens and refuses to start while the identity is still loaded.
# The probe result the node published earlier is stale, so it goes too.
- name: seal_domains — take the control domain identity off a retired compute node
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  notify: restart faas-schedd for seal domains
  loop:
    - /etc/faas/secrets/domains/control.age
    - /etc/faas/secrets/domains/control.age.previous
    - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_control.prom"
  when:
    - faas_box_role | default('single-box') == 'compute-only'
    - faas_seal_domain_control_retired_on_compute | bool

# Key rotation (ADR 20261022111812): while the previous identity is
# set it stays beside the new one, so values sealed to it still open until
# the domain's re-seal to the new key completes. Unset, it is removed.
- name: seal_domains — install the previous control domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_control_previous_identity_src }}"
    dest: /etc/faas/secrets/domains/control.age.previous
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-schedd for seal domains
  when:
    - faas_seal_domain_control_previous_identity_src | length > 0
    - not (faas_seal_domain_control_retired_on_compute | bool)

- name: seal_domains — remove the previous control domain identity
  ansible.builtin.file:
    path: /etc/faas/secrets/domains/control.age.previous
    state: absent
  notify: restart faas-schedd for seal domains
  when:
    - faas_seal_domain_control_previous_identity_src | length == 0

- name: seal_domains — create the schedd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-schedd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# The contract step (ADR 20261022111812, step 4). schedd reads the control
# and delivery domains with one set of credentials, and this file writes the
# drop-in that drops the fleet identity, before delivery.yml runs. So every
# precondition of both domains is checked here, before anything changes:
# both contracted or neither, and neither check finds a value the fleet or
# host identity still opens.
- name: seal_domains — require schedd's two domains to contract together
  ansible.builtin.assert:
    that:
      - (faas_seal_domain_control_contracted | bool) == (faas_seal_domain_delivery_contracted | bool)
      - not (faas_seal_domain_control_contracted | bool) or faas_seal_domain_delivery_writes == 'domain'
      - not (faas_seal_domain_control_contracted | bool) or faas_seal_domain_delivery_identity_src | length > 0 or (faas_seal_domain_delivery_retired_on_compute | bool)
    fail_msg: >-
      schedd contracts the control and delivery domains together: set
      faas_seal_domain_control_contracted and
      faas_seal_domain_delivery_contracted both or neither, with
      faas_seal_domain_delivery_writes domain and the delivery identity staged
      (or retired on this compute node, faas_seal_domain_delivery_retired_on_compute).

- name: seal_domains — check schedd's values open with the domains alone before it drops the fleet identity
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - migrate
      - --domain
      - "{{ item }}"
      - --check
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  # A node whose control or delivery identity is retired cannot open that
  # domain's values; the control plane's converge runs that check.
  loop: "{{ ([] if (faas_seal_domain_control_retired_on_compute | bool) else ['control']) + ([] if (faas_seal_domain_delivery_retired_on_compute | bool) else ['delivery']) }}"
  changed_when: false
  when: faas_seal_domain_control_contracted | bool

- name: seal_domains — drop schedd's fleet identity once control and delivery contract
  ansible.builtin.template:
    src: 30-faas-seal-domain-schedd-contract.conf.j2
    dest: /etc/systemd/system/faas-schedd.service.d/30-faas-seal-domain-schedd-contract.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-schedd for seal domains
  when: faas_seal_domain_control_contracted | bool

- name: seal_domains — keep schedd's base credentials while its domains are not contracted
  ansible.builtin.file:
    path: /etc/systemd/system/faas-schedd.service.d/30-faas-seal-domain-schedd-contract.conf
    state: absent
  notify: restart faas-schedd for seal domains
  when: not (faas_seal_domain_control_contracted | bool)

- name: seal_domains — give schedd the control domain identity
  ansible.builtin.template:
    src: 60-faas-seal-domain-control-reader.conf.j2
    dest: /etc/systemd/system/faas-schedd.service.d/60-faas-seal-domain-control.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-schedd for seal domains

- name: seal_domains — restart schedd before proving the domain
  ansible.builtin.meta: flush_handlers

- name: seal_domains — prove this node opens the control domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - control
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_control.prom"
      - --json
  register: faas_seal_domain_control_verify
  changed_when: (faas_seal_domain_control_verify.stdout | from_json).probe_written | default(false)
  when: not (faas_seal_domain_control_retired_on_compute | bool)
