---
# The build domain (ADR 20261022111812). imaged on compute hosts is the only
# reader of app and job private-registry passwords; apid on the control
# plane seals them. A compute host gets the identity, a restarted imaged and
# a proved probe; a control-plane host gets the recipient. Until
# faas_seal_domain_build_writes is domain, apid also seals to the fleet key,
# so the order of the two converges does not matter.
- name: seal_domains — check the build domain settings
  ansible.builtin.assert:
    that:
      - faas_seal_domain_build_writes in ['', 'fleet', 'dual', 'domain']
      - faas_seal_domain_build_writes != 'domain' or (faas_seal_domain_build_readers_verified | bool)
    fail_msg: >-
      faas_seal_domain_build_writes is '', fleet, dual or domain. domain needs
      faas_seal_domain_build_readers_verified once every imaged reports
      faas_seal_domain_loaded{domain="build"} 1 and the previous release
      left the rollback window.

# 0400 root:root. systemd hands the identity to imaged alone as a
# credential; no other unit names it.
- name: seal_domains — install the build domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_build_identity_src }}"
    dest: /etc/faas/secrets/domains/build.age
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-imaged for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_build_identity_src | length > 0

# Key rotation (ADR 20261022111812): while the previous identity is
# set it stays beside the new one, so values sealed to it still open until
# the domain's re-seal to the new key completes. Unset, it is removed.
- name: seal_domains — install the previous build domain identity
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_build_previous_identity_src }}"
    dest: /etc/faas/secrets/domains/build.age.previous
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: restart faas-imaged for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_build_previous_identity_src | length > 0

- name: seal_domains — remove the previous build domain identity
  ansible.builtin.file:
    path: /etc/faas/secrets/domains/build.age.previous
    state: absent
  notify: restart faas-imaged for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_build_previous_identity_src | length == 0

- name: seal_domains — create the imaged drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-imaged.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_build_identity_src | length > 0

- name: seal_domains — give imaged the build domain identity
  ansible.builtin.template:
    src: 60-faas-seal-domain-build-reader.conf.j2
    dest: /etc/systemd/system/faas-imaged.service.d/60-faas-seal-domain-build.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-imaged for seal domains
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_build_identity_src | length > 0

- name: seal_domains — restart imaged before proving the domain
  ansible.builtin.meta: flush_handlers

- name: seal_domains — prove this node opens the build domain probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - build
      - --publish
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --metrics-file
      - "{{ faas_seal_domain_textfile_dir }}/faas_seal_domain_build.prom"
      - --json
  register: faas_seal_domain_build_verify
  changed_when: (faas_seal_domain_build_verify.stdout | from_json).probe_written | default(false)
  when:
    - faas_box_role | default('single-box') in ['compute-only', 'single-box']
    - faas_seal_domain_build_identity_src | length > 0

- name: seal_domains — install the build domain recipient
  ansible.builtin.copy:
    src: "{{ faas_seal_domain_build_recipient_src }}"
    dest: /etc/faas/secrets/domains/build.age.pub
    owner: root
    group: root
    mode: "0444"
  notify: restart faas-apid for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_build_recipient_src | length > 0

- name: seal_domains — create the apid drop-in directory for the build domain
  ansible.builtin.file:
    path: /etc/systemd/system/faas-apid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_build_recipient_src | length > 0

# The recipient apid seals to must be the one readers published the probe
# with; a recipient from another pair would seal to a key no reader holds.
# Before any reader published the probe there is nothing to compare, which
# is only acceptable while apid still seals to the fleet key too.
- name: seal_domains — check the build recipient against the published probe
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gregalectl
      - seal-domain
      - verify
      - --domain
      - build
      - --recipient-only
      - --db-env
      - "{{ faas_seal_domain_db_env }}"
      - --json
  register: faas_seal_domain_build_recipient_check
  changed_when: false
  failed_when: >-
    faas_seal_domain_build_recipient_check.rc != 0 or
    (faas_seal_domain_build_writes == 'domain' and
     not (faas_seal_domain_build_recipient_check.stdout | from_json).probe_published)
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_build_recipient_src | length > 0

- name: seal_domains — have apid seal registry passwords to the domain
  ansible.builtin.template:
    src: 60-faas-seal-domain-build-writer.conf.j2
    dest: /etc/systemd/system/faas-apid.service.d/60-faas-seal-domain-build.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-apid for seal domains
  when:
    - faas_box_role | default('single-box') in ['control-plane', 'single-box']
    - faas_seal_domain_build_recipient_src | length > 0
