---
# One credential family's ring for the daemons on this host that issue or
# check its tokens (ADR 20261029202403 amendment 1). Parameters:
#   credential_family  scheduler, outbound, uploads, attach, dev-bridge or
#                      data-api
#   credential_units   the systemd units that read it, e.g. [faas-apid]
# The operator's settings are faas_credential_<family>_keys_src (an
# operator-local file from `gregalectl credentials keygen`),
# faas_credential_<family>_writes (plain or keyed) and
# faas_credential_<family>_plain_lookup, with - written as _.
- name: credential ring — read the {{ credential_family }} settings
  ansible.builtin.set_fact:
    credential_ring_src: "{{ lookup('vars', 'faas_credential_' ~ (credential_family | replace('-', '_')) ~ '_keys_src', default='') }}"
    credential_ring_writes: "{{ lookup('vars', 'faas_credential_' ~ (credential_family | replace('-', '_')) ~ '_writes', default='plain') }}"
    credential_ring_plain_lookup: "{{ lookup('vars', 'faas_credential_' ~ (credential_family | replace('-', '_')) ~ '_plain_lookup', default=true) }}"

- name: credential ring — refuse a {{ credential_family }} policy that cannot hold
  ansible.builtin.assert:
    that:
      - credential_ring_writes in ['plain', 'keyed']
      - credential_ring_writes == 'plain' or credential_ring_src | length > 0
      - credential_ring_plain_lookup | bool or credential_ring_writes == 'keyed'
    fail_msg: >-
      faas_credential_{{ credential_family | replace('-', '_') }}_writes must
      be plain or keyed; keyed needs the family's keys_src, and plain lookup
      may be turned off only with keyed writes.

- name: credential ring — install the {{ credential_family }} ring
  ansible.builtin.copy:
    src: "{{ credential_ring_src }}"
    dest: "/etc/faas/secrets/credential-keys-{{ credential_family }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: "{{ credential_units | map('regex_replace', '^', 'restart ') | list }}"
  when: credential_ring_src | length > 0

- name: credential ring — remove the {{ credential_family }} ring
  ansible.builtin.file:
    path: "/etc/faas/secrets/credential-keys-{{ credential_family }}"
    state: absent
  when: credential_ring_src | length == 0

- name: credential ring — create the drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ credential_units }}"

- name: credential ring — give each daemon the {{ credential_family }} settings
  ansible.builtin.template:
    src: ../../_shared/templates/60-faas-credential-ring.conf.j2
    dest: "/etc/systemd/system/{{ item }}.service.d/60-faas-credential-{{ credential_family }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ credential_units }}"
  notify: "restart {{ item }}"
