---
# builderd_service — default vars for the compute-only role.
# builderd lives on fsn-2 (compute-only box) per ADR-092.
# builderd_config_path is the canonical on-disk config the operator
# copies builderd.toml.example to. builderd's main.go reads
# FAAS_BUILDERD_CONFIG env var (lines 62-66) not a --config flag, so
# the unit does NOT export --config here — the role drop-in and environment
# files carry the production contract. The TOML path is the dev/test override.
builderd_config_path: /etc/faas/builderd.toml
# builderd_build_staging_root matches the unit's ReadWritePaths=
# pass at /srv/fc/builder. Must be writable by faas-builderd.
builderd_build_staging_root: /srv/fc/builder
# builderd_cache_dir matches builderd's canonical Config.CacheDir and the
# unit's ReadWritePaths=. It is a host-local content-addressed cache; the
# build output remains in shared storage for the imaged/snapshot pipeline.
builderd_cache_dir: /var/cache/faas/builds
