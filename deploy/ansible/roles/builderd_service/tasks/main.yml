# builderd_service — install systemd unit + example config for
# builderd (spec §4.5, ADR-003, ADR-005).
#
# builderd is the build orchestrator: it consumes build_queued
# notifications from apid, claims the build row, and runs the
# build inside an ephemeral Firecracker microVM (ADR-003) via
# vmmd's jailer. The produced app-layer ext4 is stamped onto the
# deployment row and the existing imaged→schedd snapshot_prime
# handshake takes over.
#
# builderd lives on the compute-only box (fsn-2) per ADR-092.
# The role is parallel to vmmd_service — a single daemon, a
# single unit, a single drop-in set. Like vmmd_service, this role
# does NOT enable or start the daemon: the operator does that once
# the binary and split-box environment files are deployed.
# Idempotency: copy tasks use `mode:` to keep state predictable;
# daemon_reload fires only when the unit file actually changed.

- name: builderd_service — ensure 'faas' group exists (socket auth group, ADR-015)
  ansible.builtin.group:
    name: faas
    state: present
    system: true

- name: builderd_service — ensure 'faas-builderd' system user exists (builderd socket owner)
  ansible.builtin.user:
    name: faas-builderd
    group: faas
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    password: "*"

- name: builderd_service — install /etc/faas (mode 0750 root:faas)
  ansible.builtin.file:
    path: /etc/faas
    state: directory
    owner: root
    group: faas
    mode: "0750"

- name: builderd_service — drop example TOML (operator copies to builderd.toml)
  ansible.builtin.copy:
    src: builderd.toml.example
    dest: /etc/faas/builderd.toml.example
    owner: root
    group: faas
    mode: "0640"

- name: builderd_service — install shared storage env example
  ansible.builtin.copy:
    src: ../../_shared/files/storage.env.example
    dest: /etc/faas/storage.env.example
    owner: root
    group: faas
    mode: "0640"

- name: builderd_service — install runtime base env example
  ansible.builtin.copy:
    src: ../../_shared/files/runtime-bases.env.example
    dest: /etc/faas/runtime-bases.env.example
    owner: root
    group: faas
    mode: "0640"

- name: builderd_service — require runtime base env on named compute nodes
  ansible.builtin.stat:
    path: /etc/faas/runtime-bases.env
  register: faas_runtime_bases_env_stat
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: builderd_service — validate runtime base env on named compute nodes
  ansible.builtin.shell: |
    set -eu
    for key in MINIMAL NODE22 PYTHON312 GO124 GO124_ALPINE NODE24 PYTHON313; do
      grep -Eq "^FAAS_DEPLOY_BASE_REF_${key}=[^#[:space:]]+@sha256:[0-9a-fA-F]{64}$" /etc/faas/runtime-bases.env
    done
  args:
    executable: /bin/sh
  register: faas_runtime_bases_env_keys
  changed_when: false
  failed_when: false
  no_log: true
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: builderd_service — fail closed on incomplete runtime base env
  ansible.builtin.assert:
    that:
      - faas_runtime_bases_env_stat.stat.exists
      - faas_runtime_bases_env_stat.stat.pw_name == 'root'
      - faas_runtime_bases_env_stat.stat.gr_name == 'root'
      - faas_runtime_bases_env_stat.stat.mode == '0600'
      - faas_runtime_bases_env_keys.rc == 0
    fail_msg: >-
      /etc/faas/runtime-bases.env must be provisioned as root:root 0600 and
      define digest-pinned MINIMAL, NODE22, PYTHON312, GO124, GO124_ALPINE,
      NODE24, and PYTHON313 refs before enabling builderd on a named compute node.
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: builderd_service — install systemd unit
  notify: restart faas-builderd
  ansible.builtin.copy:
    src: faas-builderd.service
    dest: /etc/systemd/system/faas-builderd.service
    owner: root
    group: root
    mode: "0644"
  register: builderd_unit

- name: builderd_service — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: builderd_unit.changed

- name: builderd_service — create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-builderd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the builderd unit so the build_claimed log lines
# carry the canonical host identity. Mirrors the vmmd / schedd /
# control-plane roles.
- name: builderd_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  notify: restart faas-builderd
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-builderd.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to builderd via FAAS_BUILDERD_ROLE so
# cmd/builderd/config.go::LoadConfig picks up faas_box_role
# (compute-only on fsn-2). See roles/builderd_service/templates/
# 99-faas-role.conf.j2 for the full rationale.
- name: builderd_service — install FAAS_BUILDERD_ROLE drop-in (Mega-PR-C)
  notify: restart faas-builderd
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-builderd.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"

# ADR-053: /srv/fc/builder is the build-staging root. builderd
# writes the produced app-layer ext4 here for the imaged→schedd
# snapshot_prime handshake to read. Must be writable by
# faas-builderd (the unit's ReadWritePaths= pass at this exact path
# is the load-bearing pair). Mode 0750 root:faas — sibling to the
# vmmd /srv/fc/parent dir that the imaged role also reads.
- name: builderd_service — ensure /srv/fc/builder exists (ADR-053 build staging)
  ansible.builtin.file:
    path: /srv/fc/builder
    state: directory
    owner: faas-builderd
    group: faas
    mode: "0750"

# OCI storage uses the shared read-through cache for source archives and
# produced layers. builderd is a writer, so the path must exist before
# ProtectSystem=strict creates the service namespace.
- name: builderd_service — ensure OCI cache root exists
  ansible.builtin.file:
    path: /var/lib/faas/cache
    state: directory
    owner: faas-builderd
    group: faas
    mode: "0770"

# builderd's content-addressed build cache defaults to /var/cache/faas/builds
# (cmd/builderd/config.go). ProtectSystem=strict requires this host-local
# cache to be both present and explicitly whitelisted by the unit.
- name: builderd_service — ensure build cache exists
  ansible.builtin.file:
    path: "{{ builderd_cache_dir }}"
    state: directory
    owner: faas-builderd
    group: faas
    mode: "0770"

# Cache-hit artifacts are hard-linked here while imaged consumes the builder
# handoff. The imaged unit receives write access to this child only, leaving
# canonical cache entries read-only to the sibling daemon.
- name: builderd_service — ensure build cache lease directory exists
  ansible.builtin.file:
    path: "{{ builderd_cache_dir }}/.leases"
    state: directory
    owner: faas-builderd
    group: faas
    mode: "0770"

# builderd's ProtectSystem=strict namespace also allows the shared log and
# spool roots. The compute_only_service role converges these later, but this
# role runs first in bootstrap and must make its own declared write paths
# exist before the pre-start assertions below.
- name: builderd_service — ensure shared log and spool roots exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: faas
    mode: "0770"
  loop:
    - /var/log/faas
    - /var/spool/faas

# Spec §11 — ProtectSystem=strict ReadWritePaths= assert. Mirrors
# the same shape as imaged (compute_only_service/tasks/main.yml) and
# vmmd (vmmd_service/tasks/main.yml, after Mega-PR-C Commit 10
# extends it). The canonical list mirrors the unit file; the
# compute_only_service role also checks the union of all three unit
# files. Fail loud before daemon activation if a required target is
# absent on a fresh box.
- name: builderd_service — assert ReadWritePaths= whitelist matches mkdir list
  ansible.builtin.set_fact:
    builderd_rwpaths:
      - "{{ builderd_build_staging_root }}"
      - /srv/fc/base
      - /var/log/faas
      - /var/spool/faas
      - /var/lib/faas/cache
      - "{{ builderd_cache_dir }}"

- name: builderd_service — assert every ReadWritePaths= target exists
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ builderd_rwpaths }}"
  register: builderd_rwpath_stat
  failed_when: not builderd_rwpath_stat.stat.exists

# Tier 1 control-plane mTLS (ADR-052). builderd on a multi-box
# compute node is one of the daemons that runs `gregalectl pki
# init`; the operator-side bootstrap lays out
# /etc/faas/tls/builderd/{server,vmmd-client}.crt. The assert
# surfaces a missing bootstrap before builderd attempts to start
# and refuses to bind with a confusing TLS handshake error.
- name: builderd_service — assert builderd PKI leaves exist (Tier 1)
  ansible.builtin.stat:
    path: "/etc/faas/tls/builderd/{{ item }}.crt"
  loop:
    - server
    - vmmd-client
  register: faas_pki_builderd_leaf_stat
  failed_when: not faas_pki_builderd_leaf_stat.stat.exists

# The PKI writer deliberately emits private keys as root:root 0400. The
# builderd client leaf is different from a root daemon's key: builderd runs
# as faas-builderd and must read it to dial vmmd. Normalize this one
# deployment-owned client key after the bootstrap assert; never loosen the
# generic PKI writer's policy for unrelated leaves.
- name: builderd_service — assert vmmd client key exists for non-root daemon
  ansible.builtin.stat:
    path: /etc/faas/tls/builderd/vmmd-client.key
  register: faas_pki_builderd_client_key_stat
  failed_when: not faas_pki_builderd_client_key_stat.stat.exists

- name: builderd_service — grant faas group read access to vmmd client key
  ansible.builtin.file:
    path: /etc/faas/tls/builderd/vmmd-client.key
    state: file
    owner: root
    group: faas
    mode: "0440"

# The per-node CapacityReport signing key belongs to vmmd and is
# asserted by vmmd_service at /etc/faas/secrets/vmmd/node.key. The
# current builderd binary does not load or sign with a node key; its
# build attestation is handled by imaged's sign-key material. Do not
# invent a second /etc/faas/secrets/builderd/node.key contract here.

# The split-box database file is required before builderd is enabled. Keep
# this assertion in the builderd role as well as compute_only_service so a
# role-limited adoption run cannot install a daemon that will crash-loop on
# its first database connection.
- name: builderd_service — require compute DB env on split-box hosts
  ansible.builtin.stat:
    path: /etc/faas/compute-db.env
  register: faas_builderd_compute_db_env_stat
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: builderd_service — validate compute DB env keys
  ansible.builtin.shell: |
    set -eu
    grep -Eq "^(export[[:space:]]+)?DATABASE_URL=.+$" /etc/faas/compute-db.env
    grep -Eq "^(export[[:space:]]+)?FAAS_VMMD_DBURL=.+$" /etc/faas/compute-db.env
  args:
    executable: /bin/sh
  register: faas_builderd_compute_db_env_keys
  changed_when: false
  failed_when: false
  no_log: true
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: builderd_service — fail closed on incomplete compute DB env
  ansible.builtin.assert:
    that:
      - faas_builderd_compute_db_env_stat.stat.exists
      - faas_builderd_compute_db_env_stat.stat.pw_name == 'root'
      - faas_builderd_compute_db_env_stat.stat.gr_name == 'root'
      - faas_builderd_compute_db_env_stat.stat.mode == '0600'
      - faas_builderd_compute_db_env_keys.rc == 0
    fail_msg: >-
      /etc/faas/compute-db.env must be root:root 0600 and define non-empty
      DATABASE_URL and FAAS_VMMD_DBURL before enabling builderd on a named
      compute node.
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: builderd_service — note for operators (NOT auto-enabled)
  ansible.builtin.debug:
    msg: >-
      builderd installed but NOT enabled. Operator runs:
        systemctl enable --now faas-builderd
      once /etc/faas/compute-db.env and /etc/faas/runtime-bases.env are
      provisioned and the binary is installed at /opt/faas/current/bin/builderd.
      The role wires
      the per-box role gate (FAAS_BUILDERD_ROLE=compute-only on fsn-2)
      via the 99-faas-role.conf drop-in.
