# node_exporter — defaults (spec §11 hardening + §12 telemetry).
#
# node_exporter_version pins the binary; same precedent as
# firecracker + prometheus.
#
# Compute nodes bind their private fleet address so control-plane Prometheus
# can scrape them. nftables restricts TCP/9100 to the configured control-plane
# CIDRs. Control-plane and single-box hosts remain loopback-only.

node_exporter_version: "1.12.1"
# SHA-256 of node_exporter-1.12.1.linux-amd64.tar.gz from the upstream release.
# This release includes prometheus/procfs v0.21.1, which understands the
# Linux 7.0 XFS `xpc` and `gc xpc` statistics emitted by production kernels.
node_exporter_release_sha256: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
node_exporter_listen_addr: "127.0.0.1:9100"
