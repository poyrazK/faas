---
- name: secretd_service — daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: restart faas-secretd

- name: secretd_service — try-restart faas-secretd
  ansible.builtin.command: systemctl try-restart faas-secretd.service  # noqa: command-instead-of-module
  changed_when: true
  listen: restart faas-secretd
  when: faas_secretd_listen | length > 0
