---
# secretd_service — install and run secretd (ADR-20261110210000 §3). It holds
# the runtime seal domain's identity and opens customer runtime secrets for
# the compute node that runs the app, so it runs on the control plane only,
# as its own OS user.
- name: secretd_service — require a control-plane host and a tcp:// listener
  ansible.builtin.assert:
    that:
      - faas_box_role | default('single-box') in ['control-plane', 'single-box']
      - faas_secretd_listen is match('^tcp://[^/]+:[0-9]+$')
      - not (faas_secretd_listen is match('^tcp://(0\.0\.0\.0|\[::\])?:'))
      - faas_secretd_apps_per_node_hour | string is match('^([1-9][0-9]*)?$')
    fail_msg: >-
      faas_secretd_listen is {{ faas_secretd_listen }}: secretd runs on a
      control-plane (or single-box) host and listens on that host's private
      address, tcp://<private address>:<port>, never on every address.
      faas_secretd_apps_per_node_hour, when set, is a positive integer.
  when: faas_secretd_listen | length > 0

- name: secretd_service — inspect the runtime domain identity
  ansible.builtin.stat:
    path: /etc/faas/secrets/domains/runtime.age
  register: faas_secretd_runtime_identity
  when: faas_secretd_listen | length > 0

- name: secretd_service — require the runtime domain identity
  ansible.builtin.assert:
    that:
      - faas_secretd_runtime_identity.stat.exists
    fail_msg: >-
      secretd opens runtime secrets with /etc/faas/secrets/domains/runtime.age,
      which this host lacks. Set the GitHub environment variable
      SEAL_DOMAIN_RUNTIME_ON_CONTROL_PLANE=true so CD stages it here
      (docs/runbooks/secretd.md), then rerun.
  when: faas_secretd_listen | length > 0

# During a rotation the previous identity sits beside the new one; the
# drop-in hands it to secretd only while it exists, since systemd has no
# optional LoadCredential= source.
- name: secretd_service — inspect the previous runtime domain identity
  ansible.builtin.stat:
    path: /etc/faas/secrets/domains/runtime.age.previous
  register: faas_secretd_runtime_previous
  when: faas_secretd_listen | length > 0

# The user exists everywhere the role runs so pg_ident's faas-secretd line
# maps a real user; it has no shell, no home and no password.
- name: secretd_service — create the faas-secretd user
  ansible.builtin.user:
    name: faas-secretd
    group: faas
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: faas_secretd_listen | length > 0

- name: secretd_service — install systemd unit
  ansible.builtin.copy:
    src: faas-secretd.service
    dest: /etc/systemd/system/faas-secretd.service
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-secretd

- name: secretd_service — create unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-secretd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# A fleet-PKI feature leaf (pkg/pki secret-opener) for secretd.faas, issued
# from the CA on this host. A run keeps a leaf valid for 30 days or more, so
# this is also its renewal. The key stays root-only: systemd hands it to
# secretd as a credential.
- name: secretd_service — issue secretd's server leaf
  ansible.builtin.command:
    argv: [/usr/local/bin/gregalectl, pki, issue-feature, --feature, secret-opener, --box-role, control-plane,
           --ca-dir, /etc/faas/tls, --root-dir, /etc/faas/tls]
  register: faas_secretd_leaf
  changed_when: (faas_secretd_leaf.stdout | from_json).issued | length > 0
  when: faas_secretd_listen | length > 0
  notify: restart faas-secretd

- name: secretd_service — install configuration drop-in
  ansible.builtin.template:
    src: 50-faas-secretd.conf.j2
    dest: /etc/systemd/system/faas-secretd.service.d/50-faas-secretd.conf
    owner: root
    group: root
    mode: "0644"
  when: faas_secretd_listen | length > 0
  notify: restart faas-secretd

# Without the drop-in the unit has no listener and no identity; CD's start
# step reads its absence as "secretd off".
- name: secretd_service — remove the drop-in while secretd is off
  ansible.builtin.file:
    path: /etc/systemd/system/faas-secretd.service.d/50-faas-secretd.conf
    state: absent
  when: faas_secretd_listen | length == 0
  register: faas_secretd_dropin_removed

- name: secretd_service — stop secretd while it is off
  ansible.builtin.systemd_service:
    name: faas-secretd.service
    state: stopped
    enabled: false
    daemon_reload: true
  when: faas_secretd_listen | length == 0 and faas_secretd_dropin_removed is changed
