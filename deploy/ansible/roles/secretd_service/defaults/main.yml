---
# secretd_service (ADR-20261110210000 §3): the control plane's opener of
# customer runtime secrets. Empty keeps secretd off, and every vmmd keeps
# opening runtime secrets with its node's own runtime identity. A split box
# sets "tcp://<control plane private address>:8098"; vmmd dials it once the
# compute side is configured (slice 3c). secretd serves mutual TLS only, so a
# tcp:// listener is the only kind it takes. It also needs the runtime
# domain's identity on this host, which CD stages only while the GitHub
# environment variable SEAL_DOMAIN_RUNTIME_ON_CONTROL_PLANE is true.
faas_secretd_listen: ""
# How many distinct apps one compute node may open per rolling hour; empty
# keeps secretd's default (pkg/secretd DefaultAppsPerNodeHour).
faas_secretd_apps_per_node_hour: ""
# Slice 3d-4 contract step: true refuses app-secret entries that carry
# ciphertext instead of naming the app's own row. Turn on once every schedd
# and vmmd runs a release that sends references.
faas_secretd_require_references: false
# Loopback /metrics (faas_secretd_opens_total, faas_secretd_refusals_total),
# scraped by the prometheus role's secretd job. Refusals are the alertable
# compromise signal (FaasSecretdRefusedNode and friends).
faas_secretd_metrics_listen: "127.0.0.1:9114"
