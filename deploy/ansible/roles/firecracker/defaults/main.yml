# Pin: upgrade both fc_release AND fc_release_sha256 together.
# FC releases (v1.7.0+) do NOT bundle kernels. Release CI builds the pinned
# kernel once from the FC CI config and ships it in the signed release bundle;
# image-seed/dev bootstrap retains the deterministic source-build fallback.
# This ensures virtio-blk is built-in (not a module), which is required for
# the kernel to mount root during boot.
#
# Kernel source and config:
# - kernel source: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.x.tar.xz
# - FC kernel config: https://raw.githubusercontent.com/firecracker-microvm/firecracker/{{ fc_release }}/resources/guest_configs/microvm-kernel-ci-x86_64-6.18.config
#   (Firecracker supports guest 6.18 from v1.16.1; guest 6.1 support ended
#   2026-09-02. The v1.17 configs boot through ACPI, so the kernel and the
#   Firecracker binary must move together.)
# - Required config change: CONFIG_VIRTIO_BLK=y (must be built-in, not module)
#
# Build deps: make, gcc, flex, bison, libssl-dev, libelf-dev, bc, kmod, cpio, xz
fc_release: "v1.17.0"
fc_arch: "x86_64"
# SHA-256 of firecracker-v1.17.0-x86_64.tgz, matching the release's published
# firecracker-v1.17.0-x86_64.tgz.sha256.txt at
# https://github.com/firecracker-microvm/firecracker/releases/download/v1.17.0/
fc_release_sha256: "06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558"
fc_kernel_version: "6.18.54"
fc_kernel_tar_url: "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{{ fc_kernel_version }}.tar.xz"
# SHA-256 of linux-6.18.54.tar.xz, matching kernel.org's v6.x/sha256sums.asc
fc_kernel_tar_sha256: "9df30b02dd8102bbd0be52556288ef6889ddbe7f1ddb96fbf847d0becf3eacac"
# SHA-256 of the Firecracker guest-kernel configuration at the pinned tag.
# The URL is fetched over TLS, but the content is also pinned so a changed
# upstream tag or mirror cannot silently alter the built kernel.
fc_kernel_config_sha256: "ba22401a0c7292a4c024ebcd10a562d4a1f1bfd2faed671406d3b159c0cf5215"
# The built-kernel digest is a release property, not a per-host discovery
# value. Production node_join stages /etc/faas/manifest.yaml and the task
# below requires release.kernel_digest to match the bytes produced here.
# Keep this override empty by default; an operator may set it for a canary,
# but it must still agree with the staged release manifest.
fc_kernel_sha256: ""
fc_kernel_config_url: "https://raw.githubusercontent.com/firecracker-microvm/firecracker/{{ fc_release }}/resources/guest_configs/microvm-kernel-ci-x86_64-6.18.config"
