# Managed by the tetragon role (ADR-20261110183000). Observe only: every open
# of a file under /etc/faas/secrets is exported; Alloy flags the ones a jailed
# uid or an unexpected program makes.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: faas-secret-open
spec:
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/faas/secrets/
