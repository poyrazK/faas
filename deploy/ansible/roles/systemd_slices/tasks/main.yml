# systemd_slices (spec §13, §1, ADR-044).
#
# Drops three `.slice` unit files that PUT HARD MEMORY CEILINGS on the
# VM resource accounting. Numbers come from the `pkg/api/limits.go`
# constants table — when the limits change, ansible must mirror.
#
# Hard-fence values (spec §1):
#   faas-tenant.slice : MemoryMax=57344M  (controller for tenant VMs)
#   faas-cp.slice     : MemoryMax=6144M   (postgres + daemons; spec §13 budget row)
#   faas-cp-build.slice : MemoryMax=4096M (builder budget under faas-cp.slice)
#                                                (1 guaranteed slot + 1 opportunistic)
#
# Per-plan sub-slices (issue #301, ADR-044):
#   faas-tenant.slice/faas-tenant-free.slice  : CPUWeight=2
#   faas-tenant.slice/faas-tenant-hobby.slice : CPUWeight=4
#   faas-tenant.slice/faas-tenant-pro.slice   : CPUWeight=8
#   faas-tenant.slice/faas-tenant-scale.slice: CPUWeight=16
# The weights encode the issue's literal ratio (Free:2 / Hobby:4 / Pro:8 /
# Scale:16) — see pkg/api/limits.go::Limits.CPUWeight and the SliceName()
# mapping (tenant-free/hobby/pro/scale). These weights are KERNEL-ACCOUNTED
# from boot so the cgroup is correctly weighted even before vmmd writes the
# per-VM cpu.max. Memory charge stays pooled to faas-tenant.slice; per-VM
# memory.max is still written by vmmd via the jailer (spec §13, Gotchas).
# We do NOT set MemoryMax / CPUQuota here — doing so would override the
# parent's hard fence.
#
# The slot definitions alone are not enough — the corresponding
# daemon `daemon.slice` units land in M5. Until then the slices are
# defined but unused; that's deliberate (configuration stays idempotent
# even with no consumers).

- name: systemd_slices — write faas-tenant.slice (hard fence)
  ansible.builtin.copy:
    dest: /etc/systemd/system/faas-tenant.slice
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=onebox-faas tenant microVMs (hard fence — schedd admits to 47,600 MB)
      # spec §1, §4.3, §6.2-2: 57,344 MB ceiling, schedd stops at 47,600 MB.

      [Slice]
      MemoryMax=57344M
      CPUQuota=1600%
  register: tenant_slice

# ADR-044 — per-plan CPUWeight sub-slices. The loop mirrors
# pkg/api/limits.go::Plan.SliceName() + Limits.CPUWeight (Free=2, Hobby=4,
# Pro=8, Scale=16). The `faas-tenant-<plan>.slice` names are deliberate:
# systemd derives their parent as `faas-tenant.slice`; the old `Parent=`
# key was invalid and silently left the slices detached. No MemoryMax /
# CPUQuota on the sub-slices — the parent's hard fence is the only memory
# ceiling, and per-instance cpu.max is written by vmmd.
- name: systemd_slices — write per-plan tenant sub-slices (CPUWeight only)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/faas-tenant-{{ item.plan }}.slice"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=onebox-faas tenant-{{ item.plan }} microVMs (CPUWeight {{ item.weight }}, ADR-044)
      # issue #301, ADR-044 — see pkg/api/limits.go::(Plan).SliceName() and
      # Limits.CPUWeight. No MemoryMax — memory charge pools to
      # faas-tenant.slice; per-VM memory.max is written by vmmd (jailer).

      [Slice]
      CPUWeight={{ item.weight }}
  loop:
    - { plan: free, weight: 2 }
    - { plan: hobby, weight: 4 }
    - { plan: pro, weight: 8 }
    - { plan: scale, weight: 16 }
  loop_control:
    label: "faas-tenant-{{ item.plan }}.slice"
  register: plan_slices

- name: systemd_slices — remove invalid detached per-plan slice units
  ansible.builtin.file:
    path: "/etc/systemd/system/tenant-{{ item }}.slice"
    state: absent
  loop: [free, hobby, pro, scale]
  register: legacy_plan_slices

- name: systemd_slices — write faas-cp.slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/faas-cp.slice
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=onebox-faas control plane (postgres + daemons)
      # spec §13 budget row: 6,144 MB total. Breakdown lives in M5 systemd units.

      [Slice]
      MemoryMax=6144M
      CPUQuota=400%
  register: cp_slice

- name: systemd_slices — write faas-cp-build.slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/faas-cp-build.slice
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=onebox-faas builder microVMs (dedicated build budget)
      # The dash-qualified unit name makes this a child of faas-cp.slice;
      # vmmd's delegated service subtree can therefore fence each build.

      [Slice]
      MemoryMax=4096M
      CPUQuota=200%
  register: build_slice

- name: systemd_slices — remove old detached builder slice unit
  ansible.builtin.file:
    path: /etc/systemd/system/faas-build.slice
    state: absent
  register: legacy_build_slice

- name: systemd_slices — daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  when: cp_slice is changed or build_slice is changed or tenant_slice is changed or plan_slices is changed or legacy_plan_slices is changed or legacy_build_slice is changed

- name: systemd_slices — start cgroup parents before jailer can attach VMs
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - faas-tenant.slice
    - faas-cp-build.slice
    - faas-tenant-free.slice
    - faas-tenant-hobby.slice
    - faas-tenant-pro.slice
    - faas-tenant-scale.slice
