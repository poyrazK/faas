# /etc/tmpfiles.d/faas.conf
#
# Pre-create /run/faas with the correct ownership on the
# compute-only box (fsn-2). Mirrors
# deploy/ansible/roles/control_plane_service/files/faas.conf
# (PR-D) — same rule shape, same ownership, same rationale.
#
# Why a second copy on fsn-2: vmmd is the lone RuntimeDirectory=faas
# declarer on a compute host, but vmmd's ExecStartPre chown only fires at
# unit-activation time. On a fresh boot of the compute-only box
# (no prior `make bootstrap-compute` chown, no prior `vmmd`
# activation), /run/faas is created by systemd as root:root 0755
# the moment ANY faas-*.service unit that depends on it starts —
# but the node-local schedd and bridged-tenant traffic expect the
# directory mode BEFORE
# the first schedule tick. The tmpfiles.d rule creates the
# dirent at boot, before any systemd unit starts, with the
# canonical root:faas 0775 ownership — same effect as the
# control-plane copy.
d /run/faas 0775 root faas -

# /run/faas/stream — the vmmd-stream-bridge bind target. Same
# rationale as the control-plane copy: the bridge spawns via
# `ip netns exec` and binds on the host, so the parent dir must
# exist on the host tmpfs at boot. Mode 0770 keeps the per-
# instance sockets unreadable to anyone other than root.
d /run/faas/stream 0770 root faas -

# vmmd creates per-instance network namespaces under this host-shared
# iproute2 directory. Recreate it on every boot before the daemon starts.
d /run/netns 0755 root root -

# imaged's systemd mount namespace requires this path to exist before the
# unit starts. /dev/shm is recreated on every boot, so provisioning it once
# is insufficient; tmpfiles must recreate it on every compute reboot.
d /dev/shm/faas-base-staging 0770 root faas -
