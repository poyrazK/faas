---
# ADR-20261109170000: imaged signs app layers through the control plane's
# signd. Its client leaf is a fleet-PKI feature leaf (pkg/pki artifact-signer)
# whose CN is this node's compute_nodes.name: signd signs only for the node
# building the deployment. Only the CA's host issues it: the control plane
# writes it into a per-node staging directory and this node copies it in. A
# run keeps a leaf that stays valid for 30 days or more, so this is also its
# renewal. The key stays root-only; systemd hands it to imaged as a
# credential.
- name: compute_only_service — require an issuer for imaged's signd client leaf
  ansible.builtin.assert:
    that:
      - (faas_box_role | default('single-box')) == 'compute-only'
      - faas_imaged_signd_target is match('^tcp://[^/]+:[0-9]+$')
      - faas_imaged_signd_tls_issuer_host | length > 0
      - faas_node_name | default('') is match('^[A-Za-z0-9._-]+$')
    fail_msg: >-
      faas_imaged_signd_target is for a compute node and must be signd's
      tcp://<control plane private address>:<port>. The leaf is issued on the
      control plane: the inventory needs a control_plane host and this node's
      faas_node_name.

- name: compute_only_service — issue imaged's signd client leaf on the control plane
  ansible.builtin.command:
    argv: [/usr/local/bin/gregalectl, pki, issue-feature, --feature, artifact-signer, --box-role, compute-only,
           --cn, "{{ faas_node_name }}", --ca-dir, /etc/faas/tls,
           --root-dir, "/var/lib/faas/pki-features/{{ faas_node_name }}"]
  delegate_to: "{{ faas_imaged_signd_tls_issuer_host }}"
  register: faas_imaged_signd_tls_issued
  changed_when: (faas_imaged_signd_tls_issued.stdout | from_json).issued | length > 0

- name: compute_only_service — read the staged signd client leaf
  ansible.builtin.slurp:
    src: "/var/lib/faas/pki-features/{{ faas_node_name }}/signd-client/{{ item }}"
  delegate_to: "{{ faas_imaged_signd_tls_issuer_host }}"
  register: faas_imaged_signd_tls_staged
  loop: [imaged.crt, imaged.key]
  no_log: true

- name: compute_only_service — create imaged's signd client leaf directory
  ansible.builtin.file:
    path: /etc/faas/tls/signd-client
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: compute_only_service — install imaged's signd client leaf
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "/etc/faas/tls/signd-client/{{ item.item }}"
    owner: root
    group: root
    mode: "{{ '0400' if item.item.endswith('.key') else '0444' }}"
  loop: "{{ faas_imaged_signd_tls_staged.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  notify: restart faas-imaged
