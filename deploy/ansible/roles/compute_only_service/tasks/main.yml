# compute_only_service — install systemd unit + example TOML for
# imaged, plus the imaged-specific secret/PKI tripwires (Gate-B,
# issue #297 / ADR-025 §Tier 2).
#
# This role is the single source of truth for the fsn-2 (compute-only)
# imaged install. vmmd + gatewayd-internal + builderd each have their
# own role (vmmd_service, gatewayd_internal_service, builderd_service —
# Mega-PR-C added builderd); imaged's tripwires travel with the imaged
# unit so a future unit edit that drops a ReadWritePaths= target fails
# the playbook on the box the daemon actually runs on, rather than
# firing a false positive on fsn-1.
#
# The role does NOT enable or start imaged: the operator does that
# once /srv/fc/base is populated (firecracker role) and the binary
# is at /opt/faas/current/bin/imaged. Idempotency: each copy uses `mode:` and
# the user-create is `state: present` no-op when the uid exists.

- name: compute_only_service — assert role is invoked on a compute-only box (Gate-B)
  ansible.builtin.assert:
    that:
      - faas_box_role in ['compute-only', 'single-box']
    fail_msg: >-
      compute_only_service was invoked on a {{ faas_box_role | default('unset') }}
      box. This role is for fsn-2 only — control-plane boxes run
      control_plane_service instead. The per-box role dispatch is in
      deploy/ansible/bootstrap.yml; verify host_vars/faas-fsn-N.yml
      sets faas_box_role correctly for this host.

# The imaged → vmmd hop is a split-box production dependency. Keep the
# node-specific private endpoint in the target URL so grpc-go verifies the
# endpoint SAN on the matching vmmd server leaf. The leaf retains vmmd.faas
# as its role identity for peer authorization; the endpoint name selects one
# compute node among many.
- name: compute_only_service — require canonical imaged vmmd target
  ansible.builtin.assert:
    that:
      - faas_vmmd_target_url is defined
      - faas_vmmd_target_url is match('^tcp://[^/]+:[0-9]+$')
      - "'0.0.0.0' not in faas_vmmd_target_url"
      - "'[::]' not in faas_vmmd_target_url"
    fail_msg: >-
      compute-only imaged requires a node-specific routable
      faas_vmmd_target_url in the form tcp://<private-hostname>:<port>;
      do not configure a wildcard bind address or a shared vmmd.faas alias.
  when: (faas_box_role | default('single-box')) == 'compute-only'

# Split-box database credentials are deliberately not rendered into daemon
# TOML or generated host vars. The operator provisions this root-only file
# from the secret store before enabling compute daemons; systemd loads it for
# DATABASE_URL/FAAS_VMMD_DBURL while the daemon users never need filesystem
# read access to the credential itself.
- name: compute_only_service — install compute DB env example
  ansible.builtin.copy:
    src: compute-db.env.example
    dest: /etc/faas/compute-db.env.example
    owner: root
    group: root
    mode: "0644"

- name: compute_only_service — install shared storage env example
  ansible.builtin.copy:
    src: ../../_shared/files/storage.env.example
    dest: /etc/faas/storage.env.example
    owner: root
    group: faas
    mode: "0640"

- name: compute_only_service — install runtime base env example
  ansible.builtin.copy:
    src: ../../_shared/files/runtime-bases.env.example
    dest: /etc/faas/runtime-bases.env.example
    owner: root
    group: faas
    mode: "0640"

- name: compute_only_service — require runtime base env on named compute nodes
  ansible.builtin.stat:
    path: /etc/faas/runtime-bases.env
  register: faas_runtime_bases_env_stat
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — validate runtime base env on named compute nodes
  ansible.builtin.shell: |
    set -eu
    for key in MINIMAL NODE22 PYTHON312 GO124 GO124_ALPINE NODE24 PYTHON313; do
      grep -Eq "^FAAS_DEPLOY_BASE_REF_${key}=[^#[:space:]]+@sha256:[0-9a-fA-F]{64}$" /etc/faas/runtime-bases.env
    done
  args:
    executable: /bin/sh
  register: faas_runtime_bases_env_keys
  changed_when: false
  failed_when: false
  no_log: true
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — fail closed on incomplete runtime base env
  ansible.builtin.assert:
    that:
      - faas_runtime_bases_env_stat.stat.exists
      - faas_runtime_bases_env_stat.stat.pw_name == 'root'
      - faas_runtime_bases_env_stat.stat.gr_name == 'root'
      - faas_runtime_bases_env_stat.stat.mode == '0600'
      - faas_runtime_bases_env_keys.rc == 0
    fail_msg: >-
      /etc/faas/runtime-bases.env must be provisioned as root:root 0600 and
      define digest-pinned MINIMAL, NODE22, PYTHON312, GO124, GO124_ALPINE,
      NODE24, and PYTHON313 refs before enabling imaged on a named compute node.
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — require compute DB env on split-box hosts
  ansible.builtin.stat:
    path: /etc/faas/compute-db.env
  register: faas_compute_db_env_stat
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — fail closed when compute DB env is absent
  ansible.builtin.assert:
    that:
      - faas_compute_db_env_stat.stat.exists
      - faas_compute_db_env_stat.stat.pw_name == 'root'
      - faas_compute_db_env_stat.stat.gr_name == 'root'
      - faas_compute_db_env_stat.stat.mode == '0600'
    fail_msg: >-
      /etc/faas/compute-db.env must be provisioned as root:root 0600 before
      enabling compute-only daemons. Copy the example and fill it from the
      operator secret store; do not put the DSN in TOML or inventory.
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — validate both compute database environment names
  ansible.builtin.shell: |
    grep -Eq "^(export[[:space:]]+)?DATABASE_URL=.+$" /etc/faas/compute-db.env &&
    grep -Eq "^(export[[:space:]]+)?FAAS_VMMD_DBURL=.+$" /etc/faas/compute-db.env
  args:
    executable: /bin/sh
  register: faas_compute_db_env_keys
  changed_when: false
  failed_when: false
  no_log: true
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — refuse an incomplete compute DB env
  ansible.builtin.assert:
    that:
      - faas_compute_db_env_keys.rc == 0
    fail_msg: >-
      /etc/faas/compute-db.env must define non-empty DATABASE_URL and
      FAAS_VMMD_DBURL entries. VMMD uses its explicit split-box override;
      the other compute daemons use DATABASE_URL.

# Split-node restore safety gate. The storage package deliberately keeps the
# historical local-prefix defaults for single-box development, so merely
# setting FAAS_STORAGE_BACKEND=oci is not enough: the default still leaves
# snap/, base/, kernel/, and layers/ on each host. That is exactly how two
# nodes accepted the same logical snapshot key but booted different bytes.
# The shared-artifact contract belongs in storage.env, alongside the registry
# credentials and separate from the root-only database environment. Every
# compute daemon loads storage.env, so validating this file keeps node_join,
# ordinary bootstrap, and a manual systemd start on one source of truth.
- name: compute_only_service — inspect shared storage environment
  ansible.builtin.stat:
    path: /etc/faas/storage.env
  register: faas_storage_env_stat
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — require protected shared storage environment
  ansible.builtin.assert:
    that:
      - faas_storage_env_stat.stat.exists
      - faas_storage_env_stat.stat.isreg
      - faas_storage_env_stat.stat.pw_name == 'root'
      - faas_storage_env_stat.stat.gr_name == 'faas'
      - faas_storage_env_stat.stat.mode == '0440'
    fail_msg: >-
      /etc/faas/storage.env must be provisioned as root:faas 0440 before
      enabling compute-only daemons. It is the canonical shared-artifact
      environment loaded by vmmd, imaged, and builderd.
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — read shared storage contract
  ansible.builtin.slurp:
    src: /etc/faas/storage.env
  register: faas_storage_env_content
  no_log: true
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — fail closed when shared artifact contract is incomplete
  ansible.builtin.assert:
    that:
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_BACKEND=[^\\r\\n]*$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_BACKEND=oci$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=[^\\r\\n]*$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=none$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_REQUIRE_SHARED_ARTIFACTS=[^\\r\\n]*$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_REQUIRE_SHARED_ARTIFACTS=1$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_CACHE_SERVE_STALE=[^\\r\\n]*$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_CACHE_SERVE_STALE=0$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_OCI_REGISTRY=[^\\r\\n]*$') | length) == 1"
      - "((faas_storage_env_content.content | b64decode) | regex_findall('(?m)^FAAS_OCI_REGISTRY=https://[^\\s]+$') | length) == 1"
    fail_msg: >-
      /etc/faas/storage.env must declare the strict shared-artifact
      contract: FAAS_STORAGE_BACKEND=oci,
      FAAS_STORAGE_LOCAL_PREFIXES=none, FAAS_REQUIRE_SHARED_ARTIFACTS=1,
      FAAS_STORAGE_CACHE_SERVE_STALE=0, and exactly one HTTPS
      FAAS_OCI_REGISTRY assignment. Without this gate a compute node may
      restore a different local copy for the same snapshot key.
  no_log: true
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — ensure faas-imaged user exists (non-root, no shell)
  ansible.builtin.user:
    name: faas-imaged
    group: faas
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: compute_only_service — drop example TOML (operator copies to imaged.toml)
  ansible.builtin.copy:
    src: imaged.toml.example
    dest: /etc/faas/imaged.toml.example
    owner: root
    group: faas
    mode: "0640"

# Split-box local-backend fallback. Public multi-node deployments should use
# FAAS_STORAGE_BACKEND=oci; this helper exists for an installation that keeps
# local storage while placing imaged on compute and schedd on control. It is
# only invoked when FAAS_ARTIFACT_REPLICATOR is present in imaged.env.
- name: compute_only_service — ensure artifact helper directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: compute_only_service — install split-box artifact replicator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/faas-artifact-replicator.sh"
    dest: /usr/local/libexec/faas-artifact-replicator
    owner: root
    group: root
    mode: "0750"

- name: compute_only_service — drop artifact sync example
  ansible.builtin.copy:
    src: artifact-sync.env.example
    dest: /etc/faas/artifact-sync.env.example
    owner: root
    group: faas
    mode: "0640"

- name: compute_only_service — install systemd unit
  notify: restart faas-imaged
  ansible.builtin.copy:
    src: faas-imaged.service
    dest: /etc/systemd/system/faas-imaged.service
    owner: root
    group: root
    mode: "0644"
  register: imaged_unit

- name: compute_only_service — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: imaged_unit.changed

# Mega-PR-C (issue #911 / ADR-110) — replace the legacy vmmd unit's
# ExecStartPre chown chain with a deploy-time role fixup. The
# imaged + vmmd + builderd units all sit on fsn-2 and all need
# /run/faas to be root:faas 0775 BEFORE systemd activates the vmmd
# unit. Mirrors the control_plane_service PR-D + PR-M chain on
# fsn-1 (the same runtime dir, same ownership, same group).
# Idempotent: ansible's `file:` module is a no-op when ownership
# + mode already match.
- name: compute_only_service — chown /run/faas to root:faas 0775 (Mega-PR-C)
  ansible.builtin.file:
    path: /run/faas
    state: directory
    owner: root
    group: faas
    mode: "0775"

# Mega-PR-C (issue #911 / ADR-110) — fix the reboot race. The
# chown above only runs at provisioning time; on every reboot
# of fsn-2, /run/faas is created on the host by tmpfiles.d before
# services start. The chown above does NOT re-fire on a reboot;
# mirror control_plane_service's PR-D pattern: ship a tmpfiles.d rule
# + run systemd-tmpfiles --create during deploy so /run/faas
# exists with the canonical root:faas 0775 ownership BEFORE
# the first vmmd activation on a fresh box. The vmmd unit's
# ExecStartPre chown remains in place as defense-in-depth
# (covers a box that runs `systemctl restart faas-vmmd` after
# a manual /run wipe without a tmpfiles-d apply).
- name: compute_only_service — install /run/faas tmpfiles.d rule (Mega-PR-C)
  ansible.builtin.copy:
    src: faas.conf
    dest: /etc/tmpfiles.d/faas.conf
    owner: root
    group: root
    mode: "0644"
- name: compute_only_service — apply /run/faas tmpfiles.d rule (Mega-PR-C)
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/faas.conf
  changed_when: false

# The firecracker role creates /srv/fc for the root-owned vmmd, but the
# split-box imaged and builderd services also need to traverse it to reach
# their group-writable staging roots. A 0700 root:root parent makes the
# apparently-correct child modes ineffective and fails only when imaged
# tries its first digest-pinned base pull. Keep the parent non-world-readable
# while granting the shared faas group traversal.
- name: compute_only_service — allow shared daemons to traverse /srv/fc
  ansible.builtin.file:
    path: /srv/fc
    state: directory
    owner: root
    group: faas
    mode: "0750"

- name: compute_only_service — create imaged systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-imaged.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the imaged unit so the boot log carries the right
# identity without a TOML edit (imaged has no config.go). The
# drop-in mirrors deploy/ansible/roles/control_plane_service/
# templates/99-faas-node-name.conf.j2 — body is identical across
# roles.
- name: compute_only_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  notify: restart faas-imaged
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-imaged.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to imaged via FAAS_IMAGED_ROLE so cmd/imaged/main.go
# picks up faas_box_role (compute-only on fsn-2). See
# roles/compute_only_service/templates/99-faas-role.conf.j2 for
# the full rationale.
- name: compute_only_service — install FAAS_IMAGED_ROLE drop-in (Mega-PR-C)
  notify: restart faas-imaged
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-imaged.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"

# ADR-053: imaged mounts runtime parent bases through vmmd. This drop-in is
# deliberately named zz-* so it wins over an older release-runtime
# EnvironmentFile drop-in that may still exist on a manually upgraded host.
- name: compute_only_service — install canonical imaged vmmd mTLS drop-in
  notify: restart faas-imaged
  ansible.builtin.template:
    src: zz-faas-vmmd-client.conf.j2
    dest: /etc/systemd/system/faas-imaged.service.d/zz-faas-vmmd-client.conf
    owner: root
    group: root
    mode: "0644"
  when: (faas_box_role | default('single-box')) == 'compute-only'

# Runtime bases embed guest/init as PID 1. Keep the source release-managed;
# an old /usr/local/bin/faas-guest-init can otherwise survive a daemon rollout
# and make every newly staged base boot with stale guest code.
- name: compute_only_service — install canonical guest-init drop-in
  notify: restart faas-imaged
  ansible.builtin.template:
    src: zz-faas-guest-init.conf.j2
    dest: /etc/systemd/system/faas-imaged.service.d/zz-faas-guest-init.conf
    owner: root
    group: root
    mode: "0644"
  when: (faas_box_role | default('single-box')) == 'compute-only'

- name: compute_only_service — reload systemd after imaged drop-ins
  ansible.builtin.systemd:
    daemon_reload: true

# The split gatewayd-internal egress listener runs as the unprivileged faas
# user. PKI creates the server key root-only, so grant only the shared faas
# group read access while keeping the key non-world-readable.
- name: compute_only_service — grant gatewayd egress key access
  ansible.builtin.file:
    path: "/etc/faas/tls/egress/{{ item.name }}"
    owner: root
    group: faas
    mode: "{{ item.mode }}"
    state: file
  loop:
    - { name: "egress.key", mode: "0440" }
    - { name: "egress.crt", mode: "0444" }
  when: (faas_box_role | default('single-box')) == 'compute-only'

# ADR-038 build attestations. Must exist before faas-imaged starts:
# a ReadWritePaths= target that does not exist makes systemd fail the
# mount-namespace setup, so creating the dir and listing it in the unit
# are a pair. /srv/fc/base is created by the firecracker role.
- name: compute_only_service — create imaged runtime dirs (snapshots, sigs)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: faas
    mode: "0770"
  loop:
    - /srv/fc/snap
    - /srv/fc/base
    - /srv/fc/base-staging
    - /srv/fc/sigs
    - /srv/fc/scans
    - /var/log/faas
    - /var/spool/faas
    - /var/spool/faas/builds
    - /dev/shm/faas-base-staging

# The compute daemons share selected subdirectories below /var/lib/faas.
# postgres creates this parent as root-only on control-plane images; compute
# hosts need group traversal so non-root imaged can reach its Grype cache and
# OCI cache without broadening any child directory's permissions.
- name: compute_only_service — allow faas daemons to traverse shared state root
  ansible.builtin.file:
    path: /var/lib/faas
    owner: root
    group: faas
    mode: "0750"
    state: directory

# OCI storage uses a read-through disk cache. ProtectSystem=strict only
# permits writes to explicit ReadWritePaths, and image-seeded hosts may
# already contain root-owned shard directories from bootstrap. Make the
# cache writable by the imaged service without changing the modes of cached
# blob files themselves.
- name: compute_only_service — ensure OCI cache root is writable by imaged
  ansible.builtin.file:
    path: /var/lib/faas/cache
    state: directory
    owner: faas-imaged
    group: faas
    mode: "0770"

- name: compute_only_service — normalize existing OCI cache shard directories
  ansible.builtin.command:
    cmd: "find /var/lib/faas/cache -type d -exec chown faas-imaged:faas {} + -exec chmod 0770 {} +"
  changed_when: false

# Tier 3 / ADR-038 §Phase 3 — cosign sign-keypair (build attestation).
# imaged reads /etc/faas/secrets/sign.key at startup
# (cmd/imaged/main.go:103-109 fail-loud os.Stat). The file MUST be
# 0440 root:faas because faas-imaged runs as User=faas-imaged
# Group=faas (deploy/systemd/faas-imaged.service) and reads the
# key via group access; 0400 root:root would be unreadable to a
# non-root daemon. schedd reads the public side (sign-pub.pem,
# 0444 root:root) — world-readable is intentional, the public key
# is non-secret (ADR-038 §Consequences Compatibility). The Go-side
# loader (pkg/cosign/keys.go:50-61) accepts both 0400 and 0440 for
# the private side; the canonical DigitalOcean install is 0440
# root:faas. Mirrors the host.age / session.key fail-loud shape:
# the role fails the playbook BEFORE systemd daemon-reload so a
# drift on a fresh box never reaches production.
#
# Gate-B (issue #297 / ADR-025 §Tier 2): moved from control_plane_service
# so the tripwire travels with the imaged daemon it protects. apid does
# NOT read sign.key, so a false-positive failure on fsn-1 would be a
# bug, not a signal.
- name: compute_only_service — assert sign.key mode is 0440 root:faas (Tier 3)
  ansible.builtin.stat:
    path: /etc/faas/secrets/sign.key
  register: faas_sign_key_stat
  failed_when:
    - >-
      not faas_sign_key_stat.stat.exists
      or faas_sign_key_stat.stat.mode != "0440"
      or faas_sign_key_stat.stat.pw_name != "root"
      or faas_sign_key_stat.stat.gr_name != "faas"

- name: compute_only_service — assert sign-pub.pem mode is 0444 root:root (Tier 3)
  ansible.builtin.stat:
    path: /etc/faas/secrets/sign-pub.pem
  register: faas_sign_pub_stat
  failed_when:
    - >-
      not faas_sign_pub_stat.stat.exists
      or faas_sign_pub_stat.stat.mode != "0444"
      or faas_sign_pub_stat.stat.pw_name != "root"
      or faas_sign_pub_stat.stat.gr_name != "root"

# Spec §11 — ProtectSystem=strict: every ReadWritePaths= target
# MUST exist and be writable by the unit's User= before systemd
# activates the unit, or the mount-namespace setup fails and the
# daemon enters a crash-loop. The 2026-07-31 cd-controlplane
# failure on the EX44 exposed a related but distinct gap: a
# Process could not create a temp file at the root of a whitelisted
# prefix (e.g. /srv/fc/runner-builder-amd64.ext4.tmp.*) because
# only the subdirectories were whitelisted, not /srv/fc/ itself.
# That code-level fix lives in pkg/storage/local.go::Put; this
# assert is the deployment-side belt-and-braces — it pins every
# ReadWritePaths= path to the same list as the unit, so a future
# tighten of the unit that omits a dir the role doesn't create
# fails the playbook rather than crash-looping the daemon on
# the box.
#
# Gate-B: moved from control_plane_service. The list is read from
# the unit file (not hardcoded) so a unit edit does not silently
# drift from the role's mkdir list. The role_path lookup resolves
# to compute_only_service/files/ on fsn-2.
#
# The list is read from the unit file (not hardcoded) so a unit
# edit does not silently drift from the role's mkdir list.
#
# Mega-PR-C extends the tripwire to cover vmmd + builderd alongside
# imaged. All three units run on fsn-2; the tripwire travels with
# the compute-only role so the assert fires on the box the daemons
# actually run on (rather than the control-plane where the units
# never activate). The role loops over the per-unit lookup so
# adding a fourth unit is a one-line list append.
- name: compute_only_service — assert ReadWritePaths= targets exist per unit (spec §11)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ faas_rwp_paths_flat }}"
  vars:
    faas_rwp_unit_contents:
      - "{{ lookup('file', role_path + '/files/faas-imaged.service') }}"
      - "{{ lookup('file', role_path + '/../vmmd_service/files/faas-vmmd.service') }}"
      - "{{ lookup('file', role_path + '/../builderd_service/files/faas-builderd.service') }}"
    faas_rwp_paths_flat: >-
      {{ faas_rwp_unit_contents
         | map('regex_findall', '(?m)^ReadWritePaths=([^\n]+)')
         | map('first')
         | map('split')
         | flatten
         | unique
         | list }}
  register: faas_rwp_stat
  failed_when: not faas_rwp_stat.stat.exists
  loop_control:
    label: "{{ item }}"

# Tier 1 control-plane mTLS (ADR-052). imaged is a Tier 1 server
# (Tier A10 PR-B runtime surface; ADR-053 slice-3 parent-base
# loopback mount exchanges a client leaf with vmmd). The
# compute_only role asserts the imaged server leaf + the
# vmmd-client leaf are laid out under /etc/faas/tls/imaged/. The
# matching `gregalectl pki init --box-role=compute-only` lands these
# (PR-3); on a single-box legacy install, gregalectl pki init issues
# every leaf.
- name: compute_only_service — assert imaged PKI leaves exist (Tier 1)
  ansible.builtin.stat:
    path: "/etc/faas/tls/imaged/{{ item }}.crt"
  loop:
    - server
    - vmmd-client
  register: faas_pki_imaged_leaf_stat
  failed_when: not faas_pki_imaged_leaf_stat.stat.exists

# imaged is non-root and dials vmmd with its dedicated client leaf. Keep the
# assertion next to the role's PKI tripwire so a missing leaf fails during
# provisioning instead of becoming a boot crash-loop.
- name: compute_only_service — assert imaged vmmd client key exists
  ansible.builtin.stat:
    path: /etc/faas/tls/imaged/vmmd-client.key
  register: faas_pki_imaged_client_key_stat
  failed_when: not faas_pki_imaged_client_key_stat.stat.exists

- name: compute_only_service — grant faas group read access to imaged vmmd client key
  ansible.builtin.file:
    path: /etc/faas/tls/imaged/vmmd-client.key
    state: file
    owner: root
    group: faas
    mode: "0440"

- name: compute_only_service — note for operators (NOT auto-enabled)
  ansible.builtin.debug:
    msg: >-
      imaged installed but NOT enabled. Operator runs:
        systemctl enable --now faas-imaged
      once /srv/fc/base is populated and the binary is at
      /opt/faas/current/bin/imaged. The role does not enable imaged
      because it cannot assume the firecracker role ran first on
      the same host.
