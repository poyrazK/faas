# github_actions_runner — provider-neutral trusted deployment runner.
#
# The runner is intentionally pinned like every other downloaded production
# binary. The registration token is short-lived and is read from the
# controller's environment; it must never be committed or put in inventory.

faas_runner_repo: "poyrazK/faas"
faas_runner_version: "2.337.0"
faas_runner_sha256: "70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613"
faas_runner_download_url: "https://github.com/actions/runner/releases/download/v{{ faas_runner_version }}/actions-runner-linux-x64-{{ faas_runner_version }}.tar.gz"

faas_runner_user: faas-runner
faas_runner_group: faas-runner
faas_runner_home: /var/lib/faas-runner
# Durable single-use ledger for signed FleetEnrollmentBundle authorizations.
# It lives outside the runner checkout so a job workspace cleanup cannot make
# a successfully consumed enrollment reusable.
faas_runner_enrollment_state: "{{ faas_runner_home }}/fleet-enrollment-used"
faas_runner_root: /opt/actions-runner
faas_runner_cache: /var/cache/faas-runner
faas_runner_workdir: _work
faas_runner_name: "{{ inventory_hostname }}"
faas_runner_labels:
  - faas-fleet
faas_runner_service: faas-github-runner
faas_runner_registration_token: "{{ lookup('ansible.builtin.env', 'FAAS_RUNNER_REGISTRATION_TOKEN') }}"

# Private fleet endpoints this runner must resolve to their overlay addresses.
# cd-compute fails closed when a manifest host resolves to a public or
# ambiguous address, and a dedicated runner host does not carry the control
# plane's manifest-managed /etc/hosts block. Each entry is
# {address: <IPv4>, names: [<host>, ...]}. Addresses are deployment-specific:
# pass them with -e at bootstrap, never commit them.
faas_runner_private_hosts: []

# cgroup CPU weight of the runner unit (systemd default 100). Low so deploy
# jobs yield to PostgreSQL and the control-plane daemons under contention.
faas_runner_cpu_weight: 20

# deploy: runs rollouts with the fleet's secrets (faas-fleet* label).
# build: compiles and signs unit releases from main (faas-build* label), as
# its own user with no production credentials, inside the limits below
# (deploy/ansible/build_runner.yml, ADR-20261122170000).
faas_runner_kind: deploy
# Optional unit limits; empty leaves systemd's default. A build runner on the
# control plane sets all of them so a compile cannot starve PostgreSQL or
# apid.
faas_runner_cpu_quota: ""
faas_runner_io_weight: ""
faas_runner_memory_high: ""
faas_runner_memory_max: ""
# GOMAXPROCS also bounds `go build`'s parallel compiles (-p defaults to it).
faas_runner_gomaxprocs: ""
faas_runner_protect_system: full
# The build runner's job hook that kills Go processes a cancelled job left
# (templates/faas-build-runner-job-cleanup.sh.j2); build runners only. The
# runner runs a hook only by extension (.sh, .ps1, .js): without one every
# job fails at "Set up runner" (2026-11-22).
faas_runner_job_cleanup_hook: /usr/local/bin/faas-build-runner-job-cleanup.sh
