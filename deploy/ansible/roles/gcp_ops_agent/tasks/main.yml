---
- name: gcp_ops_agent — install Google repository signing key
  ansible.builtin.get_url:
    url: "{{ faas_gcp_ops_agent_key_url }}"
    dest: "{{ faas_gcp_ops_agent_keyring }}"
    checksum: "sha256:{{ faas_gcp_ops_agent_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: faas_gcp_ops_agent_enabled | bool

- name: gcp_ops_agent — configure the distribution repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ faas_gcp_ops_agent_keyring }}]
      https://packages.cloud.google.com/apt
      google-cloud-ops-agent-{{ ansible_distribution_release }}-all main
    filename: google-cloud-ops-agent
    state: present
    update_cache: true
  when: faas_gcp_ops_agent_enabled | bool

- name: gcp_ops_agent — install collector
  ansible.builtin.apt:
    name: google-cloud-ops-agent
    state: present
    update_cache: false
  when: faas_gcp_ops_agent_enabled | bool

- name: gcp_ops_agent — require active collector
  ansible.builtin.systemd_service:
    name: google-cloud-ops-agent
    enabled: true
    state: started
  when: faas_gcp_ops_agent_enabled | bool

- name: gcp_ops_agent — emit a non-sensitive host qualification event
  ansible.builtin.command:
    argv:
      - logger
      - --tag
      - gregale-qualification
      - "Gregale Ops Agent qualification host={{ inventory_hostname }}"
  changed_when: false
  when: faas_gcp_ops_agent_enabled | bool
