# Postgres restart + reload handlers (spec §11).
#
# Why two handlers, not one:
#   * listen_addresses is PGC_POSTMASTER — a change REQUIRES a full
#     restart. notify: restart postgresql.
#   * pg_hba.conf is reload-only — notify: reload postgresql.
# Splitting them keeps restarts off the hot path (pg_hba flips are
# safe under live load) and lets the lineinfile change force exactly
# one restart per idleness epoch.
#
# The chroot image build has no running systemd. These handlers used to
# swallow every failure for that case, which also hid a real host whose
# PostgreSQL failed to restart after a config change: the run reported
# success with the cluster down. Detect systemd once per flush instead and
# let real failures fail the run. Handlers run in definition order, so the
# detection runs before the handlers that read it.

- name: detect systemd for postgres handlers
  ansible.builtin.stat:
    path: /run/systemd/system
  register: postgres_handlers_systemd
  listen:
    - restart postgresql
    - reload postgresql
    - daemon-reload postgres

# The host-configuration lane (ADR 20261018133100) runs with
# faas_stateful_restart_allowed false: a restart-needing change fails the
# run instead of restarting the postmaster. Its tasks ran in check mode, so
# postgresql.conf is unchanged and no restart is left pending. A full
# release or `make bootstrap-control-plane` restarts as before.
- name: refuse a postmaster restart outside a full release
  ansible.builtin.fail:
    msg: >-
      This change needs a PostgreSQL restart, which the host-configuration
      lane never does (docs/adr/20261018133100-host-configuration-lane.md).
      Deploy it with a full release or in a maintenance window.
  listen: restart postgresql
  when: not (faas_stateful_restart_allowed | default(true) | bool)

- name: restart postgresql
  ansible.builtin.service:
    name: "postgresql@{{ postgres_major_version }}-main.service"
    state: restarted
  when:
    - postgres_handlers_systemd.stat.exists | default(false) | bool
    - faas_stateful_restart_allowed | default(true) | bool

- name: reload postgresql
  ansible.builtin.service:
    name: "postgresql@{{ postgres_major_version }}-main.service"
    state: reloaded
  when: postgres_handlers_systemd.stat.exists | default(false) | bool

# Issue #250 — daemon-reload handler for the postgresql@.service.d/
# off-host backup drop-in. Without this, a changed drop-in doesn't take
# effect until the next manual `systemctl daemon-reload`. Mirror the
# canonical fail-closed pattern from control_plane_service/tasks/main.yml.
- name: daemon-reload postgres
  ansible.builtin.systemd:
    daemon_reload: true
  when: postgres_handlers_systemd.stat.exists | default(false) | bool
