# postgres (spec §1, §5).
#
# Installs the distro-supported PostgreSQL server and creates the `faas`
# system user + DB.
# The schema lands in M5 via migrations/00001_init.sql — this role
# only sets up the cluster trust boundary.
#
# Why the meta-packages: Ubuntu 24.04 ships PostgreSQL 16, while older
# supported images expose different majors. The application contract is
# PostgreSQL >= 13, so pinning a package major here makes the role fail on
# otherwise valid provider images.
- name: postgres — install distro PostgreSQL server
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: postgres — discover installed cluster major version
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    recurse: false
  register: postgres_cluster_dirs
  changed_when: false
  failed_when: false

- name: postgres — derive active cluster config directory
  ansible.builtin.set_fact:
    postgres_major_version: >-
      {{ (postgres_cluster_dirs.files | default([])
          | map(attribute='path') | map('basename') | list | sort | last)
         | default('15', true) }}
    postgres_config_dir: >-
      /etc/postgresql/{{ (postgres_cluster_dirs.files | default([])
      | map(attribute='path') | map('basename') | list | sort | last)
      | default('15', true) }}/main

- name: postgres — start + enable
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started
  register: pg_svc
  failed_when: false  # CI/chroot may not have systemd

- name: postgres — allow metrics collector to publish node_exporter textfiles
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: postgres
    group: node_exporter
    mode: "0755"

- name: postgres — install ordinary-connection capacity collector
  ansible.builtin.copy:
    src: faas-postgres-connection-metrics
    dest: /usr/local/bin/faas-postgres-connection-metrics
    owner: root
    group: root
    mode: "0755"

- name: postgres — install connection metrics service
  ansible.builtin.copy:
    src: faas-postgres-connection-metrics.service
    dest: /etc/systemd/system/faas-postgres-connection-metrics.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres

- name: postgres — install connection metrics timer
  ansible.builtin.copy:
    src: faas-postgres-connection-metrics.timer
    dest: /etc/systemd/system/faas-postgres-connection-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres

- name: postgres — enable connection metrics timer
  ansible.builtin.systemd:
    name: faas-postgres-connection-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  failed_when: false

- name: postgres — inspect existing system user `faas`
  ansible.builtin.getent:
    database: passwd
    key: faas
    fail_key: false

- name: postgres — remember whether system user `faas` already exists
  ansible.builtin.set_fact:
    faas_user_exists: "{{ 'faas' in (ansible_facts.getent_passwd | default({})) }}"

- name: postgres — ensure system user `faas` exists
  ansible.builtin.user:
    name: faas
    system: true
    shell: "{{ '/usr/sbin/nologin' if not faas_user_exists else omit }}"
    home: "{{ '/var/lib/faas' if not faas_user_exists else omit }}"
    createhome: "{{ not faas_user_exists }}"
  register: faas_user

- name: postgres — ensure shared faas runtime directory
  ansible.builtin.file:
    path: /var/lib/faas
    state: directory
    owner: faas
    group: faas
    mode: "0750"

- name: postgres — create postgres role `faas`
  community.postgresql.postgresql_user:
    name: faas
    db: faas
    password: "{{ faas_postgres_password | default(omit) }}"
    priv: ALL
    state: present
  become: true
  become_user: postgres
  register: pg_role
  failed_when: false  # pg module may be missing in M0; manual `createuser` fallback below

- name: "postgres — fallback: create role via psql if pg_user module unavailable"
  ansible.builtin.command: >
    sudo -u postgres psql -c "CREATE ROLE faas LOGIN INHERIT;"
  changed_when: false
  failed_when: false
  when: pg_role is failed

- name: postgres — require a password for split-box database clients
  ansible.builtin.assert:
    that:
      - faas_postgres_password is defined
      - faas_postgres_password | string | length > 0
    fail_msg: >-
      faas_postgres_password must be provided through Ansible Vault (or an
      equivalent secret source) when faas_postgres_allowed_cidrs is non-empty;
      refusing to expose a split-box PostgreSQL listener without host auth.
  when: (faas_postgres_allowed_cidrs | default([]) | length) > 0

- name: postgres — create database `faas`
  ansible.builtin.command: >
    sudo -u postgres psql -c "CREATE DATABASE faas OWNER faas;"
  changed_when: false
  failed_when: false

- name: postgres — make /run/postgresql writable for faas (peer auth)
  ansible.builtin.file:
    path: /run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

# Spec §11 ship-blocker: Postgres listens on the unix socket ONLY by default.
# Split-box manifests override `faas_postgres_listen_addresses` with the
# control-plane mesh address; `listen_addresses` is PGC_POSTMASTER and
# therefore still requires a restart when the topology changes.
# `pg_hba.conf` is reload-only. Both handlers in handlers/main.yml fail
# gracefully on hosts without systemd (CI / chroot) so the role stays
# idempotent across the bootstrap path.
- name: postgres — set listen_addresses='' (unix socket only, spec §11)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ faas_postgres_listen_addresses | default('') }}'"
    create: false
  register: pg_listen
  failed_when: false  # chroot/CI may not have the conf file
  notify: restart postgresql

- name: postgres — narrow pg_hba.conf to peer/local auth (spec §11)
  ansible.builtin.copy:
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
    content: |
      # one-box FaaS security baseline (spec §11): unix-socket only.
      # Production clients connect via the local socket in /var/run/postgresql.
      local   all             postgres                                peer
      # pg_basebackup uses PostgreSQL's replication pseudo-database. The
      # `all` rule above does not match it, so authorize only the local
      # postgres OS user through peer authentication.
      local   replication     postgres                                peer
      # Control-plane services run as dedicated OS users but connect as the
      # single faas database role. The ident map keeps peer auth local and
      # avoids placing the database password in sealed.env on the control box.
      local   all             faas                                    peer map=faas_map
      # Split-box compute daemons use a password-authenticated TCP DSN. Keep
      # loopback explicit for operator diagnostics and legacy migrations; the
      # control-plane services use the peer-mapped Unix socket above.
      host    faas            faas                                    127.0.0.1/32            scram-sha-256
      host    faas            faas                                    ::1/128                  scram-sha-256
      {% for cidr in (faas_postgres_allowed_cidrs | default([])) %}
      host    faas            faas                                    {{ cidr }}                scram-sha-256
      {% endfor %}
      host    all             all             127.0.0.1/32            reject
      host    all             all             ::1/128                 reject
  register: pg_hba
  failed_when: false
  notify: reload postgresql

- name: postgres — map control-plane service users to database role faas
  ansible.builtin.blockinfile:
    path: "{{ postgres_config_dir }}/pg_ident.conf"
    create: true
    owner: postgres
    group: postgres
    mode: "0640"
    marker: "# {mark} faas control-plane peer map"
    block: |
      faas_map faas         faas
      faas_map faas-apid    faas
      faas_map faas-schedd  faas
      faas_map faas-meterd  faas
      faas_map faas-githubd faas
      faas_map faas-outboundd faas
  register: pg_ident
  failed_when: false
  notify: reload postgresql

- name: postgres — verify unix-socket-only listeners (defensive)
  ansible.builtin.command: pg_lsclusters
  register: pg_lsclusters
  changed_when: false
  failed_when: false

# Spec §14 M8 acceptance: restore drill needs WAL archived so PG can
# replay from the most recent basebackup. We do the cheapest viable
# thing — local cp to a directory under /var/lib/pgsql/archive —
# rather than reach for pgbackrest or a remote (deferred to M9,
# tracked as out-of-scope in the M8 PR description).
#
# `wal_level = replica` is PGC_POSTMASTER (restart); the rest are
# reload-only. The restart happens exactly once per idleness epoch.
- name: postgres — set wal_level = replica (restart-needed)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?wal_level\\s*="
    line: "wal_level = replica"
    create: false
  register: pg_wal_level
  failed_when: false  # chroot/CI may not have the conf file
  notify: restart postgresql

- name: postgres — enable archive_mode (restart-needed)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?archive_mode\\s*="
    line: "archive_mode = on"
    create: false
  register: pg_archive_mode
  failed_when: false
  notify: restart postgresql

# CAUTION (observed on the live control plane, 2026-09-12): this host's
# postgresql.auto.conf already contains an `archive_command` written by a past
# `ALTER SYSTEM`. auto.conf is read AFTER postgresql.conf and wins, so the
# lineinfile edit below is currently shadowed — changing
# `off_host_backup_wal_path` here would converge the role while having no
# effect on the running server. Check `pg_file_settings` (`applied` column)
# after any change to a role-managed setting, and clear the override with
# `ALTER SYSTEM RESET <name>` if postgresql.conf should own it. Not fixed in
# this change: the two values happen to agree today.
#
# Issue #250: archive_command rewrites WAL → local archive first,
# then best-effort mirrors it to the provider-neutral off-host remote.
# The local copy is authoritative for PostgreSQL: a remote outage or a
# missing optional credential must never prevent WAL recycling.
#
# Ubuntu's pg_ctlcluster sanitizes the systemd launcher environment before
# it starts the postmaster. Render the provider-neutral remote/path into the
# command and use the postgres-readable runtime copy of rclone.conf instead
# of depending on environment variables that never reach archive_command.
- name: postgres — set archive_command (reload-only) — issue # 250
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?archive_command\\s*="
    line: "archive_command = 'if test ! -f /var/lib/pgsql/archive/%f; then cp %p /var/lib/pgsql/archive/%f || exit 1; fi; if test -r /var/lib/pgsql/backup-rclone.conf && grep -Fqx ''[{{ off_host_backup_remote | default('offhostbox', true) }}]'' /var/lib/pgsql/backup-rclone.conf; then rclone copyto /var/lib/pgsql/archive/%f \"{{ off_host_backup_remote | default('offhostbox', true) }}:{{ off_host_backup_wal_path | default('faas-pg-wal', true) }}/%f\" --config=/var/lib/pgsql/backup-rclone.conf --stats=0 --quiet || echo \"off-host WAL push failed for %f\" >&2; fi; exit 0'"
    create: false
  register: pg_archive_cmd
  failed_when: false
  notify: reload postgresql

- name: postgres — bound WAL senders (reload-only, 3 = basebackup + 2 drill slack)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?max_wal_senders\\s*="
    line: "max_wal_senders = 3"
    create: false
  register: pg_wal_senders
  failed_when: false
  notify: reload postgresql

# TCP keepalives — reap backends whose client host vanished.
#
# Without these, Postgres inherits the OS default (tcp_keepalives_idle 7200 s)
# and a backend belonging to a powered-off node holds its connection slot for
# two hours. On 2026-09-12 the control-plane cluster hit max_connections with
# 88 of 96 backends idle; 10 of them belonged to compute-node-2, which CI had
# stopped 1h40m earlier. Both native gates (builder-native.yml, e2e-native.yml)
# start and stop that node nightly, so CI itself strands slots on every cycle.
#
# 60 s idle + 6 probes × 10 s detects a dead peer in ~2 min instead of ~2 h.
# Reload-only: the values are read when a connection is established, so they
# apply to new connections, not existing ones.
#
# DO NOT add idle_session_timeout here. pkg/db/notify.go:Subscribe parks one
# dedicated connection per watcher in LISTEN state for the daemon's lifetime —
# those connections are idle BY DESIGN, and an idle session timeout would
# silently kill every watcher in the fleet.
- name: postgres — TCP keepalives so dead peers free their slots (reload-only)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?{{ item.name }}\\s*="
    line: "{{ item.name }} = {{ item.value }}"
    create: false
  loop:
    - { name: "tcp_keepalives_idle", value: 60 }
    - { name: "tcp_keepalives_interval", value: 10 }
    - { name: "tcp_keepalives_count", value: 6 }
  loop_control:
    label: "{{ item.name }}"
  register: pg_keepalives
  failed_when: false
  notify: reload postgresql

- name: postgres — create WAL archive directory (postgres:postgres 0750)
  ansible.builtin.file:
    path: /var/lib/pgsql/archive
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  failed_when: false  # chroot/CI may not have the user

- name: postgres — remove ineffective off-host backup drop-ins (issue # 1695)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/postgresql.service.d/99-faas-off-host-backup.conf
    - /etc/systemd/system/postgresql@.service.d/99-faas-off-host-backup.conf
    - "/etc/systemd/system/postgresql@{{ postgres_major_version }}-main.service.d/99-faas-off-host-backup.conf"
  failed_when: false
  notify: daemon-reload postgres
