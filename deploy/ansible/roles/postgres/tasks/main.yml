# postgres (spec §1, §5).
#
# Installs the distro-supported PostgreSQL server and creates the `faas`
# system user + DB.
# The schema lands in M5 via migrations/00001_init.sql — this role
# only sets up the cluster trust boundary.
#
# Why the meta-packages: Ubuntu 24.04 ships PostgreSQL 16, while older
# supported images expose different majors. The application contract is
# PostgreSQL >= 13, so pinning a package major here makes the role fail on
# otherwise valid provider images.
- name: postgres — install distro PostgreSQL server
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
      # community.postgresql modules import psycopg2 on the target host.
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: postgres — discover installed cluster major version
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    recurse: false
  register: postgres_cluster_dirs
  changed_when: false
  failed_when: false

- name: postgres — derive active cluster config directory
  ansible.builtin.set_fact:
    postgres_major_version: >-
      {{ (postgres_cluster_dirs.files | default([])
          | map(attribute='path') | map('basename') | list | sort | last)
         | default('15', true) }}
    postgres_config_dir: >-
      /etc/postgresql/{{ (postgres_cluster_dirs.files | default([])
      | map(attribute='path') | map('basename') | list | sort | last)
      | default('15', true) }}/main

- name: postgres — start + enable
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started
  register: pg_svc
  failed_when: false  # CI/chroot may not have systemd

# Same owner/mode as the node_exporter role; the collector writes through its
# node_exporter supplementary group instead of owning the shared directory.
- name: postgres — allow metrics collector to publish node_exporter textfiles
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0775"

- name: postgres — install ordinary-connection capacity collector
  ansible.builtin.copy:
    src: faas-postgres-connection-metrics
    dest: /usr/local/bin/faas-postgres-connection-metrics
    owner: root
    group: root
    mode: "0755"

- name: postgres — install connection metrics service
  ansible.builtin.copy:
    src: faas-postgres-connection-metrics.service
    dest: /etc/systemd/system/faas-postgres-connection-metrics.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres

- name: postgres — install connection metrics timer
  ansible.builtin.copy:
    src: faas-postgres-connection-metrics.timer
    dest: /etc/systemd/system/faas-postgres-connection-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres

- name: postgres — enable connection metrics timer
  ansible.builtin.systemd:
    name: faas-postgres-connection-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  failed_when: false

- name: postgres — inspect existing system user `faas`
  ansible.builtin.getent:
    database: passwd
    key: faas
    fail_key: false

- name: postgres — remember whether system user `faas` already exists
  ansible.builtin.set_fact:
    faas_user_exists: "{{ 'faas' in (ansible_facts.getent_passwd | default({})) }}"

- name: postgres — ensure system user `faas` exists
  ansible.builtin.user:
    name: faas
    system: true
    shell: "{{ '/usr/sbin/nologin' if not faas_user_exists else omit }}"
    home: "{{ '/var/lib/faas' if not faas_user_exists else omit }}"
    createhome: "{{ not faas_user_exists }}"
  register: faas_user

- name: postgres — ensure shared faas runtime directory
  ansible.builtin.file:
    path: /var/lib/faas
    state: directory
    owner: faas
    group: faas
    mode: "0750"

# These must fail loudly. They used to run with failed_when: false and a
# psql fallback gated on `pg_role is failed`, which the override made
# unreachable: on a fresh host without psycopg2 both the role and the
# database silently did not exist while the play reported ok.
- name: postgres — create postgres role `faas`
  community.postgresql.postgresql_user:
    name: faas
    password: "{{ faas_postgres_password | default(omit) }}"
    role_attr_flags: LOGIN
    state: present
  become: true
  become_user: postgres
  # A warm standby is read-only; it receives the role from the primary.
  when: not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — require a password for split-box database clients
  ansible.builtin.assert:
    that:
      - faas_postgres_password is defined
      - faas_postgres_password | string | length > 0
    fail_msg: >-
      faas_postgres_password must be provided through Ansible Vault (or an
      equivalent secret source) when faas_postgres_allowed_cidrs is non-empty;
      refusing to expose a split-box PostgreSQL listener without host auth.
  when:
    - (faas_postgres_allowed_cidrs | default([]) | length) > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — create database `faas`
  community.postgresql.postgresql_db:
    name: faas
    owner: faas
    state: present
  become: true
  become_user: postgres
  when: not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — make /run/postgresql writable for faas (peer auth)
  ansible.builtin.file:
    path: /run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

# Spec §11 ship-blocker: Postgres listens on the unix socket ONLY by default.
# Split-box manifests override `faas_postgres_listen_addresses` with the
# control-plane mesh address; `listen_addresses` is PGC_POSTMASTER and
# therefore still requires a restart when the topology changes.
# `pg_hba.conf` is reload-only. Both handlers in handlers/main.yml fail
# gracefully on hosts without systemd (CI / chroot) so the role stays
# idempotent across the bootstrap path.
- name: postgres — set listen_addresses='' (unix socket only, spec §11)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ faas_postgres_listen_addresses | default('') }}'"
    create: false
  register: pg_listen
  failed_when: false  # chroot/CI may not have the conf file
  # Host-configuration lane (ADR 20261018133100): never restart the
  # postmaster outside a full release; only report the change.
  check_mode: "{{ not (faas_stateful_restart_allowed | default(true) | bool) }}"
  notify: restart postgresql

- name: postgres — narrow pg_hba.conf to peer/local auth (spec §11)
  ansible.builtin.copy:
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
    content: |
      # one-box FaaS security baseline (spec §11): unix-socket only.
      # Production clients connect via the local socket in /var/run/postgresql.
      local   all             postgres                                peer
      # pg_basebackup uses PostgreSQL's replication pseudo-database. The
      # `all` rule above does not match it, so authorize only the local
      # postgres OS user through peer authentication.
      local   replication     postgres                                peer
      # Control-plane services run as dedicated OS users but connect as the
      # single faas database role. The ident map keeps peer auth local and
      # avoids placing the database password in sealed.env on the control box.
      local   all             faas                                    peer map=faas_map
      # Split-box compute daemons use a password-authenticated TCP DSN. Keep
      # loopback explicit for operator diagnostics and legacy migrations; the
      # control-plane services use the peer-mapped Unix socket above.
      host    faas            faas                                    127.0.0.1/32            scram-sha-256
      host    faas            faas                                    ::1/128                  scram-sha-256
      {% for cidr in (faas_postgres_allowed_cidrs | default([])) %}
      host    faas            faas                                    {{ cidr }}                scram-sha-256
      {% endfor %}
      {% if faas_postgres_standby_address | default('') %}
      # ADR-1344 §8: the warm standby streams WAL from this address only, over
      # TLS (the standby verifies the certificate issued below).
      hostssl replication     replicator      {{ faas_postgres_standby_address }}/{{ '128' if ':' in faas_postgres_standby_address else '32' }}            scram-sha-256
      {% endif %}
      host    all             all             127.0.0.1/32            reject
      host    all             all             ::1/128                 reject
  register: pg_hba
  failed_when: false
  notify: reload postgresql

- name: postgres — map control-plane service users to database role faas
  ansible.builtin.blockinfile:
    path: "{{ postgres_config_dir }}/pg_ident.conf"
    create: true
    owner: postgres
    group: postgres
    mode: "0640"
    marker: "# {mark} faas control-plane peer map"
    block: |
      faas_map faas         faas
      # cd-controlplane runs gregalectl/deployctl/migrate as root with
      # --db-env /etc/faas/sealed.env (fleet-seal migrate, deploy, schema).
      # Root can already reach the cluster as postgres; this only lets those
      # tools use the same socket DSN as the daemons.
      faas_map root         faas
      faas_map faas-apid    faas
      faas_map faas-schedd  faas
      faas_map faas-meterd  faas
      faas_map faas-githubd faas
      faas_map faas-outboundd faas
      faas_map faas-bridged faas
  register: pg_ident
  failed_when: false
  notify: reload postgresql

- name: postgres — verify unix-socket-only listeners (defensive)
  ansible.builtin.command: pg_lsclusters
  register: pg_lsclusters
  changed_when: false
  failed_when: false

# Spec §14 M8 acceptance: restore drill needs WAL archived so PG can
# replay from the most recent basebackup. We do the cheapest viable
# thing — local cp to a directory under /var/lib/pgsql/archive —
# rather than reach for pgbackrest or a remote (deferred to M9,
# tracked as out-of-scope in the M8 PR description).
#
# `wal_level = replica` is PGC_POSTMASTER (restart); the rest are
# reload-only. The restart happens exactly once per idleness epoch.
- name: postgres — set wal_level = replica (restart-needed)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?wal_level\\s*="
    line: "wal_level = replica"
    create: false
  register: pg_wal_level
  failed_when: false  # chroot/CI may not have the conf file
  # Host-configuration lane (ADR 20261018133100): never restart the
  # postmaster outside a full release; only report the change.
  check_mode: "{{ not (faas_stateful_restart_allowed | default(true) | bool) }}"
  notify: restart postgresql

- name: postgres — enable archive_mode (restart-needed)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?archive_mode\\s*="
    line: "archive_mode = on"
    create: false
  register: pg_archive_mode
  failed_when: false
  # Host-configuration lane (ADR 20261018133100): never restart the
  # postmaster outside a full release; only report the change.
  check_mode: "{{ not (faas_stateful_restart_allowed | default(true) | bool) }}"
  notify: restart postgresql

# CAUTION (observed on the live control plane, 2026-09-12): this host's
# postgresql.auto.conf already contains an `archive_command` written by a past
# `ALTER SYSTEM`. auto.conf is read AFTER postgresql.conf and wins, so the
# lineinfile edit below is currently shadowed — changing
# `off_host_backup_wal_path` here would converge the role while having no
# effect on the running server. Check `pg_file_settings` (`applied` column)
# after any change to a role-managed setting, and clear the override with
# `ALTER SYSTEM RESET <name>` if postgresql.conf should own it. Not fixed in
# this change: the two values happen to agree today.
#
# Issue #250: archive_command rewrites WAL → local archive first,
# then best-effort mirrors it to the provider-neutral off-host remote.
# The local copy is authoritative for PostgreSQL: a remote outage or a
# missing optional credential must never prevent WAL recycling.
#
# Ubuntu's pg_ctlcluster sanitizes the systemd launcher environment before
# it starts the postmaster. Render the provider-neutral remote/path into the
# command and use the postgres-readable runtime copy of rclone.conf instead
# of depending on environment variables that never reach archive_command.
- name: postgres — set archive_command (reload-only) — issue # 250
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?archive_command\\s*="
    line: "archive_command = 'if test ! -f /var/lib/pgsql/archive/%f; then cp %p /var/lib/pgsql/archive/%f || exit 1; fi; if test -r /var/lib/pgsql/backup-rclone.conf && grep -Fqx ''[{{ off_host_backup_remote | default('offhostbox', true) }}]'' /var/lib/pgsql/backup-rclone.conf; then /usr/local/lib/faas/faas-rclone-backup-identity.py copyto /var/lib/pgsql/archive/%f \"{{ off_host_backup_remote | default('offhostbox', true) }}:{{ off_host_backup_wal_path | default('faas-pg-wal', true) }}/%f\" --config=/var/lib/pgsql/backup-rclone.conf --stats=0 --quiet && touch /var/lib/pgsql/archive/.offhost-last-success || echo \"off-host WAL push failed for %f\" >&2; fi; exit 0'"
    create: false
  register: pg_archive_cmd
  failed_when: false
  notify: reload postgresql

# ADR-1344 §3: bound the data-loss window. Without archive_timeout a quiet
# server can hold committed WAL in the current segment indefinitely, so the
# off-host copy (and a restore from it) can be arbitrarily far behind.
# Forcing a segment switch every 60 s caps the RPO of an off-host restore at
# about a minute. Reload-only (PGC_SIGHUP).
- name: postgres — set archive_timeout = 60s (reload-only) — ADR-1344
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?archive_timeout\\s*="
    line: "archive_timeout = 60s"
    create: false
  register: pg_archive_timeout
  failed_when: false
  notify: reload postgresql

# Statement statistics (2026-10-21). Without pg_stat_statements the only view
# of where the control plane's Postgres CPU goes was sampling pg_stat_activity,
# whose query text stopped at 1 kB. shared_preload_libraries and
# track_activity_query_size are PGC_POSTMASTER (restart); track_io_timing is
# reload-only. The extension is created in the `postgres` maintenance database
# so the `faas` schema stays byte-identical to schema.sql; the view still
# reports statements from every database.
- name: postgres — preload pg_stat_statements (restart-needed)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?shared_preload_libraries\\s*="
    line: "shared_preload_libraries = 'pg_stat_statements'"
    create: false
  failed_when: false
  # Host-configuration lane (ADR 20261018133100): never restart the
  # postmaster outside a full release; only report the change.
  check_mode: "{{ not (faas_stateful_restart_allowed | default(true) | bool) }}"
  notify: restart postgresql

- name: postgres — keep 4 kB of query text in pg_stat_activity (restart-needed)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?track_activity_query_size\\s*="
    line: "track_activity_query_size = 4096"
    create: false
  failed_when: false
  # Host-configuration lane (ADR 20261018133100): never restart the
  # postmaster outside a full release; only report the change.
  check_mode: "{{ not (faas_stateful_restart_allowed | default(true) | bool) }}"
  notify: restart postgresql

- name: postgres — time block I/O in statement statistics (reload-only)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?track_io_timing\\s*="
    line: "track_io_timing = on"
    create: false
  failed_when: false
  notify: reload postgresql

- name: postgres — create pg_stat_statements in the maintenance database
  community.postgresql.postgresql_ext:
    name: pg_stat_statements
    # community.postgresql 5.0.0 (requirements.yml) takes login_db; the
    # removed `db` alias failed rc.284's control-plane convergence.
    login_db: postgres
    state: present
  become: true
  become_user: postgres
  # A warm standby is read-only; CREATE EXTENSION runs on the primary.
  when: not (faas_postgres_standby_mode | default(false) | bool)

# `ALTER SYSTEM` writes postgresql.auto.conf, which PostgreSQL reads after
# postgresql.conf. A stale value there silently shadows the role-managed
# archive_command and can send live WAL to a different namespace than the
# restore and prune paths. Once the cluster is reachable, clear that override
# when the effective command does not contain the canonical remote/path. The
# lineinfile above remains the single source of truth for the replacement.
- name: postgres — read effective archive_command for namespace guard
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -A
      - -t
      - -c
      - SHOW archive_command
  become: true
  become_user: postgres
  register: pg_effective_archive_command
  changed_when: false
  failed_when: false

- name: postgres — clear stale ALTER SYSTEM archive_command override
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -c
      - ALTER SYSTEM RESET archive_command
  become: true
  become_user: postgres
  register: pg_archive_override_reset
  changed_when: pg_archive_override_reset.rc == 0
  failed_when: false
  when:
    - pg_effective_archive_command.rc == 0
    - (pg_effective_archive_command.stdout | trim) != ''
    - (off_host_backup_remote | default('offhostbox', true)) ~ ':' ~ (off_host_backup_wal_path | default('faas-pg-wal', true)) ~ '/%f' not in pg_effective_archive_command.stdout
  notify: reload postgresql

- name: postgres — bound WAL senders (reload-only, 3 = basebackup + 2 drill slack)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?max_wal_senders\\s*="
    line: "max_wal_senders = 3"
    create: false
  register: pg_wal_senders
  failed_when: false
  notify: reload postgresql

# JIT off. PostgreSQL's default (jit=on, jit_above_cost 100000) LLVM-compiles
# any statement the planner costs above 100k, with inlining and optimization
# above 500k. The planner's cost is a poor proxy for runtime on our OLTP
# reads, and on the 2-vCPU control plane the compile dominates: the wake
# timeline's boot lookup (100 wake ids) ran past a 20 s statement timeout
# with JIT and took 1.0 s without it (production-us hunt #9, H9-159); the
# ADR-422 capacity snapshot was 6-8 s vs 10 ms and is already pinned off per
# function (migration 20261004191632612). Reload-only.
- name: postgres — disable JIT (reload-only)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?jit\\s*="
    line: "jit = off"
    create: false
  register: pg_jit
  failed_when: false
  notify: reload postgresql

# TCP keepalives — reap backends whose client host vanished.
#
# Without these, Postgres inherits the OS default (tcp_keepalives_idle 7200 s)
# and a backend belonging to a powered-off node holds its connection slot for
# two hours. On 2026-09-12 the control-plane cluster hit max_connections with
# 88 of 96 backends idle; 10 of them belonged to compute-node-2, which CI had
# stopped 1h40m earlier. Both native gates (builder-native.yml, e2e-native.yml)
# start and stop that node nightly, so CI itself strands slots on every cycle.
#
# 60 s idle + 6 probes × 10 s detects a dead peer in ~2 min instead of ~2 h.
# Reload-only: the values are read when a connection is established, so they
# apply to new connections, not existing ones.
#
# DO NOT add idle_session_timeout here. pkg/db/notify.go:Subscribe parks one
# dedicated connection per watcher in LISTEN state for the daemon's lifetime —
# those connections are idle BY DESIGN, and an idle session timeout would
# silently kill every watcher in the fleet.
- name: postgres — TCP keepalives so dead peers free their slots (reload-only)
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?{{ item.name }}\\s*="
    line: "{{ item.name }} = {{ item.value }}"
    create: false
  loop:
    - { name: "tcp_keepalives_idle", value: 60 }
    - { name: "tcp_keepalives_interval", value: 10 }
    - { name: "tcp_keepalives_count", value: 6 }
  loop_control:
    label: "{{ item.name }}"
  register: pg_keepalives
  failed_when: false
  notify: reload postgresql

# ADR-1344 §8 warm standby, primary side. Everything below is keyed off
# faas_postgres_standby_address, which the manifest renders only when it
# declares postgresql.standby; without it these tasks change nothing.
#
# The slot keeps WAL until the standby has it, so a short outage of the
# standby or the link never forces a reseed. max_slot_wal_keep_size caps that
# retention: past it the slot is invalidated (FaasPostgresStandbySlotLost)
# and the standby must be reseeded, but the primary's disk never fills.
- name: postgres — cap WAL kept for the standby slot (reload-only) — ADR-1344
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?max_slot_wal_keep_size\\s*="
    line: "max_slot_wal_keep_size = {{ faas_postgres_max_slot_wal_keep_size | default('16GB') }}"
    create: false
  failed_when: false  # chroot/CI may not have the conf file
  notify: reload postgresql
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

# Only an active setting is removed; the stock commented default stays.
- name: postgres — remove the standby WAL cap without a standby (reload-only) — ADR-1344
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^max_slot_wal_keep_size\\s*="
    state: absent
  failed_when: false  # chroot/CI may not have the conf file
  notify: reload postgresql
  when:
    - not (faas_postgres_standby_address | default(''))
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — require the replication password for the standby — ADR-1344
  ansible.builtin.assert:
    that:
      - faas_postgres_replication_password is defined
      - faas_postgres_replication_password | string | length >= 16
    fail_msg: >-
      postgresql.standby is declared, so the primary needs
      faas_postgres_replication_password (Ansible Vault, at least 16
      characters) for the replicator role.
    quiet: true
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — create replication role `replicator` — ADR-1344
  community.postgresql.postgresql_user:
    name: replicator
    password: "{{ faas_postgres_replication_password }}"
    role_attr_flags: LOGIN,REPLICATION
    state: present
  become: true
  become_user: postgres
  no_log: true
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — create the standby's physical replication slot — ADR-1344
  community.postgresql.postgresql_slot:
    name: faas_standby
    slot_type: physical
    state: present
  become: true
  become_user: postgres
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

# Replication TLS. The standby connects with sslmode=verify-full against this
# self-signed certificate, which postgres_standby copies from here over the
# Ansible connection, and pg_hba admits the replicator over TLS only. WAL is
# therefore encrypted and the primary authenticated whatever network carries
# it: a `static` overlay has no encryption of its own. Ubuntu's default
# snakeoil certificate is neither verifiable nor stable, so it is not used.
#
# The certificate is reissued when it is missing, when the names the standby
# dials change, or within 30 days of expiry; the standby then needs a
# converge to pin the new one (docs/runbooks/FaasPostgresStandby.md).
- name: postgres — replication TLS names and paths — ADR-1344
  ansible.builtin.set_fact:
    postgres_replication_tls_dir: "{{ faas_postgres_replication_tls_dir | default('/etc/postgresql/faas-tls') }}"
    # The names the standby dials: by default the address the discovery play
    # published (postgres_standby's faas_postgres_primary_host) and the
    # inventory name. Override when the standby uses another address.
    postgres_replication_tls_san: >-
      {%- for name in (faas_postgres_replication_tls_names | default([faas_private_dns_address | default(''), inventory_hostname])) | select | unique -%}{{ 'IP:' if (name is match('^[0-9.]+$') or ':' in name) else 'DNS:' }}{{ name }}{{ '' if loop.last else ',' }}{%- endfor -%}
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — replication TLS directory — ADR-1344
  ansible.builtin.file:
    path: "{{ postgres_replication_tls_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — read the names on the replication certificate — ADR-1344
  ansible.builtin.slurp:
    src: "{{ postgres_replication_tls_dir }}/server.san"
  register: postgres_replication_tls_current_san
  failed_when: false
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — check the replication certificate is valid for 30 more days — ADR-1344
  ansible.builtin.command:
    argv: [openssl, x509, -noout, -checkend, "2592000", -in, "{{ postgres_replication_tls_dir }}/server.crt"]
  register: postgres_replication_tls_checkend
  changed_when: false
  failed_when: false
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

# Written beside the live pair and renamed over it, so a failed run never
# leaves a key that does not match its certificate (PostgreSQL would then
# refuse to start).
- name: postgres — issue the replication certificate — ADR-1344
  ansible.builtin.command:
    argv:
      - sh
      - -ec
      - |
        umask 077
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
          -days 3650 -subj "/CN=$3" -addext "subjectAltName=$2" \
          -keyout "$1/server.key.new" -out "$1/server.crt.new"
        mv "$1/server.key.new" "$1/server.key"
        mv "$1/server.crt.new" "$1/server.crt"
      - sh
      - "{{ postgres_replication_tls_dir }}"
      - "{{ postgres_replication_tls_san }}"
      - "faas-postgres-replication-{{ inventory_hostname }}"
  become: true
  become_user: postgres
  changed_when: true
  notify: reload postgresql
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)
    - >-
      postgres_replication_tls_checkend.rc != 0
      or (postgres_replication_tls_current_san.content | default('') | b64decode | trim) != postgres_replication_tls_san

- name: postgres — record the names on the replication certificate — ADR-1344
  ansible.builtin.copy:
    dest: "{{ postgres_replication_tls_dir }}/server.san"
    content: "{{ postgres_replication_tls_san }}\n"
    owner: postgres
    group: postgres
    mode: "0600"
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

# PostgreSQL refuses a key that its group or others can read.
- name: postgres — restrict the replication key — ADR-1344
  ansible.builtin.file:
    path: "{{ postgres_replication_tls_dir }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

# Ubuntu's postgresql.conf already ends with this include; the standby role
# asserts the same line.
- name: postgres — keep the distro conf.d include (replication TLS) — ADR-1344
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: "^#?include_dir\\s*="
    line: "include_dir = 'conf.d'"
    create: false
  failed_when: false  # chroot/CI may not have the conf file
  notify: reload postgresql
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

# ssl and the certificate paths are reload-only (PGC_SIGHUP). A reload that
# cannot load the files keeps the previous TLS configuration.
- name: postgres — serve the replication certificate (reload-only) — ADR-1344
  ansible.builtin.copy:
    dest: "{{ postgres_config_dir }}/conf.d/80-faas-replication-tls.conf"
    owner: postgres
    group: postgres
    mode: "0644"
    content: |
      # Managed by Ansible (postgres). ADR-1344 §8: the warm standby verifies
      # this certificate (sslmode=verify-full). Removed with postgresql.standby.
      ssl = on
      ssl_cert_file = '{{ postgres_replication_tls_dir }}/server.crt'
      ssl_key_file = '{{ postgres_replication_tls_dir }}/server.key'
  failed_when: false  # chroot/CI may not have the conf directory
  notify: reload postgresql
  when:
    - (faas_postgres_standby_address | default('')) | length > 0
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — stop serving the replication certificate without a standby (reload-only) — ADR-1344
  ansible.builtin.file:
    path: "{{ postgres_config_dir }}/conf.d/80-faas-replication-tls.conf"
    state: absent
  notify: reload postgresql
  when:
    - not (faas_postgres_standby_address | default(''))
    - not (faas_postgres_standby_mode | default(false) | bool)

# Removing postgresql.standby from the manifest must also drop the slot: an
# abandoned slot holds WAL up to max_slot_wal_keep_size, and once that line is
# gone, without limit. A connected standby reconnects within moments of its
# walsender ending, so the replicator login is closed first; then the
# walsender is ended and the slot dropped. Declaring a standby again restores
# the login (the replicator task above).
- name: postgres — look for an abandoned standby slot — ADR-1344
  ansible.builtin.command:
    argv: [psql, -X, -A, -t, -c, "SELECT slot_name FROM pg_replication_slots WHERE slot_name = 'faas_standby'"]
  become: true
  become_user: postgres
  register: postgres_abandoned_standby_slot
  changed_when: false
  failed_when: false  # chroot/CI has no running cluster
  when:
    - not (faas_postgres_standby_address | default(''))
    - not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — drop the abandoned standby slot — ADR-1344
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "DO $$BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'replicator') THEN ALTER ROLE replicator NOLOGIN; END IF; END$$"
      - -c
      - "SELECT pg_terminate_backend(active_pid, 5000) FROM pg_replication_slots WHERE slot_name = 'faas_standby' AND active_pid IS NOT NULL"
      - -c
      - "SELECT pg_drop_replication_slot('faas_standby')"
  become: true
  become_user: postgres
  changed_when: true
  when:
    - not (faas_postgres_standby_address | default(''))
    - not (faas_postgres_standby_mode | default(false) | bool)
    - (postgres_abandoned_standby_slot.stdout | default('') | trim) == 'faas_standby'

# postgres_standby writes this file on a standby: the primary's connection,
# its slot and the primary's hot-standby limits. Once the host is promoted and
# converged as the primary, its own settings must win again.
- name: postgres — remove standby settings from a primary — ADR-1344
  ansible.builtin.file:
    path: "{{ postgres_config_dir }}/conf.d/90-faas-standby.conf"
    state: absent
  # Host-configuration lane (ADR 20261018133100): never restart the
  # postmaster outside a full release; only report the change.
  check_mode: "{{ not (faas_stateful_restart_allowed | default(true) | bool) }}"
  notify: restart postgresql
  when: not (faas_postgres_standby_mode | default(false) | bool)

- name: postgres — create WAL archive directory (postgres:postgres 0750)
  ansible.builtin.file:
    path: /var/lib/pgsql/archive
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  failed_when: false  # chroot/CI may not have the user

- name: postgres — remove ineffective off-host backup drop-ins (issue # 1695)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/postgresql.service.d/99-faas-off-host-backup.conf
    - /etc/systemd/system/postgresql@.service.d/99-faas-off-host-backup.conf
    - "/etc/systemd/system/postgresql@{{ postgres_major_version }}-main.service.d/99-faas-off-host-backup.conf"
  failed_when: false
  notify: daemon-reload postgres

# CPU priority (2026-10-21). On the split-box control plane PostgreSQL shares
# two vCPUs with Prometheus, Grafana and the GitHub runners; deploy jobs pushed
# the load average to 13-17 and a trivial `select 1` to 65 ms. A cgroup weight
# on PostgreSQL's slice keeps the database ahead of those siblings under
# contention and costs nothing when the host is idle. The runner and
# Prometheus roles lower their own units' weights.
- name: postgres — weight the PostgreSQL slice for CPU contention
  ansible.builtin.copy:
    dest: /etc/systemd/system/system-postgresql.slice.d/50-faas-cpu-weight.conf
    content: |
      # Managed by Ansible (roles/postgres). See the task comment for the reason.
      [Slice]
      CPUWeight={{ faas_postgres_cpu_weight | default(1000) }}
    owner: root
    group: root
    mode: "0644"
  failed_when: false  # chroot/CI may not have systemd
  notify: daemon-reload postgres
