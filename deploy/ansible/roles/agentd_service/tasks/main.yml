---
# agentd_service — install and run agentd (ADR-20261027090010, ADR-20261027090014). agentd reads
# its DATABASE_URL from /etc/faas/secrets/agentd/agentd.env and the artifact
# store from /etc/faas/storage.env, and reaches schedd and githubd on their
# local sockets, so it runs on the control plane (or a single box).
- name: agentd_service — require a configured agentd when enabled
  ansible.builtin.assert:
    that:
      - faas_box_role | default('single-box') in ['control-plane', 'single-box']
      - faas_agentd_env_src | length > 0
      - faas_agentd_concurrency | int >= 1
      - faas_agentd_concurrency | int <= 256
      - faas_agentd_metrics_listen is match('^(127\.0\.0\.1|\[::1\]):[0-9]+$')
      - faas_agentd_s3_endpoint | length == 0 or faas_agentd_s3_endpoint is match('^https://')
    fail_msg: >-
      agentd runs on a control-plane (or single-box) host and needs
      faas_agentd_env_src (its DATABASE_URL), a concurrency of 1-256, a
      loopback metrics listener and an https S3 endpoint when one is set.
      See roles/agentd_service/README.md.
  when: faas_agentd_enabled | bool

- name: agentd_service — install systemd unit
  ansible.builtin.copy:
    src: faas-agentd.service
    dest: /etc/systemd/system/faas-agentd.service
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-agentd

- name: agentd_service — create unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-agentd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: agentd_service — create secret directory
  ansible.builtin.file:
    path: /etc/faas/secrets/agentd
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: faas_agentd_enabled | bool

# PRIVATE bucket: 0400 root:root, read by systemd as the unit's
# EnvironmentFile (ADR-127 per-daemon secret files).
- name: agentd_service — install the database environment
  ansible.builtin.copy:
    src: "{{ faas_agentd_env_src }}"
    dest: /etc/faas/secrets/agentd/agentd.env
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when: faas_agentd_enabled | bool
  notify: restart faas-agentd

- name: agentd_service — install run configuration drop-in
  ansible.builtin.template:
    src: 50-faas-agentd.conf.j2
    dest: /etc/systemd/system/faas-agentd.service.d/50-faas-agentd.conf
    owner: root
    group: root
    mode: "0644"
  when: faas_agentd_enabled | bool
  notify: restart faas-agentd

- name: agentd_service — remove configuration when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/faas-agentd.service.d/50-faas-agentd.conf
    - /etc/faas/secrets/agentd/agentd.env
  when: not (faas_agentd_enabled | bool)

# Apply configuration restarts before probing, so an already-running agentd
# cannot pass the readiness check with its old configuration.
- name: agentd_service — apply configuration handlers before readiness
  ansible.builtin.meta: flush_handlers

- name: agentd_service — enable and start agentd
  ansible.builtin.systemd_service:
    name: faas-agentd.service
    enabled: true
    state: started
    daemon_reload: true
  when: faas_agentd_enabled | bool

- name: agentd_service — stop and disable agentd when requested
  ansible.builtin.systemd_service:
    name: faas-agentd.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: not (faas_agentd_enabled | bool)

- name: agentd_service — verify metrics
  ansible.builtin.uri:
    url: "http://{{ faas_agentd_metrics_listen }}/metrics"
    method: GET
    status_code: 200
  register: faas_agentd_metrics
  retries: 10
  delay: 3
  until: faas_agentd_metrics.status == 200
  when: faas_agentd_enabled | bool
