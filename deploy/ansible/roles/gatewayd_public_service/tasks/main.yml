# gatewayd_public_service — install systemd unit for
# gatewayd-public (Tier A7 split, ADR-070).
#
# Plain-HTTP edge: TLS terminates at Caddy + Cloudflare upstream
# (api.gregale.dev). This daemon serves plain HTTP on 127.0.0.1:8080
# and reverse-proxies to gatewayd-internal. There is no certmagic
# storage, no ACME account dir, and no operator-supplied Hetzner DNS
# token — those concerns live with the upstream Caddy.
#
# What's NOT here (operator-provisioned):
#   - the Caddy upstream config (out of this role; reverse-proxy to
#     http://127.0.0.1:8080)
#   - enable the unit (`systemctl enable --now faas-gatewayd-public`)
#   - run the daemon (Caddy reverse-proxy upstream is the trigger)

- name: gatewayd_public_service — install systemd unit
  notify: restart faas-gatewayd-public
  ansible.builtin.copy:
    src: faas-gatewayd-public.service
    dest: /etc/systemd/system/faas-gatewayd-public.service
    owner: root
    group: root
    mode: "0644"
  register: gatewayd_public_unit

- name: gatewayd_public_service — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: gatewayd_public_unit.changed

- name: gatewayd_public_service — create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-gatewayd-public.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the gatewayd-public unit (env-only — no config.go).
# Drop-in mirrors deploy/ansible/roles/control_plane_service/
# templates/99-faas-node-name.conf.j2 — body is identical across
# roles.
- name: gatewayd_public_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  notify: restart faas-gatewayd-public
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-public.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to gatewayd-public via FAAS_GATEWAYD_PUBLIC_ROLE
# (distinct from FAAS_GATEWAYD_ROLE that gatewayd-internal reads).
# cmd/gatewayd-public/main.go::role.Require picks up
# faas_box_role (control-plane on fsn-1). See
# roles/gatewayd_public_service/templates/99-faas-role.conf.j2
# for the full rationale.
- name: gatewayd_public_service — install FAAS_GATEWAYD_PUBLIC_ROLE drop-in (Mega-PR-C)
  notify: restart faas-gatewayd-public
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-public.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"

- name: gatewayd_public_service — install split-box internal target drop-in
  ansible.builtin.template:
    src: 99-faas-internal-target.conf.j2
    dest: /etc/systemd/system/faas-gatewayd-public.service.d/99-faas-internal-target.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart faas-gatewayd-public
