---
# ADR-143: every unit, drop-in and config change must reach the running
# daemon. `systemctl try-restart` only restarts an ACTIVE unit, so the first
# bootstrap (before the operator's `gregalectl secrets init` + `systemctl
# enable --now`) stays a no-op and an unconfigured daemon is never started
# into a crash loop. The daemon-reload handler is listed first because
# handlers run in file order and a drop-in change is invisible to systemd
# until the manager reloads.
- name: gatewayd_public_service — daemon-reload after unit or drop-in changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen:
    - restart faas-gatewayd-public

- name: gatewayd_public_service — reload or restart faas-gatewayd-public
  # Hand off (ADR-1736) when nothing systemd reads changed, else restart:
  # a restart cuts long MCP calls and SSE streams (ADR-20261123110000).
  ansible.builtin.command: /usr/local/sbin/faas-reload-or-restart faas-gatewayd-public.service gatewayd-public
  changed_when: true
  listen: restart faas-gatewayd-public
  when: not (faas_join_defer_service_handlers | default(false) | bool)

- name: gatewayd_public_service — reload validated Caddy configuration
  ansible.builtin.systemd_service:
    name: caddy.service
    state: reloaded
  listen: reload caddy
  when: not (faas_join_defer_service_handlers | default(false) | bool)
