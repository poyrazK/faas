---
# Raw TCP ingress is an explicit rollout switch. Keep it disabled unless the
# host firewall is opened for the same listener range and the operator has
# verified the staging workload path.
faas_tcpd_enabled: false
faas_tcpd_bind_host: 0.0.0.0
faas_tcpd_max_bytes: ''
faas_tcpd_max_connections: ''
faas_tcpd_refresh_interval: ''
faas_tcpd_schedd_target: ''
faas_tcpd_schedd_tls_ca_path: ''
faas_tcpd_schedd_tls_cert_path: ''
faas_tcpd_schedd_tls_key_path: ''
faas_tcpd_vmmd_tls_ca_path: ''
faas_tcpd_vmmd_tls_cert_path: ''
faas_tcpd_vmmd_tls_key_path: ''
