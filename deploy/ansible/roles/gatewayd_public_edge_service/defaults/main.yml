---
# ADR-1343: the app edge on a compute node. The manifest's
# public_edge.compute_nodes sets this per cell; off removes the edge again.
faas_edge_on_compute_nodes: false

# The control plane's private gatewayd-public listener, which receives public
# object reads, uploads and the OTLP endpoint from this edge. Rendered by the
# manifest as http://<control-plane private address>:8090.
faas_edge_control_plane_target: ''

# ADR-20261031105055: send each app host to the gatewayd-internal of the node
# that last served it, instead of this node's. The manifest's
# public_edge.placement_routing sets it per cell.
faas_edge_placement_routing: false
# ADR-20261102081618 §5b: spread each app host's requests over every node the
# app runs on, by ready instances. The manifest's
# public_edge.placement_node_set sets it.
faas_edge_placement_node_set: false
# ADR-20261103163954 §4: per-client-address limits on requests and, with
# faas_edge_public_front none, on connections and TLS handshakes. The values
# are in pkg/api/limits.go.
faas_edge_client_limits: false
# ADR-20261110123517: the node-wide overload level on top of the client
# limits: off, observe (measure and export, refuse nothing) or on. The
# manifest's public_edge.overload sets it.
faas_edge_overload: "off"
# ADR-20261102081618: how Cloudflare reaches this edge. "tunnel", the default,
# is the connector only; "both" also opens the edge's TLS listener on
# faas_edge_public_tls_port for proxied address records. The manifest's
# public_edge.entry sets it per cell.
faas_edge_entry: tunnel
faas_edge_public_tls_port: 443
# Operator-provisioned secrets, never in inventory or the repository: the
# zone's Cloudflare Origin CA certificate and key (the pair the control
# plane's Caddy serves), and the CA behind the zone's Authenticated Origin
# Pulls certificate. The edge reads all three through systemd LoadCredential.
faas_edge_public_tls_cert: /etc/faas/secrets/edge-tls/origin.pem
faas_edge_public_tls_key: /etc/faas/secrets/edge-tls/origin.key
faas_edge_public_tls_client_ca: /etc/faas/secrets/edge-tls/origin-pull-ca.pem
# ADR-20261103163954: what stands in front of the edge's TLS listener.
# "cloudflare", the default, requires the zone's client certificate above.
# "none" serves clients directly: it verifies that certificate only when
# given (so a proxied record still works, the way back under attack), and
# faas_edge_public_tls_cert must be publicly trusted. The manifest's
# public_edge.front and the firewall follow in a later step; until then
# "none" is for a hand-run pilot only.
faas_edge_public_front: cloudflare
# ADR-20261103163954 §3: where the edge's certificate comes from. "file", the
# default, is faas_edge_public_tls_cert and _key above. "database" is the
# apps domains' certificate edgednsd stores: the edge opens its key with the
# edge-tls seal domain's identity (which the seal_domains role stages at
# faas_edge_public_tls_identity and hands the edge) and holds it in memory
# only, and serves only certificates from faas_edge_public_tls_cert_ca.
faas_edge_public_tls_cert_source: file
faas_edge_public_tls_cert_ca: letsencrypt
faas_edge_public_tls_identity: /etc/faas/secrets/domains/edge-tls.age

# Cloudflare Tunnel connector, pinned by version and per-architecture SHA-256
# (cloudflare/cloudflared release notes, matching GitHub's asset digests).
# --token-file needs 2025.4.0 or later.
faas_cloudflared_version: "2026.9.3"
faas_cloudflared_sha256:
  amd64: 77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2
  arm64: aaeb2d7d0da3614634c7e03ab13487a1522c2e79165ed2929cfe23d5e95b326d
faas_cloudflared_install_dir: "/opt/faas/cloudflared/{{ faas_cloudflared_version }}"

# The cell's tunnel token, provisioned by the operator. The connector stays
# stopped until the file exists (ConditionPathExists) and reads it through
# systemd LoadCredential, so it never appears in the unit or the process list.
faas_cloudflared_token_path: /etc/faas/secrets/cloudflared/tunnel-token

# Prometheus endpoint of the connector. The control plane scrapes it per node
# (ADR-1343 §5); nftables admits only the control plane on this port.
faas_cloudflared_metrics_addr: 0.0.0.0:20241

# ADR-1343 §6: how long a stopping connector serves its in-flight requests
# after it withdraws from the tunnel (matches the edge's 25 s drain grace
# with margin), and how long systemd waits for it.
faas_cloudflared_grace_period: 30s
faas_cloudflared_stop_timeout: 45s
# The manifest's hot_path.edge_keepalive_per_node sets it.
faas_internal_keepalive_per_node: false
