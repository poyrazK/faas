---
# ADR-143: every unit and drop-in change must reach the running daemon. The
# daemon-reload handler runs first because a drop-in change is invisible to
# systemd until the manager reloads. try-restart touches only active units.
- name: gatewayd_public_edge_service — daemon-reload after unit or drop-in changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen:
    - restart faas-gatewayd-public-edge
    - restart faas-cloudflared

- name: gatewayd_public_edge_service — try-restart faas-gatewayd-public-edge
  ansible.builtin.command: systemctl try-restart faas-gatewayd-public-edge.service  # noqa: command-instead-of-module (systemd module has no try-restart)
  changed_when: true
  listen: restart faas-gatewayd-public-edge
  when: not (faas_join_defer_service_handlers | default(false) | bool)

- name: gatewayd_public_edge_service — try-restart faas-cloudflared
  ansible.builtin.command: systemctl try-restart faas-cloudflared.service  # noqa: command-instead-of-module (systemd module has no try-restart)
  changed_when: true
  listen: restart faas-cloudflared
  when: not (faas_join_defer_service_handlers | default(false) | bool)
