---
# nftables role defaults — mirror pkg/netns constants so ansible tasks
# can reference them by name. Keep these in lockstep with the Go source
# of truth (pkg/netns/config.go: TenantBridge, HostBridgeCIDR).
#
# Per-host egress (ADR-055). `public_iface` and `masquerade_cidr` are
# the per-host substitution points. The interface defaults to the
# gathered host fact so the same manifest works on GCP (`ens4`), Hetzner
# (`ens5`), and bare metal (`eth0`) without hand-editing each host. An
# operator can still override it with `host_vars[<compute_node>].public_iface`
# when the default route is intentionally not the egress NIC. The Jinja2 template at
# `templates/policy_nftables.conf.j2` substitutes these values site-for-
# site. The Go render (`cmd/faas-nft-render` with the matching flags
# or `FAAS_PUBLIC_IFACE` / `FAAS_MASQUERADE_CIDR` envs) is the
# source of truth; `make egress-render-cross-check` byte-compares the
# two for the default values.
#
# Mega-PR-C (issue #911 / ADR-110): overlay_cidrs +
# masquerade_cidr_v6 wire-through. The Go renderer (pkg/netns)
# accepts overlay_cidrs (slice) and masquerade_cidr_v6 (string) but
# the Jinja2 template was missing both — so a multi-host fleet
# using overlay / v6 ended up with the nftables ruleset missing
# the overlay-cidr exclude + the v6 MASQUERADE. Default to empty
# (single-box dev gets no overlay — the overlay role is responsible
# for the per-host bridge).
tenant_bridge: br-tenants
bridge_cidr: 10.100.0.1/16
public_iface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
masquerade_cidr: 10.100.0.0/16
overlay_cidrs: []
masquerade_cidr_v6: ''
# Split-box PostgreSQL ingress. The manifest generator sets these only on
# the control-plane host; an empty list preserves the single-box firewall.
faas_postgres_allowed_cidrs: []
# Split-box scheduler ingress. Compute nodes stream capacity to schedd on
# TCP/9091; keep this separate from PostgreSQL so the firewall contract is
# explicit even though both lists are currently derived from the same fleet.
faas_compute_allowed_cidrs: []
# Control-plane TCP services reached by compute nodes. The AppErrors
# listener is the additive 9093 endpoint; older inventories can override
# this list explicitly while single-box hosts leave the CIDR list empty.
faas_compute_allowed_ports:
  - 8081
  - 9091
  - 9093
# Control-plane ingress to compute services. The manifest generator sets
# these only on compute-only hosts; an empty list keeps the one-box policy.
faas_control_plane_allowed_cidrs: []
# Compute-side TCP services reached by the control plane. The four metrics
# listeners remain limited to the private control-plane CIDRs; they are not
# opened by the public 22/80/443 rule.
faas_control_plane_allowed_ports:
  - 50051
  - 8080
  - 9092
  - 9102
  - 9104
  - 9105
  - 9107
