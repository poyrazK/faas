# Keep the app-owned raw TCP/UDP public port range out of the kernel's
# ephemeral port pool. The range is state.TCPListenerPublicPortMin..Max and
# api.UDPListenerPublicPortMin..Max (40000-49999), which sits inside the
# default net.ipv4.ip_local_port_range (32768-60999). Without this, an
# outbound connection or DNS query from any process on the host can hold one
# of those ports and make gatewayd-public's listener bind fail with
# EADDRINUSE.
net.ipv4.ip_local_reserved_ports = 40000-49999
