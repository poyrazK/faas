# nftables (spec §7, §11).
#
# Tenant egress policy per spec §7/§11:
#   - default drop forward
#   - deny SMTP (25/465/587) — functions don't email
#   - deny RFC1918, link-local (169.254/16), metadata — no internal
#     network or metadata exfiltration
#   - allow outbound to public IPs only
#
# The tap-side NAT is used in M2+ when gatewayd-internal pulls guest traffic
# out to the public net; we deploy it now so the ruleset is converged
# before the first cold boot.
#
# Source of truth for the ruleset is `pkg/netns/policy.go`'s HostPolicy
# renderer. The Jinja2 template at `templates/policy_nftables.conf.j2`
# (ADR-055) substitutes `public_iface` and `masquerade_cidr` per host
# from `defaults/main.yml` (overridable via `host_vars[<compute_node>]`).
# The Go renderer is the source of truth; `make egress-render-cross-check`
# byte-compares the two for the default values. The bridge name
# (`br-tenants`) must match `pkg/netns.TenantBridge` — the unit test
# `TestTenantBridgeMatches` in `pkg/netns/config_test.go` enforces this.
#
# Idempotency and safety: before the first managed render, a remote copy of
# any existing /etc/nftables.conf is preserved as .faas-orig. The managed
# marker then identifies files owned by this role; `force: false` prevents a
# later run from overwriting that one-time recovery copy.

- name: nftables — validate UDP policy before host changes
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/validate_udp_policy.yml"

- name: nftables — install nftables package
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

# ADR-1749: the public forward guard needs nftables 1.1.3+, which Ubuntu 24.04
# does not ship. Rendering it for the distro nft would refuse every native boot.
- name: nftables — public forwarding requires its host prerequisites
  ansible.builtin.assert:
    that:
      - not (faas_public_forwarding | bool) or (faas_public_forward_host | bool)
    fail_msg: "faas_public_forwarding needs faas_public_forward_host (nftables {{ nftables_upstream_version }}+, loose rp_filter)"

- name: nftables — install the pinned upstream nftables
  ansible.builtin.include_tasks: upstream.yml
  when: faas_public_forward_host | bool

- name: nftables — inspect any pre-existing nftables.conf
  ansible.builtin.stat:
    path: /etc/nftables.conf
  register: nftables_conf_stat

- name: nftables — detect the managed ruleset marker
  ansible.builtin.command:
    argv: [grep, -q, "Managed by Gregale Ansible; do not edit.", /etc/nftables.conf]
  register: nftables_managed_marker
  changed_when: false
  failed_when: false
  when: nftables_conf_stat.stat.exists

- name: nftables — back up any pre-existing nftables.conf (one-time)
  ansible.builtin.copy:
    src: /etc/nftables.conf
    dest: /etc/nftables.conf.faas-orig
    remote_src: true
    force: false
    mode: preserve
  when:
    - nftables_conf_stat.stat.exists
    - nftables_managed_marker.rc | default(1) != 0

# Tenant bridge bootstrap (idempotent). The per-instance netns in
# pkg/netns/config.go expects `br-tenants` to exist with IP 10.100.0.1/16
# — this is the gateway IP the per-instance default route installs. The
# Lima metal shim does this in deploy/lima/run-metal.sh; production
# EX44 bootstrap needs the equivalent. MUST run BEFORE the nft
# syntax-check / reload below — the host firewall's forward chain uses
# `iif "br-tenants"`, which resolves the interface index at load time
# and fails on a clean box if the bridge is missing. The `ip link add`
# task is gated by `creates:` so converged runs no-op; the `ip addr
# add` swallows only the "File exists" error and reports changed
# on a fresh box.
#
# NOTE (tier-1): the runtime `ip` commands below are belt-and-braces — the
# boot-persistent guarantee now lives in the systemd oneshot unit
# `br-tenants-up.service` (installed by this same role). On first boot the
# oneshot brings the bridge up BEFORE nftables.service runs, so the host
# firewall's forward chain's `iifname "br-tenants"` rule loads against a
# live interface. The runtime tasks below remain useful for `make
# bootstrap` on a halted box where the oneshot hasn't run yet.
- name: nftables — ensure tenant bridge exists
  ansible.builtin.command: ip link add {{ tenant_bridge }} type bridge
  args:
    creates: /sys/class/net/{{ tenant_bridge }}

- name: nftables — ensure bridge IP is present
  ansible.builtin.command: ip addr add {{ bridge_cidr }} dev {{ tenant_bridge }}
  register: bridge_addr
  changed_when: bridge_addr.rc == 0
  failed_when:
    - bridge_addr.rc != 0
    - "'File exists' not in bridge_addr.stderr and 'already assigned' not in bridge_addr.stderr"

- name: nftables — bring the tenant bridge up
  ansible.builtin.command: ip link set {{ tenant_bridge }} up
  changed_when: false

# ADR-1749: public forwarding replies must not be dropped by strict
# reverse-path filtering on the tenant bridge (VMMD checks the effective
# max(all, bridge) value before every native boot). The drop-in sorts after
# the image's 60-gce-network-security.conf, and systemd's udev rule applies
# per-interface keys whenever the bridge is created at boot.
- name: nftables — loose reverse-path filtering on the tenant bridge (drop-in)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-faas-public-forward.conf
    content: |
      # Managed by Gregale Ansible; do not edit. ADR-1749 public forwarding.
      net.ipv4.conf.{{ tenant_bridge }}.rp_filter = 2
    owner: root
    group: root
    mode: "0644"
  when: faas_public_forward_host | bool

# Apply on every run: the bridge may have been recreated since the last boot.
- name: nftables — loose reverse-path filtering on the tenant bridge (now)
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-faas-public-forward.conf
  changed_when: false
  when: faas_public_forward_host | bool

# Boot-persistent bridge (tier-1, closes #134). The oneshot unit runs on
# every boot BEFORE nftables.service (see Before= in the unit file), so the
# host firewall's `iifname "br-tenants"` forward rule loads against an
# interface that already exists. Operators no longer need to run
# `make bootstrap` after every reboot. The unit file is in this role's
# `files/` and copied into `/etc/systemd/system/`.
- name: nftables — install br-tenants-up systemd unit
  ansible.builtin.copy:
    src: br-tenants-up.service
    dest: /etc/systemd/system/br-tenants-up.service
    owner: root
    group: root
    mode: "0644"
  register: bridge_unit

- name: nftables — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: bridge_unit.changed

- name: nftables — enable + start br-tenants-up oneshot
  ansible.builtin.systemd:
    name: br-tenants-up.service
    enabled: true
    state: started
  register: bridge_svc
  failed_when: bridge_svc.failed and ansible_service_mgr == 'systemd'

# root-namespace IPv4 forwarding (tier-1). Without this, bridged-tenant
# packets are dropped at routing before the host `postrouting` nat chain
# can MASQUERADE them to the public IP — end-to-end guest egress stays
# broken even with all the in-Go changes. Pre-PR, only the Lima nested-VM
# shim set this; production had no equivalent.
- name: nftables — install ip_forward sysctl drop-in
  ansible.builtin.copy:
    src: 90-faas-ip-forward.conf
    dest: /etc/sysctl.d/90-faas-ip-forward.conf
    owner: root
    group: root
    mode: "0644"
  register: fwd_dropin

- name: nftables — apply ip_forward sysctl (no reboot needed for this key)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-faas-ip-forward.conf
  changed_when: false
  when: fwd_dropin.changed

# The raw TCP/UDP public port range must not be handed out as ephemeral
# source ports, or gatewayd-public cannot bind those listeners.
- name: nftables — install raw ingress reserved-ports sysctl drop-in
  ansible.builtin.copy:
    src: 91-faas-reserved-ports.conf
    dest: /etc/sysctl.d/91-faas-reserved-ports.conf
    owner: root
    group: root
    mode: "0644"
  register: reserved_ports_dropin

- name: nftables — apply reserved-ports sysctl  # noqa: no-handler (applied before gatewayd-public binds its listeners)
  ansible.builtin.command: sysctl -p /etc/sysctl.d/91-faas-reserved-ports.conf
  changed_when: false
  when: reserved_ports_dropin.changed

- name: nftables — load the pinned Cloudflare origin ranges
  ansible.builtin.set_fact:
    faas_cloudflare_ipv4_cidrs: "{{ lookup('ansible.builtin.file', role_path ~ '/files/cloudflare-ips-v4.txt').splitlines() }}"
    faas_cloudflare_ipv6_cidrs: "{{ lookup('ansible.builtin.file', role_path ~ '/files/cloudflare-ips-v6.txt').splitlines() }}"
  when: faas_cloudflare_origin_only | bool

- name: nftables — require both Cloudflare address families when origin restriction is enabled
  ansible.builtin.assert:
    that:
      - faas_cloudflare_ipv4_cidrs | length > 0
      - faas_cloudflare_ipv6_cidrs | length > 0
    fail_msg: Cloudflare-only origin ingress requires non-empty pinned IPv4 and IPv6 ranges.
  when: faas_cloudflare_origin_only | bool

# The input chain's br-tenants rules let guests reach only the bridge
# services (the per-netns chain narrows the ports), the public edge for
# hairpin calls, and ICMP; the drop keeps bridge traffic from the rules below
# (spec §11, ADR-20261020123000). That rationale lives here, not as a Jinja
# comment in the template: ansible.builtin.template renders with
# trim_blocks, so a `{#- ... #}` line there joined `iif lo accept` to the
# next rule and the rc.291 control-plane converge failed `nft -c`
# (2026-10-24). scripts/egress-render-cross-check.sh renders with the same
# trim_blocks setting.
- name: nftables — render faas ruleset into /etc/nftables.conf (per-host, ADR-055)
  ansible.builtin.template:
    src: policy_nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  register: nft_drop

- name: nftables — syntax-check the ruleset
  ansible.builtin.command: nft -c -f /etc/nftables.conf
  changed_when: false
  check_mode: false

# Apply the ruleset now — the role has no reload handler, so a re-run
# that changes /etc/nftables.conf would otherwise leave the live kernel
# running the old ruleset until next reboot. Gated on nft_drop.changed
# to stay no-op on a converged box. Idempotent: the ruleset's
# `flush ruleset` first directive wipes and re-loads.
- name: nftables — load the ruleset (no reload handler; reload directly)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  changed_when: true
  ansible.builtin.command: nft -f /etc/nftables.conf
  when: nft_drop.changed

- name: nftables — enable + start nftables
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started
  register: nft_svc
  failed_when: nft_svc.failed and ansible_service_mgr == 'systemd'
