# githubd_service — install systemd unit + example TOML for githubd
# (Gate-B, issue #297 / ADR-025 §Tier 2).
#
# Plain-unix-socket daemons: githubd serves the GitHub App webhook +
# device-flow callbacks on a unix socket at /run/faas/githubd.sock.
# It reads GITHUB_WEBHOOK_SECRET (and the GitHub App keypair) via
# sealed.env — those are operator-provisioned at first-boot, NOT
# checked by this role (mirrors gatewayd_public_service / gatewayd_internal_service:
# the role drops the unit + example TOML; the operator wires secrets).
#
# What's NOT here (operator-provisioned):
#   - sealed.env entries for GITHUB_WEBHOOK_SECRET + the GitHub App
#     private key (PEM, base64-wrapped)
#   - PKI leaves under /etc/faas/tls/githubd/ (laid out by
#     `gregalectl pki init --box-role=control-plane` — PR-3)
#   - enable the unit (`systemctl enable --now faas-githubd`)
#   - run the daemon (the apid-side bridged client is the trigger)

- name: githubd_service — drop example TOML (operator copies to githubd.toml)
  ansible.builtin.copy:
    src: githubd.toml.example
    dest: /etc/faas/githubd.toml.example
    owner: root
    group: faas
    mode: "0640"

- name: githubd_service — install systemd unit
  ansible.builtin.copy:
    src: faas-githubd.service
    dest: /etc/systemd/system/faas-githubd.service
    owner: root
    group: root
    mode: "0644"
  register: githubd_unit

- name: githubd_service — systemctl daemon-reload (idempotent, after new unit file)
  ansible.builtin.systemd:
    daemon_reload: true
  when: githubd_unit.changed

- name: githubd_service — create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-githubd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the githubd unit. Drop-in mirrors deploy/ansible/
# roles/control_plane_service/templates/99-faas-node-name.conf.j2
# — body is identical across roles.
- name: githubd_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-githubd.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to githubd via FAAS_GITHUBD_ROLE so cmd/githubd/config.go
# ::LoadConfig picks up faas_box_role (control-plane on fsn-1).
# See roles/githubd_service/templates/99-faas-role.conf.j2 for
# the full rationale.
- name: githubd_service — install FAAS_GITHUBD_ROLE drop-in (Mega-PR-C)
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-githubd.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"

# Issue #585 / ADR-127 — per-daemon secret file perm-asserts. The
# shared block covers ALL new per-daemon secret files (githubd
# owns githubd.env + app.pem; the rest are checked here as defense
# in depth). Each assert is a no-op when the file is absent.
- name: githubd_service — sealed.env split perm-asserts (issue #585 / ADR-127)
  ansible.builtin.include_tasks: ../../_shared/tasks/sealed_env_split_perm_asserts.yml
