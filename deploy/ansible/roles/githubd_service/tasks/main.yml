# githubd_service — install systemd unit + example TOML for githubd
# (Gate-B, issue #297 / ADR-025 §Tier 2).
#
# Plain-unix-socket daemons: githubd serves the GitHub App webhook +
# device-flow callbacks on a unix socket at /run/faas/githubd.sock.
# It reads FAAS_GITHUB_WEBHOOK_SECRET (and the GitHub App keypair) via
# /etc/faas/secrets/githubd/githubd.env — those are operator-provisioned at first-boot, NOT
# checked by this role (mirrors gatewayd_public_service / gatewayd_internal_service:
# the role drops the unit + example TOML; the operator wires secrets).
#
# What's NOT here (operator-provisioned):
#   - githubd.env entries for FAAS_GITHUB_WEBHOOK_SECRET + the GitHub App
#     private key (PEM, base64-wrapped)
#   - PKI leaves under /etc/faas/tls/githubd/ (laid out by
#     `gregalectl pki init --box-role=control-plane` — PR-3)
#   - enable the unit (`systemctl enable --now faas-githubd`)
#   - run the daemon (the apid-side bridged client is the trigger)

- name: githubd_service — drop example TOML (operator copies to githubd.toml)
  ansible.builtin.copy:
    src: githubd.toml.example
    dest: /etc/faas/githubd.toml.example
    owner: root
    group: faas
    mode: "0640"

- name: githubd_service — install systemd unit
  notify: restart faas-githubd
  ansible.builtin.copy:
    src: faas-githubd.service
    dest: /etc/systemd/system/faas-githubd.service
    owner: root
    group: root
    mode: "0644"
  register: githubd_unit

- name: githubd_service — systemctl daemon-reload (idempotent, after new unit file)  # noqa: no-handler (handlers only fire at play end; later tasks in this role query the unit)
  ansible.builtin.systemd:
    daemon_reload: true
  when: githubd_unit.changed

- name: githubd_service — create systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/faas-githubd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Mega-PR-A (issue #911 / ADR-110 PR-1): drop the FAAS_NODE_NAME
# env line into the githubd unit. Drop-in mirrors deploy/ansible/
# roles/control_plane_service/templates/99-faas-node-name.conf.j2
# — body is identical across roles.
- name: githubd_service — install FAAS_NODE_NAME drop-in (Mega-PR-A)
  notify: restart faas-githubd
  ansible.builtin.template:
    src: ../../_shared/templates/99-faas-node-name.conf.j2
    dest: /etc/systemd/system/faas-githubd.service.d/99-faas-node-name.conf
    owner: root
    group: root
    mode: "0644"

# Mega-PR-C (issue #911 / ADR-110): wire the per-box role gate
# through to githubd via FAAS_GITHUBD_ROLE so cmd/githubd/config.go
# ::LoadConfig picks up faas_box_role (control-plane on fsn-1).
# See roles/githubd_service/templates/99-faas-role.conf.j2 for
# the full rationale.
- name: githubd_service — install FAAS_GITHUBD_ROLE drop-in (Mega-PR-C)
  notify: restart faas-githubd
  ansible.builtin.template:
    src: 99-faas-role.conf.j2
    dest: /etc/systemd/system/faas-githubd.service.d/99-faas-role.conf
    owner: root
    group: root
    mode: "0644"

# Source-ref promotion reads branch heads from imaged on compute nodes. Expose
# githubd on the private mTLS gRPC listener only when the split-box inventory
# supplies the deployment target; local development remains unix-socket-only.
- name: githubd_service — require canonical split-box listener
  ansible.builtin.assert:
    that:
      - faas_box_role == 'control-plane'
      - faas_githubd_listen_addr is match('^tcp://0\\.0\\.0\\.0:50053$')
    fail_msg: >-
      split-box githubd requires faas_githubd_listen_addr=tcp://0.0.0.0:50053.
  when: faas_githubd_listen_addr is defined

- name: githubd_service — assert split-box mTLS leaves exist
  ansible.builtin.stat:
    path: "/etc/faas/tls/{{ item }}"
  loop:
    - githubd/server.crt
    - githubd/server.key
    - ca/ca.crt
  register: faas_githubd_pki_stat
  failed_when: not faas_githubd_pki_stat.stat.exists
  when: faas_githubd_listen_addr is defined

- name: githubd_service — grant githubd read access to its mTLS server key
  ansible.builtin.file:
    path: /etc/faas/tls/githubd/server.key
    state: file
    owner: root
    group: faas
    mode: "0440"
  when: faas_githubd_listen_addr is defined

- name: githubd_service — install split-box mTLS listener drop-in
  notify: restart faas-githubd
  ansible.builtin.template:
    src: 99-faas-source-ref-mtls.conf.j2
    dest: /etc/systemd/system/faas-githubd.service.d/99-faas-source-ref-mtls.conf
    owner: root
    group: root
    mode: "0644"
  when: faas_githubd_listen_addr is defined

- name: githubd_service — remove stale split-box listener drop-in
  notify: restart faas-githubd
  ansible.builtin.file:
    path: /etc/systemd/system/faas-githubd.service.d/99-faas-source-ref-mtls.conf
    state: absent
  when: faas_githubd_listen_addr is not defined
# Issue #585 / ADR-127 — per-daemon secret file perm-asserts. The
# shared block covers ALL new per-daemon secret files (githubd
# owns githubd.env + app.pem; the rest are checked here as defense
# in depth). Each assert is a no-op when the file is absent.
- name: githubd_service — sealed.env split perm-asserts (issue # 585 / ADR-127)
  ansible.builtin.include_tasks: ../../_shared/tasks/sealed_env_split_perm_asserts.yml

# Issue #603 — soft assert on the GitHub App private key. The file is
# operator-provisioned (see the header note), so a box where githubd
# is not yet wired must still deploy: absence is fine. Presence with a
# loose mode is not — this key mints installation tokens for every
# customer repo the App is installed on, so a world-readable copy is a
# tenant-wide credential leak.
#
# The allowlist mirrors the runtime tripwire that refuses to start on
# the same modes (pkg/secretbox/filemode.go::SecretFileModes, called
# from cmd/githubd/main.go::readKeyPEMDefault). Ansible fails loud
# before daemon-reload so a perms drift on a fresh box never reaches
# production; the daemon-side check is the backstop for a file that
# drifts after bootstrap. Shape mirrors the host.age assert in
# roles/control_plane_service/tasks/main.yml.
#
# Owner must be root. faas-githubd.service reads the key through
# LoadCredential=faas_github_app_key_unit, so systemd (as root) opens it
# and hands the daemon a private copy under $CREDENTIALS_DIRECTORY; the
# daemon never opens this path. That is also the ADR-127 PRIVATE bucket
# rule in deploy/ansible/roles/_shared/tasks/sealed_env_split_perm_asserts.yml
# (0400 root:root), which runs first. This assert used to demand
# owner faas, from before the unit switched to LoadCredential, so no file
# could pass both and every control-plane convergence with the key
# present failed here (production-us, rc.238, 2026-10-05).
- name: githubd_service — soft assert github-app.pem mode + owner (issue # 603)
  ansible.builtin.stat:
    path: /etc/faas/secrets/githubd/app.pem
  register: faas_github_app_pem_stat
  failed_when:
    - >-
      faas_github_app_pem_stat.stat.exists
      and (faas_github_app_pem_stat.stat.mode not in ["0400", "0440", "0600", "0640"]
           or faas_github_app_pem_stat.stat.pw_name != "root")
