---
# ADR-1027: dbbackupd keeps native databases' WAL and base backups on a
# database node and ships them to object storage. When enabled, vmmd turns
# archiving on in every database VM (database_vmmd renders archive_socket),
# and the managed-Postgres backend may offer point-in-time restore
# (settings.max_restore_window_seconds). Off by default.
dbbackupd_enabled: false

# Local archive on the node's NVMe, next to the volumes.
dbbackupd_store_dir: /srv/db/archive
dbbackupd_socket_path: /run/faas-dbbackupd/dbbackupd.sock
# /healthz, /readyz and /metrics: loopback unless the manifest sets
# database_node_metrics_host (the overlay address control-plane Prometheus
# scrapes; the database_node firewall admits only the control plane).
dbbackupd_ops_addr: "{{ database_node_metrics_host | default('127.0.0.1') }}:9110"

# Every archive restores to any point this far back; a database's restore
# window keeps more. Pruned hourly, locally and in the bucket.
dbbackupd_min_retention: "24h"
dbbackupd_prune_interval: "1h"

# Off-node copy. Leave dbbackupd_s3_bucket empty to keep the archive on the
# node only (a node loss then loses every restore point).
dbbackupd_s3_endpoint: ""
dbbackupd_s3_region: ""
dbbackupd_s3_bucket: ""
dbbackupd_s3_prefix: native-postgres
dbbackupd_s3_path_style: false
dbbackupd_upload_interval: "10s"
# Credentials scoped to the bucket prefix (Ansible Vault).
dbbackupd_s3_access_key_id: ""
dbbackupd_s3_secret_access_key: ""

# Off-site mirror: a second bucket, at another provider, holding a copy of
# every archive (ADR-1027). It needs the bucket above. Leave the bucket
# empty to keep one copy off the node; losing that bucket or its account
# then loses every restore point.
dbbackupd_offsite_s3_endpoint: ""
dbbackupd_offsite_s3_region: ""
dbbackupd_offsite_s3_bucket: ""
dbbackupd_offsite_s3_prefix: native-postgres
dbbackupd_offsite_s3_path_style: false
dbbackupd_offsite_upload_interval: "1m"
dbbackupd_offsite_s3_access_key_id: ""
dbbackupd_offsite_s3_secret_access_key: ""
