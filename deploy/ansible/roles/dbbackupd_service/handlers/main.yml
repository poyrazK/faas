---
- name: dbbackupd_service — daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: restart faas-dbbackupd

- name: dbbackupd_service — try-restart faas-dbbackupd
  ansible.builtin.command: systemctl try-restart faas-dbbackupd.service  # noqa: command-instead-of-module
  changed_when: true
  listen: restart faas-dbbackupd
  when: dbbackupd_enabled | bool
