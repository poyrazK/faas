---
# grafana role — install + provision + systemd-enable.
#
# Mirrors deploy/ansible/roles/alertmanager/tasks/main.yml so the role
# shape stays uniform. Three differences worth surfacing:
#   1. SHA-256 pin (gv_release_sha256) is asserted against the INSTALLED
#      /usr/sbin/grafana-server binary, not against the downloaded
#      tarball (apt is the install path, not a tarball drop). Same
#      defence-in-depth principle as the alertmanager role's assert.
#   2. Admin password is read at process start by Grafana via the
#      GF_SECURITY_ADMIN_PASSWORD__FILE env var (see
#      templates/grafana-server.service.j2). The role only asserts the file
#      exists with mode 0400 owned by grafana:grafana — nothing is
#      slurped, base64-decoded, or templated into grafana.ini. Same
#      precedent as the alertmanager *_file secrets (gap G2 lean §17,
#      sealed at rest).
#   3. Bind addr must be loopback (127/8) or management-bridge
#      (10.0.0.0/24) on port 3000. Off-box public binds would expose
#      the admin surface (basic auth + provisioning write API) over
#      plaintext. Asserted at task time, mirror of the prometheus
#      role's alertmanager-URL loopback regex.

- name: grafana — assert SHA-256 pin was supplied
  ansible.builtin.assert:
    that:
      - gv_release_sha256 is defined
      - gv_release_sha256 | length == 64
    fail_msg: >-
      gv_release_sha256 is not set. Pass `-e gv_release_sha256=<sha256>`
      (compute with `sha256sum /usr/sbin/grafana-server` on the
      provisioning host) from the apt-installed binary. The role
      fails-closed rather than installing an unverified binary.

# Bind discipline (CLAUDE.md §Component ownership). Grafana must
# not be reachable off-box — the admin surface (basic auth +
# provisioning write API) would leak operational metadata over
# plaintext. Catches a typo'd inventory override here, not after a
# week of silent exposure. Asserts v4 loopback (127/8) AND the
# management-bridge (10.0.0.0/24) on port 3000.
- name: grafana — assert listen addr is loopback or management bridge
  ansible.builtin.assert:
    that:
      - gv_listen_addr is regex('^(127\.[0-9]+\.[0-9]+\.[0-9]+|10\.0\.0\.[0-9]+):(3000)$')
    fail_msg: >-
      gv_listen_addr={{ gv_listen_addr }} is not a private bind (127/8
      or 10.0.0.0/24 on port 3000). Off-box public binds would expose
      the Grafana admin surface; override only via ansible-vault.

- name: grafana — install apt dependencies for HTTPS repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: grafana — install repository keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: grafana — install repository keyring
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: grafana — add apt repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present
    enabled: true

- name: grafana — refresh apt metadata after adding repository
  ansible.builtin.apt:
    update_cache: true

- name: grafana — pin installed version via /etc/apt/preferences.d
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/grafana-pref
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: grafana
      Pin: version {{ gv_version }}*
      Pin-Priority: 700

- name: grafana — apt install grafana-server
  ansible.builtin.apt:
    name: "grafana={{ gv_version }}"
    state: present
    update_cache: true

- name: grafana — assert installed binary SHA-256 matches pin
  ansible.builtin.command: sha256sum /usr/sbin/grafana-server
  register: gv_sum
  changed_when: false
  check_mode: false

- name: grafana — verify pin matches installed
  ansible.builtin.assert:
    that:
      - "gv_release_sha256 in gv_sum.stdout"
    fail_msg: "Installed Grafana binary SHA-256 mismatch — supply chain check failed."

- name: grafana — create system user
  ansible.builtin.user:
    name: grafana
    system: true
    shell: /usr/sbin/nologin
    home: "{{ gv_data_dir }}"
    create_home: false

- name: grafana — create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"
  loop:
    - "{{ gv_data_dir }}"
    - "{{ gv_data_dir }}/dashboards"
    - /etc/grafana
    - /etc/grafana/provisioning
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /etc/grafana/secrets
    - /var/log/grafana

# Secret file: assert existence + perms before systemd enable. We do NOT
# slurp or template the secret bytes — Grafana reads it at start via
# GF_SECURITY_ADMIN_PASSWORD__FILE (see templates/grafana-server.service.j2).
# dev_mode: skip the assert so dev / CI hosts without secrets still
# bootstrap (and Grafana isn't enabled in that case — see below).
- name: grafana — assert admin password file perms (production)
  ansible.builtin.stat:
    path: "{{ gv_admin_password_file }}"
  register: gv_secret_stat
  failed_when:
    - not gv_dev_mode | bool
    - gv_admin_password_file | length > 0
    - not gv_secret_stat.stat.exists
  when:
    - not gv_dev_mode | bool
    - gv_admin_password_file | length > 0
  no_log: true   # paths flow through stat; defensive even though they're not the bytes

- name: grafana — require HTTPS Loki datasource endpoint (when configured)
  ansible.builtin.assert:
    that:
      - gv_loki_url is match('^https://')
      - gv_loki_server_name | length > 0
    fail_msg: >-
      gv_loki_url must be a private HTTPS endpoint and gv_loki_server_name
      must match the provider-issued Loki certificate.
  when: gv_loki_url | length > 0

- name: grafana — stat Loki datasource credential environment file
  ansible.builtin.stat:
    path: "{{ gv_loki_credentials_file }}"
  register: gv_loki_secret_stat
  when: gv_loki_url | length > 0
  no_log: true

- name: grafana — require Loki datasource credential environment file
  ansible.builtin.assert:
    that:
      - gv_loki_secret_stat.stat.exists
      - gv_loki_secret_stat.stat.isreg
      - (gv_loki_secret_stat.stat.mode | default('0000')) in ['0400', '0440']
    fail_msg: >-
      {{ gv_loki_credentials_file }} is missing or too permissive. Provision
      the provider-owned Loki PEM environment file as root-only or
      root:grafana 0440 before enabling the datasource.
  when: gv_loki_url | length > 0
  no_log: true

- name: grafana — render grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ gv_config_path }}"
    owner: grafana
    group: grafana
    mode: "0640"
  notify: restart grafana-server

- name: grafana — render datasource provisioning
  ansible.builtin.template:
    src: provisioning-datasources.yml.j2
    dest: "{{ gv_provisioning_dir }}/datasources/prometheus.yml"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

- name: grafana — render dashboard provider
  ansible.builtin.template:
    src: provisioning-dashboards.yml.j2
    dest: "{{ gv_provisioning_dir }}/dashboards/faas.yml"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

- name: grafana — drop faas-fleet dashboard JSON
  ansible.builtin.copy:
    src: faas-fleet.json
    dest: "{{ gv_dashboards_dir }}/faas-fleet.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

# Issue #301 / ADR-044 — top-throttled-apps dashboard.
# Byte-identical copy of deploy/grafana/top-throttled-apps.json; the
# deploy/grafana/ tree is the operator-visible source-of-truth, the
# ansible role's files/ tree is the production wire destination. Same
# shape as faas-fleet.json: 4 panels (top-10 throttled apps, per-slice
# throttle ratio gauge, customer share of fleet throttling, other bucket
# growth) keyed off vmmd_cpu_throttle_seconds_total{account_id, app_id}
# and vmmd_cpu_throttle_ratio{slice}. Reference: docs/runbooks/FaasCpuStarvation.md
# §Verify (panel IDs + expressions).
- name: grafana — drop top-throttled-apps dashboard JSON (issue # 301)
  ansible.builtin.copy:
    src: top-throttled-apps.json
    dest: "{{ gv_dashboards_dir }}/top-throttled-apps.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

# ADR-091 D20.4 / PR-D20.4 — audit-event retention observability
# chip. Closes the operator surface for the three prerequisite
# metrics shipped by PR-B (PR #857) in pkg/wire/metrics.go:1389-1425
# (apid_audit_events_deleted_total, apid_audit_events_retention_lag_seconds,
# apid_audit_events_volume_total{kind_prefix}). Three panels mirror
# docs/runbooks/FaasAuditRetentionExhaustion.md's three-signal triage
# (prune rate, retention lag with green/yellow/red thresholds at
# 89-91d healthy, volume by kind_prefix top 8). Companion alerts live
# in faas.rules.yml under family: audit_retention
# (FaasAuditRetentionLoopStalled page, FaasAuditRetentionLoopStretched
# warn, FaasAuditRetentionTableGrowingFasterThanPruned warn). Byte-
# identical copy of deploy/grafana/audit-retention.json — the
# deploy/grafana/ tree is the operator-visible source of truth
# (Makefile:172-185 grafana-mirror-check enforces identity).
- name: grafana — drop audit-retention dashboard JSON (ADR-091 D20.4)
  ansible.builtin.copy:
    src: audit-retention.json
    dest: "{{ gv_dashboards_dir }}/audit-retention.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

# PR #1111 follow-on (feat/obs-dashboards-alerts) — audit-write
# fidelity + obs-meta trace completeness dashboards. Closes the
# operator surface for the two counter surfaces PR #1111 C2
# landed (`<daemon>_audit_log_write_total{endpoint,kind}`,
# `<daemon>_audit_log_write_failures_total{endpoint,kind,error_class}`)
# and the schedd gauge `schedd_operator_action_trace_completeness_ratio{kind}`.
# UID `faas-audit-write-fidelity-pr-1111` carries 4 panels
# (writes-by-endpoint stacked, failures-by-error_class stacked,
# failure ratio with green/yellow/red bands at 0.001/0.01, top-8
# by kind). UID `faas-obs-trace-completeness-pr-1111` carries 4
# panels (per-kind ratio timeseries, audit-rate disambiguator —
# counters the vacuous-truth default of 1.0 for absent kinds,
# driver loop freshness stat, worst-kind recording-rule stat).
# Companion alerts live at deploy/ansible/roles/prometheus/files/
# faas.rules.yml under family: obs_trace (page+warn+info for trace
# completeness) and family: audit_write (FaasAuditWriteFailuresSpike
# cross-daemon warn, component=platform — deliberately not paired
# with the apid-only FaasApidAuditWriteFailures, see the rule's
# section-header comment).
- name: grafana — drop audit-write-fidelity dashboard JSON (PR # 1111 follow-on)
  ansible.builtin.copy:
    src: audit-write-fidelity.json
    dest: "{{ gv_dashboards_dir }}/audit-write-fidelity.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

- name: grafana — drop obs-trace-completeness dashboard JSON (PR # 1111 follow-on)
  ansible.builtin.copy:
    src: obs-trace-completeness.json
    dest: "{{ gv_dashboards_dir }}/obs-trace-completeness.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

# Observability pipeline health — the daemon-owned Prometheus-to-OTLP metrics
# bridge and OTLP trace exporter expose configured/up state, export outcomes,
# latency, and last-success
# timestamps. Byte-identical copy of deploy/grafana/telemetry-pipeline.json;
# the source tree remains the operator-visible dashboard definition.
- name: grafana — drop telemetry-pipeline dashboard JSON
  ansible.builtin.copy:
    src: telemetry-pipeline.json
    dest: "{{ gv_dashboards_dir }}/telemetry-pipeline.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

# Issue #274 — off-host journald → Promtail → Loki pipeline health.
# Byte-identical copy of deploy/grafana/loki-pipeline.json; the dashboard
# shows target availability, source ingestion, successful sends, drops, and
# the stable loki_send_total recording rule.
- name: "grafana — drop loki-pipeline dashboard JSON (issue #274)"
  ansible.builtin.copy:
    src: loki-pipeline.json
    dest: "{{ gv_dashboards_dir }}/loki-pipeline.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

# ADR-127 §D3 / G19 — bridge wire-protocol framing protection
# dashboard. Byte-identical copy of deploy/grafana/
# bridge-protection.json (Makefile:172-185 grafana-mirror-check
# enforces identity). Companion alerts live at
# deploy/ansible/roles/prometheus/files/bridge.rules.yml
# (FaasBridgeFramingMismatch warn + FaasBridgeRollbackStuck page).
# Runbook: docs/ops/h2c-rollback.md.
- name: grafana — drop bridge-protection dashboard JSON (ADR-127 §D3)
  ansible.builtin.copy:
    src: bridge-protection.json
    dest: "{{ gv_dashboards_dir }}/bridge-protection.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

- name: grafana — install systemd unit
  ansible.builtin.template:
    src: grafana-server.service.j2
    dest: /etc/systemd/system/grafana-server.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart grafana-server

# dev_mode: drop the unit but do not enable — production hosts that
# forget to set the admin password won't accidentally start a broken
# Grafana admin surface.
- name: grafana — enable + start service (production only)
  ansible.builtin.service:
    name: grafana-server
    enabled: true
    state: started
  register: gv_svc
  when: not gv_dev_mode | bool

- name: "grafana — dev mode: skip service start"
  ansible.builtin.debug:
    msg: >-
      gv_dev_mode=true; grafana-server.service NOT enabled. Run with
      -e gv_dev_mode=false and an operator-provisioned admin password
      file (gv_admin_password_file, mode 0400, owner grafana) to
      enable production.
  when: gv_dev_mode | bool
