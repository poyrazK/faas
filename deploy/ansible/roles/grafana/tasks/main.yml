---
# grafana role — install + provision + systemd-enable.
#
# Mirrors deploy/ansible/roles/alertmanager/tasks/main.yml so the role
# shape stays uniform. Three differences worth surfacing:
#   1. SHA-256 pin (gv_release_sha256) is asserted against the INSTALLED
#      /usr/sbin/grafana-server binary, not against the downloaded
#      tarball (apt is the install path, not a tarball drop). Same
#      defence-in-depth principle as the alertmanager role's assert.
#   2. Admin password is read at process start by Grafana through
#      grafana.ini's $__file{} expansion. The role asserts the file
#      exists with mode 0400 owned by grafana:grafana and never templates
#      it into grafana.ini; the reconcile step after start reads it only
#      to check it and to set it. Same
#      precedent as the alertmanager *_file secrets (gap G2 lean §17,
#      sealed at rest).
#   3. Bind addr must be loopback (127/8) or management-bridge
#      (10.0.0.0/24) on port 3000. Off-box public binds would expose
#      the admin surface (basic auth + provisioning write API) over
#      plaintext. Asserted at task time, mirror of the prometheus
#      role's alertmanager-URL loopback regex.

- name: grafana — assert SHA-256 pin was supplied
  ansible.builtin.assert:
    that:
      - gv_release_sha256 is defined
      - gv_release_sha256 | length == 64
    fail_msg: >-
      gv_release_sha256 is not set. Pass `-e gv_release_sha256=<sha256>`
      (compute with `sha256sum /usr/sbin/grafana-server` on the
      provisioning host) from the apt-installed binary. The role
      fails-closed rather than installing an unverified binary.

# Bind discipline (CLAUDE.md §Component ownership). Grafana must
# not be reachable off-box — the admin surface (basic auth +
# provisioning write API) would leak operational metadata over
# plaintext. Catches a typo'd inventory override here, not after a
# week of silent exposure. Asserts v4 loopback (127/8) AND the
# management-bridge (10.0.0.0/24) on port 3000.
- name: grafana — assert listen addr is loopback or management bridge
  ansible.builtin.assert:
    that:
      - gv_listen_addr is regex('^(127\.[0-9]+\.[0-9]+\.[0-9]+|10\.0\.0\.[0-9]+):(3000)$')
    fail_msg: >-
      gv_listen_addr={{ gv_listen_addr }} is not a private bind (127/8
      or 10.0.0.0/24 on port 3000). Off-box public binds would expose
      the Grafana admin surface; override only via ansible-vault.

- name: grafana — install apt dependencies for HTTPS repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: grafana — install repository keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: grafana — install repository keyring
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: grafana — add apt repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present
    enabled: true

- name: grafana — refresh apt metadata after adding repository
  ansible.builtin.apt:
    update_cache: true

- name: grafana — pin installed version via /etc/apt/preferences.d
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/grafana-pref
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: grafana
      Pin: version {{ gv_version }}*
      Pin-Priority: 700

- name: grafana — apt install grafana-server
  ansible.builtin.apt:
    name: "grafana={{ gv_version }}"
    state: present
    update_cache: true

- name: grafana — assert installed binary SHA-256 matches pin
  ansible.builtin.command: sha256sum /usr/sbin/grafana-server
  register: gv_sum
  changed_when: false
  check_mode: false

- name: grafana — verify pin matches installed
  ansible.builtin.assert:
    that:
      - "gv_release_sha256 in gv_sum.stdout"
    fail_msg: "Installed Grafana binary SHA-256 mismatch — supply chain check failed."

- name: grafana — create system user
  ansible.builtin.user:
    name: grafana
    system: true
    shell: /usr/sbin/nologin
    home: "{{ gv_data_dir }}"
    create_home: false

- name: grafana — create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"
  loop:
    - "{{ gv_data_dir }}"
    - "{{ gv_data_dir }}/dashboards"
    - /etc/grafana
    - /etc/grafana/provisioning
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /etc/grafana/secrets
    - /var/log/grafana

# Secret file: assert existence + perms before systemd enable. The secret
# bytes are never templated — Grafana reads the file at start through
# grafana.ini's $__file{} expansion.
# dev_mode: skip the assert so dev / CI hosts without secrets still
# bootstrap (and Grafana isn't enabled in that case — see below).
# The grafana package resets everything under /etc/grafana to root:grafana
# 0640 when it is installed or upgraded, which leaves the admin password
# group-readable and fails the check below on the next converge. Put an
# existing, operator-provisioned file back to grafana:grafana 0400; its
# contents are never read.
- name: grafana — stat the admin password file
  ansible.builtin.stat:
    path: "{{ gv_admin_password_file }}"
  register: gv_secret_present
  when:
    - not gv_dev_mode | bool
  no_log: true

- name: grafana — keep the admin password file private after package installs
  ansible.builtin.file:
    path: "{{ gv_admin_password_file }}"
    owner: grafana
    group: grafana
    mode: "0400"
  when:
    - not gv_dev_mode | bool
    - gv_secret_present.stat.exists | default(false)
    - gv_secret_present.stat.isreg | default(false)
  no_log: true

- name: grafana — assert admin password file perms (production)
  ansible.builtin.stat:
    path: "{{ gv_admin_password_file }}"
  register: gv_secret_stat
  when:
    - not gv_dev_mode | bool
  no_log: true

- name: grafana — require private admin password file (production)
  ansible.builtin.assert:
    that:
      - gv_secret_stat.stat.exists
      - gv_secret_stat.stat.isreg
      - gv_secret_stat.stat.pw_name == 'grafana'
      - gv_secret_stat.stat.gr_name == 'grafana'
      - gv_secret_stat.stat.mode == '0400'
    fail_msg: >-
      {{ gv_admin_password_file }} must be a regular file owned by
      grafana:grafana with mode 0400 before Grafana can start.
  when:
    - not gv_dev_mode | bool
  no_log: true

- name: grafana — require HTTPS Loki datasource endpoint (when configured)
  ansible.builtin.assert:
    that:
      - gv_loki_url is match('^https://')
      - gv_loki_server_name | length > 0
    fail_msg: >-
      gv_loki_url must be a private HTTPS endpoint and gv_loki_server_name
      must match the provider-issued Loki certificate.
  when: gv_loki_url | length > 0

- name: grafana — stat Loki datasource TLS material
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ gv_loki_ca_file }}"
    - "{{ gv_loki_client_cert_file }}"
    - "{{ gv_loki_client_key_file }}"
  register: gv_loki_tls_stat
  when: gv_loki_url | length > 0

- name: grafana — require Loki datasource TLS material
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: >-
      {{ item.item }} is missing. The platform_logs_pki role issues Grafana's
      Loki client leaf from the fleet CA (ADR-20261023124955 §2); converge it
      before this role.
  loop: "{{ gv_loki_tls_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: gv_loki_url | length > 0

# The datasource reads the key with $__file{}, as the grafana user. pkg/pki
# writes keys root:root 0400; platform_logs_pki repeats this on renewal.
- name: grafana — let grafana read its Loki client key
  ansible.builtin.file:
    path: "{{ gv_loki_client_key_file }}"
    state: file
    owner: root
    group: grafana
    mode: "0440"
  when: gv_loki_url | length > 0

- name: grafana — render grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ gv_config_path }}"
    owner: grafana
    group: grafana
    mode: "0640"
  notify: restart grafana-server

- name: grafana — render datasource provisioning
  ansible.builtin.template:
    src: provisioning-datasources.yml.j2
    dest: "{{ gv_provisioning_dir }}/datasources/prometheus.yml"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

- name: grafana — render dashboard provider
  ansible.builtin.template:
    src: provisioning-dashboards.yml.j2
    dest: "{{ gv_provisioning_dir }}/dashboards/faas.yml"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

- name: grafana — drop faas-fleet dashboard JSON
  ansible.builtin.copy:
    src: faas-fleet.json
    dest: "{{ gv_dashboards_dir }}/faas-fleet.json"
    owner: grafana
    group: grafana
    mode: "0640"
  notify:
    - restart grafana-server
    - reload grafana provisioning

