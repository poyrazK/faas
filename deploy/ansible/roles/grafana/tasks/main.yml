- name: grafana — install systemd unit
  ansible.builtin.template:
    src: grafana-server.service.j2
    dest: /etc/systemd/system/grafana-server.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart grafana-server

# dev_mode: drop the unit but do not enable — production hosts that
# forget to set the admin password won't accidentally start a broken
# Grafana admin surface.
# daemon_reload here, not only in the handler: the handler runs at the end of
# the play, so on a fresh host the first start would use the package's own
# unit, outside faas-obs.slice and without the role's limits and hardening.
- name: grafana — enable + start service (production only)
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
  register: gv_svc
  when: not gv_dev_mode | bool

# admin_password in grafana.ini applies only when Grafana creates its
# database. Before $__file{} the role set the password through
# GF_SECURITY_ADMIN_PASSWORD__FILE, which grafana-server ignores (only the
# Docker image reads it), so a database created then kept admin/admin. Check
# the provisioned password and, if it does not log in, set it with the CLI.
# The password goes through stdin, never argv or logs.
- name: grafana — wait for the HTTP API
  ansible.builtin.uri:
    url: "http://{{ gv_listen_addr }}/api/health"
    status_code: 200
  register: gv_health
  retries: 30
  delay: 2
  until: gv_health.status == 200
  when: not gv_dev_mode | bool

- name: grafana — read the provisioned admin password
  ansible.builtin.slurp:
    src: "{{ gv_admin_password_file }}"
  register: gv_admin_password_now
  no_log: true
  when: not gv_dev_mode | bool

- name: grafana — check that the provisioned admin password logs in
  ansible.builtin.uri:
    url: "http://{{ gv_listen_addr }}/api/user"
    user: admin
    password: "{{ gv_admin_password_now.content | b64decode | trim }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: gv_admin_login
  no_log: true
  when: not gv_dev_mode | bool

- name: grafana — set the provisioned admin password
  ansible.builtin.command:
    argv:
      - /usr/sbin/grafana-cli
      - --homepath
      - /usr/share/grafana
      - --config
      - "{{ gv_config_path }}"
      - admin
      - reset-admin-password
      - --password-from-stdin
    stdin: "{{ gv_admin_password_now.content | b64decode | trim }}"
  become: true
  become_user: grafana
  changed_when: true
  no_log: true
  when:
    - not gv_dev_mode | bool
    - gv_admin_login.status == 401

- name: "grafana — dev mode: skip service start"
  ansible.builtin.debug:
    msg: >-
      gv_dev_mode=true; grafana-server.service NOT enabled. Run with
      -e gv_dev_mode=false and an operator-provisioned admin password
      file (gv_admin_password_file, mode 0400, owner grafana) to
      enable production.
  when: gv_dev_mode | bool
