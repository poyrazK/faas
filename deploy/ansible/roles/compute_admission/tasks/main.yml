---
# compute_admission — fail-closed inputs for a production compute host.
#
# This role deliberately runs before storage and Firecracker provisioning in
# bootstrap.yml. It checks cheap prerequisites first so a bad environment
# file, missing release identity, or non-virtualized machine cannot spend
# minutes downloading packages or compiling a kernel.

- name: compute_admission — require the production compute role
  ansible.builtin.assert:
    that:
      - faas_box_role == 'compute-only'
    fail_msg: >-
      compute_admission is only valid for a production compute-only host;
      got faas_box_role={{ faas_box_role | default('unset') }}.
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — inspect compute database environment
  ansible.builtin.stat:
    path: /etc/faas/compute-db.env
  register: faas_admission_env_stat
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — require protected compute environment file
  ansible.builtin.assert:
    that:
      - faas_admission_env_stat.stat.exists
      - faas_admission_env_stat.stat.isreg
      - faas_admission_env_stat.stat.pw_name == 'root'
      - faas_admission_env_stat.stat.gr_name == 'root'
      - faas_admission_env_stat.stat.mode == '0600'
    fail_msg: >-
      /etc/faas/compute-db.env must exist as a regular root:root 0600 file
      before a production compute node is admitted.
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — inspect shared storage environment
  ansible.builtin.stat:
    path: /etc/faas/storage.env
  register: faas_admission_storage_stat
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — require protected shared storage environment
  ansible.builtin.assert:
    that:
      - faas_admission_storage_stat.stat.exists
      - faas_admission_storage_stat.stat.isreg
      - faas_admission_storage_stat.stat.pw_name == 'root'
      - faas_admission_storage_stat.stat.gr_name == 'faas'
      - faas_admission_storage_stat.stat.mode == '0440'
    fail_msg: >-
      /etc/faas/storage.env must exist as a regular root:faas 0440 file
      before a production compute node is admitted. It is the canonical
      shared-artifact environment loaded by compute daemons.
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — load shared storage environment without logging secrets
  ansible.builtin.slurp:
    src: /etc/faas/storage.env
  register: faas_admission_storage_blob
  no_log: true
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — require one canonical shared-artifact assignment per key
  ansible.builtin.assert:
    that:
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_BACKEND=[^\\r\\n]*$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_BACKEND=oci$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=[^\\r\\n]*$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_LOCAL_PREFIXES=none$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_REQUIRE_SHARED_ARTIFACTS=[^\\r\\n]*$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_REQUIRE_SHARED_ARTIFACTS=1$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_CACHE_SERVE_STALE=[^\\r\\n]*$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_STORAGE_CACHE_SERVE_STALE=0$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_OCI_REGISTRY=[^\\r\\n]*$') | length) == 1"
      - "((faas_admission_storage_blob.content | b64decode) | regex_findall('(?m)^FAAS_OCI_REGISTRY=https://[^\\s]+$') | length) == 1"
    fail_msg: >-
      The shared storage environment does not declare exactly one canonical
      strict shared-artifact contract. Require OCI remote-only storage, HTTPS,
      and stale-cache fallback disabled before admitting this node.
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — inspect KVM device
  ansible.builtin.stat:
    path: /dev/kvm
  register: faas_kvm_stat
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — require hardware virtualization
  ansible.builtin.assert:
    that:
      - faas_kvm_stat.stat.exists
      - faas_kvm_stat.stat.ischr
    fail_msg: >-
      /dev/kvm is missing or is not a character device. Enable hardware
      virtualization/nested virtualization on the provider before joining
      this machine as a Firecracker compute node.
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — verify KVM is usable by root
  ansible.builtin.command:
    argv: [test, -r, /dev/kvm, -a, -w, /dev/kvm]
  register: faas_kvm_access
  changed_when: false
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — fail when KVM access is unavailable
  ansible.builtin.assert:
    that: faas_kvm_access.rc == 0
    fail_msg: >-
      /dev/kvm exists but is not readable and writable by root; refusing to
      install a compute node that cannot launch Firecracker.
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — require a staged release manifest
  ansible.builtin.stat:
    path: /etc/faas/manifest.yaml
  register: faas_admission_manifest_stat
  when: not (faas_image_seed | default(false) | bool)

- name: compute_admission — load staged release manifest
  ansible.builtin.slurp:
    src: /etc/faas/manifest.yaml
  register: faas_admission_manifest_blob
  no_log: true
  when:
    - not (faas_image_seed | default(false) | bool)
    - faas_admission_manifest_stat.stat.exists
    - faas_admission_manifest_stat.stat.isreg

- name: compute_admission — decode staged release identity
  ansible.builtin.set_fact:
    faas_release_artifact_identity: >-
      {{ faas_admission_manifest_blob.content | b64decode | from_yaml }}
    faas_admission_release: >-
      {{ (faas_admission_manifest_blob.content | b64decode | from_yaml).release | default({}) }}
  no_log: true
  when:
    - not (faas_image_seed | default(false) | bool)
    - faas_admission_manifest_stat.stat.exists
    - faas_admission_manifest_stat.stat.isreg

- name: compute_admission — require real release artifact digests
  ansible.builtin.assert:
    that:
      - faas_admission_manifest_stat.stat.exists
      - faas_admission_manifest_stat.stat.isreg
      - faas_admission_release is mapping
      - (faas_admission_release | default({})).architecture | default('') == 'x86_64'
      - ((faas_admission_release | default({})).firecracker_version | default('') | regex_replace('^v', '')) == (fc_release | regex_replace('^v', ''))
      - (faas_admission_release | default({})).git_sha | default('') is match('^[0-9a-fA-F]{40}$')
      - (faas_admission_release | default({})).firecracker_digest | default('') is match('^[0-9a-fA-F]{64}$')
      - (faas_admission_release | default({})).kernel_digest | default('') is match('^[0-9a-fA-F]{64}$')
      - ((faas_admission_release | default({})).git_sha | default('') | lower) != ('0' * 40)
      - not ((faas_admission_release | default({})).firecracker_digest | default('') | lower).startswith('replace')
      - not ((faas_admission_release | default({})).kernel_digest | default('') | lower).startswith('replace')
    fail_msg: >-
      /etc/faas/manifest.yaml must be a regular file with real
      release.firecracker_digest and release.kernel_digest values before
      Firecracker provisioning starts.
  when: not (faas_image_seed | default(false) | bool)
