---
# This role only changes PostgreSQL connection capacity. It is deliberately
# separate from the bootstrap postgres role so cd-compute can converge the
# already-provisioned control plane before activating another compute node.

- name: postgres capacity — validate the public-beta budget
  ansible.builtin.assert:
    that:
      - (faas_postgres_max_connections | int) > 0
      - (faas_postgres_superuser_reserved_connections | int) >= 3
      - (faas_postgres_superuser_reserved_connections | int) < (faas_postgres_max_connections | int)
      - >-
        ((faas_postgres_max_connections | int)
        - (faas_postgres_superuser_reserved_connections | int))
        >= ((faas_postgres_rollout_overlap_pool_budget | int)
        + (faas_postgres_min_operator_headroom | int))
      - >-
        ((faas_postgres_two_compute_pool_budget | int) * 4)
        <= (((faas_postgres_max_connections | int)
        - (faas_postgres_superuser_reserved_connections | int)) * 3)
    fail_msg: >-
      PostgreSQL capacity must fit the two-compute steady daemon budget below
      the 75% warning threshold and the rollout-overlap budget plus operator
      headroom. Increase capacity or reduce daemon pools before activation.

- name: postgres capacity — discover PostgreSQL cluster config
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    recurse: false
  register: postgres_capacity_cluster_dirs
  changed_when: false

- name: postgres capacity — require an installed PostgreSQL cluster
  ansible.builtin.assert:
    that:
      - (postgres_capacity_cluster_dirs.files | default([]) | length) > 0
    fail_msg: >-
      PostgreSQL capacity cannot be converged because no cluster exists under
      /etc/postgresql.

- name: postgres capacity — derive active cluster config directory
  ansible.builtin.set_fact:
    postgres_capacity_major_version: >-
      {{ (postgres_capacity_cluster_dirs.files
      | map(attribute='path') | map('basename') | list | sort | last) }}
    postgres_capacity_config_dir: >-
      /etc/postgresql/{{ (postgres_capacity_cluster_dirs.files
      | map(attribute='path') | map('basename') | list | sort | last) }}/main

- name: postgres capacity — set max_connections
  ansible.builtin.lineinfile:
    path: "{{ postgres_capacity_config_dir }}/postgresql.conf"
    regexp: "^\\s*#?\\s*max_connections\\s*="
    line: "max_connections = {{ faas_postgres_max_connections | int }}"
    create: false
  notify: restart postgresql for capacity

- name: postgres capacity — reserve operator connections
  ansible.builtin.lineinfile:
    path: "{{ postgres_capacity_config_dir }}/postgresql.conf"
    regexp: "^\\s*#?\\s*superuser_reserved_connections\\s*="
    line: >-
      superuser_reserved_connections = {{ faas_postgres_superuser_reserved_connections | int }}
    create: false
  notify: restart postgresql for capacity

- name: postgres capacity — activate postmaster settings before node admission
  ansible.builtin.meta: flush_handlers

- name: postgres capacity — read live postmaster settings
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -A
      - -t
      - -d
      - postgres
      - -c
      - >-
        select current_setting('max_connections') || ':' ||
        current_setting('superuser_reserved_connections')
  register: postgres_capacity_live
  changed_when: false
  retries: 15
  delay: 2
  until: postgres_capacity_live.rc == 0

- name: postgres capacity — verify live ordinary-client capacity
  ansible.builtin.assert:
    that:
      - >-
        (postgres_capacity_live.stdout | trim)
        == ((faas_postgres_max_connections | int | string)
        + ':' + (faas_postgres_superuser_reserved_connections | int | string))
    fail_msg: >-
      PostgreSQL restarted without the requested max/reserved connection
      settings; refusing to admit another compute node.
