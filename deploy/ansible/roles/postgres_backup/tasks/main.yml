# postgres_backup — install the nightly pg_basebackup timer (spec §14 M8)
# + the off-host push timer (issue #250).
#
# Runs AFTER the `postgres` role so:
#   * the cluster is up (postgresql.service exists),
#   * the `faas` system user + DB exist (the role reads them),
#   * `/var/lib/pgsql/archive` exists (postgres role:158-165),
#   * WAL archiving is wired (wal_level=replica, archive_mode=on,
#     archive_command wired — issue #250 rewrites the cp-only baseline
#     to a local-first rclone push through the stable offhostbox remote).
#
# This role does NOT change PG config — the producer only consumes the
# existing GUCs. It drops four systemd units into /etc/systemd/system/
# and enables both timers. Re-running is a no-op on a converged box.
#
# Off-host push wiring (issue #250):
#   * rclone installed via apt (matches the distro PostgreSQL install
#     pattern; we don't vendor binaries).
#   * /etc/faas/secrets/storage-box/{rclone.conf,box-age-key} are
#     sealed-at-rest via host.age (PR #371 cosign precedent) and
#     decrypted into a tmpfs staging dir at ansible-run time. systemd
#     `LoadCredential=` surfaces the plaintext file inside the push
#     unit's $CREDENTIALS_DIRECTORY; rclone reads `%d/faas_off_host_backup_rclone`.
#   * Fail-closed asserts on mode + owner + group for every secret
#     file (mirrors the canonical `stat` + `failed_when` block in
#     control_plane_service/tasks/main.yml:108-209).
#   * The provider-specific endpoint is intentionally not an Ansible
#     variable. It belongs in the rclone remote named by
#     `off_host_backup_remote`, which keeps this role provider-neutral.

- name: postgres_backup — fail-closed on missing off-host backup env
  ansible.builtin.assert:
    that:
      - off_host_backup_remote is defined and off_host_backup_remote != ''
      - off_host_backup_basebackup_path is defined and off_host_backup_basebackup_path != ''
      - off_host_backup_wal_path is defined and off_host_backup_wal_path != ''
    fail_msg: >-
      off_host_backup_remote, off_host_backup_basebackup_path, and
      off_host_backup_wal_path must be configured (issue #250). Provider
      credentials belong in the rclone remote, not in Ansible variables.

- name: postgres_backup — install rclone
  ansible.builtin.apt:
    name:
      - rclone
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: postgres_backup — create basebackup root
  ansible.builtin.file:
    path: /var/lib/pgsql/basebackup
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  failed_when: false  # chroot/CI may not have the postgres user

- name: postgres_backup — drop basebackup.service
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/faas-pg-basebackup.service"
    dest: /etc/systemd/system/faas-pg-basebackup.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres_backup

- name: postgres_backup — drop basebackup.timer
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/faas-pg-basebackup.timer"
    dest: /etc/systemd/system/faas-pg-basebackup.timer
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres_backup

# Issue #250: off-host push wiring. The new units ride on the
# postgres_backup role so both timers live on the same host, both
# touch the same basebackup tree, and both run on the 03:00/03:30
# UTC cadence (matches Postgres' WAL-archive flush window).
- name: postgres_backup — create storage-box secret dir (0700 root:root)
  ansible.builtin.file:
    path: /etc/faas/secrets/storage-box
    state: directory
    owner: root
    group: root
    mode: "0700"
  failed_when: false  # chroot/CI may not have /etc/faas/secrets

- name: postgres_backup — drop basebackup-push.service
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/faas-pg-basebackup-push.service"
    dest: /etc/systemd/system/faas-pg-basebackup-push.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres_backup

- name: postgres_backup — drop basebackup-push.timer
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../systemd/faas-pg-basebackup-push.timer"
    dest: /etc/systemd/system/faas-pg-basebackup-push.timer
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload postgres_backup

# Issue #250 (review F3): rclone copyto / rclone sync do NOT
# auto-create parent directories on the remote Storage Box — the
# first push fails loud with "directory not found" and silently
# stalls the off-host backup. Create the two directories at role
# apply time so the very first archive_command has somewhere to
# land. Idempotent: rclone mkdir is a no-op if the dir already
# exists. Reads the credential from the same systemd LoadCredential
# source the units use (mode 0400 root:root — see the perms
# assert below).
#
# `rclone mkdir` is idempotent on the remote, but it accepts one
# destination per invocation. Run it once for each logical path and
# suppress the always-no-op change result. Skip the network calls when
# the optional credential has not been provisioned yet; a later Ansible
# run after unsealing the credential will create both directories.
- name: postgres_backup — stat rclone config for remote dir initialization
  ansible.builtin.stat:
    path: /etc/faas/secrets/storage-box/rclone.conf
  register: pg_rclone_conf
  failed_when: false

- name: postgres_backup — check configured offhostbox remote
  ansible.builtin.command:
    cmd: grep -q '^\[offhostbox\]$' /etc/faas/secrets/storage-box/rclone.conf
  register: pg_rclone_remote
  changed_when: false
  failed_when: false
  when: pg_rclone_conf.stat.exists | default(false)

- name: postgres_backup — create off-host backup dirs (issue # 250 / F3)
  ansible.builtin.command:
    cmd: >-
      rclone mkdir
      {{ off_host_backup_remote }}:{{ item }}
      --config=/etc/faas/secrets/storage-box/rclone.conf
      --stats=0 --quiet
  loop:
    - "{{ off_host_backup_basebackup_path }}"
    - "{{ off_host_backup_wal_path }}"
  when:
    - pg_rclone_conf.stat.exists | default(false)
    - (pg_rclone_remote.rc | default(1)) == 0
  changed_when: false
  failed_when: false  # chroot/CI may not have rclone or the secret

- name: postgres_backup — daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  failed_when: false  # chroot/CI lacks systemd

- name: postgres_backup — enable + start the local basebackup timer
  ansible.builtin.systemd:
    name: faas-pg-basebackup.timer
    enabled: true
    state: started
  failed_when: false  # chroot/CI lacks systemd

- name: postgres_backup — enable + start the off-host push timer
  ansible.builtin.systemd:
    name: faas-pg-basebackup-push.timer
    enabled: true
    state: started
  failed_when: false  # chroot/CI lacks systemd

# Spec §11 sanity check — refuse to claim success if the basebackup root
# is world-readable. Catches a wrong umask in a future edit of the
# service unit.
- name: postgres_backup — verify basebackup root mode (spec §11)
  ansible.builtin.stat:
    path: /var/lib/pgsql/basebackup
  register: pg_bb_root
  failed_when: false
- name: postgres_backup — assert mode ≤ 0750
  ansible.builtin.assert:
    that:
      - pg_bb_root.stat.exists
      - pg_bb_root.stat.mode in ["0750", "0700"]
    fail_msg: "/var/lib/pgsql/basebackup must be 0750 or tighter (spec §11)"
  when: pg_bb_root.stat.exists

# Issue #250 — fail-closed asserts on the storage-box secret files.
# Mirrors control_plane_service/tasks/main.yml:108-209. The pattern
# is `stat` + `failed_when` full-arity on mode + owner + group.
#
# Two distinct perms profiles:
#
#   rclone.conf  → 0400 root:root
#     PID 1 reads this source and LoadCredential= surfaces a
#     service-scoped copy under $CREDENTIALS_DIRECTORY at unit
#     activation. The PostgreSQL user never reads /etc/faas directly.
#
#   box-age-key  → 0400 root:root
#     Used only by the bootstrap-time `gregalectl backup unseal-rclone`
#     CLI which runs as root. Never read by a daemon, so the
#     tighter 0400 root:root profile is correct. Same shape as
#     /etc/faas/secrets/host.age and /etc/faas/secrets/session.key.
#
# Skipped in chroot/CI (no /etc/faas/secrets/storage-box/ yet). On a
# real production box the v1 bootstrap.sh step that decrypts
# host.age-sealed secrets into the staging dir is required before this
# role passes (RETIRED 2026-08-15 by issue #911 / PR-1; v2 path is PR-X
# `gregalectl secrets init`).
- name: postgres_backup — stat storage-box secrets
  ansible.builtin.stat:
    path: "/etc/faas/secrets/storage-box/{{ item.name }}"
  loop:
    - { name: rclone.conf, mode: "0400", owner: root, group: root }
    - { name: box-age-key, mode: "0400", owner: root, group: root }
  register: pg_sb_stat
  failed_when: false

- name: postgres_backup — assert storage-box secrets match the perms profile
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.mode == item.item.mode
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
    fail_msg: >-
      /etc/faas/secrets/storage-box/{{ item.item.name }} must be
      {{ item.item.mode }} {{ item.item.owner }}:{{ item.item.group }}
      (issue #250, spec §11). Re-run `gregalectl backup unseal-rclone`
      (PR-X `gregalectl secrets init` supersedes the v1 bootstrap.sh —
      RETIRED 2026-08-15 by issue #911 / PR-1) to repopulate from
      the host.age-sealed form. systemd reads rclone.conf as root
      and stages it for the PostgreSQL cluster via LoadCredential.
  loop: "{{ pg_sb_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists

# Issue #585 / ADR-127 — per-daemon secret file perm-asserts. The
# shared block covers ALL new per-daemon secret files (pg-basebackup-
# push owns storage-box.user + storage-box.host; the rest are checked
# here as defense in depth). Each assert is a no-op when the file is
# absent (operator-provisioned via `gregalectl secrets init`).
- name: postgres_backup — sealed.env split perm-asserts (issue # 585 / ADR-127)
  ansible.builtin.include_tasks: ../../_shared/tasks/sealed_env_split_perm_asserts.yml
