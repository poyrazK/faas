---
# ADR-20261117185346: converge the agent egress gateway. Compute nodes
# register their slices through peer files (agent_egress_client); this role
# owns the agent interface, the key check, forwarding, the agent addresses'
# NAT and the gateway's own deny layer. On a host shared with the tenant
# gateway it touches none of the tenant gateway's files or table.

- name: agent_egress_gateway — require the manifest gateway contract
  ansible.builtin.assert:
    that:
      - faas_agent_egress_gateway_public_key | length > 0
      - faas_agent_egress_tunnel_cidr | length > 0
      - faas_agent_egress_gateway_address | default('') | length > 0
      - faas_agent_egress_addresses | length > 0
    fail_msg: >-
      The agent gateway host needs the manifest-generated host_vars. Declare
      egress.agent_gateway in the manifest and run `make manifest-ansible`.

# The tenant gateway masquerades to the NIC's primary address, so an agent
# address must be a secondary one, and every agent address must be here.
- name: agent_egress_gateway — the agent addresses are secondary addresses on the public NIC
  ansible.builtin.assert:
    that:
      - ansible_default_ipv4.address | default('') not in faas_agent_egress_addresses
      - >-
        faas_agent_egress_addresses | difference(
          ([ansible_facts[faas_agent_egress_gateway_public_iface | replace('-', '_')].ipv4 | default({})]
           + ansible_facts[faas_agent_egress_gateway_public_iface | replace('-', '_')].ipv4_secondaries | default([]))
          | map(attribute='address') | list) | length == 0
    fail_msg: >-
      Assign {{ faas_agent_egress_addresses | join(', ') }} to
      {{ faas_agent_egress_gateway_public_iface }} as secondary addresses
      (never the primary, which the tenant gateway masquerades to), then re-run.

- name: agent_egress_gateway — install wireguard-tools and nftables
  ansible.builtin.apt:
    name:
      - wireguard-tools
      - nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: agent_egress_gateway — enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/60-faas-agent-egress.conf
    state: present
    reload: true

- name: agent_egress_gateway — mint the gateway key once
  ansible.builtin.shell: |
    set -eu
    umask 077
    wg genkey > /etc/wireguard/{{ faas_agent_egress_iface }}.key
  args:
    creates: /etc/wireguard/{{ faas_agent_egress_iface }}.key
    executable: /bin/bash

- name: agent_egress_gateway — derive the gateway public key
  ansible.builtin.shell: |
    set -eu
    wg pubkey < /etc/wireguard/{{ faas_agent_egress_iface }}.key
  args:
    executable: /bin/bash
  register: faas_agent_egress_gateway_derived_key
  changed_when: false

- name: agent_egress_gateway — the manifest must pin this gateway's key
  ansible.builtin.assert:
    that:
      - faas_agent_egress_gateway_derived_key.stdout | trim == faas_agent_egress_gateway_public_key
    fail_msg: >-
      The gateway's agent WireGuard public key is
      {{ faas_agent_egress_gateway_derived_key.stdout | trim }} but the manifest
      pins {{ faas_agent_egress_gateway_public_key }}. Set
      egress.agent_gateway.public_key to it, regenerate host_vars and re-run.

- name: agent_egress_gateway — create the config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/faas/agent-egress
    - /etc/faas/agent-egress/peers

- name: agent_egress_gateway — render the interface stanza
  ansible.builtin.template:
    src: interface.conf.j2
    dest: /etc/faas/agent-egress/interface.conf
    owner: root
    group: root
    mode: "0600"
  notify: sync faas agent egress peers

- name: agent_egress_gateway — install the peer sync helper
  ansible.builtin.template:
    src: faas-agent-egress-sync.j2
    dest: /usr/local/sbin/faas-agent-egress-sync
    owner: root
    group: root
    mode: "0755"
  notify: sync faas agent egress peers

# groups[] ignores --limit, so a limited run never prunes a live node.
- name: agent_egress_gateway — list registered peers
  ansible.builtin.find:
    paths: /etc/faas/agent-egress/peers
    patterns: "*.conf"
  register: faas_agent_egress_peer_files

- name: agent_egress_gateway — drop peers for nodes no longer in the fleet
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ faas_agent_egress_peer_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\\.conf$', '')) not in groups['compute_nodes'] | default([])
  notify: sync faas agent egress peers

- name: agent_egress_gateway — render the gateway firewall
  ansible.builtin.template:
    src: agent-egress-gw.nft.j2
    dest: /etc/faas/agent-egress/agent-egress-gw.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: reload faas agent egress firewall

- name: agent_egress_gateway — install the firewall unit
  ansible.builtin.template:
    src: faas-agent-egress-firewall.service.j2
    dest: /etc/systemd/system/faas-agent-egress-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: reload faas agent egress firewall

- name: agent_egress_gateway — start the firewall before the tunnel
  ansible.builtin.systemd:
    name: faas-agent-egress-firewall
    enabled: true
    state: started
    daemon_reload: true

- name: agent_egress_gateway — assemble the tunnel config
  ansible.builtin.command: /usr/local/sbin/faas-agent-egress-sync
  args:
    creates: /etc/wireguard/{{ faas_agent_egress_iface }}.conf

- name: agent_egress_gateway — start the tunnel
  ansible.builtin.systemd:
    name: wg-quick@{{ faas_agent_egress_iface }}
    enabled: true
    state: started
