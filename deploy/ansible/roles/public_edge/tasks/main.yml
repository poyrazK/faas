---
# public_edge installs the control plane's public TLS edge. Before this role
# the edge was hand-built, so a control plane rebuilt from scratch had nothing
# listening on 443 and Cloudflare returned 521 for api.<domain>.

- name: public_edge — inspect the operator-provisioned Origin CA material
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [faas_public_edge_cert, faas_public_edge_key] + faas_public_edge_extra_tls_files }}"
  register: faas_public_edge_tls_stat
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_platform_tls | bool

- name: public_edge — require the Origin CA certificate and key
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.size > 0
    fail_msg: >-
      {{ item.item }} is missing. Create a Cloudflare Origin CA certificate for
      the zone it serves and its wildcard ({{ faas_public_edge_domain }} for
      {{ faas_public_edge_cert | basename }}, the named domain for
      cloudflare-origin-<domain>.pem) and install the certificate and key there
      (key 0440 root:caddy) before enabling the public edge.
  loop: "{{ faas_public_edge_tls_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_platform_tls | bool

- name: public_edge — inspect the Cloudflare origin-pull CA
  ansible.builtin.stat:
    path: "{{ faas_public_edge_origin_pull_ca }}"
  register: faas_public_edge_origin_pull_ca_stat
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_platform_tls | bool
    - faas_public_edge_authenticated_origin_pulls | bool

- name: public_edge — require the origin-pull CA before requiring client certificates
  ansible.builtin.assert:
    that:
      - faas_public_edge_origin_pull_ca_stat.stat.exists
      - faas_public_edge_origin_pull_ca_stat.stat.size > 0
    fail_msg: >-
      faas_public_edge_authenticated_origin_pulls is on but
      {{ faas_public_edge_origin_pull_ca }} is missing. Install Cloudflare's
      origin-pull CA certificate there, and turn on Authenticated Origin Pulls
      for the zone in Cloudflare first: Caddy refuses every request without
      the client certificate.
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_platform_tls | bool
    - faas_public_edge_authenticated_origin_pulls | bool

- name: public_edge — require an ACME contact for on-demand customer certificates
  ansible.builtin.assert:
    that:
      - faas_custom_domain_acme_email | length > 0
      - "'@' in faas_custom_domain_acme_email"
    fail_msg: >-
      public_edge.custom_domains is enabled but faas_custom_domain_acme_email is
      empty. Set public_edge.custom_domains.acme_email in the manifest; the CA
      sends expiry and policy notices there.
  when: faas_custom_domain_tls | bool

- name: public_edge — install the Caddy repository keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: faas_public_edge_enabled | bool

- name: public_edge — install the Caddy repository keyring
  ansible.builtin.get_url:
    url: "{{ faas_public_edge_caddy_repo }}/gpg.key"
    dest: /etc/apt/keyrings/caddy-stable.asc
    owner: root
    group: root
    mode: "0644"
  when: faas_public_edge_enabled | bool

- name: public_edge — add the Caddy apt repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: "{{ faas_public_edge_caddy_repo }}/deb/debian"
    suites: any-version
    components: [main]
    signed_by: /etc/apt/keyrings/caddy-stable.asc
    state: present
    enabled: true
  when: faas_public_edge_enabled | bool

# The pin keeps an unattended upgrade from moving Caddy, and outranks the
# distro's older package (H14-7).
- name: public_edge — pin the Caddy version
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/caddy-pref
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: caddy
      Pin: version {{ faas_public_edge_caddy_version }}
      Pin-Priority: 1001
  when: faas_public_edge_enabled | bool

- name: public_edge — install Caddy
  ansible.builtin.apt:
    name: "caddy={{ faas_public_edge_caddy_version }}"
    state: present
    update_cache: true
  when: faas_public_edge_enabled | bool
  notify: public_edge — restart caddy

- name: public_edge — keep the Origin CA key readable by caddy only
  ansible.builtin.file:
    path: "{{ faas_public_edge_key }}"
    owner: root
    group: caddy
    mode: "0440"
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_platform_tls | bool

- name: public_edge — keep the other zones' Origin CA keys readable by caddy only
  ansible.builtin.file:
    path: "{{ faas_public_edge_tls_dir }}/cloudflare-origin-{{ item }}.key"
    owner: root
    group: caddy
    mode: "0440"
  loop: "{{ faas_public_edge_extra_domains }}"
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_platform_tls | bool

# The distro package ships a :80 file-server welcome site. Remove it once so
# the managed public hosts own ports 80 and 443.
- name: public_edge — read the current Caddyfile
  ansible.builtin.slurp:
    src: "{{ faas_public_edge_caddyfile }}"
  register: faas_public_edge_current_caddyfile
  failed_when: false
  when: faas_public_edge_enabled | bool

- name: public_edge — drop the distro welcome site
  ansible.builtin.copy:
    dest: "{{ faas_public_edge_caddyfile }}"
    content: ""
    owner: root
    group: root
    mode: "0644"
  when:
    - faas_public_edge_enabled | bool
    - faas_public_edge_current_caddyfile.content is defined
    - "'root * /usr/share/caddy' in (faas_public_edge_current_caddyfile.content | b64decode)"

# gatewayd-public accepts exactly one X-Forwarded-For hop from its trusted
# loopback ingress and rejects anything else as a forged caller IP. On the
# platform site only Cloudflare is answered (GCP firewall + nftables, and the
# site itself aborts other peers once customer domains open 443), and
# Cloudflare overwrites CF-Connecting-IP, so that header is the single client
# hop. Customer-domain connections arrive directly, so their hop is the peer
# address; a client-sent CF-Connecting-IP is never trusted there.
#
# The global options block must be the first thing in the Caddyfile, so it
# lives in this block, which is inserted at the top. Other roles
# (s3_gateway_service) append their own site blocks.
- name: public_edge — manage the public edge Caddy block
  ansible.builtin.blockinfile:
    path: "{{ faas_public_edge_caddyfile }}"
    marker: "# {mark} ANSIBLE MANAGED Gregale public edge"
    insertbefore: BOF
    create: true
    owner: root
    group: root
    mode: "0644"
    block: |
      {% if faas_custom_domain_tls | default(false) | bool %}
      {
          email {{ faas_custom_domain_acme_email }}
          on_demand_tls {
              ask {{ faas_public_edge_ask_url }}
          }
      }

      {% endif %}
      {% if faas_public_edge_platform_tls | default(true) | bool %}
      {% set faas_public_edge_sites = [[faas_public_edge_domain, faas_public_edge_cert, faas_public_edge_key]] %}
      {% for domain in faas_public_edge_extra_domains | default([]) %}
      {% set _ = faas_public_edge_sites.append([domain, (faas_public_edge_tls_dir | default('/etc/caddy/tls')) ~ '/cloudflare-origin-' ~ domain ~ '.pem', (faas_public_edge_tls_dir | default('/etc/caddy/tls')) ~ '/cloudflare-origin-' ~ domain ~ '.key']) %}
      {% endfor %}
      {% for site in faas_public_edge_sites %}
      {{ site[0] }}, *.{{ site[0] }} {
      {% if faas_public_edge_authenticated_origin_pulls | default(false) | bool %}
          tls {{ site[1] }} {{ site[2] }} {
              client_auth {
                  mode require_and_verify
                  trust_pool file {{ faas_public_edge_origin_pull_ca }}
              }
          }
      {% else %}
          tls {{ site[1] }} {{ site[2] }}
      {% endif %}
      {% if faas_custom_domain_tls | default(false) | bool %}
          @direct not remote_ip {{ faas_public_edge_cloudflare_cidrs | join(' ') }}
      {% if faas_public_edge_grpc_h2c | default(false) | bool %}
          @grpc header Content-Type application/grpc*
      {% endif %}
          route {
              abort @direct
      {% if faas_public_edge_grpc_h2c | default(false) | bool %}
              reverse_proxy @grpc h2c://{{ faas_public_edge_upstream }} {
                  header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
              }
      {% endif %}
              reverse_proxy {{ faas_public_edge_upstream }} {
                  header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
              }
          }
      {% elif faas_public_edge_grpc_h2c | default(false) | bool %}
          @grpc header Content-Type application/grpc*
          route {
              reverse_proxy @grpc h2c://{{ faas_public_edge_upstream }} {
                  header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
              }
              reverse_proxy {{ faas_public_edge_upstream }} {
                  header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
              }
          }
      {% else %}
          reverse_proxy {{ faas_public_edge_upstream }} {
              header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
          }
      {% endif %}
      }
      {% endfor %}
      {% endif %}
      {% if faas_custom_domain_tls | default(false) | bool %}

      # ADR-520: customer domains. A certificate is obtained, renewed and
      # loaded only after gatewayd-public answers the ask URL with 200.
      https:// {
          tls {
              on_demand
          }
      {% if faas_public_edge_grpc_h2c | default(false) | bool %}
          @grpc header Content-Type application/grpc*
          route {
              reverse_proxy @grpc h2c://{{ faas_public_edge_upstream }} {
                  header_up X-Forwarded-For {remote_host}
              }
              reverse_proxy {{ faas_public_edge_upstream }} {
                  header_up X-Forwarded-For {remote_host}
              }
          }
      {% else %}
          reverse_proxy {{ faas_public_edge_upstream }} {
              header_up X-Forwarded-For {remote_host}
          }
      {% endif %}
      }

      http:// {
          redir https://{host}{uri} 308
      }
      {% endif %}
    validate: "{{ faas_public_edge_caddy_binary }} validate --adapter caddyfile --config %s"
  when: faas_public_edge_enabled | bool
  notify: reload caddy for public edge

# ADR-1431: a separate block, so turning the AI host off removes only it.
# A more specific host than the platform wildcard, so Caddy serves it here.
- name: public_edge — manage the AI gateway public host
  ansible.builtin.blockinfile:
    path: "{{ faas_public_edge_caddyfile }}"
    marker: "# {mark} ANSIBLE MANAGED Gregale AI gateway public host"
    state: "{{ 'present' if faas_ai_gateway_public_enabled | bool else 'absent' }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    block: |
      {{ faas_ai_gateway_public_host }} {
      {% if faas_public_edge_platform_tls | default(true) | bool %}
          tls {{ faas_public_edge_cert }} {{ faas_public_edge_key }}
      {% endif %}
      {% if faas_custom_domain_tls | default(false) | bool %}
          @direct not remote_ip {{ faas_public_edge_cloudflare_cidrs | join(' ') }}
          route {
              abort @direct
              reverse_proxy {{ faas_ai_gateway_public_upstream }}
          }
      {% else %}
          reverse_proxy {{ faas_ai_gateway_public_upstream }}
      {% endif %}
      }
    validate: "{{ faas_public_edge_caddy_binary }} validate --adapter caddyfile --config %s"
  when: faas_public_edge_enabled | bool
  notify: reload caddy for public edge

- name: public_edge — enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
  when: faas_public_edge_enabled | bool
