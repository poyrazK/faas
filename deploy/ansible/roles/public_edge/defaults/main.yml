---
# Public TLS edge. Two independent parts, both served by Caddy on this host
# and both proxying to gatewayd-public on loopback:
#
#  - Platform hosts (manifest dns.mode: cloudflare, rendered as
#    faas_cloudflare_origin_only): Caddy terminates TLS with the zone's
#    Cloudflare Origin CA certificate and only answers Cloudflare.
#  - Customer domains (manifest public_edge.custom_domains, rendered as
#    faas_custom_domain_tls; ADR-520): Caddy obtains and renews a Let's
#    Encrypt certificate per hostname on demand, after gatewayd-public
#    confirms the hostname is a verified custom domain. Customers reach the
#    edge directly, so ports 80/443 are open to the internet.
faas_public_edge_enabled: "{{ (faas_cloudflare_origin_only | default(false) | bool) or (faas_custom_domain_tls | default(false) | bool) }}"
faas_public_edge_platform_tls: "{{ faas_cloudflare_origin_only | default(false) | bool }}"
# The zone of the site, dashboard and API: the platform domain when the layout
# splits it from the apps domain (ADR-20261026100000), else the apps domain.
# It keeps faas_public_edge_cert across an apps-domain move.
faas_public_edge_domain: "{{ (faas_platform_domain | default('')) or (gatewayd_apps_domain | default('gregale.dev')) }}"
# Must match faas-gatewayd-public.socket ListenStream.
faas_public_edge_upstream: "127.0.0.1:8080"
# gRPC (Content-Type application/grpc*) reaches gatewayd-public over HTTP/2
# cleartext instead of the HTTP/1.1 hop every other request keeps, so
# bidirectional streams work end to end. Turn it on only after every
# gatewayd-public in the fleet accepts h2c on its public listener (the
# release that adds it): an older gatewayd-public cannot answer the h2c
# preface, and only gRPC would fail.
faas_public_edge_grpc_h2c: false
faas_public_edge_caddyfile: /etc/caddy/Caddyfile
faas_public_edge_caddy_binary: /usr/bin/caddy
# Caddy comes from its official apt repository, pinned. The distro package
# (2.6.2 on Ubuntu 24.04) ends an aborted upstream stream as a clean,
# truncated 200; 2.11.7 makes the client see the abort (Hunt 14 H14-7,
# reproduced on gregale-internal-test-1: curl exit 0 vs 18).
faas_public_edge_caddy_version: "2.11.7"
faas_public_edge_caddy_repo: https://dl.cloudsmith.io/public/caddy/stable
# Operator-provisioned Origin CA material (a secret: never in inventory or the
# repository). The key is readable by the caddy service user only.
faas_public_edge_cert: /etc/caddy/tls/cloudflare-origin.pem
faas_public_edge_key: /etc/caddy/tls/cloudflare-origin.key
# ADR-20261026100000: every other zone the domain layout owns (the apps,
# deployment-preview and alias apps domains when they differ from
# faas_public_edge_domain) gets the same site, with that zone's Origin CA
# certificate at <faas_public_edge_tls_dir>/cloudflare-origin-<domain>.pem and
# .key.
faas_public_edge_tls_dir: /etc/caddy/tls
faas_public_edge_extra_domains: "{{ ([gatewayd_apps_domain | default('gregale.dev'), faas_deploy_domain | default('')] + (faas_apps_domain_aliases | default([]))) | select | map('lower') | reject('equalto', faas_public_edge_domain | lower) | unique | list }}"
faas_public_edge_extra_tls_files: "{{ faas_public_edge_extra_domains | product(['pem', 'key']) | map('join', '.') | map('regex_replace', '^', faas_public_edge_tls_dir ~ '/cloudflare-origin-') | list }}"

# ADR-520 on-demand customer certificates. The ask URL is gatewayd-public's
# loopback control listener (FAAS_PUBLIC_CONTROL_ADDR in its unit); the
# endpoint only answers loopback peers. The ACME account email receives the
# CA's expiry and policy notices.
faas_custom_domain_tls: false
faas_custom_domain_acme_email: ""
faas_public_edge_ask_url: "http://127.0.0.1:9092/v1/internal/tls/ask"
# Platform hosts stay Cloudflare-only once 443 is open to everyone: the
# platform site aborts any connection that did not come from these ranges.
# Shared with the nftables role so both layers use one pinned list.
faas_public_edge_cloudflare_cidrs: "{{ lookup('ansible.builtin.file', role_path ~ '/../nftables/files/cloudflare-ips-v4.txt').splitlines() + lookup('ansible.builtin.file', role_path ~ '/../nftables/files/cloudflare-ips-v6.txt').splitlines() }}"

# ADR-1431: the AI gateway's public host for callers outside Gregale that
# present an access token. Caddy proxies it to outboundd's public listener,
# which serves only /i/ and /r/ paths; set public_listen_addr in
# /etc/faas/outboundd.toml to the same upstream before enabling it. The
# platform's Origin CA certificate covers the host.
faas_ai_gateway_public_enabled: false
faas_ai_gateway_public_host: "ai.{{ faas_public_edge_domain }}"
faas_ai_gateway_public_upstream: "127.0.0.1:8097"
