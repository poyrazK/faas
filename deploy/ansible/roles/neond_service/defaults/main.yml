---
# neond_service (ADR-20261112160000): the Neon key holder. False keeps neond
# off and removes its drop-in; apid keeps calling Neon with its own key.
faas_neond_enabled: false
# With neond on, point apid's Neon backend at neond's socket
# (FAAS_MANAGED_POSTGRES_NEON_BROKER). Turn neond on first, check
# neond_requests_total, then set this; false leaves apid calling Neon directly.
faas_neond_broker: false
# Neon project/branch/endpoint/snapshot/role deletes neond forwards per hour.
faas_neond_destructive_per_hour: 300
