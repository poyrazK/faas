---
- name: neond_service — daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen:
    - restart faas-neond
    - restart faas-apid for neond

- name: neond_service — try-restart faas-neond
  ansible.builtin.command: systemctl try-restart faas-neond.service  # noqa: command-instead-of-module
  changed_when: true
  listen: restart faas-neond
  when: faas_neond_enabled | bool

- name: neond_service — try-restart faas-apid
  ansible.builtin.command: systemctl try-restart faas-apid.service  # noqa: command-instead-of-module
  changed_when: true
  listen: restart faas-apid for neond
