# prometheus — defaults (spec §12 SLO dashboard pipeline).
#
# prom_version pins the binary so a future upgrade is a one-line
# change + rerun. Same precedent as the firecracker role.
#
# Prometheus binds to loopback. Local daemons and Grafana scrape it without
# depending on a provider-specific management bridge or public interface.

prom_version: "2.54.1"
# SHA-256 of prometheus-<version>.linux-amd64.tar.gz. Required at the
# call site (same pattern as node_exporter_release_sha256 and
# am_release_sha256). The role's `assert` task at the top of
# tasks/main.yml fails closed if this is missing or malformed; the
# CI `promtool check rules` step reads it from this file so the
# downloaded tarball is bit-identical to the one shipped to the EX44.
# Pin from https://github.com/prometheus/prometheus/releases/tag/v{{ prom_version }}
# and bump both the version and the hash together. SHA-256 of
# prometheus-2.54.1.linux-amd64.tar.gz from the upstream release.
prom_release_sha256: "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f"
# 9090 belongs to gatewayd-internal's control listener. Keep Prometheus on
# its dedicated loopback port so a restart cannot collide with a daemon
# health/metrics endpoint.
prom_listen_addr: "127.0.0.1:9095"
prom_retention_days: 15
prom_data_dir: /var/lib/prometheus

# The control-plane Prometheus discovers active compute gateway listeners from
# apid's loopback registry endpoint. This is intentionally a URL, not an
# inventory-derived target list, so node add/drain/replace operations converge
# on the next refresh without editing Ansible or restarting Prometheus.
prom_compute_metrics_discovery_url: "http://127.0.0.1:8081/v1/internal/metrics/targets"
prom_compute_metrics_discovery_refresh_interval: "15s"

# Alertmanager — loopback-only (operator dials the bridge to reach it).
# Wired into prometheus.yml.j2 via the `alerting:` block. The role
# asserts at template time that the parsed host is loopback (127/8 or
# ::1) so an inventory mistake routing alert payloads off-box is caught
# here, not after the operator's pager has been silent for a week.
prom_alertmanager_url: "http://127.0.0.1:9094"

# faas daemon metrics endpoints. Each daemon exposes /metrics on its
# MetricsAddr; see cmd/<daemon>/main.go for the exact port. Keep in
# sync with the per-daemon config.toml.
#
# Each daemon's canonical /metrics endpoint is a single scrape surface for
# every registry it owns. The historical sibling paths (/metrics/fallback and
# /metrics/fcvm) remain available for targeted debugging, but Prometheus must
# scrape /metrics so ops, readiness, and dashboard series arrive together.
#
# Port notes:
# - apid default 9101 (cmd/apid/main.go — PR #132 set the loopback
#   bind; prometheus defaults previously had 9092, drifted from real).
# - imaged default 9102 (cmd/imaged/main.go — PR #132).
# - githubd shares the loopback :8083 mux (pkg/githubd/server.go —
#   no separate metrics port; webhook + /metrics on the same listener).
# - gatewayd-public control listener :9092 (the public HTTP listener is
#   separate; see gatewayd_public_service/files/faas-gatewayd-public.service).
# - meterd MetricsAddr is operator-supplied TOML. The ports
#   here match the production deployment on the EX44:
#   - meterd 9106 — deploy/digitalocean/config/meterd.toml pins it.
#   - schedd 9103 — deploy/digitalocean/config/schedd.toml pins it.
#   - builderd 9105 — the daemon's canonical loopback default and the
#     value documented in builderd.toml.example. The single-box target
#     is omitted automatically on a split control-plane host.
prom_targets:
  - job: apid
    host: 127.0.0.1
    port: 9101
  - job: gatewayd
    host: 127.0.0.1
    port: 9092
  - job: schedd
    host: 127.0.0.1
    port: 9103
  - job: vmmd
    host: 127.0.0.1
    port: 9104
  - job: imaged
    host: 127.0.0.1
    port: 9102
  - job: builderd
    host: 127.0.0.1
    port: 9105
    box_roles: [single-box]
  - job: githubd
    host: 127.0.0.1
    port: 8083
  - job: meterd
    host: 127.0.0.1
    port: 9106
  - job: alertmanager
    host: 127.0.0.1
    port: 9094
  - job: node
    host: 127.0.0.1
    port: 9100
