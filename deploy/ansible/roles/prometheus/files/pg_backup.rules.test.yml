rule_files:
  - pg_backup.rules.yml
evaluation_interval: 1m
tests:
  # The nightly basebackup failed; the unit stays failed until a run succeeds.
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="faas-pg-basebackup.service",state="failed",type="oneshot",instance="127.0.0.1:9100",job="node"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: PgBaseBackupFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: PgBaseBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warn
              family: pg_backup
              name: faas-pg-basebackup.service
              state: failed
              type: oneshot
              instance: 127.0.0.1:9100
              job: node
            exp_annotations:
              summary: "The last nightly Postgres basebackup failed"
              description: |
                `faas-pg-basebackup.service` is in the failed state, so the newest
                recovery point is older than the latest scheduled backup. Read
                `journalctl -u faas-pg-basebackup.service` on the control-plane
                host, fix the cause, then run `systemctl start
                faas-pg-basebackup.service` and `faas-pg-basebackup-push.service`.
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/PostgresBackup.md"
  # A successful run, or another unit failing, does not fire.
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="faas-pg-basebackup.service",state="failed",type="oneshot",instance="127.0.0.1:9100",job="node"}'
        values: '0x30'
      - series: 'node_systemd_unit_state{name="faas-pg-wal-prune.service",state="failed",type="oneshot",instance="127.0.0.1:9100",job="node"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: PgBaseBackupFailed
        exp_alerts: []
