rule_files:
  - faas.rules.yml

evaluation_interval: 1m

tests:
  - name: a cross-tenant request pages; owner-move races below the threshold stay quiet
    interval: 1m
    input_series:
      - series: 'faas_secretd_refusals_total{job="secretd",instance="127.0.0.1:9114",rpc="OpenAppSecrets",reason="wrong_account"}'
        values: '0x10 1x20'
      - series: 'faas_secretd_refusals_total{job="secretd",instance="127.0.0.1:9114",rpc="OpenAppSecrets",reason="not_authorized"}'
        values: '0x10 2x20'
      - series: 'faas_secretd_refusals_total{job="secretd",instance="127.0.0.1:9114",rpc="OpenAppSecrets",reason="budget_exhausted"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: FaasSecretdCrossTenantRequest
        exp_alerts: []
      - eval_time: 15m
        alertname: FaasSecretdCrossTenantRequest
        exp_alerts:
          - exp_labels:
              rpc: OpenAppSecrets
              reason: wrong_account
              severity: page
              component: secretd
              family: secretd
            exp_annotations:
              summary: "A compute node asked secretd for another tenant's secrets (wrong_account)"
              description: "secretd refused 1 OpenAppSecrets request(s) in the last 15 minutes with reason wrong_account: the caller sent an envelope bound to another account than the app's, or named another app's crash capture. No release sends either. Treat the node as compromised: `journalctl -u faas-secretd --since -1h | grep refused` names it; drain it and rotate the runtime domain."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/secretd.md#alerts"
      - eval_time: 15m
        alertname: FaasSecretdUnauthorizedCaller
        exp_alerts: []
      - eval_time: 15m
        alertname: FaasSecretdBudgetExhausted
        exp_alerts: []

  - name: repeated unauthorized callers warn and an exhausted budget pages
    interval: 1m
    input_series:
      - series: 'faas_secretd_refusals_total{job="secretd",instance="127.0.0.1:9114",rpc="OpenSidecarEnv",reason="not_authorized"}'
        values: '0x5 10x20'
      - series: 'faas_secretd_refusals_total{job="secretd",instance="127.0.0.1:9114",rpc="OpenAppSecrets",reason="budget_exhausted"}'
        values: '0x5 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: FaasSecretdUnauthorizedCaller
        exp_alerts:
          - exp_labels:
              rpc: OpenSidecarEnv
              reason: not_authorized
              severity: warn
              component: secretd
              family: secretd
            exp_annotations:
              summary: "secretd keeps refusing a caller (not_authorized)"
              description: "secretd refused 10 OpenSidecarEnv request(s) in the last 15 minutes with reason not_authorized: a node that neither owns the app nor holds a grant, or a leaf that names no active node. An owner move can race a restore once; more is a schedd that stopped granting, or a node asking for apps it does not run. `journalctl -u faas-secretd --since -1h | grep refused` names the node and app."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/secretd.md#alerts"
      - eval_time: 10m
        alertname: FaasSecretdBudgetExhausted
        exp_alerts:
          - exp_labels:
              rpc: OpenAppSecrets
              severity: page
              component: secretd
              family: secretd
            exp_annotations:
              summary: "A compute node opened more distinct apps than its hourly budget"
              description: "secretd refused 1 OpenAppSecrets request(s) in the last 15 minutes because a node passed FAAS_SECRETD_APPS_PER_NODE_HOUR distinct apps. Churn beyond what a node can run is a node collecting secrets. `journalctl -u faas-secretd --since -1h | grep budget` names it; drain it and rotate the runtime domain unless a known mass reschedule explains it."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/secretd.md#alerts"

  - name: secretd down pages after 2 minutes
    interval: 1m
    input_series:
      - series: 'up{job="secretd",instance="127.0.0.1:9114"}'
        values: '1x3 0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: FaasSecretdDown
        exp_alerts: []
      - eval_time: 7m
        alertname: FaasSecretdDown
        exp_alerts:
          - exp_labels:
              job: secretd
              instance: 127.0.0.1:9114
              severity: page
              component: secretd
              family: secretd
            exp_annotations:
              summary: "secretd is not answering on the control plane"
              description: "Prometheus has not scraped secretd for 2 minutes. Compute nodes that open runtime secrets through secretd (faas_vmmd_secretd_open) cannot wake or cold-boot apps with secrets until it is back. `systemctl status faas-secretd`, then `journalctl -u faas-secretd -n 200`."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/secretd.md#alerts"
