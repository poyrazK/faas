# Prometheus alert rules — native managed PostgreSQL database nodes
# (ADR-1027).
#
# Companion to faas.rules.yml. Control-plane Prometheus scrapes every
# database node from the manifest's list (jobs node-database,
# vmmd-database, pgproxyd, dbbackupd; label `node` is the manifest host
# name). Host disk, memory and clock alerts in faas.rules.yml cover
# node-database too. No series carries a database or account id.
#
# Severity follows ADR-1236: only a database node unable to serve pages;
# archive and wake trends are warn, reviewed daily.
#
# Runbook: docs/runbooks/FaasDatabaseNodes.md.

groups:
  - name: faas_database_nodes
    interval: 30s
    rules:
      # pgproxyd is the only way into the node's databases; without vmmd
      # nothing on the node wakes, boots or parks.
      - alert: FaasDatabaseNodeDaemonDown
        expr: up{job=~"pgproxyd|vmmd-database"} == 0
        for: 2m
        labels:
          severity: page
          component: database-node
          family: database_nodes
        annotations:
          summary: "{{ $labels.job }} on database node {{ $labels.node }} is down"
          description: "Control-plane Prometheus cannot scrape {{ $labels.job }} on {{ $labels.node }}. Every database on the node is unreachable (pgproxyd) or cannot wake (vmmd) until it recovers; production-class databases fail over to their standbys once the node stops answering schedd."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      # vmmd's archive_command fails while dbbackupd is down, so WAL
      # accumulates in each database's volume instead of leaving the node.
      - alert: FaasDatabaseArchiveKeeperDown
        expr: up{job="dbbackupd"} == 0
        for: 10m
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "dbbackupd on database node {{ $labels.node }} is down"
          description: "Databases on {{ $labels.node }} cannot archive WAL or take base backups; point-in-time restore stops advancing and WAL fills their volumes until dbbackupd returns."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      # The off-node recovery point: a node lost now loses every commit
      # still only on it.
      - alert: FaasDatabaseArchiveOffNodeStale
        expr: dbarchive_pending_oldest_seconds{job="dbbackupd"} > 900
        for: 10m
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "Database node {{ $labels.node }} has not shipped its archive for {{ $value | humanizeDuration }}"
          description: "The oldest archive file on {{ $labels.node }} that is not yet in the bucket is older than 15 minutes. Losing the node now would lose those commits; check dbbackupd's upload errors and the bucket's reachability."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      # The off-site mirror's recovery point; the bucket's alert above is
      # the one that guards against losing the node.
      - alert: FaasDatabaseArchiveOffsiteStale
        expr: dbarchive_offsite_pending_oldest_seconds{job="dbbackupd"} > 3600
        for: 30m
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "Database node {{ $labels.node }} has not mirrored its archive off-site for {{ $value | humanizeDuration }}"
          description: "The oldest archive change on {{ $labels.node }} not yet in the off-site mirror is over an hour old. The bucket is unaffected; losing it now would lose what the mirror lacks. Check dbbackupd's off-site errors and the mirror's reachability."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      # Pruning runs hourly; two failed passes leave the archive growing.
      - alert: FaasDatabaseArchivePruneFailing
        expr: increase(dbarchive_prune_errors_total{job="dbbackupd"}[3h]) >= 2
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "dbbackupd on {{ $labels.node }} keeps failing to prune its archive"
          description: "At least two prune passes failed in the last 3 hours. The local archive and the bucket keep files past their retention, and the node's archive disk fills."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      # 57P03 is what a client sees when its database could not be woken.
      - alert: FaasDatabaseWakeRefusals
        expr: |
          sum by (node) (rate(pgproxyd_sessions_total{result="57P03"}[10m]))
            / sum by (node) (rate(pgproxyd_sessions_total{result=~"ok|57P03"}[10m])) > 0.2
          and sum by (node) (increase(pgproxyd_sessions_total{result="57P03"}[10m])) >= 5
        for: 10m
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "Database node {{ $labels.node }} refuses {{ $value | humanizePercentage }} of authenticated sessions as unavailable"
          description: "pgproxyd answered more than 20% of authenticated sessions on {{ $labels.node }} with 57P03 (the database is starting or unavailable) for 10 minutes. Check schedd's database scheduler and the node's vmmd for failed or queued wakes."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseWakeSlow
        expr: histogram_quantile(0.95, sum by (node, le) (rate(pgproxyd_wake_seconds_bucket[15m]))) > 5
        for: 15m
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "Database wakes on {{ $labels.node }} take {{ $value | humanizeDuration }} at p95"
          description: "The 95th percentile from an authenticated client to a running database on {{ $labels.node }} has exceeded 5 seconds for 15 minutes. Usual causes are boot slots or the RAM ceiling queueing wakes, no spare VMs, or a slow volume."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      # Clients verify pgproxyd's *.<host_suffix> certificate: once it
      # expires, no client reaches any database on the node. pgproxyd
      # reloads a renewal in place, so these clear on the next check.
      - alert: FaasDatabaseProxyCertExpiring
        expr: min by (node) (pgproxyd_tls_cert_expiry_seconds) < 14 * 86400
        for: 1h
        labels:
          severity: warn
          component: database-node
          family: database_nodes
        annotations:
          summary: "pgproxyd's certificate on {{ $labels.node }} expires in {{ $value | humanizeDuration }}"
          description: "The public certificate pgproxyd serves on {{ $labels.node }} expires within 14 days. Renew it and install the new chain and key (pgproxyd_tls_cert_src / pgproxyd_tls_key_src); pgproxyd reloads them without a restart."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseProxyCertExpiryImminent
        expr: min by (node) (pgproxyd_tls_cert_expiry_seconds) < 3 * 86400
        for: 10m
        labels:
          severity: page
          component: database-node
          family: database_nodes
        annotations:
          summary: "pgproxyd's certificate on {{ $labels.node }} expires in {{ $value | humanizeDuration }}"
          description: "The public certificate pgproxyd serves on {{ $labels.node }} expires within 72 hours; after that every client connection to the node's databases fails verification."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

  # schedd's database scheduler. Every replica reports the whole catalog
  # (max) and counts only its own events (sum).
  - name: faas_database_scheduler
    interval: 30s
    rules:
      # A production-class database without a synchronized standby commits
      # alone: it cannot fail over. Seeding a large standby takes minutes.
      - alert: FaasDatabaseStandbyMissing
        expr: max(schedd_database_standbys{state="running",status=~"unsynced|none"}) > 0
        for: 30m
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "{{ $value }} running production-class databases have no synchronized standby"
          description: "For 30 minutes at least one running replicated database has had no promotable standby: its standby keeps failing to attach, or no other node has room for one. Until one attaches, losing its node means a restore from the archive instead of a failover."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseFailedOver
        # A planned switchover (a draining node's evacuation) is no incident.
        expr: sum(increase(schedd_database_failovers_total{result="ok",trigger!="switchover"}[15m])) > 0
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "Production-class databases failed over to their standbys"
          description: "schedd promoted at least one standby in the last 15 minutes (trigger lost_node, running or parked). The old primary's node needs investigation, and each failed-over database runs without a standby until a new one attaches."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseFailoverFailed
        expr: sum(increase(schedd_database_failovers_total{result="failed",trigger!="switchover"}[15m])) > 0
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "A database failover failed"
          description: "schedd tried to promote a standby in the last 15 minutes and failed; the database stays on its silent node and schedd retries. Read schedd's dbsched failover errors."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseNodeVolumeNearFull
        expr: max by (node) (schedd_database_node_volume_bytes / schedd_database_node_volume_capacity_bytes) > 0.9
        for: 30m
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "Database node {{ $labels.node }} has committed {{ $value | humanizePercentage }} of its volume capacity"
          description: "Databases, standbys and incoming moves on {{ $labels.node }} have reserved over 90% of its volume_capacity_bytes. New databases, storage growth and standbys go elsewhere or fail with no capacity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseStorageReadOnly
        expr: max(schedd_database_storage{level="read_only"}) > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "{{ $value }} native database(s) read-only, short of storage"
          description: "The storage guard turned these primaries read-only before their volumes filled; their apps' writes fail with SQLSTATE 25006. schedd logs each database_id ('database is read-only, short of storage'). The customer frees space or grows storage; the guard turns the database writable again on its own."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseStandbyStorageLow
        expr: max(schedd_database_storage{level="standby_low"}) > 0
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "{{ $value }} native database standby(s) short of storage while their primary is not"
          description: "A standby normally has more room than its primary, which turns read-only first. These hold data their primary does not, usually WAL their restartpoints kept, and will fill first; a full standby stops replaying and the database loses its failover. schedd logs each database_id ('standby is short of storage'). Restart the database in place (runbook)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseStaleVMs
        expr: max(schedd_database_stale_vms) > 0
        for: 24h
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "{{ $value }} native database(s) still on an outdated base after a day"
          description: "Database VMs survive vmmd restarts, so a release's PostgreSQL minor, guest-init or launch changes reach a running database only when it restarts. schedd restarts idle always-on databases on its own; these stayed busy, or are scale-to-zero databases that never went idle. Restart them in place: gregalectl database-nodes restart (runbook)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseRestoreDrillStale
        expr: time() - max by (node) (schedd_database_restore_drill_last_ok_timestamp_seconds) > 2 * 86400
        for: 2h
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "No restore drill has passed on database node {{ $labels.node }} for two days"
          description: "schedd restores one of each node's databases from its backups every day into a throwaway database. None has passed on {{ $labels.node }} for two days, so nothing proves its databases restore. Look for failed or skipped drills in schedd's log."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseRestoreDrillFailed
        expr: sum(increase(schedd_database_restore_drills_total{result="failed"}[1d])) > 0
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "A database restore drill failed"
          description: "A daily restore drill could not restore a database from its node's backups in the last day. The same restore serves customers' point-in-time restores and node-loss recovery."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseUpgradeFailed
        expr: sum(increase(schedd_database_upgrades_total{result="failed"}[1h])) > 0
        labels:
          severity: page
          component: schedd
          family: database_nodes
        annotations:
          summary: "An in-place PostgreSQL major upgrade failed"
          description: "At least one major upgrade failed in the last hour. The database is failed with last_error upgrade_failed and stays down until it is restored to a point before the upgrade, which recovers on its old major."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"

      - alert: FaasDatabaseMoveFailed
        expr: sum(increase(schedd_database_moves_total{result="failed"}[1h])) > 0
        labels:
          severity: warn
          component: schedd
          family: database_nodes
        annotations:
          summary: "A database move between nodes failed"
          description: "At least one move failed in the last hour. The database stays on its node, woken again if it was running, with last_error move_failed; evacuation retries it on a later sweep."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDatabaseNodes.md"
