# ADR-20261029180000: meterd billing pipeline and Polar webhook alerts.
rule_files:
  - faas.rules.yml
evaluation_interval: 30s
tests:
  - name: a record stuck past 30 minutes fires; healthy ticks stay quiet
    interval: 1m
    input_series:
      # Healthy ticks read 60-120 s, then one minute stays unrecorded.
      - series: meterd_usage_final_lag_seconds{job="meterd",instance="cp"}
        values: 90x29 120+60x90
    alert_rule_test:
      - eval_time: 29m
        alertname: FaasMeterdUsageDeliveryStalled
        exp_alerts: []
      - eval_time: 85m
        alertname: FaasMeterdUsageDeliveryStalled
        exp_alerts: []
      - eval_time: 95m
        alertname: FaasMeterdUsageDeliveryStalled
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: billing_delivery
              public_status: internal
              job: meterd
              instance: cp
            exp_annotations:
              summary: meterd holds back usage older than 30 minutes
              description: "The oldest closed minute of meterd's 72 h catch-up window that is not recorded compute-complete is 1h 7m 0s old. The provider pusher delivers usage only for hours before that minute, so every account's usage waits and cost reports lose coverage (ADR-1162, ADR-20261029180000). A new environment shows this until its first catch-up finishes, about five hours."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/MeterdBillingPipeline.md
  - name: three failed Polar webhook answers in 30 minutes fire
    interval: 1m
    input_series:
      - series: apid_ops_total{job="apid",instance="cp",op="polar_webhook",code="ok"}
        values: 0+1x60
      - series: apid_ops_total{job="apid",instance="cp",op="polar_webhook",code="unavailable"}
        values: 0x10 1x10 2x10 3x30
      - series: apid_ops_total{job="apid",instance="cp",op="polar_webhook",code="rejected"}
        values: 0x60
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasPolarWebhookFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: FaasPolarWebhookFailing
        exp_alerts:
          - exp_labels:
              severity: warn
              component: apid
              family: billing_webhooks
              public_status: internal
            exp_annotations:
              summary: apid answered 3 Polar webhooks with an error in 30 minutes
              description: "Polar disables a webhook endpoint after ten consecutive non-2xx deliveries. rejected means a bad signature or body (check the webhook secret); unavailable means apid could not apply the event. Reconciliation repairs subscription state every 30 minutes, but invoices and refunds arrive only by webhook."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/PolarBillingWebhooks.md
  - name: sample ticks failing for 15 minutes fire; one failure does not
    interval: 1m
    input_series:
      - series: meterd_ops_total{job="meterd",instance="cp",op="sample",code="err"}
        values: 0x10 1x20 1+1x40
    alert_rule_test:
      - eval_time: 30m
        alertname: FaasMeterdSampleFailing
        exp_alerts: []
      - eval_time: 55m
        alertname: FaasMeterdSampleFailing
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: billing_delivery
              public_status: internal
              job: meterd
              instance: cp
              op: sample
              code: err
            exp_annotations:
              summary: meterd sample ticks keep failing
              description: "At least five of meterd's one-minute sample ticks failed in 15 minutes, for 15 minutes. Usage rows, price capture or the compute-complete record are not being written; catch-up re-rolls the minutes once the cause clears, within 72 h."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/MeterdBillingPipeline.md
  # ADR-20261103121407: ledger dual-run drift and held usage near the lookback.
  - name: ledger drift for two hours fires; a match does not
    interval: 1m
    input_series:
      - series: meterd_financial_ledger_reconcile_accounts{job="meterd",instance="cp",month="previous",result="drift"}
        values: 0x30 2x150
      - series: meterd_financial_ledger_reconcile_accounts{job="meterd",instance="cp",month="previous",result="match"}
        values: 40x180
    alert_rule_test:
      - eval_time: 140m
        alertname: FaasMeterdLedgerDrift
        exp_alerts: []
      - eval_time: 160m
        alertname: FaasMeterdLedgerDrift
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: billing_delivery
              public_status: internal
              month: previous
              result: drift
            exp_annotations:
              summary: "2 accounts' previous month reconcile as drift"
              description: "The financial ledger's net compute and the compute receipts meterd delivered disagree (drift) or could not be compared (failed) for the previous UTC month, for two hours (ADR-20261019193600). Customers may be billed differently from the ledger the cost reports use. meterd_financial_ledger_drift_mb_seconds is the summed difference."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/MeterdBillingPipeline.md
  # ADR-20261107105126: egress dual-run drift and usage-source mismatches.
  - name: egress ledger drift for two hours fires
    interval: 1m
    input_series:
      - series: meterd_financial_ledger_egress_reconcile_accounts{job="meterd",instance="cp",month="current",result="failed"}
        values: 0x30 1x150
      - series: meterd_financial_ledger_egress_reconcile_accounts{job="meterd",instance="cp",month="current",result="match"}
        values: 12x180
    alert_rule_test:
      - eval_time: 140m
        alertname: FaasMeterdLedgerEgressDrift
        exp_alerts: []
      - eval_time: 160m
        alertname: FaasMeterdLedgerEgressDrift
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: billing_delivery
              public_status: internal
              month: current
              result: failed
            exp_annotations:
              summary: "1 accounts' current month egress reconciles as failed"
              description: "The egress the financial ledger bills, by the egress hour rules, and the egress receipts meterd settled disagree (drift) or could not be compared (failed) for the current UTC month, for two hours (ADR-20261107105126). meterd_financial_ledger_egress_drift_bytes is the summed difference."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/MeterdBillingPipeline.md
  - name: a usage-source mismatch fires for the hour after it
    interval: 1m
    input_series:
      - series: meterd_billing_usage_source_mismatch_windows_total{job="meterd",instance="cp",meter="compute",source="ledger_shadow"}
        values: 0x60 1x120
    alert_rule_test:
      - eval_time: 50m
        alertname: FaasMeterdBillingUsageSourceMismatch
        exp_alerts: []
      - eval_time: 90m
        alertname: FaasMeterdBillingUsageSourceMismatch
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: billing_delivery
              public_status: internal
              meter: compute
              source: ledger_shadow
            exp_annotations:
              summary: "Delivered compute hours had different usage_minutes and ledger quantities (billing from ledger_shadow)"
              description: "meterd compared the usage_minutes and financial-ledger quantities of the hours it delivered in the last hour and some differed (ADR-20261107105126). The hour was billed from the source in the source label. Both are written in one transaction, so a difference is a bug or an operator ledger correction; meterd logs each one as 'billing usage sources disagree'."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/MeterdBillingPipeline.md
      - eval_time: 180m
        alertname: FaasMeterdBillingUsageSourceMismatch
        exp_alerts: []
  - name: held usage about to leave the lookback fires after an hour
    interval: 1m
    input_series:
      - series: meterd_billing_usage_held_expiring_windows{job="meterd",instance="cp",meter="compute",reason="suspended"}
        values: 0x10 3x80
      - series: meterd_billing_usage_held_expiring_windows{job="meterd",instance="cp",meter="compute",reason="identity_incomplete"}
        values: 0x90
    alert_rule_test:
      - eval_time: 60m
        alertname: FaasMeterdHeldUsageExpiring
        exp_alerts: []
      - eval_time: 80m
        alertname: FaasMeterdHeldUsageExpiring
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: billing_delivery
              public_status: internal
              meter: compute
              reason: suspended
            exp_annotations:
              summary: "3 held compute usage hours leave the billing lookback within 72 h (suspended)"
              description: "meterd holds usage back while its subject is suspended, being deleted, has no complete billing identity or is unknown, and retries it every pass, but only within the billing lookback. These hours fall out of it within 72 hours and are then never billed (ADR-20261103121407). Clear the reason (reactivate, finish checkout) or accept the loss."
              runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/MeterdBillingPipeline.md
