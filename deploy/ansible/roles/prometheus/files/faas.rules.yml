# Prometheus alert rules — spec §12 SLO thresholds (faas_implementation_spec.md:412-424).
#
# Severity convention:
#   info  → no notify; surfaces in Prometheus UI / Grafana only.
#   warn  → ticket-only email via the alertmanager `faas-warn` route.
#   page  → operator email + Pushover via the `faas-page` route.
#
# Runbook URLs point at the concrete operator procedures under
# docs/runbooks/. Keep alert names and runbook links synchronized when
# adding a new platform signal.
#
# Metric names are the ones the daemons actually emit (verified against
# pkg/wire/metrics.go, pkg/gateway/metrics.go, pkg/fcvm/metrics.go,
# pkg/builderd/builderd.go after PR #124 + PR #132). Do not rename
# series here without updating the dashboards / status page first.
#
# Op labels: vmmd emits PascalCase (`op="CreateFromSnapshot"`,
# `op="CreateColdBoot"`) — see pkg/vmmdgrpc/server.go:80,98 and
# pkg/wire/metrics_test.go:46. PromQL label regex matchers are
# implicitly anchored, so the regex MUST match the case exactly.

groups:
  # ADR-387: source discovery health is separate from approved-intent/runtime
  # convergence. Counts come from one durable fleet observation per scrape;
  # max avoids counting the same sources again on every apid replica.
  - name: faas_environment_git_sources
    interval: 30s
    rules:
      - alert: FaasEnvironmentGitSourcePollingStalled
        expr: |
          max by (job) (
            apid_environment_git_sources{condition="poll_stale"}
            and on (job, instance) (apid_environment_git_source_health_up == 1)
            and on (job, instance) (apid_environment_git_source_polling_enabled == 1)
          ) > 0
        for: 5m
        labels:
          severity: warn
          component: apid
          family: environment_git_sources
          public_status: internal
        annotations:
          summary: "Environment Git source checks have stalled"
          description: "At least one active environment has gone ten minutes without a completed Git check. Inspect the durable poll leases and apid polling configuration. The last approved definition remains authoritative."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEnvironmentGitSourceHealth.md"

      - alert: FaasEnvironmentGitSourceVerificationStale
        expr: |
          max by (job) (
            apid_environment_git_sources{condition="verification_stale"}
            and on (job, instance) (apid_environment_git_source_health_up == 1)
            and on (job, instance) (apid_environment_git_source_polling_enabled == 1)
          ) > 0
        for: 5m
        labels:
          severity: warn
          component: apid
          family: environment_git_sources
          public_status: internal
        annotations:
          summary: "Environment Git definitions cannot be verified"
          description: "At least one active environment has gone ten minutes without successful Git definition verification. Check repository installation access, Git transport health, and definition validation. A recent failed check does not renew verification."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEnvironmentGitSourceHealth.md"

      - alert: FaasEnvironmentGitSourceHealthUnavailable
        expr: |
          max by (job) (
            (apid_environment_git_source_polling_enabled == 1)
            unless on (job, instance) (apid_environment_git_source_health_up == 1)
          ) > 0
        for: 5m
        labels:
          severity: warn
          component: apid
          family: environment_git_sources
          public_status: internal
        annotations:
          summary: "Environment Git source health is unavailable"
          description: "An apid replica configured for Git polling cannot read durable source health. Counts and ages are omitted when the bounded database query fails; check PostgreSQL reachability and the GitOps migrations before relying on source freshness."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEnvironmentGitSourceHealth.md"

  - name: faas_commit
    interval: 30s
    rules:
      # Every scheduler reads the same durable source ledger. max avoids
      # counting the same backlog once per scheduler replica.
      - alert: FaasCommitBacklogOverdue
        expr: (time() - max(schedd_commit_relay_oldest_pending_timestamp_seconds) > 900) and (max(schedd_commit_relay_oldest_pending_timestamp_seconds) > 0)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: commit
        annotations:
          summary: "Committed outbox work has waited more than fifteen minutes"
          description: "A fresh source observation contains an unaccepted row older than fifteen minutes. Inspect Commit source health, blocked events and Operations capacity. Age is measured from insertion, not transaction commit."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommit.md"
      - alert: FaasCommitBlockedEvents
        expr: max(schedd_commit_relay_blocked_events) > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: commit
        annotations:
          summary: "Committed outbox events require repair"
          description: "Fresh source observations contain blocked events. Inspect their stable reason codes, correct unaccepted rows and request replay with the same event IDs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommit.md"
      - alert: FaasCommitSourceObservationUnknown
        expr: max(schedd_commit_relay_unknown_sources) > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: commit
        annotations:
          summary: "Commit source backlog cannot be established"
          description: "An enabled source has no fresh known backlog observation. Check scheduler relay configuration, database access and source diagnostics. Unknown counts must not be treated as an empty queue."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommit.md"
      - alert: FaasCommitRelaySourceFailure
        expr: max(schedd_commit_relay_failing_sources) > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: commit
        annotations:
          summary: "Commit relay source recovery is pending"
          description: "A fresh source observation reports a relay failure. Inspect the source health code and recover database access, schema, binding, cleanup or downstream acceptance without deleting pending events."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommit.md"
      - alert: FaasCommitObservationUnavailable
        expr: max(schedd_commit_relay_observation_snapshot_success) == 0
        for: 2m
        labels:
          severity: warn
          component: schedd
          family: commit
        annotations:
          summary: "Commit relay observations are unavailable"
          description: "No reporting scheduler can read the shared Commit health ledger. Check the platform PostgreSQL connection and scheduler health; backlog totals are unavailable."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommit.md"
  - name: faas_realtime_callbacks
    interval: 30s
    rules:
      - alert: FaasRealtimeCallbackReplayStalled
        expr: realtimed_callback_replay_ready > 0 and increase(realtimed_callback_replay_attempts_total[5m]) == 0
        for: 5m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback replay has stalled"
          description: "The node has callbacks eligible for replay but no replay attempts in the last five minutes. Check the replay supervisor, realtimed logs, and outbox disk health."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackReplayRestarting
        expr: increase(realtimed_callback_replay_supervisor_restarts_total[15m]) >= 3
        for: 5m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback replay keeps restarting"
          description: "The node restarted its callback replay loop at least three times in the last 15 minutes. Inspect realtimed logs and local outbox storage health."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackOutboxNearCapacity
        expr: realtimed_callback_pending_capacity_bytes > 0 and (realtimed_callback_pending_bytes / realtimed_callback_pending_capacity_bytes) > 0.8
        for: 5m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback outbox is near capacity"
          description: "Pending callbacks use more than 80% of this node's outbox capacity. Restore callback delivery so the durable queue can drain before it stops accepting new records."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackOutboxFull
        expr: increase(realtimed_callback_outbox_full_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback event could not be persisted"
          description: "The node rejected a callback event because its durable outbox remained full until the admission deadline. A live WebSocket was closed with code 1013 when a message event was rejected."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackOutboxAdmissionFailed
        expr: increase(realtimed_callback_outbox_admission_errors_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback could not be saved to the outbox"
          description: "The node failed to admit a callback to its durable outbox for a reason other than capacity exhaustion. Check local storage health and permissions; a live WebSocket is closed with code 1013 when its message cannot be saved."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackUnpersisted
        expr: increase(realtimed_callback_unpersisted_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback failed without durable persistence"
          description: "A message or disconnect callback failed while no durable outbox was configured. Message failures close the live WebSocket with code 1013. Configure a durable outbox for production callback delivery."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackDeadLettersPresent
        expr: realtimed_callback_dead_letters > 0
        for: 5m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback dead letters need review"
          description: "The node retains {{ $value }} callback dead-letter file(s). Inspect the callback failure and preserve records needed for investigation or replay."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackDeadLettersNearCapacity
        expr: realtimed_callback_dead_letter_bytes / realtimed_callback_dead_letter_capacity_bytes > 0.8
        for: 5m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback dead-letter storage is near capacity"
          description: "Retained callback dead letters exceed 80% of the node's configured byte limit. Inspect failed callbacks and preserve any records needed for replay before retention evicts the oldest files."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

      - alert: FaasRealtimeCallbackDeadLettersEvicted
        expr: time() - realtimed_callback_dead_letter_last_eviction_timestamp_seconds < 3600
        for: 0m
        labels:
          severity: warn
          component: realtimed
          family: realtime_callbacks
        annotations:
          summary: "Realtime callback dead letters were evicted"
          description: "The node evicted dead-letter files to enforce its byte limit, including any excess found at daemon startup. Inspect callback failures and available records."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"
  - name: request_id_journal
    interval: 30s
    rules:
      - alert: FaasRequestIDJournalWriteFailures
        expr: sum(rate(gateway_request_id_journal_write_total{result="failed"}[5m])) > (1 / 60)
        for: 2m
        labels:
          severity: warn
          component: gatewayd-internal
          family: request_id_journal
        annotations:
          summary: "Exact request-ID journal writes are failing"
          description: "The gateway's mandatory pre-proxy request-ID journal has failed above 1 write per minute for 2 minutes. Affected requests are rejected with 503 before guest execution; check the apid private gRPC path and Postgres write health."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRequestIDJournalWriteFailures.md"

  - name: outbound_webhook_delivery
    interval: 30s
    rules:
      - alert: FaasWebhookDeliveryQueueOverdue
        expr: schedd_webhook_delivery_oldest_overdue_seconds > 900
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Outbound webhook queue is over 15 minutes behind"
          description: "At least one claimable outbound webhook delivery has remained overdue for over 15 minutes. Inspect schedd dispatch and database health; receiver-held work has a separate alert."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookDeliveryHeldBacklog
        expr: schedd_webhook_delivery_held_due_count > 0 and schedd_webhook_delivery_oldest_held_due_seconds > 3600
        for: 10m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Outbound webhook deliveries have been held for over an hour"
          description: "Due deliveries are waiting behind a receiver cooldown or full subscription claim capacity. Inspect receiver health and the affected subscriptions before changing dispatch capacity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookDeliveryDeadSpike
        expr: increase(schedd_webhook_delivery_dead_total[10m]) > 20
        for: 2m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Outbound webhook deliveries are entering the dead-letter queue"
          description: "More than 20 outbound webhook deliveries were marked dead in ten minutes. Check receiver failures and host signing identity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookDeliveryHealthPollFailed
        expr: schedd_webhook_delivery_health_poll_success == 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Outbound webhook queue health cannot be read"
          description: "Schedd's queue health poll is failing, so the overdue-age signal may be stale. Check database connectivity and schedd logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookEventOutboxRelayFailed
        expr: schedd_webhook_event_outbox_relay_success == 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Transactional webhook events are not reaching the delivery ledger"
          description: "Schedd could not reconcile a ready app wake or drained app park, or relay a transactional webhook event. Pending source records remain durable until recovery."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookEventOutboxBacklog
        expr: schedd_webhook_event_outbox_oldest_pending_seconds > 300
        for: 1m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Transactional webhook event outbox is falling behind"
          description: "The oldest committed webhook event has waited over five minutes to fan out into delivery rows. Check the pending count, relay logs, and database health."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookEventOutboxHealthPollFailed
        expr: schedd_webhook_event_outbox_health_poll_success == 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Transactional webhook event outbox health cannot be read"
          description: "Schedd's event outbox backlog poll is failing, so its pending-age metrics may be stale. Check database connectivity and schedd logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasAppLifecycleTransitionStalled
        expr: schedd_app_lifecycle_transition_oldest_pending_seconds > 300
        for: 1m
        labels:
          severity: warn
          component: schedd
          family: app_lifecycle
        annotations:
          summary: "App {{ $labels.kind }} lifecycle transition is stalled"
          description: "A durable app {{ $labels.kind }} transition has remained incomplete for over five minutes. Check the pending transition rows, lifecycle state, and schedd reconciliation logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasAppLifecycleTransitionHealthPollFailed
        expr: schedd_app_lifecycle_transition_health_poll_success == 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: app_lifecycle
        annotations:
          summary: "App lifecycle transition health cannot be read"
          description: "Schedd's pending wake and park transition poll is failing, so the transition age metrics may be stale. Check database connectivity and schedd logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookDeliveryRetentionFailed
        expr: schedd_webhook_delivery_retention_success == 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Outbound webhook delivery retention is failing"
          description: "The last cleanup or storage-size poll failed. Check schedd's webhook retention log and database connectivity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

      - alert: FaasWebhookDeliveryStorageLarge
        expr: schedd_webhook_delivery_storage_bytes > 5368709120
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: outbound_webhooks
        annotations:
          summary: "Outbound webhook delivery storage exceeds 5 GiB"
          description: "The delivery ledger and attempt history together exceed 5 GiB. Check cleanup progress, active backlog, and table bloat."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWebhookDelivery.md"

  - name: faas_consumer_usage_delivery
    interval: 30s
    rules:
      - alert: FaasConsumerUsageOutboxAppendFailed
        expr: increase(gateway_consumer_usage_outbox_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          component: gatewayd-internal
          family: consumer_usage_delivery
        annotations:
          summary: "Financial usage event could not be journaled"
          description: "The gateway served a request whose usage fact could not be appended to its local durable outbox. Preserve the spool and inspect disk health and capacity before trusting usage totals."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasConsumerUsageDelivery.md"

      - alert: FaasUsageCommitAborted
        expr: increase(gateway_usage_commit_aborts_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          component: gatewayd-internal
          family: consumer_usage_delivery
        annotations:
          summary: "Monetized responses withheld: usage could not be made durable"
          description: "The gateway aborted billable responses because their usage events could not be fsynced to the local outbox (ADR-1505). Clients saw failed requests. Check outbox capacity and disk health; readiness should already be draining the node."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasConsumerUsageDelivery.md"

      - alert: FaasConsumerUsageOutboxNearCapacity
        expr: gateway_consumer_usage_outbox_pending_bytes > 53687091
        for: 2m
        labels:
          severity: page
          component: gatewayd-internal
          family: consumer_usage_delivery
        annotations:
          summary: "Financial usage outbox is near capacity"
          description: "The gateway has more than 80% of its 64 MiB durable usage outbox pending. It will leave rotation at 90%; restore apid delivery before the journal fills."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasConsumerUsageDelivery.md"

      - alert: FaasConsumerUsageDeliveryStalled
        expr: gateway_consumer_usage_outbox_pending_records > 0 and increase(gateway_consumer_usage_delivered_total[10m]) == 0
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: consumer_usage_delivery
        annotations:
          summary: "Financial usage delivery has stalled"
          description: "Unacknowledged usage events remain on the gateway but apid has accepted none for at least ten minutes. Check the private gRPC listener, database writes, and delivery-failure counter."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasConsumerUsageDelivery.md"

  - name: durable_background_workers
    interval: 30s
    rules:
      - alert: FaasManagedRealtimeDrainClaimFailed
        expr: increase(apid_ops_total{op="managed_realtime_drain_claim",code="err"}[5m]) > 0
        for: 2m
        labels:
          severity: warn
          component: apid
          family: durable_background_workers
          public_status: degraded
        annotations:
          summary: "Managed realtime drain operations cannot be claimed"
          description: "Apid is failing to claim durable managed realtime drain operations. Customer drain requests can remain running and live connections may not close until the claimer recovers."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableBackgroundWorkers.md"

      - alert: FaasJobImageMaterializationClaimFailed
        expr: imaged_ops_total{op="job_materialization_claim",code="err"} > 0
        for: 2m
        labels:
          severity: warn
          component: imaged
          family: durable_background_workers
          public_status: degraded
        annotations:
          summary: "Pending job images cannot be reclaimed"
          description: "Imaged failed its pending job image claim pass. Jobs whose notification was missed can remain pending and cannot dispatch until imaged successfully reconciles them."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableBackgroundWorkers.md"

      - alert: FaasUsageDailyRollupFailed
        expr: increase(meterd_ops_total{op="usage_daily_rollup",code="err"}[15m]) > 0
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: durable_background_workers
          public_status: degraded
        annotations:
          summary: "Daily usage rollup is failing"
          description: "Meterd cannot refresh usage_daily. Raw usage and provider billing remain authoritative, but daily customer usage and daily cost alerts are stale until the rollup succeeds."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableBackgroundWorkers.md"

  - name: faas_safe_release
    interval: 15s
    rules:
      - alert: FaasSafeReleaseWorkerLeaseStale
        expr: faas_safe_release_worker_lease_ready == 0 and on(job, instance) faas_safe_release_worker_lease_check_success == 1 and on(job, instance) faas_safe_release_serving_canaries == 0
        for: 2m
        labels:
          severity: warn
          component: apid
          family: safe_release
          public_status: degraded
        annotations:
          summary: "Safe Deploy worker lease is stale"
          description: "APID can reach Postgres but meterd's Safe Deploy lease is absent or expired. New canaries are rejected. Check meterd release ticks and APID operator probes before re-enabling rollouts."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"

      - alert: FaasSafeReleaseServingCanaryAtRisk
        expr: (faas_safe_release_worker_lease_ready == 0 or faas_safe_release_worker_lease_check_success == 0) and on(job, instance) faas_safe_release_serving_canaries > 0
        for: 30s
        labels:
          severity: warn
          component: apid
          family: safe_release
          public_status: degraded
        annotations:
          summary: "Serving canary has no healthy Safe Deploy worker lease"
          description: "APID sees a canary serving traffic while the worker lease is stale or unreadable. Emergency abort starts after the restart grace; inspect the rollout, predecessor, and APID recovery outcome now."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"

      - alert: FaasSafeReleaseLeaseObservationStalled
        expr: time() - faas_safe_release_worker_lease_last_check_timestamp_seconds > 90
        for: 1m
        labels:
          severity: warn
          component: apid
          family: safe_release
        annotations:
          summary: "APID has not observed the Safe Deploy worker lease recently"
          description: "The lease health poll has not succeeded for over 90 seconds. Check APID's database access and background recovery loop; the last readiness value is not trustworthy."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"

      - alert: FaasSafeReleaseEmergencyAbort
        expr: increase(faas_safe_release_emergency_abort_total{outcome="aborted"}[5m]) > 0 or (faas_safe_release_emergency_abort_total{outcome="aborted"} > 0 unless faas_safe_release_emergency_abort_total{outcome="aborted"} offset 5m)
        for: 0m
        labels:
          severity: warn
          component: apid
          family: safe_release
          public_status: degraded
        annotations:
          summary: "APID aborted a serving canary after worker lease expiry"
          description: "APID restored the serving predecessor after the Safe Deploy worker lease remained expired past its grace period. Confirm gateway traffic, audit actor, and meterd recovery before deploying again."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"

      - alert: FaasSafeReleaseEmergencyRecoveryFailed
        expr: increase(faas_safe_release_emergency_abort_total{outcome=~"failed|sweep_failed"}[5m]) > 0 or (faas_safe_release_emergency_abort_total{outcome=~"failed|sweep_failed"} > 0 unless faas_safe_release_emergency_abort_total{outcome=~"failed|sweep_failed"} offset 5m)
        for: 0m
        labels:
          severity: page
          component: apid
          family: safe_release
          public_status: degraded
        annotations:
          summary: "APID emergency canary recovery failed"
          description: "APID could not complete a Safe Deploy emergency sweep or abort. Inspect the active canary and recover traffic manually if its predecessor is still serving."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"

  - name: managed_realtime_channel_routing
    interval: 30s
    rules:
      - alert: FaasManagedRealtimeChannelRouteFallbackHigh
        expr: |
          (
            sum by (decision) (
              rate(apid_realtime_channel_route_publish_decisions_total{
                decision=~"route_store_unavailable|directory_error|overflow|unready_fallback"
              }[10m])
            )
            /
            clamp_min(
              sum(rate(apid_realtime_channel_route_publish_decisions_total{
                decision=~"route_store_unavailable|directory_error|overflow|unready_fallback|targeted|no_subscribers"
              }[10m])),
              0.001
            )
          ) > 0.25
          and on() (
            sum(increase(apid_realtime_channel_route_publish_decisions_total{
              decision=~"route_store_unavailable|directory_error|overflow|unready_fallback|targeted|no_subscribers"
            }[10m])) >= 100
          )
        for: 5m
        labels:
          severity: warn
          component: apid
          family: managed_realtime_channel_routing
        annotations:
          summary: "Managed realtime publishes are falling back to broad fanout"
          description: "The {{ $labels.decision }} decision accounts for more than 25% of at least 100 enabled route decisions in each ten-minute window for five minutes. This increases publish work across the compute fleet."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedRealtimeChannelRouting.md"

      - alert: FaasManagedRealtimeChannelRouteRebuildUnsuccessful
        expr: |
          sum(increase(apid_realtime_channel_route_rebuild_checks_total{outcome="error"}[30m]))
          +
          sum(increase(apid_realtime_channel_route_reconcile_passes_total{outcome=~"incomplete|error"}[30m]))
          >= 2
        for: 5m
        labels:
          severity: warn
          component: apid
          family: managed_realtime_channel_routing
        annotations:
          summary: "Managed realtime route overflow repair is repeatedly unsuccessful"
          description: "Apid has recorded at least two route rebuild start errors or incomplete/failed reconciliation passes in thirty minutes. Overflowed channels remain on full broadcast until repair succeeds."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedRealtimeChannelRouting.md"

  - name: account_lifecycle
    interval: 30s
    rules:
      - alert: FaasInactiveAccountHasLiveInstance
        expr: increase(schedd_account_lifecycle_violations_total[10m]) > 0
        for: 1m
        labels:
          severity: warn
          component: schedd
          family: account_lifecycle
          public_status: internal
        annotations:
          summary: "A non-active account retained live compute"
          description: "Schedd found and repaired a live or waking instance owned by a suspended or deletion-pending account. Verify all scheduler admission producers enforce Account.Active and confirm no additional instances remain resident."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInactiveAccountHasLiveInstance.md"

  - name: postgres_capacity
    interval: 30s
    rules:
      - alert: FaasPostgresConnectionsHigh
        expr: max(faas_postgres_client_connections) / clamp_min(max(faas_postgres_ordinary_connection_capacity), 1) > 0.75
        for: 10m
        labels:
          severity: warn
          component: postgres
          family: database_capacity
        annotations:
          summary: "PostgreSQL ordinary connection use is above 75%"
          description: "Daemon sessions have consumed more than 75% of PostgreSQL's ordinary-client capacity for 10m. Identify oversized pools by application_name and recover headroom before rollouts or bursts exhaust the remaining slots."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresConnectionsHigh.md"

      - alert: FaasPostgresConnectionsCritical
        expr: max(faas_postgres_client_connections) / clamp_min(max(faas_postgres_ordinary_connection_capacity), 1) > 0.90
        for: 5m
        labels:
          severity: page
          component: postgres
          family: database_capacity
        annotations:
          summary: "PostgreSQL ordinary connection use is above 90%"
          description: "Daemon sessions have consumed more than 90% of PostgreSQL's ordinary-client capacity for 5m. New API, scheduler, restore, backup, and rollout work can fail when the remaining ordinary slots are exhausted."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresConnectionsHigh.md"

  - name: public_status
    rules:
      - alert: FaasPublicStatusEvaluationStalled
        expr: (apid_status_rollup_last_success_timestamp_seconds == 0 and time() - process_start_time_seconds{job="apid"} > 900) or (apid_status_rollup_last_success_timestamp_seconds > 0 and time() - apid_status_rollup_last_success_timestamp_seconds > 900)
        labels:
          severity: warn
          component: apid
          family: public_status
        annotations:
          summary: "Public status evaluation has not succeeded for 15 minutes"
          description: "The five-minute public status evaluator has not persisted a complete capability bucket set for at least 15 minutes. Check apid logs, Prometheus reachability, and Postgres status_observation_buckets writes."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/StatusPageDegraded.md"

  - name: fleet_seal_domain
    interval: 30s
    rules:
      - alert: FaasFleetSealDomainUnverified
        expr: |
          node_systemd_unit_state{job="node-compute",name="faas-schedd.service",state="active"} == 1
          unless on(instance)
          faas_fleet_seal_domain_ready == 1
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: fleet_seal_domain
        annotations:
          summary: "Compute node has not proved fleet sealed-secret access"
          description: "schedd is active on {{ $labels.instance }}, but the node-join fleet-seal gate did not prove the customer-secret fixture and cluster signing key. Drain the node and repeat the verification before returning it to capacity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFleetSealDomain.md"

      - alert: FaasFleetSigningKIDDiverged
        expr: count(count by (kid) (faas_fleet_cluster_signing_key_info == 1)) > 1
        for: 2m
        labels:
          severity: page
          component: schedd
          family: fleet_seal_domain
        annotations:
          summary: "Compute nodes report different cluster signing kids"
          description: "More than one cluster signing kid is reported by verified fleet nodes. Internal-service JWTs can fail across nodes until every node verifies the current singleton key."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFleetSealDomain.md"

  - name: gcp_ops_agent
    interval: 30s
    rules:
      - alert: FaasGCPOpsAgentMissing
        expr: |
          up{job="node-compute"} == 1
          unless on(instance)
          node_systemd_unit_state{job="node-compute",name="google-cloud-ops-agent.service",state="active"} == 1
        for: 5m
        labels:
          severity: warn
          component: gcp-ops-agent
          family: off_host_telemetry
          public_status: internal
        annotations:
          summary: "A compute node is missing its GCP telemetry collector"
          description: "The compute node is reachable, but google-cloud-ops-agent.service is missing or inactive. Local journal rotation can now remove the only detailed runtime evidence from that host."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGCPOpsAgentMissing.md"

  # Production validation artifacts are bounded to 5 GiB per host. The
  # node-exporter textfile collector provides one series per host, so the
  # instance label identifies the cleanup owner without adding path cardinality.
  - name: faas_canary_artifacts
    interval: 30s
    rules:
      - alert: FaasCanaryArtifactDiskPressure
        expr: faas_canary_artifact_bytes > 5368709120
        for: 15m
        labels:
          severity: warn
          component: host
          family: canary_artifacts
          public_status: internal
        annotations:
          summary: "Validation artifacts exceed the 5 GiB host cap on {{ $labels.instance }}"
          description: "The bounded canary and diagnostic roots have remained above their host cap across multiple hourly-sweeper opportunities. A protected active lease, a live process or unit reference, or repeated deletion error may be preventing cleanup."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCanaryArtifactRetention.md"

      - alert: FaasCanaryArtifactCleanupFailures
        expr: increase(faas_canary_artifact_cleanup_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warn
          component: host
          family: canary_artifacts
          public_status: internal
        annotations:
          summary: "Validation artifact cleanup failed on {{ $labels.instance }}"
          description: "The lifecycle finalizer or periodic sweep could not prove an artifact safe to remove or could not delete it. The artifact was retained. Inspect the sweep journal and its active process/systemd references before retrying."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCanaryArtifactRetention.md"

      - alert: FaasCanaryArtifactRetentionStalled
        expr: faas_canary_artifact_oldest_age_seconds > 108000
        for: 1h
        labels:
          severity: warn
          component: host
          family: canary_artifacts
          public_status: internal
        annotations:
          summary: "A validation artifact is older than 30 hours on {{ $labels.instance }}"
          description: "The oldest declared validation artifact has outlived the 24-hour orphan retention plus multiple sweep windows. Check whether it is intentionally referenced, has a stale active owner record, or is failing cleanup."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCanaryArtifactRetention.md"

      - alert: FaasCanaryArtifactSweepStalled
        expr: (time() - faas_canary_artifact_last_sweep_timestamp_seconds > 7200) or absent(faas_canary_artifact_last_sweep_timestamp_seconds)
        for: 30m
        labels:
          severity: warn
          component: host
          family: canary_artifacts
          public_status: internal
        annotations:
          summary: "The periodic validation artifact sweep is stale on {{ $labels.instance }}"
          description: "No cleanup sweep has completed for more than two hours. Check the systemd timer and service before relying on the byte cap or orphan retention. An alert without an instance means no scraped host has published the collector metric."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCanaryArtifactRetention.md"

  # Compute-host journal pressure (issue #2350). vmmd samples these values
  # once per minute so the existing active-node HTTP-SD job covers every
  # compute host without exposing node_exporter on an additional port.
  - name: faas_host_journal
    interval: 30s
    rules:
      - alert: FaasNetworkdDispatcherErrors
        expr: vmmd_networkd_dispatcher_errors_last_5m > 0
        for: 2m
        labels:
          severity: warn
          component: vmmd
          family: host_journal
          public_status: internal
        annotations:
          summary: "networkd-dispatcher is reporting errors on {{ $labels.node }}"
          description: "networkd-dispatcher has emitted warning-or-higher journal entries for at least two minutes. Expected disappearing Gregale vh<slot> interfaces are filtered before journald, so remaining entries indicate a persistent interface, hook, or networkctl failure."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostJournalPressure.md"

      - alert: FaasHostJournalNearLimit
        expr: vmmd_journal_disk_usage_bytes > 419430400
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: host_journal
          public_status: internal
        annotations:
          summary: "Local journal exceeds 400 MiB on {{ $labels.node }}"
          description: "The persistent and runtime journals have remained above 400 MiB for ten minutes, approaching Gregale's 512 MiB persistent-journal bound. Check noisy units and off-host shipping before rotation removes incident evidence."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostJournalPressure.md"

      - alert: FaasHostJournalGrowingFast
        expr: clamp_min(deriv(vmmd_journal_disk_usage_bytes[30m]), 0) > 34953
        for: 5m
        labels:
          severity: warn
          component: vmmd
          family: host_journal
          public_status: internal
        annotations:
          summary: "Local journal is growing rapidly on {{ $labels.node }}"
          description: "Local journal usage has grown faster than 120 MiB/hour for five minutes. Identify the emitting unit before the bounded journal rotates useful history or creates avoidable off-host ingestion volume."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostJournalPressure.md"

      - alert: FaasHostJournalMetricsDown
        expr: vmmd_host_journal_metrics_up == 0
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: host_journal
          public_status: internal
        annotations:
          summary: "Host journal metrics are unavailable on {{ $labels.node }}"
          description: "vmmd has failed to read networkd-dispatcher errors or local journal disk usage for ten minutes. Check journalctl/du availability and vmmd's privileges before trusting the journal pressure signals."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostJournalPressure.md"

  # ────────────────────────────────────────────────────────────────────
  # Host resource floor (node_exporter). The platform alerts above watch
  # tenant RAM, snapshot budgets and daemon health, but nothing watched the
  # hosts underneath them: a full root filesystem (PostgreSQL data and WAL
  # on the control plane), exhausted host memory, an unsynchronized clock
  # (mTLS validity, the post-restore clock step) or a stopped PostgreSQL
  # stayed silent. The control plane scrapes its own node_exporter as
  # job="node"; compute hosts arrive through HTTP-SD as job="node-compute".
  # Loop devices are excluded because image preparation loop-mounts
  # deliberately tight ext4 images.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_host_resources
    interval: 30s
    rules:
      - alert: FaasHostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
            / node_filesystem_size_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
            < 0.15
        for: 15m
        labels:
          severity: warn
          component: node
          family: host_disk
          public_status: internal
        annotations:
          summary: "{{ $labels.mountpoint }} has less than 15% free space on {{ $labels.instance }}"
          description: "The filesystem has stayed below 15% free for 15 minutes. Identify the growing directory before writes fail; on the control plane the root filesystem holds PostgreSQL data and WAL."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostDiskSpace.md"

      - alert: FaasHostDiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
            / node_filesystem_size_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
            < 0.05
        for: 5m
        labels:
          severity: page
          component: node
          family: host_disk
          public_status: internal
        annotations:
          summary: "{{ $labels.mountpoint }} has less than 5% free space on {{ $labels.instance }}"
          description: "The filesystem has stayed below 5% free for 5 minutes. PostgreSQL, snapshot capture, builds and journald fail when it fills; free space now."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostDiskSpace.md"

      - alert: FaasHostDiskFillingFast
        expr: |
          (
            node_filesystem_avail_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
              / node_filesystem_size_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
              < 0.25
          )
          and
          predict_linear(node_filesystem_avail_bytes{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}[6h], 4 * 3600) < 0
        for: 30m
        labels:
          severity: page
          component: node
          family: host_disk
          public_status: internal
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is predicted to fill within 4 hours"
          description: "The filesystem is below 25% free and its six-hour trend reaches zero within four hours. Find the writer before the low-space alerts fire."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostDiskSpace.md"

      - alert: FaasHostInodesLow
        expr: |
          node_filesystem_files_free{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
            / node_filesystem_files{job=~"node|node-compute",fstype!~"tmpfs|ramfs|devtmpfs|overlay|squashfs|iso9660|vfat",device!~"/dev/loop.*"}
            < 0.10
        for: 15m
        labels:
          severity: warn
          component: node
          family: host_disk
          public_status: internal
        annotations:
          summary: "{{ $labels.mountpoint }} has less than 10% free inodes on {{ $labels.instance }}"
          description: "The filesystem has stayed below 10% free inodes for 15 minutes. Small-file growth (console logs, spools, caches) can exhaust inodes while bytes remain free."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostDiskSpace.md"

      - alert: FaasHostMemoryLow
        expr: node_memory_MemAvailable_bytes{job=~"node|node-compute"} / node_memory_MemTotal_bytes{job=~"node|node-compute"} < 0.10
        for: 15m
        labels:
          severity: warn
          component: node
          family: host_memory
          public_status: internal
        annotations:
          summary: "Less than 10% of host memory is available on {{ $labels.instance }}"
          description: "MemAvailable has stayed below 10% of MemTotal for 15 minutes. The host OOM killer is next; identify the consumer before it picks a platform daemon."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostMemoryLow.md"

      - alert: FaasHostMemoryCritical
        expr: node_memory_MemAvailable_bytes{job=~"node|node-compute"} / node_memory_MemTotal_bytes{job=~"node|node-compute"} < 0.05
        for: 5m
        labels:
          severity: page
          component: node
          family: host_memory
          public_status: internal
        annotations:
          summary: "Less than 5% of host memory is available on {{ $labels.instance }}"
          description: "MemAvailable has stayed below 5% of MemTotal for 5 minutes. Expect OOM kills of PostgreSQL, Prometheus or a platform daemon."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostMemoryLow.md"

      - alert: FaasHostClockUnsynchronized
        expr: node_timex_sync_status{job=~"node|node-compute"} == 0
        for: 15m
        labels:
          severity: warn
          component: node
          family: host_clock
          public_status: internal
        annotations:
          summary: "The kernel clock is not synchronized on {{ $labels.instance }}"
          description: "The host has reported an unsynchronized clock for 15 minutes. Restored guests step their clocks from the host, and internal mTLS and signed tokens depend on agreed time."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostClock.md"

      - alert: FaasHostClockSkew
        expr: abs(node_timex_offset_seconds{job=~"node|node-compute"}) > 0.5
        for: 10m
        labels:
          severity: warn
          component: node
          family: host_clock
          public_status: internal
        annotations:
          summary: "The host clock is more than 500 ms off on {{ $labels.instance }}"
          description: "The time daemon has reported an offset above 500 ms for 10 minutes. Restored guests inherit the host clock; certificate and token checks drift with it."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostClock.md"

      - alert: FaasHostExporterDown
        expr: up{job=~"node|node-compute"} == 0
        for: 5m
        labels:
          severity: warn
          component: node
          family: host_exporter
          public_status: internal
        annotations:
          summary: "node_exporter is unreachable on {{ $labels.instance }}"
          description: "Prometheus has failed to scrape node_exporter for 5 minutes. Every host disk, memory and clock alert for this host is blind until it recovers."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHostExporterDown.md"

      # The connection probe writes its textfile only after psql succeeds,
      # every 30s, so a stale file means PostgreSQL stopped answering even
      # when its unit still reports active.
      - alert: FaasPostgresDown
        expr: node_systemd_unit_state{job="node",name=~"postgresql@.+-main[.]service",state="active"} == 0
        for: 1m
        labels:
          severity: page
          component: postgres
          family: database_availability
          public_status: internal
        annotations:
          summary: "The PostgreSQL cluster unit is not active on {{ $labels.instance }}"
          description: "{{ $labels.name }} has not been active for 1 minute. apid, schedd and every compute daemon depend on this database."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresDown.md"

      - alert: FaasPostgresProbeStale
        expr: time() - node_textfile_mtime_seconds{job="node",file=~".*/faas_postgres_connections[.]prom"} > 300
        for: 2m
        labels:
          severity: page
          component: postgres
          family: database_availability
          public_status: internal
        annotations:
          summary: "PostgreSQL has not answered the local connection probe for 5 minutes on {{ $labels.instance }}"
          description: "faas-postgres-connection-metrics.timer runs every 30 seconds and only refreshes its textfile after a successful query. A stale file means the database is hung, refusing connections, or the probe timer stopped."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresDown.md"

      # ADR-1344 §8 warm standby. The primary's probe reports its slot only
      # when the manifest declares postgresql.standby, so these stay silent
      # on fleets without one.
      - alert: FaasPostgresStandbyDisconnected
        expr: faas_postgres_standby_slot_active == 0
        for: 5m
        labels:
          severity: warn
          component: postgres
          family: database_availability
          public_status: internal
        annotations:
          summary: "The warm-standby replica is not streaming from {{ $labels.instance }}"
          description: "The faas_standby slot has had no WAL receiver for 5 minutes. The primary keeps WAL for it up to max_slot_wal_keep_size; until the standby reconnects, a failover would lose everything written since it left."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresStandby.md"

      - alert: FaasPostgresStandbyLagHigh
        expr: faas_postgres_standby_replay_lag_bytes > 268435456
        for: 10m
        labels:
          severity: warn
          component: postgres
          family: database_availability
          public_status: internal
        annotations:
          summary: "The warm standby is more than 256 MiB of WAL behind {{ $labels.instance }}"
          description: "The connected standby has not replayed {{ $value | humanize1024 }}B of WAL for 10 minutes. A failover now would lose that much committed data; check the link between the providers and the standby's disk."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresStandby.md"

      - alert: FaasPostgresStandbySlotRetentionHigh
        expr: faas_postgres_standby_slot_retained_bytes > 0.5 * faas_postgres_standby_slot_keep_size_bytes and faas_postgres_standby_slot_keep_size_bytes > 0
        for: 10m
        labels:
          severity: warn
          component: postgres
          family: database_availability
          public_status: internal
        annotations:
          summary: "The warm standby's slot holds over half of max_slot_wal_keep_size on {{ $labels.instance }}"
          description: "The primary keeps {{ $value | humanize1024 }}B of WAL for the standby. When it reaches max_slot_wal_keep_size the slot is invalidated and the standby must be reseeded from scratch."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresStandby.md"

      - alert: FaasPostgresStandbySlotLost
        expr: faas_postgres_standby_slot_wal_status{wal_status="lost"} == 1
        for: 1m
        labels:
          severity: page
          component: postgres
          family: database_availability
          public_status: internal
        annotations:
          summary: "The warm standby can no longer catch up with {{ $labels.instance }}"
          description: "The faas_standby slot exceeded max_slot_wal_keep_size and the primary removed WAL the standby still needed. There is no usable failover target until the standby is reseeded."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostgresStandby.md"

  # ────────────────────────────────────────────────────────────────────
  # Off-host log pipeline health (issue #274).
  # Promtail exposes its own counters; these recording rules give the
  # platform a stable, backend-neutral contract for dashboards and alerts.
  # `loki_send_total` is intentionally an aggregate across Promtail targets,
  # while the alerts retain the Prometheus `instance` label for triage.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_loki_pipeline
    interval: 30s
    rules:
      - record: loki_send_total
        expr: sum by (instance) (promtail_sent_entries_total)

      - record: loki_drop_total
        expr: sum by (instance) (promtail_dropped_entries_total)

      - alert: FaasLokiPromtailDown
        expr: up{job=~"promtail|promtail-compute"} == 0
        for: 10m
        labels:
          severity: warn
          component: promtail
          family: loki_pipeline
        annotations:
          summary: "Promtail is down on {{ $labels.instance }}"
          description: "The FaaS host's journal shipper has not been scrapeable for 10m. Platform and customer-context logs may remain only on the FaaS host. Check systemctl status promtail and the host's private route to Loki."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLokiPipelineDegraded.md"

      - alert: FaasLokiShippingDropped
        expr: increase(promtail_dropped_entries_total[10m]) > 0
        for: 5m
        labels:
          severity: warn
          component: promtail
          family: loki_pipeline
        annotations:
          summary: "Promtail dropped log entries on {{ $labels.instance }}"
          description: "Promtail exhausted its bounded retry budget and dropped journal entries during the last 10m. Investigate Loki reachability, mTLS expiry, and disk/journal pressure before the local journal rotates."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLokiPipelineDegraded.md"

      - alert: FaasLokiShippingStalled
        expr: |
          (
            sum by (instance) (increase(promtail_journal_target_lines_total[10m])) > 0
          )
          and on (instance)
          (
            sum by (instance) (increase(promtail_sent_entries_total[10m])) == 0
          )
        for: 10m
        labels:
          severity: warn
          component: promtail
          family: loki_pipeline
        annotations:
          summary: "Promtail is reading journal entries but not shipping on {{ $labels.instance }}"
          description: "Promtail read journal lines but recorded no successful Loki sends for 10m. This is the backpressure signal; check the dropped-entry counter and the Loki mTLS/client path."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLokiPipelineDegraded.md"

      - alert: FaasLokiBackendDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warn
          component: loki
          family: loki_pipeline
        annotations:
          summary: "Loki backend is down"
          description: "The dedicated Loki metrics endpoint has not been scrapeable for 5m. Promtail may continue buffering briefly, but new platform and customer-context logs are at risk. Check the Loki service, private route, and mTLS material on the observability host."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLokiPipelineDegraded.md"

      - alert: FaasLokiRetentionStalled
        expr: |
          (
            time() - max(loki_compactor_apply_retention_last_successful_run_timestamp_seconds) > 93600
          )
          and
          (
            max(loki_compactor_apply_retention_last_successful_run_timestamp_seconds) > 0
          )
        for: 30m
        labels:
          severity: warn
          component: loki
          family: loki_pipeline
        annotations:
          summary: "Loki retention sweep is stale"
          description: "Loki's compactor has not completed a successful retention pass for more than 26h. Expired log data may accumulate beyond the configured 7-day retention window and consume the backend filesystem. Check compactor logs and the Loki data directory before storage pressure becomes an outage."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLokiPipelineDegraded.md"

      - alert: FaasLokiCompactionStalled
        expr: |
          (
            time() - max(loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds) > 21600
          )
          and
          (
            max(loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds) > 0
          )
        for: 30m
        labels:
          severity: warn
          component: loki
          family: loki_pipeline
        annotations:
          summary: "Loki compaction is stale"
          description: "Loki has not completed a successful index compaction for more than 6h. Query performance and filesystem growth may degrade even when the backend remains reachable. Check the compactor service and its working directory."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLokiPipelineDegraded.md"

  # ────────────────────────────────────────────────────────────────────
  # Customer runtime log-drain health. These alerts are intentionally
  # warning-tier: the customer application remains available, but an
  # external log destination may be stale or losing records.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_customer_log_drains
    interval: 30s
    rules:
      - alert: FaasCustomerLogDrainBacklog
        expr: |
          gateway_log_drain_active == 1
          and (
            (
              gateway_log_drain_pending_bytes_capacity > 0
              and gateway_log_drain_pending_bytes / gateway_log_drain_pending_bytes_capacity > 0.8
            )
            or (
              gateway_log_drain_oldest_pending_timestamp_seconds > 0
              and time() - gateway_log_drain_oldest_pending_timestamp_seconds > 600
            )
          )
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: customer_log_drain
        annotations:
          summary: "Customer log-drain outbox is backlogged for {{ $labels.app }}"
          description: "The {{ $labels.kind }} runtime log drain for app {{ $labels.app }} has remained above 80% durable outbox utilization or has had a pending record older than 10m. The destination is applying backpressure; records are retained across gateway restarts until the outbox reaches its byte limit. Check delivery latency, retries, and the destination endpoint."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomerLogDrainDegraded.md"

      - alert: FaasCustomerLogDrainDeadLetters
        expr: gateway_log_drain_active == 1
          and gateway_log_drain_dead_letter_total > 0
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: customer_log_drain
        annotations:
          summary: "Customer log-drain dead letters need review for {{ $labels.app }}"
          description: "The {{ $labels.kind }} runtime log drain for app {{ $labels.app }} has retained records after retry exhaustion. The records are preserved in the node-local bounded dead-letter file; repair the destination and follow the runbook before the file rotates."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomerLogDrainDegraded.md"

      - alert: FaasCustomerLogDrainDeliveryFailed
        expr: |
          increase(gateway_log_drain_failed_total[10m]) > 0
          and on (app, kind)
          (
            gateway_log_drain_last_success_timestamp_seconds == 0
            or time() - gateway_log_drain_last_success_timestamp_seconds > 600
          )
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: customer_log_drain
        annotations:
          summary: "Customer log-drain delivery is failing for {{ $labels.app }}"
          description: "The {{ $labels.kind }} runtime log drain for app {{ $labels.app }} exhausted delivery attempts during the last 10m and has no successful response in the last 10m. Check the destination status, credentials, TLS path, and gatewayd logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomerLogDrainDegraded.md"

      - alert: FaasCustomerLogDrainDataLoss
        expr: |
          increase(gateway_log_drain_dropped_total[10m]) > 0
          or increase(gateway_log_drain_gaps_total[10m]) > 0
        for: 1m
        labels:
          severity: warn
          component: gatewayd-internal
          family: customer_log_drain
        annotations:
          summary: "Customer runtime log records were lost for {{ $labels.app }}"
          description: "The {{ $labels.kind }} runtime log drain for app {{ $labels.app }} observed dropped records or a source-ring gap during the last 10m. A gap indicates the source ring no longer retains the missing lines; fixing the destination cannot recover them."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomerLogDrainDegraded.md"

  # ────────────────────────────────────────────────────────────────────
  # Compute metrics HTTP-SD health (issue #1219 follow-up).
  # Prometheus can remain scrapeable while apid serves an old, empty, or
  # partially filtered target snapshot, so these rules use producer-side
  # freshness and target counts rather than only `up`.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_compute_metrics_discovery
    interval: 30s
    rules:
      # apid exports the intended compute job as a metric label. Default
      # honor_labels=false scraping preserves it as exported_job and replaces
      # job with apid. Normalize to job-only series before downstream joins.
      # A gauge must have exactly one source per compute job: adding multiple
      # apid snapshots would overcount targets and hide missing scrape series.
      - record: faas_compute_metrics_discovery_targets:by_job
        expr: |
          sum by (job) (
            label_replace(
              apid_metrics_discovery_targets{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}
              and on (exported_job)
              (count by (exported_job) (apid_metrics_discovery_targets{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) == 1),
              "job", "$1", "exported_job", "(.+)"
            )
          )

      - record: faas_compute_metrics_discovery_registry_nodes:by_job
        expr: |
          sum by (job) (
            label_replace(
              apid_metrics_discovery_registry_nodes{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}
              and on (exported_job)
              (count by (exported_job) (apid_metrics_discovery_registry_nodes{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) == 1),
              "job", "$1", "exported_job", "(.+)"
            )
          )

      - record: faas_compute_metrics_discovery_invalid_targets:by_job
        expr: |
          sum by (job) (
            label_replace(
              apid_metrics_discovery_invalid_targets{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}
              and on (exported_job)
              (count by (exported_job) (apid_metrics_discovery_invalid_targets{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) == 1),
              "job", "$1", "exported_job", "(.+)"
            )
          )

      - record: faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job
        expr: |
          sum by (job) (
            label_replace(
              apid_metrics_discovery_last_success_timestamp_seconds{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}
              and on (exported_job)
              (count by (exported_job) (apid_metrics_discovery_last_success_timestamp_seconds{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) == 1),
              "job", "$1", "exported_job", "(.+)"
            )
          )

      # `up` is the downstream truth: the HTTP-SD endpoint can return a
      # healthy snapshot while one or more discovered compute endpoints are
      # unreachable. The `or ... * 0` branch preserves a zero-valued job when
      # Prometheus has no `up` series at all (for example, every target was
      # dropped before the first scrape).
      - record: faas_compute_metrics_healthy_targets:by_job
        expr: |
          sum by (job) (
            up{job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}
          )
          or on (job)
          (
            faas_compute_metrics_discovery_targets:by_job * 0
          )

      - record: faas_compute_metrics_scrape_coverage:by_job
        expr: |
          faas_compute_metrics_healthy_targets:by_job
          /
          on (job)
          clamp_min(
            faas_compute_metrics_discovery_targets:by_job,
            1
          )

      - alert: FaasComputeMetricsScrapeCoverageLow
        expr: |
          (
            faas_compute_metrics_scrape_coverage:by_job{job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"} < 1
          )
          and on (job)
          (
            faas_compute_metrics_discovery_targets:by_job > 0
          )
          and on (job)
          (
            (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job >= 0)
            and (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job <= 120)
            and (faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job > 0)
          )
        for: 5m
        labels:
          severity: warn
          component: prometheus
          family: compute_metrics_scrape
        annotations:
          summary: "Compute metrics scrape coverage is incomplete for {{ $labels.job }}"
          description: "Prometheus is scraping fewer compute targets than the latest healthy apid HTTP-SD snapshot reports for {{ $labels.job }}. Discovery itself is healthy, but one or more node metrics endpoints are unreachable or not producing a scrape series. Check the per-node up status and scrape errors in the discovery runbook."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeMetricsDiscoveryDegraded.md"

      - alert: FaasComputeMetricsScrapeTargetDown
        expr: |
          (
            up{job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"} == 0
          )
          and on (job)
          (
            faas_compute_metrics_discovery_targets:by_job > 0
          )
          and on (job)
          (
            (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job >= 0)
            and (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job <= 120)
            and (faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job > 0)
          )
        for: 5m
        labels:
          severity: warn
          component: prometheus
          family: compute_metrics_scrape
        annotations:
          summary: "Compute metrics target is down on {{ $labels.node }}"
          description: "Prometheus cannot scrape the discovered {{ $labels.job }} endpoint for node {{ $labels.node }}. Discovery is still returning a fresh target, so check the node's gateway or Promtail metrics listener, private route, firewall, and service readiness."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeMetricsDiscoveryDegraded.md"

      # apid preinitializes zero snapshots even for unused HTTP-SD jobs.
      # Bootstrap zero is a failure only after an observed discovery attempt;
      # previously successful snapshots retain the normal staleness check.
      - alert: FaasComputeMetricsDiscoveryStale
        expr: |
          (
            (faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job == 0)
            and on (job)
            (
              sum by (job) (
                label_replace(
                  apid_metrics_discovery_requests_total{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"},
                  "job", "$1", "exported_job", "(.+)"
                )
              ) > 0
            )
          )
          or
          (
            (faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job > 0)
            and (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job > 120)
          )
          or
          (
            faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job > time()
          )
        for: 5m
        labels:
          severity: warn
          component: apid
          family: compute_metrics_discovery
        annotations:
          summary: "Compute metrics discovery is stale for {{ $labels.job }}"
          description: "apid has not completed a successful registry-backed HTTP-SD snapshot for {{ $labels.job }} within the past 120s, or its refresh timestamp is in the future. Prometheus may still be healthy while compute-node metrics coverage is frozen or missing. Check apid availability, its database pool, and the discovery runbook."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeMetricsDiscoveryDegraded.md"

      - alert: FaasComputeMetricsDiscoveryEmpty
        expr: |
          (
            faas_compute_metrics_discovery_registry_nodes:by_job > 0
          )
          and on (job)
          (
            faas_compute_metrics_discovery_targets:by_job == 0
          )
          and on (job)
          (
            (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job >= 0)
            and (time() - faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job <= 120)
            and (faas_compute_metrics_discovery_last_success_timestamp_seconds:by_job > 0)
          )
        for: 5m
        labels:
          severity: warn
          component: apid
          family: compute_metrics_discovery
        annotations:
          summary: "Compute metrics discovery returned no targets for {{ $labels.job }}"
          description: "The active compute registry contains scrape-ready nodes, but the latest successful HTTP-SD response for {{ $labels.job }} returned zero targets. Check invalid gateway_target_url values, stable node names, and the apid registry rows before changing Prometheus configuration."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeMetricsDiscoveryDegraded.md"

      - alert: FaasComputeMetricsDiscoveryInvalidTargets
        expr: faas_compute_metrics_discovery_invalid_targets:by_job > 0
        for: 10m
        labels:
          severity: warn
          component: apid
          family: compute_metrics_discovery
        annotations:
          summary: "Compute metrics discovery is filtering invalid targets for {{ $labels.job }}"
          description: "apid omitted one or more active compute registry rows from the {{ $labels.job }} HTTP-SD response because the gateway target or stable node name failed validation. Metrics coverage is partial; repair the registry row and verify the next refresh."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeMetricsDiscoveryDegraded.md"

      - alert: FaasComputeMetricsDiscoveryAmbiguous
        expr: |
          max by (job) (
            label_replace(
              (count by (exported_job) (apid_metrics_discovery_targets{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) > 1)
              or (count by (exported_job) (apid_metrics_discovery_registry_nodes{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) > 1)
              or (count by (exported_job) (apid_metrics_discovery_invalid_targets{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) > 1)
              or (count by (exported_job) (apid_metrics_discovery_last_success_timestamp_seconds{job="apid",exported_job=~"gatewayd-internal|vmmd|imaged|builderd|node-compute|realtimed|schedd-compute|promtail-compute"}) > 1),
              "job", "$1", "exported_job", "(.+)"
            )
          )
        for: 5m
        labels:
          severity: warn
          component: apid
          family: compute_metrics_discovery
        annotations:
          summary: "Compute metrics discovery has multiple sources for {{ $labels.job }}"
          description: "More than one apid discovery gauge series reports the {{ $labels.job }} snapshot. Per-job counts are unavailable because summing or choosing between producers could misstate scrape coverage. Check duplicate apid scrape targets and producer labels in the discovery runbook."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeMetricsDiscoveryDegraded.md"

  # ────────────────────────────────────────────────────────────────────
  # ADR-1343 §5: the app edge on each compute node (gatewayd-public in
  # compute edge mode and its Cloudflare Tunnel connector). Prometheus
  # scrapes the two jobs only while the cell runs the edge, so these stay
  # silent on fleets without it. One edge down is lost capacity; Cloudflare
  # sends its share to the other connectors. All of them down is an outage.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_compute_edge
    rules:
      - alert: FaasComputeEdgeUnavailable
        expr: (sum(up{job="gatewayd-public-edge"}) == 0) or (sum(cloudflared_tunnel_ha_connections) == 0)
        for: 2m
        labels:
          severity: page
          component: gatewayd-public
          family: compute_edge
          public_status: internal
        annotations:
          summary: "No compute-node app edge is serving"
          description: "Every compute edge is down or every Cloudflare Tunnel connector has lost its connections for 2 minutes. App requests routed through the tunnel are failing."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeEdge.md"

      - alert: FaasComputeEdgeDown
        expr: up{job="gatewayd-public-edge"} == 0
        for: 2m
        labels:
          severity: warn
          component: gatewayd-public
          family: compute_edge
          public_status: internal
        annotations:
          summary: "The app edge on {{ $labels.node }} is not answering"
          description: "Prometheus cannot scrape gatewayd-public's compute edge on {{ $labels.node }}. Its connector may still take tunnel traffic and fail it; Cloudflare routes away only once the connector disconnects."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeEdge.md"

      - alert: FaasComputeEdgeConnectorDisconnected
        expr: (up{job="cloudflared"} == 0) or (cloudflared_tunnel_ha_connections == 0)
        for: 2m
        labels:
          severity: warn
          component: cloudflared
          family: compute_edge
          public_status: internal
        annotations:
          summary: "The Cloudflare Tunnel connector on {{ $labels.node }} is not connected"
          description: "faas-cloudflared on {{ $labels.node }} is down or holds no tunnel connections. The node serves no app traffic until it reconnects; the other connectors carry its share."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeEdge.md"

      - alert: FaasComputeEdgeLocalFallback
        expr: rate(gatewayd_public_edge_local_fallback_total[5m]) > 0.5
        for: 10m
        labels:
          severity: warn
          component: gatewayd-public
          family: compute_edge
          public_status: internal
        annotations:
          summary: "The app edge on {{ $labels.node }} is routing around its own gateway"
          description: "The compute edge on {{ $labels.node }} sent {{ $value | humanize }} requests/s to the compute pool for 10 minutes because its node's gatewayd-internal failed its health check or refused dials. Traffic still flows, with an extra hop; check gatewayd-internal on that node."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeEdge.md"

      - alert: FaasComputeEdgeMisdirected
        expr: rate(gatewayd_public_edge_misdirected_total[5m]) > 0.2
        for: 15m
        labels:
          severity: warn
          component: gatewayd-public
          family: compute_edge
          public_status: internal
        annotations:
          summary: "The app edge on {{ $labels.node }} is receiving non-app hosts"
          description: "The compute edge on {{ $labels.node }} answered {{ $value | humanize }} requests/s with 421 for hosts outside the apps domain for 15 minutes. The tunnel's ingress rules likely send platform or custom-domain hosts to the compute edge."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeEdge.md"

  # ────────────────────────────────────────────────────────────────────
  # Dead-man's switch. FaasWatchdog fires permanently; Alertmanager routes
  # it to the faas-heartbeat receiver, which posts to an external monitor
  # every am_heartbeat_interval. When the posts stop (control plane down,
  # Prometheus or Alertmanager stopped, rule evaluation broken) the
  # external monitor alerts. This is the external monitor the next group
  # refers to.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_watchdog
    rules:
      - alert: FaasWatchdog
        expr: vector(1)
        labels:
          severity: info
          component: alertmanager
          family: watchdog
          public_status: internal
        annotations:
          summary: "Always firing: proves the alerting pipeline works end to end"
          description: "This alert never resolves. Alertmanager posts it to the external heartbeat monitor; if the monitor stops receiving it, Prometheus, Alertmanager or the control plane is down."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWatchdog.md"

  # ────────────────────────────────────────────────────────────────────
  # Prometheus and Alertmanager control-plane health.
  #
  # Prometheus self-scrapes on loopback so these metrics are available to
  # the same rule engine that owns the alerting path. These alerts catch
  # partial failures (rule evaluation, queueing, delivery, or config
  # reload) before they become an unexplained absence of pages. A complete
  # Prometheus process failure still requires an external monitor because
  # a stopped evaluator cannot page about itself.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_observability_control_plane
    interval: 30s
    rules:
      - alert: FaasPrometheusRuleEvaluationFailed
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warn
          component: prometheus
          family: prometheus_health
        annotations:
          summary: "Prometheus rule evaluation failures detected"
          description: "Prometheus has recorded one or more rule evaluation failures during the last 10m. Alert and recording rules may be stale; inspect the failed rule group in the Prometheus logs and /rules endpoint before relying on dashboards or pages."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPrometheusAlertingPathDegraded.md"

      - alert: FaasPrometheusNotificationsDropped
        expr: increase(prometheus_notifications_dropped_total[10m]) > 0
        for: 5m
        labels:
          severity: page
          component: prometheus
          family: prometheus_health
        annotations:
          summary: "Prometheus dropped alerts before Alertmanager delivery"
          description: "Prometheus has dropped one or more notifications during the last 10m. The page path is losing alerts before Alertmanager receives them; check Alertmanager reachability, the notifier queue, and Prometheus logs immediately."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPrometheusAlertingPathDegraded.md"

      - alert: FaasPrometheusNotificationQueueBacklog
        expr: |
          prometheus_notifications_queue_capacity > 0
          and (
            prometheus_notifications_queue_length
            / prometheus_notifications_queue_capacity
          ) > 0.8
        for: 10m
        labels:
          severity: warn
          component: prometheus
          family: prometheus_health
        annotations:
          summary: "Prometheus notification queue is above 80% capacity"
          description: "Prometheus has held more than 80% of its notification queue for 10m. Alert delivery is falling behind; check Alertmanager readiness and receiver failures before the queue fills and drops pages."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPrometheusAlertingPathDegraded.md"

      - alert: FaasAlertmanagerNotificationsFailed
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: page
          component: alertmanager
          family: alertmanager_health
        annotations:
          summary: "Alertmanager notification delivery is failing"
          description: "Alertmanager has recorded failed notifications during the last 10m. One or more configured page or ticket integrations may be unreachable; inspect the integration label, receiver configuration, and provider response before assuming pages are delivered."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAlertmanagerDeliveryDegraded.md"

      - alert: FaasAlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warn
          component: alertmanager
          family: alertmanager_health
        annotations:
          summary: "Alertmanager configuration reload failed"
          description: "Alertmanager's most recent configuration reload was unsuccessful for 5m. The previous configuration may still be active, so verify routing and receiver changes before treating the notification path as healthy."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAlertmanagerDeliveryDegraded.md"

      - alert: FaasNotificationPayloadRejected
        expr: increase({__name__=~"(apid|schedd|imaged)_notification_payload_rejected_total|gateway_notification_payload_rejected_total",channel="app_changed"}[10m]) > 0
        for: 5m
        labels:
          severity: warn
          component: notification_bus
          family: notification_contract
          public_status: internal
        annotations:
          summary: "A platform daemon rejected an app_changed notification"
          description: "The {{ $labels.consumer }} consumer rejected at least one app_changed payload during the last 10m. This usually indicates a mixed or broken producer contract and can leave lifecycle or security-policy caches stale."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasNotificationPayloadRejected.md"

  # ────────────────────────────────────────────────────────────────────
  # Traffic anomaly recording rules (issue #303, ADR-039).
  # 3-day rolling baseline vs current 5m window. Series:
  #   faas_apid_request_rate_5m:by_route            current rate (reqps)
  #   faas_apid_error_rate_5m:by_route              5xx ratio over total
  #   faas_apid_request_rate_3d_baseline:by_route   trailing 3d avg
  #   faas_apid_error_rate_3d_baseline:by_route     trailing 3d avg
  #   faas_apid_request_rate_ratio:by_route         current / baseline
  #   faas_apid_error_rate_ratio:by_route           current / baseline
  # Fan-out to per-account series is done by the alert rules, not here
  # (keeps the recording-rule set O(routes) not O(customers)). The 3d
  # window sees the same time-of-day/weekday traffic mix as the
  # current 5m window; retention (15d, prom_retention_days) gives 5x
  # headroom. clamp_min(...) guards against /0 when a route has zero
  # recent traffic — the small 0.001 floor lets the ratio formula
  # produce a numeric value rather than a NaN.
  #
  # The 3d baselines live in faas_anomaly_baseline_3d below. They used to
  # be `avg_over_time(<rate over raw series>[3d:5m])` subqueries in this
  # 30s group, recomputing 864 rate() steps over the raw counters twice a
  # minute: on production-us the group took 15s of every 30s and, with
  # the account alerts repeating the same subquery inline, made
  # Prometheus the largest CPU consumer on the control plane (hunt #9,
  # H9-132). A three-day average moves imperceptibly in two minutes.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_anomaly_baseline_3d
    # 2m keeps every baseline sample inside the 5m instant-vector
    # lookback the ratio rules read it with, even if one evaluation is
    # skipped.
    interval: 2m
    rules:
      - record: faas_apid_request_rate_3d_baseline:by_route
        expr: avg_over_time(faas_apid_request_rate_5m:by_route[3d])

      - record: faas_apid_error_rate_3d_baseline:by_route
        expr: avg_over_time(faas_apid_error_rate_5m:by_route[3d])

      # Reads the raw counter: faas_apid_request_rate_5m:by_account is
      # recorded only since this group existed, so averaging it would
      # start every account's baseline from minutes of history.
      - record: faas_apid_request_rate_3d_baseline:by_account
        expr: avg_over_time(sum by (account_id) (rate(apid_request_total[5m]))[3d:5m])

      - record: faas_gateway_request_rate_3d_baseline:by_route
        expr: avg_over_time(faas_gateway_request_rate_5m:by_route[3d])

  - name: faas_anomaly_baseline
    interval: 30s
    rules:
      - record: faas_apid_request_rate_5m:by_route
        expr: sum by (route) (rate(apid_request_total{account_id!="anonymous"}[5m]))

      - record: faas_apid_error_rate_5m:by_route
        expr: |
          (
              sum by (route) (rate(apid_request_total{account_id!="anonymous",code!="ok"}[5m]))
          )
          /
          clamp_min(
              sum by (route) (rate(apid_request_total{account_id!="anonymous"}[5m])),
              1
          )

      - record: faas_apid_request_rate_ratio:by_route
        expr: |
          faas_apid_request_rate_5m:by_route
          /
          clamp_min(faas_apid_request_rate_3d_baseline:by_route, 0.001)

      - record: faas_apid_error_rate_ratio:by_route
        expr: |
          faas_apid_error_rate_5m:by_route
          /
          clamp_min(faas_apid_error_rate_3d_baseline:by_route, 0.001)

      # Per-account anomaly score (issue #303 follow-up). The 3d-baseline
      # math that FaasTrafficSpikeAccount computes inline in its `expr`
      # is lifted here so the FaasTrafficAnomaly aggregator alert can
      # read a precomputed series rather than recomputing the ratio on
      # every alert evaluation. Bounded by the accountLabelSet admission
      # primitive (10 000 + "__other__") — the per-account fan-out is
      # O(active customers), not unbounded.
      - record: faas_apid_request_rate_5m:by_account
        expr: sum by (account_id) (rate(apid_request_total[5m]))

      - record: faas_apid_anomaly_score:by_account
        expr: |
          faas_apid_request_rate_5m:by_account
          /
          clamp_min(faas_apid_request_rate_3d_baseline:by_account, 0.001)

      # ─────────────────────────────────────────────────────────────────
      # ADR-093 — per-route observability (gatewayd-internal)
      # ─────────────────────────────────────────────────────────────────
      #
      # Mirror of the apid per-route pattern above. The bounded
      # admission set behind gateway_request_*{route,…} bounds the
      # series fan-out to O(50 routes × N apps), not O(paths). The
      # recording rules here ride the same machinery the apid-side
      # rules use so the dashboard panels can join on (app, route)
      # uniformly. Clamp_min(...) guards /0 on quiet routes.
      #
      # Why this is opt-in only at the metric level: the
      # gateway_request_*_total{route=…} series are emitted
      # unconditionally on every request that lands on an
      # opted-in app. Off-apps still emit the pre-ADR-042
      # {app, code} / {app, class} series; the recording
      # rules below simply have zero data points to aggregate.
      - record: faas_gateway_request_rate_5m:by_route
        expr: sum by (app, route) (rate(gateway_requests_by_route_total[5m]))
      - record: faas_gateway_request_rate_ratio:by_route
        expr: |
          faas_gateway_request_rate_5m:by_route
          /
          clamp_min(faas_gateway_request_rate_3d_baseline:by_route, 0.001)
      - record: faas_gateway_error_rate_5m:by_route
        expr: |
          sum by (app, route) (rate(gateway_request_failures_by_route_total[5m]))
          /
          clamp_min(
            sum by (app, route) (rate(gateway_requests_by_route_total[5m])),
            0.001
          )
      - record: faas_gateway_p95_seconds:by_route
        expr: |
          histogram_quantile(
            0.95,
            sum by (app, route, le) (rate(gateway_request_duration_by_route_seconds_bucket[5m]))
          )

  - name: faas_slo
    interval: 30s
    rules:

      # ─────────────────────────────────────────────────────────────────
      # Resident RAM pressure (vmmd / fcvm gauges — schedd /metrics/fcvm)
      # Spec §12 row: "resident_ram_pct ≤ 100 target, > 80 warn, > 92 page".
      # family=resident_ram so the alertmanager inhibit rule can suppress
      # the warn-tier email when the page-tier fires (alertnames differ).
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasHighResidentRamPct
        expr: max(fcvm_resident_ram_pct) > 92
        for: 5m
        labels:
          severity: page
          component: vmmd
          family: resident_ram
        annotations:
          summary: "Resident RAM > 92% of tenant budget"
          description: "Σ(ram_mb + 8) over live instances has exceeded 92% of the 47,600 MB ceiling for 5m. New wakes will start failing admission."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHighResidentRam.md"

      - alert: FaasHighResidentRamPctWarn
        expr: max(fcvm_resident_ram_pct) > 80 and max(fcvm_resident_ram_pct) <= 92
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: resident_ram
        annotations:
          summary: "Resident RAM > 80% of tenant budget"
          description: "Resident RAM has remained between 80% and 92% of the host budget for 10m. Start or provision another SSD compute node through the reviewed node-join path before this host reaches the admission ceiling."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasHighResidentRam.md"

      - alert: FaasJobInstanceCleanupFailed
        expr: increase(schedd_job_instance_reconcile_total{outcome="error"}[10m]) > 0
        for: 1m
        labels:
          severity: warn
          component: schedd
          family: job_instance_lifecycle
          public_status: internal
        annotations:
          summary: "A terminal or unowned job VM could not be destroyed"
          description: "The job ownership reconciler found a live Firecracker instance without a matching claimed task and vmmd destroy failed. The VM may still consume and meter RAM until the next successful sweep."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasJobInstanceCleanupFailed.md"

      # ─────────────────────────────────────────────────────────────────
      # Snapshot fleet average size (vmmd / fcvm — schedd /metrics/fcvm)
      # Spec §12 row: "snapshot_fleet_avg_mb 130 plan, > 160 warn, > 200 page".
      # §12 does NOT govern the p95 series; the V1 acceptance p95 ≤ 300 MB
      # is a separate experiment threshold, not an alert.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasSnapshotFleetAvgHighPage
        expr: max(fcvm_snapshot_fleet_avg_bytes) / 1024 / 1024 > 200
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: snapshot_fleet
          public_status: internal
        annotations:
          summary: "Snapshot fleet avg > 200 MB"
          description: "Average snapshot size has exceeded 200 MB for 10m. The fleet is past the §12 page threshold; /srv allocation will start pressuring tenant disk quotas."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotFleetHigh.md"

      - alert: FaasSnapshotFleetAvgHighWarn
        expr: max(fcvm_snapshot_fleet_avg_bytes) / 1024 / 1024 > 160 and max(fcvm_snapshot_fleet_avg_bytes) / 1024 / 1024 <= 200
        for: 15m
        labels:
          severity: warn
          component: vmmd
          family: snapshot_fleet
          public_status: internal
        annotations:
          summary: "Snapshot fleet avg > 160 MB"
          description: "Average snapshot size between 160 MB and 200 MB for 15m. Page-tier crossing likely on the next deploy wave if cold-boot fallback rate is also elevated."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotFleetHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # LV-fc usage (vmmd — schedd /metrics/fcvm)
      # Spec §12 row: "lv_fc_used_pct > 80 warn, > 90 page".
      # Note: §8 (line 365) says imaged refuses > 90% and pages at 80%;
      # §12 says warn at 80, page at 90. This rule uses §12 verbatim.
      # The §8 / §12 contradiction is an ADR-worthy spec drift surfaced
      # in the §17 lean list.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasLvFcUsageHighPage
        expr: max(fcvm_lv_fc_used_pct) > 90
        for: 5m
        labels:
          severity: page
          component: vmmd
          family: lv_fc
        annotations:
          summary: "lv-fc usage > 90%"
          description: "The fc logical volume is past 90% used for 5m. imaged will start refusing new deploys; tenant snapshots can no longer be parked."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLvFcUsageHigh.md"

      - alert: FaasLvFcUsageHighWarn
        expr: max(fcvm_lv_fc_used_pct) > 80 and max(fcvm_lv_fc_used_pct) <= 90
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: lv_fc
        annotations:
          summary: "lv-fc usage > 80%"
          description: "lv-fc usage between 80% and 90% for 10m. Schedule the next LV-resize runbook before the page-tier crossing."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLvFcUsageHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # Build queue wait p95 (builderd)
      # Spec §12 row: "build_queue_wait_p95 < 60s target, > 300s warn".
      # No page threshold per spec (builds are not customer-blocking).
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasBuildQueueBacklog
        expr: histogram_quantile(0.95, sum(rate(builderd_build_queue_wait_seconds_bucket[5m])) by (le)) > 300
        for: 10m
        labels:
          severity: warn
          component: builderd
          family: build_queue
        annotations:
          summary: "Build queue p95 wait > 5m"
          description: "Builds are queueing > 300s at p95. Builder admission is intentionally limited to one VM under the 5 GiB parent slice; check whether arrival rate exceeds that safe drain rate."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md"

      - alert: FaasBuilderSliceOOMKill
        expr: increase(builderd_builder_slice_oom_kills_total[10m]) > 0
        for: 1m
        labels:
          severity: warn
          component: builderd
          family: builder_memory
          public_status: internal
        annotations:
          summary: "The builder parent cgroup OOM-killed an active build"
          description: "builderd attributed a new faas-cp-build.slice oom_kill to the active build. The build is persisted as build_oom; use the correlated builderd log to identify build, deployment, node, and VM instance."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuilderSliceOOM.md"

      - alert: FaasHostOOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        for: 1m
        labels:
          severity: warn
          component: node
          family: host_memory
          public_status: internal
        annotations:
          summary: "The Linux host OOM killer terminated a process on {{ $labels.node }}"
          description: "node_vmstat_oom_kill increased. Correlate with builderd_builder_slice_oom_kills_total and system journal kernel OOM records to identify the victim."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuilderSliceOOM.md"

      # ─────────────────────────────────────────────────────────────────
      # Gateway wake latency p95 (gatewayd-internal)
      # Spec §12 row: "gateway_wake_latency_seconds p95 ≤ 0.8s target, > 1.5s warn".
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasWakeLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(gateway_wake_latency_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: wake_latency
        annotations:
          summary: "Gateway wake p95 > 1.5s"
          description: "End-to-end cold-wake latency has exceeded the §12 page threshold (1.5s) at p95 for 10m. Cross-check FaasColdBootFallbackHigh — snapshot rot is the most likely cause."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWakeLatencyHigh.md"

      - alert: FaasPlatformWakeLatencySLOBreach
        expr: |
          histogram_quantile(0.95, sum(rate(gateway_platform_wake_latency_seconds_bucket[15m])) by (le)) >= 0.35
          and sum(increase(gateway_platform_wake_latency_seconds_count[15m])) >= 20
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: platform_wake_latency
        annotations:
          summary: "SSD platform wake p95 is not below 350ms"
          description: "The platform-only capacity-admission to first-upstream-byte boundary has breached the public-beta p95 gate with at least 20 recent samples. Check schedd wake phases, VMMD restore breakdown, and the persistent forwarding bridge. CDN and client latency are excluded."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWakeLatencyHigh.md"

      - alert: FaasWakeEventIdentityMissing
        expr: sum by (phase, field) (increase({__name__=~"(gatewayd|schedd|vmmd)_wake_identity_invalid_total"}[5m])) > 0
        for: 2m
        labels:
          severity: warn
          component: observability
          family: wake_timeline
          public_status: internal
        annotations:
          summary: "Wake {{ $labels.phase }} event is missing {{ $labels.field }}"
          description: "A wake lifecycle producer attempted to persist an event without required authoritative identity. The row was rejected to prevent silently incomplete customer timelines."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWakeLatencyHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # Cold-boot fallback rate (vmmd / vmmd_cold_boot_fallback_total)
      # Spec §12 row: "cold_boot_fallback_pct < 2% target, > 10% warn".
      # Denominator = Σ(vmmd_ops_total{op="CreateFromSnapshot","CreateColdBoot"}).
      # The op labels are PascalCase (pkg/vmmdgrpc/server.go:80,98) — the
      # earlier lowercase regex matched nothing and the alert never fired.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasColdBootFallbackHigh
        expr: |
          rate(vmmd_cold_boot_fallback_total[5m])
            /
          sum(rate(vmmd_ops_total{op=~"CreateFromSnapshot|CreateColdBoot"}[5m]))
            > 0.10
        for: 15m
        labels:
          severity: warn
          component: vmmd
          family: cold_boot_fallback
        annotations:
          summary: "Cold-boot fallback > 10% of wakes"
          description: "More than 10% of wakes have fallen back from snapshot restore to cold-boot for 15m. Snapshot rot (FC version mismatch, rootfs drift) is the canonical cause; cf. ADR-005."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasColdBootFallbackHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # Public SLOs from spec §12 (status page row).
      # Spec: "API availability 99.5% monthly, wake p95 < 1s,
      #        build success (non-user_error) 99% — error budgets,
      #        not promises."
      # 5m rolling remains the fast status-page signal. The paired
      # multi-window burn-rate alerts below use the 30-day budgets as their
      # reference (14.4x over 1h and 6x over 6h) so a sustained incident is
      # caught before it consumes the monthly budget. Long-term monthly
      # reporting still belongs in the durable metrics backend; this local
      # Prometheus retains 15 days.
      #
      # Eligible platform outcomes are 2xx and 5xx. Client/application 4xx
      # responses do not consume the fleet availability budget, and neither
      # does a 5xx the customer's app returned itself: the error numerator is
      # gateway_platform_errors_total (5xx produced before any guest response
      # byte). Counting app-authored 5xx let one tenant's failing handler
      # page on-call (production-us hunt #9: 554 deliberate 500s from a test
      # app fired FaasApiAvailabilityBurnRateHigh). The
      # `sum(rate(...[5m])) > 0` guard keeps an idle box from alerting. Do not
      # clamp a rate denominator to 1: at less than one request per second
      # that changes the ratio and makes successful low-volume traffic look
      # unavailable.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasApiAvailabilityLow
        expr: |
          (1 - ((sum(rate(gateway_platform_errors_total{app!="-"}[5m])) or vector(0))
            /
          sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m]))))
            < 0.995
          and sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m])) > 0
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: api_availability
        annotations:
          summary: "API availability < 99.5% (rolling 5m)"
          description: "The share of eligible requests the platform answered (everything except platform-produced 5xx) over the last 5 minutes has been below the §12 public SLO (99.5%) for 10m. This is rolling, not monthly — the alert is intentionally more sensitive than the customer-facing SLO. Status page /status/slo.json shows the same metric."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiAvailabilityLow.md"

      - alert: FaasApiAvailabilityBurnRateHigh
        expr: |
          (
            (
              (sum(rate(gateway_platform_errors_total{app!="-"}[1h])) or vector(0))
              / sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[1h]))
            ) > 0.072
            and sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[1h])) > 0
          )
          and
          (
            (
              (sum(rate(gateway_platform_errors_total{app!="-"}[6h])) or vector(0))
              / sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[6h]))
            ) > 0.03
            and sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[6h])) > 0
          )
        for: 10m
        labels:
          severity: page
          component: gatewayd-internal
          family: api_availability
        annotations:
          summary: "API availability is consuming its monthly error budget rapidly"
          description: "The platform-produced 5xx rate exceeded both the 14.4x one-hour and 6x six-hour burn-rate thresholds for the 99.5% monthly availability budget. Investigate the customer-facing failure path and keep the rolling SLO alert in context."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiAvailabilityLow.md"

      - alert: FaasBuildSuccessLow
        expr: |
          (sum(rate(builderd_ops_total{op="build",code=~"ok|cache_hit"}[5m]))
            /
          sum(rate(builderd_ops_total{op="build",code!="user_error"}[5m])))
            < 0.99
          and sum(rate(builderd_ops_total{op="build",code!="user_error"}[5m])) > 0
        for: 15m
        labels:
          severity: warn
          component: builderd
          family: build_success
        annotations:
          summary: "Build success (non-user_error) < 99%"
          description: "Successful builds (ok or cache_hit), excluding user_error builds from the denominator, have been below the §12 public SLO (99%) for 15m. Status page /status/slo.json shows the same metric."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildSuccessLow.md"

      - alert: FaasBuildSuccessBurnRateHigh
        expr: |
          (
            (
              sum(rate(builderd_ops_total{op="build",code!~"ok|cache_hit|user_error"}[1h]))
              / sum(rate(builderd_ops_total{op="build",code!="user_error"}[1h]))
            ) > 0.144
            and sum(rate(builderd_ops_total{op="build",code!="user_error"}[1h])) > 0
          )
          and
          (
            (
              sum(rate(builderd_ops_total{op="build",code!~"ok|cache_hit|user_error"}[6h]))
              / sum(rate(builderd_ops_total{op="build",code!="user_error"}[6h]))
            ) > 0.06
            and sum(rate(builderd_ops_total{op="build",code!="user_error"}[6h])) > 0
          )
        for: 15m
        labels:
          severity: warn
          component: builderd
          family: build_success
        annotations:
          summary: "Build failures are consuming the monthly error budget rapidly"
          description: "The platform build-failure rate, excluding user_error builds, exceeded both the 14.4x one-hour and 6x six-hour burn-rate thresholds for the 99% monthly build-success budget. Separate customer-content failures from builder infrastructure failures before escalating."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildSuccessLow.md"

      # ─────────────────────────────────────────────────────────────────
      # apid audit-write failures (IAM-4 / ADR-035, issue #278).
      #
      # The audit emit is best-effort by design: the auth action has
      # already returned 200 to the customer by the time AppendEvent
      # runs, so a failed insert logs WARN and bumps this counter
      # without rolling back the action. A sustained non-zero rate
      # therefore means audit rows are silently missing while customer
      # traffic looks healthy — a ticket-tier operational signal, not
      # a page-tier outage.
      #
      # `sum(...)` (no `by (account_id)`) on purpose: a single
      # misbehaving customer firing hundreds of failures/sec should
      # trip the alert just as a Postgres outage would. The per-account
      # breakdown is in the metric itself for the runbook drill-down.
      #
      # Threshold: > 5 failures/min over the rolling 5m window. The
      # issue acceptance calls for "rate exceeds 5/min over 5m"; we
      # use the standard `for: 5m` to debounce transient blips (a
      # single INSERT retry race). `severity: warn` because audit
      # rows missing ≠ customer action failing.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasApidAuditWriteFailures
        expr: sum(rate(apid_audit_write_failures_total[5m])) > (5 / 60)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: audit_write
        annotations:
          summary: "apid audit writes failing above 5/min"
          description: "The apid audit event append failure rate has exceeded 5 failures per minute over the rolling 5-minute window for 5m. Audit rows may be missing even though customer actions continue to succeed (best-effort per ADR-035). Drill down per-account via the runbook; sustained failures point at the events table, Postgres WAL, or the connection pool."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApidAuditWriteFailures.md"

      # ─────────────────────────────────────────────────────────────────
      # apid audit-event retention (ADR-091 D20.4 / PR-D20.4, ADR-075).
      #
      # PR-B (PR #857) shipped the three prerequisite metrics in
      # pkg/wire/metrics.go (apid_audit_events_deleted_total,
      # apid_audit_events_retention_lag_seconds, apid_audit_events_volume_total{kind_prefix}).
      # This group closes the operator surface: three alerts that map
      # directly onto docs/ops/FaasAuditRetentionExhaustion.md's
      # three-signal triage.
      #
      # Metric-semantics notes (PR-D20.4 review caught three bugs that
      # would have shipped broken alerts — kept here as the tripwire):
      #
      #   1. apid_audit_events_retention_lag_seconds is `Set`, not
      #      `Accumulate`. The gauge reads ~7,776,000 seconds (90d) on
      #      every healthy pass (pkg/eventretention/cleanup.go:211-213)
      #      because cutoff = now - 90d (line 198-199). Between passes
      #      Prometheus's stale-marker keeps the last value — the
      #      gauge does NOT grow over time. We alert on staleness
      #      (`time() - timestamp(...)`) instead of value thresholds.
      #
      #   2. apid_audit_events_deleted_total is only incremented when
      #      deleted > 0 (cleanup.go:205-210). On a healthy fleet with
      #      rows already trimmed, the counter is idle for stretches.
      #      The growth-vs-pruned alert ANDs in `volume_rate > 0` so
      #      it doesn't fire on idle days.
      #
      #   3. The production Interval is the default 24h
      #      (cmd/apid/main.go:604-617 — no Interval override). All
      #      staleness thresholds below scale off this cadence.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasAuditRetentionLoopStalled
        # The cleanup loop hasn't completed a pass in >26h. Loop
        # cadence is 24h; the 2h slack covers the first-pass grace
        # window (cleanup.go:223-227 — Run's first pass is immediate
        # but a transient Postgres error delays the next good pass
        # by one full interval). `for: 30m` debounces a single
        # missed pass. SOC 2 CC6.2 retention obligation at risk —
        # page.
        expr: time() - timestamp(apid_audit_events_retention_lag_seconds) > 93600
        for: 30m
        labels:
          severity: warn
          component: apid
          family: audit_retention
        annotations:
          summary: "apid audit-event retention loop stalled >26h"
          description: "The daily audit-event retention cleanup loop (pkg/eventretention, ADR-075) has not completed a successful pass in >26h. The gauge apid_audit_events_retention_lag_seconds stops updating when the loop stalls; Prometheus scrapes see a stale value. SOC 2 CC6.2 evidence-retention obligation is at risk. Drill down per the runbook: check apid logs for `eventretention.first_pass_failed` and `eventretention.delete` error paths."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAuditRetentionExhaustion.md"

      - alert: FaasAuditRetentionLoopStretched
        # The loop ran but hasn't run again in >2x cadence (50h vs
        # 24h + 2h slack). Either CutoffDays was misconfigured, the
        # ticker died, or the cleanup goroutine crashed. The gauge
        # IS updating (so loop is alive per the stalled rule's
        # semantics) but the cadence is broken — ticket-tier
        # operational signal, not page-tier.
        expr: time() - timestamp(apid_audit_events_retention_lag_seconds) > 180000
        for: 30m
        labels:
          severity: warn
          component: apid
          family: audit_retention
        annotations:
          summary: "apid audit-event retention loop stretched >50h"
          description: "The audit-event retention loop is alive (gauge IS updating) but the cadence has stretched past 2x the 24h interval (50h with 2h slack). Either eventretention.CutoffDays was bumped without authorisation, the ticker goroutine died, or a Postgres connection-pool stall is blocking the next pass. The loop is still pruning rows — but the next scheduled pass is overdue."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAuditRetentionExhaustion.md"

      - alert: FaasAuditRetentionTableGrowingFasterThanPruned
        # The events table is growing faster than the loop prunes.
        # The volume counter claims N inserts/day, but the delete
        # counter is lagging by >100 rows/day over a 24h window.
        # The `> 0` precondition prevents the alert from firing on
        # idle days when deleted_total is flat (the counter is only
        # bumped when deleted > 0 per cleanup.go:205-210). 100
        # rows/day absolute threshold tolerates small fleet
        # variance. Real-world failure modes: long-running
        # transaction pinning row visibility, or events_at_idx
        # bloat making the DELETE slow enough to drift past the
        # 24h interval.
        expr: |
          sum(rate(apid_audit_events_volume_total[24h])) > 0
          and
          (
            sum(rate(apid_audit_events_volume_total[24h]))
            - sum(rate(apid_audit_events_deleted_total[24h]))
            > 100
          )
        for: 6h
        labels:
          severity: warn
          component: apid
          family: audit_retention
        annotations:
          summary: "apid audit-event table growing faster than pruned"
          description: "The events table insert rate (sum across all kind_prefix labels) exceeds the delete rate by >100 rows/day over the rolling 24h window for 6h. The volume counter is updating (loop alive per FaasAuditRetentionLoopStalled); the delete counter is lagging. Drill down via the runbook — two likely causes: long-running transaction on the events table pinning DELETE row visibility, or events_at_idx bloat making the DELETE slow enough to drift past the 24h cadence."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAuditRetentionExhaustion.md"

      # ─────────────────────────────────────────────────────────────────
      # Per-tenant noisy-customer detection (issue #300).
      # The apid_top_tenant_rps{account_id} gauge is a presentation view
      # over the per-account requestTotal counter, bounded at the top-1000
      # by 24h request count with the rest under account_id="other"
      # (ADR-041). This rule fires when any single customer exceeds
      # 500 rps for 10m — the abuse threshold from the issue's literal
      # acceptance list. The aggregation uses `topk(20, ...)` so the
      # account_id label survives Alertmanager routing; the page
      # receiver groups by [alertname, component] so 20 simultaneous
      # offenders collapse into one page with per-account drill-down.
      #
      # The `account_id="other"` row is excluded via the `!=` matcher —
      # the overflow bucket represents demoted customers (not abusive
      # ones), and a non-zero "other" reading means the top-1000 cap is
      # being saturated, which is a separate signal (covered by the
      # snapshot_fleet_avg_mb-style fleet dashboards, not by this rule).
      #
      # Response: rate-limit + notify (docs/ops/tenant-abuse.md
      # §Recover step 1+2). Escalation: suspend deployment (step 3).
      # Severity: warn — abuse, not outage.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasTenantAbuse
        expr: topk(20, max(apid_top_tenant_rps{account_id!="other"}) by (account_id)) > 500
        for: 10m
        labels:
          severity: warn
          component: apid
          family: tenant_abuse
        annotations:
          summary: "Tenant {{ $labels.account_id }} exceeding 500 rps for 10m"
          description: "Customer {{ $labels.account_id }} sustained > 500 rps on apid for 10m. Cross-check gateway_top_tenant_rps for the L7 view, then follow docs/runbooks/tenant-abuse.md §Recover (rate-limit → notify → suspend deployment)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/tenant-abuse.md"

      # ADR-361 decisions 6 and 9: schedd destroyed an instance whose guest
      # reached an egress abuse ceiling in one minute: too many new
      # destinations (fanout: scanning, spraying) or too many flows dropped
      # against single destinations (flood). Abuse from the platform's shared
      # egress address is what got the production project suspended on
      # 2026-09-24, so a single recycle pages.
      - alert: FaasTenantEgressAbuse
        expr: sum by (app, reason) (increase(schedd_egress_abuse_recycles_total{app!=""}[15m])) > 0
        labels:
          severity: warn
          component: schedd
          family: tenant_abuse
        annotations:
          summary: "App {{ $labels.app }} recycled for egress {{ $labels.reason }}"
          description: "schedd destroyed {{ $value }} instance(s) of app {{ $labels.app }} in the last 15m for egress {{ $labels.reason }}: fanout means at least the plan's EgressNewDestinationsPerMinute new destinations in one minute, flood means at least EgressFloodDropsPerMinute new flows dropped against single destinations. Treat it as a likely scan, flood or other abuse from the node's egress address until reviewed."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTenantEgressAbuse.md"

      # ADR-373: a guest looked up a blocklisted name (mining pool or an
      # operator feed entry).
      - alert: FaasGuestDNSBlocked
        expr: sum by (category) (increase(gatewayd_dns_blocked_total[15m])) > 0
        labels:
          severity: warn
          component: gatewayd-internal
          family: tenant_abuse
        annotations:
          summary: "Guest DNS lookup of a blocked {{ $labels.category }} domain"
          description: "The bridge resolver refused {{ $value }} lookup(s) of blocklisted {{ $labels.category }} names in the last 15m. The gatewayd-internal log line 'guest DNS lookup blocked' names the app."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/tenant-abuse.md"

      # ADR-368: imaged refused a deploy whose image carries abuse tooling
      # (a miner, mass scanner or flood tool).
      - alert: FaasImageAbuseBlocked
        expr: sum by (category) (increase(imaged_abuse_scan_findings_total{action="block"}[15m])) > 0
        labels:
          severity: warn
          component: imaged
          family: tenant_abuse
        annotations:
          summary: "Deploy blocked: {{ $labels.category }} tooling in an image"
          description: "imaged failed {{ $value }} deploy finding(s) in the last 15m because the built image matched a blocking ADR-368 rule ({{ $labels.category }}). The deployment.abuse_scan audit event names the account, app, rule and file."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasImageAbuseBlocked.md"

      # ADR-368: an image matched a flag-only rule (pool domain, proxy server).
      - alert: FaasImageAbuseFlagged
        expr: sum by (category) (increase(imaged_abuse_scan_findings_total{action="flag"}[1h])) > 0
        labels:
          severity: warn
          component: imaged
          family: tenant_abuse
        annotations:
          summary: "Image flagged for review: {{ $labels.category }}"
          description: "An image deployed in the last hour matched a flag-only ADR-368 rule ({{ $labels.category }}). The deploy continued; review the deployment.abuse_scan audit event."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasImageAbuseBlocked.md"

      # ADR-361: schedd held an account after repeated egress abuse. The
      # account runs nothing until an operator reviews and releases it.
      - alert: FaasAccountAbuseHold
        expr: sum by (reason) (increase(schedd_account_abuse_holds_total[15m])) > 0
        labels:
          severity: warn
          component: schedd
          family: tenant_abuse
        annotations:
          summary: "Account abuse hold placed ({{ $labels.reason }})"
          description: "schedd placed {{ $value }} account abuse hold(s) in the last 15m. Every workload of the held account is stopped and refused until an operator releases the hold. Review the account's egress before releasing it."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTenantEgressAbuse.md"

      # ─────────────────────────────────────────────────────────────────
      # Daemon liveness — every scrape target should be up.
      # 2m is tight: a single scrape miss (15s) does not trip it; a
      # crashed daemon trips it within one evaluation cycle after restart.
      # alertmanager is included because the page-route notification
      # path depends on it being reachable from Prometheus on loopback;
      # a dead alertmanager means alerts evaluate but never page anyone.
      # schedd-compute is the compute-node schedd job; without it a dead
      # compute schedd only reached FaasComputeMetricsScrapeTargetDown
      # (warn) while a dead compute vmmd paged.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasDaemonDown
        expr: up{job=~"apid|gatewayd|gatewayd-internal|schedd|schedd-compute|vmmd|imaged|builderd|realtimed|outboundd|s3-gatewayd|meterd|githubd|prometheus|alertmanager"} == 0
        for: 2m
        labels:
          severity: page
          component: platform
          family: daemon_liveness
        annotations:
          summary: "Daemon {{ $labels.job }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for 2m. Check systemd status + recent logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDaemonDown.md"

      # A scrape target can be up while the daemon is still warming,
      # dependency-degraded, or draining. Alert on the readiness state
      # separately so an HTTP 200 metrics endpoint is not mistaken for a
      # traffic-safe serving instance. githubd readiness includes its database,
      # GitHub App credentials, and webhook verifier secret; capability
      # discovery uses the same endpoint before advertising GitHub deploys.
      - alert: FaasDaemonNotReady
        expr: |
          apid_daemon_ready{daemon="apid"} == 0
          or gatewayd_public_daemon_ready{daemon="gatewayd-public"} == 0
          or gatewayd_daemon_ready{daemon="gatewayd-internal"} == 0
          or schedd_daemon_ready{daemon="schedd"} == 0
          or vmmd_daemon_ready{daemon="vmmd"} == 0
          or imaged_daemon_ready{daemon="imaged"} == 0
          or builderd_daemon_ready{daemon="builderd"} == 0
          or realtimed_daemon_ready{daemon="realtimed"} == 0
          or outboundd_daemon_ready{daemon="outboundd"} == 0
          or githubd_daemon_ready{daemon="githubd"} == 0
          or s3_gateway_daemon_ready{daemon="s3-gatewayd"} == 0
          or meterd_daemon_ready{daemon="meterd"} == 0
        for: 5m
        labels:
          severity: page
          component: platform
          family: daemon_readiness
        annotations:
          summary: "Daemon {{ $labels.daemon }} is not ready"
          description: "{{ $labels.daemon }} has exposed daemon_ready=0 for 5m. Check its /readyz response and dependency-specific reason before routing traffic or restarting it."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDaemonNotReady.md"

      # ADR-190: a daemon can be up, ready, and not doing any work —
      # the 2026-09-03 schedd prime wedge answered /metrics for ten
      # minutes with its only loop blocked. Every Type=notify daemon
      # now beats a per-loop liveness registry; <daemon>_loop_stalled=1
      # means the beat is older than that loop's budget and the systemd
      # WATCHDOG=1 ping is suspended. systemd restarts the unit after
      # WatchdogSec on its own; this alert exists so the restart is
      # explained, and so a loop that stalls repeatedly is investigated
      # rather than silently cycled.
      - alert: FaasDaemonLoopStalled
        expr: max by (job, instance, loop) ({__name__=~".+_loop_stalled"}) == 1
        for: 30s
        labels:
          severity: warn
          component: platform
          family: daemon_liveness
        annotations:
          summary: "Daemon {{ $labels.job }} loop {{ $labels.loop }} is stalled"
          description: "{{ $labels.job }} has not advanced its '{{ $labels.loop }}' loop within its budget. The systemd watchdog will restart the unit after WatchdogSec; capture goroutine dumps (SIGQUIT) before it does if the stall is new."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDaemonLoopStalled.md"

      # Postgres pool starvation. A cancelled acquire is a caller that
      # gave up waiting for a connection, so unlike the empty-acquire
      # counter it has no warm-up floor and any non-zero rate is real:
      # requests are already timing out on pool contention rather than
      # on any work Postgres is doing. This is the signal that was
      # missing on 2026-09-12, when fsn-1 sat at 96/97 slots with 88 of
      # them idle and the only way to see it was pg_stat_activity on the
      # box. It is also the gate on lowering any pkg/db
      # DaemonMaxConnections entry: a cap may only come down while this
      # is flat at zero for the daemon in question.
      - alert: FaasDBPoolStarved
        expr: sum by (job, instance) (rate({__name__=~".+_db_pool_canceled_acquires_total"}[5m])) > 0
        for: 5m
        labels:
          severity: page
          component: platform
          family: db_pool
        annotations:
          summary: "Daemon {{ $labels.job }} is abandoning Postgres pool acquisitions"
          description: "{{ $labels.job }} has callers giving up while waiting for a pool connection. Compare <daemon>_db_pool_conns against <daemon>_db_pool_max_conns: at the cap, the daemon's DaemonMaxConnections entry is too small for its concurrency; below the cap, connections are being held too long by a slow query or a leaked transaction."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDBPoolStarved.md"

      # ADR-191: rows schedd believes are live that the owning vmmd is
      # not reporting. Each is billing the customer and holding an
      # admission slot. Warn, not page: the sweep ships report-only
      # (FAAS_SCHEDD_RECONCILE_ENFORCE unset), so nothing is being
      # repaired automatically and there is no customer-facing outage to
      # wake someone for — but rows and reality have measurably drifted
      # and someone has to look. Promote to page in the same change that
      # flips enforcement on.
      - alert: FaasInstanceDivergence
        expr: increase(schedd_instance_divergence_total[15m]) > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: instance_divergence
        annotations:
          summary: "schedd sees {{ $value }} instances vmmd does not have"
          description: "Live instance rows were absent from the owning vmmd's telemetry on two consecutive sweeps, outside the startup grace window, on a node that was otherwise reporting. They are being billed and are holding admission slots. Check whether vmmd restarted or the host OOM-killed Firecracker."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInstanceDivergence.md"

      - alert: FaasVMMDGuestReceiverDown
        expr: vmmd_guest_vsock_receiver_up{receiver=~"events|workload_identity"} == 0
        for: 1m
        labels:
          severity: page
          component: vmmd
          family: guest_receiver
        annotations:
          summary: "vmmd guest receiver {{ $labels.receiver }} is unavailable"
          description: "vmmd cannot accept the required {{ $labels.receiver }} channel through a Firecracker per-instance Unix bridge. The node is not traffic-ready until the receiver recovers."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasVMMDGuestReceiverDown.md"

      - alert: FaasWorkloadIdentityNotConfigured
        expr: increase(vmmd_workload_identity_tokens_total{result="not_configured"}[15m]) > 0
        labels:
          severity: warn
          component: vmmd
          family: guest_receiver
        annotations:
          summary: "Apps on {{ $labels.instance }} ask for workload tokens but vmmd has no signing key"
          description: "vmmd answered workload-identity requests with identity_not_configured. Queue-lease consumers, Flags and cloud federation in those apps fail until the cluster workload-identity key is installed (ADR-1141)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasWorkloadIdentityNotConfigured.md"

      - alert: FaasMeterdFleetEgressStreamsMissing
        expr: meterd_fleet_egress_expected_streams > meterd_fleet_egress_connected_streams
        for: 2m
        labels:
          severity: warn
          component: meterd
          family: usage_collection
        annotations:
          summary: "Meterd is missing one or more compute usage streams"
          description: "Meterd's expected active-compute stream count is {{ $value }}, while fewer gateway streams are connected. Request, response-byte, and cold-boot usage remains in each gateway's durable replay ledger until connectivity and persistence recover."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasMeterdFleetEgressStreamsMissing.md"

      # Outbound admission is deliberately reject-first in v1. A sustained
      # rejection rate means an attached application is exhausting the
      # integration's rate, concurrency, or daily request policy; it is a
      # warning rather than a page because this is explicit back-pressure,
      # not a gateway outage.
      - alert: FaasOutboundBudgetSaturated
        expr: sum by (integration_id) (rate(outbound_rejections_total{reason=~"rate_limit|concurrency_limit|daily_request_limit"}[5m])) > 0
        for: 10m
        labels:
          severity: warn
          component: outboundd
          family: outbound_admission
        annotations:
          summary: "Outbound integration {{ $labels.integration_id }} is rejecting requests"
          description: "The shared outbound policy for integration {{ $labels.integration_id }} has rejected requests continuously for 10m. Check rate/concurrency settings, the daily request limit, provider quotas, and the outbound gateway saturation panels before increasing limits."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/outbound-integrations.md"

      - alert: FaasOutboundAdmissionUnavailable
        expr: sum by (integration_id) (rate(outbound_admissions_total{outcome="error"}[5m])) > 0
        for: 5m
        labels:
          severity: page
          component: outboundd
          family: outbound_admission
        annotations:
          summary: "Outbound admission backend is unavailable"
          description: "outboundd has failed closed while admitting integration {{ $labels.integration_id }} for 5m. Check Postgres connectivity, pool saturation, and the outbound_admission_state/leases tables."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/outbound-integrations.md"

      # ADR-998: AI settlement is what makes token and cost caps hard. A
      # failing settlement still returns the provider's answer, so the only
      # sign is this counter: until it recovers, usage, cost and budgets
      # under-count.
      - alert: FaasAIGatewaySettlementFailing
        expr: sum(rate(outbound_ai_usage_record_events_total{event=~"state_error|unavailable"}[10m])) > 0
        for: 10m
        labels:
          severity: page
          component: outboundd
          family: ai_gateway
        annotations:
          summary: "AI gateway usage is not being settled"
          description: "outboundd has failed to record AI usage for 10m. Calls still succeed, but token and cost caps, usage reports and alerts under-count until settlement recovers. Check Postgres for outboundd; close the AI gateway if it does not recover."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAIGateway.md"

      - alert: FaasAIGatewayProviderErrors
        expr: (sum(rate(outbound_ai_requests_total{outcome="error"}[15m])) / sum(rate(outbound_ai_requests_total[15m])) > 0.5) and sum(rate(outbound_ai_requests_total[15m])) > 0.05
        for: 15m
        labels:
          severity: warn
          component: outboundd
          family: ai_gateway
        annotations:
          summary: "Most AI gateway calls are failing at the provider"
          description: "More than half of AI calls returned provider errors for 15m. Check provider status, key pool cooldowns and circuit breaker events before suspecting the gateway."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAIGateway.md"

      # A rollout should converge to one daemon release. This catches a
      # partial deploy where systemd is healthy and readiness is green, but
      # different hosts (or different daemons on one host) are serving
      # incompatible code. The canonical rollout owns a bounded convergence
      # window; public status must show the mixed fleet while that gate runs.
      # Per-unit control-plane releases stamp unit-<commit> versions and are
      # deliberately mixed with their base release until the next full one
      # (docs/adr/1650-per-unit-control-plane-releases.md); the unit lane
      # gates each restarted daemon itself, so they are left out here.
      - alert: FaasDeployVersionSkew
        expr: count(count by (version) ({__name__=~".*_faas_deploy_version", version!~"unit-.+"})) > 1
        labels:
          severity: warn
          component: platform
          family: daemon_lifecycle
        annotations:
          summary: "Fleet is running multiple daemon release versions"
          description: "More than one faas_deploy_version is visible. Check daemon_build_info by instance and version, then complete or roll back the failed deployment before traffic remains split across releases."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDeployVersionSkew.md"

      # Long-lived processes are not automatically unhealthy, but a daemon
      # above this threshold has likely missed at least one planned rollout.
      # Keep this a warning: operators may intentionally defer a restart while
      # investigating a release or capacity event.
      - alert: FaasDaemonUptimeStale
        expr: max by (daemon, instance) ({__name__=~".*_daemon_uptime_seconds"}) > 604800
        for: 1h
        labels:
          severity: warn
          component: platform
          family: daemon_lifecycle
        annotations:
          summary: "Daemon {{ $labels.daemon }} has stale uptime"
          description: "{{ $labels.daemon }} on {{ $labels.instance }} has been running for more than 7 days. Verify its deployed build identity and include the host in the next controlled rollout."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDaemonUptimeStale.md"

      # The archive shipper is intentionally best-effort and does not take a
      # daemon down when S3 is unavailable. Match both the control-plane apid
      # shipper and the compute-side vmmd producer/shipper.
      - alert: FaasLogArchiveShipperDegraded
        expr: |
          sum(rate({__name__=~"^(apid|vmmd)_log_archive_failures_total$"}[5m])) > 0
          or (
            sum({__name__=~"^(apid|vmmd)_log_archive_local_bytes$"}) > 0
            and sum(rate({__name__=~"^(apid|vmmd)_log_archive_files_uploaded_total$",status="ok"}[30m])) == 0
          )
        for: 10m
        labels:
          severity: warn
          component: platform
          family: log_archive
        annotations:
          summary: "Log archive shipper is not making progress"
          description: "The apid or vmmd log archive shipper has recorded failures or has pending local spool data without a successful upload for 30m. Check failure reasons, S3 credentials, bucket reachability, and the local spool."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLogArchiveShipperDegraded.md"

      - alert: FaasLogArchiveSpoolNearCap
        expr: |
          sum({__name__=~"^(apid|vmmd)_log_archive_local_bytes$"})
            / sum({__name__=~"^(apid|vmmd)_log_archive_local_bytes_max$"}) > 0.8
        for: 15m
        labels:
          severity: warn
          component: platform
          family: log_archive
        annotations:
          summary: "Log archive local spool is above 80% capacity"
          description: "The apid or vmmd log archive spool has exceeded 80% of its configured capacity for 15m. Resolve the bucket or credentials outage before new archive lines are dropped."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasLogArchiveShipperDegraded.md"

      # ─────────────────────────────────────────────────────────────────
      # Resident GB per paying customer (meterd / metrics endpoint)
      # Spec §12 row: "resident GB per paying customer | 0.305 (=312 MB) | > 0.45 warn".
      # ADR-031 splits the metric by plan so an operator can see which
      # segment is migrating toward the §12 page threshold (0.45). The
      # alert fans out per-plan via {{ $labels.plan }}; the alertmanager
      # inhibit rule groups on family=residency so a per-plan page-tier
      # crossing suppresses any per-plan warn on the same group.
      #
      # Plan label is the canonical api.Plan string (free|hobby|pro|scale)
      # emitted by meterd's Residency tick (pkg/meter/residency.go).
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasResidentGbPerCustomerHigh
        expr: max by (plan) (meterd_resident_gb_per_customer) > 0.45
        for: 1h
        labels:
          severity: warn
          component: meterd
          family: residency
          # Economic density signal for operators. Resource saturation and
          # request-path alerts report customer-visible degradation separately.
          public_status: internal
        annotations:
          summary: "Resident GB per paying customer > 0.45 (plan {{ $labels.plan }})"
          description: "Plan {{ $labels.plan }} has been above the §12 threshold (0.45 average resident GB / paying customer) for 1h. Spec target is 0.305. Cross-check FaasHighResidentRamPct — fleet RAM pressure is the usual upstream cause."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasResidentGbPerCustomerHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # Traffic anomaly (issue #303, ADR-039). The 3d baseline rolls up
      # in the faas_anomaly_baseline group above; the alerts below
      # compare the recording rules and the per-account in-line ratio.
      # Thresholds (3x / 10x spike, 0.2x / 0.1x drop, for: 10m / 15m /
      # 15m / 30m) are ADR-039 decisions; the per-account rules use
      # higher thresholds and longer `for:` to suppress per-customer
      # noise. account_id="__other__" is the bounded overflow bucket
      # (issue #278) — drill-down on it means the customer is past the
      # 10k admission cap and the operator must check the daemon slog.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasTrafficSpike
        expr: |
          (faas_apid_request_rate_ratio:by_route > 3)
          and on (route)
          (faas_apid_request_rate_5m:by_route > 1)
        for: 10m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: fleet
          direction: spike
        annotations:
          summary: "Traffic > 3x 3-day baseline (route {{ $labels.route }})"
          description: "Route {{ $labels.route }} has been above 3x its 3d trailing average and 1 request/second for 10m. DDoS, runaway retry storm, or upstream restore surge are the canonical causes. Drill down to the per-account level via the dedicated panel or sum by (account_id) (rate(apid_request_total[5m]))."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      - alert: FaasTrafficDrop
        expr: |
          (faas_apid_request_rate_ratio:by_route < 0.2)
          and
          (faas_apid_request_rate_5m:by_route > 0.1)
        for: 15m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: fleet
          direction: drop
        annotations:
          summary: "Traffic < 0.2x 3-day baseline (route {{ $labels.route }})"
          description: "Route {{ $labels.route }} has been below 20% of its 3d trailing average for 15m while still handling > 0.1 rps (so it's not idle). Upstream outage, misdeploy, or auth fault are the canonical causes. Cross-check FaasApiAvailabilityLow — sustained 5xx is the usual upstream cause."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      - alert: FaasTrafficSpikeAccount
        expr: |
          faas_apid_anomaly_score:by_account > 10
        for: 15m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: account
          direction: spike
        annotations:
          summary: "Account {{ $labels.account_id }} traffic > 10x its 3d average"
          description: "Customer {{ $labels.account_id }} has been above 10x its 3d trailing average for 15m. Higher threshold than fleet-wide to suppress per-customer noise. account_id=\"__other__\" is the bounded overflow bucket (issue #278) — drill-down on it means the customer is past the 10k admission cap."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      - alert: FaasTrafficDropAccount
        expr: |
          faas_apid_anomaly_score:by_account < 0.1
          and on (account_id)
          faas_apid_request_rate_5m:by_account > 0.1
        for: 30m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: account
          direction: drop
        annotations:
          summary: "Account {{ $labels.account_id }} traffic < 0.1x its 3d average"
          description: "Customer {{ $labels.account_id }} has been below 10% of its 3d trailing average for 30m. Longer `for:` than the spike rule because quiet customers are common and 30m crosses a real outage from a normal lull. account_id=\"__other__\" is the bounded overflow bucket (issue #278) — drill-down on it means the customer is past the 10k admission cap."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      # Platform-wide traffic drift (issue #303 follow-up). Fires when
      # 10+ accounts simultaneously cross 2.0x their 3d baseline —
      # the literal acceptance criterion from the issue body. The
      # `unless on (account_id)` clause excludes the __other__ overflow
      # bucket so the count only includes real customer ids; if many
      # customers pile up at the admission cap, the alert fires on the
      # admitted ones only and the operator follows the per-account
      # drill-down to find the overflow.
      - alert: FaasTrafficAnomaly
        expr: |
          (
            count(
              faas_apid_anomaly_score:by_account > 2
            )
            unless on (account_id)
            faas_apid_anomaly_score:by_account{account_id="__other__"}
          ) >= 10
        for: 10m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: platform
          direction: drift
        annotations:
          summary: "{{ $value }} accounts simultaneously crossed 2x 3d baseline"
          description: "Platform-wide traffic drift: {{ $value }} accounts are above 2x their 3d trailing average for 10m. Indicates either coordinated customer behavior (rare), a global scan/burst, or a misconfigured dashboard / refresh loop. Drill-down via the 'Anomaly spikes (last 7d)' panel (id 90 on faas-fleet-m8) for the top-20 accounts by peak anomaly score."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      # Error-rate spike / drop (ADR-039 §Open follow-ups). The recording
      # rules (faas_apid_error_rate_5m:by_route, _3d_baseline, _ratio)
      # already existed from PR #336; the alert blocks are the missing
      # piece. Thresholds (2x spike, 0.5x drop) are deliberately tighter
      # than the request-rate counterparts (3x / 0.2x) because error-rate
      # is more sensitive — a small absolute spike in 5xx is a larger
      # signal than a small absolute spike in 2xx traffic.
      - alert: FaasErrorRateSpike
        # The recording rules exclude anonymous traffic on every route. Public
        # probes and failed auth attempts are security telemetry, not evidence
        # that an authenticated customer-facing API route has regressed.
        expr: faas_apid_error_rate_ratio:by_route{route!="unmatched"} > 2
        for: 10m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: fleet
          direction: spike
          metric: error_rate
        annotations:
          summary: "Error rate > 2x 3-day baseline (route {{ $labels.route }})"
          description: "Route {{ $labels.route }} has had its error rate above 2x its 3d trailing average for 10m. Cross-check apid_request_failures_total{account_id,route,code} for the per-account view. Common causes: upstream dependency (Postgres, Stripe, Paddle) starting to 5xx, customer-deploy regression, or auth-secret rotation that produced a wave of 401s."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      - alert: FaasErrorRateDrop
        expr: |
          (faas_apid_error_rate_ratio:by_route{route!="unmatched"} < 0.5)
          and
          (faas_apid_error_rate_5m:by_route{route!="unmatched"} > 0.001)
        for: 15m
        labels:
          severity: warn
          component: apid
          family: traffic_anomaly
          mode: fleet
          direction: drop
          metric: error_rate
        annotations:
          summary: "Error rate < 0.5x 3-day baseline (route {{ $labels.route }})"
          description: "Route {{ $labels.route }} has had its error rate below 50% of its 3d trailing average for 15m while still handling > 0.001 err/s (so it's not idle). Common causes: customer rolled back a misconfigured deploy, scanner traffic stopped, or upstream patch fixed an outage. The `> 0.001 err/s` guard prevents the rule from firing on routes that simply had no recent failures (the baseline would be ~0 and the ratio undefined)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTrafficAnomaly.md"

      # ─────────────────────────────────────────────────────────────────
      # TLS cert expiry (gatewayd-public / gateway_tls_cert_expiry_seconds).
      # ADR-024 H3 closure: page at ≤14 days, warn between 14 and 30.
      # The gauge carries min(notAfter − now) across cached certs on
      # cfg.StorageDir/certificates/...; first-mint pre-boot state is
      # +Inf (the gauge default), which legitimately fails the < 14d
      # comparator. Operators expect a missing cert at startup, not a
      # page.
      #
      # The gauge is ticked every 5 minutes by
      # pkg/gateway.StartCertExpiryRefresher; a stale gauge would mean
      # the refresher goroutine died (visible as gateway_tls_cert_expiry_seconds
      # not changing for > 6m — separate drift signal, not in this rule).
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasTLSCertExpiryPage
        expr: gateway_tls_cert_expiry_seconds < (14 * 86400)
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: tls_cert_expiry
        annotations:
          summary: "TLS cert expires in ≤14 days"
          description: "The smallest remaining lifetime across cached certs is below 14 days. A renewal has failed (or never ran) — HTTPS serving across the box will start failing within hours. Re-run `make bootstrap` on the EX44 to refresh certmagic + the Hetzner DNS-01 token, then force-renew via `faas cert refresh`."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryPage.md"

      # ADR-1236: the 14-day alert above is warn; this is the page, sized
      # so a failed renewal still leaves time to issue by hand.
      - alert: FaasTLSCertExpiryImminent
        expr: gateway_tls_cert_expiry_seconds < (3 * 86400)
        for: 5m
        labels:
          severity: page
          component: gatewayd-public
          family: tls_cert_expiry
        annotations:
          summary: "TLS cert expires in under 72 hours"
          description: "The smallest remaining lifetime across cached certs is below 72 hours, so renewal has failed for at least eleven days. HTTPS for the affected hosts fails when the cert expires; renew it now."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryPage.md"

      - alert: FaasTLSCertExpiryWarn
        expr: gateway_tls_cert_expiry_seconds < (30 * 86400) and gateway_tls_cert_expiry_seconds >= (14 * 86400)
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: tls_cert_expiry
        annotations:
          summary: "TLS cert expiry < 30 days"
          description: "Smallest remaining lifetime is between 14 and 30 days. Renewals normally fire at 30d; verify certmagic's renew-loop is alive (a log line every few minutes post-first-mint) and that the Hetzner DNS-01 token still has zone-write permission on the apps domain."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryWarn.md"

      # ─────────────────────────────────────────────────────────────────
      # Per-host TLS cert expiry (Finding 2 / ADR-024 H3 follow-up).
      # The aggregate rule above covers the box-level signal; these
      # rules attach a hostname + kind label so the alert routes to
      # the right custom domain. `hostname!="__other__"` excludes the
      # bounded-admission overflow (an admission overflow means we've
      # run past hostnameLabelSetCap and don't have a real host name
      # to attribute). `kind!="unknown"` excludes misclassifications
      # so an issuer-key wiring bug doesn't page.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasTLSCertExpiryPageByHost
        expr: gateway_tls_cert_expiry_by_host_seconds{hostname!="__other__",kind!="unknown"} < (14 * 86400)
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: tls_cert_expiry
          hostname: "{{ $labels.hostname }}"
          kind: "{{ $labels.kind }}"
        annotations:
          summary: "TLS cert for {{ $labels.hostname }} expires in ≤14 days"
          description: "Per-host cert expiry below 14 days. kind={{ $labels.kind }} tells you whether the wildcard (DNS-01) or an on-demand (HTTP-01) cert is affected — wildcard renewals auto-recover via DNS-01; on-demand renewals need the customer to keep the custom_domains row active and the HTTP-01 challenge endpoint reachable. Verify certmagic's renew-loop for this host (check the slog for {{ $labels.hostname }} renew lines)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryPageByHost.md"

      - alert: FaasTLSCertExpiryWarnByHost
        expr: gateway_tls_cert_expiry_by_host_seconds{hostname!="__other__",kind!="unknown"} < (30 * 86400) and gateway_tls_cert_expiry_by_host_seconds{hostname!="__other__",kind!="unknown"} >= (14 * 86400)
        for: 10m
        labels:
          severity: warn
          component: gatewayd-public
          family: tls_cert_expiry
          hostname: "{{ $labels.hostname }}"
          kind: "{{ $labels.kind }}"
        annotations:
          summary: "TLS cert for {{ $labels.hostname }} expiry < 30 days"
          description: "Per-host cert expiry is between 14 and 30 days. Renewals normally fire at 30d; if no renew log line surfaces for this host within the next 12h, force-renew via `faas cert refresh --host={{ $labels.hostname }}`."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryWarnByHost.md"

      # ─────────────────────────────────────────────────────────────────
      # Cert-expiry refresher walk-completeness (Finding 2). The
      # refresher ticks this counter every interval; `partial`
      # means a filesystem blip cut the walk short. A persistent
      # partial is the "refresher silently failing" signal —
      # operators should investigate BEFORE certs actually expire,
      # rather than waiting for the gauge to drift.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasTLSCertExpiryRefresherPartial
        expr: increase(gateway_tls_cert_expiry_refresher_walk_complete_total{result="partial"}[1h]) > 0
        for: 15m
        labels:
          severity: warn
          component: gatewayd-public
          family: tls_cert_expiry
        annotations:
          summary: "Cert-expiry refresher walk was partial"
          description: "At least one tick in the last hour completed with a partial walk result — the refresher either saw a subtree disappear mid-walk (concurrent certmagic renewal — usually benign) or hit a filesystem error. If the partial persists across multiple ticks, the cert-expiry gauges will stop refreshing and the §12 alerts will go stale. Check `/var/lib/faas/certs/certificates/` permissions and the legacy `faas-gatewayd` slog for `cert expiry walk was partial` Warn lines. PR #633 stripped certmagic from `gatewayd-public`; this alert is legacy-daemon-only and will be removed with the certsync sweep (PR-C)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryPage.md"

      # ─────────────────────────────────────────────────────────────────
      # On-demand cert mint denial rate
      # (gatewayd-public / gateway_tls_on_demand_denied_total{reason}).
      # ADR-024 H3 closure: spec §11 abuse-vector observability — a
      # non-zero rate of denials (sum across the reason label set) is the
      # signal that someone is probing :443 for unowned SNIs. The
      # closed `reason` set is {allowlist, dns01, token}; today only
      # `allowlist` is wire-incremented (the DecisionFunc hook in
      # tls_wire.go). The series for `dns01` and `token` are
      # pre-instantiated at 0 so a frozen-zero is visible as the
      # ADR-024 H3.b follow-up signal.
      #
      # Threshold: > 1/min (i.e. > 1/60 per-second on a 5m rate) for 5m.
      # Sustained probes (scanners, hijackers) fire many requests/sec;
      # the threshold is intentionally a hair above zero so a single
      # misconfigured cron-job probe pages rather than hides.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasTLSOnDemandDeniedHigh
        expr: sum(rate(gateway_tls_on_demand_denied_total[5m])) > (1 / 60)
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: tls_on_demand_denied
        annotations:
          summary: "On-demand TLS denials > 1/min"
          description: "The denials counter is climbing above 1/min over the rolling 5-minute window. Cross-check reason breakdown via `sum by (reason) (rate(gateway_tls_on_demand_denied_total[5m]))` — an allowlist spike means external scanners hitting :443; a frozen-zero on dns01 or token means the H3.b wire-incrementation follow-up is still pending."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSOnDemandDeniedHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # Per-account gateway rate-limit rejections
      # (gatewayd-internal / gateway_per_account_rate_limited_total{account_id, plan}).
      # ADR-040 / issue #292 — defends against a botnet rotating across a
      # single customer's many apps (each app stays under per-app rps, but
      # the sum easily blows past the account's plan budget).
      #
      # Threshold: > 300/min fleet-total for 5m. This matches the
      # smallest plan's account allowance and signals sustained customer
      # throttling that needs operator review. The §12
      # dashboard's per-account drill-down pinpoints the offender; the
      # `__other__` row in the exposition is the bounded admission
      # overflow bucket (pre-instantiated at zero so a series with no
      # traffic is visible).
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasPerAccountRateLimitSpike
        expr: sum(rate(gateway_per_account_rate_limited_total[5m])) > (300 / 60)
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: per_account_rate_limit
        annotations:
          summary: "Per-account gateway rejections above 300/min (fleet)"
          description: "Fleet-wide per-account gateway rate-limit rejections have exceeded 300/min over the rolling 5-minute window for 5m. account_id=\"__other__\" is the bounded admission overflow bucket — drill down per-account via `topk(20, sum by (account_id, plan) (rate(gateway_per_account_rate_limited_total[5m])))`. Common causes: single customer burst (misdeploy / runaway retry), coordinated abuse (scanners rotating across an account's apps), or a config-driven throttling regression (plan row dropped to zero)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPerAccountRateLimitSpike.md"

      # ─────────────────────────────────────────────────────────────────
      # Failed-login spike (issue #286, SOC 2 CC7.2). Threshold:
      # 20 failed logins per minute from a single IP for 5 minutes —
      # the canonical credential-stuffing pattern. Severity `warn`
      # because the auth-limit bucket is shedding the burst at the
      # middleware layer (the customer-facing 401 still returns
      # normally); the alert is the visibility for SOC 2 evidence
      # that the attack is being observed, not an outage signal.
      #
      # `ip` is bounded by ipLabelSet (maxIPLabelValues = 10_000,
      # pkg/wire/metrics.go). Overflow collapses to ip="__other__"
      # so a multi-IP botnet sweep rolls up into one bucket — drill
      # into the audit rows for the per-IP attribution.
      #
      # Companion counter: apid_failed_login_audit_dropped_total —
      # a non-zero rate means the audit flusher is the bottleneck
      # under the burst AND the channel is full. The auth response
      # is unaffected (the drop is non-blocking) but the audit rows
      # are missing.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasFailedLoginSpike
        expr: sum by (ip) (rate(apid_failed_login_total[5m])) > (20 / 60)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: security_anomaly
        annotations:
          summary: "Failed-login rate > 20/min from {{ $labels.ip }} for 5m"
          description: "Failed logins from {{ $labels.ip }} exceeded 20/min over the rolling 5-minute window for 5m — the canonical credential-stuffing pattern. ip=\"__other__\" is the bounded admission overflow bucket (pkg/wire/metrics.go::maxIPLabelValues = 10_000); a single ip=\"__other__\" alert means the source IPs are past the admission cap — drill-down via the audit rows. SOC 2 CC7.2 evidence: select count(*) from events where kind = 'auth.login.failed' and at > now() - interval '5 minutes' group by data->>'ip_hash'. Companion: apid_failed_login_audit_dropped_total rising means the audit flusher is the bottleneck."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFailedLoginSpike.md"

      # ─────────────────────────────────────────────────────────────────
      # Per-plan CPU starvation (issue #301, ADR-044).
      # Source: vmmd_cpu_throttle_ratio{slice} gauge (NOT
      # node_cpu_cgroup_throttled_seconds_total — that one is the
      # kernel counter without a usage denominator). The gauge is
      # computed inside vmmd as throttle_delta / (throttle_delta +
      # usage_delta) over the per-tick 5m window and labelled by the
      # per-plan cgroup sub-slice (tenant-free|tenant-hobby|tenant-pro|
      # tenant-scale). The slice label is the alert's fan-out key;
      # Alertmanager groups by [alertname, slice] so a single plan
      # starving fires one page with the slice in the summary.
      #
      # Threshold: > 80% throttle ratio for 5m — literal from the
      # issue. The 5m window debounces a single hot-loop arrival
      # (one tenant scales up → ratio spikes for 30s → falls) while
      # still paging on a sustained saturation event. Severity: warn
      # because CPU starvation ≠ customer action failing (the
      # cgroup's cpu.max just caps their slice); the response is
      # operator-side capacity work, not a customer-facing outage.
      #
      # Response cascade (docs/ops/FaasCpuStarvation.md §Recover):
      # top-N panel → plan raise for the customer → consider
      # faas-tenant slice CPUQuota bump (1600% = 16 cores). Memory
      # is NOT in scope — the per-VM memory.max is enforced by
      # vmmd via the jailer (spec §11/G6); a starved VM is a CPU
      # signal, not a RAM one.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasCpuStarvation
        expr: vmmd_cpu_throttle_ratio{slice=~"tenant-.*"} > 0.8
        for: 5m
        labels:
          severity: warn
          component: vmmd
          family: cpu_starvation
        annotations:
          summary: "Tenant slice {{ $labels.slice }} throttled > 80% for 5m"
          description: "Plan sub-slice {{ $labels.slice }} has been > 80% throttled over the rolling 5-minute window for 5m (issue #301 / ADR-044). The cpu.max quota for that plan is saturated; quiescent workloads are preempted. Cross-check the top-throttled-apps Grafana panel for which (account_id, app_id) is the dominant offender, then follow docs/runbooks/FaasCpuStarvation.md §Recover."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCpuStarvation.md"

      # ─────────────────────────────────────────────────────────────────
      # githubd path-filter posture (issue #432 phase 5 follow-up /
      # ADR-050 §109). The counter githubd_path_filter_total{mode}
      # ticks once per inbound push webhook. After the path-filter
      # default flip the optimistic mode is `paths`; `full_fallback`
      # only fires on empty-before pushes (legitimate), `truncated`
      # only on big-diffs (legitimate + rebuild-all per ADR-050),
      # and `error` / `breaker_open` only when the compare API itself
      # fails or the GitHub App credentials are missing. Operators
      # should investigate a sustained `error` or `breaker_open`
      # because every push in those modes rebuilds every touched
      # app — the conservative posture that defeats the path-filter
      # efficiency win.
      #
      # family=path_filter so alertmanager inhibits the warn-tier
      # email when the page-tier fires (alertnames differ).
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasGithubdPathFilterDegraded
        expr: sum(rate(githubd_path_filter_total{mode=~"error|breaker_open"}[5m])) > 0
        for: 10m
        labels:
          severity: warn
          component: githubd
          family: path_filter
        annotations:
          summary: "githubd path-filter degraded — credentials missing or compare API unreachable"
          description: "githubd_path_filter_total{mode=error|breaker_open} has been ticking for 10m. mode=error fires when the GitHub App credentials are not provisioned (cmd/githubd wires NewUnavailableChangedFiles as the stub) or when the GitHub compare API returned a transport / non-2xx error. mode=breaker_open fires after 3 consecutive errors trip the breaker (pkg/githubd/changedfiles.go). Either way every push rebuilds every touched app — the conservative posture defeats the path-filter efficiency win. Verify: 1) FAAS_GITHUB_APP_ID + FAAS_GITHUB_APP_KEY_PATH point at a valid App + key; 2) outbound api.github.com is reachable; 3) the App installation hasn't been revoked. Runbook: docs/ops/FaasGithubdPathFilterDegraded.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGithubdPathFilterDegraded.md"

      # ─────────────────────────────────────────────────────────────────
      # ADR-093 — wildcard-route detector
      # ─────────────────────────────────────────────────────────────────
      #
      # The per-route observability surface bounds each app at 50
      # distinct real routes; further routes collapse to the
      # __route_other__ overflow bucket (ADR-093 D2). A sustained
      # spike on __route_other__ for a single (app, route) tuple is
      # the canonical "this app is now serving a wildcard path
      # pattern (e.g. /users/{uuid}) — the per-route series is
      # collapsing because distinct path count > 50" signal.
      #
      # Severity is info (not warn/page) — the customer app still
      # serves correctly; we just stopped distinguishing routes
      # for them. Operators should treat a sustained spike as
      # "either the customer added a wildcard route OR something
      # is path-fuzzing their app".
      - alert: GatewayWildcardRoute
        expr: |
          sum by (app, route) (rate(gateway_requests_by_route_total{route="__route_other__"}[5m])) > 1
        for: 10m
        labels:
          severity: info
          component: gatewayd-internal
          family: route_metrics
        annotations:
          summary: "App {{ $labels.app }} sustained in __route_other__ overflow for 10m"
          description: "gateway_requests_by_route_total{route=__route_other__, app={{ $labels.app }}} has been above 1 reqps for 10m. The bounded admission set (50 routes + the __route_other__ bucket, ADR-093 D2) is collapsing distinct paths because the app is generating more than 50 distinct routes. Two interpretations: (1) the customer deployed a wildcard route pattern (/users/{uuid}) and the per-route breakdown is intentionally collapsing; (2) the app is being path-fuzzed. Runbook: docs/ops/GatewayWildcardRoute.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/GatewayWildcardRoute.md"

      - alert: FaasGithubdPathFilterDegradedWarn
        expr: sum(rate(githubd_path_filter_total{mode=~"error|breaker_open"}[5m])) > 0
        for: 5m
        labels:
          severity: warn
          component: githubd
          family: path_filter
        annotations:
          summary: "githubd path-filter degraded (warn-tier) — investigate before page"
          description: "githubd_path_filter_total{mode=error|breaker_open} has been ticking for 5m. The page-tier alert (FaasGithubdPathFilterDegraded) fires at 10m; this warn-tier gives you a head start. Run the verify steps in the runbook before the page lands."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGithubdPathFilterDegraded.md"

      - alert: FaasGithubWebhookDeliveryDead
        expr: githubd_recovery_queue_items{queue="webhook_delivery",status="dead"} > 0
        for: 5m
        labels:
          severity: warn
          component: githubd
          family: github_recovery
        annotations:
          summary: "githubd has dead webhook deliveries"
          description: "At least one authenticated GitHub delivery exhausted its retry budget, so customer deployment work may be missing. Inspect and retry with gregalectl github status / retry-delivery."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGithubRecoveryQueue.md"

      - alert: FaasGithubCheckUpdateDead
        expr: githubd_recovery_queue_items{queue="check_update",status="dead"} > 0
        for: 10m
        labels:
          severity: warn
          component: githubd
          family: github_recovery
        annotations:
          summary: "githubd has dead Check Run updates"
          description: "At least one GitHub Check Run projection exhausted its retry budget. Deployments continue, but customer GitHub status may be stale. Inspect and retry with gregalectl github status / retry-check."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGithubRecoveryQueue.md"

      - alert: FaasGithubRecoveryQueueStalled
        expr: githubd_recovery_oldest_actionable_seconds{status=~"pending|processing"} > 900
        for: 5m
        labels:
          severity: warn
          component: githubd
          family: github_recovery
        annotations:
          summary: "githubd {{ $labels.queue }} queue has stalled"
          description: "The oldest {{ $labels.status }} item has been actionable for more than 15 minutes. Check githubd/apid reachability and GitHub API health before manually retrying dead work."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGithubRecoveryQueue.md"

      - alert: FaasGithubRecoveryMetricsFailed
        expr: githubd_recovery_collect_error == 1
        for: 5m
        labels:
          severity: warn
          component: githubd
          family: github_recovery
        annotations:
          summary: "githubd cannot inspect its durable recovery queues"
          description: "The recovery collector cannot query Postgres, so dead or stalled GitHub work may be hidden. Check database reachability and confirm the github_check_updates migration is applied."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGithubRecoveryQueue.md"

  # Billing drift detector (ADR-049 §B.1). The reconciler
  # (pkg/billing/reconciler) computes abs(local-pushed) / max(local,
  # pushed) over a rolling window per (account, provider) and
  # exposes it as meterd_billing_drift_ratio. > 0.5% for an hour
  # pages — Stripe / Paddle pushes are not silently dropping
  # without an operator noticing.
  - name: faas_billing
    interval: 60s
    rules:
      - alert: BillingDrift
        expr: max by (provider) (meterd_billing_drift_ratio) > 0.005
        for: 1h
        labels:
          severity: warn
          component: meterd
          family: billing_drift
          public_status: internal
        annotations:
          summary: "Provider {{ $labels.provider }} push drift > 0.5% for 1h"
          description: "Provider push totals are diverging from local usage_minutes totals by more than 0.5% for an hour (ADR-049 §B.1). Revenue leakage if local > pushed, refund liability if pushed > local. The meterd_billing_drift_mb_seconds{account_id=…} gauge identifies the offending account. Run `faas admin reconcile --verbose` to inspect, or page the on-call."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/BillingDrift.md"
      - alert: BillingDriftAccount
        expr: meterd_billing_drift_ratio > 0.05
        for: 15m
        labels:
          severity: warn
          component: meterd
          family: billing_drift
          public_status: internal
        annotations:
          summary: "Account {{ $labels.account_id }} drift > 5% for 15m"
          description: "Single-account drift exceeds 5% for 15m (ADR-049 §B.1). The 1h provider-aggregate BillingDrift alert may not fire for a single account if other accounts are quiet. Inspect the meterd_billing_drift_mb_seconds{account_id=…} gauge and the active provider's usage summary for the affected subscription to confirm the gap."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/BillingDrift.md"
      - alert: BillingReconcileFailures
        expr: sum by (provider) (rate(meterd_billing_drift_reconcile_failures_total[10m])) > 0
        for: 10m
        labels:
          severity: warn
          component: meterd
          family: billing_drift
          public_status: internal
        annotations:
          summary: "Billing reconciliation is failing for {{ $labels.provider }}"
          description: "meterd cannot refresh provider-vs-local billing drift for provider {{ $labels.provider }}. The drift gauges may be stale even when they are below threshold; inspect meterd logs and the reason-labelled meterd_billing_drift_reconcile_failures_total counter."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/BillingDrift.md"
      - alert: BillingReconciliationUnavailable
        expr: meterd_billing_mode_enabled == 1 and on(provider) meterd_billing_reconcile_supported == 0
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: billing_drift
          public_status: internal
        annotations:
          summary: "Billing reconciliation is unavailable for {{ $labels.provider }}"
          description: "Live billing is enabled but the active provider does not expose a usable reconciliation surface, so provider-vs-local billing drift cannot be measured. Treat drift gauges as unknown until the provider configuration is corrected."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/BillingDrift.md"

      # ─────────────────────────────────────────────────────────────────
      # ADR-120 Tier A1: domain doctor staleness alerts.
      #
      # The dns_poller increments domain_doctor_cycles_total after each
      # bounded 30 s cycle. The counter is the heartbeat: unlike a gauge's
      # Prometheus scrape timestamp, it cannot look fresh while the producer
      # is stalled. oldest_observation_seconds measures customer-data age.
      #
      # Three threshold rules — stalled (page), stretched (warn),
      # disabled-by-operator (info, no page) — mirror the
      # FaasAuditRetentionLoopStalled / Stretched shape at
      # lines 413-448 above. The disabled rule is the new
      # addition; the audit retention family has no equivalent
      # because eventretention has no dark-launch flag.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasDomainDoctorStalled
        expr: absent(apid_domain_doctor_cycles_total{outcome="success"}) or sum(increase(apid_domain_doctor_cycles_total{outcome="success"}[5m])) < 1
        for: 10m
        labels:
          severity: warn
          component: apid
          family: domain_doctor
        annotations:
          summary: "apid domain doctor has no successful cycles"
          description: "The dns_poller has not completed a successful bounded doctor cycle for at least 10m. Check the error and timeout outcome counters, apid logs, and Postgres connectivity; customer domain observations are no longer being refreshed."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDomainDoctorStalled.md"

      - alert: FaasDomainVerificationStalled
        expr: absent(apid_domain_verification_last_success_unixtime) or apid_domain_verification_last_success_unixtime == 0 or (apid_domain_verification_backlog > 0 and time() - apid_domain_verification_last_success_unixtime > 120)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: domain_verification
        annotations:
          summary: "custom-domain verification loop is absent or stalled"
          description: "Pending custom domains are not being processed. Check backlog, oldest-due age, cycle results, and Postgres connectivity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDomainDoctorStalled.md"

      - alert: FaasDomainDoctorStretched
        # Ten successful cycles are expected in five minutes. Warn only after
        # a sustained drop below eight, which tolerates two slow or missed
        # cycles while still detecting a worker that cannot keep its cadence.
        expr: sum(increase(apid_domain_doctor_cycles_total{outcome="success"}[5m])) < 8
        for: 10m
        labels:
          severity: warn
          component: apid
          family: domain_doctor
        annotations:
          summary: "apid domain doctor cadence is below target"
          description: "The dns_poller completed fewer than eight successful cycles in five minutes for 10m. Check timeout/error outcomes, batch size, DNS resolver latency, and Postgres pool pressure."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDomainDoctorStalled.md"

      - alert: FaasDomainDoctorDisabledByOperator
        # The operator has set FAAS_DOMAIN_DOCTOR_ENABLED=false
        # (or another explicit-off token: 0/no/off). The skipped
        # counter apid_domain_doctor_skipped_flag_disabled_total
        # is bumping, but the doctor is silently off — surface
        # this as an info annotation so a customer "why is my
        # doctor not running?" ticket can be triaged without
        # paging on-call. The 1h window covers a deliberate
        # rollback window without firing on a 5-min blip.
        expr: rate(apid_domain_doctor_skipped_flag_disabled_total[5m]) > 0
        for: 1h
        labels:
          severity: info
          component: apid
          family: domain_doctor
        annotations:
          summary: "apid domain doctor disabled via FAAS_DOMAIN_DOCTOR_ENABLED"
          description: "The dns_poller is skipping every doctor pass because FAAS_DOMAIN_DOCTOR_ENABLED is set to a falsy value on this apid host. Customers will see `gregale domains doctor` return 503 doctor_disabled. This is an operator choice (issue #986 dark-launch default-off pre-Tier-A3; the post-Tier-A3 default is on). To re-enable, unset the env var (or set it to 1/true/yes/on) and bounce the apid."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDomainDoctorStalled.md"

      # ─────────────────────────────────────────────────────────────────
      # Cold-boot ratio SLO (issue #1059 / ADR-127).
      # The wake-economics curve saturates once cold-boot crosses 30 %
      # on the §6.2 budget (47,600 MB / 56 GB). Landing this alert
      # early gives ~24 h headroom before the
      # snapshot_fleet_avg_mb > 160 alert fires (per CLAUDE.md "fleet
      # snapshot average target: 130 MB — alerts at 160"). Ratio uses
      # the existing ADR-074 series
      # vmmd_wake_snapshot_tier_total{tier="cold_boot_fallback"} /
      # vmmd_wake_snapshot_tier_total; recording rule is the [5m]
      # rate so the alert's `for: 10m` rides a stable ratio, not a
      # per-second instantaneous. clamp_min(0.001) on the
      # denominator guards against /0 when a node has had zero
      # recent wakes (the small floor keeps the ratio numeric
      # instead of NaN). No warn tier: the ratio has no integer
      # floor that's a meaningful "early warning"; the SLO is
      # "operator paged at 30 %, recover before 50 %" — at 50 % the
      # fleet snapshot avg crosses 200 MB.
      # ─────────────────────────────────────────────────────────────────
      - record: vmmd_cold_boot_ratio
        expr: |
          sum without (tier) (
              clamp_min(
                  rate(vmmd_wake_snapshot_tier_total{tier="cold_boot_fallback"}[5m]),
                  0
              )
          )
          /
          sum without (tier) (
              clamp_min(
                  rate(vmmd_wake_snapshot_tier_total[5m]),
                  0.001
              )
          )

      - alert: FaasColdBootRatioHigh
        expr: vmmd_cold_boot_ratio > 0.30
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: cold_boot_ratio
        annotations:
          summary: "vmmd cold-boot fallback > 30 % for 10m"
          description: "Cold-boot fallback rate has exceeded 30 % of all wakes for 10m. The §6.2 budget is approaching saturation on the wake-economics curve — sustained cold-boot at this rate is ~3x the wake-side I/O of a healthy fleet and stresses lv-fc (pkg/fcvm/lvfc.go). Catching this trend before snapshot_fleet_avg exceeds 160 MB gives ~24 h headroom. Drill-down: `rate(vmmd_wake_failure_total{reason=\"disk_full\"}[5m])` (storage pressure), `fcvm_snapshot_fleet_avg_bytes` (growth signal). Recover: see docs/runbooks/FaasColdBootRatioHigh.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasColdBootRatioHigh.md"

      # ─────────────────────────────────────────────────────────────────
      # ADR-127 PR-B production debugger alerts. Mirrors the
      # FaasDomainDoctorStalled / FaasAuditRetentionLoopStalled
      # shape above — stalled loop pages on-call; stretched
      # cadence warns.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasDebugRegressionStalled
        # The regression cron (cmd/apid/debug_regression_cron.go)
        # hasn't refreshed debug_regression_observations in >26m.
        # Loop cadence is 5m (debugRegressionTickInterval); the
        # 25.5m slack covers a Postgres hiccup. `for: 30m`
        # debounces a single missed tick. A stuck cron means
        # customers see stale or missing regression banners on
        # the dashboard and the `gregale debug regressions <slug>`
        # CLI returns no new rows — page.
        expr: time() - timestamp(apid_debug_regression_oldest_pass_seconds) > 1560
        for: 30m
        labels:
          severity: warn
          component: apid
          family: debug_regression
        annotations:
          summary: "apid regression cron stalled >26m"
          description: "The regression cron (cmd/apid/debug_regression_cron.go) has not refreshed debug_regression_observations in >26m. The gauge apid_debug_regression_oldest_pass_seconds stops updating when the loop stalls; Prometheus scrapes see a stale value. Customers' `gregale debug regressions <slug>` and the dashboard regression banner will return stale observations. Drill down per the runbook: check apid logs for `regression_cron: list apps failed` / `per-app pass failed`, then query Postgres for the MAX(last_detected_at) row, then escalate."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDebugRegressionStalled.md"

      - alert: FaasDebugRegressionDisabledByOperator
        # The operator flipped FAAS_REQUEST_TELEMETRY_ENABLED=false.
        # The skipped-flag counter is incrementing on every tick;
        # the regression cron is intentionally not running. Info
        # severity (no page); the alert exists so an operator can
        # distinguish "operator disabled the cron" from "cron
        # stalled".
        expr: increase(apid_debug_regression_skipped_flag_disabled_total[1h]) > 0
        for: 1h
        labels:
          severity: info
          component: apid
          family: debug_regression
        annotations:
          summary: "apid regression cron disabled by operator"
          description: "FAAS_REQUEST_TELEMETRY_ENABLED has been set to false; the regression cron in cmd/apid/debug_regression_cron.go is intentionally skipping every tick. This is the operator's choice — no action required. To re-enable, unset the env var and restart apid (or restart meterd if the operator wants to keep the dashboard's HTTP surface dormant while keeping the cron live — the two kill-switches are separate)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDebugRegressionDisabledByOperator.md"

      - alert: FaasDebugRegressionDetected
        # The regression cron (cmd/apid/debug_regression_cron.go)
        # has persisted ≥1 PRIMARY KEY upsert on
        # debug_regression_observations in the last 5m. Each
        # upsert means current.p95 > baseline.p95 × 1.20 with
        # ≥100 affected rows in a 30-min window — a fresh
        # regression fires once; an existing regression that
        # persists across cron passes re-fires every 5m. The
        # 1m debounce so a noisy app adding 20 regressions in
        # one cron pass collapses to a single page. Pages
        # within 6m of the first observation (5m tick + 1m
        # debounce). A persistent regression re-pages every
        # 5m; PagerDuty dedupes the sustained-fire alert into
        # one ongoing incident.
        expr: increase(apid_debug_regression_detected_total[5m]) > 0
        for: 1m
        labels:
          severity: warn
          component: apid
          family: debug_regression
        annotations:
          summary: "apid regression detector found ≥1 fresh (deployment, route) regression"
          description: "The regression cron (cmd/apid/debug_regression_cron.go) has persisted ≥1 upsert to debug_regression_observations in the last 5m. A regression = current.p95 > baseline.p95 × 1.20 with ≥100 affected rows in a 30-min window. This is the customer-facing regression banner trigger — page on-call so they can correlate with the dashboard before customers report slowness. Drill-down: `gregale debug regressions <slug>` to enumerate, then check the regression factor / affected_count. PagerDuty incident: review the dashboard banner and decide whether to ship a rollback or wait for the cron to clear."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDebugRegressionDetected.md"

      - alert: FaasDebugTelemetryIngestStalled
        # gatewayd-public POST /v1/otel/v1/traces is failing to write
        # spans (db_error) and has inserted none in 10m. PR-D added the
        # metric gatewayd_public_otel_spans_ingested_total{outcome}
        # (pkg/wire/metrics.go, ADR-127 PR-D); the writer ships
        # customer OTel spans into request_telemetry.spans_summary.
        # The rule used to read a doubled-prefix name the daemon never
        # exported, so it never fired; it also fired on idle, because
        # `rate(inserted) == 0` holds whenever nobody exports spans.
        # Requiring write failures keeps a quiet hour silent, and
        # rate_limited/shape_invalid stay out because they are the
        # customer's quota or payload, not a stall. Warn severity
        # (not page) — the customer's app keeps running; only the
        # debugger's OTel summary is stalled.
        expr: |
          sum(rate(gatewayd_public_otel_spans_ingested_total{outcome="db_error"}[10m])) > 0
          unless on ()
          sum(rate(gatewayd_public_otel_spans_ingested_total{outcome="inserted"}[10m])) > 0
        for: 15m
        labels:
          severity: warn
          component: gatewayd-public
          family: debug_telemetry
        annotations:
          summary: "gatewayd-public OTel spans writer ingest stalled >15m"
          description: "gatewayd-public POST /v1/otel/v1/traces is receiving spans but every write fails (db_error) and none has been inserted for 15m. The OTLP writer ships customer spans into request_telemetry.spans_summary (ADR-127 PR-D); a stall means the debugger's per-request span view is going dark. Check gatewayd-public logs for `otel_spans: apid RPC failed` (auth.sock unreachable), `otel_spans: rate_limited` (customer's per-account token bucket exhausted), or `otel_spans: shape_invalid` (malformed OTLP body). Drill-down: `rate(gatewayd_public_otel_spans_ingested_total[5m]) by (outcome)` distinguishes the four outcomes (inserted/rate_limited/db_error/shape_invalid)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDebugTelemetryIngestStalled.md"

      # request_telemetry is range-partitioned by received_at. meterd
      # reconciles the current month and two future months at startup and
      # hourly so normal writes never accumulate in the catch-all default.
      - alert: FaasRequestTelemetryPartitionCoverageMissing
        expr: |
          meterd_request_telemetry_partition_current_covered == 0
          or
          meterd_request_telemetry_partition_covered_months < 3
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: debug_telemetry
        annotations:
          summary: "request telemetry partition coverage is incomplete"
          description: "meterd does not see an attached request_telemetry partition for the current month or both future months. New rows may be landing in request_telemetry_default, making retention more expensive. Inspect the partition catalog and meterd reconciliation errors before changing partition DDL manually."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRequestTelemetryPartitionsDegraded.md"

      - alert: FaasRequestTelemetryPartitionReconcileStalled
        expr: |
          (
            meterd_request_telemetry_partition_last_success_timestamp_seconds == 0
            and on (job, instance)
            time() - process_start_time_seconds{job="meterd"} > 600
          )
          or
          (
            meterd_request_telemetry_partition_last_success_timestamp_seconds > 0
            and
            time() - meterd_request_telemetry_partition_last_success_timestamp_seconds > 7200
          )
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: debug_telemetry
        annotations:
          summary: "request telemetry partition reconciliation is stale"
          description: "meterd has not completed request_telemetry partition reconciliation during startup or within two hourly intervals. Check meterd_request_telemetry_partition_reconcile_failures_total and meterd logs for lock, catalog, or database errors."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRequestTelemetryPartitionsDegraded.md"

      - alert: FaasRequestTelemetryDefaultReceivingRows
        expr: |
          meterd_request_telemetry_default_latest_received_timestamp_seconds > 0
          and
          time() - meterd_request_telemetry_default_latest_received_timestamp_seconds < 600
        for: 2m
        labels:
          severity: warn
          component: meterd
          family: debug_telemetry
        annotations:
          summary: "request telemetry is writing into the default partition"
          description: "request_telemetry_default received a row during the last 10 minutes. Explicit partition coverage has a gap or incoming telemetry is outside the expected time range. Check the row timestamps and attached partition bounds; the hourly reconciler safely moves current-month rows."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRequestTelemetryPartitionsDegraded.md"

      # ─────────────────────────────────────────────────────────────────
      # Observability pipeline health. These metrics describe the optional
      # daemon-owned Prometheus → OTLP bridge itself, not customer span
      # ingestion. A configured bridge must not be treated as healthy merely
      # because the daemon's local /metrics endpoint is still scrapeable.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasOTLPMetricsExporterDown
        expr: |
          ({__name__=~".*_otel_metrics_exporter_enabled"} == 1)
          and on (job, instance)
          ({__name__=~".*_otel_metrics_exporter_up"} == 0)
        for: 10m
        labels:
          severity: warn
          component: platform
          family: telemetry_pipeline
        annotations:
          summary: "OTLP metrics exporter is configured but down"
          description: "A daemon's Prometheus-to-OTLP metrics bridge has failed its most recent export for 10m. Local Prometheus scraping remains available, but the remote observability backend is stale. Check the exporter error counter and the OTLP collector endpoint before treating this as a daemon outage."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOTLPMetricsExporterDown.md"

      - alert: FaasOTLPMetricsExporterErrors
        expr: |
          sum by (job, instance) (
            rate({__name__=~".*_otel_metrics_export_total", outcome="error"}[10m])
          ) > 0
          and on (job, instance)
          sum by (job, instance) (
            {__name__=~".*_otel_metrics_exporter_enabled"}
          ) > 0
        for: 10m
        labels:
          severity: info
          component: platform
          family: telemetry_pipeline
        annotations:
          summary: "OTLP metrics exporter has recorded errors"
          description: "A configured daemon has recorded one or more OTLP metrics export failures during the last 10m. The exporter may have recovered; inspect the error rate, duration, and last-success timestamp before escalating."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOTLPMetricsExporterDown.md"

      - alert: FaasOTLPTraceExporterDown
        expr: |
          ({__name__=~".*_otel_trace_exporter_enabled"} == 1)
          and on (job, instance)
          ({__name__=~".*_otel_trace_exporter_up"} == 0)
        for: 10m
        labels:
          severity: warn
          component: platform
          family: telemetry_pipeline
        annotations:
          summary: "OTLP trace exporter is configured but down"
          description: "A daemon's OTLP trace exporter has failed its most recent batch export for 10m. Local trace-ring and Prometheus surfaces remain available, but the remote trace backend is stale and new spans may be dropped. Check the trace export error counter, collector endpoint, and TLS configuration before restarting the daemon."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOTLPTraceExporterDown.md"

      - alert: FaasOTLPTraceExporterErrors
        expr: |
          sum by (job, instance) (
            rate({__name__=~".*_otel_trace_export_total", trigger="batch", outcome="error"}[10m])
          ) > 0
          and on (job, instance)
          sum by (job, instance) (
            {__name__=~".*_otel_trace_exporter_enabled"}
          ) > 0
        for: 10m
        labels:
          severity: info
          component: platform
          family: telemetry_pipeline
        annotations:
          summary: "OTLP trace exporter has recorded errors"
          description: "A configured daemon has recorded one or more OTLP trace batch export failures during the last 10m. The exporter may have recovered; inspect trace export rate, dropped spans, duration, and last-success timestamp before escalating."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOTLPTraceExporterDown.md"
      # Issue #573 / ADR-128 — restart-loop detection (cluster B commit 7
      # of the platform-observability mega-PR). The three alerts below
      # answer the three operator questions from the issue body:
      #
      #   1. FaasRestartLoop — "is a daemon crashlooping RIGHT NOW?"
      #      Pages within 2m of the 5th restart in 5m. Catastrophic —
      #      the box is failing fast and customers will see wake
      #      errors as the daemon is mid-replacement.
      #
      #   2. FaasRepeatedRestart — "is a daemon being restarted
      #      persistently across the hour?" 20 restarts in 1h means
      #      the systemd unit is unstable but hasn't tripped
      #      Restart=on-failure's SecStartLimitBurst yet — operationally
      #      important because the daemon will eventually enter the
      #      failed state and stop being restarted.
      #
      #   3. FaasStuckActivating — "is a daemon stuck in the
      #      'activating' state without ever reaching 'active'?"
      #      Pages at 5m of stuck-activating. Distinct from
      #      RestartLoop because the unit is NOT crashlooping —
      #      it's just not coming up (dependency deadlock, bad config
      #      syntax, missing secret, etc.).
      #
      # Source metric: node_systemd_restart_count{name=~'faas-.*\\.service'}
      # from node_exporter's --collector.systemd (commit 6 added the
      # flag). Backstop: our own <daemon>_daemon_restart_count{daemon, version}
      # counter (also commit 6) — see the fallback for-window in
      # each alert expression.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasRestartLoop
        expr: increase(node_systemd_restart_count{name=~"faas-.*\\.service"}[5m]) > 5
        for: 2m
        labels:
          severity: page
          component: controlplane
          family: daemon_lifecycle
        annotations:
          summary: "Daemon restart-loop detected (>5 restarts in 5m)"
          description: "A faas-* systemd unit has restarted more than 5 times in the rolling 5-minute window for 2m. The daemon is crashlooping — customers will see wake errors as the unit is mid-replacement. Fallback (older systemd, no --collector.systemd): increase(<daemon>_daemon_restart_count[5m]) > 5 with the same for-window. Triage: `systemctl status faas-<name>.service` for the active state, `journalctl -u faas-<name>.service -n 200` for the panic / exit-on-error signature. Recover per docs/ops/FaasRestartLoop.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRestartLoop.md"

      - alert: FaasRepeatedRestart
        expr: increase(node_systemd_restart_count{name=~"faas-.*\\.service"}[1h]) > 20
        for: 5m
        labels:
          severity: warn
          component: controlplane
          family: daemon_lifecycle
        annotations:
          summary: "Daemon restarted >20 times in 1h (approaching SecStartLimitBurst)"
          description: "A faas-* systemd unit has restarted more than 20 times in the rolling 1-hour window for 5m. The daemon is unstable but hasn't tripped the systemd SecStartLimitBurst threshold yet — operationally important because the unit will eventually enter the failed state and stop being restarted, taking customers offline. Fallback (older systemd): increase(<daemon>_daemon_restart_count[1h]) > 20. Triage: `systemctl show faas-<name>.service --property=NRestarts` for the cumulative count, `journalctl -u faas-<name>.service --since '1 hour ago'` for the recurring failure signature. Recover per docs/ops/FaasRepeatedRestart.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRepeatedRestart.md"

      - alert: FaasStuckActivating
        expr: node_systemd_unit_state{name=~"faas-.*\\.service", state="activating"} == 1
        for: 5m
        labels:
          severity: warn
          component: controlplane
          family: daemon_lifecycle
        annotations:
          summary: "Daemon stuck in 'activating' state for 5m"
          description: "A faas-* systemd unit has been in the 'activating' state for 5m without reaching 'active'. The daemon is not crashlooping (no RestartLoop signature) — it is simply not coming up. Likely causes: dependency deadlock (Postgres / etcd / Vault not ready), bad config syntax, missing sealed secret, port collision. Triage: `systemctl status faas-<name>.service` for the active state, `journalctl -u faas-<name>.service -n 100` for the dependency-exit / config-parse error. Recover per docs/ops/FaasStuckActivating.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasStuckActivating.md"

      # ─────────────────────────────────────────────────────────────────
      # Issue #601 / ADR-131: FaasNewCve
      #
      # Pages when the cve-check workflow (.github/workflows/cve-check.yml)
      # reports a new CVE ≥ medium severity. The metric is pushed by
      # meterd from the workflow artifact (cluster D commit 13). Fires
      # once per severity tier so the page text names the severity
      # instead of just "CVE". Recover per docs/ops/FaasNewCve.md.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasNewCve
        expr: increase(meterd_cve_check_total{result="new_cve", severity=~"medium|high|critical"}[1h]) > 0
        for: 1m
        labels:
          severity: warn
          component: controlplane
          family: cve
        annotations:
          summary: "New CVE ≥ medium detected by the nightly cve-check workflow"
          description: "The nightly cve-check workflow (issue #601 / ADR-131) reported a new CVE ≥ medium severity within the last hour. The metric is meterd_cve_check_total{result=\"new_cve\"}; the GitHub Issue created by the workflow lists the CVE id, severity, and affected dependency. Triage: read the GitHub Issue for the CVE id + dep, check deps.dev / nvd.nist.gov for the affected versions + fixed-in version, decide patch vs. accept-risk posture, ship the patch (or the grype ignore). Recover per docs/ops/FaasNewCve.md."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasNewCve.md"

      # Each apid independently polls the fleet queue every 30s. Require a
      # successful scrape and a successful, nonzero, nonfuture read <=120s
      # old. Missing/failed/expired reads are unavailable, never empty.
      # Do not sum observations from multiple apids: each counts the fleet.
      - record: faas_build_queue_observation_healthy
        expr: |
          (apid_build_queue_collection_success{job="apid"} == 1)
          and on (job, instance) (up{job="apid"} == 1)
          and on (job, instance) (faas_build_queue_depth{job="apid"} >= 0)
          and on (job, instance) (apid_build_queue_collection_last_success_timestamp_seconds{job="apid"} > 0)
          and on (job, instance) (time() - apid_build_queue_collection_last_success_timestamp_seconds{job="apid"} >= 0)
          and on (job, instance) (time() - apid_build_queue_collection_last_success_timestamp_seconds{job="apid"} <= 120)
          and on (job, instance) (
            ((faas_build_queue_depth{job="apid"} == 0)
             and on (job, instance) (faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid"} == 0))
            or
            ((faas_build_queue_depth{job="apid"} > 0)
             and on (job, instance) (faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid"} > 0)
             and on (job, instance) (time() - faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid"} >= 0))
          )

      # Keep the original timestamp as input: a waiting build's age must
      # advance between polls. Healthy empty queues have observed zero wait;
      # unavailable observations have no wait series.
      - record: faas_build_queue_oldest_wait_seconds
        expr: |
          ((time() - faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid"})
           and on (job, instance) (faas_build_queue_depth{job="apid"} > 0)
           and on (job, instance) (faas_build_queue_observation_healthy == 1))
          or
          ((faas_build_queue_depth{job="apid"} == 0)
           and on (job, instance) (faas_build_queue_observation_healthy == 1))

      - alert: FaasBuildQueueOldestWaitHigh
        expr: faas_build_queue_oldest_wait_seconds > 300
        for: 10m
        labels:
          severity: warn
          component: builderd
          family: build_queue_stuck
          public_status: internal
        annotations:
          summary: "Oldest queued build has waited > 5m"
          description: "A fresh queue observation has contained a build waiting more than 300 seconds for 10m, even if only one build is queued. The original enqueue time survives requeue. Inspect builder admission, heartbeats, and build state; this observation alone does not prove builder failure."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md"

      - alert: FaasBuildQueueDepthHigh
        expr: |
          (faas_build_queue_depth{job="apid"} > 50)
          and on (job, instance) (faas_build_queue_observation_healthy == 1)
        for: 10m
        labels:
          severity: warn
          component: builderd
          family: build_queue_stuck
          public_status: internal
        annotations:
          summary: "builderd build queue > 50 queued builds for 10m"
          description: "The fleet-total queued-builds gauge `faas_build_queue_depth` has exceeded 50 for 10m. With builderd limited to one microVM under the 5 GiB parent cgroup, sustained depth > 50 means builds are arriving faster than the safe drain rate. Triage: `gregalectl builds list --status=queued` for in-flight builds and `/v1/admin/obs/builder-heartbeats` for liveness, then recover per the runbook."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md"

      - alert: FaasBuildQueueTelemetryUnavailable
        expr: |
          (up{job="apid"} == 1)
          unless on (job, instance) (faas_build_queue_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: build_queue_stuck
          public_status: internal
        annotations:
          summary: "Build queue observation unavailable"
          description: "A scraped apid has no successful, complete build queue observation at most 120 seconds old for 5m. Queue depth is unknown, not zero. Inspect apid queue collection and database health; another apid's successful fleet snapshot cannot establish this collector's health."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md"

      # Observe claim/admission outcomes without treating saturation as a
      # failure. A poll includes the full build, so progress budgets differ
      # between idle and in-flight work. Keep each builder instance separate.
      - record: builderd_build_queue_observation_healthy
        expr: |
          (up{job="builderd"} == 1)
          and on (job, instance) ((builderd_build_worker_enabled{job="builderd"} == 0) or (builderd_build_worker_enabled{job="builderd"} == 1))
          and on (job, instance) ((builderd_build_worker_inflight{job="builderd"} == 0) or (builderd_build_worker_inflight{job="builderd"} == 1))
          and on (job, instance) (builderd_build_worker_started_timestamp_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_worker_started_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_worker_interval_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_worker_busy_allowance_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_slots_limit{job="builderd"} > 0)
          and on (job, instance) (builderd_build_slots_in_use{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_slots_in_use{job="builderd"} <= builderd_build_slots_limit{job="builderd"})
          and on (job, instance) (count by (job, instance) (builderd_build_claims_total{job="builderd",source=~"poll|notification",outcome=~"claimed|not_claimed|error|canceled"}) == 8)
          and on (job, instance) (count by (job, instance) (builderd_build_requeues_total{job="builderd",reason=~"no_slot|source_unavailable|context_canceled|lookup_failure",outcome=~"accepted|not_requeued|error|canceled"}) == 16)
          and on (job, instance) (count by (job, instance) (builderd_build_slot_decisions_total{job="builderd",outcome=~"granted|limit|policy"}) == 3)
          and on (job, instance)
          (((builderd_build_worker_inflight{job="builderd"} == 1)
            and on (job, instance) (builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"} > 0)
            and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} <= builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"}))
           or ((builderd_build_worker_inflight{job="builderd"} == 0)
               and on (job, instance)
               (((builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"} == 0)
                 and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} == 0))
                or ((builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"} > 0)
                    and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} >= builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"})))))
      - record: builderd_build_worker_progress_age_seconds
        expr: |
          (((time() - builderd_build_worker_last_attempt_timestamp_seconds{job="builderd"})
             and on (job, instance) (builderd_build_worker_inflight{job="builderd"} == 1))
           or ((time() - builderd_build_worker_last_completed_timestamp_seconds{job="builderd"})
               and on (job, instance) (builderd_build_worker_inflight{job="builderd"} == 0)
               and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} > 0))
           or ((time() - builderd_build_worker_started_timestamp_seconds{job="builderd"})
               and on (job, instance) (builderd_build_worker_inflight{job="builderd"} == 0)
               and on (job, instance) (builderd_build_worker_last_completed_timestamp_seconds{job="builderd"} == 0)))
          and on (job, instance) (builderd_build_queue_observation_healthy == 1)
      - record: builderd_build_worker_progress_allowance_seconds
        expr: |
          (((builderd_build_worker_busy_allowance_seconds{job="builderd"}
              + on (job, instance) 2 * builderd_build_worker_interval_seconds{job="builderd"})
             and on (job, instance) (builderd_build_worker_inflight{job="builderd"} == 1))
           or ((2 * builderd_build_worker_interval_seconds{job="builderd"})
               and on (job, instance) (builderd_build_worker_inflight{job="builderd"} == 0)))
          and on (job, instance) (builderd_build_queue_observation_healthy == 1)
      - alert: FaasBuilderQueueTelemetryUnavailable
        expr: |
          (up{job="builderd"} == 1)
          unless on (job, instance) (builderd_build_queue_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_queue_telemetry
          public_status: internal
        annotations:
          summary: Builder queue diagnostics are unavailable
          description: The builder is scraped but its worker progress, slot state or bounded claim/requeue counters are
            missing or inconsistent. Worker and admission health are unknown; inspect instrumentation, clocks and scrape
            configuration.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildWorker.md
      - alert: FaasBuilderWorkerStalled
        expr: |
          (builderd_build_worker_progress_age_seconds
           > on (job, instance) builderd_build_worker_progress_allowance_seconds)
          and on (job, instance) (builderd_build_worker_enabled{job="builderd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_queue_worker
          public_status: internal
        annotations:
          summary: Durable build polling has stopped progressing
          description: The expected poller has exceeded its progress allowance for 5m. Idle allowance is two poll intervals;
            an in-flight iteration also receives the effective running-build recovery threshold. Notification work cannot
            renew poller progress. Capture logs and goroutines before intervening.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildWorker.md
      - alert: FaasBuilderClaimsFailing
        expr: |
          (sum by (job, instance, source) (rate(builderd_build_claims_total{job="builderd",outcome="error"}[5m]))
           / sum by (job, instance, source) (rate(builderd_build_claims_total{job="builderd",outcome=~"claimed|not_claimed|error"}[5m])) > 0.1)
          and on (job, instance, source) (sum by (job, instance, source) (increase(builderd_build_claims_total{job="builderd",outcome="error"}[5m])) >= 3)
          and on (job, instance) (builderd_build_queue_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_queue_worker
          public_status: internal
        annotations:
          summary: Build claims are persistently failing
          description: Claim errors exceed 10% of completed non-canceled claim calls with at least three errors in each
            rolling 5m window, sustained for 5m. Not-claimed results include affinity and claim races and do not establish
            an empty queue.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildWorker.md
      - alert: FaasBuilderRequeuesFailing
        expr: |
          (sum by (job, instance, reason) (rate(builderd_build_requeues_total{job="builderd",outcome="error"}[5m]))
           / sum by (job, instance, reason) (rate(builderd_build_requeues_total{job="builderd",outcome=~"accepted|error"}[5m])) > 0.1)
          and on (job, instance, reason) (sum by (job, instance, reason) (increase(builderd_build_requeues_total{job="builderd",outcome="error"}[5m])) >= 3)
          and on (job, instance) (builderd_build_queue_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_queue_worker
          public_status: internal
        annotations:
          summary: Build requeues are persistently failing
          description: Requeue errors exceed 10% of accepted/error calls with at least three errors in each rolling 5m
            window, sustained for 5m. ErrNoSlot can mask a failed requeue at the worker return boundary; inspect durable
            build state and recovery. Fenced stale claims and cancellation are excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildWorker.md

      # Bounded LISTEN/NOTIFY queues are separate from durable queue state
      # and DB hub delivery. Dispatch handoff can briefly occupy one ID per
      # worker outside the buffered channel. Active handlers have no wait age.
      - record: builderd_notification_queue_observation_healthy
        expr: |
          (((builderd_notification_queue_enabled{job="builderd",queue=~"build|cancel"} == 0)
            or (builderd_notification_queue_enabled{job="builderd",queue=~"build|cancel"} == 1)) * 0 + 1)
          and on (job, instance) (up{job="builderd"} == 1)
          and on (job, instance, queue) (builderd_notification_queue_capacity{job="builderd"} > 0)
          and on (job, instance, queue) (builderd_notification_queue_capacity{job="builderd"} == floor(builderd_notification_queue_capacity{job="builderd"}))
          and on (job, instance, queue) (builderd_notification_queue_workers{job="builderd"} > 0)
          and on (job, instance, queue) (builderd_notification_queue_workers{job="builderd"} == floor(builderd_notification_queue_workers{job="builderd"}))
          and on (job, instance, queue) (builderd_notification_queue_active{job="builderd"} >= 0)
          and on (job, instance, queue) (builderd_notification_queue_active{job="builderd"} == floor(builderd_notification_queue_active{job="builderd"}))
          and on (job, instance, queue) (builderd_notification_queue_active{job="builderd"} <= builderd_notification_queue_workers{job="builderd"})
          and on (job, instance, queue) (builderd_notification_queue_waiting{job="builderd"} >= 0)
          and on (job, instance, queue) (builderd_notification_queue_waiting{job="builderd"} == floor(builderd_notification_queue_waiting{job="builderd"}))
          and on (job, instance, queue)
            ((builderd_notification_queue_waiting{job="builderd"} + builderd_notification_queue_active{job="builderd"})
             <= (builderd_notification_queue_capacity{job="builderd"} + builderd_notification_queue_workers{job="builderd"}))
          and on (job, instance, queue) (builderd_notification_queue_oldest_enqueued_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance, queue)
            (((builderd_notification_queue_waiting{job="builderd"} == 0)
              and on (job, instance, queue) (builderd_notification_queue_oldest_enqueued_timestamp_seconds{job="builderd"} == 0))
             or ((builderd_notification_queue_waiting{job="builderd"} > 0)
                 and on (job, instance, queue) (builderd_notification_queue_oldest_enqueued_timestamp_seconds{job="builderd"} > 0)))
          and on (job, instance, queue)
            (count by (job, instance, queue) (builderd_notification_queue_enqueues_total{job="builderd",outcome=~"accepted|coalesced|full|stopping|invalid"} >= 0) == 5)
      - record: builderd_notification_queue_oldest_wait_seconds
        expr: |
          (((time() - builderd_notification_queue_oldest_enqueued_timestamp_seconds{job="builderd"})
             and on (job, instance, queue) (builderd_notification_queue_waiting{job="builderd"} > 0))
           or ((builderd_notification_queue_waiting{job="builderd"} == 0) * 0))
          and on (job, instance, queue) (builderd_notification_queue_observation_healthy == 1)
      - alert: FaasBuilderNotificationTelemetryUnavailable
        expr: |
          (label_replace(up{job="builderd"} == 1, "queue", "build", "job", ".*")
           or label_replace(up{job="builderd"} == 1, "queue", "cancel", "job", ".*"))
          unless on (job, instance, queue) (builderd_notification_queue_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_notification_telemetry
          public_status: internal
        annotations:
          summary: Builder notification queue diagnostics are unavailable
          description: The builder is scraped but its {{ $labels.queue }} notification queue state or initialized enqueue
            counters are missing or inconsistent. Fast-path health is unknown; inspect instrumentation, clocks and scrape
            configuration. The durable worker and cleanup reaper are independent recovery paths.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildNotifications.md
      - alert: FaasBuilderNotificationDropsHigh
        expr: |
          (sum by (job, instance, queue) (rate(builderd_notification_queue_enqueues_total{job="builderd",queue=~"build|cancel",outcome="full"}[5m]))
           / sum by (job, instance, queue) (rate(builderd_notification_queue_enqueues_total{job="builderd",queue=~"build|cancel",outcome=~"accepted|full"}[5m])) > 0.1)
          and on (job, instance, queue)
            (sum by (job, instance, queue) (increase(builderd_notification_queue_enqueues_total{job="builderd",outcome="full"}[5m])) >= 3)
          and on (job, instance, queue) (builderd_notification_queue_observation_healthy == 1)
          and on (job, instance, queue) (builderd_notification_queue_enabled{job="builderd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_notification_queue
          public_status: internal
        annotations:
          summary: Builder notification queue is persistently dropping hints
          description: Full-queue drops exceed 10% of accepted/full enqueue attempts for the {{ $labels.queue }} queue,
            with at least three drops in each rolling 5m window, sustained for 5m. Duplicate coalescing and shutdown
            are excluded. Verify durable build polling or cancellation cleanup is progressing before intervening.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildNotifications.md
      - alert: FaasBuilderNotificationWaitHigh
        expr: |
          ((builderd_notification_queue_oldest_wait_seconds{queue="build"} > 300)
           or (builderd_notification_queue_oldest_wait_seconds{queue="cancel"} > 60))
          and on (job, instance, queue) (builderd_notification_queue_enabled{job="builderd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_notification_queue
          public_status: internal
        annotations:
          summary: Builder notifications are waiting too long for dispatch
          description: The oldest waiting {{ $labels.queue }} hint exceeded its dispatch-age threshold for 5m; thresholds
            are 5m for builds and 1m for cancellation. Active handlers are excluded. This measures fast-path delay and
            does not establish a lost durable build, a stalled worker or a VM that is still alive.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildNotifications.md

      # Build success is not image preparation. Observe unconsumed handoffs
      # independently of synchronous imaging/recovery work. Empty identities
      # retain legacy routing compatibility, so never sum imaged replicas.
      - record: imaged_build_handoff_observation_healthy
        expr: |
          (imaged_build_handoff_collection_success{job="imaged"} == 1)
          and on (job, instance) (up{job="imaged"} == 1)
          and on (job, instance) (imaged_build_handoff_collection_last_success_timestamp_seconds{job="imaged"} > 0)
          and on (job, instance) (time() - imaged_build_handoff_collection_last_success_timestamp_seconds{job="imaged"} >= 0)
          and on (job, instance) (time() - imaged_build_handoff_collection_last_success_timestamp_seconds{job="imaged"} <= 120)
          and on (job, instance) (imaged_build_handoff_pending{job="imaged"} >= 0)
          and on (job, instance) (imaged_build_handoff_pending{job="imaged"} == floor(imaged_build_handoff_pending{job="imaged"}))
          and on (job, instance) (imaged_build_handoff_oldest_finished_timestamp_seconds{job="imaged"} <= time())
          and on (job, instance)
            (((imaged_build_handoff_pending{job="imaged"} == 0)
              and on (job, instance) (imaged_build_handoff_oldest_finished_timestamp_seconds{job="imaged"} == 0))
             or ((imaged_build_handoff_pending{job="imaged"} > 0)
                 and on (job, instance) (imaged_build_handoff_oldest_finished_timestamp_seconds{job="imaged"} > 0)))
          and on (job, instance) ((imaged_build_handoff_recovery_enabled{job="imaged"} == 0) or (imaged_build_handoff_recovery_enabled{job="imaged"} == 1))
          and on (job, instance) ((imaged_build_handoff_recovery_inflight{job="imaged"} == 0) or (imaged_build_handoff_recovery_inflight{job="imaged"} == 1))
          and on (job, instance) (imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"} >= 0)
          and on (job, instance) (imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"} <= time())
          and on (job, instance) (imaged_build_handoff_recovery_last_completed_timestamp_seconds{job="imaged"} >= 0)
          and on (job, instance) (imaged_build_handoff_recovery_last_completed_timestamp_seconds{job="imaged"} <= time())
          and on (job, instance)
            (((imaged_build_handoff_recovery_inflight{job="imaged"} == 1)
              and on (job, instance) (imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"} > 0)
              and on (job, instance) (imaged_build_handoff_recovery_last_completed_timestamp_seconds{job="imaged"} <= imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"}))
             or ((imaged_build_handoff_recovery_inflight{job="imaged"} == 0)
                 and on (job, instance)
                   (((imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"} == 0)
                     and on (job, instance) (imaged_build_handoff_recovery_last_completed_timestamp_seconds{job="imaged"} == 0))
                    or ((imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"} > 0)
                        and on (job, instance) (imaged_build_handoff_recovery_last_completed_timestamp_seconds{job="imaged"} >= imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged"})))))
          and on (job, instance) (count by (job, instance) (imaged_build_handoff_recovery_queries_total{job="imaged",source=~"resume|awaiting",outcome=~"success|error|canceled"} >= 0) == 6)
          and on (job, instance) (count by (job, instance) (imaged_build_handoff_recovery_work_total{job="imaged",source=~"resume|awaiting",outcome=~"returned|retryable|deferred|not_owned|error|canceled"} >= 0) == 12)
          and on (job, instance) (count by (job, instance) (imaged_image_preparation_commits_total{job="imaged",transition=~"claimed|layer_published|scan_complete|handed_off"} >= 0) == 4)
      - record: imaged_build_handoff_oldest_wait_seconds
        expr: |
          (((time() - imaged_build_handoff_oldest_finished_timestamp_seconds{job="imaged"})
             and on (job, instance) (imaged_build_handoff_pending{job="imaged"} > 0))
           or ((imaged_build_handoff_pending{job="imaged"} == 0) * 0))
          and on (job, instance) (imaged_build_handoff_observation_healthy == 1)
      - alert: FaasBuildImageHandoffTelemetryUnavailable
        expr: |
          (up{job="imaged"} == 1)
          unless on (job, instance)
            ((imaged_build_handoff_observation_healthy == 1)
             or (imaged_build_handoff_recovery_enabled{job="imaged"} == 0))
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: build_image_handoff_telemetry
          public_status: internal
        annotations:
          summary: Build-to-image handoff diagnostics are unavailable
          description: Imaged is scraped but its handoff snapshot is failed, missing, inconsistent or older than two
            minutes, or its initialized recovery diagnostics are incomplete. Handoff health is unknown; inspect the
            database reader, clocks, deployed binary and scrape configuration. Intentional loop shutdown is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildImageHandoff.md
      - alert: FaasBuildImageHandoffWaiting
        expr: |
          (imaged_build_handoff_oldest_wait_seconds > 300)
          and on (job, instance) (imaged_build_handoff_recovery_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: build_image_handoff
          public_status: internal
        annotations:
          summary: Successful builds are waiting for image preparation
          description: The oldest eligible succeeded build in this imaged recovery scope has waited more than five
            minutes since build completion, sustained for five minutes. Checkpointed active or resumable preparations
            are excluded. This measures unconsumed handoff delay, including backlog behind legitimate synchronous work;
            it does not establish a stalled daemon or deployment readiness failure.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildImageHandoff.md
      - alert: FaasImageHandoffRecoveryQueriesFailing
        expr: |
          (sum by (job, instance, source) (rate(imaged_build_handoff_recovery_queries_total{job="imaged",source=~"resume|awaiting",outcome="error"}[5m]))
           / sum by (job, instance, source) (rate(imaged_build_handoff_recovery_queries_total{job="imaged",source=~"resume|awaiting",outcome=~"success|error"}[5m])) > 0.1)
          and on (job, instance, source)
            (sum by (job, instance, source) (increase(imaged_build_handoff_recovery_queries_total{job="imaged",outcome="error"}[5m])) >= 3)
          and on (job, instance) (imaged_build_handoff_observation_healthy == 1)
          and on (job, instance) (imaged_build_handoff_recovery_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: build_image_handoff
          public_status: internal
        annotations:
          summary: Image handoff recovery queries are persistently failing
          description: Errors exceed 10% of non-canceled {{ $labels.source }} recovery list calls, with at least three
            errors in each rolling five-minute window, sustained for five minutes. The independent observation reader
            does not establish that recovery queries work. Busy leases, claim fences and customer image failures are
            separate handler outcomes and do not trigger this warning.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildImageHandoff.md

      # Checkpoint age survives token claims and restart. Includes active work
      # and resume backlog; prolonged phase is a triage signal, not a deadlock.
      - record: imaged_image_preparation_phase_observation_healthy
        expr: |
          ((imaged_image_preparation_pending{job="imaged",phase=~"preparing|layer_published|scan_complete"} >= 0) * 0 + 1)
          and on (job, instance, phase) (imaged_image_preparation_pending{job="imaged"} < +Inf)
          and on (job, instance, phase) (imaged_image_preparation_pending{job="imaged"} == floor(imaged_image_preparation_pending{job="imaged"}))
          and on (job, instance, phase) (imaged_image_preparation_phase_age_unknown{job="imaged"} >= 0)
          and on (job, instance, phase) (imaged_image_preparation_phase_age_unknown{job="imaged"} == floor(imaged_image_preparation_phase_age_unknown{job="imaged"}))
          and on (job, instance, phase) (imaged_image_preparation_phase_age_unknown{job="imaged"} <= imaged_image_preparation_pending{job="imaged"})
          and on (job, instance, phase) (imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged"} <= time())
          and on (job, instance, phase)
            (((imaged_image_preparation_pending{job="imaged"} > imaged_image_preparation_phase_age_unknown{job="imaged"})
              and on (job, instance, phase) (imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged"} > 0))
             or ((imaged_image_preparation_pending{job="imaged"} == imaged_image_preparation_phase_age_unknown{job="imaged"})
                 and on (job, instance, phase) (imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged"} == 0)))
          and on (job, instance) (up{job="imaged"} == 1)
          and on (job, instance) (imaged_image_preparation_collection_success{job="imaged"} == 1)
          and on (job, instance) (imaged_image_preparation_collection_last_success_timestamp_seconds{job="imaged"} > 0)
          and on (job, instance) (time() - imaged_image_preparation_collection_last_success_timestamp_seconds{job="imaged"} >= 0)
          and on (job, instance) (time() - imaged_image_preparation_collection_last_success_timestamp_seconds{job="imaged"} <= 120)
          and on (job, instance) ((imaged_image_preparation_observation_enabled{job="imaged"} == 0) or (imaged_image_preparation_observation_enabled{job="imaged"} == 1))
      - record: imaged_image_preparation_observation_healthy
        expr: |
          (count by (job, instance) (imaged_image_preparation_phase_observation_healthy == 1) == 3) / 3
      - record: imaged_image_preparation_oldest_known_phase_age_seconds
        expr: |
          (((time() - imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged"})
             and on (job, instance, phase) (imaged_image_preparation_pending{job="imaged"} > imaged_image_preparation_phase_age_unknown{job="imaged"}))
           or ((imaged_image_preparation_pending{job="imaged"} == 0) * 0))
          and on (job, instance) (imaged_image_preparation_observation_healthy == 1)
      - alert: FaasImagePreparationTelemetryUnavailable
        expr: |
          (up{job="imaged"} == 1)
          unless on (job, instance)
            ((imaged_image_preparation_observation_healthy == 1)
             or (imaged_image_preparation_observation_enabled{job="imaged"} == 0))
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: image_preparation_telemetry
          public_status: internal
        annotations:
          summary: Durable image-preparation diagnostics are unavailable
          description: Imaged is scraped but its phase snapshot is failed, missing, inconsistent or older than two
            minutes. Counts and ages are unknown. Inspect the reader, database, clocks and deployed binary. Historical
            unknown ages are reported separately; intentional observer shutdown is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasImagePreparation.md
      - alert: FaasImagePreparationPhaseProlonged
        expr: |
          ((imaged_image_preparation_oldest_known_phase_age_seconds{phase=~"preparing|layer_published"} > 1800)
           or (imaged_image_preparation_oldest_known_phase_age_seconds{phase="scan_complete"} > 600))
          and on (job, instance) (imaged_image_preparation_observation_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: image_preparation
          public_status: internal
        annotations:
          summary: Image preparation has remained in one phase for an extended period
          description: The oldest known {{ $labels.phase }} checkpoint exceeded its phase-age threshold for five
            minutes. Thresholds are 30m for preparing and layer_published, and 10m for scan_complete. Age includes active
            execution and waiting to resume; retries do not renew it. This is a triage warning, not proof of a stalled
            daemon, a failed image or deployment readiness.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasImagePreparation.md
      - alert: FaasImagePreparationPhaseAgeUnknown
        expr: |
          (imaged_image_preparation_phase_age_unknown{job="imaged"} > 0)
          and on (job, instance) (imaged_image_preparation_observation_healthy == 1)
          and on (job, instance) (imaged_image_preparation_observation_enabled{job="imaged"} == 1)
        for: 15m
        labels:
          severity: warn
          component: imaged
          family: image_preparation_telemetry
          public_status: internal
        annotations:
          summary: Pending image preparations have unknown historical phase ages
          description: At least one {{ $labels.phase }} checkpoint has lacked a historical phase-start timestamp for
            15m in fresh snapshots. Pre-migration checkpoints remain unknown until a real phase transition; repeated
            claims cannot establish their age. Known rows still contribute to prolonged-phase warnings. Inspect durable
            work and recovery outcomes without inventing timestamps or forcing a transition.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasImagePreparation.md

      - record: schedd_snapshot_prime_class_observation_healthy
        expr: |
          ((schedd_snapshot_prime_pending{job="schedd",class=~"waiting|release_blocked|active|publication_pending|snapshot_recorded|unknown"} >= 0) * 0 + 1)
          and on (job, instance, class) (schedd_snapshot_prime_pending{job="schedd"} < +Inf)
          and on (job, instance, class) (schedd_snapshot_prime_pending{job="schedd"} == floor(schedd_snapshot_prime_pending{job="schedd"}))
          and on (job, instance, class) (schedd_snapshot_prime_age_unknown{job="schedd"} >= 0)
          and on (job, instance, class) (schedd_snapshot_prime_age_unknown{job="schedd"} == floor(schedd_snapshot_prime_age_unknown{job="schedd"}))
          and on (job, instance, class) (schedd_snapshot_prime_age_unknown{job="schedd"} <= schedd_snapshot_prime_pending{job="schedd"})
          and on (job, instance, class) (schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd"} <= time())
          and on (job, instance, class)
            (((schedd_snapshot_prime_pending{job="schedd"} > schedd_snapshot_prime_age_unknown{job="schedd"})
              and on (job, instance, class) (schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd"} > 0))
             or ((schedd_snapshot_prime_pending{job="schedd"} == schedd_snapshot_prime_age_unknown{job="schedd"})
                 and on (job, instance, class) (schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd"} == 0)))
          and on (job, instance) (up{job="schedd"} == 1)
          and on (job, instance) (schedd_snapshot_prime_collection_success{job="schedd"} == 1)
          and on (job, instance) (schedd_snapshot_prime_collection_last_success_timestamp_seconds{job="schedd"} > 0)
          and on (job, instance) (time() - schedd_snapshot_prime_collection_last_success_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (time() - schedd_snapshot_prime_collection_last_success_timestamp_seconds{job="schedd"} <= 120)
          and on (job, instance) ((schedd_snapshot_prime_observation_enabled{job="schedd"} == 0) or (schedd_snapshot_prime_observation_enabled{job="schedd"} == 1))
          unless on (job, instance, class) (schedd_snapshot_prime_pending{job="schedd",class="unknown"} != schedd_snapshot_prime_age_unknown{job="schedd",class="unknown"})
      - record: schedd_snapshot_prime_observation_healthy
        expr: |
          (count by (job, instance) (schedd_snapshot_prime_class_observation_healthy == 1) == 6) / 6
          and on (job, instance) (count by (job, instance) (schedd_snapshot_prime_recovery_queries_total{job="schedd",outcome=~"success|error|canceled"} >= 0) == 3)
          and on (job, instance) (count by (job, instance) (schedd_snapshot_prime_recovery_candidates_total{job="schedd",outcome=~"not_found|ineligible|release_blocked|grace|not_owned|snapshot_recorded|active|publication_pending|dispatch_requested|error|canceled"} >= 0) == 11)
      - record: schedd_snapshot_prime_oldest_known_attempt_age_seconds
        expr: |
          (((time() - schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd"})
             and on (job, instance, class) (schedd_snapshot_prime_pending{job="schedd"} > schedd_snapshot_prime_age_unknown{job="schedd"}))
           or ((schedd_snapshot_prime_pending{job="schedd"} == 0) * 0))
          and on (job, instance) (schedd_snapshot_prime_observation_healthy == 1)
      - alert: FaasSnapshotPrimeTelemetryUnavailable
        expr: |
          (up{job="schedd"} == 1)
          unless on (job, instance)
            ((schedd_snapshot_prime_observation_healthy == 1)
             or (schedd_snapshot_prime_observation_enabled{job="schedd"} == 0))
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: snapshot_prime_telemetry
          public_status: internal
        annotations:
          summary: Snapshot-prime handoff diagnostics are unavailable
          description: Schedd is scraped but its handoff snapshot is failed, missing, inconsistent or older than two
            minutes, or initialized recovery counters are incomplete. Work counts and ages are unknown. Check the
            observer, database, clocks and binary. Intentional observer shutdown is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotPrime.md
      - alert: FaasSnapshotPrimeWaiting
        expr: |
          (schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="waiting"} > 300)
          and on (job, instance) (schedd_snapshot_prime_observation_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: snapshot_prime
          public_status: internal
        annotations:
          summary: Snapshot preparation is eligible but has not advanced
          description: An attempt currently classified waiting has a known boundary older than five minutes,
            sustained for five minutes. The boundary is no earlier than stage start, release success, runtime
            invalidation and known instance activity. Release gates, active captures, fresh parked captures and
            recorded snapshots are separate. This does not prove continuous idle time, a stopped scheduler or readiness failure.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotPrime.md
      - alert: FaasSnapshotPrimeEvidenceUnknown
        expr: |
          ((schedd_snapshot_prime_pending{job="schedd",class="unknown"} > 0)
           or (schedd_snapshot_prime_age_unknown{job="schedd",class="waiting"} > 0))
          and on (job, instance) (schedd_snapshot_prime_observation_healthy == 1)
          and on (job, instance) (schedd_snapshot_prime_observation_enabled{job="schedd"} == 1)
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: snapshot_prime_telemetry
          public_status: internal
        annotations:
          summary: Snapshot-prime eligibility or timing evidence is incomplete
          description: Fresh observations have contained {{ $labels.class }} attempts with incomplete eligibility or
            timing evidence for 15m. Missing, invalid or future stage/activity times cannot establish a wait age.
            Inspect durable stages, artifacts and release/runtime evidence without rewriting timestamps or bypassing gates.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotPrime.md
      - alert: FaasSnapshotPrimeRecoveryQueriesFailing
        expr: |
          (sum by (job, instance) (rate(schedd_snapshot_prime_recovery_queries_total{job="schedd",outcome="error"}[5m]))
           / sum by (job, instance) (rate(schedd_snapshot_prime_recovery_queries_total{job="schedd",outcome=~"success|error"}[5m])) > 0.1)
          and on (job, instance) (sum by (job, instance) (increase(schedd_snapshot_prime_recovery_queries_total{job="schedd",outcome="error"}[5m])) >= 3)
          and on (job, instance) (schedd_snapshot_prime_observation_healthy == 1)
          and on (job, instance) (schedd_snapshot_prime_observation_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: snapshot_prime
          public_status: internal
        annotations:
          summary: Snapshot-prime recovery listings are persistently failing
          description: Recovery list errors exceed 10% of non-canceled calls with at least three errors per rolling
            five-minute window, sustained for five minutes. A healthy observation reader does not prove recovery
            listings succeed. Candidate gates and active captures are separate decisions.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotPrime.md

      - record: imaged_post_capture_class_observation_healthy
        expr: |
          ((imaged_post_capture_pending{job="imaged",class=~"publication_pending|activation_pending|dependency_held|compatibility_held|hosting_verifying|hosting_retry|gate_overdue|unknown"} >= 0) * 0 + 1)
          and on (job, instance, class) (imaged_post_capture_pending{job="imaged"} < +Inf)
          and on (job, instance, class) (imaged_post_capture_pending{job="imaged"} == floor(imaged_post_capture_pending{job="imaged"}))
          and on (job, instance, class) (imaged_post_capture_age_unknown{job="imaged"} >= 0)
          and on (job, instance, class) (imaged_post_capture_age_unknown{job="imaged"} == floor(imaged_post_capture_age_unknown{job="imaged"}))
          and on (job, instance, class) (imaged_post_capture_age_unknown{job="imaged"} <= imaged_post_capture_pending{job="imaged"})
          and on (job, instance, class) (imaged_post_capture_oldest_boundary_timestamp_seconds{job="imaged"} <= time())
          and on (job, instance, class)
            (((imaged_post_capture_pending{job="imaged"} > imaged_post_capture_age_unknown{job="imaged"})
              and on (job, instance, class) (imaged_post_capture_oldest_boundary_timestamp_seconds{job="imaged"} > 0))
             or ((imaged_post_capture_pending{job="imaged"} == imaged_post_capture_age_unknown{job="imaged"})
                 and on (job, instance, class) (imaged_post_capture_oldest_boundary_timestamp_seconds{job="imaged"} == 0)))
          and on (job, instance) (up{job="imaged"} == 1)
          and on (job, instance) (imaged_post_capture_collection_success{job="imaged"} == 1)
          and on (job, instance) (imaged_post_capture_collection_last_success_timestamp_seconds{job="imaged"} > 0)
          and on (job, instance) (time() - imaged_post_capture_collection_last_success_timestamp_seconds{job="imaged"} >= 0)
          and on (job, instance) (time() - imaged_post_capture_collection_last_success_timestamp_seconds{job="imaged"} <= 120)
          and on (job, instance) ((imaged_post_capture_observation_enabled{job="imaged"} == 0) or (imaged_post_capture_observation_enabled{job="imaged"} == 1))
          unless on (job, instance, class) (imaged_post_capture_pending{job="imaged",class="unknown"} != imaged_post_capture_age_unknown{job="imaged",class="unknown"})
      - record: imaged_post_capture_observation_healthy
        expr: |
          (count by (job, instance) (imaged_post_capture_class_observation_healthy == 1) == 8) / 8
          and on (job, instance) (count by (job, instance) (imaged_deployment_activation_attempts_total{job="imaged",input=~"snapshot|ready",phase=~"evidence|dependency|verification|promotion|finalize",outcome=~"success|error|deferred|held|canceled"} >= 0) == 50)
      - record: imaged_post_capture_oldest_known_boundary_age_seconds
        expr: |
          (((time() - imaged_post_capture_oldest_boundary_timestamp_seconds{job="imaged"})
             and on (job, instance, class) (imaged_post_capture_pending{job="imaged"} > imaged_post_capture_age_unknown{job="imaged"}))
           or ((imaged_post_capture_pending{job="imaged"} == 0) * 0))
          and on (job, instance) (imaged_post_capture_observation_healthy == 1)
      - alert: FaasPostCaptureTelemetryUnavailable
        expr: |
          (up{job="imaged"} == 1)
          unless on (job, instance) ((imaged_post_capture_observation_healthy == 1)
           or (imaged_post_capture_observation_enabled{job="imaged"} == 0))
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: post_capture_telemetry
          public_status: internal
        annotations:
          summary: Post-capture diagnostics are unavailable
          description: Imaged is scraped but its post-capture snapshot is missing, failed, inconsistent, older than two minutes,
            or has incomplete activation counters. Counts and ages are unknown. Check the observer, database, clocks and binary;
            intentional shutdown is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostCapture.md
      - alert: FaasSnapshotPublicationPending
        expr: |
          (imaged_post_capture_oldest_known_boundary_age_seconds{class="publication_pending"} > 300)
          and on (job, instance) (imaged_post_capture_observation_healthy == 1)
          and on (job, instance) (imaged_post_capture_observation_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: post_capture
          public_status: internal
        annotations:
          summary: A fresh parked capture still lacks init publication
          description: A currently unpublished capture has a known parked boundary older than five minutes, held five minutes.
            Inspect snapshot_written delivery, publication outcomes, runtime receipts and imaged storage/database errors. Parking
            is evidence of capture, not artifact acceptance or readiness.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostCapture.md
      - alert: FaasDeploymentActivationPending
        expr: |
          (imaged_post_capture_oldest_known_boundary_age_seconds{class=~"activation_pending|hosting_verifying|hosting_retry"} > 300)
          and on (job, instance) (imaged_post_capture_observation_healthy == 1)
          and on (job, instance) (imaged_post_capture_observation_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: post_capture
          public_status: internal
        annotations:
          summary: A published init snapshot still awaits activation
          description: A currently {{ $labels.class }} candidate has a known publication or verification boundary older than
            five minutes, held five minutes. Inspect retained hosting receipts, delivery retries and promotion errors. Age
            is not continuous class residence; dependency and compatibility holds are separate.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostCapture.md
      - alert: FaasDeploymentActivationGateUnfinalized
        expr: |
          (imaged_post_capture_pending{job="imaged",class="gate_overdue"} > 0)
          and on (job, instance) (imaged_post_capture_observation_healthy == 1)
          and on (job, instance) (imaged_post_capture_observation_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: post_capture
          public_status: internal
        annotations:
          summary: A failed or expired activation gate remains nonterminal
          description: A snapshotting candidate retains a failed dependency gate or an expired dependency/hosting retry deadline
            for five minutes. Inspect imaged replay and terminal-evidence writes. Do not bypass the gate or move the serving
            pointer manually.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostCapture.md
      - alert: FaasPostCaptureEvidenceUnknown
        expr: |
          ((imaged_post_capture_pending{job="imaged",class="unknown"} > 0)
           or (imaged_post_capture_age_unknown{job="imaged"} > 0))
          and on (job, instance) (imaged_post_capture_observation_healthy == 1)
          and on (job, instance) (imaged_post_capture_observation_enabled{job="imaged"} == 1)
        for: 15m
        labels:
          severity: warn
          component: imaged
          family: post_capture_telemetry
          public_status: internal
        annotations:
          summary: Post-capture classification or timing evidence is incomplete
          description: Fresh observations have contained incomplete {{ $labels.class }} evidence for 15 minutes. Missing, invalid
            or future times cannot establish a publication or activation wait. Inspect durable capture, stage, gate and verification
            evidence without inventing timestamps.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostCapture.md
      - alert: FaasSnapshotPublicationErrors
        expr: |
          (sum by (job, instance) (rate(imaged_snapshot_publication_total{job="imaged",outcome=~"write_error|policy_error"}[5m]))
           / sum by (job, instance) (rate(imaged_snapshot_publication_total{job="imaged",outcome=~"published|duplicate|write_error|policy_error"}[5m])) > 0.1)
          and on (job, instance) (sum by (job, instance) (increase(imaged_snapshot_publication_total{job="imaged",outcome=~"write_error|policy_error"}[5m])) >= 3)
          and on (job, instance) (imaged_post_capture_observation_healthy == 1)
          and on (job, instance) (imaged_post_capture_observation_enabled{job="imaged"} == 1)
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: post_capture
          public_status: internal
        annotations:
          summary: Snapshot publication writes or policy reads repeatedly fail
          description: Publication write_error or policy_error outcomes exceed 10% of publication decisions with at least three
            errors per rolling five minutes, held five minutes. Inspect database, runtime-policy reads and replay. Stale captures,
            RAM/policy rejections and customer verification verdicts are excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasPostCapture.md

      # Recovery is observed separately from queue wait. Fleet gauges are
      # coherent per apid; never sum replicas. Timing uses effective config
      # from every discovered builder. Age warnings measure overdue work;
      # the stalled-loop allowance also includes all serial cleanup timeouts.
      - record: faas_build_recovery_observation_healthy
        expr: |
          (apid_build_recovery_collection_success{job="apid"} == 1)
          and on (job, instance) (up{job="apid"} == 1)
          and on (job, instance) (apid_build_recovery_collection_last_success_timestamp_seconds{job="apid"} > 0)
          and on (job, instance) (time() - apid_build_recovery_collection_last_success_timestamp_seconds{job="apid"} >= 0)
          and on (job, instance) (time() - apid_build_recovery_collection_last_success_timestamp_seconds{job="apid"} <= 120)
          and on (job, instance) (faas_build_vm_cleanup_retry_pending{job="apid"} >= 0)
          and on (job, instance) (faas_build_vm_cleanup_retry_pending{job="apid"} <= faas_build_vm_cleanup_pending{job="apid"})
          and on (job, instance)
          (((faas_build_running_count{job="apid"} == 0) and on (job, instance) (faas_build_running_oldest_started_timestamp_seconds{job="apid"} == 0))
           or ((faas_build_running_count{job="apid"} > 0) and on (job, instance) (faas_build_running_oldest_started_timestamp_seconds{job="apid"} > 0)
               and on (job, instance) (faas_build_running_oldest_started_timestamp_seconds{job="apid"} <= time())))
          and on (job, instance)
          (((faas_build_vm_cleanup_pending{job="apid"} == 0) and on (job, instance) (faas_build_vm_cleanup_oldest_created_timestamp_seconds{job="apid"} == 0))
           or ((faas_build_vm_cleanup_pending{job="apid"} > 0) and on (job, instance) (faas_build_vm_cleanup_oldest_created_timestamp_seconds{job="apid"} > 0)
               and on (job, instance) (faas_build_vm_cleanup_oldest_created_timestamp_seconds{job="apid"} <= time())))
      - record: faas_build_running_oldest_age_seconds
        expr: |
          ((time() - faas_build_running_oldest_started_timestamp_seconds{job="apid"})
           and on (job, instance) (faas_build_running_count{job="apid"} > 0)
           and on (job, instance) (faas_build_recovery_observation_healthy == 1))
          or ((faas_build_running_count{job="apid"} == 0)
              and on (job, instance) (faas_build_recovery_observation_healthy == 1))
      - record: faas_build_vm_cleanup_oldest_age_seconds
        expr: |
          ((time() - faas_build_vm_cleanup_oldest_created_timestamp_seconds{job="apid"})
           and on (job, instance) (faas_build_vm_cleanup_pending{job="apid"} > 0)
           and on (job, instance) (faas_build_recovery_observation_healthy == 1))
          or ((faas_build_vm_cleanup_pending{job="apid"} == 0)
              and on (job, instance) (faas_build_recovery_observation_healthy == 1))
      - record: builderd_build_reaper_observation_healthy
        expr: |
          (up{job="builderd"} == 1)
          and on (job, instance) (builderd_build_reaper_started_timestamp_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_reaper_started_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_reaper_interval_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_reaper_threshold_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_reaper_cleanup_budget_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_reaper_last_attempt_timestamp_seconds{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_reaper_last_attempt_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_reaper_last_success_timestamp_seconds{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_reaper_last_success_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_reaper_last_completed_timestamp_seconds{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_reaper_last_completed_timestamp_seconds{job="builderd"} <= time())
          and on (job, instance) (builderd_build_reaper_last_pass_success{job="builderd"} >= 0)
          and on (job, instance) (builderd_build_reaper_last_pass_success{job="builderd"} <= 1)
      - record: builderd_build_reaper_progress_allowance_seconds
        expr: |
          (2 * builderd_build_reaper_interval_seconds{job="builderd"}
           + on (job, instance) builderd_build_reaper_cleanup_budget_seconds{job="builderd"})
          and on (job, instance) (builderd_build_reaper_observation_healthy == 1)
      - record: faas_build_running_recovery_allowance_seconds
        expr: |
          max((builderd_build_reaper_threshold_seconds{job="builderd"} + on (job, instance) 2 * builderd_build_reaper_interval_seconds{job="builderd"}) and on (job, instance) (builderd_build_reaper_observation_healthy == 1))
          and on () (count(builderd_build_reaper_observation_healthy == 1) == count(up{job="builderd"}))
      - record: faas_build_vm_cleanup_allowance_seconds
        expr: |
          max((2 * builderd_build_reaper_interval_seconds{job="builderd"}) and on (job, instance) (builderd_build_reaper_observation_healthy == 1))
          and on () (count(builderd_build_reaper_observation_healthy == 1) == count(up{job="builderd"}))
      - alert: FaasBuildRecoveryTelemetryUnavailable
        expr: |
          (up{job="apid"} == 1)
          unless on (job, instance) (faas_build_recovery_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: build_recovery_telemetry
          public_status: internal
        annotations:
          summary: Build recovery state is unavailable
          description: The running-build and durable VM cleanup snapshot is missing, failed, inconsistent or older than
            120 seconds. Backlog state is unknown; inspect apid database access and the observation poller.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
      - alert: FaasBuilderReaperTelemetryUnavailable
        expr: |
          (up{job="builderd"} == 1)
          unless on (job, instance) (builderd_build_reaper_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_recovery_telemetry
          public_status: internal
        annotations:
          summary: Builder recovery loop telemetry is unavailable
          description: The builder is scraped but its reaper configuration or progress timestamps are missing or invalid.
            Recovery health and fleet timing allowances are unknown.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
      - alert: FaasBuildRunningOverdue
        expr: |
          faas_build_running_oldest_age_seconds
          > on () group_left faas_build_running_recovery_allowance_seconds
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_recovery
          public_status: internal
        annotations:
          summary: A running build is overdue for recovery
          description: A running claim has exceeded the largest configured recovery threshold plus two sweep intervals
            for 5m. Inspect reaper progress and cleanup workload; this is overdue customer work, not proof that its VM
            is still running.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
      - alert: FaasBuildVMCleanupOverdue
        expr: |
          faas_build_vm_cleanup_oldest_age_seconds
          > on () group_left faas_build_vm_cleanup_allowance_seconds
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_recovery
          public_status: internal
        annotations:
          summary: Builder VM cleanup is overdue
          description: A durable cleanup obligation has remained outstanding beyond two configured sweep intervals for
            5m. Age survives retries and live claims. Inspect cancel and result-record errors and batch throughput before
            intervening.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
      - alert: FaasBuilderReaperFailing
        expr: |
          (builderd_build_reaper_last_pass_success{job="builderd"} == 0)
          and on (job, instance) (builderd_build_reaper_last_completed_timestamp_seconds{job="builderd"} > 0)
          and on (job, instance) (builderd_build_reaper_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_recovery
          public_status: internal
        annotations:
          summary: Builder recovery pass failed
          description: The latest completed reaper pass has remained unsuccessful for 5m. A successful row sweep does
            not imply successful VM cleanup or durable result recording. Inspect operation outcomes and logs.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
      - alert: FaasBuilderReaperStalled
        expr: |
          (((time() - builderd_build_reaper_last_success_timestamp_seconds{job="builderd"}
             > on (job, instance) builderd_build_reaper_progress_allowance_seconds)
            and on (job, instance) (builderd_build_reaper_last_success_timestamp_seconds{job="builderd"} > 0))
           or ((time() - builderd_build_reaper_started_timestamp_seconds{job="builderd"}
                > on (job, instance) builderd_build_reaper_progress_allowance_seconds)
               and on (job, instance) (builderd_build_reaper_last_success_timestamp_seconds{job="builderd"} == 0)))
          and on (job, instance) (builderd_build_reaper_observation_healthy == 1)
        for: 5m
        labels:
          severity: warn
          component: builderd
          family: build_recovery
          public_status: internal
        annotations:
          summary: Builder recovery has stopped succeeding
          description: No whole recovery pass has succeeded within two configured intervals plus the full serial cleanup
            call budget, for 5m. This also detects a loop that never starts on an otherwise idle builder. Capture logs
            and goroutine evidence before restarting.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md

      # Issue #2418: builder VM exports are node-local, transient handoffs.
      # builderd inventories the tree at startup and every five minutes; the
      # default cap is 8 GiB. Both alerts stay operator-internal because they
      # describe compute SSD hygiene rather than public API availability.
      - alert: FaasBuildExportBytesHigh
        expr: builderd_build_export_bytes > 8589934592
        for: 15m
        labels:
          severity: warn
          component: builderd
          family: build_export
          public_status: internal
        annotations:
          summary: "Builder export tree remains above the 8 GiB node cap"
          description: "builderd_build_export_bytes has remained above the configured default cap for 15m. Active rootfs_path handoffs are protected from pressure eviction, so sustained growth usually means imaged is not consuming successful builds or cleanup cannot remove released directories."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildExportRetention.md"

      - alert: FaasBuildExportCleanupFailing
        expr: increase(builderd_build_export_cleanup_errors_total[15m]) > 0
        for: 15m
        labels:
          severity: warn
          component: builderd
          family: build_export
          public_status: internal
        annotations:
          summary: "Builder export cleanup is failing"
          description: "The builderd export sweeper has reported inventory, PostgreSQL lookup, file-lease, or removal errors during the last 15m. Disk usage can now grow outside the completed-export retention contract."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildExportRetention.md"

      # ─────────────────────────────────────────────────────────────────
      # PR #1111 follow-on (feat/obs-dashboards-alerts) — operator
      # surface for the obs-meta + trace-IDs metrics shipped by
      # PR #1111 (Obs-Meta + Trace-IDs Mega-PR, 5ead9b7cd).
      #
      # The metric contract from PR #1111 C1-C4: every
      # `operator.action.<verb>` audit row carries a non-NULL
      # `events.trace_id` so cross-daemon correlation (apid request
      # → schedd outcome → audit_log → events) works end-to-end.
      #
      # Source gauge:
      # `schedd_operator_action_trace_completeness_ratio{kind}`
      # set by `pkg/sched/operator_intent_completeness.go::
      # observeOperatorIntentCompleteness` on a 60s tick.
      # Pre-instantiated for the 5 verb-oriented kinds in
      # `pkg/wire/metrics.go::operatorIntentKindClosedSet`
      # (force_park, force_cold_boot, force_restart,
      # park_instance, restart_instance). The gauge IS registered
      # on every daemon (`pkg/wire/metrics.go:3150-3173`) but
      # ONLY schedd's driver calls Set — the per-daemon prefix
      # is schedd's. Cross-daemon queries mix real schedd values
      # with never-set defaults on other daemons (junk). Every
      # expression below filters to `schedd_…` to avoid that
      # pitfall; dashboards in deploy/grafana repeat the filter.
      #
      # The recording rule aggregates across the closed set,
      # `min(...)`-ing so the worst-kind ratio is the tripwire
      # (one bad kind is enough to page). `clamp_min(..., 0.001)`
      # mirrors the vmmd_cold_boot_ratio precedent further
      # down the file so any downstream alert that compares
      # against this value never divides by zero.
      #
      # Cold-start guard: on a freshly-booted schedd node every
      # kind in `schedd_operator_action_trace_completeness_ratio`
      # reads the Prometheus GaugeVec default (0) until the
      # driver completes its first query. The explicit first-tick
      # counter is the source of truth for that state; using the
      # gauge sum was unsafe because a panic before the Set loop
      # is indistinguishable from a healthy, not-yet-observed
      # driver. After the first successful query, a real all-zero
      # result is no longer hidden by the cold-start guard.
      #
      # Page+warn pair share `family=obs_trace, component=schedd`
      # — alertmanager's inhibit rule (page suppresses warn when
      # [family, component] match) auto-pairs them so the warn
      # never pages through while the page is firing.
      # ─────────────────────────────────────────────────────────────────
      - record: obs:operator_action_trace_completeness_ratio
        expr: clamp_min((min(schedd_operator_action_trace_completeness_ratio) unless on() (schedd_operator_action_trace_completeness_first_tick_completed_total == 0)) or on() vector(1), 0.001)

      - alert: FaasOperatorActionTraceCompletenessLowPage
        expr: obs:operator_action_trace_completeness_ratio < 0.50
        for: 10m
        labels:
          severity: warn
          family: obs_trace
          component: schedd
        annotations:
          summary: "operator action trace completeness below 50% for 10m"
          description: "At least one operator.action.* kind (schedd gauge schedd_operator_action_trace_completeness_ratio) has fewer than 50% of audit rows carrying a non-NULL events.trace_id over the rolling 5m window for 10m. Every force_park / force_cold_boot / force_restart action is contractually required to carry a trace_id end-to-end (PR #1111 C1-C4 contract). The page fires because audit rows without trace_id break the cross-daemon correlation story."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOperatorActionTraceCompletenessLow.md"

      - alert: FaasOperatorActionTraceCompletenessLowWarn
        expr: obs:operator_action_trace_completeness_ratio < 0.95
        for: 30m
        labels:
          severity: warn
          family: obs_trace
          component: schedd
        annotations:
          summary: "operator action trace completeness below 95% for 30m"
          description: "At least one operator.action.* kind has dropped below 95% trace_id coverage over the rolling 5m window for 30m. Below the page threshold (50% / 10m) but above the warn band — the schedd driver (pkg/sched/operator_intent_completeness.go::observeOperatorIntentCompleteness) or the audit emit site may be drifting. Drill down per the runbook; the next escalation is the page alert."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOperatorActionTraceCompletenessLow.md"

      - alert: FaasOperatorActionTraceCompletenessLoopStalled
        # The schedd driver (60s tick) hasn't completed a
        # successful query in >3m. This uses an explicit producer
        # timestamp; Prometheus scrape timestamps would stay fresh
        # even when the gauge value is frozen.
        expr: (schedd_operator_action_trace_completeness_first_tick_completed_total > 0) and (time() - schedd_operator_action_trace_completeness_last_success_timestamp_seconds > 180)
        for: 5m
        labels:
          severity: info
          family: obs_trace
          component: schedd
        annotations:
          summary: "schedd obs trace completeness driver loop stale >3m"
          description: "The schedd observability driver (pkg/sched/operator_intent_completeness.go, 60s tick) has not completed a successful trace completeness query in >3m (3x the tick interval). The producer-written last-success timestamp is stale, so the gauge may be frozen while Prometheus scrapes remain healthy. Routes to faas-silent (info-tier). Drill down per the runbook; the stale signal usually means schedd's Postgres pool is exhausted or the goroutine crashed."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOperatorActionTraceCompletenessLow.md"

      - alert: FaasOperatorActionTraceCompletenessFirstTickStalled
        # A schedd that never completes its first query has no
        # trustworthy completeness signal at all. Page after ten
        # minutes so ordinary database startup jitter is tolerated,
        # while still surfacing the pre-Set panic case.
        expr: schedd_operator_action_trace_completeness_first_tick_completed_total == 0
        for: 10m
        labels:
          severity: warn
          family: obs_trace
          component: schedd
        annotations:
          summary: "schedd trace completeness driver has not completed its first tick"
          description: "The schedd observability driver has not completed a successful operator-action trace completeness query within 10m of the metric becoming visible. The completeness recording rule is intentionally guarded until this first success, so the platform currently has no trustworthy trace-correlation coverage signal. Check schedd logs and Postgres connectivity, then recover per the runbook."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasOperatorActionTraceCompletenessLow.md"

      # ─────────────────────────────────────────────────────────────────
      # PR #1111 follow-on — cross-daemon audit-write failure alert.
      #
      # The existing FaasApidAuditWriteFailures (precedent at
      # line 358-380, family=audit_write, component=apid) covers
      # apid alone. PR #1111 C2 surface ships the SAME counter
      # shape under every auditEndpointClosedSet daemon (apid,
      # schedd, meterd, gatewayd-internal — see
      # pkg/wire/metrics.go:3097), so a schedd / meterd /
      # gatewayd-internal audit-write failure spike is invisible
      # to the apid-only alert today. This rule exists precisely
      # to surface those non-apid spikes.
      #
      # Deliberate NOT-paired with FaasApidAuditWriteFailures.
      # Both are severity=warn and there is no page-tier
      # audit_write alert anywhere in this file; alertmanager's
      # inhibit rule (alertmanager.yml.j2:124-136) requires
      # source.severity=page to engage, so this cross-daemon
      # warn is independently visible regardless of component
      # label values. The component=platform vs component=apid
      # distinction keeps the two routes grouped correctly in
      # alertmanager (platform-wide email vs. apid-only queue)
      # but does NOT carry the inhibit weight — if a future
      # page-tier audit_write alert is added with the same
      # family, the inhibit rule would engage via the severity
      # match, not via component. Component labels here are
      # routing-only; severity is the inhibit lever.
      #
      # Threshold matches FaasApidAuditWriteFailures for
      # consistency (>5/min, for 5m, same `5/60` unit). The
      # `__name__=~...` regex matches every daemon's
      # *audit_log_write_failures_total series.
      # ─────────────────────────────────────────────────────────────────
      - alert: FaasAuditWriteFailuresSpike
        expr: sum(rate({__name__=~".*_audit_log_write_failures_total"}[5m])) > (5 / 60)
        for: 5m
        labels:
          severity: warn
          family: audit_write
          component: platform
        annotations:
          summary: "audit write failure rate above 5/min across all daemons for 5m"
          description: "The combined audit-write failure rate across every daemon emitting audit rows (apid, schedd, meterd, gatewayd-internal — see pkg/wire/metrics.go::auditEndpointClosedSet) has exceeded 5 failures/min over the rolling 5m window for 5m. The existing FaasApidAuditWriteFailures covers apid alone; this rule catches schedd/meterd/gatewayd-internal failure spikes that the apid-only alert misses. The threshold matches FaasApidAuditWriteFailures for consistency. Drill down per the runbook by error_class and endpoint."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAuditWriteFailuresSpike.md"

  # ────────────────────────────────────────────────────────────────────
  # ADR-123 PR-C — alert_preset signal recording rules + customer-facing
  # alert rules (issue #1233 follow-up to PR-B migration 00516).
  #
  # The 5 "Coming soon" alert_preset catalog rows (`api_down`,
  # `spend_eur_20`, `deploy_failed`, `cert_expiring_14d`,
  # `queue_backlog_growing`) flipped to enabled_in_catalog=true via
  # migrations/00516. Each catalog row now has a backing signal fed
  # by meterd (api_reachable, account_spend, deployment_failed_total,
  # cert_expiry_seconds) or gatewayd-internal (queue_depth). This group
  # publishes those signals as recording rules so customer-facing
  # dashboards and the operator's account-correlation alert can read
  # them without hitting raw high-cardinality PromQL.
  #
  # Important: the EMITTED metric name on the meterd side uses the
  # `meterd_` prefix (cmd/meterd/main.go:811 calls
  # wire.NewOpsMetrics("meterd")), NOT the legacy `apid_` prefix that
  # some accessor names + comments still reference. Recording rules
  # below MUST use the emitted names — promtool check rules validates
  # the literal metric names against the rule file.
  #
  # Severity rationale: every alert in this group is severity=warn
  # (ticket-only email via the faas-warn route). These are
  # customer-facing signals that operators should know about but
  # that don't page. The corresponding FaasAlertPresetAnyFiringAccount
  # correlation rule is also warn, because per-customer alerts being
  # firing is not a platform outage.
  #
  # Counter note: faas_deploy_failed_over_1h uses `increase()` over a
  # counter (FaasRestartLoop at line 1295 is the precedent). Gauges
  # (api_reachable, account_spend_eur, cert_expiry_seconds, queue_depth)
  # are read directly. The cert_expiry recording rule uses
  # `min(... by (account_id, app_id))` because the underlying metric
  # fans out by `hostname` — we want the soonest-expiring cert per
  # (account, app) pair so the alert represents the customer-visible
  # surface.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_alert_preset_signals
    interval: 30s
    rules:
      # ── Recording rules ──────────────────────────────────────────
      - record: faas_api_down_over_5m:by_account_app
        # meterd_api_reachable is retained as the bounded app_id to
        # account_id label map. Its value only observes durable async
        # invocation rows, so it cannot classify ordinary public HTTP
        # traffic. Emit no series for an idle app.
        expr: |
          (
            (meterd_api_reachable * 0)
            + on (app_id) group_left
              label_replace(
                (
                  sum by (app) (
                    increase(gateway_requests_total{app!="-",code=~"2.."}[5m])
                  )
                  or
                  sum by (app) (
                    increase(gateway_requests_total{app!="-"}[5m])
                  ) * 0
                ) > bool 0,
                "app_id", "$1", "app", "(.*)"
              )
          )
          and on (app_id)
          label_replace(
            sum by (app) (
              increase(gateway_requests_total{app!="-"}[5m])
            ) > 0,
            "app_id", "$1", "app", "(.*)"
          )

      - record: faas_spend_eur_20_over_24h:by_account
        expr: meterd_account_spend_eur

      - record: faas_deploy_failed_over_1h:by_account_app
        expr: increase(meterd_deployment_failed_total[1h])

      - record: faas_cert_expiring_14d_over_24h:by_account_app
        expr: |
          min(meterd_tenant_surface_cert_expiry_seconds) by (account_id, app_id)

      - record: faas_queue_backlog_growing_over_15m:by_app_account
        expr: |
          max(gateway_queue_depth) by (app, account_id)

      # ── Alert rules (one per recording rule, severity=warn) ──────
      - alert: FaasApiDownAccount
        expr: faas_api_down_over_5m:by_account_app < 1
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: alert_preset_signals
          preset: api_down
        annotations:
          summary: "API reachability below 1.0 for app {{ $labels.app_id }} (account {{ $labels.account_id }})"
          description: "Public traffic for app {{ $labels.app_id }} (account {{ $labels.account_id }}) has completed without any 2xx response in each rolling 5m window for 5m. Idle apps do not fire. This is the alert_preset catalog `api_down` signal. Cross-check gateway request status and queue panels; common causes: customer app crashes, repeated wake failures, or gateway queue saturation."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiDown.md"

      - alert: FaasSpendEur20Account
        expr: faas_spend_eur_20_over_24h:by_account > 20
        for: 1h
        labels:
          severity: warn
          component: meterd
          family: alert_preset_signals
          preset: spend_eur_20
        annotations:
          summary: "Account {{ $labels.account_id }} spend > $20 over 24h"
          description: "meterd_account_spend_eur{account_id=\"{{ $labels.account_id }}\"} has been over $20 (billing currency, ADR-1430) over the rolling 24h window for 1h. This is the alert_preset catalog `spend_eur_20` signal. Cross-check the per-account billing panel; the customer may have crossed their plan tier or be experiencing runaway invocations. The 1h `for:` matches the catalog's `default_cooldown_minutes` to avoid re-firing on a single blip."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSpendEur20.md"

      - alert: FaasDeployFailedAccount
        # `for: 5m` (NOT 1h) — the underlying recording rule is
        # `increase(meterd_deployment_failed_total[1h]) > 0`. A
        # single counter bump is true for at most ~2h (the bump
        # must stay inside the [eval-1h, eval] window for increase
        # to register). A `for: 1h` would never fire: the bump
        # slides out before the for-window elapses. This matches
        # the FaasNewCve precedent at line ~1339 (increase[1h]
        # paired with for: 1m). The catalog's `window_spec=1h` is
        # the DETECTION window — already in the recording rule's
        # expression. The `for:` is just hysteresis.
        expr: faas_deploy_failed_over_1h:by_account_app > 0
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: alert_preset_signals
          preset: deploy_failed
        annotations:
          summary: "Deploy failure observed for app {{ $labels.app_id }} (account {{ $labels.account_id }})"
          description: "meterd_deployment_failed_total{account_id=\"{{ $labels.account_id }}\",app_id=\"{{ $labels.app_id }}\"} increased by >= 1 over the rolling 1h window, sustained for 5m. This is the alert_preset catalog `deploy_failed` signal. The `increase()` over a counter means re-fires only when a new deployment transitions to `failed` status — not on every sweep. The 5m `for:` is deliberately short (FaasNewCve precedent at line ~1339) because a single counter bump slides out of the 1h increase window within ~2h; a longer `for:` would never fire. Cross-check the deployment pipeline; common causes: builder VM OOM, snapshot restore failure, or app archive rejected by the classifier."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDeployFailed.md"

      - alert: FaasCertExpiring14dAccount
        expr: faas_cert_expiring_14d_over_24h:by_account_app < 1209600
        for: 24h
        labels:
          severity: warn
          component: meterd
          family: alert_preset_signals
          preset: cert_expiring_14d
        annotations:
          summary: "Soonest-expiring cert < 14 days for app {{ $labels.app_id }} (account {{ $labels.account_id }})"
          description: "min(meterd_tenant_surface_cert_expiry_seconds) by (account_id, app_id) has been < 1209600s (=14d) for 24h. This is the alert_preset catalog `cert_expiring_14d` signal. The 24h `for:` matches the catalog's `window_spec` and `default_cooldown_minutes` (1440 = 24h). The platform-tier FaasTLSCertExpiryPage/Warn alerts (line ~870-920) are page-tier and lead this one; this alert surfaces the customer-facing catalog row. Cross-check per-host cert expiry panels and renew via the dashboard or `gregalectl certs renew`."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTLSCertExpiryPage.md"

      - alert: FaasQueueBacklogGrowingApp
        expr: faas_queue_backlog_growing_over_15m:by_app_account > 50
        for: 15m
        labels:
          severity: warn
          component: gatewayd-internal
          family: alert_preset_signals
          preset: queue_backlog_growing
        annotations:
          summary: "Gateway queue depth > 50 for app {{ $labels.app }} (account {{ $labels.account_id }}) for 15m"
          description: "max(gateway_queue_depth{app=\"{{ $labels.app }}\", account_id=\"{{ $labels.account_id }}\"}) by (app, account_id) has been > 50 for 15m. This is the alert_preset catalog `queue_backlog_growing` signal. The `account_id` label is admitted via accountLabelSet (cap=10k, overflow=`__other__`); rows past the cap roll up under `__other__` and contribute to the FaasAlertPresetAnyFiringAccount correlation under that bucket. Common causes: customer app wake latency exceeded the gateway queue cap, cold-boot snapshot restore failing repeatedly, or downstream Postgres contention."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasGatewayQueueBacklogGrowing.md"

      # ── Customer SLO burn rate (issue #1398 / O2) ────────────────
      # ADR-082 defines a 99.5% API-availability SLO, leaving a 0.5%
      # error budget. Keep the two windows as separate recordings so
      # the alert expression preserves the Google SRE multi-window
      # shape: 14.4x over 1h AND 6x over 6h. gateway_requests_total
      # is app-labelled but not account-labelled; the meterd evaluator
      # remains the account-authoritative webhook path.
      - record: faas_slo_burn_rate_1h:by_app
        expr: |
          (
            sum by (app) (rate(gateway_requests_total{app!="-",code=~"5.."}[1h]))
              /
            sum by (app) (rate(gateway_requests_total{app!="-",code=~"2..|5.."}[1h]))
              / 0.005
          )
          and on (app)
          sum by (app) (increase(gateway_requests_total{app!="-",code=~"2..|5.."}[1h])) >= 20

      - record: faas_slo_burn_rate_6h:by_app
        expr: |
          (
            sum by (app) (rate(gateway_requests_total{app!="-",code=~"5.."}[6h]))
              /
            sum by (app) (rate(gateway_requests_total{app!="-",code=~"2..|5.."}[6h]))
              / 0.005
          )
          and on (app)
          sum by (app) (increase(gateway_requests_total{app!="-",code=~"2..|5.."}[6h])) >= 20

      - alert: FaasSLOBurnRateHigh
        expr: |
          (
            faas_slo_burn_rate_1h:by_app > 14.4
          )
          and on (app)
          (
            faas_slo_burn_rate_6h:by_app > 6
          )
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: alert_preset_signals
          preset: slo_burn_rate
        annotations:
          summary: "SLO burn rate is high for app {{ $labels.app }}"
          description: "The app's API error budget exceeded the Google SRE multi-window thresholds: >14.4x over 1h and >6x over 6h of the ADR-082 99.5% availability SLO. gateway_requests_total is app-labelled; use the meterd alert delivery or app dashboard to correlate the app with its customer account."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSLOBurnRateHigh.md"

      # ── Account-level correlation (all 5 signals) ─────────────────
      # Correlate the actual per-preset alert series rather than repeating
      # their raw recording-rule predicates. This keeps each source alert's
      # own `for:` hold semantics authoritative: a pending signal must not
      # make the account rollup fire early. max() collapses multiple apps
      # for one preset before the outer count reports distinct preset types.
      - alert: FaasAlertPresetAnyFiringAccount
        expr: |
          count by (account_id) (
            max by (account_id, preset) (
              ALERTS{alertstate="firing", family="alert_preset_signals", account_id!=""}
            )
          ) >= 1
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: alert_preset_correlation
        annotations:
          summary: "Account {{ $labels.account_id }} has >=1 alert_preset firing"
          description: "One or more alert_preset signal(s) for account {{ $labels.account_id }} are currently firing: api_down, spend_eur_20, deploy_failed, cert_expiring_14d, or queue_backlog_growing. The correlation includes only per-preset alerts whose own hold period has elapsed; multiple apps firing the same preset count once. Cross-reference the per-preset alerts above for the active signal."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAlertPresetAnyFiringAccount.md"

  # ────────────────────────────────────────────────────────────────────
  # Managed PostgreSQL preview health. These signals are deliberately
  # account/provider agnostic: the daemon metrics never carry customer IDs,
  # provider resource IDs, or error text. The provisioning gate is expected
  # to be 0 outside an explicitly approved staging canary, so it is exposed
  # for dashboards rather than turned into a noisy always-on alert.
  # ────────────────────────────────────────────────────────────────────
  - name: faas_managed_postgres
    interval: 30s
    rules:
      - record: faas_managed_postgres_reconcile_failures:rate10m
        expr: sum(rate(apid_managed_postgres_reconcile_total{outcome="failed"}[10m]))

      - record: faas_managed_postgres_usage_deferred:rate15m
        expr: sum(rate(apid_managed_postgres_usage_collection_sweeps_total{outcome=~"degraded|error"}[15m]))

      - alert: FaasManagedPostgresReconcileFailures
        expr: faas_managed_postgres_reconcile_failures:rate10m > 0
        for: 5m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL reconciliation is failing"
          description: "The managed PostgreSQL lifecycle or binding reconciler has recorded a failed attempt during the last 10m. Inspect the apid managed-postgres logs and the resource state; provider errors are normalized and never include credentials or connection URLs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

      - alert: FaasManagedPostgresReconcileDeferred
        expr: sum(rate(apid_managed_postgres_reconcile_total{outcome="deferred"}[10m])) > 0
        for: 15m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL reconciliation is deferred"
          description: "Managed PostgreSQL lifecycle or binding work has remained deferred for 15m. This commonly means the provider is unavailable, the rollout gate is closed, or a parent resource is not ready; verify the gate before retrying provider work."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

      - alert: FaasManagedPostgresUsageCollectionStale
        expr: |
          apid_managed_postgres_usage_policy_enabled == 1
          and
          (
            apid_managed_postgres_usage_last_success_timestamp_seconds == 0
            or time() - apid_managed_postgres_usage_last_success_timestamp_seconds > 900
          )
        for: 10m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL usage collection is stale"
          description: "The usage ledger is enabled but apid has not completed a full provider usage sweep for more than 15m. New database reservations fail closed while observations are stale; check the usage collector, provider API, and apid database connectivity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

      - alert: FaasManagedPostgresUsageCollectionDeferred
        expr: faas_managed_postgres_usage_deferred:rate15m > 0
        for: 10m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL usage collection is partially deferred"
          description: "At least one managed PostgreSQL usage sweep was degraded or failed during the last 15m. The collector preserves complete-window accounting and leaves incomplete resources for retry; inspect deferred counts before changing COGS ceilings."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

      # Each replica reports the whole catalog. max avoids counting tenants twice.
      - alert: FaasManagedPostgresHealthDegraded
        expr: max(apid_managed_postgres_health_databases{status="degraded"} and on(job, instance) (apid_managed_postgres_health_enabled == 1)) > 0
        for: 5m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL provider health is degraded"
          description: "At least one ready database has a fresh provider failure, missing resource, or specification mismatch. Inspect cached customer health and provider metadata; suspended compute is healthy and health collection never opens SQL connections or repairs resources."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

      - alert: FaasManagedPostgresHealthStale
        expr: max(apid_managed_postgres_health_databases{status="stale"} and on(job, instance) (apid_managed_postgres_health_enabled == 1)) > 0
        for: 10m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL health observations are stale"
          description: "At least one ready database has no recent metadata check. Check collector capacity, provider backoff, and apid catalog connectivity before relying on cached health."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

      - alert: FaasManagedPostgresHealthCollectorStalled
        expr: |
          apid_managed_postgres_health_enabled == 1
          and
          (
            apid_managed_postgres_health_last_sweep_timestamp_seconds == 0
            or time() - apid_managed_postgres_health_last_sweep_timestamp_seconds > apid_managed_postgres_health_stale_after_seconds
          )
        for: 5m
        labels:
          severity: warn
          component: apid
          family: managed_postgres
        annotations:
          summary: "Managed PostgreSQL health collector is stalled"
          description: "An enabled apid health collector has not completed a catalog sweep within its freshness window. Check apid logs and catalog connectivity; provider failures are recorded as degraded checks and do not stop successful sweeps."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasManagedPostgresDegraded.md"

  - name: faas_stale_deployments
    interval: 30s
    rules:
      - alert: FaasStaleDeploymentBacklog
        expr: max(imaged_stale_deployment_oldest_age_seconds) > 7200
        for: 10m
        labels:
          severity: warn
          component: imaged
          family: stale_deployment
        annotations:
          summary: "A deployment pipeline has remained nonterminal for more than two hours"
          description: "imaged's bounded stale-deployment reconciler still sees a pending, building, imaging, or snapshotting deployment older than two hours. The row may have active build work, a failed CAS repair, or a backlog larger than one sweep batch. Inspect the deployment and use the supported repair command from the runbook."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasStaleDeploymentBacklog.md"

  - name: compute_heartbeat_retention
    interval: 1m
    rules:
      - alert: FaasComputeHeartbeatRetentionStalled
        expr: |
          schedd_compute_heartbeat_retention_last_success_timestamp_seconds == 0
          or time() - schedd_compute_heartbeat_retention_last_success_timestamp_seconds > 7200
          or absent(schedd_compute_heartbeat_retention_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: compute_heartbeat_retention
          public_status: internal
        annotations:
          summary: "Raw compute-heartbeat retention has stalled"
          description: "Schedd has not completed the bounded heartbeat rollup and retention pass for more than two hours. Raw compute_node_heartbeats storage is unbounded until this is repaired."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeHeartbeatRetentionStalled.md"

      - alert: FaasComputeHeartbeatRetentionBacklog
        expr: schedd_compute_heartbeat_retention_oldest_raw_age_seconds > 691200
        for: 30m
        labels:
          severity: warn
          component: schedd
          family: compute_heartbeat_retention
          public_status: internal
        annotations:
          summary: "Raw compute-heartbeat backlog exceeds the seven-day policy"
          description: "The oldest raw compute heartbeat is more than eight days old, so bounded cleanup is not catching up within its one-day tolerance. Hourly rollups remain the long-term capacity record."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeHeartbeatRetentionStalled.md"

  - name: compute_node_failover
    interval: 1m
    rules:
      - alert: FaasComputeNodeFlapping
        expr: sum(increase(schedd_recovery_event_emitted_total{kind="failed"}[30m])) >= 3
        labels:
          severity: page
          component: schedd
          family: compute_node_failover
          public_status: internal
        annotations:
          summary: "Compute nodes keep failing over"
          description: "Schedd marked compute nodes unavailable at least three times in 30 minutes. Each failover parks every instance on the node. On production-us a starved control plane did this about 22 times per node while the nodes were healthy (hunt #9, H9-171)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeNodeFlapping.md"

      - alert: FaasInstancesRecreatedByRecovery
        expr: sum(increase(schedd_recreate_decisions_total{outcome="succeeded"}[15m])) > 0
        labels:
          severity: warn
          component: schedd
          family: compute_node_failover
          public_status: internal
        annotations:
          summary: "The recovery arbiter parked running instances"
          description: "Running instances were parked because their node was marked unavailable. Their customers lost in-memory state, and if the node was alive the VMs may still be running behind parked rows."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeNodeFlapping.md"

  - name: app_deletion_grace
    interval: 1m
    rules:
      - alert: FaasAppDeletionDeadlineMissing
        expr: apid_app_grace_missing_deadlines > 0
        for: 10m
        labels:
          severity: warn
          component: apid
          family: app_deletion_grace
          public_status: internal
        annotations:
          summary: "Deleted app tombstones are missing purge deadlines"
          description: "Apid quarantined at least one deleted app because its deletion deadline is missing. The row and its artifacts will remain until the deadline invariant is repaired."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppDeletionGraceDegraded.md"

      - alert: FaasAppDeletionArtifactsRetained
        expr: apid_app_grace_expired_artifact_bytes > 0
        for: 30m
        labels:
          severity: warn
          component: apid
          family: app_deletion_grace
          public_status: internal
        annotations:
          summary: "Expired app artifacts remain on persistent storage"
          description: "Known artifact bytes remain after their app deletion grace expired. Apid retains the database references and retries cleanup rather than orphaning the objects."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppDeletionGraceDegraded.md"

  - name: compute_node_key_lifecycle
    interval: 1m
    rules:
      - alert: FaasComputeNodeTrustedKeyOverflow
        expr: schedd_compute_node_trusted_keys > 2
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: compute_node_key_lifecycle
          public_status: internal
        annotations:
          summary: "A compute node has too many trusted capacity signing keys"
          description: "Schedd trusts more than the current key and one bounded rotation-overlap key for a compute node. Treat the extra credentials as a capacity-report authentication incident."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeNodeTrustedKeyOverflow.md"

  - name: snapshot_remote_delete
    interval: 1m
    rules:
      - alert: FaasSnapshotRemoteDeleteBacklog
        expr: imaged_snapshot_remote_delete_backlog_count > 0 and imaged_snapshot_remote_delete_backlog_oldest_age_seconds > 1800
        for: 15m
        labels:
          severity: warn
          component: imaged
          family: snapshot_remote_delete
          public_status: internal
        annotations:
          summary: "Snapshot artifacts are waiting for verified remote deletion"
          description: "Imaged has retained GC tombstones for more than 30 minutes because at least one remote snapshot artifact has not been verified deleted. Restore safety is preserved, but registry storage will grow until cleanup succeeds."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotRemoteDeleteBacklog.md"

      - alert: FaasSnapshotRemoteDeleteFailures
        expr: increase(imaged_snapshot_remote_delete_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warn
          component: imaged
          family: snapshot_remote_delete
          public_status: internal
        annotations:
          summary: "Remote snapshot deletion is failing"
          description: "At least one snapshot memory or VM-state artifact could not be deleted remotely. Imaged kept its database tombstone and will retry on the normal GC interval."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotRemoteDeleteBacklog.md"

  - name: internal_mtls_lifecycle
    interval: 1m
    rules:
      - alert: FaasInternalMTLSLeafExpiryWarning
        expr: faas_internal_mtls_leaf_earliest_expiry_timestamp_seconds - time() < 2592000
        for: 1h
        labels:
          severity: warn
          component: gregalectl
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "An internal mTLS leaf expires within 30 days"
          description: "The earliest active internal mTLS leaf for {{ $labels.host }}/{{ $labels.daemon }} expires in less than 30 days. The daily renewal should replace it before the 14-day paging threshold."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

      - alert: FaasInternalMTLSLeafExpiryCritical
        expr: faas_internal_mtls_leaf_earliest_expiry_timestamp_seconds - time() < 1209600
        for: 15m
        labels:
          severity: warn
          component: gregalectl
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "An internal mTLS leaf expires within 14 days"
          description: "The scheduled renewal has not restored a safe validity window for {{ $labels.host }}/{{ $labels.daemon }}. Internal RPCs will fail when the leaf expires."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

      # ADR-1236: the 14-day alert above is warn; this pages while a
      # manual reissue can still finish before internal RPCs fail.
      - alert: FaasInternalMTLSLeafExpiryImminent
        expr: faas_internal_mtls_leaf_earliest_expiry_timestamp_seconds - time() < 259200
        for: 15m
        labels:
          severity: page
          component: gregalectl
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "An internal mTLS leaf expires within 72 hours"
          description: "Renewal has not restored a safe validity window for {{ $labels.host }}/{{ $labels.daemon }}, and the leaf expires within 72 hours. Internal RPCs to and from that daemon fail when it does; reissue it now."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

      - alert: FaasInternalMTLSExpiryMetricsStale
        expr: absent(faas_internal_mtls_expiry_metrics_last_success_timestamp_seconds) or time() - faas_internal_mtls_expiry_metrics_last_success_timestamp_seconds > 900
        for: 15m
        labels:
          severity: warn
          component: gregalectl
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "Internal mTLS expiry metrics are stale"
          description: "At least one host has stopped publishing a complete read of its actual /etc/faas/tls leaf set. Treat expiry as unknown until the collector succeeds."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

      - alert: FaasInternalMTLSRenewalFailed
        expr: faas_internal_mtls_renewal_partial == 1 or faas_internal_mtls_renewal_last_failure_timestamp_seconds > faas_internal_mtls_renewal_last_success_timestamp_seconds
        for: 5m
        labels:
          severity: warn
          component: gregalectl
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "Scheduled internal mTLS renewal failed"
          description: "The most recent renewal failed on {{ $labels.host }}. A partial value means leaves were installed before a consumer restart or health check failed."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

      - alert: FaasInternalMTLSRenewalNeverCompleted
        expr: |
          (
            faas_internal_mtls_renewal_last_success_timestamp_seconds == 0
            and on(instance)
            time() - node_boot_time_seconds{job="node-compute"} > 90000
          )
          or
          (
            faas_internal_mtls_renewal_last_success_timestamp_seconds > 0
            and time() - faas_internal_mtls_renewal_last_success_timestamp_seconds > 90000
          )
        for: 15m
        labels:
          severity: warn
          component: gregalectl
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "Scheduled internal mTLS renewal is stale"
          description: "The host has not recorded a successful renewal check within one daily renewal interval. Verify the self-hosted runner and complete fleet inventory."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

      - alert: FaasInternalMTLSComputeMetricsMissing
        expr: up{job="node-compute"} == 0 or (up{job="node-compute"} == 1 unless on(node) faas_internal_mtls_expiry_metrics_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warn
          component: node-exporter
          family: internal_mtls_lifecycle
          public_status: internal
        annotations:
          summary: "A compute host stopped exporting internal mTLS expiry metrics"
          description: "Prometheus cannot scrape node_exporter or cannot find its internal mTLS textfile series on compute host {{ $labels.node }}; certificate expiry is unknown."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalMTLSRenewal.md"

  - name: faas_schedd_instance_stats
    interval: 30s
    rules:
      - alert: FaasScheddInstanceStatsPartialErrors
        expr: increase(schedd_instance_stats_partial_errors_total[1m]) > 5
        for: 2m
        labels:
          severity: warn
          component: schedd
          family: instance_stats
          public_status: degraded
        annotations:
          summary: "Instance telemetry is missing on {{ $labels.node }}"
          description: "The owner schedd recorded more than five missing or unreachable instance telemetry sweeps per minute for node {{ $labels.node }}. Check the vmmd capacity stream and schedd ownership before using autoscaling or customer instance metrics."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasScheddInstanceStatsPartialErrors.md"

  - name: faas_snapshot_drift_audit
    interval: 30s
    rules:
      - alert: FaasSnapshotDriftAuditUnavailable
        expr: schedd_snapshot_disk_drift_consecutive_failures > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: snapshot_integrity
          public_status: degraded
        annotations:
          summary: "Snapshot integrity inventory is unavailable"
          description: "The snapshot drift audit has failed {{ $value }} consecutive times. A zero drift counter is not authoritative until a complete inventory succeeds."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotDriftAuditUnavailable.md"
      - alert: FaasSnapshotDriftAuditStale
        expr: |
          (
            schedd_snapshot_disk_drift_last_success_timestamp_seconds == 0
            and on (job, instance)
            time() - process_start_time_seconds{job=~"schedd|schedd-compute"} > 7200
          )
          or
          (
            schedd_snapshot_disk_drift_last_success_timestamp_seconds > 0
            and time() - schedd_snapshot_disk_drift_last_success_timestamp_seconds > 7200
          )
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: snapshot_integrity
          public_status: degraded
        annotations:
          summary: "Snapshot integrity inventory is stale"
          description: "No complete snapshot drift inventory has succeeded for more than two hours. Check OCI enumeration latency and registry availability."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotDriftAuditUnavailable.md"

  - name: faas_init_snapshot_capture
    interval: 30s
    rules:
      - alert: FaasInitSnapshotCaptureFailures
        expr: |
          (
            sum by (site) (increase(schedd_init_snapshot_attempt_total{outcome=~"snapshot_failed|reuse_cleanup_failed"}[15m])) >= 3
          )
          and on (site)
          (
            sum by (site) (increase(schedd_init_snapshot_attempt_total{outcome=~"snapshot_failed|reuse_cleanup_failed"}[15m]))
            /
            clamp_min(sum by (site) (increase(schedd_init_snapshot_attempt_total[15m])), 1)
            > 0.1
          )
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: init_snapshot
        annotations:
          summary: "Init snapshot path is failing during {{ $labels.site }}"
          description: "At least three terminal init snapshot attempts failed in 15m, and failures exceeded 10% of attempts. before_checkpoint_failed is excluded because it is an application callback rejection. Inspect the capture outcome dashboard and schedd/vmmd logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInitSnapshotCaptureFailures.md"

  # ADR-1151 pause tiers: the frozen tier and quiet pause. Warnings while the
  # tiers are in canary; the dashboard is deploy/grafana/frozen-tier.json and
  # docs/runbooks/FaasFrozenTier.md covers every alert.
  - name: faas_frozen_tier
    interval: 30s
    rules:
      - alert: FaasFrozenThawFailing
        expr: |
          (
            sum by (instance) (increase(schedd_frozen_thaw_total{outcome="failed"}[15m])) >= 3
          )
          and on (instance)
          (
            sum by (instance) (increase(schedd_frozen_thaw_total{outcome="failed"}[15m]))
            /
            clamp_min(sum by (instance) (increase(schedd_frozen_thaw_total[15m])), 1)
            > 0.1
          )
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: frozen_tier
        annotations:
          summary: "Thaws of frozen instances are failing on {{ $labels.instance }}"
          description: "More than 10% of thaws failed in 15m, at least three. A failed thaw parks the frozen VM and the request restores from the snapshot instead, so wakes are slower but still served. Check vmmd thaw errors and apps whose after_restore hook fails."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFrozenTier.md"
      - alert: FaasFrozenFreezeErrors
        expr: |
          (
            sum by (instance) (increase(schedd_frozen_total{outcome="error"}[15m])) >= 3
          )
          and on (instance)
          (
            sum by (instance) (increase(schedd_frozen_total{outcome="error"}[15m]))
            /
            clamp_min(sum by (instance) (increase(schedd_frozen_total[15m])), 1)
            > 0.1
          )
        for: 10m
        labels:
          severity: warn
          component: schedd
          family: frozen_tier
        annotations:
          summary: "Idle instances are failing to freeze on {{ $labels.instance }}"
          description: "More than 10% of idle-timeout freeze attempts errored in 15m, at least three. Those instances park as before, so customers are unaffected, but the frozen tier is not freezing. Check vmmd FreezeInstance errors and vmmd and schedd version skew."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFrozenTier.md"
      - alert: FaasFrozenMemoryPressureParks
        expr: |
          (
            sum by (instance) (increase(schedd_frozen_parks_total{reason="memory_pressure"}[30m])) >= 10
          )
          and on (instance)
          (
            sum by (instance) (increase(schedd_frozen_parks_total{reason="memory_pressure"}[30m]))
            /
            clamp_min(sum by (instance) (increase(schedd_frozen_parks_total[30m])), 1)
            > 0.5
          )
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: frozen_tier
        annotations:
          summary: "Frozen instances keep being evicted for memory on {{ $labels.instance }}"
          description: "More than half of the frozen parks in 30m, at least ten, were memory-pressure evictions: frozen VMs are destroyed before a request can thaw them, so they hold memory without saving restores. Check node_frozen_resident_bytes and the node's measured memory; turn frozen_tier_apps off for the node or add capacity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFrozenTier.md"
      - alert: FaasFrozenThawSlow
        expr: |
          (
            histogram_quantile(0.95, sum by (le, instance) (rate(vmmd_thaw_seconds_bucket[15m]))) > 0.5
          )
          and on (instance)
          (
            sum by (instance) (increase(vmmd_thaw_seconds_count[15m])) >= 5
          )
        for: 15m
        labels:
          severity: warn
          component: vmmd
          family: frozen_tier
        annotations:
          summary: "Thaws of frozen instances are slow on {{ $labels.instance }}"
          description: "The p95 thaw took longer than 500ms over 15m. A thaw should take milliseconds; slow thaws come from memory faulting back in after reclaim or swap, or from a slow image healthcheck or after_restore hook. Check node_frozen_resident_bytes, host swap activity and the vmmd thaw logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFrozenTier.md"
      - alert: FaasFrozenNodeNearCap
        expr: max by (instance) (node_frozen_instances) >= 900
        for: 15m
        labels:
          severity: warn
          component: vmmd
          family: frozen_tier
        annotations:
          summary: "{{ $labels.instance }} is near the frozen instance cap"
          description: "The node holds at least 900 frozen instances, close to FrozenMaxPerNode (1000). At the cap, idle instances park instead of freezing. Check that TTL parks are running and why the node holds so many idle instances."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFrozenTier.md"
      - alert: FaasQuietResumeErrors
        expr: sum by (instance) (increase(vmmd_quiet_resume_errors_total[10m])) >= 3
        for: 5m
        labels:
          severity: warn
          component: vmmd
          family: frozen_tier
        annotations:
          summary: "Quiet-paused instances fail to resume on {{ $labels.instance }}"
          description: "vmmd failed to resume at least three quiet-paused instances in 10m. Each failure fails or retries the request that arrived. Check vmmd logs for ResumeVM errors and the node's Firecracker processes; turning vmmd's quiet_pause off stops new pauses."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasFrozenTier.md"

  - name: faas_service_rollout_handoff
    interval: 30s
    rules:
      - alert: FaasServiceRolloutHandoffBlocked
        expr: sum(increase(schedd_service_rollout_handoff_phase_duration_seconds_count{outcome=~"timeout|error"}[10m])) > 0
        for: 1m
        labels:
          severity: warn
          component: schedd
          family: service_rollout
          public_status: degraded
        annotations:
          summary: "A zero-downtime service rollout handoff is blocked"
          description: "schedd recorded a routing or request-drain timeout/error during a service rollout in the last ten minutes. Inspect the deployment's service_rollout_handoff status for the action, generation, missing gateways, retry count, and last error. The predecessor remains live while reconciliation retries."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServiceRolloutHandoffBlocked.md"

  - name: faas_durable_queue
    interval: 30s
    rules:
      - alert: FaasDurableQueueStalled
        expr: schedd_queue_depth{app!=""} > 0 and schedd_queue_oldest_age_seconds{app!=""} > 300
        for: 10m
        labels:
          severity: warn
          component: schedd
          family: durable_queue
        annotations:
          summary: "Durable queue is stalled for app {{ $labels.app }}"
          description: "The durable queue for app {{ $labels.app }} has pending or dispatching work and its oldest pending item is older than five minutes for ten minutes. Check worker capacity, queue-depth autoscaling, and lease recovery."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableQueue.md"

      - alert: FaasDurableQueueDeadLetters
        expr: schedd_queue_dead_letter{app!=""} > 0
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: durable_queue
        annotations:
          summary: "Durable queue has dead letters for app {{ $labels.app }}"
          description: "App {{ $labels.app }} has {{ $value }} durable queue invocation(s) in the terminal dead-letter state. Inspect the queue dead-letter API and replay only after correcting the worker failure."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableQueue.md"
      - alert: FaasBrokerConsumerLagHigh
        expr: schedd_esm_consumer_lag_messages{source!="queue"} > 1000
        for: 10m
        labels:
          severity: warn
          component: schedd
          family: durable_queue
        annotations:
          summary: "Broker consumer lag is high for {{ $labels.source }} shard {{ $labels.shard }}"
          description: "The schedd consumer is at least 1,000 messages behind the broker high-water mark for source {{ $labels.source }} shard {{ $labels.shard }} for ten minutes. Check the binding's worker capacity, retry rate, and broker connectivity before increasing concurrency."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableQueue.md"

  - name: faas_delayed_tasks
    interval: 30s
    rules:
      - alert: FaasDelayedTaskDispatchLag
        expr: histogram_quantile(0.99, sum by (le) (rate(schedd_delayed_task_schedule_lag_seconds_bucket[10m]))) > 60
        for: 10m
        labels:
          severity: warn
          component: schedd
          family: delayed_tasks
        annotations:
          summary: "Delayed tasks are dispatching late"
          description: "The p99 delay between a requested execution time and the first scheduler claim has exceeded 60 seconds for ten minutes. Check schedd health, invocation backlog, account concurrency pressure, and database latency."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDelayedTaskDispatchLag.md"

  - name: faas_tcp_tls
    interval: 30s
    rules:
      - alert: FaasTCPTLSCertificateUnavailable
        expr: gatewayd_public_tcp_tls_listeners_not_ready > 0
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: tcp_ingress
        annotations:
          summary: "Enabled TCP TLS listeners lack valid certificates"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTCPIngress.md"
          description: "Inspect the configured certificate directory, bundle permissions, hostname and validity. Provision complete bundles atomically or disable affected listeners. Socket readiness does not establish certificate readiness."
      - alert: FaasTCPTLSCertificateExpiring
        expr: (gatewayd_public_tcp_tls_certificate_expiry_seconds < 604800) and (gatewayd_public_tcp_tls_listeners_ready > 0)
        for: 10m
        labels:
          severity: warn
          component: gatewayd-public
          family: tcp_ingress
        annotations:
          summary: "TCP TLS certificate expires within seven days"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTCPIngress.md"
          description: "Renew the earliest-expiring enabled listener certificate and replace its complete PEM bundle atomically. Existing sessions retain their negotiated certificate; new handshakes use the replacement."
  # ─────────────────────────────────────────────────────────────────
  # ADR-520 custom-domain TLS. Caddy asks gatewayd-public before it loads,
  # obtains or renews a customer-domain certificate
  # (gateway_tls_on_demand_ask_total{decision}); apid records issuance
  # failures from its port-443 probe (apid_cert_issuance_failed_total).
  # ─────────────────────────────────────────────────────────────────
  - name: faas_custom_domain_tls
    interval: 30s
    rules:
      - alert: FaasCustomDomainTLSAskErrors
        expr: sum(increase(gateway_tls_on_demand_ask_total{decision="deny_error"}[10m])) > 0
        for: 10m
        labels:
          severity: warn
          component: gatewayd-public
          family: custom_domain_tls
        annotations:
          summary: "Custom-domain certificate checks are failing"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomDomainTLS.md"
          description: "gatewayd-public cannot read custom domains from Postgres, so the edge refuses to load, issue or renew customer certificates. Certificates already in Caddy's memory keep serving; anything else fails its TLS handshake until the store recovers."
      - alert: FaasCustomDomainTLSAskOverload
        expr: sum(rate(gateway_tls_on_demand_ask_total{decision="deny_overload"}[10m])) > 0
        for: 15m
        labels:
          severity: warn
          component: gatewayd-public
          family: custom_domain_tls
        annotations:
          summary: "Custom-domain certificate checks are being rate-limited"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomDomainTLS.md"
          description: "TLS handshakes with unknown server names exceed the ask endpoint's lookup budget for 15m, usually a scan. Legitimate names are retried on the client's next handshake but may see failed first connections."
      - alert: FaasCustomDomainCertIssuanceFailing
        expr: sum(increase(apid_cert_issuance_failed_total[1h])) >= 5
        for: 5m
        labels:
          severity: warn
          component: apid
          family: custom_domain_tls
        annotations:
          summary: "Several custom domains failed certificate issuance in the last hour"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCustomDomainTLS.md"
          description: "Five or more custom domains moved to a failed certificate state within an hour. One customer misconfiguring DNS fails one domain; this many points at the edge, the ACME CA, a rate limit, or the provider firewall."
  - name: faas_tcp_ingress
    interval: 30s
    rules:
      - alert: FaasTCPIngressQuotaRejections
        expr: sum(rate(gatewayd_public_tcp_sessions_rejected_total{reason="account_limit"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warn
          component: gatewayd-public
          family: tcp_ingress
          public_status: degraded
        annotations:
          summary: "Raw TCP account quotas are rejecting connections"
          description: "The public gateway is rejecting more than 0.1 raw TCP sessions per second for account-scoped quota exhaustion for ten minutes. Inspect account session usage and raise the quota only after confirming the workload's connection pattern."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTCPIngress.md"
      - alert: FaasTCPIngressIdleTimeoutSpike
        expr: sum(rate(gatewayd_public_tcp_idle_timeouts_total[5m])) > 1
        for: 10m
        labels:
          severity: warn
          component: gatewayd-public
          family: tcp_ingress
          public_status: degraded
        annotations:
          summary: "Raw TCP idle timeouts are spiking"
          description: "The public gateway has reaped more than one raw TCP session per second for ten minutes. Check client keepalive behavior, the configured FAAS_TCPD_IDLE_TIMEOUT, and whether a downstream service is stalling."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasTCPIngress.md"

  - name: retry_safety
    interval: 30s
    rules:
      - alert: FaasRetryBudgetMixedModes
        expr: max(gateway_retry_budget_shared{job="gatewayd-internal"}) - min(gateway_retry_budget_shared{job="gatewayd-internal"}) > 0
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: retry_safety
        annotations:
          summary: "Gateway retry budgets use mixed local and shared modes"
          description: "At least one gateway uses a process-local allowance while another uses Redis. Check the fleet Vault variable and restart all gatewayd-internal units before claiming a fleet-wide retry cap."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSharedRetryBudget.md"

      - alert: FaasRetryBudgetBackendErrors
        expr: sum(increase(gateway_retry_budget_backend_operations_total{job="gatewayd-internal",result="error"}[5m])) > 0
        for: 2m
        labels:
          severity: warn
          component: gatewayd-internal
          family: retry_safety
        annotations:
          summary: "Shared retry budget Redis operations are failing"
          description: "Gateway retries are being denied because Redis observations or admissions failed. Check Redis availability, TLS, credentials, and private transport. Original requests continue."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSharedRetryBudget.md"

      - alert: FaasRetryBudgetBackendMismatch
        expr: count(count by (backend_id) (gateway_retry_budget_backend_info{job="gatewayd-internal"})) > 1
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: retry_safety
        annotations:
          summary: "Gateways point at different shared retry budget endpoints"
          description: "Redis-backed gateways report more than one endpoint identity. Check that one common fleet Vault URL reaches every gateway before relying on the aggregate retry cap."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSharedRetryBudget.md"

      - alert: FaasRetryAmplificationHigh
        expr: |
          (
            sum(rate(gateway_retry_attempts_total{outcome=~"replay_ok|replay_failed"}[5m]))
            /
            clamp_min(sum(rate(gateway_retry_attempts_total{outcome=~"original_ok|original_failed"}[5m])), 0.001)
          ) > 0.20
          and
          sum(rate(gateway_retry_attempts_total{outcome=~"replay_ok|replay_failed"}[5m])) > 1
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: retry_safety
        annotations:
          summary: "Platform retries exceed 20% of original request traffic"
          description: "Gateway-generated replays have exceeded 20% of original attempts at more than one replay per second for ten minutes. Check transport failures and retry-rule budgets; use the retry kill switch if amplification is contributing to an incident."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRetryAmplificationHigh.md"

  - name: service_dependency
    interval: 30s
    rules:
      - alert: FaasServiceDependencyErrorsHigh
        expr: |
          (
            (
              sum by (caller_app, target_app) (
                increase(gateway_service_dependency_edge_calls_total{outcome="error"}[10m])
              )
              /
              clamp_min(
                sum by (caller_app, target_app) (
                  increase(gateway_service_dependency_edge_calls_total[10m])
                ),
                1
              )
            ) > 0.10
          )
          and on (caller_app, target_app)
          (
            sum by (caller_app, target_app) (
              increase(gateway_service_dependency_edge_calls_total{outcome="error"}[10m])
            ) >= 5
          )
          and on (caller_app, target_app)
          (
            sum by (caller_app, target_app) (
              increase(gateway_service_dependency_edge_calls_total[10m])
            ) >= 20
          )
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: service_dependency
        annotations:
          summary: "Service dependency errors are high from {{ $labels.caller_app }} to {{ $labels.target_app }}"
          description: "This trusted caller-to-target edge has exceeded a 10% final error rate with at least five errors across twenty calls in the last ten minutes for five minutes. The alert labels contain app UUIDs; use the runbook to identify the apps and inspect the edge."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServiceDependencyErrorsHigh.md"

  - name: faas_udp_ingress
    rules:
      - alert: FaasUDPListenerReconciliationFailing
        expr: increase(gatewayd_public_udp_reconciliation_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: udp_ingress
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUDPIngress.md"
          summary: "Public UDP listener reconciliation is failing"
          description: "Inspect gatewayd-public errors for durable-state reads, invalid endpoint identities or bind failures. Check enabled UDP intents and reserved port ownership before restarting the gateway."
      - alert: FaasUDPPeerFailuresHigh
        expr: sum by (instance) (rate(gatewayd_public_udp_peers_completed_total{outcome=~"admission_error|forward_error"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: udp_ingress
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUDPIngress.md"
          summary: "UDP admission or forwarding failures are sustained"
          description: "Inspect the scheduler and VMMD transport, current declared UDP ports and the deployed vmmd-udp-bridge helper. Source-policy rejection and normal idle expiry are excluded."
      - alert: FaasUDPResourceDropsHigh
        expr: sum by (instance) (rate(gatewayd_public_udp_datagrams_dropped_total{reason=~"peer_limit|queue_full|inbound_rate|outbound_rate"}[5m])) > 10
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: udp_ingress
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUDPIngress.md"
          summary: "UDP peer, queue or rate limits are dropping traffic"
          description: "Inspect client retry behavior, admission latency and active peer count. The bounded UDP queues and account rate limits intentionally drop traffic under pressure; do not raise limits without checking memory and amplification behavior."
      - alert: FaasUDPPeerResourceExhaustionHigh
        expr: sum by (instance) (rate(gatewayd_public_udp_peers_completed_total{outcome="resource_exhausted"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warn
          component: gatewayd-public
          family: udp_ingress
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUDPIngress.md"
          summary: "UDP peer resource limits are ending sessions"
          description: "UDP peer byte/message or transport resource limits are being reached repeatedly. Inspect client traffic and configured limits; this is distinct from an admission or forwarding failure."

  - name: faas-durable-entity-health
    rules:
      - alert: FaasDurableEntityHealthScanFailed
        expr: (apid_durable_entity_health_poll_success == 0) and on(job, instance) (apid_durable_entity_health_enabled == 1)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: durable_entities
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableEntityHealth.md"
          summary: "Durable entity health discovery is failing"
          description: "Read-only bucket health scans are failing or encountering unverifiable committed state. Previous gauges remain historical; do not treat them as current inventory."
      - alert: FaasDurableEntityHealthScanStale
        expr: (time() - apid_durable_entity_health_last_success_timestamp_seconds > 900) and on(job, instance) (apid_durable_entity_health_enabled == 1)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: durable_entities
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableEntityHealth.md"
          summary: "Durable entity health observations are stale"
          description: "This replica has no successful health rotation yet, or its last rotation is more than 15 minutes old. Check listing/read failures and rotation length before relying on backlog or exhaustion observations."
      - alert: FaasDurableEntityWorkExhausted
        expr: (apid_durable_entity_health_exhausted_entities > 0) and on(job, instance) (apid_durable_entity_health_enabled == 1) and on(job, instance) (apid_durable_entity_health_poll_success == 1) and on(job, instance) (time() - apid_durable_entity_health_last_success_timestamp_seconds < 900)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: durable_entities
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableEntityHealth.md"
          summary: "Exhausted durable entity {{ $labels.target }} work was observed"
          description: "A recent successful rotation observed exhausted work. Inspect the exact entity and correct its cause before submitting owner recovery with fresh comparison fields."
      - alert: FaasDurableEntityBacklogAged
        expr: (time() - apid_durable_entity_health_oldest_pending_timestamp_seconds > 300) and (apid_durable_entity_health_oldest_pending_timestamp_seconds > 0) and (apid_durable_entity_health_pending_work > 0) and on(job, instance) (apid_durable_entity_health_enabled == 1) and on(job, instance) (apid_durable_entity_health_poll_success == 1) and on(job, instance) (time() - apid_durable_entity_health_last_success_timestamp_seconds < 900)
        for: 5m
        labels:
          severity: warn
          component: apid
          family: durable_entities
        annotations:
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDurableEntityHealth.md"
          summary: "Durable entity {{ $labels.target }} backlog has aged"
          description: "A recent rotation observed work older than five minutes. Alarm age starts at its saved deadline; outbox age uses known stored timestamps. This is sampled bucket backlog, not receiver-delivery latency."

  # ─────────────────────────────────────────────────────────────────
  # Spec §12 operator signals (ADR-1235). These rows of the §12 table
  # promised alerts that no rule implemented. All ship as warn,
  # including the rows the spec marks page, until the paging set is
  # triaged; public_status is internal so none reach the status page.
  # schedd_instance_rss_mb and _inflight_requests are not here: their
  # thresholds depend on per-app plan limits Prometheus does not have.
  # ─────────────────────────────────────────────────────────────────
  - name: faas_spec12_operator_signals
    rules:
      - alert: FaasEdgeRuleApplyHigh
        expr: sum by (kind) (rate(gateway_edge_rule_apply_total{result="error"}[5m])) * 60 > 1
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: edge_rules
          public_status: internal
        annotations:
          summary: "Edge rule kind {{ $labels.kind }} is failing more than one request per minute"
          description: "gateway_edge_rule_apply_total{result=\"error\"} for kind {{ $labels.kind }} has exceeded 1/min for 5m. Each error is a non-2xx response the edge wrote for a rule, so customers are seeing it."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEdgeRuleApplyHigh.md"
      # ADR-1236: an access-gating rule that fails to compile is dropped
      # and its route serves without the check, so those kinds page.
      - alert: FaasEdgeRuleAuthCompileError
        expr: sum by (kind) (increase(gateway_edge_rule_compile_error_total{kind=~"jwt|ip|waf"}[10m])) > 0
        for: 1m
        labels:
          severity: page
          component: gatewayd-internal
          family: edge_rules
          public_status: internal
        annotations:
          summary: "An access-gating {{ $labels.kind }} edge rule failed to compile"
          description: "gatewayd-internal dropped a {{ $labels.kind }} edge rule at load time in the last 10m. A dropped access rule is not enforced, so the route it protected is serving without that check. Fix or disable the rule now."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEdgeRuleCompileError.md"
      - alert: FaasEdgeRuleCompileError
        expr: sum by (kind) (increase(gateway_edge_rule_compile_error_total{kind!~"jwt|ip|waf"}[10m])) > 0
        for: 1m
        labels:
          severity: warn
          component: gatewayd-internal
          family: edge_rules
          public_status: internal
        annotations:
          summary: "Edge rules of kind {{ $labels.kind }} are failing to compile"
          description: "gatewayd-internal dropped at least one {{ $labels.kind }} edge rule at load time in the last 10m. A shipped rule is broken and is not being enforced; the counter is cumulative, so this alert reads new ticks only."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEdgeRuleCompileError.md"
      - alert: FaasEdgeRuleJWTFailures
        expr: sum(rate(gateway_edge_rule_match_total{kind="jwt",outcome="failed"}[5m])) * 60 > 5
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: edge_rules
          public_status: internal
        annotations:
          summary: "Edge JWT verification is rejecting more than five requests per minute"
          description: "gateway_edge_rule_match_total{kind=\"jwt\",outcome=\"failed\"} has exceeded 5/min for 5m. Customers are receiving 401s from the JWT gate; check verifier reachability and key rotation before treating it as client error."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasEdgeRuleJWTFailures.md"
      - alert: FaasResponseCacheBypassAuthedHigh
        expr: sum(rate(gateway_response_cache_total{outcome="bypass_authed"}[5m])) / sum(rate(gateway_response_cache_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: response_cache
          public_status: internal
        annotations:
          summary: "More than 5% of cacheable lookups bypass the cache as authenticated"
          description: "A cache rule is matching credentialed traffic, so more than 5% of response-cache decisions over 10m bypassed the cache as bypass_authed."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasResponseCache.md"
      - alert: FaasResponseCacheStoreSkippedHigh
        expr: sum(rate(gateway_response_cache_total{outcome="store_skipped"}[5m])) / sum(rate(gateway_response_cache_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: response_cache
          public_status: internal
        annotations:
          summary: "More than half of response-cache decisions skip the store"
          description: "More than 50% of response-cache decisions over 10m were store_skipped: origins are returning veto headers or statuses, or bodies above the 1 MiB entry limit."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasResponseCache.md"
      - alert: FaasResponseCacheStaleIfErrorHigh
        expr: sum(rate(gateway_response_cache_total{outcome="stale_if_error_served"}[5m])) / sum(rate(gateway_response_cache_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: response_cache
          public_status: internal
        annotations:
          summary: "More than 5% of cached responses are stale-if-error serves"
          description: "More than 5% of response-cache decisions over 10m served a stale entry because the origin failed. Treat it as an origin incident that the cache is masking."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasResponseCache.md"
      - alert: FaasResponseCacheL1Pressure
        expr: max by (job, instance) (gateway_response_cache_bytes) > 0.8 * 67108864
        for: 15m
        labels:
          severity: warn
          component: gatewayd-internal
          family: response_cache
          public_status: internal
        annotations:
          summary: "Response-cache L1 on {{ $labels.instance }} is above 80% of its 64 MiB ceiling"
          description: "The local response cache on {{ $labels.instance }} has held more than 80% of DefaultResponseCacheMaxBytes for 15m, so the LRU is evicting faster than hit rate can settle. Reduce route or vary_on cardinality."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasResponseCache.md"
      - alert: FaasCanaryStuckStep
        expr: sum(increase(meterd_safedeploy_orchestrator_stuck_detected_total[5m])) > 0
        for: 0m
        labels:
          severity: warn
          component: meterd
          family: safe_deploy
          public_status: internal
        annotations:
          summary: "A canary rollout is stuck at one step"
          description: "The safe-deploy orchestrator found a rollout past StuckAfterDuration at the same step in the last 5m. Traffic is held at the current split until an operator advances or aborts it."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"
      - alert: FaasSafedeployAbortSurge
        expr: sum(increase(meterd_safedeploy_orchestrator_aborted_total[5m])) > 1
        for: 5m
        labels:
          severity: warn
          component: meterd
          family: safe_deploy
          public_status: internal
        annotations:
          summary: "Safe-deploy rollouts are aborting fleet-wide"
          description: "More than one rollout aborted per 5m, sustained for 5m. A fleet-wide abort rate points at a shared cause (health gate, metrics source, platform regression) rather than one bad release."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"
      - alert: FaasSafedeployAuditEmitFailing
        expr: sum(rate(meterd_safedeploy_orchestrator_audit_emit_failed_total[5m])) > 0.1 or sum(rate(meterd_deployment_audit_emitted_total{outcome="failed"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warn
          component: meterd
          family: safe_deploy
          public_status: internal
        annotations:
          summary: "Deployment audit writes are failing"
          description: "Orchestrator or deployment audit emits have failed above 0.1/s for 10m. Rollouts keep advancing, but their audit trail is silently incomplete until writes recover."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"
      - alert: FaasSafedeployMissingTimestamp
        expr: sum(increase(meterd_safedeploy_orchestrator_stuck_check_missing_timestamp_total[15m])) > 0
        for: 0m
        labels:
          severity: warn
          component: meterd
          family: safe_deploy
          public_status: internal
        annotations:
          summary: "Canary deployments are missing canary_step_started_at"
          description: "The orchestrator saw deployment rows without canary_step_started_at in the last 15m. Stuck detection cannot evaluate those rows, so a stuck rollout among them would not be reported."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"
      - alert: FaasDeploymentAuditGCFailing
        expr: sum(increase(meterd_deployment_audit_gc_failed_total[1h])) > 0
        for: 0m
        labels:
          severity: warn
          component: meterd
          family: safe_deploy
          public_status: internal
        annotations:
          summary: "The 90-day deployment audit GC is failing"
          description: "The deployment audit retention sweep failed at least once in the last hour. Audit rows keep accumulating until it succeeds."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSafeDeployRollout.md"
      - alert: FaasWriteRedirectLeaderUnreachable
        expr: sum by (job, instance) (rate(gatewayd_write_redirect_total{outcome="leader_unreachable"}[5m])) * 60 > 0.1
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: write_redirect
          public_status: internal
        annotations:
          summary: "Standby {{ $labels.instance }} cannot reach the write leader"
          description: "Writes arriving on standby {{ $labels.instance }} are failing with leader_unreachable above 0.1/min for 5m. Customers see write errors on this node until the leader is reachable again."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/standby-write-redirect.md"
      - alert: FaasWriteRedirectLoopPrevented
        expr: sum by (job, instance) (rate(gatewayd_write_redirect_total{outcome="loop_prevented"}[5m])) * 60 > 1
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: write_redirect
          public_status: internal
        annotations:
          summary: "Write redirects on {{ $labels.instance }} are looping"
          description: "The write gate on {{ $labels.instance }} refused more than one redirect loop per minute for 5m. Two nodes disagree about the leader, or a client is replaying redirects."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/standby-write-redirect.md"
      - alert: FaasWriteRedirectMTLSFailure
        expr: sum by (job, instance) (increase(gatewayd_write_redirect_total{outcome="mTLS_failure"}[10m])) > 0
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: write_redirect
          public_status: internal
        annotations:
          summary: "Write relays from {{ $labels.instance }} are failing mTLS"
          description: "The standby write relay on {{ $labels.instance }} failed mTLS to the leader in the last 10m. Check internal certificate expiry and clock skew between the nodes."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/standby-write-redirect.md"
      - alert: FaasWriteRedirectLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, job, instance) (rate(gatewayd_write_redirect_latency_seconds_bucket[5m]))) > 3
        for: 10m
        labels:
          severity: warn
          component: gatewayd-internal
          family: write_redirect
          public_status: internal
        annotations:
          summary: "Write relay p95 on {{ $labels.instance }} is above 3s"
          description: "Relayed writes from {{ $labels.instance }} have taken more than 3s at p95 for 10m. Above 5s the relay times out, so the overlay between nodes is degrading."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/standby-write-redirect.md"
      - alert: FaasRouteLookupStaleServed
        expr: sum by (job, instance) (increase(gateway_route_lookup_stale_served_total[5m])) > 0
        for: 5m
        labels:
          severity: warn
          component: gatewayd-internal
          family: route_lookup
          public_status: internal
        annotations:
          summary: "{{ $labels.instance }} is routing from last-known-good routes"
          description: "Route lookups on {{ $labels.instance }} are erroring and the edge has served from its stale route tier for 5m. Routes change no faster than FAAS_GATEWAY_ROUTE_STALE_TTL allows; check Postgres reachability from this node."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRouteLookupStaleServed.md"
      - alert: FaasDBNotifyHubReconnects
        expr: sum by (job, instance) (increase({__name__=~".+_db_notify_hub_reconnects_total"}[5m])) > 1
        for: 5m
        labels:
          severity: warn
          component: platform
          family: db_notify_hub
          public_status: internal
        annotations:
          summary: "{{ $labels.job }} keeps losing its LISTEN connection"
          description: "{{ $labels.job }} on {{ $labels.instance }} reconnected its notify hub more than once per 5m for 5m. Check Postgres restarts and idle-connection reaping."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDBNotifyHub.md"
      - alert: FaasDBNotifyHubDropped
        expr: sum by (job, instance, channel) (rate({__name__=~".+_db_notify_hub_dropped_total"}[5m])) > 0
        for: 15m
        labels:
          severity: warn
          component: platform
          family: db_notify_hub
          public_status: internal
        annotations:
          summary: "{{ $labels.job }} is dropping {{ $labels.channel }} notifications"
          description: "A subscriber on {{ $labels.job }} ({{ $labels.instance }}) has not drained its {{ $labels.channel }} buffer for 15m. Durable tables and safety ticks recover the work, but the consumer is falling behind."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDBNotifyHub.md"
      - alert: FaasDBNotifyHubDisabled
        expr: max by (job, instance) ({__name__=~".+_db_notify_hub_conns"}) == 0 and on (job, instance) max by (job, instance) ({__name__=~".+_db_notify_hub_subscribers"}) > 0
        for: 15m
        labels:
          severity: warn
          component: platform
          family: db_notify_hub
          public_status: internal
        annotations:
          summary: "{{ $labels.job }} runs without its notify hub"
          description: "{{ $labels.job }} on {{ $labels.instance }} has subscribers but no hub connection, so FAAS_DB_NOTIFY_HUB=0 is set and each subscriber holds its own LISTEN connection. Not an outage; it consumes the pre-hub connection count against max_connections."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDBNotifyHub.md"
      - alert: FaasDBPoolNearCap
        # Only acquired connections are in use. A grown pool's idle connections
        # also report under <daemon>_db_pool_conns{state="idle"}; summing every
        # state read apid's 1 acquired + 11 idle as 12/12 and fired on every
        # daemon after rc.263 activated this rule.
        expr: sum by (job, instance) ({__name__=~".+_db_pool_conns",state="acquired"}) / on (job, instance) max by (job, instance) ({__name__=~".+_db_pool_max_conns"}) > 0.9
        for: 10m
        labels:
          severity: warn
          component: platform
          family: db_pool
          public_status: internal
        annotations:
          summary: "{{ $labels.job }} is using over 90% of its database pool"
          description: "{{ $labels.job }} on {{ $labels.instance }} has held more than 90% of its pool cap (pkg/db.DaemonMaxConnections) for 10m. Callers will start waiting for connections; FaasDBPoolStarved fires once they give up."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasDBPoolStarved.md"
      - alert: FaasScheddLoopWorkDropped
        expr: sum by (job, instance, kind) (rate(schedd_loop_work_total{outcome="dropped"}[5m])) * 60 > 1
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: loop_work
          public_status: internal
        annotations:
          summary: "schedd is dropping {{ $labels.kind }} loop work"
          description: "schedd on {{ $labels.instance }} dropped more than one {{ $labels.kind }} task per minute for 15m. The kind slot budget is too small for the notification rate; the durable table and safety ticker still recover the work, later."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasScheddLoopWork.md"
      - alert: FaasScheddLoopWorkPanicked
        expr: sum by (job, instance, kind) (increase(schedd_loop_work_total{outcome="panicked"}[10m])) > 0
        for: 0m
        labels:
          severity: warn
          component: schedd
          family: loop_work
          public_status: internal
        annotations:
          summary: "A schedd {{ $labels.kind }} handler panicked"
          description: "An off-loop {{ $labels.kind }} task on {{ $labels.instance }} panicked in the last 10m. This is a handler bug, not a capacity signal; find the stack in the schedd journal."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasScheddLoopWork.md"
      - alert: FaasSnapshotMaterializeSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(vmmd_snapshot_materialize_seconds_bucket{artifact="mem",source="materialized"}[5m]))) > 0.2
        for: 15m
        labels:
          severity: warn
          component: vmmd
          family: snapshot_materialize
          public_status: internal
        annotations:
          summary: "Wakes are fetching snapshot memory across the network"
          description: "p95 time to materialize a remote snapshot memory file has exceeded 200 ms for 15m. One fetch can exceed the whole wake budget, so placement is landing away from snapshot replicas (ADR-063)."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/snapshot-restore-performance.md"
      - alert: FaasInstanceHotLoop
        expr: max by (app, node) (schedd_instance_cpu_pct) > 90
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: instance_stats
          public_status: internal
        annotations:
          summary: "App {{ $labels.app }} is pinned above 90% CPU on {{ $labels.node }}"
          description: "An instance of {{ $labels.app }} on {{ $labels.node }} has used more than 90% CPU for 15m. A sustained ceiling usually means a hot loop in the customer app rather than load."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInstanceHotLoop.md"
      - alert: FaasScheddInstanceStatsCollectSlow
        expr: histogram_quantile(0.95, sum by (le, job, instance) (rate(schedd_instance_stats_collect_seconds_bucket[5m]))) > 0.2
        for: 10m
        labels:
          severity: warn
          component: schedd
          family: instance_stats
          public_status: internal
        annotations:
          summary: "schedd instance-stats collection on {{ $labels.instance }} is slow"
          description: "Collecting per-instance stats from vmmd has taken more than 200 ms at p95 for 10m, which points at dialer saturation; scale signals read stale data until it recovers."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasScheddInstanceStatsPartialErrors.md"
  # ADR-1575: internal CI operational evidence. Fleet gauges repeat across daemons;
  # aggregate only readable targets with max usage/counts and min limits.
  # Boot worker switches are independent of heartbeat freshness. All alerts
  # are internal warnings; disabled worker paths stay quiet. No state is mutated.
  - name: faas_internal_ci
    interval: 30s
    rules:
      - record: faas_ci:observation_enabled:by_daemon
        expr: |-
          max by (daemon) (
          label_replace(
          {__name__=~"(apid|githubd)_ci_health_enabled"} and on (job, instance) (up{job=~"apid|githubd"} == 1),
          "daemon", "$1", "__name__", "(apid|githubd)_ci_health_enabled")
          )
      - record: faas_ci:observation_up:by_daemon
        expr: |-
          max by (daemon) (
          label_replace(
          {__name__=~"(apid|githubd)_ci_health_up"} == 1
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_enabled"} == 1)
          and on (job, instance) (up{job=~"apid|githubd"} == 1),
          "daemon", "$1", "__name__", "(apid|githubd)_ci_health_up")
          )
          or on (daemon) ((faas_ci:observation_enabled:by_daemon == 1) * 0)
      - record: faas_ci:health_readable
        expr: max(faas_ci:observation_up:by_daemon)
      - record: faas_ci:observation_status:by_daemon
        expr: |-
          ((faas_ci:observation_enabled:by_daemon == 0)) * 0 + 0
          or on (daemon) ((faas_ci:observation_up:by_daemon == 1)) * 0 + 1
          or on (daemon) (((faas_ci:observation_enabled:by_daemon == 1) unless on (daemon) (faas_ci:observation_up:by_daemon == 1))) * 0 + 2
          or on (daemon) label_replace(vector(3), "daemon", "apid", "", "")
          or on (daemon) label_replace(vector(3), "daemon", "githubd", "", "")
      - record: faas_ci:worker_enabled:by_worker
        expr: |-
          max by (worker) (
          {__name__=~"(apid|githubd)_ci_worker_enabled"} and on (job, instance) (up{job=~"apid|githubd"} == 1)
          )
      - record: faas_ci:queue_worker_enabled:by_queue
        expr: |-
          max by (queue) (
          label_replace(faas_ci:worker_enabled:by_worker{worker="dispatcher"}, "queue", "executions", "", "")
          or
          label_replace(faas_ci:worker_enabled:by_worker{worker="retention"}, "queue", "retirement", "", "")
          or
          label_replace(faas_ci:worker_enabled:by_worker{worker="execution_checks"}, "queue", "check_retries", "", "")
          or
          label_replace(faas_ci:worker_enabled:by_worker{worker=~"metadata_admission|automation_admission|metadata_checks|execution_checks"}, "queue", "$1", "worker", "(.+)")
          )
      - record: faas_ci:queue_items:by_queue_condition
        expr: |-
          max by (queue, condition) (
          {__name__=~"(apid|githubd)_ci_queue_items"}
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_enabled"} == 1)
          and on (job, instance) (up{job=~"apid|githubd"} == 1)
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_up"} == 1)
          )
      - record: faas_ci:queue_oldest_item_age_seconds:by_queue
        expr: |-
          max by (queue) (
          {__name__=~"(apid|githubd)_ci_queue_oldest_item_age_seconds"}
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_enabled"} == 1)
          and on (job, instance) (up{job=~"apid|githubd"} == 1)
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_up"} == 1)
          )
      - record: faas_ci:resource_used:by_resource
        expr: |-
          max by (resource) (
          {__name__=~"(apid|githubd)_ci_resource_used"}
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_enabled"} == 1)
          and on (job, instance) (up{job=~"apid|githubd"} == 1)
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_up"} == 1)
          )
      - record: faas_ci:resource_limit:by_resource
        expr: |-
          min by (resource) (
          {__name__=~"(apid|githubd)_ci_resource_limit"}
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_enabled"} == 1)
          and on (job, instance) (up{job=~"apid|githubd"} == 1)
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_up"} == 1)
          )
      - record: faas_ci:worker_replicas:by_worker_condition
        expr: |-
          max by (worker, condition) (
          {__name__=~"(apid|githubd)_ci_worker_replicas"}
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_enabled"} == 1)
          and on (job, instance) (up{job=~"apid|githubd"} == 1)
          and on (job, instance) ({__name__=~"(apid|githubd)_ci_health_up"} == 1)
          )
      - record: faas_ci:resource_headroom:by_resource
        expr: clamp_min(faas_ci:resource_limit:by_resource - faas_ci:resource_used:by_resource, 0)
      - record: faas_ci:resource_utilization:by_resource
        expr: faas_ci:resource_used:by_resource / (faas_ci:resource_limit:by_resource > 0)
      - record: faas_ci:worker_available:by_worker
        expr: |-
          ((sum by (worker) (faas_ci:worker_replicas:by_worker_condition{condition=~"healthy|starting"}) > bool 0)
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) * 0))
          and on () (faas_ci:health_readable == 1)
      - record: faas_ci:worker_status:by_worker
        expr: |-
          (faas_ci:worker_enabled:by_worker == 0)
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) and on (worker) (faas_ci:worker_replicas:by_worker_condition{condition="healthy"} > 0)) * 0 + 1
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) and on (worker) (faas_ci:worker_replicas:by_worker_condition{condition="starting"} > 0)) * 0 + 2
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) and on (worker) (faas_ci:worker_replicas:by_worker_condition{condition="degraded"} > 0)) * 0 + 3
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) and on (worker) (faas_ci:worker_replicas:by_worker_condition{condition="blocked"} > 0)) * 0 + 4
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) and on (worker) (faas_ci:worker_replicas:by_worker_condition{condition="stalled"} > 0)) * 0 + 5
          or on (worker) ((faas_ci:worker_enabled:by_worker == 1) and on (worker) (faas_ci:worker_replicas:by_worker_condition{condition="stale"} > 0)) * 0 + 6
          or on (worker) (faas_ci:worker_enabled:by_worker == 1) * 0 + 7
          or on (worker) label_replace(vector(7), "worker", "dispatcher", "", "")
          or on (worker) label_replace(vector(7), "worker", "metadata_admission", "", "")
          or on (worker) label_replace(vector(7), "worker", "automation_admission", "", "")
          or on (worker) label_replace(vector(7), "worker", "metadata_checks", "", "")
          or on (worker) label_replace(vector(7), "worker", "execution_checks", "", "")
          or on (worker) label_replace(vector(7), "worker", "retention", "", "")
      - alert: FaasCIHealthUnavailable
        expr: |-
          (faas_ci:observation_enabled:by_daemon == 1)
          unless on (daemon) (faas_ci:observation_up:by_daemon == 1)
        for: 5m
        labels:
          severity: warn
          component: platform
          family: internal_ci
          public_status: internal
        annotations:
          summary: Internal CI health cannot be read
          description: An observed daemon is configured for CI monitoring but has no successful durable health read. Inspect database access and CI migrations; unavailable evidence must not be interpreted as an empty queue.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalCIOperations.md
      - alert: FaasCIWorkerUnavailable
        expr: |-
          (faas_ci:worker_enabled:by_worker == 1)
          and on (worker) (faas_ci:worker_available:by_worker == 0)
        for: 5m
        labels:
          severity: warn
          component: platform
          family: internal_ci
          public_status: internal
        annotations:
          summary: An enabled internal CI worker has no available observation
          description: No healthy or starting group is observed for an enabled worker. Inspect unknown, stale, stalled, blocked and degraded states, dependency wiring and diagnostic slot capacity before changing work intent.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalCIOperations.md
      - alert: FaasCILeaseRecoveryStalled
        expr: |-
          (faas_ci:queue_items:by_queue_condition{condition="stale_leases"} > 0)
          and on (queue) (faas_ci:queue_worker_enabled:by_queue == 1)
        for: 5m
        labels:
          severity: warn
          component: platform
          family: internal_ci
          public_status: internal
        annotations:
          summary: Internal CI expired leases are not recovering
          description: Expired work leases remain while their owning worker is enabled. Inspect worker health and durable execution or delivery state. Preserve attempt identity, fences and native retirement safety; do not force lease or object deletion.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalCIOperations.md
      - alert: FaasCICheckDeliveryDead
        expr: |-
          (faas_ci:queue_items:by_queue_condition{queue=~"metadata_checks|execution_checks",condition="dead"} > 0)
          and on (queue) (faas_ci:queue_worker_enabled:by_queue == 1)
        for: 5m
        labels:
          severity: warn
          component: platform
          family: internal_ci
          public_status: internal
        annotations:
          summary: Internal CI Check delivery exhausted its retry budget
          description: A Check outbox contains dead delivery while publication is enabled. Inspect repository authority and the safe failure code. For eligible execution Checks use the bounded audited retry API after fixing the cause; execution work must not be replayed.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalCIOperations.md
      - alert: FaasCIQuotaPressure
        expr: |-
          ((faas_ci:resource_utilization:by_resource{resource=~"active_executions|dispatch_leases"} >= 0.8)
          and on () (max(faas_ci:worker_enabled:by_worker{worker="dispatcher"}) == 1))
          or
          ((faas_ci:resource_utilization:by_resource{resource=~"storage_bytes|storage_objects|storage_journal|storage_io"} >= 0.8)
          and on () (max(faas_ci:worker_enabled:by_worker{worker=~"dispatcher|retention"}) == 1))
        for: 10m
        labels:
          severity: warn
          component: platform
          family: internal_ci
          public_status: internal
        annotations:
          summary: Internal CI global quota is under sustained pressure
          description: At least 80 percent of an existing global budget is used while its execution or retention path is enabled. Inspect usage and headroom. Permanent storage tombstones remain charged; never delete deduplication or retirement evidence to manufacture capacity.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalCIOperations.md

  - name: faas_app_tasks
    rules:
      - record: schedd_app_task_class_observation_healthy
        expr: |
          ((schedd_app_task_pending{job="schedd",kind=~"release|manual|cron",class=~"queued|retry_wait|held|deadline_overdue|restoring|running|cancellation_pending|lease_expired|unknown"} >= 0) * 0 + 1)
          and on (job, instance, kind, class) (schedd_app_task_pending{job="schedd"} < +Inf)
          and on (job, instance, kind, class) (schedd_app_task_pending{job="schedd"} == floor(schedd_app_task_pending{job="schedd"}))
          and on (job, instance, kind, class) (schedd_app_task_age_unknown{job="schedd"} >= 0)
          and on (job, instance, kind, class) (schedd_app_task_age_unknown{job="schedd"} == floor(schedd_app_task_age_unknown{job="schedd"}))
          and on (job, instance, kind, class) (schedd_app_task_age_unknown{job="schedd"} <= schedd_app_task_pending{job="schedd"})
          and on (job, instance, kind, class) (schedd_app_task_oldest_boundary_timestamp_seconds{job="schedd"} <= time())
          and on (job, instance, kind, class)
            (((schedd_app_task_pending{job="schedd"} > schedd_app_task_age_unknown{job="schedd"})
              and on (job, instance, kind, class) (schedd_app_task_oldest_boundary_timestamp_seconds{job="schedd"} > 0))
             or ((schedd_app_task_pending{job="schedd"} == schedd_app_task_age_unknown{job="schedd"})
                 and on (job, instance, kind, class) (schedd_app_task_oldest_boundary_timestamp_seconds{job="schedd"} == 0)))
          and on (job, instance) (up{job="schedd"} == 1)
          and on (job, instance) (schedd_app_task_collection_success{job="schedd"} == 1)
          and on (job, instance) (schedd_app_task_collection_last_success_timestamp_seconds{job="schedd"} > 0)
          and on (job, instance) (time() - schedd_app_task_collection_last_success_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (time() - schedd_app_task_collection_last_success_timestamp_seconds{job="schedd"} <= 120)
          and on (job, instance) ((schedd_app_task_observation_enabled{job="schedd"} == 0) or (schedd_app_task_observation_enabled{job="schedd"} == 1))
          unless on (job, instance, kind, class) (schedd_app_task_pending{job="schedd",class=~"restoring|retry_wait|held|unknown"} != schedd_app_task_age_unknown{job="schedd",class=~"restoring|retry_wait|held|unknown"})
      - record: schedd_app_task_observation_healthy
        expr: |
          (count by (job, instance) (schedd_app_task_class_observation_healthy == 1) == 27) / 27
          and on (job, instance) (count by (job, instance) ((schedd_app_task_operations_total{job="schedd",operation=~"claim|sweep|renew|attach_read|restore|running_fence|attach_route|execute|destroy|complete",outcome=~"success|error|canceled|lease_lost|empty|cancellation_pending"} >= 0) and (schedd_app_task_operations_total{job="schedd",operation=~"claim|sweep|renew|attach_read|restore|running_fence|attach_route|execute|destroy|complete",outcome=~"success|error|canceled|lease_lost|empty|cancellation_pending"} < +Inf)) == 60)
          and on (job, instance) (count by (job, instance) ((schedd_app_task_recovery_total{job="schedd",outcome=~"requeued_restores|failed_runs|cancelled"} >= 0) and (schedd_app_task_recovery_total{job="schedd",outcome=~"requeued_restores|failed_runs|cancelled"} < +Inf)) == 3)
          and on (job, instance) (count by (job, instance) ((schedd_app_task_results_total{job="schedd",kind=~"release|manual|cron",status=~"succeeded|failed|timed_out|cancelled|queued"} >= 0) and (schedd_app_task_results_total{job="schedd",kind=~"release|manual|cron",status=~"succeeded|failed|timed_out|cancelled|queued"} < +Inf)) == 15)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} >= 0)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} <= 1)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} == floor(schedd_app_task_dispatch_enabled{job="schedd"}))
          and on (job, instance) (schedd_app_task_runner_running{job="schedd"} >= 0)
          and on (job, instance) (schedd_app_task_runner_running{job="schedd"} <= 1)
          and on (job, instance) (schedd_app_task_runner_running{job="schedd"} == floor(schedd_app_task_runner_running{job="schedd"}))
          and on (job, instance) (schedd_app_task_slots_configured{job="schedd"} >= 1)
          and on (job, instance) (schedd_app_task_slots_configured{job="schedd"} <= 32)
          and on (job, instance) (schedd_app_task_slots_configured{job="schedd"} == floor(schedd_app_task_slots_configured{job="schedd"}))
          and on (job, instance) (schedd_app_task_slots_in_use{job="schedd"} >= 0)
          and on (job, instance) (schedd_app_task_slots_in_use{job="schedd"} <= 32)
          and on (job, instance) (schedd_app_task_slots_in_use{job="schedd"} == floor(schedd_app_task_slots_in_use{job="schedd"}))
          and on (job, instance) (schedd_app_task_slots_in_use{job="schedd"} <= schedd_app_task_slots_configured{job="schedd"})
          and on (job, instance) (schedd_app_task_claim_last_success_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (schedd_app_task_claim_last_success_timestamp_seconds{job="schedd"} <= time())
          and on (job, instance) (schedd_app_task_sweep_last_success_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (schedd_app_task_sweep_last_success_timestamp_seconds{job="schedd"} <= time())
      - record: schedd_app_task_oldest_known_boundary_age_seconds
        expr: |
          (((time() - schedd_app_task_oldest_boundary_timestamp_seconds{job="schedd"})
             and on (job, instance, kind, class) (schedd_app_task_pending{job="schedd"} > schedd_app_task_age_unknown{job="schedd"}))
           or ((schedd_app_task_pending{job="schedd"} == 0) * 0))
          and on (job, instance) (schedd_app_task_observation_healthy == 1)
      - alert: FaasAppTaskTelemetryUnavailable
        expr: |
          (up{job="schedd"} == 1)
          unless on (job, instance)
            ((schedd_app_task_observation_healthy == 1)
             or (schedd_app_task_observation_enabled{job="schedd"} == 0))
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: app_task_telemetry
          public_status: internal
        annotations:
          summary: App-task diagnostics are unavailable
          description: >-
            Schedd is scraped but task observations are missing, failed, inconsistent or older than two minutes, or runner gauges and initialized counters are incomplete. Counts and ages are unknown. Check the observer, database, clocks and binary. Intentional observer shutdown is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppTasks.md
      - alert: FaasAppTaskRunnerStalled
        expr: |
          ((schedd_app_task_runner_running{job="schedd"} == 0)
           or (time() - schedd_app_task_sweep_last_success_timestamp_seconds{job="schedd"} > 120)
           or ((schedd_app_task_slots_in_use{job="schedd"} < schedd_app_task_slots_configured{job="schedd"})
               and on (job, instance) (time() - schedd_app_task_claim_last_success_timestamp_seconds{job="schedd"} > 120)))
          and on (job, instance) (schedd_app_task_observation_healthy == 1)
          and on (job, instance) (schedd_app_task_observation_enabled{job="schedd"} == 1)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: app_task
          public_status: internal
        annotations:
          summary: Enabled app-task runner is not demonstrating progress
          description: >-
            Dispatch is enabled but Run is stopped, no successful recovery sweep occurred within two minutes, or free local slots have no successful claim query within two minutes, sustained for five minutes. Empty queries count as success. Fully occupied workers need not claim; they must still sweep. Intentional dispatch opt-out is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppTasks.md
      - alert: FaasReleaseTaskQueued
        expr: |
          (schedd_app_task_oldest_known_boundary_age_seconds{kind="release",class="queued"} > 300)
          and on (job, instance) (schedd_app_task_observation_healthy == 1)
          and on (job, instance) (schedd_app_task_observation_enabled{job="schedd"} == 1)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: app_task
          public_status: internal
        annotations:
          summary: A claimable release command remains queued
          description: >-
            A currently claimable release task has a known eligibility boundary older than five minutes, sustained for five minutes. The boundary includes creation, requeue updates and due retry time. This is not continuous eligibility or a command execution SLO. Retry waits, admission and exclusive holds, running work and disabled dispatch are separate.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppTasks.md
      - alert: FaasAppTaskRecoveryOverdue
        expr: |
          (schedd_app_task_oldest_known_boundary_age_seconds{class=~"cancellation_pending|lease_expired|deadline_overdue"} > 60)
          and on (job, instance) (schedd_app_task_observation_healthy == 1)
          and on (job, instance) (schedd_app_task_observation_enabled{job="schedd"} == 1)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: app_task
          public_status: internal
        annotations:
          summary: App-task cancellation or lease recovery is overdue
          description: >-
            A {{ $labels.kind }} task remains {{ $labels.class }} more than one minute after its durable boundary, sustained for five minutes. Inspect teardown, lease fencing and sweeps. Expired running tasks have uncertain outcomes; do not replay customer commands or bypass their existing work policy.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppTasks.md
      - alert: FaasAppTaskEvidenceUnknown
        expr: |
          ((schedd_app_task_pending{job="schedd",class="unknown"} > 0)
           or (schedd_app_task_age_unknown{job="schedd",class=~"queued|running|cancellation_pending|lease_expired|deadline_overdue"} > 0))
          and on (job, instance) (schedd_app_task_observation_healthy == 1)
          and on (job, instance) (schedd_app_task_observation_enabled{job="schedd"} == 1)
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: app_task_telemetry
          public_status: internal
        annotations:
          summary: App-task state or timing evidence is incomplete
          description: >-
            Fresh observations have contained {{ $labels.kind }} tasks in {{ $labels.class }} with incomplete evidence for 15m. Future, invalid or missing lifecycle times cannot establish age. Expected unknown restoring, retry-wait and held boundaries are excluded. Inspect supported task evidence without rewriting timestamps.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppTasks.md
      - alert: FaasAppTaskOperationsFailing
        expr: |
          (sum by (job, instance, operation) (rate(schedd_app_task_operations_total{job="schedd",outcome="error"}[5m]))
           / sum by (job, instance, operation) (rate(schedd_app_task_operations_total{job="schedd",outcome=~"success|empty|error"}[5m])) > 0.1)
          and on (job, instance, operation) (sum by (job, instance, operation) (increase(schedd_app_task_operations_total{job="schedd",outcome="error"}[5m])) >= 3)
          and on (job, instance) (schedd_app_task_observation_healthy == 1)
          and on (job, instance) (schedd_app_task_observation_enabled{job="schedd"} == 1)
          and on (job, instance) (schedd_app_task_dispatch_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: app_task
          public_status: internal
        annotations:
          summary: App-task coordinator operations are persistently failing
          description: >-
            {{ $labels.operation }} errors exceed 10% of non-canceled calls with at least three errors per rolling five-minute window, sustained for five minutes. Customer command exit, timeout and cancellation verdicts are not infrastructure errors. Lease-loss and cancellation-race returns are separate outcomes. Restore errors can include policy or account refusals; inspect bounded logs before assigning cause.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppTasks.md

  - name: faas_command_cron_admission
    rules:
      - record: schedd_command_cron_class_observation_healthy
        expr: |
          ((schedd_command_cron_schedules{job="schedd",class=~"due|overlap_due|replacement_wait|deployment_missing|exclusive_due|disabled|suspended|account_held|not_due|unknown"} >= 0) * 0 + 1)
          and on (job, instance, class) (schedd_command_cron_schedules{job="schedd"} < +Inf)
          and on (job, instance, class) (schedd_command_cron_schedules{job="schedd"} == floor(schedd_command_cron_schedules{job="schedd"}))
          and on (job, instance, class) (schedd_command_cron_age_unknown{job="schedd"} >= 0)
          and on (job, instance, class) (schedd_command_cron_age_unknown{job="schedd"} == floor(schedd_command_cron_age_unknown{job="schedd"}))
          and on (job, instance, class) (schedd_command_cron_age_unknown{job="schedd"} <= schedd_command_cron_schedules{job="schedd"})
          and on (job, instance, class) (schedd_command_cron_oldest_due_timestamp_seconds{job="schedd"} <= time())
          and on (job, instance, class)
            (((schedd_command_cron_schedules{job="schedd"} > schedd_command_cron_age_unknown{job="schedd"}) and on (job, instance, class) (schedd_command_cron_oldest_due_timestamp_seconds{job="schedd"} > 0))
             or ((schedd_command_cron_schedules{job="schedd"} == schedd_command_cron_age_unknown{job="schedd"}) and on (job, instance, class) (schedd_command_cron_oldest_due_timestamp_seconds{job="schedd"} == 0)))
          and on (job, instance) (up{job="schedd"} == 1)
          and on (job, instance) (schedd_command_cron_collection_success{job="schedd"} == 1)
          and on (job, instance) (schedd_command_cron_collection_last_success_timestamp_seconds{job="schedd"} > 0)
          and on (job, instance) (time() - schedd_command_cron_collection_last_success_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (time() - schedd_command_cron_collection_last_success_timestamp_seconds{job="schedd"} <= 120)
          unless on (job, instance, class) (schedd_command_cron_schedules{job="schedd",class=~"disabled|suspended|account_held|not_due|unknown"} != schedd_command_cron_age_unknown{job="schedd",class=~"disabled|suspended|account_held|not_due|unknown"})
      - record: schedd_command_cron_observation_healthy
        expr: |
          (count by (job, instance) (schedd_command_cron_class_observation_healthy == 1) == 10) / 10
          and on (job, instance) (count by (job, instance) ((schedd_command_cron_sweeps_total{job="schedd",outcome=~"success|error|canceled"} >= 0) and (schedd_command_cron_sweeps_total{job="schedd",outcome=~"success|error|canceled"} < +Inf)) == 3)
          and on (job, instance) (count by (job, instance) ((schedd_command_cron_decisions_total{job="schedd",outcome=~"disabled|not_due|account_held|replacement_wait|not_owned|invalid_schedule|lookup_error|store_unavailable|no_live_deployment|canceled|legacy_queued|legacy_skipped|legacy_stale|legacy_error"} >= 0) and (schedd_command_cron_decisions_total{job="schedd",outcome=~"disabled|not_due|account_held|replacement_wait|not_owned|invalid_schedule|lookup_error|store_unavailable|no_live_deployment|canceled|legacy_queued|legacy_skipped|legacy_stale|legacy_error"} < +Inf)) == 14)
          and on (job, instance) (count by (job, instance) ((schedd_command_cron_admissions_total{job="schedd",outcome=~"queued|exclusive_pending|coalesced|skipped_overlap|missed_deadline|stale|deployment_unavailable|rejected|error|canceled|unknown"} >= 0) and (schedd_command_cron_admissions_total{job="schedd",outcome=~"queued|exclusive_pending|coalesced|skipped_overlap|missed_deadline|stale|deployment_unavailable|rejected|error|canceled|unknown"} < +Inf)) == 11)
          and on (job, instance) ((schedd_command_cron_observation_enabled{job="schedd"} == 0) or (schedd_command_cron_observation_enabled{job="schedd"} == 1))
          and on (job, instance) ((schedd_command_cron_sweep_running{job="schedd"} == 0) or (schedd_command_cron_sweep_running{job="schedd"} == 1))
          and on (job, instance) (schedd_command_cron_sweep_last_start_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_sweep_last_start_timestamp_seconds{job="schedd"} <= time())
          and on (job, instance) (schedd_command_cron_sweep_last_success_timestamp_seconds{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_sweep_last_success_timestamp_seconds{job="schedd"} <= time())
          and on (job, instance) (schedd_command_cron_admission_lag_unknown_total{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_admission_lag_unknown_total{job="schedd"} < +Inf)
          and on (job, instance) (schedd_command_cron_admission_lag_seconds_count{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_admission_lag_seconds_count{job="schedd"} < +Inf)
          and on (job, instance) (schedd_command_cron_admission_lag_seconds_sum{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_admission_lag_seconds_sum{job="schedd"} < +Inf)
          and on (job, instance) (schedd_command_cron_sweep_duration_seconds_count{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_sweep_duration_seconds_count{job="schedd"} < +Inf)
          and on (job, instance) (schedd_command_cron_sweep_duration_seconds_sum{job="schedd"} >= 0)
          and on (job, instance) (schedd_command_cron_sweep_duration_seconds_sum{job="schedd"} < +Inf)
      - record: schedd_command_cron_oldest_known_due_age_seconds
        expr: |
          (((time() - schedd_command_cron_oldest_due_timestamp_seconds{job="schedd"}) and on (job, instance, class) (schedd_command_cron_schedules{job="schedd"} > schedd_command_cron_age_unknown{job="schedd"}))
           or ((schedd_command_cron_schedules{job="schedd"} == 0) * 0))
          and on (job, instance) (schedd_command_cron_observation_healthy == 1)
      - alert: FaasCommandCronTelemetryUnavailable
        expr: |
          (up{job="schedd"} == 1)
          unless on (job, instance) ((schedd_command_cron_observation_healthy == 1) or (schedd_command_cron_observation_enabled{job="schedd"} == 0))
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: command_cron_telemetry
          public_status: internal
        annotations:
          summary: Command-cron admission diagnostics are unavailable
          description: >-
            Schedd is scraped but command schedule observations are missing, failed, inconsistent or older than two minutes, or initialized counters and sweep gauges are incomplete. Counts and ages are unknown. Check observer, database, clocks and binary. Intentional observer shutdown is excluded.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommandCrons.md
      - alert: FaasCommandCronSweepStalled
        expr: |
          (time() - schedd_command_cron_sweep_last_success_timestamp_seconds{job="schedd"} > 180)
          and on (job, instance) (schedd_command_cron_observation_healthy == 1)
          and on (job, instance) (schedd_command_cron_observation_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: command_cron
          public_status: internal
        annotations:
          summary: Cron scanning is not demonstrating progress
          description: >-
            No actual cron scan with successful enumeration and owner lookups completed within three minutes, sustained for five minutes. Empty scans count as success. Shared scans include inline HTTP cron work; this alone does not identify a command runner failure.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommandCrons.md
      - alert: FaasCommandCronDecisionOverdue
        expr: |
          (schedd_command_cron_oldest_known_due_age_seconds{class=~"due|overlap_due|deployment_missing|exclusive_due"} > 300)
          and on (job, instance) (schedd_command_cron_observation_healthy == 1)
          and on (job, instance) (schedd_command_cron_observation_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: command_cron
          public_status: internal
        annotations:
          summary: A command schedule has unconsumed due history
          description: >-
            A {{ $labels.class }} command schedule has a first unconsumed nominal boundary older than five minutes, sustained for five minutes. This is pending admission or a policy decision, not continuous execution eligibility or a missed delivery SLO. Inspect cursor, deadline, overlap, deployment and exclusive policy before acting.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommandCrons.md
      - alert: FaasCommandCronReplacementWaiting
        expr: |
          (schedd_command_cron_oldest_known_due_age_seconds{class="replacement_wait"} > 300)
          and on (job, instance) (schedd_command_cron_observation_healthy == 1)
          and on (job, instance) (schedd_command_cron_observation_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: command_cron
          public_status: internal
        annotations:
          summary: A replacement schedule is waiting on prior work
          description: >-
            An unbound replacement schedule still has active prior tasks and old unconsumed due history for five minutes. Age is nominal schedule history, not cancellation duration. Inspect task cancellation, leases and teardown; do not replay commands or bypass fencing.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommandCrons.md
      - alert: FaasCommandCronEvidenceUnknown
        expr: |
          ((schedd_command_cron_schedules{job="schedd",class="unknown"} > 0) or (schedd_command_cron_age_unknown{job="schedd",class=~"due|overlap_due|replacement_wait|deployment_missing|exclusive_due"} > 0))
          and on (job, instance) (schedd_command_cron_observation_healthy == 1)
          and on (job, instance) (schedd_command_cron_observation_enabled{job="schedd"} == 1)
        for: 15m
        labels:
          severity: warn
          component: schedd
          family: command_cron_telemetry
          public_status: internal
        annotations:
          summary: Command schedule timing or policy evidence is incomplete
          description: >-
            Fresh observations have contained {{ $labels.class }} command schedules with incomplete timing or policy evidence for 15m. Disabled, suspended, held and not-due schedules intentionally have unknown age and are excluded. Inspect supported durable evidence without rewriting cursors.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommandCrons.md
      - alert: FaasCommandCronAdmissionErrors
        expr: |
          (sum by (job, instance) (increase(schedd_command_cron_admissions_total{job="schedd",outcome="error"}[5m]))
           + sum by (job, instance) (increase(schedd_command_cron_decisions_total{job="schedd",outcome=~"lookup_error|store_unavailable|legacy_error"}[5m]))) >= 3
          and on (job, instance) (schedd_command_cron_observation_healthy == 1)
          and on (job, instance) (schedd_command_cron_observation_enabled{job="schedd"} == 1)
        for: 5m
        labels:
          severity: warn
          component: schedd
          family: command_cron
          public_status: internal
        annotations:
          summary: Command-cron admission calls are persistently failing
          description: >-
            At least three admission or pre-admission store errors occurred per rolling five-minute window, sustained for five minutes. Policy rejections, overlap skips, coalescing, missed deadlines, deployment-unavailable returns and parent cancellation are separate outcomes. Inspect bounded logs before attributing infrastructure failure.
          runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCommandCrons.md

  # ─────────────────────────────────────────────────────────────────
  # Account dashboard rollups (hunt #10, 2026-10-15)
  # ─────────────────────────────────────────────────────────────────
  #
  # The account analytics panel sums the gateway request counter and
  # latency histogram per app over windows up to 15d. The raw series
  # carry one copy per gateway instance and node; over 24h the latency
  # buckets (about 11.5k series on production-us) took 17 s on the
  # 2 vCPU control plane against apid's 5 s budget, so every window
  # past an hour came back degraded. These rules keep only the labels
  # the panel groups on. pkg/appmetrics.AccountIncreaseQuery sums the
  # 5m rollup for 6h and 24h windows and the hourly one for 7d and 15d.
  # Each evaluation records the increase since the previous one, so a
  # sum_over_time across a window is the increase over that window.
  - name: faas_gateway_account_rollups_5m
    interval: 5m
    rules:
      - record: app_class:gateway_request_duration_seconds_count:increase5m
        expr: sum by (app, class) (increase(gateway_request_duration_seconds_count[5m]))
      - record: app_class_le:gateway_request_duration_seconds_bucket:increase5m
        expr: sum by (app, class, le) (increase(gateway_request_duration_seconds_bucket[5m]))

  - name: faas_gateway_account_rollups_1h
    interval: 1h
    rules:
      - record: app_class:gateway_request_duration_seconds_count:increase1h
        expr: sum by (app, class) (increase(gateway_request_duration_seconds_count[1h]))
      - record: app_class_le:gateway_request_duration_seconds_bucket:increase1h
        expr: sum by (app, class, le) (increase(gateway_request_duration_seconds_bucket[1h]))

  # Starter-reported protocol signals, not host-verified authorization outcomes.
  # No alert is inferred from event silence: idle apps emit no protocol events.
  - name: faas_mcp_protocol
    interval: 30s
    rules:
      - alert: FaasMCPProtocolHighErrorRate
        expr: |
          (
            sum by (app_id) (increase(vmmd_mcp_protocol_requests_total{outcome=~"rpc_error|tool_error|authorization_error|internal_error|timeout"}[5m]))
            / sum by (app_id) (increase(vmmd_mcp_protocol_requests_total[5m]))
          ) > 0.1
          and on (app_id) (sum by (app_id) (increase(vmmd_mcp_protocol_requests_total[5m])) >= 20)
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: mcp_protocol
          public_status: internal
        annotations:
          summary: "MCP protocol failures exceed ten percent"
          description: "Starter-reported RPC/tool failures or timeouts exceed ten percent with at least twenty observed calls in each five-minute window. Cancellations are tracked separately. Review the app's MCP performance dashboard and logs."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasMCPProtocolPerformance.md"
      - alert: FaasMCPProtocolSlowExecution
        expr: |
          histogram_quantile(0.95, sum by (app_id, le) (rate(vmmd_mcp_protocol_execution_seconds_bucket[5m]))) > 5
          and on (app_id) (sum by (app_id) (increase(vmmd_mcp_protocol_execution_seconds_count[5m])) >= 20)
        for: 10m
        labels:
          severity: warn
          component: vmmd
          family: mcp_protocol
          public_status: internal
        annotations:
          summary: "MCP execution p95 exceeds five seconds"
          description: "At least twenty response-construction measurements per five-minute window show sustained slow execution. This excludes SSE delivery lifetime and background task execution."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasMCPProtocolPerformance.md"
      - alert: FaasMCPProtocolAggregationCapacity
        expr: sum by (job) (increase(vmmd_mcp_protocol_capacity_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: warn
          component: vmmd
          family: mcp_protocol
          public_status: internal
        annotations:
          summary: "MCP protocol aggregation is dropping observations"
          description: "The bounded per-host app table is full. Performance charts may be incomplete. Inspect active app placement and aggregation capacity."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasMCPProtocolPerformance.md"
      - alert: FaasMCPTelemetryHeartbeatLost
        expr: |
          (time() - vmmd_mcp_telemetry_heartbeat_timestamp_seconds > 120)
          and (time() - vmmd_mcp_telemetry_instance_started_timestamp_seconds > 180)
          and (vmmd_mcp_telemetry_loss_alert_enabled == 1)
        for: 5m
        labels:
          severity: warn
          component: vmmd
          family: mcp_protocol
          public_status: internal
        annotations:
          summary: "MCP starter telemetry heartbeats stopped"
          description: "An opted-in executing instance has stopped reporting heartbeats after its startup grace period. This indicates missing process telemetry, independently of MCP readiness and tool success. Paused and retired host log lifecycles are excluded."
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasMCPProtocolPerformance.md"

  - name: faas-internal-mail
    rules:
      - alert: InternalMailMonitoringUnavailable
        expr: '(maild_mail_monitoring_up == 0) or (time() - maild_mail_monitoring_collected_at_seconds > 120)'
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail monitoring is unavailable or stale"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailStatisticsUnavailable
        expr: '(maild_mail_stats_up == 0) or (maild_mail_postfix_stats_up == 0)'
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail database or Postfix statistics are unavailable"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailQueueStalled
        expr: '(maild_mail_oldest_pending_seconds > 300) or (max without (kind) (maild_mail_postfix_oldest_seconds{kind="delivery"}) > 900)'
        for: 5m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail delivery queue is aging"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailReportsStuck
        expr: '(max without (kind) (maild_mail_postfix_oldest_seconds{kind="report"}) > 120) or (maild_mail_oldest_report_wait_seconds > 7200)'
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail reports are waiting too long"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailUncertainSubmission
        expr: 'max without (state) (maild_mail_recipients{state="uncertain"}) > 0'
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail has an uncertain SMTP submission"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailBounceRateHigh
        expr: '(sum without (kind) (maild_mail_outcomes_last_day{kind="bounced"}) / clamp_min(sum without (kind) (maild_mail_outcomes_last_day{kind=~"accepted|bounced"}), 1) > 0.2) and (sum without (kind) (maild_mail_outcomes_last_day{kind=~"accepted|bounced"}) >= 5)'
        for: 5m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail bounces exceed the pilot threshold"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailComplaint
        expr: 'sum without (kind) (maild_mail_outcomes_last_day{kind="complained"}) > 0'
        for: 1m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail received a complaint"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailRetentionFailed
        expr: 'maild_mail_retention_enabled == 1 and (maild_mail_retention_last_run_up == 0 or maild_mail_retention_stats_up == 0 or time() - maild_mail_retention_last_attempt_seconds > 7200)'
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail payload retention is failing or stale"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailDKIMRotationFailed
        expr: |
          (maild_mail_dkim_rotation_enabled == 1)
          and on(job,instance)
          (
            (maild_mail_domain_lifecycle_stats_up == 0)
            or (maild_mail_dkim_failed_keys > 0)
            or (maild_mail_dkim_oldest_staged_seconds > 86400)
          )
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail DKIM rotation is failing or stalled"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"

      - alert: InternalMailDomainAuthorizationFailed
        expr: |
          (maild_mail_domain_reverify_enabled == 1)
          and on(job,instance)
          (
            (maild_mail_domain_lifecycle_stats_up == 0)
            or (maild_mail_domain_paused > 0)
            or (maild_mail_domain_stale > 0)
            or (maild_mail_domain_lookup_unavailable > 0)
            or (maild_mail_domain_check_last_run_up == 0)
            or ((time() - maild_mail_domain_check_last_attempt_seconds) > 180)
          )
        for: 2m
        labels:
          severity: warn
          component: maild
          family: internal_mail
          public_status: internal
        annotations:
          summary: "Internal mail domain authorization is failing or stale"
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/ops/internal-mail.md"
