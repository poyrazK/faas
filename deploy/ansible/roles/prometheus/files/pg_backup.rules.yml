# Prometheus alert rules — off-host Postgres backup (issue #250).
#
# Companion to deploy/ansible/roles/prometheus/files/faas.rules.yml
# (spec §12 SLO thresholds). This file holds the PgBackupStale alert;
# splitting it out lets the postgres_backup ansible role own it
# without a cross-role edit on the canonical rules file.
#
# Severity convention: matches faas.rules.yml header (info / warn /
# page). PgBackupStale is `page` because a stale push means RPO is
# degrading silently — the cluster keeps running but the off-host
# recovery point slides into the local archive's retention window.
#
# Runbook: docs/runbooks/PostgresBackup.md.

groups:
  - name: faas.pg_backup
    rules:
      - alert: PgBackupStale
        # The gauge is a Unix timestamp written only after rclone copy and
        # byte verification succeed. Zero means no verified push exists.
        expr: apid_pg_backup_last_pushed_seconds == 0 or time() - apid_pg_backup_last_pushed_seconds > 93600
        for: 5m
        labels:
          severity: warn
          family: pg_backup
        annotations:
          summary: "Postgres basebackup has no recent verified off-host copy"
          description: |
            The last verified push timestamp is missing or older than 26 hours.
            Check `systemctl status faas-pg-basebackup-push.timer` and
            `journalctl -u faas-pg-basebackup-push.service` on the CP host.
            Runbook: docs/runbooks/PostgresBackup.md
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/PostgresBackup.md"

      # ADR-1344 §8: the control plane's host-local state (CA, apid HMAC
      # keys, secrets) pushed off-host by faas-cp-state-backup. The success
      # gauge exists only after a first verified push; the unit-failure rule
      # catches a backup that has never succeeded.
      - alert: FaasControlPlaneStateBackupStale
        expr: time() - faas_cp_state_backup_last_success_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: warn
          family: cp_state_backup
        annotations:
          summary: "The control plane's host-local state has no recent verified off-host copy"
          description: |
            The last verified control-plane state backup is older than 26 hours.
            Losing the control plane now would lose every change to its keys and
            secrets since then. Check `journalctl -u faas-cp-state-backup.service`.
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/ControlPlaneStateBackup.md"

      - alert: FaasControlPlaneStateBackupFailed
        expr: node_systemd_unit_state{name="faas-cp-state-backup.service",state="failed"} == 1
        for: 5m
        labels:
          severity: warn
          family: cp_state_backup
        annotations:
          summary: "The control-plane state backup failed on {{ $labels.instance }}"
          description: |
            faas-cp-state-backup.service failed: sealing, the off-host push or
            its verification did not complete. Check
            `journalctl -u faas-cp-state-backup.service`.
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/ControlPlaneStateBackup.md"

      - alert: PgWalPruneStale
        expr: apid_pg_wal_prune_last_success_timestamp_seconds == 0 or time() - apid_pg_wal_prune_last_success_timestamp_seconds > 7200
        for: 15m
        labels:
          severity: warn
          family: pg_backup
        annotations:
          summary: "Verified local PostgreSQL WAL pruning has not completed for two hours"
          description: |
            Check `systemctl status faas-pg-wal-prune.timer` and
            `journalctl -u faas-pg-wal-prune.service` on the control-plane host.
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/PostgresBackup.md"

      # ADR-1344's archive_timeout = 60s archives a full 16 MiB segment almost
      # every minute, about 20 GiB a day, so archive size measured traffic, not
      # pruning: on 2026-10-20 production held 32 GiB with pruning healthy and
      # the old 20 GiB bound fired permanently. Keeping the two newest daily
      # basebackups holds the oldest retained segment at 24-48 h; three days
      # means the boundary stopped advancing. Host disk alerts cover space.
      # for: 90m outlasts one hourly prune, which rewrites the stats with
      # segment-only ages after an upgrade.
      - alert: PgWalArchiveLarge
        expr: apid_pg_wal_archive_oldest_age_seconds > 259200
        for: 90m
        labels:
          severity: warn
          family: pg_backup
        annotations:
          summary: "Local PostgreSQL WAL archive reaches back more than three days"
          description: |
            Verified pruning is not keeping the local archive bounded: the oldest
            retained WAL segment is more than three days old although only the two
            newest basebackups are kept. Check the prune journal, the basebackup
            push and off-host object-store reachability before deleting files.
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/PostgresBackup.md"

      # ADR-1344 §3: the WAL off-host copy bounds the region-loss RPO. The
      # metrics come from faas-postgres-connection-metrics (postgres role).
      - alert: PgWalArchiveStalled
        # archive_timeout = 60s forces a segment switch every minute on a
        # control plane that is never idle, so ten minutes without a locally
        # archived segment means archiving itself is stuck.
        expr: max(faas_postgres_wal_last_archived_timestamp_seconds) > 0 and time() - max(faas_postgres_wal_last_archived_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warn
          family: pg_backup
        annotations:
          summary: "PostgreSQL has not archived a WAL segment for ten minutes"
          description: |
            pg_stat_archiver shows no locally archived segment for over ten
            minutes. Check `SELECT * FROM pg_stat_archiver` and the PostgreSQL
            log for archive_command errors; WAL accumulates in pg_wal until
            archiving recovers.
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/PostgresBackup.md"

      - alert: PgWalOffHostPushStale
        # archive_command touches the marker after each successful off-host
        # push. A failed push still archives locally and the hourly prune
        # copies the gap later, so RPO degraded silently before this alert.
        expr: max(faas_postgres_offhost_wal_configured) == 1 and time() - max(faas_postgres_offhost_wal_last_success_timestamp_seconds) > 900
        for: 10m
        labels:
          severity: warn
          family: pg_backup
        annotations:
          summary: "No WAL segment has reached off-host storage for 15 minutes"
          description: |
            Off-host WAL credentials are installed but archive_command has not
            pushed a segment successfully for over 15 minutes, so a region-loss
            restore would lose more than the 60 s RPO target. Check the
            PostgreSQL log for "off-host WAL push failed" and object-store
            reachability from the control-plane host.
          runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/PostgresBackup.md"
