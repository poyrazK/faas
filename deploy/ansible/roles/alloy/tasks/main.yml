---
# alloy — Grafana Alloy journal shipper on every FaaS host
# (ADR-20261023185953). Asynchronous and bounded, like the Promtail it
# replaces: the journal is the local source of truth, Alloy persists its
# position, retries are capped, and a Loki outage never enters a customer
# request path.

- name: alloy — assert SHA-256 pin was supplied
  ansible.builtin.assert:
    that:
      - alloy_release_sha256 is defined
      - alloy_release_sha256 | length == 64
    fail_msg: >-
      alloy_release_sha256 is not set. Pin the checksum from the Grafana Alloy
      release before installing the shipper.

- name: alloy — require HTTPS Loki endpoint in production
  ansible.builtin.assert:
    that:
      - alloy_loki_url | length > 0
      - alloy_loki_url is match('^https://')
      - alloy_loki_url is not search('127\\.0\\.0\\.1|localhost')
      - alloy_loki_url is not search('@')
      - alloy_loki_server_name | length > 0
    fail_msg: >-
      alloy_loki_url must be a private-network HTTPS Loki push endpoint
      (derived from faas_obs_loki_address) without URL credentials and with a
      TLS server name; logs must not leave the host over plaintext.
  when: not (alloy_dev_mode | bool)

- name: alloy — derive effective listen address
  ansible.builtin.set_fact:
    alloy_effective_listen_address: >-
      {{ alloy_listen_address if alloy_listen_address != 'auto' else
         ((faas_private_dns_address | default(faas_private_address | default(ansible_default_ipv4.address, true), true))
          if faas_box_role | default('') == 'compute-only' else '127.0.0.1') }}

- name: alloy — require a private listen address
  ansible.builtin.assert:
    that:
      - alloy_effective_listen_address | length > 0
      - alloy_effective_listen_address not in ['0.0.0.0', '::']
      - alloy_listen_port | int > 0
      - alloy_listen_port | int < 65536
    fail_msg: >-
      Alloy's HTTP server also serves its configuration UI, so it binds only
      to a private address or loopback, never a wildcard.

- name: alloy — create service account with journal access
  ansible.builtin.user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin
    home: "{{ alloy_storage_path }}"
    create_home: false
    # Alloy's journal source needs both groups; without them it starts
    # cleanly and collects nothing.
    groups:
      - systemd-journal
      - adm
    append: true

- name: alloy — create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/alloy, owner: root, mode: "0755" }
    - { path: "{{ alloy_storage_path }}", owner: alloy, mode: "0750" }

- name: alloy — stat mTLS material
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { name: ca, path: "{{ alloy_loki_ca_file }}" }
    - { name: cert, path: "{{ alloy_loki_client_cert_file }}" }
    - { name: key, path: "{{ alloy_loki_client_key_file }}" }
  register: alloy_tls_stats
  when: not (alloy_dev_mode | bool)
  no_log: true

- name: alloy — require mTLS material in production
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - (item.stat.mode | default('0000')) in ['0400', '0440', '0444', '0640', '0644']
    fail_msg: >-
      Alloy TLS {{ item.item.name }} is missing or has an unsupported mode.
      The platform_logs_pki role issues it from the fleet CA
      (ADR-20261023124955 §2); converge it before this role.
  loop: "{{ alloy_tls_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (alloy_dev_mode | bool)
  no_log: true

# pkg/pki writes keys root:root 0400; platform_logs_pki repeats this on
# renewal (ADR-20261023124955 §2).
- name: alloy — let alloy read its client key
  ansible.builtin.file:
    path: "{{ alloy_loki_client_key_file }}"
    state: file
    owner: root
    group: alloy
    mode: "0440"
  when: not (alloy_dev_mode | bool)

- name: alloy — download release archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-amd64.zip"
    dest: "/tmp/alloy-{{ alloy_version }}-linux-amd64.zip"
    checksum: "sha256:{{ alloy_release_sha256 }}"
    mode: "0644"

- name: alloy — unpack release archive
  ansible.builtin.unarchive:
    src: "/tmp/alloy-{{ alloy_version }}-linux-amd64.zip"
    dest: /tmp
    remote_src: true
    creates: "/tmp/alloy-linux-amd64"

- name: alloy — install binary
  ansible.builtin.copy:
    src: /tmp/alloy-linux-amd64
    dest: /usr/local/bin/alloy
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: restart alloy

# A host that ran Promtail and has not finished its cutover starts Alloy with
# a short read-back window (ADR-20261023185953 Decision 6).
- name: alloy — detect a pending cutover from Promtail
  ansible.builtin.stat:
    path: /var/lib/promtail/positions.yaml
  register: alloy_promtail_positions

- name: alloy — detect a finished cutover
  ansible.builtin.stat:
    path: "{{ alloy_storage_path }}/.cutover-from-promtail-done"
  register: alloy_cutover_marker

- name: alloy — choose the journal read-back window
  ansible.builtin.set_fact:
    alloy_cutover_pending: "{{ alloy_promtail_positions.stat.exists and not alloy_cutover_marker.stat.exists }}"
    alloy_effective_max_age: >-
      {{ alloy_cutover_max_age if (alloy_promtail_positions.stat.exists and not alloy_cutover_marker.stat.exists)
         else alloy_journal_max_age }}

- name: alloy — render config
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_path }}"
    owner: root
    group: alloy
    mode: "0640"
  notify: restart alloy

- name: alloy — verify rendered config syntax
  ansible.builtin.command:
    argv: [/usr/local/bin/alloy, fmt, "{{ alloy_config_path }}"]
  changed_when: false
  check_mode: false

- name: alloy — install systemd unit
  ansible.builtin.template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart alloy

- name: alloy — cut over from Promtail
  ansible.builtin.include_tasks: cutover.yml
  when: alloy_cutover_pending | bool

- name: alloy — enable and start service
  ansible.builtin.service:
    name: alloy
    enabled: true
    state: started

- name: alloy — remove downloaded archive
  ansible.builtin.file:
    path: "/tmp/alloy-{{ alloy_version }}-linux-amd64.zip"
    state: absent

- name: alloy — remove unpacked binary
  ansible.builtin.file:
    path: /tmp/alloy-linux-amd64
    state: absent
