---
# alloy — Grafana Alloy journal shipper on every FaaS host
# (ADR-20261023185953, replacing Promtail, which reached end of life on
# 2026-03-02). The pipeline is Promtail's translated stage for stage: one
# journal reader, the daemon's own JSON line, labels only from validated
# fields (ADR-143), DEBUG kept local, mTLS to Loki on the control plane.
alloy_version: "1.20.1"
# SHA-256 of alloy-linux-amd64.zip from the upstream v{{ alloy_version }}
# release; it matches both GitHub's asset digest and Grafana's SHA256SUMS.
alloy_release_sha256: "451fe650e8277d22d69cb8db50bba809f581fe78decba7fce4027ef185457be9"
# Metrics (and Alloy's own UI) on the port Promtail used: apid's discovery
# hard-codes host:9080, and Prometheus keeps the promtail/promtail-compute job
# names. "auto" is the private transport address on compute nodes and
# loopback on the control plane.
alloy_listen_address: auto
alloy_listen_port: 9080
alloy_config_path: /etc/alloy/config.alloy
alloy_storage_path: /var/lib/alloy
alloy_environment: production
alloy_host_label: "{{ faas_node_name | default(inventory_hostname) }}"
alloy_loki_url: "{{ ('https://' ~ faas_obs_loki_address ~ ':3100/loki/api/v1/push') if (faas_obs_loki_address | default('')) else '' }}"
alloy_loki_tenant_id: gregale
alloy_loki_server_name: "{{ faas_obs_loki_server_name | default('loki.faas', true) }}"
# The platform-logs fleet-PKI leaf Promtail used; platform_logs_pki issues it.
alloy_loki_ca_file: /etc/faas/tls/ca/ca.crt
alloy_loki_client_cert_file: /etc/faas/tls/promtail/loki-client.crt
alloy_loki_client_key_file: /etc/faas/tls/promtail/loki-client.key
alloy_journal_units:
  # Control-plane and compute daemons.
  - faas-apid.service
  - faas-apid-clone-worker.service
  - faas-apid-data-pipeline-worker.service
  - faas-apid-data-pipeline-alert-worker.service
  - faas-schedd.service
  - faas-meterd.service
  - faas-gatewayd-public.service
  - faas-gatewayd-public-edge.service
  - faas-gatewayd-internal.service
  - faas-githubd.service
  - faas-vmmd.service
  - faas-imaged.service
  - faas-builderd.service
  - faas-bridged.service
  - faas-mcp-bridge.service
  - faas-outboundd.service
  - faas-agentd.service
  - faas-edgednsd.service
  - faas-signd.service
  - faas-realtimed.service
  - faas-profiled.service
  - faas-livequeryd.service
  - faas-maild.service
  - faas-s3-gatewayd.service
  - faas-s3-gatewayd-compute.service
  - faas-cloudflared.service
  - faas-cloudflared-s3.service
  # Host helpers and timers.
  - faas-serving-probe.service
  - faas-cgroup-metrics.service
  - faas-kernel-lockdown.service
  - faas-canary-artifact-sweep.service
  - faas-release-integrity.service
  - faas-cp-state-backup.service
  - faas-audit-anchor.service
  - faas-audit-verify.service
  - faas-pg-basebackup.service
  - faas-pg-basebackup-push.service
  - faas-pg-wal-prune.service
  - faas-postgres-connection-metrics.service
  - faas-postgres-activity-metrics.service
  - faas-internal-mail-metrics.service
  - faas-internal-pki-metrics.service
  - faas-tenant-egress-firewall.service
  - faas-overlay-tailscale.service
  - faas-overlay-wireguard.service
  - faas-rsyslog-rotate.service
  - faas-zswap.service
  # Platform dependencies.
  - postgresql@16-main.service
  - prometheus.service
  - alertmanager.service
  - grafana-server.service
  - loki.service
  - node_exporter.service
alloy_journal_max_age: 12h

# Host security evidence (ADR-20261107203000). A root attacker can wipe the
# local journal and audit log; these streams leave the host as they are
# written, and Alloy counts the high-signal ones as
# faas_security_events_total{event} for the faas_host_security alerts.
alloy_security_enabled: true
# Login, privilege and account changes, by journal SYSLOG_IDENTIFIER.
# OpenSSH 9.8+ logs authentication from sshd-session.
alloy_security_identifiers:
  - sshd
  - sshd-session
  - sudo
  - su
  - useradd
  - usermod
  - userdel
  - groupadd
  - groupmod
  - groupdel
  - passwd
  - chpasswd
  - chage
  - gpasswd
  - chsh
  # ADR-20261110183000: release integrity failures (gregalectl release verify).
  - faas-release-integrity
# Kernel messages at notice (5) or more severe; lockdown refusals are
# notices. Bridge and tap port changes are info and stay local.
alloy_security_kernel_max_priority: 5
# host_hardening's auditd writes here, readable by the adm group.
alloy_security_audit_log: /var/log/audit/audit.log
# Record types that only add detail to an event already shipped (PATH, CWD,
# PROCTITLE beside SYSCALL and EXECVE) or that platform daemons emit all day
# (vmmd's nftables changes, systemd's unit and BPF records). They stay in
# the local audit log.
alloy_security_audit_drop_types:
  - PATH
  - CWD
  - PROCTITLE
  - SOCKADDR
  - BPF
  - NETFILTER_CFG
  - SERVICE_START
  - SERVICE_STOP
# Programs that change sudoers, systemd units or nftables.conf outside a
# login session as part of normal operation: systemd and systemctl, package
# upgrades (dpkg, deb-systemd-helper under perl, unattended-upgrades under
# python3), nft, and the platform's own binaries under /opt/faas. Any other
# program doing so raises host_config_write_unattended.
alloy_security_unattended_writer_exes: '/usr/lib/systemd/systemd|/usr/bin/systemctl|/usr/bin/dpkg|/usr/bin/perl[0-9.]*|/usr/bin/python3[0-9.]*|/usr/sbin/nft|/opt/faas/.*'
# The tetragon role's export (ADR-20261110183000), readable by the adm group.
# A host without Tetragon has no file to match; the source then idles.
alloy_security_tetragon_log: /var/log/tetragon/tetragon.log
# Programs that open /etc/faas/secrets as part of normal operation: systemd
# (LoadCredential), the platform's binaries, gregalectl, Ansible's python3
# and the disk-encryption and backup tools. Any other program raises
# tetragon_secret_open; a jailer uid raises tetragon_jailed_secret_open
# whatever the program.
alloy_security_tetragon_secret_reader_exes: '/usr/lib/systemd/systemd|/opt/faas/.*|/usr/local/bin/gregalectl|/usr/bin/python3[0-9.]*|/usr/bin/age|/usr/bin/clevis.*|/usr/bin/cryptsetup|/usr/sbin/cryptsetup|/usr/bin/rclone'
# Ansible runs its modules with python3, so reads of /etc/faas/secrets by
# python3 in a login session are deploys; anything else in a login session
# is a person or a tool reading a secret by hand.
alloy_security_deploy_reader_exes: '/usr/bin/python3[0-9.]*'
# First start on a host that ran Promtail: read back only this far, so the
# cutover gap is covered and at most this much is sent twice (Loki drops exact
# duplicates in the same stream). Once Alloy has saved its own position the
# role switches back to alloy_journal_max_age.
alloy_cutover_max_age: 10m
alloy_batch_wait: 1s
alloy_batch_size: 1MiB
alloy_min_backoff: 500ms
alloy_max_backoff: 5m
alloy_max_retries: 10
# faas-obs.slice budget (spec §13 "loki/promtail agents" line).
alloy_memory_max: 256M
alloy_gomemlimit: 200MiB
# Dev mode only permits a local HTTP target and skips mTLS-file assertions.
alloy_dev_mode: false
