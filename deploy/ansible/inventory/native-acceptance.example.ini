# Copy to a private inventory and replace the connection values.
#
# The designated acceptance host must NOT also appear in `compute_nodes` in an
# inventory that runs bootstrap.yml: the normal compute converge does not know
# about the acceptance marker or the e2e cluster, and a routine run would leave
# the host provisioned but no longer designated.
#
# The host must be DEDICATED: the gates stop every production daemon on it and
# leakcheck then asserts zero leftover netns/TAP/jail. On a node that serves
# tenants those are an outage and a false failure respectively — the production
# pre-warm netns pool is reported as leaks.
#
# On GCP this host is reached through OS Login rather than a static IP, since
# the CI workflows start and stop it:
#   gcloud compute ssh faas-acceptance-1 --zone=europe-west3-c
[native_acceptance]
faas-acceptance-1 ansible_host=203.0.113.20 ansible_user=faas-operator
