# Issue #911 / ADR-110 inventory. The production inventory contains only
# the two explicit split-box roles consumed by bootstrap.yml.
#
# Per ADR-092, host_vars/faas-fsn-{1,2}.yml pin `faas_box_role` and
# `faas_node_name` so the per-box PKI subset + role gate line up.
# Per-box connection vars (ansible_host, ansible_python_interpreter)
# also live in host_vars — keeps the inventory to group-shape only
# so a fleet cutover doesn't require editing this file by hand.
#
# The pinned python3.12 interpreter matches the Ubuntu 24.04 system
# interpreter so we never depend on a venv.
[control_plane]
faas-fsn-1

[compute_nodes]
faas-fsn-2

# Optional dedicated host for deploy/ansible/site.yml. Keep this host outside
# control_plane and compute_nodes so a FaaS host failure cannot erase both the
# service and its off-host logs. Set its private address and Loki TLS vars in
# provider-owned inventory/host_vars.
[observability]
# faas-obs-1
