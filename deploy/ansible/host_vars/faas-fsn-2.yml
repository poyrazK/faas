# Gate-B (issue #297 / ADR-025 §Tier 2) compute-only box.
# fsn-2 runs vmmd, schedd, realtimed, gatewayd-internal, builderd, imaged.
# Postgres + the Tier 1 PKI CA live on fsn-1; this box runs its own schedd
# beside vmmd and reaches the control plane over the overlay network.
# M9 also consumes the shared schedd
# server/client leaves that `gregalectl pki init --box-role=compute-only`
# lays out under /etc/faas/tls/schedd/.
#
# The role gate (pkg/role, PR-1) refuses to start vmmd/gatewayd-internal/
# builderd/imaged under RoleControlPlane; the var below is the deploy-time
# source of truth — every daemon's systemd unit reads it via
# FAAS_<DAEMON>_ROLE.
# `faas_node_name` below is the canonical compute identity used by the
# control-plane database and release membership (`fsn-2.faas`).

faas_box_role: compute-only
faas_node_name: fsn-2.faas
gatewayd_apps_domain: gregale.dev

# Ansible connection vars. See host_vars/faas-fsn-1.yml for the
# rationale. `ansible_host` is the dial target schedd/gatewayd use
# to reach this box from fsn-1; the same layer-3 mesh endpoint.
ansible_host: fsn-2.gregale.dev
ansible_python_interpreter: /usr/bin/python3

# Canonical vmmd routing. The bind address is intentionally wildcard while
# the target URL is routable from the control plane. The vmmd role renders
# these through a managed systemd drop-in; no post-boot compute_nodes DB patch
# is required.
faas_vmmd_listen_addr: "tcp://0.0.0.0:50051"
faas_vmmd_target_url: "tcp://fsn-2.gregale.dev:50051"
faas_vmmd_schedd_target: "tcp://fsn-2.gregale.dev:9091"
faas_gatewayd_schedd_target: "tcp://fsn-2.gregale.dev:9091"

# The control-plane public gateway discovers this endpoint from the
# compute_nodes registry. It is deliberately separate from vmmd's gRPC
# target above; gatewayd-internal serves the HTTP application data plane.
faas_gateway_listen: "0.0.0.0:8080"
faas_gateway_target_url: "tcp://fsn-2.gregale.dev:8080"

# Multi-host mesh (ADR-092): fsn-2 is the compute-only box and
# needs the overlay mesh to reach peer compute boxes (fsn-3+ when
# they land). The Jinja2 template at
# deploy/ansible/roles/nftables/templates/policy_nftables.conf.j2
# emits one `ip saddr <cidr> accept` rule per entry AND one
# `ip saddr <cidr> oifname <public_iface> masquerade` rule per
# entry — so the bridged-tenant talk to overlay mesh is allowed
# at the forward chain AND the return path MASQUERADE is in
# place on postrouting.
#
# Empty list = single-box dev (no mesh). The pair
# (overlay_cidrs=[], masquerade_cidr_v6="") renders the canonical
# default-local ruleset byte-identical to the pre-Mega-PR-C output.
# A future Hetzner multi-host fleet populates overlay_cidrs with
# the per-box /16 slices (e.g. [100.64.0.0/14]) and
# masquerade_cidr_v6 with the ULA pool (fc00::/7). The Go renderer
# (pkg/netns/policy.go::HostPolicy.Render) accepts the same shape;
# `make egress-render-cross-check` is the byte-equality gate.
overlay_cidrs: []
masquerade_cidr_v6: ''
