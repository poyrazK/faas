# Gate-B (issue #297 / ADR-025 §Tier 2) control-plane box.
# fsn-1 runs apid, schedd, meterd, gatewayd-public, githubd.
# Postgres + the Tier 1 PKI CA live here. The role gate at boot
# (pkg/role, PR-1) refuses to start apid/schedd/meterd/gatewayd-public/
# githubd under RoleComputeOnly; this var is the deploy-time source
# of truth — every daemon's systemd unit reads it via FAAS_<DAEMON>_ROLE.
#
# faas_node_name matches the FAAS_NODE_NAME convention used by
# deploy/lima/faas-metal-2node-b.yaml and the vmmd ComputeNode.NodeName
# field. schedd treats this as the canonical compute_node identity at
# PR-3 cross-box handshake.

faas_box_role: control-plane
faas_node_name: fsn-1
gatewayd_apps_domain: gregale.dev
# The public edge keeps the control-plane API local and discovers compute
# gateways from the database. Draining any single compute box therefore
# cannot make the API entrypoint unhealthy.
faas_compute_gateway_discovery: database
# Public application/API traffic reaches this origin through Cloudflare. The
# nftables role admits TCP/80+443 only from the pinned Cloudflare ranges;
# loopback remains the local health path and SSH remains provider/IAP-scoped.
faas_cloudflare_origin_only: true

# Ansible connection vars. `ansible_host` is the cross-box addressing
# target (Layer-3 mesh endpoint: Tailscale/Wireguard IP, internal LAN,
# or routable FQDN — operator-supplied per-fleet). The
# `ansible_python_interpreter` pin matches the Ubuntu 24.04 system
# python3.12 so we never depend on a venv.
ansible_host: fsn-1.gregale.dev
ansible_python_interpreter: /usr/bin/python3

# Multi-host mesh (ADR-092): fsn-1 is the control-plane box and does
# NOT route overlay traffic — it sets up Postgres + the CP-only
# daemons. The N+ overlay mesh runs between the compute_only boxes
# (fsn-2 today; future fsn-3+); nftables therefore sees zero overlay
# entries on fsn-1 and the template renders the default ruleset
# (no per-overlay accept, no per-overlay MASQUERADE). Empty list
# is the canonical "no overlay" sentinel — not "0.0.0.0/0".
#
# Mega-PR-C (issue #911 / ADR-110): this is the Go-side parity
# shape — pkg/netns/policy.go::HostPolicy.Render accepts an empty
# overlay slice as the single-box default. Kept explicit here so a
# future operator override lands with a non-empty list by intent,
# not by drift.
overlay_cidrs: []
