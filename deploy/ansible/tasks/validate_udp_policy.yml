- name: UDP policy — require explicit UDP source policy
  ansible.builtin.assert:
    that:
      - faas_udpd_allowed_cidrs | length > 0
      - faas_udpd_allowed_cidrs | select('search', ':') | list | length == 0
    fail_msg: UDP ingress requires explicit IPv4 client CIDRs.
  when: faas_udpd_enabled | default(false) | bool

- name: UDP policy — validate UDP IPv4 bind literal
  ansible.builtin.assert:
    that:
      - faas_udpd_bind_host | default('0.0.0.0') is match(udp_ipv4_pattern)
    fail_msg: UDP bind host must be an IPv4 address literal.
  vars:
    udp_ipv4_pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
  when: faas_udpd_enabled | default(false) | bool

- name: UDP policy — validate each UDP source CIDR
  ansible.builtin.assert:
    that:
      - item is match(udp_cidr_pattern)
    fail_msg: UDP source policy requires valid IPv4 CIDRs.
  vars:
    udp_cidr_pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(?:[0-9]|[12][0-9]|3[0-2])$'
  loop: "{{ faas_udpd_allowed_cidrs }}"
  when: faas_udpd_enabled | default(false) | bool
