[defaults]
inventory = inventory
roles_path = ./roles
# ADR-143: the `yaml` stdout callback was removed from community.general
# 12.0 (superseded by ansible-core's result_format option). Any REAL run
# on a current install died with "Could not load 'yaml' callback plugin";
# --syntax-check never loads callbacks, which is why nothing noticed until
# CI started executing scale_check.yml.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
# Verify SSH host keys in production. Operators must seed the deployment
# workstation's known_hosts from the provider console or trusted out-of-band
# channel before the first run; accepting a changed key automatically would
# turn a provider/DNS mistake into a credential disclosure.
host_key_checking = True
# forks=1 — the bootstrap playbook targets one host at a time
# (`serial: 1` on the play enforces per-host serial run; `forks`
# controls intra-host parallelism). forks=1 keeps the play
# deterministic and avoids spawning N parallel sudo sessions on a
# single host that has nothing to parallelize.
forks = 1
# Surface warnings (especially about deprecated ansible-core features) so
# role drift is visible during an operator run.
deprecation_warnings = True
interpreter_python = /usr/bin/python3

# Role-limited production bootstraps still need facts for peer hosts when
# rendering managed private-host aliases. The preflight play populates this
# cache before the limited role play runs.
fact_caching = jsonfile
fact_caching_connection = .cache/ansible
fact_caching_timeout = 3600
