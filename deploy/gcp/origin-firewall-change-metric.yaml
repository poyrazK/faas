description: Mutations to GCP VPC firewall rules protecting the Gregale public origin.
filter: >-
  log_id("cloudaudit.googleapis.com/activity") AND
  resource.type="gce_firewall_rule" AND
  protoPayload.methodName:("compute.firewalls.insert" OR
                           "compute.firewalls.patch" OR
                           "compute.firewalls.update" OR
                           "compute.firewalls.delete")
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
