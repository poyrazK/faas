<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>faas status</title>
<style>
  :root {
    --bg: #0e1014;
    --fg: #e6e8eb;
    --muted: #8b929c;
    --green: #2ea043;
    --yellow: #d4a017;
    --red: #d04848;
    --bar-bg: #1d2026;
    --card: #161922;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .label { display: flex; justify-content: space-between; align-items: baseline; }
  .label .name { font-weight: 600; }
  .label .value { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar {
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    margin-top: 10px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--green);
    transition: width 600ms ease, background 200ms ease;
  }
  .bar.warn > span { background: var(--yellow); }
  .bar.bad > span { background: var(--red); }
  .sparkline-wrap { margin-top: 14px; padding: 8px 0 2px; }
  .sparkline { display: block; width: 100%; height: 96px; }
  .sparkline .track { fill: var(--bar-bg); }
  .sparkline .line { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .sparkline .point { stroke: var(--card); stroke-width: 2; }
  .sparkline-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  details.row summary { cursor: pointer; list-style-position: outside; }
  details.row summary::marker { color: var(--muted); }
  .incidents-list { margin-top: 16px; }
  .incident { border-top: 1px solid var(--border); padding: 12px 0 0; margin-top: 12px; }
  .incident:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .incident-title { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .incident-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .incident-summary { margin: 7px 0 0; }
  .incident-empty { color: var(--muted); margin: 14px 0 0; }
  /* Degraded pill: visible only when s.degraded is true. The pill
     surfaces customer-impacting page/warn alerts. Internal operator
     alerts remain visible in Prometheus and Alertmanager without
     changing public service status. */
  .pill {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .pill.hidden { display: none; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: right; }
  a { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>faas status</h1>
  <div class="sub" id="sub">Loading…</div>
  <!-- Degraded pill: hidden by default; the JS polling block in
       <script> toggles `.hidden` based on s.degraded from
       /status/slo.json. The pill surfaces customer-impacting
       page/warn alerts currently firing on the local Prometheus. -->
  <div id="degraded-pill" class="pill hidden" role="status" aria-live="polite">
    Service degraded
  </div>

  <div class="row">
    <div class="label">
      <span class="name">API availability</span>
      <span class="value" id="api-v">—</span>
    </div>
    <div class="bar" id="api-bar"><span></span></div>
  </div>

  <div class="row">
    <div class="label">
      <span class="name">Cold-wake latency (p95)</span>
      <span class="value" id="wake-v">—</span>
    </div>
    <div class="bar" id="wake-bar"><span></span></div>
  </div>

  <div class="row">
    <div class="label">
      <span class="name">Build success rate</span>
      <span class="value" id="build-v">—</span>
    </div>
    <div class="bar" id="build-bar"><span></span></div>
  </div>

  <div class="row">
    <div class="label">
      <span class="name">30-day uptime</span>
      <span class="value" id="uptime-v">—</span>
    </div>
    <div class="sparkline-wrap">
      <svg id="uptime-sparkline" class="sparkline" viewBox="0 0 600 100" role="img" aria-label="30-day uptime history"></svg>
    </div>
    <div class="sparkline-labels"><span>30 days ago</span><span id="uptime-traffic">—</span><span>Today</span></div>
  </div>

  <details class="row" id="incidents-card">
    <summary class="label">
      <span class="name">Incident history</span>
      <span class="value" id="incidents-v">—</span>
    </summary>
    <div id="incidents-list" class="incidents-list"></div>
  </details>

  <div class="foot">
    Source: <a href="/status/slo.json">/status/slo.json</a>
    · auto-refreshes every 30s
  </div>
</div>

<script>
// Polls /status/slo.json every 30s. No SPA, no build step, no
// third-party deps. The numeric thresholds (warn at 99%, red at
// 97%; wake warn at 350ms / red at 800ms) come straight from the
// spec §12 SLOs.
const WARN_API = 99;
const RED_API = 97;
const WARN_WAKE_MS = 350;
const RED_WAKE_MS = 800;
const WARN_BUILD = 95;
const RED_BUILD = 80;
const SPARKLINE_WIDTH = 600;
const SPARKLINE_HEIGHT = 100;

function setBar(barId, valueId, pct, formatted, lowerIsBetter, warnThreshold, redThreshold) {
  const bar = document.getElementById(barId);
  const fill = bar.querySelector('span');
  const v = document.getElementById(valueId);
  v.textContent = formatted;
  if (lowerIsBetter) {
    // For wake latency: pct is "how far under the bad threshold",
    // mapped so 0% = empty bar (good) and the bar is mostly green
    // when latency is far below RED_WAKE_MS. We just normalize
    // against 2*RED so the bar feels right at typical values.
    const fillPct = Math.max(0, Math.min(100, 100 - (pct / (RED_WAKE_MS * 2)) * 100));
    fill.style.width = fillPct + '%';
    bar.classList.remove('warn', 'bad');
    if (pct >= redThreshold) bar.classList.add('bad');
    else if (pct >= warnThreshold) bar.classList.add('warn');
  } else {
    fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    bar.classList.remove('warn', 'bad');
    if (pct < redThreshold) bar.classList.add('bad');
    else if (pct < warnThreshold) bar.classList.add('warn');
  }
}

function setUnavailableBar(barId, valueId, label) {
  const bar = document.getElementById(barId);
  bar.querySelector('span').style.width = '0%';
  bar.classList.remove('warn', 'bad');
  document.getElementById(valueId).textContent = label;
}

function formatTime(value) {
  const date = value ? new Date(value) : null;
  if (!date || Number.isNaN(date.getTime())) return 'unknown time';
  return date.toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'});
}

function renderUptime(buckets) {
  const svg = document.getElementById('uptime-sparkline');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (!Array.isArray(buckets) || buckets.length === 0) {
    document.getElementById('uptime-traffic').textContent = 'No traffic';
    return;
  }

  const width = SPARKLINE_WIDTH;
  const height = SPARKLINE_HEIGHT;
  const points = buckets.map((bucket, index) => {
	const total = Number(bucket.total) || 0;
	const available = bucket.uptime_pct != null && total > 0 && Number.isFinite(Number(bucket.uptime_pct));
	const pct = available ? Math.max(0, Math.min(100, Number(bucket.uptime_pct))) : null;
    const x = buckets.length === 1 ? width / 2 : index * width / (buckets.length - 1);
	const y = available ? height - (pct / 100) * (height - 8) - 4 : height / 2;
	return {x, y, pct, available, total, date: bucket.date};
  });

  const track = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  track.setAttribute('class', 'track');
  track.setAttribute('x', '0');
  track.setAttribute('y', '0');
  track.setAttribute('width', String(width));
  track.setAttribute('height', String(height));
  track.setAttribute('rx', '5');
  svg.appendChild(track);

  // Draw separate runs so missing days remain visible gaps instead of a
  // synthetic plunge to 0% or a line connecting observations across them.
  let run = [];
  function appendRun() {
    if (run.length < 2) { run = []; return; }
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('class', 'line');
    line.setAttribute('points', run.map(p => `${p.x},${p.y}`).join(' '));
    svg.appendChild(line);
    run = [];
  }
  points.forEach(point => {
    if (!point.available) { appendRun(); return; }
    run.push(point);
  });
  appendRun();

  let observed = 0;
  points.forEach(point => {
    observed += point.total;
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('class', 'point');
    circle.setAttribute('cx', String(point.x));
    circle.setAttribute('cy', String(point.y));
    circle.setAttribute('r', '4');
    circle.setAttribute('fill', !point.available ? '#707781' : point.pct < RED_API ? 'var(--red)' : point.pct < WARN_API ? 'var(--yellow)' : 'var(--green)');
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = `${formatTime(point.date)}: ${!point.available ? 'no traffic / no data' : point.pct.toFixed(2) + '% uptime'}`;
    circle.appendChild(title);
    svg.appendChild(circle);
  });
  document.getElementById('uptime-traffic').textContent = observed + ' requests observed';
}

function renderIncidents(incidents) {
  const list = document.getElementById('incidents-list');
  list.replaceChildren();
  if (!Array.isArray(incidents) || incidents.length === 0) {
    document.getElementById('incidents-v').textContent = 'None';
    const empty = document.createElement('p');
    empty.className = 'incident-empty';
    empty.textContent = 'No incidents reported in the last 30 days.';
    list.appendChild(empty);
    return;
  }
  document.getElementById('incidents-v').textContent = incidents.length + (incidents.length === 1 ? ' incident' : ' incidents');
  incidents.forEach(incident => {
    const article = document.createElement('article');
    article.className = 'incident';
    const title = document.createElement('div');
    title.className = 'incident-title';
    const severity = document.createElement('span');
    severity.textContent = incident.severity || 'incident';
    const state = document.createElement('span');
    state.textContent = incident.resolved_at ? 'Resolved' : 'Ongoing';
    title.append(severity, state);
    article.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'incident-meta';
    const component = incident.component ? incident.component + ' · ' : '';
    meta.textContent = component + 'Started ' + formatTime(incident.started_at) +
      (incident.resolved_at ? ' · resolved ' + formatTime(incident.resolved_at) : '');
    article.appendChild(meta);

    const summary = document.createElement('p');
    summary.className = 'incident-summary';
    summary.textContent = incident.summary || 'No summary provided.';
    article.appendChild(summary);
    list.appendChild(article);
  });
}

async function refresh() {
  const sub = document.getElementById('sub');
  const pill = document.getElementById('degraded-pill');
  try {
    const r = await fetch('/status/slo.json', {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const s = await r.json();
    const updated = s.as_of ? new Date(s.as_of) : new Date();
    const age = Math.max(0, Math.round((Date.now() - updated.getTime()) / 1000));
    const ageLabel = age < 60 ? `${age}s ago` : `${Math.round(age/60)}m ago`;
    sub.textContent = `Updated ${ageLabel}. Source: ${s.source || 'unknown'}.`;

    // Toggle the degraded pill off when no alerts are firing. The
    // pill must hide as well as show — a transient firing that has
    // since cleared should not leave the page red.
    if (s.degraded) {
      pill.classList.remove('hidden');
    } else {
      pill.classList.add('hidden');
    }

    setBar('api-bar', 'api-v', s.api_availability_pct || 0,
      (s.api_availability_pct || 0).toFixed(2) + '%', false, WARN_API, RED_API);
    if (s.wake_p95_ms == null || !Number.isFinite(Number(s.wake_p95_ms))) {
	  setUnavailableBar('wake-bar', 'wake-v', '—');
    } else {
	  setBar('wake-bar', 'wake-v', Number(s.wake_p95_ms),
		Math.round(Number(s.wake_p95_ms)) + ' ms', true, WARN_WAKE_MS, RED_WAKE_MS);
    }
    setBar('build-bar', 'build-v', s.build_success_pct || 0,
      (s.build_success_pct || 0).toFixed(2) + '%', false, WARN_BUILD, RED_BUILD);
    const uptimeHistory = Array.isArray(s.uptime_30d) ? s.uptime_30d : [];
    if (uptimeHistory.length === 0 || s.uptime_30d_pct == null) {
      document.getElementById('uptime-v').textContent = '—';
    } else {
      document.getElementById('uptime-v').textContent = Number(s.uptime_30d_pct).toFixed(2) + '%';
    }
    renderUptime(uptimeHistory);
    renderIncidents(s.incidents);
  } catch (e) {
    sub.textContent = 'Status source unavailable: ' + e.message;
    document.getElementById('uptime-v').textContent = '—';
    renderUptime([]);
    renderIncidents([]);
    // If we can't reach the JSON endpoint at all, hide the pill —
    // we can't claim degraded without evidence.
    pill.classList.add('hidden');
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
