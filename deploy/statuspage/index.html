<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>faas status</title>
<style>
  :root {
    --bg: #0e1014;
    --fg: #e6e8eb;
    --muted: #8b929c;
    --green: #2ea043;
    --yellow: #d4a017;
    --red: #d04848;
    --bar-bg: #1d2026;
    --card: #161922;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .label { display: flex; justify-content: space-between; align-items: baseline; }
  .label .name { font-weight: 600; }
  .label .value { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar {
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    margin-top: 10px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--green);
    transition: width 600ms ease, background 200ms ease;
  }
  .bar.warn > span { background: var(--yellow); }
  .bar.bad > span { background: var(--red); }
  .sparkline-wrap { margin-top: 14px; padding: 8px 0 2px; }
  .sparkline { display: block; width: 100%; height: 96px; }
  .sparkline .track { fill: var(--bar-bg); }
  .sparkline .line { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .sparkline .point { stroke: var(--card); stroke-width: 2; }
  .sparkline-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  details.row summary { cursor: pointer; list-style-position: outside; }
  details.row summary::marker { color: var(--muted); }
  .incidents-list { margin-top: 16px; }
  .incident { border-top: 1px solid var(--border); padding: 12px 0 0; margin-top: 12px; }
  .incident:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .incident-title { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .incident-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .incident-summary { margin: 7px 0 0; }
  .incident-empty { color: var(--muted); margin: 14px 0 0; }
  /* Degraded pill: visible only when s.degraded is true. The pill
     surfaces customer-impacting page/warn alerts. Internal operator
     alerts remain visible in Prometheus and Alertmanager without
     changing public service status. */
  .pill {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .pill.hidden { display: none; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: right; }
  a { color: var(--fg); }

  .pill.operational { background: var(--green); }
  .pill.degraded, .pill.maintenance, .pill.partial_outage { background: var(--yellow); color: #111; }
  .pill.major_outage { background: var(--red); }
  .pill.unknown { background: var(--muted); }
  .section-title { margin: 24px 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .components { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .component { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .component-name { font-weight: 600; }
  .component-status { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .component-status.operational { color: var(--green); }
  .component-status.degraded, .component-status.maintenance, .component-status.partial_outage { color: var(--yellow); }
  .component-status.major_outage { color: var(--red); }
  .component-status.unknown { color: var(--muted); }
  .component-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .history-select { color: var(--fg); background: var(--bar-bg); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; }
  .pre-release-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gregale status</h1>
  <div class="sub" id="sub">Loading…</div>
  <div id="overall-pill" class="pill unknown" role="status" aria-live="polite">Status unknown</div>

  <div class="section-title">Components</div>
  <div id="components" class="components" aria-live="polite"></div>

  <div class="section-title">Live indicators</div>
  <div class="row">
    <div class="label">
      <span class="name" id="api-label">API availability</span>
      <span class="value" id="api-v">—</span>
    </div>
    <div class="bar" id="api-bar"><span></span></div>
  </div>

  <div class="row">
    <div class="label">
      <span class="name" id="wake-label">Platform wake p95</span>
      <span class="value" id="wake-v">—</span>
    </div>
    <div class="bar" id="wake-bar"><span></span></div>
  </div>

  <div class="row">
    <div class="label">
      <span class="name" id="build-label">Deployment success</span>
      <span class="value" id="build-v">—</span>
    </div>
    <div class="bar" id="build-bar"><span></span></div>
  </div>

  <div class="section-title">Post-launch history</div>
  <div class="row">
    <div class="label">
      <select id="history-component" class="history-select" aria-label="Status component history"></select>
      <span class="value" id="uptime-v">—</span>
    </div>
    <div class="sparkline-wrap">
      <svg id="uptime-sparkline" class="sparkline" viewBox="0 0 600 100" role="img" aria-label="30-day component uptime history"></svg>
    </div>
    <div class="sparkline-labels"><span>30 days ago</span><span id="uptime-traffic">—</span><span>Today</span></div>
    <div class="pre-release-note" id="history-note"></div>
  </div>

  <details class="row" id="incidents-card" open>
    <summary class="label">
      <span class="name">Events and maintenance</span>
      <span class="value" id="incidents-v">—</span>
    </summary>
    <div id="incidents-list" class="incidents-list"></div>
  </details>

  <div class="foot">
    Source: <a href="/v1/status">/v1/status</a>
    · auto-refreshes every 30s
  </div>
</div>

<script>
// The public page consumes the canonical component status contract. This keeps
// launch cutoffs, pre-release days, coverage, indicators, and event history
// identical to the unauthenticated JSON API.
const STATUS_API = '/v1/status';
const SPARKLINE_WIDTH = 600;
const SPARKLINE_HEIGHT = 100;
let currentComponents = [];

function finiteNumber(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function titleCase(value) {
  return String(value || 'unknown').replaceAll('_', ' ').replace(/\b\w/g, letter => letter.toUpperCase());
}

function formatTime(value) {
  const date = value ? new Date(value) : null;
  if (!date || Number.isNaN(date.getTime())) return 'unknown time';
  return date.toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'});
}

function renderOverall(status) {
  const pill = document.getElementById('overall-pill');
  const normalized = ['operational', 'maintenance', 'degraded', 'partial_outage', 'major_outage'].includes(status) ? status : 'unknown';
  pill.className = 'pill ' + normalized;
  pill.textContent = normalized === 'operational' ? 'All systems operational' : titleCase(normalized);
}

function renderComponents(components) {
  const root = document.getElementById('components');
  root.replaceChildren();
  if (!Array.isArray(components) || components.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'component';
    empty.textContent = 'Component status unavailable';
    root.appendChild(empty);
    return;
  }
  components.forEach(component => {
    const card = document.createElement('div');
    card.className = 'component';
    const label = document.createElement('div');
    label.className = 'label';
    const name = document.createElement('span');
    name.className = 'component-name';
    name.textContent = component.name || component.id;
    const status = document.createElement('span');
    status.className = 'component-status ' + (component.status || 'unknown');
    status.textContent = titleCase(component.status);
    label.append(name, status);
    card.appendChild(label);
    const meta = document.createElement('div');
    meta.className = 'component-meta';
    const uptime = finiteNumber(component.uptime_30d_pct);
    const coverage = finiteNumber(component.coverage_30d_pct);
    meta.textContent = (uptime == null ? 'Uptime: awaiting post-launch data' : `Uptime: ${uptime.toFixed(2)}%`) +
      (coverage == null ? '' : ` · Coverage: ${coverage.toFixed(1)}%`);
    card.appendChild(meta);
    root.appendChild(card);
  });
}

function indicatorTarget(indicator) {
  const target = finiteNumber(indicator.target);
  if (target == null) return '';
  return `${indicator.comparison === 'lte' ? '≤' : '≥'} ${target}${indicator.unit || ''}`;
}

function renderIndicator(indicator, barID, valueID, labelID) {
  const bar = document.getElementById(barID);
  const fill = bar.querySelector('span');
  const value = document.getElementById(valueID);
  const label = document.getElementById(labelID);
  bar.classList.remove('warn', 'bad');
  label.textContent = indicator?.label || label.textContent;
  label.title = indicator ? `Target ${indicatorTarget(indicator)}` : '';
  if (!indicator || indicator.sample_status !== 'available' || finiteNumber(indicator.value) == null) {
    fill.style.width = '0%';
    value.textContent = indicator?.sample_status === 'no_sample' ? 'No sample' : 'Unavailable';
    return;
  }
  const observed = finiteNumber(indicator.value);
  const target = finiteNumber(indicator.target);
  const lowerIsBetter = indicator.comparison === 'lte';
  const breached = target != null && (lowerIsBetter ? observed > target : observed < target);
  const fillPct = lowerIsBetter && target > 0
    ? Math.max(0, Math.min(100, 100 - (observed / (target * 2)) * 100))
    : Math.max(0, Math.min(100, observed));
  fill.style.width = fillPct + '%';
  if (breached) bar.classList.add('bad');
  value.textContent = indicator.unit === 'ms' ? `${Math.round(observed)} ms` : `${observed.toFixed(2)}${indicator.unit || ''}`;
}

function pointColour(point) {
  if (point.preRelease || !point.available) return '#707781';
  if (point.status === 'major_outage') return 'var(--red)';
  if (point.status === 'degraded' || point.status === 'partial_outage' || point.status === 'maintenance') return 'var(--yellow)';
  return 'var(--green)';
}

function renderHistory(component) {
  const svg = document.getElementById('uptime-sparkline');
  svg.replaceChildren();
  const daily = Array.isArray(component?.daily) ? component.daily : [];
  const uptime = finiteNumber(component?.uptime_30d_pct);
  document.getElementById('uptime-v').textContent = uptime == null ? '—' : `${uptime.toFixed(2)}%`;
  if (daily.length === 0) {
    document.getElementById('uptime-traffic').textContent = 'No component history';
    document.getElementById('history-note').textContent = '';
    return;
  }

  const points = daily.map((bucket, index) => {
    const preRelease = bucket.status === 'pre_release';
    const pct = finiteNumber(bucket.uptime_pct);
    const available = !preRelease && pct != null;
    const x = daily.length === 1 ? SPARKLINE_WIDTH / 2 : index * SPARKLINE_WIDTH / (daily.length - 1);
    const bounded = available ? Math.max(0, Math.min(100, pct)) : null;
    const y = available ? SPARKLINE_HEIGHT - (bounded / 100) * (SPARKLINE_HEIGHT - 8) - 4 : SPARKLINE_HEIGHT / 2;
    return {x, y, pct: bounded, available, preRelease, status: bucket.status, date: bucket.date, coverage: finiteNumber(bucket.coverage_pct)};
  });

  const track = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  track.setAttribute('class', 'track');
  track.setAttribute('x', '0');
  track.setAttribute('y', '0');
  track.setAttribute('width', String(SPARKLINE_WIDTH));
  track.setAttribute('height', String(SPARKLINE_HEIGHT));
  track.setAttribute('rx', '5');
  svg.appendChild(track);

  let run = [];
  function appendRun() {
    if (run.length >= 2) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('class', 'line');
      line.setAttribute('points', run.map(point => `${point.x},${point.y}`).join(' '));
      svg.appendChild(line);
    }
    run = [];
  }
  points.forEach(point => {
    if (!point.available) { appendRun(); return; }
    run.push(point);
  });
  appendRun();

  points.forEach(point => {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('class', 'point');
    circle.setAttribute('cx', String(point.x));
    circle.setAttribute('cy', String(point.y));
    circle.setAttribute('r', '4');
    circle.setAttribute('fill', pointColour(point));
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    const detail = point.preRelease ? 'pre-release' : point.available ? `${point.pct.toFixed(2)}% uptime · ${point.coverage?.toFixed(1) || '0.0'}% coverage` : `${titleCase(point.status)} · no valid sample`;
    title.textContent = `${point.date}: ${detail}`;
    circle.appendChild(title);
    svg.appendChild(circle);
  });

  const eligible = points.filter(point => !point.preRelease);
  const preReleaseDays = points.length - eligible.length;
  const coverage = finiteNumber(component?.coverage_30d_pct);
  document.getElementById('uptime-traffic').textContent = coverage == null ? 'Coverage unavailable' : `${coverage.toFixed(1)}% telemetry coverage`;
  document.getElementById('history-note').textContent = preReleaseDays > 0
    ? `${preReleaseDays} day${preReleaseDays === 1 ? '' : 's'} before public launch are excluded from uptime.`
    : 'All displayed days are inside the public launch window.';
}

function renderHistorySelector(components) {
  const select = document.getElementById('history-component');
  const previous = select.value;
  select.replaceChildren();
  components.forEach(component => {
    const option = document.createElement('option');
    option.value = component.id;
    option.textContent = component.name || component.id;
    select.appendChild(option);
  });
  if (components.some(component => component.id === previous)) select.value = previous;
  const selected = components.find(component => component.id === select.value) || components[0];
  if (selected) select.value = selected.id;
  renderHistory(selected);
}

function renderEvents(status) {
  const active = Array.isArray(status.active_events) ? status.active_events.map(event => ({event, group: 'Active'})) : [];
  const upcoming = Array.isArray(status.upcoming_maintenance) ? status.upcoming_maintenance.map(event => ({event, group: 'Upcoming'})) : [];
  const resolved = Array.isArray(status.resolved_incidents) ? status.resolved_incidents.map(event => ({event, group: 'Resolved'})) : [];
  const events = [...active, ...upcoming, ...resolved];
  const list = document.getElementById('incidents-list');
  list.replaceChildren();
  document.getElementById('incidents-v').textContent = events.length === 0 ? 'None' : `${active.length} active · ${upcoming.length} upcoming · ${resolved.length} resolved`;
  if (events.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'incident-empty';
    empty.textContent = 'No active incidents, upcoming maintenance, or recent resolved incidents.';
    list.appendChild(empty);
    return;
  }
  events.forEach(({event, group}) => {
    const article = document.createElement('article');
    article.className = 'incident';
    const heading = document.createElement('div');
    heading.className = 'incident-title';
    const title = document.createElement('span');
    title.textContent = event.title || titleCase(event.kind);
    const state = document.createElement('span');
    state.textContent = `${group} · ${titleCase(event.impact || event.state)}`;
    heading.append(title, state);
    article.appendChild(heading);
    const meta = document.createElement('div');
    meta.className = 'incident-meta';
    const startsAt = event.starts_at || event.scheduled_start_at || event.updated_at;
    meta.textContent = `${(event.components || []).map(titleCase).join(', ') || 'Platform'} · ${formatTime(startsAt)}` +
      (event.resolved_at ? ` · resolved ${formatTime(event.resolved_at)}` : '');
    article.appendChild(meta);
    const latest = Array.isArray(event.updates) && event.updates.length > 0 ? event.updates[event.updates.length - 1] : null;
    if (latest?.message) {
      const summary = document.createElement('p');
      summary.className = 'incident-summary';
      summary.textContent = latest.message;
      article.appendChild(summary);
    }
    list.appendChild(article);
  });
}

async function refresh() {
  const sub = document.getElementById('sub');
  try {
    const response = await fetch(STATUS_API, {cache: 'no-store'});
    if (!response.ok) throw new Error('http ' + response.status);
    const status = await response.json();
    const updated = status.updated_at ? new Date(status.updated_at) : new Date();
    const age = Math.max(0, Math.round((Date.now() - updated.getTime()) / 1000));
    const ageLabel = age < 60 ? `${age}s ago` : `${Math.round(age / 60)}m ago`;
    sub.textContent = `Updated ${ageLabel} · ${titleCase(status.data_status)} data · ${titleCase(status.region_scope)}`;
    renderOverall(status.overall_status);
    currentComponents = Array.isArray(status.components) ? status.components : [];
    renderComponents(currentComponents);
    renderHistorySelector(currentComponents);
    const indicators = new Map((status.indicators || []).map(indicator => [indicator.id, indicator]));
    renderIndicator(indicators.get('api_availability'), 'api-bar', 'api-v', 'api-label');
    renderIndicator(indicators.get('wake_p95'), 'wake-bar', 'wake-v', 'wake-label');
    renderIndicator(indicators.get('build_success'), 'build-bar', 'build-v', 'build-label');
    renderEvents(status);
  } catch (error) {
    sub.textContent = 'Status source unavailable: ' + error.message;
    renderOverall('unknown');
    renderComponents([]);
    renderHistory(null);
    renderIndicator(null, 'api-bar', 'api-v', 'api-label');
    renderIndicator(null, 'wake-bar', 'wake-v', 'wake-label');
    renderIndicator(null, 'build-bar', 'build-v', 'build-label');
    renderEvents({});
  }
}

document.getElementById('history-component').addEventListener('change', event => {
  renderHistory(currentComponents.find(component => component.id === event.target.value));
});
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
