# GCP live split-box deployment manifest.
#
# This is the deployment-specific counterpart to
# deploy/manifest/examples/splitbox.example.yaml. It records the stable
# private-DNS names and immutable topology for the three-node GCP fleet.
# `fsn-1.gregale.dev`, `fsn-2.gregale.dev`, and `fsn-3.gregale.dev` must resolve through the
# operator's private/split-horizon DNS to the fleet's routable private
# addresses; they must not be published as public Cloudflare records.
# The same private DNS view must resolve the mTLS service identities
# `schedd.faas`, `vmmd.faas`, and `egress.faas`; those names are certificate
# identities and remain separate from the public app wildcard.
# The provider-native NIC is pinned below. The GCP VPC CIDR is deliberately
# not used as vmmd's overlay preference because vmmd's tenant-overlay safety
# gate rejects RFC1918 ranges; the private transport names remain the source
# of truth for node-to-node control traffic.
#
# The release identity below is a schema-valid template value. Release CI
# materializes a final manifest with the tag commit and publishes that exact
# file beside the signed bundle. Do not hand-edit release.git_sha for a
# release; change topology here and let the release workflow derive the
# release identity and manifest hash.

schema_version: "1.0.0"

fleet:
  # A release enables this boundary once; subsequent compute additions are
  # authorized by short-lived, signed FleetEnrollmentBundles. Runtime
  # endpoints remain deterministic (<node>.gregale.dev on vmmd's port), and
  # the control plane refuses additions beyond this beta ceiling.
  dynamic_compute:
    enabled: true
    max_nodes: 16
    name_prefix: fsn-
    tags: ["gcp-vpc", "dynamic"]
  hosts:
    - name: fsn-1
      role: control-plane
      address: fsn-1.gregale.dev:9091
      tags: ["primary", "gcp-vpc"]
    - name: fsn-2
      role: compute-only
      address: fsn-2.gregale.dev:50051
      tags: ["gcp-vpc"]
      # ADR-20261102081618: gregale-compute-1's forwarding rule
      # gregale-compute-1-edge-https, which carries TCP 443 alone
      # (deploy/scripts/gcp-compute-edge-address.sh).
      public_ipv4: 34.148.143.180
      public_ipv4_forwarded: true
    - name: fsn-3
      role: compute-only
      address: fsn-3.gregale.dev:50051
      tags: ["gcp-vpc"]
      # gregale-compute-2's forwarding rule gregale-compute-2-edge-https.
      public_ipv4: 34.26.249.95
      public_ipv4_forwarded: true

daemons:
  schedd:
    bind: tcp://0.0.0.0:9091
    tls:
      cert_path: /etc/faas/tls/schedd/server.crt
      key_path: /etc/faas/tls/schedd/server.key
      ca_path: /etc/faas/tls/ca/ca.crt
      mode: "0400"
    outbound:
      target: tcp://vmmd.faas:50051
      tls:
        cert_path: /etc/faas/tls/schedd/vmmd-client.crt
        key_path: /etc/faas/tls/schedd/vmmd-client.key
        ca_path: /etc/faas/tls/ca/ca.crt
    # The control-plane schedd reaches the local edge; compute schedds use
    # their node-local gatewayd-internal socket after host rendering.
    gateway_synth_target: tcp://127.0.0.1:8080
    # ADR-20261021215353 early freeze. Releases re-render schedd.toml from
    # this manifest, so a value set by hand on a node is lost at the next
    # rollout. Set it here only after a release whose gregalectl and imaged
    # parse the key is live on every node: older ones reject unknown keys.
    # frozen_tier_early_freeze_after_s: 10
  vmmd:
    bind: tcp://0.0.0.0:50051
    tls:
      cert_path: /etc/faas/tls/vmmd/server.crt
      key_path: /etc/faas/tls/vmmd/server.key
      ca_path: /etc/faas/tls/ca/ca.crt
      mode: "0400"
    schedd_client_tls:
      cert_path: /etc/faas/tls/vmmd/schedd-client.crt
      key_path: /etc/faas/tls/vmmd/schedd-client.key
      ca_path: /etc/faas/tls/ca/ca.crt
    compute_node:
      host_bridge_cidr: 10.100.0.0/16
      overlay_interface: ens4
  apid:
    bind: unix:///run/faas/apid.sock
  meterd:
    bind: unix:///run/faas/meterd.sock
  gatewayd_public:
    bind: tcp://0.0.0.0:443
  gatewayd_internal:
    bind: tcp://0.0.0.0:8080
    # ADR-1520: spend the central rate-limit counters from local leases, so a
    # request within its limit never waits on the control plane's Postgres.
    # On by hand on fsn-2/fsn-3 since 2026-10-25 (owner); this keeps it on
    # through releases, which re-render gatewayd-internal.toml.
    ratelimit_lease: true
    apid_loopback: http://fsn-1.gregale.dev:8081
    schedd_tls:
      cert_path: /etc/faas/tls/gatewayd/schedd-client.crt
      key_path: /etc/faas/tls/gatewayd/schedd-client.key
      ca_path: /etc/faas/tls/ca/ca.crt
    vmmd_tls:
      cert_path: /etc/faas/tls/gatewayd/vmmd-client.crt
      key_path: /etc/faas/tls/gatewayd/vmmd-client.key
      ca_path: /etc/faas/tls/ca/ca.crt
    egress_tls:
      cert_path: /etc/faas/tls/egress/egress.crt
      key_path: /etc/faas/tls/egress/egress.key
      ca_path: /etc/faas/tls/ca/ca.crt
  realtimed:
    bind: unix:///run/faas/realtimed.sock
  imaged:
    # imaged has no primary RPC listener, but a non-empty bind declares the
    # daemon in the manifest so the renderer emits its per-host private
    # metrics and readiness listener on :9102.
    bind: tcp://127.0.0.1:9102
  builderd:
    # The renderer derives the per-host vmmd target from the compute
    # host's own address; the placeholder target supplies the schema's
    # outbound shape and is never copied into the final TOML.
    bind: tcp://127.0.0.1:9091
    outbound:
      target: tcp://fsn-2.gregale.dev:50051
      tls:
        cert_path: /etc/faas/tls/builderd/vmmd-client.crt
        key_path: /etc/faas/tls/builderd/vmmd-client.key
        ca_path: /etc/faas/tls/ca/ca.crt

overlay:
  provider: static
  # gregale-prod VPC subnet gregale-us-east1 (us-east1). The previous
  # europe-west3 project used 10.156.0.0/20.
  cidr: 10.10.0.0/20

# The GCP VPC is RFC1918. These exceptions are intentionally explicit and
# limited to the VPC overlay used by this fleet; do not copy this block to a
# different network without reviewing its lateral-movement boundary.
egress:
  danger_accept_rfc1918_lateral_movement: true
  overlay_exceptions:
    - 10.10.0.0/20

# Branded S3 gateway (ADR 20261025111015). `managed` installs and health-gates
# s3-gatewayd on the control-plane node from these operator-local files; leave
# it unset only when no backend is configured. Strict `verify-fleet` fails when
# the gateway runs without this.
# object_storage:
#   gateway: managed
#   config_src: /operator/config/object-storage.json
#   # S3/R2/OVH only; GCS with attached ADC has no provider env file.
#   provider_env_src: /operator/secrets/object-storage.env

# ADR-1343: every compute node runs the app edge (faas-gatewayd-public-edge
# and the faas-cloudflared tunnel connector) and holds back 1,000 millicores
# and 256 MB from tenants for it. No app traffic moves until an operator
# stages the tunnel token and the public-timeout Worker routes a host to the
# tunnel: docs/runbooks/AppEdgeCutover.md.
public_edge:
  # ADR-520: provision edge.gregale.dev as DNS-only A/AAAA records for the
  # control plane before rollout. Add addresses to this block to support apexes.
  custom_domains:
    mode: on_demand
    target: edge.gregale.dev
    acme_email: ops@gregale.dev
  compute_nodes: true
  # ADR-20261031105055: Cloudflare sends almost every request to one
  # connector; each edge hands a host to the node that last served it.
  placement_routing: true
  # ADR-20261102081618 §5: spread each app host over every node it runs on,
  # and serve from the node's own instances first. On by hand since
  # 2026-11-02 (60-faas-edge-node-set.conf, 60-faas-edge-local-first.conf).
  placement_node_set: true
  local_first: true
  # ADR-20261102081618: the edges also take TLS on 443 at their forwarded
  # address, beside the tunnel. The role writes the listener and removes the
  # hand-placed 60-faas-edge-direct.conf it replaces.
  entry: both
  # ADR-20261103163954: nothing in front of the direct-entry names. Clients
  # reach the edges on the forwarded addresses, which take 443 from everyone
  # and nothing else (the entry-address firewall, ahead of sshd); the edges
  # apply the per-client limits themselves. Names not listed under dns stay
  # on the tunnel, untouched.
  front: none
  # ADR-20261103163954 pilot: edgednsd keeps direct-pilot.gregale.dev's
  # DNS-only A records (TTL 60) pointed at the edges that are ready. An edge
  # is ready only once it has loaded the certificate below, so no record
  # points at an edge that cannot serve it.
  dns:
    zone_id: c0baeb8d33b48ec1704766edcb695394
    names: ["direct-pilot.gregale.dev"]
    live: true
    # §3: edgednsd orders the apps domains' certificate from Let's Encrypt
    # with DNS-01 and stores it with its key sealed to the edge-tls seal
    # domain; each edge serves it, its key opened in memory. A failed order
    # is retried after 1 h, doubling to 12 h; meanwhile the pilot host has no
    # records and nothing else changes.
    certificate:
      names: ["*.gregale.dev"]
      ca: letsencrypt
      serve: letsencrypt
      # Pages on a publicly trusted certificate under gregale.dev that
      # edgednsd did not issue. Allowed, as Certificate Transparency listed
      # them on 2026-11-04: Cloudflare's Universal SSL certificate
      # (gregale.dev, *.gregale.dev), which the proxied platform hosts use, a
      # certificate for the apex alone, and operations.gregale.dev's (Vercel).
      transparency:
        domain: gregale.dev
        allow_names: ["gregale.dev", "*.gregale.dev", "operations.gregale.dev"]

# Request- and wake-path switches on the compute nodes, each measured on
# production by hand before it moved here (2026-11-06): the node journals
# request IDs and collapses request telemetry per minute (control-plane
# statements per request 0.21 -> 0.13), the edge keeps connections to each
# node's gatewayd-internal, gatewayd-internal reaches vmmd on its local
# socket, and schedd runs the frozen tier with its fast path and owner cache.
hot_path:
  local_request_id_journal: true
  request_telemetry_minute_collapse: true
  local_vmmd_data_socket: true
  edge_keepalive_per_node: true
  frozen_tier: true
  frozen_fast_path: true
  owner_cache: true

# Customer log archive (pkg/logarchive). Keyless: every node's attached
# service account holds roles/storage.objectUser on the bucket, whose
# lifecycle rule deletes faas-logs/ objects after 90 days.
log_archive:
  bucket: gregale-prod-280686321025-log-archive
  endpoint: https://storage.googleapis.com
  auth: gcp_metadata

dns:
  apps_domain: gregale.dev
  mode: cloudflare
  # ADR-20261103172551: the control plane's platform site admits Cloudflare's
  # address ranges, which every Cloudflare zone uses. any_zone keeps admitting
  # them all, knowingly, as before; the control plane has no origin-pull CA
  # yet, so `required` would stop its deploy. Switch to `required` once the
  # zone's own origin-pull certificate is in place
  # (docs/runbooks/EdgeDirectEntry.md, "The control plane's Caddy").
  origin_pull: any_zone

# Private transport names are managed from gathered host facts by the
# provider-neutral Ansible adapter. GCP Cloud DNS may still provide a local
# optimization, but it is not required and must not be the source of truth.
private_dns:
  mode: managed_hosts
  zone: gregale.dev

postgresql:
  # Credentials remain in host-local secret material, never in this file.
  dsn: postgres://faas@fsn-1.gregale.dev:5432/faas?sslmode=disable
  database: faas
  migration_max_slot: 341
  policy: on-boot

release:
  id: pre-1.0-template
  git_sha: 0000000000000000000000000000000000000000
  architecture: x86_64
  firecracker_version: 1.17.0
  # SHA-256 of firecracker-v1.17.0-x86_64 (matches the release SHA256SUMS).
  firecracker_digest: 99ad0f5cd0514a88aad0e9ae8cfdb3cc3b4ab9d190e1194602406c786b5de7a5
  kernel_digest: 9ee2204edd2162a6d9762bc6e07df00fdad57b83f9bf54bb8de4c9a200106e34
  # linux/amd64 child digest of builder-base:sha-f13bafeb0acd989806704317b4ec5353e32d20c8.
  # Keep this aligned with the guest-init source shipped by the release; the
  # multi-arch index digest is not suitable for the amd64 ext4 staging path.
  builder_base_digest: 450b2c07495a85e47a1e5856a90e56dd4e33c6dc4d2c9b5e484ba2f0e2753fae
  runtime_base_digest: 362e64223cc0da95422b3b13c045186fc0a81250e765d31c025fbddf257f6143
  # Release CI replaces these placeholders with the linux/amd64 child
  # digests published by images.yml. They are copied to
  # /etc/faas/runtime-bases.env on compute nodes so builderd and imaged use
  # the same immutable runtime contract.
  runtime_base_refs:
    minimal: __RUNTIME_BASE_REF_MINIMAL__
    debian_parent: __RUNTIME_BASE_REF_DEBIAN_PARENT__
    node22: __RUNTIME_BASE_REF_NODE22__
    python312: __RUNTIME_BASE_REF_PYTHON312__
    go124: __RUNTIME_BASE_REF_GO124__
    go124_alpine: __RUNTIME_BASE_REF_GO124_ALPINE__
    node24: __RUNTIME_BASE_REF_NODE24__
    python313: __RUNTIME_BASE_REF_PYTHON313__

storage:
  fast_root: /srv/fc
  spool_root: /var/spool/faas
  log_root: /var/log/faas
  run_dir: /run/faas

cgroups:
  slice: faas-cp.slice
  controllers: "memory,cpu,io,pids"

# Workload-identity tokens for queue workers (ADR-1141). Off until an
# operator runs `gregalectl workload-identity init --out DIR` on the
# controller and uncomments this with that DIR; converge the control plane
# first. See deploy/manifest/README.md.
# workload_identity:
#   source_dir: /path/on/controller/workload-identity

pki:
  root_dir: /etc/faas/tls
  # gregale-prod control-plane CA (fsn-1, `gregalectl pki init --box-role
  # control-plane`, 2026-09-29, expires 2031-09-28).
  ca_fingerprint: d36abbb9a533ed187f1ab6613df7cc0a1e459572f7c9a881f13673e335236ecb
  allowed_sans:
    - schedd.faas
    - vmmd.faas
    - apid.faas
    - gatewayd-public.faas
    - gatewayd-internal-public.faas
