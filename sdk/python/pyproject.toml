[tool.poetry]
# Distribution name is `gregale-sdk`; the import package stays `faas_sdk`
# (like `pip install pillow` -> `import PIL`). Do NOT name or publish it
# `faas_sdk`/`faas-sdk`: that PyPI project belongs to an unrelated company
# (Sonra Intelligence Ltd), so the name would point customers at someone
# else's code. tests/test_packaging.py pins this.
name = "gregale-sdk"
version = "0.1.0"
description = "Python SDK for Gregale applications"
license = "LicenseRef-onebox-internal"
authors = []
readme = "README.md"
packages = [
    { include = "faas_sdk" },
]
include = [
    "faas_sdk/py.typed",
    { path = "faas_sdk/preview/event_consumer_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_consumer_processing_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_acknowledgment_intent_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_acknowledgment_intent_stored_retry_policy_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_acknowledgment_intent_policy_adoption_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_acknowledgment_intent_retry_budget_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_acknowledgment_intent_retry_resume_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/event_acknowledgment_intent_budget_adoption_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/operation_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/customer_operation_schema.sql", format = ["sdist", "wheel"] },
    { path = "faas_sdk/preview/data_repair_readiness_probe.json", format = ["sdist", "wheel"] },
]

[tool.poetry.urls]
Homepage = "https://gregale.dev/docs/cli"
Repository = "https://github.com/poyrazK/faas"
Issues = "https://github.com/poyrazK/faas/issues"

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"
websockets = { version = ">=15.0.1,<16", optional = true }
cryptography = { version = ">=42", optional = true }

[tool.poetry.extras]
realtime = ["websockets"]
auth = ["cryptography"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "regen: deterministic-regen tripwire (heavy; opt in with -m regen).",
]
# Default selection excludes the heavy regen tripwire; run it via
# `pytest -m regen tests/test_post_process.py` to opt in.
addopts = ["-m", "not regen"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"faas_sdk/api/**" = ["UP"]
"faas_sdk/models/**" = ["UP"]
