[tool.poetry]
# Distribution name is `gregale-sdk`; the import package stays `faas_sdk`
# (like `pip install pillow` -> `import PIL`). Do NOT publish as
# `faas-sdk` — that name is already taken on PyPI by an unrelated
# package from Sonra Intelligence Ltd, so shipping under it would point
# customers at someone else's code.
name = "gregale-sdk"
version = "0.1.0"
description = "Python client library for the Gregale FaaS platform"
license = "LicenseRef-onebox-internal"
authors = []
readme = "README.md"
packages = [
    { include = "faas_sdk" },
]
include = ["faas_sdk/py.typed"]

[tool.poetry.urls]
Homepage = "https://gregale.dev/docs/cli"
Repository = "https://github.com/poyrazK/faas"
Issues = "https://github.com/poyrazK/faas/issues"

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "regen: deterministic-regen tripwire (heavy; opt in with -m regen).",
]
# Default selection excludes the heavy regen tripwire; run it via
# `pytest -m regen tests/test_post_process.py` to opt in.
addopts = ["-m", "not regen"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"faas_sdk/api/**" = ["UP"]
"faas_sdk/models/**" = ["UP"]
