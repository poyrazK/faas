[package]
name = "handler"
version = "0.1.0"
edition = "2024"
# Matches the Dockerfile's Rust image.
rust-version = "1.90"
publish = false

[dependencies]
# Infinity's runtime and RAP crates (hydro-project/infinity), Apache-2.0.
infinity-agent-core = "0.2"
infinity-provider-protocol = "0.2"
infinity-rap-bridge = "0.2"
rap-client = "0.2"
rap-protocol = "0.2"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
