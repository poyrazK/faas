[package]
name = "handler"
version = "0.1.0"
edition = "2024"
# Matches the Dockerfile's Rust image; edition 2024's resolver keeps
# Cargo.lock on dependency versions that build with it.
rust-version = "1.90"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
