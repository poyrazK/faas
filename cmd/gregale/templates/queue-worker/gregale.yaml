function:
  runtime: node22
  handler: handler.handler

# Push delivery invokes this HTTP function handler. Change the queue name or
# retry values here when the consumer contract changes.
queue_bindings:
  - name: default
    queue_name: default
    mode: push
    workload_class: http
    max_concurrency: 1
    retry_policy:
      max_attempts: 3
      base_seconds: 1
      max_seconds: 30
      jitter_seconds: 0.25
