name: Data API client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Restore and verify the pinned CLI and SDK
        run: node tools/artifacts.mjs restore --cli
      - run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck --prefix client
      - run: npm test --prefix client
      - name: Replay local CRUD, RLS and RPC scenarios
        run: ./.gregale-tools/gregale data-api dev --port 0 --once --replay data-api.requests.json
