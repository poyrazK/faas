# Running claims, durable cleanup, recovery outcomes, and honest unknown states.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: successful idle observations are zero and successful idle recovery is live
  interval: 1m
  input_series:
  - series: up{job="apid",instance="a"}
    values: 1x120
  - series: apid_build_recovery_collection_success{job="apid",instance="a"}
    values: 1x120
  - series: apid_build_recovery_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x120
  - series: faas_build_running_count{job="apid",instance="a"}
    values: '0x120'
  - series: faas_build_running_oldest_started_timestamp_seconds{job="apid",instance="a"}
    values: '0x120'
  - series: faas_build_vm_cleanup_pending{job="apid",instance="a"}
    values: '0x120'
  - series: faas_build_vm_cleanup_oldest_created_timestamp_seconds{job="apid",instance="a"}
    values: '0x120'
  - series: faas_build_vm_cleanup_retry_pending{job="apid",instance="a"}
    values: '0x120'
  - series: up{job="builderd",instance="b"}
    values: 1x120
  - series: builderd_build_reaper_started_timestamp_seconds{job="builderd",instance="b"}
    values: 60x120
  - series: builderd_build_reaper_interval_seconds{job="builderd",instance="b"}
    values: 60x120
  - series: builderd_build_reaper_threshold_seconds{job="builderd",instance="b"}
    values: 600x120
  - series: builderd_build_reaper_cleanup_budget_seconds{job="builderd",instance="b"}
    values: 120x120
  - series: builderd_build_reaper_last_attempt_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_completed_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_success_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_pass_success{job="builderd",instance="b"}
    values: 1x120
  alert_rule_test:
  - eval_time: 25m
    alertname: FaasBuildRunningOverdue
    exp_alerts: []
  - eval_time: 25m
    alertname: FaasBuildVMCleanupOverdue
    exp_alerts: []
  - eval_time: 25m
    alertname: FaasBuilderReaperFailing
    exp_alerts: []
  - eval_time: 25m
    alertname: FaasBuilderReaperStalled
    exp_alerts: []
  - eval_time: 25m
    alertname: FaasBuildRecoveryTelemetryUnavailable
    exp_alerts: []
  - eval_time: 25m
    alertname: FaasBuilderReaperTelemetryUnavailable
    exp_alerts: []
  promql_expr_test:
  - expr: faas_build_running_oldest_age_seconds
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_build_running_oldest_age_seconds",job="apid",instance="a"}'
      value: 0
  - expr: faas_build_vm_cleanup_oldest_age_seconds
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_build_vm_cleanup_oldest_age_seconds",job="apid",instance="a"}'
      value: 0
- name: one claimed build is visible after leaving the queue and warns after exact allowance and hold
  interval: 1m
  input_series:
  - series: up{job="apid",instance="a"}
    values: 1x120
  - series: apid_build_recovery_collection_success{job="apid",instance="a"}
    values: 1x120
  - series: apid_build_recovery_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x120
  - series: faas_build_running_count{job="apid",instance="a"}
    values: 1x120
  - series: faas_build_running_oldest_started_timestamp_seconds{job="apid",instance="a"}
    values: 60x120
  - series: faas_build_vm_cleanup_pending{job="apid",instance="a"}
    values: '0x120'
  - series: faas_build_vm_cleanup_oldest_created_timestamp_seconds{job="apid",instance="a"}
    values: '0x120'
  - series: faas_build_vm_cleanup_retry_pending{job="apid",instance="a"}
    values: '0x120'
  - series: up{job="builderd",instance="b"}
    values: 1x120
  - series: builderd_build_reaper_started_timestamp_seconds{job="builderd",instance="b"}
    values: 60x120
  - series: builderd_build_reaper_interval_seconds{job="builderd",instance="b"}
    values: 60x120
  - series: builderd_build_reaper_threshold_seconds{job="builderd",instance="b"}
    values: 600x120
  - series: builderd_build_reaper_cleanup_budget_seconds{job="builderd",instance="b"}
    values: 120x120
  - series: builderd_build_reaper_last_attempt_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_completed_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_success_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_pass_success{job="builderd",instance="b"}
    values: 1x120
  alert_rule_test:
  - eval_time: 13m
    alertname: FaasBuildRunningOverdue
    exp_alerts: []
  - eval_time: 18m
    alertname: FaasBuildRunningOverdue
    exp_alerts: []
  - eval_time: 19m
    alertname: FaasBuildRunningOverdue
    exp_alerts:
    - exp_labels:
        severity: warn
        component: builderd
        family: build_recovery
        public_status: internal
        job: apid
        instance: a
      exp_annotations: &id003
        summary: A running build is overdue for recovery
        description: A running claim has exceeded the largest configured recovery threshold plus two sweep intervals
          for 5m. Inspect reaper progress and cleanup workload; this is overdue customer work, not proof that its
          VM is still running.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
  promql_expr_test:
  - expr: faas_build_running_oldest_age_seconds
    eval_time: 13m
    exp_samples:
    - labels: '{__name__="faas_build_running_oldest_age_seconds",job="apid",instance="a"}'
      value: 720
- name: cleanup age includes retrying and claimed obligations
