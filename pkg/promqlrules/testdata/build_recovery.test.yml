  - series: builderd_build_reaper_last_success_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x120
  - series: builderd_build_reaper_last_pass_success{job="builderd",instance="b"}
    values: 1x120
  alert_rule_test:
  - eval_time: 3m
    alertname: FaasBuildVMCleanupOverdue
    exp_alerts: []
  - eval_time: 8m
    alertname: FaasBuildVMCleanupOverdue
    exp_alerts: []
  - eval_time: 9m
    alertname: FaasBuildVMCleanupOverdue
    exp_alerts:
    - exp_labels:
        severity: warn
        component: builderd
        family: build_recovery
        public_status: internal
        job: apid
        instance: a
      exp_annotations:
        summary: Builder VM cleanup is overdue
        description: A durable cleanup obligation has remained outstanding beyond two configured sweep intervals
          for 5m. Age survives retries and live claims. Inspect cancel and result-record errors and batch throughput
          before intervening.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
  promql_expr_test:
  - expr: faas_build_vm_cleanup_oldest_age_seconds
    eval_time: 3m
    exp_samples:
    - labels: '{__name__="faas_build_vm_cleanup_oldest_age_seconds",job="apid",instance="a"}'
      value: 120
- name: whole pass failure is separate from stalled success including no first success
