        severity: warn
        component: builderd
        family: build_recovery
        public_status: internal
        job: builderd
        instance: b
      exp_annotations: &id001
        summary: Builder recovery has stopped succeeding
        description: No whole recovery pass has succeeded within two configured intervals plus the full serial cleanup
          call budget, for 5m. This also detects a loop that never starts on an otherwise idle builder. Capture
          logs and goroutine evidence before restarting.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildRecovery.md
