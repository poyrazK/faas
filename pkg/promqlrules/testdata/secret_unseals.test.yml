# ADR 20261024014500: unseal telemetry. The surge alert compares against a
# day, so these fixtures carry a day of samples. Evaluating the whole rule
# file every 15 minutes over 5-minute samples keeps that affordable.
rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 15m

tests:
  - name: a daemon opening sixty times its daily rate warns
    interval: 5m
    input_series:
      # A day at 10 opens a minute, then 600 a minute.
      - series: faas_secret_unseal_total{job="vmmd",instance="node-1:9093",identity="runtime",result="ok"}
        values: 0+50x288 14400+3000x12
    alert_rule_test:
      - eval_time: 1440m
        alertname: FaasSecretUnsealSurge
        exp_alerts: []
      - eval_time: 1485m
        alertname: FaasSecretUnsealSurge
        exp_alerts:
          - exp_labels:
              severity: warn
              family: secret_unseals
              job: vmmd
              instance: node-1:9093
            exp_annotations:
              summary: "vmmd on node-1:9093 is opening sealed values at over ten times its daily rate"
              description: "For the last 10 minutes this daemon has decrypted sealed values at over ten times its 24-hour average, and more than one per second. A traffic surge does this too; if its request or wake rate has not risen to match, treat it as a daemon being used to read the secret store."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSecretUnseal.md"

  - name: a quiet daemon's small burst stays under the floor
    interval: 5m
    input_series:
      # Near zero for a day, then 30 a minute (0.5/s): over ten times the
      # baseline but under one per second.
      - series: faas_secret_unseal_total{job="githubd",instance="cp-1:9095",identity="fleet",result="ok"}
        values: 0x288 0+150x12
    alert_rule_test:
      - eval_time: 1485m
        alertname: FaasSecretUnsealSurge
        exp_alerts: []

  - name: a steady daemon does not warn
    interval: 5m
    input_series:
      - series: faas_secret_unseal_total{job="vmmd",instance="node-1:9093",identity="runtime",result="ok"}
        values: 0+3000x300
    alert_rule_test:
      - eval_time: 1485m
        alertname: FaasSecretUnsealSurge
        exp_alerts: []

  - name: repeated failed opens warn
    interval: 1m
    input_series:
      - series: faas_secret_unseal_total{job="imaged",instance="node-2:9094",identity="none",result="failed"}
        values: 0+5x60
      - series: faas_secret_unseal_total{job="vmmd",instance="node-2:9093",identity="none",result="failed"}
        values: 0+1x60
    alert_rule_test:
      - eval_time: 30m
        alertname: FaasSecretUnsealFailures
        exp_alerts:
          - exp_labels:
              severity: warn
              family: secret_unseals
              job: imaged
              instance: node-2:9094
            exp_annotations:
              summary: "imaged on node-2:9094 failed to open over 20 sealed values in 15 minutes"
              description: "This daemon was handed sealed values that none of its keys open. Usually a key is missing after a seal-domain change; it can also be someone trying envelopes from another domain through this daemon."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSecretUnseal.md"
