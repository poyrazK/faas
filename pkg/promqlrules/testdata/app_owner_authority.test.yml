# ADR-20261110210000: only control-plane authority may change an app's owner.
rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 1m

tests:
  - name: no unauthorized writes leaves the owner authority page quiet
    interval: 1m
    input_series:
      - series: faas_app_owner_unauthorized_writes{job="schedd",instance="cp-1"}
        values: 0x3
      - series: faas_app_owner_unauthorized_writes{job="schedd",instance="cp-2"}
        values: 0x3
    alert_rule_test:
      - eval_time: 2m
        alertname: FaasAppOwnerUnauthorizedWrite
        exp_alerts: []

  - name: a positive observation pages despite another node reporting zero and clears when the count returns to zero
    interval: 1m
    input_series:
      - series: faas_app_owner_unauthorized_writes{job="schedd",instance="cp-1"}
        values: 0x3
      - series: faas_app_owner_unauthorized_writes{job="schedd",instance="cp-2"}
        values: 0 2 0 0
    alert_rule_test:
      - eval_time: 1m
        alertname: FaasAppOwnerUnauthorizedWrite
        exp_alerts:
          - exp_labels:
              severity: page
              family: app_owner_authority
            exp_annotations:
              summary: "A login outside the control plane changed an app's owner node"
              description: "2 owner change(s) to apps.node_id in the last 15 minutes came from a database login that is not in faas_owner_authority. Before control-plane owner authority is on everywhere this lists the paths still to move; after it, a compute node choosing which apps it runs is a compromise signal. `select * from app_owner_writes where not authorized order by id desc limit 50` names the login and the nodes."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAppOwnerUnauthorizedWrite.md"
      - eval_time: 2m
        alertname: FaasAppOwnerUnauthorizedWrite
        exp_alerts: []

  - name: absent owner write metrics do not invent a violation
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 2m
        alertname: FaasAppOwnerUnauthorizedWrite
        exp_alerts: []
