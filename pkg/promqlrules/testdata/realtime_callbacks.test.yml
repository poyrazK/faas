# Synthetic coverage for managed realtime callback alerts (ADR-286 and ADR-288).

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: "repeated replay supervisor restarts fire"
    input_series:
      - series: 'realtimed_callback_replay_supervisor_restarts_total{job="realtimed",instance="compute-a:9107"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasRealtimeCallbackReplayRestarting
        exp_alerts:
          - exp_labels:
              job: realtimed
              instance: compute-a:9107
              severity: warn
              component: realtimed
              family: realtime_callbacks
            exp_annotations:
              summary: "Realtime callback replay keeps restarting"
              description: "The node restarted its callback replay loop at least three times in the last 15 minutes. Inspect realtimed logs and local outbox storage health."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

  - interval: 30s
    name: "isolated replay recovery stays quiet"
    input_series:
      - series: 'realtimed_callback_replay_supervisor_restarts_total{job="realtimed",instance="compute-a:9107"}'
        values: '0+1x2 2x29'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasRealtimeCallbackReplayRestarting

  - interval: 30s
    name: "old pending callbacks with no replay progress fire"
    input_series:
      - series: 'realtimed_callback_pending{job="realtimed",instance="compute-a:9107"}'
        values: '1x31'
      - series: 'realtimed_callback_oldest_pending_age_seconds{job="realtimed",instance="compute-a:9107"}'
        values: '600x31'
      - series: 'realtimed_callback_replay_deliveries_total{job="realtimed",instance="compute-a:9107"}'
        values: '0x31'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasRealtimeCallbackReplayStalled
        exp_alerts:
          - exp_labels:
              job: realtimed
              instance: compute-a:9107
              severity: warn
              component: realtimed
              family: realtime_callbacks
            exp_annotations:
              summary: "Realtime callback replay has stalled"
              description: "The node has pending callbacks older than five minutes but no successful replay deliveries in the last five minutes. Check realtimed logs, callback receiver failures, and outbox disk health."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRealtimeCallbacks.md"

  - interval: 30s
    name: "successful replay progress keeps the alert quiet"
    input_series:
      - series: 'realtimed_callback_pending{job="realtimed",instance="compute-a:9107"}'
        values: '1x31'
      - series: 'realtimed_callback_oldest_pending_age_seconds{job="realtimed",instance="compute-a:9107"}'
        values: '600x31'
      - series: 'realtimed_callback_replay_deliveries_total{job="realtimed",instance="compute-a:9107"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasRealtimeCallbackReplayStalled

  - interval: 30s
    name: "empty outbox keeps the alert quiet"
    input_series:
      - series: 'realtimed_callback_pending{job="realtimed",instance="compute-a:9107"}'
        values: '0x31'
      - series: 'realtimed_callback_oldest_pending_age_seconds{job="realtimed",instance="compute-a:9107"}'
        values: '0x31'
      - series: 'realtimed_callback_replay_deliveries_total{job="realtimed",instance="compute-a:9107"}'
        values: '0x31'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasRealtimeCallbackReplayStalled
