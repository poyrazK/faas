# adr: 733 — crash capture encryption and fork restore alerts fire on the
# threshold and stay quiet on the healthy side.
rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - name: a missing host key pages; a present one does not
    interval: 30s
    input_series:
      - series: 'imaged_crash_capture_encryption_key_missing{instance="cp"}'
        values: '1x30'
      - series: 'imaged_crash_capture_unencrypted_oldest_age_seconds{instance="cp"}'
        values: '0+30x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: FaasCrashCaptureEncryptionKeyMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: FaasCrashCaptureEncryptionKeyMissing
        exp_alerts:
          - exp_labels:
              severity: page
              component: imaged
              family: crash_snapshots
              public_status: internal
            exp_annotations:
              summary: "Crash captures are not being encrypted: imaged has no host age identity"
              description: "imaged has crash captures waiting for encryption and no host age identity (FAAS_HOST_AGE_IDENTITY_PATH). Their plaintext stays on disk until the key is restored."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCrashSnapshots.md"
      - eval_time: 10m
        alertname: FaasCrashCaptureUnencrypted
        exp_alerts:
          - exp_labels:
              severity: warn
              component: imaged
              family: crash_snapshots
              public_status: internal
            exp_annotations:
              summary: "A crash capture has been unencrypted for more than 2 minutes"
              description: "ADR-733 encrypts a ready crash capture within one 5 s imaged pass. The oldest unencrypted capture is over 2 minutes old; check imaged_crash_capture_ops_total{op=\"encrypt\",result=\"error\"} and imaged logs."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCrashSnapshots.md"

  - name: captures encrypted within a pass stay quiet
    interval: 30s
    input_series:
      - series: 'imaged_crash_capture_encryption_key_missing{instance="cp"}'
        values: '0x30'
      - series: 'imaged_crash_capture_unencrypted_oldest_age_seconds{instance="cp"}'
        values: '0 4 0 3 0 5 0x24'
      - series: 'imaged_crash_capture_ops_total{instance="cp",op="purge",result="error"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: FaasCrashCaptureEncryptionKeyMissing
        exp_alerts: []
      - eval_time: 14m
        alertname: FaasCrashCaptureUnencrypted
        exp_alerts: []
      - eval_time: 14m
        alertname: FaasCrashCaptureFileOpErrors
        exp_alerts: []

  - name: repeated purge errors warn
    interval: 1m
    input_series:
      - series: 'imaged_crash_capture_ops_total{instance="cp",op="purge",result="error"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasCrashCaptureFileOpErrors
        exp_alerts:
          - exp_labels:
              op: purge
              severity: warn
              component: imaged
              family: crash_snapshots
              public_status: internal
            exp_annotations:
              summary: "Crash capture purge is failing"
              description: "imaged failed to purge crash capture files at least three times in 30m. A failing purge leaves plaintext on disk; a failing expire keeps captures past their retention."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCrashSnapshots.md"

  - name: mostly failing captures warn; refusals on remote storage do not
    interval: 1m
    input_series:
      - series: 'schedd_crash_captures_total{trigger="http_5xx",result="capture_failed"}'
        values: '0+1x60'
      - series: 'schedd_crash_captures_total{trigger="http_5xx",result="ready"}'
        values: '0+0x60'
      - series: 'schedd_crash_captures_total{trigger="manual",result="storage_unsupported"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FaasCrashCaptureFailures
        exp_alerts:
          - exp_labels:
              trigger: http_5xx
              severity: warn
              component: schedd
              family: crash_snapshots
              public_status: internal
            exp_annotations:
              summary: "Crash captures (http_5xx) are failing"
              description: "At least three crash captures failed or timed out in 1h, more than half of all attempts. A failed capture destroys the instance it paused; check schedd and vmmd logs for the snapshot error."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCrashSnapshots.md"

  - name: occasional capture failures among successes stay quiet
    interval: 1m
    input_series:
      - series: 'schedd_crash_captures_total{trigger="http_5xx",result="capture_failed"}'
        values: '0+1x60'
      - series: 'schedd_crash_captures_total{trigger="http_5xx",result="ready"}'
        values: '0+3x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FaasCrashCaptureFailures
        exp_alerts: []

  - name: mostly failing fork restores warn
    interval: 1m
    input_series:
      - series: 'schedd_fork_restores_total{source="crash_capture",result="restore_failed"}'
        values: '0+1x60'
      - series: 'schedd_fork_restores_total{source="deployment",result="no_capture"}'
        values: '0+9x60'
      - series: 'schedd_fork_restores_total{source="crash_capture",result="running"}'
        values: '0+0x60'
      - series: 'schedd_fork_restores_total{source="deployment",result="running"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FaasForkRestoreFailures
        exp_alerts:
          - exp_labels:
              source: crash_capture
              severity: warn
              component: schedd
              family: crash_snapshots
              public_status: internal
            exp_annotations:
              summary: "Fork restores from crash_capture are failing"
              description: "At least three fork restores failed with restore_failed in 1h, more than half of all attempts. Customer-side refusals (no_capture, no_capacity, account_inactive, deployment_unavailable) are excluded."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCrashSnapshots.md"
