# Independent serving probe intent remains visible when compute results vanish.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: a never-installed probe warns from independent inventory
  interval: 1m
  input_series:
  - series: faas_serving_probe_inventory_configured{job="node",instance="cp:9100"}
    values: 1x40
  - series: faas_serving_probe_expected_pairs{job="node",instance="cp:9100"}
    values: 1x40
  - series: faas_serving_probe_expected{job="node",instance="cp:9100",probe_node="fsn-2",url="https://probe.example/"}
    values: 1x40
  - series: faas_serving_probe_expected_first_byte_seconds{job="node",instance="cp:9100",probe_node="fsn-2"}
    values: 2x40
  - series: faas_serving_probe_expected_max_age_seconds{job="node",instance="cp:9100",probe_node="fsn-2"}
    values: 900x40
  alert_rule_test:
  - eval_time: 9m
    alertname: FaasServingProbeCoverageDegraded
    exp_alerts: []
  - eval_time: 30m
    alertname: FaasServingProbeCoverageDegraded
    exp_alerts:
    - exp_labels:
        severity: warn
        component: node
        family: serving_probe_coverage
        public_status: internal
        probe_node: fsn-2
        url: https://probe.example/
      exp_annotations:
        summary: Serving probe coverage is degraded on fsn-2
        description: 'The expected probe for https://probe.example/ has coverage state 1: 1 missing result, 2 stale result, 3 invalid telemetry, 4 content validation disabled, 5 latency budget mismatch, 6 failing validation. Compare the shared fleet policy with this node''s service, textfile and journal.'
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServingProbe.md
- name: missing independent inventory warns instead of showing healthy zero coverage
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 9m
    alertname: FaasServingProbeInventoryUnavailable
    exp_alerts: []
  - eval_time: 30m
    alertname: FaasServingProbeInventoryUnavailable
    exp_alerts:
    - exp_labels:
        severity: warn
        component: node
        family: serving_probe_coverage
        public_status: internal
      exp_annotations:
        summary: Serving probe deployment inventory is unavailable
        description: The independent control-plane inventory is missing, stale, ambiguous or inconsistent. Probe coverage cannot be assessed. Check node_exporter and converge the shared serving-probe fleet inventory before relying on coverage panels.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServingProbe.md
