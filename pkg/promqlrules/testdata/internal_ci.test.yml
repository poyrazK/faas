  - series: apid_ci_queue_items{job="apid",instance="a",queue="executions",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="metadata_admission",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="automation_admission",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="metadata_checks",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="execution_checks",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="check_retries",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="retirement",condition="stale_leases"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="metadata_checks",condition="dead"}
    values: 2x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="execution_checks",condition="dead"}
    values: 2x44
  - series: apid_ci_resource_used{job="apid",instance="a",resource="storage_objects"}
    values: 99x44
  - series: apid_ci_resource_limit{job="apid",instance="a",resource="storage_objects"}
    values: 100x44
  - series: apid_ci_worker_replicas{job="apid",instance="a",worker="dispatcher",condition="stale"}
    values: 8x44
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasCIHealthUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIWorkerUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCILeaseRecoveryStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCICheckDeliveryDead
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIQuotaPressure
    exp_alerts: []
  promql_expr_test:
  - expr: faas_ci:queue_items:by_queue_condition{queue="execution_checks",condition="dead"}
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_ci:queue_items:by_queue_condition", queue="execution_checks", condition="dead"}'
      value: 2
- name: missing and failed health reads raise one internal warning per daemon
  interval: 30s
  input_series:
  - series: up{job="apid",instance="a"}
    values: 1x44
  - series: apid_ci_health_enabled{job="apid",instance="a"}
    values: 1x44
  - series: up{job="githubd",instance="a"}
    values: 1x44
  - series: githubd_ci_health_enabled{job="githubd",instance="a"}
    values: 1x44
  - series: githubd_ci_health_up{job="githubd",instance="a"}
    values: '0x44'
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="dispatcher"}
    values: 1x44
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="metadata_admission"}
    values: 1x44
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="automation_admission"}
    values: 1x44
  - series: githubd_ci_worker_enabled{job="githubd",instance="a",worker="metadata_checks"}
    values: 1x44
  - series: githubd_ci_worker_enabled{job="githubd",instance="a",worker="execution_checks"}
    values: 1x44
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="retention"}
    values: 1x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="execution_checks",condition="dead"}
    values: 9x44
  - series: apid_ci_resource_used{job="apid",instance="a",resource="storage_objects"}
    values: 100x44
  - series: apid_ci_resource_limit{job="apid",instance="a",resource="storage_objects"}
    values: 100x44
  - series: apid_ci_worker_replicas{job="apid",instance="a",worker="dispatcher",condition="healthy"}
    values: 1x44
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasCIWorkerUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCILeaseRecoveryStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCICheckDeliveryDead
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIQuotaPressure
    exp_alerts: []
  - eval_time: 4m30s
    alertname: FaasCIHealthUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: FaasCIHealthUnavailable
    exp_alerts:
    - exp_labels:
        severity: warn
        component: platform
        family: internal_ci
        public_status: internal
        daemon: apid
      exp_annotations: &id001
        summary: Internal CI health cannot be read
        description: An observed daemon is configured for CI monitoring but has no successful durable health read. Inspect database access and CI migrations; unavailable evidence must not be interpreted as an empty queue.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasInternalCIOperations.md
    - exp_labels:
        severity: warn
        component: platform
        family: internal_ci
        public_status: internal
        daemon: githubd
      exp_annotations: *id001
  promql_expr_test:
  - expr: faas_ci:queue_items:by_queue_condition
    eval_time: 20m
    exp_samples: []
  - expr: faas_ci:resource_utilization:by_resource
    eval_time: 20m
    exp_samples: []
  - expr: faas_ci:worker_available:by_worker
    eval_time: 20m
    exp_samples: []
  - expr: faas_ci:worker_status:by_worker{worker="dispatcher"}
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="dispatcher"}'
      value: 7
