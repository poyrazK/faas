# ADR-1575: synthetic operational evidence; no native/provider calls.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 30s
tests:
- name: missing collection is unknown and never healthy zero evidence
  interval: 30s
  input_series: []
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasCIHealthUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIWorkerUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCILeaseRecoveryStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCICheckDeliveryDead
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIQuotaPressure
    exp_alerts: []
  promql_expr_test:
  - expr: faas_ci:observation_status:by_daemon
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_ci:observation_status:by_daemon", daemon="apid"}'
      value: 3
    - labels: '{__name__="faas_ci:observation_status:by_daemon", daemon="githubd"}'
      value: 3
  - expr: faas_ci:worker_status:by_worker
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="automation_admission"}'
      value: 7
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="dispatcher"}'
      value: 7
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="execution_checks"}'
      value: 7
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="metadata_admission"}'
      value: 7
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="metadata_checks"}'
      value: 7
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="retention"}'
      value: 7
  - expr: faas_ci:queue_items:by_queue_condition
    eval_time: 20m
    exp_samples: []
  - expr: faas_ci:resource_headroom:by_resource
    eval_time: 20m
    exp_samples: []
- name: all shipped flags off ignores leftover data without alerts
  interval: 30s
  input_series:
  - series: up{job="apid",instance="a"}
    values: 1x44
  - series: apid_ci_health_enabled{job="apid",instance="a"}
    values: '0x44'
  - series: apid_ci_health_up{job="apid",instance="a"}
    values: 1x44
  - series: up{job="githubd",instance="a"}
    values: 1x44
  - series: githubd_ci_health_enabled{job="githubd",instance="a"}
    values: '0x44'
  - series: githubd_ci_health_up{job="githubd",instance="a"}
    values: 1x44
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="dispatcher"}
    values: '0x44'
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="metadata_admission"}
    values: '0x44'
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="automation_admission"}
    values: '0x44'
  - series: githubd_ci_worker_enabled{job="githubd",instance="a",worker="metadata_checks"}
    values: '0x44'
  - series: githubd_ci_worker_enabled{job="githubd",instance="a",worker="execution_checks"}
    values: '0x44'
  - series: apid_ci_worker_enabled{job="apid",instance="a",worker="retention"}
    values: '0x44'
  - series: apid_ci_queue_items{job="apid",instance="a",queue="executions",condition="stale_leases"}
    values: 9x44
  - series: apid_ci_queue_items{job="apid",instance="a",queue="execution_checks",condition="dead"}
    values: 9x44
  - series: apid_ci_resource_used{job="apid",instance="a",resource="storage_objects"}
    values: 100x44
  - series: apid_ci_resource_limit{job="apid",instance="a",resource="storage_objects"}
    values: 100x44
  - series: apid_ci_worker_replicas{job="apid",instance="a",worker="dispatcher",condition="stale"}
    values: 8x44
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasCIHealthUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIWorkerUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCILeaseRecoveryStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCICheckDeliveryDead
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasCIQuotaPressure
    exp_alerts: []
  promql_expr_test:
  - expr: faas_ci:observation_status:by_daemon
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_ci:observation_status:by_daemon", daemon="apid"}'
      value: 0
    - labels: '{__name__="faas_ci:observation_status:by_daemon", daemon="githubd"}'
      value: 0
  - expr: faas_ci:worker_status:by_worker
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="automation_admission"}'
      value: 0
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="dispatcher"}'
      value: 0
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="execution_checks"}'
      value: 0
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="metadata_admission"}'
      value: 0
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="metadata_checks"}'
      value: 0
    - labels: '{__name__="faas_ci:worker_status:by_worker", worker="retention"}'
      value: 0
  - expr: faas_ci:queue_items:by_queue_condition
    eval_time: 20m
    exp_samples: []
- name: intentional worker pause keeps retained backlog visible and quiet
