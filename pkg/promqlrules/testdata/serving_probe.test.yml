# Serving probe (ADR-20261023124955 §5). faas-serving-probe writes its
# results to the node_exporter textfile collector on each compute node; the
# node's own webhook is the alert path that survives a control-plane outage,
# and these alerts mirror it into Alertmanager while the control plane is up.

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: "a probe failing for 10m warns; a recovered one clears"
    input_series:
      - series: 'faas_serving_probe_success{job="node-compute",instance="fsn-2",url="https://probe.example/"}'
        values: '1x5 0x20 1x10'
      - series: 'faas_serving_probe_last_run_timestamp_seconds{job="node-compute",instance="fsn-2"}'
        values: '0+60x35'
    alert_rule_test:
      - eval_time: 12m
        alertname: FaasServingProbeFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: FaasServingProbeFailing
        exp_alerts:
          - exp_labels:
              severity: warn
              component: gatewayd-public
              family: serving_probe
              public_status: internal
              job: node-compute
              instance: fsn-2
              url: https://probe.example/
            exp_annotations:
              summary: "The serving probe on fsn-2 cannot reach https://probe.example/"
              description: "Two attempts 30 s apart have missed a 2xx on every run for 10 minutes; faas_serving_probe_http_status shows the last status (0 means nothing answered). The node's webhook has already posted. If every compute node reports it, look at the edge or the probe app; if only one does, look at that node's network."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServingProbe.md"
      - eval_time: 30m
        alertname: FaasServingProbeFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: FaasServingProbeStale
        exp_alerts: []

  - interval: 1m
    name: "a probe that stops running warns"
    input_series:
      - series: 'faas_serving_probe_last_run_timestamp_seconds{job="node-compute",instance="fsn-3"}'
        values: '0+300x2 600x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasServingProbeStale
        exp_alerts: []
      - eval_time: 32m
        alertname: FaasServingProbeStale
        exp_alerts:
          - exp_labels:
              severity: warn
              component: node
              family: serving_probe
              public_status: internal
              job: node-compute
              instance: fsn-3
            exp_annotations:
              summary: "The serving probe on fsn-3 has not run for 15 minutes"
              description: "faas-serving-probe.timer has not completed a run on fsn-3 for over 15 minutes, so an outage seen from that node would not be reported. Check systemctl status faas-serving-probe.timer and journalctl -u faas-serving-probe."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServingProbe.md"
