# Durable phase progress: unknown history, active work, retries and truthful freshness.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: known empty phases are zero ages and healthy
  interval: 1m
  input_series:
  - &id001
    series: up{job="imaged",instance="a"}
    values: 1x100
  - &id002
    series: imaged_image_preparation_collection_success{job="imaged",instance="a"}
    values: 1x100
  - &id003
    series: imaged_image_preparation_collection_last_success_timestamp_seconds{job="imaged",instance="a"}
    values: 0+60x100
  - &id004
    series: imaged_image_preparation_observation_enabled{job="imaged",instance="a"}
    values: 1x100
  - &id012
    series: imaged_image_preparation_pending{job="imaged",instance="a",phase="preparing"}
    values: '0x100'
  - &id005
    series: imaged_image_preparation_phase_age_unknown{job="imaged",instance="a",phase="preparing"}
    values: '0x100'
  - &id013
    series: imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged",instance="a",phase="preparing"}
    values: '0x100'
  - &id006
    series: imaged_image_preparation_pending{job="imaged",instance="a",phase="layer_published"}
    values: '0x100'
  - &id007
    series: imaged_image_preparation_phase_age_unknown{job="imaged",instance="a",phase="layer_published"}
    values: '0x100'
  - &id008
    series: imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged",instance="a",phase="layer_published"}
    values: '0x100'
  - &id009
    series: imaged_image_preparation_pending{job="imaged",instance="a",phase="scan_complete"}
    values: '0x100'
  - &id010
    series: imaged_image_preparation_phase_age_unknown{job="imaged",instance="a",phase="scan_complete"}
    values: '0x100'
  - &id011
    series: imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged",instance="a",phase="scan_complete"}
    values: '0x100'
  alert_rule_test:
  - eval_time: 40m
    alertname: FaasImagePreparationTelemetryUnavailable
    exp_alerts: []
  - eval_time: 40m
    alertname: FaasImagePreparationPhaseProlonged
    exp_alerts: []
  - eval_time: 40m
    alertname: FaasImagePreparationPhaseAgeUnknown
    exp_alerts: []
  promql_expr_test:
  - expr: imaged_image_preparation_oldest_known_phase_age_seconds{phase="preparing"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="imaged_image_preparation_oldest_known_phase_age_seconds",job="imaged",instance="a",phase="preparing"}'
      value: 0
  - expr: imaged_image_preparation_oldest_known_phase_age_seconds{phase="layer_published"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="imaged_image_preparation_oldest_known_phase_age_seconds",job="imaged",instance="a",phase="layer_published"}'
      value: 0
  - expr: imaged_image_preparation_oldest_known_phase_age_seconds{phase="scan_complete"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="imaged_image_preparation_oldest_known_phase_age_seconds",job="imaged",instance="a",phase="scan_complete"}'
      value: 0
  - expr: imaged_image_preparation_observation_healthy
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="imaged_image_preparation_observation_healthy",job="imaged",instance="a"}'
      value: 1
- name: preparing exact threshold and five minute hold without arrivals
  interval: 1m
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - series: imaged_image_preparation_pending{job="imaged",instance="a",phase="preparing"}
    values: 1x100
  - *id005
  - series: imaged_image_preparation_oldest_phase_started_timestamp_seconds{job="imaged",instance="a",phase="preparing"}
    values: 60x100
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - *id011
  alert_rule_test:
  - eval_time: 31m
    alertname: FaasImagePreparationPhaseProlonged
    exp_alerts: []
  - eval_time: 32m
    alertname: FaasImagePreparationPhaseProlonged
    exp_alerts: []
  - eval_time: 36m
    alertname: FaasImagePreparationPhaseProlonged
    exp_alerts: []
  - eval_time: 37m
    alertname: FaasImagePreparationPhaseProlonged
    exp_alerts:
    - exp_labels:
        severity: warn
        component: imaged
        family: image_preparation
        public_status: internal
        job: imaged
        instance: a
        phase: preparing
      exp_annotations:
        summary: Image preparation has remained in one phase for an extended period
        description: The oldest known preparing checkpoint exceeded its phase-age threshold for five minutes. Thresholds
          are 30m for preparing and layer_published, and 10m for scan_complete. Age includes active execution and
          waiting to resume; retries do not renew it. This is a triage warning, not proof of a stalled daemon, a
          failed image or deployment readiness.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasImagePreparation.md
  - eval_time: 37m
    alertname: FaasImagePreparationTelemetryUnavailable
    exp_alerts: []
  - eval_time: 37m
    alertname: FaasImagePreparationPhaseAgeUnknown
    exp_alerts: []
  promql_expr_test:
  - expr: imaged_image_preparation_oldest_known_phase_age_seconds{phase="preparing"}
    eval_time: 31m
    exp_samples:
    - labels: '{__name__="imaged_image_preparation_oldest_known_phase_age_seconds",job="imaged",instance="a",phase="preparing"}'
      value: 1800
  - expr: imaged_image_preparation_oldest_known_phase_age_seconds{phase="preparing"}
    eval_time: 37m
    exp_samples:
    - labels: '{__name__="imaged_image_preparation_oldest_known_phase_age_seconds",job="imaged",instance="a",phase="preparing"}'
      value: 2160
