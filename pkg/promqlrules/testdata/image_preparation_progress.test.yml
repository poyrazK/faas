    - exp_labels:
        severity: warn
        component: imaged
        family: image_preparation_telemetry
        public_status: internal
        job: imaged
        instance: a
      exp_annotations:
        summary: Durable image-preparation diagnostics are unavailable
        description: Imaged is scraped but its phase snapshot is failed, missing, inconsistent or older than two
          minutes. Counts and ages are unknown. Inspect the reader, database, clocks and deployed binary. Historical
