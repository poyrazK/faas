    alertname: FaasCommandCronDecisionOverdue
    exp_alerts:
    - exp_labels:
        severity: warn
        component: schedd
        family: command_cron
        public_status: internal
        job: schedd
        instance: a
        class: due
      exp_annotations:
        summary: A command schedule has unconsumed due history
        description: A due command schedule has a first unconsumed nominal boundary older than five minutes, sustained
