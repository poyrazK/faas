    eval_time: 20m
    exp_samples: []
- name: sustained slow response construction
  interval: 30s
  input_series:
  - series: vmmd_mcp_protocol_execution_seconds_bucket{app_id="00000000-0000-4000-8000-000000000001",le="1"}
    values: 0+0x50
  - series: vmmd_mcp_protocol_execution_seconds_bucket{app_id="00000000-0000-4000-8000-000000000001",le="10"}
    values: 0+10x50
  - series: vmmd_mcp_protocol_execution_seconds_bucket{app_id="00000000-0000-4000-8000-000000000001",le="+Inf"}
    values: 0+10x50
  - series: vmmd_mcp_protocol_execution_seconds_count{app_id="00000000-0000-4000-8000-000000000001"}
    values: 0+10x50
  promql_expr_test:
  - expr: min_over_time((((1000 * histogram_quantile(0.95,sum by (le) (increase(vmmd_mcp_protocol_execution_seconds_bucket{app_id="00000000-0000-4000-8000-000000000001"}[5m])))) > bool 5000) and on() ((sum(increase(vmmd_mcp_protocol_execution_seconds_count{app_id="00000000-0000-4000-8000-000000000001"}[5m]))) >= 20))[10m:30s]) == 1 and on() (count_over_time((((1000 * histogram_quantile(0.95,sum by (le) (increase(vmmd_mcp_protocol_execution_seconds_bucket{app_id="00000000-0000-4000-8000-000000000001"}[5m])))) > bool 5000) and on() ((sum(increase(vmmd_mcp_protocol_execution_seconds_count{app_id="00000000-0000-4000-8000-000000000001"}[5m]))) >= 20))[10m:30s]) >= 20 + (time() % 30 == bool 0))
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
