    - exp_labels:
        probe_node: fsn-2
        channel: webhook
        severity: warn
        component: node
        family: serving_probe_notifications
        public_status: internal
      exp_annotations:
        summary: Serving probe webhook telemetry is degraded on fsn-2
        description: 'An expected node has a fresh, unique probe source, but its webhook notification telemetry has remained unusable for five minutes. Evidence code
          2: 2 missing required fields, 3 invalid or inconsistent fields. Valid channels with no submission history and explicitly disabled channels do not trigger
          this warning. Inspect the node lookup and metrics writer; this is lost evidence, not a confirmed submission failure or recovery.'
