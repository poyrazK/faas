# Durable scheduler handoff cohorts and truthful waiting evidence.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: known empty is not missing evidence
  interval: 1m
  input_series:
  - &id001
    series: up{job="schedd",instance="a"}
    values: 1x90
  - &id002
    series: schedd_snapshot_prime_collection_success{job="schedd",instance="a"}
    values: 1x90
  - &id003
    series: schedd_snapshot_prime_collection_last_success_timestamp_seconds{job="schedd",instance="a"}
    values: 0+60x90
  - &id004
    series: schedd_snapshot_prime_observation_enabled{job="schedd",instance="a"}
    values: 1x90
  - &id035
    series: schedd_snapshot_prime_pending{job="schedd",instance="a",class="waiting"}
    values: '0x90'
  - &id005
    series: schedd_snapshot_prime_age_unknown{job="schedd",instance="a",class="waiting"}
    values: '0x90'
  - &id036
    series: schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd",instance="a",class="waiting"}
    values: '0x90'
  - &id006
    series: schedd_snapshot_prime_pending{job="schedd",instance="a",class="release_blocked"}
    values: '0x90'
  - &id007
    series: schedd_snapshot_prime_age_unknown{job="schedd",instance="a",class="release_blocked"}
    values: '0x90'
  - &id008
    series: schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd",instance="a",class="release_blocked"}
    values: '0x90'
  - &id009
    series: schedd_snapshot_prime_pending{job="schedd",instance="a",class="active"}
    values: '0x90'
  - &id010
    series: schedd_snapshot_prime_age_unknown{job="schedd",instance="a",class="active"}
    values: '0x90'
  - &id011
    series: schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd",instance="a",class="active"}
    values: '0x90'
  - &id012
    series: schedd_snapshot_prime_pending{job="schedd",instance="a",class="publication_pending"}
    values: '0x90'
  - &id013
    series: schedd_snapshot_prime_age_unknown{job="schedd",instance="a",class="publication_pending"}
    values: '0x90'
  - &id014
    series: schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd",instance="a",class="publication_pending"}
    values: '0x90'
  - &id015
    series: schedd_snapshot_prime_pending{job="schedd",instance="a",class="snapshot_recorded"}
    values: '0x90'
  - &id016
    series: schedd_snapshot_prime_age_unknown{job="schedd",instance="a",class="snapshot_recorded"}
    values: '0x90'
  - &id017
    series: schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd",instance="a",class="snapshot_recorded"}
    values: '0x90'
  - &id018
    series: schedd_snapshot_prime_pending{job="schedd",instance="a",class="unknown"}
    values: '0x90'
  - &id019
    series: schedd_snapshot_prime_age_unknown{job="schedd",instance="a",class="unknown"}
    values: '0x90'
  - &id020
    series: schedd_snapshot_prime_oldest_attempt_timestamp_seconds{job="schedd",instance="a",class="unknown"}
    values: '0x90'
  - &id021
    series: schedd_snapshot_prime_recovery_queries_total{job="schedd",instance="a",outcome="success"}
    values: '0x90'
  - &id022
    series: schedd_snapshot_prime_recovery_queries_total{job="schedd",instance="a",outcome="error"}
    values: '0x90'
  - &id023
    series: schedd_snapshot_prime_recovery_queries_total{job="schedd",instance="a",outcome="canceled"}
    values: '0x90'
  - &id024
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="not_found"}
    values: '0x90'
  - &id025
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="ineligible"}
    values: '0x90'
  - &id026
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="release_blocked"}
    values: '0x90'
  - &id027
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="grace"}
    values: '0x90'
  - &id028
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="not_owned"}
    values: '0x90'
  - &id029
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="snapshot_recorded"}
    values: '0x90'
  - &id030
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="active"}
    values: '0x90'
  - &id031
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="publication_pending"}
    values: '0x90'
  - &id032
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="dispatch_requested"}
    values: '0x90'
  - &id033
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="error"}
    values: '0x90'
  - &id034
    series: schedd_snapshot_prime_recovery_candidates_total{job="schedd",instance="a",outcome="canceled"}
    values: '0x90'
  alert_rule_test:
  - eval_time: 40m
    alertname: FaasSnapshotPrimeTelemetryUnavailable
    exp_alerts: []
  - eval_time: 40m
    alertname: FaasSnapshotPrimeWaiting
    exp_alerts: []
  - eval_time: 40m
    alertname: FaasSnapshotPrimeEvidenceUnknown
    exp_alerts: []
  - eval_time: 40m
    alertname: FaasSnapshotPrimeRecoveryQueriesFailing
    exp_alerts: []
  promql_expr_test:
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="waiting"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="waiting"}'
      value: 0
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="release_blocked"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="release_blocked"}'
      value: 0
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="active"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="active"}'
      value: 0
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="publication_pending"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="publication_pending"}'
      value: 0
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="snapshot_recorded"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="snapshot_recorded"}'
      value: 0
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="unknown"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="unknown"}'
      value: 0
  - expr: schedd_snapshot_prime_observation_healthy
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_observation_healthy",job="schedd",instance="a"}'
      value: 1
- name: single waiting attempt exact threshold hold and aging without arrivals
  interval: 1m
  input_series:
  - *id001
