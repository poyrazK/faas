  alert_rule_test:
  - eval_time: 6m
    alertname: FaasSnapshotPrimeWaiting
    exp_alerts: []
  - eval_time: 7m
    alertname: FaasSnapshotPrimeWaiting
    exp_alerts: []
  - eval_time: 11m
    alertname: FaasSnapshotPrimeWaiting
    exp_alerts: []
  - eval_time: 12m
    alertname: FaasSnapshotPrimeWaiting
    exp_alerts:
    - exp_labels:
        severity: warn
        component: schedd
        family: snapshot_prime
        public_status: internal
        job: schedd
        instance: a
        class: waiting
      exp_annotations:
        summary: Snapshot preparation is eligible but has not advanced
        description: An attempt currently classified waiting has a known boundary older than five minutes, sustained
          for five minutes. The boundary is no earlier than stage start, release success, runtime invalidation and
          known instance activity. Release gates, active captures, fresh parked captures and recorded snapshots
          are separate. This does not prove continuous idle time, a stopped scheduler or readiness failure.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSnapshotPrime.md
  - eval_time: 30m
    alertname: FaasSnapshotPrimeTelemetryUnavailable
    exp_alerts: []
  - eval_time: 30m
    alertname: FaasSnapshotPrimeEvidenceUnknown
    exp_alerts: []
  promql_expr_test:
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="waiting"}
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="waiting"}'
      value: 300
  - expr: schedd_snapshot_prime_oldest_known_attempt_age_seconds{class="waiting"}
    eval_time: 30m
    exp_samples:
    - labels: '{__name__="schedd_snapshot_prime_oldest_known_attempt_age_seconds",job="schedd",instance="a",class="waiting"}'
      value: 1740
