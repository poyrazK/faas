# ADR-1505: an aborted usage commit must page while new responses are lost,
# then resolve when the counter stops increasing. Historical totals stay quiet.
rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - interval: 1m
    name: "new usage commit aborts page and resolve after the window"
    input_series:
      - series: 'gateway_usage_commit_aborts_total{job="gatewayd-internal",instance="fsn-2.gregale.dev:9092"}'
        values: '0+1x5 5x25'
    alert_rule_test:
      - eval_time: 2m
        alertname: FaasUsageCommitAborted
        exp_alerts:
          - exp_labels:
              job: "gatewayd-internal"
              instance: "fsn-2.gregale.dev:9092"
              severity: "page"
              component: "gatewayd-internal"
              family: "consumer_usage_delivery"
            exp_annotations:
              summary: "Monetized responses withheld: usage could not be made durable"
              description: "The gateway aborted billable responses because their usage events could not be fsynced to the local outbox (ADR-1505). Clients saw failed requests. Check outbox capacity and disk health; readiness should already be draining the node."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasConsumerUsageDelivery.md"
      - eval_time: 12m
        alertname: FaasUsageCommitAborted
        exp_alerts: []

  - interval: 1m
    name: "historical aborts without new lost responses stay quiet"
    input_series:
      - series: 'gateway_usage_commit_aborts_total{job="gatewayd-internal",instance="fsn-2.gregale.dev:9092"}'
        values: '7x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasUsageCommitAborted
        exp_alerts: []
