    exp_alerts: []
  - eval_time: 6m
    alertname: FaasBuilderNotificationDropsHigh
    exp_alerts:
    - exp_labels:
        severity: warn
        component: builderd
        family: build_notification_queue
        public_status: internal
        job: builderd
        instance: b
        queue: build
