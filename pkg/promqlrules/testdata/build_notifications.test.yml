# Bounded fast-path queues: waiting excludes active handlers; loss excludes coalescing.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: idle queues initialize all outcomes and report known zero age
  interval: 1m
  input_series:
  - series: up{job="builderd",instance="b"}
    values: 1x40
  - series: builderd_notification_queue_waiting{job="builderd",instance="b",queue="build"}
    values: '0x40'
  - series: builderd_notification_queue_active{job="builderd",instance="b",queue="build"}
    values: '0x40'
  - series: builderd_notification_queue_capacity{job="builderd",instance="b",queue="build"}
    values: 64x40
  - series: builderd_notification_queue_workers{job="builderd",instance="b",queue="build"}
    values: 2x40
  - series: builderd_notification_queue_enabled{job="builderd",instance="b",queue="build"}
    values: 1x40
  - series: builderd_notification_queue_oldest_enqueued_timestamp_seconds{job="builderd",instance="b",queue="build"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="build",outcome="accepted"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="build",outcome="coalesced"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="build",outcome="full"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="build",outcome="stopping"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="build",outcome="invalid"}
    values: '0x40'
  - series: builderd_notification_queue_waiting{job="builderd",instance="b",queue="cancel"}
    values: '0x40'
  - series: builderd_notification_queue_active{job="builderd",instance="b",queue="cancel"}
    values: '0x40'
  - series: builderd_notification_queue_capacity{job="builderd",instance="b",queue="cancel"}
    values: 64x40
  - series: builderd_notification_queue_workers{job="builderd",instance="b",queue="cancel"}
    values: 2x40
  - series: builderd_notification_queue_enabled{job="builderd",instance="b",queue="cancel"}
    values: 1x40
  - series: builderd_notification_queue_oldest_enqueued_timestamp_seconds{job="builderd",instance="b",queue="cancel"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="cancel",outcome="accepted"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="cancel",outcome="coalesced"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="cancel",outcome="full"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="cancel",outcome="stopping"}
    values: '0x40'
  - series: builderd_notification_queue_enqueues_total{job="builderd",instance="b",queue="cancel",outcome="invalid"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasBuilderNotificationTelemetryUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuilderNotificationDropsHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuilderNotificationWaitHigh
    exp_alerts: []
  promql_expr_test:
  - expr: builderd_notification_queue_oldest_wait_seconds{instance="b",queue="build"}
    eval_time: 20m
    exp_samples:
    - labels: builderd_notification_queue_oldest_wait_seconds{job="builderd",instance="b",queue="build"}
      value: 0
  - expr: builderd_notification_queue_oldest_wait_seconds{instance="b",queue="cancel"}
    eval_time: 20m
    exp_samples:
    - labels: builderd_notification_queue_oldest_wait_seconds{job="builderd",instance="b",queue="cancel"}
      value: 0
