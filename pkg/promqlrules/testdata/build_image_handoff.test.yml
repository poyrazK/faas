  - *id021
  - *id022
  - *id023
  - *id024
  - *id025
  - *id026
  - *id027
  - *id028
  - *id029
  alert_rule_test:
  - eval_time: 11m
    alertname: FaasBuildImageHandoffWaiting
    exp_alerts: []
  - eval_time: 12m
    alertname: FaasBuildImageHandoffWaiting
    exp_alerts:
    - exp_labels:
        severity: warn
        component: imaged
        family: build_image_handoff
        public_status: internal
        job: imaged
        instance: i
      exp_annotations:
        summary: Successful builds are waiting for image preparation
        description: The oldest eligible succeeded build in this imaged recovery scope has waited more than five
          minutes since build completion, sustained for five minutes. Checkpointed active or resumable preparations
          are excluded. This measures unconsumed handoff delay, including backlog behind legitimate synchronous
          work; it does not establish a stalled daemon or deployment readiness failure.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildImageHandoff.md
  - eval_time: 20m
    alertname: FaasBuildImageHandoffTelemetryUnavailable
    exp_alerts: []
  promql_expr_test:
  - expr: imaged_build_handoff_oldest_wait_seconds{job="imaged",instance="i"}
    eval_time: 6m
    exp_samples:
    - labels: imaged_build_handoff_oldest_wait_seconds{job="imaged",instance="i"}
      value: 300
  - expr: imaged_build_handoff_oldest_wait_seconds{job="imaged",instance="i"}
    eval_time: 10m
    exp_samples:
    - labels: imaged_build_handoff_oldest_wait_seconds{job="imaged",instance="i"}
      value: 540
