# Untouched successful-build handoffs; shared anchors repeat healthy initialized diagnostics.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: known empty recovery scope is zero
  interval: 1m
  input_series:
  - &id001
    series: up{job="imaged",instance="i"}
    values: 1x60
  - &id030
    series: imaged_build_handoff_pending{job="imaged",instance="i"}
    values: '0x60'
  - &id031
    series: imaged_build_handoff_oldest_finished_timestamp_seconds{job="imaged",instance="i"}
    values: '0x60'
  - &id002
    series: imaged_build_handoff_collection_success{job="imaged",instance="i"}
    values: 1x60
  - &id003
    series: imaged_build_handoff_collection_last_success_timestamp_seconds{job="imaged",instance="i"}
    values: 0+60x60
  - &id004
    series: imaged_build_handoff_recovery_enabled{job="imaged",instance="i"}
    values: 1x60
  - &id005
    series: imaged_build_handoff_recovery_inflight{job="imaged",instance="i"}
    values: '0x60'
  - &id006
    series: imaged_build_handoff_recovery_last_attempt_timestamp_seconds{job="imaged",instance="i"}
    values: 0+60x60
  - &id007
    series: imaged_build_handoff_recovery_last_completed_timestamp_seconds{job="imaged",instance="i"}
    values: 0+60x60
  - &id008
    series: imaged_build_handoff_recovery_queries_total{job="imaged",instance="i",source="resume",outcome="success"}
    values: '0x60'
  - &id009
    series: imaged_build_handoff_recovery_queries_total{job="imaged",instance="i",source="resume",outcome="error"}
    values: '0x60'
  - &id010
    series: imaged_build_handoff_recovery_queries_total{job="imaged",instance="i",source="resume",outcome="canceled"}
    values: '0x60'
  - &id011
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="resume",outcome="returned"}
    values: '0x60'
  - &id012
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="resume",outcome="retryable"}
    values: '0x60'
  - &id013
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="resume",outcome="deferred"}
    values: '0x60'
  - &id014
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="resume",outcome="not_owned"}
    values: '0x60'
  - &id015
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="resume",outcome="error"}
    values: '0x60'
  - &id016
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="resume",outcome="canceled"}
    values: '0x60'
  - &id017
    series: imaged_build_handoff_recovery_queries_total{job="imaged",instance="i",source="awaiting",outcome="success"}
    values: '0x60'
  - &id018
    series: imaged_build_handoff_recovery_queries_total{job="imaged",instance="i",source="awaiting",outcome="error"}
    values: '0x60'
  - &id019
    series: imaged_build_handoff_recovery_queries_total{job="imaged",instance="i",source="awaiting",outcome="canceled"}
    values: '0x60'
  - &id020
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="awaiting",outcome="returned"}
    values: '0x60'
  - &id021
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="awaiting",outcome="retryable"}
    values: '0x60'
  - &id022
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="awaiting",outcome="deferred"}
    values: '0x60'
  - &id023
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="awaiting",outcome="not_owned"}
    values: '0x60'
  - &id024
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="awaiting",outcome="error"}
    values: '0x60'
  - &id025
    series: imaged_build_handoff_recovery_work_total{job="imaged",instance="i",source="awaiting",outcome="canceled"}
    values: '0x60'
  - &id026
    series: imaged_image_preparation_commits_total{job="imaged",instance="i",transition="claimed"}
    values: '0x60'
  - &id027
    series: imaged_image_preparation_commits_total{job="imaged",instance="i",transition="layer_published"}
    values: '0x60'
  - &id028
    series: imaged_image_preparation_commits_total{job="imaged",instance="i",transition="scan_complete"}
    values: '0x60'
  - &id029
    series: imaged_image_preparation_commits_total{job="imaged",instance="i",transition="handed_off"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasBuildImageHandoffTelemetryUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuildImageHandoffWaiting
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasImageHandoffRecoveryQueriesFailing
    exp_alerts: []
  promql_expr_test:
  - expr: imaged_build_handoff_oldest_wait_seconds{job="imaged",instance="i"}
    eval_time: 20m
    exp_samples:
    - labels: imaged_build_handoff_oldest_wait_seconds{job="imaged",instance="i"}
      value: 0
  - expr: imaged_build_handoff_observation_healthy{job="imaged",instance="i"}
    eval_time: 20m
    exp_samples:
    - labels: imaged_build_handoff_observation_healthy{job="imaged",instance="i"}
      value: 1
- name: one waiting build grows in age without fresh arrivals
  interval: 1m
  input_series:
  - *id001
  - &id032
    series: imaged_build_handoff_pending{job="imaged",instance="i"}
    values: 1x60
  - &id033
    series: imaged_build_handoff_oldest_finished_timestamp_seconds{job="imaged",instance="i"}
    values: 60x60
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
  - *id016
  - *id017
