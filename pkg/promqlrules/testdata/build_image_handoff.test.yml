        description: Errors exceed 10% of non-canceled resume recovery list calls, with at least three errors in
          each rolling five-minute window, sustained for five minutes. The independent observation reader does not
          establish that recovery queries work. Busy leases, claim fences and customer image failures are separate
          handler outcomes and do not trigger this warning.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildImageHandoff.md
