# Synthetic rule-engine tests for per-edge service dependency error alerting.
# The fixture uses only the production counters; no gateway or database is
# required. It pins both the traffic and error-count floors as well as the
# sustained alert duration.

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: "sustained dependency errors above threshold fire for the edge"
    input_series:
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-1",target_app="target-1",outcome="error"}'
        values: '0+1x80'
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-1",target_app="target-1",outcome="success"}'
        values: '0+3x80'
      - series: 'gateway_service_dependency_duration_seconds_bucket{caller_app="caller-1",target_app="target-1",outcome="success",le="0.1"}'
        values: '0+19x80'
      - series: 'gateway_service_dependency_duration_seconds_bucket{caller_app="caller-1",target_app="target-1",outcome="success",le="+Inf"}'
        values: '0+20x80'
    promql_expr_test:
      - expr: 'topk(10, (sum by (caller_app,target_app) (increase(gateway_service_dependency_edge_calls_total{outcome="error"}[10m])) / clamp_min(sum by (caller_app,target_app) (increase(gateway_service_dependency_edge_calls_total[10m])),1)) and on (caller_app,target_app) (sum by (caller_app,target_app) (increase(gateway_service_dependency_edge_calls_total[10m])) >= 20) and on (caller_app,target_app) (sum by (caller_app,target_app) (increase(gateway_service_dependency_edge_calls_total{outcome="error"}[10m])) >= 5))'
        eval_time: 20m
        exp_samples:
          - labels: '{caller_app="caller-1", target_app="target-1"}'
            value: 0.25
      - expr: 'topk(10, sum by (caller_app,target_app) (increase(gateway_service_dependency_edge_calls_total[10m])))'
        eval_time: 20m
        exp_samples:
          - labels: '{caller_app="caller-1", target_app="target-1"}'
            value: 80
      - expr: 'topk(10, histogram_quantile(0.95, sum by (le,caller_app,target_app) (rate(gateway_service_dependency_duration_seconds_bucket[10m]))))'
        eval_time: 20m
        exp_samples:
          - labels: '{caller_app="caller-1", target_app="target-1"}'
            value: 0.1
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasServiceDependencyErrorsHigh
        exp_alerts:
          - exp_labels:
              severity: warn
              component: gatewayd-internal
              family: service_dependency
              caller_app: caller-1
              target_app: target-1
            exp_annotations:
              summary: "Service dependency errors are high from caller-1 to target-1"
              description: "This trusted caller-to-target edge has exceeded a 10% final error rate with at least five errors across twenty calls in the last ten minutes for five minutes. The alert labels contain app UUIDs; use the runbook to identify the apps and inspect the edge."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasServiceDependencyErrorsHigh.md"

  - interval: 30s
    name: "low-volume failing edge stays quiet"
    input_series:
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-sparse",target_app="target-down",outcome="error"}'
        values: '0+0.2x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasServiceDependencyErrorsHigh

  - interval: 30s
    name: "enough traffic but fewer than five errors stays quiet"
    input_series:
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-low-error-count",target_app="target-steady",outcome="error"}'
        values: '0+0.2x80'
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-low-error-count",target_app="target-steady",outcome="success"}'
        values: '0+0.8x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasServiceDependencyErrorsHigh

  - interval: 30s
    name: "error rate at or below ten percent stays quiet"
    input_series:
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-healthy",target_app="target-steady",outcome="error"}'
        values: '0+1x80'
      - series: 'gateway_service_dependency_edge_calls_total{caller_app="caller-healthy",target_app="target-steady",outcome="success"}'
        values: '0+9x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasServiceDependencyErrorsHigh
