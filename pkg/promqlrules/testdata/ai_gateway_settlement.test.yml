# adr: 998 — the AI gateway settlement page fires while usage recording
# keeps failing and stays quiet when settlements succeed.
rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - name: failing settlements page after 10 minutes
    interval: 30s
    input_series:
      - series: 'outbound_ai_usage_record_events_total{event="state_error"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: FaasAIGatewaySettlementFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: FaasAIGatewaySettlementFailing
        exp_alerts:
          - exp_labels:
              severity: page
              component: outboundd
              family: ai_gateway
            exp_annotations:
              summary: "AI gateway usage is not being settled"
              description: "outboundd has failed to record AI usage for 10m. Calls still succeed, but token and cost caps, usage reports and alerts under-count until settlement recovers. Check Postgres for outboundd; close the AI gateway if it does not recover."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasAIGateway.md"

  - name: recorded settlements and a flat error counter stay quiet
    interval: 30s
    input_series:
      - series: 'outbound_ai_usage_record_events_total{event="recorded"}'
        values: '0+5x60'
      - series: 'outbound_ai_usage_record_events_total{event="unavailable"}'
        values: '3x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasAIGatewaySettlementFailing
        exp_alerts: []
