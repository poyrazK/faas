rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 1m

tests:
  - name: "zero last-success timestamp pages for stalled retention"
    interval: 1m
    input_series:
      - series: schedd_compute_heartbeat_retention_last_success_timestamp_seconds
        values: '0x31'
    alert_rule_test:
      - eval_time: 30m
        alertname: FaasComputeHeartbeatRetentionStalled
        exp_alerts:
          - exp_labels:
              severity: page
              component: schedd
              family: compute_heartbeat_retention
              public_status: internal
            exp_annotations:
              summary: "Raw compute-heartbeat retention has stalled"
              description: "Schedd has not completed the bounded heartbeat rollup and retention pass for more than two hours. Raw compute_node_heartbeats storage is unbounded until this is repaired."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeHeartbeatRetentionStalled.md"

  - name: "old raw rows warn after the cleanup tolerance"
    interval: 1m
    input_series:
      - series: schedd_compute_heartbeat_retention_last_success_timestamp_seconds
        values: '172800+60x61'
      - series: schedd_compute_heartbeat_retention_oldest_raw_age_seconds
        values: '700000x61'
    alert_rule_test:
      - eval_time: 60m
        alertname: FaasComputeHeartbeatRetentionBacklog
        exp_alerts:
          - exp_labels:
              severity: warn
              component: schedd
              family: compute_heartbeat_retention
              public_status: internal
            exp_annotations:
              summary: "Raw compute-heartbeat backlog exceeds the seven-day policy"
              description: "The oldest raw compute heartbeat is more than eight days old, so bounded cleanup is not catching up within its one-day tolerance. Hourly rollups remain the long-term capacity record."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasComputeHeartbeatRetentionStalled.md"
