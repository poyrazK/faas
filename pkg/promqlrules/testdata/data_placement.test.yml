# Synthetic time-series fixture for ADR-098 §9.A meterd
# data-upstream alerts (issue #NNN, ADR-098 row §D4).
#
# What this exercises:
#   1. FaasUpstreamRttDegraded — the page alert. It must fire
#      when p95 RTT (from meterd_data_upstream_rtt_ms_bucket)
#      exceeds 200ms for 10m on a (kind, region) pair, and must
#      NOT fire on a sub-200ms pair.
#   2. FaasUpstreamRttHealthy — the info alert. It must fire
#      when p95 RTT stays below 5ms for 10m, and must NOT fire
#      on a pair above 5ms.
#   3. The label contract — alerts carry (kind, region) labels
#      only. A regression that adds a host_redacted_hash label
#      (or worse, a plaintext host label) would trip the §11
#      secret rule and surface here (assertion expects ONLY
#     those two labels, with the meterd/component family
#     metadata).
#
# Why this is the canonical synthetic-fixture test:
# TestFaasRulesSyntax validates the rule file's syntax via
# `promtool check rules` (parse-only); this test feeds real
# samples through the alert evaluator and asserts the alert
# opens at the configured threshold. No meterd instance
# required — pure rule-engine evaluation.
#
# Synthetic-fixture mechanics (load-bearing — read before
# editing): the alert expression is
#   histogram_quantile(0.95, sum by (le, kind, region) (rate(meterd_data_upstream_rtt_ms_bucket[10m])))
# `rate()` over a 10m window requires the bucket counts to
# be MONOTONICALLY INCREASING across samples. With a constant
# bucket count, `rate() = 0` and `histogram_quantile` is
# undefined (no samples in the [10m] range). The fixture
# series shape below is `0+1x50` — start at 0, increment by
# 1 sample every 30s, for 50 samples (25m total). This
# establishes a constant rate of 1 sample / 30s.
#
# Bucket boundaries MUST match the emitting histogram
# (wire/metrics.go:2324 area). The meterd emits
# `meterd_data_upstream_rtt_ms` (note: `_ms` suffix) with
# buckets {1, 5, 10, 50, 100, 500, 1000, 3000} ms. The
# fixture series below use those exact boundaries.

rule_files:
  - ../data_placement.yaml

evaluation_interval: 30s

tests:
  # ──────────────────────────────────────────────────────────────
  # Test 1 — degraded region (p95 = ~500ms) for 25m →
  # FaasUpstreamRttDegraded fires.
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "postgres in us-east p95 RTT ~500ms for 25m → FaasUpstreamRttDegraded fires"
    input_series:
      # All samples land in the 500..1000ms bucket (p95 = 500ms
      # in the bucket-boundary sense — see fixture mechanics).
      # Below 500ms buckets stay constant at 0.
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="1"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="5"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="10"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="50"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="100"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="500"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="1000"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="3000"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="us-east",le="+Inf"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamRttDegraded
        exp_alerts:
          - exp_labels:
              severity: page
              component: meterd
              family: data_placement
              kind: postgres
              region: us-east
            exp_annotations:
              summary: "Data-placement p95 RTT > 200ms for postgres/us-east"
              description: "Connection-aware probe loop reports sustained p95 RTT > 200ms for postgres upstreams in us-east (10m window). Customer wakes are landing on a region with degraded connectivity — the chooser bias (C6) preserves the legacy fallthrough on stale scores so customer apps continue to wake, but the page signals a network condition worth investigating. Cross-reference with the recent deploy log; an outbound firewall change or inter-region route flap is the canonical cause."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamRttDegraded.md"

  # ──────────────────────────────────────────────────────────────
  # Test 2 — healthy region (p95 ≈ 2ms) for 25m →
  # FaasUpstreamRttHealthy fires (info).
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "postgres in eu-fra p95 RTT ~2ms for 25m → FaasUpstreamRttHealthy fires"
    input_series:
      # All samples land in the 1..5ms bucket (p95 = 1ms..5ms).
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="1"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="5"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="10"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="50"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="100"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="500"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="1000"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="3000"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="eu-fra",le="+Inf"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamRttHealthy
        exp_alerts:
          - exp_labels:
              severity: info
              component: meterd
              family: data_placement
              kind: postgres
              region: eu-fra
            exp_annotations:
              summary: "Data-placement p95 RTT < 5ms for postgres/eu-fra"
              description: "The chooser bias for postgres upstreams in eu-fra is observing p95 RTT < 5ms for 10m — the connection-aware placement is operating within the spec's healthy envelope. This is informational; no action required."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamRttDegraded.md"

  # ──────────────────────────────────────────────────────────────
  # Test 3 — negative case: degraded pair fires the page but
  # NOT the info alert (mutually exclusive on the same pair).
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "ap-tokyo p95 ~500ms for 25m → healthy does NOT fire"
    input_series:
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="1"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="5"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="10"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="50"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="100"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="500"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="1000"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="3000"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_rtt_ms_bucket{kind="postgres",region="ap-tokyo",le="+Inf"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamRttHealthy
        # No exp_alerts → info MUST NOT fire when degraded.

  # ──────────────────────────────────────────────────────────────
  # Test 4 — failure-rate positive: timeout probes match ok probes
  # over 25m → ratio ≈ 1.0 → FaasUpstreamProbeHighFailureRate fires.
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "probe timeout rate ≈ ok rate → FaasUpstreamProbeHighFailureRate fires"
    input_series:
      # Both series rise 1 sample / 30s — rate is identical, ratio is 1.0
      # which is > 0.05 (spec §12 threshold).
      - series: 'meterd_data_upstream_probes_total{outcome="timeout"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_probes_total{outcome="ok"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamProbeHighFailureRate
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: data_placement
            exp_annotations:
              summary: "Data-placement probe failure rate > 5% for 10m"
              description: "ratio of timeout/refused probes to ok probes exceeded 5% for 10m. ADR-098 §11 keeps cert validation non-bypassable, so a sustained bump is most often a network/firewall change, not a TLS regression. Cross-reference FaasUpstreamRttDegraded alerts for the same window."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamRttDegraded.md"

  # ──────────────────────────────────────────────────────────────
  # Test 5 — failure-rate negative: zero timeouts, ok probes
  # rising → ratio = 0 → high-failure-rate MUST NOT fire.
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "zero timeouts, ok rising → FaasUpstreamProbeHighFailureRate MUST NOT fire"
    input_series:
      - series: 'meterd_data_upstream_probes_total{outcome="timeout"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probes_total{outcome="refused"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probes_total{outcome="ok"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamProbeHighFailureRate
        # No exp_alerts → ratio = 0, well below the 5% threshold.

  # ──────────────────────────────────────────────────────────────
  # Test 6 — probe slow positive: all wall-clock samples land in
  # the ≥1s bucket for 25m → p95 > 1s → FaasUpstreamProbeSlow fires.
  # Bucket boundaries MUST match the emitter at
  # pkg/wire/metrics.go:2351: {0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1, 3}.
  # The metric has no labels — it's a Histogram, not HistogramVec —
  # so the alert cannot fan out per (kind, region). See the rules
  # file's annotation on FaasUpstreamProbeSlow.
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "probe wall-clock ~3s for 25m → FaasUpstreamProbeSlow fires"
    input_series:
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="0.001"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="0.005"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="0.01"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="0.05"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="0.1"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="0.5"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="1"}'
        values: '0+0x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="3"}'
        values: '0+1x50'
      - series: 'meterd_data_upstream_probe_duration_seconds_bucket{le="+Inf"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamProbeSlow
        exp_alerts:
          - exp_labels:
              severity: warn
              component: meterd
              family: data_placement
            exp_annotations:
              summary: "Data-placement probe p95 wall-clock > 1s for 10m"
              description: "Aggregate per-probe wall-clock (TCP+TLS handshake) exceeded 1s p95 for 10m. GLOBAL signal — `meterd_data_upstream_probe_duration_seconds` is an unlabelled Histogram (pkg/wire/metrics.go:2349-2353), so the alert does not distinguish which region or kind is degraded. Cross-reference the per-(kind, region) `FaasUpstreamRttDegraded` alerts for the same window to localize; if those are quiet, the slowness is not connectivity-bound. The handshake payload is bounded by the customer's CA chain, not our control — a slow probe is overwhelmingly a network condition, not a customer cert issue. If the ratio of tls_handshake outcomes also rises, treat it as a TLS regression and escalate."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamRttDegraded.md"

  # ──────────────────────────────────────────────────────────────────
  # issue #955 — closes the gap left by
  # FaasUpstreamProbeHighFailureRate (5% over 10m, timeout/refused
  # subvocab). Two new alerts across the FULL outcome vocabulary:
  #   - FaasUpstreamProbeOutcomeDegraded (page, 50% non-ok over 5m)
  #   - FaasUpstreamProbeOutcomeSilent (info, 0 ok over 30m)
  #
  # Synthetic-fixture mechanics: outcome is a closed vocab
  # {ok, timeout, refused, tls_handshake, dns, unreachable}
  # (ADR-098 §9.A). The metric has NO host_redacted_hash label
  # (§11 invariant — only the rtt histogram carries host identity).
  # Outcome is the ONLY label; firing multiplies across that label
  # set (Prometheus's `sum without (outcome)` aggregator).
  # ──────────────────────────────────────────────────────────────────
  - interval: 30s
    name: "60% non-ok probes for 6m → FaasUpstreamProbeOutcomeDegraded fires"
    input_series:
      # 30 ok + 60 timeout per 30s step over 50 steps (25m).
      # ratio = 60 / 90 = 0.667 > 0.5 → fires after `for: 5m`.
      - series: 'meterd_data_upstream_probes_total{outcome="ok"}'
        values: '0+30x51'
      - series: 'meterd_data_upstream_probes_total{outcome="timeout"}'
        values: '0+60x51'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamProbeOutcomeDegraded
        exp_alerts:
          - exp_labels:
              severity: page
              component: meterd
              family: probe_outcome
            exp_annotations:
              summary: "Data-placement probe non-ok ratio > 50 % for 5m"
              description: "More than 50 % of the data-placement probe loop's outcomes are non-ok for 5m — across all outcome values (timeout, refused, tls_handshake, dns, unreachable). The chooser bias is losing signal; the legacy fallthrough may be sending customer traffic to a degraded upstream. Cross-reference FaasUpstreamProbeHighFailureRate for the timeout/refused subvocab only, and FaasUpstreamRttDegraded for the per-(kind, region) localization."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamProbeOutcomeDegraded.md"

  - interval: 30s
    name: "ok rate 0 for 30m → FaasUpstreamProbeOutcomeSilent fires (fleet-wide)"
    input_series:
      # The counter is fleet-wide — only `outcome` is a label
      # (pkg/wire/metrics.go:2554). ok=0 means the probe loop
      # has stopped producing successful outcomes for 30m. Other
      # outcomes keep rising so the poller is alive — distinguishes
      # Path A (poller alive, all probes fail) from Path B (poller
      # stalled — would have all outcomes at 0).
      - series: 'meterd_data_upstream_probes_total{outcome="ok"}'
        # 128 samples × 30s = 64m — long enough for the [30m]
        # rate window to fill by eval_time=30m AND for the alert's
        # `for: 30m` clause to be satisfied (expr must be true for
        # the entire 30m window before eval_time).
        values: '0x80'
      - series: 'meterd_data_upstream_probes_total{outcome="timeout"}'
        # Poller alive — non-ok probes still landing.
        values: '0+3x80'
      - series: 'meterd_data_upstream_probes_total{outcome="refused"}'
        values: '0+2x80'
    alert_rule_test:
      - eval_time: 60m
        alertname: FaasUpstreamProbeOutcomeSilent
        exp_alerts:
          - exp_labels:
              severity: info
              component: meterd
              family: probe_outcome
              outcome: ok
            exp_annotations:
              summary: "Data-placement probe loop silent for 30m"
              description: "Zero ok-probes landed over 30m. The probe loop has gone silent — typically a stalled meterd poller, a missing upstream manifest, or a complete outbound network partition. Per-(kind, region) localization is not possible here because the counter is fleet-wide (the canonical cardinality-bounded shape — pkg/wire/metrics.go:2554). To localize, cross-reference `FaasUpstreamRttDegraded` for the per-(kind, region) connectivity view (the histogram carries the labels the counter doesn't). This is informational (severity info) until the silent condition chains with `FaasUpstreamRttDegraded`; at that point the degradation is connectivity-bound rather than poller-bound. Runbook at docs/runbooks/FaasUpstreamProbeOutcomeSilent.md."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamProbeOutcomeSilent.md"

  # ──────────────────────────────────────────────────────────────────
  # issue #957 — classifier failures are partial-success env writes,
  # so the alert must fire only when the apid counter keeps moving.
  # The reason label is a closed set; this fixture exercises the
  # salt_missing path and asserts the page metadata.
  # ──────────────────────────────────────────────────────────────────
  - interval: 30s
    name: "classifier failures sustained for 25m → FaasUpstreamClassifierFailure fires"
    input_series:
      - series: 'apid_data_upstream_classifier_failures_total{reason="salt_missing"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamClassifierFailure
        exp_alerts:
          - exp_labels:
              severity: page
              component: apid
              family: data_placement
              reason: salt_missing
            exp_annotations:
              summary: "Data-placement env classifier failures sustained for 10m (reason=salt_missing)"
              description: "apid is failing to derive data_upstreams hints after environment mutations. Customer env writes still return success, but connection-aware placement may use its legacy fallback. Inspect the data_upstream.classifier_failed audit events and remediate the reason-specific host configuration or apid/Postgres failure."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasUpstreamClassifierFailure.md"

  - interval: 30s
    name: "no classifier failures → FaasUpstreamClassifierFailure stays quiet"
    input_series:
      - series: 'apid_data_upstream_classifier_failures_total{reason="salt_missing"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: FaasUpstreamClassifierFailure
        # No exp_alerts → zero failure rate must not page.
