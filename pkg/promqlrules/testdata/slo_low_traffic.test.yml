# Low-volume SLO ratios must remain ratios. Clamping a per-second rate
# denominator to 1 makes fully successful traffic below 1 rps appear to have
# less than 100% availability or build success.

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: "successful low-volume API traffic does not page"
    input_series:
      - series: 'gateway_requests_total{code="200",app="low-volume"}'
        values: '0+1x50'
    promql_expr_test:
      - expr: 'sum(rate(gateway_requests_total{code=~"2.."}[5m])) / sum(rate(gateway_requests_total[5m]))'
        eval_time: 15m
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasApiAvailabilityLow

  - interval: 30s
    name: "failed low-volume API traffic still pages"
    input_series:
      - series: 'gateway_requests_total{code="200",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="500",app="low-volume"}'
        values: '0+3x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasApiAvailabilityLow
        exp_alerts:
          - exp_labels:
              severity: page
              component: gatewayd-internal
              family: api_availability
            exp_annotations:
              summary: "API availability < 99.5% (rolling 5m)"
              description: "The 2xx ratio over the last 5 minutes has been below the §12 public SLO (99.5%) for 10m. This is rolling, not monthly — the alert is intentionally more sensitive than the customer-facing SLO. Status page /status/slo.json shows the same metric."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiAvailabilityLow.md"

  - interval: 30s
    name: "successful low-volume builds do not warn"
    input_series:
      - series: 'builderd_ops_total{op="build",code="ok"}'
        values: '0+1x60'
    promql_expr_test:
      - expr: 'sum(rate(builderd_ops_total{op="build",code=~"ok|cache_hit"}[5m])) / sum(rate(builderd_ops_total{op="build",code!="user_error"}[5m]))'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasBuildSuccessLow
