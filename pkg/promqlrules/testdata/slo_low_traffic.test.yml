# Low-volume SLO ratios must remain ratios. Clamping a per-second rate
# denominator to 1 makes fully successful traffic below 1 rps appear to have
# less than 100% availability or build success.

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - name: "idle public status expressions remain finite"
    promql_expr_test:
      - expr: '(((sum(rate(gateway_requests_total{app!="-",code=~"2.."}[5m])) or vector(0)) / sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m])) * 100) and sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m])) > 0) or vector(100)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 100
      - expr: '((histogram_quantile(0.95, sum(rate(gateway_wake_latency_seconds_bucket[5m])) by (le)) * 1000) and sum(rate(gateway_wake_latency_seconds_count[5m])) > 0) or vector(0)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: '((sum(rate(builderd_ops_total{op="build",code=~"ok|cache_hit"}[5m])) / sum(rate(builderd_ops_total{op="build",code!="user_error"}[5m])) * 100) and sum(rate(builderd_ops_total{op="build",code!="user_error"}[5m])) > 0) or vector(0)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0

  - interval: 30s
    name: "client and entitlement errors do not degrade successful low-volume API traffic"
    input_series:
      - series: 'gateway_requests_total{code="200",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="400",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="401",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="402",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="404",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="409",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="429",app="low-volume"}'
        values: '0+1x50'
    promql_expr_test:
      - expr: '(sum(rate(gateway_requests_total{app!="-",code=~"2.."}[5m])) or vector(0)) / sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m]))'
        eval_time: 15m
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasApiAvailabilityLow
      - eval_time: 15m
        alertname: FaasApiAvailabilityBurnRateHigh
      - eval_time: 15m
        alertname: FaasSLOBurnRateHigh

  - interval: 30s
    name: "500 502 503 and 504 traffic consumes availability"
    input_series:
      - series: 'gateway_requests_total{code="200",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="500",app="low-volume"}'
        values: '0+3x50'
      - series: 'gateway_requests_total{code="502",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="503",app="low-volume"}'
        values: '0+1x50'
      - series: 'gateway_requests_total{code="504",app="low-volume"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasApiAvailabilityLow
        exp_alerts:
          - exp_labels:
              severity: page
              component: gatewayd-internal
              family: api_availability
            exp_annotations:
              summary: "API availability < 99.5% (rolling 5m)"
              description: "The 2xx ratio over the last 5 minutes has been below the §12 public SLO (99.5%) for 10m. This is rolling, not monthly — the alert is intentionally more sensitive than the customer-facing SLO. Status page /status/slo.json shows the same metric."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiAvailabilityLow.md"

  - interval: 30s
    name: "all-5xx traffic is unavailable rather than idle"
    input_series:
      - series: 'gateway_requests_total{code="500",app="failed-only"}'
        values: '0+1x70'
    promql_expr_test:
      - expr: '(((sum(rate(gateway_requests_total{app!="-",code=~"2.."}[5m])) or vector(0)) / sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m])) * 100) and sum(rate(gateway_requests_total{app!="-",code=~"2..|5.."}[5m])) > 0) or vector(100)'
        eval_time: 15m
        exp_samples:
          - labels: '{}'
            value: 0
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasApiAvailabilityLow
        exp_alerts:
          - exp_labels:
              severity: page
              component: gatewayd-internal
              family: api_availability
            exp_annotations:
              summary: "API availability < 99.5% (rolling 5m)"
              description: "The 2xx ratio over the last 5 minutes has been below the §12 public SLO (99.5%) for 10m. This is rolling, not monthly — the alert is intentionally more sensitive than the customer-facing SLO. Status page /status/slo.json shows the same metric."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiAvailabilityLow.md"
      - eval_time: 15m
        alertname: FaasApiAvailabilityBurnRateHigh
        exp_alerts:
          - exp_labels:
              severity: page
              component: gatewayd-internal
              family: api_availability
            exp_annotations:
              summary: "API availability is consuming its monthly error budget rapidly"
              description: "The API error rate exceeded both the 14.4x one-hour and 6x six-hour burn-rate thresholds for the 99.5% monthly availability budget. Investigate the customer-facing failure path and keep the rolling SLO alert in context."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasApiAvailabilityLow.md"
      - eval_time: 25m
        alertname: FaasSLOBurnRateHigh
        exp_alerts:
          - exp_labels:
              severity: warn
              component: gatewayd-internal
              family: alert_preset_signals
              preset: slo_burn_rate
              app: failed-only
            exp_annotations:
              summary: "SLO burn rate is high for app failed-only"
              description: "The app's API error budget exceeded the Google SRE multi-window thresholds: >14.4x over 1h and >6x over 6h of the ADR-082 99.5% availability SLO. gateway_requests_total is app-labelled; use the meterd alert delivery or app dashboard to correlate the app with its customer account."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasSLOBurnRateHigh.md"

  - interval: 30s
    name: "successful low-volume builds do not warn"
    input_series:
      - series: 'builderd_ops_total{op="build",code="ok"}'
        values: '0+1x60'
    promql_expr_test:
      - expr: 'sum(rate(builderd_ops_total{op="build",code=~"ok|cache_hit"}[5m])) / sum(rate(builderd_ops_total{op="build",code!="user_error"}[5m]))'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 20m
        alertname: FaasBuildSuccessLow
