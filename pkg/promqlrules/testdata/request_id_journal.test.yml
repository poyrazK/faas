# Synthetic coverage for the mandatory request-ID journal failure alert.

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: "sustained journal write failures alert"
    input_series:
      - series: 'gateway_request_id_journal_write_total{result="failed"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FaasRequestIDJournalWriteFailures
        exp_alerts:
          - exp_labels:
              severity: warn
              component: gatewayd-internal
              family: request_id_journal
            exp_annotations:
              summary: "Exact request-ID journal writes are failing"
              description: "More than 5% of exact request-ID journal records (and more than 1 per minute) failed to reach apid for 2 minutes. Requests are still served (ADR-634), but their public request IDs may not resolve in the debugger; check the apid private gRPC path and Postgres write health."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasRequestIDJournalWriteFailures.md"

  - interval: 30s
    name: "no journal failures do not alert"
    input_series:
      - series: 'gateway_request_id_journal_write_total{result="failed"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FaasRequestIDJournalWriteFailures
        exp_alerts: []

  # ADR-1521: one failed batch of 128 records among ~20 recorded per second
  # is under 5% of records and must not alert.
  - interval: 30s
    name: "a single failed batch amid healthy traffic does not alert"
    input_series:
      - series: 'gateway_request_id_journal_write_total{result="recorded"}'
        values: '0+600x30'
      - series: 'gateway_request_id_journal_write_total{result="failed"}'
        values: '0x10 128x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: FaasRequestIDJournalWriteFailures
        exp_alerts: []
