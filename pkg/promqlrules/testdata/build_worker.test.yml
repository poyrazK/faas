    values: '0x90'
  - &id026
    series: builderd_build_slot_decisions_total{job="builderd",instance="b",outcome="policy"}
    values: '0x90'
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasBuilderQueueTelemetryUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuilderWorkerStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuilderClaimsFailing
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuilderRequeuesFailing
    exp_alerts: []
  promql_expr_test:
  - expr: builderd_build_worker_progress_age_seconds
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="builderd_build_worker_progress_age_seconds",job="builderd",instance="b"}'
      value: 0
  - expr: builderd_build_worker_progress_allowance_seconds
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="builderd_build_worker_progress_allowance_seconds",job="builderd",instance="b"}'
      value: 120
