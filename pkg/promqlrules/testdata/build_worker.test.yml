    values: '0x90'
  - &id018
    series: builderd_build_requeues_total{job="builderd",instance="b",reason="context_canceled",outcome="error"}
    values: '0x90'
  - &id019
    series: builderd_build_requeues_total{job="builderd",instance="b",reason="context_canceled",outcome="canceled"}
    values: '0x90'
  - &id020
    series: builderd_build_requeues_total{job="builderd",instance="b",reason="lookup_failure",outcome="accepted"}
    values: '0x90'
  - &id021
