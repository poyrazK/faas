    exp_alerts: []
  - eval_time: 8m
    alertname: FaasBuilderWorkerStalled
    exp_alerts: []
  - eval_time: 9m
    alertname: FaasBuilderWorkerStalled
    exp_alerts:
    - exp_labels:
        severity: warn
        component: builderd
        family: build_queue_worker
        public_status: internal
        job: builderd
        instance: b
      exp_annotations: &id028
        summary: Durable build polling has stopped progressing
        description: The expected poller has exceeded its progress allowance for 5m. Idle allowance is two poll
          intervals; an in-flight iteration also receives the effective running-build recovery threshold. Notification
          work cannot renew poller progress. Capture logs and goroutines before intervening.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildWorker.md
