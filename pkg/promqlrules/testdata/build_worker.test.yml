# Authoritative slots, bounded outcomes and separate idle/busy polling allowances.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: healthy idle polls are progress even without any eligible claim
  interval: 1m
  input_series:
  - series: up{job="builderd",instance="b"}
    values: 1x90
  - series: builderd_build_worker_enabled{job="builderd",instance="b"}
    values: 1x90
  - series: builderd_build_worker_inflight{job="builderd",instance="b"}
    values: '0x90'
  - series: builderd_build_worker_started_timestamp_seconds{job="builderd",instance="b"}
    values: 60x90
  - series: builderd_build_worker_last_attempt_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x90
  - series: builderd_build_worker_last_completed_timestamp_seconds{job="builderd",instance="b"}
    values: 0+60x90
  - series: builderd_build_worker_interval_seconds{job="builderd",instance="b"}
    values: 60x90
  - series: builderd_build_worker_busy_allowance_seconds{job="builderd",instance="b"}
    values: 600x90
  - series: builderd_build_slots_in_use{job="builderd",instance="b"}
    values: '0x90'
  - series: builderd_build_slots_limit{job="builderd",instance="b"}
    values: 1x90
  - &id001
    series: builderd_build_claims_total{job="builderd",instance="b",source="poll",outcome="claimed"}
    values: '0x90'
  - series: builderd_build_claims_total{job="builderd",instance="b",source="poll",outcome="not_claimed"}
    values: 0+100x90
  - &id002
    series: builderd_build_claims_total{job="builderd",instance="b",source="poll",outcome="error"}
    values: '0x90'
  - &id003
    series: builderd_build_claims_total{job="builderd",instance="b",source="poll",outcome="canceled"}
    values: '0x90'
  - &id004
    series: builderd_build_claims_total{job="builderd",instance="b",source="notification",outcome="claimed"}
    values: '0x90'
  - &id005
    series: builderd_build_claims_total{job="builderd",instance="b",source="notification",outcome="not_claimed"}
    values: '0x90'
  - &id006
    series: builderd_build_claims_total{job="builderd",instance="b",source="notification",outcome="error"}
    values: '0x90'
  - &id007
    series: builderd_build_claims_total{job="builderd",instance="b",source="notification",outcome="canceled"}
    values: '0x90'
  - &id008
