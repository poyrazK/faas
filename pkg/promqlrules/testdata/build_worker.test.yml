    values: '0x90'
  - &id011
    series: builderd_build_requeues_total{job="builderd",instance="b",reason="no_slot",outcome="canceled"}
    values: '0x90'
  - &id012
    series: builderd_build_requeues_total{job="builderd",instance="b",reason="source_unavailable",outcome="accepted"}
    values: '0x90'
  - &id013
    series: builderd_build_requeues_total{job="builderd",instance="b",reason="source_unavailable",outcome="not_requeued"}
    values: '0x90'
  - &id014
