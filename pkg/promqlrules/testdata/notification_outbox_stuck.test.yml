# FaasNotificationOutboxStuck: a durable notification undelivered for 15 minutes.
rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  - name: a short-lived backlog stays quiet and a stuck row warns once per channel
    interval: 1m
    input_series:
      # Two schedds report the same shared outbox.
      - series: faas_notification_outbox_oldest_undelivered_seconds{job="schedd",instance="cp",channel="runtime_config_restart"}
        values: 0 60 0 0 600+60x15
      - series: faas_notification_outbox_oldest_undelivered_seconds{job="schedd",instance="compute-1",channel="runtime_config_restart"}
        values: 0 60 0 0 600+60x15
      - series: faas_notification_outbox_oldest_undelivered_seconds{job="schedd",instance="cp",channel="app_wake"}
        values: 0x19
    alert_rule_test:
      - eval_time: 3m
        alertname: FaasNotificationOutboxStuck
        exp_alerts: []
      - eval_time: 12m
        alertname: FaasNotificationOutboxStuck
        exp_alerts: []
      - eval_time: 16m
        alertname: FaasNotificationOutboxStuck
        exp_alerts:
          - exp_labels:
              severity: warn
              component: schedd
              family: durable_background_workers
              public_status: internal
              channel: runtime_config_restart
            exp_annotations:
              summary: "A durable notification has been undelivered for over 15 minutes"
              description: "The oldest pending notification_outbox row on channel runtime_config_restart is 22m 0s old. The wake, restart or handoff it carries has not run; for runtime_config_restart a credential rotation or binding change is waiting on it."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasNotificationOutboxStuck.md"
