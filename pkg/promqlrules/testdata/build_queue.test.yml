# Fleet queue snapshots, collection health, hold times, and recovery.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: strict depth threshold and full ten minute hold
  interval: 1m
  input_series:
  - series: faas_build_queue_depth{job="apid",instance="a"}
    values: 80x30
  - series: apid_build_queue_collection_success{job="apid",instance="a"}
    values: 1x30
  - series: apid_build_queue_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x30
  - series: up{job="apid",instance="a"}
    values: 1x30
  - series: faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid",instance="a"}
    values: 1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: FaasBuildQueueDepthHigh
    exp_alerts: []
  - eval_time: 11m
    alertname: FaasBuildQueueDepthHigh
    exp_alerts:
    - exp_labels:
        severity: warn
        component: builderd
        family: build_queue_stuck
        public_status: internal
        job: apid
        instance: a
      exp_annotations:
        summary: builderd build queue > 50 queued builds for 10m
        description: 'The fleet-total queued-builds gauge `faas_build_queue_depth` has exceeded 50 for 10m. With
          builderd limited to one microVM under the 5 GiB parent cgroup, sustained depth > 50 means builds are arriving
          faster than the safe drain rate. Triage: `gregalectl builds list --status=queued` for in-flight builds
          and `/v1/admin/obs/builder-heartbeats` for liveness, then recover per the runbook.'
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md
  - eval_time: 11m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
- name: fresh depth 0 is healthy without backlog
  interval: 1m
  input_series:
  - series: faas_build_queue_depth{job="apid",instance="a"}
    values: '0x30'
  - series: apid_build_queue_collection_success{job="apid",instance="a"}
    values: 1x30
  - series: apid_build_queue_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x30
  - series: up{job="apid",instance="a"}
    values: 1x30
  - series: faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid",instance="a"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 15m
    alertname: FaasBuildQueueDepthHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
- name: fresh depth 50 is healthy without backlog
  interval: 1m
  input_series:
