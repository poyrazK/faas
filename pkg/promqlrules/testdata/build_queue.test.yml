        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md
  - eval_time: 12m
    alertname: FaasBuildQueueDepthHigh
    exp_alerts: []
  - eval_time: 12m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
- name: missing depth cannot look healthy
  interval: 1m
  input_series:
  - series: apid_build_queue_collection_success{job="apid",instance="a"}
    values: 1x30
  - series: apid_build_queue_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x30
  - series: up{job="apid",instance="a"}
    values: 1x30
  alert_rule_test:
  - eval_time: 4m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts:
    - exp_labels:
        severity: warn
        component: apid
        family: build_queue_stuck
        public_status: internal
        job: apid
        instance: a
      exp_annotations:
        summary: Build queue observation unavailable
        description: A scraped apid has no successful, complete build queue observation at most 120 seconds old
          for 5m. Queue depth is unknown, not zero. Inspect apid queue collection and database health; another apid's
          successful fleet snapshot cannot establish this collector's health.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md
  - eval_time: 15m
