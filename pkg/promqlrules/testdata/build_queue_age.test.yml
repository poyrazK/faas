    exp_alerts:
    - exp_labels:
        severity: warn
        component: apid
        family: build_queue_stuck
        public_status: internal
        job: apid
        instance: a
      exp_annotations: &id002
        summary: Build queue observation unavailable
        description: A scraped apid has no successful, complete build queue observation at most 120 seconds old
          for 5m. Queue depth is unknown, not zero. Inspect apid queue collection and database health; another apid's
          successful fleet snapshot cannot establish this collector's health.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md
  - eval_time: 26m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
  - eval_time: 35m
    alertname: FaasBuildQueueOldestWaitHigh
    exp_alerts: []
  - eval_time: 36m
