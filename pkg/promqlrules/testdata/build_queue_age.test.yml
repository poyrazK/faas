# Oldest currently queued work: low depth, real hold times, and recovery.
rule_files:
- ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml
evaluation_interval: 1m
tests:
- name: one waiting build warns without any build start histogram events
  interval: 1m
  input_series:
  - series: faas_build_queue_depth{job="apid",instance="a"}
    values: 1x45
  - series: faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid",instance="a"}
    values: 60x45
  - series: apid_build_queue_collection_success{job="apid",instance="a"}
    values: 1x45
  - series: apid_build_queue_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x45
  - series: up{job="apid",instance="a"}
    values: 1x45
  alert_rule_test:
  - eval_time: 6m
    alertname: FaasBuildQueueOldestWaitHigh
    exp_alerts: []
  - eval_time: 16m
    alertname: FaasBuildQueueOldestWaitHigh
    exp_alerts: []
  - eval_time: 17m
    alertname: FaasBuildQueueOldestWaitHigh
    exp_alerts:
    - exp_labels:
        severity: warn
        component: builderd
        family: build_queue_stuck
        public_status: internal
        job: apid
        instance: a
      exp_annotations: &id001
        summary: Oldest queued build has waited > 5m
        description: A fresh queue observation has contained a build waiting more than 300 seconds for 10m, even
          if only one build is queued. The original enqueue time survives requeue. Inspect builder admission, heartbeats,
          and build state; this observation alone does not prove builder failure.
        runbook_url: https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasBuildQueueBacklog.md
  - eval_time: 17m
    alertname: FaasBuildQueueDepthHigh
    exp_alerts: []
  - eval_time: 17m
    alertname: FaasBuildQueueBacklog
    exp_alerts: []
  - eval_time: 17m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
  promql_expr_test:
  - expr: faas_build_queue_oldest_wait_seconds
    eval_time: 2m
    exp_samples:
    - labels: '{__name__="faas_build_queue_oldest_wait_seconds",job="apid",instance="a"}'
      value: 60
  - expr: faas_build_queue_oldest_wait_seconds
    eval_time: 6m
    exp_samples:
    - labels: '{__name__="faas_build_queue_oldest_wait_seconds",job="apid",instance="a"}'
      value: 300
  - expr: faas_build_queue_oldest_wait_seconds
    eval_time: 7m
    exp_samples:
    - labels: '{__name__="faas_build_queue_oldest_wait_seconds",job="apid",instance="a"}'
      value: 360
  - expr: faas_build_queue_oldest_wait_seconds
    eval_time: 17m
    exp_samples:
    - labels: '{__name__="faas_build_queue_oldest_wait_seconds",job="apid",instance="a"}'
      value: 960
- name: successful empty queue is explicitly zero wait
  interval: 1m
  input_series:
  - series: faas_build_queue_depth{job="apid",instance="a"}
    values: '0x45'
  - series: faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid",instance="a"}
    values: '0x45'
  - series: apid_build_queue_collection_success{job="apid",instance="a"}
    values: 1x45
  - series: apid_build_queue_collection_last_success_timestamp_seconds{job="apid",instance="a"}
    values: 0+60x45
  - series: up{job="apid",instance="a"}
    values: 1x45
  alert_rule_test:
  - eval_time: 20m
    alertname: FaasBuildQueueOldestWaitHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuildQueueDepthHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: FaasBuildQueueTelemetryUnavailable
    exp_alerts: []
  promql_expr_test:
  - expr: faas_build_queue_oldest_wait_seconds
    eval_time: 20m
    exp_samples:
    - labels: '{__name__="faas_build_queue_oldest_wait_seconds",job="apid",instance="a"}'
      value: 0
- name: draining clears age alert immediately on a fresh empty observation
  interval: 1m
  input_series:
  - series: faas_build_queue_depth{job="apid",instance="a"}
    values: 1x17 0x25
  - series: faas_build_queue_oldest_enqueued_timestamp_seconds{job="apid",instance="a"}
