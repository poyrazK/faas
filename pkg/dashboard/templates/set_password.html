<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — onebox faas</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" nonce="{{.Nonce}}" defer></script>
  <style nonce="{{.Nonce}}">
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0 1.5rem; max-width: 920px; margin-inline: auto; }
    .flash { background: #fff8c5; padding: 0.5rem 1rem; border: 1px solid #e2cf6e; margin: 1rem 0; }
    .error { background: #fde7e9; padding: 0.5rem 1rem; border: 1px solid #e0a3aa; margin: 1rem 0; }
    main { padding: 2rem 0; }
    h1 { margin-top: 0; }
    form { display: grid; gap: 0.5rem; max-width: 360px; }
    input, button { padding: 0.5rem 0.7rem; font: inherit; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  {{if .Flash}}
    {{if index .Data "Error"}}<div class="error">{{.Flash}}</div>{{else}}<div class="flash">{{.Flash}}</div>{{end}}
  {{end}}
  <main>
    {{template "email-verification-banner" .}}
    <h1>{{.Title}}</h1>
    <p>Set a password so you can sign in even without Google or GitHub. Minimum 12 characters.</p>
    <form method="POST" action="/dashboard/account/set-password">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" required minlength="12" autocomplete="new-password">
      <button type="submit">Set password</button>
    </form>
    <p><a href="/dashboard/account/">Back to account</a></p>
  </main>
</body>
</html>
